    {"id":"w02491","w":"flexible","pos":["adj"],"ph":"/ˈfleksɪbl/","cefr":"B1","kr":["유연한","융통성 있는"],"ex":[{"en":"A flexible schedule allows workers to manage their time.","ko":"유연한 일정은 직원들이 시간을 관리할 수 있게 해준다."}],"mnemonic":{"soundHint":"플렉시블 → '플렉스(flex) 가능한'","story":"몸을 자유롭게 플렉스할 수 있으면 flexible(유연한).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"adaptable","ko":"적응 가능한","reason":"동의어 — 변화에 유연"},{"w":"rigid","ko":"경직된","reason":"반의어 — 유연함의 반대"},{"w":"schedule","ko":"일정","reason":"콜로 — 유연한 일정"}],"collocBest":[]},"nuance":{"koSimple":"잘 구부러지고 상황에 맞출 수 있는.","whenToUse":"시간·규칙·태도가 유연할 때."},"krDetail":[{"ko":"유연한","explain":"잘 굽어지고 잘 변할 수 있는"},{"ko":"융통성 있는","explain":"상황에 따라 잘 맞춰 바꿀 수 있는"}],"usageExamples":[{"en":"The company offers a flexible schedule for parents with young children at home.","ko":"그 회사는 집에 어린 자녀가 있는 부모들에게 유연한 일정을 제공한다."},{"en":"A flexible approach to problem-solving usually leads to more creative and effective solutions.","ko":"문제 해결에 대한 유연한 접근은 보통 더 창의적이고 효과적인 해결책으로 이어진다."}],"grammarNote":"flexible의 부사형은 flexibly이다. 학생들이 flexible를 부사 자리에 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The manager responded _____ to the sudden changes _____ the project deadline last Friday morning.","ko":"그 매니저는 지난 금요일 아침 프로젝트 마감일의 갑작스러운 변경에 유연하게 대응했다.","answer":["flexibly","in"],"hint":"형용사→부사 변환 + 전치사"}]},
    {"id":"w02730","w":"geography","pos":["n"],"ph":"/dʒiˈɒɡrəfi/","cefr":"B1","kr":["지리학","지형"],"ex":[{"en":"We studied world geography.","ko":"우리는 세계 지리를 공부했다."}],"mnemonic":{"soundHint":"지오그래피 → 'geo(지구) + graphy(기록)'","story":"지구(geo)를 기록(graphy)하는 학문 = 지리학.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"terrain","ko":"지형","reason":"동의어(지형지물)"},{"w":"map","ko":"지도","reason":"시나리오 콜로(지리·지도)"}],"collocBest":[]},"nuance":{"koSimple":"땅과 지역의 특성을 다루는 학문.","whenToUse":"학교 과목·지역 지형 얘기할 때."},"krDetail":[{"ko":"지리학","explain":"땅의 모습과 사람 삶을 다루는 학문"},{"ko":"지형","explain":"산과 강 등 땅의 생김새"}],"usageExamples":[{"en":"She studied geography at a well-known university.","ko":"그녀는 이름 있는 대학교에서 지리학을 공부했다."},{"en":"The geography of the island is very unusual.","ko":"그 섬의 지형은 매우 독특하다."}],"grammarNote":"학문 이름인 geography는 무관사·불가산으로 쓴다(study geography). 학생들은 study the geography처럼 정관사를 붙이는 실수를 한다. '~의 지형'일 때만 the geography of ~를 쓴다.","grammarQuiz":[{"sentence":"He is very interested _____ studying _____ .","ko":"그는 지리학 공부에 매우 관심이 있다.","answer":["in","geography"],"hint":"전치사 + 학문 명사"}]},
    {"id":"w02535","w":"foolish","pos":["adj"],"ph":"/ˈfuːlɪʃ/","cefr":"B1","kr":["어리석은","바보같은"],"ex":[{"en":"It was foolish to spend all the money at once.","ko":"한꺼번에 돈을 다 쓰는 것은 어리석은 일이었다."}],"mnemonic":{"soundHint":"풀리시 → 'fool + ish' = 바보 같은","story":"fool(바보) + ish(스러운) = 어리석은.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stupid","ko":"멍청한","reason":"어리석음 동의어"},{"w":"wise","ko":"현명한","reason":"어리석음의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"판단이 어리석은.","whenToUse":"실수·결정이 지혜롭지 못할 때."},"krDetail":[{"ko":"어리석은","explain":"생각이 짧고 판단이 흐린"},{"ko":"바보같은","explain":"누가 봐도 말이 안 되는 행동을 하는"}],"usageExamples":[{"en":"It was foolish to leave the front door unlocked at night.","ko":"밤에 현관문을 잠그지 않고 두는 것은 어리석은 일이었다."},{"en":"She made a foolish decision to invest all her savings in one company.","ko":"그녀는 모든 저축을 한 회사에 투자하는 어리석은 결정을 내렸다."}],"grammarNote":"foolish는 It is foolish to부정사 또는 It is foolish of 사람 to부정사 구문에서 자주 쓰이며, of + 사람은 사람의 성격을 평가할 때 쓴다.","grammarQuiz":[{"sentence":"It was _____ _____ him to ignore the warning signs on the road.","ko":"그가 도로의 경고 표지판을 무시한 것은 어리석었다.","answer":["foolish","of"],"hint":"형용사 + 전치사"},{"sentence":"Don't make a _____ _____ that you will regret for years.","ko":"몇 년 동안 후회할 어리석은 결정을 내리지 마라.","answer":["foolish","decision"],"hint":"형용사 + 명사"}]},
    {"id":"w02473","w":"flashback","pos":["n"],"ph":"/ˈflæʃbæk/","cefr":"B1","kr":["회상","플래시백"],"ex":[{"en":"The movie begins with a flashback.","ko":"그 영화는 회상 장면으로 시작한다."}],"mnemonic":{"soundHint":"플래시백","story":"'플래시백'은 영화·드라마 회상 장면 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"traumatic","ko":"트라우마의","reason":"콜로 — 트라우마 회상"},{"w":"recollection","ko":"회상","reason":"동의어 — 과거 기억"},{"w":"memory","ko":"기억","reason":"동의어 — 과거를 떠올림"}],"collocBest":[{"en":"dramatic flashback","ko":"극적인 회상"},{"en":"traumatic flashback","ko":"트라우마 회상"}]},"nuance":{"koSimple":"과거 장면이 갑자기 떠오르는 것.","whenToUse":"영화 회상 장면·트라우마 기억에."},"krDetail":[{"ko":"회상","explain":"지난 일을 다시 떠올려 보는 것"},{"ko":"되살아나는 기억","explain":"갑자기 마음속에 떠오르는 지난 일"}],"usageExamples":[{"en":"The film uses dramatic flashbacks to reveal the main character's tragic past.","ko":"그 영화는 주인공의 비극적인 과거를 드러내기 위해 극적인 회상을 사용한다."},{"en":"The soldier had painful flashbacks of the battle for many years after the war.","ko":"그 군인은 전쟁 후 오랫동안 그 전투의 고통스러운 회상을 겪었다."}],"grammarNote":"flashback은 가산명사이다. have flashbacks of + 명사(~에 대한 회상을 겪다) 형태로 자주 쓰인다. 학생들이 have flashback처럼 관사·복수형을 빠뜨린다.","grammarQuiz":[{"sentence":"The war veteran occasionally had _____ flashbacks _____ the terrible events he had experienced decades earlier.","ko":"그 참전 용사는 수십 년 전에 겪었던 끔찍한 사건들의 회상을 이따금씩 겪었다.","answer":["painful","of"],"hint":"복수 가산명사 수식 + 전치사"}]},
    {"id":"w02600","w":"fracture","pos":["n","v"],"ph":"/ˈfræktʃər/","cefr":"B1","kr":["골절","균열"],"ex":[{"en":"She suffered a fracture in her leg.","ko":"그녀는 다리에 골절을 입었다."}],"mnemonic":{"soundHint":"프랙쳐 → 'fract(부수다)' + ure","story":"뼈가 쪼개져(fract) 골절 fracture.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"break","ko":"부서지다","reason":"부러짐 동의어"},{"w":"crack","ko":"금이 가다","reason":"균열 동의어"}],"collocBest":[]},"nuance":{"koSimple":"뼈나 물체가 깨지듯 부러진 것","whenToUse":"의학·물리적 파열을 말할 때"},"krDetail":[{"ko":"골절","explain":"뼈가 부러지거나 금이 간 상태"},{"ko":"균열","explain":"단단한 물건에 갈라진 자국"}],"usageExamples":[{"en":"The doctor fractured his patient's arm during the difficult surgery.","ko":"그 의사는 어려운 수술 중에 환자의 팔을 부러뜨렸다."},{"en":"His leg was fractured in three places during the skiing accident.","ko":"그의 다리는 스키 사고 중에 세 곳이 부러졌다."}],"grammarNote":"fracture는 명사와 동사 모두로 쓰이며, 동사로는 타동사(뼈를 부러뜨리다)와 자동사(부러지다) 둘 다 가능하다.","grammarQuiz":[{"sentence":"The old man _____ his hip after slipping on the icy sidewalk.","ko":"그 노인은 얼음이 낀 인도에서 미끄러진 후 고관절을 부러뜨렸다.","answer":["fractured"],"hint":"과거시제 타동사"},{"sentence":"Her wrist _____ _____ during the intense basketball game yesterday.","ko":"그녀의 손목이 어제 격렬한 농구 경기 중에 부러졌다.","answer":["was","fractured"],"hint":"수동태"}]},
    {"id":"w02702","w":"gather","pos":["v"],"ph":"/ˈɡæðər/","cefr":"B1","kr":["모이다","수집하다"],"ex":[{"en":"People gathered in the square.","ko":"사람들이 광장에 모였다."}],"mnemonic":{"soundHint":"개더 → '개더(개들이 더) 모인다'","story":"개들이 더 많이 모이면 gather(모이다).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collect","ko":"모으다","reason":"동의어(수집하다)"},{"w":"scatter","ko":"흩다","reason":"반의어(모이다 vs 흩어지다)"},{"w":"assemble","ko":"모이다","reason":"동의어(집합하다)"}],"collocBest":[]},"nuance":{"koSimple":"흩어진 것을 한 곳으로 모으다.","whenToUse":"사람·정보·자료가 함께 모일 때."},"krDetail":[{"ko":"모이다","explain":"여럿이 한 자리에 함께 있게 되다"},{"ko":"수집하다","explain":"필요한 것을 골라 모으다"}],"usageExamples":[{"en":"The teacher asked students to gather data for the report.","ko":"선생님은 학생들에게 보고서를 위한 자료를 수집하라고 했다."},{"en":"Enough evidence has been gathered to prove his innocence.","ko":"그의 결백을 증명할 만큼 충분한 증거가 수집되었다."}],"grammarNote":"gather는 자동사(모이다)와 타동사(모으다) 둘 다 가능하다. 자동사일 때는 We gathered in the hall처럼 목적어 없이 쓰고, 타동사일 때 gather + 목적어로 쓴다. 학생들은 gather up something로만 외우는 경향이 있다.","grammarQuiz":[{"sentence":"The reporters _____ _____ around the mayor to ask questions.","ko":"기자들은 시장에게 질문하려고 그의 주위에 모여들었다.","answer":["gathered","around"],"hint":"과거형 + 방향 전치사"}]},
    {"id":"w02622","w":"frequent","pos":["adj"],"ph":"/ˈfriːkwənt/","cefr":"B1","kr":["빈번한","잦은"],"ex":[{"en":"She makes frequent trips to the library.","ko":"그녀는 도서관을 자주 방문한다."}],"mnemonic":{"soundHint":"프리퀀트 → '프리(자주) 퀀트(가다)'","story":"자주 프리하게 방문 = 빈번한.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"regular","ko":"정기적인","reason":"잦음 동의어"},{"w":"rare","ko":"드문","reason":"빈번의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"자주 반복되는 잦은.","whenToUse":"같은 일이 반복될 때."},"krDetail":[{"ko":"빈번한","explain":"짧은 시간 안에 여러 번 일어나는"},{"ko":"잦은","explain":"자주 되풀이되는"}],"usageExamples":[{"en":"He is a frequent visitor to the public library on weekends.","ko":"그는 주말마다 공공 도서관을 자주 방문하는 사람이다."},{"en":"Frequent breaks are recommended during long study sessions for better focus.","ko":"긴 학습 시간 동안 잦은 휴식이 더 나은 집중을 위해 권장된다."}],"grammarNote":"frequent는 명사 앞 한정적 용법(frequent visitor)으로 주로 쓰이며, 반의어는 rare, infrequent이다.","grammarQuiz":[{"sentence":"She became a _____ _____ at this cozy coffee shop nearby.","ko":"그녀는 근처 이 아늑한 커피숍의 단골 방문객이 되었다.","answer":["frequent","visitor"],"hint":"형용사 + 명사"},{"sentence":"_____ exercise and healthy eating _____ good for overall health.","ko":"잦은 운동과 건강한 식습관은 전반적인 건강에 좋다.","answer":["Frequent","are"],"hint":"형용사 + 동사"}]},
    {"id":"w02481","w":"flaw","pos":["n"],"ph":"/flɔː/","cefr":"B1","kr":["결점","흠"],"ex":[{"en":"The plan had a serious flaw.","ko":"그 계획에는 심각한 결점이 있었다."}],"mnemonic":{"soundHint":"플로","story":"'플~ 로!' 흠칫! 발견된 흠 = flaw.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"defect","ko":"결함","reason":"동의어 — 결점 개념"},{"w":"imperfection","ko":"불완전","reason":"동의어 — 흠 있는 상태"},{"w":"perfection","ko":"완벽","reason":"반의어 — 결점의 반대"}],"collocBest":[]},"nuance":{"koSimple":"완벽함을 깨는 작은 흠.","whenToUse":"계획·성격의 약점을 지적할 때."},"krDetail":[{"ko":"결점","explain":"좋지 않게 만드는 부족한 점"},{"ko":"흠","explain":"물건이나 사람의 모자란 부분"}],"usageExamples":[{"en":"The engineers discovered a fatal flaw in the bridge's original design.","ko":"그 기술자들은 그 다리의 원래 설계에서 치명적인 결점을 발견했다."},{"en":"Everyone has flaws, but great leaders learn to overcome them through hard work.","ko":"누구나 결점이 있지만, 훌륭한 지도자들은 노력을 통해 그것들을 극복하는 법을 배운다."}],"grammarNote":"flaw는 가산명사이다. flaw in + 명사(~안의 결점) 형태로 자주 쓰인다. 학생들이 flaw of로 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The scientist quickly identified _____ major flaw _____ his colleague's experimental design last week.","ko":"그 과학자는 지난주에 동료의 실험 설계에서 큰 결점을 빠르게 발견했다.","answer":["a","in"],"hint":"부정관사 + 전치사"}]},
    {"id":"w02482","w":"flawless","pos":["adj"],"ph":"/ˈflɔːləs/","cefr":"B1","kr":["흠 없는","완벽한"],"ex":[{"en":"Her performance was flawless.","ko":"그녀의 공연은 흠 없이 완벽했다."}],"mnemonic":{"soundHint":"플로리스","story":"flaw(흠) + -less(없는) = 흠 없는, 완벽한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"perfect","ko":"완벽한","reason":"동의어 — 흠 없음"},{"w":"impeccable","ko":"나무랄 데 없는","reason":"동의어 — 완벽한 상태"},{"w":"flawed","ko":"결함이 있는","reason":"반의어 — flawless 반대"}],"collocBest":[]},"nuance":{"koSimple":"흠 하나 없이 완벽한.","whenToUse":"공연·피부·발음을 극찬할 때."},"krDetail":[{"ko":"흠 없는","explain":"잘못된 부분이 하나도 없는"},{"ko":"완벽한","explain":"어디 하나 부족함 없이 완전한"}],"usageExamples":[{"en":"The young dancer gave a flawless performance in front of the entire audience.","ko":"그 어린 무용수는 전체 관객 앞에서 완벽한 공연을 보여줬다."},{"en":"Her flawless English impressed everyone at the international business conference.","ko":"그녀의 완벽한 영어는 국제 비즈니스 회의에서 모든 사람에게 감명을 주었다."}],"grammarNote":"-less 접미사가 붙은 형용사의 부사형은 -lessly이다. 학생들이 flawlessly와 flawless를 자주 혼동한다.","grammarQuiz":[{"sentence":"The pianist performed the difficult concerto _____ _____ front of the international judges last night.","ko":"그 피아니스트는 지난밤 국제 심사위원들 앞에서 그 어려운 협주곡을 완벽하게 연주했다.","answer":["flawlessly","in"],"hint":"형용사→부사 변환 + 위치 전치사"}]},
    {"id":"w02769","w":"glossy","pos":["adj"],"ph":"/ˈɡlɒsi/","cefr":"B1","kr":["윤기 있는","광택 있는"],"ex":[{"en":"The magazine had glossy pages with vibrant photographs.","ko":"그 잡지는 생동감 있는 사진들이 담긴 광택 있는 페이지를 가지고 있었다."}],"mnemonic":{"soundHint":"글로시 → '글로스(gloss, 광택)' + y","story":"gloss(광택)가 있는 = 광택 있는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"shiny","ko":"반짝이는","reason":"동의어(광택)"},{"w":"matte","ko":"무광의","reason":"반의어(광택 vs 무광)"}],"collocBest":[]},"nuance":{"koSimple":"매끈하게 빛이 나는.","whenToUse":"잡지·머리카락이 반질반질할 때."},"krDetail":[{"ko":"윤기 있는","explain":"매끈하게 빛이 도는"},{"ko":"광택 있는","explain":"반들반들 윤이 나는"}],"usageExamples":[{"en":"She flipped through the pages of a glossy fashion magazine.","ko":"그녀는 광택 나는 패션 잡지의 페이지를 넘겨보았다."},{"en":"His hair looked glossy after the new shampoo treatment.","ko":"그의 머리카락은 새 샴푸 트리트먼트 후 윤기 있어 보였다."}],"grammarNote":"glossy는 형용사로 look/be glossy 형태의 보어나 명사 수식으로 쓴다. 학생들은 부사 형태 glossily를 필요로 하는 자리에도 glossy를 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The new car had a _____ _____ finish that impressed everyone.","ko":"새 차는 모두를 감탄하게 하는 광택 있는 마감을 지니고 있었다.","answer":["glossy","black"],"hint":"형용사 + 형용사"}]},
    {"id":"w02565","w":"forgive","pos":["v"],"ph":"/fərˈɡɪv/","cefr":"B1","kr":["용서하다","사면하다"],"ex":[{"en":"She finally forgave him for his mistakes.","ko":"그녀는 마침내 그의 실수를 용서했다."}],"mnemonic":{"soundHint":"포기브 → 'for(위해) + give(주다)'","story":"상대를 위해 마음을 준다 → 용서하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pardon","ko":"용서하다","reason":"용서 동의어"},{"w":"blame","ko":"비난하다","reason":"용서의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"상대의 잘못을 마음에서 놓아주는 것","whenToUse":"용서하고 관계를 회복하려 할 때"},"krDetail":[{"ko":"용서하다","explain":"잘못한 사람을 나무라지 않고 받아들이다"},{"ko":"사면하다","explain":"죄나 벌을 없던 일로 해주다"}],"usageExamples":[{"en":"She forgave her friend for forgetting about her birthday party.","ko":"그녀는 친구가 자신의 생일 파티를 잊은 것을 용서했다."},{"en":"The teacher was forgiven by her students for the strict rules.","ko":"그 선생님은 엄격한 규칙에 대해 학생들에게 용서받았다."}],"grammarNote":"forgive는 forgive + 사람 + for + 동명사/명사 형태로 쓰이며, 수동태 be forgiven by 사람 for 이유 형태도 자주 등장한다.","grammarQuiz":[{"sentence":"Please _____ _____ _____ being late to the important meeting today.","ko":"오늘 중요한 회의에 늦은 것에 대해 저를 용서해 주세요.","answer":["forgive","me","for"],"hint":"동사 + 목적어 + 전치사"},{"sentence":"He _____ _____ _____ his sister for breaking his favorite toy.","ko":"그는 자기가 가장 좋아하는 장난감을 부순 여동생을 용서했다.","answer":["has","forgiven"],"hint":"현재완료"}]},
    {"id":"w02741","w":"giddy","pos":["adj"],"ph":"/ˈɡɪdi/","cefr":"B1","kr":["어지러운","들뜬"],"ex":[{"en":"She felt giddy with excitement before the performance.","ko":"그녀는 공연 전에 흥분으로 들떠 있었다."}],"mnemonic":{"soundHint":"기디 → '기(氣)디디디' 어지러움","story":"기가 흔들려 '기디기디' 어지러움.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"dizzy","ko":"어지러운","reason":"동의어(현기증)"},{"w":"steady","ko":"안정된","reason":"반의어(휘청 vs 안정)"}],"collocBest":[]},"nuance":{"koSimple":"어질어질하거나 들뜬 기분의.","whenToUse":"신나서 붕 뜨거나 어지러울 때."},"krDetail":[{"ko":"어지러운","explain":"머리가 빙빙 도는 느낌이 드는"},{"ko":"들뜬","explain":"기쁨이나 흥분으로 마음이 붕 뜬"}],"usageExamples":[{"en":"She felt giddy after riding the roller coaster three times.","ko":"그녀는 롤러코스터를 세 번 타고 나서 어지러움을 느꼈다."},{"en":"The children were giddy with excitement before the trip.","ko":"그 아이들은 여행 전에 흥분으로 들떠 있었다."}],"grammarNote":"giddy는 형용사이며 'feel/be + giddy' 형태로 감정·상태를 나타낸다. '~로 인해 들뜬'은 giddy with ~로 쓰며, 학생들은 giddy of, giddy by로 잘못 쓰는 오답이 많다.","grammarQuiz":[{"sentence":"The kids were _____ _____ excitement on Christmas morning.","ko":"아이들은 크리스마스 아침 흥분으로 들떠 있었다.","answer":["giddy","with"],"hint":"형용사 + 감정 전치사"}]},
    {"id":"w02571","w":"format","pos":["n","v"],"ph":"/ˈfɔːrmæt/","cefr":"B1","kr":["형식","포맷하다"],"ex":[{"en":"Please submit your essay in the correct format.","ko":"에세이를 올바른 형식으로 제출해 주세요."}],"mnemonic":{"soundHint":"포맷(format) — 파일 포맷·형식","story":"컴퓨터에서 말하는 파일 포맷(format), 그 형식","hintConfidence":3},"pairs":{"buddyWords":[{"w":"structure","ko":"구조","reason":"형식 동의어"},{"w":"file","ko":"파일","reason":"file format 콜로케이션"}],"collocBest":[{"en":"file format","ko":"파일 형식"},{"en":"format a document","ko":"문서를 포맷하다"}]},"nuance":{"koSimple":"정해진 틀·형식","whenToUse":"문서·파일 등의 구조나 양식을 말할 때"},"krDetail":[{"ko":"형식","explain":"정해진 틀이나 짜임새"},{"ko":"포맷하다","explain":"일정한 틀에 맞춰 정리하다"}],"usageExamples":[{"en":"She formatted the entire document to match the company's official style.","ko":"그녀는 회사의 공식 스타일에 맞추어 문서 전체를 포맷했다."},{"en":"The report was formatted according to strict academic guidelines.","ko":"그 보고서는 엄격한 학술 지침에 따라 포맷되었다."}],"grammarNote":"format은 명사(형식)와 동사(포맷하다) 모두로 쓰이는 자·타 겸용 어휘이며, 동사로 쓰일 때는 주로 문서나 저장 장치를 대상으로 한다.","grammarQuiz":[{"sentence":"You must _____ the document _____ the correct academic style.","ko":"그 문서를 올바른 학술 스타일에 맞춰 포맷해야 한다.","answer":["format","in"],"hint":"동사 + 전치사"},{"sentence":"The file _____ _____ _____ the technician before the presentation started.","ko":"그 파일은 발표가 시작되기 전 기술자에 의해 포맷되었다.","answer":["was","formatted","by"],"hint":"수동태 + 전치사"}]},
    {"id":"w02375","w":"federal","pos":["adj"],"ph":"/ˈfedərəl/","cefr":"B1","kr":["연방의","연방 정부의"],"ex":[{"en":"The federal government passed a new law.","ko":"연방 정부는 새로운 법을 통과시켰다."}],"mnemonic":{"soundHint":"페더럴","story":"'페더~ 럴!' 여러 주가 페더(feather=깃털)처럼 모여 연방을 이룸.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"national","ko":"국가의","reason":"동의어 — 중앙 정부 개념"},{"w":"local","ko":"지역의","reason":"반의어 — 연방 대 지역"},{"w":"government","ko":"정부","reason":"콜로 — 연방 정부"}],"collocBest":[]},"nuance":{"koSimple":"여러 주가 모인 연방의.","whenToUse":"미국 등 연방 국가의 법·정부 이야기할 때."},"krDetail":[{"ko":"연방의","explain":"여러 주가 하나로 뭉친 나라의"},{"ko":"연방 정부의","explain":"여러 주를 하나로 다스리는 중앙 정부의"}],"usageExamples":[{"en":"The federal government announced new regulations to protect the environment.","ko":"연방 정부는 환경을 보호하기 위한 새로운 규정을 발표했다."},{"en":"This case will be tried in a federal court rather than a state court.","ko":"이 사건은 주 법원이 아닌 연방 법원에서 재판될 것이다."}],"grammarNote":"federal은 한정적 용법 위주로 쓰이는 형용사이다. 학생들이 서술적 위치(be federal)에 두려는 실수를 자주 한다.","grammarQuiz":[{"sentence":"_____ federal agency _____ oversees banking has strict rules about international money transfers.","ko":"은행업을 감독하는 그 연방 기관은 국제 자금 이체에 대한 엄격한 규정을 가지고 있다.","answer":["The","that"],"hint":"정관사 + 관계대명사"}]},
    {"id":"w02529","w":"folklore","pos":["n"],"ph":"/ˈfəʊklɔː/","cefr":"B1","kr":["민속","민간 전승"],"ex":[{"en":"The story is part of local folklore.","ko":"그 이야기는 지역 민간 전승의 일부이다."}],"mnemonic":{"soundHint":"포크로어 → 'folk(사람들) + lore(지식)'","story":"옛사람들(folk)의 지식(lore)이 모여 민간 전승.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tradition","ko":"전통","reason":"전해오는 문화 동의어"},{"w":"legend","ko":"전설","reason":"구전 이야기 동의어"}],"collocBest":[]},"nuance":{"koSimple":"조상 대대로 전해진 이야기와 풍습","whenToUse":"전통 설화·민간 신앙 등을 통틀어 말할 때"},"krDetail":[{"ko":"민속","explain":"한 지역 사람들 사이에 전해오는 풍속과 이야기"},{"ko":"민간 전승","explain":"입에서 입으로 이어지는 옛이야기"}],"usageExamples":[{"en":"Local folklore describes a hidden treasure buried under the ancient oak tree.","ko":"지역 민속은 오래된 참나무 아래 숨겨진 보물이 있다고 전한다."},{"en":"Irish folklore includes many stories about fairies and magical creatures.","ko":"아일랜드 민속에는 요정과 마법 생명체에 관한 이야기가 많다."}],"grammarNote":"folklore는 셀 수 없는 명사로 항상 단수 취급하며, 관사 없이 쓰거나 the folklore of + 지역명으로 표현한다.","grammarQuiz":[{"sentence":"Korean _____ _____ many tales about tigers and clever rabbits.","ko":"한국 민속에는 호랑이와 영리한 토끼에 관한 이야기가 많다.","answer":["folklore","includes"],"hint":"명사(단수) + 동사"},{"sentence":"According _____ local _____, this river was created by a giant.","ko":"지역 민속에 따르면 이 강은 거인이 만들었다.","answer":["to","folklore"],"hint":"전치사 + 명사"}]},
    {"id":"w02524","w":"focus","pos":["n","v"],"ph":"/ˈfoʊkəs/","cefr":"B1","kr":["초점","집중하다"],"ex":[{"en":"You need to focus on your studies.","ko":"공부에 집중해야 한다."}],"mnemonic":{"soundHint":"포커스(focus) — 카메라 초점 맞추기","story":"카메라 포커스를 맞추듯 한 곳에 초점을 두고 집중하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"concentrate","ko":"집중하다","reason":"정신을 모으는 동의어"},{"w":"distract","ko":"산만하게 하다","reason":"집중의 반의어"}],"collocBest":[{"en":"focus on","ko":"~에 집중하다"},{"en":"main focus","ko":"주요 초점"}]},"nuance":{"koSimple":"한 곳에 눈·마음을 집중시키는 것","whenToUse":"주의를 특정 대상에 모을 때"},"krDetail":[{"ko":"초점","explain":"관심이나 활동이 모이는 중심점"},{"ko":"집중하다","explain":"정신이나 노력을 한 곳으로 모으다"}],"usageExamples":[{"en":"The teacher focused the students' attention on the main problem.","ko":"선생님은 학생들의 주의를 주요 문제에 집중시켰다."},{"en":"She focused on her studies to prepare for the final exam.","ko":"그녀는 기말고사를 준비하기 위해 공부에 집중했다."}],"grammarNote":"focus는 타동사(attention을 집중시키다)와 자동사(focus on: ~에 집중하다) 둘 다 쓰이는 자·타 겸용 동사이다.","grammarQuiz":[{"sentence":"You need to _____ _____ the important details before making a decision.","ko":"결정을 내리기 전에 중요한 세부사항에 집중해야 한다.","answer":["focus","on"],"hint":"자동사 + 전치사"},{"sentence":"The photographer _____ _____ camera on the beautiful landscape ahead.","ko":"사진작가는 앞에 있는 아름다운 풍경에 카메라의 초점을 맞췄다.","answer":["focused","the"],"hint":"타동사 + 관사"}]},
    {"id":"w02663","w":"fur","pos":["n"],"ph":"/fɜːr/","cefr":"B1","kr":["털","모피"],"ex":[{"en":"The cat's fur was very soft to touch.","ko":"고양이 털은 만지기에 매우 부드러웠다."}],"mnemonic":{"soundHint":"퍼 → '퍼~' 하고 뽑히는 털","story":"동물 털이 '퍼~' 뽑히면 fur(모피).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"coat","ko":"털가죽/외투","reason":"동의어(동물의 털)"},{"w":"leather","ko":"가죽","reason":"시나리오 콜로(모피·가죽)"}],"collocBest":[]},"nuance":{"koSimple":"동물 몸을 덮은 부드러운 털.","whenToUse":"고양이 털·모피 코트 이야기할 때."},"krDetail":[{"ko":"털","explain":"짐승 몸에 난 부드러운 잔털"},{"ko":"모피","explain":"털이 붙은 짐승 가죽"}],"usageExamples":[{"en":"The cat's soft fur felt warm under my hand.","ko":"고양이의 부드러운 털이 내 손에 따뜻하게 느껴졌다."},{"en":"Many activists protest the use of real fur in fashion.","ko":"많은 활동가들이 패션에서 진짜 모피 사용에 항의한다."}],"grammarNote":"fur는 보통 불가산명사로 쓰여 a fur, furs처럼 쓰지 않는다. 다만 여러 종류의 모피를 뜻할 때는 furs가 가능하다. 학생들은 늘 복수형으로 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The rabbit's white _____ kept it warm _____ the cold winter.","ko":"그 토끼의 하얀 털이 추운 겨울 동안 그것을 따뜻하게 해주었다.","answer":["fur","during"],"hint":"명사 + 시간 전치사"}]},
    {"id":"w02713","w":"general","pos":["adj","n"],"ph":"/ˈdʒenərəl/","cefr":"B1","kr":["일반적인","장군"],"ex":[{"en":"In general, people prefer comfort.","ko":"일반적으로 사람들은 편안함을 선호한다."}],"mnemonic":{"soundHint":"제너럴 → '제(모든) 너를(너희)' 아우르는","story":"모든 사람을 아우르는 = 일반적인 / 장군.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"common","ko":"공통의","reason":"동의어(일반적인)"},{"w":"specific","ko":"구체적인","reason":"반의어(일반 vs 구체)"},{"w":"overall","ko":"전반적인","reason":"동의어(전체)"}],"collocBest":[]},"nuance":{"koSimple":"특별하지 않고 전반에 걸친.","whenToUse":"'대체로·일반적으로'라는 큰 그림에."},"krDetail":[{"ko":"일반적인","explain":"특별하지 않고 두루 그러한"},{"ko":"장군","explain":"군대에서 가장 높은 지휘관"}],"usageExamples":[{"en":"The general opinion is that the plan needs more work.","ko":"일반적인 의견은 그 계획에 손질이 더 필요하다는 것이다."},{"en":"In general, students prefer group work over lectures.","ko":"일반적으로 학생들은 강의보다 그룹 활동을 선호한다."}],"grammarNote":"in general은 '일반적으로'라는 관용구로, generally와 바꿔 쓸 수 있다. 학생들은 in the general처럼 정관사를 넣는 실수를 자주 한다.","grammarQuiz":[{"sentence":"_____ _____, exercise is good for both body and mind.","ko":"일반적으로 운동은 몸과 마음 모두에 좋다.","answer":["In","general"],"hint":"관용구 (전치사 + 명사)"}]},
    {"id":"w02528","w":"folk","pos":["n","adj"],"ph":"/foʊk/","cefr":"B1","kr":["사람들","민속의"],"ex":[{"en":"Folk music has a long tradition in Ireland.","ko":"민속 음악은 아일랜드에서 오랜 전통을 가지고 있다."}],"mnemonic":{"soundHint":"포크(folk) 음악의 그 포크, 민속","story":"포크 뮤직(folk music)이라는 외래어처럼 folk는 사람들·민속의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"people","ko":"사람들","reason":"사람들 동의어"},{"w":"music","ko":"음악","reason":"folk music 콜로케이션"}],"collocBest":[{"en":"folk music","ko":"민속 음악"},{"en":"folk tale","ko":"민화"}]},"nuance":{"koSimple":"평범한 동네 사람들·민속.","whenToUse":"보통 사람들 또는 전통 문화를 가리킬 때."},"krDetail":[{"ko":"사람들","explain":"특정 지역이나 집단에 속한 이들"},{"ko":"민속의","explain":"옛날부터 전해오는 전통과 관련된"}],"usageExamples":[{"en":"The old folks in the village shared traditional stories with children.","ko":"마을의 어르신들은 아이들에게 전통 이야기를 들려주었다."},{"en":"Folk music from the mountains has been passed down for generations.","ko":"산에서 온 민속 음악은 여러 세대에 걸쳐 전해져 왔다."}],"grammarNote":"folk는 사람을 뜻할 때 보통 복수형 folks로 쓰이며, 형용사로 쓰일 때는 folk music, folk tale처럼 명사 앞에 놓인다.","grammarQuiz":[{"sentence":"The elderly _____ gathered in the square to share old stories together.","ko":"어르신들이 옛이야기를 나누려고 광장에 모였다.","answer":["folks"],"hint":"명사 복수형"},{"sentence":"She grew up listening to traditional _____ _____ from her grandmother.","ko":"그녀는 할머니에게서 전통 민속 이야기를 들으며 자랐다.","answer":["folk","tales"],"hint":"형용사 + 명사"}]},
    {"id":"w02700","w":"gasp","pos":["v","n"],"ph":"/ɡæsp/","cefr":"B1","kr":["헐떡이다","숨을 헐떡임"],"ex":[{"en":"She gasped in surprise at the news.","ko":"그녀는 그 소식에 놀라 숨을 들이켰다."}],"mnemonic":{"soundHint":"개스프 → '갓!' 하고 놀라 숨 헐떡","story":"놀라 '갓!' 하고 숨을 헐떡이다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"pant","ko":"숨을 헐떡이다","reason":"동의어(호흡 곤란)"},{"w":"shock","ko":"충격","reason":"시나리오 콜로(gasp in shock)"}],"collocBest":[]},"nuance":{"koSimple":"놀라거나 숨차서 확 들이켜다.","whenToUse":"충격·헉 소리·숨 가쁨을 표현할 때."},"krDetail":[{"ko":"헐떡이다","explain":"숨이 차서 급하게 몰아쉬다"},{"ko":"숨을 헐떡임","explain":"가쁘게 숨을 몰아쉬는 소리나 모습"}],"usageExamples":[{"en":"The runner gasped for breath after crossing the finish line.","ko":"그 주자는 결승선을 지난 뒤 숨을 헐떡였다."},{"en":"Loud gasps were heard from the audience during the show.","ko":"공연 중 관객으로부터 큰 헐떡임 소리가 들렸다."}],"grammarNote":"gasp는 자동사로 목적어 없이 쓰이며 gasp for breath/air 형태가 자주 나온다. 학생들은 타동사로 착각해 gasp the air처럼 쓰는 오답이 잦다.","grammarQuiz":[{"sentence":"The swimmer surfaced and began to _____ _____ air.","ko":"수영 선수는 수면 위로 올라와 공기를 헐떡이기 시작했다.","answer":["gasp","for"],"hint":"자동사 + 전치사"}]},
    {"id":"w02661","w":"funeral","pos":["n"],"ph":"/ˈfjuːnərəl/","cefr":"B1","kr":["장례식","장례"],"ex":[{"en":"The funeral was held at the local church.","ko":"장례식은 지역 교회에서 거행되었다."}],"mnemonic":{"soundHint":"퓨너럴 → '퓨(슬픔) 너(당신) 럴(럴리)'","story":"슬픔이 몰리는 자리 = 장례식.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"burial","ko":"매장","reason":"동의어(장례 관련)"},{"w":"mourn","ko":"애도하다","reason":"시나리오 콜로(장례식-애도)"},{"w":"wedding","ko":"결혼식","reason":"대비 시나리오(장례식 vs 결혼식)"}],"collocBest":[]},"nuance":{"koSimple":"세상을 떠난 사람을 위한 의식.","whenToUse":"장례식 참석·주관을 이야기할 때."},"krDetail":[{"ko":"장례식","explain":"죽은 사람을 보내는 의식"},{"ko":"장례","explain":"죽은 이를 떠나보내는 일 전반"}],"usageExamples":[{"en":"Many old friends attended the funeral to say goodbye.","ko":"많은 오랜 친구들이 작별 인사를 하러 장례식에 참석했다."},{"en":"The funeral was held quietly at a small chapel.","ko":"장례식은 작은 예배당에서 조용히 치러졌다."}],"grammarNote":"'장례식에 참석하다'는 attend a funeral로, attend는 타동사이므로 attend to a funeral처럼 to를 붙이지 않는다. 학생들이 자주 실수하는 부분이다.","grammarQuiz":[{"sentence":"Hundreds of people came to _____ the _____ of the beloved teacher.","ko":"수백 명의 사람들이 사랑받던 선생님의 장례식에 참석하러 왔다.","answer":["attend","funeral"],"hint":"타동사 + 명사"}]},
    {"id":"w02727","w":"gentle","pos":["adj"],"ph":"/ˈdʒentl/","cefr":"B1","kr":["부드러운","온화한"],"ex":[{"en":"She spoke in a gentle voice.","ko":"그녀는 부드러운 목소리로 말했다."}],"mnemonic":{"soundHint":"젠틀 → '젠틀맨(신사)'","story":"신사(gentleman)처럼 부드러운.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"soft","ko":"부드러운","reason":"동의어(감촉)"},{"w":"rough","ko":"거친","reason":"반의어(부드러움 vs 거침)"},{"w":"mild","ko":"온화한","reason":"동의어(성격·기후)"}],"collocBest":[]},"nuance":{"koSimple":"자극이 없고 살살 다루는.","whenToUse":"목소리·손길·바람이 부드러울 때."},"krDetail":[{"ko":"부드러운","explain":"거칠지 않고 매끄럽거나 살가운"},{"ko":"온화한","explain":"성품이나 태도가 따뜻하고 차분한"}],"usageExamples":[{"en":"The nurse held the baby with a gentle touch.","ko":"그 간호사는 부드러운 손길로 아기를 안았다."},{"en":"A gentle breeze was blowing through the open window.","ko":"산들바람이 열린 창문 사이로 불고 있었다."}],"grammarNote":"gentle은 형용사이므로 명사를 수식하거나 be동사 뒤에서 보어로 쓴다. '부드럽게'라는 부사는 gently이므로 She spoke gentle이 아니라 She spoke gently로 써야 한다.","grammarQuiz":[{"sentence":"The mother spoke in _____ _____ voice to calm her child.","ko":"어머니는 아이를 달래려고 부드러운 목소리로 말했다.","answer":["a","gentle"],"hint":"부정관사 + 형용사"}]},
    {"id":"w02402","w":"fetch","pos":["v"],"ph":"/fetʃ/","cefr":"B1","kr":["가져오다","데려오다"],"ex":[{"en":"Can you fetch me a glass of water?","ko":"물 한 잔 가져다 줄 수 있어요?"}],"mnemonic":{"soundHint":"페치","story":"'페! 치!' 강아지에게 던진 공을 물어오라는 명령 = fetch.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bring","ko":"가져오다","reason":"동의어 — 대상을 가져옴"},{"w":"retrieve","ko":"회수하다","reason":"동의어 — 다시 가져옴"},{"w":"remove","ko":"치우다","reason":"반의어 — 가져오기의 반대"}],"collocBest":[]},"nuance":{"koSimple":"가서 집어 오고 데려오다.","whenToUse":"물건·사람을 가지러 갔다 올 때."},"krDetail":[{"ko":"가져오다","explain":"저쪽에 있는 것을 이쪽으로 옮겨 오다"},{"ko":"데려오다","explain":"누군가와 함께 이쪽으로 오다"}],"usageExamples":[{"en":"Could you please fetch me a glass of cold water from the kitchen?","ko":"부엌에서 나에게 시원한 물 한 잔 가져다줄 수 있니?"},{"en":"The old painting was fetched a surprisingly high price at the auction house.","ko":"그 오래된 그림은 경매장에서 놀랄 만큼 높은 가격에 팔렸다."}],"grammarNote":"fetch는 4형식 동사로 fetch + 간접목적어 + 직접목적어 형태를 취한다. 또한 '(값)에 팔리다'라는 뜻으로도 자주 쓰인다.","grammarQuiz":[{"sentence":"The rare antique clock _____ a record price _____ the international auction held in London.","ko":"그 희귀한 골동품 시계는 런던에서 열린 국제 경매에서 기록적인 가격에 팔렸다.","answer":["fetched","at"],"hint":"타동사 과거형 + 장소 전치사"}]},
    {"id":"w02677","w":"gain","pos":["v","n"],"ph":"/ɡeɪn/","cefr":"B1","kr":["얻다","이익"],"ex":[{"en":"She gained confidence gradually.","ko":"그녀는 점차 자신감을 얻었다."}],"mnemonic":{"soundHint":"게인 → '개인(個人)'이 얻는 것","story":"개인이 자신감을 gain(얻다).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"obtain","ko":"얻다","reason":"동의어(획득)"},{"w":"lose","ko":"잃다","reason":"반의어(얻다 vs 잃다)"},{"w":"profit","ko":"이익","reason":"명사 뜻 시나리오 콜로"}],"collocBest":[]},"nuance":{"koSimple":"노력해서 손에 넣거나 늘리다.","whenToUse":"경험·자신감·체중이 늘 때."},"krDetail":[{"ko":"얻다","explain":"노력이나 시간을 들여 손에 넣다"},{"ko":"이익","explain":"얻어지는 좋은 몫이나 보람"}],"usageExamples":[{"en":"You will gain valuable experience by joining the club.","ko":"너는 동아리에 가입함으로써 소중한 경험을 얻을 것이다."},{"en":"Much can be gained from listening to different opinions.","ko":"다양한 의견을 들음으로써 많은 것을 얻을 수 있다."}],"grammarNote":"gain은 타동사로 목적어를 직접 취하며, 뒤에 experience, weight, access 같은 추상명사가 자주 온다. 학생들은 get with과 헷갈려 gain of, gain from 뒤에 오는 것을 목적어처럼 취급하기도 하는데, gain 뒤에는 바로 목적어가 온다.","grammarQuiz":[{"sentence":"She hoped to _____ _____ to the private library.","ko":"그녀는 그 개인 도서관 이용 권한을 얻기를 바랐다.","answer":["gain","access"],"hint":"동사 + 명사"}]},
    {"id":"w02676","w":"gadget","pos":["n"],"ph":"/ˈɡædʒɪt/","cefr":"B1","kr":["장치","기기"],"ex":[{"en":"He loves buying the latest gadgets.","ko":"그는 최신 기기 구입을 좋아한다."}],"mnemonic":{"soundHint":"가젯(gadget)","story":"'가젯'은 외래어로 전자 소품·기기를 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"device","ko":"장치","reason":"동의어(기기·장치)"},{"w":"tool","ko":"도구","reason":"동의어(용도별 도구)"}],"collocBest":[{"en":"electronic gadget","ko":"전자 기기"},{"en":"kitchen gadget","ko":"주방 기기"}]},"nuance":{"koSimple":"작고 편리한 최신 기기.","whenToUse":"스마트 워치 같은 신기한 장치에."},"krDetail":[{"ko":"장치","explain":"특정 일을 하도록 만든 작은 물건"},{"ko":"기기","explain":"간편하게 쓰는 자잘한 기계"}],"usageExamples":[{"en":"He invented a clever gadget to peel apples in seconds.","ko":"그는 몇 초 만에 사과 껍질을 벗기는 기발한 장치를 발명했다."},{"en":"This smart gadget helps you track your sleep patterns.","ko":"이 스마트 기기는 네 수면 패턴 추적을 돕는다."}],"grammarNote":"gadget은 가산명사이므로 a gadget, gadgets처럼 관사와 복수형을 반드시 붙여야 한다. 학생들은 불가산명사처럼 many gadget으로 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The store sells all kinds of _____ _____ home use.","ko":"그 가게는 가정용의 온갖 종류의 기기들을 판다.","answer":["gadgets","for"],"hint":"복수 명사 + 용도 전치사"}]},
    {"id":"w02547","w":"force","pos":["n","v"],"ph":"/fɔːrs/","cefr":"B1","kr":["힘","강요하다"],"ex":[{"en":"The force of the wind knocked down the trees.","ko":"바람의 힘이 나무들을 쓰러뜨렸다."}],"mnemonic":{"soundHint":"포스(Force) — 스타워즈 May the Force be with you","story":"스타워즈의 포스(Force)처럼 강력한 힘, 또는 강요하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"power","ko":"힘","reason":"힘 동의어"},{"w":"compel","ko":"강요하다","reason":"강요 동의어"}],"collocBest":[{"en":"by force","ko":"강제로"},{"en":"force of nature","ko":"자연의 힘"}]},"nuance":{"koSimple":"물리적인 힘 또는 억지로 시키기","whenToUse":"강한 물리력이나 강제성을 나타낼 때"},"krDetail":[{"ko":"힘","explain":"물체를 움직이거나 바꾸는 작용"},{"ko":"강요하다","explain":"억지로 시키다"}],"usageExamples":[{"en":"The manager forced his employees to work overtime without extra pay.","ko":"그 관리자는 직원들에게 추가 수당 없이 초과 근무를 강요했다."},{"en":"The victims were forced to hand over all their valuable belongings.","ko":"피해자들은 모든 귀중품을 넘겨줄 것을 강요당했다."}],"grammarNote":"force는 force + 목적어 + to부정사 구조로 '~에게 ~하도록 강요하다'라는 뜻이며, 수동태 be forced to부정사 형태로도 자주 쓰인다.","grammarQuiz":[{"sentence":"The teacher _____ _____ students to complete the assignment before Friday.","ko":"선생님은 학생들에게 금요일 전에 과제를 완료하도록 강요했다.","answer":["forced","the"],"hint":"타동사 + 관사"},{"sentence":"He _____ _____ _____ leave his hometown due to the war.","ko":"그는 전쟁 때문에 고향을 떠나도록 강요당했다.","answer":["was","forced","to"],"hint":"수동태 + to부정사"}]},
    {"id":"w02360","w":"favorable","pos":["adj"],"ph":"/ˈfeɪvərəbəl/","cefr":"B1","kr":["유리한","호의적인"],"ex":[{"en":"The conditions were favorable.","ko":"조건이 유리했다."}],"mnemonic":{"soundHint":"페이버러블","story":"favor(호의) + -able = 호의적인, 유리한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"advantageous","ko":"유리한","reason":"동의어 — 이익이 되는"},{"w":"unfavorable","ko":"불리한","reason":"반의어 — 접두사 un-"},{"w":"positive","ko":"긍정적인","reason":"동의어 — 호의적 반응"}],"collocBest":[]},"nuance":{"koSimple":"나에게 유리하고 좋은 쪽인.","whenToUse":"조건·반응이 우호적이라고 말할 때."},"krDetail":[{"ko":"유리한","explain":"일이 잘 되도록 도움이 되는"},{"ko":"호의적인","explain":"좋게 보고 잘 대해 주려는 마음의"}],"usageExamples":[{"en":"The company received a favorable review from all major industry critics.","ko":"그 회사는 모든 주요 업계 비평가들로부터 호의적인 평가를 받았다."},{"en":"Weather conditions are expected to be favorable for the outdoor concert.","ko":"날씨 조건은 야외 콘서트에 유리할 것으로 예상된다."},{"en":"She spoke in favorable terms about her former colleagues and their achievements.","ko":"그녀는 이전 동료들과 그들의 업적에 대해 호의적인 말로 이야기했다."}],"grammarNote":"favorable은 to/for 전치사와 함께 쓰이는데, 학생들이 자주 in favorable of 같은 어색한 표현을 만든다.","grammarQuiz":[{"sentence":"The new policy is highly favorable _____ small businesses _____ struggling with high tax rates.","ko":"그 새 정책은 높은 세율로 고전하고 있는 소규모 사업체들에게 매우 유리하다.","answer":["to","that"],"hint":"전치사 + 관계대명사"}]},

    {"id":"w02550","w":"foreground","pos":["n","v"],"ph":"/ˈfɔːɡraʊnd/","cefr":"B1","kr":["전경","앞쪽"],"ex":[{"en":"The figure stands in the foreground.","ko":"그 인물은 전경에 서 있다."}],"mnemonic":{"soundHint":"포어그라운드 → 'fore(앞) + ground(땅)'","story":"앞쪽(fore) 땅(ground) = 전경.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"front","ko":"앞부분","reason":"앞쪽 위치 동의어"},{"w":"background","ko":"배경","reason":"전경의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"그림·사진의 앞쪽 부분","whenToUse":"시각적 장면의 전면을 지칭할 때"},"krDetail":[{"ko":"전경","explain":"그림이나 사진에서 앞쪽에 보이는 부분"},{"ko":"앞쪽","explain":"가장 가까이 있어 눈에 잘 띄는 자리"}],"usageExamples":[{"en":"The artist placed a colorful flower in the foreground of the painting.","ko":"그 화가는 그림의 전경에 다채로운 꽃 한 송이를 배치했다."},{"en":"In the foreground, a small child was playing with a red balloon.","ko":"전경에는 어린아이가 빨간 풍선을 가지고 놀고 있었다."}],"grammarNote":"foreground는 주로 in the foreground 형태의 전치사구로 쓰이며, 반대말 in the background와 짝을 이루어 위치를 설명한다.","grammarQuiz":[{"sentence":"The photographer captured a lovely dog _____ _____ _____ of the shot.","ko":"사진작가는 촬영 전경에 사랑스러운 개를 담았다.","answer":["in","the","foreground"],"hint":"전치사구"},{"sentence":"The mountains stood tall behind the _____ _____ of green fields.","ko":"산들이 초록 들판의 전경 뒤로 우뚝 서 있었다.","answer":["foreground","image"],"hint":"명사 + 명사"}]},
    {"id":"w02549","w":"forecast","pos":["n","v"],"ph":"/ˈfɔːrkæst/","cefr":"B1","kr":["예보","예측하다"],"ex":[{"en":"The weather forecast says it will rain tomorrow.","ko":"일기 예보에 따르면 내일 비가 올 것이라고 한다."}],"mnemonic":{"soundHint":"포캐스트 → 'fore(미리) + cast(던지다)'","story":"미리(fore) 예측을 던진다(cast) → 예보.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"prediction","ko":"예측","reason":"예측 동의어"},{"w":"weather","ko":"날씨","reason":"weather forecast 콜로"}],"collocBest":[]},"nuance":{"koSimple":"날씨·미래를 미리 알려주는 예보","whenToUse":"공식 예측 자료를 말할 때"},"krDetail":[{"ko":"예보","explain":"앞으로 있을 일에 대한 알림"},{"ko":"예측하다","explain":"다가올 일을 미리 헤아리다"}],"usageExamples":[{"en":"Economists forecast a slight growth in the national economy next year.","ko":"경제학자들은 내년 국가 경제의 소폭 성장을 예측한다."},{"en":"The heavy rain was forecast three days before it actually arrived.","ko":"폭우는 실제 도착하기 3일 전에 예보되었다."}],"grammarNote":"forecast는 타동사(예측하다)와 자동사 둘 다 가능하며, 과거형과 과거분사형은 forecast 또는 forecasted 둘 다 허용된다.","grammarQuiz":[{"sentence":"Weather experts _____ heavy snow for the mountain region this weekend.","ko":"기상 전문가들은 이번 주말 산악 지역에 폭설을 예보한다.","answer":["forecast"],"hint":"현재시제 타동사"},{"sentence":"A serious storm _____ _____ _____ the meteorologists yesterday evening.","ko":"심각한 폭풍이 어제 저녁 기상학자들에 의해 예보되었다.","answer":["was","forecast","by"],"hint":"수동태 + 전치사"}]},
    {"id":"w02598","w":"fraction","pos":["n"],"ph":"/ˈfrækʃən/","cefr":"B1","kr":["분수","작은 부분"],"ex":[{"en":"Only a fraction of the students passed the exam.","ko":"학생들의 일부만 시험에 합격했다."}],"mnemonic":{"soundHint":"프랙션 → 'fract(쪼개다) + ion'","story":"쪼갠(fract) 조각 = 분수, 작은 부분.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"portion","ko":"부분","reason":"일부 동의어"},{"w":"whole","ko":"전체","reason":"부분의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"전체 중 아주 작은 조각","whenToUse":"전체의 일부, 특히 소량을 강조할 때"},"krDetail":[{"ko":"분수","explain":"수학에서 부분을 나타내는 숫자 표기"},{"ko":"작은 부분","explain":"전체 중에서 아주 조금만 되는 몫"}],"usageExamples":[{"en":"Only a small fraction of the students completed the extra homework.","ko":"학생들 중 작은 일부만이 추가 숙제를 완료했다."},{"en":"The teacher explained how to add fractions with different denominators clearly.","ko":"선생님은 분모가 다른 분수를 더하는 법을 명확히 설명했다."}],"grammarNote":"fraction은 셀 수 있는 명사이며, a fraction of + 명사 형태로 '~의 일부'를 뜻하고, only a fraction of는 '아주 소수의'를 강조한다.","grammarQuiz":[{"sentence":"Only a small _____ _____ the audience actually enjoyed the boring movie.","ko":"관객 중 작은 일부만이 그 지루한 영화를 실제로 즐겼다.","answer":["fraction","of"],"hint":"명사 + 전치사"},{"sentence":"Students must learn to add and subtract _____ before starting algebra.","ko":"학생들은 대수학을 시작하기 전에 분수를 더하고 빼는 것을 배워야 한다.","answer":["fractions"],"hint":"명사 복수"}]},
    {"id":"w02604","w":"fragrant","pos":["adj"],"ph":"/ˈfreɪɡrənt/","cefr":"B1","kr":["향기로운","향기가 나는"],"ex":[{"en":"The garden was full of fragrant roses.","ko":"정원은 향기로운 장미로 가득했다."}],"mnemonic":{"soundHint":"프래그런스(fragrance) 향수의 파생어","story":"향수 fragrance의 형용사형이 fragrant, 향기로운","hintConfidence":3},"pairs":{"buddyWords":[{"w":"aromatic","ko":"향기로운","reason":"향기 동의어"},{"w":"flower","ko":"꽃","reason":"fragrant flower 콜로케이션"}],"collocBest":[{"en":"fragrant flower","ko":"향기로운 꽃"},{"en":"fragrant air","ko":"향기로운 공기"}]},"nuance":{"koSimple":"꽃·향수처럼 좋은 냄새가 나는","whenToUse":"기분 좋은 향기를 형용할 때"},"krDetail":[{"ko":"향기로운","explain":"코를 즐겁게 하는 좋은 냄새가 나는"},{"ko":"향기가 나는","explain":"은은하고 상쾌한 냄새를 풍기는"}],"usageExamples":[{"en":"The garden was filled with fragrant roses in full bloom.","ko":"그 정원은 활짝 핀 향기로운 장미들로 가득 차 있었다."},{"en":"She loved the fragrant smell of fresh coffee in the morning.","ko":"그녀는 아침에 신선한 커피의 향긋한 냄새를 좋아했다."}],"grammarNote":"fragrant는 명사 앞에서 한정적 용법으로 자주 쓰이며 be동사 뒤에 서술적 용법으로도 가능하고, 반의어는 odorless나 smelly이다.","grammarQuiz":[{"sentence":"The kitchen was filled with the _____ _____ of homemade bread.","ko":"부엌은 갓 만든 빵의 향기로운 냄새로 가득 차 있었다.","answer":["fragrant","smell"],"hint":"형용사 + 명사"},{"sentence":"These _____ _____ bloom every spring in my grandmother's beautiful garden.","ko":"이 향기로운 꽃들은 우리 할머니의 아름다운 정원에서 매년 봄에 핀다.","answer":["fragrant","flowers"],"hint":"형용사 + 명사 복수"}]},
    {"id":"w02519","w":"flutter","pos":["v","n"],"ph":"/ˈflʌtər/","cefr":"B1","kr":["펄럭이다","두근거리다"],"ex":[{"en":"Butterflies fluttered in the garden.","ko":"나비들이 정원에서 펄럭였다."}],"mnemonic":{"soundHint":"플러터(Flutter) 앱 프레임워크의 이름처럼 화면이 펄럭이다","story":"구글 Flutter 프레임워크의 이름처럼 화면이 펄럭이며 전환된다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"flap","ko":"펄럭이다","reason":"깃발·날개가 펄럭이는 동작 동의어"},{"w":"breeze","ko":"산들바람","reason":"flutter in the breeze 콜로케이션"}],"collocBest":[{"en":"flutter in the breeze","ko":"바람에 펄럭이다"},{"en":"heart flutter","ko":"심장이 두근거리다"}]},"nuance":{"koSimple":"깃발·날개가 팔랑팔랑 흔들리는 모습","whenToUse":"작고 가벼운 것이 빠르게 떨리듯 움직일 때"},"krDetail":[{"ko":"펄럭이다","explain":"바람에 가볍게 나부끼며 흔들리다"},{"ko":"두근거리다","explain":"심장이 빠르고 세게 뛰다"}],"usageExamples":[{"en":"The birds fluttered their wings as they took off from the branch.","ko":"새들은 나뭇가지에서 날아오르며 날개를 퍼덕였다."},{"en":"The flags fluttered in the strong breeze all afternoon.","ko":"깃발들이 오후 내내 강한 산들바람에 펄럭였다."}],"grammarNote":"flutter는 타동사(wings를 목적어로)와 자동사(스스로 펄럭이다) 둘 다 쓰이므로 문맥으로 구분해야 한다.","grammarQuiz":[{"sentence":"The butterfly _____ its colorful wings as it moved from flower to flower.","ko":"나비는 꽃에서 꽃으로 이동하며 다채로운 날개를 퍼덕였다.","answer":["fluttered"],"hint":"과거시제 타동사"},{"sentence":"Curtains _____ _____ the open window during the summer storm.","ko":"여름 폭풍 동안 커튼들이 열린 창문에서 펄럭였다.","answer":["fluttered","at"],"hint":"동사 + 전치사"}]},
    {"id":"w02763","w":"glitter","pos":["v","n"],"ph":"/ˈɡlɪtər/","cefr":"B1","kr":["반짝이다","반짝임"],"ex":[{"en":"The stars glittered in the night sky.","ko":"별들이 밤하늘에서 반짝였다."}],"mnemonic":{"soundHint":"글리터(glitter)","story":"'글리터'는 외래어로 반짝이 화장품·장식을 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sparkle","ko":"반짝이다","reason":"동의어(반짝임)"},{"w":"dull","ko":"칙칙한","reason":"반의어(반짝 vs 무광)"}],"collocBest":[{"en":"all that glitters","ko":"반짝이는 모든 것"},{"en":"glitter in the light","ko":"빛 속에서 반짝이다"}]},"nuance":{"koSimple":"작게 반짝반짝 빛나다.","whenToUse":"별·보석이 잘게 반짝일 때."},"krDetail":[{"ko":"반짝이다","explain":"빛이 자잘하게 튀기듯 빛나다"},{"ko":"반짝임","explain":"잘게 빛나는 모습이나 그런 가루"}],"usageExamples":[{"en":"The stars glittered brightly across the clear night sky.","ko":"별들이 맑은 밤하늘에 걸쳐 밝게 반짝였다."},{"en":"Her dress was glittered with tiny silver beads.","ko":"그녀의 드레스는 작은 은구슬로 반짝이게 장식되어 있었다."}],"grammarNote":"glitter는 자동사이므로 목적어를 취하지 않는다. 학생들은 The stars glitter the sky처럼 목적어를 쓰는 실수를 한다. 명사로 쓸 때는 불가산이다(a glitter ×).","grammarQuiz":[{"sentence":"All that _____ is not _____ .","ko":"반짝이는 모든 것이 금은 아니다.","answer":["glitters","gold"],"hint":"3인칭 단수 자동사 + 명사"}]},
    {"id":"w02631","w":"frighten","pos":["v"],"ph":"/ˈfraɪtən/","cefr":"B1","kr":["겁주다","놀라게 하다"],"ex":[{"en":"The loud noise frightened the baby.","ko":"큰 소리가 아기를 놀라게 했다."}],"mnemonic":{"soundHint":"프라이튼 → 'fright(공포) + en'","story":"fright(공포)를 주다 = 겁주다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"scare","ko":"겁주다","reason":"겁주다 동의어"},{"w":"reassure","ko":"안심시키다","reason":"겁주다의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"갑자기 놀라게 하여 겁먹게 하다","whenToUse":"사람·동물을 순간적으로 두렵게 할 때"},"krDetail":[{"ko":"겁주다","explain":"무섭게 만들어 벌벌 떨게 하다"},{"ko":"놀라게 하다","explain":"갑자기 놀라 몸이 움츠러들게 하다"}],"usageExamples":[{"en":"The loud thunder frightened the small children in the quiet house.","ko":"요란한 천둥이 조용한 집에 있는 어린아이들을 겁먹게 했다."},{"en":"She was frightened by the strange noise coming from the dark basement.","ko":"그녀는 어두운 지하실에서 나는 이상한 소리에 겁먹었다."}],"grammarNote":"frighten은 타동사로 능동태 frighten + 목적어, 수동태 be frightened by/of 형태로 쓰이며, 감정의 원인을 표현할 때는 by를 쓴다.","grammarQuiz":[{"sentence":"The scary movie _____ my younger sister so much last Halloween night.","ko":"그 무서운 영화가 지난 핼러윈 밤에 내 여동생을 매우 겁먹게 했다.","answer":["frightened"],"hint":"과거시제 타동사"},{"sentence":"The little boy _____ _____ _____ the enormous dog in the park.","ko":"그 어린 소년은 공원에서 거대한 개에 겁먹었다.","answer":["was","frightened","by"],"hint":"수동태 + 전치사"}]},
    {"id":"w02351","w":"fate","pos":["n"],"ph":"/feɪt/","cefr":"B1","kr":["운명","숙명"],"ex":[{"en":"He accepted his fate without complaint.","ko":"그는 불평 없이 자신의 운명을 받아들였다."}],"mnemonic":{"soundHint":"페이트","story":"'페이(pay)+트!' 태어날 때 이미 지불된 값, 정해진 운명 = fate.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"destiny","ko":"운명","reason":"동의어 — 정해진 운명"},{"w":"choice","ko":"선택","reason":"반의어 — 운명 대 자유의지"},{"w":"fortune","ko":"행운/운","reason":"동의어 — 운수 개념 공유"}],"collocBest":[]},"nuance":{"koSimple":"피할 수 없는 정해진 운명.","whenToUse":"인생·결말이 이미 결정된 느낌일 때."},"krDetail":[{"ko":"운명","explain":"이미 정해져 있어 피할 수 없는 앞날"},{"ko":"숙명","explain":"타고나서 바꿀 수 없이 정해진 것"}],"usageExamples":[{"en":"A single decision can sometimes seal a person's fate forever.","ko":"단 하나의 결정이 때때로 한 사람의 운명을 영원히 결정지을 수 있다."},{"en":"Their fates were closely linked from the moment they first met.","ko":"그들의 운명은 처음 만난 순간부터 밀접하게 연결되어 있었다."}],"grammarNote":"fate는 보통 단수 명사로 쓰이지만, 여러 사람의 운명을 나타낼 때는 fates로 복수형이 가능하다. 학생들이 관사 사용을 자주 틀린다.","grammarQuiz":[{"sentence":"It seemed that _____ fates of the two families _____ tied together by ancient promises.","ko":"두 가문의 운명은 오래된 약속으로 함께 묶여 있는 것 같았다.","answer":["the","were"],"hint":"복수 주어와 정관사"}]},
    {"id":"w02522","w":"foam","pos":["n","v"],"ph":"/fəʊm/","cefr":"B1","kr":["거품","포말"],"ex":[{"en":"The waves left white foam.","ko":"파도가 흰 거품을 남겼다."}],"mnemonic":{"soundHint":"폼(foam) 클렌저의 그 폼, 세안 거품","story":"폼 클렌징 세안제에서 나오는 하얀 거품이 바로 foam","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bubble","ko":"거품","reason":"거품 이미지 동의어"},{"w":"shaving","ko":"면도","reason":"shaving foam 콜로케이션"}],"collocBest":[{"en":"shaving foam","ko":"면도 거품"},{"en":"foam at the mouth","ko":"입에 거품을 물다"}]},"nuance":{"koSimple":"파도·비누에서 생기는 하얀 거품","whenToUse":"공기가 섞여 뽀글뽀글 올라온 거품을 가리킬 때"},"krDetail":[{"ko":"거품","explain":"액체 위에 뜨는 작은 방울들의 덩어리"},{"ko":"포말","explain":"파도가 부서지며 생기는 하얀 물거품"}],"usageExamples":[{"en":"The barista foamed the milk to create a smooth latte.","ko":"바리스타는 부드러운 라떼를 만들기 위해 우유에 거품을 냈다."},{"en":"The soap foamed up quickly when I rubbed my hands together.","ko":"손을 비비자 비누에 금방 거품이 일었다."}],"grammarNote":"foam은 타동사(우유에 거품을 내다)와 자동사(스스로 거품이 일다) 모두 가능하며, 명사로는 셀 수 없는 명사이다.","grammarQuiz":[{"sentence":"The waves _____ _____ they crashed against the rocky shore.","ko":"파도가 바위 해안에 부딪히며 거품을 일으켰다.","answer":["foamed","as"],"hint":"동사 + 접속사"},{"sentence":"You should apply shaving _____ before using a razor on your face.","ko":"얼굴에 면도기를 사용하기 전에 면도 거품을 발라야 한다.","answer":["foam"],"hint":"명사 (셀 수 없음)"}]},
    {"id":"w02425","w":"filter","pos":["n","v"],"ph":"/ˈfɪltər/","cefr":"B1","kr":["여과기","필터링하다"],"ex":[{"en":"The water filter removes impurities.","ko":"정수 필터는 불순물을 제거한다."}],"mnemonic":{"soundHint":"필터","story":"'필터'는 한국어에서도 여과 장치로 쓰는 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"screen","ko":"거르다","reason":"동의어 — 걸러내는 기능"},{"w":"purify","ko":"정화하다","reason":"동의어 — 불순물 제거"},{"w":"sieve","ko":"체","reason":"동의어 — 걸러내는 도구"}],"collocBest":[{"en":"air filter","ko":"공기 필터"},{"en":"filter out","ko":"걸러내다"}]},"nuance":{"koSimple":"불순물을 걸러 내는 장치.","whenToUse":"정수기·공기청정기·SNS 필터 이야기할 때."},"krDetail":[{"ko":"여과기","explain":"찌꺼기를 걸러내는 도구"},{"ko":"거르다","explain":"찌꺼기나 필요 없는 것을 걸러내다"}],"usageExamples":[{"en":"The engineer designed a special filter to remove all impurities from the water.","ko":"그 기술자는 물에서 모든 불순물을 제거하는 특수 여과기를 설계했다."},{"en":"The software filters out spam emails before they reach your main inbox.","ko":"그 소프트웨어는 스팸 이메일이 주요 받은 편지함에 도달하기 전에 걸러낸다."}],"grammarNote":"filter out은 '~을 걸러내다'라는 뜻의 이어동사이다. 목적어가 대명사일 때는 filter it out처럼 반드시 이어동사 사이에 넣어야 한다.","grammarQuiz":[{"sentence":"When suspicious messages arrive, our advanced security system automatically filters _____ _____ within seconds.","ko":"의심스러운 메시지가 도착하면, 우리의 고급 보안 시스템은 자동으로 몇 초 안에 그것들을 걸러낸다.","answer":["them","out"],"hint":"이어동사 + 대명사 목적어 위치"}]},
    {"id":"w02470","w":"flame","pos":["n","v"],"ph":"/fleɪm/","cefr":"B1","kr":["불꽃","화염"],"ex":[{"en":"The candle flame flickered in the wind.","ko":"양초 불꽃이 바람에 깜박였다."}],"mnemonic":{"soundHint":"플레임","story":"'플~ 레임!' 화르륵 타오르는 불꽃 = flame.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fire","ko":"불","reason":"동의어 — 불꽃 개념"},{"w":"blaze","ko":"화염","reason":"동의어 — 강렬한 불"},{"w":"candle","ko":"양초","reason":"콜로 — 양초 불꽃"}],"collocBest":[]},"nuance":{"koSimple":"실제로 타오르는 뾰족한 불꽃.","whenToUse":"촛불·화재·격렬한 감정 표현에."},"krDetail":[{"ko":"불꽃","explain":"타오르는 불의 뾰족한 모양"},{"ko":"화염","explain":"크고 세게 타오르는 불"}],"usageExamples":[{"en":"The candle's small flame flickered gently in the cool evening breeze.","ko":"그 촛불의 작은 불꽃이 시원한 저녁 바람에 부드럽게 흔들렸다."},{"en":"The old building burst into flames within minutes after the fire started.","ko":"그 오래된 건물은 불이 시작된 후 몇 분 만에 불길에 휩싸였다."}],"grammarNote":"burst into flames는 '불길에 휩싸이다'라는 관용 표현으로 flames가 반드시 복수형이다. 학생들이 자주 flame(단수)으로 잘못 쓴다.","grammarQuiz":[{"sentence":"The abandoned warehouse suddenly _____ into flames, and firefighters arrived _____ the scene within ten minutes.","ko":"그 버려진 창고가 갑자기 불길에 휩싸였고, 소방관들이 10분 안에 현장에 도착했다.","answer":["burst","at"],"hint":"관용 표현 동사 + 장소 전치사"}]},
    {"id":"w02710","w":"gem","pos":["n"],"ph":"/dʒɛm/","cefr":"B1","kr":["보석","귀중한 것"],"ex":[{"en":"The crown was decorated with gems.","ko":"왕관은 보석으로 장식되었다."}],"mnemonic":{"soundHint":"젬 → '잼(반짝)' 빛나는 보석","story":"'젬~' 하고 반짝이는 보석.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"jewel","ko":"보석","reason":"동의어(귀중한 돌)"},{"w":"treasure","ko":"보물","reason":"동의어(귀중한 것)"}],"collocBest":[]},"nuance":{"koSimple":"반짝이는 값비싼 돌, 보석.","whenToUse":"반지·왕관 장식 또는 비유적 극찬에."},"krDetail":[{"ko":"보석","explain":"값이 매우 나가는 예쁜 돌"},{"ko":"귀중한 것","explain":"매우 소중해서 아끼는 것"}],"usageExamples":[{"en":"The jeweler set a precious gem into the silver ring.","ko":"보석상은 그 은반지에 귀한 보석 하나를 박았다."},{"en":"This little café is a hidden gem in the old town.","ko":"이 작은 카페는 구시가지에 숨겨진 보석이다."}],"grammarNote":"gem은 가산명사로 a gem, gems 형태로 쓴다. 학생들은 gemstone과 혼동해 관사를 빠뜨리거나, jewelry처럼 불가산명사로 착각하는 실수를 한다.","grammarQuiz":[{"sentence":"This novel is _____ hidden _____ of modern literature.","ko":"이 소설은 현대 문학의 숨겨진 보석이다.","answer":["a","gem"],"hint":"부정관사 + 명사"}]},
    {"id":"w02510","w":"flu","pos":["n"],"ph":"/fluː/","cefr":"B1","kr":["독감","인플루엔자"],"ex":[{"en":"He stayed home because he had the flu.","ko":"그는 독감에 걸려 집에 있었다."}],"mnemonic":{"soundHint":"인플루엔자","story":"'인플루엔자'의 줄임말, 한국에서도 그대로 사용","hintConfidence":3},"pairs":{"buddyWords":[{"w":"shot","ko":"주사","reason":"콜로 — 독감 예방주사"},{"w":"influenza","ko":"인플루엔자","reason":"동의어 — flu의 정식 명칭"},{"w":"illness","ko":"병","reason":"동의어 — 질병 개념"}],"collocBest":[{"en":"flu shot","ko":"독감 예방주사"},{"en":"stomach flu","ko":"위장 독감"}]},"nuance":{"koSimple":"열과 몸살을 동반한 감기 병.","whenToUse":"독감 시즌·예방 접종 이야기할 때."},"krDetail":[{"ko":"독감","explain":"심하게 앓는 감기 같은 병"},{"ko":"인플루엔자","explain":"바이러스로 걸리는 심한 감기"}],"usageExamples":[{"en":"Getting a flu shot every autumn can protect you from serious respiratory illnesses.","ko":"매년 가을 독감 예방주사를 맞는 것은 심각한 호흡기 질환으로부터 당신을 보호할 수 있다."},{"en":"She missed a whole week of school because she caught a bad case of the flu.","ko":"그녀는 심한 독감에 걸려서 학교를 한 주 내내 결석했다."}],"grammarNote":"flu는 특정 질병을 가리킬 때 정관사 the와 함께 the flu로 자주 쓰인다. catch the flu, have the flu 형태가 자주 출제된다.","grammarQuiz":[{"sentence":"Many elderly residents caught _____ flu during the harsh winter, _____ made hospitals extremely busy.","ko":"많은 노인 주민들이 혹독한 겨울 동안 독감에 걸렸고, 이는 병원들을 매우 바쁘게 만들었다.","answer":["the","which"],"hint":"정관사 + 관계대명사(계속적 용법)"}]},

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

/* ============================================================
   PARTICLES (Canvas)

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{ pool.push({ word:w, mode: modeOrder[i] }); });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}

  if(DATA.reviewTest && Array.isArray(DATA.advPool)) return shuffle([...DATA.advPool]);
  return [];
}

    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>

    answerHTML = `
      <div class="choices" id="choices">

      </div>`;
  } else if(mode === "rt-ex-mcq"){
    const s = state.quizCurrent.sentence;
    const bIdx = state.quizCurrent.blankTokenIdx;
    const toks = (function(str){
      const t = []; const re = /([A-Za-z']+)|([^A-Za-z']+)/g; let m;
      while((m = re.exec(str)) !== null){
        if(m[1]) t.push({ word:true, text:m[1] });
        else t.push({ word:false, text:m[2] });
      }
      return t;
    })(s.en);
    const displayEn = toks.map((t,i) => i === bIdx ? '_____' : t.text).join('');
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">📝 빈칸에 들어갈 단어는?</div>
        <div class="qkr" style="font-size:.9rem;opacity:.85;">${escape(s.ko)}</div>
        <div class="qword" style="font-size:1.05rem;line-height:1.55;letter-spacing:.01em;margin-top:8px;">${escape(displayEn)}</div>

        <div class="qkr">${escape(c.ko)}</div>

    answerHTML = `

  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    const sentHTML = tokens.map((t, i) => {

    promptHTML = `

}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

function finishSession(){

  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];

    state[clearFlag] = true;

  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)

  state.xpTotal += state.xp;

  overlay.className = 'hg-celebration';
  const sparkles = ['✨','🎉','🎊','⭐','💫','🌟','🎆','🎇','💥']
    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 6100);
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ko-KR'; u.rate = 0.98; u.pitch = 1.12; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ko = voices.find(v => /^ko/i.test(v.lang));
      if(ko) u.voice = ko;
      setTimeout(()=>speechSynthesis.speak(u), 400);
    }
  }catch(e){}
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);
  renderHeader();
  if(state.sfxOn){ getAC(); SFX.streak(); }
});
document.getElementById("cbBtn").addEventListener("click", ()=>{
  state.cbMode = !state.cbMode;
  lsSet(CB_KEY, state.cbMode);
  document.body.classList.toggle("cb-mode", state.cbMode);
  renderHeader();
});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
