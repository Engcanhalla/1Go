    {"id":"w04024","w":"marsh","pos":["n"],"ph":"/mɑːrʃ/","cefr":"B1","kr":["습지","늪"],"ex":[{"en":"Birds live near the marsh.","ko":"새들은 습지 근처에 산다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"swamp","ko":"늪","reason":"동의어 - 물이 고인 땅"},{"w":"wetland","ko":"습지","reason":"동의어 - 젖은 땅"},{"w":"bird","ko":"새","reason":"콜로케이션 - marsh bird"}],"collocBest":[{"en":"salt marsh","ko":"염습지"},{"en":"marsh bird","ko":"습지 새"}]},"nuance":{"koSimple":"물기가 많은 축축한 땅.","whenToUse":"습지 생태·철새 이야기에."},"krDetail":[{"ko":"습지","explain":"물이 늘 젖어 질퍽하게 고여 있는 땅"},{"ko":"늪","explain":"물풀이 자라는 진흙탕 같은 물웅덩이"}],"usageExamples":[{"en":"The marsh provides a home for many rare birds.","ko":"그 습지는 많은 희귀 새들의 보금자리를 제공한다."},{"en":"We walked carefully through the muddy marsh at dawn.","ko":"우리는 새벽에 진흙 습지를 조심스럽게 걸었다."}],"grammarNote":"marsh는 셀 수 있는 명사로 복수형은 marshes이다. 유사어 swamp(더 깊고 나무가 있는 늪)과 wetland(모든 젖은 땅의 총칭)와 뜻의 차이를 아는 것이 중요하다.","grammarQuiz":[{"sentence":"The team of scientists carefully explored several _____ to study rare birds _____ live only there.","ko":"그 과학자 팀은 오직 그곳에만 사는 희귀 새들을 연구하기 위해 여러 습지를 조심스럽게 탐사했다.","answer":["marshes","that"],"hint":"복수 명사와 주격 관계대명사"}]},
    {"id":"w04029","w":"marvelous","pos":["adj"],"ph":"/ˈmɑːrvələs/","cefr":"B1","kr":["놀라운","훌륭한","경이로운"],"ex":[{"en":"The marvelous sunset painted the sky in shades of orange and pink.","ko":"놀라운 일몰이 하늘을 주황색과 분홍색으로 물들였다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"wonderful","ko":"훌륭한","reason":"동의어 - 멋진"},{"w":"awful","ko":"끔찍한","reason":"반의어 - 놀라운 vs 끔찍한"},{"w":"amazing","ko":"놀라운","reason":"동의어 - 경이로운"}],"collocBest":[{"en":"marvelous achievement","ko":"놀라운 업적"},{"en":"marvelous view","ko":"훌륭한 경치"}]},"nuance":{"koSimple":"감탄이 나올 만큼 훌륭한.","whenToUse":"경치·성과에 감탄할 때."},"krDetail":[{"ko":"놀라운","explain":"보고 듣기에 매우 뛰어나 감탄이 나오는"},{"ko":"훌륭한","explain":"빼어나서 칭찬할 만한"},{"ko":"경이로운","explain":"믿기 힘들 만큼 놀랍고 대단한"}],"usageExamples":[{"en":"The chef created a marvelous meal for every guest.","ko":"그 요리사는 모든 손님을 위해 훌륭한 식사를 만들었다."},{"en":"Her performance was marvelous, receiving a standing ovation.","ko":"그녀의 공연은 놀라웠고 기립 박수를 받았다."}],"grammarNote":"marvelous는 이미 강한 뜻을 가진 '절대 형용사'이므로 very marvelous보다는 truly/absolutely marvelous가 자연스럽다. 부사형은 marvelously로 쓴다.","grammarQuiz":[{"sentence":"The young pianist performed _____ , receiving a truly _____ response from every member of the audience.","ko":"그 어린 피아니스트는 훌륭하게 연주했고, 관객 모두로부터 진정 놀라운 반응을 받았다.","answer":["marvelously","marvelous"],"hint":"부사와 형용사"}]},
    {"id":"w04033","w":"mass","pos":["n","adj"],"ph":"/mæs/","cefr":"B1","kr":["대량","질량"],"ex":[{"en":"A mass of people gathered.","ko":"많은 사람들이 모였다."}],"mnemonic":{"soundHint":"매스","story":"'매스컴(mass communication)' = 대중 매체. 매스 = 대중·대량.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bulk","ko":"대량","reason":"동의어 - 대량"},{"w":"media","ko":"매체","reason":"콜로케이션 - mass media"},{"w":"production","ko":"생산","reason":"콜로케이션 - mass production"}],"collocBest":[{"en":"mass production","ko":"대량 생산"},{"en":"mass media","ko":"대중 매체"}]},"nuance":{"koSimple":"한 덩어리 또는 대량.","whenToUse":"많은 양·대량 생산·대중을 말할 때."},"krDetail":[{"ko":"대량","explain":"아주 많은 양"},{"ko":"질량","explain":"물체가 지닌 물질의 양을 나타내는 값"}],"usageExamples":[{"en":"The factory produces mass quantities of cheap clothes.","ko":"그 공장은 값싼 옷을 대량으로 생산한다."},{"en":"The mass of the object stays the same on the moon.","ko":"그 물체의 질량은 달에서도 그대로 유지된다."}],"grammarNote":"mass는 형용사로 명사 앞에서 '대량의, 대중의'라는 뜻이며(mass media, mass production), 명사로 '질량'을 뜻할 때는 the mass of + 명사 구조로 자주 쓴다. weight(무게)와 혼동하지 말아야 한다.","grammarQuiz":[{"sentence":"The _____ media plays an important role because it reaches _____ number of people every day.","ko":"대중 매체는 매일 대규모의 사람들에게 도달하기 때문에 중요한 역할을 한다.","answer":["mass","a"],"hint":"형용사 mass와 부정관사"}]},
    {"id":"w04035","w":"massive","pos":["adj"],"ph":"/ˈmæsɪv/","cefr":"B1","kr":["거대한","엄청난"],"ex":[{"en":"There was a massive crowd.","ko":"거대한 군중이 있었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"huge","ko":"거대한","reason":"동의어 - 아주 큰"},{"w":"tiny","ko":"아주 작은","reason":"반의어 - 거대 vs 미세"},{"w":"enormous","ko":"엄청난","reason":"동의어 - 방대한"}],"collocBest":[{"en":"massive change","ko":"엄청난 변화"},{"en":"massive scale","ko":"거대한 규모"}]},"nuance":{"koSimple":"어마어마하게 큰.","whenToUse":"규모나 영향이 엄청날 때."},"krDetail":[{"ko":"거대한","explain":"크기가 아주 크고 우람한"},{"ko":"엄청난","explain":"정도가 지나칠 만큼 매우 큰"}],"usageExamples":[{"en":"A massive wave hit the coast during the storm.","ko":"폭풍 동안 거대한 파도가 해안을 덮쳤다."},{"en":"The new law caused a massive change in society.","ko":"새 법은 사회에 엄청난 변화를 일으켰다."}],"grammarNote":"massive는 형용사로 명사 앞과 서술 자리에 모두 자유롭게 쓰인다. 부사형 massively는 문장 강조에 쓰이지만 massively big처럼 다른 형용사 앞에서 쓸 때 남용하지 말아야 한다.","grammarQuiz":[{"sentence":"The earthquake caused _____ damage to buildings, and the recovery costs increased _____ over time.","ko":"그 지진은 건물에 엄청난 피해를 주었고, 복구 비용은 시간이 지나며 엄청나게 증가했다.","answer":["massive","massively"],"hint":"형용사와 부사"}]},
    {"id":"w04040","w":"mate","pos":["n","v"],"ph":"/meɪt/","cefr":"B1","kr":["친구","짝짓기하다"],"ex":[{"en":"He is my classmate.","ko":"그는 내 반 친구이다."}],"mnemonic":{"soundHint":"메이트","story":"'클래스메이트(classmate), 룸메이트(roommate)' = 반 친구, 방 친구.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"partner","ko":"파트너","reason":"동의어 - 짝"},{"w":"companion","ko":"동반자","reason":"동의어 - 친구"},{"w":"class","ko":"반","reason":"콜로케이션 - classmate"}],"collocBest":[{"en":"classmate","ko":"반 친구"},{"en":"mate with","ko":"짝짓기하다"}]},"nuance":{"koSimple":"함께하는 짝·친구.","whenToUse":"동료, 반 친구, 동물의 짝짓기를 말할 때."},"krDetail":[{"ko":"친구","explain":"가까이 지내며 서로 도우며 어울리는 사람"},{"ko":"짝짓기하다","explain":"동물이 새끼를 얻기 위해 암수가 어울리다"}],"usageExamples":[{"en":"He has been my best mate since kindergarten days.","ko":"그는 유치원 시절부터 나의 가장 친한 친구이다."},{"en":"Many birds mate for life in the wild.","ko":"많은 새들은 야생에서 평생 한 짝과 짝짓기한다."}],"grammarNote":"mate는 영국식 영어에서 특히 '친구'로 자주 쓰이며 미국식 영어에서는 buddy/friend를 선호한다. 동사로 쓸 때 mate with + 상대 구조를 취하고, 사람에게 쓰면 무례하게 들릴 수 있다.","grammarQuiz":[{"sentence":"My old _____ from school and I watched swans _____ near the peaceful lake yesterday afternoon.","ko":"학교 시절 오랜 친구와 나는 어제 오후 평화로운 호수 근처에서 백조들이 짝짓기하는 것을 지켜보았다.","answer":["mate","mate"],"hint":"명사 '친구'와 동사원형 '짝짓기하다'"}]},
    {"id":"w04047","w":"mature","pos":["adj","v"],"ph":"/məˈtjʊər/","cefr":"B1","kr":["성숙한","성숙하다"],"ex":[{"en":"She is very mature for her age.","ko":"그녀는 나이에 비해 매우 성숙하다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"adult","ko":"성인","reason":"동의어 - 성숙한 사람"},{"w":"immature","ko":"미성숙한","reason":"반의어 - 성숙 vs 미성숙"},{"w":"developed","ko":"발달한","reason":"동의어 - 성장한"}],"collocBest":[{"en":"mature decision","ko":"성숙한 결정"},{"en":"mature student","ko":"성인 학생"}]},"nuance":{"koSimple":"몸·마음이 다 자란.","whenToUse":"생각·행동이 어른스러움을 말할 때."},"krDetail":[{"ko":"성숙한","explain":"몸과 마음이 자라 어른스러운"},{"ko":"성숙하다","explain":"자라나 다 자란 상태에 이르다"}],"usageExamples":[{"en":"She made a mature decision about her future career.","ko":"그녀는 자신의 미래 직업에 대해 성숙한 결정을 내렸다."},{"en":"The wine matures for ten years in oak barrels.","ko":"그 와인은 참나무 통에서 10년간 숙성된다."}],"grammarNote":"mature는 형용사와 자동사로 모두 쓰인다. 형용사 비교급/최상급은 more mature/most mature 형태가 표준이며 maturer는 잘 쓰이지 않는다.","grammarQuiz":[{"sentence":"He seems much _____ _____ than his younger brother despite being only two years older than him.","ko":"그는 두 살밖에 많지 않은데도 남동생보다 훨씬 더 성숙해 보인다.","answer":["more","mature"],"hint":"비교급 표시어와 형용사"}]},
    {"id":"w04049","w":"maximum","pos":["n","adj"],"ph":"/ˈmæksɪməm/","cefr":"B1","kr":["최대","최대의"],"ex":[{"en":"The maximum speed is 100km/h.","ko":"최대 속도는 시속 100km이다."}],"mnemonic":{"soundHint":"맥시멈","story":"'맥시멈(maximum)' = 최대치. 볼륨 맥시멈 = 최대 음량.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"peak","ko":"정점","reason":"동의어 - 최대점"},{"w":"minimum","ko":"최소","reason":"반의어 - 최대 vs 최소"},{"w":"highest","ko":"최고의","reason":"동의어 - 가장 높은"}],"collocBest":[{"en":"maximum speed","ko":"최대 속도"},{"en":"at maximum","ko":"최대로"}]},"nuance":{"koSimple":"허용되는 가장 큰 값.","whenToUse":"속도·인원·용량의 최대치를 말할 때."},"krDetail":[{"ko":"최대","explain":"더 이상 크거나 많을 수 없는 한계"},{"ko":"최대의","explain":"가장 크거나 가장 많은 정도의"}],"usageExamples":[{"en":"The car reaches a maximum speed of 300 km per hour.","ko":"그 차는 시속 300km의 최고 속도에 도달한다."},{"en":"The theater holds a maximum of five hundred people.","ko":"그 극장은 최대 500명을 수용한다."}],"grammarNote":"maximum은 명사와 형용사로 모두 쓰이며 반대말은 minimum이다. a maximum of + 수치 구조가 자주 쓰이며, at maximum('최대로')과 at the maximum('그 최대치에서')은 의미가 미묘하게 다르다.","grammarQuiz":[{"sentence":"The elevator can carry a _____ _____ ten people, and going over that number is dangerous.","ko":"그 승강기는 최대 10명을 실을 수 있으며, 그 수를 넘기는 것은 위험하다.","answer":["maximum","of"],"hint":"명사와 전치사"}]},
    {"id":"w04053","w":"maze","pos":["n"],"ph":"/meɪz/","cefr":"B1","kr":["미로","복잡한 상황"],"ex":[{"en":"The children got lost in the corn maze at the farm.","ko":"아이들은 농장의 옥수수 미로에서 길을 잃었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"labyrinth","ko":"미궁","reason":"동의어 - 복잡한 미로"},{"w":"puzzle","ko":"퍼즐","reason":"동의어 - 복잡한 문제"},{"w":"navigate","ko":"헤쳐나가다","reason":"콜로케이션 - navigate a maze"}],"collocBest":[{"en":"navigate a maze","ko":"미로를 헤쳐나가다"},{"en":"complex maze","ko":"복잡한 미로"}]},"nuance":{"koSimple":"길이 얽힌 미로.","whenToUse":"실제 미로나 복잡한 상황을 비유할 때."},"krDetail":[{"ko":"미로","explain":"길이 많이 갈라져 빠져나가기 어려운 곳"},{"ko":"복잡한 상황","explain":"얽히고설켜 풀기 어려운 형편"}],"usageExamples":[{"en":"The children explored a huge maze in the garden.","ko":"아이들은 정원에 있는 커다란 미로를 탐험했다."},{"en":"The legal system feels like a maze to new lawyers.","ko":"새 변호사들에게 법 제도는 미로처럼 느껴진다."}],"grammarNote":"maze는 셀 수 있는 명사로 복수형 mazes를 쓴다. 동음이의어 maize('옥수수')와 발음이 같으므로 문맥으로만 구별해야 하며, 관용구 in a maze of + 명사('~의 미로 속에서')로 자주 쓰인다.","grammarQuiz":[{"sentence":"The new employee felt lost _____ a _____ of confusing rules during his very first week at work.","ko":"그 신입 사원은 직장에서의 첫 주 동안 혼란스러운 규칙의 미로 속에서 길을 잃은 기분이었다.","answer":["in","maze"],"hint":"전치사와 명사"}]},
    {"id":"w04055","w":"meadow","pos":["n"],"ph":"/ˈmedoʊ/","cefr":"B1","kr":["초원","목초지"],"ex":[{"en":"Wildflowers bloomed across the green meadow in spring.","ko":"봄에 초원 전체에 야생화가 피었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"field","ko":"들판","reason":"동의어 - 풀밭"},{"w":"pasture","ko":"목초지","reason":"동의어 - 가축 방목지"},{"w":"grassland","ko":"초원","reason":"동의어 - 풀 지대"}],"collocBest":[{"en":"green meadow","ko":"푸른 초원"},{"en":"flower meadow","ko":"꽃 초원"}]},"nuance":{"koSimple":"풀이 자라는 넓은 들판.","whenToUse":"봄철 야생화 핀 초원 묘사할 때."},"krDetail":[{"ko":"초원","explain":"풀이 넓게 자라 있는 벌판"},{"ko":"목초지","explain":"가축이 풀을 뜯도록 마련한 풀밭"}],"usageExamples":[{"en":"Cows grazed peacefully on the green meadow.","ko":"젖소들이 푸른 초원에서 평화롭게 풀을 뜯었다."},{"en":"Wildflowers cover the meadow every spring morning.","ko":"매년 봄 아침에 야생화가 초원을 덮는다."}],"grammarNote":"meadow는 셀 수 있는 명사이며 복수형은 meadows이다. 유사어 field(경작지도 포함), pasture(가축 방목 전용), grassland(더 넓은 초원 지역)와 미묘한 차이를 구별해야 한다.","grammarQuiz":[{"sentence":"Beautiful wildflowers _____ across the wide _____ every single spring after the winter snow melted.","ko":"겨울눈이 녹은 뒤 매년 봄마다 아름다운 야생화가 넓은 초원을 뒤덮었다.","answer":["spread","meadow"],"hint":"과거형 자동사와 명사"}]},
    {"id":"w04061","w":"meaningful","pos":["adj"],"ph":"/ˈmiːnɪŋfʊl/","cefr":"B1","kr":["의미 있는","중요한"],"ex":[{"en":"Have a meaningful conversation.","ko":"의미 있는 대화를 나눠라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"significant","ko":"중요한","reason":"동의어 - 의미 있는"},{"w":"meaningless","ko":"무의미한","reason":"반의어 - 의미 있음 vs 없음"},{"w":"purposeful","ko":"목적 있는","reason":"동의어 - 뜻 있는"}],"collocBest":[{"en":"meaningful relationship","ko":"의미 있는 관계"},{"en":"meaningful work","ko":"의미 있는 일"}]},"nuance":{"koSimple":"뭔가 뜻이 담긴.","whenToUse":"가치 있고 알찬 대화·활동을 말할 때."},"krDetail":[{"ko":"의미 있는","explain":"속뜻이 있고 값어치가 큰"},{"ko":"중요한","explain":"무겁게 여겨져 크게 마음 써야 할 만한"}],"usageExamples":[{"en":"The volunteers do meaningful work for the community.","ko":"자원봉사자들은 지역 사회를 위해 의미 있는 일을 한다."},{"en":"She built a meaningful relationship with her mentor.","ko":"그녀는 멘토와 의미 있는 관계를 쌓았다."}],"grammarNote":"meaningful은 형용사로 -ful로 끝나므로 부사형은 meaningfully이다. 반대말 meaningless도 자주 나오며 more meaningful/most meaningful로 비교급을 표시한다.","grammarQuiz":[{"sentence":"Every conversation with her grandmother was _____ , and she listened _____ to every single word.","ko":"할머니와의 모든 대화는 의미 있었고, 그녀는 모든 말을 의미 있게 귀담아 들었다.","answer":["meaningful","meaningfully"],"hint":"형용사와 부사"}]},
    {"id":"w04062","w":"means","pos":["n"],"ph":"/miːnz/","cefr":"B1","kr":["수단","방법"],"ex":[{"en":"Use all means possible.","ko":"가능한 모든 수단을 사용해라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"method","ko":"방법","reason":"동의어 - 방식"},{"w":"way","ko":"방식","reason":"동의어 - 수단"},{"w":"transport","ko":"교통","reason":"콜로케이션 - means of transport"}],"collocBest":[{"en":"by all means","ko":"어떻게든"},{"en":"means of transport","ko":"교통 수단"}]},"nuance":{"koSimple":"목표에 이르는 수단.","whenToUse":"교통·통신 등 방법을 격식 있게 말할 때."},"krDetail":[{"ko":"수단","explain":"어떤 일을 이루기 위해 쓰는 도구나 방법"},{"ko":"방법","explain":"일을 해내는 정해진 길이나 절차"}],"usageExamples":[{"en":"The internet is a powerful means of communication.","ko":"인터넷은 강력한 의사소통 수단이다."},{"en":"They found new means to reduce the pollution.","ko":"그들은 오염을 줄일 새 방법을 찾았다."}],"grammarNote":"means는 단수와 복수가 형태가 같으므로 A/many means로 모두 가능하다. by no means는 '결코 ~아닌'이라는 강한 부정을 뜻하는 관용구로 자주 시험에 나온다.","grammarQuiz":[{"sentence":"Buses and trains are efficient _____ of transport, but they are _____ no means always on time.","ko":"버스와 기차는 효율적인 교통수단이지만 결코 항상 정시인 것은 아니다.","answer":["means","by"],"hint":"명사와 관용구 전치사"}]},
    {"id":"w04063","w":"meanwhile","pos":["adv"],"ph":"/ˈmiːnwaɪl/","cefr":"B1","kr":["그동안","한편"],"ex":[{"en":"Meanwhile others waited outside.","ko":"그동안 다른 사람들은 밖에서 기다렸다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"meantime","ko":"그동안","reason":"동의어 - 사이에"},{"w":"simultaneously","ko":"동시에","reason":"동의어 - 한편"},{"w":"however","ko":"한편","reason":"시나리오 - 대조 전환"}],"collocBest":[{"en":"in the meanwhile","ko":"그동안"},{"en":"meanwhile back","ko":"한편으로는"}]},"nuance":{"koSimple":"그 사이·다른 한편.","whenToUse":"동시에 다른 일이 벌어질 때 이어주는 말로."},"krDetail":[{"ko":"그동안","explain":"다른 일이 일어나는 사이의 시간에"},{"ko":"한편","explain":"다른 쪽에서 함께 벌어지는 일을 이어 말할 때"}],"usageExamples":[{"en":"Mom cooked dinner; meanwhile, Dad set the table.","ko":"엄마는 저녁을 요리하고 있었고, 그동안 아빠는 상을 차렸다."},{"en":"She studied hard; meanwhile, her friends went out.","ko":"그녀는 열심히 공부했고, 한편 친구들은 나가 놀았다."}],"grammarNote":"meanwhile은 접속부사이므로 두 문장을 연결할 때 세미콜론이나 마침표 뒤에 써야 하며, 쉼표 하나로 두 절을 잇는 comma splice 오류를 피해야 한다.","grammarQuiz":[{"sentence":"The teacher explained the lesson _____ the students took careful notes about every important point in class.","ko":"선생님이 수업을 설명했고, 그동안 학생들은 수업의 모든 중요한 점을 꼼꼼히 필기했다.","answer":["while","meanwhile"],"hint":"종속접속사와 접속부사(둘 중 문맥상 하나만 사용)"}]},
    {"id":"w04066","w":"measurement","pos":["n"],"ph":"/ˈmeʒərmənt/","cefr":"B1","kr":["측정","측정값"],"ex":[{"en":"Take exact measurements.","ko":"정확한 측정값을 취해라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"gauge","ko":"측정기","reason":"동의어 - 측정 도구"},{"w":"dimension","ko":"치수","reason":"동의어 - 측정된 크기"},{"w":"accurate","ko":"정확한","reason":"콜로케이션 - accurate measurement"}],"collocBest":[{"en":"accurate measurement","ko":"정확한 측정"},{"en":"take measurements","ko":"측정하다"}]},"nuance":{"koSimple":"재어서 얻은 값.","whenToUse":"길이·무게·치수를 잴 때."},"krDetail":[{"ko":"측정","explain":"길이나 크기를 재어 값으로 나타내는 일"},{"ko":"측정값","explain":"재어서 얻은 실제 숫자"}],"usageExamples":[{"en":"Accurate measurement is essential in scientific experiments.","ko":"정확한 측정은 과학 실험에 꼭 필요하다."},{"en":"The tailor took careful measurements before making the suit.","ko":"그 재단사는 정장을 만들기 전에 신중히 치수를 쟀다."}],"grammarNote":"measurement는 셀 수 있는 명사로 '측정값'을 뜻할 때 흔히 복수 measurements를 쓴다(예: take measurements). 셀 수 없는 뜻('측정 행위')일 때는 단수를 유지한다.","grammarQuiz":[{"sentence":"The tailor carefully took her _____ before beginning to design the beautiful new dress _____ her wedding.","ko":"그 재단사는 그녀의 결혼식을 위한 아름다운 새 드레스를 디자인하기 전에 신중히 치수를 쟀다.","answer":["measurements","for"],"hint":"복수 명사와 전치사"}]},
    {"id":"w04068","w":"mechanic","pos":["n"],"ph":"/məˈkænɪk/","cefr":"B1","kr":["기계공","정비사"],"ex":[{"en":"The mechanic fixed my car in two hours.","ko":"정비사가 두 시간 만에 내 차를 고쳤다."}],"mnemonic":{"soundHint":"메카닉","story":"'메카닉(mechanic)' = 게임·자동차 정비 캐릭터로 익숙한 외래어.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"technician","ko":"기술자","reason":"동의어 - 기술 담당"},{"w":"engineer","ko":"엔지니어","reason":"동의어 - 기계 담당"},{"w":"auto","ko":"자동차의","reason":"콜로케이션 - auto mechanic"}],"collocBest":[{"en":"auto mechanic","ko":"자동차 정비사"},{"en":"skilled mechanic","ko":"숙련된 기계공"}]},"nuance":{"koSimple":"기계·차를 고치는 사람.","whenToUse":"자동차 정비소·수리 상황에."},"krDetail":[{"ko":"기계공","explain":"기계를 다루고 고치는 일을 하는 사람"},{"ko":"정비사","explain":"탈것이나 기계가 잘 돌아가도록 손보는 사람"}],"usageExamples":[{"en":"The mechanic quickly fixed the broken engine of my car.","ko":"그 정비사는 내 차의 고장 난 엔진을 재빠르게 수리했다."},{"en":"A skilled mechanic diagnoses car problems in minutes.","ko":"숙련된 기계공은 차량 문제를 몇 분 안에 진단한다."}],"grammarNote":"mechanic(기계공)과 mechanics(역학, 학문)는 형태와 뜻이 다르므로 헷갈리지 말아야 한다. 형용사 mechanical('기계적인')과 부사 mechanically('기계적으로')도 함께 익혀야 한다.","grammarQuiz":[{"sentence":"The car _____ studied _____ in college before opening his own auto repair shop last year.","ko":"그 자동차 정비사는 작년에 자신의 자동차 수리점을 열기 전에 대학에서 역학을 공부했다.","answer":["mechanic","mechanics"],"hint":"사람 명사와 학문 명사"}]},
    {"id":"w04074","w":"medication","pos":["n"],"ph":"/ˌmedɪˈkeɪʃən/","cefr":"B1","kr":["약물","투약"],"ex":[{"en":"Take your medication daily.","ko":"매일 약을 복용해라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"medicine","ko":"약","reason":"동의어 - 약물"},{"w":"drug","ko":"약","reason":"동의어 - 처방약"},{"w":"prescription","ko":"처방","reason":"콜로케이션 - prescription medication"}],"collocBest":[{"en":"take medication","ko":"약을 복용하다"},{"en":"prescription medication","ko":"처방 약물"}]},"nuance":{"koSimple":"병 치료를 위해 먹는 약.","whenToUse":"처방 받은 약이나 복용 지시를 말할 때."},"krDetail":[{"ko":"약물","explain":"병을 고치기 위해 몸에 넣는 성분"},{"ko":"투약","explain":"환자에게 약을 주거나 먹이는 일"}],"usageExamples":[{"en":"The doctor prescribed medication for her high blood pressure.","ko":"의사는 그녀의 고혈압을 위해 약물을 처방했다."},{"en":"He takes daily medication to control his allergies.","ko":"그는 알레르기를 조절하기 위해 매일 약을 복용한다."}],"grammarNote":"medication은 보통 셀 수 없는 명사로 쓰지만, 여러 종류의 약을 가리킬 때 medications로 복수형이 쓰인다. take medication처럼 무관사 관용 표현이 자주 등장한다.","grammarQuiz":[{"sentence":"The patient must _____ this _____ three times a day with meals for the best possible results.","ko":"그 환자는 최상의 결과를 위해 식사와 함께 하루 세 번 이 약을 복용해야 한다.","answer":["take","medication"],"hint":"관용 동사 take와 무관사 명사"}]},
    {"id":"w04083","w":"mellow","pos":["adj","v"],"ph":"/ˈmeloʊ/","cefr":"B1","kr":["부드러운","온화한","숙성된"],"ex":[{"en":"His personality became more mellow as he grew older and wiser.","ko":"나이가 들고 현명해지면서 그의 성격은 더 온화해졌다."}],"mnemonic":{"soundHint":"멜로우","story":"'멜로우(mellow)한 재즈' = 부드럽고 편안한 재즈. 음악 용어로 사용.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"gentle","ko":"부드러운","reason":"동의어 - 온화한"},{"w":"harsh","ko":"거친","reason":"반의어 - 부드러움 vs 거침"},{"w":"relaxed","ko":"느긋한","reason":"동의어 - 여유로운"}],"collocBest":[{"en":"mellow voice","ko":"부드러운 목소리"},{"en":"mellow atmosphere","ko":"온화한 분위기"}]},"nuance":{"koSimple":"부드럽고 편안한.","whenToUse":"목소리·성격·분위기가 온화할 때."},"krDetail":[{"ko":"부드러운","explain":"사납지 않고 매끄러이 순한"},{"ko":"온화한","explain":"성질이나 분위기가 따뜻하고 차분한"},{"ko":"숙성된","explain":"오래되어 맛이나 향이 깊어진"}],"usageExamples":[{"en":"She has a mellow voice that soothes every listener.","ko":"그녀는 모든 청중을 편안하게 하는 부드러운 목소리를 지녔다."},{"en":"The old wine has a mellow flavor after twenty years.","ko":"그 오래된 와인은 20년이 지나 부드러운 풍미가 났다."}],"grammarNote":"mellow는 형용사와 동사(자·타동사)로 모두 쓰인다. mellow out은 구어체로 '느긋해지다'라는 뜻이며, 학생들은 mellow를 명사로 잘못 쓰는 실수를 하곤 한다.","grammarQuiz":[{"sentence":"As people grow older, they often _____ out and develop a more _____ approach to daily life problems.","ko":"사람들은 나이가 들면서 종종 마음이 느긋해지고 일상 문제에 대해 더 온화한 태도를 지니게 된다.","answer":["mellow","mellow"],"hint":"동사 mellow와 형용사"}]},
    {"id":"w04084","w":"melody","pos":["n"],"ph":"/ˈmelədi/","cefr":"B1","kr":["선율","멜로디"],"ex":[{"en":"The melody of the song stayed in her head all day.","ko":"노래의 선율이 하루 종일 그녀의 머릿속에 맴돌았다."}],"mnemonic":{"soundHint":"멜로디","story":"'멜로디(melody)' = 노래의 선율. 외래어 그대로 사용.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tune","ko":"곡조","reason":"동의어 - 선율"},{"w":"song","ko":"노래","reason":"시나리오 - 노래의 선율"},{"w":"catchy","ko":"귀에 쏙 들어오는","reason":"콜로케이션 - catchy melody"}],"collocBest":[{"en":"catchy melody","ko":"귀에 쏙 들어오는 선율"},{"en":"beautiful melody","ko":"아름다운 선율"}]},"nuance":{"koSimple":"노래의 흐르는 가락.","whenToUse":"노래·연주의 곡조를 말할 때."},"krDetail":[{"ko":"선율","explain":"높낮이와 길이가 어우러져 이루는 노랫가락"},{"ko":"멜로디","explain":"귀에 남는 음의 흐름"}],"usageExamples":[{"en":"The song has a catchy melody that everyone remembers.","ko":"그 노래는 모두가 기억하는 귀에 쏙 들어오는 선율을 지녔다."},{"en":"She hummed a beautiful melody while doing the dishes.","ko":"그녀는 설거지를 하며 아름다운 선율을 흥얼거렸다."}],"grammarNote":"melody는 셀 수 있는 명사로 복수형은 melodies이다. 형용사형 melodic(선율의)와 melodious(선율이 아름다운)의 뜻 차이를 익혀야 한다.","grammarQuiz":[{"sentence":"The composer wrote several beautiful _____ that were both _____ and easy to remember for young singers.","ko":"그 작곡가는 어린 가수들에게 선율이 아름답고 기억하기 쉬운 여러 아름다운 선율을 작곡했다.","answer":["melodies","melodious"],"hint":"복수 명사와 형용사"}]},
    {"id":"w03790","w":"lecture","pos":["n","v"],"ph":"/ˈlektʃər/","cefr":"B1","kr":["강의","강연"],"ex":[{"en":"The professor gave an interesting lecture today.","ko":"교수님이 오늘 흥미로운 강의를 하셨다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"talk","ko":"강연","reason":"동의어, 공식 발표 문맥 공유"},{"w":"speech","ko":"연설","reason":"동의어, lecture와 대체 가능"},{"w":"professor","ko":"교수","reason":"professor gives a lecture 시나리오"}],"collocBest":[{"en":"attend a lecture","ko":"강의에 참석하다"},{"en":"lecture hall","ko":"강의실"}]},"nuance":{"koSimple":"긴 시간 이어지는 전문 강의.","whenToUse":"대학·전문가 강연을 말할 때."},"krDetail":[{"ko":"강의","explain":"지식을 풀어 가르치는 말"},{"ko":"강연","explain":"여러 사람 앞 이야기"}],"usageExamples":[{"en":"Many students attended the professor's lecture yesterday.","ko":"많은 학생들이 어제 그 교수의 강의에 참석했다."},{"en":"The lecture hall was completely full.","ko":"강의실이 완전히 가득 찼다."}],"grammarNote":"lecture는 셀 수 있는 명사여서 관사 a를 붙이거나 복수형 lectures로 써야 한다.","grammarQuiz":[{"sentence":"About 200 students _____ the special _____ on climate change yesterday.","ko":"약 200명의 학생들이 어제 기후 변화에 관한 특별 강의에 참석했다.","answer":["attended","lecture"],"hint":"타동사 과거형 + 단수 가산명사"}]},
    {"id":"w03654","w":"junior","pos":["adj","n"],"ph":"/ˈdʒuːniər/","cefr":"B1","kr":["연하의","하급자"],"ex":[{"en":"He is a junior employee at the firm.","ko":"그는 회사의 하급 직원이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"younger","ko":"더 어린","reason":"동의어"},{"w":"senior","ko":"선배","reason":"반의어"},{"w":"rookie","ko":"신참","reason":"하급자와 어울리는 시나리오"}],"collocBest":[{"en":"junior high school","ko":"중학교"},{"en":"junior member","ko":"하급 회원"}]},"nuance":{"koSimple":"나이·경력이 아래인 사람.","whenToUse":"연하·후배·하급 직원을 말할 때."},"krDetail":[{"ko":"연하의","explain":"나이가 더 어린"},{"ko":"하급자","explain":"직급이나 지위가 낮은 사람"}],"usageExamples":[{"en":"He is junior to me by three years.","ko":"그는 나보다 세 살 어리다."},{"en":"The junior workers helped the senior team.","ko":"하급 직원들이 선임 팀을 도왔다."}],"grammarNote":"junior는 비교 대상 뒤에 than이 아닌 to를 쓴다(junior to me). 학생들이 'younger than'과 헷갈려 'junior than'으로 잘못 쓰는 실수가 흔하다.","grammarQuiz":[{"sentence":"My brother is junior _____ me _____ two years in age.","ko":"내 남동생은 나보다 두 살 어리다.","answer":["to","by"],"hint":"junior to + 차이 by"},{"sentence":"Junior staff members _____ trained _____ the senior manager last week.","ko":"하급 직원들은 지난주에 선임 관리자에게 훈련받았다.","answer":["were","by"],"hint":"수동태 + 행위자"}]},
    {"id":"w03542","w":"investment","pos":["n"],"ph":"/ɪnˈvestmənt/","cefr":"B1","kr":["투자","투자금"],"ex":[{"en":"The company made a large investment in new technology.","ko":"그 회사는 새로운 기술에 큰 투자를 했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"funding","ko":"자금 지원","reason":"동의어 - 투자금"},{"w":"return","ko":"수익","reason":"콜로 - return on investment"},{"w":"invest","ko":"투자하다","reason":"시나리오 - 명사와 동사 관계"}],"collocBest":[{"en":"return on investment","ko":"투자 수익"},{"en":"long-term investment","ko":"장기 투자"}]},"nuance":{"koSimple":"미래 위해 붓는 돈·노력.","whenToUse":"주식·부동산·시간 투자 얘기."},"krDetail":[{"ko":"돈이나 시간을 미리 넣는 일","explain":"'투자(投資)'는 이익을 얻기 위해 돈이나 시간을 미리 들이는 행위를 뜻해요."},{"ko":"투자한 돈","explain":"'투자금(投資金)'은 어떤 사업이나 물건에 투자한 돈을 말해요."}],"usageExamples":[{"en":"Buying a house is a long-term investment for many people.","ko":"집을 사는 것은 많은 사람들에게 장기 투자이다."},{"en":"The company made a huge investment in new technology.","ko":"그 회사는 새로운 기술에 큰 투자를 했다."}],"grammarNote":"'make an investment in + 명사'는 '~에 투자하다'라는 표현이에요. 동사 'invest'와 명사 'investment' 모두 전치사 'in'과 함께 쓰이는 점을 기억하세요.","grammarQuiz":[{"sentence":"Education is the best _____ _____ your child's future.","ko":"교육은 자녀의 미래에 대한 최고의 투자이다.","answer":["investment","in"],"hint":"투자 명사 + 대상 전치사"}]},

    {"id":"w03231","w":"incident","pos":["n"],"ph":"/ˈɪnsɪdənt/","cefr":"B1","kr":["사건","사고"],"ex":[{"en":"Report any incident immediately.","ko":"어떤 사건이든 즉시 신고하라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"accident","ko":"사고","reason":"incident와 함께 사건·사고 뉴스에서 짝으로 등장"},{"w":"report","ko":"신고하다","reason":"report an incident 콜로케이션의 짝"},{"w":"witness","ko":"목격자","reason":"사건 현장 시나리오에서 필수"}],"collocBest":[{"en":"serious incident","ko":"심각한 사건"},{"en":"report an incident","ko":"사건을 신고하다"}]},"nuance":{"koSimple":"일어난 하나의 사건이나 사고.","whenToUse":"뉴스·보고서에서 사건 하나를 가리킬 때."},"krDetail":[{"ko":"사건","explain":"평소와 다르게 일어난 일로, 사람들의 관심을 끌거나 문제가 될 수 있는 어떤 일"},{"ko":"사고","explain":"뜻하지 않게 갑자기 일어난 좋지 않은 일로, 다치거나 손해를 입히는 뜻밖의 일"}],"usageExamples":[{"en":"The police officer carefully reported the strange incident to headquarters.","ko":"그 경찰관은 이상한 사건을 본부에 조심스럽게 보고했다."},{"en":"A small incident on the road caused a huge traffic jam this morning.","ko":"도로 위의 작은 사고 하나가 오늘 아침 엄청난 교통 체증을 일으켰다."}],"grammarNote":"incident는 셀 수 있는 명사(가산명사)이므로 단수일 때 반드시 관사 a/an 또는 the가 필요합니다. 학생들은 자주 'report incident'처럼 관사 없이 쓰는 실수를 합니다. 'report an incident'가 맞습니다.","grammarQuiz":[{"sentence":"Nobody was hurt in the _____, but the whole neighborhood _____ shocked for days.","ko":"그 사건에서 아무도 다치지 않았지만, 온 동네가 며칠 동안 충격에 빠져 있었다.","answer":["incident","was"],"hint":"명사+과거 be동사"}]},
    {"id":"w03699","w":"kneel","pos":["v"],"ph":"/niːl/","cefr":"B1","kr":["무릎 꿇다"],"ex":[{"en":"He knelt down to pray sincerely.","ko":"그는 진심으로 기도하기 위해 무릎을 꿇었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"bow","ko":"절하다","reason":"동의어"},{"w":"stand","ko":"서다","reason":"반의어"},{"w":"prayer","ko":"기도","reason":"무릎 꿇는 대표 상황"}],"collocBest":[{"en":"kneel down","ko":"무릎을 꿇다"},{"en":"kneel in prayer","ko":"기도하며 무릎 꿇다"}]},"nuance":{"koSimple":"무릎을 바닥에 대고 앉는.","whenToUse":"기도·간청·예의를 표할 때."},"krDetail":[{"ko":"무릎 꿇다","explain":"무릎을 바닥에 대고 앉거나 굽히다"}],"usageExamples":[{"en":"He knelt to tie his shoelaces.","ko":"그는 신발끈을 묶으려고 무릎을 꿇었다."},{"en":"She knelt down beside the child.","ko":"그녀는 아이 옆에 무릎을 꿇었다."}],"grammarNote":"kneel의 과거·과거분사는 knelt(영국식)와 kneeled(미국식) 둘 다 가능하지만 시험에서는 knelt를 표준으로 쓴다. 학생들이 'kneeled'만 답으로 여긴다.","grammarQuiz":[{"sentence":"The old woman _____ down _____ pray in front of the altar.","ko":"그 노부인은 제단 앞에 무릎을 꿇고 기도했다.","answer":["knelt","to"],"hint":"kneel 과거형 + to부정사"},{"sentence":"The soldiers _____ kneeling _____ the ceremony began this morning.","ko":"군인들은 오늘 아침 예식이 시작되었을 때 무릎을 꿇고 있었다.","answer":["were","when"],"hint":"과거진행 + 접속사"}]},

function getWordStat(id){

function setWordStat(id, patch){

function promoteBox(id){
  const s = getWordStat(id);

}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){

        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,

    } else if(kind === "reel-spin-small"){

          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });

    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });

    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,

        });
      }

      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){

              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){

  const m = Math.floor(s/60), r = s%60;

}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){

  // 셔플

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

  state.quizPool = buildAdvancedPool();

function startBasicRetryWrong(){
  const wrongPool = shuffle([...state.quizWrongItems]);
  if(!wrongPool.length){ renderHome(); return; }
  state.phase = "quiz";
  state.quizType = "basic";
  state.quizPool = wrongPool;
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  state.sessionElapsedBase = (state.sessionElapsedBase || 0) + (Date.now() - state.startTime);
  state.startTime = Date.now();
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perChapterMaxStreak = 0;
  startTimer();
  renderQuiz();
}

/* 심화 — 틀린 문제만 재도전 (시간은 리셋 없이 누적) */
function startAdvancedRetryWrong(){
  const wrongPool = shuffle([...state.quizWrongItems]);
  if(!wrongPool.length){ renderHome(); return; }
  state.phase = "quiz";
  state.quizType = "advanced";
  state.quizPool = wrongPool;
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  // 이전 세션 경과시간 누적 → 새 startTime 설정
  state.sessionElapsedBase = (state.sessionElapsedBase || 0) + (Date.now() - state.startTime);
  state.startTime = Date.now();
  state.xp = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.perChapterMaxStreak = 0;
  startTimer();
  renderQuiz();
}

function startQuiz(){
  state.phase = "quiz";
  state.quizPool = buildQuizPool();
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  renderQuiz();
}

function renderQuiz(){
  if(state.quizIdx >= state.quizPool.length){
    finishSession();
    return;
  }
  state.quizAnswered = false;
  state.quizCurrent = state.quizPool[state.quizIdx];
  renderHeader();

  const { word, mode } = state.quizCurrent;
  const main = document.getElementById("main");

  let modeLabel = ({
    "meaning-mcq":"영→한 의미",
    "word-mcq":"한→영 단어",
    "spelling":"철자 입력",
    "listening":"듣고 받아쓰기",
    "colloc-write":"🎯 콜로케이션 영작",
    "cloze":"🎯 예문 빈칸 채우기",
    "grammar-fill":"📌 문법 서술형 빈칸"
  })[mode] || mode;

  let promptHTML = "";
  let answerHTML = "";

  if(mode === "meaning-mcq"){
    const correct = word.kr[0];
    const distractors = pickDistractors(word, "kr", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 단어의 뜻은?</div>
        <div class="qword">${escape(word.w)}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "word-mcq"){
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻을 보고 영어 단어를 입력하세요</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "listening"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">발음을 듣고 단어를 입력하세요</div>
        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;
    const hint = firstCharsHint(c.en);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻에 맞는 <b>콜로케이션</b>을 영어로 쓰세요</div>
        <div class="qkr">${escape(c.ko)}</div>
        <div class="hint-line">💡 첫글자 힌트 <b>${escape(hint)}</b></div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${escape(hint)}">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    // 문장 렌더 — 빈칸 위치에 인풋 (정답의 첫 글자 placeholder 힌트)
    const sentHTML = tokens.map((t, i) => {
      const bIdx = blankIdxs.indexOf(i);
      if(bIdx >= 0){
        const ans = t.text;
        const size = Math.max(4, Math.min(14, ans.length + 2));
        const hint = firstCharsHint(ans);
        return `<input type="text" class="cloze-input" data-blank-idx="${bIdx}" data-ans="${escape(ans)}" size="${size}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${escape(hint)}">`;
      }
      return escape(t.text);
    }).join("");
    const clozeHints = blankIdxs.map((tokIdx, i) => `[${i+1}] ${firstCharsHint(tokens[tokIdx].text)}`).join(" &nbsp;&nbsp; ");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt">
        <div class="label">해석에 맞게 <b>${blankIdxs.length}개 빈칸</b>을 채우세요</div>
        <div class="qkr">${escape(sentence.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
        <div class="hint-line">💡 첫글자 힌트 <b>${clozeHints}</b></div>
      </div>`;
    answerHTML = `
      <div class="input-box only-btn">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "grammar-fill"){
    const { quiz } = state.quizCurrent;
    // sentence 안의 _____ (밑줄 3개 이상)을 인풋으로 대체 · 각 빈칸에 정답의 첫 글자만 placeholder 로 힌트
    const ansList = Array.isArray(quiz.answer) ? quiz.answer : [quiz.answer];
    let blankSeq = 0;
    const sentHTML = escape(quiz.sentence).replace(/_{3,}/g, () => {
      const ans = ansList[blankSeq] ?? ansList[0];
      const size = Math.max(5, Math.min(20, (ans||'').length + 2));
      const idx = blankSeq++;
      const hint = firstCharsHint(ans);
      return `<input type="text" class="cloze-input grammar-input" data-blank-idx="${idx}" data-ans="${escape(ans)}" size="${size}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${escape(hint)}">`;
    });
    const grammarHints = ansList.map((ans, i) => `[${i+1}] ${firstCharsHint(ans)}`).join(" &nbsp;&nbsp; ");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt grammar-prompt">
        <div class="label">📌 <b>문법 포인트</b> — 해석에 맞게 빈칸을 채우세요</div>
        <div class="qkr">${escape(quiz.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
        <div class="hint-line">💡 첫글자 힌트 <b>${grammarHints}</b></div>
      </div>`;
    answerHTML = `
      <div class="input-box only-btn">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  }

  main.innerHTML = `
    <div class="quiz-stage">
      <div class="quiz-header">
        <div class="quiz-num">문제 <b>${state.quizIdx+1}</b> / ${state.quizPool.length}</div>
        <div class="quiz-mode">${modeLabel}</div>
      </div>
      <div class="quiz-card">
        ${promptHTML}
        ${answerHTML}
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
  `;

  // wire
  if(mode === "meaning-mcq" || mode === "word-mcq"){
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=> handleChoice(btn));
    });
  } else if(mode === "cloze" || mode === "grammar-fill"){
    const inputs = document.querySelectorAll(".cloze-input");
    inputs.forEach((inp, i)=>{
      inp.addEventListener("keydown", e=>{
        if(e.key === "Enter"){
          const next = inputs[i+1];
          if(next) next.focus();
          else handleSubmit();
        }
      });
    });
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    if(inputs[0]) setTimeout(()=>inputs[0].focus(), 100);
  } else {
    const inp = document.getElementById("ansInput");
    inp.addEventListener("keydown", e=>{
      if(e.key === "Enter") handleSubmit();
    });
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    setTimeout(()=>inp.focus(), 100);
    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
    }
  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 콜로케이션 영작 ──────────────────────────────
  if(mode === "colloc-write"){
    const inp = document.getElementById("ansInput");
    const val = normalizeAnswer(inp.value);
    if(!val) return;
    state.quizAnswered = true;
    const correct = normalizeAnswer(state.quizCurrent.colloc.en);
    const isCorrect = val === correct;
    inp.classList.add(isCorrect ? "correct" : "wrong");
    inp.disabled = true;
    document.getElementById("submitBtn").disabled = true;
    if(!isCorrect){
      document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(state.quizCurrent.colloc.en)}</b>`;
    }
    finishQuestion(isCorrect);
    return;
  }

  // ── 심화: 예문 빈칸 채우기 · 문법 빈칸 채우기 ────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const inputs = Array.from(document.querySelectorAll(".cloze-input"));
    if(inputs.some(i => !i.value.trim())) return;
    state.quizAnswered = true;
    let allOk = true;
    inputs.forEach(i => {
      const guess = normalizeAnswer(i.value);
      const ans = normalizeAnswer(i.dataset.ans);
      const ok = guess === ans;
      i.classList.add(ok ? "correct" : "wrong");
      i.disabled = true;
      if(!ok) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = inputs.map(i => `<b style="color:var(--grade)">${escape(i.dataset.ans)}</b>`).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본: 철자·리스닝 ────────────────────────────────
  const inp = document.getElementById("ansInput");
  const val = (inp.value||"").trim().toLowerCase();
  if(!val) return;
  state.quizAnswered = true;
  const isCorrect = val === word.w.toLowerCase();
  inp.classList.add(isCorrect ? "correct" : "wrong");
  inp.disabled = true;
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(word.w)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* ============================================================
   RESULT
   ============================================================ */
function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));
  if(isPerfect) earnedBadges.push(DATA.badges.find(b=>b.id==="perfect"));

  renderHeader();

  const main = document.getElementById("main");
  const stageLbl = isAdv ? "심화단계" : "기본단계";
  const passedM3 = (pct >= 60) && (DATA.grade === '중3');
  const isHighGrade = ['고1','고2','수능'].includes(DATA.grade);
  const highGradePerfect = isHighGrade && isAdv && isPerfect;
  const highGradeMsg = highGradePerfect ? pickHGMessage() : null;
  const title = highGradeMsg
    ? `🏆 ${escape(highGradeMsg)}`
    : passedM3
      ? `💰 방금 당신의 미래 연봉이 10만원 더 올라갔슴돠!!`
      : (isPerfect ? `🎊 ${stageLbl} 무결점 클리어!` : (pct >= 80 ? `🎉 ${stageLbl} 잘했어요!` : pct >= 60 ? `👍 ${stageLbl} 통과!` : "💪 다시 도전!"));

  // 심화면 [🎯 심화 다시] + [🏠 홈으로]. 기본이면 [🔁 다시 보기] + (심화 해금 시) [🎯 심화 도전]
  const canGoAdvanced = !isAdv && state.basicThresholdPassed;
  const advGrand = isAdv && pct >= 90;   // 심화 90%+ 특별 축포
  const unlockBanner = newUnlock
    ? `<div style="margin:8px auto 6px;padding:10px 14px;border-radius:var(--radius-md);
                   background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(109,40,217,.10));
                   border:1px solid rgba(168,85,247,.55);color:#e9d5ff;font-weight:700;font-size:.98rem;
                   text-align:center;letter-spacing:.02em;">
         🎯 90% 이상 달성 — <b style="color:#c4b5fd">심화단계 해금!</b>
       </div>`
    : "";
  const grandBanner = advGrand
    ? `<div class="grand-banner">
         <div class="grand-line">🎆 당신이 <b>배곧 쵝오</b>! 🎆</div>
         <div class="grand-sub">심화단계 ${pct}% — 지역 랭커 등극!</div>
       </div>`
    : "";
  const hasWrong = state.quizWrongItems.length > 0;
  const actionsHTML = isAdv
    ? `<button class="start-btn" id="retryBtn">🔁 심화 다시</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       <button class="start-btn alt" id="homeBtn">🏠 Home</button>`
    : `<button class="start-btn" id="retryBtn">🔁 다시 보기</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       ${canGoAdvanced ? `<button class="start-btn adv" id="goAdvBtn">🎯 심화단계 도전</button>`
                       : `<button class="start-btn alt" id="nextBtn">▶ 다음 챕터</button>`}`;

  main.innerHTML = `
    <div class="result">
      <h2>${title}</h2>
      ${grandBanner}
      <div class="score-big">${correct} / ${total}</div>
      <div class="score-pct">정답률 ${pct}%</div>
      <div class="score-time">⏱ 소요 시간 <b>${fmtTime(elapsed)}</b></div>

      <div class="result-stats">
        <div class="result-stat"><div class="l">획득 XP</div><div class="v grade-c">+${state.xp}</div></div>
        <div class="result-stat"><div class="l">최대 연속</div><div class="v acc-c">${state.maxStreak} 🔥</div></div>
        <div class="result-stat"><div class="l">풀이 시간</div><div class="v">${fmtTime(elapsed)}</div></div>
        <div class="result-stat"><div class="l">누적 XP</div><div class="v">${state.xpTotal}</div></div>
      </div>

      ${earnedBadges.length ? `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">획득 뱃지</div>
        <div class="badges-earned">
          ${earnedBadges.map((b,i)=>`<span class="badge" style="animation-delay:${i*.15}s"><span class="ic">${b.icon}</span>${escape(b.name)}</span>`).join("")}
        </div>` : ""}

      ${state.quizWrongIds.size ? `<div style="margin:10px 0 14px;color:var(--text-muted);font-size:13px;">
        틀린 단어: <b style="color:var(--danger)">${[...state.quizWrongIds].map(id=>{
          const w = DATA.newWords.find(x=>x.id===id); return w?escape(w.w):"";
        }).filter(Boolean).join(", ")}</b>
      </div>` : ""}

      ${unlockBanner}

      <div class="result-actions">
        ${actionsHTML}
      </div>
    </div>
  `;

  // celebration
  setTimeout(()=>{
    if(highGradeMsg){
      // 고등학교 심화 100% — 화면 오버레이 + 랜덤 메시지 + TTS + 폭죽 다량
      showHighGradeCelebration(highGradeMsg);
      SFX.grandFanfare();
      fx.spawn("rainbow-burst");
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 350);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 800);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.bigWin(); }, 1400);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.streak(); }, 2100);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 2900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 3700);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4500);
      return;
    }
    if(advGrand){
      // 심화 90%+ — 화려·명랑 팡파레 + 축포 다량 (배곧 쵝오!)
      fx.spawn("rainbow-burst");
      SFX.grandFanfare();                                          // 브라스 팡파레+아르페지오+종
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 300);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 700);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.streak(); }, 1300);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.fireworks(); }, 1900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.bigWin(); }, 2500);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.coinDrop(); }, 3300);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4000);                // 마지막 대미 팡파레
    } else if(isPerfect){
      fx.spawn("rainbow-burst");
      SFX.bigWin();
      setTimeout(()=>fx.spawn("jackpot-full"), 600);
      setTimeout(()=>SFX.coinDrop(), 700);
    } else if(newCleared){
      fx.spawn("jackpot-full");
      SFX.levelUp();
      setTimeout(()=>SFX.coinDrop(), 500);
    } else if(pct >= 80){
      fx.spawn("reel-spin-small");
      SFX.spinReel();
    }
  }, 250);

  document.getElementById("retryBtn").addEventListener("click", ()=>{
    if(isAdv){ startAdvanced(); }
    else{ renderHome(); }
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    alert("Lv.2 미생성 — 시범 버전입니다.");
  });
  const goAdvBtn = document.getElementById("goAdvBtn");
  if(goAdvBtn) goAdvBtn.addEventListener("click", ()=>{
    state.quizType = "advanced";
    startAdvanced();
  });
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=> renderHome());
  const retryWrongBtn = document.getElementById("retryWrongBtn");
  if(retryWrongBtn){
    retryWrongBtn.addEventListener("click", ()=>{
      if(isAdv) startAdvancedRetryWrong();
      else startBasicRetryWrong();
    });
  }
}

/* 고등학교 심화 100% — 랜덤 축하 메시지 + 화면 오버레이 + TTS */
const HG_MESSAGES = [
  "당신의 노력에 경의를 표합니다!!",
  "배곧 쵝오를 넘어서!!",
  "이러다 연세대 가는거 아냐??",
  "자꾸 이러면 서울대 들어간다.",
  "왜 이렇게 잘 해?",
  "커서 훌륭한 사람 되겠어!!",
  "미래의 당신 집이 한 평 커졌어!!"
];
function pickHGMessage(){
  return HG_MESSAGES[Math.floor(Math.random() * HG_MESSAGES.length)];
}
function showHighGradeCelebration(msg){
  const old = document.querySelector('.hg-celebration');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'hg-celebration';
  const sparkles = ['✨','🎉','🎊','⭐','💫','🌟','🎆','🎇','💥']
    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 6100);
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ko-KR'; u.rate = 0.98; u.pitch = 1.12; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ko = voices.find(v => /^ko/i.test(v.lang));
      if(ko) u.voice = ko;
      setTimeout(()=>speechSynthesis.speak(u), 400);
    }
  }catch(e){}
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);
  renderHeader();
  if(state.sfxOn){ getAC(); SFX.streak(); }
});
document.getElementById("cbBtn").addEventListener("click", ()=>{
  state.cbMode = !state.cbMode;
  lsSet(CB_KEY, state.cbMode);
  document.body.classList.toggle("cb-mode", state.cbMode);
  renderHeader();
});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
