<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Lv.17</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}

  /* Grade buttons */

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}

  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{

  /* ---------- RESULT ---------- */

    font-family:'Segoe UI','Malgun Gothic',sans-serif;

    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;

  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

  /* ---------- RAINBOW BURST ---------- */
  .rainbow-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:45;
    background:linear-gradient(135deg,
      rgba(255,0,128,.0), rgba(255,255,0,.0), rgba(0,255,128,.0), rgba(0,128,255,.0), rgba(255,0,255,.0));
    animation:rainbow 1.5s ease;
  }
  @keyframes rainbow{
    0%{background:linear-gradient(135deg, rgba(255,0,128,.0), rgba(255,255,0,.0));}
    25%{background:linear-gradient(135deg, rgba(255,0,128,.35), rgba(255,255,0,.30));}
    50%{background:linear-gradient(135deg, rgba(0,255,128,.30), rgba(0,128,255,.30));}
    75%{background:linear-gradient(135deg, rgba(255,0,255,.30), rgba(255,128,0,.30));}
    100%{background:linear-gradient(135deg, rgba(0,0,0,0), rgba(0,0,0,0));}
  }

  /* ---------- HIDE ---------- */
  .hidden{display:none !important;}

  /* ---------- MOBILE TUNING ---------- */
  @media (max-width:380px){
    .face.front .word{font-size:54px;}
    .quiz-prompt .qword{font-size:30px;}
    .home h1{font-size:26px;}
  }

  /* ---------- TIMER ---------- */
  .timer-pill{
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    color:var(--text-on-dark-muted);font-size:.72rem;
    font-variant-numeric:tabular-nums;
  }
  .timer-pill b{color:var(--text-on-dark);font-weight:700;}
</style>
</head>

<script>
/* ====================================================================

/* ---------- DATA (embedded) ---------- */
const DATA = {
  grade: "고1",
  chapter: { id:"고1-L17", title:"고1 Lv.17", index:17, totalCount:50 },

    {"id":"w03939","w":"lump","pos":["n","v"],"ph":"/lʌmp/","cefr":"B1","kr":["덩어리","혹"],"ex":[{"en":"She found a small lump on her arm.","ko":"그녀는 팔에 작은 혹을 발견했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"chunk","ko":"덩어리","reason":"동의어 - 큰 조각"},{"w":"mass","ko":"덩어리","reason":"동의어 - 뭉쳐진 것"},{"w":"throat","ko":"목","reason":"콜로케이션 - lump in throat"}],"collocBest":[{"en":"lump sum","ko":"일시불"},{"en":"lump in throat","ko":"목에 걸리는 느낌"}]},"nuance":{"koSimple":"뭉쳐 있는 한 덩어리.","whenToUse":"빵·설탕·몸에 난 혹 등 뭉친 것을 가리킬 때."},"krDetail":[{"ko":"덩어리","explain":"일정한 모양 없이 뭉쳐 있는 큰 조각"},{"ko":"혹","explain":"몸이나 물건 표면에 도드라져 올라온 부분"}],"usageExamples":[{"en":"She added a lump of sugar to her coffee.","ko":"그녀는 커피에 설탕 한 덩어리를 넣었다."},{"en":"A hard lump appeared on his neck after the accident.","ko":"사고 후 그의 목에 딱딱한 혹이 생겼다."}],"grammarNote":"lump은 셀 수 있는 명사로 a lump of + 셀 수 없는 명사 형태로 자주 쓰인다. 동사로 쓸 때 lump together는 '한데 묶다'라는 관용 표현이다.","grammarQuiz":[{"sentence":"Don't _____ all the students _____ just because a few of them made mistakes yesterday.","ko":"몇 명이 어제 실수했다고 해서 학생들을 모두 한데 묶지 마라.","answer":["lump","together"],"hint":"동사 lump와 부사"}]},
    {"id":"w03942","w":"lung","pos":["n"],"ph":"/lʌŋ/","cefr":"B1","kr":["폐","허파"],"ex":[{"en":"Smoking damages the lungs severely over time.","ko":"흡연은 시간이 지남에 따라 폐를 심하게 손상시킨다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"breathe","ko":"숨쉬다","reason":"시나리오 - 폐로 숨쉬다"},{"w":"cancer","ko":"암","reason":"콜로케이션 - lung cancer"},{"w":"smoke","ko":"연기/담배","reason":"시나리오 - 담배가 폐를 해침"}],"collocBest":[{"en":"lung cancer","ko":"폐암"},{"en":"lung capacity","ko":"폐 용량"}]},"nuance":{"koSimple":"숨을 담는 가슴 속 기관.","whenToUse":"호흡·흡연·건강 이야기에."},"krDetail":[{"ko":"폐","explain":"숨을 쉴 때 공기를 들이고 내보내는 몸속 기관"},{"ko":"허파","explain":"가슴 안쪽에 있는 숨쉬기를 맡는 살덩어리"}],"usageExamples":[{"en":"Smoking damages the lungs over many years.","ko":"흡연은 여러 해에 걸쳐 폐를 손상시킨다."},{"en":"He filled his lungs with fresh mountain air.","ko":"그는 신선한 산 공기로 폐를 가득 채웠다."}],"grammarNote":"폐는 좌우 한 쌍이므로 보통 복수 lungs로 쓴다. one lung처럼 한쪽만 지칭할 때만 단수로 쓴다는 점을 학생들이 자주 놓친다.","grammarQuiz":[{"sentence":"The doctor explained that the patient's _____ were _____ by long exposure to polluted air.","ko":"의사는 환자의 폐가 오랜 오염 공기 노출로 손상되었다고 설명했다.","answer":["lungs","damaged"],"hint":"복수 명사 + 수동태 과거분사"}]},
    {"id":"w03947","w":"luxury","pos":["n","adj"],"ph":"/ˈlʌkʃəri/","cefr":"B1","kr":["사치","호화"],"ex":[{"en":"A vacation is a luxury for many people.","ko":"휴가는 많은 사람들에게 사치이다."}],"mnemonic":{"soundHint":"럭셔리","story":"'럭셔리(luxury)' 브랜드 = 사치스러운 명품. 외래어 그대로 사용.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"extravagance","ko":"사치","reason":"동의어 - 낭비적 호화"},{"w":"necessity","ko":"필수품","reason":"반의어 - 사치 vs 필수"},{"w":"indulgence","ko":"탐닉","reason":"동의어 - 호화로운 만족"}],"collocBest":[{"en":"luxury goods","ko":"사치품"},{"en":"live in luxury","ko":"호화롭게 살다"}]},"nuance":{"koSimple":"꼭 없어도 되지만 누리는 호화.","whenToUse":"값비싼 물건이나 특별한 여유를 말할 때."},"krDetail":[{"ko":"사치","explain":"꼭 필요하지 않은 것에 지나치게 돈이나 힘을 쓰는 일"},{"ko":"호화","explain":"매우 화려하고 값비싸게 꾸며진 상태"}],"usageExamples":[{"en":"Many people consider a private jet the ultimate luxury.","ko":"많은 사람들이 개인 제트기를 최고의 사치라고 여긴다."},{"en":"After the war, even bread was a rare luxury.","ko":"전쟁 후에는 빵조차 귀한 사치였다."}],"grammarNote":"luxury는 형용사로 쓰일 때 명사 앞에서만 쓰이며 서술적으로는 luxurious를 써야 한다. It is luxury.(X) → It is luxurious.(O)","grammarQuiz":[{"sentence":"The hotel offered a _____ suite that was extremely _____ and comfortable for every guest.","ko":"그 호텔은 매우 호화롭고 편안한 특급 스위트룸을 제공했다.","answer":["luxury","luxurious"],"hint":"명사 수식형과 서술형용사"}]},
    {"id":"w03949","w":"lyrics","pos":["n"],"ph":"/ˈlɪrɪks/","cefr":"B1","kr":["가사","노래 말"],"ex":[{"en":"The poet turned her beautiful lyrics into a bestselling collection of songs.","ko":"그 시인은 아름다운 가사를 베스트셀러 곡 모음집으로 만들었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"song","ko":"노래","reason":"콜로케이션 - song lyrics"},{"w":"verse","ko":"구절","reason":"동의어 - 노래의 구절"},{"w":"melody","ko":"선율","reason":"시나리오 - 가사와 선율"}],"collocBest":[{"en":"song lyrics","ko":"노래 가사"},{"en":"write lyrics","ko":"가사를 쓰다"}]},"nuance":{"koSimple":"노래 속에 담긴 말.","whenToUse":"노래 가사나 그 내용에 대해 말할 때."},"krDetail":[{"ko":"가사","explain":"노래에 담긴 글이나 노래말"},{"ko":"노래 말","explain":"선율과 함께 부르는 짧은 글귀"}],"usageExamples":[{"en":"The singer wrote the lyrics to all her songs herself.","ko":"그 가수는 자신의 모든 노래 가사를 직접 썼다."},{"en":"These lyrics move me every time I hear them.","ko":"이 가사는 들을 때마다 나를 감동시킨다."}],"grammarNote":"lyrics는 항상 복수형으로 쓰이며 단수 lyric(형용사, '서정적인')과 뜻이 완전히 다르다. 동사도 복수 취급하여 The lyrics are, 소유격은 the lyrics' meaning으로 쓴다.","grammarQuiz":[{"sentence":"The _____ of that famous song _____ deeply moving to almost every listener.","ko":"그 유명한 곡의 가사는 거의 모든 청자에게 매우 감동적이다.","answer":["lyrics","are"],"hint":"복수 명사와 be동사"}]},
    {"id":"w03959","w":"magnetic","pos":["adj"],"ph":"/mæɡˈnetɪk/","cefr":"B1","kr":["자기의","매력적인"],"ex":[{"en":"He has a magnetic personality.","ko":"그는 매력적인 성격을 가지고 있다."}],"mnemonic":{"soundHint":"마그네틱","story":"'마그네틱(magnetic) 카드' = 자석 띠가 있는 카드. 외래어로 쓰이는 자기의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"attractive","ko":"매력적인","reason":"동의어 - 끌어당기는"},{"w":"repulsive","ko":"혐오스러운","reason":"반의어 - 밀어내는"},{"w":"field","ko":"장","reason":"콜로케이션 - magnetic field"}],"collocBest":[{"en":"magnetic field","ko":"자기장"},{"en":"magnetic force","ko":"자력"}]},"nuance":{"koSimple":"끌어당기는 힘이 있는.","whenToUse":"자석의 힘이나 사람의 매력을 말할 때."},"krDetail":[{"ko":"자기의","explain":"쇠붙이를 끌어당기는 힘과 관련된"},{"ko":"매력적인","explain":"사람의 마음을 강하게 끌어당기는"}],"usageExamples":[{"en":"Iron reacts to a magnetic force at close range.","ko":"철은 가까운 거리에서 자기력에 반응한다."},{"en":"The speaker had a magnetic personality that drew huge crowds.","ko":"그 연사는 많은 청중을 끌어들이는 매력적인 성격을 지녔다."}],"grammarNote":"magnetic은 형용사로 명사 앞과 뒤에서 모두 쓰이지만, 명사형 magnetism('자성, 매력')과 혼동하지 않아야 한다. His magnetic(X) → His magnetism(O)로 명사 자리에서 magnetic만 쓰면 안 된다.","grammarQuiz":[{"sentence":"The teacher's _____ voice and personal _____ captured the attention of every student in the classroom.","ko":"그 선생님의 매력적인 목소리와 개인적 매력은 교실 모든 학생의 주의를 끌었다.","answer":["magnetic","magnetism"],"hint":"형용사와 명사"}]},
    {"id":"w03963","w":"maid","pos":["n"],"ph":"/meɪd/","cefr":"B1","kr":["하녀","가정부"],"ex":[{"en":"The maid cleaned the room.","ko":"가정부가 방을 청소했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"servant","ko":"하인","reason":"동의어 - 시중드는 사람"},{"w":"housekeeper","ko":"가정부","reason":"동의어 - 집안일 담당"},{"w":"hotel","ko":"호텔","reason":"콜로케이션 - hotel maid"}],"collocBest":[{"en":"maid service","ko":"가사 서비스"},{"en":"hotel maid","ko":"호텔 객실 담당자"}]},"nuance":{"koSimple":"집안일을 도와주는 여성.","whenToUse":"옛날 가정부·호텔 청소 담당 말할 때."},"krDetail":[{"ko":"하녀","explain":"옛날 남의 집에서 살림을 돕던 여자"},{"ko":"가정부","explain":"삯을 받고 집안일을 돌봐 주는 사람"}],"usageExamples":[{"en":"The hotel maid cleaned every room before noon.","ko":"호텔 청소원은 정오 전에 모든 방을 청소했다."},{"en":"In old novels, the maid often knew all the family secrets.","ko":"옛 소설 속 하녀는 종종 집안의 모든 비밀을 알고 있었다."}],"grammarNote":"maid는 셀 수 있는 명사로 복수형은 maids이며, 여성만을 가리키는 성별 특정 명사이다. 남성 하인은 servant나 butler로 표현해야 하며 male maid는 잘못된 표현이다.","grammarQuiz":[{"sentence":"Two _____ were _____ to clean all the rooms of the huge old mansion by nightfall.","ko":"두 명의 하녀가 밤이 될 때까지 그 커다란 옛 저택의 모든 방을 청소하도록 지시받았다.","answer":["maids","told"],"hint":"복수 명사와 수동태 tell의 과거분사"}]},
    {"id":"w03967","w":"mainland","pos":["n"],"ph":"/ˈmeɪnlænd/","cefr":"B1","kr":["본토","대륙"],"ex":[{"en":"He lives on the mainland.","ko":"그는 본토에 산다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"continent","ko":"대륙","reason":"동의어 - 큰 육지"},{"w":"island","ko":"섬","reason":"반의어 - 본토와 대비"},{"w":"heartland","ko":"중심지","reason":"동의어 - 본토의 핵심"}],"collocBest":[{"en":"mainland China","ko":"중국 본토"},{"en":"mainland Europe","ko":"유럽 본토"}]},"nuance":{"koSimple":"섬이 아닌 본토 땅.","whenToUse":"섬과 대비되는 본토를 가리킬 때."},"krDetail":[{"ko":"본토","explain":"섬이나 식민지가 아닌, 나라의 주된 큰 땅"},{"ko":"대륙","explain":"바다에 둘러싸이지 않은 넓은 육지"}],"usageExamples":[{"en":"The ferry connects the small island to the mainland.","ko":"그 여객선은 작은 섬을 본토와 이어 준다."},{"en":"Storms rarely reach the mainland from the ocean.","ko":"폭풍이 바다에서 본토까지 오는 일은 드물다."}],"grammarNote":"mainland는 앞에 정관사 the를 붙여 the mainland로 쓰는 것이 원칙이다. 또한 mainland China처럼 명사를 수식할 때는 형용사처럼 쓴다는 점을 학생들이 자주 놓친다.","grammarQuiz":[{"sentence":"Every summer, thousands of tourists travel from the small islands to _____ _____ by high-speed ferries.","ko":"매년 여름 수천 명의 관광객이 고속 여객선으로 작은 섬들에서 본토로 이동한다.","answer":["the","mainland"],"hint":"정관사와 명사"}]},
    {"id":"w03970","w":"maintain","pos":["v"],"ph":"/meɪnˈteɪn/","cefr":"B1","kr":["유지하다","주장하다"],"ex":[{"en":"Maintain a healthy lifestyle.","ko":"건강한 생활방식을 유지해라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"preserve","ko":"보존하다","reason":"동의어 - 그대로 유지"},{"w":"neglect","ko":"방치하다","reason":"반의어 - 관리 안 함"},{"w":"sustain","ko":"지속하다","reason":"동의어 - 계속 유지"}],"collocBest":[{"en":"maintain order","ko":"질서를 유지하다"},{"en":"maintain contact","ko":"연락을 유지하다"}]},"nuance":{"koSimple":"지금 상태를 그대로 지키다.","whenToUse":"건강·질서·관계를 계속 유지할 때."},"krDetail":[{"ko":"유지하다","explain":"어떤 상태를 그대로 이어 가다"},{"ko":"주장하다","explain":"자기의 의견을 굽히지 않고 말하다"}],"usageExamples":[{"en":"The company maintains high standards in every product.","ko":"그 회사는 모든 제품에서 높은 기준을 유지한다."},{"en":"He still maintains his innocence despite the evidence.","ko":"증거에도 불구하고 그는 여전히 자신의 결백을 주장한다."}],"grammarNote":"maintain은 타동사로 뒤에 반드시 목적어가 필요하며 자동사로 쓰지 않는다. '~라고 주장하다'의 뜻일 때 maintain that + 문장 구조를 취한다.","grammarQuiz":[{"sentence":"The scientist _____ _____ the new theory is more accurate than the traditional one for many reasons.","ko":"그 과학자는 여러 이유로 새 이론이 전통 이론보다 더 정확하다고 주장한다.","answer":["maintains","that"],"hint":"동사 maintain의 3인칭 단수와 접속사"}]},
    {"id":"w03971","w":"maintenance","pos":["n"],"ph":"/ˈmeɪntənəns/","cefr":"B1","kr":["유지","관리"],"ex":[{"en":"Regular maintenance is needed.","ko":"정기적인 유지 관리가 필요하다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"upkeep","ko":"유지 관리","reason":"동의어 - 관리 유지"},{"w":"neglect","ko":"방치","reason":"반의어 - 유지 반대"},{"w":"repair","ko":"수리","reason":"시나리오 - 유지 보수"}],"collocBest":[{"en":"maintenance cost","ko":"유지 비용"},{"en":"maintenance work","ko":"유지 보수 작업"}]},"nuance":{"koSimple":"잘 굴러가게 관리하기.","whenToUse":"기계·건물의 정기 점검·관리를 말할 때."},"krDetail":[{"ko":"유지","explain":"어떤 상태나 기능을 그대로 이어 감"},{"ko":"관리","explain":"기계나 시설을 보살펴 잘 돌아가게 함"}],"usageExamples":[{"en":"Regular maintenance keeps the machines running smoothly.","ko":"정기적인 관리는 기계들이 원활히 작동하도록 유지한다."},{"en":"The building requires expensive maintenance every year.","ko":"그 건물은 해마다 값비싼 관리를 필요로 한다."}],"grammarNote":"maintenance는 셀 수 없는 명사이므로 a maintenance나 maintenances로 쓰지 않는다. 형용사처럼 다른 명사 앞에서 쓰는 경우가 많은데(예: maintenance cost) 이때도 단수형을 유지한다.","grammarQuiz":[{"sentence":"The old bridge needs regular _____ to _____ safe for all vehicles crossing daily.","ko":"그 낡은 다리는 매일 오가는 모든 차량이 안전하도록 정기적인 관리가 필요하다.","answer":["maintenance","remain"],"hint":"셀 수 없는 명사와 to부정사 동사원형"}]},
    {"id":"w03974","w":"majority","pos":["n"],"ph":"/məˈdʒɒrɪti/","cefr":"B1","kr":["대다수","과반수"],"ex":[{"en":"The majority agreed.","ko":"대다수가 동의했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"most","ko":"대부분","reason":"동의어 - 대다수"},{"w":"minority","ko":"소수","reason":"반의어 - 다수 vs 소수"},{"w":"vote","ko":"투표","reason":"콜로케이션 - majority vote"}],"collocBest":[{"en":"vast majority","ko":"압도적 다수"},{"en":"majority vote","ko":"다수결"}]},"nuance":{"koSimple":"절반보다 많은 사람들.","whenToUse":"다수결·대세를 말할 때."},"krDetail":[{"ko":"대다수","explain":"전체 가운데 매우 많은 쪽"},{"ko":"과반수","explain":"전체의 절반이 넘는 수"}],"usageExamples":[{"en":"The majority supports the new environmental policy.","ko":"대다수는 새 환경 정책을 지지한다."},{"en":"A majority of students walk to school every morning.","ko":"대다수의 학생들은 매일 아침 걸어서 등교한다."}],"grammarNote":"the majority of + 복수명사가 오면 동사는 복수로, majority가 집합체로 쓰이면 단수 취급이 가능하다. 학생들은 majority가 단수라 무조건 is만 붙이는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The majority of the students in this school _____ from families that _____ nearby.","ko":"이 학교 학생들의 대다수는 근처에 사는 가정 출신이다.","answer":["come","live"],"hint":"복수 취급 동사와 관계사절 동사"}]},
    {"id":"w03990","w":"management","pos":["n"],"ph":"/ˈmænɪdʒmənt/","cefr":"B1","kr":["경영","관리"],"ex":[{"en":"Good management is vital.","ko":"좋은 경영은 필수적이다."}],"mnemonic":{"soundHint":"매니지먼트","story":"'매니지먼트(management) 회사' = 연예인 경영·관리 회사. 외래어 그대로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"administration","ko":"행정","reason":"동의어 - 관리 운영"},{"w":"control","ko":"통제","reason":"동의어 - 관리 통제"},{"w":"leadership","ko":"리더십","reason":"시나리오 - 경영자 리더십"}],"collocBest":[{"en":"time management","ko":"시간 관리"},{"en":"management skills","ko":"경영 기술"}]},"nuance":{"koSimple":"사람·일을 굴러가게 하는 관리.","whenToUse":"회사 경영·시간 관리 등에."},"krDetail":[{"ko":"경영","explain":"회사나 사업을 이끌어 가는 일"},{"ko":"관리","explain":"일이나 사람을 잘 돌보아 다스림"}],"usageExamples":[{"en":"Good management leads the company to steady growth.","ko":"좋은 경영은 회사를 꾸준한 성장으로 이끈다."},{"en":"Time management is essential for successful students.","ko":"시간 관리는 성공적인 학생들에게 꼭 필요하다."}],"grammarNote":"management는 기본적으로 셀 수 없는 명사이지만, 회사의 '경영진'을 뜻할 때는 집합명사로 단수/복수 모두 가능하다. The management has/have decided ~ 모두 허용된다.","grammarQuiz":[{"sentence":"The company's _____ _____ decided to invest more money in employee training programs.","ko":"그 회사의 경영진은 직원 교육 프로그램에 더 많은 돈을 투자하기로 결정했다.","answer":["management","has"],"hint":"명사와 완료 조동사"}]},
    {"id":"w03998","w":"mankind","pos":["n"],"ph":"/mænˈkaɪnd/","cefr":"B1","kr":["인류","인간"],"ex":[{"en":"Mankind must protect Earth.","ko":"인류는 지구를 보호해야 한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"humanity","ko":"인류","reason":"동의어 - 인간 전체"},{"w":"humankind","ko":"인류","reason":"동의어 - 성중립 표현"},{"w":"history","ko":"역사","reason":"콜로케이션 - history of mankind"}],"collocBest":[{"en":"benefit mankind","ko":"인류에 이롭다"},{"en":"history of mankind","ko":"인류의 역사"}]},"nuance":{"koSimple":"지구 위 모든 사람들.","whenToUse":"인류 전체·역사·환경 이야기에."},"krDetail":[{"ko":"인류","explain":"지구에 사는 모든 사람을 통틀어 부르는 말"},{"ko":"인간","explain":"생각하고 말할 수 있는 사람 무리"}],"usageExamples":[{"en":"Science has helped mankind fight many diseases.","ko":"과학은 인류가 많은 질병과 싸우도록 도왔다."},{"en":"Space exploration marks a bold step for mankind.","ko":"우주 탐사는 인류에게 대담한 발걸음이 된다."}],"grammarNote":"mankind는 셀 수 없는 집합명사로 단수 취급하며 관사 없이 쓴다. a mankind나 mankinds는 잘못된 표현이며, 성 중립 표현 humankind로 대체되는 추세이다.","grammarQuiz":[{"sentence":"_____ _____ made incredible progress in medicine, but many challenges still remain today.","ko":"인류는 의학에서 놀라운 발전을 이루었지만, 여전히 많은 도전이 남아 있다.","answer":["Mankind","has"],"hint":"무관사 명사와 완료 조동사"}]},
    {"id":"w03999","w":"manner","pos":["n"],"ph":"/ˈmænər/","cefr":"B1","kr":["방식","태도"],"ex":[{"en":"She spoke in a kind manner.","ko":"그녀는 친절한 방식으로 말했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"way","ko":"방식","reason":"동의어 - 방법·태도"},{"w":"style","ko":"스타일","reason":"동의어 - 방식·양식"},{"w":"table","ko":"식탁","reason":"콜로케이션 - table manners"}],"collocBest":[{"en":"in a manner","ko":"~한 방식으로"},{"en":"table manners","ko":"식사 예절"}]},"nuance":{"koSimple":"일을 해내는 방식·태도.","whenToUse":"말하는 태도나 일하는 방식을 말할 때."},"krDetail":[{"ko":"방식","explain":"어떤 일을 해 나가는 정해진 틀이나 길"},{"ko":"태도","explain":"사람이 남을 대하거나 일을 대하는 몸가짐"}],"usageExamples":[{"en":"She solved the problem in a creative manner.","ko":"그녀는 창의적인 방식으로 그 문제를 해결했다."},{"en":"His polite manner impressed all the guests.","ko":"그의 공손한 태도는 모든 손님에게 좋은 인상을 주었다."}],"grammarNote":"manner(단수)는 '방식/태도'를, manners(복수)는 '예절'을 뜻하므로 뜻에 따라 단·복수가 달라진다. table manner(X) → table manners(O)처럼 예절 뜻에서는 반드시 복수형을 쓴다.","grammarQuiz":[{"sentence":"The child spoke in a very polite _____ and had excellent table _____ at every family dinner.","ko":"그 아이는 매우 공손한 태도로 말했고 모든 가족 식사에서 훌륭한 식사 예절을 지녔다.","answer":["manner","manners"],"hint":"단수 '태도'와 복수 '예절'"}]},
    {"id":"w04001","w":"mansion","pos":["n"],"ph":"/ˈmænʃən/","cefr":"B1","kr":["저택","대저택"],"ex":[{"en":"They live in a mansion.","ko":"그들은 저택에 산다."}],"mnemonic":{"soundHint":"맨션","story":"'맨션(mansion)' = 고급 저택·아파트. 한국에서도 외래어로 사용.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"villa","ko":"별장","reason":"동의어 - 고급 주택"},{"w":"cottage","ko":"오두막","reason":"반의어 - 작은 집"},{"w":"estate","ko":"저택 부지","reason":"동의어 - 대저택"}],"collocBest":[{"en":"grand mansion","ko":"화려한 저택"},{"en":"haunted mansion","ko":"유령이 나오는 저택"}]},"nuance":{"koSimple":"크고 화려한 큰 집.","whenToUse":"부자들이 사는 대저택을 가리킬 때."},"krDetail":[{"ko":"저택","explain":"규모가 크고 잘 꾸며진 집"},{"ko":"대저택","explain":"매우 넓고 화려하게 지어진 큰 집"}],"usageExamples":[{"en":"The billionaire built a huge mansion on the hill.","ko":"그 억만장자는 언덕 위에 커다란 저택을 지었다."},{"en":"The old mansion was surrounded by beautiful gardens.","ko":"그 오래된 저택은 아름다운 정원에 둘러싸여 있었다."}],"grammarNote":"mansion은 셀 수 있는 명사로 반드시 관사(a/the)와 함께 쓰거나 복수형 mansions로 써야 한다. 한국식 아파트를 mansion이라 부르는 것은 잘못된 콩글리시이다.","grammarQuiz":[{"sentence":"_____ old _____ on the hill was said to be haunted by mysterious figures every winter night.","ko":"언덕 위 그 오래된 저택은 매년 겨울밤 신비로운 형체들에게 홀렸다고 전해졌다.","answer":["The","mansion"],"hint":"정관사와 단수 명사"}]},
    {"id":"w04003","w":"manual","pos":["adj","n"],"ph":"/ˈmænjuəl/","cefr":"B1","kr":["수동의","설명서"],"ex":[{"en":"Read the manual carefully.","ko":"설명서를 주의 깊게 읽어라."}],"mnemonic":{"soundHint":"매뉴얼","story":"'매뉴얼(manual)' = 사용 설명서. 한국어로도 매뉴얼이라 부름.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"handbook","ko":"핸드북","reason":"동의어 - 안내 책자"},{"w":"automatic","ko":"자동의","reason":"반의어 - 수동 vs 자동"},{"w":"guide","ko":"안내서","reason":"동의어 - 설명 안내"}],"collocBest":[{"en":"instruction manual","ko":"사용 설명서"},{"en":"manual labor","ko":"육체 노동"}]},"nuance":{"koSimple":"손으로 하는·읽는 설명서.","whenToUse":"자동·기계와 대비된 손 작업이나 사용 설명서에."},"krDetail":[{"ko":"수동의","explain":"기계의 힘이 아닌 손으로 직접 하는"},{"ko":"설명서","explain":"쓰는 방법이나 다루는 법을 알려 주는 책자"}],"usageExamples":[{"en":"The workers still perform manual tasks in the factory.","ko":"노동자들은 여전히 공장에서 수동 작업을 수행한다."},{"en":"This car runs on a manual transmission system.","ko":"이 차는 수동 변속기로 작동한다."}],"grammarNote":"manual은 형용사와 명사로 모두 쓰이며, 명사로 '설명서'를 뜻할 때 셀 수 있다. manually는 부사형으로 '손으로, 수동으로'이며 '수동적으로'라는 뜻과 헷갈리면 안 된다.","grammarQuiz":[{"sentence":"He carefully read the _____ before operating the new machine _____ for the first time.","ko":"그는 처음으로 새 기계를 수동으로 작동시키기 전에 설명서를 주의 깊게 읽었다.","answer":["manual","manually"],"hint":"명사 '설명서'와 부사 '수동으로'"}]},

    {"id":"w04005","w":"manufacturer","pos":["n"],"ph":"/ˌmænjuˈfæktʃərər/","cefr":"B1","kr":["제조업체","제조사"],"ex":[{"en":"Contact the manufacturer.","ko":"제조업체에 연락하라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"producer","ko":"생산자","reason":"동의어 - 만드는 회사"},{"w":"maker","ko":"제작자","reason":"동의어 - 만드는 사람"},{"w":"leading","ko":"선도하는","reason":"콜로케이션 - leading manufacturer"}],"collocBest":[{"en":"car manufacturer","ko":"자동차 제조사"},{"en":"leading manufacturer","ko":"선도 제조업체"}]},"nuance":{"koSimple":"물건을 만들어내는 회사.","whenToUse":"상품 A/S·품질 문의 대상을 가리킬 때."},"krDetail":[{"ko":"제조업체","explain":"물건을 만들어 파는 회사"},{"ko":"제조사","explain":"제품을 만드는 회사나 업체"}],"usageExamples":[{"en":"The manufacturer produces high-quality electronic devices worldwide.","ko":"그 제조업체는 전 세계에 고품질 전자 기기를 생산한다."},{"en":"Every product has the manufacturer's label on the back.","ko":"모든 제품에는 뒷면에 제조사 라벨이 붙어 있다."}],"grammarNote":"manufacturer는 사람이나 회사를 나타내는 -er 명사로 셀 수 있다. manufacturing(제조업, 형용사)과 혼동하지 말아야 하며, 소유격 the manufacturer's warranty처럼 쓰이는 경우가 많다.","grammarQuiz":[{"sentence":"The car _____ offers a five-year warranty on every vehicle _____ in its main factory.","ko":"그 자동차 제조사는 자사 주요 공장에서 제조된 모든 차량에 5년 보증을 제공한다.","answer":["manufacturer","manufactured"],"hint":"명사 '제조사'와 수동 과거분사"}]},
    {"id":"w04010","w":"marathon","pos":["n","adj"],"ph":"/ˈmærəθɒn/","cefr":"B1","kr":["마라톤","장기간의"],"ex":[{"en":"She trained for six months to complete her first marathon.","ko":"그녀는 첫 마라톤을 완주하기 위해 6개월 동안 훈련했다."}],"mnemonic":{"soundHint":"마라톤","story":"'마라톤(marathon)' = 42.195km 장거리 달리기. 외래어 그대로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"endurance","ko":"지구력","reason":"시나리오 - 마라톤은 지구력"},{"w":"runner","ko":"선수","reason":"콜로케이션 - marathon runner"},{"w":"long-distance","ko":"장거리의","reason":"동의어 - 긴 거리"}],"collocBest":[{"en":"marathon runner","ko":"마라톤 선수"},{"en":"long marathon","ko":"긴 마라톤"}]},"nuance":{"koSimple":"42.195km를 뛰는 경주.","whenToUse":"장거리 달리기나 오래 걸린 일을 비유할 때."},"krDetail":[{"ko":"마라톤","explain":"매우 긴 거리를 달리는 육상 경기"},{"ko":"장기간의","explain":"오랜 시간에 걸쳐 계속되는"}],"usageExamples":[{"en":"She runs a marathon every year to raise money.","ko":"그녀는 기금 마련을 위해 매년 마라톤에 참가한다."},{"en":"The team held a marathon meeting to finish the project.","ko":"그 팀은 프로젝트를 끝내려 장시간의 회의를 열었다."}],"grammarNote":"marathon은 명사이며 형용사로 쓰일 때 명사 앞에 놓여 '장시간의'라는 뜻이 된다. 참가한다는 표현은 run/complete a marathon으로, do a marathon은 어색한 표현이다.","grammarQuiz":[{"sentence":"He wants to _____ his first _____ next spring after months of hard training every single day.","ko":"그는 매일 몇 달간의 힘든 훈련 후 내년 봄 첫 마라톤을 뛰고 싶어 한다.","answer":["run","marathon"],"hint":"관용 표현 동사와 명사"}]},
    {"id":"w04011","w":"marble","pos":["n","adj"],"ph":"/ˈmɑːrbəl/","cefr":"B1","kr":["대리석","구슬"],"ex":[{"en":"The palace floor was made of pure white marble.","ko":"궁전 바닥은 순백의 대리석으로 만들어졌다."}],"mnemonic":{"soundHint":"마블","story":"'마블(marble) 무늬' = 대리석 무늬. 마블링(marbling)도 대리석 무늬.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stone","ko":"돌","reason":"시나리오 - 대리석은 돌"},{"w":"floor","ko":"바닥","reason":"콜로케이션 - marble floor"},{"w":"statue","ko":"조각상","reason":"시나리오 - 대리석 조각상"}],"collocBest":[{"en":"marble floor","ko":"대리석 바닥"},{"en":"marble statue","ko":"대리석 조각상"}]},"nuance":{"koSimple":"매끈하고 단단한 흰 돌.","whenToUse":"조각상·궁전 바닥·화려한 건축에."},"krDetail":[{"ko":"대리석","explain":"결이 아름답고 매끄러운 무늬가 있는 값진 돌"},{"ko":"구슬","explain":"장난감으로 굴리며 노는 작고 둥근 유리 알"}],"usageExamples":[{"en":"The palace floor is made of white marble.","ko":"그 궁전 바닥은 하얀 대리석으로 만들어졌다."},{"en":"The children played with colorful marbles in the yard.","ko":"아이들은 마당에서 알록달록한 구슬을 가지고 놀았다."}],"grammarNote":"marble이 '대리석' 재료를 뜻할 때는 셀 수 없는 명사, '구슬' 알을 뜻할 때는 셀 수 있는 명사로 marbles라고 복수형을 쓴다. 학생들이 재료 뜻에서 marbles로 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The statue was carved from beautiful _____ , while the children played with _____ nearby.","ko":"그 조각상은 아름다운 대리석으로 조각되었고 아이들은 근처에서 구슬을 가지고 놀았다.","answer":["marble","marbles"],"hint":"물질명사와 셀 수 있는 복수"}]},
    {"id":"w04013","w":"margin","pos":["n"],"ph":"/ˈmɑːrdʒɪn/","cefr":"B1","kr":["여백","차이"],"ex":[{"en":"Win by a wide margin.","ko":"큰 차이로 이기다."}],"mnemonic":{"soundHint":"마진","story":"'마진(margin)이 남다' = 이윤이 남다. 사업에서 이익 차이를 마진이라 함.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"edge","ko":"가장자리","reason":"동의어 - 여백·끝"},{"w":"profit","ko":"이윤","reason":"콜로케이션 - profit margin"},{"w":"gap","ko":"차이","reason":"동의어 - 차이 폭"}],"collocBest":[{"en":"profit margin","ko":"이윤 폭"},{"en":"narrow margin","ko":"근소한 차이"}]},"nuance":{"koSimple":"가장자리·근소한 차이.","whenToUse":"여백, 이긴 표차, 이익률을 말할 때."},"krDetail":[{"ko":"여백","explain":"글이나 그림 둘레의 비어 있는 공간"},{"ko":"차이","explain":"둘 사이의 벌어진 정도나 크기"}],"usageExamples":[{"en":"She wrote notes in the margin of the book.","ko":"그녀는 책의 여백에 메모를 적었다."},{"en":"The team won by a narrow margin in the final match.","ko":"그 팀은 결승전에서 근소한 차이로 이겼다."}],"grammarNote":"margin은 '차이'를 뜻할 때 by a margin of + 수치 형태로 자주 쓰인다. 이때 전치사 by를 with나 in으로 잘못 쓰는 학생이 많다.","grammarQuiz":[{"sentence":"The candidate won the election _____ a _____ of only three hundred votes across all districts.","ko":"그 후보는 전 지역에서 단 300표 차이로 선거에서 이겼다.","answer":["by","margin"],"hint":"전치사와 명사"}]},
    {"id":"w04016","w":"marine","pos":["adj","n"],"ph":"/məˈriːn/","cefr":"B1","kr":["해양의","해병대"],"ex":[{"en":"Marine life is diverse.","ko":"해양 생물은 다양하다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"oceanic","ko":"대양의","reason":"동의어 - 바다의"},{"w":"naval","ko":"해군의","reason":"동의어 - 해병대의"},{"w":"life","ko":"생물","reason":"콜로케이션 - marine life"}],"collocBest":[{"en":"marine life","ko":"해양 생물"},{"en":"marine biology","ko":"해양 생물학"}]},"nuance":{"koSimple":"바다에 관한.","whenToUse":"해양 생물·해양학·해병대를 말할 때."},"krDetail":[{"ko":"해양의","explain":"바닷물이나 바다와 관련된"},{"ko":"해병대","explain":"바다와 육지에서 함께 싸우는 군인 부대"}],"usageExamples":[{"en":"Marine biologists study the strange creatures of the deep sea.","ko":"해양 생물학자들은 심해의 이상한 생물을 연구한다."},{"en":"His brother serves as a marine in the navy.","ko":"그의 형은 해군에서 해병으로 복무한다."}],"grammarNote":"marine은 형용사로 명사 앞에서만 자연스러운 한정적 용법으로 쓰인다. 서술적으로 The animal is marine.은 어색하고 The animal is aquatic/oceanic.을 선호한다.","grammarQuiz":[{"sentence":"Scientists have discovered many _____ species living in areas _____ pollution has affected the ecosystem.","ko":"과학자들은 오염이 생태계에 영향을 미친 지역에 사는 많은 해양 종을 발견했다.","answer":["marine","where"],"hint":"형용사 marine과 관계부사"}]},
