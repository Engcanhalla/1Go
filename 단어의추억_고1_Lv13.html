    {"id":"w03259","w":"incredibly","pos":["adv"],"ph":"/ɪnˈkredɪbli/","cefr":"B1","kr":["믿을 수 없을 만큼","엄청나게"],"ex":[{"en":"The test was incredibly hard.","ko":"그 시험은 엄청나게 어려웠다."}],"mnemonic":{"soundHint":"인크레더블(incredible)+리","story":"'인크레더블'하게 엄청나게(incredibly)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"amazingly","ko":"놀랍게도","reason":"동의어 부사로 강조어 자리를 공유"},{"w":"fast","ko":"빠른","reason":"incredibly fast 콜로케이션의 짝"},{"w":"beautiful","ko":"아름다운","reason":"incredibly beautiful 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"믿기 어려울 만큼 아주.","whenToUse":"강조 부사로 놀랄 만큼 대단할 때."},"krDetail":[{"ko":"믿을 수 없을 만큼","explain":"정도가 참으로 놀라워서 그 사실을 받아들이기 힘든 상태로"},{"ko":"엄청나게","explain":"정도가 매우 심하고 굉장하게, 보통 수준을 훨씬 넘어서는 모양으로"}],"usageExamples":[{"en":"The chef prepared an incredibly delicious meal for the important guests tonight.","ko":"그 요리사는 오늘 밤 중요한 손님들을 위해 엄청나게 맛있는 식사를 준비했다."},{"en":"This new laptop runs incredibly fast compared to my previous model.","ko":"이 새 노트북은 내 이전 모델에 비해 믿을 수 없을 만큼 빠르게 작동한다."}],"grammarNote":"부사 incredibly는 형용사나 다른 부사를 강조하는 역할이지 명사를 꾸미지 못합니다. 'incredibly car'는 틀리고 'incredibly fast car'가 맞습니다. 학생들은 형용사와 부사 형태를 자주 헷갈립니다.","grammarQuiz":[{"sentence":"The sunset over the mountain looked _____ beautiful and made _____ speechless.","ko":"산 너머의 일몰은 엄청나게 아름다워 보였고 우리를 말문이 막히게 만들었다.","answer":["incredibly","us"],"hint":"부사+목적어"}]},
    {"id":"w03268","w":"indeed","pos":["adv"],"ph":"/ɪnˈdiːd/","cefr":"B1","kr":["정말로","사실"],"ex":[{"en":"She was indeed very talented.","ko":"그녀는 정말로 매우 재능 있었다."}],"mnemonic":{"soundHint":"인 디드(정말로 그랬어)","story":"'Indeed!' 정말로! 강한 긍정","hintConfidence":2},"pairs":{"buddyWords":[{"w":"truly","ko":"진실로","reason":"동의어로 강조 자리를 공유"},{"w":"certainly","ko":"확실히","reason":"동의어이자 강한 긍정 시나리오에서 짝"},{"w":"friend","ko":"친구","reason":"'A friend in need is a friend indeed' 속담의 짝"}],"collocBest":[]},"nuance":{"koSimple":"정말로, 사실 그렇다는 강조.","whenToUse":"앞말을 확인·강조할 때."},"krDetail":[{"ko":"정말로","explain":"말한 사실이 진짜임을 강조하며 그것이 참됨을 힘 있게 드러내는 뜻으로"},{"ko":"사실","explain":"앞의 말을 더욱 굳게 다지거나 실제로 그러함을 다시 한번 힘주어 나타내는 뜻으로"}],"usageExamples":[{"en":"Winning first prize truly indeed changed the young musician's life forever.","ko":"1등상을 탄 것은 정말로 그 어린 음악가의 인생을 영원히 바꿔놓았다."},{"en":"The novel is indeed one of the greatest works of the century.","ko":"그 소설은 사실 이 세기 최고의 작품들 중 하나이다."}],"grammarNote":"indeed는 문장 끝, 중간, 앞 어디에나 올 수 있으며 강조의 뜻을 더합니다. 'very ~ indeed' 구조로 매우 자주 쓰이고, 학생들은 이 관용 표현을 몰라 'very indeed good'처럼 어색하게 배치합니다.","grammarQuiz":[{"sentence":"Thank you very much _____ for helping me prepare _____ the important interview.","ko":"중요한 면접 준비를 도와줘서 정말 대단히 고맙습니다.","answer":["indeed","for"],"hint":"부사+전치사"}]},
    {"id":"w03272","w":"independence","pos":["n"],"ph":"/ˌɪndɪˈpendəns/","cefr":"B1","kr":["독립","자립"],"ex":[{"en":"Korea celebrated its independence.","ko":"한국은 독립을 기념했다."}],"mnemonic":{"soundHint":"인(in=not)+디펜던스(dependence)","story":"의존(dependence) 없음(in)=독립(independence)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"freedom","ko":"자유","reason":"동의어로 독립 운동 시나리오에서 짝"},{"w":"dependence","ko":"의존","reason":"명확한 반의어 관계"},{"w":"declaration","ko":"선언","reason":"declaration of independence 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"남에게 기대지 않는 상태.","whenToUse":"국가 독립·경제 자립 얘기할 때."},"krDetail":[{"ko":"독립","explain":"다른 나라나 사람에게 얽매이지 않고 스스로의 힘으로 다스리거나 살아가는 상태"},{"ko":"자립","explain":"남의 도움을 받지 않고 스스로의 힘으로 서서 살아가는 능력이나 상태"}],"usageExamples":[{"en":"Many young adults value financial independence as they start their careers.","ko":"많은 젊은 성인들은 직장 생활을 시작할 때 재정적 독립을 소중히 여긴다."},{"en":"The country celebrated its independence from colonial rule every August fifteenth.","ko":"그 나라는 매년 8월 15일에 식민 통치로부터의 독립을 기념했다."}],"grammarNote":"independence는 불가산명사로 복수형이 없고 관사 사용에 주의가 필요합니다. 'gain independence'처럼 관사 없이 쓰이거나 'the independence of ~' 형태로 특정할 때 the를 씁니다. 학생들은 'an independence'로 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"After graduation, she moved to another city to gain _____ from her _____.","ko":"졸업 후, 그녀는 부모로부터의 독립을 얻기 위해 다른 도시로 이사했다.","answer":["independence","parents"],"hint":"명사+명사"}]},
    {"id":"w03273","w":"independent","pos":["adj"],"ph":"/ˌɪndɪˈpendənt/","cefr":"B1","kr":["독립적인","자립적인"],"ex":[{"en":"She is an independent thinker.","ko":"그녀는 독립적인 사상가이다."}],"mnemonic":{"soundHint":"인(in=not)+디펜던트(dependent)","story":"의존(dependent) 없음(in)=독립적인(independent)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"autonomous","ko":"자율적인","reason":"동의어로 형식적 문맥에서 대체 가능"},{"w":"dependent","ko":"의존적인","reason":"명확한 반의어 관계"},{"w":"decision","ko":"결정","reason":"independent decision 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"혼자 힘으로 해내는.","whenToUse":"스스로 결정·생활하는 사람에게."},"krDetail":[{"ko":"독립적인","explain":"다른 사람이나 것에 기대지 않고 스스로 판단하고 행동하는 성질을 가진"},{"ko":"자립적인","explain":"남의 도움 없이 스스로의 힘으로 생활하거나 일할 수 있는 능력을 가진"}],"usageExamples":[{"en":"The teacher encouraged her students to make independent decisions about future careers.","ko":"그 교사는 학생들이 장래 직업에 관해 독립적인 결정을 내리도록 격려했다."},{"en":"Being financially independent gives young people confidence in daily life choices.","ko":"재정적으로 자립적인 것은 젊은이들에게 일상생활 선택에서 자신감을 준다."}],"grammarNote":"independent 뒤에는 전치사 of 또는 from이 오며 미묘한 뜻 차이가 있습니다. 'independent of parents'는 부모에게 의존하지 않는다는 뜻, 'independent from ~'는 분리·해방의 뜻이 강합니다. 학생들은 by나 with를 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"She has been completely _____ of her family since she _____ college five years ago.","ko":"그녀는 5년 전 대학을 졸업한 이후로 가족으로부터 완전히 독립적이었다.","answer":["independent","finished"],"hint":"형용사+과거동사"}]},
    {"id":"w03275","w":"index","pos":["n","v"],"ph":"/ˈɪndeks/","cefr":"B1","kr":["색인","지수"],"ex":[{"en":"Check the index for keywords.","ko":"색인에서 키워드를 확인하라."}],"mnemonic":{"soundHint":"인덱스 카드","story":"'인덱스'는 도서관 카드나 웹페이지 색인처럼 한국어에도 그대로 쓰이는 외래어다. 물가지수(price index)도 같은 단어.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"catalog","ko":"목록","reason":"동의어로 자료 정리 시나리오에서 짝"},{"w":"finger","ko":"손가락","reason":"index finger(집게손가락) 콜로케이션의 짝"},{"w":"price","ko":"가격","reason":"price index 콜로케이션의 짝"}],"collocBest":[{"en":"book index","ko":"책 색인"},{"en":"price index","ko":"물가 지수"}]},"nuance":{"koSimple":"찾아보기 쉽게 만든 목록.","whenToUse":"책 뒤 색인·물가 지수 얘기할 때."},"krDetail":[{"ko":"색인","explain":"책의 뒤쪽에 나오는 여러 단어와 그 단어가 나오는 쪽수를 가나다순으로 정리한 목록"},{"ko":"지수","explain":"여러 값들의 변화 정도를 하나의 숫자로 나타내어 견주기 쉽게 만든 표시"}],"usageExamples":[{"en":"The professor checked the book's index to find the correct chapter quickly.","ko":"교수는 정확한 장을 빨리 찾기 위해 책의 색인을 확인했다."},{"en":"The consumer price index has risen sharply over the past six months.","ko":"소비자 물가 지수가 지난 6개월 동안 급격히 상승했다."}],"grammarNote":"index의 복수형은 indexes(일반적 색인)와 indices(수학·통계의 지수) 두 가지가 있고 문맥에 따라 다르게 씁니다. 학생들은 항상 indexes만 쓰지만, 학술적 문맥에서는 indices가 더 정확합니다.","grammarQuiz":[{"sentence":"Please look at the _____ at the back of the book if you _____ find the topic.","ko":"그 주제를 찾을 수 없으면 책 뒤쪽의 색인을 살펴보세요.","answer":["index","cannot"],"hint":"명사+조동사부정"}]},
    {"id":"w03276","w":"indicate","pos":["v"],"ph":"/ˈɪndɪkeɪt/","cefr":"B1","kr":["나타내다","지시하다"],"ex":[{"en":"The sign indicates danger.","ko":"그 표지판은 위험을 나타낸다."}],"mnemonic":{"soundHint":"인덱스(index)+케이트","story":"인덱스(index)로 콕 짚어 나타내다(indicate)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"show","ko":"보여주다","reason":"동의어로 지시·표시 자리 공유"},{"w":"suggest","ko":"시사하다","reason":"'~을 나타내다'는 학술 문맥에서 대체 가능"},{"w":"direction","ko":"방향","reason":"indicate a direction 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"신호로 알려 주다.","whenToUse":"표지·데이터가 사실을 보여줄 때."},"krDetail":[{"ko":"나타내다","explain":"생각·느낌·상태 등을 겉으로 드러내어 남이 알 수 있게 보여주다"},{"ko":"지시하다","explain":"손짓·말·표시 등으로 어떤 곳이나 대상을 정확히 가리켜 알려주다"}],"usageExamples":[{"en":"Recent studies indicate that regular exercise significantly reduces stress and anxiety levels.","ko":"최근 연구들은 규칙적인 운동이 스트레스와 불안 수준을 크게 줄여준다는 것을 나타낸다."},{"en":"The arrow on the map clearly indicates the direction to the exit.","ko":"지도 위의 화살표는 출구로 가는 방향을 명확히 지시한다."}],"grammarNote":"indicate 뒤에는 명사(구), that절, 또는 wh-절이 옵니다. 학생들이 자주 하는 실수는 'indicate to me the direction'처럼 사람 목적어 앞에 to를 쓰는 것으로, 'indicate the direction to me'가 자연스럽습니다.","grammarQuiz":[{"sentence":"The dark clouds in the sky clearly _____ _____ a storm is coming soon.","ko":"하늘의 어두운 구름은 폭풍이 곧 온다는 것을 명확히 나타낸다.","answer":["indicate","that"],"hint":"동사+접속사"}]},
    {"id":"w03288","w":"individual","pos":["n","adj"],"ph":"/ˌɪndɪˈvɪdʒuəl/","cefr":"B1","kr":["개인","개별적인"],"ex":[{"en":"Each individual has unique strengths.","ko":"각 개인은 독특한 강점을 가지고 있다."}],"mnemonic":{"soundHint":"인디(indie)+비주얼","story":"각자 '인디(indie)' 비주얼(visual)을 가진 개인(individual)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collective","ko":"집단적인","reason":"명확한 반의어 관계"},{"w":"person","ko":"사람","reason":"동의어로 개인 지칭에서 짝"},{"w":"rights","ko":"권리","reason":"individual rights 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"집단이 아닌 한 사람.","whenToUse":"개인의 권리·특성·개별 대응을 말할 때."},"krDetail":[{"ko":"개인","explain":"집단이나 사회를 이루는 낱낱의 사람을 하나하나 따로 놓고 이르는 말"},{"ko":"개별적인","explain":"여럿을 하나로 뭉뚱그리지 않고 하나하나 따로 떨어져 각각인"}],"usageExamples":[{"en":"Every individual has the right to express their own thoughts and opinions freely.","ko":"모든 개인은 자신의 생각과 의견을 자유롭게 표현할 권리가 있다."},{"en":"Our school offers individual tutoring sessions to help struggling students succeed.","ko":"우리 학교는 어려움을 겪는 학생들이 성공하도록 개별적인 튜터링 시간을 제공한다."}],"grammarNote":"individual은 명사와 형용사 두 역할을 하는데 학생들은 자주 형용사로만 인식합니다. 명사로 쓸 때는 'each individual', 'private individuals'처럼 사람을 뜻하고, 문맥으로 구별해야 합니다.","grammarQuiz":[{"sentence":"Every _____ in this class has _____ own unique learning style and pace.","ko":"이 반의 모든 개인은 각자 자신만의 독특한 학습 방식과 속도를 가지고 있다.","answer":["individual","their"],"hint":"명사+소유격"}]},
    {"id":"w03295","w":"industrial","pos":["adj"],"ph":"/ɪnˈdʌstriəl/","cefr":"B1","kr":["산업의","공업의"],"ex":[{"en":"The city has an industrial zone.","ko":"그 도시에는 공업 지역이 있다."}],"mnemonic":{"soundHint":"인더스트리(industry)+얼","story":"인더스트리(industry) 관련된=산업의(industrial)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"revolution","ko":"혁명","reason":"industrial revolution 콜로케이션의 짝"},{"w":"manufacturing","ko":"제조의","reason":"동의어로 산업 관련 자리 공유"},{"w":"agricultural","ko":"농업의","reason":"명확한 반의어 관계"}],"collocBest":[]},"nuance":{"koSimple":"공장에서 물건 만드는 것과 관련한.","whenToUse":"공업 지역·산업 혁명 이야기할 때."},"krDetail":[{"ko":"산업의","explain":"여러 물건을 만들거나 서비스를 제공하는 큰 규모의 일과 관련된"},{"ko":"공업의","explain":"기계와 시설을 써서 원료를 가공해 새 물건을 만드는 일과 관련된"}],"usageExamples":[{"en":"The Industrial Revolution completely changed how people lived and worked in Europe.","ko":"산업 혁명은 유럽에서 사람들이 사는 방식과 일하는 방식을 완전히 바꾸었다."},{"en":"Many old industrial buildings have been transformed into modern art galleries.","ko":"많은 오래된 공업 건물들이 현대적인 미술관으로 탈바꿈되었다."}],"grammarNote":"industrial(형용사, 산업의)과 industrious(형용사, 근면한)를 자주 혼동합니다. 산업에 관련된 것은 industrial, 사람의 성실함을 나타낼 때는 industrious입니다. 발음도 비슷해 학생들이 자주 실수합니다.","grammarQuiz":[{"sentence":"The government plans to develop the _____ region and _____ many new jobs.","ko":"정부는 그 공업 지역을 개발하여 많은 새로운 일자리를 만들 계획이다.","answer":["industrial","create"],"hint":"형용사+동사원형"}]},
    {"id":"w03298","w":"industry","pos":["n"],"ph":"/ˈɪndəstri/","cefr":"B1","kr":["산업","공업"],"ex":[{"en":"The tech industry is growing fast.","ko":"기술 산업이 빠르게 성장하고 있다."}],"mnemonic":{"soundHint":"인 더스트(dust 먼지)+리","story":"공장의 더스트(dust)가 나는 곳=산업(industry)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"sector","ko":"부문","reason":"동의어로 경제 문맥에서 짝"},{"w":"tourism","ko":"관광","reason":"tourism industry 콜로케이션의 짝"},{"w":"manufacturing","ko":"제조","reason":"manufacturing industry 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"물건이나 서비스를 만드는 큰 분야.","whenToUse":"관광·IT 등 분야 전체를 가리킬 때."},"krDetail":[{"ko":"산업","explain":"물건을 만들거나 서비스를 팔아 돈을 버는 크고 조직적인 경제 활동"},{"ko":"공업","explain":"기계와 사람의 힘을 써서 원료를 가공해 물건을 만들어 파는 일"}],"usageExamples":[{"en":"The tourism industry has grown rapidly across Southeast Asia in recent years.","ko":"관광 산업은 최근 몇 년 동안 동남아시아 전역에서 빠르게 성장했다."},{"en":"The country's automobile industry supports millions of workers and their families.","ko":"그 나라의 자동차 공업은 수백만 명의 노동자와 가족을 지원한다."}],"grammarNote":"industry는 특정 분야를 말할 때 'the ~ industry' 형태로 the가 필요합니다. 학생들은 'in tourism industry'처럼 관사를 빠뜨리기 쉬운데, 'in the tourism industry'가 맞습니다. 일반적 의미의 '산업 활동'은 관사 없이 씁니다.","grammarQuiz":[{"sentence":"The film _____ in Korea has been growing _____ over the past decade.","ko":"한국의 영화 산업은 지난 10년간 빠르게 성장해 왔다.","answer":["industry","rapidly"],"hint":"명사+부사"}]},
    {"id":"w03313","w":"inexperienced","pos":["adj"],"ph":"/ˌɪnɪkˈspɪəriənst/","cefr":"B1","kr":["경험이 없는","미숙한"],"ex":[{"en":"He was young and inexperienced.","ko":"그는 젊고 경험이 없었다."}],"mnemonic":{"soundHint":"인(in=not)+익스피어리언스(experience)","story":"in(not)+experienced(경험)=경험 없는(inexperienced)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"experienced","ko":"경험 많은","reason":"명확한 반의어 관계"},{"w":"novice","ko":"초보자","reason":"동의어로 신참 시나리오에서 짝"},{"w":"worker","ko":"직원","reason":"inexperienced worker 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"해 본 적이 적어 서툰.","whenToUse":"신입·초보자를 설명할 때."},"krDetail":[{"ko":"경험이 없는","explain":"어떤 일을 실제로 해본 적이 없어 그 일에 대해 잘 모르는 상태인"},{"ko":"미숙한","explain":"일 처리 능력이 아직 익숙하지 않아 서투르고 부족한 상태인"}],"usageExamples":[{"en":"The inexperienced driver made several mistakes during the long highway journey.","ko":"그 경험이 없는 운전자는 긴 고속도로 여행 중 몇 번의 실수를 저질렀다."},{"en":"Even inexperienced cooks can prepare this simple recipe with some practice.","ko":"미숙한 요리사라도 약간의 연습으로 이 간단한 요리법을 만들 수 있다."}],"grammarNote":"inexperienced 뒤에 in 또는 at을 붙여 '어떤 분야에서 경험이 없는'을 나타냅니다. 학생들은 with를 잘못 쓰기 쉬운데, 'inexperienced in teaching' 또는 'inexperienced at driving'이 자연스럽습니다.","grammarQuiz":[{"sentence":"Being _____ in this field, the young worker _____ many questions to seniors.","ko":"이 분야에 경험이 없어서, 그 젊은 직원은 선배들에게 많은 질문을 했다.","answer":["inexperienced","asked"],"hint":"형용사+과거동사"}]},
    {"id":"w03320","w":"infancy","pos":["n"],"ph":"/ˈɪnfənsi/","cefr":"B1","kr":["유아기","초기"],"ex":[{"en":"The technology is in its infancy.","ko":"그 기술은 초기 단계에 있다."}],"mnemonic":{"soundHint":"인펀트(infant)+시","story":"인펀트(infant 유아)의 시절=유아기(infancy)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"beginning","ko":"초기, 시작","reason":"'in its infancy' 관용 표현의 짝, 동의어"},{"w":"maturity","ko":"성숙기","reason":"명확한 반의어 관계"},{"w":"stage","ko":"단계","reason":"in its infancy가 초기 단계를 뜻할 때의 짝"}],"collocBest":[]},"nuance":{"koSimple":"막 태어난 시기, 아주 초기.","whenToUse":"아기 시절·초기 단계를 말할 때."},"krDetail":[{"ko":"유아기","explain":"아기가 태어난 뒤 스스로 걷고 말하기 전까지의 아주 어린 시기"},{"ko":"초기","explain":"어떤 일이나 상태가 처음으로 시작되어 얼마 지나지 않은 때"}],"usageExamples":[{"en":"During infancy, babies rapidly develop many important physical and mental abilities.","ko":"유아기 동안, 아기들은 많은 중요한 신체적·정신적 능력을 빠르게 발달시킨다."},{"en":"Electric car technology is still in its infancy compared to gasoline vehicles.","ko":"전기차 기술은 가솔린 차량에 비해 여전히 초기 단계에 있다."}],"grammarNote":"in one's infancy는 '초기 단계'라는 관용 표현으로 자주 쓰입니다. 학생들은 'at infancy'로 잘못 쓰기 쉽지만, 'in infancy' 또는 'in its infancy'가 맞는 표현입니다.","grammarQuiz":[{"sentence":"The new online business is still in _____ _____ and needs more investment.","ko":"그 새 온라인 사업은 여전히 초기 단계에 있어 더 많은 투자가 필요하다.","answer":["its","infancy"],"hint":"소유격+명사"}]},
    {"id":"w03321","w":"infant","pos":["n"],"ph":"/ˈɪnfənt/","cefr":"B1","kr":["유아","갓난아기"],"ex":[{"en":"The infant slept all afternoon.","ko":"그 유아는 오후 내내 잤다."}],"mnemonic":{"soundHint":"인(in=not)+팬트(fant 말하다)","story":"in(not)+fant(말하다)=말 못하는 유아(infant)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"baby","ko":"아기","reason":"동의어로 육아 시나리오의 짝"},{"w":"adult","ko":"성인","reason":"명확한 반의어 관계"},{"w":"care","ko":"돌봄","reason":"infant care 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"아직 걷지 못하는 아기.","whenToUse":"의료·발달에서 갓난아기 지칭할 때."},"krDetail":[{"ko":"유아","explain":"태어난 지 얼마 되지 않아 스스로 걷지 못하는 어린 아이"},{"ko":"갓난아기","explain":"세상에 나온 지 얼마 안 되어 아직 아무것도 스스로 하지 못하는 아기"}],"usageExamples":[{"en":"The nurse gently held the newborn infant and gave him warm milk.","ko":"그 간호사는 갓난아기를 부드럽게 안고 따뜻한 우유를 먹였다."},{"en":"Doctors regularly monitor infant development during the first two crucial years.","ko":"의사들은 처음 2년의 결정적인 기간 동안 유아 발달을 정기적으로 관찰한다."}],"grammarNote":"infant는 셀 수 있는 명사로 관사가 필요합니다. 형용사처럼 쓰여 다른 명사를 꾸미기도 하는데 'infant mortality(영아 사망률)'처럼 씁니다. 학생들은 관사를 빼고 'infant needs care'로 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"The young mother carried her _____ carefully as she _____ down the stairs.","ko":"그 젊은 엄마는 계단을 내려가면서 아기를 조심스럽게 안고 갔다.","answer":["infant","walked"],"hint":"명사+과거동사"}]},
    {"id":"w03323","w":"infect","pos":["v"],"ph":"/ɪnˈfekt/","cefr":"B1","kr":["감염시키다","오염시키다"],"ex":[{"en":"The virus infected thousands.","ko":"그 바이러스는 수천 명을 감염시켰다."}],"mnemonic":{"soundHint":"인(안으로)+펙트(fect)","story":"몸 안으로(in) 병균을 심어 감염시키다(infect)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"virus","ko":"바이러스","reason":"virus가 사람을 infect하는 시나리오에서 짝"},{"w":"cure","ko":"치료하다","reason":"명확한 반의어 관계"},{"w":"spread","ko":"퍼지다","reason":"감염 전파 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"병균이 몸에 옮다.","whenToUse":"바이러스·세균이 퍼지는 상황에."},"krDetail":[{"ko":"감염시키다","explain":"병을 일으키는 세균이나 바이러스를 다른 사람이나 동물의 몸에 옮기다"},{"ko":"오염시키다","explain":"깨끗한 것에 병균이나 나쁜 것을 섞어 더럽고 나쁘게 만들다"}],"usageExamples":[{"en":"The sick student accidentally infected several classmates before staying home.","ko":"그 아픈 학생은 집에 머물기 전에 우연히 여러 반 친구를 감염시켰다."},{"en":"This virus can easily infect people through the air and contaminated surfaces.","ko":"이 바이러스는 공기와 오염된 표면을 통해 사람들을 쉽게 감염시킬 수 있다."}],"grammarNote":"infect는 타동사로 뒤에 반드시 목적어(사람·동물)가 옵니다. 학생들은 자동사로 착각해 'He infected'만 쓰고 끝내는 실수를 합니다. 'be infected with (병명)'처럼 수동태로도 자주 씁니다.","grammarQuiz":[{"sentence":"One coughing passenger can _____ many others if he _____ not wear a mask.","ko":"기침하는 한 명의 승객이 마스크를 쓰지 않으면 많은 다른 사람들을 감염시킬 수 있다.","answer":["infect","does"],"hint":"동사+조동사"}]},
    {"id":"w03324","w":"infection","pos":["n"],"ph":"/ɪnˈfekʃən/","cefr":"B1","kr":["감염","전염"],"ex":[{"en":"She had a throat infection.","ko":"그녀는 목 감염이 있었다."}],"mnemonic":{"soundHint":"인펙트(infect)+ㅅㅕㄴ","story":"인펙트(infect)의 결과=감염(infection)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bacterial","ko":"세균의","reason":"bacterial infection 콜로케이션의 짝"},{"w":"prevent","ko":"예방하다","reason":"prevent infection 콜로케이션의 짝"},{"w":"disease","ko":"질병","reason":"동의어로 의료 문맥에서 짝"}],"collocBest":[]},"nuance":{"koSimple":"병균이 몸에 들어와 생긴 병.","whenToUse":"목·상처의 감염 상태 설명할 때."},"krDetail":[{"ko":"감염","explain":"병을 일으키는 나쁜 미생물이 몸속에 들어가 병에 걸리게 되는 상태"},{"ko":"전염","explain":"병이나 나쁜 습관 등이 한 사람에게서 다른 사람에게 옮겨 퍼지는 일"}],"usageExamples":[{"en":"The doctor prescribed antibiotics to treat the serious bacterial infection quickly.","ko":"의사는 심각한 세균 감염을 빨리 치료하기 위해 항생제를 처방했다."},{"en":"Washing your hands often is the best way to prevent infection at home.","ko":"손을 자주 씻는 것은 집에서 감염을 예방하는 최고의 방법이다."}],"grammarNote":"infection은 셀 수 있는 명사(특정 감염)와 셀 수 없는 명사(감염이라는 개념) 두 가지로 쓰입니다. 학생들은 'ear infection(귀 감염)'처럼 관사를 붙여야 하는데 종종 빠뜨립니다. 'prevent infection'처럼 일반 개념일 때는 관사 없이 씁니다.","grammarQuiz":[{"sentence":"Frequent hand washing helps prevent the spread of _____ in _____ hospital.","ko":"잦은 손 씻기는 병원에서 감염의 확산을 예방하는 데 도움이 된다.","answer":["infection","a"],"hint":"명사+관사"}]},
    {"id":"w03325","w":"infectious","pos":["adj"],"ph":"/ɪnˈfekʃəs/","cefr":"B1","kr":["전염성의","감염성의"],"ex":[{"en":"Laughter can be infectious.","ko":"웃음은 전염될 수 있다."}],"mnemonic":{"soundHint":"인펙트(infect)+ㅅㅕㅅ","story":"인펙트(infect)의 형용사=전염성의(infectious)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"contagious","ko":"전염성의","reason":"동의어로 의료 문맥의 짝"},{"w":"disease","ko":"질병","reason":"infectious disease 콜로케이션의 짝"},{"w":"smile","ko":"미소","reason":"'infectious smile'(전염성 있는 미소) 비유적 짝"}],"collocBest":[]},"nuance":{"koSimple":"쉽게 남에게 옮는.","whenToUse":"전염병·웃음처럼 퍼지는 것에."},"krDetail":[{"ko":"전염성의","explain":"병이나 감정이 한 사람에게서 다른 사람에게 쉽게 옮겨가는 성질을 가진"},{"ko":"감염성의","explain":"미생물이나 바이러스가 다른 몸으로 옮겨가 병을 일으키는 성질을 가진"}],"usageExamples":[{"en":"The infectious disease spread quickly through the whole village last summer.","ko":"그 전염병은 지난 여름 마을 전체에 빠르게 퍼졌다."},{"en":"Her infectious laughter made everyone at the party feel happy and relaxed.","ko":"그녀의 전염성 있는 웃음소리는 파티에 모인 모두를 행복하고 편안하게 만들었다."}],"grammarNote":"infectious와 contagious는 뜻이 비슷하지만 미묘한 차이가 있습니다. infectious는 병균·바이러스로 옮는 병, contagious는 직접 접촉으로 옮는 병에 주로 씁니다. 학생들은 구별 없이 쓰지만 학술적으로는 다릅니다.","grammarQuiz":[{"sentence":"The child was diagnosed with a highly _____ disease and _____ to stay home.","ko":"그 아이는 매우 전염성이 강한 병으로 진단받아 집에 머물러야 했다.","answer":["infectious","had"],"hint":"형용사+조동사과거"}]},
    {"id":"w03340","w":"influence","pos":["n","v"],"ph":"/ˈɪnfluəns/","cefr":"B1","kr":["영향","영향을 미치다"],"ex":[{"en":"Music can influence our mood.","ko":"음악은 우리의 기분에 영향을 줄 수 있다."}],"mnemonic":{"soundHint":"인플루엔자(독감)+스","story":"인플루엔자처럼 안으로 흘러 영향(influence)을 주다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"impact","ko":"영향","reason":"동의어로 자주 대체되는 짝"},{"w":"affect","ko":"영향을 미치다","reason":"동의어 동사, 문장 구조 공유"},{"w":"media","ko":"매체","reason":"media influence 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"조용히 스며들어 바꾸는 힘.","whenToUse":"사람·환경이 변화를 이끌 때."},"krDetail":[{"ko":"영향","explain":"어떤 일이나 사람이 다른 일이나 사람의 생각·행동·상태에 미치는 힘이나 결과"},{"ko":"영향을 미치다","explain":"어떤 대상의 생각·행동·상태를 바꾸거나 좌우하는 힘을 발휘하다"}],"usageExamples":[{"en":"Social media strongly influences how modern teenagers view their body and beauty.","ko":"소셜 미디어는 현대 십대들이 자신의 몸과 아름다움을 보는 방식에 강한 영향을 미친다."},{"en":"Her mother's kind teachings had a lasting influence on her adult decisions.","ko":"그녀 어머니의 친절한 가르침은 그녀의 성인 결정에 지속적인 영향을 미쳤다."}],"grammarNote":"influence는 명사와 동사 모두로 쓰이며, 명사일 때 전치사 on을 씁니다. 'influence on'이 맞고 'influence to'는 틀립니다. 동사일 때는 전치사 없이 목적어를 바로 취합니다. 학생들은 'influence to people'처럼 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"Parents have a huge _____ on _____ children's habits and future choices.","ko":"부모는 자녀의 습관과 미래 선택에 큰 영향을 미친다.","answer":["influence","their"],"hint":"명사+소유격"}]},
    {"id":"w03342","w":"informal","pos":["adj"],"ph":"/ɪnˈfɔːrməl/","cefr":"B1","kr":["비공식적인","격식 없는"],"ex":[{"en":"We had an informal chat after class.","ko":"수업 후 격식 없는 대화를 나눴다."}],"mnemonic":{"soundHint":"인(in=not)+포멀(formal)","story":"in(not)+formal(공식)=비공식의(informal)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"casual","ko":"격식 없는","reason":"동의어로 격식 수준 공유"},{"w":"formal","ko":"공식적인","reason":"명확한 반의어 관계"},{"w":"meeting","ko":"회의","reason":"informal meeting 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"딱딱하지 않고 편한.","whenToUse":"친구끼리 대화·비공식 모임 얘기."},"krDetail":[{"ko":"비공식적인","explain":"정해진 규칙이나 절차를 따르지 않고 편안한 분위기에서 이루어지는"},{"ko":"격식 없는","explain":"예의나 절차를 크게 따지지 않고 편하고 자유롭게 대하거나 이루어지는"}],"usageExamples":[{"en":"The team had an informal discussion about the project during the coffee break.","ko":"그 팀은 커피 시간 중에 프로젝트에 관한 비공식적인 논의를 했다."},{"en":"In informal writing, people often use short forms and simpler vocabulary.","ko":"격식 없는 글에서, 사람들은 종종 축약형과 더 단순한 어휘를 사용한다."}],"grammarNote":"informal은 형용사로 명사 앞에 위치하거나 be동사 뒤에서 보어로 씁니다. 반대말 formal과 대비해서 자주 나옵니다. 학생들은 부사형 informally와 헷갈려 'speak informal'로 쓰는 실수를 하는데, 'speak informally'가 맞습니다.","grammarQuiz":[{"sentence":"The professor prefers _____ discussions where students _____ feel free to speak.","ko":"그 교수는 학생들이 자유롭게 말할 수 있는 비공식적인 토론을 선호한다.","answer":["informal","can"],"hint":"형용사+조동사"}]},
    {"id":"w03344","w":"informative","pos":["adj"],"ph":"/ɪnˈfɔːrmətɪv/","cefr":"B1","kr":["유익한","정보를 주는"],"ex":[{"en":"The lecture was very informative.","ko":"그 강의는 매우 유익했다."}],"mnemonic":{"soundHint":"인포(info 정보)+머티브","story":"인포(info 정보)를 주는=유익한(informative)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"educational","ko":"교육적인","reason":"동의어로 지식 전달 문맥의 짝"},{"w":"book","ko":"책","reason":"informative book 콜로케이션의 짝"},{"w":"discussion","ko":"토론","reason":"informative discussion 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"새로운 정보를 알려 주는.","whenToUse":"강의·책이 배울 게 많다고 할 때."},"krDetail":[{"ko":"유익한","explain":"듣거나 읽는 이에게 도움이 될 만한 알찬 정보와 지식을 담고 있는"},{"ko":"정보를 주는","explain":"어떤 사실이나 상황에 대해 잘 알 수 있도록 자세한 내용을 알려주는"}],"usageExamples":[{"en":"The lecture on ancient history was both entertaining and highly informative for students.","ko":"고대사 강의는 학생들에게 재미있으면서도 매우 유익했다."},{"en":"This informative documentary explains climate change in a simple, easy-to-understand way.","ko":"이 유익한 다큐멘터리는 기후 변화를 간단하고 이해하기 쉬운 방식으로 설명한다."}],"grammarNote":"informative는 형용사로 사물(책·강의·기사 등)을 꾸미며 사람을 직접 꾸미지 않습니다. 학생들이 'He is informative'라 하면 어색하고, 'His talk is informative'가 자연스럽습니다.","grammarQuiz":[{"sentence":"The teacher's presentation was so _____ that all students _____ careful notes.","ko":"그 선생님의 발표는 너무나 유익해서 모든 학생이 열심히 필기했다.","answer":["informative","took"],"hint":"형용사+과거동사"}]},
    {"id":"w03356","w":"ingredient","pos":["n"],"ph":"/ɪnˈɡriːdiənt/","cefr":"B1","kr":["재료","성분"],"ex":[{"en":"Mix all the ingredients together.","ko":"모든 재료를 함께 섞어라."}],"mnemonic":{"soundHint":"인그리디언트(요리 재료)","story":"요리 방송의 '인그리디언트' 목록에 재료(ingredient) 등장","hintConfidence":2},"pairs":{"buddyWords":[{"w":"recipe","ko":"요리법","reason":"recipe와 ingredient는 요리 시나리오의 필수 짝"},{"w":"component","ko":"구성요소","reason":"동의어로 성분·요소 자리 공유"},{"w":"mix","ko":"섞다","reason":"mix ingredients 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"음식·물건을 만드는 재료.","whenToUse":"요리·성공의 요소를 말할 때."},"krDetail":[{"ko":"재료","explain":"음식이나 물건을 만들기 위해 쓰이는 낱낱의 기본 물질"},{"ko":"성분","explain":"어떤 것을 이루는 낱낱의 요소로, 그것이 무엇으로 되어 있는지 보여주는 부분"}],"usageExamples":[{"en":"The chef carefully selected fresh ingredients from the local farmers market yesterday.","ko":"그 요리사는 어제 지역 농부 시장에서 신선한 재료들을 조심스럽게 골랐다."},{"en":"Please check the ingredients list carefully if you have any food allergies.","ko":"음식 알레르기가 있다면 성분 목록을 주의 깊게 확인하십시오."}],"grammarNote":"ingredient는 셀 수 있는 명사로 대개 복수형 ingredients로 쓰입니다. 학생들은 단수 관사를 빠뜨리고 'add ingredient'라 쓰지만, 'add an ingredient' 또는 'add the ingredients'가 맞습니다.","grammarQuiz":[{"sentence":"Salt and pepper are the two most basic _____ used in _____ kitchen.","ko":"소금과 후추는 모든 주방에서 사용되는 가장 기본적인 두 가지 재료이다.","answer":["ingredients","every"],"hint":"복수명사+한정사"}]},
    {"id":"w03359","w":"inhale","pos":["v"],"ph":"/ɪnˈheɪl/","cefr":"B1","kr":["들이마시다","흡입하다"],"ex":[{"en":"She inhaled the fresh mountain air deeply and felt instantly refreshed.","ko":"그녀는 신선한 산 공기를 깊이 들이마시며 즉시 상쾌함을 느꼈다."}],"mnemonic":{"soundHint":"인(안으로)+헤일(hail)","story":"안(in)으로 헤일~ 숨을 들이마시다(inhale)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"exhale","ko":"내쉬다","reason":"명확한 반의어, 호흡 시나리오의 짝"},{"w":"breath","ko":"숨","reason":"숨을 들이마시는 대상의 짝"},{"w":"deeply","ko":"깊이","reason":"inhale deeply 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"공기를 코·입으로 들이마시다.","whenToUse":"신선한 공기·연기 들이쉴 때."},"krDetail":[{"ko":"들이마시다","explain":"코나 입으로 공기·냄새 등을 몸속으로 빨아들이다"},{"ko":"흡입하다","explain":"공기나 연기 같은 것을 안으로 힘 있게 빨아들여 몸속에 넣다"}],"usageExamples":[{"en":"The yoga instructor asked us to inhale slowly through our noses.","ko":"요가 강사는 우리에게 코로 천천히 숨을 들이마시라고 요청했다."},{"en":"Firefighters warned residents not to inhale the thick smoke from burning buildings.","ko":"소방관들은 주민들에게 불타는 건물에서 나오는 짙은 연기를 흡입하지 말라고 경고했다."}],"grammarNote":"inhale은 타동사와 자동사 모두 가능하며 반대말은 exhale입니다. 학생들은 'inhale in air'처럼 쓰지만, in의 뜻이 이미 포함되어 있어 'inhale air' 또는 그냥 'inhale'로 씁니다.","grammarQuiz":[{"sentence":"Before diving underwater, swimmers should _____ deeply and hold _____ breath.","ko":"물속에 잠수하기 전에, 수영하는 사람은 깊이 들이마시고 숨을 참아야 한다.","answer":["inhale","their"],"hint":"동사+소유격"}]},
    {"id":"w03362","w":"inherit","pos":["v"],"ph":"/ɪnˈherɪt/","cefr":"B1","kr":["상속하다","물려받다"],"ex":[{"en":"She inherited her mother's house.","ko":"그녀는 어머니의 집을 상속받았다."}],"mnemonic":{"soundHint":"인 헤리티지(heritage 유산)","story":"헤리티지(heritage)를 물려받다=상속하다(inherit)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"property","ko":"재산","reason":"inherit property 콜로케이션의 짝"},{"w":"traits","ko":"특성","reason":"inherit traits 콜로케이션의 짝, 유전 시나리오"},{"w":"ancestor","ko":"조상","reason":"상속하는 대상이 조상, 시나리오의 짝"}],"collocBest":[]},"nuance":{"koSimple":"윗대에서 재산·특성을 물려받다.","whenToUse":"유산 상속·유전 특성 말할 때."},"krDetail":[{"ko":"상속하다","explain":"부모나 친척이 세상을 떠난 뒤 그 사람의 재산이나 지위를 이어받다"},{"ko":"물려받다","explain":"부모나 조상으로부터 재산·성질·능력 등을 이어받아 자기 것으로 삼다"}],"usageExamples":[{"en":"She inherited a large sum of money from her wealthy grandfather last year.","ko":"그녀는 작년에 부유한 할아버지로부터 큰 액수의 돈을 상속받았다."},{"en":"Many children inherit their eye color and personality traits from both parents.","ko":"많은 아이들은 눈 색깔과 성격 특성을 부모 양쪽으로부터 물려받는다."}],"grammarNote":"inherit 뒤에는 대상(재산·특성)이 오고 사람 앞에 from을 씁니다. 학생들은 'inherit by father'처럼 by를 쓰는 실수를 하지만, 'inherit ~ from father'가 맞습니다. 수동태 be inherited from도 가능합니다.","grammarQuiz":[{"sentence":"The young writer _____ great literary talent _____ his famous novelist mother.","ko":"그 젊은 작가는 유명한 소설가 어머니로부터 뛰어난 문학적 재능을 물려받았다.","answer":["inherited","from"],"hint":"과거동사+전치사"}]},
    {"id":"w03366","w":"initial","pos":["adj","n"],"ph":"/ɪˈnɪʃəl/","cefr":"B1","kr":["초기의","첫 글자"],"ex":[{"en":"The initial results were positive.","ko":"초기 결과는 긍정적이었다."}],"mnemonic":{"soundHint":"이니셜(이름 첫 글자)","story":"이니셜(initial)=이름 첫 글자=초기의(initial)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"first","ko":"첫 번째의","reason":"동의어로 순서상 처음 자리 공유"},{"w":"final","ko":"최종의","reason":"명확한 반의어 관계"},{"w":"step","ko":"단계","reason":"initial step 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"맨 처음 단계의.","whenToUse":"첫 반응·첫 결과를 말할 때."},"krDetail":[{"ko":"초기의","explain":"어떤 일이나 상태가 시작된 지 얼마 되지 않은 처음 시기의"},{"ko":"첫 글자","explain":"사람의 이름이나 어떤 낱말의 맨 앞에 오는 첫 번째 글자"}],"usageExamples":[{"en":"The student's initial reaction to the difficult exam was complete disappointment.","ko":"그 학생의 어려운 시험에 대한 초기 반응은 완전한 실망이었다."},{"en":"Please write your initials clearly at the bottom of every important document.","ko":"모든 중요한 서류의 아래쪽에 이니셜(첫 글자)을 명확히 쓰십시오."}],"grammarNote":"initial은 형용사(초기의)와 명사(첫 글자) 두 가지 뜻이 있어 문맥으로 구별해야 합니다. 명사로 쓸 때는 대개 복수형 initials로 쓰이며 'my initials'처럼 표현합니다. 부사 initially도 자주 쓰이니 함께 익혀야 합니다.","grammarQuiz":[{"sentence":"Her _____ response to the surprising news was silence, but then she _____ crying.","ko":"놀라운 소식에 대한 그녀의 초기 반응은 침묵이었지만, 곧 울기 시작했다.","answer":["initial","started"],"hint":"형용사+과거동사"}]},
    {"id":"w03370","w":"inject","pos":["v"],"ph":"/ɪnˈdʒekt/","cefr":"B1","kr":["주사하다","주입하다"],"ex":[{"en":"The nurse injected the vaccine.","ko":"간호사가 백신을 주사했다."}],"mnemonic":{"soundHint":"인(안으로)+젝트(ject 던지다)","story":"안으로(in) 던져(ject) 넣다=주사하다(inject)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"medicine","ko":"약","reason":"inject medicine 콜로케이션의 짝"},{"w":"needle","ko":"바늘","reason":"주사 시나리오에서 필수 도구"},{"w":"funds","ko":"자금","reason":"inject funds 콜로케이션의 짝, 비유적 사용"}],"collocBest":[]},"nuance":{"koSimple":"바늘로 약을 몸에 넣다.","whenToUse":"백신·약 주사·자금 투입 상황에."},"krDetail":[{"ko":"주사하다","explain":"약이나 액체를 바늘이 달린 도구로 몸속에 밀어 넣다"},{"ko":"주입하다","explain":"무엇을 어떤 곳에 들어가도록 힘을 주어 밀어 넣거나 부어 넣다"}],"usageExamples":[{"en":"The nurse gently injected the medicine into the young patient's arm.","ko":"그 간호사는 젊은 환자의 팔에 약을 부드럽게 주사했다."},{"en":"The government decided to inject more money into the struggling small businesses.","ko":"정부는 어려움을 겪는 소규모 사업체에 더 많은 돈을 주입하기로 결정했다."}],"grammarNote":"inject는 타동사로 'inject A into B(A를 B에 주입하다)' 구조를 자주 씁니다. 학생들은 'inject to arm'처럼 to를 쓰기 쉽지만, 'inject into the arm'이 맞습니다. 수동태 'be injected with medicine'도 자주 씁니다.","grammarQuiz":[{"sentence":"The doctor decided to _____ the antibiotic _____ the patient's bloodstream immediately.","ko":"그 의사는 항생제를 환자의 혈류에 즉시 주사하기로 결정했다.","answer":["inject","into"],"hint":"동사+전치사"}]},
    {"id":"w03371","w":"injection","pos":["n"],"ph":"/ɪnˈdʒekʃən/","cefr":"B1","kr":["주사","주입"],"ex":[{"en":"The child feared the injection.","ko":"그 아이는 주사를 무서워했다."}],"mnemonic":{"soundHint":"인젝트(inject)+ㅅㅕㄴ","story":"인젝트(inject)의 명사=주사(injection)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"shot","ko":"주사","reason":"동의어(구어), 병원 시나리오의 짝"},{"w":"vaccine","ko":"백신","reason":"vaccine injection 시나리오에서 자주 결합"},{"w":"capital","ko":"자본","reason":"capital injection 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"바늘로 약을 몸에 넣는 일.","whenToUse":"병원 주사·자본 투입 말할 때."},"krDetail":[{"ko":"주사","explain":"약이 든 액체를 바늘로 몸속에 넣는 치료 방법이나 그 액체"},{"ko":"주입","explain":"어떤 물질이나 자금을 다른 곳에 넣거나 부어 넣는 일"}],"usageExamples":[{"en":"The doctor gave the frightened child a quick injection to prevent the flu.","ko":"그 의사는 겁먹은 아이에게 독감을 예방하기 위한 빠른 주사를 놓았다."},{"en":"The failing company urgently needed a large capital injection to survive.","ko":"실패하는 그 회사는 살아남기 위해 대규모의 자본 주입이 시급히 필요했다."}],"grammarNote":"injection은 셀 수 있는 명사로 관사 사용에 주의합니다. 'give someone an injection'이 관용 표현이며, 학생들은 관사 없이 'give injection'이라 쓰기 쉽습니다. 'get an injection(주사를 맞다)'도 자주 나옵니다.","grammarQuiz":[{"sentence":"Children often fear _____ but they usually forget the pain _____ minutes.","ko":"아이들은 종종 주사를 무서워하지만, 대개 몇 분 안에 그 아픔을 잊는다.","answer":["injections","within"],"hint":"복수명사+전치사"}]},
    {"id":"w03372","w":"injure","pos":["v"],"ph":"/ˈɪndʒər/","cefr":"B1","kr":["다치게 하다","부상을 입히다"],"ex":[{"en":"He injured his knee playing soccer.","ko":"그는 축구를 하다 무릎을 다쳤다."}],"mnemonic":{"soundHint":"인(in=not)+저(jure 정당)","story":"in(not)+jure(정당) 규칙 어기며 다치게 하다(injure)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"hurt","ko":"다치게 하다","reason":"동의어로 부상 문맥 공유"},{"w":"heal","ko":"치유하다","reason":"명확한 반의어 관계"},{"w":"seriously","ko":"심각하게","reason":"seriously injure 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"사고로 몸을 다치게 하다.","whenToUse":"운동·사고로 다쳤을 때."},"krDetail":[{"ko":"다치게 하다","explain":"몸이나 마음에 상처를 입혀 아프거나 나쁜 상태가 되게 하다"},{"ko":"부상을 입히다","explain":"다른 사람의 몸에 상처나 손상을 주어 아프게 하다"}],"usageExamples":[{"en":"The careless driver seriously injured a pedestrian while crossing the busy street.","ko":"그 부주의한 운전자는 붐비는 거리를 건너던 보행자를 심각하게 다치게 했다."},{"en":"Athletes must warm up properly to avoid injuring themselves during competitions.","ko":"운동선수들은 경기 중 자신을 다치게 하지 않으려면 제대로 몸을 풀어야 한다."}],"grammarNote":"injure는 타동사로 목적어가 필요하며 수동태 'be injured'가 아주 자주 쓰입니다. 학생들은 'I injured'만 쓰고 끝내기 쉽지만, 'I injured my knee' 또는 'I was injured'처럼 완전한 구조가 필요합니다.","grammarQuiz":[{"sentence":"Many soccer players _____ their knees seriously when they _____ down suddenly.","ko":"많은 축구 선수들은 갑자기 넘어질 때 무릎을 심각하게 다친다.","answer":["injure","fall"],"hint":"동사+동사원형"}]},
    {"id":"w03373","w":"injury","pos":["n"],"ph":"/ˈɪndʒəri/","cefr":"B1","kr":["부상","상해"],"ex":[{"en":"The injury kept him from playing.","ko":"그 부상으로 인해 그는 경기에 출전하지 못했다."}],"mnemonic":{"soundHint":"인저(injure)+리","story":"injure의 명사형=부상(injury)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"wound","ko":"상처","reason":"동의어로 상해 자리 공유"},{"w":"suffer","ko":"당하다","reason":"suffer an injury 콜로케이션의 짝"},{"w":"serious","ko":"심각한","reason":"serious injury 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"다쳐서 생긴 부상.","whenToUse":"운동·사고 부상 이야기할 때."},"krDetail":[{"ko":"부상","explain":"사고나 다툼 등으로 몸에 생긴 상처나 몸이 다친 상태"},{"ko":"상해","explain":"다른 사람의 잘못이나 사고로 몸에 입게 된 다치거나 아픈 결과"}],"usageExamples":[{"en":"The football player suffered a serious knee injury during last weekend's championship game.","ko":"그 축구 선수는 지난 주말 결승 경기 중에 심각한 무릎 부상을 입었다."},{"en":"Wearing proper safety gear helps prevent workplace injuries in construction sites.","ko":"적절한 안전 장비를 착용하는 것은 공사장에서 상해를 예방하는 데 도움이 된다."}],"grammarNote":"injury는 셀 수 있는 명사(구체적 부상)와 셀 수 없는 명사(부상이라는 개념) 두 가지로 쓰입니다. 'suffer an injury(부상을 입다)'는 관용 표현이며, 학생들은 관사를 빠뜨리기 쉽습니다.","grammarQuiz":[{"sentence":"Wearing a helmet greatly reduces the risk of head _____ when riding _____ bicycle.","ko":"헬멧 착용은 자전거를 탈 때 머리 부상의 위험을 크게 줄여준다.","answer":["injuries","a"],"hint":"복수명사+관사"}]},
    {"id":"w03376","w":"inland","pos":["adj","adv"],"ph":"/ˈɪnlænd/","cefr":"B1","kr":["내륙의","내륙으로"],"ex":[{"en":"They moved inland to escape the storm.","ko":"그들은 폭풍을 피하기 위해 내륙으로 이동했다."}],"mnemonic":{"soundHint":"인(안)+랜드(land)","story":"in(안쪽)+land(육지)=내륙(inland)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"coastal","ko":"해안의","reason":"명확한 반의어 관계"},{"w":"interior","ko":"내부의","reason":"동의어로 지리 문맥의 짝"},{"w":"area","ko":"지역","reason":"inland area 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"바다에서 먼 안쪽 땅.","whenToUse":"해안 반대의 내륙 지역 말할 때."},"krDetail":[{"ko":"내륙의","explain":"바다에서 멀리 떨어져 육지 안쪽에 있어 바닷물과 닿지 않는"},{"ko":"내륙으로","explain":"바다에서 벗어나 육지의 안쪽 방향으로 향하여 움직이는 모양으로"}],"usageExamples":[{"en":"Many inland cities lack fresh seafood because they are far from oceans.","ko":"많은 내륙 도시들은 바다에서 멀어 신선한 해산물이 부족하다."},{"en":"The strong hurricane forced thousands of coastal residents to move inland.","ko":"그 강한 허리케인은 수천 명의 해안 주민들이 내륙으로 이동하도록 강요했다."}],"grammarNote":"inland는 형용사(내륙의)와 부사(내륙으로) 두 가지로 쓰이며 문맥으로 구별합니다. 학생들은 부사로 쓸 때 to를 붙여 'move to inland'라 하지만, 'move inland'가 맞습니다.","grammarQuiz":[{"sentence":"The government warned people near the coast to move _____ before the storm _____.","ko":"정부는 폭풍이 도착하기 전에 해안 근처의 사람들에게 내륙으로 이동하라고 경고했다.","answer":["inland","arrived"],"hint":"부사+과거동사"}]},
    {"id":"w03378","w":"inner","pos":["adj"],"ph":"/ˈɪnər/","cefr":"B1","kr":["내부의","마음속의"],"ex":[{"en":"She found inner peace through meditation.","ko":"그녀는 명상을 통해 내면의 평화를 찾았다."}],"mnemonic":{"soundHint":"이너 웨어(속옷)","story":"'이너 웨어'(inner wear)는 안쪽 옷=속옷, 내부의(inner)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"outer","ko":"외부의","reason":"명확한 반의어 관계"},{"w":"peace","ko":"평화","reason":"inner peace 콜로케이션의 짝"},{"w":"strength","ko":"힘","reason":"inner strength 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"겉이 아닌 안쪽의.","whenToUse":"내면의 평화·마음속 힘 말할 때."},"krDetail":[{"ko":"내부의","explain":"물체나 공간의 겉이 아니라 그 안쪽에 위치하거나 있는"},{"ko":"마음속의","explain":"겉으로 드러나지 않고 사람의 마음 깊은 곳에서 느끼거나 생기는"}],"usageExamples":[{"en":"Yoga and meditation help many people find true inner peace during stressful times.","ko":"요가와 명상은 많은 사람들이 스트레스 많은 시기에 진정한 내면의 평화를 찾도록 돕는다."},{"en":"The inner surface of the box was covered with soft red velvet.","ko":"그 상자의 내부 표면은 부드러운 빨간 벨벳으로 덮여 있었다."}],"grammarNote":"inner는 명사 앞에서만 쓰는 형용사(attributive only)로, be동사 뒤에서 보어로 쓰지 않습니다. 학생들은 'The room is inner'라 하지만 이는 어색하고, 'the inner room'으로 표현합니다.","grammarQuiz":[{"sentence":"She discovered her _____ strength when her family faced very difficult _____.","ko":"그녀는 가족이 매우 어려운 시기에 직면했을 때 자신의 내면의 힘을 발견했다.","answer":["inner","times"],"hint":"형용사+명사"}]},
    {"id":"w03380","w":"innocence","pos":["n"],"ph":"/ˈɪnəsəns/","cefr":"B1","kr":["순수함","무죄"],"ex":[{"en":"The child's innocence was charming.","ko":"그 아이의 순수함은 매력적이었다."}],"mnemonic":{"soundHint":"이(in=not)+노센스(nocent 해로운)","story":"해로움(nocent) 없는(in) 상태=순수함(innocence)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"guilt","ko":"죄책감","reason":"명확한 반의어, 법정 시나리오의 짝"},{"w":"childhood","ko":"어린 시절","reason":"childhood innocence 콜로케이션의 짝"},{"w":"prove","ko":"증명하다","reason":"prove one's innocence 시나리오의 짝"}],"collocBest":[]},"nuance":{"koSimple":"때 묻지 않은 순수함.","whenToUse":"어린이 순수함·법적 무죄 말할 때."},"krDetail":[{"ko":"순수함","explain":"때 묻지 않고 깨끗한 마음이나 꾸밈이 없이 맑고 참된 성질"},{"ko":"무죄","explain":"죄를 짓지 않은 상태 또는 잘못이 없다는 사실"}],"usageExamples":[{"en":"The lawyer worked hard for months to prove his client's complete innocence.","ko":"그 변호사는 의뢰인의 완전한 무죄를 입증하기 위해 몇 달간 열심히 일했다."},{"en":"Adults sometimes miss the beautiful innocence of early childhood friendships.","ko":"어른들은 때때로 어린 시절 우정의 아름다운 순수함을 그리워한다."}],"grammarNote":"innocence는 불가산명사로 복수형이 없습니다. 학생들은 관사에서 실수하기 쉬운데 'prove one's innocence'는 특정 상황이므로 소유격이 필요합니다. 'lose innocence'는 관사 없이도 씁니다.","grammarQuiz":[{"sentence":"The court finally accepted the young man's _____ and set _____ free after ten years.","ko":"법정은 마침내 그 젊은이의 무죄를 받아들여 10년 만에 그를 풀어주었다.","answer":["innocence","him"],"hint":"명사+목적격"}]},
    {"id":"w03381","w":"innocent","pos":["adj"],"ph":"/ˈɪnəsənt/","cefr":"B1","kr":["무죄의","순수한"],"ex":[{"en":"The child looked so innocent.","ko":"그 아이는 매우 순수해 보였다."}],"mnemonic":{"soundHint":"이노센트(순수한)","story":"죄 없이(in+no+cent) 순수한(innocent) 아이","hintConfidence":3},"pairs":{"buddyWords":[{"w":"guilty","ko":"유죄의","reason":"명확한 반의어, 법정 시나리오의 짝"},{"w":"pure","ko":"순수한","reason":"동의어로 순수함 자리 공유"},{"w":"child","ko":"아이","reason":"innocent child 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"잘못이 없거나 때 묻지 않은.","whenToUse":"무죄·순수한 아이 표현할 때."},"krDetail":[{"ko":"무죄의","explain":"어떤 잘못이나 죄를 저지르지 않은 상태에 있는"},{"ko":"순수한","explain":"나쁜 것에 물들지 않고 맑고 깨끗한 마음이나 성질을 가진"}],"usageExamples":[{"en":"The court finally declared the accused man innocent of all serious charges.","ko":"법정은 마침내 그 피고인이 모든 심각한 혐의에 대해 무죄임을 선고했다."},{"en":"The innocent child smiled brightly at the kind stranger on the bus.","ko":"그 순수한 아이는 버스에서 친절한 낯선 사람에게 밝게 미소지었다."}],"grammarNote":"innocent는 'innocent of (혐의)' 형태로 자주 쓰이며 무죄를 특정합니다. 학생들은 from을 쓰기 쉽지만 'innocent of the crime'이 맞습니다. 반대말 guilty도 'guilty of'로 씁니다.","grammarQuiz":[{"sentence":"The jury believed the man was _____ of the crime and _____ him free.","ko":"배심원단은 그 남자가 그 범죄에 대해 무죄라고 믿고 그를 자유롭게 풀어주었다.","answer":["innocent","set"],"hint":"형용사+과거동사"}]},
    {"id":"w03389","w":"input","pos":["n","v"],"ph":"/ˈɪnpʊt/","cefr":"B1","kr":["입력","의견"],"ex":[{"en":"Your input is valued here.","ko":"여기서 당신의 의견이 중요하다."}],"mnemonic":{"soundHint":"인풋 아웃풋","story":"IT·게임 용어로 '인풋(input)'과 '아웃풋(output)'은 한국어에도 그대로 쓰인다. 컴퓨터에 데이터를 넣는 것이 input.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"output","ko":"출력","reason":"명확한 반의어, IT 시나리오 필수 짝"},{"w":"user","ko":"사용자","reason":"user input 콜로케이션의 짝"},{"w":"feedback","ko":"의견","reason":"동의어로 의견 제공 자리 공유"}],"collocBest":[{"en":"user input","ko":"사용자 입력"},{"en":"provide input","ko":"의견을 제공하다"}]},"nuance":{"koSimple":"안으로 넣는 정보·의견.","whenToUse":"컴퓨터 입력·의견 제공 말할 때."},"krDetail":[{"ko":"입력","explain":"컴퓨터·기계 등에 정보나 자료를 넣는 일 또는 그렇게 넣은 자료"},{"ko":"의견","explain":"어떤 일에 대해 내놓는 자기의 생각이나 도움이 될 만한 말"}],"usageExamples":[{"en":"The team leader always welcomes creative input from every member during meetings.","ko":"그 팀장은 회의 중 모든 구성원의 창의적인 의견을 언제나 환영한다."},{"en":"The computer needs correct user input to produce the right final results.","ko":"컴퓨터는 정확한 최종 결과를 만들려면 올바른 사용자 입력이 필요하다."}],"grammarNote":"input은 명사와 동사(과거형·과거분사도 input)로 쓰이며 대개 불가산명사입니다. 학생들은 'inputs'로 잘못 복수형을 만들지만, '여러 의견'이라도 대개 'input'으로 표현합니다.","grammarQuiz":[{"sentence":"Your _____ on this project is very important to _____ before we decide.","ko":"우리가 결정하기 전에, 이 프로젝트에 대한 당신의 의견은 우리에게 매우 중요하다.","answer":["input","us"],"hint":"명사+목적격"}]},
    {"id":"w03400","w":"insert","pos":["v","n"],"ph":"/ɪnˈsɜːrt/","cefr":"B1","kr":["삽입하다","끼워 넣다"],"ex":[{"en":"Insert the card into the machine.","ko":"카드를 기계에 삽입하라."}],"mnemonic":{"soundHint":"인서트(insert 키)","story":"키보드 'insert 키' 누르면 삽입(insert)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"remove","ko":"제거하다","reason":"명확한 반의어 관계"},{"w":"key","ko":"열쇠","reason":"insert a key 콜로케이션의 짝"},{"w":"data","ko":"데이터","reason":"insert data 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"틈에 밀어 넣다.","whenToUse":"카드·문장 삽입 상황에."},"krDetail":[{"ko":"삽입하다","explain":"물건이나 내용을 어떤 곳의 사이나 안에 넣어 자리 잡게 하다"},{"ko":"끼워 넣다","explain":"무언가를 두 사물의 틈이나 정해진 공간 사이에 밀어 넣다"}],"usageExamples":[{"en":"Please insert your bank card into the machine and enter your password.","ko":"은행 카드를 기계에 삽입하고 비밀번호를 입력하십시오."},{"en":"The editor inserted an important comment between the two long paragraphs.","ko":"그 편집자는 두 개의 긴 단락 사이에 중요한 논평을 끼워 넣었다."}],"grammarNote":"insert는 'insert A into/in B(A를 B에 삽입하다)' 구조로 씁니다. 학생들은 'insert to' 또는 'insert on'을 쓰기 쉽지만, 'insert the coin into the slot'이 맞습니다. 명사로도 쓰여 '(잡지의) 삽입 광고'를 뜻하기도 합니다.","grammarQuiz":[{"sentence":"The writer decided to _____ a new chapter _____ the middle of his novel.","ko":"그 작가는 새로운 장을 자기 소설의 한가운데에 삽입하기로 결정했다.","answer":["insert","into"],"hint":"동사+전치사"}]},
    {"id":"w03410","w":"insist","pos":["v"],"ph":"/ɪnˈsɪst/","cefr":"B1","kr":["주장하다","고집하다"],"ex":[{"en":"He insisted on paying the bill.","ko":"그는 계산서를 내겠다고 고집했다."}],"mnemonic":{"soundHint":"인(안에)+시스트(sist 서다)","story":"그 자리에 딱 서서(sist) 주장하다(insist)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"demand","ko":"요구하다","reason":"동의어로 강한 주장 자리 공유"},{"w":"on","ko":"~에 대해","reason":"insist on 콜로케이션의 필수 짝 전치사"},{"w":"strongly","ko":"강하게","reason":"strongly insist 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"물러서지 않고 강하게 우기다.","whenToUse":"자기 뜻을 굽히지 않을 때."},"krDetail":[{"ko":"주장하다","explain":"자기 의견이나 생각이 옳다고 힘 있게 말하며 물러서지 않다"},{"ko":"고집하다","explain":"다른 사람의 말을 듣지 않고 자기 생각이나 방식을 굳게 지키다"}],"usageExamples":[{"en":"The stubborn teenager insisted on wearing his old jacket to the wedding.","ko":"그 고집 센 십대는 결혼식에 자기 낡은 재킷을 입고 가겠다고 고집했다."},{"en":"The witness insisted that she had seen the man near the shop.","ko":"그 목격자는 그 남자를 가게 근처에서 보았다고 주장했다."}],"grammarNote":"insist 뒤에는 'that + 주어 + (should) + 동사원형' 구조가 오는데, 학생들이 'should'를 빼도 동사원형을 씁니다. 'insist on ~ing(~을 고집하다)'도 매우 자주 쓰이는 표현입니다.","grammarQuiz":[{"sentence":"The mother _____ that her son _____ home before ten o'clock every night.","ko":"그 어머니는 아들이 매일 밤 10시 전에 집에 와야 한다고 주장했다.","answer":["insisted","come"],"hint":"과거동사+동사원형"}]},
    {"id":"w03416","w":"inspect","pos":["v"],"ph":"/ɪnˈspekt/","cefr":"B1","kr":["검사하다","조사하다"],"ex":[{"en":"They inspected the building carefully.","ko":"그들은 건물을 주의 깊게 검사했다."}],"mnemonic":{"soundHint":"인(안)+스펙(spec 보다)","story":"안(in)의 스펙(spec)을 자세히 검사하다(inspect)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"examine","ko":"조사하다","reason":"동의어로 검사 자리 공유"},{"w":"closely","ko":"면밀히","reason":"inspect closely 콜로케이션의 짝"},{"w":"vehicle","ko":"차량","reason":"inspect a vehicle 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"꼼꼼히 살펴 검사하다.","whenToUse":"건물·차량 안전 점검 말할 때."},"krDetail":[{"ko":"검사하다","explain":"어떤 것이 문제가 없는지 자세히 살펴보고 잘잘못을 알아보다"},{"ko":"조사하다","explain":"무언가에 대해 자세히 살피고 알아보아 사실이나 상태를 밝혀내다"}],"usageExamples":[{"en":"Health officials thoroughly inspect all restaurants twice each year for cleanliness.","ko":"보건 공무원들은 매년 두 번씩 모든 식당의 청결도를 철저히 검사한다."},{"en":"Before buying a used car, buyers should inspect the engine very carefully.","ko":"중고차를 사기 전에, 구매자들은 엔진을 매우 조심스럽게 검사해야 한다."}],"grammarNote":"inspect는 타동사로 목적어가 필요하며 자동사로는 쓰지 않습니다. 학생들은 'inspect for problems'처럼 for를 쓰지만, 'inspect the car for damage(피해가 있는지 차를 검사하다)'처럼 목적어 다음에 for를 씁니다.","grammarQuiz":[{"sentence":"Safety inspectors carefully _____ every part of the airplane _____ each flight.","ko":"안전 검사관들은 매 비행 전에 비행기의 모든 부분을 조심스럽게 검사한다.","answer":["inspect","before"],"hint":"동사+전치사"}]},
    {"id":"w03044","w":"host","pos":["n","v"],"ph":"/hoʊst/","cefr":"B1","kr":["주인","주최하다"],"ex":[{"en":"She hosted a dinner party.","ko":"그녀는 저녁 파티를 주최했다."}],"mnemonic":{"soundHint":"'호스트바', '토크쇼 호스트' 외래어","story":"토크쇼 '호스트'가 손님을 소개하며 방송을 진행한다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"organizer","ko":"주최자","reason":"host와 동의어"},{"w":"presenter","ko":"진행자","reason":"host와 동의어"},{"w":"guest","ko":"손님","reason":"host의 반의어"}],"collocBest":[{"en":"host a party","ko":"파티를 주최하다"},{"en":"talk show host","ko":"토크쇼 진행자"}]},"nuance":{"koSimple":"손님을 맞아 자리를 여는 사람.","whenToUse":"파티·행사를 열거나 방송을 진행할 때."},"krDetail":[{"ko":"손님을 맞는 이","explain":"'주인(主人)'은 순우리말로 '손님을 맞는 이'이며, 손님을 초대해 대접하는 사람이에요."},{"ko":"자리를 열어 이끌다","explain":"'주최(主催)하다'는 순우리말로 '자리를 열어 이끌다'로, 행사를 준비해서 진행하는 일이에요."}],"usageExamples":[{"en":"Our school will host the international science fair.","ko":"우리 학교가 국제 과학 박람회를 주최할 것이다."},{"en":"The host welcomed the guests warmly.","ko":"주인은 손님들을 따뜻하게 맞이했다."}],"grammarNote":"host는 명사(주인)와 동사(주최하다) 둘 다 됩니다. 학생들은 동사 host를 'have'로만 표현하려는 경향이 있어 시험에서 활용도가 낮습니다.","grammarQuiz":[{"sentence":"South Korea _____ the World Cup _____ 2002.","ko":"한국은 2002년에 월드컵을 주최했다.","answer":["hosted","in"],"hint":"과거형 hosted + 연도 전치사 in"},{"sentence":"The talk show _____ interviewed the singer _____ Friday.","ko":"그 토크쇼 진행자는 금요일에 그 가수를 인터뷰했다.","answer":["host","on"],"hint":"명사 host + 요일 전치사 on"}]},
    {"id":"w02789","w":"gossip","pos":["n","v"],"ph":"/ˈɡɒsɪp/","cefr":"B1","kr":["험담","수다"],"ex":[{"en":"She enjoys gossip about celebrities.","ko":"그녀는 연예인 험담을 즐긴다."}],"mnemonic":{"soundHint":"가십(연예계 가십)","story":"연예 뉴스의 '가십'이 바로 남 얘기 수다(gossip)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"spread","ko":"퍼뜨리다","reason":"spread gossip 콜로케이션"},{"w":"rumor","ko":"소문","reason":"동의어, 확인 안 된 소식 문맥"},{"w":"chatter","ko":"수다","reason":"동의어, 잡담 문맥 공유"}],"collocBest":[{"en":"spread gossip","ko":"소문을 퍼뜨리다"},{"en":"idle gossip","ko":"한가한 수다"}]},"nuance":{"koSimple":"남의 이야기를 소곤소곤 퍼뜨리는 것.","whenToUse":"연예인·이웃 뒷담화를 말할 때."},"krDetail":[{"ko":"험담","explain":"남을 헐뜯는 이야기"},{"ko":"수다","explain":"이러쿵저러쿵 나누는 말"}],"usageExamples":[{"en":"She spread gossip about her coworker's private life.","ko":"그녀는 동료의 사생활에 대한 험담을 퍼뜨렸다."},{"en":"The two friends gossiped about the new teacher for hours.","ko":"두 친구는 새 선생님에 대해 몇 시간 동안 수다를 떨었다."}],"grammarNote":"gossip은 명사일 때 불가산명사로 취급되어 'a gossip'이나 'gossips'로 쓰지 않는다. 동사로 쓰이면 자동사이다.","grammarQuiz":[{"sentence":"The office _____ _____ spreading quickly through the company.","ko":"사무실 소문은 회사 전체에 빠르게 퍼지고 있었다.","answer":["gossip","was"],"hint":"gossip은 불가산 단수 취급"},{"sentence":"They _____ _____ _____ their neighbors every afternoon.","ko":"그들은 매일 오후 이웃들에 대해 험담한다.","answer":["gossip","about","their"],"hint":"gossip about + 대상"}]},
    {"id":"w02904","w":"handbook","pos":["n"],"ph":"/ˈhændbʊk/","cefr":"B1","kr":["안내서","편람","핸드북"],"ex":[{"en":"New employees are required to read the company handbook on their first day.","ko":"신입 사원은 첫날 회사 안내서를 읽어야 한다."}],"mnemonic":{"soundHint":"핸드북(스타트업 핸드북)","story":"'핸드북'은 손에 들고 보는 안내서(handbook)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"manual","ko":"설명서","reason":"동의어, 지침서 문맥 공유"},{"w":"guide","ko":"안내서","reason":"동의어, 참고 자료 문맥"},{"w":"reference","ko":"참고 도서","reason":"동의어, 정보 자료 공유"}],"collocBest":[{"en":"employee handbook","ko":"직원 안내서"},{"en":"student handbook","ko":"학생 안내서"}]},"nuance":{"koSimple":"안내가 담긴 작은 책자.","whenToUse":"신입·학생용 규정 책자를 말할 때."},"krDetail":[{"ko":"안내서","explain":"쓰는 법을 알려 주는 책"},{"ko":"편람","explain":"쉽게 찾아보는 책"}],"usageExamples":[{"en":"The employee handbook explains all the company rules clearly.","ko":"직원 안내서는 모든 회사 규정을 명확히 설명한다."},{"en":"She always carries a travel handbook in her bag.","ko":"그녀는 가방에 항상 여행 안내서를 가지고 다닌다."}],"grammarNote":"handbook은 가산명사로 book처럼 취급한다. manual과 유사한 의미로 쓰인다.","grammarQuiz":[{"sentence":"Please read the student _____ _____ the first day.","ko":"첫날 학생 안내서를 읽어 주세요.","answer":["handbook","on"],"hint":"명사 + on"},{"sentence":"The new _____ _____ _____ published last month.","ko":"새로운 안내서가 지난달에 출판되었다.","answer":["handbook","was","just"],"hint":"명사 + 수동태 + 부사"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){

  const m = Math.floor(s/60), r = s%60;

}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();

  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();

    return;

  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

   QUIZ (15문항)
   ============================================================ */
const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));
  if(isPerfect) earnedBadges.push(DATA.badges.find(b=>b.id==="perfect"));

  renderHeader();

  const main = document.getElementById("main");
  const stageLbl = isAdv ? "심화단계" : "기본단계";
  const passedM3 = (pct >= 60) && (DATA.grade === '중3');

  const highGradePerfect = isHighGrade && isAdv && isPerfect;
  const highGradeMsg = highGradePerfect ? pickHGMessage() : null;
  const title = highGradeMsg
    ? `🏆 ${escape(highGradeMsg)}`
    : passedM3
      ? `💰 방금 당신의 미래 연봉이 10만원 더 올라갔슴돠!!`
      : (isPerfect ? `🎊 ${stageLbl} 무결점 클리어!` : (pct >= 80 ? `🎉 ${stageLbl} 잘했어요!` : pct >= 60 ? `👍 ${stageLbl} 통과!` : "💪 다시 도전!"));

  // 심화면 [🎯 심화 다시] + [🏠 홈으로]. 기본이면 [🔁 다시 보기] + (심화 해금 시) [🎯 심화 도전]
  const canGoAdvanced = !isAdv && state.basicThresholdPassed;
  const advGrand = isAdv && pct >= 90;   // 심화 90%+ 특별 축포
  const unlockBanner = newUnlock
    ? `<div style="margin:8px auto 6px;padding:10px 14px;border-radius:var(--radius-md);

       </div>`
    : "";
  const grandBanner = advGrand
    ? `<div class="grand-banner">
         <div class="grand-line">🎆 당신이 <b>배곧 쵝오</b>! 🎆</div>
         <div class="grand-sub">심화단계 ${pct}% — 지역 랭커 등극!</div>
       </div>`
    : "";
  const hasWrong = state.quizWrongItems.length > 0;
  const actionsHTML = isAdv
    ? `<button class="start-btn" id="retryBtn">🔁 심화 다시</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       <button class="start-btn alt" id="homeBtn">🏠 Home</button>`
    : `<button class="start-btn" id="retryBtn">🔁 다시 보기</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       ${canGoAdvanced ? `<button class="start-btn adv" id="goAdvBtn">🎯 심화단계 도전</button>` : ""}`;
