<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review H</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}

  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;

      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;

    -webkit-background-clip:text;background-clip:text;color:transparent;

    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{

  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}

  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}

  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{

  .result-stats{

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}

    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}

  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

  /* ---------- RAINBOW BURST ---------- */
  .rainbow-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:45;

      rgba(255,0,128,.0), rgba(255,255,0,.0), rgba(0,255,128,.0), rgba(0,128,255,.0), rgba(255,0,255,.0));

  @keyframes rainbow{

    100%{background:linear-gradient(135deg, rgba(0,0,0,0), rgba(0,0,0,0));}
  }

  /* ---------- HIDE ---------- */
  .hidden{display:none !important;}

  /* ---------- MOBILE TUNING ---------- */
  @media (max-width:380px){
    .face.front .word{font-size:54px;}
    .quiz-prompt .qword{font-size:30px;}

  /* ---------- TIMER ---------- */
  .timer-pill{
    background:rgba(148,163,184,.08);

    font-variant-numeric:tabular-nums;
  }

</style>

    {"id":"w04728","w":"parliament","pos":["n"],"ph":"/ˈpɑːrləmənt/","cefr":"B1","kr":["의회","국회"],"ex":[{"en":"Parliament voted on the new law.","ko":"의회가 새 법안에 대해 투표했다."}],"mnemonic":{"soundHint":null,"story":"'팔러(parlor)' 같은 큰 방에 국회의원들이 모여 회의하는 곳이 parliament(의회).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"congress","ko":"의회","reason":"동의어 - 미국식 의회"},{"w":"senator","ko":"상원의원","reason":"콜로케이션 - 의회 구성원"},{"w":"legislation","ko":"입법","reason":"시나리오 - 의회의 주요 활동"}],"collocBest":[{"en":"member of parliament","ko":"국회의원"},{"en":"dissolve parliament","ko":"의회를 해산하다"}]},"nuance":{"koSimple":"법을 만드는 국회·의회.","whenToUse":"국가의 입법 기관을 가리킬 때."},"krDetail":[{"ko":"의회","explain":"국민을 대표해 법을 만드는 모임"},{"ko":"국회","explain":"나라의 법을 만드는 사람들의 모임터"}],"usageExamples":[{"en":"The parliament passed a new education law last week after long debates.","ko":"의회는 긴 토론 끝에 지난주 새로운 교육법을 통과시켰다."},{"en":"Unlike a congress, the British Parliament combines lawmaking and executive oversight in one body.","ko":"미국 의회와 달리, 영국 의회는 입법과 행정 감독을 한 기관에서 결합한다."}],"grammarNote":"parliament는 집합명사로 단수·복수 취급 모두 가능하다. 영국식에서는 복수 취급이 흔하고(Parliament are debating), 미국식에서는 단수 취급이 많다. 학생들은 대문자 P로 쓴 'Parliament'가 특정 국가의 의회를 가리킨다는 점을 놓치기 쉽다. member of parliament의 축약형 MP도 자주 나온다.","grammarQuiz":[{"sentence":"The British _____ is _____ the new bill, but many members oppose it strongly.","ko":"영국 의회가 새 법안을 논의 중이지만, 많은 의원이 강하게 반대한다.","answer":["Parliament","debating"],"hint":"대문자 고유명사 + 진행형"},{"sentence":"Only a member _____ parliament _____ propose changes to the current education law.","ko":"의회 의원만이 현재 교육법 개정을 제안할 수 있다.","answer":["of","can"],"hint":"전치사 of + 조동사 can"}]},
    {"id":"w04733","w":"participant","pos":["n"],"ph":"/pɑːrˈtɪsɪpənt/","cefr":"B1","kr":["참가자","참여자"],"ex":[{"en":"All participants must register online.","ko":"모든 참가자는 온라인으로 등록해야 한다."}],"mnemonic":{"soundHint":null,"story":"part(부분)를 담당(-icipant)하는 사람 → 참가자.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"attendee","ko":"참석자","reason":"동의어 - 행사 참여자"},{"w":"contestant","ko":"참가자","reason":"동의어 - 대회 참가자"},{"w":"volunteer","ko":"자원봉사자","reason":"시나리오 - 자발적 참가자"}],"collocBest":[{"en":"active participant","ko":"적극적인 참가자"},{"en":"research participant","ko":"연구 참가자"}]},"nuance":{"koSimple":"행사·대회에 참여한 사람.","whenToUse":"대회·연구·행사 참가자를 지칭할 때."},"krDetail":[{"ko":"참가자","explain":"어떤 일에 함께 나서서 활동하는 사람"},{"ko":"참여자","explain":"어떤 자리에 끼어들어 함께하는 사람"}],"usageExamples":[{"en":"Every participant received a certificate after completing the online course.","ko":"모든 참가자가 온라인 강좌를 마친 후 수료증을 받았다."},{"en":"A researcher observes, but a participant actively takes part in the experiment itself.","ko":"연구자는 관찰하지만, 참가자는 실험 자체에 능동적으로 참여한다."}],"grammarNote":"participant는 동사 participate에서 파생된 -ant 형태의 명사로, '~하는 사람'을 뜻한다. 학생들은 participant/participate/participation을 자주 혼동하는데, 사람은 participant, 행위는 participate/participation임을 명심해야 한다. 관사 a/the/every 뒤에 오는지 확인하자.","grammarQuiz":[{"sentence":"Every _____ in the study _____ asked to complete a short survey before starting.","ko":"연구의 모든 참가자는 시작 전에 짧은 설문지를 작성하도록 요청받았다.","answer":["participant","was"],"hint":"명사형 + 단수 수동태"},{"sentence":"The number _____ participants _____ increased since the program opened to teenagers.","ko":"참가자 수는 프로그램이 청소년에게 개방된 이후로 증가해 왔다.","answer":["of","has"],"hint":"전치사 of + 현재완료 has"}]},
    {"id":"w04734","w":"participate","pos":["v"],"ph":"/pɑːrˈtɪsɪpeɪt/","cefr":"B1","kr":["참가하다","참여하다"],"ex":[{"en":"Students are encouraged to participate in class.","ko":"학생들은 수업에 참여하도록 장려된다."}],"mnemonic":{"soundHint":null,"story":"part(부분)를 맡아(capere) 함께 하다 → 참가하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"join","ko":"참여하다","reason":"동의어 - 참가의 핵심"},{"w":"engage","ko":"관여하다","reason":"동의어 - 적극 참여"},{"w":"withdraw","ko":"물러나다","reason":"반의어 - 참여를 그만두다"}],"collocBest":[{"en":"participate in","ko":"~에 참가하다"},{"en":"actively participate","ko":"적극적으로 참여하다"}]},"nuance":{"koSimple":"함께 끼어 활동하다.","whenToUse":"수업·대회·토론에 적극 참여할 때."},"krDetail":[{"ko":"참가하다","explain":"어떤 모임이나 일에 함께 나서다"},{"ko":"참여하다","explain":"어떤 자리에 끼어들어 함께 활동하다"}],"usageExamples":[{"en":"Students from every grade participate in the annual school festival together.","ko":"모든 학년의 학생들이 함께 연례 학교 축제에 참가한다."},{"en":"Some choose to withdraw, while others actively participate in the discussion from start to finish.","ko":"일부는 물러서기를 택하지만, 다른 이들은 처음부터 끝까지 토론에 적극 참여한다."}],"grammarNote":"participate는 자동사이므로 목적어를 바로 취할 수 없고 반드시 전치사 in을 붙여야 한다. 학생들이 가장 자주 저지르는 오답이 'participate the contest'인데, 반드시 'participate in the contest'가 되어야 한다. take part in과 같은 뜻이며, 능동적 참여를 강조한다.","grammarQuiz":[{"sentence":"More than fifty students actively _____ _____ the debate contest held last Friday.","ko":"50명이 넘는 학생들이 지난 금요일에 열린 토론 대회에 적극적으로 참가했다.","answer":["participated","in"],"hint":"과거형 + 자동사 전치사 in"},{"sentence":"If you want _____ participate _____ our program, please fill out the form online today.","ko":"저희 프로그램에 참여하고 싶다면, 오늘 온라인으로 양식을 작성해 주세요.","answer":["to","in"],"hint":"to부정사 + 자동사 전치사 in"}]},
    {"id":"w04735","w":"participation","pos":["n"],"ph":"/pɑːrˌtɪsɪˈpeɪʃən/","cefr":"B1","kr":["참가","참여"],"ex":[{"en":"Your participation is greatly appreciated.","ko":"귀하의 참여에 깊이 감사드립니다."}],"mnemonic":{"soundHint":null,"story":"participate + -ion → 참가하는 행위.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"involvement","ko":"관여","reason":"동의어 - 참여 정도"},{"w":"engagement","ko":"참여","reason":"동의어 - 몰입된 참여"},{"w":"attendance","ko":"출석","reason":"시나리오 - 참여와 출석은 세트"}],"collocBest":[{"en":"active participation","ko":"적극적 참여"},{"en":"encourage participation","ko":"참여를 장려하다"}]},"nuance":{"koSimple":"함께 참여하는 행위.","whenToUse":"적극적 참여·참여율을 말할 때."},"krDetail":[{"ko":"참가","explain":"어떤 일이나 모임에 함께 나섬"},{"ko":"참여","explain":"어떤 자리에 끼어들어 함께함"}],"usageExamples":[{"en":"Active participation in class discussions greatly improves students' communication skills.","ko":"수업 토론에 대한 적극적인 참여는 학생들의 의사소통 능력을 크게 향상시킨다."},{"en":"Mere attendance is not enough; genuine participation shapes the true learning experience.","ko":"단순한 출석만으로는 충분하지 않고, 진정한 참여가 실제 학습 경험을 형성한다."}],"grammarNote":"participation은 participate의 명사형으로 불가산명사로 취급되는 경우가 많다. 학생들은 관사 없이 쓰거나 encourage/increase/limit 같은 동사와 결합하는 패턴을 기억해야 한다. 'participation in + 명사' 구조가 핵심이며, 형용사 active/full/wide와 자주 함께 쓰인다.","grammarQuiz":[{"sentence":"The school _____ student _____ in various volunteer activities throughout the year.","ko":"학교는 학생들의 다양한 봉사 활동 참여를 일 년 내내 장려한다.","answer":["encourages","participation"],"hint":"3인칭 단수 동사 + 명사형"},{"sentence":"Active _____ in class _____ often lead to higher grades and better understanding.","ko":"수업에 대한 적극적인 참여는 종종 더 높은 성적과 더 나은 이해로 이어진다.","answer":["participation","can"],"hint":"명사형 + 조동사 can"}]},
    {"id":"w04737","w":"particular","pos":["adj","n"],"ph":"/pərˈtɪkjʊlər/","cefr":"B1","kr":["특정한","특별한"],"ex":[{"en":"Is there a particular book you recommend?","ko":"특별히 추천하는 책이 있나요?"}],"mnemonic":{"soundHint":null,"story":"part(부분)에 초점을 맞춘 → 특정한, 특별한.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"specific","ko":"특정한","reason":"동의어 - 핵심 짝"},{"w":"general","ko":"일반적인","reason":"반의어 - 특정 vs 일반"},{"w":"detail","ko":"세부사항","reason":"시나리오 - 특정한 세부에 주목"}],"collocBest":[{"en":"in particular","ko":"특히"},{"en":"a particular case","ko":"특정 경우"}]},"nuance":{"koSimple":"콕 집어서 특정한.","whenToUse":"여럿 중 하나를 꼭 집을 때."},"krDetail":[{"ko":"특정한","explain":"여럿 가운데 딱 하나로 정해진"},{"ko":"특별한","explain":"보통과는 다르게 두드러진"}],"usageExamples":[{"en":"The teacher wants a particular book for the reading assignment this week.","ko":"선생님은 이번 주 읽기 과제로 특정한 책을 원하신다."},{"en":"A general rule applies to everyone, but a particular case may require special attention and care.","ko":"일반적인 규칙은 모두에게 적용되지만, 특정 사례는 특별한 주의와 배려가 필요할 수 있다."}],"grammarNote":"particular는 형용사로 명사 앞에서 한정 용법으로 자주 쓰인다. 관용구 'in particular'는 '특히'라는 뜻으로 문장 끝에 놓이며 문어체에서도 자주 등장한다. 학생들은 particular와 special의 뉘앙스 차이를 놓치기 쉬운데, particular는 '지정된, 콕 집은' 느낌이고 special은 '보통과 다른, 특별대우'의 뉘앙스다.","grammarQuiz":[{"sentence":"The teacher recommended one _____ book, but she liked mystery novels _____ particular.","ko":"선생님은 하나의 특정한 책을 추천하셨지만, 그녀는 특히 미스터리 소설을 좋아했다.","answer":["particular","in"],"hint":"형용사 + in ~ 관용구"},{"sentence":"Is there any _____ reason why you _____ this specific book for the project?","ko":"이 프로젝트를 위해 이 특정 책을 선택한 특별한 이유가 있나요?","answer":["particular","chose"],"hint":"형용사 + 과거형 동사"}]},
    {"id":"w04738","w":"particularly","pos":["adv"],"ph":"/pərˈtɪkjʊlərli/","cefr":"B1","kr":["특히","각별히"],"ex":[{"en":"She is particularly good at math.","ko":"그녀는 특히 수학을 잘한다."}],"mnemonic":{"soundHint":null,"story":"particular(특정한) + -ly → 특히.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"especially","ko":"특히","reason":"동의어 - 완전 동의"},{"w":"notably","ko":"특히","reason":"동의어 - 눈에 띄게"},{"w":"generally","ko":"일반적으로","reason":"반의어 - 특히 vs 일반적으로"}],"collocBest":[{"en":"not particularly","ko":"특별히 ~하지 않다"},{"en":"particularly important","ko":"특히 중요한"}]},"nuance":{"koSimple":"특히·유난히 그런.","whenToUse":"여럿 중 강조할 대상이 있을 때."},"krDetail":[{"ko":"특히","explain":"여럿 가운데 어느 하나를 더욱 도드라지게"},{"ko":"각별히","explain":"남다르게 마음이나 힘을 쏟아"}],"usageExamples":[{"en":"The teacher particularly praised her creative writing during the presentation yesterday.","ko":"선생님은 어제 발표 중 그녀의 창의적인 글쓰기를 특히 칭찬하셨다."},{"en":"Generally, tests are hard, but this one was particularly difficult for beginning-level students.","ko":"일반적으로 시험은 어렵지만, 이번 시험은 초급 학생들에게 특히 어려웠다."}],"grammarNote":"particularly는 부사로 형용사·동사·부사를 수식하며 강조 표현으로 쓰인다. 부정문에서 'not particularly'는 '별로 ~하지 않다'로 완곡한 부정을 나타낸다. 학생들은 'especially'와의 미묘한 차이를 놓치는데, 두 단어 모두 '특히'지만 particularly는 개별성·구체성을, especially는 전체 중에서의 두드러짐을 더 강조한다.","grammarQuiz":[{"sentence":"The movie was not _____ interesting, so we _____ regretted spending money on tickets.","ko":"그 영화는 별로 재미있지 않아서, 우리는 티켓에 돈을 쓴 것을 후회했다.","answer":["particularly","somewhat"],"hint":"부사 + 정도 부사"},{"sentence":"Winter is cold, but this year _____ has been _____ harsh for elderly citizens.","ko":"겨울은 춥지만, 올해는 특히 노인들에게 혹독했다.","answer":["it","particularly"],"hint":"대명사 주어 + 부사"}]},
    {"id":"w04746","w":"passage","pos":["n"],"ph":"/ˈpæsɪdʒ/","cefr":"B1","kr":["통로","구절","지문"],"ex":[{"en":"Read the passage carefully and answer.","ko":"지문을 주의 깊게 읽고 답하세요."}],"mnemonic":{"soundHint":null,"story":"pass(지나가다)는 통로(passage)를 지나며 책의 한 구절도 지나침.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"corridor","ko":"복도","reason":"동의어 - 좁은 통로"},{"w":"extract","ko":"발췌","reason":"동의어 - 글의 구절"},{"w":"reading","ko":"독해","reason":"콜로케이션 - reading passage"}],"collocBest":[{"en":"reading passage","ko":"읽기 지문"},{"en":"narrow passage","ko":"좁은 통로"}]},"nuance":{"koSimple":"글의 한 구절 또는 통로.","whenToUse":"독해 지문·좁은 길을 말할 때."},"krDetail":[{"ko":"통로","explain":"지나다닐 수 있게 트인 길"},{"ko":"구절","explain":"책이나 글의 짧은 한 대목"},{"ko":"지문","explain":"시험이나 교재에 실린 읽기 자료"}],"usageExamples":[{"en":"The teacher read a short passage from the novel to open the discussion.","ko":"선생님은 토론을 열기 위해 소설의 짧은 구절을 읽어 주셨다."},{"en":"A narrow corridor connects two rooms, but a reading passage carries ideas from writer to reader.","ko":"좁은 통로가 두 방을 잇지만, 읽기 지문은 작가에게서 독자에게로 생각을 전한다."}],"grammarNote":"passage는 다의어로 문맥에 따라 물리적 '통로', 글의 '구절', 시간의 '흐름', 통과의 '허가' 등 다양한 뜻이 된다. 학생들은 시험에서 reading passage(읽기 지문)를 가장 자주 만난다. 관용구 'passage of time'은 '시간의 흐름'을 나타내는 문학적 표현으로 자주 인용된다.","grammarQuiz":[{"sentence":"The reading _____ was so difficult that many students _____ to finish it in time.","ko":"그 읽기 지문은 너무 어려워서 많은 학생들이 제시간에 끝내지 못했다.","answer":["passage","failed"],"hint":"명사 + 과거형 동사"},{"sentence":"The narrow _____ between the two houses _____ dark and slightly frightening at night.","ko":"두 집 사이의 좁은 통로는 밤에 어둡고 약간 무서웠다.","answer":["passage","was"],"hint":"명사 + be 동사 과거"}]},
    {"id":"w04748","w":"passion","pos":["n"],"ph":"/ˈpæʃən/","cefr":"B1","kr":["열정","정열"],"ex":[{"en":"She has a passion for music.","ko":"그녀는 음악에 대한 열정이 있다."}],"mnemonic":{"soundHint":null,"story":"'패션(passion)' 있는 사람은 열정으로 빛난다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"enthusiasm","ko":"열정","reason":"동의어 - 핵심 짝"},{"w":"dedication","ko":"헌신","reason":"시나리오 - 열정은 헌신을 부름"},{"w":"indifference","ko":"무관심","reason":"반의어 - 열정 vs 무관심"}],"collocBest":[{"en":"with passion","ko":"열정적으로"},{"en":"passion for learning","ko":"배움에 대한 열정"}]},"nuance":{"koSimple":"가슴 뜨거운 열정.","whenToUse":"무언가에 강한 애정·열의를 표할 때."},"krDetail":[{"ko":"열정","explain":"어떤 일에 강하게 쏠리는 뜨거운 마음"},{"ko":"정열","explain":"가슴 깊이 타오르는 세찬 감정"}],"usageExamples":[{"en":"Her passion for music began when she first heard the piano at age five.","ko":"음악에 대한 그녀의 열정은 다섯 살에 처음 피아노를 들었을 때 시작되었다."},{"en":"Some people show indifference to their work, but she performs every task with passion.","ko":"어떤 사람들은 자기 일에 무관심하지만, 그녀는 모든 일을 열정을 가지고 수행한다."}],"grammarNote":"passion은 'passion for + 명사'로 '~에 대한 열정'을 나타낸다. 학생들은 'passion of'로 잘못 쓰기 쉬운데 반드시 for를 써야 한다. with passion(열정적으로)은 부사구로 자주 쓰이며, be passionate about은 형용사 파생형으로 함께 익혀두면 좋다.","grammarQuiz":[{"sentence":"Her _____ _____ teaching young children makes her one of the best teachers in the school.","ko":"어린이들을 가르치는 것에 대한 그녀의 열정은 그녀를 학교 최고의 교사 중 한 명으로 만든다.","answer":["passion","for"],"hint":"명사 + 전치사 for"},{"sentence":"He speaks about environmental issues _____ great _____ during every school assembly.","ko":"그는 학교 조회 때마다 환경 문제에 대해 큰 열정을 가지고 말한다.","answer":["with","passion"],"hint":"전치사 with + 명사"}]},
    {"id":"w04763","w":"patience","pos":["n"],"ph":"/ˈpeɪʃəns/","cefr":"B1","kr":["인내","참을성"],"ex":[{"en":"Patience is needed when learning a new skill.","ko":"새로운 기술을 배울 때는 인내가 필요하다."}],"mnemonic":{"soundHint":null,"story":"patient(환자)는 아파도 참는다 → 인내(patience).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"tolerance","ko":"관용","reason":"동의어 - 참는 능력"},{"w":"endurance","ko":"인내력","reason":"동의어 - 견뎌내는 힘"},{"w":"impatience","ko":"조급함","reason":"반의어 - 인내 vs 조급"}],"collocBest":[{"en":"have patience","ko":"인내심을 갖다"},{"en":"run out of patience","ko":"인내심이 바닥나다"}]},"nuance":{"koSimple":"기다림을 참는 마음.","whenToUse":"배움·기다림 필요할 때."},"krDetail":[{"ko":"인내","explain":"괴로움이나 어려움을 참고 견디는 마음"},{"ko":"참을성","explain":"쉽게 화내지 않고 잘 견디는 성질"}],"usageExamples":[{"en":"Teaching young children requires great patience and a warm, understanding heart every day.","ko":"어린이들을 가르치는 일은 매일 큰 인내와 따뜻하고 이해심 있는 마음이 필요하다."},{"en":"Impatience causes many arguments, but patience keeps relationships stable and peaceful for years.","ko":"성급함은 많은 다툼을 낳지만, 인내는 여러 해 동안 관계를 안정되고 평화롭게 지켜준다."}],"grammarNote":"patience는 불가산명사로 관사 없이 쓰이며, have/lose/run out of patience 같은 동사와 결합한다. 학생들은 형용사 patient(참을성 있는)와 명사 patient(환자)의 동철이의어를 헷갈리기 쉽다. 'patience with + 사람/사물'은 '~에 대한 인내'로 자주 나오는 결합이다.","grammarQuiz":[{"sentence":"The kind teacher had great _____ _____ her slow but hardworking young students.","ko":"그 친절한 선생님은 느리지만 열심히 하는 어린 학생들에 대해 큰 인내심을 가지고 있었다.","answer":["patience","with"],"hint":"명사 + 전치사 with"},{"sentence":"After hours of waiting, he finally ran _____ of _____ and left the office angrily.","ko":"몇 시간을 기다린 끝에 그는 마침내 인내심이 바닥나 화를 내며 사무실을 떠났다.","answer":["out","patience"],"hint":"run out of + 명사"}]},
    {"id":"w04777","w":"payment","pos":["n"],"ph":"/ˈpeɪmənt/","cefr":"B1","kr":["지불","납부"],"ex":[{"en":"The payment must be made by Friday.","ko":"지불은 금요일까지 이루어져야 한다."}],"mnemonic":{"soundHint":null,"story":"pay(지불하다) + -ment → 지불.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"settlement","ko":"결제","reason":"동의어 - 지불 정산"},{"w":"invoice","ko":"청구서","reason":"시나리오 - 청구서 후 지불"},{"w":"refund","ko":"환불","reason":"반의어 - 지불 vs 환불"}],"collocBest":[{"en":"make a payment","ko":"지불하다"},{"en":"down payment","ko":"계약금"}]},"nuance":{"koSimple":"돈을 내는 것.","whenToUse":"요금·대금 지불을 말할 때."},"krDetail":[{"ko":"지불","explain":"물건 값이나 대가를 치르는 일"},{"ko":"납부","explain":"세금이나 회비 등을 관에 내는 일"}],"usageExamples":[{"en":"The company received the customer's payment for last month's electricity bill yesterday.","ko":"그 회사는 어제 지난달 전기 요금에 대한 고객의 지불을 받았다."},{"en":"A simple fee covers one service, but the final payment settles all outstanding costs at once.","ko":"단순한 수수료는 하나의 서비스만 처리하지만, 최종 지불은 미납된 모든 비용을 한 번에 정산한다."}],"grammarNote":"payment는 가산·불가산 둘 다로 쓰인다. 개별 지불 건은 가산(a payment), 지불 행위 전반은 불가산이다. 'make a payment(지불하다)', 'in payment for(~에 대한 지불로)' 같은 관용 결합이 있다. 학생들은 pay/paying/payment 파생 관계를 정리해 두어야 하며, down payment(계약금)은 관용어다.","grammarQuiz":[{"sentence":"Please make your _____ _____ the end of this month to avoid a late fee.","ko":"연체료를 피하려면 이달 말까지 지불해 주십시오.","answer":["payment","by"],"hint":"명사 + 기한 by"},{"sentence":"The bank confirmed that _____ _____ received the full payment from our overseas client.","ko":"은행은 우리 해외 고객으로부터 전액 지불금을 받았다고 확인해 주었다.","answer":["it","had"],"hint":"대명사 주어 + 과거완료 had"}]},
    {"id":"w04787","w":"pedestrian","pos":["n","adj"],"ph":"/pəˈdestriən/","cefr":"B1","kr":["보행자","도보의","평범한"],"ex":[{"en":"Pedestrians must use the crosswalk to cross the street safely.","ko":"보행자들은 안전하게 길을 건너려면 횡단보도를 이용해야 한다."}],"mnemonic":{"soundHint":null,"story":"ped(발)로 걷는 사람 → 보행자.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"walker","ko":"보행자","reason":"동의어 - 핵심 짝"},{"w":"motorist","ko":"운전자","reason":"반의어 - 보행자 vs 운전자"},{"w":"crosswalk","ko":"횡단보도","reason":"콜로케이션 - 보행자 이용"}],"collocBest":[{"en":"pedestrian crossing","ko":"횡단보도"},{"en":"pedestrian zone","ko":"보행자 전용 구역"}]},"nuance":{"koSimple":"길을 걷는 사람.","whenToUse":"차와 대비되는 보행자를 말할 때."},"krDetail":[{"ko":"보행자","explain":"걸어서 다니는 사람"},{"ko":"도보의","explain":"걸어다니는 것과 관련된"},{"ko":"평범한","explain":"특별한 데 없이 흔한"}],"usageExamples":[{"en":"The pedestrian carefully crossed the busy street after checking both sides twice.","ko":"그 보행자는 양쪽을 두 번 확인한 후 붐비는 거리를 조심스럽게 건넜다."},{"en":"A motorist zips past traffic quickly, but a pedestrian sees the city up close and personal.","ko":"운전자는 교통을 빠르게 지나치지만, 보행자는 도시를 가까이서 개인적으로 본다."}],"grammarNote":"pedestrian은 명사(보행자)와 형용사(도보의·평범한) 용법이 있다. 형용사로 '평범한, 진부한'의 뜻으로 쓰이면 부정적 뉘앙스가 강하니 주의해야 한다. pedestrian crossing(횡단보도), pedestrian zone(보행자 전용 구역)처럼 복합명사에서 자주 등장한다. 학생들은 형용사의 '평범한' 의미를 놓치기 쉽다.","grammarQuiz":[{"sentence":"A young _____ _____ hit by a car near the school this morning, but she was not badly hurt.","ko":"오늘 아침 학교 근처에서 한 어린 보행자가 차에 치였지만, 크게 다치지는 않았다.","answer":["pedestrian","was"],"hint":"명사 + 수동태 be 동사"},{"sentence":"Please use the _____ crossing _____ safely reach the other side of the busy avenue.","ko":"붐비는 도로의 반대편에 안전하게 도착하려면 횡단보도를 이용해 주세요.","answer":["pedestrian","to"],"hint":"형용사 + to부정사"}]},
    {"id":"w04809","w":"perform","pos":["v"],"ph":"/pərˈfɔːrm/","cefr":"B1","kr":["수행하다","공연하다"],"ex":[{"en":"The band performed live on stage.","ko":"밴드가 무대에서 라이브로 공연했다."}],"mnemonic":{"soundHint":null,"story":"per(완전히) + form(형태) → 형태를 갖춰 수행하다, 공연하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"execute","ko":"실행하다","reason":"동의어 - 임무 수행"},{"w":"stage","ko":"무대","reason":"콜로케이션 - 무대에서 공연"},{"w":"audience","ko":"관객","reason":"시나리오 - 관객 앞에서 공연"}],"collocBest":[{"en":"perform surgery","ko":"수술을 수행하다"},{"en":"perform on stage","ko":"무대에서 공연하다"}]},"nuance":{"koSimple":"일을 해내다·무대에 서다.","whenToUse":"임무 수행·공연 무대 말할 때."},"krDetail":[{"ko":"수행하다","explain":"맡은 일을 실제로 이루어 내다"},{"ko":"공연하다","explain":"많은 사람 앞에서 노래·연극을 보이다"}],"usageExamples":[{"en":"The surgeon will perform a difficult heart operation early tomorrow morning.","ko":"그 외과의사는 내일 아침 일찍 어려운 심장 수술을 수행할 것이다."},{"en":"Practice alone shows little; you must perform well on stage to win the audience's respect.","ko":"연습만으로는 보여 줄 수 있는 것이 적으며, 청중의 존경을 얻으려면 무대에서 잘 공연해야 한다."}],"grammarNote":"perform은 타동사(어떤 일·수술·역할을 수행하다)와 자동사(공연하다·수행 능력을 보이다)로 모두 쓰인다. 학생들은 perform on stage, perform well, perform surgery처럼 목적어 유무에 따라 뜻이 달라지는 것을 익혀야 한다. carry out(수행하다)과 유의어이며, 공연 의미에서는 자동사 용법이 흔하다.","grammarQuiz":[{"sentence":"The famous singer will _____ live _____ Seoul next month for the first time in years.","ko":"그 유명 가수는 다음 달 몇 년 만에 처음으로 서울에서 라이브로 공연할 것이다.","answer":["perform","in"],"hint":"자동사 원형 + 장소 in"},{"sentence":"The doctor _____ the difficult surgery _____ carefully that the patient recovered fully within days.","ko":"의사가 어려운 수술을 매우 조심스럽게 수행해서, 환자는 며칠 안에 완전히 회복되었다.","answer":["performed","so"],"hint":"타동사 과거형 + so ~ that"}]},
    {"id":"w04819","w":"permanent","pos":["adj"],"ph":"/ˈpɜːrmənənt/","cefr":"B1","kr":["영구적인","영속적인"],"ex":[{"en":"She got a permanent job at the company.","ko":"그녀는 회사에서 정규직을 얻었다."}],"mnemonic":{"soundHint":null,"story":"per(끝까지) + manent(머무는) → 영구적인.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"lasting","ko":"지속적인","reason":"동의어 - 오래 지속"},{"w":"eternal","ko":"영원한","reason":"동의어 - 끝없는"},{"w":"temporary","ko":"일시적인","reason":"반의어 - 영구 vs 일시"}],"collocBest":[{"en":"permanent job","ko":"정규직"},{"en":"permanent damage","ko":"영구적 손상"}]},"nuance":{"koSimple":"오래 변하지 않고 계속 가는.","whenToUse":"정규직·영구 손상 말할 때."},"krDetail":[{"ko":"영구적인","explain":"오래도록 변하지 않고 이어지는"},{"ko":"영속적인","explain":"언제까지나 그대로 이어지는"}],"usageExamples":[{"en":"She finally found a permanent job at a large company after years of hard searching.","ko":"그녀는 여러 해 동안 열심히 찾은 끝에 마침내 큰 회사에서 정규직을 얻었다."},{"en":"Temporary damage can heal with time, but permanent damage often leaves lasting scars on the body.","ko":"일시적 손상은 시간이 지나면 나을 수 있지만, 영구적 손상은 종종 몸에 오래가는 흉터를 남긴다."}],"grammarNote":"permanent는 형용사로 '영구적인, 변하지 않는' 뜻이며, 반의어는 temporary다. 학생들은 permanent resident(영주권자), permanent address(주민등록상 주소), permanent damage(영구적 손상)처럼 관용 결합을 익혀야 한다. 부사형 permanently, 명사형 permanence도 함께 익히면 좋다.","grammarQuiz":[{"sentence":"After years of temporary work, she finally _____ a _____ position at the university.","ko":"여러 해의 임시직 끝에, 그녀는 마침내 대학에서 정규직을 얻었다.","answer":["got","permanent"],"hint":"동사 과거형 + 형용사"},{"sentence":"The accident caused _____ damage _____ his knee, so he cannot run marathons anymore.","ko":"그 사고는 그의 무릎에 영구적 손상을 입혀서, 그는 더 이상 마라톤을 뛸 수 없다.","answer":["permanent","to"],"hint":"형용사 + 전치사 to"}]},
    {"id":"w04834","w":"personality","pos":["n"],"ph":"/ˌpɜːrsəˈnælɪti/","cefr":"B1","kr":["성격","인성","개성"],"ex":[{"en":"She has a warm and friendly personality.","ko":"그녀는 따뜻하고 친절한 성격을 가지고 있다."}],"mnemonic":{"soundHint":null,"story":"person(사람) + -ality → 사람의 성격.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"character","ko":"성격","reason":"동의어 - 핵심 짝"},{"w":"trait","ko":"특성","reason":"동의어 - 성격 특성"},{"w":"temperament","ko":"기질","reason":"동의어 - 타고난 성격"}],"collocBest":[{"en":"strong personality","ko":"강한 성격"},{"en":"split personality","ko":"이중 인격"}]},"nuance":{"koSimple":"그 사람만의 성격·개성.","whenToUse":"사람의 기질·개성 표현할 때."},"krDetail":[{"ko":"성격","explain":"사람이 지닌 마음의 됨됨이"},{"ko":"인성","explain":"사람다움을 이루는 마음가짐"},{"ko":"개성","explain":"남과 다른 자기만의 됨됨이"}],"usageExamples":[{"en":"Her cheerful personality makes everyone in the classroom feel warm and welcomed.","ko":"그녀의 밝은 성격은 교실의 모든 사람이 따뜻함과 환영받는 느낌을 갖게 한다."},{"en":"A quick first impression is limited, but a strong personality reveals itself over time in every interaction.","ko":"빠른 첫인상은 제한적이지만, 강한 개성은 모든 상호작용을 통해 시간이 지나면서 드러난다."}],"grammarNote":"personality는 성격 그 자체(추상적 특성)와 유명인(a TV personality)의 두 뜻으로 쓰인다. 학생들은 strong/pleasant/outgoing/cheerful personality 같은 형용사 결합을 익혀야 한다. character와의 차이도 시험에 자주 나오는데, character는 도덕성·본성, personality는 겉으로 드러나는 성격 특징에 초점이 있다.","grammarQuiz":[{"sentence":"Her warm and friendly _____ _____ her one of the most popular teachers at the school.","ko":"그녀의 따뜻하고 친근한 성격은 그녀를 학교에서 가장 인기 있는 교사 중 한 명으로 만들었다.","answer":["personality","made"],"hint":"명사 + 동사 make 과거형"},{"sentence":"The famous TV _____ _____ known for his sharp wit and honest opinions on daily issues.","ko":"그 유명한 TV 스타는 예리한 재치와 일상 문제에 대한 솔직한 의견으로 알려져 있다.","answer":["personality","is"],"hint":"명사(유명인) + be 동사"}]},
    {"id":"w04835","w":"personally","pos":["adv"],"ph":"/ˈpɜːrsənəli/","cefr":"B1","kr":["개인적으로","직접"],"ex":[{"en":"I personally think he is right.","ko":"나는 개인적으로 그가 옳다고 생각한다."}],"mnemonic":{"soundHint":null,"story":"personal(개인의) + -ly → 개인적으로.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"individually","ko":"개별적으로","reason":"동의어 - 개인 단위"},{"w":"directly","ko":"직접","reason":"동의어 - 몸소"},{"w":"publicly","ko":"공개적으로","reason":"반의어 - 개인 vs 공개"}],"collocBest":[{"en":"personally responsible","ko":"개인적으로 책임이 있는"},{"en":"take personally","ko":"개인적으로 받아들이다"}]},"nuance":{"koSimple":"내 개인적 의견으로는.","whenToUse":"자기 생각을 밝힐 때."},"krDetail":[{"ko":"개인적으로","explain":"다른 사람과 관계없이 자기 자신으로서"},{"ko":"직접","explain":"다른 사람을 거치지 않고 스스로"}],"usageExamples":[{"en":"I personally think that we should leave earlier to avoid the heavy afternoon traffic.","ko":"저는 개인적으로 오후의 심한 교통 체증을 피하려면 우리가 더 일찍 출발해야 한다고 생각한다."},{"en":"You should not take his critical comments personally; he behaves the same way with everyone he meets.","ko":"그의 비판적인 말을 개인적으로 받아들이지 마세요; 그는 만나는 모든 사람에게 똑같이 행동합니다."}],"grammarNote":"personally는 부사로 문두에서 개인적 의견을 밝히거나(Personally, I ~), take ~ personally(개인적으로 받아들이다) 관용구로 자주 쓰인다. 학생들은 'personally speaking'과 'in my opinion'을 대체 표현으로 익히면 좋다. 문어체 격식체에서는 문장 앞에 콤마와 함께 놓이는 도치 패턴이 흔하다.","grammarQuiz":[{"sentence":"_____, I _____ that we should postpone the outdoor event because of the bad weather forecast.","ko":"개인적으로, 저는 나쁜 일기예보 때문에 야외 행사를 연기해야 한다고 생각합니다.","answer":["Personally","think"],"hint":"부사 + 1인칭 동사 원형"},{"sentence":"Please do not take his rude comments _____; he is often _____ to strangers by nature.","ko":"그의 무례한 말을 개인적으로 받아들이지 마세요; 그는 낯선 사람들에게 자주 그렇게 대합니다.","answer":["personally","rude"],"hint":"부사 + 형용사 rude"}]},
    {"id":"w04897","w":"planning","pos":["n"],"ph":"/ˈplænɪŋ/","cefr":"B1","kr":["계획","기획"],"ex":[{"en":"Good planning is essential for success.","ko":"좋은 계획은 성공에 필수적이다."}],"mnemonic":{"soundHint":null,"story":"이사 온 첫날, 짐을 다 풀어놓고 어떻게 정리할지 '플래닝'하는 나. 계획 없이는 방이 엉망이 될 것 같았다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"strategy","ko":"전략","reason":"planning의 상위 개념. 계획은 전략을 실현하는 과정"},{"w":"schedule","ko":"일정","reason":"planning의 결과물로 일정이 나옴"},{"w":"chaos","ko":"혼란","reason":"planning의 부재 상태 - 반의 시나리오"}],"collocBest":[{"en":"careful planning","ko":"신중한 계획"},{"en":"city planning","ko":"도시 계획"}]},"nuance":{"koSimple":"미리 그림을 그려 짜 두는 일.","whenToUse":"여행·행사·도시 설계 준비 얘기할 때."},"krDetail":[{"ko":"계획","explain":"앞일을 미리 짜서 세워두는 그림"},{"ko":"기획","explain":"무엇을 어떻게 할지 미리 짜는 일"}],"usageExamples":[{"en":"The team is planning a new project for next year.","ko":"그 팀은 내년을 위한 새로운 프로젝트를 계획하고 있다."},{"en":"Careful planning helps us avoid mistakes.","ko":"신중한 계획은 우리가 실수를 피하도록 도와준다."}],"grammarNote":"planning은 동명사와 명사 두 가지로 쓰이는데, 학생들은 종종 be동사 뒤 -ing 형태를 무조건 진행형으로 오해한다. 'careful planning'처럼 형용사의 수식을 받는 경우는 순수 명사 용법이다.","grammarQuiz":[{"sentence":"Careful _____ is _____ for the success of any large project.","ko":"신중한 계획은 어떤 큰 프로젝트의 성공을 위해 필요하다.","answer":["planning","necessary"],"hint":"명사형 planning + 형용사"}]},
    {"id":"w04910","w":"pleasant","pos":["adj"],"ph":"/ˈplezənt/","cefr":"B1","kr":["즐거운","유쾌한"],"ex":[{"en":"We had a pleasant walk in the park.","ko":"우리는 공원에서 즐거운 산책을 했다."}],"mnemonic":{"soundHint":null,"story":"잔디밭에 앉아 즐거운 시간을 보냈다. '플레즌트'한 오후.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"enjoyable","ko":"즐거운","reason":"직접 동의어"},{"w":"unpleasant","ko":"불쾌한","reason":"un- 접두사 반의어"},{"w":"weather","ko":"날씨","reason":"pleasant weather 콜로 - 자주 결합"}],"collocBest":[{"en":"pleasant surprise","ko":"즐거운 놀라움"},{"en":"pleasant weather","ko":"쾌적한 날씨"}]},"nuance":{"koSimple":"기분이 살짝 좋아지는 느낌의.","whenToUse":"날씨·산책·만남이 상쾌할 때."},"krDetail":[{"ko":"즐거운","explain":"마음이 밝고 기분이 좋은"},{"ko":"유쾌한","explain":"기분이 시원하고 상쾌한"}],"usageExamples":[{"en":"We had a pleasant conversation over dinner last night.","ko":"우리는 어젯밤 저녁 식사를 하며 즐거운 대화를 나누었다."},{"en":"The weather today is far from pleasant.","ko":"오늘 날씨는 결코 쾌적하지 않다."}],"grammarNote":"pleasant는 사물이나 상황이 즐거움을 주는 성질을 나타내며, 사람의 감정에는 pleased를 쓴다. 학생들이 'I am pleasant'라고 잘못 쓰는 경우가 많으니 주의한다.","grammarQuiz":[{"sentence":"It was such a _____ evening that we _____ hours talking on the porch.","ko":"너무 즐거운 저녁이어서 우리는 현관에서 몇 시간을 이야기하며 보냈다.","answer":["pleasant","spent"],"hint":"형용사 + 과거동사"}]},
    {"id":"w04912","w":"pleasure","pos":["n"],"ph":"/ˈpleʒər/","cefr":"B1","kr":["즐거움","기쁨"],"ex":[{"en":"Reading gives me great pleasure.","ko":"독서는 나에게 큰 즐거움을 준다."}],"mnemonic":{"soundHint":null,"story":"'플레저' → pleasant(즐거운)의 명사형. 즐거움 그 자체.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"delight","ko":"기쁨","reason":"직접 동의어"},{"w":"pain","ko":"고통","reason":"직접 반의어"},{"w":"guilty","ko":"죄책감의","reason":"guilty pleasure 콜로 - 자주 결합"}],"collocBest":[{"en":"take pleasure in","ko":"~에서 즐거움을 찾다"},{"en":"with pleasure","ko":"기꺼이"}]},"nuance":{"koSimple":"마음이 즐겁게 부풀어 오르는 감정.","whenToUse":"취미·독서·만남으로 기쁠 때."},"krDetail":[{"ko":"즐거움","explain":"마음이 흐뭇하고 기분이 좋은 느낌"},{"ko":"기쁨","explain":"속에서 우러나는 밝고 좋은 마음"}],"usageExamples":[{"en":"Reading books gives her great pleasure every night.","ko":"책을 읽는 것은 매일 밤 그녀에게 큰 즐거움을 준다."},{"en":"It was a pleasure to meet you in person.","ko":"당신을 직접 만나게 되어 기뻤습니다."}],"grammarNote":"pleasure는 추상명사로 쓰일 때 무관사, 특정 즐거운 일은 'a pleasure'로 관사를 붙인다. 'take pleasure in -ing' 구조에서 in 뒤에는 반드시 동명사가 온다.","grammarQuiz":[{"sentence":"She _____ great _____ in helping others learn new languages.","ko":"그녀는 다른 사람들이 새 언어를 배우도록 돕는 데서 큰 즐거움을 얻는다.","answer":["takes","pleasure"],"hint":"동사 + 명사"}]},
    {"id":"w04942","w":"political","pos":["adj"],"ph":"/pəˈlɪtɪkəl/","cefr":"B1","kr":["정치적인"],"ex":[{"en":"He has strong political views.","ko":"그는 강한 정치적 견해를 가지고 있다."}],"mnemonic":{"soundHint":null,"story":"politics(정치)의 형용사형. -al 붙어서 형용사가 된 규칙.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"politics","ko":"정치","reason":"명사형 - 짝"},{"w":"governmental","ko":"정부의","reason":"직접 동의어"},{"w":"party","ko":"정당","reason":"political party - 자주 결합"}],"collocBest":[{"en":"political party","ko":"정당"},{"en":"political system","ko":"정치 체제"}]},"nuance":{"koSimple":"나라 다스리는 일과 관련된.","whenToUse":"선거·정당·정책 이야기할 때."},"krDetail":[{"ko":"정치적인","explain":"나라 다스림과 얽힌"}],"usageExamples":[{"en":"The president made a political speech on TV.","ko":"대통령은 TV에서 정치적인 연설을 했다."},{"en":"Political parties compete in every election.","ko":"정당들은 모든 선거에서 경쟁한다."}],"grammarNote":"political은 형용사로만 쓰이고, 명사 '정치'는 politics이다. 학생들이 'political is important' 식으로 형용사를 주어로 쓰는 오류를 자주 범한다.","grammarQuiz":[{"sentence":"The _____ crisis _____ solved through careful negotiation among leaders.","ko":"그 정치적 위기는 지도자들 간의 신중한 협상을 통해 해결되었다.","answer":["political","was"],"hint":"형용사 + be동사"}]},

    {"id":"w04944","w":"politics","pos":["n"],"ph":"/ˈpɒlɪtɪks/","cefr":"B1","kr":["정치","정치학"],"ex":[{"en":"She studied politics at university.","ko":"그녀는 대학에서 정치학을 공부했다."}],"mnemonic":{"soundHint":null,"story":"politician(정치인)이 하는 일 = politics(정치). 짝으로 외우기.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"politician","ko":"정치인","reason":"politics를 하는 사람 - 짝"},{"w":"government","ko":"정부","reason":"politics의 무대"},{"w":"election","ko":"선거","reason":"politics의 핵심 이벤트 - 시나리오"}],"collocBest":[{"en":"enter politics","ko":"정계에 입문하다"},{"en":"local politics","ko":"지역 정치"}]},"nuance":{"koSimple":"나라를 이끄는 일 자체.","whenToUse":"선거·정책 학문 다룰 때."},"krDetail":[{"ko":"정치","explain":"나라를 다스리는 일과 흐름"},{"ko":"정치학","explain":"나라 다스림을 배우는 학문"}],"usageExamples":[{"en":"He studied politics at a well-known university.","ko":"그는 잘 알려진 대학에서 정치학을 공부했다."},{"en":"Politics has changed rapidly over the last decade.","ko":"정치는 지난 10년간 급격히 변해왔다."}],"grammarNote":"politics는 -s로 끝나지만 학문·분야를 뜻할 때는 단수 취급하여 단수 동사를 쓴다. 'Politics is my major.'가 옳은 형태이며, '정치 활동/견해'를 뜻할 때는 복수 취급도 가능하다.","grammarQuiz":[{"sentence":"Politics _____ a complex subject _____ requires deep understanding.","ko":"정치학은 깊은 이해를 필요로 하는 복잡한 과목이다.","answer":["is","that"],"hint":"단수 be동사 + 관계대명사"}]},

    {"id":"w04955","w":"popularity","pos":["n"],"ph":"/ˌpɒpjʊˈlærɪti/","cefr":"B1","kr":["인기","대중성"],"ex":[{"en":"The singer's popularity grew quickly.","ko":"그 가수의 인기는 빠르게 높아졌다."}],"mnemonic":{"soundHint":null,"story":"popular(인기 있는)의 명사형. -ity 붙여 명사화. 인기의 정도.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fame","ko":"명성","reason":"직접 동의어"},{"w":"unpopularity","ko":"비인기","reason":"un- 반의어"},{"w":"gain","ko":"얻다","reason":"gain popularity - 자주 결합"}],"collocBest":[{"en":"gain popularity","ko":"인기를 얻다"},{"en":"widespread popularity","ko":"광범위한 인기"}]},"nuance":{"koSimple":"많은 사람이 좋아하는 정도.","whenToUse":"가수·유행·상품 인기 얘기할 때."},"krDetail":[{"ko":"인기","explain":"많은 사람에게 사랑받는 정도"},{"ko":"대중성","explain":"일반 사람들에게 널리 받아들여짐"}],"usageExamples":[{"en":"The band gained popularity after their new song.","ko":"그 밴드는 새 노래 이후 인기를 얻었다."},{"en":"Widespread popularity often brings unwanted media attention.","ko":"널리 퍼진 인기는 종종 원치 않는 언론의 관심을 끈다."}],"grammarNote":"popularity는 불가산명사로 무관사로 쓰지만, 'a growing popularity'처럼 형용사 수식을 받을 때는 부정관사 a가 붙기도 한다. 'gain/gain in popularity'로 자주 쓴다.","grammarQuiz":[{"sentence":"The show quickly _____ popularity _____ its funny characters.","ko":"그 프로그램은 재미있는 캐릭터들 때문에 빠르게 인기를 얻었다.","answer":["gained","because of"],"hint":"과거동사 + 전치사구"}]},

    {"id":"w04969","w":"possibility","pos":["n"],"ph":"/ˌpɒsɪˈbɪlɪti/","cefr":"B1","kr":["가능성"],"ex":[{"en":"There is a possibility of rain tomorrow.","ko":"내일 비가 올 가능성이 있다."}],"mnemonic":{"soundHint":null,"story":"possible(가능한)의 명사형. -bility 붙여 명사화. 가능한 정도 = 가능성.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"chance","ko":"가능성","reason":"직접 동의어"},{"w":"impossibility","ko":"불가능성","reason":"im- 반의어"},{"w":"explore","ko":"탐색하다","reason":"explore possibilities - 콜로"}],"collocBest":[{"en":"real possibility","ko":"실제 가능성"},{"en":"explore possibilities","ko":"가능성을 탐색하다"}]},"nuance":{"koSimple":"일어날 수도 있는 여지.","whenToUse":"미래 결과·선택지 얘기할 때."},"krDetail":[{"ko":"가능성","explain":"어떤 일이 이루어질 수 있는 정도"}],"usageExamples":[{"en":"There is a real possibility of rain this afternoon.","ko":"오늘 오후에 비가 올 실제 가능성이 있다."},{"en":"We should explore all possibilities before deciding.","ko":"결정하기 전에 우리는 모든 가능성을 탐색해야 한다."}],"grammarNote":"possibility 뒤에는 전치사 of + 동명사 또는 that절이 온다. 'possibility to do'는 잘못된 형태이며 'possibility of doing'이 옳다. 학생들이 자주 저지르는 오류이다.","grammarQuiz":[{"sentence":"There is a strong _____ of _____ our target by the deadline.","ko":"마감일까지 우리의 목표를 달성할 강한 가능성이 있다.","answer":["possibility","meeting"],"hint":"명사 + 동명사"}]},
    {"id":"w04982","w":"pottery","pos":["n"],"ph":"/ˈpɒtəri/","cefr":"B1","kr":["도자기","도예"],"ex":[{"en":"She enjoyed making pottery as a hobby.","ko":"그녀는 취미로 도예를 즐겼다."}],"mnemonic":{"soundHint":null,"story":"pot(항아리)을 만드는 기술이 pottery(도예). 어원이 pot.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ceramics","ko":"도자기","reason":"직접 동의어"},{"w":"clay","ko":"점토","reason":"pottery의 재료 - 시나리오"},{"w":"class","ko":"수업","reason":"pottery class - 자주 결합"}],"collocBest":[{"en":"pottery class","ko":"도자기 수업"},{"en":"make pottery","ko":"도자기를 만들다"}]},"nuance":{"koSimple":"흙 빚어 구워 만든 그릇·예술.","whenToUse":"도예 수업·전시 이야기할 때."},"krDetail":[{"ko":"도자기","explain":"흙을 빚어 구워 만든 그릇"},{"ko":"도예","explain":"흙을 빚어 그릇을 만드는 솜씨"}],"usageExamples":[{"en":"She makes beautiful pottery in her home studio.","ko":"그녀는 자신의 집 작업실에서 아름다운 도자기를 만든다."},{"en":"Korean pottery is admired all around the world.","ko":"한국 도자기는 전 세계에서 존경받는다."}],"grammarNote":"pottery는 불가산명사로 관사 a/an이나 복수형을 쓰지 않는다. 도자기 한 점을 뜻할 때는 'a piece of pottery'라고 써야 한다. 학생들이 'a pottery'로 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The museum displayed ancient _____ _____ was discovered in the tomb.","ko":"그 박물관은 무덤에서 발견된 고대 도자기를 전시했다.","answer":["pottery","which"],"hint":"명사 + 관계대명사"}]},
    {"id":"w04983","w":"poultry","pos":["n"],"ph":"/ˈpoʊltri/","cefr":"B1","kr":["가금류","닭고기"],"ex":[{"en":"The farm raises poultry for eggs and meat.","ko":"그 농장은 달걀과 고기를 위해 가금류를 기른다."}],"mnemonic":{"soundHint":null,"story":"poultry는 닭·오리 같은 가금류. KFC의 재료가 다 poultry.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"chicken","ko":"닭","reason":"poultry의 대표"},{"w":"livestock","ko":"가축","reason":"poultry는 livestock의 일종"},{"w":"farm","ko":"농장","reason":"poultry farm - 자주 결합"}],"collocBest":[{"en":"poultry farm","ko":"가금류 농장"},{"en":"poultry products","ko":"가금류 제품"}]},"nuance":{"koSimple":"닭·오리 등 식용 가축새.","whenToUse":"농장·식재료 이야기할 때."},"krDetail":[{"ko":"가금류","explain":"집에서 기르는 날짐승 무리"},{"ko":"닭고기","explain":"닭의 살로 만든 먹거리"}],"usageExamples":[{"en":"The farm raises poultry for eggs and meat.","ko":"그 농장은 계란과 고기를 위해 가금류를 기른다."},{"en":"Chicken is the most common type of poultry.","ko":"닭은 가장 흔한 종류의 가금류이다."}],"grammarNote":"poultry는 집합명사이자 불가산명사로 단수 취급하며, 관사 a나 복수형을 쓰지 않는다. 'The poultry is fresh.'가 옳은 형태이며, 'poultries'는 오답이다.","grammarQuiz":[{"sentence":"The _____ raised on this farm _____ known for its high quality.","ko":"이 농장에서 기른 가금류는 높은 품질로 유명하다.","answer":["poultry","is"],"hint":"명사 + be동사"}]},
    {"id":"w04985","w":"poverty","pos":["n"],"ph":"/ˈpɒvəti/","cefr":"B1","kr":["빈곤","가난"],"ex":[{"en":"Millions of people live in poverty.","ko":"수백만 명의 사람들이 빈곤 속에서 살고 있다."}],"mnemonic":{"soundHint":null,"story":"poor(가난한)에서 poverty(가난)로. p-o로 시작하는 게 같다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"hardship","ko":"고난","reason":"직접 동의어"},{"w":"wealth","ko":"부","reason":"직접 반의어"},{"w":"extreme","ko":"극심한","reason":"extreme poverty - 자주 결합"}],"collocBest":[{"en":"live in poverty","ko":"빈곤 속에서 살다"},{"en":"extreme poverty","ko":"극심한 빈곤"}]},"nuance":{"koSimple":"돈이 없어 삶이 힘든 상태.","whenToUse":"사회 문제·복지 이야기할 때."},"krDetail":[{"ko":"빈곤","explain":"먹고살 것이 몹시 모자란 상태"},{"ko":"가난","explain":"살림이 넉넉하지 못함"}],"usageExamples":[{"en":"The organization fights extreme poverty in many countries.","ko":"그 단체는 많은 나라에서 극심한 빈곤과 싸운다."},{"en":"Millions of families still live in poverty today.","ko":"수백만 가족이 오늘날에도 여전히 빈곤 속에서 산다."}],"grammarNote":"poverty는 불가산명사로 관사나 복수형을 쓰지 않는다. 'live in poverty'가 관용 표현이며, 학생들이 관사를 붙여 'in a poverty'로 쓰는 오류를 종종 범한다.","grammarQuiz":[{"sentence":"Many people in that region live _____ poverty _____ generations.","ko":"그 지역의 많은 사람들이 여러 세대에 걸쳐 빈곤 속에서 산다.","answer":["in","for"],"hint":"전치사 + 전치사"}]},
    {"id":"w04989","w":"practical","pos":["adj"],"ph":"/ˈpræktɪkəl/","cefr":"B1","kr":["실용적인","실제적인"],"ex":[{"en":"She gave practical advice for saving money.","ko":"그녀는 돈을 절약하는 실용적인 조언을 주었다."}],"mnemonic":{"soundHint":null,"story":"practice(연습)에서 온 형용사. 실제로 practice해서 쓸 수 있는 = practical(실용적인).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"useful","ko":"유용한","reason":"직접 동의어"},{"w":"theoretical","ko":"이론적인","reason":"직접 반의어"},{"w":"solution","ko":"해결책","reason":"practical solution - 자주 결합"}],"collocBest":[{"en":"practical skills","ko":"실용적인 기술"},{"en":"practical solution","ko":"실용적인 해결책"}]},"nuance":{"koSimple":"실제로 쓰기 좋은.","whenToUse":"현실적 조언·해결책 말할 때."},"krDetail":[{"ko":"실용적인","explain":"실제로 쓰기에 알맞고 도움 되는"},{"ko":"실제적인","explain":"말이 아니라 참으로 이루어지는"}],"usageExamples":[{"en":"The teacher gave us practical advice for the exam.","ko":"그 선생님은 시험을 위한 실용적인 조언을 우리에게 해주었다."},{"en":"This method is theoretical rather than practical.","ko":"이 방법은 실용적이라기보다는 이론적이다."}],"grammarNote":"practical과 practicable을 학생들이 혼동한다. practical은 '실용적인, 유용한'이고 practicable은 '실행 가능한'이다. 문맥에 따라 정확한 단어를 골라 써야 한다.","grammarQuiz":[{"sentence":"The workshop offers _____ skills _____ students can use daily.","ko":"그 워크숍은 학생들이 매일 사용할 수 있는 실용적인 기술들을 제공한다.","answer":["practical","that"],"hint":"형용사 + 관계대명사"}]},
    {"id":"w05009","w":"predict","pos":["v"],"ph":"/prɪˈdɪkt/","cefr":"B1","kr":["예측하다","예언하다"],"ex":[{"en":"Scientists predict a rise in sea levels.","ko":"과학자들은 해수면 상승을 예측한다."}],"mnemonic":{"soundHint":null,"story":"pre(미리) + dict(말하다) = predict(예측하다). 어원 그대로.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"forecast","ko":"예측하다","reason":"직접 동의어"},{"w":"prediction","ko":"예측","reason":"명사형 - 짝"},{"w":"future","ko":"미래","reason":"predict the future - 자주 결합"}],"collocBest":[{"en":"predict the future","ko":"미래를 예측하다"},{"en":"predict outcomes","ko":"결과를 예측하다"}]},"nuance":{"koSimple":"앞으로 일어날 일을 미리 말하다.","whenToUse":"날씨·경기 결과·미래 얘기할 때."},"krDetail":[{"ko":"예측하다","explain":"앞일을 미리 헤아려 말하다"},{"ko":"예언하다","explain":"앞으로 있을 일을 미리 알려주다"}],"usageExamples":[{"en":"Scientists predict a warmer climate in the coming years.","ko":"과학자들은 앞으로 몇 년 안에 더 따뜻한 기후를 예측한다."},{"en":"No one can predict exactly what will happen tomorrow.","ko":"아무도 내일 무슨 일이 일어날지 정확히 예측할 수 없다."}],"grammarNote":"predict는 타동사로 명사나 that절을 목적어로 취한다. 'predict about'은 잘못된 형태이며, 학생들이 자주 오류를 범하는 부분이다. 'predict + that + 주어 + 동사'가 정확하다.","grammarQuiz":[{"sentence":"Experts _____ that the market _____ recover within a year.","ko":"전문가들은 시장이 1년 안에 회복될 것이라고 예측한다.","answer":["predict","will"],"hint":"동사 + 조동사"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {

  correct(){

  // jp-slot-jackpot: 도-솔-도-미 차임 4단

    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));

  },
  // jp-chime-asc: 800→1000→1200 3단

  grandFanfare(){

      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){

  const m = Math.floor(s/60), r = s%60;

}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){

    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">

}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 콜로케이션 영작 ──────────────────────────────
  if(mode === "colloc-write"){
    const inp = document.getElementById("ansInput");
    const val = normalizeAnswer(inp.value);
    if(!val) return;
    state.quizAnswered = true;
    const correct = normalizeAnswer(state.quizCurrent.colloc.en);
    const isCorrect = val === correct;
    inp.classList.add(isCorrect ? "correct" : "wrong");
    inp.disabled = true;
    document.getElementById("submitBtn").disabled = true;
    if(!isCorrect){
      document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(state.quizCurrent.colloc.en)}</b>`;
    }
    finishQuestion(isCorrect);
    return;
  }

  // ── 심화: 예문 빈칸 채우기 · 문법 빈칸 채우기 ────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const inputs = Array.from(document.querySelectorAll(".cloze-input"));
    if(inputs.some(i => !i.value.trim())) return;
    state.quizAnswered = true;
    let allOk = true;
    inputs.forEach(i => {
      const guess = normalizeAnswer(i.value);
      const ans = normalizeAnswer(i.dataset.ans);
      const ok = guess === ans;
      i.classList.add(ok ? "correct" : "wrong");
      i.disabled = true;
      if(!ok) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = inputs.map(i => `<b style="color:var(--grade)">${escape(i.dataset.ans)}</b>`).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본: 철자·리스닝 ────────────────────────────────
  const inp = document.getElementById("ansInput");
  const val = (inp.value||"").trim().toLowerCase();
  if(!val) return;
  state.quizAnswered = true;
  const isCorrect = val === word.w.toLowerCase();
  inp.classList.add(isCorrect ? "correct" : "wrong");
  inp.disabled = true;
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(word.w)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}
