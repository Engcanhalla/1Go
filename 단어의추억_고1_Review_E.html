<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review E</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}

  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;

    content:"";position:absolute;inset:0;

      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),

  }
  .hg-msg{
    position:relative;font-family:inherit;

  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}

  @keyframes shake{

  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

  .rainbow-overlay{

  }

  .hidden{display:none !important;}

  /* ---------- MOBILE TUNING ---------- */

    .face.front .word{font-size:54px;}

  }

</style>

    {"id":"w03231","w":"incident","pos":["n"],"ph":"/ˈɪnsɪdənt/","cefr":"B1","kr":["사건","사고"],"ex":[{"en":"Report any incident immediately.","ko":"어떤 사건이든 즉시 신고하라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"accident","ko":"사고","reason":"incident와 함께 사건·사고 뉴스에서 짝으로 등장"},{"w":"report","ko":"신고하다","reason":"report an incident 콜로케이션의 짝"},{"w":"witness","ko":"목격자","reason":"사건 현장 시나리오에서 필수"}],"collocBest":[{"en":"serious incident","ko":"심각한 사건"},{"en":"report an incident","ko":"사건을 신고하다"}]},"nuance":{"koSimple":"일어난 하나의 사건이나 사고.","whenToUse":"뉴스·보고서에서 사건 하나를 가리킬 때."},"krDetail":[{"ko":"사건","explain":"평소와 다르게 일어난 일로, 사람들의 관심을 끌거나 문제가 될 수 있는 어떤 일"},{"ko":"사고","explain":"뜻하지 않게 갑자기 일어난 좋지 않은 일로, 다치거나 손해를 입히는 뜻밖의 일"}],"usageExamples":[{"en":"The police officer carefully reported the strange incident to headquarters.","ko":"그 경찰관은 이상한 사건을 본부에 조심스럽게 보고했다."},{"en":"A small incident on the road caused a huge traffic jam this morning.","ko":"도로 위의 작은 사고 하나가 오늘 아침 엄청난 교통 체증을 일으켰다."}],"grammarNote":"incident는 셀 수 있는 명사(가산명사)이므로 단수일 때 반드시 관사 a/an 또는 the가 필요합니다. 학생들은 자주 'report incident'처럼 관사 없이 쓰는 실수를 합니다. 'report an incident'가 맞습니다.","grammarQuiz":[{"sentence":"Nobody was hurt in the _____, but the whole neighborhood _____ shocked for days.","ko":"그 사건에서 아무도 다치지 않았지만, 온 동네가 며칠 동안 충격에 빠져 있었다.","answer":["incident","was"],"hint":"명사+과거 be동사"}]},
    {"id":"w03254","w":"inconvenient","pos":["adj"],"ph":"/ˌɪnkənˈviːniənt/","cefr":"B1","kr":["불편한","불편을 주는"],"ex":[{"en":"The early meeting time was inconvenient.","ko":"이른 회의 시간이 불편했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"convenient","ko":"편리한","reason":"in-이 붙어 만들어진 반의어 관계"},{"w":"awkward","ko":"어색한, 곤란한","reason":"동의어로 자주 대체 사용"},{"w":"timing","ko":"타이밍","reason":"inconvenient timing 시나리오에서 자주 결합"}],"collocBest":[{"en":"inconvenient time","ko":"불편한 시간"},{"en":"find inconvenient","ko":"불편하다고 생각하다"}]},"nuance":{"koSimple":"시간·상황이 마음에 안 맞아 불편한.","whenToUse":"시간·장소가 안 맞아 곤란할 때."},"krDetail":[{"ko":"불편한","explain":"쓰거나 지내기에 편하지 않고 걸리적거려서 성가시거나 짜증나는 상태"},{"ko":"불편을 주는","explain":"다른 사람의 일이나 계획을 방해하고 성가시게 만드는 성질을 가진"}],"usageExamples":[{"en":"The manager scheduled the meeting at a very inconvenient time for everyone.","ko":"관리자는 회의를 모두에게 매우 불편한 시간에 잡았다."},{"en":"Living far from the subway station is inconvenient during rainy weather.","ko":"지하철역에서 멀리 사는 것은 비 오는 날씨에 불편하다."}],"grammarNote":"형용사 inconvenient는 사람을 주어로 쓰지 않고 사물·상황을 주어로 씁니다. 학생들은 'I am inconvenient'로 쓰는 실수를 하지만, 이는 '내가 남에게 불편을 준다'는 뜻입니다. '나는 불편하다'는 'It is inconvenient for me'로 표현합니다.","grammarQuiz":[{"sentence":"Tell me if this time is _____ for you, and I _____ reschedule the appointment.","ko":"이 시간이 당신에게 불편하다면 말해 주세요, 그러면 제가 약속을 다시 잡을게요.","answer":["inconvenient","will"],"hint":"형용사+조동사"}]},
    {"id":"w03257","w":"increasingly","pos":["adv"],"ph":"/ɪnˈkriːsɪŋli/","cefr":"B1","kr":["점점 더"],"ex":[{"en":"Life is increasingly stressful.","ko":"삶이 점점 더 스트레스를 받는다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"gradually","ko":"점차","reason":"동의어로 대체 가능, '점점' 의미의 짝"},{"w":"popular","ko":"인기 있는","reason":"increasingly popular 콜로케이션의 짝"},{"w":"difficult","ko":"어려운","reason":"increasingly difficult 콜로케이션의 짝"}],"collocBest":[{"en":"increasingly popular","ko":"점점 더 인기 있는"},{"en":"increasingly difficult","ko":"점점 더 어려운"}]},"nuance":{"koSimple":"시간이 갈수록 점점 더.","whenToUse":"변화가 계속 커질 때."},"krDetail":[{"ko":"점점 더","explain":"시간이 지나면서 정도나 수량이 계속해서 조금씩 더 커지거나 강해지는 모양"}],"usageExamples":[{"en":"Scientists find climate change increasingly threatens fragile ocean ecosystems.","ko":"과학자들은 기후 변화가 취약한 해양 생태계를 점점 더 위협한다는 것을 발견한다."},{"en":"The old man's memory has been getting increasingly worse this year.","ko":"그 노인의 기억력은 올해 점점 더 나빠지고 있다."}],"grammarNote":"부사 increasingly는 주로 형용사나 다른 부사 앞에 위치해 그 정도가 커지고 있음을 나타냅니다. 학생들은 동사 앞에 'increasingly work'처럼 쓰기 쉽지만, 형용사와 함께 'increasingly popular'로 쓰는 것이 자연스럽습니다.","grammarQuiz":[{"sentence":"As technology develops, our daily lives _____ _____ dependent on smartphones and computers.","ko":"기술이 발전함에 따라, 우리의 일상생활은 점점 더 스마트폰과 컴퓨터에 의존하게 된다.","answer":["are","increasingly"],"hint":"be동사+부사"}]},
    {"id":"w03258","w":"incredible","pos":["adj"],"ph":"/ɪnˈkredɪbəl/","cefr":"B1","kr":["믿을 수 없는","엄청난"],"ex":[{"en":"She has incredible talent.","ko":"그녀는 믿을 수 없는 재능이 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"amazing","ko":"놀라운","reason":"동의어로 강조어 자리에서 대체 가능"},{"w":"unbelievable","ko":"믿을 수 없는","reason":"동의어, in-credible의 어원과 정확히 대응"},{"w":"story","ko":"이야기","reason":"incredible story 콜로케이션의 짝"}],"collocBest":[{"en":"incredible story","ko":"믿을 수 없는 이야기"},{"en":"incredible speed","ko":"엄청난 속도"}]},"nuance":{"koSimple":"믿기지 않을 만큼 놀라운.","whenToUse":"엄청난 재능·경험을 감탄할 때."},"krDetail":[{"ko":"믿을 수 없는","explain":"너무 놀랍거나 대단해서 참말이라 여기기 어려운 정도인"},{"ko":"엄청난","explain":"크기나 정도가 상상을 뛰어넘을 만큼 매우 크고 놀라운"}],"usageExamples":[{"en":"The young player scored an incredible goal from midfield last night.","ko":"그 어린 선수는 어젯밤 미드필드에서 믿을 수 없는 골을 넣었다."},{"en":"The team showed incredible teamwork throughout the final championship match.","ko":"그 팀은 결승전 내내 엄청난 팀워크를 보여주었다."}],"grammarNote":"형용사 incredible과 부사 incredibly를 자주 혼동합니다. 명사 앞에서는 'incredible story'로, 형용사·동사를 꾸밀 때는 'incredibly fast'로 씁니다. 학생들은 'It is incredibly story'로 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"It is _____ _____ how quickly children learn a foreign language when young.","ko":"어린 아이들이 외국어를 얼마나 빨리 배우는지 정말 믿을 수 없다.","answer":["truly","incredible"],"hint":"부사+형용사"}]},
    {"id":"w03259","w":"incredibly","pos":["adv"],"ph":"/ɪnˈkredɪbli/","cefr":"B1","kr":["믿을 수 없을 만큼","엄청나게"],"ex":[{"en":"The test was incredibly hard.","ko":"그 시험은 엄청나게 어려웠다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"amazingly","ko":"놀랍게도","reason":"동의어 부사로 강조어 자리를 공유"},{"w":"fast","ko":"빠른","reason":"incredibly fast 콜로케이션의 짝"},{"w":"beautiful","ko":"아름다운","reason":"incredibly beautiful 콜로케이션의 짝"}],"collocBest":[{"en":"incredibly fast","ko":"엄청나게 빠른"},{"en":"incredibly beautiful","ko":"믿을 수 없을 만큼 아름다운"}]},"nuance":{"koSimple":"믿기 어려울 만큼 아주.","whenToUse":"강조 부사로 놀랄 만큼 대단할 때."},"krDetail":[{"ko":"믿을 수 없을 만큼","explain":"정도가 참으로 놀라워서 그 사실을 받아들이기 힘든 상태로"},{"ko":"엄청나게","explain":"정도가 매우 심하고 굉장하게, 보통 수준을 훨씬 넘어서는 모양으로"}],"usageExamples":[{"en":"The chef prepared an incredibly delicious meal for the important guests tonight.","ko":"그 요리사는 오늘 밤 중요한 손님들을 위해 엄청나게 맛있는 식사를 준비했다."},{"en":"This new laptop runs incredibly fast compared to my previous model.","ko":"이 새 노트북은 내 이전 모델에 비해 믿을 수 없을 만큼 빠르게 작동한다."}],"grammarNote":"부사 incredibly는 형용사나 다른 부사를 강조하는 역할이지 명사를 꾸미지 못합니다. 'incredibly car'는 틀리고 'incredibly fast car'가 맞습니다. 학생들은 형용사와 부사 형태를 자주 헷갈립니다.","grammarQuiz":[{"sentence":"The sunset over the mountain looked _____ beautiful and made _____ speechless.","ko":"산 너머의 일몰은 엄청나게 아름다워 보였고 우리를 말문이 막히게 만들었다.","answer":["incredibly","us"],"hint":"부사+목적어"}]},
    {"id":"w03272","w":"independence","pos":["n"],"ph":"/ˌɪndɪˈpendəns/","cefr":"B1","kr":["독립","자립"],"ex":[{"en":"Korea celebrated its independence.","ko":"한국은 독립을 기념했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"freedom","ko":"자유","reason":"동의어로 독립 운동 시나리오에서 짝"},{"w":"dependence","ko":"의존","reason":"명확한 반의어 관계"},{"w":"declaration","ko":"선언","reason":"declaration of independence 콜로케이션의 짝"}],"collocBest":[{"en":"declaration of independence","ko":"독립 선언"},{"en":"financial independence","ko":"재정적 독립"}]},"nuance":{"koSimple":"남에게 기대지 않는 상태.","whenToUse":"국가 독립·경제 자립 얘기할 때."},"krDetail":[{"ko":"독립","explain":"다른 나라나 사람에게 얽매이지 않고 스스로의 힘으로 다스리거나 살아가는 상태"},{"ko":"자립","explain":"남의 도움을 받지 않고 스스로의 힘으로 서서 살아가는 능력이나 상태"}],"usageExamples":[{"en":"Many young adults value financial independence as they start their careers.","ko":"많은 젊은 성인들은 직장 생활을 시작할 때 재정적 독립을 소중히 여긴다."},{"en":"The country celebrated its independence from colonial rule every August fifteenth.","ko":"그 나라는 매년 8월 15일에 식민 통치로부터의 독립을 기념했다."}],"grammarNote":"independence는 불가산명사로 복수형이 없고 관사 사용에 주의가 필요합니다. 'gain independence'처럼 관사 없이 쓰이거나 'the independence of ~' 형태로 특정할 때 the를 씁니다. 학생들은 'an independence'로 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"After graduation, she moved to another city to gain _____ from her _____.","ko":"졸업 후, 그녀는 부모로부터의 독립을 얻기 위해 다른 도시로 이사했다.","answer":["independence","parents"],"hint":"명사+명사"}]},
    {"id":"w03273","w":"independent","pos":["adj"],"ph":"/ˌɪndɪˈpendənt/","cefr":"B1","kr":["독립적인","자립적인"],"ex":[{"en":"She is an independent thinker.","ko":"그녀는 독립적인 사상가이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"autonomous","ko":"자율적인","reason":"동의어로 형식적 문맥에서 대체 가능"},{"w":"dependent","ko":"의존적인","reason":"명확한 반의어 관계"},{"w":"decision","ko":"결정","reason":"independent decision 콜로케이션의 짝"}],"collocBest":[{"en":"independent decision","ko":"독립적인 결정"},{"en":"financially independent","ko":"재정적으로 독립한"}]},"nuance":{"koSimple":"혼자 힘으로 해내는.","whenToUse":"스스로 결정·생활하는 사람에게."},"krDetail":[{"ko":"독립적인","explain":"다른 사람이나 것에 기대지 않고 스스로 판단하고 행동하는 성질을 가진"},{"ko":"자립적인","explain":"남의 도움 없이 스스로의 힘으로 생활하거나 일할 수 있는 능력을 가진"}],"usageExamples":[{"en":"The teacher encouraged her students to make independent decisions about future careers.","ko":"그 교사는 학생들이 장래 직업에 관해 독립적인 결정을 내리도록 격려했다."},{"en":"Being financially independent gives young people confidence in daily life choices.","ko":"재정적으로 자립적인 것은 젊은이들에게 일상생활 선택에서 자신감을 준다."}],"grammarNote":"independent 뒤에는 전치사 of 또는 from이 오며 미묘한 뜻 차이가 있습니다. 'independent of parents'는 부모에게 의존하지 않는다는 뜻, 'independent from ~'는 분리·해방의 뜻이 강합니다. 학생들은 by나 with를 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"She has been completely _____ of her family since she _____ college five years ago.","ko":"그녀는 5년 전 대학을 졸업한 이후로 가족으로부터 완전히 독립적이었다.","answer":["independent","finished"],"hint":"형용사+과거동사"}]},
    {"id":"w03276","w":"indicate","pos":["v"],"ph":"/ˈɪndɪkeɪt/","cefr":"B1","kr":["나타내다","지시하다"],"ex":[{"en":"The sign indicates danger.","ko":"그 표지판은 위험을 나타낸다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"show","ko":"보여주다","reason":"동의어로 지시·표시 자리 공유"},{"w":"suggest","ko":"시사하다","reason":"'~을 나타내다'는 학술 문맥에서 대체 가능"},{"w":"direction","ko":"방향","reason":"indicate a direction 콜로케이션의 짝"}],"collocBest":[{"en":"indicate a direction","ko":"방향을 나타내다"},{"en":"clearly indicate","ko":"명확히 나타내다"}]},"nuance":{"koSimple":"신호로 알려 주다.","whenToUse":"표지·데이터가 사실을 보여줄 때."},"krDetail":[{"ko":"나타내다","explain":"생각·느낌·상태 등을 겉으로 드러내어 남이 알 수 있게 보여주다"},{"ko":"지시하다","explain":"손짓·말·표시 등으로 어떤 곳이나 대상을 정확히 가리켜 알려주다"}],"usageExamples":[{"en":"Recent studies indicate that regular exercise significantly reduces stress and anxiety levels.","ko":"최근 연구들은 규칙적인 운동이 스트레스와 불안 수준을 크게 줄여준다는 것을 나타낸다."},{"en":"The arrow on the map clearly indicates the direction to the exit.","ko":"지도 위의 화살표는 출구로 가는 방향을 명확히 지시한다."}],"grammarNote":"indicate 뒤에는 명사(구), that절, 또는 wh-절이 옵니다. 학생들이 자주 하는 실수는 'indicate to me the direction'처럼 사람 목적어 앞에 to를 쓰는 것으로, 'indicate the direction to me'가 자연스럽습니다.","grammarQuiz":[{"sentence":"The dark clouds in the sky clearly _____ _____ a storm is coming soon.","ko":"하늘의 어두운 구름은 폭풍이 곧 온다는 것을 명확히 나타낸다.","answer":["indicate","that"],"hint":"동사+접속사"}]},
    {"id":"w03288","w":"individual","pos":["n","adj"],"ph":"/ˌɪndɪˈvɪdʒuəl/","cefr":"B1","kr":["개인","개별적인"],"ex":[{"en":"Each individual has unique strengths.","ko":"각 개인은 독특한 강점을 가지고 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"collective","ko":"집단적인","reason":"명확한 반의어 관계"},{"w":"person","ko":"사람","reason":"동의어로 개인 지칭에서 짝"},{"w":"rights","ko":"권리","reason":"individual rights 콜로케이션의 짝"}],"collocBest":[{"en":"individual rights","ko":"개인의 권리"},{"en":"individual approach","ko":"개별적인 접근"}]},"nuance":{"koSimple":"집단이 아닌 한 사람.","whenToUse":"개인의 권리·특성·개별 대응을 말할 때."},"krDetail":[{"ko":"개인","explain":"집단이나 사회를 이루는 낱낱의 사람을 하나하나 따로 놓고 이르는 말"},{"ko":"개별적인","explain":"여럿을 하나로 뭉뚱그리지 않고 하나하나 따로 떨어져 각각인"}],"usageExamples":[{"en":"Every individual has the right to express their own thoughts and opinions freely.","ko":"모든 개인은 자신의 생각과 의견을 자유롭게 표현할 권리가 있다."},{"en":"Our school offers individual tutoring sessions to help struggling students succeed.","ko":"우리 학교는 어려움을 겪는 학생들이 성공하도록 개별적인 튜터링 시간을 제공한다."}],"grammarNote":"individual은 명사와 형용사 두 역할을 하는데 학생들은 자주 형용사로만 인식합니다. 명사로 쓸 때는 'each individual', 'private individuals'처럼 사람을 뜻하고, 문맥으로 구별해야 합니다.","grammarQuiz":[{"sentence":"Every _____ in this class has _____ own unique learning style and pace.","ko":"이 반의 모든 개인은 각자 자신만의 독특한 학습 방식과 속도를 가지고 있다.","answer":["individual","their"],"hint":"명사+소유격"}]},
    {"id":"w03295","w":"industrial","pos":["adj"],"ph":"/ɪnˈdʌstriəl/","cefr":"B1","kr":["산업의","공업의"],"ex":[{"en":"The city has an industrial zone.","ko":"그 도시에는 공업 지역이 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"revolution","ko":"혁명","reason":"industrial revolution 콜로케이션의 짝"},{"w":"manufacturing","ko":"제조의","reason":"동의어로 산업 관련 자리 공유"},{"w":"agricultural","ko":"농업의","reason":"명확한 반의어 관계"}],"collocBest":[{"en":"industrial revolution","ko":"산업 혁명"},{"en":"industrial area","ko":"공업 지역"}]},"nuance":{"koSimple":"공장에서 물건 만드는 것과 관련한.","whenToUse":"공업 지역·산업 혁명 이야기할 때."},"krDetail":[{"ko":"산업의","explain":"여러 물건을 만들거나 서비스를 제공하는 큰 규모의 일과 관련된"},{"ko":"공업의","explain":"기계와 시설을 써서 원료를 가공해 새 물건을 만드는 일과 관련된"}],"usageExamples":[{"en":"The Industrial Revolution completely changed how people lived and worked in Europe.","ko":"산업 혁명은 유럽에서 사람들이 사는 방식과 일하는 방식을 완전히 바꾸었다."},{"en":"Many old industrial buildings have been transformed into modern art galleries.","ko":"많은 오래된 공업 건물들이 현대적인 미술관으로 탈바꿈되었다."}],"grammarNote":"industrial(형용사, 산업의)과 industrious(형용사, 근면한)를 자주 혼동합니다. 산업에 관련된 것은 industrial, 사람의 성실함을 나타낼 때는 industrious입니다. 발음도 비슷해 학생들이 자주 실수합니다.","grammarQuiz":[{"sentence":"The government plans to develop the _____ region and _____ many new jobs.","ko":"정부는 그 공업 지역을 개발하여 많은 새로운 일자리를 만들 계획이다.","answer":["industrial","create"],"hint":"형용사+동사원형"}]},
    {"id":"w03298","w":"industry","pos":["n"],"ph":"/ˈɪndəstri/","cefr":"B1","kr":["산업","공업"],"ex":[{"en":"The tech industry is growing fast.","ko":"기술 산업이 빠르게 성장하고 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"sector","ko":"부문","reason":"동의어로 경제 문맥에서 짝"},{"w":"tourism","ko":"관광","reason":"tourism industry 콜로케이션의 짝"},{"w":"manufacturing","ko":"제조","reason":"manufacturing industry 콜로케이션의 짝"}],"collocBest":[{"en":"tourism industry","ko":"관광 산업"},{"en":"manufacturing industry","ko":"제조 산업"}]},"nuance":{"koSimple":"물건이나 서비스를 만드는 큰 분야.","whenToUse":"관광·IT 등 분야 전체를 가리킬 때."},"krDetail":[{"ko":"산업","explain":"물건을 만들거나 서비스를 팔아 돈을 버는 크고 조직적인 경제 활동"},{"ko":"공업","explain":"기계와 사람의 힘을 써서 원료를 가공해 물건을 만들어 파는 일"}],"usageExamples":[{"en":"The tourism industry has grown rapidly across Southeast Asia in recent years.","ko":"관광 산업은 최근 몇 년 동안 동남아시아 전역에서 빠르게 성장했다."},{"en":"The country's automobile industry supports millions of workers and their families.","ko":"그 나라의 자동차 공업은 수백만 명의 노동자와 가족을 지원한다."}],"grammarNote":"industry는 특정 분야를 말할 때 'the ~ industry' 형태로 the가 필요합니다. 학생들은 'in tourism industry'처럼 관사를 빠뜨리기 쉬운데, 'in the tourism industry'가 맞습니다. 일반적 의미의 '산업 활동'은 관사 없이 씁니다.","grammarQuiz":[{"sentence":"The film _____ in Korea has been growing _____ over the past decade.","ko":"한국의 영화 산업은 지난 10년간 빠르게 성장해 왔다.","answer":["industry","rapidly"],"hint":"명사+부사"}]},
    {"id":"w03313","w":"inexperienced","pos":["adj"],"ph":"/ˌɪnɪkˈspɪəriənst/","cefr":"B1","kr":["경험이 없는","미숙한"],"ex":[{"en":"He was young and inexperienced.","ko":"그는 젊고 경험이 없었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"experienced","ko":"경험 많은","reason":"명확한 반의어 관계"},{"w":"novice","ko":"초보자","reason":"동의어로 신참 시나리오에서 짝"},{"w":"worker","ko":"직원","reason":"inexperienced worker 콜로케이션의 짝"}],"collocBest":[{"en":"inexperienced worker","ko":"경험 없는 직원"},{"en":"relatively inexperienced","ko":"상대적으로 미숙한"}]},"nuance":{"koSimple":"해 본 적이 적어 서툰.","whenToUse":"신입·초보자를 설명할 때."},"krDetail":[{"ko":"경험이 없는","explain":"어떤 일을 실제로 해본 적이 없어 그 일에 대해 잘 모르는 상태인"},{"ko":"미숙한","explain":"일 처리 능력이 아직 익숙하지 않아 서투르고 부족한 상태인"}],"usageExamples":[{"en":"The inexperienced driver made several mistakes during the long highway journey.","ko":"그 경험이 없는 운전자는 긴 고속도로 여행 중 몇 번의 실수를 저질렀다."},{"en":"Even inexperienced cooks can prepare this simple recipe with some practice.","ko":"미숙한 요리사라도 약간의 연습으로 이 간단한 요리법을 만들 수 있다."}],"grammarNote":"inexperienced 뒤에 in 또는 at을 붙여 '어떤 분야에서 경험이 없는'을 나타냅니다. 학생들은 with를 잘못 쓰기 쉬운데, 'inexperienced in teaching' 또는 'inexperienced at driving'이 자연스럽습니다.","grammarQuiz":[{"sentence":"Being _____ in this field, the young worker _____ many questions to seniors.","ko":"이 분야에 경험이 없어서, 그 젊은 직원은 선배들에게 많은 질문을 했다.","answer":["inexperienced","asked"],"hint":"형용사+과거동사"}]},
    {"id":"w03320","w":"infancy","pos":["n"],"ph":"/ˈɪnfənsi/","cefr":"B1","kr":["유아기","초기"],"ex":[{"en":"The technology is in its infancy.","ko":"그 기술은 초기 단계에 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"beginning","ko":"초기, 시작","reason":"'in its infancy' 관용 표현의 짝, 동의어"},{"w":"maturity","ko":"성숙기","reason":"명확한 반의어 관계"},{"w":"stage","ko":"단계","reason":"in its infancy가 초기 단계를 뜻할 때의 짝"}],"collocBest":[{"en":"early infancy","ko":"이른 유아기"},{"en":"in its infancy","ko":"초기 단계에"}]},"nuance":{"koSimple":"막 태어난 시기, 아주 초기.","whenToUse":"아기 시절·초기 단계를 말할 때."},"krDetail":[{"ko":"유아기","explain":"아기가 태어난 뒤 스스로 걷고 말하기 전까지의 아주 어린 시기"},{"ko":"초기","explain":"어떤 일이나 상태가 처음으로 시작되어 얼마 지나지 않은 때"}],"usageExamples":[{"en":"During infancy, babies rapidly develop many important physical and mental abilities.","ko":"유아기 동안, 아기들은 많은 중요한 신체적·정신적 능력을 빠르게 발달시킨다."},{"en":"Electric car technology is still in its infancy compared to gasoline vehicles.","ko":"전기차 기술은 가솔린 차량에 비해 여전히 초기 단계에 있다."}],"grammarNote":"in one's infancy는 '초기 단계'라는 관용 표현으로 자주 쓰입니다. 학생들은 'at infancy'로 잘못 쓰기 쉽지만, 'in infancy' 또는 'in its infancy'가 맞는 표현입니다.","grammarQuiz":[{"sentence":"The new online business is still in _____ _____ and needs more investment.","ko":"그 새 온라인 사업은 여전히 초기 단계에 있어 더 많은 투자가 필요하다.","answer":["its","infancy"],"hint":"소유격+명사"}]},
    {"id":"w03324","w":"infection","pos":["n"],"ph":"/ɪnˈfekʃən/","cefr":"B1","kr":["감염","전염"],"ex":[{"en":"She had a throat infection.","ko":"그녀는 목 감염이 있었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"bacterial","ko":"세균의","reason":"bacterial infection 콜로케이션의 짝"},{"w":"prevent","ko":"예방하다","reason":"prevent infection 콜로케이션의 짝"},{"w":"disease","ko":"질병","reason":"동의어로 의료 문맥에서 짝"}],"collocBest":[{"en":"bacterial infection","ko":"세균 감염"},{"en":"prevent infection","ko":"감염을 예방하다"}]},"nuance":{"koSimple":"병균이 몸에 들어와 생긴 병.","whenToUse":"목·상처의 감염 상태 설명할 때."},"krDetail":[{"ko":"감염","explain":"병을 일으키는 나쁜 미생물이 몸속에 들어가 병에 걸리게 되는 상태"},{"ko":"전염","explain":"병이나 나쁜 습관 등이 한 사람에게서 다른 사람에게 옮겨 퍼지는 일"}],"usageExamples":[{"en":"The doctor prescribed antibiotics to treat the serious bacterial infection quickly.","ko":"의사는 심각한 세균 감염을 빨리 치료하기 위해 항생제를 처방했다."},{"en":"Washing your hands often is the best way to prevent infection at home.","ko":"손을 자주 씻는 것은 집에서 감염을 예방하는 최고의 방법이다."}],"grammarNote":"infection은 셀 수 있는 명사(특정 감염)와 셀 수 없는 명사(감염이라는 개념) 두 가지로 쓰입니다. 학생들은 'ear infection(귀 감염)'처럼 관사를 붙여야 하는데 종종 빠뜨립니다. 'prevent infection'처럼 일반 개념일 때는 관사 없이 씁니다.","grammarQuiz":[{"sentence":"Frequent hand washing helps prevent the spread of _____ in _____ hospital.","ko":"잦은 손 씻기는 병원에서 감염의 확산을 예방하는 데 도움이 된다.","answer":["infection","a"],"hint":"명사+관사"}]},
    {"id":"w03325","w":"infectious","pos":["adj"],"ph":"/ɪnˈfekʃəs/","cefr":"B1","kr":["전염성의","감염성의"],"ex":[{"en":"Laughter can be infectious.","ko":"웃음은 전염될 수 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"contagious","ko":"전염성의","reason":"동의어로 의료 문맥의 짝"},{"w":"disease","ko":"질병","reason":"infectious disease 콜로케이션의 짝"},{"w":"smile","ko":"미소","reason":"'infectious smile'(전염성 있는 미소) 비유적 짝"}],"collocBest":[{"en":"infectious disease","ko":"전염병"},{"en":"highly infectious","ko":"매우 전염성이 강한"}]},"nuance":{"koSimple":"쉽게 남에게 옮는.","whenToUse":"전염병·웃음처럼 퍼지는 것에."},"krDetail":[{"ko":"전염성의","explain":"병이나 감정이 한 사람에게서 다른 사람에게 쉽게 옮겨가는 성질을 가진"},{"ko":"감염성의","explain":"미생물이나 바이러스가 다른 몸으로 옮겨가 병을 일으키는 성질을 가진"}],"usageExamples":[{"en":"The infectious disease spread quickly through the whole village last summer.","ko":"그 전염병은 지난 여름 마을 전체에 빠르게 퍼졌다."},{"en":"Her infectious laughter made everyone at the party feel happy and relaxed.","ko":"그녀의 전염성 있는 웃음소리는 파티에 모인 모두를 행복하고 편안하게 만들었다."}],"grammarNote":"infectious와 contagious는 뜻이 비슷하지만 미묘한 차이가 있습니다. infectious는 병균·바이러스로 옮는 병, contagious는 직접 접촉으로 옮는 병에 주로 씁니다. 학생들은 구별 없이 쓰지만 학술적으로는 다릅니다.","grammarQuiz":[{"sentence":"The child was diagnosed with a highly _____ disease and _____ to stay home.","ko":"그 아이는 매우 전염성이 강한 병으로 진단받아 집에 머물러야 했다.","answer":["infectious","had"],"hint":"형용사+조동사과거"}]},
    {"id":"w03417","w":"inspiration","pos":["n"],"ph":"/ˌɪnspəˈreɪʃən/","cefr":"B1","kr":["영감","고무"],"ex":[{"en":"Nature gave her great inspiration.","ko":"자연이 그녀에게 큰 영감을 주었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"motivation","ko":"동기","reason":"동의어 - 마음을 움직이는 힘"},{"w":"creativity","ko":"창의성","reason":"시나리오 - 영감이 창의성을 이끌어냄"},{"w":"muse","ko":"뮤즈","reason":"시나리오 - 예술가에게 영감을 주는 존재"}],"collocBest":[{"en":"source of inspiration","ko":"영감의 원천"},{"en":"draw inspiration from","ko":"~에서 영감을 얻다"}]},"nuance":{"koSimple":"창작·아이디어를 확 밀어주는 감동.","whenToUse":"자연·예술이 창의력을 자극할 때."},"krDetail":[{"ko":"머릿속에 반짝 떠오르는 느낌","explain":"'영감(靈感)'은 갑자기 좋은 생각이나 창의적인 아이디어가 마음속에 떠오르는 것을 말해요."},{"ko":"북돋움, 기운을 불어넣음","explain":"'고무(鼓舞)'는 누군가의 마음을 크게 흔들어 힘을 내게 하는 것을 뜻해요."}],"usageExamples":[{"en":"The artist drew inspiration from the ocean.","ko":"그 예술가는 바다에서 영감을 얻었다."},{"en":"Her speech was a great source of inspiration.","ko":"그녀의 연설은 위대한 영감의 원천이었다."}],"grammarNote":"'inspiration'은 불가산 명사로 쓰일 때가 많아 'an inspiration'이나 'inspirations'처럼 쓸 때 주의해야 해요. 특정 사람이나 사물이 영감의 원천일 때는 'an inspiration to me'처럼 관사와 함께 씁니다.","grammarQuiz":[{"sentence":"She _____ a great _____ to young writers around the world.","ko":"그녀는 전 세계 젊은 작가들에게 큰 영감이 된다.","answer":["is","inspiration"],"hint":"3인칭 단수 be동사 + 관사와 함께 쓰는 명사"}]},
    {"id":"w03419","w":"inspire","pos":["v"],"ph":"/ɪnˈspaɪər/","cefr":"B1","kr":["영감을 주다","고무시키다"],"ex":[{"en":"Her speech inspired many students.","ko":"그녀의 연설은 많은 학생들에게 영감을 주었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"motivate","ko":"동기부여하다","reason":"동의어 - 영감을 주어 움직이게 하다"},{"w":"discourage","ko":"낙담시키다","reason":"반의어 - 영감을 주는 것의 반대"},{"w":"leader","ko":"지도자","reason":"시나리오 - 지도자가 사람들에게 영감을 줌"}],"collocBest":[{"en":"inspire confidence","ko":"자신감을 불어넣다"},{"en":"inspire others to","ko":"다른 사람들이 ~하도록 영감을 주다"}]},"nuance":{"koSimple":"마음에 불을 붙여 움직이게 하다.","whenToUse":"누군가에게 창의력·용기를 불어넣을 때."},"krDetail":[{"ko":"마음에 뜨거운 불을 지피다","explain":"'영감을 주다'는 다른 사람이 무언가를 하고 싶게 만들도록 마음을 움직이는 것을 뜻해요."},{"ko":"기운을 북돋우다","explain":"'고무(鼓舞)시키다'는 힘내라고 마음을 부추기는 것을 말해요."}],"usageExamples":[{"en":"The teacher inspired her students to read more books.","ko":"그 선생님은 학생들이 더 많은 책을 읽도록 영감을 주었다."},{"en":"His story was inspired by real events.","ko":"그의 이야기는 실제 사건에서 영감을 받았다."}],"grammarNote":"'inspire A to do'는 'A가 ~하도록 영감을 주다'라는 뜻이에요. 학생들이 'inspire A doing'으로 잘못 쓰는 경우가 많은데, 반드시 'to부정사'를 써야 합니다.","grammarQuiz":[{"sentence":"The coach _____ his players _____ never give up during the match.","ko":"코치는 선수들이 경기 중에 절대 포기하지 않도록 영감을 주었다.","answer":["inspired","to"],"hint":"과거시제 동사 + to부정사"}]},
    {"id":"w03421","w":"installation","pos":["n"],"ph":"/ˌɪnstəˈleɪʃən/","cefr":"B1","kr":["설치","설비"],"ex":[{"en":"The installation took two hours.","ko":"설치에 두 시간이 걸렸다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"setup","ko":"설치","reason":"동의어 - 설비 설치"},{"w":"removal","ko":"제거","reason":"반의어 - 설치의 반대 개념"},{"w":"equipment","ko":"장비","reason":"시나리오 - 장비 설치"}],"collocBest":[{"en":"software installation","ko":"소프트웨어 설치"},{"en":"art installation","ko":"미술 설치 작품"}]},"nuance":{"koSimple":"물건·프로그램을 자리에 놓는 일.","whenToUse":"설치 작업·설치 과정을 말할 때."},"krDetail":[{"ko":"갖춰 놓는 일","explain":"'설치(設置)'는 어떤 물건이나 기계를 자리 잡게 하는 행위를 말해요."},{"ko":"갖춤 장치","explain":"'설비(設備)'는 어떤 일에 필요한 기계나 도구를 모아 갖춘 것을 뜻해요."}],"usageExamples":[{"en":"The installation of the new software took two hours.","ko":"새 소프트웨어의 설치는 두 시간이 걸렸다."},{"en":"The art installation attracted many visitors.","ko":"그 미술 설치 작품은 많은 방문객을 끌어들였다."}],"grammarNote":"'installation'은 '~의 설치'라고 할 때 'installation of + 명사' 구조를 씁니다. 학생들이 'installation for'로 잘못 쓰는 경우가 있으니 전치사 'of'에 주의하세요.","grammarQuiz":[{"sentence":"The _____ _____ the air conditioner will begin tomorrow morning.","ko":"에어컨의 설치는 내일 아침에 시작될 것이다.","answer":["installation","of"],"hint":"명사 + 소유·소속 전치사"}]},
    {"id":"w03422","w":"instance","pos":["n"],"ph":"/ˈɪnstəns/","cefr":"B1","kr":["경우","사례"],"ex":[{"en":"In this instance, he was right.","ko":"이 경우에 그는 옳았다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"example","ko":"예시","reason":"동의어 - 사례를 드는 것"},{"w":"case","ko":"경우","reason":"동의어 - 특정 상황을 지칭"},{"w":"situation","ko":"상황","reason":"시나리오 - 어떤 경우/상황에서"}],"collocBest":[{"en":"for instance","ko":"예를 들어"},{"en":"in this instance","ko":"이 경우에"}]},"nuance":{"koSimple":"딱 그 하나의 경우·사례.","whenToUse":"예시나 특정 상황을 들 때(for instance)."},"krDetail":[{"ko":"어떤 일이 있었던 때","explain":"'경우(境遇)'는 어떤 일이 실제로 일어난 상황을 뜻해요."},{"ko":"실제로 있었던 일","explain":"'사례(事例)'는 예로 들 만한 실제 있었던 일을 말해요."}],"usageExamples":[{"en":"There are many instances of kindness in this book.","ko":"이 책에는 친절함의 사례가 많이 있다."},{"en":"For instance, some birds can fly very high.","ko":"예를 들어, 어떤 새들은 매우 높이 날 수 있다."}],"grammarNote":"'for instance'는 'for example'과 같은 뜻이에요. 학생들이 'for instances'처럼 복수형으로 쓰는 실수를 자주 하는데, 관용구이므로 반드시 단수형 'instance'만 씁니다.","grammarQuiz":[{"sentence":"Many animals hibernate in winter; _____ _____, bears sleep for months.","ko":"많은 동물들이 겨울에 겨울잠을 잔다; 예를 들어, 곰은 몇 달 동안 잔다.","answer":["for","instance"],"hint":"관용 표현 전치사 + 단수 명사"}]},
    {"id":"w03433","w":"instruct","pos":["v"],"ph":"/ɪnˈstrʌkt/","cefr":"B1","kr":["지시하다","가르치다"],"ex":[{"en":"The teacher instructed the class.","ko":"교사가 학급을 지시했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"teach","ko":"가르치다","reason":"동의어 - 지식을 전달하다"},{"w":"direct","ko":"지시하다","reason":"동의어 - ~하도록 지시하다"},{"w":"student","ko":"학생","reason":"시나리오 - 학생을 가르치다"}],"collocBest":[{"en":"instruct students","ko":"학생들을 지도하다"},{"en":"instruct someone to","ko":"~에게 ...하도록 지시하다"}]},"nuance":{"koSimple":"할 일을 알려주다·가르치다.","whenToUse":"지시·지도·설명을 줄 때."},"krDetail":[{"ko":"무엇을 하라고 시키다","explain":"'지시(指示)하다'는 누군가에게 무엇을 하도록 명령하거나 알려주는 것을 뜻해요."},{"ko":"배워서 알게 하다","explain":"'가르치다'는 지식이나 기술을 다른 사람에게 알려주는 것을 말해요."}],"usageExamples":[{"en":"The manager instructed the staff to arrive early.","ko":"매니저는 직원들에게 일찍 도착하라고 지시했다."},{"en":"She instructs students in mathematics at the academy.","ko":"그녀는 학원에서 학생들에게 수학을 가르친다."}],"grammarNote":"'instruct A to do'는 'A에게 ~하라고 지시하다'라는 뜻이에요. 학생들이 'instruct A that절'로 잘못 쓰는 경우가 있는데, 지시 의미로는 'to부정사'가 자연스럽습니다.","grammarQuiz":[{"sentence":"The doctor _____ the patient _____ take the medicine twice a day.","ko":"의사는 환자에게 하루에 두 번 약을 먹으라고 지시했다.","answer":["instructed","to"],"hint":"과거시제 동사 + to부정사"}]},
    {"id":"w03434","w":"instruction","pos":["n"],"ph":"/ɪnˈstrʌkʃən/","cefr":"B1","kr":["지시","설명"],"ex":[{"en":"Follow the instructions carefully.","ko":"지시 사항을 주의 깊게 따르라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"direction","ko":"지시","reason":"동의어 - 방향/지시"},{"w":"manual","ko":"설명서","reason":"시나리오 - 사용 설명서에 지시사항이 있음"},{"w":"follow","ko":"따르다","reason":"콜로 - follow instructions"}],"collocBest":[{"en":"follow instructions","ko":"지시를 따르다"},{"en":"clear instruction","ko":"명확한 지시"}]},"nuance":{"koSimple":"따라 해야 할 지시·설명.","whenToUse":"사용법·명령을 전달할 때."},"krDetail":[{"ko":"이렇게 하라는 말","explain":"'지시(指示)'는 무엇을 어떻게 하라고 알려주는 명령이나 안내를 뜻해요."},{"ko":"풀어서 알려줌","explain":"'설명(說明)'은 어떤 내용을 이해할 수 있도록 자세히 밝혀 말하는 것을 말해요."}],"usageExamples":[{"en":"Please follow the instructions on the box carefully.","ko":"상자에 있는 지시사항을 주의 깊게 따라 주세요."},{"en":"The teacher gave clear instructions to the class.","ko":"선생님은 학급에 명확한 지시를 내렸다."}],"grammarNote":"'instructions'는 보통 복수형으로 사용될 때 '사용 설명서, 지시사항'의 의미가 강해요. 단수 'instruction'은 '가르침, 교육' 자체를 뜻할 때 사용되므로 문맥에 따라 구분해야 합니다.","grammarQuiz":[{"sentence":"Students must _____ the _____ before starting the exam.","ko":"학생들은 시험을 시작하기 전에 지시사항을 따라야 한다.","answer":["follow","instructions"],"hint":"따르다 동사 + 복수 명사"}]},
    {"id":"w03435","w":"instructor","pos":["n"],"ph":"/ɪnˈstrʌktər/","cefr":"B1","kr":["강사","교관"],"ex":[{"en":"The instructor was very helpful.","ko":"강사는 매우 도움이 되었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"teacher","ko":"교사","reason":"동의어 - 가르치는 사람"},{"w":"trainer","ko":"훈련자","reason":"동의어 - 훈련시키는 사람"},{"w":"fitness","ko":"피트니스","reason":"시나리오 - 피트니스 강사"}],"collocBest":[{"en":"fitness instructor","ko":"피트니스 강사"},{"en":"driving instructor","ko":"운전 강사"}]},"nuance":{"koSimple":"기술·운동을 가르치는 사람.","whenToUse":"강습·실기 지도 선생님을 말할 때."},"krDetail":[{"ko":"가르치는 사람","explain":"'강사(講師)'는 학원이나 학교에서 특정 과목이나 기술을 가르치는 사람을 뜻해요."},{"ko":"훈련을 이끄는 사람","explain":"'교관(敎官)'은 주로 군대나 훈련소에서 기술이나 규칙을 가르치는 사람을 말해요."}],"usageExamples":[{"en":"The yoga instructor showed us how to breathe properly.","ko":"요가 강사는 우리에게 올바르게 호흡하는 방법을 보여주었다."},{"en":"He hired a private driving instructor last week.","ko":"그는 지난주에 개인 운전 강사를 고용했다."}],"grammarNote":"'instructor'는 '~ instructor' 형태로 앞에 명사가 와서 '무엇을 가르치는 강사'인지 나타내요. 학생들이 'instructor of ~'로 잘못 쓰는 경우가 있는데, 명사가 형용사처럼 바로 앞에 오는 표현이 더 자연스럽습니다.","grammarQuiz":[{"sentence":"My sister works as _____ fitness _____ at the local gym.","ko":"우리 언니는 동네 체육관에서 피트니스 강사로 일한다.","answer":["a","instructor"],"hint":"부정관사 + 강사 명사"}]},
    {"id":"w03436","w":"instrument","pos":["n"],"ph":"/ˈɪnstrʊmənt/","cefr":"B1","kr":["악기","도구"],"ex":[{"en":"She plays a musical instrument.","ko":"그녀는 악기를 연주한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"tool","ko":"도구","reason":"동의어 - 목적을 이루는 수단"},{"w":"device","ko":"장치","reason":"동의어 - 기구/장치"},{"w":"musician","ko":"음악가","reason":"시나리오 - 음악가가 악기를 연주함"}],"collocBest":[{"en":"musical instrument","ko":"악기"},{"en":"scientific instrument","ko":"과학 기구"}]},"nuance":{"koSimple":"연주하는 악기, 쓰는 도구.","whenToUse":"악기·정밀 기구를 가리킬 때."},"krDetail":[{"ko":"소리를 내는 물건","explain":"'악기(樂器)'는 음악을 연주할 때 소리를 내기 위해 사용하는 도구를 뜻해요."},{"ko":"쓰임새 있는 물건","explain":"'도구(道具)'는 어떤 일을 하는 데 쓰이는 물건이나 장치를 말해요."}],"usageExamples":[{"en":"She plays a musical instrument in the school band.","ko":"그녀는 학교 밴드에서 악기를 연주한다."},{"en":"Scientists use precise instruments to measure temperature.","ko":"과학자들은 온도를 측정하기 위해 정밀한 도구를 사용한다."}],"grammarNote":"'instrument'는 문맥에 따라 '악기' 또는 '도구'로 해석돼요. 'play an instrument'는 '악기를 연주하다'의 관용 표현이며, 반드시 부정관사 'an'을 씁니다.","grammarQuiz":[{"sentence":"He learned _____ play a musical _____ when he was young.","ko":"그는 어렸을 때 악기를 연주하는 법을 배웠다.","answer":["to","instrument"],"hint":"to부정사 + 악기 명사"}]},
    {"id":"w03440","w":"insurance","pos":["n"],"ph":"/ɪnˈʃʊərəns/","cefr":"B1","kr":["보험"],"ex":[{"en":"Health insurance is very important.","ko":"건강 보험은 매우 중요하다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"coverage","ko":"보장","reason":"동의어 - 보험 보장 범위"},{"w":"policy","ko":"보험 증권","reason":"시나리오 - 보험 증권에 가입"},{"w":"premium","ko":"보험료","reason":"시나리오 - 보험료 납부"}],"collocBest":[{"en":"health insurance","ko":"건강 보험"},{"en":"car insurance","ko":"자동차 보험"}]},"nuance":{"koSimple":"사고·아플 때 돈으로 보호.","whenToUse":"보험 가입·보장 얘기할 때."},"krDetail":[{"ko":"돈을 미리 내고 지키는 약속","explain":"'보험(保險)'은 사고나 병에 대비해 돈을 모아 두었다가 필요할 때 받는 제도를 뜻해요."}],"usageExamples":[{"en":"She bought health insurance for her family last month.","ko":"그녀는 지난달에 가족을 위해 건강 보험을 샀다."},{"en":"Car insurance is required by law in most countries.","ko":"자동차 보험은 대부분의 나라에서 법으로 요구된다."}],"grammarNote":"'insurance'는 불가산 명사로 항상 단수 형태로 쓰여요. 학생들이 'insurances'처럼 복수형으로 쓰는 실수를 자주 하는데, 종류가 다양할 때는 'types of insurance'라고 표현합니다.","grammarQuiz":[{"sentence":"You should _____ health _____ before traveling abroad.","ko":"해외 여행 전에 건강 보험을 사야 한다.","answer":["buy","insurance"],"hint":"구매 동사 + 불가산 명사"}]},
    {"id":"w03451","w":"intelligence","pos":["n"],"ph":"/ɪnˈtelɪdʒəns/","cefr":"B1","kr":["지능","정보"],"ex":[{"en":"Emotional intelligence is important.","ko":"감성 지능은 중요하다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"intellect","ko":"지성","reason":"동의어 - 지능/지성"},{"w":"stupidity","ko":"어리석음","reason":"반의어 - 지능의 반대"},{"w":"artificial","ko":"인공의","reason":"콜로 - artificial intelligence(AI)"}],"collocBest":[{"en":"artificial intelligence","ko":"인공 지능"},{"en":"emotional intelligence","ko":"감성 지능"}]},"nuance":{"koSimple":"머리 좋은 능력·정보.","whenToUse":"지능·인공지능·정보 기관 말할 때."},"krDetail":[{"ko":"생각하고 배우는 힘","explain":"'지능(知能)'은 무언가를 이해하고 배우며 문제를 풀 수 있는 정신적인 힘을 뜻해요."},{"ko":"알아낸 소식","explain":"'정보(情報)'는 어떤 일에 대해 알아낸 지식이나 소식을 말해요."}],"usageExamples":[{"en":"Artificial intelligence is changing our daily lives.","ko":"인공 지능은 우리의 일상생활을 바꾸고 있다."},{"en":"Emotional intelligence is as important as IQ.","ko":"감성 지능은 IQ만큼이나 중요하다."}],"grammarNote":"'intelligence'는 불가산 명사로 관사 없이 사용해요. 'an intelligence'처럼 부정관사와 함께 쓰지 않도록 주의하고, 'have high intelligence'와 같이 형용사와 결합합니다.","grammarQuiz":[{"sentence":"Dolphins are known _____ their high level _____ intelligence.","ko":"돌고래는 높은 수준의 지능으로 알려져 있다.","answer":["for","of"],"hint":"이유 전치사 + 소유 전치사"}]},
    {"id":"w03452","w":"intelligent","pos":["adj"],"ph":"/ɪnˈtelɪdʒənt/","cefr":"B1","kr":["지적인","똑똑한"],"ex":[{"en":"She is an intelligent student.","ko":"그녀는 똑똑한 학생이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"smart","ko":"똑똑한","reason":"동의어 - 머리가 좋은"},{"w":"stupid","ko":"어리석은","reason":"반의어 - 지적인의 반대"},{"w":"clever","ko":"영리한","reason":"동의어 - 재치 있는"}],"collocBest":[{"en":"highly intelligent","ko":"매우 지적인"},{"en":"intelligent design","ko":"지적 설계"}]},"nuance":{"koSimple":"머리가 좋은.","whenToUse":"똑똑한 사람·AI 시스템 얘기할 때."},"krDetail":[{"ko":"머리가 잘 돌아가는","explain":"'지적(知的)인'은 생각이 깊고 지식이 많은 사람을 표현할 때 쓰여요."},{"ko":"머리가 좋은","explain":"'똑똑한'은 배우거나 이해하는 능력이 뛰어난 것을 뜻해요."}],"usageExamples":[{"en":"She is an intelligent student who solves problems quickly.","ko":"그녀는 문제를 빨리 푸는 지적인 학생이다."},{"en":"The intelligent robot can respond to human voice.","ko":"그 지능적인 로봇은 사람의 목소리에 반응할 수 있다."}],"grammarNote":"'intelligent'는 사람이나 사물의 지적 능력을 나타내는 형용사예요. 'clever'와 비슷하지만 'intelligent'는 더 깊이 있는 사고력을 강조하는 뉘앙스가 있습니다.","grammarQuiz":[{"sentence":"Elephants are considered _____ _____ intelligent animals in the world.","ko":"코끼리는 세계에서 가장 지능적인 동물 중 하나로 여겨진다.","answer":["among","the"],"hint":"그 중에 속하는 전치사 + 최상급 정관사"}]},
    {"id":"w03459","w":"intention","pos":["n"],"ph":"/ɪnˈtenʃən/","cefr":"B1","kr":["의도","목적"],"ex":[{"en":"His intention was to help.","ko":"그의 의도는 돕는 것이었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"purpose","ko":"목적","reason":"동의어 - 의도/목적"},{"w":"aim","ko":"목표","reason":"동의어 - 겨냥한 목표"},{"w":"intend","ko":"의도하다","reason":"시나리오 - 명사와 동사 관계"}],"collocBest":[{"en":"good intention","ko":"좋은 의도"},{"en":"with the intention of","ko":"~할 의도로"}]},"nuance":{"koSimple":"마음속 목적·작정.","whenToUse":"의도적 행동·본심을 말할 때."},"krDetail":[{"ko":"속에 품은 생각","explain":"'의도(意圖)'는 어떤 일을 하려는 마음속의 계획이나 목적을 뜻해요."},{"ko":"이루려는 것","explain":"'목적(目的)'은 이루기 위해 정해 놓은 목표를 말해요."}],"usageExamples":[{"en":"His intention was to help, not to hurt anyone.","ko":"그의 의도는 도우려는 것이었지, 누구를 해치려는 것이 아니었다."},{"en":"She had no intention of leaving her job.","ko":"그녀는 직장을 그만둘 의도가 전혀 없었다."}],"grammarNote":"'have the/no intention of doing'은 '~할 의도가 있다/없다'라는 관용 표현으로 반드시 'of + 동명사'를 씁니다. 학생들이 'to부정사'를 붙이는 실수를 자주 하니 주의하세요.","grammarQuiz":[{"sentence":"He has no _____ _____ giving up his dream so easily.","ko":"그는 자신의 꿈을 그렇게 쉽게 포기할 의도가 없다.","answer":["intention","of"],"hint":"의도 명사 + 동명사용 전치사"}]},
    {"id":"w03461","w":"interact","pos":["v"],"ph":"/ˌɪntərˈækt/","cefr":"B1","kr":["상호작용하다","교류하다"],"ex":[{"en":"Students interact well with teachers.","ko":"학생들은 교사들과 잘 교류한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"communicate","ko":"소통하다","reason":"동의어 - 서로 교류하다"},{"w":"engage","ko":"관여하다","reason":"동의어 - 참여하며 교류함"},{"w":"isolate","ko":"고립시키다","reason":"반의어 - 교류의 반대"}],"collocBest":[{"en":"interact with others","ko":"다른 사람들과 교류하다"},{"en":"interact online","ko":"온라인으로 상호작용하다"}]},"nuance":{"koSimple":"서로 주고받으며 관계 맺다.","whenToUse":"사람·화면과 소통·교류할 때."},"krDetail":[{"ko":"서로 주고받다","explain":"'상호작용(相互作用)하다'는 둘 이상이 서로 영향을 주고받는 것을 뜻해요."},{"ko":"서로 오가다","explain":"'교류(交流)하다'는 서로 만나서 이야기하거나 도움을 주고받는 것을 말해요."}],"usageExamples":[{"en":"Children learn how to interact with others at school.","ko":"아이들은 학교에서 다른 사람들과 상호작용하는 법을 배운다."},{"en":"Cats interact with humans in unique ways.","ko":"고양이는 사람과 독특한 방식으로 교류한다."}],"grammarNote":"'interact'는 자동사이므로 목적어가 바로 오지 않아요. 반드시 'interact with + 사람/사물' 형태로 전치사 'with'를 함께 씁니다.","grammarQuiz":[{"sentence":"Students should learn _____ _____ with people from different cultures.","ko":"학생들은 다른 문화의 사람들과 상호작용하는 법을 배워야 한다.","answer":["to","interact"],"hint":"to부정사 + 자동사"}]},
    {"id":"w03462","w":"interaction","pos":["n"],"ph":"/ˌɪntərˈækʃən/","cefr":"B1","kr":["상호작용","교류"],"ex":[{"en":"Human interaction is vital for growth.","ko":"인간의 교류는 성장에 필수적이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"communication","ko":"소통","reason":"동의어 - 상호 소통"},{"w":"isolation","ko":"고립","reason":"반의어 - 상호작용의 반대"},{"w":"social","ko":"사회적인","reason":"콜로 - social interaction"}],"collocBest":[{"en":"social interaction","ko":"사회적 교류"},{"en":"positive interaction","ko":"긍정적인 상호작용"}]},"nuance":{"koSimple":"서로 주고받는 관계.","whenToUse":"사회적 소통·화면 반응 얘기할 때."},"krDetail":[{"ko":"서로 주고받는 일","explain":"'상호작용(相互作用)'은 둘 이상이 서로 영향을 주고받는 일을 뜻해요."},{"ko":"서로 오감","explain":"'교류(交流)'는 서로 만나서 소통하거나 문화·물건 등을 주고받는 것을 말해요."}],"usageExamples":[{"en":"Social interaction is important for young children.","ko":"사회적 상호작용은 어린이들에게 중요하다."},{"en":"The interaction between teacher and student matters a lot.","ko":"선생님과 학생 사이의 상호작용은 매우 중요하다."}],"grammarNote":"'interaction between A and B'는 'A와 B 사이의 상호작용'이라는 표현이에요. 학생들이 'interaction of A and B'로 잘못 쓰는 경우가 있는데, 반드시 'between'을 씁니다.","grammarQuiz":[{"sentence":"There is little _____ _____ humans and wild animals in the city.","ko":"도시에서는 인간과 야생 동물 사이의 상호작용이 거의 없다.","answer":["interaction","between"],"hint":"상호작용 명사 + 사이 전치사"}]},
    {"id":"w03474","w":"interestingly","pos":["adv"],"ph":"/ˈɪntrəstɪŋli/","cefr":"B1","kr":["흥미롭게도","재미있게도"],"ex":[{"en":"Interestingly, the results were the same.","ko":"흥미롭게도 결과는 동일했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"remarkably","ko":"놀랍게도","reason":"동의어 - 흥미로울 만큼 주목할 만하게"},{"w":"curiously","ko":"신기하게도","reason":"동의어 - 호기심을 자아내게"},{"w":"surprisingly","ko":"놀랍게도","reason":"시나리오 - 놀라움을 표현하는 부사"}],"collocBest":[{"en":"interestingly enough","ko":"흥미롭게도"},{"en":"most interestingly","ko":"가장 흥미롭게도"}]},"nuance":{"koSimple":"어라, 신기하게도.","whenToUse":"뜻밖의 결과·사실을 소개할 때."},"krDetail":[{"ko":"재미있고 신기하게도","explain":"'흥미(興味)롭게도'는 뜻밖에 재미있거나 관심을 끄는 사실을 소개할 때 쓰는 표현이에요."},{"ko":"재미있게도","explain":"예상하지 못한 재미있는 사실을 강조할 때 문장 앞이나 뒤에 붙이는 부사예요."}],"usageExamples":[{"en":"Interestingly, she solved the problem in five minutes.","ko":"흥미롭게도, 그녀는 5분 만에 문제를 풀었다."},{"en":"The results, interestingly, showed the opposite trend.","ko":"그 결과는 흥미롭게도 반대의 경향을 보여주었다."}],"grammarNote":"'interestingly'는 문장 전체를 수식하는 문장부사예요. 학생들이 문장 중간에 아무 곳에나 쓰는 경우가 있는데, 문장 맨 앞에 콤마와 함께 쓰는 것이 가장 자연스럽습니다.","grammarQuiz":[{"sentence":"_____ enough, the twins _____ completely different personalities.","ko":"흥미롭게도, 그 쌍둥이는 완전히 다른 성격을 가지고 있다.","answer":["Interestingly","have"],"hint":"문장부사(대문자) + 소유 동사"}]},
    {"id":"w03615","w":"jealous","pos":["adj"],"ph":"/ˈdʒeləs/","cefr":"B1","kr":["질투하는","부러워하는"],"ex":[{"en":"She felt jealous of his success.","ko":"그녀는 그의 성공을 질투했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"envious","ko":"부러워하는","reason":"동의어"},{"w":"content","ko":"만족한","reason":"반의어"},{"w":"possessive","ko":"소유욕이 강한","reason":"질투하는 사람이 흔히 보이는 태도"}],"collocBest":[{"en":"feel jealous","ko":"질투를 느끼다"},{"en":"jealous of","ko":"~을 질투하는"}]},"nuance":{"koSimple":"남이 가진 걸 보고 배 아파하는.","whenToUse":"연인·성공·물건을 부러워하며 질투할 때."},"krDetail":[{"ko":"질투하는","explain":"남이 가진 것을 부러워하며 샘내는"},{"ko":"부러워하는","explain":"남의 좋은 점을 갖고 싶어 하는"}],"usageExamples":[{"en":"She felt jealous of her sister's success.","ko":"그녀는 언니의 성공을 질투했다."},{"en":"Don't be jealous; be inspired instead.","ko":"질투하지 말고 오히려 자극을 받아라."}],"grammarNote":"jealous는 형용사이므로 be동사와 함께 쓰이고, '~을 질투하다'는 be jealous of + 명사 형태로 표현한다. 학생들이 자주 jealous를 동사처럼 'I jealous him'으로 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"Many classmates _____ _____ of Mia because she always won every prize.","ko":"많은 반 친구들은 미아가 늘 상을 타서 그녀를 질투했다.","answer":["were","jealous"],"hint":"be동사 과거형 + jealous"},{"sentence":"You should not _____ jealous _____ your friend's new phone at all.","ko":"너는 친구의 새 휴대폰을 절대 질투해서는 안 된다.","answer":["be","of"],"hint":"be jealous of 구조"}]},
    {"id":"w03616","w":"jealousy","pos":["n"],"ph":"/ˈdʒeləsi/","cefr":"B1","kr":["질투","시기","부러움"],"ex":[{"en":"His promotion at work sparked jealousy among some of his colleagues.","ko":"그의 직장 내 승진이 몇몇 동료들 사이에서 질투를 불러일으켰다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"envy","ko":"부러움","reason":"동의어"},{"w":"admiration","ko":"감탄","reason":"반의어"},{"w":"rivalry","ko":"경쟁 관계","reason":"질투가 자주 동반되는 관계"}],"collocBest":[{"en":"overcome jealousy","ko":"질투를 극복하다"},{"en":"burn with jealousy","ko":"질투로 불타다"}]},"nuance":{"koSimple":"질투로 뒤엉킨 마음.","whenToUse":"연인·형제·동료 사이의 시기심을 말할 때."},"krDetail":[{"ko":"질투","explain":"남을 부러워하며 미워하는 마음"},{"ko":"시기","explain":"남이 잘되는 것을 싫어하는 마음"},{"ko":"부러움","explain":"남의 것을 갖고 싶어 하는 마음"}],"usageExamples":[{"en":"Jealousy destroyed their long friendship.","ko":"질투가 그들의 오랜 우정을 망쳤다."},{"en":"Her jealousy grew stronger every day.","ko":"그녀의 질투는 매일 강해졌다."}],"grammarNote":"jealousy는 셀 수 없는 명사로 관사 a/an을 붙이지 않으며 복수형도 잘 쓰지 않는다. 학생들이 'a jealousy' 또는 'jealousies'로 잘못 쓰기 쉽다.","grammarQuiz":[{"sentence":"He could not hide _____ jealousy _____ he felt for his rival.","ko":"그는 라이벌에 대해 느낀 질투를 숨길 수 없었다.","answer":["the","that"],"hint":"정관사 + 관계대명사 목적격"},{"sentence":"Jealousy often _____ people to say things _____ they later regret.","ko":"질투는 종종 사람들이 나중에 후회할 말을 하게 만든다.","answer":["causes","that"],"hint":"cause + 목적어 + to부정사, 관계대명사"}]},
    {"id":"w03635","w":"journal","pos":["n"],"ph":"/ˈdʒɜːrnəl/","cefr":"B1","kr":["일기","학술지"],"ex":[{"en":"She keeps a daily journal.","ko":"그녀는 매일 일기를 쓴다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"diary","ko":"일기","reason":"동의어"},{"w":"magazine","ko":"잡지","reason":"학술지 의미의 유의어"},{"w":"publish","ko":"출판하다","reason":"학술지와 자주 어울리는 동사"}],"collocBest":[{"en":"keep a journal","ko":"일기를 쓰다"},{"en":"academic journal","ko":"학술지"}]},"nuance":{"koSimple":"매일 쓰는 일기, 전문가들의 학술지.","whenToUse":"개인 기록장이나 전문 학술 잡지에."},"krDetail":[{"ko":"일기","explain":"매일의 일을 적는 개인 기록"},{"ko":"학술지","explain":"학문 연구 결과를 싣는 잡지"}],"usageExamples":[{"en":"She keeps a journal every night.","ko":"그녀는 매일 밤 일기를 쓴다."},{"en":"The article appeared in a science journal.","ko":"그 논문은 과학 학술지에 실렸다."}],"grammarNote":"journal은 diary(사적 일기)와 academic journal(학술지) 두 뜻이 다르므로 문맥으로 구별한다. 학생들이 무조건 '일기'로만 해석하는 실수를 한다.","grammarQuiz":[{"sentence":"The professor published _____ paper in _____ international journal last month.","ko":"그 교수는 지난달 국제 학술지에 논문을 발표했다.","answer":["a","an"],"hint":"부정관사 두 개, 모음 앞은 an"},{"sentence":"Keeping _____ journal _____ helps students improve their writing skills.","ko":"일기를 쓰는 것은 학생들이 글쓰기 실력을 키우는 데 도움이 된다.","answer":["a","daily"],"hint":"관사 + 형용사"}]},
    {"id":"w03637","w":"journalist","pos":["n"],"ph":"/ˈdʒɜːrnəlɪst/","cefr":"B1","kr":["기자","언론인"],"ex":[{"en":"The journalist wrote about climate change.","ko":"기자는 기후 변화에 대해 썼다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"reporter","ko":"기자","reason":"동의어"},{"w":"interview","ko":"인터뷰","reason":"기자의 대표 업무"},{"w":"press","ko":"언론","reason":"기자가 속한 분야"}],"collocBest":[{"en":"investigative journalist","ko":"탐사 기자"},{"en":"freelance journalist","ko":"프리랜서 기자"}]},"nuance":{"koSimple":"뉴스 기사를 쓰는 사람.","whenToUse":"신문·방송에서 취재하고 기사 쓰는 사람에."},"krDetail":[{"ko":"기자","explain":"뉴스를 취재하고 기사를 쓰는 사람"},{"ko":"언론인","explain":"언론 활동으로 소식을 전하는 사람"}],"usageExamples":[{"en":"The journalist interviewed the mayor.","ko":"그 기자는 시장을 인터뷰했다."},{"en":"She wants to become a journalist.","ko":"그녀는 기자가 되고 싶어한다."}],"grammarNote":"journalist는 사람 명사로 관사 a/an이 필요하며 직업을 말할 때는 be a journalist로 쓴다. 학생들이 'I want be journalist'처럼 관사를 빠뜨리는 실수를 한다.","grammarQuiz":[{"sentence":"The journalist _____ wrote the article _____ won a big prize.","ko":"그 기사를 쓴 기자는 큰 상을 받았다.","answer":["who","has"],"hint":"관계대명사 주격 + 현재완료"},{"sentence":"Being _____ journalist _____ dangerous in some countries today.","ko":"오늘날 몇몇 국가에서는 기자가 되는 것은 위험하다.","answer":["a","is"],"hint":"관사 + 동명사 주어 단수 동사"}]},
    {"id":"w03645","w":"judgment","pos":["n"],"ph":"/ˈdʒʌdʒmənt/","cefr":"B1","kr":["판단","판결"],"ex":[{"en":"Use good judgment in difficult situations.","ko":"어려운 상황에서 좋은 판단력을 사용해라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"decision","ko":"결정","reason":"동의어"},{"w":"verdict","ko":"평결","reason":"판결 의미의 유의어"},{"w":"wisdom","ko":"지혜","reason":"좋은 판단에 필요한 자질"}],"collocBest":[{"en":"use judgment","ko":"판단력을 사용하다"},{"en":"poor judgment","ko":"잘못된 판단"}]},"nuance":{"koSimple":"이게 옳다고 결정하는 힘.","whenToUse":"판단력·법적 판결·중요 결정에."},"krDetail":[{"ko":"판단","explain":"어떤 일에 대해 옳고 그름을 정하는 것"},{"ko":"판결","explain":"법정에서 내리는 공식 결정"}],"usageExamples":[{"en":"Trust your own judgment this time.","ko":"이번엔 네 판단을 믿어라."},{"en":"The judgment shocked the whole town.","ko":"그 판결은 온 마을을 놀라게 했다."}],"grammarNote":"judgment는 미국식, judgement는 영국식 철자로 둘 다 맞지만 시험에서는 미국식을 표준으로 쓴다. 학생들이 철자를 자주 헷갈린다.","grammarQuiz":[{"sentence":"Making _____ quick judgment _____ full information is often dangerous.","ko":"충분한 정보 없이 성급한 판단을 내리는 것은 종종 위험하다.","answer":["a","without"],"hint":"관사 + 전치사"},{"sentence":"The court's judgment _____ delivered _____ front of a large crowd.","ko":"법원의 판결은 많은 군중 앞에서 전달되었다.","answer":["was","in"],"hint":"수동태 + 전치사구"}]},
    {"id":"w03658","w":"justice","pos":["n"],"ph":"/ˈdʒʌstɪs/","cefr":"B1","kr":["정의","사법"],"ex":[{"en":"Everyone deserves equal justice under law.","ko":"모든 사람은 법 아래 평등한 정의를 받아야 한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"fairness","ko":"공정","reason":"동의어"},{"w":"injustice","ko":"불의","reason":"반의어"},{"w":"court","ko":"법원","reason":"사법 정의가 실현되는 장소"}],"collocBest":[{"en":"social justice","ko":"사회 정의"},{"en":"seek justice","ko":"정의를 추구하다"}]},"nuance":{"koSimple":"모두에게 공평한 옳은 대우.","whenToUse":"법·사회·인권의 공정함을 말할 때."},"krDetail":[{"ko":"정의","explain":"옳고 공정한 것을 지키는 원칙"},{"ko":"사법","explain":"법에 따라 판결하는 국가 기능"}],"usageExamples":[{"en":"The people demanded justice for the victims.","ko":"사람들은 피해자를 위한 정의를 요구했다."},{"en":"Justice must be applied equally to all.","ko":"정의는 모두에게 똑같이 적용되어야 한다."}],"grammarNote":"justice는 불가산명사로 관사 없이 쓰이고 복수형이 없다. 학생들이 'a justice'나 'justices'로 잘못 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The activists fought _____ justice _____ they finally won the case.","ko":"그 활동가들은 정의를 위해 싸웠고 마침내 소송에서 이겼다.","answer":["for","until"],"hint":"전치사 + 접속사"},{"sentence":"Justice _____ not always easy _____ achieve in society.","ko":"정의는 사회에서 이루기가 언제나 쉬운 것은 아니다.","answer":["is","to"],"hint":"be동사 + to부정사"}]},

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
