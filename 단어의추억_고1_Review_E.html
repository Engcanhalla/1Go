<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review E</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

  /* ---------- RAINBOW BURST ---------- */
  .rainbow-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:45;

    {"id":"w03380","w":"innocence","pos":["n"],"ph":"/ˈɪnəsəns/","cefr":"B1","kr":["순수함","무죄"],"ex":[{"en":"The child's innocence was charming.","ko":"그 아이의 순수함은 매력적이었다."}],"mnemonic":{"soundHint":"이(in=not)+노센스(nocent 해로운)","story":"해로움(nocent) 없는(in) 상태=순수함(innocence)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"guilt","ko":"죄책감","reason":"명확한 반의어, 법정 시나리오의 짝"},{"w":"childhood","ko":"어린 시절","reason":"childhood innocence 콜로케이션의 짝"},{"w":"prove","ko":"증명하다","reason":"prove one's innocence 시나리오의 짝"}],"collocBest":[]},"nuance":{"koSimple":"때 묻지 않은 순수함.","whenToUse":"어린이 순수함·법적 무죄 말할 때."},"krDetail":[{"ko":"순수함","explain":"때 묻지 않고 깨끗한 마음이나 꾸밈이 없이 맑고 참된 성질"},{"ko":"무죄","explain":"죄를 짓지 않은 상태 또는 잘못이 없다는 사실"}],"usageExamples":[{"en":"The lawyer worked hard for months to prove his client's complete innocence.","ko":"그 변호사는 의뢰인의 완전한 무죄를 입증하기 위해 몇 달간 열심히 일했다."},{"en":"Adults sometimes miss the beautiful innocence of early childhood friendships.","ko":"어른들은 때때로 어린 시절 우정의 아름다운 순수함을 그리워한다."}],"grammarNote":"innocence는 불가산명사로 복수형이 없습니다. 학생들은 관사에서 실수하기 쉬운데 'prove one's innocence'는 특정 상황이므로 소유격이 필요합니다. 'lose innocence'는 관사 없이도 씁니다.","grammarQuiz":[{"sentence":"The court finally accepted the young man's _____ and set _____ free after ten years.","ko":"법정은 마침내 그 젊은이의 무죄를 받아들여 10년 만에 그를 풀어주었다.","answer":["innocence","him"],"hint":"명사+목적격"}]},
    {"id":"w03268","w":"indeed","pos":["adv"],"ph":"/ɪnˈdiːd/","cefr":"B1","kr":["정말로","사실"],"ex":[{"en":"She was indeed very talented.","ko":"그녀는 정말로 매우 재능 있었다."}],"mnemonic":{"soundHint":"인 디드(정말로 그랬어)","story":"'Indeed!' 정말로! 강한 긍정","hintConfidence":2},"pairs":{"buddyWords":[{"w":"truly","ko":"진실로","reason":"동의어로 강조 자리를 공유"},{"w":"certainly","ko":"확실히","reason":"동의어이자 강한 긍정 시나리오에서 짝"},{"w":"friend","ko":"친구","reason":"'A friend in need is a friend indeed' 속담의 짝"}],"collocBest":[]},"nuance":{"koSimple":"정말로, 사실 그렇다는 강조.","whenToUse":"앞말을 확인·강조할 때."},"krDetail":[{"ko":"정말로","explain":"말한 사실이 진짜임을 강조하며 그것이 참됨을 힘 있게 드러내는 뜻으로"},{"ko":"사실","explain":"앞의 말을 더욱 굳게 다지거나 실제로 그러함을 다시 한번 힘주어 나타내는 뜻으로"}],"usageExamples":[{"en":"Winning first prize truly indeed changed the young musician's life forever.","ko":"1등상을 탄 것은 정말로 그 어린 음악가의 인생을 영원히 바꿔놓았다."},{"en":"The novel is indeed one of the greatest works of the century.","ko":"그 소설은 사실 이 세기 최고의 작품들 중 하나이다."}],"grammarNote":"indeed는 문장 끝, 중간, 앞 어디에나 올 수 있으며 강조의 뜻을 더합니다. 'very ~ indeed' 구조로 매우 자주 쓰이고, 학생들은 이 관용 표현을 몰라 'very indeed good'처럼 어색하게 배치합니다.","grammarQuiz":[{"sentence":"Thank you very much _____ for helping me prepare _____ the important interview.","ko":"중요한 면접 준비를 도와줘서 정말 대단히 고맙습니다.","answer":["indeed","for"],"hint":"부사+전치사"}]},
    {"id":"w03321","w":"infant","pos":["n"],"ph":"/ˈɪnfənt/","cefr":"B1","kr":["유아","갓난아기"],"ex":[{"en":"The infant slept all afternoon.","ko":"그 유아는 오후 내내 잤다."}],"mnemonic":{"soundHint":"인(in=not)+팬트(fant 말하다)","story":"in(not)+fant(말하다)=말 못하는 유아(infant)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"baby","ko":"아기","reason":"동의어로 육아 시나리오의 짝"},{"w":"adult","ko":"성인","reason":"명확한 반의어 관계"},{"w":"care","ko":"돌봄","reason":"infant care 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"아직 걷지 못하는 아기.","whenToUse":"의료·발달에서 갓난아기 지칭할 때."},"krDetail":[{"ko":"유아","explain":"태어난 지 얼마 되지 않아 스스로 걷지 못하는 어린 아이"},{"ko":"갓난아기","explain":"세상에 나온 지 얼마 안 되어 아직 아무것도 스스로 하지 못하는 아기"}],"usageExamples":[{"en":"The nurse gently held the newborn infant and gave him warm milk.","ko":"그 간호사는 갓난아기를 부드럽게 안고 따뜻한 우유를 먹였다."},{"en":"Doctors regularly monitor infant development during the first two crucial years.","ko":"의사들은 처음 2년의 결정적인 기간 동안 유아 발달을 정기적으로 관찰한다."}],"grammarNote":"infant는 셀 수 있는 명사로 관사가 필요합니다. 형용사처럼 쓰여 다른 명사를 꾸미기도 하는데 'infant mortality(영아 사망률)'처럼 씁니다. 학생들은 관사를 빼고 'infant needs care'로 잘못 쓰기 쉽습니다.","grammarQuiz":[{"sentence":"The young mother carried her _____ carefully as she _____ down the stairs.","ko":"그 젊은 엄마는 계단을 내려가면서 아기를 조심스럽게 안고 갔다.","answer":["infant","walked"],"hint":"명사+과거동사"}]},
    {"id":"w03323","w":"infect","pos":["v"],"ph":"/ɪnˈfekt/","cefr":"B1","kr":["감염시키다","오염시키다"],"ex":[{"en":"The virus infected thousands.","ko":"그 바이러스는 수천 명을 감염시켰다."}],"mnemonic":{"soundHint":"인(안으로)+펙트(fect)","story":"몸 안으로(in) 병균을 심어 감염시키다(infect)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"virus","ko":"바이러스","reason":"virus가 사람을 infect하는 시나리오에서 짝"},{"w":"cure","ko":"치료하다","reason":"명확한 반의어 관계"},{"w":"spread","ko":"퍼지다","reason":"감염 전파 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"병균이 몸에 옮다.","whenToUse":"바이러스·세균이 퍼지는 상황에."},"krDetail":[{"ko":"감염시키다","explain":"병을 일으키는 세균이나 바이러스를 다른 사람이나 동물의 몸에 옮기다"},{"ko":"오염시키다","explain":"깨끗한 것에 병균이나 나쁜 것을 섞어 더럽고 나쁘게 만들다"}],"usageExamples":[{"en":"The sick student accidentally infected several classmates before staying home.","ko":"그 아픈 학생은 집에 머물기 전에 우연히 여러 반 친구를 감염시켰다."},{"en":"This virus can easily infect people through the air and contaminated surfaces.","ko":"이 바이러스는 공기와 오염된 표면을 통해 사람들을 쉽게 감염시킬 수 있다."}],"grammarNote":"infect는 타동사로 뒤에 반드시 목적어(사람·동물)가 옵니다. 학생들은 자동사로 착각해 'He infected'만 쓰고 끝내는 실수를 합니다. 'be infected with (병명)'처럼 수동태로도 자주 씁니다.","grammarQuiz":[{"sentence":"One coughing passenger can _____ many others if he _____ not wear a mask.","ko":"기침하는 한 명의 승객이 마스크를 쓰지 않으면 많은 다른 사람들을 감염시킬 수 있다.","answer":["infect","does"],"hint":"동사+조동사"}]},
    {"id":"w03359","w":"inhale","pos":["v"],"ph":"/ɪnˈheɪl/","cefr":"B1","kr":["들이마시다","흡입하다"],"ex":[{"en":"She inhaled the fresh mountain air deeply and felt instantly refreshed.","ko":"그녀는 신선한 산 공기를 깊이 들이마시며 즉시 상쾌함을 느꼈다."}],"mnemonic":{"soundHint":"인(안으로)+헤일(hail)","story":"안(in)으로 헤일~ 숨을 들이마시다(inhale)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"exhale","ko":"내쉬다","reason":"명확한 반의어, 호흡 시나리오의 짝"},{"w":"breath","ko":"숨","reason":"숨을 들이마시는 대상의 짝"},{"w":"deeply","ko":"깊이","reason":"inhale deeply 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"공기를 코·입으로 들이마시다.","whenToUse":"신선한 공기·연기 들이쉴 때."},"krDetail":[{"ko":"들이마시다","explain":"코나 입으로 공기·냄새 등을 몸속으로 빨아들이다"},{"ko":"흡입하다","explain":"공기나 연기 같은 것을 안으로 힘 있게 빨아들여 몸속에 넣다"}],"usageExamples":[{"en":"The yoga instructor asked us to inhale slowly through our noses.","ko":"요가 강사는 우리에게 코로 천천히 숨을 들이마시라고 요청했다."},{"en":"Firefighters warned residents not to inhale the thick smoke from burning buildings.","ko":"소방관들은 주민들에게 불타는 건물에서 나오는 짙은 연기를 흡입하지 말라고 경고했다."}],"grammarNote":"inhale은 타동사와 자동사 모두 가능하며 반대말은 exhale입니다. 학생들은 'inhale in air'처럼 쓰지만, in의 뜻이 이미 포함되어 있어 'inhale air' 또는 그냥 'inhale'로 씁니다.","grammarQuiz":[{"sentence":"Before diving underwater, swimmers should _____ deeply and hold _____ breath.","ko":"물속에 잠수하기 전에, 수영하는 사람은 깊이 들이마시고 숨을 참아야 한다.","answer":["inhale","their"],"hint":"동사+소유격"}]},
    {"id":"w03372","w":"injure","pos":["v"],"ph":"/ˈɪndʒər/","cefr":"B1","kr":["다치게 하다","부상을 입히다"],"ex":[{"en":"He injured his knee playing soccer.","ko":"그는 축구를 하다 무릎을 다쳤다."}],"mnemonic":{"soundHint":"인(in=not)+저(jure 정당)","story":"in(not)+jure(정당) 규칙 어기며 다치게 하다(injure)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"hurt","ko":"다치게 하다","reason":"동의어로 부상 문맥 공유"},{"w":"heal","ko":"치유하다","reason":"명확한 반의어 관계"},{"w":"seriously","ko":"심각하게","reason":"seriously injure 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"사고로 몸을 다치게 하다.","whenToUse":"운동·사고로 다쳤을 때."},"krDetail":[{"ko":"다치게 하다","explain":"몸이나 마음에 상처를 입혀 아프거나 나쁜 상태가 되게 하다"},{"ko":"부상을 입히다","explain":"다른 사람의 몸에 상처나 손상을 주어 아프게 하다"}],"usageExamples":[{"en":"The careless driver seriously injured a pedestrian while crossing the busy street.","ko":"그 부주의한 운전자는 붐비는 거리를 건너던 보행자를 심각하게 다치게 했다."},{"en":"Athletes must warm up properly to avoid injuring themselves during competitions.","ko":"운동선수들은 경기 중 자신을 다치게 하지 않으려면 제대로 몸을 풀어야 한다."}],"grammarNote":"injure는 타동사로 목적어가 필요하며 수동태 'be injured'가 아주 자주 쓰입니다. 학생들은 'I injured'만 쓰고 끝내기 쉽지만, 'I injured my knee' 또는 'I was injured'처럼 완전한 구조가 필요합니다.","grammarQuiz":[{"sentence":"Many soccer players _____ their knees seriously when they _____ down suddenly.","ko":"많은 축구 선수들은 갑자기 넘어질 때 무릎을 심각하게 다친다.","answer":["injure","fall"],"hint":"동사+동사원형"}]},
    {"id":"w03410","w":"insist","pos":["v"],"ph":"/ɪnˈsɪst/","cefr":"B1","kr":["주장하다","고집하다"],"ex":[{"en":"He insisted on paying the bill.","ko":"그는 계산서를 내겠다고 고집했다."}],"mnemonic":{"soundHint":"인(안에)+시스트(sist 서다)","story":"그 자리에 딱 서서(sist) 주장하다(insist)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"demand","ko":"요구하다","reason":"동의어로 강한 주장 자리 공유"},{"w":"on","ko":"~에 대해","reason":"insist on 콜로케이션의 필수 짝 전치사"},{"w":"strongly","ko":"강하게","reason":"strongly insist 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"물러서지 않고 강하게 우기다.","whenToUse":"자기 뜻을 굽히지 않을 때."},"krDetail":[{"ko":"주장하다","explain":"자기 의견이나 생각이 옳다고 힘 있게 말하며 물러서지 않다"},{"ko":"고집하다","explain":"다른 사람의 말을 듣지 않고 자기 생각이나 방식을 굳게 지키다"}],"usageExamples":[{"en":"The stubborn teenager insisted on wearing his old jacket to the wedding.","ko":"그 고집 센 십대는 결혼식에 자기 낡은 재킷을 입고 가겠다고 고집했다."},{"en":"The witness insisted that she had seen the man near the shop.","ko":"그 목격자는 그 남자를 가게 근처에서 보았다고 주장했다."}],"grammarNote":"insist 뒤에는 'that + 주어 + (should) + 동사원형' 구조가 오는데, 학생들이 'should'를 빼도 동사원형을 씁니다. 'insist on ~ing(~을 고집하다)'도 매우 자주 쓰이는 표현입니다.","grammarQuiz":[{"sentence":"The mother _____ that her son _____ home before ten o'clock every night.","ko":"그 어머니는 아들이 매일 밤 10시 전에 집에 와야 한다고 주장했다.","answer":["insisted","come"],"hint":"과거동사+동사원형"}]},
    {"id":"w03224","w":"incense","pos":["n","v"],"ph":"/ˈɪnsens/","cefr":"B1","kr":["향","격분시키다"],"ex":[{"en":"She burned incense in the temple.","ko":"그녀는 절에서 향을 피웠다."}],"mnemonic":{"soundHint":"인센스 향초","story":"'인센스'는 명상·요가할 때 피우는 향초로 한국어에도 자주 쓰인다. 그 향이 강해 누군가를 '격분시키다'라는 뜻도 있다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"aroma","ko":"향기","reason":"incense가 뿜어내는 것이 바로 aroma"},{"w":"temple","ko":"사원","reason":"temple에서 incense를 태우는 장면이 전형적"},{"w":"enrage","ko":"격분시키다","reason":"incense의 동사 의미와 동일 시나리오"}],"collocBest":[{"en":"burn incense","ko":"향을 피우다"},{"en":"incense sticks","ko":"향 막대"}]},"nuance":{"koSimple":"절에서 피우는 향기로운 막대.","whenToUse":"절·명상에서 태우는 향을 말할 때."},"krDetail":[{"ko":"향","explain":"불에 태워 좋은 냄새를 내는 나뭇조각·가루로, 절이나 조상 제사에서 피우는 냄새나는 막대"},{"ko":"격분시키다","explain":"다른 사람의 화를 몹시 돋우어 참지 못하고 크게 성내게 만들다"}],"usageExamples":[{"en":"His rude remarks incensed the entire audience at the meeting.","ko":"그의 무례한 말이 회의에서 청중 전체를 격분시켰다."},{"en":"The temple was filled with the sweet smell of burning incense.","ko":"그 절은 타오르는 향의 달콤한 냄새로 가득했다."}],"grammarNote":"명사(향)와 동사(격분시키다)의 발음과 강세가 다릅니다. 명사는 /ˈɪnsens/로 앞에 강세, 동사는 /ɪnˈsens/로 뒤에 강세가 옵니다. 학생들은 같은 철자라 같은 발음으로 착각하기 쉽습니다.","grammarQuiz":[{"sentence":"The manager's decision to cut wages _____ _____ workers who then went on strike.","ko":"임금을 삭감한 관리자의 결정은 노동자들을 격분시켰고, 그들은 파업에 들어갔다.","answer":["incensed","the"],"hint":"격분시켰다 + 정관사"}]},
    {"id":"w03254","w":"inconvenient","pos":["adj"],"ph":"/ˌɪnkənˈviːniənt/","cefr":"B1","kr":["불편한","불편을 주는"],"ex":[{"en":"The early meeting time was inconvenient.","ko":"이른 회의 시간이 불편했다."}],"mnemonic":{"soundHint":"인(in=not)+컨비니언트(convenient)","story":"in(not)+convenient(편리)=불편한(inconvenient)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"convenient","ko":"편리한","reason":"in-이 붙어 만들어진 반의어 관계"},{"w":"awkward","ko":"어색한, 곤란한","reason":"동의어로 자주 대체 사용"},{"w":"timing","ko":"타이밍","reason":"inconvenient timing 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"시간·상황이 마음에 안 맞아 불편한.","whenToUse":"시간·장소가 안 맞아 곤란할 때."},"krDetail":[{"ko":"불편한","explain":"쓰거나 지내기에 편하지 않고 걸리적거려서 성가시거나 짜증나는 상태"},{"ko":"불편을 주는","explain":"다른 사람의 일이나 계획을 방해하고 성가시게 만드는 성질을 가진"}],"usageExamples":[{"en":"The manager scheduled the meeting at a very inconvenient time for everyone.","ko":"관리자는 회의를 모두에게 매우 불편한 시간에 잡았다."},{"en":"Living far from the subway station is inconvenient during rainy weather.","ko":"지하철역에서 멀리 사는 것은 비 오는 날씨에 불편하다."}],"grammarNote":"형용사 inconvenient는 사람을 주어로 쓰지 않고 사물·상황을 주어로 씁니다. 학생들은 'I am inconvenient'로 쓰는 실수를 하지만, 이는 '내가 남에게 불편을 준다'는 뜻입니다. '나는 불편하다'는 'It is inconvenient for me'로 표현합니다.","grammarQuiz":[{"sentence":"Tell me if this time is _____ for you, and I _____ reschedule the appointment.","ko":"이 시간이 당신에게 불편하다면 말해 주세요, 그러면 제가 약속을 다시 잡을게요.","answer":["inconvenient","will"],"hint":"형용사+조동사"}]},
    {"id":"w03257","w":"increasingly","pos":["adv"],"ph":"/ɪnˈkriːsɪŋli/","cefr":"B1","kr":["점점 더"],"ex":[{"en":"Life is increasingly stressful.","ko":"삶이 점점 더 스트레스를 받는다."}],"mnemonic":{"soundHint":"인크리스(increase)+ingly","story":"인크리스(increase)+ingly=점점 더(increasingly)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"gradually","ko":"점차","reason":"동의어로 대체 가능, '점점' 의미의 짝"},{"w":"popular","ko":"인기 있는","reason":"increasingly popular 콜로케이션의 짝"},{"w":"difficult","ko":"어려운","reason":"increasingly difficult 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"시간이 갈수록 점점 더.","whenToUse":"변화가 계속 커질 때."},"krDetail":[{"ko":"점점 더","explain":"시간이 지나면서 정도나 수량이 계속해서 조금씩 더 커지거나 강해지는 모양"}],"usageExamples":[{"en":"Scientists find climate change increasingly threatens fragile ocean ecosystems.","ko":"과학자들은 기후 변화가 취약한 해양 생태계를 점점 더 위협한다는 것을 발견한다."},{"en":"The old man's memory has been getting increasingly worse this year.","ko":"그 노인의 기억력은 올해 점점 더 나빠지고 있다."}],"grammarNote":"부사 increasingly는 주로 형용사나 다른 부사 앞에 위치해 그 정도가 커지고 있음을 나타냅니다. 학생들은 동사 앞에 'increasingly work'처럼 쓰기 쉽지만, 형용사와 함께 'increasingly popular'로 쓰는 것이 자연스럽습니다.","grammarQuiz":[{"sentence":"As technology develops, our daily lives _____ _____ dependent on smartphones and computers.","ko":"기술이 발전함에 따라, 우리의 일상생활은 점점 더 스마트폰과 컴퓨터에 의존하게 된다.","answer":["are","increasingly"],"hint":"be동사+부사"}]},
    {"id":"w03419","w":"inspire","pos":["v"],"ph":"/ɪnˈspaɪər/","cefr":"B1","kr":["영감을 주다","고무시키다"],"ex":[{"en":"Her speech inspired many students.","ko":"그녀의 연설은 많은 학생들에게 영감을 주었다."}],"mnemonic":{"soundHint":"인(안에)+스파이어(spire 숨)","story":"안(in)에 숨(spire)을 불어넣어 영감을 주다(inspire)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"motivate","ko":"동기부여하다","reason":"동의어 - 영감을 주어 움직이게 하다"},{"w":"discourage","ko":"낙담시키다","reason":"반의어 - 영감을 주는 것의 반대"},{"w":"leader","ko":"지도자","reason":"시나리오 - 지도자가 사람들에게 영감을 줌"}],"collocBest":[]},"nuance":{"koSimple":"마음에 불을 붙여 움직이게 하다.","whenToUse":"누군가에게 창의력·용기를 불어넣을 때."},"krDetail":[{"ko":"마음에 뜨거운 불을 지피다","explain":"'영감을 주다'는 다른 사람이 무언가를 하고 싶게 만들도록 마음을 움직이는 것을 뜻해요."},{"ko":"기운을 북돋우다","explain":"'고무(鼓舞)시키다'는 힘내라고 마음을 부추기는 것을 말해요."}],"usageExamples":[{"en":"The teacher inspired her students to read more books.","ko":"그 선생님은 학생들이 더 많은 책을 읽도록 영감을 주었다."},{"en":"His story was inspired by real events.","ko":"그의 이야기는 실제 사건에서 영감을 받았다."}],"grammarNote":"'inspire A to do'는 'A가 ~하도록 영감을 주다'라는 뜻이에요. 학생들이 'inspire A doing'으로 잘못 쓰는 경우가 많은데, 반드시 'to부정사'를 써야 합니다.","grammarQuiz":[{"sentence":"The coach _____ his players _____ never give up during the match.","ko":"코치는 선수들이 경기 중에 절대 포기하지 않도록 영감을 주었다.","answer":["inspired","to"],"hint":"과거시제 동사 + to부정사"}]},
    {"id":"w03422","w":"instance","pos":["n"],"ph":"/ˈɪnstəns/","cefr":"B1","kr":["경우","사례"],"ex":[{"en":"In this instance, he was right.","ko":"이 경우에 그는 옳았다."}],"mnemonic":{"soundHint":"인스턴트(instant)+스","story":"인스턴트(instant)한 개별 사례가 인스턴스(instance)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"example","ko":"예시","reason":"동의어 - 사례를 드는 것"},{"w":"case","ko":"경우","reason":"동의어 - 특정 상황을 지칭"},{"w":"situation","ko":"상황","reason":"시나리오 - 어떤 경우/상황에서"}],"collocBest":[]},"nuance":{"koSimple":"딱 그 하나의 경우·사례.","whenToUse":"예시나 특정 상황을 들 때(for instance)."},"krDetail":[{"ko":"어떤 일이 있었던 때","explain":"'경우(境遇)'는 어떤 일이 실제로 일어난 상황을 뜻해요."},{"ko":"실제로 있었던 일","explain":"'사례(事例)'는 예로 들 만한 실제 있었던 일을 말해요."}],"usageExamples":[{"en":"There are many instances of kindness in this book.","ko":"이 책에는 친절함의 사례가 많이 있다."},{"en":"For instance, some birds can fly very high.","ko":"예를 들어, 어떤 새들은 매우 높이 날 수 있다."}],"grammarNote":"'for instance'는 'for example'과 같은 뜻이에요. 학생들이 'for instances'처럼 복수형으로 쓰는 실수를 자주 하는데, 관용구이므로 반드시 단수형 'instance'만 씁니다.","grammarQuiz":[{"sentence":"Many animals hibernate in winter; _____ _____, bears sleep for months.","ko":"많은 동물들이 겨울에 겨울잠을 잔다; 예를 들어, 곰은 몇 달 동안 잔다.","answer":["for","instance"],"hint":"관용 표현 전치사 + 단수 명사"}]},
    {"id":"w03440","w":"insurance","pos":["n"],"ph":"/ɪnˈʃʊərəns/","cefr":"B1","kr":["보험"],"ex":[{"en":"Health insurance is very important.","ko":"건강 보험은 매우 중요하다."}],"mnemonic":{"soundHint":"인 슈어(sure 확실)+런스","story":"슈어(sure)하게 확실히 보장하는=보험(insurance)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"coverage","ko":"보장","reason":"동의어 - 보험 보장 범위"},{"w":"policy","ko":"보험 증권","reason":"시나리오 - 보험 증권에 가입"},{"w":"premium","ko":"보험료","reason":"시나리오 - 보험료 납부"}],"collocBest":[]},"nuance":{"koSimple":"사고·아플 때 돈으로 보호.","whenToUse":"보험 가입·보장 얘기할 때."},"krDetail":[{"ko":"돈을 미리 내고 지키는 약속","explain":"'보험(保險)'은 사고나 병에 대비해 돈을 모아 두었다가 필요할 때 받는 제도를 뜻해요."}],"usageExamples":[{"en":"She bought health insurance for her family last month.","ko":"그녀는 지난달에 가족을 위해 건강 보험을 샀다."},{"en":"Car insurance is required by law in most countries.","ko":"자동차 보험은 대부분의 나라에서 법으로 요구된다."}],"grammarNote":"'insurance'는 불가산 명사로 항상 단수 형태로 쓰여요. 학생들이 'insurances'처럼 복수형으로 쓰는 실수를 자주 하는데, 종류가 다양할 때는 'types of insurance'라고 표현합니다.","grammarQuiz":[{"sentence":"You should _____ health _____ before traveling abroad.","ko":"해외 여행 전에 건강 보험을 사야 한다.","answer":["buy","insurance"],"hint":"구매 동사 + 불가산 명사"}]},
    {"id":"w03459","w":"intention","pos":["n"],"ph":"/ɪnˈtenʃən/","cefr":"B1","kr":["의도","목적"],"ex":[{"en":"His intention was to help.","ko":"그의 의도는 돕는 것이었다."}],"mnemonic":{"soundHint":"인 텐(10) 션","story":"마음속 '인(in)'에 '텐(10)'개의 화살촉을 '션'하고 겨눠 둔 것이 바로 의도","hintConfidence":2},"pairs":{"buddyWords":[{"w":"purpose","ko":"목적","reason":"동의어 - 의도/목적"},{"w":"aim","ko":"목표","reason":"동의어 - 겨냥한 목표"},{"w":"intend","ko":"의도하다","reason":"시나리오 - 명사와 동사 관계"}],"collocBest":[]},"nuance":{"koSimple":"마음속 목적·작정.","whenToUse":"의도적 행동·본심을 말할 때."},"krDetail":[{"ko":"속에 품은 생각","explain":"'의도(意圖)'는 어떤 일을 하려는 마음속의 계획이나 목적을 뜻해요."},{"ko":"이루려는 것","explain":"'목적(目的)'은 이루기 위해 정해 놓은 목표를 말해요."}],"usageExamples":[{"en":"His intention was to help, not to hurt anyone.","ko":"그의 의도는 도우려는 것이었지, 누구를 해치려는 것이 아니었다."},{"en":"She had no intention of leaving her job.","ko":"그녀는 직장을 그만둘 의도가 전혀 없었다."}],"grammarNote":"'have the/no intention of doing'은 '~할 의도가 있다/없다'라는 관용 표현으로 반드시 'of + 동명사'를 씁니다. 학생들이 'to부정사'를 붙이는 실수를 자주 하니 주의하세요.","grammarQuiz":[{"sentence":"He has no _____ _____ giving up his dream so easily.","ko":"그는 자신의 꿈을 그렇게 쉽게 포기할 의도가 없다.","answer":["intention","of"],"hint":"의도 명사 + 동명사용 전치사"}]},
    {"id":"w03476","w":"interfere","pos":["v"],"ph":"/ˌɪntəˈfɪər/","cefr":"B1","kr":["간섭하다","방해하다"],"ex":[{"en":"Don't interfere in their argument.","ko":"그들의 논쟁에 간섭하지 마라."}],"mnemonic":{"soundHint":"인터(사이) + 피어(끼어)","story":"남 일 '사이(inter)'에 '피어(fere)' 끼어들며 간섭·방해하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"meddle","ko":"참견하다","reason":"동의어 - 남 일에 간섭하다"},{"w":"disturb","ko":"방해하다","reason":"동의어 - 흐름을 방해하다"},{"w":"ignore","ko":"무시하다","reason":"반의어 - 간섭의 반대"}],"collocBest":[]},"nuance":{"koSimple":"남 일에 끼어들어 방해하다.","whenToUse":"불필요한 참견·업무 방해 상황."},"krDetail":[{"ko":"남의 일에 끼어들다","explain":"'간섭(干涉)하다'는 상관없는 일에 나서서 이래라저래라 하는 것을 뜻해요."},{"ko":"일을 못하게 막다","explain":"'방해(妨害)하다'는 어떤 일이 제대로 되지 않도록 가로막는 것을 말해요."}],"usageExamples":[{"en":"Loud noise interferes with my concentration on studying.","ko":"시끄러운 소음은 나의 공부 집중을 방해한다."},{"en":"Please do not interfere in my personal affairs.","ko":"제 개인적인 일에 간섭하지 말아 주세요."}],"grammarNote":"'interfere with + 사물/과정'은 '~을 방해하다', 'interfere in + 일/문제'는 '~에 간섭하다'는 뜻이에요. 두 전치사를 헷갈리지 않도록 문맥을 잘 살펴야 합니다.","grammarQuiz":[{"sentence":"Using a phone at night can _____ _____ your sleep quality.","ko":"밤에 휴대폰을 사용하는 것은 수면의 질을 방해할 수 있다.","answer":["interfere","with"],"hint":"방해 동사 + 사물 전치사"}]},
    {"id":"w03496","w":"interpreter","pos":["n"],"ph":"/ɪnˈtɜːrprɪtər/","cefr":"B1","kr":["통역사","해석자"],"ex":[{"en":"The interpreter translated the speech live.","ko":"통역사가 연설을 실시간으로 통역했다."}],"mnemonic":{"soundHint":"인터(사이) + 프리터(전달자)","story":"두 언어 '사이(inter)'에서 뜻을 '풀어(pret)' 전달하는 사람 → 통역사","hintConfidence":2},"pairs":{"buddyWords":[{"w":"translator","ko":"번역가","reason":"동의어 - 언어를 옮기는 사람"},{"w":"language","ko":"언어","reason":"시나리오 - 언어를 통역함"},{"w":"conference","ko":"회의","reason":"시나리오 - 국제 회의에서 통역사가 활동"}],"collocBest":[]},"nuance":{"koSimple":"말을 그때그때 옮겨주는 사람.","whenToUse":"통역 상황·전문가를 가리킬 때."},"krDetail":[{"ko":"말을 옮겨 주는 사람","explain":"'통역사(通譯士)'는 서로 다른 언어를 쓰는 사람들 사이에서 말을 옮겨 주는 전문가를 뜻해요."},{"ko":"뜻을 풀어 주는 사람","explain":"'해석자(解釋者)'는 어려운 글이나 뜻을 알기 쉽게 풀어 설명하는 사람을 말해요."}],"usageExamples":[{"en":"The interpreter translated the speech into Korean.","ko":"통역사는 그 연설을 한국어로 통역했다."},{"en":"She works as a professional interpreter at conferences.","ko":"그녀는 회의에서 전문 통역사로 일한다."}],"grammarNote":"'interpreter'는 말을 옮기는 사람이고, 'translator'는 글을 옮기는 사람이에요. 학생들이 자주 헷갈리는 단어이므로 상황에 맞게 구분해 사용해야 합니다.","grammarQuiz":[{"sentence":"The company hired _____ _____ for the international meeting yesterday.","ko":"회사는 어제 국제 회의를 위해 통역사를 고용했다.","answer":["an","interpreter"],"hint":"부정관사 + 통역사 명사"}]},
    {"id":"w03498","w":"interrupt","pos":["v"],"ph":"/ˌɪntəˈrʌpt/","cefr":"B1","kr":["방해하다","끊다"],"ex":[{"en":"Please do not interrupt during the lecture.","ko":"강의 중에 방해하지 마세요."}],"mnemonic":{"soundHint":"인터(사이) + 럽트(터트림)","story":"말 사이(inter)에 '럽트(rupt=터트림)' 끼어들어 흐름을 끊다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"disturb","ko":"방해하다","reason":"동의어 - 흐름을 끊음"},{"w":"continue","ko":"계속하다","reason":"반의어 - 방해의 반대"},{"w":"conversation","ko":"대화","reason":"콜로 - interrupt a conversation"}],"collocBest":[]},"nuance":{"koSimple":"진행 중인 걸 뚝 끊다.","whenToUse":"말·수업·회의 도중 끊는 상황."},"krDetail":[{"ko":"말이나 일을 못하게 막다","explain":"'방해(妨害)하다'는 다른 사람이 하는 말이나 일을 중간에 끼어들어 멈추게 하는 것을 뜻해요."},{"ko":"이어지던 것을 멈추다","explain":"'끊다'는 계속되던 일이나 관계를 중간에서 멈추게 하는 것을 말해요."}],"usageExamples":[{"en":"Please do not interrupt me while I am speaking.","ko":"제가 말하는 동안 방해하지 말아 주세요."},{"en":"The loud thunder interrupted our peaceful sleep.","ko":"시끄러운 천둥이 우리의 평화로운 잠을 방해했다."}],"grammarNote":"'interrupt'는 타동사로 목적어가 반드시 필요해요. 'interrupt me/him/the meeting'처럼 사람이나 사건을 직접 목적어로 취하며, 학생들이 자동사로 쓰는 실수를 자주 합니다.","grammarQuiz":[{"sentence":"It is rude _____ _____ someone when they are talking.","ko":"누군가 말하고 있을 때 그 사람을 방해하는 것은 무례하다.","answer":["to","interrupt"],"hint":"to부정사 + 방해 동사"}]},
    {"id":"w03535","w":"invention","pos":["n"],"ph":"/ɪnˈvenʃən/","cefr":"B1","kr":["발명","발명품"],"ex":[{"en":"The invention of the telephone changed the world.","ko":"전화기의 발명은 세상을 바꾸었다."}],"mnemonic":{"soundHint":"인(안) + 벤션(찾아냄)","story":"in(안에서) + vent(찾아내다) → 새로 찾아낸 것, 발명(품)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"creation","ko":"창조물","reason":"동의어 - 새로 만들어진 것"},{"w":"innovation","ko":"혁신","reason":"동의어 - 새로운 창조"},{"w":"inventor","ko":"발명가","reason":"시나리오 - 발명가가 발명품을 만듦"}],"collocBest":[]},"nuance":{"koSimple":"새로 만들어낸 것.","whenToUse":"발명품·역사적 창안을 말할 때."},"krDetail":[{"ko":"새로 만들어낸 것","explain":"'발명(發明)'은 지금까지 없던 새로운 물건이나 방법을 처음으로 만들어내는 일을 뜻해요."},{"ko":"새로 만든 물건","explain":"'발명품(發明品)'은 새롭게 만들어낸 물건이나 도구를 말해요."}],"usageExamples":[{"en":"The invention of the wheel changed human history forever.","ko":"바퀴의 발명은 인류 역사를 영원히 바꿔 놓았다."},{"en":"The smartphone is one of the greatest inventions of our time.","ko":"스마트폰은 우리 시대의 가장 위대한 발명품 중 하나이다."}],"grammarNote":"'invention of + 명사'는 '~의 발명'이라는 표현이에요. 학생들이 'invention for'로 잘못 쓰는 경우가 있는데, 무엇을 발명했는지 나타낼 때는 반드시 'of'를 씁니다.","grammarQuiz":[{"sentence":"The _____ _____ the light bulb was made by Thomas Edison.","ko":"전구의 발명은 토머스 에디슨에 의해 이루어졌다.","answer":["invention","of"],"hint":"발명 명사 + 소유 전치사"}]},
    {"id":"w03540","w":"investigate","pos":["v"],"ph":"/ɪnˈvestɪɡeɪt/","cefr":"B1","kr":["조사하다","수사하다"],"ex":[{"en":"The police are investigating the crime.","ko":"경찰이 그 범죄를 수사하고 있다."}],"mnemonic":{"soundHint":"인베스티(자취) + 게이트(문)","story":"in(안으로) + vestige(자취)를 따라 게이트(문) 하나하나 열며 조사하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"examine","ko":"조사하다","reason":"동의어 - 자세히 살펴봄"},{"w":"detective","ko":"형사","reason":"시나리오 - 형사가 사건을 수사함"},{"w":"crime","ko":"범죄","reason":"콜로 - investigate a crime"}],"collocBest":[]},"nuance":{"koSimple":"자세히 파고들어 알아보는.","whenToUse":"경찰 수사·과학 조사·원인 규명에."},"krDetail":[{"ko":"자세히 알아보다","explain":"'조사(調査)하다'는 어떤 일에 대해 자세하고 꼼꼼하게 알아보는 것을 뜻해요."},{"ko":"범죄를 파헤치다","explain":"'수사(搜査)하다'는 범죄와 관련된 사실이나 증거를 찾아내는 일을 말해요."}],"usageExamples":[{"en":"The police are investigating the cause of the accident.","ko":"경찰이 사고의 원인을 조사하고 있다."},{"en":"Scientists investigated the strange behavior of the birds.","ko":"과학자들은 그 새들의 이상한 행동을 조사했다."}],"grammarNote":"'investigate'는 타동사로 목적어가 바로 이어져요. 학생들이 'investigate about/into'로 쓰는 실수를 자주 하는데, 대상이 바로 목적어로 오므로 전치사가 필요 없습니다.","grammarQuiz":[{"sentence":"The detective _____ carefully _____ the mysterious case last week.","ko":"그 형사는 지난주에 그 미스터리한 사건을 주의 깊게 조사했다.","answer":["investigated","the"],"hint":"과거시제 타동사 + 정관사"}]},
    {"id":"w03555","w":"involve","pos":["v"],"ph":"/ɪnˈvɒlv/","cefr":"B1","kr":["포함하다","관련시키다"],"ex":[{"en":"The project involves a lot of teamwork.","ko":"그 프로젝트는 많은 팀워크를 필요로 한다."}],"mnemonic":{"soundHint":"인(안) + 볼브(감다)","story":"in(안으로) + volve(감다·말다) → 안으로 말아 넣어 포함시키다·관련시키다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"include","ko":"포함하다","reason":"동의어 - 안에 포함시키다"},{"w":"exclude","ko":"제외하다","reason":"반의어 - 포함의 반대"},{"w":"participate","ko":"참여하다","reason":"시나리오 - get involved(참여하다)"}],"collocBest":[]},"nuance":{"koSimple":"안에 딸려 들어가다·끼다.","whenToUse":"일에 요소·사람이 포함될 때."},"krDetail":[{"ko":"안에 넣어 두다","explain":"'포함(包含)하다'는 어떤 것을 안에 함께 담아 두는 것을 뜻해요."},{"ko":"함께 얽히게 하다","explain":"'관련(關聯)시키다'는 어떤 일에 사람이나 사물이 함께 얽히도록 하는 것을 말해요."}],"usageExamples":[{"en":"This job involves working with young children.","ko":"이 일은 어린이들과 함께 일하는 것을 포함한다."},{"en":"She got involved in a charity organization last year.","ko":"그녀는 작년에 자선 단체에 참여하게 되었다."}],"grammarNote":"'involve + 동명사(-ing)'는 '~하는 것을 포함하다'라는 뜻이에요. 학생들이 'to부정사'를 쓰는 실수를 자주 하는데, 반드시 동명사 형태를 써야 합니다.","grammarQuiz":[{"sentence":"Learning a new language _____ _____ every day.","ko":"새 언어를 배우는 것은 매일 연습하는 것을 포함한다.","answer":["involves","practicing"],"hint":"3인칭 단수 동사 + 동명사"}]},
    {"id":"w03583","w":"irritate","pos":["v"],"ph":"/ˈɪrɪteɪt/","cefr":"B1","kr":["짜증나게 하다","자극하다"],"ex":[{"en":"The noise irritated him greatly.","ko":"그 소음은 그를 매우 짜증나게 했다."}],"mnemonic":{"soundHint":"이리(여기저기) + 테이트(찌름)","story":"'이리' 저리 신경을 찔러대며 짜증나게 하다·자극하다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"annoy","ko":"짜증나게 하다","reason":"동의어 - 신경을 건드리다"},{"w":"soothe","ko":"달래다","reason":"반의어 - 자극의 반대"},{"w":"skin","ko":"피부","reason":"콜로 - irritate the skin"}],"collocBest":[]},"nuance":{"koSimple":"신경 긁어 짜증 나게.","whenToUse":"소리·행동이 거슬리거나 피부 자극할 때."},"krDetail":[{"ko":"화가 나게 하다","explain":"'짜증나게 하다'는 다른 사람의 마음을 불편하게 하고 화를 나게 하는 것을 뜻해요."},{"ko":"따갑게 만들다","explain":"'자극(刺戟)하다'는 피부나 감정을 콕콕 찌르듯이 반응하게 만드는 것을 말해요."}],"usageExamples":[{"en":"The loud music started to irritate the neighbors.","ko":"시끄러운 음악이 이웃 사람들을 짜증나게 하기 시작했다."},{"en":"This soap can irritate sensitive skin easily.","ko":"이 비누는 민감한 피부를 쉽게 자극할 수 있다."}],"grammarNote":"'irritate'는 타동사로 목적어가 필요해요. 사람이 목적어일 때는 '짜증나게 하다', 신체 부위가 목적어일 때는 '자극하다'로 문맥에 따라 해석이 달라집니다.","grammarQuiz":[{"sentence":"His constant complaining _____ _____ his classmates all day.","ko":"그의 끊임없는 불평이 하루 종일 그의 반 친구들을 짜증나게 했다.","answer":["irritated","all"],"hint":"과거시제 동사 + 전체 수식어"}]},
    {"id":"w03587","w":"isolated","pos":["adj"],"ph":"/ˈaɪsəleɪtɪd/","cefr":"B1","kr":["고립된","외딴"],"ex":[{"en":"The village is isolated from the city.","ko":"그 마을은 도시에서 고립되어 있다."}],"mnemonic":{"soundHint":"아이솔(=island 섬) + 레이티드","story":"island(섬)처럼 홀로 뚝 떨어진 상태 → 고립된, 외딴","hintConfidence":2},"pairs":{"buddyWords":[{"w":"remote","ko":"외딴","reason":"동의어 - 멀리 떨어진"},{"w":"connected","ko":"연결된","reason":"반의어 - 고립의 반대"},{"w":"island","ko":"섬","reason":"시나리오 - 섬처럼 고립됨"}],"collocBest":[]},"nuance":{"koSimple":"주변과 뚝 떨어진.","whenToUse":"외딴 마을·혼자 남겨진 사람·격리 상태에."},"krDetail":[{"ko":"혼자 떨어져 있는","explain":"'고립(孤立)된'은 다른 사람이나 장소로부터 떨어져 홀로 있는 상태를 뜻해요."},{"ko":"멀리 떨어진","explain":"'외딴'은 다른 곳에서 멀리 떨어져 있어 접근하기 어려운 것을 말해요."}],"usageExamples":[{"en":"The island is isolated from the rest of the world.","ko":"그 섬은 세상의 나머지 부분과 고립되어 있다."},{"en":"She felt isolated after moving to a new city.","ko":"그녀는 새로운 도시로 이사한 후 고립감을 느꼈다."}],"grammarNote":"'isolated from + 명사'는 '~로부터 고립된'이라는 뜻이에요. 학생들이 'isolated of'로 잘못 쓰는 경우가 있는데, 반드시 'from'을 씁니다.","grammarQuiz":[{"sentence":"The mountain village was completely _____ _____ the outside world.","ko":"그 산골 마을은 바깥세상과 완전히 고립되어 있었다.","answer":["isolated","from"],"hint":"고립된 형용사 + 출처 전치사"}]},
    {"id":"w03442","w":"intact","pos":["adj"],"ph":"/ɪnˈtækt/","cefr":"B1","kr":["손상되지 않은","온전한"],"ex":[{"en":"The building was intact after the quake.","ko":"건물은 지진 후에도 온전했다."}],"mnemonic":{"soundHint":"인(in=not)+택트(tact 만지다)","story":"in(not)+tact(만지다)=손대지 않은 온전한(intact)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"undamaged","ko":"손상되지 않은","reason":"동의어 - 상처 없는 상태"},{"w":"broken","ko":"부서진","reason":"반의어 - 온전함의 반대"},{"w":"artifact","ko":"유물","reason":"시나리오 - 유물이 온전하게 남아있음"}],"collocBest":[]},"nuance":{"koSimple":"깨지지 않고 그대로.","whenToUse":"충격 후에도 온전할 때."},"krDetail":[{"ko":"다치거나 부서지지 않은","explain":"'손상(損傷)되지 않은'은 부딪히거나 깨져서 흠이 생기지 않은 상태를 뜻해요."},{"ko":"그대로 온전한","explain":"'온전(穩全)한'은 흠 없이 처음 그대로의 완전한 상태를 말해요."}],"usageExamples":[{"en":"The ancient temple remains intact after the earthquake.","ko":"고대 사원은 지진 후에도 온전하게 남아 있다."},{"en":"The package arrived intact despite the long journey.","ko":"소포는 긴 여정에도 불구하고 온전하게 도착했다."}],"grammarNote":"'intact'는 서술적 용법으로만 쓰이는 형용사예요. 명사 앞에 붙여 'an intact box'처럼 쓰지 않고, 'remain/stay/keep intact'처럼 be동사나 상태동사 뒤에 위치합니다.","grammarQuiz":[{"sentence":"The historic building _____ completely _____ after the storm passed.","ko":"그 역사적인 건물은 폭풍이 지나간 후 완전히 온전하게 남아 있었다.","answer":["remained","intact"],"hint":"상태 유지 동사 + 서술 형용사"}]},
    {"id":"w03453","w":"intend","pos":["v"],"ph":"/ɪnˈtend/","cefr":"B1","kr":["의도하다","~할 작정이다"],"ex":[{"en":"I intend to study abroad.","ko":"나는 해외에서 공부할 작정이다."}],"mnemonic":{"soundHint":"인(안으로)+텐드(tend 향하다)","story":"마음이 그쪽으로 tend(향하다)=의도하다(intend)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"plan","ko":"계획하다","reason":"동의어 - ~할 작정이다"},{"w":"mean","ko":"의도하다","reason":"동의어 - 의도를 나타냄"},{"w":"purpose","ko":"목적","reason":"시나리오 - 어떤 목적으로 의도하다"}],"collocBest":[]},"nuance":{"koSimple":"~할 마음을 먹다.","whenToUse":"목적·계획을 밝힐 때."},"krDetail":[{"ko":"미리 마음먹다","explain":"'의도(意圖)하다'는 어떤 일을 하려고 미리 생각하고 계획하는 것을 뜻해요."},{"ko":"그렇게 할 마음이다","explain":"'~할 작정이다'는 어떤 행동을 할 결심이 서 있음을 나타내는 표현이에요."}],"usageExamples":[{"en":"I intend to study abroad next year.","ko":"나는 내년에 유학할 작정이다."},{"en":"She intended the letter for her mother, not you.","ko":"그녀는 그 편지를 너가 아니라 어머니에게 보내려 했다."}],"grammarNote":"'intend'는 'intend to do' 또는 'intend doing' 두 형태 모두 가능하지만, 'to부정사'가 훨씬 자연스러워요. 학생들이 'intend that절'로 쓰는 경우가 있는데, 이 형태는 잘 쓰지 않습니다.","grammarQuiz":[{"sentence":"She _____ _____ become a doctor after finishing university.","ko":"그녀는 대학을 마친 후 의사가 될 작정이다.","answer":["intends","to"],"hint":"3인칭 단수 동사 + to부정사"}]},
    {"id":"w03539","w":"invest","pos":["v"],"ph":"/ɪnˈvest/","cefr":"B1","kr":["투자하다","쏟아붓다"],"ex":[{"en":"She decided to invest her savings in stocks.","ko":"그녀는 저축금을 주식에 투자하기로 결정했다."}],"mnemonic":{"soundHint":"인(안에) + 베스트(조끼)","story":"돈을 '베스트(vest 조끼)' 안(in)에 꽂아 넣듯 밀어 넣다 → 투자하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fund","ko":"자금을 대다","reason":"동의어 - 돈을 넣다"},{"w":"withdraw","ko":"회수하다","reason":"반의어 - 투자의 반대"},{"w":"stock","ko":"주식","reason":"시나리오 - 주식에 투자하다"}],"collocBest":[]},"nuance":{"koSimple":"돈·시간을 미래 위해 붓다.","whenToUse":"주식·시간·노력을 쏟을 때."},"krDetail":[{"ko":"돈이나 노력을 넣어 두다","explain":"'투자(投資)하다'는 나중에 이익을 얻기 위해 돈이나 시간을 미리 넣어 두는 것을 뜻해요."},{"ko":"많이 쏟다","explain":"'쏟아붓다'는 시간이나 노력, 돈 등을 아낌없이 많이 들이는 것을 말해요."}],"usageExamples":[{"en":"He invested a lot of money in the new company.","ko":"그는 새로운 회사에 많은 돈을 투자했다."},{"en":"You should invest time in learning English every day.","ko":"당신은 매일 영어 배우는 데 시간을 투자해야 한다."}],"grammarNote":"'invest in + 명사'는 '~에 투자하다'라는 뜻으로 자주 쓰여요. 학생들이 'invest to'나 'invest on'으로 잘못 쓰는 경우가 있는데, 반드시 전치사 'in'을 사용해야 합니다.","grammarQuiz":[{"sentence":"Many young people _____ _____ stocks to save for their future.","ko":"많은 젊은이들이 미래를 위해 저축하려고 주식에 투자한다.","answer":["invest","in"],"hint":"투자 동사 + 대상 전치사"}]},
    {"id":"w03615","w":"jealous","pos":["adj"],"ph":"/ˈdʒeləs/","cefr":"B1","kr":["질투하는","부러워하는"],"ex":[{"en":"She felt jealous of his success.","ko":"그녀는 그의 성공을 질투했다."}],"mnemonic":{"soundHint":"젤(gel) + 러스","story":"질투하는 마음이 '젤(gel)'처럼 끈적이며 굳어져 떨어지지 않는 감정","hintConfidence":1},"pairs":{"buddyWords":[{"w":"envious","ko":"부러워하는","reason":"동의어"},{"w":"content","ko":"만족한","reason":"반의어"},{"w":"possessive","ko":"소유욕이 강한","reason":"질투하는 사람이 흔히 보이는 태도"}],"collocBest":[]},"nuance":{"koSimple":"남이 가진 걸 보고 배 아파하는.","whenToUse":"연인·성공·물건을 부러워하며 질투할 때."},"krDetail":[{"ko":"질투하는","explain":"남이 가진 것을 부러워하며 샘내는"},{"ko":"부러워하는","explain":"남의 좋은 점을 갖고 싶어 하는"}],"usageExamples":[{"en":"She felt jealous of her sister's success.","ko":"그녀는 언니의 성공을 질투했다."},{"en":"Don't be jealous; be inspired instead.","ko":"질투하지 말고 오히려 자극을 받아라."}],"grammarNote":"jealous는 형용사이므로 be동사와 함께 쓰이고, '~을 질투하다'는 be jealous of + 명사 형태로 표현한다. 학생들이 자주 jealous를 동사처럼 'I jealous him'으로 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"Many classmates _____ _____ of Mia because she always won every prize.","ko":"많은 반 친구들은 미아가 늘 상을 타서 그녀를 질투했다.","answer":["were","jealous"],"hint":"be동사 과거형 + jealous"},{"sentence":"You should not _____ jealous _____ your friend's new phone at all.","ko":"너는 친구의 새 휴대폰을 절대 질투해서는 안 된다.","answer":["be","of"],"hint":"be jealous of 구조"}]},
    {"id":"w03658","w":"justice","pos":["n"],"ph":"/ˈdʒʌstɪs/","cefr":"B1","kr":["정의","사법"],"ex":[{"en":"Everyone deserves equal justice under law.","ko":"모든 사람은 법 아래 평등한 정의를 받아야 한다."}],"mnemonic":{"soundHint":"just(공정한) + ice","story":"just(공정한)한 얼음(ice)처럼 흔들리지 않는 것 → 정의","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fairness","ko":"공정","reason":"동의어"},{"w":"injustice","ko":"불의","reason":"반의어"},{"w":"court","ko":"법원","reason":"사법 정의가 실현되는 장소"}],"collocBest":[]},"nuance":{"koSimple":"모두에게 공평한 옳은 대우.","whenToUse":"법·사회·인권의 공정함을 말할 때."},"krDetail":[{"ko":"정의","explain":"옳고 공정한 것을 지키는 원칙"},{"ko":"사법","explain":"법에 따라 판결하는 국가 기능"}],"usageExamples":[{"en":"The people demanded justice for the victims.","ko":"사람들은 피해자를 위한 정의를 요구했다."},{"en":"Justice must be applied equally to all.","ko":"정의는 모두에게 똑같이 적용되어야 한다."}],"grammarNote":"justice는 불가산명사로 관사 없이 쓰이고 복수형이 없다. 학생들이 'a justice'나 'justices'로 잘못 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The activists fought _____ justice _____ they finally won the case.","ko":"그 활동가들은 정의를 위해 싸웠고 마침내 소송에서 이겼다.","answer":["for","until"],"hint":"전치사 + 접속사"},{"sentence":"Justice _____ not always easy _____ achieve in society.","ko":"정의는 사회에서 이루기가 언제나 쉬운 것은 아니다.","answer":["is","to"],"hint":"be동사 + to부정사"}]},
    {"id":"w03644","w":"judge","pos":["n","v"],"ph":"/dʒʌdʒ/","cefr":"B1","kr":["판사","판단하다"],"ex":[{"en":"Don't judge people by appearance.","ko":"외모로 사람을 판단하지 마라."}],"mnemonic":{"soundHint":"저지(=stop, 막다)","story":"잘잘못을 저지(stop)시키며 판단·판결을 내리는 사람 → 판사","hintConfidence":2},"pairs":{"buddyWords":[{"w":"evaluate","ko":"평가하다","reason":"동의어"},{"w":"verdict","ko":"평결","reason":"판사와 관련된 결과"},{"w":"court","ko":"법원","reason":"판사가 일하는 장소"}],"collocBest":[]},"nuance":{"koSimple":"옳고 그름을 가리는 사람·행동.","whenToUse":"법정 판사나 사람·상황을 평가할 때."},"krDetail":[{"ko":"판사","explain":"법정에서 사건을 판결하는 사람"},{"ko":"판단하다","explain":"옳고 그름이나 좋고 나쁨을 결정하다"}],"usageExamples":[{"en":"The judge sentenced him fairly.","ko":"판사는 그에게 공정하게 형을 선고했다."},{"en":"Don't judge people by their looks.","ko":"사람을 겉모습으로 판단하지 마라."}],"grammarNote":"judge는 동사로 쓰일 때 judge A by B(B로 A를 판단하다) 구조를 쓴다. 학생들이 by 대신 with나 from을 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"You should not judge a book _____ its cover _____ reading it first.","ko":"먼저 읽어보지 않고 책을 겉표지로 판단해서는 안 된다.","answer":["by","without"],"hint":"판단 기준 by + 전치사"},{"sentence":"The judge _____ appointed last year _____ known for her fairness.","ko":"작년에 임명된 그 판사는 공정함으로 유명하다.","answer":["who","is"],"hint":"관계대명사 + be동사"}]},
    {"id":"w03679","w":"kidney","pos":["n"],"ph":"/ˈkɪdni/","cefr":"B1","kr":["신장","콩팥"],"ex":[{"en":"The kidneys filter blood in the body.","ko":"신장은 체내 혈액을 걸러낸다."}],"mnemonic":{"soundHint":"'키드니(kid둘)'","story":"두(kid+ny) 개가 짝을 이룬 콩팥 → 신장","hintConfidence":1},"pairs":{"buddyWords":[{"w":"organ","ko":"장기","reason":"상위 개념"},{"w":"liver","ko":"간","reason":"함께 언급되는 장기"},{"w":"dialysis","ko":"투석","reason":"신장 질환 시 받는 치료"}],"collocBest":[]},"nuance":{"koSimple":"허리 옆에서 피를 걸러내는 콩 모양 장기.","whenToUse":"의학·건강·장기 이식 이야기에."},"krDetail":[{"ko":"신장","explain":"몸속 노폐물을 걸러내는 장기"},{"ko":"콩팥","explain":"허리 뒤쪽에 있는 두 개의 장기"}],"usageExamples":[{"en":"The doctor examined his kidney carefully.","ko":"의사는 그의 신장을 주의 깊게 검사했다."},{"en":"Drinking water helps your kidneys work.","ko":"물을 마시는 것은 신장이 일하도록 돕는다."}],"grammarNote":"kidney는 가산명사로 사람마다 두 개 있으므로 흔히 복수형 kidneys로 쓴다. 학생들이 '신장'을 하나로 여겨 단수로만 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"Both of his kidneys _____ working properly _____ the successful operation.","ko":"그의 신장 둘 다 성공적인 수술 후에 잘 기능하고 있다.","answer":["are","after"],"hint":"복수 주어 + be동사 + 전치사"},{"sentence":"Kidney disease _____ often caused _____ high blood pressure and diabetes.","ko":"신장 질환은 종종 고혈압과 당뇨에 의해 유발된다.","answer":["is","by"],"hint":"수동태 + 행위자 by"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
