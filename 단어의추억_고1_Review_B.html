<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review B</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}

  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;

      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),

    position:absolute;inset:0;pointer-events:none;

    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;

    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }

  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}

  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}

  @keyframes shake{

  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

  .rainbow-overlay{

  }

  /* ---------- HIDE ---------- */
  .hidden{display:none !important;}

  /* ---------- MOBILE TUNING ---------- */
  @media (max-width:380px){
    .face.front .word{font-size:54px;}

  }

</style>

    {"id":"w01892","w":"dreadful","pos":["adj"],"ph":"/ˈdredfəl/","cefr":"B1","kr":["끔찍한","무서운"],"ex":[{"en":"The accident was absolutely dreadful.","ko":"그 사고는 정말 끔찍했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"terrible","ko":"끔찍한","reason":"dreadful의 대표 동의어"},{"w":"horrible","ko":"무서운","reason":"dreadful과 강도·의미 유사"},{"w":"pleasant","ko":"즐거운","reason":"dreadful의 반의어"}],"collocBest":[{"en":"dreadful news","ko":"끔찍한 소식"},{"en":"look dreadful","ko":"끔찍하게 보이다"}]},"nuance":{"koSimple":"소름 돋게 끔찍한.","whenToUse":"사고·소식이 너무 나쁠 때."},"krDetail":[{"ko":"끔찍한","explain":"매우 나쁘거나 소름 끼치는"},{"ko":"무서운","explain":"두려운 느낌이 드는"}],"usageExamples":[{"en":"The dreadful news shocked everyone in the small village.","ko":"그 끔찍한 소식은 작은 마을 사람들 모두를 충격에 빠뜨렸다."},{"en":"She felt dreadful after hearing about the terrible accident.","ko":"그녀는 그 끔찍한 사고 소식을 듣고 기분이 아주 안 좋았다."}],"grammarNote":"dreadful은 형용사입니다. 명사 dread(공포)에서 파생되었으며, 유사 어미 -ful(가득 찬)이 붙어 '공포로 가득 찬 → 끔찍한'이 됩니다.","grammarQuiz":[{"sentence":"The children had a _____ time _____ the storm was raging outside.","ko":"폭풍이 밖에서 몰아치는 동안 아이들은 끔찍한 시간을 보냈다.","answer":["dreadful","while"],"hint":"형용사 + 시간 접속사"}]},

    {"id":"w01885","w":"drain","pos":["v","n"],"ph":"/dreɪn/","cefr":"B1","kr":["배수하다","하수구"],"ex":[{"en":"The water drained very slowly.","ko":"물이 매우 천천히 빠졌다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"empty","ko":"비우다","reason":"drain(배수하다)의 동의어"},{"w":"exhaust","ko":"고갈시키다","reason":"drain resources의 비유적 짝"},{"w":"fill","ko":"채우다","reason":"drain(비우다)의 반의어"}],"collocBest":[{"en":"brain drain","ko":"두뇌 유출"},{"en":"drain resources","ko":"자원을 소모하다"}]},"nuance":{"koSimple":"물을 빼거나 다 흘려보내다.","whenToUse":"싱크대·수영장 물을 뺄 때."},"krDetail":[{"ko":"배수하다","explain":"고인 물을 빼서 없애다"},{"ko":"하수구","explain":"쓴 물이나 빗물이 흘러가는 통로"}],"usageExamples":[{"en":"The farmer drains the field after every heavy rain.","ko":"그 농부는 폭우가 올 때마다 논에서 물을 뺀다."},{"en":"The battery is quickly drained by playing games all night.","ko":"배터리는 밤새 게임을 하면 빠르게 소모된다."}],"grammarNote":"drain은 자·타동사 겸용입니다. 타동사로 'drain A(A를 비우다)', 자동사로 'the color drained from her face(그녀의 얼굴에서 핏기가 가셨다)'처럼 씁니다.","grammarQuiz":[{"sentence":"The long journey completely _____ him _____ energy and hope.","ko":"긴 여정은 그에게서 완전히 힘과 희망을 빼앗았다.","answer":["drained","of"],"hint":"과거형 타동사 + 전치사 of"}]},

    {"id":"w01974","w":"effect","pos":["n","v"],"ph":"/ɪˈfɛkt/","cefr":"B1","kr":["효과","영향"],"ex":[{"en":"The drug has side effects.","ko":"그 약은 부작용이 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"cause","ko":"원인","reason":"effect(결과/효과)의 반의 짝(cause-effect)"},{"w":"impact","ko":"영향","reason":"effect의 동의어"},{"w":"result","ko":"결과","reason":"effect의 동의어"}],"collocBest":[{"en":"side effect","ko":"부작용"},{"en":"take effect","ko":"효력을 발휘하다"}]},"nuance":{"koSimple":"어떤 일이 일으킨 결과나 영향.","whenToUse":"약·정책·행동의 결과를 말할 때."},"krDetail":[{"ko":"효과","explain":"어떤 일이 미치는 결과나 성과"},{"ko":"영향","explain":"다른 것에 미치는 힘이나 작용"}],"usageExamples":[{"en":"This medicine has an immediate effect on my headache.","ko":"이 약은 나의 두통에 즉각적인 효과가 있다."},{"en":"Air pollution has a bad effect on people's health.","ko":"대기 오염은 사람들의 건강에 나쁜 영향을 미친다."}],"grammarNote":"effect(명사, 결과)와 affect(동사, ~에 영향을 미치다)를 반드시 구분하세요. 시험 단골 함정입니다. 예: Rain affects the road(비가 도로에 영향을 준다) / Rain has an effect on the road.","grammarQuiz":[{"sentence":"Climate change has a serious _____ _____ our environment today.","ko":"기후 변화는 오늘날 우리 환경에 심각한 영향을 미친다.","answer":["effect","on"],"hint":"명사(affect 아님) + 대상 전치사"}]},

    {"id":"w01987","w":"elder","pos":["n","adj"],"ph":"/ˈeldər/","cefr":"B1","kr":["연장자","손위의"],"ex":[{"en":"We should respect our elders and their wisdom.","ko":"우리는 연장자와 그들의 지혜를 존중해야 한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"senior","ko":"연장자","reason":"elder의 대표 동의어"},{"w":"younger","ko":"더 어린","reason":"elder(손위의)의 반의어"},{"w":"sibling","ko":"형제자매","reason":"elder sibling 필수 콜로케이션 짝"}],"collocBest":[{"en":"village elder","ko":"마을 장로"},{"en":"elder sibling","ko":"형/언니"}]},"nuance":{"koSimple":"나이가 위인 사람, 손위의.","whenToUse":"연장자·장로를 말할 때."},"krDetail":[{"ko":"연장자","explain":"나이가 더 많은 사람"},{"ko":"손위의","explain":"나이가 더 위인"}],"usageExamples":[{"en":"You should always respect the elders in your family.","ko":"너는 가족 내 어른들을 항상 존경해야 한다."},{"en":"My elder brother teaches at a nearby middle school now.","ko":"나의 형은 지금 근처 중학교에서 가르치고 있다."}],"grammarNote":"elder는 가족 관계(형, 언니)에 주로 쓰이는 형용사이며, older는 일반적 비교급입니다. elder는 서술적 용법(He is elder)에는 쓸 수 없고, older만 가능합니다.","grammarQuiz":[{"sentence":"My _____ sister _____ five years older than me.","ko":"나의 언니는 나보다 다섯 살 위이다.","answer":["elder","is"],"hint":"형용사(가족 관계) + be동사"}]},
    {"id":"w01989","w":"elect","pos":["v"],"ph":"/ɪˈlɛkt/","cefr":"B1","kr":["선출하다","선거하다"],"ex":[{"en":"Citizens elect their leaders.","ko":"시민들은 지도자를 선출한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"vote","ko":"투표하다","reason":"elect의 핵심 방법, 필수 짝"},{"w":"choose","ko":"선택하다","reason":"elect의 동의어"},{"w":"president","ko":"대통령","reason":"elect a president 필수 콜로케이션 짝"}],"collocBest":[{"en":"elect a president","ko":"대통령을 선출하다"},{"en":"elect by vote","ko":"투표로 선출하다"}]},"nuance":{"koSimple":"투표로 뽑다.","whenToUse":"대통령·대표를 선출할 때."},"krDetail":[{"ko":"선출하다","explain":"여럿 가운데서 뽑아 정하다"},{"ko":"선거하다","explain":"투표로 대표를 뽑다"}],"usageExamples":[{"en":"The students elected Tom as their class president this year.","ko":"학생들은 올해 톰을 학급 회장으로 선출했다."},{"en":"She was elected mayor by a huge majority of votes.","ko":"그녀는 압도적 다수의 표로 시장에 선출되었다."}],"grammarNote":"elect는 5형식 동사로 'elect A (as/to be) B(A를 B로 선출하다)' 구조를 씁니다. 수동태에서는 'A was elected B' 형태로 as가 자주 생략됩니다.","grammarQuiz":[{"sentence":"He was _____ _____ the leader of the student council last month.","ko":"그는 지난달 학생회 대표로 선출되었다.","answer":["elected","as"],"hint":"수동태 과거분사 + 자격 전치사(생략 가능)"}]},
    {"id":"w01872","w":"dose","pos":["n"],"ph":"/doʊs/","cefr":"B1","kr":["복용량","분량"],"ex":[{"en":"Take one dose twice daily.","ko":"하루 두 번 한 번에 복용하세요."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"medicine","ko":"약","reason":"daily dose of medicine 필수 콜로케이션 짝"},{"w":"amount","ko":"양","reason":"dose의 기본 의미(정해진 양)와 동의"},{"w":"prescription","ko":"처방전","reason":"약 복용량 시나리오의 핵심 개념"}],"collocBest":[{"en":"daily dose","ko":"일일 복용량"},{"en":"lethal dose","ko":"치사량"}]},"nuance":{"koSimple":"한 번에 먹거나 쓰는 정해진 양.","whenToUse":"약 복용량·주사량을 말할 때."},"krDetail":[{"ko":"복용량","explain":"약을 한 번에 먹거나 정해진 기간 동안 먹는 양"},{"ko":"분량","explain":"어떤 것의 양이나 크기"}],"usageExamples":[{"en":"The doctor prescribed a low dose of medicine for me.","ko":"의사는 나에게 저용량의 약을 처방했다."},{"en":"A small dose of humor makes a difficult day easier.","ko":"약간의 유머는 힘든 하루를 더 쉽게 만든다."}],"grammarNote":"dose는 가산명사로 a dose of + 명사 형태로 자주 쓰입니다. 동음이의어 doze(졸다)와 발음·의미 혼동에 주의하세요.","grammarQuiz":[{"sentence":"Taking the correct _____ _____ this medicine is very important for recovery.","ko":"이 약의 정확한 복용량을 지키는 것은 회복에 매우 중요하다.","answer":["dose","of"],"hint":"명사 + 전치사 of"}]},
    {"id":"w01880","w":"doze","pos":["v","n"],"ph":"/dəʊz/","cefr":"B1","kr":["졸다","선잠"],"ex":[{"en":"He dozed off during the lecture.","ko":"그는 강의 중에 깜박 졸았다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"nap","ko":"낮잠","reason":"doze의 대표 동의어"},{"w":"sleep","ko":"자다","reason":"졸음 시나리오의 상위 개념"},{"w":"awake","ko":"깨어 있는","reason":"doze(선잠)의 반대 상태"}],"collocBest":[{"en":"doze off","ko":"깜박 졸다"},{"en":"take a doze","ko":"선잠을 자다"}]},"nuance":{"koSimple":"잠깐 얕게 자다, 선잠.","whenToUse":"수업·강의 중 깜박 졸 때."},"krDetail":[{"ko":"졸다","explain":"잠깐 잠이 들다"},{"ko":"선잠","explain":"깊이 들지 못한 잠"}],"usageExamples":[{"en":"Grandfather often dozes in his armchair after lunch.","ko":"할아버지는 점심 후 안락의자에서 자주 조신다."},{"en":"The old dog was dozing peacefully in the warm sunshine.","ko":"늙은 개는 따뜻한 햇볕에서 평화롭게 졸고 있었다."}],"grammarNote":"doze는 주로 자동사로 쓰이며 목적어를 취하지 않습니다. 'doze off(깜박 잠들다)' 구동사 형태가 매우 흔합니다. dose(복용량)와 철자·발음 혼동 주의.","grammarQuiz":[{"sentence":"I began to _____ _____ during the boring math class yesterday.","ko":"나는 어제 지루한 수학 수업 중에 깜박 졸기 시작했다.","answer":["doze","off"],"hint":"동사 + 부사 (구동사)"}]},
    {"id":"w01912","w":"dull","pos":["adj"],"ph":"/dʌl/","cefr":"B1","kr":["지루한","흐릿한"],"ex":[{"en":"It was a very dull speech.","ko":"그것은 매우 지루한 연설이었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"boring","ko":"지루한","reason":"dull의 대표 동의어"},{"w":"exciting","ko":"흥미진진한","reason":"dull(지루한)의 반의어"},{"w":"bright","ko":"밝은","reason":"dull(흐릿한)의 반의어"}],"collocBest":[{"en":"dull day","ko":"지루한 날"},{"en":"dull pain","ko":"둔한 통증"}]},"nuance":{"koSimple":"재미없고 지루한, 또는 흐릿한.","whenToUse":"지루한 연설·흐린 날씨를 말할 때."},"krDetail":[{"ko":"지루한","explain":"재미없어 시간이 길게 느껴지는"},{"ko":"흐릿한","explain":"밝지 않고 어두운 듯한"}],"usageExamples":[{"en":"The teacher's long speech made the students feel very dull.","ko":"선생님의 긴 연설은 학생들을 매우 지루하게 만들었다."},{"en":"The sky looked dull and gray before the heavy rain.","ko":"폭우가 오기 전에 하늘은 흐릿하고 회색으로 보였다."}],"grammarNote":"dull은 형용사이며 '지루한(=boring), 무딘, 흐릿한' 여러 의미가 있습니다. 감각동사(look, sound, feel) 뒤 보어로 자주 쓰입니다.","grammarQuiz":[{"sentence":"The movie was so _____ _____ half the audience fell asleep.","ko":"그 영화는 너무 지루해서 관객의 절반이 잠들었다.","answer":["dull","that"],"hint":"so ~ that 구문"}]},
    {"id":"w01924","w":"dye","pos":["n","v"],"ph":"/daɪ/","cefr":"B1","kr":["염료","염색하다"],"ex":[{"en":"She dyed her hair red.","ko":"그녀는 머리카락을 빨간색으로 염색했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"color","ko":"색을 입히다","reason":"dye의 동의어(염색)"},{"w":"hair","ko":"머리카락","reason":"hair dye 필수 콜로케이션 짝"},{"w":"fabric","ko":"천, 옷감","reason":"dye fabric 콜로케이션 짝"}],"collocBest":[{"en":"hair dye","ko":"헤어 염색약"},{"en":"dye fabric","ko":"천을 염색하다"}]},"nuance":{"koSimple":"천·머리카락에 색을 입히는 물감.","whenToUse":"머리 염색·천 물들이기를 말할 때."},"krDetail":[{"ko":"염료","explain":"천이나 실에 색을 물들이는 물질"},{"ko":"염색하다","explain":"천이나 머리카락에 색을 물들이다"}],"usageExamples":[{"en":"She dyed her long hair a bright red color.","ko":"그녀는 자신의 긴 머리를 밝은 빨간색으로 염색했다."},{"en":"The old fabric was dyed with a natural plant extract.","ko":"그 낡은 천은 천연 식물 추출물로 염색되었다."}],"grammarNote":"dye는 die(죽다)와 발음이 같아 혼동됩니다. dye의 -ing형은 dyeing, die의 -ing형은 dying으로 철자가 다릅니다.","grammarQuiz":[{"sentence":"She spent the afternoon _____ old T-shirts _____ blue and green.","ko":"그녀는 낡은 티셔츠를 파랑과 초록으로 염색하며 오후를 보냈다.","answer":["dyeing","in"],"hint":"-ing 형태(dying 아님) + 색 전치사"}]},
    {"id":"w01942","w":"ease","pos":["n","v"],"ph":"/iːz/","cefr":"B1","kr":["편안함","완화하다"],"ex":[{"en":"She solved it with ease.","ko":"그녀는 쉽게 그것을 해결했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"comfort","ko":"편안함","reason":"ease의 대표 동의어"},{"w":"relieve","ko":"완화시키다","reason":"ease(v)의 동의어"},{"w":"difficulty","ko":"어려움","reason":"ease(편안함)의 반의어"}],"collocBest":[{"en":"at ease","ko":"편안한"},{"en":"ease tension","ko":"긴장을 완화하다"}]},"nuance":{"koSimple":"편안함, 또는 힘들지 않게 해주다.","whenToUse":"통증·긴장을 덜어줄 때."},"krDetail":[{"ko":"편안함","explain":"몸이나 마음이 편하고 좋음"},{"ko":"완화하다","explain":"심하지 않게 부드럽게 하다"}],"usageExamples":[{"en":"This medicine will ease the pain in your back.","ko":"이 약이 당신의 등 통증을 완화시켜 줄 것이다."},{"en":"Her worries were eased by her friend's kind words.","ko":"그녀의 걱정은 친구의 다정한 말로 완화되었다."}],"grammarNote":"ease는 명사와 동사 모두 쓰입니다. 'with ease(쉽게)', 'at ease(편안하게)' 관용구를 기억하세요. easy(형용사), easily(부사)와 어원이 같습니다.","grammarQuiz":[{"sentence":"He solved the difficult math problem _____ _____ during the exam.","ko":"그는 시험 중에 어려운 수학 문제를 쉽게 풀었다.","answer":["with","ease"],"hint":"전치사 + 명사 (관용구=easily)"}]},
    {"id":"w01990","w":"election","pos":["n"],"ph":"/ɪˈlɛkʃən/","cefr":"B1","kr":["선거","선출"],"ex":[{"en":"The election results were surprising.","ko":"선거 결과는 놀라웠다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"vote","ko":"투표","reason":"선거는 투표로 이루어짐 (동의)"},{"w":"campaign","ko":"선거 운동","reason":"선거 시나리오 핵심어"},{"w":"candidate","ko":"후보","reason":"선거에는 후보가 등장 (시나리오)"}],"collocBest":[{"en":"general election","ko":"총선"},{"en":"election campaign","ko":"선거 운동"}]},"nuance":{"koSimple":"국민이 투표로 대표를 뽑는 일.","whenToUse":"대통령·국회의원 등 공식 선거를 말할 때."},"krDetail":[{"ko":"뽑기","explain":"여러 후보 중에서 대표를 골라 뽑는 일"},{"ko":"가려뽑음","explain":"투표로 어떤 자리에 앉을 사람을 정하는 절차"}],"usageExamples":[{"en":"The party will hold an election next month.","ko":"그 정당은 다음 달에 선거를 치를 것이다."},{"en":"A new president was elected by a wide margin.","ko":"새 대통령이 큰 표차로 선출되었다."}],"grammarNote":"명사 election은 동사 elect와 짝을 이룬다. '선거하다'는 hold an election, '선출되다'는 be elected로 표현하며, 명사와 동사를 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The general _____ will _____ held in November across the country.","ko":"총선이 11월에 전국에서 치러질 것이다.","answer":["election","be"],"hint":"명사 형태와 미래 수동태 조동사"}]},
    {"id":"w01993","w":"electrical","pos":["adj"],"ph":"/ɪˈlektrɪkl/","cefr":"B1","kr":["전기의","전기적인"],"ex":[{"en":"There was an electrical fault in the building.","ko":"건물에 전기 결함이 있었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"electric","ko":"전기의","reason":"거의 동의어"},{"w":"current","ko":"전류","reason":"전기 관련 시나리오"},{"w":"wire","ko":"전선","reason":"전기 시나리오 핵심어"}],"collocBest":[{"en":"electrical engineer","ko":"전기 기사"},{"en":"electrical appliance","ko":"전기 기구"}]},"nuance":{"koSimple":"전기로 움직이거나 전기와 관련된.","whenToUse":"전선·회로·전기 설비 이야기할 때."},"krDetail":[{"ko":"전기와 관련된","explain":"전기를 쓰거나 다루는 장치·일에 관한"},{"ko":"전기로 움직이는","explain":"전류를 사용하여 작동하는 성질의"}],"usageExamples":[{"en":"He fixes electrical appliances at the shop.","ko":"그는 가게에서 전기 제품을 수리한다."},{"en":"The building was damaged by an electrical fire.","ko":"그 건물은 전기 화재로 손상되었다."}],"grammarNote":"electrical은 '전기와 관련된(engineer, appliance)'의 넓은 의미, electric은 '전기로 작동하는(car, guitar)'의 좁은 의미로 쓰인다. electronic은 '전자 회로의(device)'로 구별한다.","grammarQuiz":[{"sentence":"The _____ engineer checked every wire _____ was hidden behind the wall.","ko":"그 전기 기사는 벽 뒤에 숨겨진 모든 배선을 점검했다.","answer":["electrical","that"],"hint":"형용사 + 관계대명사(주격)"}]},
    {"id":"w01996","w":"electronic","pos":["adj"],"ph":"/ɪˌlɛkˈtrɒnɪk/","cefr":"B1","kr":["전자의","전자기기의"],"ex":[{"en":"Electronic devices are everywhere.","ko":"전자기기는 어디에나 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"digital","ko":"디지털의","reason":"동의어 관계"},{"w":"device","ko":"기기","reason":"전자기기 시나리오"},{"w":"circuit","ko":"회로","reason":"전자 관련 핵심어"}],"collocBest":[{"en":"electronic device","ko":"전자기기"},{"en":"electronic mail","ko":"전자 우편"}]},"nuance":{"koSimple":"반도체·회로로 작동하는 전자기기의.","whenToUse":"스마트폰·컴퓨터 같은 전자기기 얘기할 때."},"krDetail":[{"ko":"전자로 움직이는","explain":"반도체·회로로 신호를 처리하는"},{"ko":"전자기기의","explain":"컴퓨터·휴대폰처럼 회로로 작동하는 기계에 관한"}],"usageExamples":[{"en":"She bought a new electronic device online.","ko":"그녀는 온라인으로 새 전자기기를 샀다."},{"en":"All the data is stored in an electronic format.","ko":"모든 자료는 전자적 형식으로 저장된다."}],"grammarNote":"electronic은 회로·디지털 기술을 강조하고, electrical은 전기 공급·배선을 강조한다. electronic mail = e-mail의 정식 표기라는 점을 기억하자.","grammarQuiz":[{"sentence":"Most students prefer _____ books _____ they can carry easily.","ko":"대부분의 학생들은 쉽게 들고 다닐 수 있는 전자책을 선호한다.","answer":["electronic","because"],"hint":"형용사 + 이유 접속사"}]},
    {"id":"w01999","w":"element","pos":["n"],"ph":"/ˈɛlɪmənt/","cefr":"B1","kr":["요소","원소"],"ex":[{"en":"Trust is a key element.","ko":"신뢰는 핵심 요소이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"component","ko":"구성 요소","reason":"동의어"},{"w":"factor","ko":"요인","reason":"동의어"},{"w":"compound","ko":"화합물","reason":"원소/화학 시나리오"}],"collocBest":[{"en":"key element","ko":"핵심 요소"},{"en":"chemical element","ko":"화학 원소"}]},"nuance":{"koSimple":"전체를 이루는 하나의 조각.","whenToUse":"핵심 요소나 화학 원소를 말할 때."},"krDetail":[{"ko":"구성 부분","explain":"어떤 것을 이루는 하나하나의 조각"},{"ko":"밑감","explain":"더 이상 나눌 수 없는 화학의 기본 물질"}],"usageExamples":[{"en":"Trust is a key element of any friendship.","ko":"신뢰는 어떤 우정에서든 핵심 요소이다."},{"en":"Hydrogen is the lightest element in the universe.","ko":"수소는 우주에서 가장 가벼운 원소이다."}],"grammarNote":"element는 셀 수 있는 명사이므로 관사 a(n)나 복수형이 필요하다. '~의 요소'라고 할 때 element of + 명사 구조를 쓴다.","grammarQuiz":[{"sentence":"Water is made up _____ two _____ , hydrogen and oxygen.","ko":"물은 두 가지 원소, 수소와 산소로 이루어져 있다.","answer":["of","elements"],"hint":"구동사 전치사 + 복수 명사"}]},
    {"id":"w02000","w":"elementary","pos":["adj"],"ph":"/ˌɛlɪˈmɛntəri/","cefr":"B1","kr":["기본적인","초등의"],"ex":[{"en":"This is an elementary concept.","ko":"이것은 기본적인 개념이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"basic","ko":"기본의","reason":"동의어"},{"w":"advanced","ko":"고급의","reason":"반의어"},{"w":"primary","ko":"초등의","reason":"학교급 관련 동의어"}],"collocBest":[{"en":"elementary school","ko":"초등학교"},{"en":"elementary level","ko":"초급 수준"}]},"nuance":{"koSimple":"기초 단계의, 아주 기본적인.","whenToUse":"초등학교·기초 수준 개념을 말할 때."},"krDetail":[{"ko":"가장 기초의","explain":"처음 배워야 할 가장 쉬운 단계의"},{"ko":"초등학교의","explain":"만 6세부터 다니는 학교에 관한"}],"usageExamples":[{"en":"The teacher explained an elementary rule of grammar.","ko":"선생님은 문법의 기본 규칙을 설명했다."},{"en":"My sister still goes to elementary school.","ko":"내 여동생은 아직 초등학교에 다닌다."}],"grammarNote":"elementary는 명사 앞에서 형용사로만 쓰이며, 서술적 용법(be elementary)은 '아주 쉽다'는 관용 표현으로 제한된다. 부사형은 없다.","grammarQuiz":[{"sentence":"This problem is so _____ _____ even a child can solve it.","ko":"이 문제는 매우 기초적이라 어린아이도 풀 수 있다.","answer":["elementary","that"],"hint":"so ~ that 구문"}]},
    {"id":"w02018","w":"embarrass","pos":["v"],"ph":"/ɪmˈbærəs/","cefr":"B1","kr":["당황하게 하다","창피를 주다"],"ex":[{"en":"Don't embarrass me in public.","ko":"공공장소에서 나를 창피 주지 마세요."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"humiliate","ko":"굴욕감을 주다","reason":"동의어"},{"w":"shame","ko":"창피","reason":"동의어"},{"w":"blush","ko":"얼굴 붉히다","reason":"당황 반응 시나리오"}],"collocBest":[{"en":"feel embarrassed","ko":"창피함을 느끼다"},{"en":"embarrassing moment","ko":"당황스러운 순간"}]},"nuance":{"koSimple":"얼굴이 빨개질 만큼 창피하게 만들다.","whenToUse":"남 앞에서 부끄럽게 할 때."},"krDetail":[{"ko":"부끄럽게 만들다","explain":"남 앞에서 얼굴이 붉어질 만한 상황에 놓이게 하다"},{"ko":"면목이 없게 하다","explain":"체면을 잃을 만한 실수를 겪게 하다"}],"usageExamples":[{"en":"His silly question embarrassed the whole class.","ko":"그의 엉뚱한 질문이 반 전체를 당황하게 했다."},{"en":"She was embarrassed by the sudden compliment.","ko":"그녀는 갑작스러운 칭찬에 부끄러워졌다."}],"grammarNote":"embarrass는 타동사이므로 사람이 주어일 때 흔히 be embarrassed by/at 형태의 수동태로 쓴다. 감정 형용사 embarrassed(사람이 부끄러운) vs embarrassing(상황이 부끄러운)을 구별한다.","grammarQuiz":[{"sentence":"I was really _____ _____ my father sang loudly at the restaurant.","ko":"아버지가 식당에서 큰 소리로 노래하셨을 때 나는 정말 부끄러웠다.","answer":["embarrassed","when"],"hint":"감정 수동태 + 시간 접속사"}]},
    {"id":"w02028","w":"emergency","pos":["n","adj"],"ph":"/ɪˈmɜːrdʒənsi/","cefr":"B1","kr":["비상사태","긴급 상황"],"ex":[{"en":"Call 119 in an emergency.","ko":"비상사태에는 119에 전화하세요."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"crisis","ko":"위기","reason":"동의어"},{"w":"urgent","ko":"긴급한","reason":"긴급 시나리오"},{"w":"ambulance","ko":"구급차","reason":"응급 시나리오 핵심어"}],"collocBest":[{"en":"emergency exit","ko":"비상구"},{"en":"emergency room","ko":"응급실"}]},"nuance":{"koSimple":"당장 대응해야 할 급한 상황.","whenToUse":"119 부르는 위급 상황 말할 때."},"krDetail":[{"ko":"매우 급한 일","explain":"곧바로 대처해야 하는 위험한 상황"},{"ko":"빠른 도움이 필요한 때","explain":"다치거나 사고가 나서 즉시 손을 써야 하는 순간"}],"usageExamples":[{"en":"The nurse handled the emergency very calmly.","ko":"간호사는 응급 상황을 매우 침착하게 처리했다."},{"en":"In an emergency, dial 119 immediately.","ko":"비상시에는 즉시 119번을 눌러라."}],"grammarNote":"emergency는 명사와 형용사로 모두 쓰인다. 형용사로 쓸 때는 emergency exit, emergency room처럼 뒤 명사를 수식하며 복수형 -s를 붙이지 않는다.","grammarQuiz":[{"sentence":"Please use the _____ exit _____ case of fire.","ko":"화재 시에는 비상구를 이용하세요.","answer":["emergency","in"],"hint":"형용사적 용법 + 조건 전치사구"}]},
    {"id":"w02033","w":"emotion","pos":["n"],"ph":"/ɪˈmoʊʃən/","cefr":"B1","kr":["감정","정서"],"ex":[{"en":"She hid her emotions well.","ko":"그녀는 감정을 잘 숨겼다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"feeling","ko":"감정","reason":"동의어"},{"w":"sentiment","ko":"정서","reason":"동의어"},{"w":"reason","ko":"이성","reason":"감정 vs 이성 반의 관계"}],"collocBest":[{"en":"express emotion","ko":"감정을 표현하다"},{"en":"mixed emotions","ko":"복잡한 감정"}]},"nuance":{"koSimple":"기쁨·슬픔 같은 마음의 움직임.","whenToUse":"느낌·기분 전반을 이야기할 때."},"krDetail":[{"ko":"느낌","explain":"기쁨·슬픔·화남처럼 마음속에서 일어나는 반응"},{"ko":"마음결","explain":"겉으로 드러나는 사람의 기분 상태"}],"usageExamples":[{"en":"The actor showed strong emotion in the scene.","ko":"그 배우는 그 장면에서 강한 감정을 드러냈다."},{"en":"Her voice was filled with mixed emotions.","ko":"그녀의 목소리는 복잡한 감정으로 가득 차 있었다."}],"grammarNote":"emotion은 셀 수 있는 명사와 셀 수 없는 명사로 모두 쓰인다. 특정한 감정을 셀 때는 mixed emotions처럼 복수형을, 감정 일반을 말할 때는 without emotion처럼 관사 없이 쓴다.","grammarQuiz":[{"sentence":"He tried to hide his _____ , but his eyes _____ full of tears.","ko":"그는 감정을 숨기려 했지만 그의 눈은 눈물로 가득했다.","answer":["emotion","were"],"hint":"명사 + 과거 be동사(복수 주어)"}]},
    {"id":"w02034","w":"emotional","pos":["adj"],"ph":"/ɪˈmoʊʃənəl/","cefr":"B1","kr":["감정적인","정서적인"],"ex":[{"en":"She gave an emotional speech.","ko":"그녀는 감동적인 연설을 했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"sensitive","ko":"예민한","reason":"동의어"},{"w":"rational","ko":"이성적인","reason":"반의어"},{"w":"tearful","ko":"눈물 어린","reason":"감정 표출 시나리오"}],"collocBest":[{"en":"emotional support","ko":"정서적 지원"},{"en":"emotional response","ko":"감정적 반응"}]},"nuance":{"koSimple":"감정이 많이 담긴, 마음이 흔들리는.","whenToUse":"울컥한 순간이나 감동적 장면."},"krDetail":[{"ko":"마음이 크게 움직이는","explain":"느낌이 격해져서 눈물이나 목소리에 드러나는"},{"ko":"감정 위주의","explain":"이성보다 마음의 흐름에 크게 좌우되는"}],"usageExamples":[{"en":"The movie tells an emotional story of a lost dog.","ko":"그 영화는 잃어버린 개에 관한 감동적인 이야기를 담고 있다."},{"en":"She became very emotional when she read the letter.","ko":"그녀는 편지를 읽고 매우 감정적이 되었다."}],"grammarNote":"emotional은 사람과 사물 모두를 수식할 수 있다. get/become emotional은 감정이 북받쳐 오른다는 뜻으로, be emotional(성격이 감정적이다)과 뉘앙스가 다르다.","grammarQuiz":[{"sentence":"The song was so _____ _____ many audiences cried.","ko":"그 노래는 너무나 감동적이어서 많은 관객이 울었다.","answer":["emotional","that"],"hint":"so + 형용사 + that 구문"}]},
    {"id":"w02044","w":"employer","pos":["n"],"ph":"/ɪmˈplɔɪər/","cefr":"B1","kr":["고용주","사용자"],"ex":[{"en":"My employer is very supportive.","ko":"내 고용주는 매우 지지적이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"boss","ko":"상사","reason":"동의어"},{"w":"employee","ko":"직원","reason":"반의어"},{"w":"salary","ko":"급여","reason":"고용주-직원 시나리오"}],"collocBest":[{"en":"potential employer","ko":"잠재적 고용주"},{"en":"employer requirements","ko":"고용주 요건"}]},"nuance":{"koSimple":"일을 시키고 월급을 주는 사람·회사.","whenToUse":"직장인의 회사·사장을 말할 때."},"krDetail":[{"ko":"일자리를 주는 사람","explain":"직원을 뽑아 임금을 지급하는 사장이나 회사"},{"ko":"일을 시키는 쪽","explain":"노동자에게 업무를 맡기고 관리하는 위치"}],"usageExamples":[{"en":"Her employer offered her a big bonus this year.","ko":"그녀의 고용주는 올해 그녀에게 큰 상여금을 주었다."},{"en":"Good employers listen to their employees carefully.","ko":"좋은 고용주는 직원들의 말을 주의 깊게 듣는다."}],"grammarNote":"employer(-er, 행위 주체)와 employee(-ee, 행위 대상)의 접미사 대비를 명확히 기억한다. -er/-ee 접미사는 interviewer/interviewee, trainer/trainee에도 동일하게 적용된다.","grammarQuiz":[{"sentence":"The _____ decided _____ raise the salaries of all employees.","ko":"그 고용주는 모든 직원의 임금을 인상하기로 결정했다.","answer":["employer","to"],"hint":"명사 + to부정사"}]},
    {"id":"w02045","w":"employment","pos":["n"],"ph":"/ɪmˈplɔɪmənt/","cefr":"B1","kr":["고용","취업"],"ex":[{"en":"Employment rates are rising.","ko":"고용률이 상승하고 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"job","ko":"직업","reason":"동의어"},{"w":"unemployment","ko":"실업","reason":"반의어"},{"w":"career","ko":"경력","reason":"취업 시나리오"}],"collocBest":[{"en":"full employment","ko":"완전 고용"},{"en":"employment rate","ko":"고용률"}]},"nuance":{"koSimple":"돈 받으며 일하는 상태.","whenToUse":"취업률·일자리 이야기할 때."},"krDetail":[{"ko":"일자리를 얻어 일함","explain":"돈을 받고 회사나 기관에서 일하는 상태"},{"ko":"쓰임","explain":"어떤 사람·물건이 실제로 활용되는 것"}],"usageExamples":[{"en":"The new law will create more employment.","ko":"새 법안은 더 많은 일자리를 창출할 것이다."},{"en":"Many young people are seeking stable employment.","ko":"많은 젊은이들이 안정된 일자리를 찾고 있다."}],"grammarNote":"employment는 셀 수 없는 명사가 원칙이므로 an employment로 쓰지 않는다. 반의어는 unemployment로 un-+명사 접두사 구조를 이룬다.","grammarQuiz":[{"sentence":"Full _____ is one of the goals _____ the government aims to achieve.","ko":"완전 고용은 정부가 달성하려는 목표 중 하나이다.","answer":["employment","that"],"hint":"명사 + 목적격 관계대명사"}]},
    {"id":"w02054","w":"encourage","pos":["v"],"ph":"/ɪnˈkɜːrɪdʒ/","cefr":"B1","kr":["격려하다","장려하다"],"ex":[{"en":"Teachers encourage their students.","ko":"교사들은 학생들을 격려한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"motivate","ko":"동기부여하다","reason":"동의어"},{"w":"discourage","ko":"낙담시키다","reason":"반의어"},{"w":"cheer","ko":"응원하다","reason":"격려 시나리오"}],"collocBest":[{"en":"encourage participation","ko":"참여를 장려하다"},{"en":"strongly encourage","ko":"강력히 권장하다"}]},"nuance":{"koSimple":"용기를 북돋아 해보라고 밀어주다.","whenToUse":"응원·격려로 힘 실어줄 때."},"krDetail":[{"ko":"북돋우다","explain":"잘하도록 옆에서 힘을 실어 주다"},{"ko":"밀어주다","explain":"어떤 행동을 계속 하도록 응원하고 지원하다"}],"usageExamples":[{"en":"Teachers encourage students to ask questions.","ko":"선생님들은 학생들에게 질문하도록 격려한다."},{"en":"Young readers are encouraged by kind reviews.","ko":"어린 독자들은 친절한 서평에 힘을 얻는다."}],"grammarNote":"encourage + 목적어 + to부정사 구조가 원칙이다. 목적어 없이 encourage doing 형태로 '어떤 행동을 장려하다'라는 뜻도 가능하지만, 5형식에서는 to부정사를 잊지 말자.","grammarQuiz":[{"sentence":"My parents _____ me _____ read books every night.","ko":"부모님은 내가 매일 밤 책을 읽도록 격려하신다.","answer":["encourage","to"],"hint":"5형식 동사 + to부정사"}]},
    {"id":"w02080","w":"enormous","pos":["adj"],"ph":"/ɪˈnɔːrməs/","cefr":"B1","kr":["거대한","엄청난"],"ex":[{"en":"The building was enormous.","ko":"그 건물은 거대했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"huge","ko":"거대한","reason":"동의어"},{"w":"massive","ko":"육중한","reason":"동의어"},{"w":"tiny","ko":"아주 작은","reason":"반의어"}],"collocBest":[{"en":"enormous size","ko":"엄청난 크기"},{"en":"enormous pressure","ko":"엄청난 압박"}]},"nuance":{"koSimple":"입이 벌어질 만큼 크고 엄청난.","whenToUse":"크기·양·정도가 어마어마할 때."},"krDetail":[{"ko":"어마어마하게 큰","explain":"보통을 크게 넘어설 정도의 규모나 정도의"},{"ko":"엄청난 양의","explain":"숫자나 정도가 예상 밖으로 매우 많은"}],"usageExamples":[{"en":"The whale released an enormous amount of water.","ko":"그 고래는 엄청난 양의 물을 뿜어냈다."},{"en":"He felt enormous pressure before the final match.","ko":"그는 결승전을 앞두고 엄청난 압박을 느꼈다."}],"grammarNote":"enormous는 형용사이며, 부사형은 enormously이다. much/very 강조는 어색하고 absolutely, truly, quite 등 절대 강조 부사를 함께 쓰는 것이 자연스럽다.","grammarQuiz":[{"sentence":"The project was _____ successful, _____ helped many people.","ko":"그 프로젝트는 엄청나게 성공적이었고 많은 사람들을 도왔다.","answer":["enormously","which"],"hint":"부사 + 계속적 용법 관계대명사"}]},

    {"id":"w02094","w":"entirely","pos":["adv"],"ph":"/ɪnˈtaɪərli/","cefr":"B1","kr":["완전히","전적으로"],"ex":[{"en":"I entirely agree with you.","ko":"나는 당신에게 전적으로 동의한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"completely","ko":"완전히","reason":"동의어"},{"w":"partially","ko":"부분적으로","reason":"반의어"},{"w":"totally","ko":"전적으로","reason":"동의어"}],"collocBest":[{"en":"entirely different","ko":"완전히 다른"},{"en":"entirely responsible","ko":"전적으로 책임이 있는"}]},"nuance":{"koSimple":"100% 완전히.","whenToUse":"부분이 아니라 전부라고 강조할 때."},"krDetail":[{"ko":"빠짐없이","explain":"부분이 아니라 전부를 다 그 자체로"},{"ko":"온통","explain":"어떤 상태가 다른 요소 없이 모두 그러함을 강조할 때"}],"usageExamples":[{"en":"The results were entirely different from ours.","ko":"결과는 우리 것과 완전히 달랐다."},{"en":"She is entirely responsible for the mistake.","ko":"그녀는 그 실수에 전적으로 책임이 있다."}],"grammarNote":"entirely는 형용사·과거분사를 강조하는 부사이다. 일반동사보다 be동사·조동사와 짝을 이루는 경우가 많으며 completely와 거의 같은 뜻이다.","grammarQuiz":[{"sentence":"The new theory is _____ based _____ recent scientific data.","ko":"그 새로운 이론은 전적으로 최신 과학 자료에 근거한다.","answer":["entirely","on"],"hint":"부사 + 전치사"}]},

    {"id":"w02225","w":"existence","pos":["n"],"ph":"/ɪɡˈzɪstəns/","cefr":"B1","kr":["존재","실재"],"ex":[{"en":"The existence of life is precious.","ko":"생명의 존재는 소중하다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"being","ko":"존재","reason":"동의어 - 존재 상태"},{"w":"presence","ko":"존재","reason":"동의어 - 있음의 상태"},{"w":"absence","ko":"부재","reason":"반의어 - 존재 vs 부재"}],"collocBest":[{"en":"human existence","ko":"인간의 존재"},{"en":"come into existence","ko":"생겨나다"}]},"nuance":{"koSimple":"어떤 것이 실제로 있음.","whenToUse":"생명·현상·개념이 존재한다는 사실을 논할 때."},"krDetail":[{"ko":"존재","explain":"실제로 있음"},{"ko":"실재","explain":"참으로 있음"}],"usageExamples":[{"en":"Scientists still question the existence of alien life.","ko":"과학자들은 여전히 외계 생명체의 존재를 의심한다."},{"en":"The old law is still in existence in some countries.","ko":"그 오래된 법은 일부 나라에서 여전히 존재한다."}],"grammarNote":"existence는 셀 수 없는 추상명사이므로 앞에 부정관사 an을 쓰지 않는다. come into existence (생겨나다), in existence (존재하는) 형태가 자주 쓰인다.","grammarQuiz":[{"sentence":"Many people believe in the _____ of ghosts and spirits.","ko":"많은 사람들이 유령과 영혼의 존재를 믿는다.","answer":["existence"],"hint":"the 뒤이므로 명사 형태"},{"sentence":"This ancient tradition still _____ in remote villages today.","ko":"이 오래된 전통은 오늘날에도 외딴 마을에서 여전히 존재한다.","answer":["exists"],"hint":"3인칭 단수 현재, 자동사(뒤에 목적어 없음)"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

   QUIZ (15문항)
   ============================================================ */
const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){
    promptHTML = `

        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>

    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">
        <button class="submit-btn" id="submitBtn">제출</button>

  } else if(mode === "colloc-write"){

    const hint = firstCharsHint(c.en);
    promptHTML = `
      <div class="quiz-prompt">

  } else if(mode === "cloze"){

    if(inputs[0]) setTimeout(()=>inputs[0].focus(), 100);
  } else {

    inp.addEventListener("keydown", e=>{

    });

    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
