<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review Test Lv16-18</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

    {"id":"w04181","w":"moderate","pos":["adj","v"],"ph":"/ˈmɒdərɪt/","cefr":"B1","kr":["보통의","온건한"],"ex":[{"en":"Exercise at a moderate pace.","ko":"적당한 속도로 운동해라."}],"mnemonic":{"soundHint":"모더릿 → 'mode(방식)레이트(비율)'","story":"mode(방식)를 지키는 = 극단이 아닌 보통, 온건한 = moderate.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"extreme","ko":"극단적인","reason":"반의 관계"},{"w":"mild","ko":"온화한","reason":"동의어 관계"},{"w":"exercise","ko":"운동","reason":"적당한 운동 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"너무 세지도 약하지도 않은.","whenToUse":"적당한 운동·소득 정도 표현할 때."},"krDetail":[{"ko":"보통의","explain":"너무 세거나 크지 않고 적당한"},{"ko":"온건한","explain":"극단으로 치우치지 않고 부드러운"}],"usageExamples":[{"en":"Doctors recommend moderate exercise for good health.","ko":"의사들은 건강을 위해 적당한 운동을 권장한다."},{"en":"His views were moderate, but his tone sounded quite aggressive.","ko":"그의 견해는 온건했지만 말투는 꽤 공격적으로 들렸다."}],"grammarNote":"moderate는 형용사(적당한)와 동사(진행하다·조절하다) 둘 다 있어. 발음도 다르지(형용사 /-ət/, 동사 /-eɪt/). 학생들은 동사 뜻을 자주 놓쳐.","grammarQuiz":[{"sentence":"The professor will _____ the debate to keep the discussion _____ and fair.","ko":"그 교수는 토론이 온건하고 공정하게 유지되도록 진행할 것이다.","answer":["moderate","moderate"],"hint":"동사 + 형용사 (같은 형태)"}]},
    {"id":"w04183","w":"modest","pos":["adj"],"ph":"/ˈmɒdɪst/","cefr":"B1","kr":["겸손한","보통의"],"ex":[{"en":"He was modest about success.","ko":"그는 성공에 대해 겸손했다."}],"mnemonic":{"soundHint":"모디스트 → mode(방식)+st(최상급)","story":"가장 절제된 mode = 겸손한! 자랑하지 않고 낮추는 태도.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"humble","ko":"겸손한","reason":"동의어 관계"},{"w":"arrogant","ko":"거만한","reason":"반의 관계"},{"w":"lifestyle","ko":"생활 방식","reason":"검소한 생활 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"잘난 척 없이 겸손한.","whenToUse":"성공했는데도 소박한 태도 말할 때."},"krDetail":[{"ko":"겸손한","explain":"자기를 낮추고 잘난 척하지 않는"},{"ko":"보통의","explain":"특별히 크거나 화려하지 않은"}],"usageExamples":[{"en":"Despite his success, he remains modest about his achievements.","ko":"성공에도 불구하고 그는 자신의 성취에 대해 겸손함을 유지한다."},{"en":"The house looked modest outside, but was luxurious inside.","ko":"그 집은 밖에서 보면 소박했지만 안은 화려했다."}],"grammarNote":"modest는 사람(겸손한), 집·소득(수수한) 등 다양한 대상에 쓰여. 학생들은 humble과 헷갈리기 쉬운데, modest가 더 중립적이고 격식적인 뉘앙스야.","grammarQuiz":[{"sentence":"Even after her _____ win, the athlete _____ modest in every interview.","ko":"큰 승리 후에도 그 선수는 모든 인터뷰에서 겸손함을 유지했다.","answer":["big","remained"],"hint":"형용사 + 동사 과거형"}]},
    {"id":"w03999","w":"manner","pos":["n"],"ph":"/ˈmænər/","cefr":"B1","kr":["방식","태도"],"ex":[{"en":"She spoke in a kind manner.","ko":"그녀는 친절한 방식으로 말했다."}],"mnemonic":{"soundHint":"'매너(외래어)'","story":"'매너가 좋다' → 방식, 태도, 예절","hintConfidence":3},"pairs":{"buddyWords":[{"w":"way","ko":"방식","reason":"동의어 - 방법·태도"},{"w":"style","ko":"스타일","reason":"동의어 - 방식·양식"},{"w":"table","ko":"식탁","reason":"콜로케이션 - table manners"}],"collocBest":[]},"nuance":{"koSimple":"일을 해내는 방식·태도.","whenToUse":"말하는 태도나 일하는 방식을 말할 때."},"krDetail":[{"ko":"방식","explain":"어떤 일을 해 나가는 정해진 틀이나 길"},{"ko":"태도","explain":"사람이 남을 대하거나 일을 대하는 몸가짐"}],"usageExamples":[{"en":"She solved the problem in a creative manner.","ko":"그녀는 창의적인 방식으로 그 문제를 해결했다."},{"en":"His polite manner impressed all the guests.","ko":"그의 공손한 태도는 모든 손님에게 좋은 인상을 주었다."}],"grammarNote":"manner(단수)는 '방식/태도'를, manners(복수)는 '예절'을 뜻하므로 뜻에 따라 단·복수가 달라진다. table manner(X) → table manners(O)처럼 예절 뜻에서는 반드시 복수형을 쓴다.","grammarQuiz":[{"sentence":"The child spoke in a very polite _____ and had excellent table _____ at every family dinner.","ko":"그 아이는 매우 공손한 태도로 말했고 모든 가족 식사에서 훌륭한 식사 예절을 지녔다.","answer":["manner","manners"],"hint":"단수 '태도'와 복수 '예절'"}]},
    {"id":"w04173","w":"mixture","pos":["n"],"ph":"/ˈmɪkstʃər/","cefr":"B1","kr":["혼합물","혼합"],"ex":[{"en":"It is a mixture of styles.","ko":"그것은 스타일들의 혼합이다."}],"mnemonic":{"soundHint":"믹스처 → mix(섞다) + ture","story":"mix(섞다) + ture = 섞인 것 = 혼합물! 믹서기(mixer)와 같은 어원.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mix","ko":"섞다","reason":"동일 어원 파생"},{"w":"blend","ko":"혼합","reason":"동의어 관계"},{"w":"chemical","ko":"화학의","reason":"화학 혼합물 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"여러 가지가 섞인 것.","whenToUse":"음식·감정·스타일 혼합 표현할 때."},"krDetail":[{"ko":"혼합물","explain":"여러 가지가 섞여 만들어진 것"},{"ko":"혼합","explain":"서로 다른 것을 함께 섞는 일"}],"usageExamples":[{"en":"The cake is a mixture of flour, sugar, and eggs.","ko":"그 케이크는 밀가루, 설탕, 계란의 혼합물이다."},{"en":"The soup contains a mixture of spices, not just one flavor.","ko":"그 수프는 한 가지 맛이 아니라 여러 향신료의 혼합을 담고 있다."}],"grammarNote":"mixture는 a mixture of + 복수/불가산 명사 형태로 자주 쓰여. 학생들은 mix와 형태가 비슷해 혼동하는데, mix는 동사·명사 모두, mixture는 명사야.","grammarQuiz":[{"sentence":"The chef _____ a delicious _____ of herbs and spices for the sauce.","ko":"요리사는 소스를 위해 허브와 향신료의 맛있는 혼합물을 만들었다.","answer":["created","mixture"],"hint":"동사 과거형 + a ___ of"}]},

    {"id":"w04215","w":"mosque","pos":["n"],"ph":"/mɒsk/","cefr":"B1","kr":["모스크","이슬람 사원"],"ex":[{"en":"They prayed at the mosque.","ko":"그들은 모스크에서 기도했다."}],"mnemonic":{"soundHint":"모스크","story":"이슬람 신자들이 모이는 모스크 사원","hintConfidence":3},"pairs":{"buddyWords":[{"w":"Islam","ko":"이슬람","reason":"종교적 연관"},{"w":"temple","ko":"사원","reason":"동의어 관계"},{"w":"prayer","ko":"기도","reason":"예배 시나리오"}],"collocBest":[{"en":"grand mosque","ko":"대 모스크"},{"en":"local mosque","ko":"지역 모스크"}]},"nuance":{"koSimple":"이슬람교의 예배 장소.","whenToUse":"무슬림 기도·이슬람 사원 말할 때."},"krDetail":[{"ko":"모스크","explain":"이슬람교 예배 장소"},{"ko":"이슬람 사원","explain":"무슬림이 기도하는 곳"}],"usageExamples":[{"en":"Muslims gather at the mosque for Friday prayers.","ko":"무슬림들은 금요일 예배를 위해 모스크에 모인다."},{"en":"The mosque was small, but the community around it was strong.","ko":"그 모스크는 작았지만 주변 공동체는 결속력이 강했다."}],"grammarNote":"mosque의 발음은 /mɒsk/로 e가 묵음이야. 학생들은 mosque를 '모스큐' 식으로 잘못 발음하기 쉬워. church(교회), temple(사원)과 구분해서 종교별로 알아 둬.","grammarQuiz":[{"sentence":"The community will _____ a new _____ near the school this year.","ko":"그 지역 사회는 올해 학교 근처에 새 모스크를 지을 것이다.","answer":["build","mosque"],"hint":"동사 + a new ___"}]},
    {"id":"w04152","w":"minister","pos":["n"],"ph":"/ˈmɪnɪstər/","cefr":"B1","kr":["장관","목사"],"ex":[{"en":"The minister made a decision.","ko":"장관이 결정을 내렸다."}],"mnemonic":{"soundHint":"미니스터 → 'mini(작은) 스타'가 관리?","story":"옛날엔 왕의 '작은 신하(mini-star)'가 장관이었다! prime minister(수상).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"prime","ko":"수상의","reason":"수상 콜로케이션"},{"w":"government","ko":"정부","reason":"장관 소속 기관"},{"w":"church","ko":"교회","reason":"목사 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"정부 부처의 최고 책임자.","whenToUse":"총리·외무장관 등 각료 말할 때."},"krDetail":[{"ko":"장관","explain":"정부 부서의 우두머리"},{"ko":"목사","explain":"교회를 이끄는 성직자"}],"usageExamples":[{"en":"The prime minister announced new education policies today.","ko":"총리는 오늘 새로운 교육 정책을 발표했다."},{"en":"He is not a politician, but a minister of a small church.","ko":"그는 정치인이 아니라 작은 교회의 목사이다."}],"grammarNote":"minister는 문맥에 따라 '장관' 또는 '목사'를 뜻해. 학생들은 항상 '장관'으로만 해석하기 쉬워. 성직자 문맥에서는 목사로 옮겨야 해.","grammarQuiz":[{"sentence":"The foreign _____ will _____ a special meeting with world leaders soon.","ko":"외무장관은 곧 세계 지도자들과 특별 회담을 열 것이다.","answer":["minister","hold"],"hint":"명사 + 동사"}]},
    {"id":"w04167","w":"mission","pos":["n"],"ph":"/ˈmɪʃən/","cefr":"B1","kr":["임무","사명"],"ex":[{"en":"Complete the mission safely.","ko":"임무를 안전하게 완수해라."}],"mnemonic":{"soundHint":"미션","story":"미션을 완수해야 하는 중요한 임무","hintConfidence":3},"pairs":{"buddyWords":[{"w":"task","ko":"과제","reason":"동의어 관계"},{"w":"rescue","ko":"구조","reason":"구조 임무 콜로케이션"},{"w":"goal","ko":"목표","reason":"임무의 목적"}],"collocBest":[{"en":"mission statement","ko":"미션 선언문"},{"en":"rescue mission","ko":"구조 임무"}]},"nuance":{"koSimple":"해내야 할 중요한 임무.","whenToUse":"구조·우주 임무 같은 큰 목표 말할 때."},"krDetail":[{"ko":"임무","explain":"맡아서 해야 할 일"},{"ko":"사명","explain":"삶에서 꼭 이뤄야 할 큰 목표"}],"usageExamples":[{"en":"The soldiers completed their mission successfully.","ko":"군인들은 임무를 성공적으로 완수했다."},{"en":"The mission failed, but the team returned safely to base.","ko":"임무는 실패했지만 그 팀은 무사히 기지로 돌아왔다."}],"grammarNote":"mission은 mission statement(사명 선언문)처럼 회사·조직의 목표를 뜻하기도 해. 학생들은 군사 임무로만 좁게 이해하기 쉬워.","grammarQuiz":[{"sentence":"The team must _____ the difficult rescue _____ before the storm arrives.","ko":"그 팀은 폭풍이 오기 전에 어려운 구조 임무를 완수해야 한다.","answer":["complete","mission"],"hint":"동사 + rescue ___"}]},
    {"id":"w03790","w":"lecture","pos":["n","v"],"ph":"/ˈlektʃər/","cefr":"B1","kr":["강의","강연"],"ex":[{"en":"The professor gave an interesting lecture today.","ko":"교수님이 오늘 흥미로운 강의를 하셨다."}],"mnemonic":{"soundHint":"렉처(외래어)","story":"대학 '렉처(lecture)' → 강의, 강연","hintConfidence":3},"pairs":{"buddyWords":[{"w":"talk","ko":"강연","reason":"동의어, 공식 발표 문맥 공유"},{"w":"speech","ko":"연설","reason":"동의어, lecture와 대체 가능"},{"w":"professor","ko":"교수","reason":"professor gives a lecture 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"긴 시간 이어지는 전문 강의.","whenToUse":"대학·전문가 강연을 말할 때."},"krDetail":[{"ko":"강의","explain":"지식을 풀어 가르치는 말"},{"ko":"강연","explain":"여러 사람 앞 이야기"}],"usageExamples":[{"en":"Many students attended the professor's lecture yesterday.","ko":"많은 학생들이 어제 그 교수의 강의에 참석했다."},{"en":"The lecture hall was completely full.","ko":"강의실이 완전히 가득 찼다."}],"grammarNote":"lecture는 셀 수 있는 명사여서 관사 a를 붙이거나 복수형 lectures로 써야 한다.","grammarQuiz":[{"sentence":"About 200 students _____ the special _____ on climate change yesterday.","ko":"약 200명의 학생들이 어제 기후 변화에 관한 특별 강의에 참석했다.","answer":["attended","lecture"],"hint":"타동사 과거형 + 단수 가산명사"}]},
    {"id":"w04151","w":"minimum","pos":["n","adj"],"ph":"/ˈmɪnɪməm/","cefr":"B1","kr":["최소","최소의"],"ex":[{"en":"Keep disruption to a minimum.","ko":"방해를 최소한으로 유지해라."}],"mnemonic":{"soundHint":"미니멈 → mini(작은) + mum","story":"mini(작은)의 최상급 = 가장 작은 것 = 최소! 미니멈 웨이지(최저임금).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"maximum","ko":"최대","reason":"반의 관계"},{"w":"wage","ko":"임금","reason":"최저 임금 콜로케이션"},{"w":"least","ko":"가장 적은","reason":"동의어 관계"}],"collocBest":[]},"nuance":{"koSimple":"가능한 가장 작은 수·정도.","whenToUse":"최저 임금·최소 요구조건 말할 때."},"krDetail":[{"ko":"최소","explain":"정해진 것 중 가장 적은 정도"},{"ko":"최소의","explain":"가장 적은 정도의"}],"usageExamples":[{"en":"The government raised the minimum wage this year.","ko":"정부는 올해 최저 임금을 인상했다."},{"en":"She earns the minimum, but spends like a millionaire.","ko":"그녀는 최저 임금을 벌지만 백만장자처럼 쓴다."}],"grammarNote":"minimum의 복수형은 minima 또는 minimums 둘 다 가능하지만 minimums가 일반적이야. 학생들은 반의어 maximum과 혼동하기 쉬워.","grammarQuiz":[{"sentence":"You must _____ the _____ requirements to apply for this position.","ko":"이 직책에 지원하려면 최소 요건을 충족해야 한다.","answer":["meet","minimum"],"hint":"동사 + ___ requirements"}]},
    {"id":"w04011","w":"marble","pos":["n","adj"],"ph":"/ˈmɑːrbəl/","cefr":"B1","kr":["대리석","구슬"],"ex":[{"en":"The palace floor was made of pure white marble.","ko":"궁전 바닥은 순백의 대리석으로 만들어졌다."}],"mnemonic":{"soundHint":"마블","story":"'마블(marble) 무늬' = 대리석 무늬. 마블링(marbling)도 대리석 무늬.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stone","ko":"돌","reason":"시나리오 - 대리석은 돌"},{"w":"floor","ko":"바닥","reason":"콜로케이션 - marble floor"},{"w":"statue","ko":"조각상","reason":"시나리오 - 대리석 조각상"}],"collocBest":[{"en":"marble floor","ko":"대리석 바닥"},{"en":"marble statue","ko":"대리석 조각상"}]},"nuance":{"koSimple":"매끈하고 단단한 흰 돌.","whenToUse":"조각상·궁전 바닥·화려한 건축에."},"krDetail":[{"ko":"대리석","explain":"결이 아름답고 매끄러운 무늬가 있는 값진 돌"},{"ko":"구슬","explain":"장난감으로 굴리며 노는 작고 둥근 유리 알"}],"usageExamples":[{"en":"The palace floor is made of white marble.","ko":"그 궁전 바닥은 하얀 대리석으로 만들어졌다."},{"en":"The children played with colorful marbles in the yard.","ko":"아이들은 마당에서 알록달록한 구슬을 가지고 놀았다."}],"grammarNote":"marble이 '대리석' 재료를 뜻할 때는 셀 수 없는 명사, '구슬' 알을 뜻할 때는 셀 수 있는 명사로 marbles라고 복수형을 쓴다. 학생들이 재료 뜻에서 marbles로 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The statue was carved from beautiful _____ , while the children played with _____ nearby.","ko":"그 조각상은 아름다운 대리석으로 조각되었고 아이들은 근처에서 구슬을 가지고 놀았다.","answer":["marble","marbles"],"hint":"물질명사와 셀 수 있는 복수"}]},
    {"id":"w04096","w":"mend","pos":["v","n"],"ph":"/mend/","cefr":"B1","kr":["수선하다","고치다","회복하다"],"ex":[{"en":"She learned to mend her own clothes rather than buying new ones.","ko":"그녀는 새 옷을 사는 대신 자신의 옷을 수선하는 법을 배웠다."}],"mnemonic":{"soundHint":"멘드 → '맨드(만들다)'","story":"'맨드(만들다)'와 발음 유사! 망가진 걸 다시 만들어 = 수선하다!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"repair","ko":"수리하다","reason":"동의어 관계"},{"w":"fix","ko":"고치다","reason":"동의어 관계"},{"w":"break","ko":"부수다","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"낡거나 망가진 것을 다시 쓰게 고치다.","whenToUse":"옷 수선·관계 회복 표현할 때."},"krDetail":[{"ko":"수선하다","explain":"낡거나 찢어진 것을 손보아 고치다"},{"ko":"고치다","explain":"망가진 것을 다시 쓸 수 있게 하다"},{"ko":"회복하다","explain":"사이나 상태를 다시 좋게 하다"}],"usageExamples":[{"en":"My grandmother mends my torn shirts every weekend.","ko":"우리 할머니는 주말마다 내 찢어진 셔츠를 수선하신다."},{"en":"Time may mend wounds, but it cannot erase the memory.","ko":"시간이 상처는 아물게 해도 기억을 지우진 못한다."}],"grammarNote":"mend는 fix/repair보다 부드럽고 옷·관계처럼 부드러운 대상에 자주 쓰여. 학생들은 mend를 mind와 스펠링 혼동하기 쉬워.","grammarQuiz":[{"sentence":"After the argument, they tried to _____ their broken _____ with honesty.","ko":"말다툼 후에 그들은 정직함으로 깨진 관계를 회복하려 애썼다.","answer":["mend","relationship"],"hint":"동사 + broken ___"}]},
    {"id":"w04209","w":"moreover","pos":["adv"],"ph":"/mɔːrˈoʊvər/","cefr":"B1","kr":["게다가","더욱이"],"ex":[{"en":"Moreover he is very kind.","ko":"게다가 그는 매우 친절하다."}],"mnemonic":{"soundHint":"모어오버 → more(더) + over(넘어)","story":"more(더) + over(넘어) = 그 이상으로, 게다가! 논리 연결어.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"furthermore","ko":"게다가","reason":"동의어 관계"},{"w":"additionally","ko":"덧붙여","reason":"동의어 관계"},{"w":"besides","ko":"게다가","reason":"동의어 관계"}],"collocBest":[]},"nuance":{"koSimple":"앞말에 하나 더 얹어 '게다가'.","whenToUse":"글에서 추가 근거·정보 붙일 때."},"krDetail":[{"ko":"게다가","explain":"이미 말한 것에 더하여"},{"ko":"더욱이","explain":"그것뿐 아니라 그 이상으로"}],"usageExamples":[{"en":"The apartment is spacious. Moreover, the rent is affordable.","ko":"그 아파트는 넓다. 게다가 임대료도 적당하다."},{"en":"The plan is risky; moreover, we have very little time left.","ko":"그 계획은 위험하다. 게다가 우리에게는 시간도 거의 없다."}],"grammarNote":"moreover는 접속부사로 문장 처음에 오고 콤마로 구분해. 학생들은 접속사처럼 절과 절을 콤마 하나로 연결(comma splice)하는 실수를 자주 해.","grammarQuiz":[{"sentence":"The book is entertaining; _____, it _____ many useful life lessons.","ko":"그 책은 재미있다. 게다가 유용한 인생 교훈을 많이 담고 있다.","answer":["moreover","contains"],"hint":"부사 + 동사"}]},
    {"id":"w04089","w":"memo","pos":["n"],"ph":"/ˈmemoʊ/","cefr":"B1","kr":["메모","비망록"],"ex":[{"en":"The manager sent a memo to all staff.","ko":"관리자는 모든 직원에게 메모를 보냈다."}],"mnemonic":{"soundHint":"메모","story":"메모지에 짧게 적어두는 비망록","hintConfidence":3},"pairs":{"buddyWords":[{"w":"note","ko":"메모","reason":"동의어 관계"},{"w":"reminder","ko":"상기시킴","reason":"기능적 연관"},{"w":"office","ko":"사무실","reason":"내부 메모 시나리오"}],"collocBest":[{"en":"internal memo","ko":"내부 메모"},{"en":"send a memo","ko":"메모를 보내다"}]},"nuance":{"koSimple":"짧게 남기는 업무용 쪽지.","whenToUse":"회사·팀에서 알림 쪽지 돌릴 때."},"krDetail":[{"ko":"메모","explain":"잊지 않으려고 짧게 적어 두는 글"},{"ko":"비망록","explain":"잊지 않으려 적어 두는 기록"}],"usageExamples":[{"en":"The manager sent a memo to all employees yesterday.","ko":"부장이 어제 전 직원에게 메모를 보냈다."},{"en":"I wrote a quick memo, but she replied with a long letter.","ko":"나는 짧은 메모를 썼지만 그녀는 긴 편지로 답했다."}],"grammarNote":"memo는 memorandum의 줄임말이고 복수형은 memos야. memoes가 아님에 주의해. 학생들은 potato-potatoes 패턴에 이끌려 memoes로 잘못 쓰기 쉬워.","grammarQuiz":[{"sentence":"The secretary _____ several _____ about the new policy this morning.","ko":"비서는 오늘 아침 새 정책에 관한 메모 여러 개를 보냈다.","answer":["sent","memos"],"hint":"동사 과거형 + memo 복수형"}]},
    {"id":"w04184","w":"modify","pos":["v"],"ph":"/ˈmɒdɪfaɪ/","cefr":"B1","kr":["수정하다","변경하다"],"ex":[{"en":"Modify the plan if needed.","ko":"필요하면 계획을 수정해라."}],"mnemonic":{"soundHint":"모디파이 → mode(방식) + fy(만들다)","story":"mode(방식)를 만들어 바꾸다 = modify(수정하다). 모드 파이!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"change","ko":"바꾸다","reason":"동의어 관계"},{"w":"maintain","ko":"유지하다","reason":"반의 관계"},{"w":"design","ko":"디자인","reason":"디자인 수정 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"일부만 살짝 바꾸다.","whenToUse":"계획·디자인 소폭 수정할 때."},"krDetail":[{"ko":"수정하다","explain":"잘못된 부분을 바로잡다"},{"ko":"변경하다","explain":"일부를 바꿔서 다르게 하다"}],"usageExamples":[{"en":"The engineer modified the design to reduce costs.","ko":"기술자는 비용을 줄이기 위해 설계를 수정했다."},{"en":"She modified her plans, but the deadline remained the same.","ko":"그녀는 계획을 수정했지만 마감일은 그대로였다."}],"grammarNote":"modify는 부분적으로 바꾸는 것을, change는 전체적으로 바꾸는 것을 뜻해. 학생들은 modify를 change의 완전한 동의어로 쓰기 쉬워.","grammarQuiz":[{"sentence":"The teacher had to _____ his teaching _____ to fit online classes.","ko":"그 교사는 온라인 수업에 맞추기 위해 자신의 수업 방식을 수정해야 했다.","answer":["modify","method"],"hint":"동사 + teaching ___"}]},
    {"id":"w03974","w":"majority","pos":["n"],"ph":"/məˈdʒɒrɪti/","cefr":"B1","kr":["대다수","과반수"],"ex":[{"en":"The majority agreed.","ko":"대다수가 동의했다."}],"mnemonic":{"soundHint":"major(주요한) + ity","story":"major(주요한) + ity → 다수를 차지하는 무리, 대다수","hintConfidence":3},"pairs":{"buddyWords":[{"w":"most","ko":"대부분","reason":"동의어 - 대다수"},{"w":"minority","ko":"소수","reason":"반의어 - 다수 vs 소수"},{"w":"vote","ko":"투표","reason":"콜로케이션 - majority vote"}],"collocBest":[]},"nuance":{"koSimple":"절반보다 많은 사람들.","whenToUse":"다수결·대세를 말할 때."},"krDetail":[{"ko":"대다수","explain":"전체 가운데 매우 많은 쪽"},{"ko":"과반수","explain":"전체의 절반이 넘는 수"}],"usageExamples":[{"en":"The majority supports the new environmental policy.","ko":"대다수는 새 환경 정책을 지지한다."},{"en":"A majority of students walk to school every morning.","ko":"대다수의 학생들은 매일 아침 걸어서 등교한다."}],"grammarNote":"the majority of + 복수명사가 오면 동사는 복수로, majority가 집합체로 쓰이면 단수 취급이 가능하다. 학생들은 majority가 단수라 무조건 is만 붙이는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The majority of the students in this school _____ from families that _____ nearby.","ko":"이 학교 학생들의 대다수는 근처에 사는 가정 출신이다.","answer":["come","live"],"hint":"복수 취급 동사와 관계사절 동사"}]},
    {"id":"w04138","w":"military","pos":["adj","n"],"ph":"/ˈmɪlɪteri/","cefr":"B1","kr":["군사의","군대"],"ex":[{"en":"Military service is required.","ko":"군복무가 요구된다."}],"mnemonic":{"soundHint":"밀리터리 → '밀리(밀다) + 터리'","story":"'밀리터리 룩'! 적을 밀어붙이는 군사의 힘 = military.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"army","ko":"군대","reason":"관련 개념"},{"w":"civilian","ko":"민간의","reason":"반의 관계"},{"w":"service","ko":"복무","reason":"군복무 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"군대·군인과 관련된.","whenToUse":"군복무·군사 기지·훈련 말할 때."},"krDetail":[{"ko":"군사의","explain":"군대와 관련된"},{"ko":"군대","explain":"나라를 지키려고 조직된 무리"}],"usageExamples":[{"en":"The country increased its military spending last year.","ko":"그 나라는 작년에 국방비를 늘렸다."},{"en":"He served in the military, but later became a civilian teacher.","ko":"그는 군 복무를 했지만 이후 민간 교사가 되었다."}],"grammarNote":"the military는 집합명사로 '군대 전체'를 의미해. 학생들은 army와 혼동하기 쉬운데, army는 육군, military는 육·해·공 모두 포함이야.","grammarQuiz":[{"sentence":"Many young men must _____ two years of _____ service in Korea.","ko":"한국에서 많은 청년들은 2년간의 군 복무를 해야 한다.","answer":["complete","military"],"hint":"동사 + ___ service"}]},
    {"id":"w03942","w":"lung","pos":["n"],"ph":"/lʌŋ/","cefr":"B1","kr":["폐","허파"],"ex":[{"en":"Smoking damages the lungs severely over time.","ko":"흡연은 시간이 지남에 따라 폐를 심하게 손상시킨다."}],"mnemonic":{"soundHint":"'렁'하고 숨 쉬는 소리","story":"숨 쉴 때 '렁~' 하고 공기가 드나드는 장기 → 폐","hintConfidence":2},"pairs":{"buddyWords":[{"w":"breathe","ko":"숨쉬다","reason":"시나리오 - 폐로 숨쉬다"},{"w":"cancer","ko":"암","reason":"콜로케이션 - lung cancer"},{"w":"smoke","ko":"연기/담배","reason":"시나리오 - 담배가 폐를 해침"}],"collocBest":[]},"nuance":{"koSimple":"숨을 담는 가슴 속 기관.","whenToUse":"호흡·흡연·건강 이야기에."},"krDetail":[{"ko":"폐","explain":"숨을 쉴 때 공기를 들이고 내보내는 몸속 기관"},{"ko":"허파","explain":"가슴 안쪽에 있는 숨쉬기를 맡는 살덩어리"}],"usageExamples":[{"en":"Smoking damages the lungs over many years.","ko":"흡연은 여러 해에 걸쳐 폐를 손상시킨다."},{"en":"He filled his lungs with fresh mountain air.","ko":"그는 신선한 산 공기로 폐를 가득 채웠다."}],"grammarNote":"폐는 좌우 한 쌍이므로 보통 복수 lungs로 쓴다. one lung처럼 한쪽만 지칭할 때만 단수로 쓴다는 점을 학생들이 자주 놓친다.","grammarQuiz":[{"sentence":"The doctor explained that the patient's _____ were _____ by long exposure to polluted air.","ko":"의사는 환자의 폐가 오랜 오염 공기 노출로 손상되었다고 설명했다.","answer":["lungs","damaged"],"hint":"복수 명사 + 수동태 과거분사"}]},
    {"id":"w03886","w":"load","pos":["n","v"],"ph":"/loʊd/","cefr":"B1","kr":["짐","싣다"],"ex":[{"en":"The truck carried a heavy load slowly.","ko":"트럭이 무거운 짐을 천천히 운반했다."}],"mnemonic":{"soundHint":"로드(외래어) 다운로드","story":"'다운로드(download)'는 짐(load)을 내려받는 것 → 짐, 싣다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cargo","ko":"화물","reason":"동의어, 화물차 시나리오 공유"},{"w":"burden","ko":"부담, 짐","reason":"동의어, 비유적 사용 짝"},{"w":"unload","ko":"짐을 내리다","reason":"반의어 대비로 load 강화"}],"collocBest":[]},"nuance":{"koSimple":"무거운 짐·짐을 싣다.","whenToUse":"트럭 짐·업무 부담을 말할 때."},"krDetail":[{"ko":"짐","explain":"실어 나를 물건"},{"ko":"싣다","explain":"짐을 얹어 올리다"}],"usageExamples":[{"en":"The truck carried a heavy load of bricks.","ko":"트럭이 무거운 벽돌 짐을 실어 날랐다."},{"en":"She has too much workload these days.","ko":"그녀는 요즘 업무량이 너무 많다."}],"grammarNote":"load는 명사(짐)와 동사(싣다) 모두로 쓰이며, 반대말 unload는 접두사 un-이 붙어 '짐을 내리다'라는 뜻이 된다.","grammarQuiz":[{"sentence":"The workers _____ a heavy _____ of boxes onto the truck yesterday morning.","ko":"작업자들은 어제 아침 무거운 상자 짐을 트럭에 실었다.","answer":["loaded","load"],"hint":"타동사 과거형 + 단수 명사"}]},
    {"id":"w04103","w":"merchant","pos":["n"],"ph":"/ˈmɜːrtʃənt/","cefr":"B1","kr":["상인","무역상"],"ex":[{"en":"The merchant sold spices.","ko":"그 상인은 향신료를 팔았다."}],"mnemonic":{"soundHint":"머천트 → '먹혔다'? 상인의 흥정","story":"머천트(merchant)는 '먹혔다'! 상인의 흥정에 결국 지갑이 먹혔다.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"trader","ko":"무역상","reason":"동의어 관계"},{"w":"goods","ko":"상품","reason":"상인 취급 품목"},{"w":"ship","ko":"배","reason":"상선 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"물건을 사고파는 상인.","whenToUse":"옛날식 상인·무역상 말할 때."},"krDetail":[{"ko":"상인","explain":"물건을 사고파는 사람"},{"ko":"무역상","explain":"나라 사이에서 물건을 사고파는 사람"}],"usageExamples":[{"en":"The merchant sells rare spices from distant countries.","ko":"그 상인은 먼 나라에서 온 희귀한 향신료를 판다."},{"en":"He looked like a poor traveler, but he was actually a wealthy merchant.","ko":"그는 가난한 여행자처럼 보였지만 실은 부유한 상인이었다."}],"grammarNote":"merchant는 큰 규모로 거래하는 상인을 뜻해. 작은 가게 주인은 shopkeeper. 학생들은 seller나 store owner와 구분 없이 쓰기 쉬워.","grammarQuiz":[{"sentence":"The wealthy _____ traveled across the sea to _____ his goods overseas.","ko":"그 부유한 상인은 해외에 물건을 팔기 위해 바다를 건넜다.","answer":["merchant","sell"],"hint":"명사 + 동사(to ___)"}]},
    {"id":"w04204","w":"moody","pos":["adj"],"ph":"/ˈmuːdi/","cefr":"B1","kr":["변덕스러운","기분이 안 좋은","침울한"],"ex":[{"en":"He was moody and withdrawn after receiving the disappointing news.","ko":"실망스러운 소식을 받은 후 그는 변덕스럽고 내성적이 되었다."}],"mnemonic":{"soundHint":"무디 → mood(기분) + y","story":"mood(기분) + y = 기분에 좌우되는 = 변덕스러운! 무디한 성격.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mood","ko":"기분","reason":"동일 어원 파생"},{"w":"cheerful","ko":"명랑한","reason":"반의 관계"},{"w":"teenager","ko":"십대","reason":"변덕스러운 십대 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"기분이 자주 확 바뀌는.","whenToUse":"변덕스러운 십대·침울한 분위기 말할 때."},"krDetail":[{"ko":"변덕스러운","explain":"기분이 자꾸 바뀌는"},{"ko":"기분이 안 좋은","explain":"표정이 어둡고 시무룩한"},{"ko":"침울한","explain":"어둡고 가라앉은 느낌의"}],"usageExamples":[{"en":"My little sister is often moody in the morning.","ko":"내 여동생은 아침에 자주 기분이 오락가락한다."},{"en":"He seemed cheerful yesterday, but he was moody all afternoon today.","ko":"그는 어제는 명랑해 보였지만 오늘 오후 내내 침울했다."}],"grammarNote":"moody는 감정 변화가 심한 사람이나 어두운 분위기(moody atmosphere)에도 쓰여. 학생들은 '기분 좋은'으로 착각하기 쉬운데 부정적 뉘앙스야.","grammarQuiz":[{"sentence":"Teenagers can _____ very _____ when they lack sleep or feel stressed.","ko":"십대들은 잠이 부족하거나 스트레스를 받을 때 매우 변덕스러워질 수 있다.","answer":["become","moody"],"hint":"동사 + 형용사"}]},
    {"id":"w04148","w":"mingle","pos":["v"],"ph":"/ˈmɪŋɡəl/","cefr":"B1","kr":["섞이다","어울리다","혼합되다"],"ex":[{"en":"She was nervous about having to mingle with strangers at the party.","ko":"그녀는 파티에서 낯선 사람들과 어울려야 하는 것이 불안했다."}],"mnemonic":{"soundHint":"밍글 → '밍(mix)글글' 섞이다","story":"'밍글밍글' 사람들이 파티에서 섞여 어울리는 소리!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"mix","ko":"섞다","reason":"동의어 관계"},{"w":"separate","ko":"분리하다","reason":"반의 관계"},{"w":"guest","ko":"손님","reason":"손님과 어울리는 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"사람들 사이에 자연스레 섞이다.","whenToUse":"파티에서 손님들과 어울릴 때."},"krDetail":[{"ko":"섞이다","explain":"서로 뒤엉켜 하나처럼 되다"},{"ko":"어울리다","explain":"사람들과 자연스레 함께 지내다"},{"ko":"혼합되다","explain":"여러 가지가 함께 뒤섞이다"}],"usageExamples":[{"en":"She mingled with the guests at the party effortlessly.","ko":"그녀는 파티에서 손님들과 자연스럽게 어울렸다."},{"en":"The sweet aroma mingled with the smell of smoke in the air.","ko":"달콤한 향기가 공기 중 연기 냄새와 뒤섞였다."}],"grammarNote":"mingle은 자동사로 mingle with 형태로 자주 쓰여. 학생들은 '섞다'로 착각해 mingle something with처럼 타동사로 잘못 쓰기 쉬워.","grammarQuiz":[{"sentence":"The shy student found it hard to _____ _____ his new classmates freely.","ko":"그 수줍은 학생은 새 반 친구들과 자유롭게 어울리기 어려워했다.","answer":["mingle","with"],"hint":"동사 + 전치사"}]},
    {"id":"w03852","w":"limitation","pos":["n"],"ph":"/ˌlɪmɪˈteɪʃn/","cefr":"B1","kr":["제한","한계"],"ex":[{"en":"Know your limitations and work on them.","ko":"자신의 한계를 알고 그것을 극복하기 위해 노력해라."}],"mnemonic":{"soundHint":"limit(제한) + ation","story":"limit(제한하다)의 명사형 → 제한, 한계","hintConfidence":3},"pairs":{"buddyWords":[{"w":"restriction","ko":"제한","reason":"동의어, 규정 문맥 공유"},{"w":"constraint","ko":"제약","reason":"동의어, 격식 문맥 대체"},{"w":"overcome","ko":"극복하다","reason":"overcome limitations 콜로 짝"}],"collocBest":[]},"nuance":{"koSimple":"할 수 있는 범위의 끝.","whenToUse":"능력·자원·상황의 한계를 말할 때."},"krDetail":[{"ko":"제한","explain":"못하게 막는 선"},{"ko":"한계","explain":"더 나아갈 수 없는 끝"}],"usageExamples":[{"en":"Everyone has their own personal limitations.","ko":"모든 사람은 자기만의 개인적 한계를 가지고 있다."},{"en":"She worked hard to overcome her limitations.","ko":"그녀는 자신의 한계를 극복하기 위해 열심히 노력했다."}],"grammarNote":"limitation은 셀 수 있는 명사로 복수형 limitations로 자주 쓰이며, 동사 limit에 -ation이 붙어 명사가 된 형태이다.","grammarQuiz":[{"sentence":"Great athletes always _____ to overcome their physical _____ through daily practice.","ko":"훌륭한 운동선수들은 매일 연습을 통해 자신의 신체적 한계를 극복하려고 항상 노력한다.","answer":["try","limitations"],"hint":"현재형 동사 + 복수 명사"}]},
    {"id":"w03971","w":"maintenance","pos":["n"],"ph":"/ˈmeɪntənəns/","cefr":"B1","kr":["유지","관리"],"ex":[{"en":"Regular maintenance is needed.","ko":"정기적인 유지 관리가 필요하다."}],"mnemonic":{"soundHint":"메인터넌스(외래어)","story":"maintain(유지하다)의 명사형, '메인터넌스 비용' → 유지, 관리","hintConfidence":3},"pairs":{"buddyWords":[{"w":"upkeep","ko":"유지 관리","reason":"동의어 - 관리 유지"},{"w":"neglect","ko":"방치","reason":"반의어 - 유지 반대"},{"w":"repair","ko":"수리","reason":"시나리오 - 유지 보수"}],"collocBest":[]},"nuance":{"koSimple":"잘 굴러가게 관리하기.","whenToUse":"기계·건물의 정기 점검·관리를 말할 때."},"krDetail":[{"ko":"유지","explain":"어떤 상태나 기능을 그대로 이어 감"},{"ko":"관리","explain":"기계나 시설을 보살펴 잘 돌아가게 함"}],"usageExamples":[{"en":"Regular maintenance keeps the machines running smoothly.","ko":"정기적인 관리는 기계들이 원활히 작동하도록 유지한다."},{"en":"The building requires expensive maintenance every year.","ko":"그 건물은 해마다 값비싼 관리를 필요로 한다."}],"grammarNote":"maintenance는 셀 수 없는 명사이므로 a maintenance나 maintenances로 쓰지 않는다. 형용사처럼 다른 명사 앞에서 쓰는 경우가 많은데(예: maintenance cost) 이때도 단수형을 유지한다.","grammarQuiz":[{"sentence":"The old bridge needs regular _____ to _____ safe for all vehicles crossing daily.","ko":"그 낡은 다리는 매일 오가는 모든 차량이 안전하도록 정기적인 관리가 필요하다.","answer":["maintenance","remain"],"hint":"셀 수 없는 명사와 to부정사 동사원형"}]},
    {"id":"w04091","w":"memorial","pos":["n","adj"],"ph":"/məˈmɔːriəl/","cefr":"B1","kr":["기념관","기념의"],"ex":[{"en":"Visit the war memorial.","ko":"전쟁 기념관을 방문해라."}],"mnemonic":{"soundHint":"메모리얼 → memory(기억) + al","story":"memory(기억) + al = 기억하기 위한 것 = 기념관! 메모리얼 파크.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"memory","ko":"기억","reason":"동일 어원 파생"},{"w":"monument","ko":"기념비","reason":"동의어 관계"},{"w":"tribute","ko":"헌사","reason":"추모 시나리오 연관"}],"collocBest":[]},"nuance":{"koSimple":"누군가·무언가를 기리는 기념물.","whenToUse":"전쟁·인물 기념관·추모식 말할 때."},"krDetail":[{"ko":"기념관","explain":"누군가를 오래 기억하려 세운 건물"},{"ko":"기념의","explain":"누군가를 기리기 위한"}],"usageExamples":[{"en":"They built a memorial to honor the fallen soldiers.","ko":"그들은 전사한 군인들을 기리기 위해 기념비를 세웠다."},{"en":"The memorial service was solemn, but the reception was cheerful.","ko":"추도식은 엄숙했지만 뒤풀이는 밝은 분위기였다."}],"grammarNote":"memorial은 명사(기념관)와 형용사(기념의) 둘 다 쓰여. 학생들은 명사로만 알아 memorial service를 '기념관 서비스'로 오역하기 쉬워.","grammarQuiz":[{"sentence":"The city _____ a new war _____ in the park last spring.","ko":"그 도시는 지난봄에 공원에 새로운 전쟁 기념비를 세웠다.","answer":["built","memorial"],"hint":"동사 과거형 + war ___"}]},
    {"id":"w04221","w":"motion","pos":["n","v"],"ph":"/ˈmoʊʃən/","cefr":"B1","kr":["동작","움직임"],"ex":[{"en":"His motion was graceful.","ko":"그의 움직임은 우아했다."}],"mnemonic":{"soundHint":"모션","story":"슬로우 모션처럼 움직임을 표현","hintConfidence":3},"pairs":{"buddyWords":[{"w":"movement","ko":"움직임","reason":"동의어 관계"},{"w":"stillness","ko":"정지","reason":"반의 관계"},{"w":"slow","ko":"느린","reason":"슬로우 모션 콜로케이션"}],"collocBest":[{"en":"set in motion","ko":"움직이게 하다"},{"en":"slow motion","ko":"슬로우 모션"}]},"nuance":{"koSimple":"몸이나 물체의 움직임.","whenToUse":"슬로우 모션·동작 묘사할 때."},"krDetail":[{"ko":"동작","explain":"몸이나 물건이 움직이는 모습"},{"ko":"움직임","explain":"한 곳에서 다른 곳으로 옮겨 가는 일"}],"usageExamples":[{"en":"The camera captured every motion in slow speed.","ko":"카메라가 모든 동작을 슬로우 스피드로 담았다."},{"en":"The train slowed down, but its motion never fully stopped.","ko":"기차는 속도를 줄였지만 그 움직임이 완전히 멈춘 것은 아니었다."}],"grammarNote":"motion은 movement보다 격식적이며 in motion(움직이는 중)처럼 관용구에 자주 쓰여. 학생들은 두 단어를 완전 동의어로 취급하기 쉬워.","grammarQuiz":[{"sentence":"The director _____ the actors to stay in _____ during the entire scene.","ko":"그 감독은 배우들에게 장면 내내 계속 움직이도록 지시했다.","answer":["asked","motion"],"hint":"동사 과거형 + in ___"}]},
    {"id":"w03927","w":"loyal","pos":["adj"],"ph":"/ˈlɔɪəl/","cefr":"B1","kr":["충실한","충성스러운"],"ex":[{"en":"He remained loyal to his team throughout.","ko":"그는 내내 팀에 충실했다."}],"mnemonic":{"soundHint":"로열(royal 왕실)과 비슷","story":"royal(왕실)에 loyal(충성)을 다하다 → 충실한, 충성스러운","hintConfidence":2},"pairs":{"buddyWords":[{"w":"faithful","ko":"충실한","reason":"동의어, 관계·헌신 문맥 공유"},{"w":"devoted","ko":"헌신적인","reason":"동의어, 시나리오 짝"},{"w":"customer","ko":"고객","reason":"loyal customer 콜로 짝"}],"collocBest":[]},"nuance":{"koSimple":"끝까지 편에 서는 마음.","whenToUse":"팀·친구·브랜드에 변함없는 지지를 표현할 때."},"krDetail":[{"ko":"충실한","explain":"정성껏 곁을 지키는"},{"ko":"충성스러운","explain":"변함없이 따르는"}],"usageExamples":[{"en":"She is a loyal customer of our store.","ko":"그녀는 우리 가게의 충성 고객이다."},{"en":"He remained a loyal supporter of the team.","ko":"그는 그 팀의 충실한 지지자로 남았다."}],"grammarNote":"loyal은 형용사이며 'be loyal to + 대상'의 형태로 쓰여 '~에게 충성스럽다'라는 뜻을 나타낸다.","grammarQuiz":[{"sentence":"The brave old dog _____ always _____ to his kind owner until the very end.","ko":"그 용감한 늙은 개는 마지막까지 다정한 주인에게 항상 충실했다.","answer":["remained","loyal"],"hint":"2형식 동사 과거형 + 형용사"}]},
    {"id":"w04053","w":"maze","pos":["n"],"ph":"/meɪz/","cefr":"B1","kr":["미로","복잡한 상황"],"ex":[{"en":"The children got lost in the corn maze at the farm.","ko":"아이들은 농장의 옥수수 미로에서 길을 잃었다."}],"mnemonic":{"soundHint":"메이즈 → '메' 헤매다","story":"'메이즈'에서 '메'는 헤매다의 '메'. 미로(maze)에서 헤매고 있는 나!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"labyrinth","ko":"미궁","reason":"동의어 - 복잡한 미로"},{"w":"puzzle","ko":"퍼즐","reason":"동의어 - 복잡한 문제"},{"w":"navigate","ko":"헤쳐나가다","reason":"콜로케이션 - navigate a maze"}],"collocBest":[]},"nuance":{"koSimple":"길이 얽힌 미로.","whenToUse":"실제 미로나 복잡한 상황을 비유할 때."},"krDetail":[{"ko":"미로","explain":"길이 많이 갈라져 빠져나가기 어려운 곳"},{"ko":"복잡한 상황","explain":"얽히고설켜 풀기 어려운 형편"}],"usageExamples":[{"en":"The children explored a huge maze in the garden.","ko":"아이들은 정원에 있는 커다란 미로를 탐험했다."},{"en":"The legal system feels like a maze to new lawyers.","ko":"새 변호사들에게 법 제도는 미로처럼 느껴진다."}],"grammarNote":"maze는 셀 수 있는 명사로 복수형 mazes를 쓴다. 동음이의어 maize('옥수수')와 발음이 같으므로 문맥으로만 구별해야 하며, 관용구 in a maze of + 명사('~의 미로 속에서')로 자주 쓰인다.","grammarQuiz":[{"sentence":"The new employee felt lost _____ a _____ of confusing rules during his very first week at work.","ko":"그 신입 사원은 직장에서의 첫 주 동안 혼란스러운 규칙의 미로 속에서 길을 잃은 기분이었다.","answer":["in","maze"],"hint":"전치사와 명사"}]},
    {"id":"w04029","w":"marvelous","pos":["adj"],"ph":"/ˈmɑːrvələs/","cefr":"B1","kr":["놀라운","훌륭한","경이로운"],"ex":[{"en":"The marvelous sunset painted the sky in shades of orange and pink.","ko":"놀라운 일몰이 하늘을 주황색과 분홍색으로 물들였다."}],"mnemonic":{"soundHint":"마블(Marvel) + ous","story":"'마블(Marvel)' 히어로 영화처럼 놀라운·경이로운","hintConfidence":3},"pairs":{"buddyWords":[{"w":"wonderful","ko":"훌륭한","reason":"동의어 - 멋진"},{"w":"awful","ko":"끔찍한","reason":"반의어 - 놀라운 vs 끔찍한"},{"w":"amazing","ko":"놀라운","reason":"동의어 - 경이로운"}],"collocBest":[]},"nuance":{"koSimple":"감탄이 나올 만큼 훌륭한.","whenToUse":"경치·성과에 감탄할 때."},"krDetail":[{"ko":"놀라운","explain":"보고 듣기에 매우 뛰어나 감탄이 나오는"},{"ko":"훌륭한","explain":"빼어나서 칭찬할 만한"},{"ko":"경이로운","explain":"믿기 힘들 만큼 놀랍고 대단한"}],"usageExamples":[{"en":"The chef created a marvelous meal for every guest.","ko":"그 요리사는 모든 손님을 위해 훌륭한 식사를 만들었다."},{"en":"Her performance was marvelous, receiving a standing ovation.","ko":"그녀의 공연은 놀라웠고 기립 박수를 받았다."}],"grammarNote":"marvelous는 이미 강한 뜻을 가진 '절대 형용사'이므로 very marvelous보다는 truly/absolutely marvelous가 자연스럽다. 부사형은 marvelously로 쓴다.","grammarQuiz":[{"sentence":"The young pianist performed _____ , receiving a truly _____ response from every member of the audience.","ko":"그 어린 피아니스트는 훌륭하게 연주했고, 관객 모두로부터 진정 놀라운 반응을 받았다.","answer":["marvelously","marvelous"],"hint":"부사와 형용사"}]},

    {"id":"w04169","w":"mist","pos":["n","v"],"ph":"/mɪst/","cefr":"B1","kr":["안개","뿌옇게 하다"],"ex":[{"en":"A light mist hung over the valley early in the morning.","ko":"이른 아침에 가벼운 안개가 계곡 위에 감돌았다."}],"mnemonic":{"soundHint":"미스트 → 화장품 '미스트'","story":"얼굴에 뿌리는 '미스트(mist)' = 안개처럼 뿌옇게!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fog","ko":"안개","reason":"동의어 관계"},{"w":"morning","ko":"아침","reason":"아침 안개 콜로케이션"},{"w":"haze","ko":"실안개","reason":"동의어 관계"}],"collocBest":[]},"nuance":{"koSimple":"얇게 낀 뿌연 안개.","whenToUse":"새벽·산속의 옅은 안개 묘사할 때."},"krDetail":[{"ko":"안개","explain":"공기 중에 뜬 작은 물방울"},{"ko":"뿌옇게 하다","explain":"안개처럼 흐리게 만들다"}],"usageExamples":[{"en":"A thick mist covered the entire valley at dawn.","ko":"짙은 안개가 새벽에 계곡 전체를 뒤덮었다."},{"en":"The mist cleared quickly, but the cold air lingered all morning.","ko":"안개는 빠르게 걷혔지만 찬 공기는 오전 내내 남아 있었다."}],"grammarNote":"mist는 fog보다 옅은 안개를 뜻해. 대체로 불가산으로 쓰이지만 종류를 구분할 때는 mists로도 가능해. 학생들은 fog와 무조건 같은 말로 쓰기 쉬워.","grammarQuiz":[{"sentence":"The morning _____ slowly _____ from the surface of the quiet lake.","ko":"아침 안개가 조용한 호수 표면에서 서서히 걷혔다.","answer":["mist","lifted"],"hint":"명사 + 동사 과거형"}]},

    {"id":"w04074","w":"medication","pos":["n"],"ph":"/ˌmedɪˈkeɪʃən/","cefr":"B1","kr":["약물","투약"],"ex":[{"en":"Take your medication daily.","ko":"매일 약을 복용해라."}],"mnemonic":{"soundHint":"메디케이션 → medi(의료) + cation","story":"medi(medical, 의료의) → 의료용 물질 = 약! 메디컬 스쿨에서 처방하는 약.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"medicine","ko":"약","reason":"동의어 - 약물"},{"w":"drug","ko":"약","reason":"동의어 - 처방약"},{"w":"prescription","ko":"처방","reason":"콜로케이션 - prescription medication"}],"collocBest":[]},"nuance":{"koSimple":"병 치료를 위해 먹는 약.","whenToUse":"처방 받은 약이나 복용 지시를 말할 때."},"krDetail":[{"ko":"약물","explain":"병을 고치기 위해 몸에 넣는 성분"},{"ko":"투약","explain":"환자에게 약을 주거나 먹이는 일"}],"usageExamples":[{"en":"The doctor prescribed medication for her high blood pressure.","ko":"의사는 그녀의 고혈압을 위해 약물을 처방했다."},{"en":"He takes daily medication to control his allergies.","ko":"그는 알레르기를 조절하기 위해 매일 약을 복용한다."}],"grammarNote":"medication은 보통 셀 수 없는 명사로 쓰지만, 여러 종류의 약을 가리킬 때 medications로 복수형이 쓰인다. take medication처럼 무관사 관용 표현이 자주 등장한다.","grammarQuiz":[{"sentence":"The patient must _____ this _____ three times a day with meals for the best possible results.","ko":"그 환자는 최상의 결과를 위해 식사와 함께 하루 세 번 이 약을 복용해야 한다.","answer":["take","medication"],"hint":"관용 동사 take와 무관사 명사"}]},
    {"id":"w04157","w":"miracle","pos":["n"],"ph":"/ˈmɪrəkəl/","cefr":"B1","kr":["기적"],"ex":[{"en":"It was a true miracle.","ko":"그것은 진정한 기적이었다."}],"mnemonic":{"soundHint":"미러클 → '미(美) 러(러시아)클'","story":"'미러클' 하며 기적을 외치다! 감탄사처럼 사용되는 단어.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"wonder","ko":"경이","reason":"동의어 관계"},{"w":"medical","ko":"의학적","reason":"의학적 기적 콜로케이션"},{"w":"faith","ko":"믿음","reason":"기적 시나리오 연관"}],"collocBest":[]},"nuance":{"koSimple":"상상 밖의 놀라운 일.","whenToUse":"생존·완치처럼 믿기 힘든 일 말할 때."},"krDetail":[{"ko":"기적","explain":"설명하기 힘든 놀라운 일"}],"usageExamples":[{"en":"Doctors called her recovery a medical miracle.","ko":"의사들은 그녀의 회복을 의학적 기적이라 불렀다."},{"en":"Many prayed for a miracle, but nothing changed for weeks.","ko":"많은 사람들이 기적을 빌었지만 몇 주 동안 아무것도 바뀌지 않았다."}],"grammarNote":"miracle은 셀 수 있는 명사로 a miracle, miracles로 써. 학생들은 wonder처럼 불가산으로 쓰기 쉬워. work a miracle(기적을 일으키다)이 관용 표현이야.","grammarQuiz":[{"sentence":"Everyone _____ a _____ would save the trapped miners from the collapse.","ko":"모두가 기적이 무너진 갱도에 갇힌 광부들을 구해 주길 바랐다.","answer":["hoped","miracle"],"hint":"동사 과거형 + a ___"}]},
    {"id":"w03818","w":"lever","pos":["n","v"],"ph":"/ˈliːvər/","cefr":"B1","kr":["지렛대","레버"],"ex":[{"en":"Use this lever to open the machine.","ko":"이 레버를 사용하여 기계를 여세요."}],"mnemonic":{"soundHint":"레버 → 기계 '레버'","story":"'기어 레버'처럼 외래어 그대로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"handle","ko":"손잡이","reason":"동의어, 조작 도구 시나리오"},{"w":"pull","ko":"당기다","reason":"pull a lever 콜로 짝"},{"w":"leverage","ko":"지렛대 작용","reason":"파생어, 어원 짝"}],"collocBest":[{"en":"pull a lever","ko":"레버를 당기다"},{"en":"use as a lever","ko":"지렛대로 쓰다"}]},"nuance":{"koSimple":"힘을 지렛대처럼 쓰는 손잡이.","whenToUse":"기계 조작 손잡이·지렛대에."},"krDetail":[{"ko":"지렛대","explain":"무거운 것을 드는 막대"},{"ko":"레버","explain":"밀거나 당기는 손잡이"}],"usageExamples":[{"en":"He pulled the lever to open the door.","ko":"그는 문을 열려고 레버를 당겼다."},{"en":"A long stick can work as a lever.","ko":"긴 막대는 지렛대 역할을 할 수 있다."}],"grammarNote":"lever는 명사와 동사 모두로 쓰이며, 명사로 쓸 때는 관사 a와 함께 셀 수 있는 명사로 취급한다.","grammarQuiz":[{"sentence":"The worker firmly _____ the heavy _____ down to start the machine safely.","ko":"작업자는 기계를 안전하게 시작하려고 무거운 레버를 힘차게 당겨 내렸다.","answer":["pulled","lever"],"hint":"타동사 과거형 + 단수 가산명사"}]},
