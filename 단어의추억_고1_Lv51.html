    {"id":"v08760","w":"maturity","pos":["phrase"],"ph":"","cefr":"B1","kr":["성숙(기), 원숙(기)"],"ex":[{"en":"Emotional maturity is often more important than intelligence for real long-term success.","ko":"정서적 성숙은 진정한 장기적 성공을 위해 종종 지능보다 더 중요하다."}],"mnemonic":{"soundHint":"머츄리티","story":"mature(잘 익은, '매춰'된 과일) + ity(명사화) — 다 익은 상태 = 성숙","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mature","ko":"성숙한","reason":"동일 어근 형용사"},{"w":"adulthood","ko":"성인기","reason":"생애 단계에서의 '성숙기' 의미 겹침"},{"w":"ripeness","ko":"익음, 원숙","reason":"과일/사람이 '다 익은' 상태 비유 공유"}],"collocBest":[{"en":"reach maturity","ko":"성숙기에 이르다"},{"en":"emotional maturity","ko":"정서적 성숙"}]},"nuance":{"koSimple":"몸이나 마음이 충분히 자라 완성된 상태를 뜻해요.","whenToUse":"정서적·신체적 성숙이나 판단력의 원숙함을 말할 때 씁니다."},"krDetail":[{"ko":"성숙(기), 원숙(기)","explain":"충분히 자란 상태"}],"usageExamples":[{"en":"He showed great maturity in handling the difficult situation.","ko":"그는 그 어려운 상황을 다루면서 대단한 성숙함을 보였다."},{"en":"The fruit reaches full maturity in late summer.","ko":"그 과일은 늦여름에 완전히 익는다."}],"grammarNote":"maturity는 형용사 mature의 명사형으로 신체적, 정서적 '성숙'을 모두 뜻한다. 금융에서는 '만기'라는 뜻으로도 쓰인다.","grammarQuiz":[{"sentence":"Emotional maturity is often considered _____ (be) more important than intelligence.","ko":"정서적 성숙은 종종 지능보다 더 중요하다고 여겨진다.","answer":"to be","hint":"consider + to부정사"}]},
    {"id":"v08763","w":"miss out on","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 놓치다"],"ex":[{"en":"Don't miss out on the amazing chance to study abroad this coming summer.","ko":"다가오는 여름에 유학할 놀라운 기회를 놓치지 마세요."}],"mnemonic":{"soundHint":"미스 아웃 온","story":"miss(놓치다) + out on(~에서 빠지다) - 좋은 기회에서 벗어나 놓치다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"miss","ko":"놓치다","reason":"핵심 동사"},{"w":"lose out on","ko":"~을 놓치다","reason":"동일 의미 구동사"},{"w":"skip","ko":"건너뛰다","reason":"기회를 지나쳐 버림의 유사 개념"}],"collocBest":[{"en":"miss out on the opportunity","ko":"기회를 놓치다"},{"en":"miss out on the fun","ko":"재미를 놓치다"}]},"nuance":{"koSimple":"좋은 기회나 즐거움을 아깝게 놓쳐 버린다는 뜻이에요.","whenToUse":"누리지 못해 아쉬운 기회·경험을 강조할 때 씁니다."},"krDetail":[{"ko":"~을 놓치다","explain":"좋은 기회를 못 잡다"}],"usageExamples":[{"en":"Don't miss out on this rare chance to meet the author.","ko":"그 작가를 만날 이 드문 기회를 놓치지 마라."},{"en":"I missed out on the concert because I was sick.","ko":"나는 아파서 그 콘서트를 놓쳤다."}],"grammarNote":"miss out on 뒤에는 명사나 동명사가 온다. 좋은 기회나 경험을 '놓치다'라는 뜻으로 아쉬움의 뉘앙스가 있다.","grammarQuiz":[{"sentence":"Don't miss out on the amazing chance _____ (study) abroad this summer.","ko":"이번 여름에 유학할 놀라운 기회를 놓치지 마세요.","answer":"to study","hint":"chance + to부정사"}]},
    {"id":"v08766","w":"mould","pos":["noun"],"ph":"","cefr":"B1","kr":["틀, 만들다"],"ex":[{"en":"Great teachers mould the character of young students during their crucial school years.","ko":"훌륭한 교사들은 결정적인 학창 시절 동안 어린 학생들의 인격을 형성한다."}],"mnemonic":{"soundHint":"몰드","story":"붕어빵 '몰드(mould)' — 반죽을 부어 모양을 잡는 틀, 그래서 인격을 '만들다'","hintConfidence":2},"pairs":{"buddyWords":[{"w":"shape","ko":"형태를 잡다","reason":"'틀에 넣어 모양 잡다' 의미 겹침"},{"w":"form","ko":"형성하다","reason":"인격·성격을 형성한다는 동일 용법"},{"w":"cast","ko":"주조하다","reason":"틀에 부어 만드는 물리적 이미지 공유"}],"collocBest":[{"en":"break the mould","ko":"틀을 깨다"},{"en":"mould the clay","ko":"점토를 만들다"}]},"nuance":{"koSimple":"무언가를 특정한 모양이나 성격으로 빚어낸다는 뜻이에요.","whenToUse":"찰흙 같은 물체나 사람의 인격을 형성할 때 씁니다."},"krDetail":[{"ko":"틀, 만들다","explain":"모양을 잡는 틀"}],"usageExamples":[{"en":"The hot metal was poured into a mould to cool.","ko":"뜨거운 금속을 틀에 부어 식혔다."},{"en":"Good habits help mould a child's future character.","ko":"좋은 습관은 아이의 미래 성격을 형성하는 데 도움이 된다."}],"grammarNote":"mould(미국식 mold)는 명사로 '틀', 동사로 '(틀에 넣어) 만들다, 형성하다'를 뜻한다. 성격이나 인재를 '길러내다'라는 비유적 의미로도 쓰인다.","grammarQuiz":[{"sentence":"The character of young students is _____ (mould) by great teachers.","ko":"어린 학생들의 인격은 훌륭한 교사들에 의해 형성된다.","answer":"moulded","hint":"수동태 be + p.p."}]},
    {"id":"v08769","w":"mysterious","pos":["adj"],"ph":"","cefr":"B1","kr":["신비한","불가사의한","비밀의"],"ex":[{"en":"A mysterious light appeared in the sky above our neighborhood last night.","ko":"지난밤 우리 동네 하늘 위에 신비한 빛이 나타났다."}],"mnemonic":{"soundHint":"미스터리어스","story":"mystery(미스터리) + ous(형용사) — 미스터리한 = 신비한/불가사의한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mystery","ko":"미스터리, 수수께끼","reason":"동일 어근 명사"},{"w":"strange","ko":"이상한, 낯선","reason":"설명 불가한 느낌 공유"},{"w":"secret","ko":"비밀의","reason":"'비밀의' 의미 겹침"}],"collocBest":[{"en":"mysterious stranger","ko":"신비한 낯선 사람"},{"en":"mysterious disappearance","ko":"불가사의한 실종"}]},"nuance":{"koSimple":"설명하기 어렵고 알 수 없어 신비롭게 느껴지는 느낌이에요.","whenToUse":"정체 모를 사건·인물·현상을 묘사할 때 씁니다."},"krDetail":[{"ko":"신비한","explain":"설명하기 어려운"},{"ko":"불가사의한","explain":"이해할 수 없는"},{"ko":"비밀의","explain":"감춰져 알 수 없는"}],"usageExamples":[{"en":"A mysterious stranger left a note at the front door.","ko":"수수께끼 같은 낯선 사람이 현관에 쪽지를 남겼다."},{"en":"There is something mysterious about that old empty house.","ko":"그 낡고 텅 빈 집에는 무언가 불가사의한 것이 있다."}],"grammarNote":"mysterious는 명사 mystery의 형용사형으로 '신비한, 수수께끼 같은'을 뜻한다. 부사형은 mysteriously이다.","grammarQuiz":[{"sentence":"A mysterious light _____ (appear) in the sky above our neighborhood since last night.","ko":"지난밤부터 우리 동네 하늘 위에 신비한 빛이 나타나 있다.","answer":"has appeared","hint":"since ~ 현재완료"}]},
    {"id":"v08772","w":"numerical","pos":["noun"],"ph":"","cefr":"B1","kr":["수의"],"ex":[{"en":"Please arrange the following data in numerical order before writing your report.","ko":"보고서를 쓰기 전에 다음 데이터를 수의 순서대로 배열하세요."}],"mnemonic":{"soundHint":"누머리컬","story":"number(숫자) + ical(형용사) — 숫자의 = 수의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"number","ko":"숫자","reason":"동일 어근"},{"w":"numeric","ko":"숫자의","reason":"거의 동의어 형용사"},{"w":"digit","ko":"숫자, 자릿수","reason":"수치 개념 공유"}],"collocBest":[{"en":"in numerical order","ko":"수의 순서로"},{"en":"numerical value","ko":"수치"}]},"nuance":{"koSimple":"숫자로 나타내거나 숫자와 관련된 것을 뜻해요.","whenToUse":"수치 데이터·번호 순서 같은 계량적 요소를 말할 때 씁니다."},"krDetail":[{"ko":"수의","explain":"숫자에 관한"}],"usageExamples":[{"en":"Each student is given a numerical code for the exam.","ko":"각 학생은 시험을 위한 숫자 코드를 받는다."},{"en":"List the answers in numerical order from one to ten.","ko":"답을 1부터 10까지 숫자 순서로 나열하라."}],"grammarNote":"numerical은 '수의, 숫자상의'라는 형용사로 in numerical order(숫자 순서로)처럼 쓰이며 number와 어원이 같다.","grammarQuiz":[{"sentence":"The data _____ (arrange) in numerical order must be submitted before noon.","ko":"수의 순서대로 배열된 데이터는 정오 전에 제출되어야 한다.","answer":"arranged","hint":"과거분사 후치수식"}]},
    {"id":"v08775","w":"ornamental","pos":["phrase"],"ph":"","cefr":"B1","kr":["장식의, 장식용의"],"ex":[{"en":"The ornamental plants in the school garden bloom beautifully every early spring.","ko":"학교 정원의 장식용 식물들은 이른 봄마다 아름답게 핀다."}],"mnemonic":{"soundHint":"오너먼틀","story":"크리스마스 트리의 ornament(장식품) + al — 장식용의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ornament","ko":"장식품","reason":"동일 어근 명사"},{"w":"decorative","ko":"장식적인","reason":"동의어 형용사"},{"w":"ornate","ko":"화려하게 장식된","reason":"같은 orn- 어근"}],"collocBest":[{"en":"ornamental plants","ko":"장식용 식물"},{"en":"ornamental design","ko":"장식의 디자인"}]},"nuance":{"koSimple":"실용성보다 보기 좋게 꾸미기 위한 장식용이라는 뜻이에요.","whenToUse":"관상용 식물·소품처럼 미관을 위한 대상에 씁니다."},"krDetail":[{"ko":"장식의, 장식용의","explain":"꾸미기 위한"}],"usageExamples":[{"en":"The garden was full of ornamental stones and small ponds.","ko":"그 정원은 장식용 돌과 작은 연못으로 가득했다."},{"en":"These plates are purely ornamental, not for eating.","ko":"이 접시들은 순전히 장식용이지 먹기 위한 것이 아니다."}],"grammarNote":"ornamental은 명사 ornament(장식품)의 형용사형으로 '실용보다 장식을 위한'이라는 뜻이다. 식물이나 물건을 꾸밀 때 자주 쓴다.","grammarQuiz":[{"sentence":"The ornamental plants _____ (plant) in the school garden bloom every spring.","ko":"학교 정원에 심어진 장식용 식물들은 매년 봄에 핀다.","answer":"planted","hint":"과거분사 후치수식"}]},
    {"id":"v08778","w":"outdated","pos":["noun"],"ph":"","cefr":"B1","kr":["구식의"],"ex":[{"en":"This textbook contains outdated information that no longer reflects modern research.","ko":"이 교과서에는 현대 연구를 더 이상 반영하지 않는 구식의 정보가 담겨 있다."}],"mnemonic":{"soundHint":"아웃데이티드","story":"out(밖으로) + date(날짜) + ed — 날짜(유효기간)가 지나 밀려난 = 구식의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"obsolete","ko":"구식의, 쓸모없어진","reason":"동의어 형용사"},{"w":"old-fashioned","ko":"구식의","reason":"동일한 '시대에 뒤진' 의미"},{"w":"up-to-date","ko":"최신의","reason":"정반대 짝, 대조 학습용"}],"collocBest":[{"en":"outdated technology","ko":"구식의 기술"},{"en":"outdated information","ko":"구식의 정보"}]},"nuance":{"koSimple":"시대에 뒤떨어져 더 이상 쓸모가 없다는 뜻이에요.","whenToUse":"낡은 정보·기술·방식이 이미 구식이 됐을 때 씁니다."},"krDetail":[{"ko":"구식의","explain":"낡아 쓸모없어진"}],"usageExamples":[{"en":"The company still uses outdated computers from ten years ago.","ko":"그 회사는 아직도 10년 전의 구식 컴퓨터를 사용한다."},{"en":"His ideas about fashion are completely outdated now.","ko":"패션에 대한 그의 생각은 이제 완전히 구식이다."}],"grammarNote":"outdated는 '시대에 뒤진, 구식의'라는 뜻의 형용사로 out of date와 같은 의미다. 반대말은 up to date(최신의)이다.","grammarQuiz":[{"sentence":"This textbook contains outdated information _____ no longer reflects modern research.","ko":"이 교과서에는 현대 연구를 더 이상 반영하지 않는 구식의 정보가 담겨 있다.","answer":"which","hint":"관계대명사 주격"}]},
    {"id":"v08781","w":"outweigh","pos":["noun"],"ph":"","cefr":"B1","kr":["~보다 무겁다"],"ex":[{"en":"The benefits of daily exercise clearly outweigh the small effort it requires.","ko":"매일 운동의 이점은 그것이 요구하는 작은 노력을 분명히 능가한다."}],"mnemonic":{"soundHint":"아웃웨이","story":"out(더 넘어) + weigh(무게 나가다) — 무게에서 앞서다 = 능가하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"weigh","ko":"무게가 나가다, 저울질하다","reason":"동일 어근 동사"},{"w":"exceed","ko":"능가하다, 초과하다","reason":"'이익이 위험을 넘어선다'의 동의어"},{"w":"surpass","ko":"능가하다","reason":"동의 표현"}],"collocBest":[{"en":"benefits outweigh the risks","ko":"이익이 위험보다 무겁다"},{"en":"outweigh the disadvantages","ko":"단점보다 무겁다"}]},"nuance":{"koSimple":"무게나 가치·중요성에서 다른 것보다 더 크다는 뜻이에요.","whenToUse":"장단점을 비교해 한쪽이 더 크다고 말할 때 씁니다."},"krDetail":[{"ko":"~보다 무겁다","explain":"더 크거나 중요하다"}],"usageExamples":[{"en":"The advantages of the plan far outweigh its costs.","ko":"그 계획의 장점은 비용을 훨씬 능가한다."},{"en":"For her, family always outweighs work.","ko":"그녀에게는 가족이 언제나 일보다 중요하다."}],"grammarNote":"outweigh는 무게뿐 아니라 '(중요성이나 가치가) ~을 능가하다'라는 뜻으로 자주 쓰인다. benefits outweigh the risks 같은 표현이 대표적이다.","grammarQuiz":[{"sentence":"The benefits of daily exercise clearly outweigh the effort _____ it requires.","ko":"매일 운동의 이점은 그것이 요구하는 노력을 분명히 능가한다.","answer":"that","hint":"관계대명사 목적격"}]},
    {"id":"v08784","w":"overvalue","pos":["phrase"],"ph":"","cefr":"B1","kr":["과대평가하다, 지나치게 중시하다"],"ex":[{"en":"Modern society tends to overvalue academic grades over creativity and genuine character.","ko":"현대 사회는 창의성과 진정한 인격보다 학업 성적을 과대평가하는 경향이 있다."}],"mnemonic":{"soundHint":"오버밸류","story":"over(넘게) + value(가치를 매기다) — 가치를 넘게 매기다 = 과대평가하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"overestimate","ko":"과대평가하다","reason":"동의어"},{"w":"overrate","ko":"과대평가하다","reason":"over- 접두 동일 패턴"},{"w":"undervalue","ko":"과소평가하다","reason":"정반대 짝, 대조 학습용"}],"collocBest":[{"en":"overvalue the stock","ko":"주식을 과대평가하다"},{"en":"overvalue material things","ko":"물질적인 것을 지나치게 중시하다"}]},"nuance":{"koSimple":"실제 가치보다 지나치게 높게 평가한다는 뜻이에요.","whenToUse":"성적·재산·능력을 부풀려 판단하는 태도를 비판할 때 씁니다."},"krDetail":[{"ko":"과대평가하다, 지나치게 중시하다","explain":"실제보다 높이 평가하다"}],"usageExamples":[{"en":"Investors often overvalue popular stocks during a boom.","ko":"투자자들은 호황기에 인기 주식을 과대평가하곤 한다."},{"en":"We tend to overvalue things we already own.","ko":"우리는 이미 소유한 것을 지나치게 높이 평가하는 경향이 있다."}],"grammarNote":"overvalue는 접두사 over-(지나치게)와 value(평가하다)가 결합한 동사로 '과대평가하다'를 뜻한다. 반대말은 undervalue(과소평가하다)이다.","grammarQuiz":[{"sentence":"Academic grades tend _____ (overvalue) in modern society over creativity.","ko":"학업 성적은 현대 사회에서 창의성보다 과대평가되는 경향이 있다.","answer":"to be overvalued","hint":"tend + to부정사 수동태"}]},
    {"id":"v08787","w":"perilous","pos":["adj"],"ph":"","cefr":"B1","kr":["아주 위험한"],"ex":[{"en":"The climbers began a perilous journey up the icy face of Mount Everest.","ko":"등반가들은 에베레스트 산의 얼음 절벽 위로 위험한 여정을 시작했다."}],"mnemonic":{"soundHint":"페릴러스","story":"peril(위험) + ous(가득한) — 위험이 가득한 = 아주 위험한","hintConfidence":2},"pairs":{"buddyWords":[{"w":"peril","ko":"위험","reason":"동일 어근 명사"},{"w":"dangerous","ko":"위험한","reason":"가장 흔한 동의어"},{"w":"hazardous","ko":"위험한","reason":"격식체 동의어"}],"collocBest":[{"en":"perilous journey","ko":"아주 위험한 여정"},{"en":"perilous situation","ko":"아주 위험한 상황"}]},"nuance":{"koSimple":"매우 심각한 위험이 도사리고 있다는 강한 느낌이에요.","whenToUse":"생명이 위태로울 만한 여정·상황을 문어체로 표현할 때 씁니다."},"krDetail":[{"ko":"아주 위험한","explain":"몹시 위태로운"}],"usageExamples":[{"en":"They made a perilous crossing over the flooded river.","ko":"그들은 물이 불어난 강을 건너는 위험한 도하를 감행했다."},{"en":"Sailing in such a storm is extremely perilous.","ko":"그런 폭풍 속에서 항해하는 것은 극도로 위험하다."}],"grammarNote":"perilous는 명사 peril(위험)의 형용사형으로 dangerous보다 문어적이다. perilous journey처럼 위험한 여정을 묘사할 때 자주 쓴다.","grammarQuiz":[{"sentence":"_____ (climb) the icy face, the team began a perilous journey up Mount Everest.","ko":"얼음 절벽을 오르며, 팀은 에베레스트 산 위로 위험한 여정을 시작했다.","answer":"Climbing","hint":"분사구문 (능동)"}]},
    {"id":"v08790","w":"physiological","pos":["adj"],"ph":"","cefr":"B1","kr":["생리적인"],"ex":[{"en":"Stress causes many physiological changes that can affect a student's overall health.","ko":"스트레스는 학생의 전반적인 건강에 영향을 미칠 수 있는 많은 생리적 변화를 일으킨다."}],"mnemonic":{"soundHint":"피지올로지컬","story":"physiology(생리학) + cal(형용사) — 생리학의 = 생리적인","hintConfidence":2},"pairs":{"buddyWords":[{"w":"physical","ko":"신체적인","reason":"phys- 어근 공유, 신체 관련"},{"w":"biological","ko":"생물학적인","reason":"-logical 접미 동일 패턴, 생명 현상 계열"},{"w":"physiology","ko":"생리학","reason":"동일 어근 명사"}],"collocBest":[{"en":"physiological response","ko":"생리적인 반응"},{"en":"physiological needs","ko":"생리적인 욕구"}]},"nuance":{"koSimple":"몸의 생리적 기능이나 작용과 관련된다는 뜻이에요.","whenToUse":"호르몬·혈압 같은 신체 반응을 학술적으로 말할 때 씁니다."},"krDetail":[{"ko":"생리적인","explain":"몸의 작용에 관한"}],"usageExamples":[{"en":"Fear produces clear physiological responses like a racing heart.","ko":"공포는 심장이 빨리 뛰는 것 같은 뚜렷한 생리적 반응을 일으킨다."},{"en":"Sleep has an important physiological effect on the brain.","ko":"수면은 뇌에 중요한 생리적 영향을 미친다."}],"grammarNote":"physiological은 physiology(생리학)의 형용사형으로 신체의 기능이나 작용에 관한 것을 뜻한다. 심리적인 psychological과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"Stress causes many physiological changes _____ can affect a student's health.","ko":"스트레스는 학생의 건강에 영향을 미칠 수 있는 많은 생리적 변화를 일으킨다.","answer":"that","hint":"관계대명사 주격"}]},
    {"id":"v08793","w":"pollen","pos":["noun"],"ph":"","cefr":"B1","kr":["꽃가루"],"ex":[{"en":"Every spring, high pollen levels make many Korean students suffer from allergies.","ko":"매년 봄, 높은 꽃가루 수치는 많은 한국 학생들이 알레르기로 고생하게 만든다."}],"mnemonic":{"soundHint":"폴렌","story":"봄에 노란 '폴렌'이 콧속으로 들어와 재채기 — 꽃가루","hintConfidence":1},"pairs":{"buddyWords":[{"w":"pollinate","ko":"수분하다","reason":"동일 어근 동사"},{"w":"allergy","ko":"알레르기","reason":"pollen allergy 강한 연상"},{"w":"bee","ko":"벌","reason":"꽃가루를 옮기는 대표 매개체"}],"collocBest":[{"en":"pollen allergy","ko":"꽃가루 알레르기"},{"en":"spread pollen","ko":"꽃가루를 퍼뜨리다"}]},"nuance":{"koSimple":"꽃에서 나오는 미세한 가루로 꽃가루를 뜻해요.","whenToUse":"봄철 알레르기나 식물 수분을 말할 때 씁니다."},"krDetail":[{"ko":"꽃가루","explain":"꽃의 노란 가루"}],"usageExamples":[{"en":"Bees carry pollen from one flower to another.","ko":"벌들은 꽃가루를 이 꽃에서 저 꽃으로 옮긴다."},{"en":"The pollen count is very high on windy spring days.","ko":"바람 부는 봄날에는 꽃가루 농도가 매우 높다."}],"grammarNote":"pollen은 셀 수 없는 명사로 '꽃가루'를 뜻한다. 알레르기를 유발하는 물질로 pollen allergy, pollen count(꽃가루 농도) 등으로 쓰인다.","grammarQuiz":[{"sentence":"Every spring, high pollen levels make many Korean students _____ (suffer) from allergies.","ko":"매년 봄, 높은 꽃가루 수치는 많은 한국 학생들이 알레르기로 고생하게 만든다.","answer":"suffer","hint":"사역동사 make + 원형부정사 (5형식)"}]},
    {"id":"v08796","w":"precipitation","pos":["noun"],"ph":"","cefr":"B1","kr":["강수"],"ex":[{"en":"Annual precipitation in Korea has decreased significantly over the past twenty years.","ko":"한국의 연간 강수량은 지난 20년 동안 상당히 감소했다."}],"mnemonic":{"soundHint":"프리시피테이션","story":"pre(미리) + cip(떨어지다) + ation — 하늘에서 떨어지는 것 = 강수","hintConfidence":2},"pairs":{"buddyWords":[{"w":"rainfall","ko":"강우량","reason":"가장 흔한 강수 형태"},{"w":"snowfall","ko":"강설량","reason":"강수의 또 다른 형태"},{"w":"downpour","ko":"폭우","reason":"강한 강수의 이미지"}],"collocBest":[{"en":"heavy precipitation","ko":"많은 강수"},{"en":"annual precipitation","ko":"연간 강수"}]},"nuance":{"koSimple":"비·눈처럼 하늘에서 내리는 물의 총량을 뜻해요.","whenToUse":"기상·기후 자료에서 강수량을 학술적으로 다룰 때 씁니다."},"krDetail":[{"ko":"강수","explain":"비나 눈이 내리는 것"}],"usageExamples":[{"en":"Farmers depend on regular precipitation to grow their crops each season.","ko":"농부들은 매 계절 작물을 기르기 위해 규칙적인 강수에 의존한다."},{"en":"The desert receives very little precipitation throughout the entire year.","ko":"그 사막은 일 년 내내 강수량이 매우 적다."}],"grammarNote":"'precipitation'은 보통 셀 수 없는 명사로 쓰이며 '비, 눈, 우박' 등을 통틀어 가리키는 학술적 표현이다. 형용사 'annual(연간의), heavy(많은)' 등과 자주 결합한다.","grammarQuiz":[{"sentence":"Annual precipitation in Korea _____ (decrease) significantly over the past twenty years.","ko":"한국의 연간 강수량은 지난 20년 동안 상당히 감소했다.","answer":"has decreased","hint":"over the past ~ 현재완료"}]},
    {"id":"v08799","w":"preoccupy","pos":["verb"],"ph":"","cefr":"B1","kr":["몰두하게 하다"],"ex":[{"en":"Concerns about the final exam preoccupied his mind for the entire vacation week.","ko":"기말고사에 대한 걱정이 방학 내내 그의 마음을 사로잡았다."}],"mnemonic":{"soundHint":"프리아큐파이","story":"pre(미리) + occupy(점령하다) — 마음을 미리 점령하다 = 몰두하게 하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"occupy","ko":"차지하다, 점령하다","reason":"동일 어근 동사"},{"w":"absorb","ko":"몰두시키다","reason":"마음을 온통 사로잡는다는 의미 공유"},{"w":"obsess","ko":"사로잡다","reason":"'생각에서 떠나지 않게 하다' 계열"}],"collocBest":[{"en":"preoccupy one's mind","ko":"마음을 몰두하게 하다"},{"en":"preoccupied with work","ko":"일에 몰두하게 된"}]},"nuance":{"koSimple":"어떤 생각이 머릿속을 온통 차지해 몰두하게 만든다는 뜻이에요.","whenToUse":"걱정이나 관심사가 다른 일을 못 할 만큼 사로잡을 때 씁니다."},"krDetail":[{"ko":"몰두하게 하다","explain":"생각을 온통 차지하다"}],"usageExamples":[{"en":"Worries about her sick grandmother preoccupied her all day.","ko":"아픈 할머니에 대한 걱정이 하루 종일 그녀를 몰두하게 했다."},{"en":"He was so preoccupied with his phone that he missed the bus stop.","ko":"그는 휴대폰에 너무 몰두한 나머지 버스 정류장을 놓쳤다."}],"grammarNote":"주로 수동형 'be preoccupied with ~'로 쓰여 '~에 몰두해 있다, ~에 정신이 팔려 있다'라는 뜻을 나타낸다. 걱정·생각이 마음을 차지하는 상황에 쓴다.","grammarQuiz":[{"sentence":"His mind _____ (preoccupy) with concerns about the final exam for the entire week.","ko":"그의 마음은 일주일 내내 기말고사에 대한 걱정으로 사로잡혀 있었다.","answer":"was preoccupied","hint":"수동태 be + p.p."}]},
    {"id":"v08802","w":"probability","pos":["noun"],"ph":"","cefr":"B1","kr":["가능성"],"ex":[{"en":"The probability of rain tomorrow is about 80 percent, according to the forecast.","ko":"예보에 따르면 내일 비가 올 가능성은 약 80퍼센트이다."}],"mnemonic":{"soundHint":"프라버빌리티","story":"probable(있을 법한) + ility — 있을 법한 정도 = 확률/가능성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"probable","ko":"있을 법한","reason":"동일 어근 형용사"},{"w":"likelihood","ko":"가능성","reason":"가장 가까운 동의어"},{"w":"chance","ko":"가능성, 기회","reason":"구어체 동의어"}],"collocBest":[{"en":"high probability","ko":"높은 가능성"},{"en":"probability of success","ko":"성공 가능성"}]},"nuance":{"koSimple":"어떤 일이 실제로 일어날 가능성의 정도를 뜻해요.","whenToUse":"확률·예측처럼 수치로 가능성을 말할 때 씁니다."},"krDetail":[{"ko":"가능성","explain":"일이 일어날 확률"}],"usageExamples":[{"en":"There is a high probability that the team will win the final match.","ko":"그 팀이 결승전에서 이길 가능성이 높다."},{"en":"Scientists calculate the probability of an earthquake in this region.","ko":"과학자들은 이 지역에서 지진이 일어날 가능성을 계산한다."}],"grammarNote":"'the probability of + 명사/동명사' 또는 'the probability that + 절' 형태로 확률·가능성을 표현한다. 형용사 'high/low'와 자주 결합하며 수학·통계에서는 '확률'로 번역된다.","grammarQuiz":[{"sentence":"If the probability of rain _____ (be) higher, we would cancel the picnic.","ko":"만약 비가 올 가능성이 더 높다면, 우리는 소풍을 취소할 텐데.","answer":"were","hint":"가정법 과거"}]},
    {"id":"v08805","w":"prose","pos":["noun"],"ph":"","cefr":"B1","kr":["산문"],"ex":[{"en":"Her elegant prose style makes even complex ideas easy for readers to understand.","ko":"그녀의 우아한 산문 문체는 복잡한 생각조차 독자들이 이해하기 쉽게 만든다."}],"mnemonic":{"soundHint":"프로즈","story":"'프로(전문) 작가가 쓰는 시가 아닌 글' — 산문","hintConfidence":1},"pairs":{"buddyWords":[{"w":"poetry","ko":"시","reason":"산문의 대조 개념, 세트로 학습"},{"w":"essay","ko":"수필","reason":"대표적 산문 형식"},{"w":"novel","ko":"소설","reason":"산문 문학의 대표 장르"}],"collocBest":[{"en":"write in prose","ko":"산문으로 쓰다"},{"en":"prose style","ko":"산문 문체"}]},"nuance":{"koSimple":"운율이 없는 보통의 글, 즉 산문을 뜻해요.","whenToUse":"시가 아닌 소설·수필 같은 서술체 글을 말할 때 씁니다."},"krDetail":[{"ko":"산문","explain":"운율 없는 보통 글"}],"usageExamples":[{"en":"Novels and essays are written in prose, not in verse.","ko":"소설과 수필은 운문이 아니라 산문으로 쓰인다."},{"en":"His clear prose makes difficult topics easy to follow.","ko":"그의 명료한 산문은 어려운 주제를 이해하기 쉽게 만든다."}],"grammarNote":"'prose(산문)'는 셀 수 없는 명사로, 운율이 있는 'verse(운문)·poetry(시)'와 대비되는 개념이다. 문학에서 일반적인 문장 형태의 글을 가리킨다.","grammarQuiz":[{"sentence":"Her elegant prose style makes complex ideas _____ (understand) by readers easily.","ko":"그녀의 우아한 산문 문체는 복잡한 생각을 독자들이 쉽게 이해되게 만든다.","answer":"understood","hint":"make + O + p.p. (5형식 수동)"}]},
    {"id":"v08808","w":"put out","pos":["phrase"],"ph":"","cefr":"B1","kr":["(불을) 끄다","(쓰레기 등을) 내다 놓다"],"ex":[{"en":"Firefighters worked all night to put out the massive forest fire in Gangwon.","ko":"소방관들은 강원도의 대규모 산불을 끄기 위해 밤새 일했다."}],"mnemonic":{"soundHint":"풋 아웃","story":"put(두다) + out(꺼진 상태/밖으로) - 불을 꺼서 두거나 쓰레기를 밖에 내놓다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"extinguish","ko":"(불을) 끄다","reason":"격식 동의어"},{"w":"put off","ko":"미루다","reason":"put + 방향 부사 구동사 세트"},{"w":"put away","ko":"치우다","reason":"put + 방향 부사 구동사 세트"}],"collocBest":[{"en":"put out the fire","ko":"불을 끄다"},{"en":"put out the trash","ko":"쓰레기를 내다 놓다"}]},"nuance":{"koSimple":"불을 꺼서 없애거나 무언가를 밖에 내놓는 행동이에요.","whenToUse":"화재 진압이나 쓰레기·빨래 등을 내놓을 때 씁니다."},"krDetail":[{"ko":"(불을) 끄다","explain":"불길을 꺼서 없애다"},{"ko":"(쓰레기 등을) 내다 놓다","explain":"밖에 가져다 두다"}],"usageExamples":[{"en":"Please put out the candle before you leave the room.","ko":"방을 나가기 전에 촛불을 꺼 주세요."},{"en":"Don't forget to put out the trash on Tuesday night.","ko":"화요일 밤에 쓰레기 내놓는 것을 잊지 마세요."}],"grammarNote":"'put out'은 대표적으로 '(불·담배 등을) 끄다'와 '(밖에) 내놓다' 두 뜻이 있다. 목적어가 대명사면 'put it out'처럼 동사와 부사 사이에 넣는다.","grammarQuiz":[{"sentence":"Firefighters worked all night _____ (put) out the massive forest fire in Gangwon.","ko":"소방관들은 강원도의 대규모 산불을 끄기 위해 밤새 일했다.","answer":"to put","hint":"부사적 용법 (목적)"}]},
    {"id":"v08811","w":"randomization","pos":["phrase"],"ph":"","cefr":"B1","kr":["무작위[임의] 추출"],"ex":[{"en":"Randomization ensures that every student has an equal chance of being selected fairly.","ko":"무작위 추출은 모든 학생이 공정하게 선택될 동등한 기회를 갖도록 보장한다."}],"mnemonic":{"soundHint":"랜더마이제이션","story":"random(무작위) + ization(명사화) — 무작위 처리 = 무작위 추출","hintConfidence":3},"pairs":{"buddyWords":[{"w":"random","ko":"무작위의","reason":"동일 어근 형용사"},{"w":"randomize","ko":"무작위로 하다","reason":"동일 어근 동사"},{"w":"sampling","ko":"표본 추출","reason":"random sampling 강한 연상"}],"collocBest":[{"en":"randomization of samples","ko":"표본의 무작위 추출"},{"en":"proper randomization","ko":"적절한 임의 추출"}]},"nuance":{"koSimple":"정해진 규칙 없이 무작위로 뽑거나 배정하는 과정이에요.","whenToUse":"실험·통계에서 편향을 없애려 무작위 추출할 때 씁니다."},"krDetail":[{"ko":"무작위[임의] 추출","explain":"규칙 없이 뽑기"}],"usageExamples":[{"en":"Randomization removes bias when researchers assign patients to groups.","ko":"무작위 추출은 연구자들이 환자를 그룹에 배정할 때 편향을 없앤다."},{"en":"The lottery uses randomization to choose the winning numbers.","ko":"그 복권은 당첨 번호를 고르기 위해 무작위 추출을 사용한다."}],"grammarNote":"동사 'randomize(무작위로 배열하다)'의 명사형으로, 실험·통계에서 표본을 편향 없이 뽑는 절차를 뜻한다. 셀 수 없는 명사로 주로 쓰인다.","grammarQuiz":[{"sentence":"Randomization ensures that every student _____ (have) an equal chance of being selected.","ko":"무작위 추출은 모든 학생이 선택될 동등한 기회를 갖도록 보장한다.","answer":"has","hint":"명사절 that + 단수 주어"},{"sentence":"Randomization is a method _____ (use) by scientists to ensure fairness.","ko":"무작위 추출은 공정성을 보장하기 위해 과학자들이 사용하는 방법이다.","answer":"used","hint":"과거분사 후치수식"}]},
    {"id":"v08814","w":"read between the lines","pos":["phrase"],"ph":"","cefr":"B1","kr":["행간을 읽다, 속뜻을 읽다"],"ex":[{"en":"Reading between the lines, I could tell that she was not really happy.","ko":"행간을 읽어 보니, 나는 그녀가 정말로 행복하지 않다는 것을 알 수 있었다."}],"mnemonic":{"soundHint":"리드 비트윈 더 라인즈","story":"글줄(lines) 사이(between)를 읽다 - 겉이 아닌 속뜻을 파악.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"infer","ko":"추론하다","reason":"숨겨진 뜻을 짐작하는 행위"},{"w":"imply","ko":"암시하다","reason":"행간에 담긴 뜻의 짝 개념"},{"w":"subtext","ko":"속뜻, 저의","reason":"'행간에 담긴 의미' 자체"}],"collocBest":[{"en":"learn to read between the lines","ko":"행간을 읽는 법을 배우다"},{"en":"read between the lines of the letter","ko":"편지의 속뜻을 읽다"}]},"nuance":{"koSimple":"겉으로 드러나지 않은 숨은 뜻을 알아챈다는 표현이에요.","whenToUse":"말·글의 속뜻이나 감춰진 감정을 파악할 때 씁니다."},"krDetail":[{"ko":"행간을 읽다, 속뜻을 읽다","explain":"숨은 의미를 알아채다"}],"usageExamples":[{"en":"She didn't say she was upset, but I could read between the lines.","ko":"그녀는 화났다고 말하지 않았지만, 나는 속뜻을 읽을 수 있었다."},{"en":"You have to read between the lines to understand his real intention.","ko":"그의 진짜 의도를 이해하려면 행간을 읽어야 한다."}],"grammarNote":"'read between the lines'는 글이나 말에 직접 드러나지 않은 숨은 뜻을 파악한다는 관용 표현이다. 항상 이 어순 그대로 통째로 쓴다.","grammarQuiz":[{"sentence":"_____ (read) between the lines, I could tell that she was not really happy.","ko":"행간을 읽어 보니, 나는 그녀가 정말로 행복하지 않다는 것을 알 수 있었다.","answer":"Reading","hint":"분사구문 (능동)"}]},
    {"id":"v08817","w":"regress","pos":["verb"],"ph":"","cefr":"B1","kr":["되돌아가다","퇴행[퇴보]하다","귀환, 복귀","퇴행[퇴보]"],"ex":[{"en":"Without regular practice, English skills tend to regress quite rapidly for most learners.","ko":"규칙적인 연습이 없다면, 영어 실력은 대부분의 학습자에게 꽤 빨리 퇴보하는 경향이 있다."}],"mnemonic":{"soundHint":"리그레스","story":"re(뒤로) + gress(가다) — progress(앞으로)의 반대, 뒤로 가다 = 퇴행하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"progress","ko":"전진하다, 진전","reason":"정반대 짝, 세트 학습"},{"w":"digress","ko":"옆길로 새다","reason":"-gress 어근 동일"},{"w":"revert","ko":"되돌아가다","reason":"동의어 계열"}],"collocBest":[{"en":"regress to childhood","ko":"어린 시절로 되돌아가다"},{"en":"regress into old habits","ko":"오래된 습관으로 퇴행하다"}]},"nuance":{"koSimple":"이전의 낮은 단계나 상태로 다시 되돌아간다는 뜻이에요.","whenToUse":"실력·행동·상황이 예전 수준으로 퇴보할 때 씁니다."},"krDetail":[{"ko":"되돌아가다","explain":"이전 상태로 돌아가다"},{"ko":"퇴행[퇴보]하다","explain":"나빠져 뒤로 가다"},{"ko":"귀환, 복귀","explain":"본래대로 돌아옴"},{"ko":"퇴행[퇴보]","explain":"발전이 뒤로 감"}],"usageExamples":[{"en":"Without practice, his skills began to regress quickly.","ko":"연습이 없자 그의 실력은 빠르게 퇴보하기 시작했다."},{"en":"The patient regressed to childhood behavior under great stress.","ko":"그 환자는 극심한 스트레스 속에서 어린 시절 행동으로 퇴행했다."}],"grammarNote":"'regress'는 '앞으로 나아가다'인 'progress'의 반대말로, 이전 상태로 후퇴·퇴보함을 뜻한다. 동사와 명사로 모두 쓰이며 'regress to ~(~로 퇴행하다)' 형태가 흔하다.","grammarQuiz":[{"sentence":"Without regular practice, English skills tend to regress rapidly for most learners _____ study alone.","ko":"규칙적인 연습이 없다면, 영어 실력은 혼자 공부하는 대부분의 학습자에게 빨리 퇴보하는 경향이 있다.","answer":"who","hint":"관계대명사 주격 (사람)"}]},
    {"id":"v08820","w":"reminder","pos":["phrase"],"ph":"","cefr":"B1","kr":["생각나게 하는 것[사람], (상기시키는) 신호[조언]"],"ex":[{"en":"This photo serves as a lovely reminder of our unforgettable school field trip.","ko":"이 사진은 잊을 수 없는 우리 학교 수학여행을 상기시켜주는 사랑스러운 것이다."}],"mnemonic":{"soundHint":"리마인더","story":"remind(re+mind, 다시 마음에 떠올리게 하다) + er — 상기시키는 것/사람","hintConfidence":3},"pairs":{"buddyWords":[{"w":"remind","ko":"상기시키다","reason":"동일 어근 동사"},{"w":"memento","ko":"기념품, 추억거리","reason":"추억을 상기시키는 물건"},{"w":"notice","ko":"안내(문), 통지","reason":"상기 신호로서의 용법 겹침"}],"collocBest":[{"en":"a gentle reminder","ko":"부드러운 조언"},{"en":"send a reminder","ko":"상기시키는 신호를 보내다"}]},"nuance":{"koSimple":"잊지 않도록 무언가를 다시 떠올리게 해 주는 것이에요.","whenToUse":"기억을 되살리는 사진·알림·조언을 가리킬 때 씁니다."},"krDetail":[{"ko":"생각나게 하는 것[사람], (상기시키는) 신호[조언]","explain":"잊지 않게 알려 주는 것"}],"usageExamples":[{"en":"I set a reminder on my phone so I wouldn't forget the meeting.","ko":"회의를 잊지 않으려고 휴대폰에 알림을 설정했다."},{"en":"The old song is a reminder of my childhood summers.","ko":"그 옛 노래는 내 어린 시절 여름을 떠올리게 하는 것이다."}],"grammarNote":"동사 'remind(상기시키다)'의 명사형으로, 'a reminder of ~(~을 떠올리게 하는 것)' 또는 'a reminder to do(~하라는 알림)' 형태로 자주 쓰인다.","grammarQuiz":[{"sentence":"This photo serves as a lovely reminder of our field trip _____ (take) last month.","ko":"이 사진은 지난달 다녀온 우리 수학여행을 상기시켜주는 사랑스러운 것이다.","answer":"taken","hint":"과거분사 후치수식"}]},
    {"id":"v08823","w":"replicate","pos":["phrase"],"ph":"","cefr":"B1","kr":["모사하다, 복제하다"],"ex":[{"en":"Scientists tried to replicate the experiment to verify the earlier researcher's findings.","ko":"과학자들은 이전 연구자의 결과를 검증하기 위해 실험을 복제하려고 시도했다."}],"mnemonic":{"soundHint":"레플리케이트","story":"re(다시) + plic(접다) + ate — '레플리카(replica)'를 만들다 = 복제하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"replica","ko":"복제품, 모조품","reason":"동일 어근 명사"},{"w":"duplicate","ko":"복제하다","reason":"동의어 동사"},{"w":"reproduce","ko":"재현하다","reason":"실험 결과 재현 맥락 동일"}],"collocBest":[{"en":"replicate the experiment","ko":"실험을 복제하다"},{"en":"replicate the results","ko":"결과를 모사하다"}]},"nuance":{"koSimple":"똑같은 결과가 나오도록 그대로 재현하거나 복제한다는 뜻이에요.","whenToUse":"실험 재현·데이터 복사처럼 정확한 사본을 만들 때 씁니다."},"krDetail":[{"ko":"모사하다, 복제하다","explain":"똑같이 다시 만들다"}],"usageExamples":[{"en":"The students tried to replicate the famous painting in art class.","ko":"학생들은 미술 시간에 그 유명한 그림을 똑같이 그리려 했다."},{"en":"Bacteria can replicate themselves very rapidly in warm conditions.","ko":"박테리아는 따뜻한 환경에서 매우 빠르게 자신을 복제할 수 있다."}],"grammarNote":"'replicate'는 '똑같이 재현·복제하다'라는 뜻으로 실험·연구 맥락에서 결과를 재현할 때 자주 쓰인다. 'copy'보다 더 격식 있고 정확한 재현을 강조한다.","grammarQuiz":[{"sentence":"Scientists tried _____ (replicate) the experiment to verify the earlier findings.","ko":"과학자들은 이전 결과를 검증하기 위해 실험을 복제하려고 시도했다.","answer":"to replicate","hint":"try + to부정사"}]},
    {"id":"v08826","w":"respiration","pos":["noun"],"ph":"","cefr":"B1","kr":["호흡"],"ex":[{"en":"Regular deep respiration exercises can significantly reduce anxiety before major examinations.","ko":"규칙적인 깊은 호흡 운동은 주요 시험 전 불안을 상당히 줄일 수 있다."}],"mnemonic":{"soundHint":"레스퍼레이션","story":"re(반복) + spir(숨쉬다, inspire의 spir) + ation — 반복해서 숨쉬기 = 호흡","hintConfidence":2},"pairs":{"buddyWords":[{"w":"breathe","ko":"숨쉬다","reason":"핵심 동작"},{"w":"breath","ko":"숨, 호흡","reason":"명사 짝"},{"w":"inhale","ko":"숨을 들이쉬다","reason":"호흡의 한 국면"}],"collocBest":[{"en":"artificial respiration","ko":"인공 호흡"},{"en":"cellular respiration","ko":"세포 호흡"}]},"nuance":{"koSimple":"숨을 들이쉬고 내쉬는 몸의 호흡 작용을 뜻해요.","whenToUse":"의학·생물학적으로 호흡 활동을 다룰 때 씁니다."},"krDetail":[{"ko":"호흡","explain":"숨을 쉬는 작용"}],"usageExamples":[{"en":"During exercise, our rate of respiration increases naturally.","ko":"운동하는 동안 우리의 호흡 속도는 자연스럽게 증가한다."},{"en":"Plants release oxygen as a part of respiration and photosynthesis.","ko":"식물은 호흡과 광합성의 일부로 산소를 방출한다."}],"grammarNote":"'respiration'은 생물·의학에서 쓰는 격식 있는 '호흡'으로, 일상어 'breathing'보다 학술적이다. 셀 수 없는 명사로 쓰이며 동사형은 'respire'이다.","grammarQuiz":[{"sentence":"_____ (practice) deep respiration daily can significantly reduce anxiety before exams.","ko":"매일 깊은 호흡을 연습하는 것은 시험 전 불안을 상당히 줄일 수 있다.","answer":"Practicing","hint":"동명사 주어"}]},
    {"id":"v08829","w":"revitalize","pos":["noun"],"ph":"","cefr":"B1","kr":["활력을 불어넣다"],"ex":[{"en":"The city plans to revitalize the old downtown area with new cultural facilities.","ko":"시는 새로운 문화 시설로 오래된 도심 지역에 활력을 불어넣을 계획이다."}],"mnemonic":{"soundHint":"리바이털라이즈","story":"re(다시) + vital(생명력의) + ize(~하게 하다) — 다시 생기를 불어넣다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"vital","ko":"필수적인, 생명의","reason":"동일 어근 형용사"},{"w":"renew","ko":"새롭게 하다","reason":"동의 계열"},{"w":"refresh","ko":"생기를 되찾게 하다","reason":"'다시 활력'의 이미지 공유"}],"collocBest":[{"en":"revitalize the economy","ko":"경제에 활력을 불어넣다"},{"en":"revitalize the community","ko":"지역사회에 활력을 불어넣다"}]},"nuance":{"koSimple":"쇠퇴한 것에 새로운 활력을 불어넣어 되살린다는 뜻이에요.","whenToUse":"도시·경제·조직을 다시 활기차게 만들 때 씁니다."},"krDetail":[{"ko":"활력을 불어넣다","explain":"다시 생기 있게 하다"}],"usageExamples":[{"en":"A short nap can revitalize you after a long study session.","ko":"짧은 낮잠은 긴 공부 후 당신에게 다시 활력을 줄 수 있다."},{"en":"The government hopes to revitalize the struggling local economy.","ko":"정부는 침체된 지역 경제에 활력을 불어넣기를 바란다."}],"grammarNote":"'re(다시) + vital(활력 있는) + ize(만들다)'로 이루어진 동사로, 쇠퇴한 것에 새 생기를 준다는 뜻이다. 지역·경제·사람 모두 목적어로 취할 수 있다.","grammarQuiz":[{"sentence":"The city plans _____ (revitalize) the old downtown area with new cultural facilities.","ko":"시는 새로운 문화 시설로 오래된 도심 지역에 활력을 불어넣을 계획이다.","answer":"to revitalize","hint":"plan + to부정사"}]},
    {"id":"v08832","w":"rip away","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 떼내다[벗기다]"],"ex":[{"en":"The strong typhoon winds ripped away the roof from several small village houses.","ko":"강한 태풍 바람이 몇몇 작은 마을 집들의 지붕을 뜯어냈다."}],"mnemonic":{"soundHint":"립 어웨이","story":"rip(찢다) + away(떨어져 나가) - 확 뜯어 떼내다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tear off","ko":"떼어내다","reason":"동의 구동사"},{"w":"strip away","ko":"벗겨내다","reason":"동의 구동사"},{"w":"snatch","ko":"낚아채다","reason":"확 빼앗아 가는 이미지 공유"}],"collocBest":[{"en":"rip away the mask","ko":"가면을 떼내다"},{"en":"rip away the wrapping","ko":"포장지를 벗기다"}]},"nuance":{"koSimple":"무언가를 세게 잡아당겨 뜯어내거나 떼어낸다는 뜻이에요.","whenToUse":"강한 힘으로 지붕·껍질 등을 뜯어낼 때 씁니다."},"krDetail":[{"ko":"~을 떼내다[벗기다]","explain":"세게 잡아 뜯다"}],"usageExamples":[{"en":"The child ripped away the wrapping paper to see the gift.","ko":"그 아이는 선물을 보려고 포장지를 확 뜯어냈다."},{"en":"The waves ripped away the small boat from the dock.","ko":"파도가 부두에서 작은 보트를 떼어내 버렸다."}],"grammarNote":"'rip away'는 무언가를 거칠고 갑작스럽게 떼어내거나 벗겨낸다는 뜻이다. 'rip away from ~' 형태로 '~에서 떼어내다'를 나타낼 수 있다.","grammarQuiz":[{"sentence":"The roofs of several small village houses _____ (rip) away by the strong typhoon winds.","ko":"몇몇 작은 마을 집들의 지붕이 강한 태풍 바람에 의해 뜯겨졌다.","answer":"were ripped","hint":"수동태 be + p.p."}]},
    {"id":"v08835","w":"run for","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에 출마하다, ~에 입후보하다"],"ex":[{"en":"She decided to run for student council president during her final school year.","ko":"그녀는 학교 마지막 해에 학생회장에 출마하기로 결정했다."}],"mnemonic":{"soundHint":"런 포","story":"run(달리다) + for(자리를 위해) - 그 자리(회장, 대통령)를 향해 달리다 = 출마하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"campaign","ko":"선거 운동을 하다","reason":"출마와 짝을 이루는 활동"},{"w":"candidate","ko":"후보자","reason":"출마의 주체"},{"w":"run against","ko":"~에 맞서 출마하다","reason":"run + 전치사 계열"}],"collocBest":[{"en":"run for president","ko":"대통령에 출마하다"},{"en":"run for office","ko":"공직에 입후보하다"}]},"nuance":{"koSimple":"어떤 자리에 뽑히려고 후보로 나선다는 뜻이에요.","whenToUse":"선거·회장직·공직에 출마할 때 씁니다."},"krDetail":[{"ko":"~에 출마하다, ~에 입후보하다","explain":"선거에 나가다"}],"usageExamples":[{"en":"He plans to run for mayor in the next city election.","ko":"그는 다음 시 선거에서 시장에 출마할 계획이다."},{"en":"Many young people decided to run for local office this year.","ko":"올해 많은 젊은이들이 지역 공직에 출마하기로 결심했다."}],"grammarNote":"'run for + 직위/자리'는 선거에서 그 자리를 얻기 위해 '출마하다'라는 뜻이다. 미국식 표현으로 'run for president(대통령에 출마하다)'처럼 쓴다.","grammarQuiz":[{"sentence":"She decided _____ (run) for student council president during her final school year.","ko":"그녀는 학교 마지막 해에 학생회장에 출마하기로 결정했다.","answer":"to run","hint":"decide + to부정사"}]},
    {"id":"v08838","w":"scant","pos":["adj"],"ph":"","cefr":"B1","kr":["거의 없는"],"ex":[{"en":"There is scant evidence to support his claim about the ancient civilization.","ko":"그의 고대 문명에 관한 주장을 뒷받침할 증거가 거의 없다."}],"mnemonic":{"soundHint":"스캔트","story":"'스캔(scan)해도 잘 안 잡힐 만큼 얇게 있다' — 거의 없는(scant)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"scarce","ko":"부족한, 드문","reason":"동의어"},{"w":"meager","ko":"빈약한","reason":"'거의 없음'의 격식 동의어"},{"w":"sparse","ko":"드문드문한","reason":"양이 적음의 공통 개념"}],"collocBest":[{"en":"scant evidence","ko":"거의 없는 증거"},{"en":"scant attention","ko":"거의 없는 관심"}]},"nuance":{"koSimple":"양이나 정도가 매우 부족해 거의 없다는 뜻이에요.","whenToUse":"증거·자원·관심이 턱없이 모자랄 때 격식 있게 씁니다."},"krDetail":[{"ko":"거의 없는","explain":"양이 아주 적은"}],"usageExamples":[{"en":"The report offered scant details about the actual accident.","ko":"그 보고서는 실제 사고에 대한 세부 내용을 거의 담고 있지 않았다."},{"en":"They paid scant attention to the teacher's warning.","ko":"그들은 선생님의 경고에 거의 주의를 기울이지 않았다."}],"grammarNote":"'scant'는 '(양이) 거의 없는, 부족한'을 뜻하는 형용사로, 'scant evidence(부족한 증거), scant attention(거의 없는 관심)'처럼 명사 앞에서 자주 쓰인다.","grammarQuiz":[{"sentence":"There is scant evidence _____ (support) his claim about the ancient civilization.","ko":"그의 고대 문명에 관한 주장을 뒷받침할 증거가 거의 없다.","answer":"to support","hint":"형용사적 용법"}]},
    {"id":"v08841","w":"secretion","pos":["noun"],"ph":"","cefr":"B1","kr":["분비"],"ex":[{"en":"Hormone secretion changes significantly during a teenager's rapid growth and puberty stage.","ko":"호르몬 분비는 십 대의 급격한 성장과 사춘기 단계에서 상당히 변화한다."}],"mnemonic":{"soundHint":"시크리션","story":"secret(비밀) + ion — 몸속에서 비밀리에 새어 나오는 것 = 분비","hintConfidence":3},"pairs":{"buddyWords":[{"w":"secrete","ko":"분비하다","reason":"동일 어근 동사"},{"w":"gland","ko":"(분비)선","reason":"분비의 해부학적 짝"},{"w":"hormone","ko":"호르몬","reason":"대표적 분비 물질"}],"collocBest":[{"en":"hormone secretion","ko":"호르몬 분비"},{"en":"excessive secretion","ko":"과도한 분비"}]},"nuance":{"koSimple":"몸이나 세포가 특정 물질을 만들어 내보내는 작용이에요.","whenToUse":"호르몬·침·땀 같은 분비물을 학술적으로 다룰 때 씁니다."},"krDetail":[{"ko":"분비","explain":"몸에서 액을 내보냄"}],"usageExamples":[{"en":"The secretion of saliva helps us digest food more easily.","ko":"침의 분비는 우리가 음식을 더 쉽게 소화하도록 돕는다."},{"en":"Excessive secretion of oil can cause skin problems.","ko":"기름의 과도한 분비는 피부 문제를 일으킬 수 있다."}],"grammarNote":"'secretion'은 생물·의학에서 '(호르몬·침 등의) 분비, 분비물'을 뜻한다. 동사형은 'secrete'이며 'the secretion of + 물질' 형태로 자주 쓰인다.","grammarQuiz":[{"sentence":"Hormone secretion _____ (change) significantly during a teenager's rapid growth stage.","ko":"호르몬 분비는 십 대의 급격한 성장 단계에서 상당히 변화한다.","answer":"changes","hint":"단수 주어 + 단수 동사"},{"sentence":"If hormone secretion _____ (be) balanced, teenagers would grow more smoothly.","ko":"만약 호르몬 분비가 균형 잡혀 있다면, 십 대들은 더 순조롭게 자랄 텐데.","answer":"were","hint":"가정법 과거"}]},
    {"id":"v08844","w":"set out to do","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에 착수하다, ~을 시작하다"],"ex":[{"en":"He set out to master five foreign languages before turning thirty years old.","ko":"그는 서른이 되기 전에 다섯 개의 외국어를 완전히 익히는 데 착수했다."}],"mnemonic":{"soundHint":"셋 아웃 투 두","story":"set out(길을 나서다) + to do(하기 위해) - 마음먹고 일에 나서다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"embark on","ko":"~에 착수하다","reason":"격식 동의어"},{"w":"begin","ko":"시작하다","reason":"가장 흔한 동의 동사"},{"w":"undertake","ko":"떠맡다, 착수하다","reason":"일에 뛰어드는 뉘앙스 공유"}],"collocBest":[{"en":"set out to prove a theory","ko":"이론을 증명하려 착수하다"},{"en":"set out to change the world","ko":"세상을 바꾸려 시작하다"}]},"nuance":{"koSimple":"어떤 목표를 세우고 본격적으로 일에 착수한다는 뜻이에요.","whenToUse":"포부를 가지고 새 도전이나 프로젝트를 시작할 때 씁니다."},"krDetail":[{"ko":"~에 착수하다, ~을 시작하다","explain":"목표를 향해 시작하다"}],"usageExamples":[{"en":"She set out to learn the piano at the age of forty.","ko":"그녀는 마흔 살에 피아노를 배우기 시작했다."},{"en":"The team set out to build the largest bridge in the country.","ko":"그 팀은 그 나라에서 가장 큰 다리를 짓는 일에 착수했다."}],"grammarNote":"'set out to + 동사원형'은 어떤 목표를 이루기 위해 의도적으로 '착수하다, 나서다'라는 뜻이다. 뒤에는 항상 'to부정사'가 온다.","grammarQuiz":[{"sentence":"He set out _____ (master) five foreign languages before turning thirty years old.","ko":"그는 서른이 되기 전에 다섯 개의 외국어를 완전히 익히는 데 착수했다.","answer":"to master","hint":"set out + to부정사"}]},
    {"id":"v08847","w":"single out","pos":["phrase"],"ph":"","cefr":"B1","kr":["선발하다"],"ex":[{"en":"The coach singled out three students for their outstanding effort in yesterday's game.","ko":"코치는 어제 경기에서 뛰어난 노력을 보인 세 명의 학생을 선발했다."}],"mnemonic":{"soundHint":"싱글 아웃","story":"single(한 명)로 out(뽑아냄) - 무리에서 콕 집어 뽑다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pick","ko":"고르다","reason":"'뽑다'의 기본 동사"},{"w":"select","ko":"선발하다","reason":"동의 표현"},{"w":"point out","ko":"지적하다","reason":"'~ + out' 지목 구동사 계열"}],"collocBest":[{"en":"single out a candidate","ko":"후보를 선발하다"},{"en":"single out for praise","ko":"칭찬받을 사람으로 선발하다"}]},"nuance":{"koSimple":"여럿 중에서 한 사람이나 하나를 콕 집어 골라낸다는 뜻이에요.","whenToUse":"칭찬·비난·선발 등 개별 지목이 필요한 상황에 씁니다."},"krDetail":[{"ko":"선발하다","explain":"하나만 골라내다"}],"usageExamples":[{"en":"The judges singled out her essay as the best of all.","ko":"심사위원들은 그녀의 에세이를 모든 것 중 최고로 뽑았다."},{"en":"Why did the teacher single me out for the difficult question?","ko":"왜 선생님은 어려운 질문에 나를 콕 집어 지목했을까?"}],"grammarNote":"'single out'은 여럿 중에서 하나(또는 한 사람)를 특별히 골라내거나 지목한다는 뜻이다. 'single out A for B(B 때문에 A를 지목하다)' 형태로 자주 쓴다.","grammarQuiz":[{"sentence":"Three students _____ (single) out by the coach for their outstanding effort yesterday.","ko":"어제 뛰어난 노력을 보인 세 명의 학생이 코치에 의해 선발되었다.","answer":"were singled","hint":"수동태 be + p.p."}]},
    {"id":"v08850","w":"specialize in","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 전문으로 하다, ~을 전공하다"],"ex":[{"en":"Our English teacher specializes in helping students improve their essay writing skills.","ko":"우리 영어 선생님은 학생들이 에세이 작문 실력을 향상시키도록 돕는 것을 전문으로 한다."}],"mnemonic":{"soundHint":"스페셜라이즈 인","story":"special(특별한) + -ize(만들다) + in(~에) - 한 분야를 특별히 파고들다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"special","ko":"특별한","reason":"동일 어근 형용사"},{"w":"major in","ko":"~을 전공하다","reason":"대학 전공 맥락의 동의어"},{"w":"focus on","ko":"~에 집중하다","reason":"특정 분야에 집중이라는 의미 공유"}],"collocBest":[{"en":"specialize in economics","ko":"경제학을 전공하다"},{"en":"specialize in seafood","ko":"해산물을 전문으로 하다"}]},"nuance":{"koSimple":"특정 분야를 집중적으로 다뤄 전문성을 갖춘다는 뜻이에요.","whenToUse":"가게·의사·연구자가 주력 분야를 소개할 때 씁니다."},"krDetail":[{"ko":"~을 전문으로 하다, ~을 전공하다","explain":"한 분야에 집중하다"}],"usageExamples":[{"en":"This restaurant specializes in fresh seafood dishes.","ko":"이 식당은 신선한 해산물 요리를 전문으로 한다."},{"en":"She wants to specialize in children's medicine after graduation.","ko":"그녀는 졸업 후에 소아 의학을 전공하고 싶어 한다."}],"grammarNote":"'specialize in + 명사/동명사'는 특정 분야를 '전문으로 하다, 전공하다'라는 뜻이다. 전치사 'in'을 반드시 함께 써야 한다.","grammarQuiz":[{"sentence":"Our English teacher specializes in _____ (help) students improve their writing skills.","ko":"우리 영어 선생님은 학생들이 작문 실력을 향상시키도록 돕는 것을 전문으로 한다.","answer":"helping","hint":"전치사 in + 동명사"}]},
    {"id":"v08853","w":"stand for","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 상징[의미]하다","~을 옹호[찬성]하다"],"ex":[{"en":"The letters KTX stand for Korea Train eXpress, our fastest high-speed rail service.","ko":"KTX라는 글자는 한국고속철도를 뜻하며, 우리의 가장 빠른 고속 철도 서비스이다."}],"mnemonic":{"soundHint":"스탠드 포","story":"stand(서 있다) + for(~을 대신해) - 대신 서서 '상징하다·옹호하다'.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"represent","ko":"대표하다","reason":"가장 가까운 동의어"},{"w":"symbolize","ko":"상징하다","reason":"동의 표현"},{"w":"stand up for","ko":"옹호하다","reason":"stand + 전치사 계열, '옹호' 의미 겹침"}],"collocBest":[{"en":"UN stands for United Nations","ko":"UN은 국제연합을 의미한다"},{"en":"stand for justice","ko":"정의를 옹호하다"}]},"nuance":{"koSimple":"어떤 글자나 상징이 무엇을 뜻하거나 대표한다는 표현이에요.","whenToUse":"약자·기호의 의미나 지지하는 가치를 설명할 때 씁니다."},"krDetail":[{"ko":"~을 상징[의미]하다","explain":"무엇을 나타내다"},{"ko":"~을 옹호[찬성]하다","explain":"지지하고 편들다"}],"usageExamples":[{"en":"The white color on the flag stands for peace.","ko":"그 깃발의 흰색은 평화를 상징한다."},{"en":"Our club stands for fairness and equal opportunity.","ko":"우리 동아리는 공정성과 균등한 기회를 옹호한다."}],"grammarNote":"'stand for'는 '(약자·기호가) ~을 의미하다'와 '(가치·신념을) 옹호하다' 두 뜻이 있다. 약어 설명 시 'What does it stand for?(무엇의 약자야?)'처럼 쓴다.","grammarQuiz":[{"sentence":"The letters KTX, _____ stand for Korea Train eXpress, represent our fastest rail service.","ko":"한국고속철도를 뜻하는 KTX라는 글자는 우리의 가장 빠른 철도 서비스를 대표한다.","answer":"which","hint":"관계대명사 계속적 용법"}]},

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

  SFX.cardFlip();

    speak(w.w);

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

function buildQuizPool(){

  const words = [...DATA.newWords];
  // 셔플

  // 모드 균등 분배 (대략)

    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),

    ...Array(2).fill("listening")
  ];

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    containers.forEach(c => renderWordAnswer(c, c.dataset.answer));
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = document.querySelector(".cloze-wa .rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
  } else {
    const container = document.getElementById("wordAnswer");
    renderWordAnswer(container, container.dataset.answer);
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = container.querySelector(".rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
    }
  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);
  renderHeader();
  if(state.sfxOn){ getAC(); SFX.streak(); }
});
document.getElementById("cbBtn").addEventListener("click", ()=>{
  state.cbMode = !state.cbMode;
  lsSet(CB_KEY, state.cbMode);
  document.body.classList.toggle("cb-mode", state.cbMode);
  renderHeader();
});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
</script>
