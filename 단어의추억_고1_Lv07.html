    {"id":"w02372","w":"feature","pos":["n","v"],"ph":"/ˈfiːtʃər/","cefr":"B1","kr":["특징","특색"],"ex":[{"en":"The phone has many useful features.","ko":"그 전화기는 유용한 기능이 많다."}],"mnemonic":{"soundHint":"피처","story":"'피~ 처(쳐다봐)!' 눈에 확 띄는 특징 = feature.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"characteristic","ko":"특징","reason":"동의어 — 고유 성질"},{"w":"attribute","ko":"속성","reason":"동의어 — 특징 요소"},{"w":"highlight","ko":"부각시키다","reason":"시나리오 — 특징을 강조"}],"collocBest":[]},"nuance":{"koSimple":"눈에 띄는 특징이나 기능.","whenToUse":"제품·얼굴·글의 특색을 짚을 때."},"krDetail":[{"ko":"특징","explain":"다른 것과 구별되는 특별한 점"},{"ko":"특색","explain":"그것만이 지닌 뚜렷한 개성"}],"usageExamples":[{"en":"The new smartphone features an advanced camera and a longer battery life.","ko":"그 새 스마트폰은 향상된 카메라와 더 긴 배터리 수명을 특징으로 한다."},{"en":"The magazine featured a lengthy interview with the famous author last month.","ko":"그 잡지는 지난달에 유명 작가와의 긴 인터뷰를 특집으로 실었다."}],"grammarNote":"feature는 명사(특징)와 타동사(~을 특징으로 하다)로 모두 쓰인다. 학생들이 be featured(수동태)를 능동태로 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The talented new artist _____ prominently _____ in the international magazine's spring edition.","ko":"그 재능 있는 신인 예술가는 그 국제 잡지의 봄호에 크게 특집으로 실렸다.","answer":["was","featured"],"hint":"수동태 be + p.p."}]},
    {"id":"w02375","w":"federal","pos":["adj"],"ph":"/ˈfedərəl/","cefr":"B1","kr":["연방의","연방 정부의"],"ex":[{"en":"The federal government passed a new law.","ko":"연방 정부는 새로운 법을 통과시켰다."}],"mnemonic":{"soundHint":"페더럴","story":"'페더~ 럴!' 여러 주가 페더(feather=깃털)처럼 모여 연방을 이룸.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"national","ko":"국가의","reason":"동의어 — 중앙 정부 개념"},{"w":"local","ko":"지역의","reason":"반의어 — 연방 대 지역"},{"w":"government","ko":"정부","reason":"콜로 — 연방 정부"}],"collocBest":[]},"nuance":{"koSimple":"여러 주가 모인 연방의.","whenToUse":"미국 등 연방 국가의 법·정부 이야기할 때."},"krDetail":[{"ko":"연방의","explain":"여러 주가 하나로 뭉친 나라의"},{"ko":"연방 정부의","explain":"여러 주를 하나로 다스리는 중앙 정부의"}],"usageExamples":[{"en":"The federal government announced new regulations to protect the environment.","ko":"연방 정부는 환경을 보호하기 위한 새로운 규정을 발표했다."},{"en":"This case will be tried in a federal court rather than a state court.","ko":"이 사건은 주 법원이 아닌 연방 법원에서 재판될 것이다."}],"grammarNote":"federal은 한정적 용법 위주로 쓰이는 형용사이다. 학생들이 서술적 위치(be federal)에 두려는 실수를 자주 한다.","grammarQuiz":[{"sentence":"_____ federal agency _____ oversees banking has strict rules about international money transfers.","ko":"은행업을 감독하는 그 연방 기관은 국제 자금 이체에 대한 엄격한 규정을 가지고 있다.","answer":["The","that"],"hint":"정관사 + 관계대명사"}]},
    {"id":"w02379","w":"feedback","pos":["n"],"ph":"/ˈfiːdbæk/","cefr":"B1","kr":["피드백","반응"],"ex":[{"en":"The teacher gave helpful feedback on my essay.","ko":"선생님이 내 에세이에 유익한 피드백을 주셨다."}],"mnemonic":{"soundHint":"피드백","story":"'피드백'은 한국어에서도 그대로 쓰는 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"constructive","ko":"건설적인","reason":"콜로 — 건설적 피드백"},{"w":"response","ko":"응답","reason":"동의어 — 반응 공유"},{"w":"comment","ko":"의견","reason":"동의어 — 평가 제공"}],"collocBest":[{"en":"constructive feedback","ko":"건설적인 피드백"},{"en":"positive feedback","ko":"긍정적인 피드백"}]},"nuance":{"koSimple":"결과를 보고 알려주는 반응·조언.","whenToUse":"글·발표·수업 뒤 평가를 받을 때."},"krDetail":[{"ko":"피드백","explain":"한 일에 대해 되돌아오는 평가나 의견"},{"ko":"반응","explain":"어떤 것에 대해 나타내는 태도나 의견"}],"usageExamples":[{"en":"The manager provided constructive feedback to all the new employees.","ko":"그 매니저는 모든 신입사원들에게 건설적인 피드백을 제공했다."},{"en":"Positive feedback from customers helped us improve our services significantly.","ko":"고객의 긍정적인 피드백은 우리가 서비스를 크게 개선하는 데 도움이 되었다."}],"grammarNote":"feedback은 불가산명사이다. 학생들이 a feedback, feedbacks처럼 관사나 복수형을 붙이는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The teacher gave _____ helpful feedback to her students _____ their essay drafts last week.","ko":"그 선생님은 지난주에 학생들에게 그들의 에세이 초안에 대해 매우 유용한 피드백을 주었다.","answer":["very","on"],"hint":"불가산명사 수식 + 전치사"}]},
    {"id":"w02383","w":"fellow","pos":["n","adj"],"ph":"/ˈfeloʊ/","cefr":"B1","kr":["동료","남자"],"ex":[{"en":"He greeted his fellow students at school.","ko":"그는 학교에서 동료 학생들에게 인사했다."}],"mnemonic":{"soundHint":"펠로우","story":"'펠! 로우~ (Hello!)' 반갑게 인사하는 동료 = fellow.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"colleague","ko":"동료","reason":"동의어 — 같은 그룹의 사람"},{"w":"peer","ko":"또래","reason":"동의어 — 동등한 위치"},{"w":"companion","ko":"동반자","reason":"동의어 — 함께하는 사람"}],"collocBest":[]},"nuance":{"koSimple":"같은 처지에 있는 동료·친구.","whenToUse":"동급생·동료를 다정하게 부를 때."},"krDetail":[{"ko":"동료","explain":"같은 일을 함께 하는 사람"},{"ko":"동무","explain":"함께 지내며 마음을 나누는 사람"}],"usageExamples":[{"en":"My fellow classmates and I organized a farewell party for our teacher.","ko":"나의 동급생들과 나는 선생님을 위한 송별회를 준비했다."},{"en":"He was elected as a research fellow at the prestigious university last year.","ko":"그는 작년에 그 명문 대학의 연구원으로 선출되었다."}],"grammarNote":"fellow는 명사(동료)와 형용사(동료의) 모두로 쓰인다. 형용사로 쓸 때는 fellow students처럼 명사 앞에 온다.","grammarQuiz":[{"sentence":"All the fellow researchers _____ the conference _____ deeply impressed by her groundbreaking presentation.","ko":"학회에 참석한 모든 동료 연구원들은 그녀의 획기적인 발표에 깊이 감명받았다.","answer":["at","were"],"hint":"전치사구 수식 + 복수 be동사"}]},
    {"id":"w02393","w":"ferry","pos":["n","v"],"ph":"/ˈferi/","cefr":"B1","kr":["여객선","나룻배","수송하다"],"ex":[{"en":"We took the ferry to cross the river.","ko":"우리는 강을 건너기 위해 여객선을 탔다."}],"mnemonic":{"soundHint":"페리(ferry)","story":"'페리'는 한국어에서도 여객선을 뜻하는 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"boat","ko":"배","reason":"동의어 — 물 위 이동수단"},{"w":"shuttle","ko":"왕복 운행하다","reason":"동의어 — 왕복 수송"},{"w":"harbor","ko":"항구","reason":"콜로 — 여객선 정박지"}],"collocBest":[{"en":"car ferry","ko":"자동차 여객선"},{"en":"ferry service","ko":"여객선 서비스"}]},"nuance":{"koSimple":"사람·차를 실어 강·바다를 건네는 배.","whenToUse":"여객선·나룻배로 강을 건널 때."},"krDetail":[{"ko":"여객선","explain":"사람과 짐을 실어 나르는 배"},{"ko":"나룻배","explain":"강을 건너다니는 작은 배"},{"ko":"수송하다","explain":"사람이나 물건을 실어 옮기다"}],"usageExamples":[{"en":"A large ferry carries hundreds of passengers between the two islands every day.","ko":"큰 여객선이 매일 두 섬 사이에 수백 명의 승객을 실어 나른다."},{"en":"The tourists were ferried across the wide river by a friendly local boatman.","ko":"관광객들은 친절한 현지 뱃사공에 의해 넓은 강 건너로 수송되었다."}],"grammarNote":"ferry는 명사(여객선)와 타동사(수송하다) 둘 다로 쓰인다. 수동태 be ferried를 학생들이 잘 알아보지 못한다.","grammarQuiz":[{"sentence":"The exhausted refugees _____ safely _____ to the mainland by rescue boats early this morning.","ko":"지친 난민들은 오늘 아침 일찍 구조선에 의해 본토로 안전하게 수송되었다.","answer":["were","ferried"],"hint":"수동태 be + p.p."}]},
    {"id":"w02400","w":"festive","pos":["adj"],"ph":"/ˈfestɪv/","cefr":"B1","kr":["축제의","축하하는"],"ex":[{"en":"The house was decorated in a festive style.","ko":"집은 축제 분위기로 꾸며졌다."}],"mnemonic":{"soundHint":"페스티브","story":"festival(축제) + -ive = 축제의, 축하하는.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"celebratory","ko":"축하하는","reason":"동의어 — 축제 분위기"},{"w":"gloomy","ko":"우울한","reason":"반의어 — 축제 대 침울"},{"w":"joyful","ko":"기쁨에 찬","reason":"동의어 — 즐거운 정서"}],"collocBest":[]},"nuance":{"koSimple":"축제처럼 흥겹고 들뜬","whenToUse":"명절·파티 분위기를 형용할 때"},"krDetail":[{"ko":"축제의","explain":"여럿이 함께 즐기는 큰 잔치 같은"},{"ko":"축하하는","explain":"기쁜 일을 기려 함께 좋아하는"}],"usageExamples":[{"en":"The whole town was decorated in festive colors for the winter holidays.","ko":"온 마을이 겨울 휴가를 위해 축제 색깔로 장식되었다."},{"en":"Everyone was in a festive mood at the annual company celebration last night.","ko":"지난밤 연례 회사 축하 행사에서 모두가 축제 분위기에 있었다."}],"grammarNote":"festive는 서술적 용법(be in a festive mood)에서 관용 표현으로 자주 쓰인다. 학생들이 be festive mood처럼 관사를 빠뜨린다.","grammarQuiz":[{"sentence":"The children were _____ _____ festive mood as they decorated the tree with colorful ornaments.","ko":"아이들은 다채로운 장식품으로 트리를 장식하면서 축제 분위기에 있었다.","answer":["in","a"],"hint":"전치사 + 부정관사 관용 표현"}]},
    {"id":"w02402","w":"fetch","pos":["v"],"ph":"/fetʃ/","cefr":"B1","kr":["가져오다","데려오다"],"ex":[{"en":"Can you fetch me a glass of water?","ko":"물 한 잔 가져다 줄 수 있어요?"}],"mnemonic":{"soundHint":"페치","story":"'페! 치!' 강아지에게 던진 공을 물어오라는 명령 = fetch.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bring","ko":"가져오다","reason":"동의어 — 대상을 가져옴"},{"w":"retrieve","ko":"회수하다","reason":"동의어 — 다시 가져옴"},{"w":"remove","ko":"치우다","reason":"반의어 — 가져오기의 반대"}],"collocBest":[]},"nuance":{"koSimple":"가서 집어 오고 데려오다.","whenToUse":"물건·사람을 가지러 갔다 올 때."},"krDetail":[{"ko":"가져오다","explain":"저쪽에 있는 것을 이쪽으로 옮겨 오다"},{"ko":"데려오다","explain":"누군가와 함께 이쪽으로 오다"}],"usageExamples":[{"en":"Could you please fetch me a glass of cold water from the kitchen?","ko":"부엌에서 나에게 시원한 물 한 잔 가져다줄 수 있니?"},{"en":"The old painting was fetched a surprisingly high price at the auction house.","ko":"그 오래된 그림은 경매장에서 놀랄 만큼 높은 가격에 팔렸다."}],"grammarNote":"fetch는 4형식 동사로 fetch + 간접목적어 + 직접목적어 형태를 취한다. 또한 '(값)에 팔리다'라는 뜻으로도 자주 쓰인다.","grammarQuiz":[{"sentence":"The rare antique clock _____ a record price _____ the international auction held in London.","ko":"그 희귀한 골동품 시계는 런던에서 열린 국제 경매에서 기록적인 가격에 팔렸다.","answer":["fetched","at"],"hint":"타동사 과거형 + 장소 전치사"}]},
    {"id":"w02408","w":"fiber","pos":["n"],"ph":"/ˈfaɪbər/","cefr":"B1","kr":["섬유","식이섬유"],"ex":[{"en":"Eating foods rich in fiber helps digestion.","ko":"섬유질이 풍부한 음식을 먹으면 소화에 도움이 된다."}],"mnemonic":{"soundHint":"파이버(fiber)","story":"'파이버'는 광섬유·식이섬유에서 쓰는 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"thread","ko":"실","reason":"동의어 — 가느다란 섬유"},{"w":"roughage","ko":"식이섬유","reason":"동의어 — 식이섬유"},{"w":"diet","ko":"식단","reason":"시나리오 — 식이섬유 섭취"}],"collocBest":[{"en":"dietary fiber","ko":"식이섬유"},{"en":"optical fiber","ko":"광섬유"}]},"nuance":{"koSimple":"실이나 조직을 이루는 가는 줄.","whenToUse":"천 재료·식이섬유를 말할 때."},"krDetail":[{"ko":"섬유","explain":"가늘고 긴 실 같은 물질"},{"ko":"식이섬유","explain":"몸속 소화를 돕는 음식 속 성분"}],"usageExamples":[{"en":"Vegetables and whole grains are excellent sources of dietary fiber.","ko":"채소와 통곡물은 식이섬유의 훌륭한 공급원이다."},{"en":"Optical fibers transmit data at incredible speeds through thin glass strands.","ko":"광섬유는 가느다란 유리 가닥을 통해 놀라운 속도로 데이터를 전송한다."}],"grammarNote":"fiber는 종류(식이섬유, 광섬유)로 나눌 때는 가산명사(fibers)로, 성분·물질로 언급할 때는 불가산명사로 쓰인다.","grammarQuiz":[{"sentence":"Nutritionists recommend that adults consume _____ least twenty grams _____ fiber every day.","ko":"영양학자들은 성인이 매일 최소 20그램의 섬유질을 섭취할 것을 권장한다.","answer":["at","of"],"hint":"관용 전치사 + 수량 표현"}]},
    {"id":"w02410","w":"fiction","pos":["n"],"ph":"/ˈfɪkʃn/","cefr":"B1","kr":["소설","허구"],"ex":[{"en":"She loves reading science fiction novels.","ko":"그녀는 공상과학 소설 읽는 것을 좋아한다."}],"mnemonic":{"soundHint":"픽션","story":"'픽!' 지어낸 션(story) = 허구, 소설.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"novel","ko":"소설","reason":"동의어 — 허구 이야기"},{"w":"nonfiction","ko":"논픽션","reason":"반의어 — 사실 대 허구"},{"w":"fantasy","ko":"환상","reason":"동의어 — 상상 세계"}],"collocBest":[]},"nuance":{"koSimple":"지어낸 이야기, 소설류.","whenToUse":"실화(nonfiction)와 구별해 말할 때."},"krDetail":[{"ko":"소설","explain":"지어낸 이야기를 담은 글"},{"ko":"허구","explain":"실제로 있지 않은 지어낸 것"}],"usageExamples":[{"en":"Science fiction novels often explore possible futures shaped by advanced technology.","ko":"공상과학 소설은 흔히 첨단 기술이 만들어낸 가능한 미래를 탐구한다."},{"en":"It is sometimes difficult to separate fact from fiction in her memoir.","ko":"그녀의 회고록에서는 때때로 사실과 허구를 구분하기가 어렵다."}],"grammarNote":"fiction은 불가산명사이다. 학생들이 a fiction, fictions처럼 관사나 복수형을 붙이는 실수를 자주 한다. 개별 작품을 말할 때는 a work of fiction으로 쓴다.","grammarQuiz":[{"sentence":"The professor explained _____ difficult it can be _____ distinguish fiction from reality in historical writing.","ko":"그 교수는 역사적 글쓰기에서 허구를 현실과 구분하는 것이 얼마나 어려울 수 있는지 설명했다.","answer":["how","to"],"hint":"간접의문문 how + to부정사"}]},
    {"id":"w02425","w":"filter","pos":["n","v"],"ph":"/ˈfɪltər/","cefr":"B1","kr":["여과기","필터링하다"],"ex":[{"en":"The water filter removes impurities.","ko":"정수 필터는 불순물을 제거한다."}],"mnemonic":{"soundHint":"필터","story":"'필터'는 한국어에서도 여과 장치로 쓰는 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"screen","ko":"거르다","reason":"동의어 — 걸러내는 기능"},{"w":"purify","ko":"정화하다","reason":"동의어 — 불순물 제거"},{"w":"sieve","ko":"체","reason":"동의어 — 걸러내는 도구"}],"collocBest":[{"en":"air filter","ko":"공기 필터"},{"en":"filter out","ko":"걸러내다"}]},"nuance":{"koSimple":"불순물을 걸러 내는 장치.","whenToUse":"정수기·공기청정기·SNS 필터 이야기할 때."},"krDetail":[{"ko":"여과기","explain":"찌꺼기를 걸러내는 도구"},{"ko":"거르다","explain":"찌꺼기나 필요 없는 것을 걸러내다"}],"usageExamples":[{"en":"The engineer designed a special filter to remove all impurities from the water.","ko":"그 기술자는 물에서 모든 불순물을 제거하는 특수 여과기를 설계했다."},{"en":"The software filters out spam emails before they reach your main inbox.","ko":"그 소프트웨어는 스팸 이메일이 주요 받은 편지함에 도달하기 전에 걸러낸다."}],"grammarNote":"filter out은 '~을 걸러내다'라는 뜻의 이어동사이다. 목적어가 대명사일 때는 filter it out처럼 반드시 이어동사 사이에 넣어야 한다.","grammarQuiz":[{"sentence":"When suspicious messages arrive, our advanced security system automatically filters _____ _____ within seconds.","ko":"의심스러운 메시지가 도착하면, 우리의 고급 보안 시스템은 자동으로 몇 초 안에 그것들을 걸러낸다.","answer":["them","out"],"hint":"이어동사 + 대명사 목적어 위치"}]},
    {"id":"w02429","w":"finance","pos":["n","v"],"ph":"/ˈfaɪnæns/","cefr":"B1","kr":["재정","금융"],"ex":[{"en":"She studied finance at university.","ko":"그녀는 대학에서 금융을 공부했다."}],"mnemonic":{"soundHint":"파이낸스","story":"'파이(pie) 낸(내다) 스~' 돈 파이를 다루는 것 = finance.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"funding","ko":"자금 조달","reason":"동의어 — 자금 개념"},{"w":"banking","ko":"은행업","reason":"동의어 — 금융 분야"},{"w":"budget","ko":"예산","reason":"시나리오 — 재정 관리"}],"collocBest":[]},"nuance":{"koSimple":"돈을 다루고 굴리는 일.","whenToUse":"은행·투자·개인 재정 이야기할 때."},"krDetail":[{"ko":"재정","explain":"돈을 관리하고 쓰는 일"},{"ko":"금융","explain":"돈이 오가는 일과 관련된 것"}],"usageExamples":[{"en":"The company managed to finance the entire project without any external loans.","ko":"그 회사는 외부 대출 없이 전체 프로젝트에 자금을 조달할 수 있었다."},{"en":"Her research on personal finance has helped many families save more money.","ko":"개인 재정에 관한 그녀의 연구는 많은 가족들이 돈을 더 절약하는 데 도움이 되었다."}],"grammarNote":"finance는 명사(재정)와 타동사(자금을 조달하다) 둘 다로 쓰인다. 수동태 be financed by도 자주 출제된다.","grammarQuiz":[{"sentence":"The new hospital construction _____ _____ by a combination of government grants and private donations.","ko":"그 새로운 병원 건설은 정부 보조금과 민간 기부금의 조합에 의해 자금이 조달되었다.","answer":["was","financed"],"hint":"수동태 be + p.p."}]},
    {"id":"w02430","w":"financial","pos":["adj"],"ph":"/fɪˈnænʃl/","cefr":"B1","kr":["재정적인","금융의"],"ex":[{"en":"The company is facing financial difficulties.","ko":"그 회사는 재정적인 어려움에 직면해 있다."}],"mnemonic":{"soundHint":"파이낸셜","story":"finance + -ial = 재정의, 금융의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"crisis","ko":"위기","reason":"콜로 — 금융 위기"},{"w":"monetary","ko":"화폐의","reason":"동의어 — 돈 관련"},{"w":"economic","ko":"경제의","reason":"동의어 — 경제 관련"}],"collocBest":[]},"nuance":{"koSimple":"돈과 관련된, 재정적인.","whenToUse":"지원·위기·상황을 '돈 문제'로 말할 때."},"krDetail":[{"ko":"재정적인","explain":"돈을 다루고 쓰는 일과 관련된"},{"ko":"금융의","explain":"돈이 오가는 일에 관한"}],"usageExamples":[{"en":"Many students receive financial support from their parents throughout college.","ko":"많은 학생들이 대학 시절 내내 부모로부터 재정적 지원을 받는다."},{"en":"The 2008 financial crisis affected millions of families around the world.","ko":"2008년 금융 위기는 전 세계 수백만 가족에게 영향을 미쳤다."}],"grammarNote":"financial과 fiscal, monetary는 뜻이 비슷하지만 문맥이 다르다. financial은 가장 넓은 의미로 쓰인다. 부사형은 financially이다.","grammarQuiz":[{"sentence":"The startup was _____ struggling last year, but it has recovered _____ quickly since then.","ko":"그 스타트업은 작년에 재정적으로 어려움을 겪었지만, 그 이후로 매우 빠르게 회복했다.","answer":["financially","very"],"hint":"형용사→부사 변환 + 부사 수식"}]},
    {"id":"w02437","w":"fingerprint","pos":["n"],"ph":"/ˈfɪŋɡərprɪnt/","cefr":"B1","kr":["지문"],"ex":[{"en":"The police found fingerprints at the scene.","ko":"경찰이 현장에서 지문을 발견했다."}],"mnemonic":{"soundHint":"핑거프린트","story":"'finger(손가락) + print(찍힘)' = 지문.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"scanner","ko":"스캐너","reason":"콜로 — 지문 스캐너"},{"w":"finger","ko":"손가락","reason":"동의어 — 합성어 구성 요소"},{"w":"identity","ko":"신원","reason":"시나리오 — 지문 신원 확인"}],"collocBest":[]},"nuance":{"koSimple":"손가락 끝에 남는 고유한 무늬.","whenToUse":"수사·잠금 해제·신원 확인에."},"krDetail":[{"ko":"지문","explain":"손가락 끝의 살에 새겨진 무늬"}],"usageExamples":[{"en":"The detective carefully collected fingerprints from the surface of the broken window.","ko":"그 형사는 깨진 창문 표면에서 지문을 조심스럽게 채취했다."},{"en":"Modern smartphones can be unlocked by using the owner's fingerprint or face scan.","ko":"현대의 스마트폰은 소유자의 지문이나 얼굴 스캔을 사용해 잠금 해제될 수 있다."}],"grammarNote":"fingerprint는 가산명사이다. 학생들이 fingerprints의 복수형을 자주 빠뜨린다. 여러 개를 채취할 때는 반드시 복수형으로 쓴다.","grammarQuiz":[{"sentence":"The police officers found several clear _____ _____ the murder weapon and sent them to the forensic lab.","ko":"경찰관들은 살인 무기에서 여러 개의 선명한 지문을 발견하여 그것들을 법의학 연구소로 보냈다.","answer":["fingerprints","on"],"hint":"복수 가산명사 + 전치사"}]},
    {"id":"w02442","w":"fireplace","pos":["n"],"ph":"/ˈfaɪərpleɪs/","cefr":"B1","kr":["벽난로"],"ex":[{"en":"The family sat around the fireplace on cold winter evenings.","ko":"가족들은 추운 겨울 저녁에 벽난로 주위에 앉았다."}],"mnemonic":{"soundHint":"파이어플레이스","story":"'fire(불) + place(자리)' = 불의 자리, 벽난로.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hearth","ko":"난로","reason":"동의어 — 벽난로 개념"},{"w":"chimney","ko":"굴뚝","reason":"시나리오 — 벽난로와 굴뚝"},{"w":"cozy","ko":"아늑한","reason":"시나리오 — 벽난로 옆의 분위기"}],"collocBest":[]},"nuance":{"koSimple":"집 안에서 장작을 태우는 벽난로.","whenToUse":"겨울 거실·산장 분위기를 그릴 때."},"krDetail":[{"ko":"벽난로","explain":"방 안 벽에 만들어 놓고 불을 피우는 곳"}],"usageExamples":[{"en":"The family gathered around the warm fireplace to share stories on Christmas Eve.","ko":"가족은 크리스마스 이브에 이야기를 나누기 위해 따뜻한 벽난로 주위에 모였다."},{"en":"A crackling fire in the stone fireplace made the old cottage feel cozy.","ko":"돌 벽난로에서 타닥거리는 불이 그 오래된 별장을 아늑하게 느끼게 했다."}],"grammarNote":"by the fireplace(벽난로 옆에), in front of the fireplace(벽난로 앞에) 같은 위치 표현에서 정관사 the가 필요하다. 학생들이 자주 빠뜨린다.","grammarQuiz":[{"sentence":"The tired travelers sat quietly _____ the fireplace, warming _____ hands after the long winter hike.","ko":"지친 여행자들은 긴 겨울 하이킹 후 손을 녹이며 벽난로 옆에 조용히 앉아 있었다.","answer":["by","their"],"hint":"위치 전치사 + 소유격"}]},
    {"id":"w02443","w":"firewall","pos":["n"],"ph":"/ˈfaɪərwɔːl/","cefr":"B1","kr":["방화벽","방어막"],"ex":[{"en":"The firewall blocked the hackers.","ko":"방화벽이 해커들을 차단했다."}],"mnemonic":{"soundHint":"방화벽","story":"fire(불)+wall(벽) → 방화벽, IT에서 그대로 사용","hintConfidence":3},"pairs":{"buddyWords":[{"w":"network","ko":"네트워크","reason":"콜로 — 네트워크 방화벽"},{"w":"barrier","ko":"장벽","reason":"동의어 — 차단 기능"},{"w":"protection","ko":"보호","reason":"동의어 — 방어 개념"}],"collocBest":[{"en":"install a firewall","ko":"방화벽을 설치하다"},{"en":"network firewall","ko":"네트워크 방화벽"}]},"nuance":{"koSimple":"해커를 막는 보안 장벽.","whenToUse":"네트워크·컴퓨터 보안 얘기할 때."},"krDetail":[{"ko":"방화벽","explain":"해킹을 막아 컴퓨터를 지켜 주는 장치"},{"ko":"방어막","explain":"위험한 것을 막아 주는 벽"}],"usageExamples":[{"en":"The company installed a powerful firewall to protect its confidential business data.","ko":"그 회사는 기밀 사업 데이터를 보호하기 위해 강력한 방화벽을 설치했다."},{"en":"A well-configured firewall can block most attempts by hackers to access private systems.","ko":"잘 설정된 방화벽은 해커들이 사설 시스템에 접근하려는 대부분의 시도를 막을 수 있다."}],"grammarNote":"firewall은 가산명사이다. install a firewall처럼 관사와 함께 쓰인다. 학생들이 관사를 빠뜨리는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The IT team recommended _____ we install _____ new firewall to protect our sensitive customer information.","ko":"IT 팀은 우리의 민감한 고객 정보를 보호하기 위해 새 방화벽을 설치할 것을 권장했다.","answer":["that","a"],"hint":"recommend that절 + 부정관사"}]},
    {"id":"w02445","w":"firm","pos":["adj","n","adv"],"ph":"/fɜːrm/","cefr":"B1","kr":["단단한","회사"],"ex":[{"en":"She works for a law firm in the city.","ko":"그녀는 도시의 법률 회사에서 일한다."}],"mnemonic":{"soundHint":"펌","story":"'펌!' 힘줘 꾹 눌러 단단한 상태 / 단단히 세운 회사 = firm.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"solid","ko":"단단한","reason":"동의어 — 견고함"},{"w":"loose","ko":"느슨한","reason":"반의어 — 단단함의 반대"},{"w":"company","ko":"회사","reason":"동의어 — 회사 의미"}],"collocBest":[]},"nuance":{"koSimple":"단단하거나 흔들림 없는; 회사.","whenToUse":"물건이 딱딱하거나 결정이 확고할 때."},"krDetail":[{"ko":"단단한","explain":"누르거나 눌러도 잘 안 눌리는"},{"ko":"회사","explain":"여러 사람이 함께 일하며 돈을 버는 곳"}],"usageExamples":[{"en":"The law firm hired several new associates to handle the growing number of cases.","ko":"그 법률 회사는 늘어나는 사건 수를 처리하기 위해 여러 명의 새 변호사를 고용했다."},{"en":"The mattress felt too firm for her, so she asked for a softer one.","ko":"그 매트리스는 그녀에게 너무 단단하게 느껴져서 그녀는 더 부드러운 것을 요청했다."}],"grammarNote":"firm은 형용사(단단한), 명사(회사), 부사(단단히) 모두로 쓰인다. 학생들은 firm과 firmly(부사)를 자주 혼동한다.","grammarQuiz":[{"sentence":"The manager spoke _____ but politely, emphasizing _____ the deadline could not be extended any further.","ko":"그 매니저는 마감일이 더 이상 연장될 수 없음을 강조하며 단호하지만 정중하게 말했다.","answer":["firmly","that"],"hint":"부사형 + 명사절 접속사"}]},
    {"id":"w02470","w":"flame","pos":["n","v"],"ph":"/fleɪm/","cefr":"B1","kr":["불꽃","화염"],"ex":[{"en":"The candle flame flickered in the wind.","ko":"양초 불꽃이 바람에 깜박였다."}],"mnemonic":{"soundHint":"플레임","story":"'플~ 레임!' 화르륵 타오르는 불꽃 = flame.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fire","ko":"불","reason":"동의어 — 불꽃 개념"},{"w":"blaze","ko":"화염","reason":"동의어 — 강렬한 불"},{"w":"candle","ko":"양초","reason":"콜로 — 양초 불꽃"}],"collocBest":[]},"nuance":{"koSimple":"실제로 타오르는 뾰족한 불꽃.","whenToUse":"촛불·화재·격렬한 감정 표현에."},"krDetail":[{"ko":"불꽃","explain":"타오르는 불의 뾰족한 모양"},{"ko":"화염","explain":"크고 세게 타오르는 불"}],"usageExamples":[{"en":"The candle's small flame flickered gently in the cool evening breeze.","ko":"그 촛불의 작은 불꽃이 시원한 저녁 바람에 부드럽게 흔들렸다."},{"en":"The old building burst into flames within minutes after the fire started.","ko":"그 오래된 건물은 불이 시작된 후 몇 분 만에 불길에 휩싸였다."}],"grammarNote":"burst into flames는 '불길에 휩싸이다'라는 관용 표현으로 flames가 반드시 복수형이다. 학생들이 자주 flame(단수)으로 잘못 쓴다.","grammarQuiz":[{"sentence":"The abandoned warehouse suddenly _____ into flames, and firefighters arrived _____ the scene within ten minutes.","ko":"그 버려진 창고가 갑자기 불길에 휩싸였고, 소방관들이 10분 안에 현장에 도착했다.","answer":["burst","at"],"hint":"관용 표현 동사 + 장소 전치사"}]},
    {"id":"w02471","w":"flap","pos":["v","n"],"ph":"/flæp/","cefr":"B1","kr":["펄럭이다","퍼덕임"],"ex":[{"en":"The bird flapped its wings.","ko":"새가 날개를 퍼덕였다."}],"mnemonic":{"soundHint":"펄럭펄럭","story":"flap-flap → 펄럭펄럭, 깃발 소리 의성어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"wings","ko":"날개","reason":"콜로 — 날개를 퍼덕임"},{"w":"flutter","ko":"펄럭이다","reason":"동의어 — 흔들림 공유"},{"w":"wave","ko":"흔들다","reason":"동의어 — 흔들리는 동작"}],"collocBest":[{"en":"flap wings","ko":"날개를 퍼덕이다"},{"en":"flap in the wind","ko":"바람에 펄럭이다"}]},"nuance":{"koSimple":"날개·깃발이 위아래로 퍼덕이다.","whenToUse":"새 날갯짓·깃발 나부낌 표현에."},"krDetail":[{"ko":"펄럭이다","explain":"가벼운 것이 바람에 이리저리 흔들리다"},{"ko":"퍼덕임","explain":"빠르게 움직여 소리를 내는 동작"}],"usageExamples":[{"en":"The colorful national flags flapped loudly in the strong autumn wind.","ko":"다채로운 국기들이 강한 가을 바람에 크게 펄럭였다."},{"en":"The startled birds flapped their wings frantically as they escaped the danger.","ko":"놀란 새들이 위험을 피하면서 미친 듯이 날개를 퍼덕였다."}],"grammarNote":"flap은 자동사(펄럭이다)와 타동사(~을 퍼덕이다) 둘 다로 쓰인다. flap wings(타동사)와 flap in the wind(자동사)를 구분해야 한다.","grammarQuiz":[{"sentence":"The large banners _____ noisily in the wind while the birds _____ their wings above the crowd.","ko":"커다란 현수막들이 바람에 시끄럽게 펄럭이는 동안 새들은 군중 위에서 날개를 퍼덕였다.","answer":["flapped","flapped"],"hint":"자동사 vs 타동사 (같은 형태)"}]},
    {"id":"w02472","w":"flash","pos":["n","v"],"ph":"/flæʃ/","cefr":"B1","kr":["번쩍임","번개"],"ex":[{"en":"A flash of lightning lit up the dark sky.","ko":"번개 번쩍임이 어두운 하늘을 밝혔다."}],"mnemonic":{"soundHint":"플래시","story":"'플래시'는 한국어에서 카메라 섬광으로 쓰는 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"camera","ko":"카메라","reason":"콜로 — 카메라 플래시"},{"w":"gleam","ko":"번쩍임","reason":"동의어 — 짧은 빛"},{"w":"spark","ko":"불꽃","reason":"동의어 — 순간적인 빛"}],"collocBest":[{"en":"flash of light","ko":"빛의 번쩍임"},{"en":"camera flash","ko":"카메라 플래시"}]},"nuance":{"koSimple":"순식간에 번쩍이는 빛.","whenToUse":"번개·카메라 플래시·아이디어에."},"krDetail":[{"ko":"번쩍임","explain":"빛이 순간적으로 강하게 비치는 것"},{"ko":"번개","explain":"하늘에서 순간 번쩍이는 빛줄기"}],"usageExamples":[{"en":"A bright flash of lightning suddenly lit up the dark night sky.","ko":"밝은 번개의 번쩍임이 갑자기 어두운 밤하늘을 밝혔다."},{"en":"The photographer's camera flashed repeatedly during the celebrity's red carpet appearance.","ko":"그 사진작가의 카메라가 유명인의 레드카펫 등장 동안 반복적으로 번쩍였다."}],"grammarNote":"flash는 명사(번쩍임)와 자동사/타동사 둘 다로 쓰인다. a flash of + 명사(빛/영감/미소 등) 형태로 자주 쓰인다.","grammarQuiz":[{"sentence":"She had a sudden _____ _____ inspiration while walking through the peaceful garden this morning.","ko":"그녀는 오늘 아침 평화로운 정원을 걸으면서 갑작스러운 영감의 번쩍임을 느꼈다.","answer":["flash","of"],"hint":"관용 표현 a ~ of"}]},
    {"id":"w02473","w":"flashback","pos":["n"],"ph":"/ˈflæʃbæk/","cefr":"B1","kr":["회상","플래시백"],"ex":[{"en":"The movie begins with a flashback.","ko":"그 영화는 회상 장면으로 시작한다."}],"mnemonic":{"soundHint":"플래시백","story":"'플래시백'은 영화·드라마 회상 장면 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"traumatic","ko":"트라우마의","reason":"콜로 — 트라우마 회상"},{"w":"recollection","ko":"회상","reason":"동의어 — 과거 기억"},{"w":"memory","ko":"기억","reason":"동의어 — 과거를 떠올림"}],"collocBest":[{"en":"dramatic flashback","ko":"극적인 회상"},{"en":"traumatic flashback","ko":"트라우마 회상"}]},"nuance":{"koSimple":"과거 장면이 갑자기 떠오르는 것.","whenToUse":"영화 회상 장면·트라우마 기억에."},"krDetail":[{"ko":"회상","explain":"지난 일을 다시 떠올려 보는 것"},{"ko":"되살아나는 기억","explain":"갑자기 마음속에 떠오르는 지난 일"}],"usageExamples":[{"en":"The film uses dramatic flashbacks to reveal the main character's tragic past.","ko":"그 영화는 주인공의 비극적인 과거를 드러내기 위해 극적인 회상을 사용한다."},{"en":"The soldier had painful flashbacks of the battle for many years after the war.","ko":"그 군인은 전쟁 후 오랫동안 그 전투의 고통스러운 회상을 겪었다."}],"grammarNote":"flashback은 가산명사이다. have flashbacks of + 명사(~에 대한 회상을 겪다) 형태로 자주 쓰인다. 학생들이 have flashback처럼 관사·복수형을 빠뜨린다.","grammarQuiz":[{"sentence":"The war veteran occasionally had _____ flashbacks _____ the terrible events he had experienced decades earlier.","ko":"그 참전 용사는 수십 년 전에 겪었던 끔찍한 사건들의 회상을 이따금씩 겪었다.","answer":["painful","of"],"hint":"복수 가산명사 수식 + 전치사"}]},
    {"id":"w02480","w":"flavor","pos":["n","v"],"ph":"/ˈfleɪvər/","cefr":"B1","kr":["맛","풍미"],"ex":[{"en":"This soup has a wonderful flavor.","ko":"이 수프는 훌륭한 맛이 난다."}],"mnemonic":{"soundHint":"플레이버","story":"'플레이(play) + 버(bar)' 혀 위에서 맛이 춤추다 = flavor.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"taste","ko":"맛","reason":"동의어 — 미각 자극"},{"w":"seasoning","ko":"양념","reason":"동의어 — 맛을 냄"},{"w":"blandness","ko":"밋밋함","reason":"반의어 — 맛없음"}],"collocBest":[]},"nuance":{"koSimple":"혀로 느끼는 특유의 맛.","whenToUse":"음식·음료의 풍미를 표현할 때."},"krDetail":[{"ko":"맛","explain":"혀로 느끼는 음식의 느낌"},{"ko":"풍미","explain":"은은하게 나는 좋은 맛과 향"}],"usageExamples":[{"en":"The chef added fresh herbs to enhance the natural flavor of the soup.","ko":"그 요리사는 수프의 자연스러운 맛을 살리기 위해 신선한 허브를 추가했다."},{"en":"This traditional dish is flavored with a special blend of Asian spices.","ko":"이 전통 요리는 아시아 향신료의 특별한 배합으로 맛이 첨가된다."}],"grammarNote":"flavor는 명사(맛)와 타동사(맛을 내다) 둘 다로 쓰인다. 수동태 be flavored with + 재료 형태가 자주 출제된다.","grammarQuiz":[{"sentence":"The famous restaurant's signature sauce _____ _____ with rare spices imported from Southeast Asia.","ko":"그 유명 레스토랑의 시그니처 소스는 동남아시아에서 수입된 희귀 향신료로 맛이 첨가된다.","answer":["is","flavored"],"hint":"수동태 be + p.p."}]},
    {"id":"w02481","w":"flaw","pos":["n"],"ph":"/flɔː/","cefr":"B1","kr":["결점","흠"],"ex":[{"en":"The plan had a serious flaw.","ko":"그 계획에는 심각한 결점이 있었다."}],"mnemonic":{"soundHint":"플로","story":"'플~ 로!' 흠칫! 발견된 흠 = flaw.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"defect","ko":"결함","reason":"동의어 — 결점 개념"},{"w":"imperfection","ko":"불완전","reason":"동의어 — 흠 있는 상태"},{"w":"perfection","ko":"완벽","reason":"반의어 — 결점의 반대"}],"collocBest":[]},"nuance":{"koSimple":"완벽함을 깨는 작은 흠.","whenToUse":"계획·성격의 약점을 지적할 때."},"krDetail":[{"ko":"결점","explain":"좋지 않게 만드는 부족한 점"},{"ko":"흠","explain":"물건이나 사람의 모자란 부분"}],"usageExamples":[{"en":"The engineers discovered a fatal flaw in the bridge's original design.","ko":"그 기술자들은 그 다리의 원래 설계에서 치명적인 결점을 발견했다."},{"en":"Everyone has flaws, but great leaders learn to overcome them through hard work.","ko":"누구나 결점이 있지만, 훌륭한 지도자들은 노력을 통해 그것들을 극복하는 법을 배운다."}],"grammarNote":"flaw는 가산명사이다. flaw in + 명사(~안의 결점) 형태로 자주 쓰인다. 학생들이 flaw of로 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The scientist quickly identified _____ major flaw _____ his colleague's experimental design last week.","ko":"그 과학자는 지난주에 동료의 실험 설계에서 큰 결점을 빠르게 발견했다.","answer":["a","in"],"hint":"부정관사 + 전치사"}]},
    {"id":"w02482","w":"flawless","pos":["adj"],"ph":"/ˈflɔːləs/","cefr":"B1","kr":["흠 없는","완벽한"],"ex":[{"en":"Her performance was flawless.","ko":"그녀의 공연은 흠 없이 완벽했다."}],"mnemonic":{"soundHint":"플로리스","story":"flaw(흠) + -less(없는) = 흠 없는, 완벽한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"perfect","ko":"완벽한","reason":"동의어 — 흠 없음"},{"w":"impeccable","ko":"나무랄 데 없는","reason":"동의어 — 완벽한 상태"},{"w":"flawed","ko":"결함이 있는","reason":"반의어 — flawless 반대"}],"collocBest":[]},"nuance":{"koSimple":"흠 하나 없이 완벽한.","whenToUse":"공연·피부·발음을 극찬할 때."},"krDetail":[{"ko":"흠 없는","explain":"잘못된 부분이 하나도 없는"},{"ko":"완벽한","explain":"어디 하나 부족함 없이 완전한"}],"usageExamples":[{"en":"The young dancer gave a flawless performance in front of the entire audience.","ko":"그 어린 무용수는 전체 관객 앞에서 완벽한 공연을 보여줬다."},{"en":"Her flawless English impressed everyone at the international business conference.","ko":"그녀의 완벽한 영어는 국제 비즈니스 회의에서 모든 사람에게 감명을 주었다."}],"grammarNote":"-less 접미사가 붙은 형용사의 부사형은 -lessly이다. 학생들이 flawlessly와 flawless를 자주 혼동한다.","grammarQuiz":[{"sentence":"The pianist performed the difficult concerto _____ _____ front of the international judges last night.","ko":"그 피아니스트는 지난밤 국제 심사위원들 앞에서 그 어려운 협주곡을 완벽하게 연주했다.","answer":["flawlessly","in"],"hint":"형용사→부사 변환 + 위치 전치사"}]},
    {"id":"w02488","w":"fleet","pos":["n"],"ph":"/fliːt/","cefr":"B1","kr":["함대","선단"],"ex":[{"en":"The fleet set sail at dawn.","ko":"함대는 새벽에 출항했다."}],"mnemonic":{"soundHint":"플리트","story":"'플! 리! 트!' 빠르게 물살 가르는 배들의 무리 = fleet.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"naval","ko":"해군의","reason":"콜로 — 해군 함대"},{"w":"armada","ko":"함대","reason":"동의어 — 대규모 함선"},{"w":"convoy","ko":"호송대","reason":"동의어 — 선박 무리"}],"collocBest":[]},"nuance":{"koSimple":"여러 척으로 이루어진 배·차 무리.","whenToUse":"해군 함대·회사 소유 차량단에."},"krDetail":[{"ko":"함대","explain":"여러 척의 군함이 한 무리로 다니는 것"},{"ko":"선단","explain":"함께 다니는 여러 척의 배 무리"}],"usageExamples":[{"en":"The naval fleet sailed toward the enemy shores at dawn to launch the surprise attack.","ko":"그 해군 함대는 기습 공격을 개시하기 위해 새벽에 적의 해안으로 항해했다."},{"en":"The delivery company operates a large fleet of trucks across the entire country.","ko":"그 배송 회사는 전국에 걸쳐 대규모 트럭 선단을 운영한다."}],"grammarNote":"fleet은 집합명사로 단수·복수 취급 모두 가능하지만 보통 단수 취급한다. a fleet of + 복수명사 형태가 정형화되어 있다.","grammarQuiz":[{"sentence":"_____ fleet _____ fishing boats returned safely to the harbor before the terrible storm arrived.","ko":"그 어선 선단은 끔찍한 폭풍이 오기 전에 항구로 안전하게 돌아왔다.","answer":["The","of"],"hint":"정관사 + 관용 전치사"}]},
    {"id":"w02490","w":"flexibility","pos":["n"],"ph":"/ˌfleksɪˈbɪlɪti/","cefr":"B1","kr":["유연성","융통성"],"ex":[{"en":"The job offers great flexibility.","ko":"그 직업은 높은 유연성을 제공한다."}],"mnemonic":{"soundHint":"플렉스빌리티 → '플렉스(자랑)' 잘하는 빌리","story":"빌리는 몸도 마음도 플렉스(flex)할 만큼 유연성이 뛰어나다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"adaptability","ko":"적응력","reason":"동의어 — 유연한 대응"},{"w":"rigidity","ko":"경직성","reason":"반의어 — 유연성의 반대"},{"w":"versatility","ko":"다재다능","reason":"동의어 — 다방면 대응"}],"collocBest":[]},"nuance":{"koSimple":"잘 구부러지고 상황에 맞추는 성질.","whenToUse":"일정·몸·사고방식의 융통성에."},"krDetail":[{"ko":"유연성","explain":"쉽게 굽히거나 바꿀 수 있는 성질"},{"ko":"융통성","explain":"상황에 맞게 잘 바꿀 수 있는 성질"}],"usageExamples":[{"en":"Yoga classes can improve both your physical flexibility and your mental well-being.","ko":"요가 수업은 신체적 유연성과 정신적 웰빙 모두를 향상시킬 수 있다."},{"en":"The new work policy offers flexibility to employees who need to balance family responsibilities.","ko":"그 새로운 근무 정책은 가족 책임과 균형을 맞춰야 하는 직원들에게 유연성을 제공한다."}],"grammarNote":"flexibility는 보통 불가산명사이다. 학생들이 a flexibility, flexibilities처럼 관사·복수형을 붙이는 실수를 자주 한다.","grammarQuiz":[{"sentence":"Regular stretching exercises _____ great flexibility to your muscles _____ helping you avoid injuries.","ko":"규칙적인 스트레칭 운동은 근육에 큰 유연성을 주고 당신이 부상을 피하도록 도와준다.","answer":["give","while"],"hint":"복수 주어 동사 + 접속사"}]},
    {"id":"w02491","w":"flexible","pos":["adj"],"ph":"/ˈfleksɪbl/","cefr":"B1","kr":["유연한","융통성 있는"],"ex":[{"en":"A flexible schedule allows workers to manage their time.","ko":"유연한 일정은 직원들이 시간을 관리할 수 있게 해준다."}],"mnemonic":{"soundHint":"플렉시블 → '플렉스(flex) 가능한'","story":"몸을 자유롭게 플렉스할 수 있으면 flexible(유연한).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"adaptable","ko":"적응 가능한","reason":"동의어 — 변화에 유연"},{"w":"rigid","ko":"경직된","reason":"반의어 — 유연함의 반대"},{"w":"schedule","ko":"일정","reason":"콜로 — 유연한 일정"}],"collocBest":[]},"nuance":{"koSimple":"잘 구부러지고 상황에 맞출 수 있는.","whenToUse":"시간·규칙·태도가 유연할 때."},"krDetail":[{"ko":"유연한","explain":"잘 굽어지고 잘 변할 수 있는"},{"ko":"융통성 있는","explain":"상황에 따라 잘 맞춰 바꿀 수 있는"}],"usageExamples":[{"en":"The company offers a flexible schedule for parents with young children at home.","ko":"그 회사는 집에 어린 자녀가 있는 부모들에게 유연한 일정을 제공한다."},{"en":"A flexible approach to problem-solving usually leads to more creative and effective solutions.","ko":"문제 해결에 대한 유연한 접근은 보통 더 창의적이고 효과적인 해결책으로 이어진다."}],"grammarNote":"flexible의 부사형은 flexibly이다. 학생들이 flexible를 부사 자리에 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The manager responded _____ to the sudden changes _____ the project deadline last Friday morning.","ko":"그 매니저는 지난 금요일 아침 프로젝트 마감일의 갑작스러운 변경에 유연하게 대응했다.","answer":["flexibly","in"],"hint":"형용사→부사 변환 + 전치사"}]},
    {"id":"w02492","w":"flick","pos":["v","n"],"ph":"/flɪk/","cefr":"B1","kr":["튀기다","탁 치다"],"ex":[{"en":"He flicked the switch on.","ko":"그는 스위치를 탁 켰다."}],"mnemonic":{"soundHint":"플릭 → '툭!' 튕기는 소리","story":"스위치를 '플릭!' 하고 튕기듯 탁 치다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"snap","ko":"탁 튀기다","reason":"동의어 — 순간 동작"},{"w":"flip","ko":"휙 넘기다","reason":"동의어 — 가벼운 뒤집기"},{"w":"switch","ko":"스위치","reason":"콜로 — 스위치를 탁 치다"}],"collocBest":[]},"nuance":{"koSimple":"손가락으로 톡 튀기거나 치다.","whenToUse":"스위치·페이지·먼지를 튕길 때."},"krDetail":[{"ko":"튀기다","explain":"손가락 끝으로 가볍고 빠르게 치다"},{"ko":"탁 치다","explain":"손가락으로 가볍게 튕겨 치다"}],"usageExamples":[{"en":"She simply flicked a switch and the whole living room was filled with warm light.","ko":"그녀는 그저 스위치를 탁 쳤을 뿐인데 거실 전체가 따뜻한 빛으로 채워졌다."},{"en":"He flicked through the pages of the magazine while waiting for his coffee.","ko":"그는 커피를 기다리는 동안 잡지의 페이지를 훑어보았다."}],"grammarNote":"flick through는 '~을 훑어보다'라는 뜻의 자동사구이다. flick + 목적어와 flick through + 목적어의 의미 차이를 학생들이 자주 혼동한다.","grammarQuiz":[{"sentence":"While waiting at the dentist's office, she casually flicked _____ several magazines _____ finding an interesting article.","ko":"치과에서 기다리는 동안, 그녀는 흥미로운 기사를 찾지 못하고 여러 잡지를 무심히 훑어봤다.","answer":["through","without"],"hint":"자동사구 전치사 + 부정 전치사"}]},
    {"id":"w02497","w":"flip","pos":["v","n"],"ph":"/flɪp/","cefr":"B1","kr":["뒤집다","휙 넘기다"],"ex":[{"en":"He flipped the pancake expertly.","ko":"그는 능숙하게 팬케이크를 뒤집었다."}],"mnemonic":{"soundHint":"플립 → '휙!' 뒤집는 소리","story":"동전을 '플립!' 하고 던져 뒤집다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"reverse","ko":"뒤집다","reason":"동의어 — 방향 전환"},{"w":"toss","ko":"던지다","reason":"동의어 — 던져 뒤집기"},{"w":"coin","ko":"동전","reason":"콜로 — 동전 던지기"}],"collocBest":[]},"nuance":{"koSimple":"휙 뒤집거나 던져 돌리다.","whenToUse":"팬케이크·동전·페이지를 넘길 때."},"krDetail":[{"ko":"뒤집다","explain":"위아래를 바꾸어 놓다"},{"ko":"휙 넘기다","explain":"빠르게 넘겨 보다"}],"usageExamples":[{"en":"The chef quickly flipped the pancakes in the pan without spilling any batter.","ko":"그 요리사는 반죽을 흘리지 않고 팬 안에서 팬케이크를 빠르게 뒤집었다."},{"en":"They flipped a coin to decide who would go first in the friendly competition.","ko":"그들은 친선 경기에서 누가 먼저 갈지 결정하기 위해 동전을 던졌다."}],"grammarNote":"flip a coin은 '동전을 던지다', flip through는 '~을 훑어보다'라는 관용 표현이다. flip은 목적어에 따라 뜻이 달라진다.","grammarQuiz":[{"sentence":"The referee _____ a coin _____ the beginning of the match to decide which team would kick off.","ko":"심판은 어느 팀이 킥오프를 할지 결정하기 위해 경기 시작 시 동전을 던졌다.","answer":["flipped","at"],"hint":"타동사 과거형 + 시간 전치사"}]},
    {"id":"w02501","w":"flock","pos":["n","v"],"ph":"/flɒk/","cefr":"B1","kr":["떼","무리"],"ex":[{"en":"A flock of birds flew past.","ko":"새 떼가 날아 지나갔다."}],"mnemonic":{"soundHint":"플록 → '푸드덕' 새 떼 날갯짓","story":"양 떼(flock)가 푸드덕 하늘로 날아오르는 새 떼로 착시.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"herd","ko":"무리","reason":"동의어 — 동물 떼"},{"w":"group","ko":"무리","reason":"동의어 — 모인 집단"},{"w":"sheep","ko":"양","reason":"콜로 — 양 떼"}],"collocBest":[]},"nuance":{"koSimple":"같은 종끼리 몰려다니는 무리.","whenToUse":"새·양 등이 떼 지어 있을 때."},"krDetail":[{"ko":"떼","explain":"함께 모여 있는 짐승이나 새의 무리"},{"ko":"무리","explain":"많은 것이 한데 모여 있는 것"}],"usageExamples":[{"en":"A large flock of sheep grazed peacefully on the green hillside all afternoon.","ko":"많은 양 떼가 오후 내내 푸른 언덕에서 평화롭게 풀을 뜯었다."},{"en":"Curious tourists flocked to the small town to see the rare cultural festival.","ko":"호기심 많은 관광객들이 그 희귀한 문화 축제를 보기 위해 그 작은 마을로 모여들었다."}],"grammarNote":"flock은 명사(떼)와 자동사(모여들다) 둘 다로 쓰인다. flock to + 장소(~로 모여들다) 형태가 자주 출제된다.","grammarQuiz":[{"sentence":"Thousands of eager fans _____ _____ the concert venue as soon as the tickets went on sale.","ko":"티켓이 판매되자마자 수천 명의 열성 팬들이 콘서트 장소로 모여들었다.","answer":["flocked","to"],"hint":"자동사 과거형 + 방향 전치사"}]},
    {"id":"w02502","w":"flood","pos":["n","v"],"ph":"/flʌd/","cefr":"B1","kr":["홍수","범람하다"],"ex":[{"en":"The flood destroyed many homes.","ko":"홍수가 많은 집을 파괴했다."}],"mnemonic":{"soundHint":"플러드 → '푸르르~' 물이 콸콸","story":"물이 '플러드' 하고 밀려와 홍수가 되다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"deluge","ko":"대홍수","reason":"동의어 — 물의 범람"},{"w":"drought","ko":"가뭄","reason":"반의어 — 홍수의 반대"},{"w":"damage","ko":"피해","reason":"콜로 — 홍수 피해"}],"collocBest":[]},"nuance":{"koSimple":"물이 넘쳐 땅을 덮치는 것.","whenToUse":"장마·재해·홍수 피해 상황에."},"krDetail":[{"ko":"홍수","explain":"비가 많이 와서 물이 넘쳐흐르는 것"},{"ko":"넘쳐흐르다","explain":"가득 차서 밖으로 흘러 나오다"}],"usageExamples":[{"en":"The heavy rain caused a terrible flood that damaged many houses in the village.","ko":"그 폭우는 마을의 많은 집들을 손상시킨 끔찍한 홍수를 일으켰다."},{"en":"The market was flooded with cheap products from overseas manufacturers last year.","ko":"그 시장은 작년에 해외 제조업체들의 값싼 제품들로 넘쳐났다."}],"grammarNote":"flood는 명사(홍수)와 타동사(범람시키다) 둘 다로 쓰인다. 특히 be flooded with(~로 넘쳐나다)는 비유적 표현으로 자주 출제된다.","grammarQuiz":[{"sentence":"The customer service department _____ _____ with complaints after the faulty product was released.","ko":"고객 서비스 부서는 결함 있는 제품이 출시된 후 불만으로 넘쳐났다.","answer":["was","flooded"],"hint":"수동태 be + p.p."}]},
    {"id":"w02508","w":"flow","pos":["n","v"],"ph":"/floʊ/","cefr":"B1","kr":["흐름","흐르다"],"ex":[{"en":"Water flows down the river.","ko":"물이 강을 따라 흐른다."}],"mnemonic":{"soundHint":"플로우 → '플로우~' 물 흐르는 소리","story":"랩의 '플로우'처럼 물도 리듬 있게 흐른다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stream","ko":"흐름","reason":"동의어 — 흘러가는 것"},{"w":"current","ko":"흐름","reason":"동의어 — 물·전기 흐름"},{"w":"blockage","ko":"막힘","reason":"반의어 — 흐름의 반대"}],"collocBest":[]},"nuance":{"koSimple":"쉼 없이 이어져 움직이는 흐름.","whenToUse":"물·교통·현금 흐름을 말할 때."},"krDetail":[{"ko":"흐름","explain":"이어져서 움직여 가는 것"},{"ko":"흐르다","explain":"물처럼 이어지며 움직여 가다"}],"usageExamples":[{"en":"The clear mountain river flows gently through the beautiful valley.","ko":"그 맑은 산의 강이 아름다운 계곡을 통해 부드럽게 흐른다."},{"en":"Good cash flow is essential for the survival of any small business.","ko":"좋은 현금 흐름은 모든 소규모 사업체의 생존에 필수적이다."}],"grammarNote":"flow는 명사(흐름)와 자동사(흐르다) 둘 다로 쓰인다. 자동사이므로 수동태가 불가능하다. 학생들이 be flowed로 잘못 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The wide Amazon river _____ steadily _____ the dense rainforest for thousands of kilometers.","ko":"넓은 아마존 강은 수천 킬로미터에 걸쳐 울창한 열대우림을 통해 꾸준히 흐른다.","answer":["flows","through"],"hint":"자동사 3인칭 단수 + 관통 전치사"}]},
    {"id":"w02510","w":"flu","pos":["n"],"ph":"/fluː/","cefr":"B1","kr":["독감","인플루엔자"],"ex":[{"en":"He stayed home because he had the flu.","ko":"그는 독감에 걸려 집에 있었다."}],"mnemonic":{"soundHint":"인플루엔자","story":"'인플루엔자'의 줄임말, 한국에서도 그대로 사용","hintConfidence":3},"pairs":{"buddyWords":[{"w":"shot","ko":"주사","reason":"콜로 — 독감 예방주사"},{"w":"influenza","ko":"인플루엔자","reason":"동의어 — flu의 정식 명칭"},{"w":"illness","ko":"병","reason":"동의어 — 질병 개념"}],"collocBest":[{"en":"flu shot","ko":"독감 예방주사"},{"en":"stomach flu","ko":"위장 독감"}]},"nuance":{"koSimple":"열과 몸살을 동반한 감기 병.","whenToUse":"독감 시즌·예방 접종 이야기할 때."},"krDetail":[{"ko":"독감","explain":"심하게 앓는 감기 같은 병"},{"ko":"인플루엔자","explain":"바이러스로 걸리는 심한 감기"}],"usageExamples":[{"en":"Getting a flu shot every autumn can protect you from serious respiratory illnesses.","ko":"매년 가을 독감 예방주사를 맞는 것은 심각한 호흡기 질환으로부터 당신을 보호할 수 있다."},{"en":"She missed a whole week of school because she caught a bad case of the flu.","ko":"그녀는 심한 독감에 걸려서 학교를 한 주 내내 결석했다."}],"grammarNote":"flu는 특정 질병을 가리킬 때 정관사 the와 함께 the flu로 자주 쓰인다. catch the flu, have the flu 형태가 자주 출제된다.","grammarQuiz":[{"sentence":"Many elderly residents caught _____ flu during the harsh winter, _____ made hospitals extremely busy.","ko":"많은 노인 주민들이 혹독한 겨울 동안 독감에 걸렸고, 이는 병원들을 매우 바쁘게 만들었다.","answer":["the","which"],"hint":"정관사 + 관계대명사(계속적 용법)"}]},
    {"id":"w01628","w":"define","pos":["v"],"ph":"/dɪˈfaɪn/","cefr":"B1","kr":["정의하다","규정하다"],"ex":[{"en":"Please define this term clearly.","ko":"이 용어를 명확하게 정의해 주세요."}],"mnemonic":{"soundHint":"'디(de-)+파인(fine,정교한)' → 뜻을 정교하게","story":"de+fine(정교한) → 정교하게 뜻을 밝히다 = define(정의하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clearly","ko":"명확히","reason":"clearly defined 콜로케이션"},{"w":"explain","ko":"설명하다","reason":"define의 동의어"},{"w":"meaning","ko":"의미","reason":"define은 meaning을 밝힘"}],"collocBest":[]},"nuance":{"koSimple":"뜻을 정확히 설명하다.","whenToUse":"용어·개념을 명확히 규정할 때."},"krDetail":[{"ko":"정의하다","explain":"뜻을 분명히 밝히다"},{"ko":"규정하다","explain":"무엇인지 정하다"}],"usageExamples":[{"en":"The teacher defines each new word clearly during the vocabulary lesson.","ko":"그 선생님은 어휘 수업에서 새 단어들을 저마다 분명하게 정의해 주신다."},{"en":"Each new word is defined clearly during the vocabulary lesson.","ko":"새 단어들은 저마다 어휘 수업에서 분명하게 정의된다."}],"grammarNote":"define A as B는 'A를 B로 정의하다'라는 뜻이에요. 과거분사 defined는 well-defined(잘 정의된), clearly defined(명확히 정의된) 형태로 자주 나옵니다.","grammarQuiz":[{"sentence":"Scientists define water _____ a compound made of hydrogen and oxygen.","ko":"과학자들은 물을 수소와 산소로 이루어진 화합물이라고 정의한다.","answer":["as"],"hint":"define A ___ B"},{"sentence":"Please give a clearly _____ answer to the teacher's question.","ko":"선생님의 질문에 명확히 정의된 답을 주세요.","answer":["defined"],"hint":"과거분사"}]},
    {"id":"w02196","w":"exception","pos":["n"],"ph":"/ɪkˈsɛpʃən/","cefr":"B1","kr":["예외","제외"],"ex":[{"en":"There are no exceptions to this rule.","ko":"이 규칙에는 예외가 없다."}],"mnemonic":{"soundHint":"익셉션","story":"'ex(밖으로) + cept(잡다) + -ion' = 규칙 밖으로 빼낸 것, 예외.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"exclusion","ko":"제외","reason":"동의어 - 배제/제외를 의미"},{"w":"rule","ko":"규칙","reason":"반의어 - 규칙 vs 예외"},{"w":"except","ko":"~을 제외하고","reason":"어원 관계 - 같은 어근 cept"}],"collocBest":[]},"nuance":{"koSimple":"규칙에서 벗어난 유일한 경우.","whenToUse":"'예외 없이/예외적으로'를 강조할 때."},"krDetail":[{"ko":"예외","explain":"규칙에서 벗어남"},{"ko":"제외","explain":"따로 빼놓음"}],"usageExamples":[{"en":"The teacher made an exception for the sick student.","ko":"그 선생님은 아픈 학생을 위해 예외를 두었다."},{"en":"Every student passed the test without exception.","ko":"모든 학생이 예외 없이 시험에 통과했다."}],"grammarNote":"'~을 제외하고'는 with the exception of 또는 except for로 표현한다. make an exception (예외를 두다)과 without exception (예외 없이)는 관용 표현으로 통째로 외운다.","grammarQuiz":[{"sentence":"All the members came to the meeting without _____ yesterday.","ko":"모든 회원이 어제 예외 없이 회의에 왔다.","answer":["exception"],"hint":"without 뒤 명사, '예외 없이' 관용구"},{"sentence":"The rule applies to everyone with the _____ of children.","ko":"그 규칙은 어린이를 제외한 모두에게 적용된다.","answer":["exception"],"hint":"with the ___ of: ~을 제외하고 관용구"}]},
    {"id":"w01593","w":"decade","pos":["n"],"ph":"/ˈdekeɪd/","cefr":"B1","kr":["10년"],"ex":[{"en":"It happened a decade ago.","ko":"그것은 10년 전에 일어났다."}],"mnemonic":{"soundHint":"'데카(deca-,10)' 접두사 → 10년 단위","story":"데카슬론(decathlon, 10종경기)의 deca-는 10 → decade = 10년","hintConfidence":3},"pairs":{"buddyWords":[{"w":"past","ko":"지난","reason":"past decade 콜로케이션"},{"w":"century","ko":"세기","reason":"decade보다 큰 시간 단위"},{"w":"year","ko":"년","reason":"decade는 10 years"}],"collocBest":[]},"nuance":{"koSimple":"10년의 기간.","whenToUse":"긴 세월을 10년 단위로 나타낼 때."},"krDetail":[{"ko":"10년","explain":"십 년의 기간"}],"usageExamples":[{"en":"The city has changed a lot over the past decade.","ko":"그 도시는 지난 10년 동안 많이 변했다."},{"en":"They have been friends for more than a decade.","ko":"그들은 10년 넘게 친구로 지내 왔다."}],"grammarNote":"decade는 셀 수 있는 명사예요. for a decade(10년 동안)는 완료 시제와, over the past decade(지난 10년에 걸쳐)는 현재완료와 어울립니다.","grammarQuiz":[{"sentence":"Over the past _____, smartphones have completely changed our daily lives.","ko":"지난 10년에 걸쳐, 스마트폰은 우리의 일상을 완전히 바꾸어 놓았다.","answer":["decade"],"hint":"단수 명사"},{"sentence":"She has lived in that same small town _____ more than a decade.","ko":"그녀는 그 같은 작은 마을에서 10년 넘게 살아왔다.","answer":["for"],"hint":"기간 전치사"}]},

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

    // 모든 카드 끝남 → 퀴즈로

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플

  // 모드 균등 분배 (대략)

    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),

    ...Array(2).fill("listening")
  ];

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

  // wire
  if(mode === "meaning-mcq" || mode === "word-mcq"){
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=> handleChoice(btn));
    });
  } else if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    containers.forEach(c => renderWordAnswer(c, c.dataset.answer));
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = document.querySelector(".cloze-wa .rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
  } else {
    const container = document.getElementById("wordAnswer");
    renderWordAnswer(container, container.dataset.answer);
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = container.querySelector(".rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
    if(mode === "listening"){
      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
    }
  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);
  renderHeader();
  if(state.sfxOn){ getAC(); SFX.streak(); }
});
document.getElementById("cbBtn").addEventListener("click", ()=>{
  state.cbMode = !state.cbMode;
  lsSet(CB_KEY, state.cbMode);
  document.body.classList.toggle("cb-mode", state.cbMode);
  renderHeader();
});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
</script>
