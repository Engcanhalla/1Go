    {"id":"w04222","w":"motivate","pos":["v"],"ph":"/ˈmoʊtɪveɪt/","cefr":"B1","kr":["동기를 부여하다","자극하다"],"ex":[{"en":"She motivated the students.","ko":"그녀는 학생들에게 동기를 부여했다."}],"mnemonic":{"soundHint":"모티베이트 → motive(동기) + ate","story":"motive(동기)를 주다 = 동기부여하다! '모티베이션 올려줘!'","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inspire","ko":"영감을 주다","reason":"동기 부여 동의어"},{"w":"encourage","ko":"격려하다","reason":"동기 부여 동의어"},{"w":"discourage","ko":"낙담시키다","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"의욕에 불을 붙여 움직이게 하다.","whenToUse":"학생·팀원을 움직이게 하는 자극을 말할 때."},"krDetail":[{"ko":"동기를 부여하다","explain":"누군가가 어떤 일을 하고 싶은 마음이 들도록 마음을 움직여 주다"},{"ko":"자극하다","explain":"가만히 있던 마음이나 몸에 힘을 넣어 움직이게 만들다"}],"usageExamples":[{"en":"Good teachers motivate students to study harder every day.","ko":"좋은 선생님은 매일 학생들이 더 열심히 공부하도록 동기를 부여한다."},{"en":"Fear can motivate change, but hope motivates growth more deeply.","ko":"두려움도 변화를 일으키지만, 희망은 성장을 더 깊이 이끌어낸다."}],"grammarNote":"motivate는 5형식 동사로 'motivate + 목적어 + to부정사' 형태로 자주 쓴다. 학생들은 'motivate 목적어 동사원형(×)'처럼 to를 빠뜨리거나 'motivate for -ing(×)'로 잘못 쓰기 쉽다.","grammarQuiz":[{"sentence":"The coach _____ his players _____ never give up.","ko":"그 코치는 자신의 선수들이 결코 포기하지 않도록 동기를 부여했다.","answer":["motivated","to"],"hint":"동사는 과거형, 목적격보어 자리에 to부정사"},{"sentence":"What _____ you _____ study English so hard every night?","ko":"무엇이 네가 매일 밤 그렇게 열심히 영어를 공부하도록 만드는가?","answer":["motivates","to"],"hint":"주어가 3인칭 단수 What, 현재시제 + to부정사"}]},
    {"id":"w04223","w":"motivation","pos":["n"],"ph":"/ˌmoʊtɪˈveɪʃən/","cefr":"B1","kr":["동기","의욕"],"ex":[{"en":"She lacked motivation today.","ko":"그녀는 오늘 의욕이 부족했다."}],"mnemonic":{"soundHint":"모티베이션 → motivate + ion","story":"'모티베이션'! 우리말에서도 그대로 쓰는 '동기, 의욕'!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"drive","ko":"추진력","reason":"의욕 동의어"},{"w":"inspiration","ko":"영감","reason":"동기 동의어"},{"w":"apathy","ko":"무관심","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"뭔가 하고 싶게 만드는 마음속 힘.","whenToUse":"공부·운동을 계속하는 원동력에."},"krDetail":[{"ko":"동기","explain":"어떤 행동을 하도록 마음속에서 밀어주는 힘이나 이유"},{"ko":"의욕","explain":"무엇인가를 해내고 싶다는 뜨겁고 강한 마음"}],"usageExamples":[{"en":"She lost all motivation after failing the exam three times.","ko":"그녀는 시험에 세 번 떨어진 뒤 모든 의욕을 잃었다."},{"en":"Intrinsic motivation lasts longer than motivation from outside rewards.","ko":"내재적 동기는 외부 보상에서 나오는 동기보다 오래 지속된다."}],"grammarNote":"motivation은 불가산 명사로 자주 쓰이지만 종류를 셀 때는 가산도 가능하다. 'a motivation'을 무조건 오답으로 여기거나, 'motivations for -ing'에서 to부정사를 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"He has strong _____ _____ learn a new language this year.","ko":"그는 올해 새로운 언어를 배우고자 하는 강한 동기가 있다.","answer":["motivation","to"],"hint":"명사 + to부정사가 명사를 꾸며주는 형태"},{"sentence":"Her main _____ _____ working late is to support her family.","ko":"늦게까지 일하는 그녀의 주된 동기는 가족을 부양하는 것이다.","answer":["motivation","for"],"hint":"명사 + 전치사 + 동명사"}]},
    {"id":"w04238","w":"mow","pos":["v"],"ph":"/moʊ/","cefr":"B1","kr":["(풀을) 베다","깎다"],"ex":[{"en":"He mows the grass every two weeks.","ko":"그는 2주마다 풀을 깎는다."}],"mnemonic":{"soundHint":"모우 → '못(도구)'으로 풀을 베다","story":"'모(苗)'는 볍씨! 풀을 베어 모아라 = mow the lawn!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"cut","ko":"자르다","reason":"동의 관계"},{"w":"trim","ko":"다듬다","reason":"동의 관계"},{"w":"lawn","ko":"잔디밭","reason":"콜로케이션 짝"}],"collocBest":[]},"nuance":{"koSimple":"기계로 잔디·풀을 짧게 자르다.","whenToUse":"잔디 깎기·풀 베기 얘기할 때."},"krDetail":[{"ko":"(풀을) 베다","explain":"낫이나 기계로 풀·잔디를 밑동에서 잘라내다"},{"ko":"깎다","explain":"표면을 얇게 잘라 다듬거나 짧게 만들다"}],"usageExamples":[{"en":"He mows the lawn every Saturday morning without fail.","ko":"그는 매주 토요일 아침마다 어김없이 잔디를 깎는다."},{"en":"I hate mowing the grass, but I love the fresh smell after.","ko":"나는 잔디 깎는 것을 싫어하지만, 그 뒤의 상쾌한 냄새는 아주 좋아한다."}],"grammarNote":"mow는 불규칙 변화(mow-mowed-mown/mowed)라서 학생들이 과거분사를 'mowed'로만 알거나 'mowed the lawn'을 'mow lawn'으로 관사를 빠뜨리기 쉽다.","grammarQuiz":[{"sentence":"The lawn was _____ _____ my father last weekend.","ko":"잔디는 지난 주말에 우리 아버지에 의해 깎였다.","answer":["mown","by"],"hint":"수동태 과거분사 + 행위자 전치사"},{"sentence":"I need to _____ _____ lawn before it starts raining.","ko":"비가 오기 전에 잔디를 깎아야 한다.","answer":["mow","the"],"hint":"동사원형 + 정관사"}]},
    {"id":"w04243","w":"multiple","pos":["adj","n"],"ph":"/ˈmʌltɪpəl/","cefr":"B1","kr":["다수의","배수"],"ex":[{"en":"There are multiple options.","ko":"여러 가지 선택지가 있다."}],"mnemonic":{"soundHint":"멀티플 → multi(다) + ple","story":"'멀티태스킹'의 multi = 여러 개! multiple choice = 객관식!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"several","ko":"몇몇의","reason":"동의 관계"},{"w":"numerous","ko":"수많은","reason":"동의 관계"},{"w":"single","ko":"단 하나의","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"하나가 아니라 여럿의.","whenToUse":"여러 선택지·다양한 경우 말할 때."},"krDetail":[{"ko":"다수의","explain":"하나가 아닌 여럿의, 여러 가지가 함께 있는"},{"ko":"배수","explain":"어떤 수를 몇 번 곱해서 나오는 수"}],"usageExamples":[{"en":"The teacher gave multiple examples to help us understand the concept.","ko":"선생님은 우리가 그 개념을 이해하도록 여러 가지 예시를 들어 주셨다."},{"en":"One reason may be enough, but multiple reasons make an argument stronger.","ko":"한 가지 이유로 충분할 수도 있지만, 여러 이유는 논거를 더 강하게 만든다."}],"grammarNote":"multiple 뒤에는 반드시 복수 명사가 온다. 학생들이 'multiple reason(×), multiple time(×)'처럼 단수형을 쓰거나, 'multiples of(배수)'와 형용사 형태를 혼동한다.","grammarQuiz":[{"sentence":"She had _____ reasons _____ quit her job last month.","ko":"그녀는 지난달 직장을 그만둔 여러 가지 이유가 있었다.","answer":["multiple","to"],"hint":"형용사 + 복수명사 + to부정사"},{"sentence":"The number 12 is a _____ _____ both 3 and 4.","ko":"숫자 12는 3과 4 둘 다의 배수이다.","answer":["multiple","of"],"hint":"명사 + 전치사 of"}]},
    {"id":"w04263","w":"mystery","pos":["n"],"ph":"/ˈmɪstəri/","cefr":"B1","kr":["미스터리","수수께끼"],"ex":[{"en":"The mystery was unsolved.","ko":"그 미스터리는 해결되지 않았다."}],"mnemonic":{"soundHint":"미스터리 → 그대로 '미스터리'","story":"'미스터리 소설'! 우리말로도 그대로 쓰는 = 수수께끼!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"puzzle","ko":"수수께끼","reason":"동의 관계"},{"w":"enigma","ko":"수수께끼","reason":"동의 관계"},{"w":"solve","ko":"풀다","reason":"콜로케이션 짝"}],"collocBest":[]},"nuance":{"koSimple":"이유를 알 수 없는 수수께끼.","whenToUse":"풀리지 않는 사건·비밀 얘기할 때."},"krDetail":[{"ko":"미스터리","explain":"그 까닭이나 진짜 모습을 알 수 없는 이상한 일"},{"ko":"수수께끼","explain":"답이 쉽게 떠오르지 않는 어려운 문제나 사건"}],"usageExamples":[{"en":"The detective solved the mystery within just three days.","ko":"그 형사는 단 3일 만에 그 수수께끼를 풀었다."},{"en":"Her sudden disappearance remains a mystery, yet no clue has been found.","ko":"그녀의 갑작스러운 실종은 여전히 수수께끼이며, 어떤 단서도 발견되지 않았다."}],"grammarNote":"mystery는 가산·불가산 모두 쓰인다. 학생들은 'mystery about(×)'로 쓰거나, 'a mystery to me(내게는 수수께끼)'처럼 to를 써야 하는 관용 표현을 놓친다.","grammarQuiz":[{"sentence":"How he escaped from the locked room is still _____ _____ me.","ko":"그가 어떻게 잠긴 방에서 탈출했는지는 아직도 내게 수수께끼다.","answer":["a","mystery"],"hint":"부정관사 + 명사 (뒤 to me)"},{"sentence":"The police are trying to _____ the _____ of the missing painting.","ko":"경찰은 사라진 그림의 수수께끼를 풀려고 애쓰고 있다.","answer":["solve","mystery"],"hint":"동사 solve + 명사"}]},
    {"id":"w04264","w":"myth","pos":["n"],"ph":"/mɪθ/","cefr":"B1","kr":["신화","통념"],"ex":[{"en":"That is a common myth.","ko":"그것은 흔한 통념이다."}],"mnemonic":{"soundHint":"미스 → '미스(miss)' 진실","story":"'미스(miss)' 진실! 신화(myth)는 진실을 놓친 이야기.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"legend","ko":"전설","reason":"동의 관계"},{"w":"fable","ko":"우화","reason":"동의 관계"},{"w":"fact","ko":"사실","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"옛날부터 전해진 신화나 잘못된 통념.","whenToUse":"그리스 신화·흔한 오해 얘기할 때."},"krDetail":[{"ko":"신화","explain":"옛사람들이 신이나 영웅에 대해 지어 전한 이야기"},{"ko":"통념","explain":"많은 사람이 그렇다고 믿고 있는 잘못된 생각"}],"usageExamples":[{"en":"Greek myths tell exciting stories of gods and heroes.","ko":"그리스 신화는 신들과 영웅들에 대한 흥미진진한 이야기를 전한다."},{"en":"Many people believe the myth, but scientific evidence clearly proves it false.","ko":"많은 사람이 그 통념을 믿지만, 과학적 증거는 그것이 틀렸음을 분명히 보여준다."}],"grammarNote":"myth는 가산 명사로 관사·복수형이 필수다. 학생들은 'myth is(관사 누락)'처럼 쓰거나, 'myth of/about ~' 전치사를 혼동한다.","grammarQuiz":[{"sentence":"It is _____ _____ that eating carrots greatly improves eyesight.","ko":"당근을 먹으면 시력이 크게 좋아진다는 것은 통념이다.","answer":["a","myth"],"hint":"부정관사 + 가산 명사"},{"sentence":"Ancient Greek _____ _____ full of gods and monsters.","ko":"고대 그리스 신화는 신과 괴물로 가득 차 있다.","answer":["myths","are"],"hint":"복수 명사 + 복수형 be동사"}]},
    {"id":"w04287","w":"navigate","pos":["v"],"ph":"/ˈnævɪɡeɪt/","cefr":"B1","kr":["항해하다","길을 찾다"],"ex":[{"en":"Navigate the dark forest.","ko":"어두운 숲을 헤쳐 나아가라."}],"mnemonic":{"soundHint":"내비게이트 → 자동차 '내비게이션'","story":"'내비게이션'! 길을 안내한다. navigate = 항해하다, 길 찾다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"guide","ko":"안내하다","reason":"동의 관계"},{"w":"steer","ko":"조종하다","reason":"동의 관계"},{"w":"explore","ko":"탐색하다","reason":"시나리오 짝"}],"collocBest":[]},"nuance":{"koSimple":"길·상황을 헤쳐 나가며 방향을 잡다.","whenToUse":"배·웹사이트·어려운 상황을 뚫고 갈 때."},"krDetail":[{"ko":"항해하다","explain":"배를 몰아 바다나 강 위를 지나가다"},{"ko":"길을 찾다","explain":"낯선 곳에서 원하는 곳까지 방향을 잘 잡아 나아가다"}],"usageExamples":[{"en":"Sailors navigate ships across the ocean using the stars.","ko":"선원들은 별을 이용해 배를 몰고 바다를 건넌다."},{"en":"Old maps helped travelers navigate, but modern GPS makes the task easy.","ko":"옛 지도는 여행자들이 길을 찾도록 도왔지만, 현대 GPS는 그 일을 쉽게 만든다."}],"grammarNote":"navigate는 타동사와 자동사 모두 쓰인다. 학생들은 'navigate to(길찾기 앱은 가능)', 'navigate through(어려움을 헤쳐 나가다)'의 구별을 어려워하며 'navigate a website'를 어색하게 여긴다.","grammarQuiz":[{"sentence":"Users can easily _____ _____ the website using the top menu.","ko":"이용자들은 상단 메뉴를 이용해 그 웹사이트를 쉽게 탐색할 수 있다.","answer":["navigate","through"],"hint":"동사 navigate + 전치사 through"},{"sentence":"It's hard _____ navigate _____ a foreign city without any map.","ko":"지도 없이 낯선 도시에서 길을 찾는 것은 어렵다.","answer":["to","in"],"hint":"to부정사 + 장소 전치사 in"}]},
    {"id":"w04293","w":"necessarily","pos":["adv"],"ph":"/ˌnesəˈserəli/","cefr":"B1","kr":["반드시","필연적으로"],"ex":[{"en":"Not necessarily the best.","ko":"반드시 최선은 아니다."}],"mnemonic":{"soundHint":"네세서릴리 → necessary(필요한) + ly","story":"necessary(필요한) + ly = 반드시! not necessarily(반드시 그런 건 아니다).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inevitably","ko":"필연적으로","reason":"동의 관계"},{"w":"certainly","ko":"확실히","reason":"동의 관계"},{"w":"optionally","ko":"선택적으로","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"반드시·꼭 그런 건 아닌.","whenToUse":"'not necessarily'로 반박·부분 부정할 때."},"krDetail":[{"ko":"반드시","explain":"무슨 일이 있어도 꼭 그렇게 되도록"},{"ko":"필연적으로","explain":"어떤 일이 반드시 그렇게 이어질 수밖에 없이"}],"usageExamples":[{"en":"Being rich does not necessarily mean being happy in life.","ko":"부유한 것이 반드시 인생에서 행복함을 뜻하지는 않는다."},{"en":"A bigger team wins more often, but not necessarily every single game.","ko":"더 큰 팀이 더 자주 이기지만, 반드시 모든 경기를 이기는 것은 아니다."}],"grammarNote":"'not necessarily'는 '반드시 ~은 아니다'라는 부분 부정이다. 학생들은 이를 완전 부정 'not at all'로 오해하고, 어순 'necessarily not(×)'로 잘못 배열한다.","grammarQuiz":[{"sentence":"Studying long hours does _____ _____ lead to good grades.","ko":"오래 공부하는 것이 반드시 좋은 성적으로 이어지는 것은 아니다.","answer":["not","necessarily"],"hint":"부분 부정 not + necessarily 어순"},{"sentence":"Expensive things are _____ _____ better than cheap ones.","ko":"비싼 것들이 반드시 싼 것들보다 더 좋은 것은 아니다.","answer":["not","necessarily"],"hint":"be동사 뒤 부분 부정 표현"}]},
    {"id":"w04442","w":"obvious","pos":["adj"],"ph":"/ˈɒbviəs/","cefr":"B1","kr":["명백한","분명한"],"ex":[{"en":"The answer is obvious.","ko":"답은 명백하다."}],"mnemonic":{"soundHint":"옵비어스 → ob(위) + via(길) + ous","story":"ob(위) + via(길) + ous = 길 위에 뻔히 보이는 = 명백한!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clear","ko":"명확한","reason":"동의어"},{"w":"evident","ko":"분명한","reason":"동의어"},{"w":"hidden","ko":"숨겨진","reason":"반의어"}],"collocBest":[]},"nuance":{"koSimple":"누가 봐도 뻔한.","whenToUse":"당연한 답·분명한 사실 말할 때."},"krDetail":[{"ko":"명백한","explain":"누가 봐도 알 수 있을 만큼 확실한"},{"ko":"분명한","explain":"숨겨져 있지 않고 눈에 확 띄는"}],"usageExamples":[{"en":"It is obvious that she did not read the book.","ko":"그녀가 그 책을 읽지 않은 것은 명백하다."},{"en":"The answer to this puzzle is not obvious at first.","ko":"이 퍼즐의 답은 처음에는 명백하지 않다."}],"grammarNote":"obvious는 형용사로 It is obvious that + 주어 + 동사 구조로 자주 쓰인다. 부사형은 obviously로 문장 전체를 꾸며 '명백히'라는 뜻을 나타낸다.","grammarQuiz":[{"sentence":"It is _____ that he _____ not tell the truth.","ko":"그가 진실을 말하지 않았다는 것은 명백하다.","answer":["obvious","did"],"hint":"형용사+조동사"},{"sentence":"The _____ reason for the delay _____ heavy traffic.","ko":"지연의 명백한 이유는 극심한 교통 체증이었다.","answer":["obvious","was"],"hint":"형용사+과거 be동사"}]},
    {"id":"w04444","w":"occasion","pos":["n"],"ph":"/əˈkeɪʒən/","cefr":"B1","kr":["경우","행사"],"ex":[{"en":"It was a special occasion.","ko":"그것은 특별한 행사였다."}],"mnemonic":{"soundHint":"오케이젼 → '오케이! 젼(경사)'!","story":"'오케이! 특별한 날!' special occasion(특별한 경우/행사).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"event","ko":"행사, 사건","reason":"동의어"},{"w":"occasional","ko":"가끔의","reason":"동일 어근 형용사"},{"w":"celebrate","ko":"축하하다","reason":"special occasion 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"특별한 경우나 행사.","whenToUse":"생일·기념일 같은 특별한 자리에."},"krDetail":[{"ko":"경우","explain":"어떤 일이 벌어지는 때나 상황"},{"ko":"행사","explain":"여러 사람이 함께 모여 치르는 특별한 일"}],"usageExamples":[{"en":"The wedding was a joyful occasion for the family.","ko":"결혼식은 그 가족에게 기쁜 행사였다."},{"en":"On some occasions, silence speaks louder than words.","ko":"어떤 경우에는 침묵이 말보다 더 크게 말한다."}],"grammarNote":"occasion은 셀 수 있는 명사로 '(어떤 일이 일어난) 때'나 '특별 행사'를 뜻한다. on occasion(때때로)은 관용구로 굳어진 표현이니 그대로 외운다.","grammarQuiz":[{"sentence":"The party was a special _____ for everyone _____ attended.","ko":"그 파티는 참석한 모두에게 특별한 행사였다.","answer":["occasion","who"],"hint":"명사+관계대명사"},{"sentence":"On rare _____, she _____ dinner with old friends.","ko":"드문 경우에 그녀는 옛 친구들과 저녁을 먹는다.","answer":["occasions","has"],"hint":"복수명사+3단현 동사"}]},
    {"id":"w04490","w":"on purpose","pos":["adv"],"ph":"/ɒn ˈpɜːpəs/","cefr":"B1","kr":["의도적으로","일부러"],"ex":[{"en":"He did it on purpose.","ko":"그는 일부러 그렇게 했다."}],"mnemonic":{"soundHint":"온 퍼포즈","story":"'온(완전한)' + '퍼포즈(purpose 목적)' → 완전히 목적을 가지고 = 일부러","hintConfidence":2},"pairs":{"buddyWords":[{"w":"intentionally","ko":"의도적으로","reason":"동의어 부사"},{"w":"accidentally","ko":"실수로","reason":"반의어 부사"},{"w":"deliberately","ko":"고의로","reason":"동의어 부사"}],"collocBest":[]},"nuance":{"koSimple":"실수가 아니라 일부러.","whenToUse":"의도적으로 한 행동을 강조할 때."},"krDetail":[{"ko":"의도적으로","explain":"실수가 아니라 그렇게 하려고 마음먹고"},{"ko":"일부러","explain":"우연이 아니라 마음속으로 정해서"}],"usageExamples":[{"en":"He broke the vase on purpose to hide his mistake.","ko":"그는 실수를 감추려고 일부러 꽃병을 깨뜨렸다."},{"en":"She did not miss the bus on purpose; it was an accident.","ko":"그녀는 일부러 버스를 놓친 것이 아니라 그것은 사고였다."}],"grammarNote":"on purpose는 관용 부사구로 '고의로'라는 뜻이며, 반대말은 by accident(우연히)이다. 문장 끝에 위치하는 경우가 가장 많다.","grammarQuiz":[{"sentence":"The boy _____ his sister's toy _____ _____.","ko":"그 소년은 일부러 여동생의 장난감을 부쉈다.","answer":["broke","on","purpose"],"hint":"과거 동사+관용 부사구"},{"sentence":"She was not late _____ _____; the bus _____ delayed.","ko":"그녀가 일부러 늦은 게 아니라 버스가 지연됐다.","answer":["on","purpose","was"],"hint":"관용구+be동사"}]},
    {"id":"w04526","w":"opportunity","pos":["n"],"ph":"/ˌɒpəˈtjuːnɪti/","cefr":"B1","kr":["기회"],"ex":[{"en":"This is a great opportunity.","ko":"이것은 훌륭한 기회이다."}],"mnemonic":{"soundHint":"오퍼튜니티","story":"'오퍼(offer 제안)'가 튠(tune) 들어오는 = 기회","hintConfidence":2},"pairs":{"buddyWords":[{"w":"chance","ko":"기회","reason":"동의어"},{"w":"miss","ko":"놓치다","reason":"miss an opportunity 시나리오"},{"w":"equal","ko":"평등한","reason":"equal opportunity 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"놓치면 아까운 기회.","whenToUse":"좋은 조건이 찾아왔을 때."},"krDetail":[{"ko":"기회","explain":"어떤 일을 해 볼 수 있는 좋은 때"}],"usageExamples":[{"en":"This job gives you a great opportunity to learn new skills.","ko":"이 일은 당신에게 새로운 기술을 배울 좋은 기회를 준다."},{"en":"She missed the opportunity to study abroad last year.","ko":"그녀는 작년에 해외에서 공부할 기회를 놓쳤다."}],"grammarNote":"opportunity 뒤에 '~할 기회'가 오면 to부정사(opportunity to do)를 쓴다. opportunity of doing보다 opportunity to do 형태가 훨씬 자연스럽다.","grammarQuiz":[{"sentence":"This program gives students _____ _____ _____ study abroad.","ko":"이 프로그램은 학생들에게 해외에서 공부할 기회를 준다.","answer":["an","opportunity","to"],"hint":"관사+명사+to부정사"},{"sentence":"Do not _____ this rare _____ _____ meet the author.","ko":"그 작가를 만날 이 드문 기회를 놓치지 마라.","answer":["miss","opportunity","to"],"hint":"동사+명사+to부정사"}]},
    {"id":"w04449","w":"occur","pos":["v"],"ph":"/əˈkɜː/","cefr":"B1","kr":["발생하다","일어나다"],"ex":[{"en":"The accident occurred at noon.","ko":"사고는 정오에 발생했다."}],"mnemonic":{"soundHint":"오커 → '오! 커(큰) 일'","story":"'오! 커(큰) 일!' 사건이 발생하다(occur)! It occurred to me(생각이 나다).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"happen","ko":"일어나다","reason":"동의어"},{"w":"occurrence","ko":"발생, 사건","reason":"동일 어근 명사형"},{"w":"accident","ko":"사고","reason":"accidents occur 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"어떤 일이 일어나다.","whenToUse":"사고·현상이 생겼음을 격식 있게."},"krDetail":[{"ko":"발생하다","explain":"미리 정하지 않은 일이 갑자기 생기다"},{"ko":"일어나다","explain":"어떤 일이 실제로 이루어지다"}],"usageExamples":[{"en":"Accidents often occur when drivers are tired.","ko":"사고는 운전자가 피곤할 때 자주 발생한다."},{"en":"An idea suddenly occurred to me during the walk.","ko":"산책 중에 갑자기 한 가지 생각이 내게 떠올랐다."}],"grammarNote":"occur는 자동사이므로 목적어를 바로 취하지 않는다. '~에게 (생각이) 떠오르다'는 occur to 사람으로 쓰고, 과거형은 자음을 겹쳐 occurred로 쓴다.","grammarQuiz":[{"sentence":"Storms usually _____ during the summer _____ this region.","ko":"폭풍은 이 지역에서 보통 여름 동안 발생한다.","answer":["occur","in"],"hint":"동사+전치사"},{"sentence":"A brilliant idea _____ to _____ in the middle of the night.","ko":"훌륭한 아이디어가 한밤중에 그에게 떠올랐다.","answer":["occurred","him"],"hint":"과거 동사+목적격 대명사"}]},
    {"id":"w04527","w":"oppose","pos":["v"],"ph":"/əˈpoʊz/","cefr":"B1","kr":["반대하다","맞서다"],"ex":[{"en":"Many people opposed the plan.","ko":"많은 사람들이 그 계획에 반대했다."}],"mnemonic":{"soundHint":"어! 포즈","story":"'어! 포즈(자세)' 취하며 맞서다 = 반대하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"object to","ko":"반대하다","reason":"동의어 구동사"},{"w":"support","ko":"지지하다","reason":"반의어"},{"w":"policy","ko":"정책","reason":"oppose a policy 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"강하게 반대·맞서다.","whenToUse":"정책·의견에 강한 반대 표할 때."},"krDetail":[{"ko":"반대하다","explain":"어떤 생각이나 결정에 맞서 아니라고 하다"},{"ko":"맞서다","explain":"어떤 힘이나 뜻에 굽히지 않고 버티다"}],"usageExamples":[{"en":"Many citizens oppose the new tax law.","ko":"많은 시민들이 새 세법에 반대한다."},{"en":"She was elected because fewer voters opposed her.","ko":"그녀에게 반대한 유권자가 적어서 그녀는 당선됐다."}],"grammarNote":"oppose는 타동사여서 뒤에 목적어를 바로 붙이고 to를 쓰지 않는다. object to와 뜻은 비슷하지만 oppose to(X) → oppose(O)로 써야 한다.","grammarQuiz":[{"sentence":"Environmentalists strongly _____ the _____ of the new factory.","ko":"환경 운동가들은 새 공장의 건설에 강력히 반대한다.","answer":["oppose","building"],"hint":"동사+동명사"},{"sentence":"The workers _____ the change _____ they lost their jobs.","ko":"노동자들은 일자리를 잃게 되자 그 변화에 반대했다.","answer":["opposed","because"],"hint":"과거 동사+접속사"}]},
    {"id":"w04397","w":"nutrient","pos":["n"],"ph":"/ˈnjuːtriənt/","cefr":"B1","kr":["영양소","영양분"],"ex":[{"en":"Vegetables are rich in nutrients.","ko":"야채는 영양소가 풍부하다."}],"mnemonic":{"soundHint":"뉴트리언트 → nutri(영양) + ent","story":"nutri(영양)+ ent = 영양이 되는 것! 비타민, 미네랄 같은 영양소.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nutrition","ko":"영양","reason":"동일 어근 파생어(nutrient/nutrition)"},{"w":"vitamin","ko":"비타민","reason":"대표적인 필수 영양소 종류"},{"w":"absorb","ko":"흡수하다","reason":"몸이 영양소를 흡수하는 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"몸을 자라게 하는 영양 성분.","whenToUse":"음식·식물에 든 영양 성분 말할 때."},"krDetail":[{"ko":"영양소","explain":"몸을 자라게 하고 힘을 내게 하는 먹거리 속 알맹이"},{"ko":"영양분","explain":"음식 속에 들어 있어 몸을 튼튼하게 해주는 성분"}],"usageExamples":[{"en":"Plants absorb nutrients from the soil through their roots.","ko":"식물은 뿌리를 통해 흙에서 영양소를 흡수한다."},{"en":"This meal is rich in nutrients that support growth.","ko":"이 식사는 성장을 돕는 영양소가 풍부하다."}],"grammarNote":"nutrient는 셀 수 있는 명사이므로 여러 종류를 말할 때 nutrients처럼 복수형으로 쓴다. nutrition(영양 섭취 전반)과 헷갈리지 말 것.","grammarQuiz":[{"sentence":"Vegetables _____ many important _____ for a healthy body.","ko":"채소는 건강한 몸을 위한 많은 중요한 영양소를 함유하고 있다.","answer":["contain","nutrients"],"hint":"동사+복수명사"},{"sentence":"The soil _____ essential _____ to help crops grow well.","ko":"그 토양은 작물이 잘 자라도록 필수 영양소를 제공한다.","answer":["provides","nutrients"],"hint":"3인칭 단수 동사"}]},
    {"id":"w04398","w":"nutrition","pos":["n"],"ph":"/njuːˈtrɪʃən/","cefr":"B1","kr":["영양","영양 섭취"],"ex":[{"en":"Good nutrition is essential.","ko":"좋은 영양 섭취는 필수적이다."}],"mnemonic":{"soundHint":"뉴트리션 → nutri(영양) + tion","story":"nutri(영양) + tion(명사) = 영양! nutrition label(영양 표시).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nutrient","ko":"영양소","reason":"동일 어근 파생어"},{"w":"diet","ko":"식단","reason":"동의어·영양 섭취 시나리오"},{"w":"malnutrition","ko":"영양실조","reason":"반의어(영양 부족)"}],"collocBest":[]},"nuance":{"koSimple":"음식을 통해 얻는 영양.","whenToUse":"건강한 식사·영양 상태를 말할 때."},"krDetail":[{"ko":"영양","explain":"몸이 자라고 살아가는 데 필요한 먹거리의 힘"},{"ko":"영양 섭취","explain":"몸에 필요한 힘을 얻으려고 음식을 먹는 일"}],"usageExamples":[{"en":"Doctors recommend balanced nutrition for children.","ko":"의사들은 아이들에게 균형 잡힌 영양을 권한다."},{"en":"Poor nutrition can lead to serious health problems.","ko":"부실한 영양은 심각한 건강 문제를 일으킬 수 있다."}],"grammarNote":"nutrition은 셀 수 없는 명사(불가산명사)라서 a nutrition이나 nutritions로 쓰지 않는다. 앞에 good/poor/proper 같은 형용사를 붙여 상태를 나타낸다.","grammarQuiz":[{"sentence":"Good _____ is _____ for healthy growth in teenagers.","ko":"좋은 영양은 십대의 건강한 성장에 필수적이다.","answer":["nutrition","essential"],"hint":"불가산명사+형용사"},{"sentence":"The lack of proper _____ _____ many children in poor regions.","ko":"적절한 영양의 부족은 가난한 지역의 많은 아이들에게 영향을 미친다.","answer":["nutrition","affects"],"hint":"불가산명사+3단현 동사"}]},
    {"id":"w04400","w":"oar","pos":["n"],"ph":"/ɔːr/","cefr":"B1","kr":["노","노젓는 막대"],"ex":[{"en":"He pulled the oar through the water.","ko":"그는 물속에서 노를 저었다."}],"mnemonic":{"soundHint":"오어 → '오(오리처럼)' 저어라","story":"'오~' 힘차게 저어라! 오리처럼 노(oar)를 저어서 배를 움직여!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"paddle","ko":"노, 패들","reason":"동의어(노 젓는 도구)"},{"w":"row","ko":"노를 젓다","reason":"oar로 하는 동작"},{"w":"boat","ko":"배","reason":"노를 사용하는 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"배를 저을 때 쓰는 긴 노.","whenToUse":"보트·카누에서 물을 저을 때."},"krDetail":[{"ko":"노","explain":"배를 앞으로 나아가게 하려고 물을 미는 긴 나무 막대"},{"ko":"노젓는 막대","explain":"손잡이가 있고 끝이 넓적해서 물을 밀어내는 도구"}],"usageExamples":[{"en":"The fisherman held the oar tightly and rowed the boat.","ko":"어부는 노를 꽉 잡고 배를 저었다."},{"en":"Without an oar, the small boat drifted with the wind.","ko":"노가 없어서 작은 배는 바람에 떠내려갔다."}],"grammarNote":"oar는 자음처럼 발음되지만 모음 소리 /ɔːr/로 시작해서 앞에 관사 an을 쓴다. paddle과 비슷하지만 oar는 보통 노받이(oarlock)에 고정해서 젓는다.","grammarQuiz":[{"sentence":"He picked up _____ oar and _____ toward the shore.","ko":"그는 노 하나를 집어 들고 해안 쪽으로 저어 갔다.","answer":["an","rowed"],"hint":"관사+과거 동사"},{"sentence":"The sailors _____ their _____ into the water together.","ko":"선원들은 함께 노를 물속에 담갔다.","answer":["dipped","oars"],"hint":"과거 동사+복수명사"}]},
    {"id":"w04403","w":"obedient","pos":["adj"],"ph":"/əˈbiːdiənt/","cefr":"B1","kr":["순종적인","복종하는"],"ex":[{"en":"The dog was very obedient.","ko":"그 개는 매우 순종적이었다."}],"mnemonic":{"soundHint":"오비디언트 → obey(복종) + ent","story":"obey(복종하다) + ient(형용사) = 복종하는 = 순종적인!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"obey","ko":"복종하다","reason":"동일 어근 동사형"},{"w":"rebellious","ko":"반항적인","reason":"반의어"},{"w":"loyal","ko":"충성스러운","reason":"복종·충성 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"말을 잘 듣는 성격.","whenToUse":"아이·강아지가 시키는 대로 할 때."},"krDetail":[{"ko":"순종적인","explain":"어른이나 규칙 말을 잘 듣고 따르는 성격의"},{"ko":"복종하는","explain":"명령이나 시키는 일을 그대로 따르는"}],"usageExamples":[{"en":"The obedient dog followed every command from its owner.","ko":"그 순종적인 개는 주인의 모든 명령을 따랐다."},{"en":"Their obedient son never argued with his parents.","ko":"그들의 순종적인 아들은 부모님과 결코 다투지 않았다."}],"grammarNote":"obedient는 형용사이므로 명사 앞이나 be동사 뒤에서 상태를 나타낸다. 동사 obey, 명사 obedience와 형태를 구분해서 기억하는 것이 중요하다.","grammarQuiz":[{"sentence":"The children _____ very _____ during the class.","ko":"그 아이들은 수업 시간 동안 매우 순종적이었다.","answer":["were","obedient"],"hint":"be동사+형용사"},{"sentence":"An _____ student _____ carefully to the teacher.","ko":"순종적인 학생은 선생님의 말을 주의 깊게 듣는다.","answer":["obedient","listens"],"hint":"형용사+3단현 동사"}]},
    {"id":"w04406","w":"obey","pos":["v"],"ph":"/əˈbeɪ/","cefr":"B1","kr":["따르다","복종하다"],"ex":[{"en":"You must obey the rules.","ko":"규칙을 따라야 한다."}],"mnemonic":{"soundHint":"오베이 → '오! 베이(bay, 만세)' 복종","story":"'오! 베이!' 왕의 명령에 복종하는 신하의 외침! obey the law.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"obedient","ko":"순종적인","reason":"동일 어근 형용사"},{"w":"disobey","ko":"불복종하다","reason":"반의어"},{"w":"command","ko":"명령","reason":"obey the command 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"규칙·명령을 따르다.","whenToUse":"법·부모·선생님 지시를 따를 때."},"krDetail":[{"ko":"따르다","explain":"규칙이나 지시를 그대로 지키며 행동하다"},{"ko":"복종하다","explain":"윗사람의 말이나 명령대로 하다"}],"usageExamples":[{"en":"Soldiers must obey the orders of their commanders.","ko":"군인들은 지휘관의 명령을 따라야 한다."},{"en":"Some students refuse to obey unfair school rules.","ko":"일부 학생들은 부당한 학교 규칙을 따르기를 거부한다."}],"grammarNote":"obey는 타동사여서 목적어 앞에 전치사 to를 쓰지 않는다. obey to the rules(X) → obey the rules(O)로 써야 한다.","grammarQuiz":[{"sentence":"All drivers must _____ the traffic _____ on the road.","ko":"모든 운전자는 도로에서 교통 규칙을 따라야 한다.","answer":["obey","rules"],"hint":"타동사+복수명사"},{"sentence":"The soldiers _____ every _____ without any question.","ko":"군인들은 아무 질문 없이 모든 명령을 따랐다.","answer":["obeyed","order"],"hint":"과거 타동사+단수명사"}]},
    {"id":"w04410","w":"object to","pos":["v phrase"],"ph":"/ˈɒbdʒɪkt tuː/","cefr":"B1","kr":["~에 반대하다"],"ex":[{"en":"She objected to the decision.","ko":"그녀는 그 결정에 반대했다."}],"mnemonic":{"soundHint":"오브젝트 투 → object(반대) + to","story":"object(반대) + to(~에게) = ~에 반대하다! object to a plan.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"oppose","ko":"반대하다","reason":"동의어 구동사"},{"w":"protest","ko":"항의하다","reason":"동의어·반대 표현"},{"w":"agree to","ko":"동의하다","reason":"반의어 구동사"}],"collocBest":[]},"nuance":{"koSimple":"~에 반대 의사를 밝히다.","whenToUse":"제안·결정에 반대할 때 격식체."},"krDetail":[{"ko":"~에 반대하다","explain":"어떤 계획이나 생각에 대해 옳지 않다고 맞서다"}],"usageExamples":[{"en":"Many workers object to the new company rules.","ko":"많은 근로자들이 새로운 회사 규정에 반대한다."},{"en":"Fewer people object to online learning than before.","ko":"예전보다 적은 사람들이 온라인 학습에 반대한다."}],"grammarNote":"object to에서 to는 부정사가 아닌 전치사라서 뒤에 동사가 오면 반드시 -ing 형태(동명사)를 써야 한다. object to work(X) → object to working(O).","grammarQuiz":[{"sentence":"The residents _____ to _____ a factory near their homes.","ko":"주민들은 집 근처에 공장을 짓는 것에 반대한다.","answer":["object","building"],"hint":"동사+동명사"},{"sentence":"She strongly _____ to _____ so early in the morning.","ko":"그녀는 아침 일찍 일하는 것에 강력히 반대한다.","answer":["objects","working"],"hint":"3단현+동명사"}]},
    {"id":"w04428","w":"observe","pos":["v"],"ph":"/əbˈzɜːv/","cefr":"B1","kr":["관찰하다","지키다"],"ex":[{"en":"We observed the birds closely.","ko":"우리는 새들을 자세히 관찰했다."}],"mnemonic":{"soundHint":"옵저브 → ob(향해) + serve(지키다)","story":"ob(향해) + serve(지키다) = 향해 지켜보다 = 관찰하다, 지키다!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"notice","ko":"알아채다","reason":"동의어(관찰·인지)"},{"w":"observation","ko":"관찰","reason":"동일 어근 명사형"},{"w":"ignore","ko":"무시하다","reason":"반의어"}],"collocBest":[]},"nuance":{"koSimple":"주의 깊게 보다·지키다.","whenToUse":"관찰하거나 규칙을 지킬 때."},"krDetail":[{"ko":"관찰하다","explain":"무엇이 어떻게 되는지 자세히 살펴보다"},{"ko":"지키다","explain":"규칙이나 예절을 그대로 따라 행하다"}],"usageExamples":[{"en":"Scientists observe animals to understand their behavior.","ko":"과학자들은 동물의 행동을 이해하기 위해 그들을 관찰한다."},{"en":"All members must observe the club's strict rules.","ko":"모든 회원은 클럽의 엄격한 규칙을 지켜야 한다."}],"grammarNote":"observe 뒤에 목적어와 원형부정사/현재분사가 오면 '~하는 것을 보다'로, that절이 오면 '~라는 것을 알아차리다'로 뜻이 달라진다.","grammarQuiz":[{"sentence":"We _____ the birds _____ high in the sky.","ko":"우리는 새들이 하늘 높이 나는 것을 관찰했다.","answer":["observed","flying"],"hint":"지각동사+현재분사"},{"sentence":"The researcher _____ that the children _____ quickly.","ko":"그 연구자는 아이들이 빠르게 배운다는 것을 관찰했다.","answer":["observed","learned"],"hint":"지각동사+that절 동사"}]},
    {"id":"w04431","w":"observe nature","pos":["v phrase"],"ph":"/əbˈzɜːv ˈneɪtʃə/","cefr":"B1","kr":["자연을 관찰하다"],"ex":[{"en":"Children should observe nature.","ko":"아이들은 자연을 관찰해야 한다."}],"mnemonic":{"soundHint":"옵저브 네이처 → observe + nature","story":"observe(관찰) + nature(자연) = 자연을 관찰하다! 생태 학습.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"observe wildlife","ko":"야생동물을 관찰하다","reason":"유사 구동사 표현"},{"w":"ecosystem","ko":"생태계","reason":"자연 관찰 시나리오"},{"w":"field trip","ko":"현장 학습","reason":"자연 관찰 활동 상황"}],"collocBest":[]},"nuance":{"koSimple":"자연을 지켜보고 배우다.","whenToUse":"야외 체험학습·생태 활동 때."},"krDetail":[{"ko":"자연을 관찰하다","explain":"산·강·풀·꽃 같은 것들이 어떻게 살아가는지 눈여겨보다"}],"usageExamples":[{"en":"Students often observe nature during their science field trips.","ko":"학생들은 과학 현장 학습에서 자주 자연을 관찰한다."},{"en":"Poets observe nature to find inspiration for their writing.","ko":"시인들은 글의 영감을 찾기 위해 자연을 관찰한다."}],"grammarNote":"observe nature는 타동사+목적어 구조이므로 사이에 전치사가 필요 없다. observe at nature(X) → observe nature(O)로 써야 한다.","grammarQuiz":[{"sentence":"The children _____ _____ carefully in the forest.","ko":"아이들은 숲에서 자연을 주의 깊게 관찰했다.","answer":["observed","nature"],"hint":"과거 타동사+명사"},{"sentence":"He loves to _____ _____ from the top of the mountain.","ko":"그는 산꼭대기에서 자연을 관찰하는 것을 좋아한다.","answer":["observe","nature"],"hint":"동사원형+명사"}]},
    {"id":"w04433","w":"observe wildlife","pos":["v phrase"],"ph":"/əbˈzɜːv ˈwaɪldlaɪf/","cefr":"B1","kr":["야생동물을 관찰하다"],"ex":[{"en":"We went to observe wildlife.","ko":"우리는 야생동물을 관찰하러 갔다."}],"mnemonic":{"soundHint":"옵저브 와일드라이프 → observe + wildlife","story":"observe(관찰) + wildlife(야생동물) = 야생동물을 관찰하다! 쌍안경 필수.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"observe nature","ko":"자연을 관찰하다","reason":"유사 구동사 표현"},{"w":"habitat","ko":"서식지","reason":"야생동물 관찰 시나리오"},{"w":"binoculars","ko":"쌍안경","reason":"관찰 도구 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"야생동물을 조용히 지켜보다.","whenToUse":"자연 다큐·탐사 상황에서."},"krDetail":[{"ko":"야생동물을 관찰하다","explain":"산이나 들에서 저절로 살아가는 동물을 눈여겨보다"}],"usageExamples":[{"en":"Rangers observe wildlife to protect endangered animals.","ko":"관리원들은 멸종 위기 동물을 보호하기 위해 야생동물을 관찰한다."},{"en":"Tourists observe wildlife more safely than they hunt them.","ko":"관광객들은 야생동물을 사냥하기보다 더 안전하게 관찰한다."}],"grammarNote":"wildlife는 셀 수 없는 집합명사라서 wildlifes로 쓰지 않는다. 개별 동물을 셀 때는 wild animals라고 표현해야 한다.","grammarQuiz":[{"sentence":"The team _____ _____ using hidden cameras.","ko":"그 팀은 숨겨진 카메라를 사용해 야생동물을 관찰한다.","answer":["observes","wildlife"],"hint":"3단현+불가산명사"},{"sentence":"Tourists _____ _____ silently to _____ scaring the animals.","ko":"관광객들은 동물을 놀라게 하지 않기 위해 조용히 야생동물을 관찰한다.","answer":["observe","wildlife","avoid"],"hint":"동사+명사+동사원형"}]},
    {"id":"w04557","w":"ordinary","pos":["adj"],"ph":"/ˈɔːdɪnəri/","cefr":"B1","kr":["평범한","보통의"],"ex":[{"en":"It was an ordinary day.","ko":"평범한 날이었다."}],"mnemonic":{"soundHint":"오디너리","story":"'order(질서)' 안에 있는 것 = 정상적인, 평범한","hintConfidence":2},"pairs":{"buddyWords":[{"w":"normal","ko":"보통의","reason":"동의어 - 평범한 것과 동일 개념"},{"w":"extraordinary","ko":"특별한","reason":"반의어 - extra + ordinary"},{"w":"everyday","ko":"일상의","reason":"시나리오 - 평범한 일상 묘사"}],"collocBest":[]},"nuance":{"koSimple":"특별할 것 없이 흔한.","whenToUse":"평범한 일상·보통 사람들 말할 때."},"krDetail":[{"ko":"평범한","explain":"특별하지 않고 흔한"},{"ko":"보통의","explain":"여느 때와 다르지 않은 일반적인"}],"usageExamples":[{"en":"He led an ordinary life in a small village.","ko":"그는 작은 마을에서 평범한 삶을 살았다."},{"en":"This was no ordinary day for the young hero.","ko":"그날은 그 어린 영웅에게 평범한 날이 아니었다."}],"grammarNote":"ordinary와 usual은 미묘하게 다르다. ordinary는 '특별할 것 없는'이라는 뜻이고 usual은 '평소의 습관·빈도'를 강조한다.","grammarQuiz":[{"sentence":"Most _____ people cannot afford such an expensive luxury car these days.","ko":"대부분의 보통 사람들은 요즘 그런 비싼 고급차를 살 여유가 없다.","answer":["ordinary"],"hint":"형용사, 특별하지 않은 일반 사람들"}]},
    {"id":"w04565","w":"organize","pos":["v"],"ph":"/ˈɔːɡənaɪz/","cefr":"B1","kr":["조직하다","정리하다"],"ex":[{"en":"She organized the event well.","ko":"그녀는 행사를 잘 준비했다."}],"mnemonic":{"soundHint":"오거나이즈","story":"'organ(기관)' + ize → 기관처럼 체계화하다 = 조직하다, 정리하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"arrange","ko":"준비하다","reason":"동의어 - 계획해서 마련하다"},{"w":"disorganize","ko":"혼란시키다","reason":"반의어 - dis- 접두사"},{"w":"meeting","ko":"회의","reason":"organize a meeting 필수 조합"}],"collocBest":[]},"nuance":{"koSimple":"체계 있게 정리·준비하다.","whenToUse":"행사 준비·물건 정리 말할 때."},"krDetail":[{"ko":"조직하다","explain":"여러 사람이나 것을 목적에 맞게 짜서 모으다"},{"ko":"정리하다","explain":"흩어진 것을 가지런히 하다"}],"usageExamples":[{"en":"She organized the meeting very efficiently yesterday.","ko":"그녀는 어제 회의를 매우 효율적으로 준비했다."},{"en":"The students were told to organize their notes.","ko":"학생들은 필기를 정리하라는 말을 들었다."}],"grammarNote":"organize는 타동사로 뒤에 목적어가 반드시 온다. 'organize about'처럼 전치사를 붙이면 틀린다.","grammarQuiz":[{"sentence":"The teacher asked us to _____ our books neatly on the shelf before class.","ko":"선생님은 우리에게 수업 전에 책들을 선반에 깔끔히 정리하라고 했다.","answer":["organize"],"hint":"타동사, 정리하다"}]},
    {"id":"w04713","w":"paragraph","pos":["n"],"ph":"/ˈpærəɡræf/","cefr":"B1","kr":["단락","문단"],"ex":[{"en":"Write a short paragraph about your hobby.","ko":"취미에 대해 짧은 단락을 써보세요."}],"mnemonic":{"soundHint":"패러그래프","story":"'para(옆에) + graph(글)' → 옆에 나란히 쓴 한 덩어리 = 단락","hintConfidence":2},"pairs":{"buddyWords":[{"w":"passage","ko":"구절","reason":"동의어 - 글의 한 부분"},{"w":"opening","ko":"시작의","reason":"opening paragraph 콜로"},{"w":"essay","ko":"에세이","reason":"시나리오 - 에세이는 문단으로 구성"}],"collocBest":[]},"nuance":{"koSimple":"글에서 한 덩어리 되는 문단.","whenToUse":"작문·독해 문단 얘기할 때."},"krDetail":[{"ko":"단락","explain":"글에서 하나의 생각을 담은 짧은 부분"},{"ko":"문단","explain":"한 가지 주제로 묶인 여러 문장의 덩어리"}],"usageExamples":[{"en":"The opening paragraph introduced the main topic clearly.","ko":"첫 단락은 주요 주제를 명확하게 소개했다."},{"en":"She wrote a long paragraph about her summer trip.","ko":"그녀는 여름 여행에 대해 긴 문단을 썼다."}],"grammarNote":"paragraph는 셀 수 있는 명사다. 순서를 나타낼 때 'the first paragraph, the second paragraph'처럼 the를 붙인다.","grammarQuiz":[{"sentence":"The first _____ of an essay should clearly introduce the main topic and thesis statement.","ko":"에세이의 첫 단락은 주요 주제와 논지 문장을 명확히 소개해야 한다.","answer":["paragraph"],"hint":"명사, 단락·문단"}]},
    {"id":"w04585","w":"ought","pos":["modal v"],"ph":"/ɔːt/","cefr":"B1","kr":["~해야 한다","~일 것이다"],"ex":[{"en":"You ought to see a doctor.","ko":"당신은 의사를 만나야 한다."}],"mnemonic":{"soundHint":"오트","story":"'오트! (해야 해)' 소리로 의무를 표현 → ought to = 해야 한다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"should","ko":"~해야 한다","reason":"동의어 - 의무 조동사"},{"w":"must","ko":"반드시 ~해야 한다","reason":"동의어 - 강한 의무"},{"w":"to","ko":"부정사 to","reason":"ought to 필수 조합"}],"collocBest":[]},"nuance":{"koSimple":"당연히 해야 할 것을 말할 때.","whenToUse":"충고·도덕적 권고 표현할 때."},"krDetail":[{"ko":"~해야 한다","explain":"마땅히 그리 하는 게 옳다"},{"ko":"~일 것이다","explain":"아마도 그러할 것으로 짐작된다"}],"usageExamples":[{"en":"You ought to apologize for your rude behavior.","ko":"너는 무례한 행동에 대해 사과해야 한다."},{"en":"She ought to arrive by six o'clock tonight.","ko":"그녀는 오늘 밤 6시까지 도착할 것이다."}],"grammarNote":"ought는 뒤에 반드시 'to + 동사원형'이 온다. should와 뜻이 비슷하지만 ought는 to를 빠뜨리면 안 된다.","grammarQuiz":[{"sentence":"Students _____ _____ respect their teachers and follow the classroom rules carefully every day.","ko":"학생들은 매일 선생님을 존경하고 교실 규칙을 신중히 따라야 한다.","answer":["ought","to"],"hint":"조동사+to, ~해야 한다"}]},
    {"id":"w04669","w":"oxygen","pos":["n"],"ph":"/ˈɒksɪdʒən/","cefr":"B1","kr":["산소"],"ex":[{"en":"Plants produce oxygen.","ko":"식물은 산소를 생산한다."}],"mnemonic":{"soundHint":"옥시전","story":"표백제 '옥시크린'의 '옥시(Oxi)' = 산소","hintConfidence":2},"pairs":{"buddyWords":[{"w":"breathe","ko":"숨쉬다","reason":"시나리오 - 산소를 마심"},{"w":"level","ko":"수치","reason":"oxygen level 콜로"},{"w":"supply","ko":"공급하다","reason":"supply oxygen 콜로"}],"collocBest":[]},"nuance":{"koSimple":"우리가 숨 쉬는 그 산소.","whenToUse":"호흡·공기·환자 산소 공급 말할 때."},"krDetail":[{"ko":"산소","explain":"숨쉴 때 몸에 들어가는 색과 냄새가 없는 기체"}],"usageExamples":[{"en":"Humans need oxygen to breathe and stay alive.","ko":"인간은 숨쉬고 살아가기 위해 산소가 필요하다."},{"en":"The doctor supplied oxygen to the sick patient.","ko":"의사는 아픈 환자에게 산소를 공급했다."}],"grammarNote":"oxygen은 셀 수 없는 물질명사이므로 관사 a/an을 붙이지 않고 복수형도 없다. 항상 단수 취급한다.","grammarQuiz":[{"sentence":"Plants produce _____ during photosynthesis and release it into the surrounding air constantly.","ko":"식물은 광합성 동안 산소를 만들어 주변 공기 속으로 계속 내보낸다.","answer":["oxygen"],"hint":"명사, 산소"}]},
    {"id":"w04670","w":"oyster","pos":["n"],"ph":"/ˈɔɪstər/","cefr":"B1","kr":["굴","조개"],"ex":[{"en":"Oysters are a delicacy in many countries.","ko":"굴은 많은 나라에서 진미이다."}],"mnemonic":{"soundHint":"오이스터","story":"'오이스터 바(Oyster Bar)' 해산물 레스토랑 = 굴","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fresh","ko":"신선한","reason":"fresh oyster 콜로"},{"w":"shell","ko":"껍데기","reason":"시나리오 - 굴 껍데기"},{"w":"seafood","ko":"해산물","reason":"시나리오 - 굴은 해산물"}],"collocBest":[]},"nuance":{"koSimple":"바다에서 잡히는 굴.","whenToUse":"해산물·굴 요리 얘기할 때."},"krDetail":[{"ko":"굴","explain":"바다에서 자라는 껍데기가 딱딱한 조개류"},{"ko":"조개","explain":"두 껍데기 사이에 살이 든 바다 생물"}],"usageExamples":[{"en":"Fresh oysters are a famous seafood in this coastal town.","ko":"신선한 굴은 이 해안 마을의 유명한 해산물이다."},{"en":"He carefully opened the oyster with a special knife.","ko":"그는 특별한 칼로 굴을 조심스럽게 열었다."}],"grammarNote":"oyster는 셀 수 있는 명사로 복수형은 oysters다. 식당 메뉴에서는 관사 없이 그냥 'oysters'로 자주 표기된다.","grammarQuiz":[{"sentence":"The famous chef prepared fresh _____ for the customers at the expensive seafood restaurant.","ko":"그 유명한 요리사는 비싼 해산물 식당에서 손님들을 위해 신선한 굴을 준비했다.","answer":["oysters"],"hint":"명사 복수, 굴"}]},
    {"id":"w04721","w":"parcel","pos":["n","v"],"ph":"/ˈpɑːrsəl/","cefr":"B1","kr":["소포","꾸러미"],"ex":[{"en":"He sent a parcel to his friend.","ko":"그는 친구에게 소포를 보냈다."}],"mnemonic":{"soundHint":"파슬","story":"'파슬리 다발'처럼 잘 묶인 꾸러미 = 소포","hintConfidence":1},"pairs":{"buddyWords":[{"w":"package","ko":"소포","reason":"동의어 - 소포/꾸러미"},{"w":"post","ko":"우편","reason":"parcel post 콜로"},{"w":"wrap","ko":"포장하다","reason":"wrap a parcel 콜로"}],"collocBest":[]},"nuance":{"koSimple":"종이·끈으로 싼 꾸러미.","whenToUse":"우체국 소포·꾸러미 말할 때."},"krDetail":[{"ko":"소포","explain":"종이나 상자로 싸서 부치는 짐"},{"ko":"꾸러미","explain":"여러 물건을 함께 싸서 묶은 덩어리"}],"usageExamples":[{"en":"She sent a parcel to her grandmother by mail.","ko":"그녀는 할머니께 우편으로 소포를 보냈다."},{"en":"The postman delivered a large parcel this morning.","ko":"우체부가 오늘 아침에 큰 소포를 배달했다."}],"grammarNote":"parcel은 영국식 영어에서 더 자주 쓰이며 미국식에서는 package를 더 흔히 쓴다. 뜻은 거의 같다.","grammarQuiz":[{"sentence":"She carefully wrapped the birthday _____ with beautiful paper and sent it to her cousin.","ko":"그녀는 생일 소포를 아름다운 종이로 조심스럽게 포장해서 사촌에게 보냈다.","answer":["parcel"],"hint":"명사, 소포·꾸러미"}]},
    {"id":"w04551","w":"orchestra","pos":["n"],"ph":"/ˈɔːkɪstrə/","cefr":"B1","kr":["오케스트라","관현악단"],"ex":[{"en":"The orchestra played beautifully.","ko":"오케스트라가 아름답게 연주했다."}],"mnemonic":{"soundHint":"오케스트라","story":"'오케스트라'는 우리말에 그대로 자리 잡은 외래어입니다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ensemble","ko":"합주단","reason":"동의어 - 함께 연주하는 단체"},{"w":"conductor","ko":"지휘자","reason":"시나리오 - 오케스트라를 이끄는 사람"},{"w":"symphony","ko":"교향곡","reason":"콜로케이션 - symphony orchestra 필수 조합"}],"collocBest":[{"en":"symphony orchestra","ko":"교향악단"},{"en":"join the orchestra","ko":"오케스트라에 합류하다"}]},"nuance":{"koSimple":"여러 악기가 함께 연주하는 관현악단.","whenToUse":"클래식 공연·교향악단을 말할 때."},"krDetail":[{"ko":"오케스트라","explain":"여러 악기 연주자들이 함께 모여 음악을 연주하는 큰 무리"},{"ko":"관현악단","explain":"관악기와 현악기 연주자들이 어우러진 음악 단체"}],"usageExamples":[{"en":"The conductor led the orchestra beautifully last night.","ko":"지휘자는 어젯밤 오케스트라를 아름답게 이끌었다."},{"en":"She dreams of joining a famous orchestra someday.","ko":"그녀는 언젠가 유명한 오케스트라에 들어가는 것을 꿈꾼다."}],"grammarNote":"orchestra는 단수로 취급되지만 영국식에서는 복수 취급도 가능하다. 'the orchestra is/are playing' 둘 다 문맥에 따라 쓰인다.","grammarQuiz":[{"sentence":"The symphony _____ _____ playing a Beethoven piece at the concert hall.","ko":"교향악단이 콘서트홀에서 베토벤 곡을 연주하고 있다.","answer":["orchestra","is"],"hint":"명사+단수동사, 교향악단이 연주 중"}]},
    {"id":"w04563","w":"organization","pos":["n"],"ph":"/ˌɔːɡənaɪˈzeɪʃən/","cefr":"B1","kr":["조직","단체"],"ex":[{"en":"She joined a nonprofit organization.","ko":"그녀는 비영리 단체에 가입했다."}],"mnemonic":{"soundHint":"오거나이제이션","story":"'오거나이즈(organize 조직하다)' + tion = 조직체, 단체","hintConfidence":3},"pairs":{"buddyWords":[{"w":"institution","ko":"기관","reason":"동의어 - 조직/기관 동일 개념"},{"w":"nonprofit","ko":"비영리의","reason":"nonprofit organization 콜로"},{"w":"member","ko":"회원","reason":"시나리오 - 조직 구성원"}],"collocBest":[]},"nuance":{"koSimple":"사람들이 모여 만든 단체.","whenToUse":"회사·비영리 단체를 지칭할 때."},"krDetail":[{"ko":"조직","explain":"같은 목적을 이루려고 모인 사람들의 모임"},{"ko":"단체","explain":"함께 일하도록 짜여진 사람들의 무리"}],"usageExamples":[{"en":"The organization helps poor children around the world.","ko":"그 단체는 전 세계 가난한 아이들을 돕는다."},{"en":"He works for a large international organization.","ko":"그는 큰 국제 조직에서 일한다."}],"grammarNote":"organization은 미국식, organisation은 영국식 철자다. 시험에서 둘 다 정답으로 인정되지만 한 지문 안에서는 통일해야 한다.","grammarQuiz":[{"sentence":"The nonprofit _____ raised millions of dollars to help disaster victims last year.","ko":"그 비영리 단체는 작년에 재난 피해자들을 돕기 위해 수백만 달러를 모금했다.","answer":["organization"],"hint":"명사, 비영리 단체"}]},
    {"id":"w04567","w":"organize thoughts","pos":["v phrase"],"ph":"/ˈɔːɡənaɪz θɔːts/","cefr":"B1","kr":["생각을 정리하다"],"ex":[{"en":"Take time to organize your thoughts.","ko":"생각을 정리할 시간을 가져라."}],"mnemonic":{"soundHint":"오거나이즈 쏘츠","story":"'thoughts(생각)'를 '오거나이즈(정리)' = 생각을 정리하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"collect","ko":"모으다","reason":"동의어 - collect thoughts와 유사"},{"w":"clearly","ko":"명확히","reason":"organize thoughts clearly 콜로"},{"w":"speaking","ko":"말하기","reason":"시나리오 - 발표 전 생각 정리"}],"collocBest":[]},"nuance":{"koSimple":"머릿속 생각을 차분히 정리하다.","whenToUse":"말·글 시작 전 생각 정리할 때."},"krDetail":[{"ko":"생각을 정리하다","explain":"머릿속에 흩어진 생각을 차근차근 가지런히 하다"}],"usageExamples":[{"en":"She organized her thoughts before writing the essay.","ko":"그녀는 에세이를 쓰기 전에 생각을 정리했다."},{"en":"Take a moment to organize your thoughts silently.","ko":"잠시 시간을 갖고 조용히 생각을 정리해라."}],"grammarNote":"organize thoughts는 관용 표현으로 thoughts 앞에 소유격(my, your, his 등)을 자주 쓴다. 관사 the는 어색하다.","grammarQuiz":[{"sentence":"You should _____ your _____ carefully before speaking in front of the audience.","ko":"청중 앞에서 말하기 전에 생각을 조심스럽게 정리해야 한다.","answer":["organize","thoughts"],"hint":"동사+명사, 발표 전 생각 정리"}]},
    {"id":"w04573","w":"original","pos":["adj","n"],"ph":"/əˈrɪdʒɪnəl/","cefr":"B1","kr":["원래의","독창적인"],"ex":[{"en":"This is the original painting.","ko":"이것이 원본 그림이다."}],"mnemonic":{"soundHint":"오리지널","story":"'오리지널 사운드트랙(OST)', '오리지널 스토리' = 원본의, 독창적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"authentic","ko":"진짜의","reason":"동의어 - 원본/독창적"},{"w":"copy","ko":"복사본","reason":"반의어 - original vs copy"},{"w":"creative","ko":"창의적인","reason":"시나리오 - 독창적 아이디어"}],"collocBest":[]},"nuance":{"koSimple":"복사본이 아닌 처음 그것.","whenToUse":"원본·독창적 아이디어 말할 때."},"krDetail":[{"ko":"원래의","explain":"처음부터 있던 그대로의"},{"ko":"독창적인","explain":"남과 다르게 새롭게 지어낸"}],"usageExamples":[{"en":"She had an original idea for the school project.","ko":"그녀는 학교 과제에 관한 독창적인 아이디어를 가지고 있었다."},{"en":"The original painting is worth millions of dollars.","ko":"원본 그림은 수백만 달러의 가치가 있다."}],"grammarNote":"original은 형용사와 명사 모두 가능하다. 명사로 쓸 때 'the original'은 '원본'을 의미하며 copy와 대비된다.","grammarQuiz":[{"sentence":"The museum displayed the _____ painting, not a copy, for the special exhibition.","ko":"박물관은 특별 전시회에서 사본이 아닌 원본 그림을 전시했다.","answer":["original"],"hint":"형용사, 사본이 아닌 원본"}]},

function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });

function demoteBox(id){

}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠

  // jp-slot-jackpot: 도-솔-도-미 차임 4단

  // ── 심화 90%+ 전용 : 명랑·화려·인상 깊은 팡파레 조합 ──
  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단

  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){

  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.fireworks(); }, 1900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.bigWin(); }, 2500);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.coinDrop(); }, 3300);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4000);                // 마지막 대미 팡파레
    } else if(isPerfect){
      fx.spawn("rainbow-burst");
      SFX.bigWin();
      setTimeout(()=>fx.spawn("jackpot-full"), 600);
      setTimeout(()=>SFX.coinDrop(), 700);
    } else if(newCleared){
      fx.spawn("jackpot-full");
      SFX.levelUp();
      setTimeout(()=>SFX.coinDrop(), 500);
    } else if(pct >= 80){
      fx.spawn("reel-spin-small");
      SFX.spinReel();
    }
  }, 250);

  document.getElementById("retryBtn").addEventListener("click", ()=>{
    if(isAdv){ startAdvanced(); }
    else{ renderHome(); }
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    alert("Lv.2 미생성 — 시범 버전입니다.");
  });
  const goAdvBtn = document.getElementById("goAdvBtn");
  if(goAdvBtn) goAdvBtn.addEventListener("click", ()=>{
    state.quizType = "advanced";
    startAdvanced();
  });
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=> renderHome());
  const retryWrongBtn = document.getElementById("retryWrongBtn");
  if(retryWrongBtn){
    retryWrongBtn.addEventListener("click", ()=>{
      if(isAdv) startAdvancedRetryWrong();
      else startBasicRetryWrong();
    });
  }
}

];

function showHighGradeCelebration(msg){
  const old = document.querySelector('.hg-celebration');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'hg-celebration';
  const sparkles = ['✨','🎉','🎊','⭐','💫','🌟','🎆','🎇','💥']
    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;
  document.body.appendChild(overlay);

      const voices = speechSynthesis.getVoices();
      const ko = voices.find(v => /^ko/i.test(v.lang));
      if(ko) u.voice = ko;
      setTimeout(()=>speechSynthesis.speak(u), 400);
    }

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});
