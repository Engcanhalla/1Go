<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review C</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

  /* ---------- RAINBOW BURST ---------- */
  .rainbow-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:45;

    {"id":"w02470","w":"flame","pos":["n","v"],"ph":"/fleɪm/","cefr":"B1","kr":["불꽃","화염"],"ex":[{"en":"The candle flame flickered in the wind.","ko":"양초 불꽃이 바람에 깜박였다."}],"mnemonic":{"soundHint":"플레임","story":"'플~ 레임!' 화르륵 타오르는 불꽃 = flame.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fire","ko":"불","reason":"동의어 — 불꽃 개념"},{"w":"blaze","ko":"화염","reason":"동의어 — 강렬한 불"},{"w":"candle","ko":"양초","reason":"콜로 — 양초 불꽃"}],"collocBest":[]},"nuance":{"koSimple":"실제로 타오르는 뾰족한 불꽃.","whenToUse":"촛불·화재·격렬한 감정 표현에."},"krDetail":[{"ko":"불꽃","explain":"타오르는 불의 뾰족한 모양"},{"ko":"화염","explain":"크고 세게 타오르는 불"}],"usageExamples":[{"en":"The candle's small flame flickered gently in the cool evening breeze.","ko":"그 촛불의 작은 불꽃이 시원한 저녁 바람에 부드럽게 흔들렸다."},{"en":"The old building burst into flames within minutes after the fire started.","ko":"그 오래된 건물은 불이 시작된 후 몇 분 만에 불길에 휩싸였다."}],"grammarNote":"burst into flames는 '불길에 휩싸이다'라는 관용 표현으로 flames가 반드시 복수형이다. 학생들이 자주 flame(단수)으로 잘못 쓴다.","grammarQuiz":[{"sentence":"The abandoned warehouse suddenly _____ into flames, and firefighters arrived _____ the scene within ten minutes.","ko":"그 버려진 창고가 갑자기 불길에 휩싸였고, 소방관들이 10분 안에 현장에 도착했다.","answer":["burst","at"],"hint":"관용 표현 동사 + 장소 전치사"}]},
    {"id":"w02480","w":"flavor","pos":["n","v"],"ph":"/ˈfleɪvər/","cefr":"B1","kr":["맛","풍미"],"ex":[{"en":"This soup has a wonderful flavor.","ko":"이 수프는 훌륭한 맛이 난다."}],"mnemonic":{"soundHint":"플레이버","story":"'플레이(play) + 버(bar)' 혀 위에서 맛이 춤추다 = flavor.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"taste","ko":"맛","reason":"동의어 — 미각 자극"},{"w":"seasoning","ko":"양념","reason":"동의어 — 맛을 냄"},{"w":"blandness","ko":"밋밋함","reason":"반의어 — 맛없음"}],"collocBest":[]},"nuance":{"koSimple":"혀로 느끼는 특유의 맛.","whenToUse":"음식·음료의 풍미를 표현할 때."},"krDetail":[{"ko":"맛","explain":"혀로 느끼는 음식의 느낌"},{"ko":"풍미","explain":"은은하게 나는 좋은 맛과 향"}],"usageExamples":[{"en":"The chef added fresh herbs to enhance the natural flavor of the soup.","ko":"그 요리사는 수프의 자연스러운 맛을 살리기 위해 신선한 허브를 추가했다."},{"en":"This traditional dish is flavored with a special blend of Asian spices.","ko":"이 전통 요리는 아시아 향신료의 특별한 배합으로 맛이 첨가된다."}],"grammarNote":"flavor는 명사(맛)와 타동사(맛을 내다) 둘 다로 쓰인다. 수동태 be flavored with + 재료 형태가 자주 출제된다.","grammarQuiz":[{"sentence":"The famous restaurant's signature sauce _____ _____ with rare spices imported from Southeast Asia.","ko":"그 유명 레스토랑의 시그니처 소스는 동남아시아에서 수입된 희귀 향신료로 맛이 첨가된다.","answer":["is","flavored"],"hint":"수동태 be + p.p."}]},
    {"id":"w02488","w":"fleet","pos":["n"],"ph":"/fliːt/","cefr":"B1","kr":["함대","선단"],"ex":[{"en":"The fleet set sail at dawn.","ko":"함대는 새벽에 출항했다."}],"mnemonic":{"soundHint":"플리트","story":"'플! 리! 트!' 빠르게 물살 가르는 배들의 무리 = fleet.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"naval","ko":"해군의","reason":"콜로 — 해군 함대"},{"w":"armada","ko":"함대","reason":"동의어 — 대규모 함선"},{"w":"convoy","ko":"호송대","reason":"동의어 — 선박 무리"}],"collocBest":[]},"nuance":{"koSimple":"여러 척으로 이루어진 배·차 무리.","whenToUse":"해군 함대·회사 소유 차량단에."},"krDetail":[{"ko":"함대","explain":"여러 척의 군함이 한 무리로 다니는 것"},{"ko":"선단","explain":"함께 다니는 여러 척의 배 무리"}],"usageExamples":[{"en":"The naval fleet sailed toward the enemy shores at dawn to launch the surprise attack.","ko":"그 해군 함대는 기습 공격을 개시하기 위해 새벽에 적의 해안으로 항해했다."},{"en":"The delivery company operates a large fleet of trucks across the entire country.","ko":"그 배송 회사는 전국에 걸쳐 대규모 트럭 선단을 운영한다."}],"grammarNote":"fleet은 집합명사로 단수·복수 취급 모두 가능하지만 보통 단수 취급한다. a fleet of + 복수명사 형태가 정형화되어 있다.","grammarQuiz":[{"sentence":"_____ fleet _____ fishing boats returned safely to the harbor before the terrible storm arrived.","ko":"그 어선 선단은 끔찍한 폭풍이 오기 전에 항구로 안전하게 돌아왔다.","answer":["The","of"],"hint":"정관사 + 관용 전치사"}]},
    {"id":"w02501","w":"flock","pos":["n","v"],"ph":"/flɒk/","cefr":"B1","kr":["떼","무리"],"ex":[{"en":"A flock of birds flew past.","ko":"새 떼가 날아 지나갔다."}],"mnemonic":{"soundHint":"플록 → '푸드덕' 새 떼 날갯짓","story":"양 떼(flock)가 푸드덕 하늘로 날아오르는 새 떼로 착시.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"herd","ko":"무리","reason":"동의어 — 동물 떼"},{"w":"group","ko":"무리","reason":"동의어 — 모인 집단"},{"w":"sheep","ko":"양","reason":"콜로 — 양 떼"}],"collocBest":[]},"nuance":{"koSimple":"같은 종끼리 몰려다니는 무리.","whenToUse":"새·양 등이 떼 지어 있을 때."},"krDetail":[{"ko":"떼","explain":"함께 모여 있는 짐승이나 새의 무리"},{"ko":"무리","explain":"많은 것이 한데 모여 있는 것"}],"usageExamples":[{"en":"A large flock of sheep grazed peacefully on the green hillside all afternoon.","ko":"많은 양 떼가 오후 내내 푸른 언덕에서 평화롭게 풀을 뜯었다."},{"en":"Curious tourists flocked to the small town to see the rare cultural festival.","ko":"호기심 많은 관광객들이 그 희귀한 문화 축제를 보기 위해 그 작은 마을로 모여들었다."}],"grammarNote":"flock은 명사(떼)와 자동사(모여들다) 둘 다로 쓰인다. flock to + 장소(~로 모여들다) 형태가 자주 출제된다.","grammarQuiz":[{"sentence":"Thousands of eager fans _____ _____ the concert venue as soon as the tickets went on sale.","ko":"티켓이 판매되자마자 수천 명의 열성 팬들이 콘서트 장소로 모여들었다.","answer":["flocked","to"],"hint":"자동사 과거형 + 방향 전치사"}]},
    {"id":"w02502","w":"flood","pos":["n","v"],"ph":"/flʌd/","cefr":"B1","kr":["홍수","범람하다"],"ex":[{"en":"The flood destroyed many homes.","ko":"홍수가 많은 집을 파괴했다."}],"mnemonic":{"soundHint":"플러드 → '푸르르~' 물이 콸콸","story":"물이 '플러드' 하고 밀려와 홍수가 되다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"deluge","ko":"대홍수","reason":"동의어 — 물의 범람"},{"w":"drought","ko":"가뭄","reason":"반의어 — 홍수의 반대"},{"w":"damage","ko":"피해","reason":"콜로 — 홍수 피해"}],"collocBest":[]},"nuance":{"koSimple":"물이 넘쳐 땅을 덮치는 것.","whenToUse":"장마·재해·홍수 피해 상황에."},"krDetail":[{"ko":"홍수","explain":"비가 많이 와서 물이 넘쳐흐르는 것"},{"ko":"넘쳐흐르다","explain":"가득 차서 밖으로 흘러 나오다"}],"usageExamples":[{"en":"The heavy rain caused a terrible flood that damaged many houses in the village.","ko":"그 폭우는 마을의 많은 집들을 손상시킨 끔찍한 홍수를 일으켰다."},{"en":"The market was flooded with cheap products from overseas manufacturers last year.","ko":"그 시장은 작년에 해외 제조업체들의 값싼 제품들로 넘쳐났다."}],"grammarNote":"flood는 명사(홍수)와 타동사(범람시키다) 둘 다로 쓰인다. 특히 be flooded with(~로 넘쳐나다)는 비유적 표현으로 자주 출제된다.","grammarQuiz":[{"sentence":"The customer service department _____ _____ with complaints after the faulty product was released.","ko":"고객 서비스 부서는 결함 있는 제품이 출시된 후 불만으로 넘쳐났다.","answer":["was","flooded"],"hint":"수동태 be + p.p."}]},
    {"id":"w02346","w":"fashionable","pos":["adj"],"ph":"/ˈfæʃənəbəl/","cefr":"B1","kr":["유행하는","세련된"],"ex":[{"en":"She always wears fashionable clothes.","ko":"그녀는 항상 유행하는 옷을 입는다."}],"mnemonic":{"soundHint":"패션(fashion)","story":"'패션(fashion)'에 -able이 붙어 '유행 탈 만한'","hintConfidence":3},"pairs":{"buddyWords":[{"w":"trendy","ko":"유행하는","reason":"동의어 — 최신 유행 공유"},{"w":"outdated","ko":"구식의","reason":"반의어 — 유행 지난 상태"},{"w":"stylish","ko":"세련된","reason":"동의어 — 세련미 공유"}],"collocBest":[{"en":"fashionable area","ko":"유행하는 지역"},{"en":"fashionable restaurant","ko":"세련된 레스토랑"}]},"nuance":{"koSimple":"지금 유행하고 세련된 느낌의.","whenToUse":"옷·장소·스타일이 트렌디할 때."},"krDetail":[{"ko":"유행하는","explain":"요즘 사람들이 많이 좋아하고 즐기는"},{"ko":"세련된","explain":"다듬어져서 멋스럽고 품위 있는"}],"usageExamples":[{"en":"That neighborhood has become the most fashionable district in the city.","ko":"그 동네는 도시에서 가장 세련된 지역이 되었다."},{"en":"It is no longer fashionable to wear such heavy makeup in public.","ko":"공공장소에서 그렇게 진한 화장을 하는 것은 더 이상 유행하지 않는다."}],"grammarNote":"형용사 fashionable은 서술적 용법(be fashionable to do)에서 to부정사 주어를 취할 수 있으며, 가주어 it 구문과 자주 쓰인다.","grammarQuiz":[{"sentence":"_____ is fashionable _____ wear sustainable and eco-friendly clothing brands nowadays.","ko":"요즘 지속 가능하고 친환경적인 의류 브랜드를 입는 것이 유행이다.","answer":["It","to"],"hint":"가주어-진주어 구문"}]},
    {"id":"w02351","w":"fate","pos":["n"],"ph":"/feɪt/","cefr":"B1","kr":["운명","숙명"],"ex":[{"en":"He accepted his fate without complaint.","ko":"그는 불평 없이 자신의 운명을 받아들였다."}],"mnemonic":{"soundHint":"페이트","story":"'페이(pay)+트!' 태어날 때 이미 지불된 값, 정해진 운명 = fate.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"destiny","ko":"운명","reason":"동의어 — 정해진 운명"},{"w":"choice","ko":"선택","reason":"반의어 — 운명 대 자유의지"},{"w":"fortune","ko":"행운/운","reason":"동의어 — 운수 개념 공유"}],"collocBest":[]},"nuance":{"koSimple":"피할 수 없는 정해진 운명.","whenToUse":"인생·결말이 이미 결정된 느낌일 때."},"krDetail":[{"ko":"운명","explain":"이미 정해져 있어 피할 수 없는 앞날"},{"ko":"숙명","explain":"타고나서 바꿀 수 없이 정해진 것"}],"usageExamples":[{"en":"A single decision can sometimes seal a person's fate forever.","ko":"단 하나의 결정이 때때로 한 사람의 운명을 영원히 결정지을 수 있다."},{"en":"Their fates were closely linked from the moment they first met.","ko":"그들의 운명은 처음 만난 순간부터 밀접하게 연결되어 있었다."}],"grammarNote":"fate는 보통 단수 명사로 쓰이지만, 여러 사람의 운명을 나타낼 때는 fates로 복수형이 가능하다. 학생들이 관사 사용을 자주 틀린다.","grammarQuiz":[{"sentence":"It seemed that _____ fates of the two families _____ tied together by ancient promises.","ko":"두 가문의 운명은 오래된 약속으로 함께 묶여 있는 것 같았다.","answer":["the","were"],"hint":"복수 주어와 정관사"}]},
    {"id":"w02360","w":"favorable","pos":["adj"],"ph":"/ˈfeɪvərəbəl/","cefr":"B1","kr":["유리한","호의적인"],"ex":[{"en":"The conditions were favorable.","ko":"조건이 유리했다."}],"mnemonic":{"soundHint":"페이버러블","story":"favor(호의) + -able = 호의적인, 유리한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"advantageous","ko":"유리한","reason":"동의어 — 이익이 되는"},{"w":"unfavorable","ko":"불리한","reason":"반의어 — 접두사 un-"},{"w":"positive","ko":"긍정적인","reason":"동의어 — 호의적 반응"}],"collocBest":[]},"nuance":{"koSimple":"나에게 유리하고 좋은 쪽인.","whenToUse":"조건·반응이 우호적이라고 말할 때."},"krDetail":[{"ko":"유리한","explain":"일이 잘 되도록 도움이 되는"},{"ko":"호의적인","explain":"좋게 보고 잘 대해 주려는 마음의"}],"usageExamples":[{"en":"The company received a favorable review from all major industry critics.","ko":"그 회사는 모든 주요 업계 비평가들로부터 호의적인 평가를 받았다."},{"en":"Weather conditions are expected to be favorable for the outdoor concert.","ko":"날씨 조건은 야외 콘서트에 유리할 것으로 예상된다."},{"en":"She spoke in favorable terms about her former colleagues and their achievements.","ko":"그녀는 이전 동료들과 그들의 업적에 대해 호의적인 말로 이야기했다."}],"grammarNote":"favorable은 to/for 전치사와 함께 쓰이는데, 학생들이 자주 in favorable of 같은 어색한 표현을 만든다.","grammarQuiz":[{"sentence":"The new policy is highly favorable _____ small businesses _____ struggling with high tax rates.","ko":"그 새 정책은 높은 세율로 고전하고 있는 소규모 사업체들에게 매우 유리하다.","answer":["to","that"],"hint":"전치사 + 관계대명사"}]},
    {"id":"w02514","w":"fluency","pos":["n"],"ph":"/ˈfluːənsi/","cefr":"B1","kr":["유창함","능숙함"],"ex":[{"en":"She gained fluency in Korean.","ko":"그녀는 한국어 유창함을 얻었다."}],"mnemonic":{"soundHint":"플루언시 → '플루~' 유창하게 술술","story":"물이 flow하듯 말이 술술 나오면 fluency(유창함).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"proficiency","ko":"능숙함","reason":"언어 능력 수준 동의어"},{"w":"language","ko":"언어","reason":"language fluency 콜로"}],"collocBest":[]},"nuance":{"koSimple":"막힘 없이 술술 말하는 능숙함","whenToUse":"외국어를 자연스럽게 구사하는 언어 능력을 강조할 때"},"krDetail":[{"ko":"유창함","explain":"말이 막힘없이 술술 나오는 능력"},{"ko":"능숙함","explain":"어떤 일을 잘 다루는 솜씨"}],"usageExamples":[{"en":"She achieved fluency in three languages through daily practice.","ko":"그녀는 매일 연습을 통해 세 언어에서 유창함을 얻었다."},{"en":"Fluency in a foreign language is often measured by conversation skills.","ko":"외국어 유창함은 흔히 대화 능력으로 측정된다."}],"grammarNote":"fluency는 셀 수 없는 명사로 관사 없이 쓰는 것이 자연스럽고, '~에 있어서의 유창함'은 fluency in으로 표현한다.","grammarQuiz":[{"sentence":"Her _____ _____ English impressed everyone during the interview.","ko":"그녀의 영어 유창함은 면접 동안 모두를 감명시켰다.","answer":["fluency","in"],"hint":"명사 + 전치사 조합"},{"sentence":"He worked hard to _____ _____ in Spanish before moving abroad.","ko":"그는 해외로 가기 전에 스페인어 유창함을 얻기 위해 열심히 노력했다.","answer":["achieve","fluency"],"hint":"동사 + 명사 연어"}]},
    {"id":"w02546","w":"forbidden","pos":["adj"],"ph":"/fəˈbɪdən/","cefr":"B1","kr":["금지된","허용되지 않는"],"ex":[{"en":"Entry is strictly forbidden here.","ko":"이곳에 출입은 엄격히 금지되어 있다."}],"mnemonic":{"soundHint":"포비든 → '포(놓다) 비든(비켜)' = 손대지 마","story":"'포기하고 비켜!' 라고 금지된 구역.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"banned","ko":"금지된","reason":"금지 동의어"},{"w":"permitted","ko":"허용된","reason":"금지의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"규칙·법으로 딱 막아 놓은","whenToUse":"공식적으로 금지된 행위·구역을 말할 때"},"krDetail":[{"ko":"금지된","explain":"규칙에 따라 하면 안 되는"},{"ko":"허용되지 않는","explain":"규정상 통과시킬 수 없는"}],"usageExamples":[{"en":"The staff strictly forbid smoking inside the hospital building.","ko":"직원들은 병원 건물 내부에서의 흡연을 엄격히 금지한다."},{"en":"Smoking is strictly forbidden in all public transportation areas.","ko":"흡연은 모든 대중교통 구역에서 엄격히 금지된다."}],"grammarNote":"forbidden은 forbid의 과거분사에서 온 형용사로 be forbidden 형태의 수동태 구문에서 자주 쓰이며, be forbidden to부정사는 '~하는 것이 금지되다'이다.","grammarQuiz":[{"sentence":"Students _____ _____ _____ use their cell phones during examinations.","ko":"학생들은 시험 중에 휴대폰 사용이 금지된다.","answer":["are","forbidden","to"],"hint":"수동태 + to부정사"},{"sentence":"Taking pictures is strictly _____ _____ the museum galleries.","ko":"박물관 전시실에서는 사진 촬영이 엄격히 금지된다.","answer":["forbidden","in"],"hint":"형용사 + 전치사"}]},
    {"id":"w02610","w":"frantic","pos":["adj"],"ph":"/ˈfræntɪk/","cefr":"B1","kr":["미칠 듯한","매우 당황한"],"ex":[{"en":"She made a frantic phone call.","ko":"그녀는 다급하게 전화를 걸었다."}],"mnemonic":{"soundHint":"프랜틱 → '프랜(친구) 딱(당황)!'","story":"친구가 사라져 미칠 듯이 당황.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"desperate","ko":"필사적인","reason":"절박함 동의어"},{"w":"calm","ko":"차분한","reason":"직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"미친 듯이 다급하고 정신없는","whenToUse":"긴급하고 통제 안 되는 상태를 나타낼 때"},"krDetail":[{"ko":"미칠 듯한","explain":"정신을 못 차릴 만큼 다급한"},{"ko":"매우 당황한","explain":"너무 놀라 어쩔 줄 모르는"}],"usageExamples":[{"en":"The mother made a frantic search for her missing child in the mall.","ko":"그 어머니는 쇼핑몰에서 실종된 아이를 필사적으로 찾았다."},{"en":"He was frantic with worry when his son didn't come home.","ko":"그는 아들이 집에 오지 않았을 때 걱정으로 미칠 듯했다."}],"grammarNote":"frantic은 명사 앞 한정적 용법(a frantic search)과 be동사 뒤 서술적 용법(be frantic with + 감정) 모두로 쓰인다.","grammarQuiz":[{"sentence":"The parents were _____ _____ worry when their daughter didn't return.","ko":"부모는 딸이 돌아오지 않아 걱정으로 미칠 듯했다.","answer":["frantic","with"],"hint":"형용사 + 전치사"},{"sentence":"There was a _____ _____ for the lost puppy in the neighborhood.","ko":"동네에서 잃어버린 강아지를 찾는 필사적인 수색이 있었다.","answer":["frantic","search"],"hint":"형용사 + 명사"}]},
    {"id":"w02619","w":"freight","pos":["n","v"],"ph":"/freɪt/","cefr":"B1","kr":["화물","운반하다"],"ex":[{"en":"The ship carries heavy freight.","ko":"배는 무거운 화물을 운반한다."}],"mnemonic":{"soundHint":"프레이트 → '프레(짐) 이트(있다)'","story":"배에 실린 '프레이트' 짐이 화물.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"cargo","ko":"화물","reason":"화물 동의어"},{"w":"train","ko":"열차","reason":"freight train 콜로"}],"collocBest":[]},"nuance":{"koSimple":"배·기차로 운반되는 화물","whenToUse":"대량 상업 운송 화물을 말할 때"},"krDetail":[{"ko":"화물","explain":"실어 나르는 짐이나 물건"},{"ko":"운반하다","explain":"짐을 옮겨서 나르다"}],"usageExamples":[{"en":"The company freighted heavy machinery across the country by rail.","ko":"그 회사는 무거운 기계를 철도로 전국에 걸쳐 운송했다."},{"en":"The cargo was freighted to the port by a large truck.","ko":"화물은 대형 트럭에 의해 항구로 운송되었다."}],"grammarNote":"freight는 명사로는 셀 수 없는 명사이며, 동사로 쓰일 때는 타동사(무엇을 운반하다)로 주로 수동태에서 자주 등장한다.","grammarQuiz":[{"sentence":"The heavy goods _____ _____ _____ train to the northern warehouse.","ko":"그 무거운 상품들은 북쪽 창고까지 열차로 운송되었다.","answer":["were","freighted","by"],"hint":"수동태 + 전치사"},{"sentence":"A large _____ _____ arrived at the station carrying imported products.","ko":"수입 상품을 실은 대형 화물 열차가 역에 도착했다.","answer":["freight","train"],"hint":"명사 + 명사"}]},
    {"id":"w02622","w":"frequent","pos":["adj"],"ph":"/ˈfriːkwənt/","cefr":"B1","kr":["빈번한","잦은"],"ex":[{"en":"She makes frequent trips to the library.","ko":"그녀는 도서관을 자주 방문한다."}],"mnemonic":{"soundHint":"프리퀀트 → '프리(자주) 퀀트(가다)'","story":"자주 프리하게 방문 = 빈번한.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"regular","ko":"정기적인","reason":"잦음 동의어"},{"w":"rare","ko":"드문","reason":"빈번의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"자주 반복되는 잦은.","whenToUse":"같은 일이 반복될 때."},"krDetail":[{"ko":"빈번한","explain":"짧은 시간 안에 여러 번 일어나는"},{"ko":"잦은","explain":"자주 되풀이되는"}],"usageExamples":[{"en":"He is a frequent visitor to the public library on weekends.","ko":"그는 주말마다 공공 도서관을 자주 방문하는 사람이다."},{"en":"Frequent breaks are recommended during long study sessions for better focus.","ko":"긴 학습 시간 동안 잦은 휴식이 더 나은 집중을 위해 권장된다."}],"grammarNote":"frequent는 명사 앞 한정적 용법(frequent visitor)으로 주로 쓰이며, 반의어는 rare, infrequent이다.","grammarQuiz":[{"sentence":"She became a _____ _____ at this cozy coffee shop nearby.","ko":"그녀는 근처 이 아늑한 커피숍의 단골 방문객이 되었다.","answer":["frequent","visitor"],"hint":"형용사 + 명사"},{"sentence":"_____ exercise and healthy eating _____ good for overall health.","ko":"잦은 운동과 건강한 식습관은 전반적인 건강에 좋다.","answer":["Frequent","are"],"hint":"형용사 + 동사"}]},
    {"id":"w02646","w":"frustration","pos":["n"],"ph":"/frʌˈstreɪʃən/","cefr":"B1","kr":["좌절","불만"],"ex":[{"en":"His frustration was evident to all.","ko":"그의 좌절은 모두에게 명백했다."}],"mnemonic":{"soundHint":"프러스트레이션 → '풀었어! 트라이! 좌절!'","story":"풀려고 트라이하다 결국 좌절.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"disappointment","ko":"실망","reason":"좌절 동의어"},{"w":"satisfaction","ko":"만족","reason":"좌절의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"뜻대로 안 되어 답답한 마음","whenToUse":"목표가 막혀 생기는 좌절감을 말할 때"},"krDetail":[{"ko":"좌절","explain":"뜻대로 되지 않아 답답한 마음"},{"ko":"불만","explain":"마음에 차지 않아 못마땅한 상태"}],"usageExamples":[{"en":"He expressed his frustration about the slow progress of the project.","ko":"그는 프로젝트의 느린 진행에 대한 좌절을 표현했다."},{"en":"Frustration was clearly felt by everyone in the delayed meeting room.","ko":"지연된 회의실의 모든 사람에게서 좌절이 분명히 느껴졌다."}],"grammarNote":"frustration은 셀 수 없는 명사와 셀 수 있는 명사 둘 다 가능하며, express frustration, source of frustration 형태의 연어로 자주 쓰인다.","grammarQuiz":[{"sentence":"The workers wanted to _____ _____ _____ about the poor working conditions.","ko":"노동자들은 열악한 근무 조건에 대한 좌절을 표현하고 싶어 했다.","answer":["express","their","frustration"],"hint":"동사 + 소유격 + 명사"},{"sentence":"Slow internet is the main _____ _____ _____ for many remote workers.","ko":"느린 인터넷은 많은 재택 근무자에게 좌절의 주된 원인이다.","answer":["source","of","frustration"],"hint":"명사 + 전치사구"}]},
    {"id":"w02574","w":"former","pos":["adj"],"ph":"/ˈfɔːrmər/","cefr":"B1","kr":["이전의","전자의"],"ex":[{"en":"The former president visited the school.","ko":"전 대통령이 학교를 방문했다."}],"mnemonic":{"soundHint":"포머 → 'form(형성) + er' = 앞서 형성된 사람","story":"먼저(fore→for) 있던 = 이전의, 전자의.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"previous","ko":"이전의","reason":"이전 동의어"},{"w":"latter","ko":"후자의","reason":"전자↔후자 반의어"}],"collocBest":[]},"nuance":{"koSimple":"지금은 아니지만 예전의","whenToUse":"과거의 지위·상태를 콕 집어 말할 때"},"krDetail":[{"ko":"이전의","explain":"지금보다 앞서 있었던"},{"ko":"전자의","explain":"둘 중 앞서 말한 것"}],"usageExamples":[{"en":"The former president gave a powerful speech at the anniversary event.","ko":"그 전 대통령은 기념일 행사에서 강력한 연설을 했다."},{"en":"Between coffee and tea, the former is more popular in this country.","ko":"커피와 차 중에서 전자가 이 나라에서 더 인기 있다."}],"grammarNote":"former는 명사 앞에서 '이전의'라는 뜻으로 쓰이거나, the former 형태로 앞서 언급된 둘 중 첫 번째를 가리키며 the latter와 짝을 이룬다.","grammarQuiz":[{"sentence":"My _____ _____ still keeps in touch with our class every year.","ko":"내 이전 선생님은 매년 우리 반과 여전히 연락을 유지한다.","answer":["former","teacher"],"hint":"형용사 + 명사"},{"sentence":"Between the two options, _____ _____ seems better for our budget.","ko":"두 가지 선택지 중에서 전자가 우리 예산에 더 나아 보인다.","answer":["the","former"],"hint":"관사 + 대명사"}]},
    {"id":"w02589","w":"fossil","pos":["n"],"ph":"/ˈfɒsəl/","cefr":"B1","kr":["화석","시대에 뒤진 것"],"ex":[{"en":"The museum displayed dinosaur fossils.","ko":"박물관은 공룡 화석을 전시했다."}],"mnemonic":{"soundHint":"파슬 → '파실(파일)' → 파낸 화석","story":"땅을 파서 '파슬~' 발견되는 화석.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"relic","ko":"유물","reason":"오래된 잔재 동의어"},{"w":"fuel","ko":"연료","reason":"fossil fuel 콜로"}],"collocBest":[]},"nuance":{"koSimple":"땅속에서 나온 옛 생물의 흔적","whenToUse":"고생물의 굳은 유해나 자취를 가리킬 때"},"krDetail":[{"ko":"화석","explain":"옛 생물이 돌처럼 굳어 남은 흔적"},{"ko":"시대에 뒤진 것","explain":"오랜 세월이 지나 낡아 버린 것"}],"usageExamples":[{"en":"The scientists discovered a rare fossil in the desert last month.","ko":"과학자들은 지난달 사막에서 희귀한 화석을 발견했다."},{"en":"Ancient fossils are often found by researchers in deep rock layers.","ko":"고대 화석은 종종 연구자들에 의해 깊은 암석층에서 발견된다."}],"grammarNote":"fossil은 셀 수 있는 명사로 단수와 복수 모두 가능하며, fossil fuel(화석 연료), fossil record(화석 기록)처럼 복합명사로 자주 쓰인다.","grammarQuiz":[{"sentence":"A rare dinosaur _____ _____ _____ by the young researcher yesterday.","ko":"희귀한 공룡 화석이 어제 젊은 연구자에 의해 발견되었다.","answer":["fossil","was","found"],"hint":"명사 + 수동태"},{"sentence":"We must reduce our dependence on _____ _____ to save the environment.","ko":"환경을 지키기 위해 우리는 화석 연료 의존을 줄여야 한다.","answer":["fossil","fuels"],"hint":"복합명사 복수"}]},
    {"id":"w02592","w":"found","pos":["v"],"ph":"/faʊnd/","cefr":"B1","kr":["설립하다","창설하다"],"ex":[{"en":"The university was founded in 1890.","ko":"그 대학교는 1890년에 설립되었다."}],"mnemonic":{"soundHint":"파운드 → 'find(찾다)의 과거' vs '설립하다'","story":"터를 찾아(found) 나라를 설립하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"establish","ko":"설립하다","reason":"설립 동의어"},{"w":"abolish","ko":"폐지하다","reason":"설립의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"단체·회사를 처음 세우는 것","whenToUse":"기관·회사를 창설한 사실을 말할 때"},"krDetail":[{"ko":"설립하다","explain":"새로운 조직이나 기관을 세우다"},{"ko":"창설하다","explain":"처음으로 만들어 열다"}],"usageExamples":[{"en":"The two friends founded a small technology company in their garage.","ko":"그 두 친구는 차고에서 작은 기술 회사를 설립했다."},{"en":"The university was founded by a group of scholars in 1892.","ko":"그 대학은 1892년에 한 학자 집단에 의해 설립되었다."}],"grammarNote":"found는 '설립하다'라는 뜻의 규칙 동사로 과거·과거분사가 founded이며, find(찾다)의 과거형 found와 형태는 같지만 의미가 다르다.","grammarQuiz":[{"sentence":"Two innovative scientists _____ this company back in the early nineties.","ko":"두 혁신적인 과학자들이 90년대 초반에 이 회사를 설립했다.","answer":["founded"],"hint":"규칙 과거형"},{"sentence":"This charity _____ _____ _____ dedicated volunteers over ten years ago.","ko":"이 자선단체는 10년 전에 헌신적인 자원봉사자들에 의해 설립되었다.","answer":["was","founded","by"],"hint":"수동태 + 전치사"}]},
    {"id":"w02638","w":"frost","pos":["n","v"],"ph":"/frɒst/","cefr":"B1","kr":["서리","서리가 내리다"],"ex":[{"en":"The frost killed the flowers in the garden.","ko":"서리가 정원의 꽃들을 죽였다."}],"mnemonic":{"soundHint":"프로스트 → '프로(선수)도 스톱' 시키는 서리","story":"차가운 '프로스트'가 내리면 프로도 멈춘다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ice","ko":"얼음","reason":"얼음 관련 동의어"},{"w":"thaw","ko":"녹다","reason":"서리의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"차가운 새벽 하얗게 낀 서리","whenToUse":"기온이 어는점 근처일 때 표면에 얼음이 낀 상태를 말할 때"},"krDetail":[{"ko":"서리","explain":"이른 아침 풀잎에 하얗게 맺힌 얼음"},{"ko":"서리가 내리다","explain":"찬 공기로 물기가 얼어붙다"}],"usageExamples":[{"en":"The morning frost covered the entire garden with beautiful white crystals.","ko":"아침 서리가 아름다운 하얀 결정으로 정원 전체를 덮었다."},{"en":"The vegetables were frosted overnight due to the sudden temperature drop.","ko":"채소들이 갑작스러운 기온 하락으로 밤새 서리를 맞았다."}],"grammarNote":"frost는 셀 수 없는 명사로 자연 현상을 나타내며, 동사로 쓰일 때는 주로 수동태 be frosted 형태로 등장한다.","grammarQuiz":[{"sentence":"There was a heavy _____ _____ the fields early this morning.","ko":"오늘 아침 일찍 들판에 두꺼운 서리가 있었다.","answer":["frost","on"],"hint":"명사 + 전치사"},{"sentence":"The delicate flowers _____ _____ _____ the unexpected cold last night.","ko":"그 여린 꽃들은 어젯밤 예상치 못한 추위로 서리를 맞았다.","answer":["were","frosted","by"],"hint":"수동태 + 전치사"}]},
    {"id":"w02519","w":"flutter","pos":["v","n"],"ph":"/ˈflʌtər/","cefr":"B1","kr":["펄럭이다","두근거리다"],"ex":[{"en":"Butterflies fluttered in the garden.","ko":"나비들이 정원에서 펄럭였다."}],"mnemonic":{"soundHint":"플러터(Flutter) 앱 프레임워크의 이름처럼 화면이 펄럭이다","story":"구글 Flutter 프레임워크의 이름처럼 화면이 펄럭이며 전환된다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"flap","ko":"펄럭이다","reason":"깃발·날개가 펄럭이는 동작 동의어"},{"w":"breeze","ko":"산들바람","reason":"flutter in the breeze 콜로케이션"}],"collocBest":[{"en":"flutter in the breeze","ko":"바람에 펄럭이다"},{"en":"heart flutter","ko":"심장이 두근거리다"}]},"nuance":{"koSimple":"깃발·날개가 팔랑팔랑 흔들리는 모습","whenToUse":"작고 가벼운 것이 빠르게 떨리듯 움직일 때"},"krDetail":[{"ko":"펄럭이다","explain":"바람에 가볍게 나부끼며 흔들리다"},{"ko":"두근거리다","explain":"심장이 빠르고 세게 뛰다"}],"usageExamples":[{"en":"The birds fluttered their wings as they took off from the branch.","ko":"새들은 나뭇가지에서 날아오르며 날개를 퍼덕였다."},{"en":"The flags fluttered in the strong breeze all afternoon.","ko":"깃발들이 오후 내내 강한 산들바람에 펄럭였다."}],"grammarNote":"flutter는 타동사(wings를 목적어로)와 자동사(스스로 펄럭이다) 둘 다 쓰이므로 문맥으로 구분해야 한다.","grammarQuiz":[{"sentence":"The butterfly _____ its colorful wings as it moved from flower to flower.","ko":"나비는 꽃에서 꽃으로 이동하며 다채로운 날개를 퍼덕였다.","answer":["fluttered"],"hint":"과거시제 타동사"},{"sentence":"Curtains _____ _____ the open window during the summer storm.","ko":"여름 폭풍 동안 커튼들이 열린 창문에서 펄럭였다.","answer":["fluttered","at"],"hint":"동사 + 전치사"}]},
    {"id":"w02529","w":"folklore","pos":["n"],"ph":"/ˈfəʊklɔː/","cefr":"B1","kr":["민속","민간 전승"],"ex":[{"en":"The story is part of local folklore.","ko":"그 이야기는 지역 민간 전승의 일부이다."}],"mnemonic":{"soundHint":"포크로어 → 'folk(사람들) + lore(지식)'","story":"옛사람들(folk)의 지식(lore)이 모여 민간 전승.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tradition","ko":"전통","reason":"전해오는 문화 동의어"},{"w":"legend","ko":"전설","reason":"구전 이야기 동의어"}],"collocBest":[]},"nuance":{"koSimple":"조상 대대로 전해진 이야기와 풍습","whenToUse":"전통 설화·민간 신앙 등을 통틀어 말할 때"},"krDetail":[{"ko":"민속","explain":"한 지역 사람들 사이에 전해오는 풍속과 이야기"},{"ko":"민간 전승","explain":"입에서 입으로 이어지는 옛이야기"}],"usageExamples":[{"en":"Local folklore describes a hidden treasure buried under the ancient oak tree.","ko":"지역 민속은 오래된 참나무 아래 숨겨진 보물이 있다고 전한다."},{"en":"Irish folklore includes many stories about fairies and magical creatures.","ko":"아일랜드 민속에는 요정과 마법 생명체에 관한 이야기가 많다."}],"grammarNote":"folklore는 셀 수 없는 명사로 항상 단수 취급하며, 관사 없이 쓰거나 the folklore of + 지역명으로 표현한다.","grammarQuiz":[{"sentence":"Korean _____ _____ many tales about tigers and clever rabbits.","ko":"한국 민속에는 호랑이와 영리한 토끼에 관한 이야기가 많다.","answer":["folklore","includes"],"hint":"명사(단수) + 동사"},{"sentence":"According _____ local _____, this river was created by a giant.","ko":"지역 민속에 따르면 이 강은 거인이 만들었다.","answer":["to","folklore"],"hint":"전치사 + 명사"}]},
    {"id":"w02532","w":"fond","pos":["adj"],"ph":"/fɒnd/","cefr":"B1","kr":["좋아하는","애정 어린"],"ex":[{"en":"She is very fond of her cat.","ko":"그녀는 자신의 고양이를 매우 좋아한다."}],"mnemonic":{"soundHint":"폰드 → '폰(연락)' 자주 하는 사이","story":"폰(폰번호)을 자주 눌러 연락할 만큼 fond(좋아하는).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"affectionate","ko":"다정한","reason":"애정 어린 감정 동의어"},{"w":"memory","ko":"기억","reason":"fond memory 콜로"}],"collocBest":[]},"nuance":{"koSimple":"애정 어려 무언가를 좋아하는 마음","whenToUse":"오래도록 정든 대상에 대한 애정을 표현할 때"},"krDetail":[{"ko":"좋아하는","explain":"누구나 무엇을 마음에 들어 하는"},{"ko":"애정 어린","explain":"따뜻한 마음이 담긴"}],"usageExamples":[{"en":"She is very fond of her younger sister and protects her always.","ko":"그녀는 여동생을 매우 좋아하고 항상 그녀를 보호한다."},{"en":"The grandmother gave a fond smile to her grandchildren at the party.","ko":"할머니는 파티에서 손주들에게 애정 어린 미소를 지었다."}],"grammarNote":"fond는 서술적 용법에서 be fond of + 명사/동명사 형태로 쓰이며, 한정적 용법에서는 fond memory처럼 명사 앞에 놓인다.","grammarQuiz":[{"sentence":"My little brother is very _____ _____ chocolate ice cream after dinner.","ko":"내 남동생은 저녁 식사 후에 초콜릿 아이스크림을 매우 좋아한다.","answer":["fond","of"],"hint":"형용사 + 전치사"},{"sentence":"I have _____ _____ of our summer vacation at the beach house.","ko":"나는 해변 별장에서 보낸 여름휴가에 대한 아름다운 기억이 있다.","answer":["fond","memories"],"hint":"형용사 + 명사"}]},
    {"id":"w02534","w":"fool","pos":["n","v"],"ph":"/fuːl/","cefr":"B1","kr":["바보","속이다"],"ex":[{"en":"Don't be a fool and waste your money.","ko":"바보같이 돈을 낭비하지 마라."}],"mnemonic":{"soundHint":"풀 → '풀(잔디)'만 뜯는 바보","story":"머리에 풀만 든 바보 fool.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"idiot","ko":"바보","reason":"바보의 동의어"},{"w":"deceive","ko":"속이다","reason":"동사 뜻 속이다 동의어"}],"collocBest":[]},"nuance":{"koSimple":"어리석은 짓을 하는 바보","whenToUse":"판단이 서툰 사람을 지칭하거나 속일 때"},"krDetail":[{"ko":"바보","explain":"어리석은 짓을 하는 사람"},{"ko":"속이다","explain":"거짓말로 남을 헷갈리게 하다"}],"usageExamples":[{"en":"He fooled everyone with his clever disguise at the costume party.","ko":"그는 코스튬 파티에서 영리한 변장으로 모두를 속였다."},{"en":"Don't be fooled by the low price of that suspicious product.","ko":"그 수상한 제품의 낮은 가격에 속지 마라."}],"grammarNote":"fool은 능동태 fool + 목적어로 '~을 속이다', 수동태 be fooled by로 '~에 속다'가 되며, 명사로 쓰일 때는 셀 수 있는 명사이다.","grammarQuiz":[{"sentence":"The magician _____ the audience with his amazing card tricks.","ko":"마술사는 놀라운 카드 마술로 관객을 속였다.","answer":["fooled"],"hint":"과거시제 타동사"},{"sentence":"Many customers _____ _____ _____ the fake advertising campaign online.","ko":"많은 고객들이 온라인 가짜 광고 캠페인에 속았다.","answer":["were","fooled","by"],"hint":"수동태 + 전치사"}]},
    {"id":"w02535","w":"foolish","pos":["adj"],"ph":"/ˈfuːlɪʃ/","cefr":"B1","kr":["어리석은","바보같은"],"ex":[{"en":"It was foolish to spend all the money at once.","ko":"한꺼번에 돈을 다 쓰는 것은 어리석은 일이었다."}],"mnemonic":{"soundHint":"풀리시 → 'fool + ish' = 바보 같은","story":"fool(바보) + ish(스러운) = 어리석은.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stupid","ko":"멍청한","reason":"어리석음 동의어"},{"w":"wise","ko":"현명한","reason":"어리석음의 직접 반의어"}],"collocBest":[]},"nuance":{"koSimple":"판단이 어리석은.","whenToUse":"실수·결정이 지혜롭지 못할 때."},"krDetail":[{"ko":"어리석은","explain":"생각이 짧고 판단이 흐린"},{"ko":"바보같은","explain":"누가 봐도 말이 안 되는 행동을 하는"}],"usageExamples":[{"en":"It was foolish to leave the front door unlocked at night.","ko":"밤에 현관문을 잠그지 않고 두는 것은 어리석은 일이었다."},{"en":"She made a foolish decision to invest all her savings in one company.","ko":"그녀는 모든 저축을 한 회사에 투자하는 어리석은 결정을 내렸다."}],"grammarNote":"foolish는 It is foolish to부정사 또는 It is foolish of 사람 to부정사 구문에서 자주 쓰이며, of + 사람은 사람의 성격을 평가할 때 쓴다.","grammarQuiz":[{"sentence":"It was _____ _____ him to ignore the warning signs on the road.","ko":"그가 도로의 경고 표지판을 무시한 것은 어리석었다.","answer":["foolish","of"],"hint":"형용사 + 전치사"},{"sentence":"Don't make a _____ _____ that you will regret for years.","ko":"몇 년 동안 후회할 어리석은 결정을 내리지 마라.","answer":["foolish","decision"],"hint":"형용사 + 명사"}]},
    {"id":"w02661","w":"funeral","pos":["n"],"ph":"/ˈfjuːnərəl/","cefr":"B1","kr":["장례식","장례"],"ex":[{"en":"The funeral was held at the local church.","ko":"장례식은 지역 교회에서 거행되었다."}],"mnemonic":{"soundHint":"퓨너럴 → '퓨(슬픔) 너(당신) 럴(럴리)'","story":"슬픔이 몰리는 자리 = 장례식.","hintConfidence":1},"pairs":{"buddyWords":[{"w":"burial","ko":"매장","reason":"동의어(장례 관련)"},{"w":"mourn","ko":"애도하다","reason":"시나리오 콜로(장례식-애도)"},{"w":"wedding","ko":"결혼식","reason":"대비 시나리오(장례식 vs 결혼식)"}],"collocBest":[]},"nuance":{"koSimple":"세상을 떠난 사람을 위한 의식.","whenToUse":"장례식 참석·주관을 이야기할 때."},"krDetail":[{"ko":"장례식","explain":"죽은 사람을 보내는 의식"},{"ko":"장례","explain":"죽은 이를 떠나보내는 일 전반"}],"usageExamples":[{"en":"Many old friends attended the funeral to say goodbye.","ko":"많은 오랜 친구들이 작별 인사를 하러 장례식에 참석했다."},{"en":"The funeral was held quietly at a small chapel.","ko":"장례식은 작은 예배당에서 조용히 치러졌다."}],"grammarNote":"'장례식에 참석하다'는 attend a funeral로, attend는 타동사이므로 attend to a funeral처럼 to를 붙이지 않는다. 학생들이 자주 실수하는 부분이다.","grammarQuiz":[{"sentence":"Hundreds of people came to _____ the _____ of the beloved teacher.","ko":"수백 명의 사람들이 사랑받던 선생님의 장례식에 참석하러 왔다.","answer":["attend","funeral"],"hint":"타동사 + 명사"}]},
    {"id":"w02713","w":"general","pos":["adj","n"],"ph":"/ˈdʒenərəl/","cefr":"B1","kr":["일반적인","장군"],"ex":[{"en":"In general, people prefer comfort.","ko":"일반적으로 사람들은 편안함을 선호한다."}],"mnemonic":{"soundHint":"제너럴 → '제(모든) 너를(너희)' 아우르는","story":"모든 사람을 아우르는 = 일반적인 / 장군.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"common","ko":"공통의","reason":"동의어(일반적인)"},{"w":"specific","ko":"구체적인","reason":"반의어(일반 vs 구체)"},{"w":"overall","ko":"전반적인","reason":"동의어(전체)"}],"collocBest":[]},"nuance":{"koSimple":"특별하지 않고 전반에 걸친.","whenToUse":"'대체로·일반적으로'라는 큰 그림에."},"krDetail":[{"ko":"일반적인","explain":"특별하지 않고 두루 그러한"},{"ko":"장군","explain":"군대에서 가장 높은 지휘관"}],"usageExamples":[{"en":"The general opinion is that the plan needs more work.","ko":"일반적인 의견은 그 계획에 손질이 더 필요하다는 것이다."},{"en":"In general, students prefer group work over lectures.","ko":"일반적으로 학생들은 강의보다 그룹 활동을 선호한다."}],"grammarNote":"in general은 '일반적으로'라는 관용구로, generally와 바꿔 쓸 수 있다. 학생들은 in the general처럼 정관사를 넣는 실수를 자주 한다.","grammarQuiz":[{"sentence":"_____ _____, exercise is good for both body and mind.","ko":"일반적으로 운동은 몸과 마음 모두에 좋다.","answer":["In","general"],"hint":"관용구 (전치사 + 명사)"}]},
    {"id":"w02720","w":"generous","pos":["adj"],"ph":"/ˈdʒenərəs/","cefr":"B1","kr":["관대한","너그러운"],"ex":[{"en":"She is generous with her time.","ko":"그녀는 시간을 아낌없이 쓴다."}],"mnemonic":{"soundHint":"제너러스 → '제너레이션(세대)에 베푸는'","story":"세대를 아우르며 베푸는 = 관대한.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"kind","ko":"친절한","reason":"동의어(마음 넓음)"},{"w":"stingy","ko":"인색한","reason":"반의어(관대 vs 인색)"},{"w":"donate","ko":"기부하다","reason":"시나리오 콜로(관대한 기부)"}],"collocBest":[]},"nuance":{"koSimple":"아낌없이 베푸는 마음이 큰.","whenToUse":"기부·시간·마음을 후하게 쓸 때."},"krDetail":[{"ko":"관대한","explain":"잘못을 너그럽게 받아들이는"},{"ko":"너그러운","explain":"마음이 넓고 아까워하지 않는"}],"usageExamples":[{"en":"Her grandmother was generous with both time and money.","ko":"그녀의 할머니는 시간과 돈 모두에 너그러우셨다."},{"en":"It was very generous of you to help our team.","ko":"우리 팀을 도와주다니 너는 참 너그러웠다."}],"grammarNote":"'It is + generous + of + 사람 + to부정사' 구문에서 사람의 성품이 나올 때는 of를 쓴다(for가 아니라). 학생들은 It is generous for you to help처럼 for로 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"It was very _____ _____ him to share his lunch.","ko":"점심을 나누다니 그는 참 너그러웠다.","answer":["generous","of"],"hint":"성품 형용사 + 전치사"}]},
    {"id":"w02760","w":"gleeful","pos":["adj"],"ph":"/ˈɡliːfəl/","cefr":"B1","kr":["즐거운","기쁜"],"ex":[{"en":"The children were gleeful when they heard school was canceled.","ko":"아이들은 학교가 취소되었다는 소식을 듣고 기뻐했다."}],"mnemonic":{"soundHint":"글리풀 → 'glee(환희) + ful(가득)'","story":"glee(환희)로 가득 찬 = 즐거운.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"joyful","ko":"기쁨에 찬","reason":"동의어(기쁨)"},{"w":"gloomy","ko":"우울한","reason":"반의어(기쁨 vs 우울)"}],"collocBest":[]},"nuance":{"koSimple":"기분이 붕 뜨도록 즐거운.","whenToUse":"아이들이 신나 웃는 장면에."},"krDetail":[{"ko":"즐거운","explain":"속에서 웃음이 새어 나올 만큼 흐뭇한"},{"ko":"기쁜","explain":"마음이 흡족하고 흐뭇한"}],"usageExamples":[{"en":"The children were gleeful when the snow began to fall.","ko":"아이들은 눈이 내리기 시작하자 매우 즐거워했다."},{"en":"Her gleeful laughter filled the whole classroom.","ko":"그녀의 즐거운 웃음소리가 교실 전체를 채웠다."}],"grammarNote":"gleeful은 형용사로 사람이나 감정 관련 명사(laugh, smile, expression)를 수식한다. 학생들은 gleefully(즐겁게)라는 부사와 혼동해 She laughed gleeful처럼 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The winning team was _____ _____ their unexpected victory.","ko":"우승 팀은 뜻밖의 승리에 매우 기뻐했다.","answer":["gleeful","about"],"hint":"형용사 + 감정 대상 전치사"}]},
    {"id":"w02702","w":"gather","pos":["v"],"ph":"/ˈɡæðər/","cefr":"B1","kr":["모이다","수집하다"],"ex":[{"en":"People gathered in the square.","ko":"사람들이 광장에 모였다."}],"mnemonic":{"soundHint":"개더 → '개더(개들이 더) 모인다'","story":"개들이 더 많이 모이면 gather(모이다).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collect","ko":"모으다","reason":"동의어(수집하다)"},{"w":"scatter","ko":"흩다","reason":"반의어(모이다 vs 흩어지다)"},{"w":"assemble","ko":"모이다","reason":"동의어(집합하다)"}],"collocBest":[]},"nuance":{"koSimple":"흩어진 것을 한 곳으로 모으다.","whenToUse":"사람·정보·자료가 함께 모일 때."},"krDetail":[{"ko":"모이다","explain":"여럿이 한 자리에 함께 있게 되다"},{"ko":"수집하다","explain":"필요한 것을 골라 모으다"}],"usageExamples":[{"en":"The teacher asked students to gather data for the report.","ko":"선생님은 학생들에게 보고서를 위한 자료를 수집하라고 했다."},{"en":"Enough evidence has been gathered to prove his innocence.","ko":"그의 결백을 증명할 만큼 충분한 증거가 수집되었다."}],"grammarNote":"gather는 자동사(모이다)와 타동사(모으다) 둘 다 가능하다. 자동사일 때는 We gathered in the hall처럼 목적어 없이 쓰고, 타동사일 때 gather + 목적어로 쓴다. 학생들은 gather up something로만 외우는 경향이 있다.","grammarQuiz":[{"sentence":"The reporters _____ _____ around the mayor to ask questions.","ko":"기자들은 시장에게 질문하려고 그의 주위에 모여들었다.","answer":["gathered","around"],"hint":"과거형 + 방향 전치사"}]},
    {"id":"w02724","w":"genius","pos":["n"],"ph":"/ˈdʒiːniəs/","cefr":"B1","kr":["천재","탁월한 재능"],"ex":[{"en":"Mozart was a musical genius.","ko":"모차르트는 음악의 천재였다."}],"mnemonic":{"soundHint":"지니어스 → 'gene(유전자)이 어스(우수)'","story":"유전자가 특별한 = 천재.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"prodigy","ko":"신동","reason":"동의어(어린 천재)"},{"w":"creative","ko":"창의적인","reason":"시나리오 콜로(창의적 천재)"}],"collocBest":[]},"nuance":{"koSimple":"타고난 특출난 재능의 소유자.","whenToUse":"모차르트 같은 천재적 인물에."},"krDetail":[{"ko":"천재","explain":"재능이 남달리 뛰어난 사람"},{"ko":"탁월한 재능","explain":"남보다 훨씬 뛰어난 솜씨"}],"usageExamples":[{"en":"Einstein is often described as a scientific genius.","ko":"아인슈타인은 흔히 과학적 천재로 묘사된다."},{"en":"It takes real genius to solve such a hard problem.","ko":"그런 어려운 문제를 푸는 데는 진정한 천재성이 필요하다."}],"grammarNote":"'사람'의 뜻일 때 genius는 가산명사(a genius), '재능'의 뜻일 때는 불가산명사(pure genius)이다. 학생들은 두 용법을 구분하지 못하고 관사를 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The young pianist was hailed _____ _____ musical genius.","ko":"그 어린 피아니스트는 음악의 천재로 칭송받았다.","answer":["as","a"],"hint":"전치사 + 부정관사"}]},

const KEY = "wdr-고1-Review-C";
const SFX_KEY = "wdr-sfx-on";
const CB_KEY = "wdr-cb-mode";
const XP_GLOBAL_KEY = "wdr-xp-total";

const lsGet = (k,def)=>{ try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;} };
const lsSet = (k,v)=>{ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} };

  quizType: "basic",       // basic | advanced

  startTime: 0,

  xp: 0,
  streak: 0,
  maxStreak: 0,

  chapterCleared: lsGet(KEY+":cleared", false),

  perfectFlag: false,
  // quiz

  // timer
  tickHandle: null
};

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠
  correct(){
    tone({type:"sine", freq:1400, dur:.08, vol:.22, t0:0});
    tone({type:"sine", freq:1800, dur:.06, vol:.16, t0:.04});
  },
  // jp-buzzer: 저음 square 150Hz 250ms
  wrong(){
    tone({type:"square", freq:160, dur:.18, vol:.18, t0:0});
    tone({type:"square", freq:120, dur:.20, vol:.16, t0:.06});
  },
  // jp-slot-jackpot: 도-솔-도-미 차임 4단
  levelUp(){
    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));
    tone({type:"triangle", freq:2093.00, dur:.4, vol:.18, t0:.55}); // 종소리 C7
  },
  // jp-chime-asc: 800→1000→1200 3단
  streak(){

  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine
  fireworks(){
    noise({dur:.18, vol:.22, t0:0, hp:600});

  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단

  // 3) 종·코인·환호 노이즈
  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [
