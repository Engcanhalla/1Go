<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review C</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}

  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;

  }

    content:"";position:absolute;inset:0;

      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),

  }
  .hg-msg{
    position:relative;font-family:inherit;

  }

  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}

  @keyframes shake{

  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

  .rainbow-overlay{

  }

</style>

    {"id":"w02364","w":"fearful","pos":["adj"],"ph":"/ˈfɪərfəl/","cefr":"B1","kr":["두려워하는","무서운"],"ex":[{"en":"He was fearful of the consequences.","ko":"그는 결과를 두려워했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"afraid","ko":"두려워하는","reason":"동의어 — 공포 느낌 공유"},{"w":"fearless","ko":"두려움 없는","reason":"반의어 — 접미사 대비"},{"w":"scared","ko":"겁먹은","reason":"동의어 — 무서움 표현"}],"collocBest":[{"en":"fearful of","ko":"~을 두려워하는"},{"en":"fearful silence","ko":"두려운 침묵"}]},"nuance":{"koSimple":"겁을 먹고 두려워하는.","whenToUse":"결과·앞일을 걱정하며 무서워할 때."},"krDetail":[{"ko":"두려워하는","explain":"무섭거나 걱정스러워 떨리는 마음의"},{"ko":"무서운","explain":"겁이 나게 만드는"}],"usageExamples":[{"en":"Many children are fearful of the dark when they sleep alone.","ko":"많은 아이들이 혼자 잘 때 어둠을 두려워한다."},{"en":"The workers were fearful of losing their jobs during the recession.","ko":"노동자들은 경기 침체 동안 일자리를 잃는 것을 두려워했다."}],"grammarNote":"fearful은 뒤에 of + 명사/동명사 또는 that절을 취할 수 있다. 학생들이 fearful to + 동사원형을 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The elderly residents were fearful _____ the storm _____ damage their homes.","ko":"노인 주민들은 폭풍이 그들의 집을 손상시킬까 두려워했다.","answer":["that","would"],"hint":"fearful that절 + 조동사"}]},

    {"id":"w02372","w":"feature","pos":["n","v"],"ph":"/ˈfiːtʃər/","cefr":"B1","kr":["특징","특색"],"ex":[{"en":"The phone has many useful features.","ko":"그 전화기는 유용한 기능이 많다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"characteristic","ko":"특징","reason":"동의어 — 고유 성질"},{"w":"attribute","ko":"속성","reason":"동의어 — 특징 요소"},{"w":"highlight","ko":"부각시키다","reason":"시나리오 — 특징을 강조"}],"collocBest":[{"en":"special feature","ko":"특별한 특징"},{"en":"key feature","ko":"핵심 특징"}]},"nuance":{"koSimple":"눈에 띄는 특징이나 기능.","whenToUse":"제품·얼굴·글의 특색을 짚을 때."},"krDetail":[{"ko":"특징","explain":"다른 것과 구별되는 특별한 점"},{"ko":"특색","explain":"그것만이 지닌 뚜렷한 개성"}],"usageExamples":[{"en":"The new smartphone features an advanced camera and a longer battery life.","ko":"그 새 스마트폰은 향상된 카메라와 더 긴 배터리 수명을 특징으로 한다."},{"en":"The magazine featured a lengthy interview with the famous author last month.","ko":"그 잡지는 지난달에 유명 작가와의 긴 인터뷰를 특집으로 실었다."}],"grammarNote":"feature는 명사(특징)와 타동사(~을 특징으로 하다)로 모두 쓰인다. 학생들이 be featured(수동태)를 능동태로 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The talented new artist _____ prominently _____ in the international magazine's spring edition.","ko":"그 재능 있는 신인 예술가는 그 국제 잡지의 봄호에 크게 특집으로 실렸다.","answer":["was","featured"],"hint":"수동태 be + p.p."}]},
    {"id":"w02375","w":"federal","pos":["adj"],"ph":"/ˈfedərəl/","cefr":"B1","kr":["연방의","연방 정부의"],"ex":[{"en":"The federal government passed a new law.","ko":"연방 정부는 새로운 법을 통과시켰다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"national","ko":"국가의","reason":"동의어 — 중앙 정부 개념"},{"w":"local","ko":"지역의","reason":"반의어 — 연방 대 지역"},{"w":"government","ko":"정부","reason":"콜로 — 연방 정부"}],"collocBest":[{"en":"federal law","ko":"연방법"},{"en":"federal government","ko":"연방 정부"}]},"nuance":{"koSimple":"여러 주가 모인 연방의.","whenToUse":"미국 등 연방 국가의 법·정부 이야기할 때."},"krDetail":[{"ko":"연방의","explain":"여러 주가 하나로 뭉친 나라의"},{"ko":"연방 정부의","explain":"여러 주를 하나로 다스리는 중앙 정부의"}],"usageExamples":[{"en":"The federal government announced new regulations to protect the environment.","ko":"연방 정부는 환경을 보호하기 위한 새로운 규정을 발표했다."},{"en":"This case will be tried in a federal court rather than a state court.","ko":"이 사건은 주 법원이 아닌 연방 법원에서 재판될 것이다."}],"grammarNote":"federal은 한정적 용법 위주로 쓰이는 형용사이다. 학생들이 서술적 위치(be federal)에 두려는 실수를 자주 한다.","grammarQuiz":[{"sentence":"_____ federal agency _____ oversees banking has strict rules about international money transfers.","ko":"은행업을 감독하는 그 연방 기관은 국제 자금 이체에 대한 엄격한 규정을 가지고 있다.","answer":["The","that"],"hint":"정관사 + 관계대명사"}]},

    {"id":"w02410","w":"fiction","pos":["n"],"ph":"/ˈfɪkʃn/","cefr":"B1","kr":["소설","허구"],"ex":[{"en":"She loves reading science fiction novels.","ko":"그녀는 공상과학 소설 읽는 것을 좋아한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"novel","ko":"소설","reason":"동의어 — 허구 이야기"},{"w":"nonfiction","ko":"논픽션","reason":"반의어 — 사실 대 허구"},{"w":"fantasy","ko":"환상","reason":"동의어 — 상상 세계"}],"collocBest":[{"en":"science fiction","ko":"공상과학"},{"en":"work of fiction","ko":"허구 작품"}]},"nuance":{"koSimple":"지어낸 이야기, 소설류.","whenToUse":"실화(nonfiction)와 구별해 말할 때."},"krDetail":[{"ko":"소설","explain":"지어낸 이야기를 담은 글"},{"ko":"허구","explain":"실제로 있지 않은 지어낸 것"}],"usageExamples":[{"en":"Science fiction novels often explore possible futures shaped by advanced technology.","ko":"공상과학 소설은 흔히 첨단 기술이 만들어낸 가능한 미래를 탐구한다."},{"en":"It is sometimes difficult to separate fact from fiction in her memoir.","ko":"그녀의 회고록에서는 때때로 사실과 허구를 구분하기가 어렵다."}],"grammarNote":"fiction은 불가산명사이다. 학생들이 a fiction, fictions처럼 관사나 복수형을 붙이는 실수를 자주 한다. 개별 작품을 말할 때는 a work of fiction으로 쓴다.","grammarQuiz":[{"sentence":"The professor explained _____ difficult it can be _____ distinguish fiction from reality in historical writing.","ko":"그 교수는 역사적 글쓰기에서 허구를 현실과 구분하는 것이 얼마나 어려울 수 있는지 설명했다.","answer":["how","to"],"hint":"간접의문문 how + to부정사"}]},
    {"id":"w02429","w":"finance","pos":["n","v"],"ph":"/ˈfaɪnæns/","cefr":"B1","kr":["재정","금융"],"ex":[{"en":"She studied finance at university.","ko":"그녀는 대학에서 금융을 공부했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"funding","ko":"자금 조달","reason":"동의어 — 자금 개념"},{"w":"banking","ko":"은행업","reason":"동의어 — 금융 분야"},{"w":"budget","ko":"예산","reason":"시나리오 — 재정 관리"}],"collocBest":[{"en":"personal finance","ko":"개인 재정"},{"en":"finance department","ko":"재무 부서"}]},"nuance":{"koSimple":"돈을 다루고 굴리는 일.","whenToUse":"은행·투자·개인 재정 이야기할 때."},"krDetail":[{"ko":"재정","explain":"돈을 관리하고 쓰는 일"},{"ko":"금융","explain":"돈이 오가는 일과 관련된 것"}],"usageExamples":[{"en":"The company managed to finance the entire project without any external loans.","ko":"그 회사는 외부 대출 없이 전체 프로젝트에 자금을 조달할 수 있었다."},{"en":"Her research on personal finance has helped many families save more money.","ko":"개인 재정에 관한 그녀의 연구는 많은 가족들이 돈을 더 절약하는 데 도움이 되었다."}],"grammarNote":"finance는 명사(재정)와 타동사(자금을 조달하다) 둘 다로 쓰인다. 수동태 be financed by도 자주 출제된다.","grammarQuiz":[{"sentence":"The new hospital construction _____ _____ by a combination of government grants and private donations.","ko":"그 새로운 병원 건설은 정부 보조금과 민간 기부금의 조합에 의해 자금이 조달되었다.","answer":["was","financed"],"hint":"수동태 be + p.p."}]},
    {"id":"w02430","w":"financial","pos":["adj"],"ph":"/fɪˈnænʃl/","cefr":"B1","kr":["재정적인","금융의"],"ex":[{"en":"The company is facing financial difficulties.","ko":"그 회사는 재정적인 어려움에 직면해 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"crisis","ko":"위기","reason":"콜로 — 금융 위기"},{"w":"monetary","ko":"화폐의","reason":"동의어 — 돈 관련"},{"w":"economic","ko":"경제의","reason":"동의어 — 경제 관련"}],"collocBest":[{"en":"financial support","ko":"재정적 지원"},{"en":"financial crisis","ko":"금융 위기"}]},"nuance":{"koSimple":"돈과 관련된, 재정적인.","whenToUse":"지원·위기·상황을 '돈 문제'로 말할 때."},"krDetail":[{"ko":"재정적인","explain":"돈을 다루고 쓰는 일과 관련된"},{"ko":"금융의","explain":"돈이 오가는 일에 관한"}],"usageExamples":[{"en":"Many students receive financial support from their parents throughout college.","ko":"많은 학생들이 대학 시절 내내 부모로부터 재정적 지원을 받는다."},{"en":"The 2008 financial crisis affected millions of families around the world.","ko":"2008년 금융 위기는 전 세계 수백만 가족에게 영향을 미쳤다."}],"grammarNote":"financial과 fiscal, monetary는 뜻이 비슷하지만 문맥이 다르다. financial은 가장 넓은 의미로 쓰인다. 부사형은 financially이다.","grammarQuiz":[{"sentence":"The startup was _____ struggling last year, but it has recovered _____ quickly since then.","ko":"그 스타트업은 작년에 재정적으로 어려움을 겪었지만, 그 이후로 매우 빠르게 회복했다.","answer":["financially","very"],"hint":"형용사→부사 변환 + 부사 수식"}]},
    {"id":"w02437","w":"fingerprint","pos":["n"],"ph":"/ˈfɪŋɡərprɪnt/","cefr":"B1","kr":["지문"],"ex":[{"en":"The police found fingerprints at the scene.","ko":"경찰이 현장에서 지문을 발견했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"scanner","ko":"스캐너","reason":"콜로 — 지문 스캐너"},{"w":"finger","ko":"손가락","reason":"동의어 — 합성어 구성 요소"},{"w":"identity","ko":"신원","reason":"시나리오 — 지문 신원 확인"}],"collocBest":[{"en":"fingerprint scanner","ko":"지문 스캐너"}]},"nuance":{"koSimple":"손가락 끝에 남는 고유한 무늬.","whenToUse":"수사·잠금 해제·신원 확인에."},"krDetail":[{"ko":"지문","explain":"손가락 끝의 살에 새겨진 무늬"}],"usageExamples":[{"en":"The detective carefully collected fingerprints from the surface of the broken window.","ko":"그 형사는 깨진 창문 표면에서 지문을 조심스럽게 채취했다."},{"en":"Modern smartphones can be unlocked by using the owner's fingerprint or face scan.","ko":"현대의 스마트폰은 소유자의 지문이나 얼굴 스캔을 사용해 잠금 해제될 수 있다."}],"grammarNote":"fingerprint는 가산명사이다. 학생들이 fingerprints의 복수형을 자주 빠뜨린다. 여러 개를 채취할 때는 반드시 복수형으로 쓴다.","grammarQuiz":[{"sentence":"The police officers found several clear _____ _____ the murder weapon and sent them to the forensic lab.","ko":"경찰관들은 살인 무기에서 여러 개의 선명한 지문을 발견하여 그것들을 법의학 연구소로 보냈다.","answer":["fingerprints","on"],"hint":"복수 가산명사 + 전치사"}]},
    {"id":"w02442","w":"fireplace","pos":["n"],"ph":"/ˈfaɪərpleɪs/","cefr":"B1","kr":["벽난로"],"ex":[{"en":"The family sat around the fireplace on cold winter evenings.","ko":"가족들은 추운 겨울 저녁에 벽난로 주위에 앉았다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"hearth","ko":"난로","reason":"동의어 — 벽난로 개념"},{"w":"chimney","ko":"굴뚝","reason":"시나리오 — 벽난로와 굴뚝"},{"w":"cozy","ko":"아늑한","reason":"시나리오 — 벽난로 옆의 분위기"}],"collocBest":[{"en":"stone fireplace","ko":"돌 벽난로"},{"en":"by the fireplace","ko":"벽난로 옆에"}]},"nuance":{"koSimple":"집 안에서 장작을 태우는 벽난로.","whenToUse":"겨울 거실·산장 분위기를 그릴 때."},"krDetail":[{"ko":"벽난로","explain":"방 안 벽에 만들어 놓고 불을 피우는 곳"}],"usageExamples":[{"en":"The family gathered around the warm fireplace to share stories on Christmas Eve.","ko":"가족은 크리스마스 이브에 이야기를 나누기 위해 따뜻한 벽난로 주위에 모였다."},{"en":"A crackling fire in the stone fireplace made the old cottage feel cozy.","ko":"돌 벽난로에서 타닥거리는 불이 그 오래된 별장을 아늑하게 느끼게 했다."}],"grammarNote":"by the fireplace(벽난로 옆에), in front of the fireplace(벽난로 앞에) 같은 위치 표현에서 정관사 the가 필요하다. 학생들이 자주 빠뜨린다.","grammarQuiz":[{"sentence":"The tired travelers sat quietly _____ the fireplace, warming _____ hands after the long winter hike.","ko":"지친 여행자들은 긴 겨울 하이킹 후 손을 녹이며 벽난로 옆에 조용히 앉아 있었다.","answer":["by","their"],"hint":"위치 전치사 + 소유격"}]},
    {"id":"w02482","w":"flawless","pos":["adj"],"ph":"/ˈflɔːləs/","cefr":"B1","kr":["흠 없는","완벽한"],"ex":[{"en":"Her performance was flawless.","ko":"그녀의 공연은 흠 없이 완벽했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"perfect","ko":"완벽한","reason":"동의어 — 흠 없음"},{"w":"impeccable","ko":"나무랄 데 없는","reason":"동의어 — 완벽한 상태"},{"w":"flawed","ko":"결함이 있는","reason":"반의어 — flawless 반대"}],"collocBest":[{"en":"flawless performance","ko":"완벽한 공연"},{"en":"flawless skin","ko":"흠 없는 피부"}]},"nuance":{"koSimple":"흠 하나 없이 완벽한.","whenToUse":"공연·피부·발음을 극찬할 때."},"krDetail":[{"ko":"흠 없는","explain":"잘못된 부분이 하나도 없는"},{"ko":"완벽한","explain":"어디 하나 부족함 없이 완전한"}],"usageExamples":[{"en":"The young dancer gave a flawless performance in front of the entire audience.","ko":"그 어린 무용수는 전체 관객 앞에서 완벽한 공연을 보여줬다."},{"en":"Her flawless English impressed everyone at the international business conference.","ko":"그녀의 완벽한 영어는 국제 비즈니스 회의에서 모든 사람에게 감명을 주었다."}],"grammarNote":"-less 접미사가 붙은 형용사의 부사형은 -lessly이다. 학생들이 flawlessly와 flawless를 자주 혼동한다.","grammarQuiz":[{"sentence":"The pianist performed the difficult concerto _____ _____ front of the international judges last night.","ko":"그 피아니스트는 지난밤 국제 심사위원들 앞에서 그 어려운 협주곡을 완벽하게 연주했다.","answer":["flawlessly","in"],"hint":"형용사→부사 변환 + 위치 전치사"}]},
    {"id":"w02490","w":"flexibility","pos":["n"],"ph":"/ˌfleksɪˈbɪlɪti/","cefr":"B1","kr":["유연성","융통성"],"ex":[{"en":"The job offers great flexibility.","ko":"그 직업은 높은 유연성을 제공한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"adaptability","ko":"적응력","reason":"동의어 — 유연한 대응"},{"w":"rigidity","ko":"경직성","reason":"반의어 — 유연성의 반대"},{"w":"versatility","ko":"다재다능","reason":"동의어 — 다방면 대응"}],"collocBest":[{"en":"offer flexibility","ko":"유연성을 제공하다"},{"en":"mental flexibility","ko":"정신적 유연성"}]},"nuance":{"koSimple":"잘 구부러지고 상황에 맞추는 성질.","whenToUse":"일정·몸·사고방식의 융통성에."},"krDetail":[{"ko":"유연성","explain":"쉽게 굽히거나 바꿀 수 있는 성질"},{"ko":"융통성","explain":"상황에 맞게 잘 바꿀 수 있는 성질"}],"usageExamples":[{"en":"Yoga classes can improve both your physical flexibility and your mental well-being.","ko":"요가 수업은 신체적 유연성과 정신적 웰빙 모두를 향상시킬 수 있다."},{"en":"The new work policy offers flexibility to employees who need to balance family responsibilities.","ko":"그 새로운 근무 정책은 가족 책임과 균형을 맞춰야 하는 직원들에게 유연성을 제공한다."}],"grammarNote":"flexibility는 보통 불가산명사이다. 학생들이 a flexibility, flexibilities처럼 관사·복수형을 붙이는 실수를 자주 한다.","grammarQuiz":[{"sentence":"Regular stretching exercises _____ great flexibility to your muscles _____ helping you avoid injuries.","ko":"규칙적인 스트레칭 운동은 근육에 큰 유연성을 주고 당신이 부상을 피하도록 도와준다.","answer":["give","while"],"hint":"복수 주어 동사 + 접속사"}]},
    {"id":"w02491","w":"flexible","pos":["adj"],"ph":"/ˈfleksɪbl/","cefr":"B1","kr":["유연한","융통성 있는"],"ex":[{"en":"A flexible schedule allows workers to manage their time.","ko":"유연한 일정은 직원들이 시간을 관리할 수 있게 해준다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"schedule","ko":"일정","reason":"콜로 — 유연한 일정"},{"w":"adaptable","ko":"적응 가능한","reason":"동의어 — 변화에 유연"},{"w":"rigid","ko":"경직된","reason":"반의어 — 유연함의 반대"}],"collocBest":[{"en":"flexible schedule","ko":"유연한 일정"},{"en":"flexible approach","ko":"융통성 있는 접근"}]},"nuance":{"koSimple":"잘 구부러지고 상황에 맞출 수 있는.","whenToUse":"시간·규칙·태도가 유연할 때."},"krDetail":[{"ko":"유연한","explain":"잘 굽어지고 잘 변할 수 있는"},{"ko":"융통성 있는","explain":"상황에 따라 잘 맞춰 바꿀 수 있는"}],"usageExamples":[{"en":"The company offers a flexible schedule for parents with young children at home.","ko":"그 회사는 집에 어린 자녀가 있는 부모들에게 유연한 일정을 제공한다."},{"en":"A flexible approach to problem-solving usually leads to more creative and effective solutions.","ko":"문제 해결에 대한 유연한 접근은 보통 더 창의적이고 효과적인 해결책으로 이어진다."}],"grammarNote":"flexible의 부사형은 flexibly이다. 학생들이 flexible를 부사 자리에 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The manager responded _____ to the sudden changes _____ the project deadline last Friday morning.","ko":"그 매니저는 지난 금요일 아침 프로젝트 마감일의 갑작스러운 변경에 유연하게 대응했다.","answer":["flexibly","in"],"hint":"형용사→부사 변환 + 전치사"}]},

    {"id":"w02532","w":"fond","pos":["adj"],"ph":"/fɒnd/","cefr":"B1","kr":["좋아하는","애정 어린"],"ex":[{"en":"She is very fond of her cat.","ko":"그녀는 자신의 고양이를 매우 좋아한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"affectionate","ko":"다정한","reason":"애정 어린 감정 동의어"},{"w":"memory","ko":"기억","reason":"fond memory 콜로케이션"}],"collocBest":[{"en":"fond of","ko":"~을 좋아하는"},{"en":"fond memory","ko":"아름다운 기억"}]},"nuance":{"koSimple":"애정 어려 무언가를 좋아하는 마음","whenToUse":"오래도록 정든 대상에 대한 애정을 표현할 때"},"krDetail":[{"ko":"좋아하는","explain":"누구나 무엇을 마음에 들어 하는"},{"ko":"애정 어린","explain":"따뜻한 마음이 담긴"}],"usageExamples":[{"en":"She is very fond of her younger sister and protects her always.","ko":"그녀는 여동생을 매우 좋아하고 항상 그녀를 보호한다."},{"en":"The grandmother gave a fond smile to her grandchildren at the party.","ko":"할머니는 파티에서 손주들에게 애정 어린 미소를 지었다."}],"grammarNote":"fond는 서술적 용법에서 be fond of + 명사/동명사 형태로 쓰이며, 한정적 용법에서는 fond memory처럼 명사 앞에 놓인다.","grammarQuiz":[{"sentence":"My little brother is very _____ _____ chocolate ice cream after dinner.","ko":"내 남동생은 저녁 식사 후에 초콜릿 아이스크림을 매우 좋아한다.","answer":["fond","of"],"hint":"형용사 + 전치사"},{"sentence":"I have _____ _____ of our summer vacation at the beach house.","ko":"나는 해변 별장에서 보낸 여름휴가에 대한 아름다운 기억이 있다.","answer":["fond","memories"],"hint":"형용사 + 명사"}]},

    {"id":"w02550","w":"foreground","pos":["n","v"],"ph":"/ˈfɔːɡraʊnd/","cefr":"B1","kr":["전경","앞쪽"],"ex":[{"en":"The figure stands in the foreground.","ko":"그 인물은 전경에 서 있다."}],"mnemonic":{"soundHint":null,"story":"fore(앞) + ground(땅) → 그림의 앞쪽 땅, 전경","hintConfidence":3},"pairs":{"buddyWords":[{"w":"front","ko":"앞부분","reason":"앞쪽 위치 동의어"},{"w":"background","ko":"배경","reason":"전경의 직접 반의어"}],"collocBest":[{"en":"in the foreground","ko":"전경에"},{"en":"foreground image","ko":"전경 이미지"}]},"nuance":{"koSimple":"그림·사진의 앞쪽 부분","whenToUse":"시각적 장면의 전면을 지칭할 때"},"krDetail":[{"ko":"전경","explain":"그림이나 사진에서 앞쪽에 보이는 부분"},{"ko":"앞쪽","explain":"가장 가까이 있어 눈에 잘 띄는 자리"}],"usageExamples":[{"en":"The artist placed a colorful flower in the foreground of the painting.","ko":"그 화가는 그림의 전경에 다채로운 꽃 한 송이를 배치했다."},{"en":"In the foreground, a small child was playing with a red balloon.","ko":"전경에는 어린아이가 빨간 풍선을 가지고 놀고 있었다."}],"grammarNote":"foreground는 주로 in the foreground 형태의 전치사구로 쓰이며, 반대말 in the background와 짝을 이루어 위치를 설명한다.","grammarQuiz":[{"sentence":"The photographer captured a lovely dog _____ _____ _____ of the shot.","ko":"사진작가는 촬영 전경에 사랑스러운 개를 담았다.","answer":["in","the","foreground"],"hint":"전치사구"},{"sentence":"The mountains stood tall behind the _____ _____ of green fields.","ko":"산들이 초록 들판의 전경 뒤로 우뚝 서 있었다.","answer":["foreground","image"],"hint":"명사 + 명사"}]},
    {"id":"w02565","w":"forgive","pos":["v"],"ph":"/fərˈɡɪv/","cefr":"B1","kr":["용서하다","사면하다"],"ex":[{"en":"She finally forgave him for his mistakes.","ko":"그녀는 마침내 그의 실수를 용서했다."}],"mnemonic":{"soundHint":null,"story":"for(위해) + give(주다) → 상대를 위해 마음을 내주다, 용서하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pardon","ko":"용서하다","reason":"용서 동의어"},{"w":"blame","ko":"비난하다","reason":"용서의 반의어"}],"collocBest":[{"en":"forgive and forget","ko":"용서하고 잊다"},{"en":"forgive someone","ko":"누군가를 용서하다"}]},"nuance":{"koSimple":"상대의 잘못을 마음에서 놓아주는 것","whenToUse":"용서하고 관계를 회복하려 할 때"},"krDetail":[{"ko":"용서하다","explain":"잘못한 사람을 나무라지 않고 받아들이다"},{"ko":"사면하다","explain":"죄나 벌을 없던 일로 해주다"}],"usageExamples":[{"en":"She forgave her friend for forgetting about her birthday party.","ko":"그녀는 친구가 자신의 생일 파티를 잊은 것을 용서했다."},{"en":"The teacher was forgiven by her students for the strict rules.","ko":"그 선생님은 엄격한 규칙에 대해 학생들에게 용서받았다."}],"grammarNote":"forgive는 forgive + 사람 + for + 동명사/명사 형태로 쓰이며, 수동태 be forgiven by 사람 for 이유 형태도 자주 등장한다.","grammarQuiz":[{"sentence":"Please _____ _____ _____ being late to the important meeting today.","ko":"오늘 중요한 회의에 늦은 것에 대해 저를 용서해 주세요.","answer":["forgive","me","for"],"hint":"동사 + 목적어 + 전치사"},{"sentence":"He _____ _____ _____ his sister for breaking his favorite toy.","ko":"그는 자기가 가장 좋아하는 장난감을 부순 여동생을 용서했다.","answer":["has","forgiven"],"hint":"현재완료"}]},

    {"id":"w02600","w":"fracture","pos":["n","v"],"ph":"/ˈfræktʃər/","cefr":"B1","kr":["골절","균열"],"ex":[{"en":"She suffered a fracture in her leg.","ko":"그녀는 다리에 골절을 입었다."}],"mnemonic":{"soundHint":null,"story":"fract(부수다) 어근 → 뼈가 부서진 상태, 골절·균열","hintConfidence":3},"pairs":{"buddyWords":[{"w":"break","ko":"부서지다","reason":"부러짐 동의어"},{"w":"crack","ko":"금이 가다","reason":"균열 동의어"}],"collocBest":[{"en":"bone fracture","ko":"골절"},{"en":"hairline fracture","ko":"미세 균열"}]},"nuance":{"koSimple":"뼈나 물체가 깨지듯 부러진 것","whenToUse":"의학·물리적 파열을 말할 때"},"krDetail":[{"ko":"골절","explain":"뼈가 부러지거나 금이 간 상태"},{"ko":"균열","explain":"단단한 물건에 갈라진 자국"}],"usageExamples":[{"en":"The doctor fractured his patient's arm during the difficult surgery.","ko":"그 의사는 어려운 수술 중에 환자의 팔을 부러뜨렸다."},{"en":"His leg was fractured in three places during the skiing accident.","ko":"그의 다리는 스키 사고 중에 세 곳이 부러졌다."}],"grammarNote":"fracture는 명사와 동사 모두로 쓰이며, 동사로는 타동사(뼈를 부러뜨리다)와 자동사(부러지다) 둘 다 가능하다.","grammarQuiz":[{"sentence":"The old man _____ his hip after slipping on the icy sidewalk.","ko":"그 노인은 얼음이 낀 인도에서 미끄러진 후 고관절을 부러뜨렸다.","answer":["fractured"],"hint":"과거시제 타동사"},{"sentence":"Her wrist _____ _____ during the intense basketball game yesterday.","ko":"그녀의 손목이 어제 격렬한 농구 경기 중에 부러졌다.","answer":["was","fractured"],"hint":"수동태"}]},

    {"id":"w02664","w":"furious","pos":["adj"],"ph":"/ˈfjʊəriəs/","cefr":"B1","kr":["격분한","몹시 화난"],"ex":[{"en":"She was furious when she found out the truth.","ko":"그녀는 진실을 알았을 때 격분했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"enraged","ko":"격노한","reason":"동의어(강한 분노)"},{"w":"calm","ko":"차분한","reason":"반의어(격분 vs 침착)"},{"w":"angry","ko":"화난","reason":"정도 차이 동의어(고1 익숙)"}],"collocBest":[{"en":"absolutely furious","ko":"완전히 격분한"},{"en":"furious argument","ko":"격렬한 논쟁"}]},"nuance":{"koSimple":"화가 폭발할 정도로 격렬한.","whenToUse":"angry보다 훨씬 강한 분노를 표현할 때."},"krDetail":[{"ko":"격분한","explain":"몹시 성이 나서 어쩔 줄 모르는"},{"ko":"몹시 화난","explain":"속에서 불길이 치솟을 만큼 성난"}],"usageExamples":[{"en":"The coach was furious with the players after the loss.","ko":"코치는 패배 후 선수들에게 몹시 화가 났다."},{"en":"Fans grew furious when the concert was canceled again.","ko":"팬들은 콘서트가 또 취소되자 격분했다."}],"grammarNote":"furious는 사람의 감정을 나타낼 때 with + 사람, at/about + 사물/상황 형태로 쓴다. 학생들은 furious to somebody처럼 to를 쓰는 오답이 잦다.","grammarQuiz":[{"sentence":"My parents were _____ _____ me for coming home so late.","ko":"부모님은 내가 너무 늦게 집에 온 것에 대해 몹시 화가 났다.","answer":["furious","with"],"hint":"형용사 + 사람 앞 전치사"}]},
    {"id":"w02713","w":"general","pos":["adj","n"],"ph":"/ˈdʒenərəl/","cefr":"B1","kr":["일반적인","장군"],"ex":[{"en":"In general, people prefer comfort.","ko":"일반적으로 사람들은 편안함을 선호한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"common","ko":"공통의","reason":"동의어(일반적인)"},{"w":"specific","ko":"구체적인","reason":"반의어(일반 vs 구체)"},{"w":"overall","ko":"전반적인","reason":"동의어(전체)"}],"collocBest":[{"en":"in general","ko":"일반적으로"},{"en":"general public","ko":"일반 대중"}]},"nuance":{"koSimple":"특별하지 않고 전반에 걸친.","whenToUse":"'대체로·일반적으로'라는 큰 그림에."},"krDetail":[{"ko":"일반적인","explain":"특별하지 않고 두루 그러한"},{"ko":"장군","explain":"군대에서 가장 높은 지휘관"}],"usageExamples":[{"en":"The general opinion is that the plan needs more work.","ko":"일반적인 의견은 그 계획에 손질이 더 필요하다는 것이다."},{"en":"In general, students prefer group work over lectures.","ko":"일반적으로 학생들은 강의보다 그룹 활동을 선호한다."}],"grammarNote":"in general은 '일반적으로'라는 관용구로, generally와 바꿔 쓸 수 있다. 학생들은 in the general처럼 정관사를 넣는 실수를 자주 한다.","grammarQuiz":[{"sentence":"_____ _____, exercise is good for both body and mind.","ko":"일반적으로 운동은 몸과 마음 모두에 좋다.","answer":["In","general"],"hint":"관용구 (전치사 + 명사)"}]},
    {"id":"w02715","w":"generally","pos":["adv"],"ph":"/ˈdʒenərəli/","cefr":"B1","kr":["일반적으로","보통"],"ex":[{"en":"She generally wakes up early.","ko":"그녀는 보통 일찍 일어난다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"usually","ko":"보통","reason":"동의어(빈도 표현)"},{"w":"rarely","ko":"드물게","reason":"반의어(빈도 대비)"}],"collocBest":[{"en":"generally speaking","ko":"일반적으로 말해서"},{"en":"generally accepted","ko":"일반적으로 받아들여지는"}]},"nuance":{"koSimple":"예외 없이 대부분의 경우에.","whenToUse":"평소 습관·일반적 사실을 말할 때."},"krDetail":[{"ko":"일반적으로","explain":"대체로 두루 그렇게"},{"ko":"보통","explain":"특별한 경우가 아니라면 흔히"}],"usageExamples":[{"en":"Cats generally sleep more than sixteen hours a day.","ko":"고양이는 보통 하루에 16시간 이상 잔다."},{"en":"This theory is generally accepted by most scientists.","ko":"이 이론은 대부분의 과학자들에 의해 일반적으로 받아들여진다."}],"grammarNote":"generally는 빈도부사처럼 be동사 뒤, 일반동사 앞, 조동사 뒤에 위치한다. 학생들은 문장 맨 뒤에만 놓는 경향이 있는데 문장 앞·중간도 자연스럽다.","grammarQuiz":[{"sentence":"_____ _____, people work harder when they feel respected.","ko":"일반적으로 말해서, 사람들은 존중받을 때 더 열심히 일한다.","answer":["Generally","speaking"],"hint":"분사구문 관용 표현"}]},
    {"id":"w02717","w":"generation","pos":["n"],"ph":"/ˌdʒenəˈreɪʃn/","cefr":"B1","kr":["세대","발생"],"ex":[{"en":"Each generation faces unique challenges.","ko":"각 세대는 고유한 도전에 직면한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"era","ko":"시대","reason":"동의어(시대·세대)"},{"w":"gap","ko":"격차","reason":"시나리오 콜로(generation gap)"}],"collocBest":[{"en":"younger generation","ko":"젊은 세대"},{"en":"generation gap","ko":"세대 차이"}]},"nuance":{"koSimple":"비슷한 시기 태어난 사람들의 집단.","whenToUse":"세대 차이·젊은/기성 세대 이야기."},"krDetail":[{"ko":"세대","explain":"비슷한 나이대의 사람들 모임"},{"ko":"발생","explain":"새롭게 만들어져 나옴"}],"usageExamples":[{"en":"The younger generation prefers streaming over cable TV.","ko":"젊은 세대는 케이블 TV보다 스트리밍을 선호한다."},{"en":"This tradition has been passed down through generations.","ko":"이 전통은 여러 세대를 거쳐 전해져 내려왔다."}],"grammarNote":"generation은 가산명사로 a/the generation, generations로 쓴다. '세대에서 세대로'는 from generation to generation처럼 무관사·단수로 쓴다. 학생들은 from the generation to the generation처럼 쓰는 오답이 많다.","grammarQuiz":[{"sentence":"The story was passed down _____ _____ generation.","ko":"그 이야기는 세대를 거쳐 전해져 내려왔다.","answer":["from","generation"],"hint":"전치사 + 무관사 명사"}]},
    {"id":"w02720","w":"generous","pos":["adj"],"ph":"/ˈdʒenərəs/","cefr":"B1","kr":["관대한","너그러운"],"ex":[{"en":"She is generous with her time.","ko":"그녀는 시간을 아낌없이 쓴다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"kind","ko":"친절한","reason":"동의어(마음 넓음)"},{"w":"stingy","ko":"인색한","reason":"반의어(관대 vs 인색)"},{"w":"donate","ko":"기부하다","reason":"시나리오 콜로(관대한 기부)"}],"collocBest":[{"en":"generous donation","ko":"아낌없는 기부"},{"en":"generous offer","ko":"관대한 제안"}]},"nuance":{"koSimple":"아낌없이 베푸는 마음이 큰.","whenToUse":"기부·시간·마음을 후하게 쓸 때."},"krDetail":[{"ko":"관대한","explain":"잘못을 너그럽게 받아들이는"},{"ko":"너그러운","explain":"마음이 넓고 아까워하지 않는"}],"usageExamples":[{"en":"Her grandmother was generous with both time and money.","ko":"그녀의 할머니는 시간과 돈 모두에 너그러우셨다."},{"en":"It was very generous of you to help our team.","ko":"우리 팀을 도와주다니 너는 참 너그러웠다."}],"grammarNote":"'It is + generous + of + 사람 + to부정사' 구문에서 사람의 성품이 나올 때는 of를 쓴다(for가 아니라). 학생들은 It is generous for you to help처럼 for로 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"It was very _____ _____ him to share his lunch.","ko":"점심을 나누다니 그는 참 너그러웠다.","answer":["generous","of"],"hint":"성품 형용사 + 전치사"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));
    tone({type:"triangle", freq:2093.00, dur:.4, vol:.18, t0:.55}); // 종소리 C7
  },
  // jp-chime-asc: 800→1000→1200 3단
  streak(){
    [880, 1100, 1320].forEach((f,i)=> tone({type:"sine", freq:f, dur:.12, vol:.18, t0:i*.07}));
  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine
  fireworks(){
    noise({dur:.18, vol:.22, t0:0, hp:600});
    for(let i=0;i<6;i++){
      tone({type:"sine", freq:1500-i*180, dur:.10, vol:.10, t0:.05+i*.05});
    }
  },
  // arcade-flip: 화이트 노이즈 30ms
  cardFlip(){
    noise({dur:.04, vol:.10, hp:2000});
  },
  // jp-coin-payout: 2000Hz square 8회 빠르게
  coinDrop(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:1800+Math.random()*600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-slot-spin: 600Hz square 50ms × 8
  spinReel(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-bigwin: 도-미-솔-도-미-솔-도(고)-도(고) 8단
  bigWin(){
    const notes = [523.25,659.25,783.99,1046.50,1318.51,1567.98,2093.00,2637.02];
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.18, vol:.22, t0:i*.10}));
    tone({type:"triangle", freq:2637.02, dur:.6, vol:.20, t0:.85});
    // coins
    for(let i=0;i<14;i++){
      tone({type:"square", freq:1800+Math.random()*800, dur:.04, vol:.08, t0:.8+i*.04});
    }
  },
  type(){
    tone({type:"square", freq:1500, dur:.02, vol:.05});
  },
  // ── 심화 90%+ 전용 : 명랑·화려·인상 깊은 팡파레 조합 ──
  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단
  // 2) 크리스탈 아르페지오 8음 (C5→E7)
  // 3) 종·코인·환호 노이즈
  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [
      { t:0.00, notes:[261.63, 329.63, 392.00] },   // C major (C4 E4 G4)
      { t:0.16, notes:[349.23, 440.00, 523.25] },   // F major (F4 A4 C5)
      { t:0.32, notes:[392.00, 493.88, 587.33] },   // G major (G4 B4 D5)
      { t:0.48, notes:[523.25, 659.25, 783.99] }    // C major 옥타브 (C5 E5 G5) — 절정
    ];
    chords.forEach(ch => {
      ch.notes.forEach(f => {
        tone({ type:"sawtooth", freq:f, dur:.22, vol:.12, atk:.008, t0:ch.t });
        // 부드러운 sine 배음 살짝 얹기
        tone({ type:"sine",     freq:f*2, dur:.20, vol:.05, t0:ch.t });
      });
    });
    // 브라스 절정 뒤 강타 (C5 saw 길게)
    tone({ type:"sawtooth", freq:523.25, dur:.35, vol:.14, t0:.48 });

    // 2) 크리스탈 아르페지오 8음 (도미솔도 두 옥타브)
    const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00, 2637.02];
    arp.forEach((f,i) => {
      tone({ type:"sine",     freq:f, dur:.15, vol:.20, atk:.003, t0:.75 + i*.055 });
      tone({ type:"triangle", freq:f*2, dur:.10, vol:.08, t0:.75 + i*.055 });
    });

    // 3) 절정 종소리 (E7 · G7 벨)
    tone({ type:"triangle", freq:2637.02, dur:.65, vol:.20, t0:1.22 });
    tone({ type:"sine",     freq:3135.96, dur:.45, vol:.14, t0:1.30 });
    tone({ type:"triangle", freq:2093.00, dur:.55, vol:.16, t0:1.40 });

    // 4) 코인·불꽃 노이즈 (환호 느낌)
    for(let i=0;i<18;i++){
      tone({ type:"square", freq:1900+Math.random()*900, dur:.035, vol:.06, t0:1.25 + i*.038 });
    }
    noise({ dur:.15, vol:.14, hp:800, t0:1.20 });
  }
};

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

  document.querySelectorAll(".grade-btn").forEach(btn=>{

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

/* ============================================================
   QUIZ (15문항)
   ============================================================ */
const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

  if(state.quizIdx >= state.quizPool.length){
    finishSession();

  state.quizAnswered = false;
  state.quizCurrent = state.quizPool[state.quizIdx];

  const { word, mode } = state.quizCurrent;

    "meaning-mcq":"영→한 의미",

  let answerHTML = "";

    answerHTML = `
      <div class="choices" id="choices">

      </div>`;
  } else if(mode === "word-mcq"){
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻을 보고 영어 단어를 입력하세요</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "listening"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">발음을 듣고 단어를 입력하세요</div>
        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;
    const hint = firstCharsHint(c.en);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻에 맞는 <b>콜로케이션</b>을 영어로 쓰세요</div>
        <div class="qkr">${escape(c.ko)}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${escape(hint)}">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    // 문장 렌더 — 빈칸 위치에 인풋 (정답의 첫 글자 placeholder 힌트)
    const sentHTML = tokens.map((t, i) => {
      const bIdx = blankIdxs.indexOf(i);
      if(bIdx >= 0){
        const ans = t.text;
        const size = Math.max(4, Math.min(14, ans.length + 2));
        const hint = firstCharsHint(ans);
        return `<input type="text" class="cloze-input" data-blank-idx="${bIdx}" data-ans="${escape(ans)}" size="${size}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${escape(hint)}">`;

      return escape(t.text);
    }).join("");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt">
        <div class="label">해석에 맞게 <b>${blankIdxs.length}개 빈칸</b>을 채우세요</div>

    const ansList = Array.isArray(quiz.answer) ? quiz.answer : [quiz.answer];

        <div class="qkr">${escape(quiz.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
      </div>`;
    answerHTML = `
      <div class="input-box only-btn">

  main.innerHTML = `
