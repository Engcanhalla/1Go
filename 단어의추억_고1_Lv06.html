<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Lv.6</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

    {"id":"w02249","w":"explode","pos":["v"],"ph":"/ɪkˈspləʊd/","cefr":"B1","kr":["폭발하다","급증하다"],"ex":[{"en":"The bomb exploded downtown.","ko":"폭탄이 시내에서 폭발했다."}],"mnemonic":{"soundHint":"익스플로드","story":"'ex(밖으로) + plode(터지다)' → 밖으로 터지다, 폭발하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"blast","ko":"폭발","reason":"동의어 - 강한 폭발"},{"w":"burst","ko":"터지다","reason":"동의어 - 갑작스러운 터짐"},{"w":"explosion","ko":"폭발","reason":"파생 관계 - 명사형"}],"collocBest":[]},"nuance":{"koSimple":"쾅! 하고 터지다.","whenToUse":"폭탄·감정·수치가 갑자기 터질 때."},"krDetail":[{"ko":"폭발하다","explain":"터져서 세게 튀다"},{"ko":"급증하다","explain":"빠르게 크게 늘어나다"}],"usageExamples":[{"en":"The angry father exploded with rage at the news.","ko":"그 화난 아버지는 그 소식에 분노로 폭발했다."},{"en":"The city's population has exploded over the past decade.","ko":"그 도시의 인구는 지난 십 년 동안 급증했다."}],"grammarNote":"explode는 자동사로 쓰이므로 뒤에 목적어가 오지 않는다. '~에 폭발적으로 반응하다'는 explode with/in + 감정 명사(anger, laughter 등)로 표현한다.","grammarQuiz":[{"sentence":"The old bomb might _____ if you touch it carelessly.","ko":"그 오래된 폭탄은 네가 부주의하게 만지면 폭발할지도 모른다.","answer":["explode"],"hint":"조동사 might 뒤이므로 동사 원형, 자동사"},{"sentence":"The audience _____ into laughter at the comedian's joke.","ko":"그 청중은 그 코미디언의 농담에 웃음을 터뜨렸다.","answer":["exploded"],"hint":"과거시제 자동사, into와 함께 '~을 터뜨리다'"}]},

    {"id":"w02266","w":"extend","pos":["v"],"ph":"/ɪkˈstɛnd/","cefr":"B1","kr":["연장하다","확장하다"],"ex":[{"en":"They extended the deadline.","ko":"그들은 마감 기한을 연장했다."}],"mnemonic":{"soundHint":"익스텐드","story":"'ex(밖으로) + tend(뻗다)' → 밖으로 뻗어 연장하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expand","ko":"확장하다","reason":"동의어 - 크기·범위 확대"},{"w":"lengthen","ko":"길게 하다","reason":"동의어 - 시간·길이 연장"},{"w":"shorten","ko":"단축하다","reason":"반의어 - 연장 vs 단축"}],"collocBest":[]},"nuance":{"koSimple":"길이·기간을 더 길게 늘이다.","whenToUse":"마감·계약·손을 뻗어 늘일 때."},"krDetail":[{"ko":"연장하다","explain":"정해진 때보다 더 늘려 잡다"},{"ko":"확장하다","explain":"범위나 크기를 더 넓히다"}],"usageExamples":[{"en":"The teacher extended the deadline to next Monday morning.","ko":"그 선생님은 마감을 다음 주 월요일 아침으로 연장했다."},{"en":"The road extends for thirty kilometers along the coast.","ko":"그 도로는 해안을 따라 30킬로미터 뻗어 있다."}],"grammarNote":"extend는 타동사(~을 연장/확장하다)와 자동사(뻗어 있다) 모두로 쓰인다. extend an invitation to (~에게 초대장을 보내다)는 자주 나오는 관용 표현이다.","grammarQuiz":[{"sentence":"The company decided to _____ his contract for another year.","ko":"그 회사는 그의 계약을 1년 더 연장하기로 결정했다.","answer":["extend"],"hint":"to부정사 자리, 뒤에 목적어(his contract) 타동사"},{"sentence":"The Great Wall of China _____ for thousands of kilometers.","ko":"중국의 만리장성은 수천 킬로미터에 걸쳐 뻗어 있다.","answer":["extends"],"hint":"3인칭 단수 주어, 자동사 '뻗어 있다'"}]},
    {"id":"w02267","w":"extension","pos":["n"],"ph":"/ɪkˈstɛnʃən/","cefr":"B1","kr":["연장","확장","내선"],"ex":[{"en":"Request a deadline extension.","ko":"마감 연장을 요청하라."}],"mnemonic":{"soundHint":"익스텐션","story":"extend + -sion = 뻗은 것, 연장.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expansion","ko":"확장","reason":"동의어 - 범위 확대"},{"w":"prolongation","ko":"연장","reason":"동의어 - 시간 연장"},{"w":"extend","ko":"연장하다","reason":"파생 관계 - 동사형"}],"collocBest":[]},"nuance":{"koSimple":"늘려서 더해진 부분.","whenToUse":"기간 연장·건물 증축·전화 내선번호에."},"krDetail":[{"ko":"연장","explain":"정해진 때보다 더 늘려 잡음"},{"ko":"확장","explain":"범위나 크기를 더 넓힘"},{"ko":"내선","explain":"안에서 갈라 이은 전화선"}],"usageExamples":[{"en":"The teacher granted a two-week extension for the essay.","ko":"그 선생님은 그 에세이에 대해 2주간의 연장을 허락하셨다."},{"en":"A large extension was added to the old library building.","ko":"그 오래된 도서관 건물에 큰 확장 부분이 덧붙여졌다."}],"grammarNote":"extension은 셀 수 있는 명사로, 파일 확장자(file extension), 전화 내선번호(phone extension)의 뜻으로도 자주 쓰인다.","grammarQuiz":[{"sentence":"I asked my professor for an _____ on my final paper.","ko":"나는 내 기말 과제에 대해 교수님께 연장을 요청했다.","answer":["extension"],"hint":"an 뒤이므로 명사 형태"},{"sentence":"The library plans to _____ its opening hours next month.","ko":"그 도서관은 다음 달에 개관 시간을 연장할 계획이다.","answer":["extend"],"hint":"to부정사 자리, 뒤에 목적어가 있으므로 동사"}]},
    {"id":"w02269","w":"extent","pos":["n"],"ph":"/ɪkˈstɛnt/","cefr":"B1","kr":["정도","범위"],"ex":[{"en":"To some extent, she was right.","ko":"어느 정도 그녀가 옳았다."}],"mnemonic":{"soundHint":"익스텐트","story":"'ex(밖으로) + tent(뻗은 정도)' → 뻗어 나간 정도, 범위.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"degree","ko":"정도","reason":"동의어 - 정도·수준"},{"w":"scope","ko":"범위","reason":"동의어 - 미치는 범위"},{"w":"range","ko":"범위","reason":"동의어 - 대상의 범위"}],"collocBest":[]},"nuance":{"koSimple":"어느 만큼 미치는 정도.","whenToUse":"'to some extent(어느 정도)'처럼 정도를 나타낼 때."},"krDetail":[{"ko":"정도","explain":"어느 만큼의 크기나 세기"},{"ko":"범위","explain":"미치는 넓이"}],"usageExamples":[{"en":"To some extent, I agree with your opinion on this.","ko":"어느 정도까지는 나는 이것에 관한 너의 의견에 동의한다."},{"en":"The full extent of the damage is not yet known.","ko":"그 피해의 전체 범위는 아직 알려지지 않았다."}],"grammarNote":"extent는 셀 수 없는 명사이며 to some/a great/a large extent (어느/큰 정도까지) 형태로 자주 쓴다. to the extent that + 절 (~할 정도까지) 구문도 중요하다.","grammarQuiz":[{"sentence":"I agree with your idea to a certain _____ but not fully.","ko":"나는 어느 정도까지는 너의 생각에 동의하지만 완전히는 아니다.","answer":["extent"],"hint":"to a certain ___: 어느 정도까지 관용구"},{"sentence":"She was tired to the _____ that she couldn't stand up.","ko":"그녀는 일어설 수 없을 정도까지 피곤했다.","answer":["extent"],"hint":"to the ___ that + 절: ~할 정도까지 관용구"}]},
    {"id":"w02279","w":"extreme","pos":["adj","n"],"ph":"/ɪkˈstriːm/","cefr":"B1","kr":["극도의","극단"],"ex":[{"en":"Avoid extreme temperatures.","ko":"극도의 온도를 피하라."}],"mnemonic":{"soundHint":"익스트림","story":"'익스트림 스포츠'라는 외래어로 자주 접하며 '극한·극도의'를 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"intense","ko":"강렬한","reason":"동의어 - 강도가 극도로 높음"},{"w":"severe","ko":"심각한","reason":"동의어 - 정도가 심함"},{"w":"moderate","ko":"적당한","reason":"반의어 - 극단 vs 적당"}],"collocBest":[{"en":"extreme weather","ko":"극단적인 날씨"},{"en":"extreme sport","ko":"익스트림 스포츠"}]},"nuance":{"koSimple":"정도가 지나치게 심한.","whenToUse":"날씨·스포츠·의견이 극단적일 때."},"krDetail":[{"ko":"극도의","explain":"더는 나아갈 수 없는"},{"ko":"극단","explain":"맨 끝에 다다른 자리"}],"usageExamples":[{"en":"The climbers faced extreme cold near the top of Everest.","ko":"그 등반가들은 에베레스트 정상 근처에서 극도의 추위를 마주했다."},{"en":"He tends to go to extremes in everything he does.","ko":"그는 자신이 하는 모든 일에서 극단으로 치닫는 경향이 있다."}],"grammarNote":"extreme의 부사형은 extremely (극도로)이며 형용사·부사·다른 부사를 꾸민다. go to extremes (극단으로 치닫다)는 관용구로 복수형으로만 쓴다.","grammarQuiz":[{"sentence":"The desert has _____ temperatures during the day and night.","ko":"그 사막은 낮과 밤 동안 극단적인 기온을 지닌다.","answer":["extreme"],"hint":"명사(temperatures) 앞이므로 형용사 형태"},{"sentence":"The final exam was _____ difficult for most of the students.","ko":"그 기말시험은 대부분의 학생들에게 극도로 어려웠다.","answer":["extremely"],"hint":"형용사(difficult)를 꾸미므로 부사 형태"}]},
    {"id":"w02284","w":"eyelid","pos":["n"],"ph":"/ˈaɪlɪd/","cefr":"B1","kr":["눈꺼풀"],"ex":[{"en":"His eyelids felt heavy with sleep.","ko":"그의 눈꺼풀이 졸음으로 무거워졌다."}],"mnemonic":{"soundHint":"아이리드","story":"'eye(눈) + lid(뚜껑)' = 눈꺼풀.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eye","ko":"눈","reason":"연관어 - 눈꺼풀은 눈의 일부"},{"w":"blink","ko":"눈을 깜빡이다","reason":"연관어 - 눈꺼풀 동작"},{"w":"lash","ko":"속눈썹","reason":"연관어 - 눈꺼풀 주변 부위"}],"collocBest":[]},"nuance":{"koSimple":"눈을 덮는 살가죽.","whenToUse":"졸림·깜빡임 등 눈 동작을 묘사할 때."},"krDetail":[{"ko":"눈꺼풀","explain":"눈알을 덮는 살가죽"}],"usageExamples":[{"en":"The tired baby slowly closed her heavy eyelids again.","ko":"그 지친 아기는 무거운 눈꺼풀을 다시 천천히 감았다."},{"en":"His eyelids drooped as he became very sleepy tonight.","ko":"그가 오늘 밤 매우 졸려하면서 그의 눈꺼풀이 처졌다."}],"grammarNote":"eyelid는 신체 부위 명사로 셀 수 있으며, 눈은 두 개이므로 대개 복수형 eyelids로 쓴다. 관련 어휘 eyebrow(눈썹), eyelash(속눈썹)도 함께 기억한다.","grammarQuiz":[{"sentence":"Her _____ became heavy after studying late into the night.","ko":"그녀의 눈꺼풀은 밤늦게까지 공부한 후 무거워졌다.","answer":["eyelids"],"hint":"복수 주어로 사용(became), 두 눈 → 복수형"},{"sentence":"He rubbed his tired _____ with the back of his hand.","ko":"그는 손등으로 지친 눈꺼풀을 문질렀다.","answer":["eyelids"],"hint":"his 뒤 신체 부위, 두 눈 → 복수형"}]},
    {"id":"w02286","w":"fable","pos":["n"],"ph":"/ˈfeɪbəl/","cefr":"B1","kr":["우화","교훈 이야기"],"ex":[{"en":"Aesop's fables teach moral lessons.","ko":"이솝 우화는 교훈을 가르친다."}],"mnemonic":{"soundHint":"페이블","story":"'페이! (얼른) 블(book)!' 옛날 교훈이 담긴 우화책 = fable.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"parable","ko":"우화","reason":"동의어 - 교훈적 이야기"},{"w":"tale","ko":"이야기","reason":"동의어 - 이야기 일반"},{"w":"moral","ko":"교훈","reason":"연관어 - 우화의 핵심"}],"collocBest":[]},"nuance":{"koSimple":"동물이 등장해 교훈을 주는 짧은 이야기.","whenToUse":"이솝 우화 같은 도덕 교훈 이야기."},"krDetail":[{"ko":"우화","explain":"동물이 사람처럼 나오는 짧은 이야기"},{"ko":"교훈 이야기","explain":"가르침을 주는 짧은 이야기"}],"usageExamples":[{"en":"Aesop wrote many famous fables with clear moral lessons.","ko":"이솝은 명확한 교훈을 담은 많은 유명한 우화를 썼다."},{"en":"The old fable is still told to children today.","ko":"그 오래된 우화는 오늘날에도 여전히 아이들에게 이야기된다."}],"grammarNote":"fable은 셀 수 있는 명사이며 흔히 Aesop's fables (이솝 우화)처럼 복수형으로 쓴다. 형용사 fabulous (엄청난·굉장한)와 어원을 공유하지만 뜻이 다르니 주의.","grammarQuiz":[{"sentence":"Every child in Korea knows the famous _____ of the tortoise.","ko":"한국의 모든 아이는 그 유명한 거북이의 우화를 안다.","answer":["fable"],"hint":"the와 형용사 famous 뒤이므로 단수 명사"},{"sentence":"Aesop's _____ have taught moral lessons for over two thousand years.","ko":"이솝의 우화들은 2천 년이 넘게 교훈을 가르쳐 왔다.","answer":["fables"],"hint":"복수 동사 have와 어울리므로 복수형"}]},
    {"id":"w02287","w":"fabric","pos":["n"],"ph":"/ˈfæbrɪk/","cefr":"B1","kr":["직물","천"],"ex":[{"en":"The fabric of the dress is very soft.","ko":"드레스의 천이 매우 부드럽다."}],"mnemonic":{"soundHint":"패브릭","story":"'패~ 브릭(brick=벽돌)처럼 촘촘히 짠 천' = fabric.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"cloth","ko":"천","reason":"동의어 - 천/직물 일반"},{"w":"textile","ko":"직물","reason":"동의어 - 산업용 직물"},{"w":"material","ko":"소재","reason":"동의어 - 옷의 소재"}],"collocBest":[]},"nuance":{"koSimple":"옷이나 커튼에 쓰는 천.","whenToUse":"직물의 종류·감촉을 말할 때. 비유로 '사회의 구조'도."},"krDetail":[{"ko":"직물","explain":"실로 짜서 만든 천"},{"ko":"천","explain":"옷을 만드는 데 쓰는 얇은 재료"}],"usageExamples":[{"en":"The tailor chose a soft fabric for the new suit.","ko":"그 재단사는 새 정장을 위해 부드러운 천을 골랐다."},{"en":"This unusual fabric is made from recycled plastic bottles.","ko":"이 특이한 직물은 재활용된 플라스틱 병으로 만들어진다."}],"grammarNote":"fabric은 종류를 말할 때는 셀 수 있는 명사(a soft fabric)이지만, 물질 전반을 말할 때는 셀 수 없는 명사로도 쓴다. the fabric of society (사회의 구조)는 비유적 관용 표현이다.","grammarQuiz":[{"sentence":"My grandmother bought some beautiful _____ to make new curtains.","ko":"우리 할머니는 새 커튼을 만들기 위해 아름다운 천을 조금 사셨다.","answer":["fabric","fabrics"],"hint":"some 뒤, 물질 전체는 단수, 종류가 여러 개면 복수 가능"},{"sentence":"This silk _____ feels wonderfully smooth against my skin.","ko":"이 실크 천은 내 피부에 놀랍도록 부드럽게 느껴진다.","answer":["fabric"],"hint":"형용사 silk 뒤이므로 단수 명사 형태"}]},
    {"id":"w02293","w":"facial","pos":["adj","n"],"ph":"/ˈfeɪʃəl/","cefr":"B1","kr":["얼굴의","얼굴 마사지"],"ex":[{"en":"She got a facial treatment at the spa.","ko":"그녀는 스파에서 얼굴 마사지를 받았다."}],"mnemonic":{"soundHint":"페이셜","story":"face(얼굴) + -ial = 얼굴의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"face","ko":"얼굴","reason":"어원 관계 - face + -ial"},{"w":"expression","ko":"표정","reason":"콜로케이션 - facial expression 관용구"},{"w":"features","ko":"이목구비","reason":"연관어 - 얼굴의 특징"}],"collocBest":[]},"nuance":{"koSimple":"얼굴의, 얼굴과 관련된","whenToUse":"표정·얼굴 관리 등 얼굴 특성을 말할 때"},"krDetail":[{"ko":"얼굴의","explain":"얼굴과 관련된"},{"ko":"얼굴 마사지","explain":"얼굴을 문질러 주는 손질"}],"usageExamples":[{"en":"Her facial expression showed exactly how tired she was.","ko":"그녀의 얼굴 표정은 그녀가 얼마나 피곤한지를 정확히 보여주었다."},{"en":"She goes to the spa for a facial every month.","ko":"그녀는 매달 얼굴 마사지를 받으러 스파에 간다."}],"grammarNote":"facial은 형용사로 쓸 때 명사 앞에 오며, 명사로 쓰일 때는 '얼굴 마사지(피부 관리)'라는 셀 수 있는 명사이다. face + al의 형태(-al 형용사 접미사).","grammarQuiz":[{"sentence":"I can read her _____ expression very easily from across the room.","ko":"나는 방 건너편에서도 그녀의 얼굴 표정을 매우 쉽게 읽을 수 있다.","answer":["facial"],"hint":"명사(expression) 앞이므로 형용사 형태"},{"sentence":"She had a relaxing _____ at the spa yesterday afternoon.","ko":"그녀는 어제 오후 스파에서 편안한 얼굴 마사지를 받았다.","answer":["facial"],"hint":"관사 a와 형용사 뒤이므로 명사 형태(얼굴 마사지)"}]},
    {"id":"w02295","w":"facility","pos":["n"],"ph":"/fəˈsɪlɪti/","cefr":"B1","kr":["시설","설비"],"ex":[{"en":"The school has excellent sports facilities.","ko":"그 학교는 훌륭한 스포츠 시설을 갖추고 있다."}],"mnemonic":{"soundHint":"퍼실리티","story":"'퍼실~리(편리)+티' 편리하게 해주는 시설 = facility.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"amenity","ko":"편의시설","reason":"동의어 - 편의를 제공하는 시설"},{"w":"installation","ko":"설비","reason":"동의어 - 설치된 시설"},{"w":"service","ko":"서비스","reason":"연관어 - 시설이 제공하는 서비스"}],"collocBest":[]},"nuance":{"koSimple":"어떤 활동을 위해 갖춰진 설비나 장소.","whenToUse":"체육관·의료·연구 시설 같은 인프라를 말할 때."},"krDetail":[{"ko":"시설","explain":"일을 하기 위해 갖춘 건물이나 도구"},{"ko":"설비","explain":"필요한 것을 미리 갖춤"}],"usageExamples":[{"en":"The new medical facility opened downtown just last month.","ko":"그 새로운 의료 시설이 바로 지난달 시내에 문을 열었다."},{"en":"The sports facilities were built for public use.","ko":"그 스포츠 시설들은 대중이 이용할 수 있도록 지어졌다."}],"grammarNote":"facility는 셀 수 있는 명사이며 건물·시설을 뜻할 때는 흔히 복수형 facilities로 쓴다. 단수 facility는 '기능·능력·재능(a facility for languages)'의 뜻으로도 쓰인다.","grammarQuiz":[{"sentence":"Our school has excellent sports _____ for all the students.","ko":"우리 학교는 모든 학생을 위한 훌륭한 스포츠 시설들을 갖추고 있다.","answer":["facilities"],"hint":"여러 시설이므로 복수형 사용"},{"sentence":"This modern medical _____ is the largest in our small city.","ko":"이 현대적인 의료 시설은 우리의 작은 도시에서 가장 큰 것이다.","answer":["facility"],"hint":"This 뒤 단수 명사, 하나의 시설(건물)"}]},
    {"id":"w02298","w":"factor","pos":["n","v"],"ph":"/ˈfæktər/","cefr":"B1","kr":["요인","요소"],"ex":[{"en":"Diet is an important factor in maintaining health.","ko":"식이요법은 건강 유지에 중요한 요인이다."}],"mnemonic":{"soundHint":"팩터","story":"fact(사실) + -or = 결과를 만드는 사실, 요인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"element","ko":"요소","reason":"동의어 - 구성 요소"},{"w":"component","ko":"구성 요소","reason":"동의어 - 부품·요소"},{"w":"aspect","ko":"측면","reason":"동의어 - 한 측면"}],"collocBest":[]},"nuance":{"koSimple":"결과에 영향을 주는 요소.","whenToUse":"원인·조건 중 하나를 짚을 때."},"krDetail":[{"ko":"요인","explain":"어떤 일에 영향을 주는 까닭"},{"ko":"요소","explain":"어떤 것을 이루는 낱낱의 부분"}],"usageExamples":[{"en":"Weather is a key factor in tomorrow's outdoor concert.","ko":"날씨는 내일 야외 콘서트의 핵심 요인이다."},{"en":"Many factors must be considered before making the decision.","ko":"그 결정을 내리기 전에 많은 요인들이 고려되어야 한다."}],"grammarNote":"factor는 셀 수 있는 명사이며, factor in (동사구, ~을 고려하다)이나 the deciding factor (결정적 요인) 같은 표현도 함께 익혀둔다.","grammarQuiz":[{"sentence":"Price is an important _____ when choosing a new smartphone.","ko":"가격은 새 스마트폰을 고를 때 중요한 요인이다.","answer":["factor"],"hint":"an과 형용사 important 뒤이므로 단수 명사"},{"sentence":"Several _____ affected the final result of the experiment yesterday.","ko":"여러 요인들이 어제 그 실험의 최종 결과에 영향을 미쳤다.","answer":["factors"],"hint":"Several 뒤이므로 복수형 명사"}]},
    {"id":"w02303","w":"fade","pos":["v"],"ph":"/feɪd/","cefr":"B1","kr":["희미해지다","바래다"],"ex":[{"en":"The colors of the painting have faded over time.","ko":"그림의 색이 시간이 지나면서 바랬다."}],"mnemonic":{"soundHint":"페이드아웃","story":"영상 '페이드아웃'은 '점점 희미해지다'라는 뜻으로 fade에서 온 외래어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dim","ko":"희미해지다","reason":"동의어 - 빛이 약해짐"},{"w":"vanish","ko":"사라지다","reason":"동의어 - 서서히 사라짐"},{"w":"brighten","ko":"밝아지다","reason":"반의어 - 희미 vs 선명"}],"collocBest":[{"en":"fade away","ko":"사라져가다"},{"en":"fade into the background","ko":"배경 속으로 사라지다"}]},"nuance":{"koSimple":"빛깔·소리가 점점 옅어지다.","whenToUse":"색이 바래거나 기억·소리가 사라져 갈 때."},"krDetail":[{"ko":"희미해지다","explain":"차차 흐릿해지다"},{"ko":"바래다","explain":"빛깔이 옅어지다"}],"usageExamples":[{"en":"The bright colors of the flag faded in the strong sunlight.","ko":"그 밝은 국기의 색깔이 강한 햇빛에 바랬다."},{"en":"The old sign was faded by years of harsh weather.","ko":"그 오래된 표지판은 수년간의 거친 날씨에 의해 색이 바랬다."}],"grammarNote":"fade는 주로 자동사로 쓰이지만(색이 바래다) 타동사로도 쓰일 수 있다(색을 바래게 하다). fade away/out/into는 '점점 사라지다'의 뜻으로 자주 쓰인다.","grammarQuiz":[{"sentence":"The music slowly _____ away at the end of the movie.","ko":"그 영화의 끝에서 음악이 서서히 사라졌다.","answer":["faded"],"hint":"과거시제, fade away 자동사 표현"},{"sentence":"My old jeans have _____ from many washes over the years.","ko":"내 오래된 청바지는 수년간 여러 번 세탁으로 색이 바랬다.","answer":["faded"],"hint":"have 뒤 과거분사, 색이 바랜 상태 자동사"}]},
    {"id":"w02306","w":"faint","pos":["adj","v"],"ph":"/feɪnt/","cefr":"B1","kr":["희미한","기절하다"],"ex":[{"en":"She felt faint in the heat.","ko":"그녀는 더위에 기절할 것 같았다."}],"mnemonic":{"soundHint":"페인트","story":"'페인트!' 냄새에 정신 흐릿해져 기절할 것 같다 = faint.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"dim","ko":"희미한","reason":"동의어 - 흐릿함"},{"w":"weak","ko":"약한","reason":"동의어 - 강도가 약함"},{"w":"clear","ko":"선명한","reason":"반의어 - 희미함 vs 선명함"}],"collocBest":[]},"nuance":{"koSimple":"소리·빛·의식이 아주 희미한","whenToUse":"거의 감지되지 않는 약함을 나타낼 때"},"krDetail":[{"ko":"희미한","explain":"잘 보이거나 들리지 않는"},{"ko":"기절하다","explain":"잠깐 정신을 잃다"}],"usageExamples":[{"en":"I heard a faint sound coming from the empty room.","ko":"나는 그 빈방에서 나는 희미한 소리를 들었다."},{"en":"She almost fainted from the extreme heat outside today.","ko":"그녀는 오늘 밖의 극심한 더위로 거의 기절했다."}],"grammarNote":"faint는 형용사(희미한)와 자동사(기절하다) 모두로 쓰인다. 형용사 부사형은 faintly (희미하게)이며, feel faint는 '기절할 것 같다'는 관용 표현이다.","grammarQuiz":[{"sentence":"There was a _____ smell of smoke in the kitchen.","ko":"부엌에 희미한 연기 냄새가 있었다.","answer":["faint"],"hint":"관사 a와 명사(smell) 사이이므로 형용사 형태"},{"sentence":"She might _____ if she doesn't eat anything soon today.","ko":"그녀가 오늘 뭔가를 곧 먹지 않으면 기절할지도 모른다.","answer":["faint"],"hint":"조동사 might 뒤이므로 동사 원형(기절하다)"}]},
    {"id":"w02310","w":"faith","pos":["n"],"ph":"/feɪθ/","cefr":"B1","kr":["믿음","신앙"],"ex":[{"en":"She has great faith in her doctor.","ko":"그녀는 자신의 의사를 매우 신뢰한다."}],"mnemonic":{"soundHint":"페이스","story":"'페이(pay)+스(믿음)' 값을 지불하듯 무조건 믿는 것 = faith.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"belief","ko":"믿음","reason":"동의어 - 신념"},{"w":"trust","ko":"신뢰","reason":"동의어 - 사람에 대한 신뢰"},{"w":"doubt","ko":"의심","reason":"반의어 - 믿음 vs 의심"}],"collocBest":[]},"nuance":{"koSimple":"흔들리지 않는 굳은 믿음.","whenToUse":"종교·신뢰·확신을 말할 때."},"krDetail":[{"ko":"믿음","explain":"굳게 그렇다고 여기는 마음"},{"ko":"신앙","explain":"종교를 굳게 믿는 마음"}],"usageExamples":[{"en":"The parents put great faith in their new young teacher.","ko":"그 부모들은 새로운 젊은 선생님에게 큰 믿음을 두었다."},{"en":"Her strong religious faith helped her through many hard times.","ko":"그녀의 강한 종교적 신앙이 많은 어려운 시간을 이겨내는 데 도움이 되었다."}],"grammarNote":"faith는 셀 수 없는 명사이며 have/put faith in (~을 신뢰하다), keep the faith (신념을 지키다)로 자주 쓴다. 형용사형은 faithful (충실한)이다.","grammarQuiz":[{"sentence":"I have complete _____ in my best friend's honest words.","ko":"나는 나의 가장 친한 친구의 정직한 말을 완전히 믿는다.","answer":["faith"],"hint":"have ___ in: ~을 신뢰하다 관용구, 셀 수 없는 명사"},{"sentence":"The dog was very _____ to its owner until the very end.","ko":"그 개는 마지막까지 자신의 주인에게 매우 충실했다.","answer":["faithful"],"hint":"be동사 was 뒤, 보어 자리 형용사 형태"}]},
    {"id":"w02311","w":"faithful","pos":["adj"],"ph":"/ˈfeɪθfl/","cefr":"B1","kr":["충실한","신실한"],"ex":[{"en":"He has been a faithful friend for many years.","ko":"그는 오랫동안 충실한 친구였다."}],"mnemonic":{"soundHint":"페이스풀","story":"faith(믿음) + -ful = 믿음이 가득한, 충실한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"loyal","ko":"충성스러운","reason":"동의어 - 변함없이 충성함"},{"w":"devoted","ko":"헌신적인","reason":"동의어 - 헌신적으로 충실"},{"w":"disloyal","ko":"불충한","reason":"반의어 - 충실 vs 배신"}],"collocBest":[]},"nuance":{"koSimple":"약속을 끝까지 지키는.","whenToUse":"친구·부부·부하가 변함없이 충실할 때."},"krDetail":[{"ko":"충실한","explain":"정성을 다해 마음이 곧은"},{"ko":"신실한","explain":"믿음이 굳고 참된"}],"usageExamples":[{"en":"He has always been a faithful friend to me since childhood.","ko":"그는 어린 시절부터 나에게 항상 충실한 친구였다."},{"en":"The old dog remained faithful to its owner for years.","ko":"그 늙은 개는 수년간 주인에게 충실히 남아 있었다."}],"grammarNote":"faithful은 형용사이며 be faithful to (~에게 충실하다)로 쓴다. 부사형은 faithfully (충실히)로 편지 끝 인사(Yours faithfully)에도 쓰인다.","grammarQuiz":[{"sentence":"A _____ friend will stay with you in difficult times.","ko":"충실한 친구는 어려운 시기에 너와 함께 있어 줄 것이다.","answer":["faithful"],"hint":"관사 A와 명사(friend) 사이이므로 형용사 형태"},{"sentence":"The translator has _____ preserved the meaning of the original text.","ko":"그 번역가는 원문의 의미를 충실히 보존해 왔다.","answer":["faithfully"],"hint":"동사(preserved)를 꾸미므로 부사 형태"}]},
    {"id":"w02312","w":"fake","pos":["adj","n","v"],"ph":"/feɪk/","cefr":"B1","kr":["가짜의","위조하다"],"ex":[{"en":"He was caught selling fake designer bags.","ko":"그는 가짜 명품 가방을 팔다가 걸렸다."}],"mnemonic":{"soundHint":"페이크","story":"'페이크 뉴스·페이크 상품'처럼 외래어로 쓰이며 '가짜의'를 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"counterfeit","ko":"위조의","reason":"동의어 - 위조된"},{"w":"false","ko":"거짓의","reason":"동의어 - 진짜가 아닌"},{"w":"genuine","ko":"진짜의","reason":"반의어 - 가짜 vs 진짜"}],"collocBest":[{"en":"fake news","ko":"가짜 뉴스"},{"en":"fake ID","ko":"가짜 신분증"}]},"nuance":{"koSimple":"진짜처럼 꾸며낸 가짜의.","whenToUse":"짝퉁 상품·가짜 뉴스처럼 진위가 문제될 때."},"krDetail":[{"ko":"가짜의","explain":"참인 척 꾸민"},{"ko":"위조하다","explain":"진짜처럼 꾸며 만들다"}],"usageExamples":[{"en":"The police caught the man who sold fake watches downtown.","ko":"경찰은 시내에서 가짜 시계를 판 그 남자를 잡았다."},{"en":"The signature on this old document was fake, not real.","ko":"이 오래된 문서의 서명은 진짜가 아니라 가짜였다."}],"grammarNote":"fake는 형용사(가짜의), 명사(가짜 물건·사람), 동사(위조하다, ~인 척하다) 모두로 쓰인다. fake it (~인 척하다)은 회화체 표현이다.","grammarQuiz":[{"sentence":"Many young people worry about spreading _____ news on social media.","ko":"많은 젊은이가 소셜 미디어에 가짜 뉴스가 퍼지는 것을 걱정한다.","answer":["fake"],"hint":"명사(news) 앞이므로 형용사 형태"},{"sentence":"The child tried to _____ a stomachache to skip school today.","ko":"그 아이는 오늘 학교를 빠지려고 배탈을 꾀병으로 꾸미려 했다.","answer":["fake"],"hint":"to부정사 자리, 뒤에 목적어가 있는 동사"}]},
    {"id":"w02319","w":"fame","pos":["n"],"ph":"/feɪm/","cefr":"B1","kr":["명성","유명"],"ex":[{"en":"The actor rose to fame after his first movie.","ko":"그 배우는 첫 번째 영화 이후 명성을 얻었다."}],"mnemonic":{"soundHint":"페임","story":"'페임(fame)!' 유명세로 돈 좀 만졌다는 명성 = fame.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"celebrity","ko":"유명인","reason":"연관어 - 명성 있는 사람"},{"w":"renown","ko":"명성","reason":"동의어 - 널리 알려진 명성"},{"w":"obscurity","ko":"무명","reason":"반의어 - 명성 vs 무명"}],"collocBest":[]},"nuance":{"koSimple":"많은 사람에게 이름이 알려진 상태.","whenToUse":"연예인·운동선수가 유명해질 때."},"krDetail":[{"ko":"명성","explain":"이름이 널리 알려짐"},{"ko":"유명","explain":"이름이 세상에 잘 알려짐"}],"usageExamples":[{"en":"The young singer's fame quickly spread all around the world.","ko":"그 젊은 가수의 명성은 전 세계로 빠르게 퍼졌다."},{"en":"He rose to fame after winning the big talent show.","ko":"그는 그 큰 오디션 프로그램에서 우승한 뒤 명성을 얻었다."}],"grammarNote":"fame은 셀 수 없는 명사로 부정관사 a를 쓰지 않는다. rise to fame (명성을 얻다), hall of fame (명예의 전당)은 굳어진 관용 표현이다.","grammarQuiz":[{"sentence":"The actor's _____ grew after his first successful movie role.","ko":"그 배우의 명성은 그의 첫 성공적인 영화 배역 이후 커졌다.","answer":["fame"],"hint":"소유격 뒤 명사, 셀 수 없는 명사(a 없음)"},{"sentence":"Many people work very hard to achieve _____ and fortune.","ko":"많은 사람이 명성과 부를 얻기 위해 매우 열심히 일한다.","answer":["fame"],"hint":"achieve의 목적어, 셀 수 없는 명사"}]},
    {"id":"w02321","w":"familiar","pos":["adj"],"ph":"/fəˈmɪliər/","cefr":"B1","kr":["친숙한","잘 알고 있는"],"ex":[{"en":"This song sounds familiar to me.","ko":"이 노래는 나에게 친숙하게 들린다."}],"mnemonic":{"soundHint":"퍼밀리어","story":"family(가족) + -ar = 가족처럼 잘 아는, 친숙한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"acquainted","ko":"잘 아는","reason":"동의어 - 알고 있음"},{"w":"known","ko":"알려진","reason":"동의어 - 이미 아는"},{"w":"strange","ko":"낯선","reason":"반의어 - 친숙 vs 낯섦"}],"collocBest":[]},"nuance":{"koSimple":"자주 봐서 낯설지 않은.","whenToUse":"이미 알고 있어 편안한 얼굴·상황에."},"krDetail":[{"ko":"친숙한","explain":"잘 알고 있어 낯설지 않은"},{"ko":"잘 알고 있는","explain":"여러 번 겪어 잘 아는"}],"usageExamples":[{"en":"This song sounds very familiar to me now.","ko":"이 노래는 이제 나에게 매우 친숙하게 들린다."},{"en":"Are you familiar with this new computer program yet?","ko":"너는 아직 이 새 컴퓨터 프로그램에 대해 잘 아니?"}],"grammarNote":"familiar는 두 가지 구조로 쓴다. 사람이 주어일 때는 be familiar with (~에 친숙하다), 사물이 주어일 때는 be familiar to + 사람 (~에게 친숙하다)이다.","grammarQuiz":[{"sentence":"Are you _____ with the rules of the new game we play?","ko":"너는 우리가 하는 새로운 게임의 규칙에 대해 잘 알고 있니?","answer":["familiar"],"hint":"사람 주어 + be ___ with: ~에 익숙하다"},{"sentence":"That old melody sounds very _____ to everyone in this room.","ko":"저 오래된 멜로디는 이 방에 있는 모두에게 매우 친숙하게 들린다.","answer":["familiar"],"hint":"사물 주어 + be/sound ___ to + 사람"}]},
    {"id":"w02330","w":"fancy","pos":["adj","v","n"],"ph":"/ˈfænsi/","cefr":"B1","kr":["고급의","좋아하다","공상"],"ex":[{"en":"They stayed in a fancy hotel for their anniversary.","ko":"그들은 기념일에 고급 호텔에 머물렀다."}],"mnemonic":{"soundHint":"팬시","story":"'팬시용품'의 '팬시'는 외래어로 자주 쓰이며 '고급·화려한'을 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"elaborate","ko":"정교한","reason":"동의어 - 복잡하고 정교함"},{"w":"ornate","ko":"화려한","reason":"동의어 - 장식이 화려함"},{"w":"plain","ko":"평범한","reason":"반의어 - 고급 vs 소박"}],"collocBest":[{"en":"fancy restaurant","ko":"고급 식당"},{"en":"fancy dress","ko":"화려한 드레스"}]},"nuance":{"koSimple":"평범하지 않고 화려하거나 고급인.","whenToUse":"비싼 호텔·화려한 옷차림을 말할 때."},"krDetail":[{"ko":"고급의","explain":"값이 비싸고 매우 좋은"},{"ko":"좋아하다","explain":"마음에 들어 하다"},{"ko":"공상","explain":"실제와 다르게 마음속으로 그려봄"}],"usageExamples":[{"en":"They celebrated their anniversary at a fancy Italian restaurant downtown.","ko":"그들은 시내의 고급 이탈리아 식당에서 기념일을 축하했다."},{"en":"The idea took her fancy the moment she heard it.","ko":"그 생각은 그녀가 그것을 듣는 순간 그녀의 마음에 들었다."}],"grammarNote":"fancy는 형용사(고급의·화려한), 동사(좋아하다·상상하다), 명사(공상·기호)로 두루 쓰인다. take a fancy to (~을 좋아하게 되다)는 관용 표현이다.","grammarQuiz":[{"sentence":"They ate dinner at a _____ restaurant on their wedding anniversary.","ko":"그들은 결혼기념일에 고급 식당에서 저녁을 먹었다.","answer":["fancy"],"hint":"관사 a와 명사(restaurant) 사이이므로 형용사 형태"},{"sentence":"Do you _____ going to the movies with me this evening?","ko":"너는 오늘 저녁 나와 영화 보러 가는 것이 마음에 드니?","answer":["fancy"],"hint":"조동사 Do 뒤 동사원형, 뒤에 동명사 목적어"}]},
    {"id":"w02333","w":"fantasy","pos":["n"],"ph":"/ˈfæntəsi/","cefr":"B1","kr":["환상","공상"],"ex":[{"en":"She lives in a world of fantasy.","ko":"그녀는 환상의 세계에 살고 있다."}],"mnemonic":{"soundHint":"판타지","story":"'판타지 소설·게임'의 '판타지'는 외래어로 자주 쓰이며 '환상'을 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"imagination","ko":"상상","reason":"동의어 - 상상 속 이야기"},{"w":"dream","ko":"꿈","reason":"동의어 - 비현실적 꿈"},{"w":"reality","ko":"현실","reason":"반의어 - 환상 vs 현실"}],"collocBest":[{"en":"fantasy world","ko":"환상의 세계"},{"en":"live in a fantasy","ko":"환상 속에 살다"}]},"nuance":{"koSimple":"현실에 없는 상상의 세계.","whenToUse":"판타지 소설·공상 속 이야기에."},"krDetail":[{"ko":"환상","explain":"실제로는 있을 수 없는 그림 같은 생각"},{"ko":"공상","explain":"즐거운 상상"}],"usageExamples":[{"en":"Many children love to read fantasy stories about dragons and magic.","ko":"많은 아이들은 용과 마법에 관한 환상 이야기를 읽기 좋아한다."},{"en":"It is only a fantasy that you can fly.","ko":"네가 날 수 있다는 것은 단지 환상일 뿐이다."}],"grammarNote":"fantasy는 셀 수 있는 명사(하나의 환상)와 셀 수 없는 명사(환상의 장르) 모두로 쓰인다. 형용사 fantastic (환상적인·굉장한)과 뜻 구분에 주의.","grammarQuiz":[{"sentence":"Living on the moon is just a _____ for most people today.","ko":"달에 사는 것은 오늘날 대부분의 사람에게 단지 환상일 뿐이다.","answer":["fantasy"],"hint":"관사 a 뒤이므로 단수 명사 형태"},{"sentence":"The children escaped into a world of _____ through their favorite books.","ko":"그 아이들은 좋아하는 책을 통해 환상의 세계로 도망쳤다.","answer":["fantasy"],"hint":"of 뒤, 셀 수 없는 명사(장르로서)"}]},
    {"id":"w02335","w":"fare","pos":["n","v"],"ph":"/feər/","cefr":"B1","kr":["요금","음식"],"ex":[{"en":"The bus fare has increased this year.","ko":"올해 버스 요금이 올랐다."}],"mnemonic":{"soundHint":"페어","story":"'페어(pair)로 내는 요금' → 버스·택시 요금 = fare.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"charge","ko":"요금","reason":"동의어 - 서비스 요금"},{"w":"fee","ko":"수수료","reason":"동의어 - 지불하는 돈"},{"w":"price","ko":"가격","reason":"동의어 - 지불 금액"}],"collocBest":[]},"nuance":{"koSimple":"버스·택시에 내는 돈.","whenToUse":"교통수단 이용 요금을 말할 때."},"krDetail":[{"ko":"요금","explain":"탈것을 이용할 때 내는 돈"},{"ko":"음식","explain":"먹을거리"}],"usageExamples":[{"en":"The bus driver told me the exact fare to downtown.","ko":"그 버스 운전기사는 나에게 시내까지의 정확한 요금을 알려주었다."},{"en":"The restaurant offers traditional fare from many different countries.","ko":"그 식당은 여러 다른 나라의 전통 음식을 제공한다."}],"grammarNote":"fare(교통 요금)와 fee(수수료·회비), fine(벌금), fair(공정한·박람회)의 발음·철자 차이에 주의. 요금 뜻일 때는 셀 수 있는 명사이다.","grammarQuiz":[{"sentence":"The taxi _____ from the airport to my hotel was very expensive.","ko":"공항에서 내 호텔까지의 택시 요금이 매우 비쌌다.","answer":["fare"],"hint":"the 뒤 명사, 교통 요금의 뜻"},{"sentence":"Bus _____ have increased twice already this year in Seoul.","ko":"서울에서 버스 요금이 올해 이미 두 번 올랐다.","answer":["fares"],"hint":"have와 어울리는 복수형, 두 번 인상 → 복수"}]},
    {"id":"w02336","w":"farewell","pos":["n","interj"],"ph":"/ˌfeəˈwel/","cefr":"B1","kr":["작별","이별"],"ex":[{"en":"They said farewell at the airport.","ko":"그들은 공항에서 작별 인사를 했다."}],"mnemonic":{"soundHint":"페어웰","story":"'fare(가다) + well(잘)' = 잘 가! 작별 인사.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"goodbye","ko":"안녕","reason":"동의어 - 헤어질 때 인사"},{"w":"parting","ko":"이별","reason":"동의어 - 헤어짐의 순간"},{"w":"greeting","ko":"인사","reason":"반의어 - 작별 vs 만남"}],"collocBest":[]},"nuance":{"koSimple":"헤어질 때 나누는 인사.","whenToUse":"송별회·공항 이별 장면 등에."},"krDetail":[{"ko":"작별","explain":"서로 헤어짐"},{"ko":"이별","explain":"서로 헤어짐"}],"usageExamples":[{"en":"The students bid farewell to their teacher on graduation day.","ko":"그 학생들은 졸업식 날 선생님에게 작별을 고했다."},{"en":"A big farewell party was held for the leaving manager.","ko":"떠나는 그 관리자를 위해 큰 송별 파티가 열렸다."}],"grammarNote":"farewell은 명사(작별)와 감탄사(잘 가!) 모두로 쓰인다. bid farewell to (~에게 작별을 고하다)는 문어체 관용 표현이며 회화에서는 say goodbye가 더 자연스럽다.","grammarQuiz":[{"sentence":"The class held a _____ party for their retiring English teacher.","ko":"그 반은 은퇴하시는 영어 선생님을 위해 송별회를 열었다.","answer":["farewell"],"hint":"관사 a와 명사(party) 사이이므로 형용사처럼 쓰인 명사 수식어"},{"sentence":"He said a sad _____ to his old friends at the airport.","ko":"그는 공항에서 오랜 친구들에게 슬픈 작별을 고했다.","answer":["farewell"],"hint":"관사 a와 형용사 sad 뒤이므로 명사 형태"}]},
    {"id":"w02339","w":"farmland","pos":["n"],"ph":"/ˈfɑːrmlænd/","cefr":"B1","kr":["농지","경작지"],"ex":[{"en":"The river valley is rich in fertile farmland.","ko":"강 계곡은 비옥한 농지로 풍부하다."}],"mnemonic":{"soundHint":"팜랜드","story":"'farm(농장) + land(땅)' = 농지.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cropland","ko":"농경지","reason":"동의어 - 곡물 재배 땅"},{"w":"farm","ko":"농장","reason":"연관어 - 농지가 있는 농장"},{"w":"wasteland","ko":"황무지","reason":"반의어 - 농지 vs 황무지"}],"collocBest":[]},"nuance":{"koSimple":"작물을 기르는 땅.","whenToUse":"농사짓는 논밭·경작지를 말할 때."},"krDetail":[{"ko":"농지","explain":"농사를 짓는 땅"},{"ko":"경작지","explain":"곡식이나 채소를 가꾸는 땅"}],"usageExamples":[{"en":"Much fertile farmland was flooded by the heavy rain yesterday.","ko":"많은 비옥한 농지가 어제 폭우로 물에 잠겼다."},{"en":"The farmland was passed down through three generations of farmers.","ko":"그 농지는 세 세대의 농부들을 거쳐 물려받았다."}],"grammarNote":"farmland는 셀 수 없는 명사이므로 부정관사 a를 쓰지 않고 much/a lot of farmland 형태로 쓴다. farm + land의 합성명사로 발음 강세는 앞음절이다.","grammarQuiz":[{"sentence":"Much _____ in this area was lost during the recent big flood.","ko":"이 지역의 많은 농지가 최근의 큰 홍수 동안 사라졌다.","answer":["farmland"],"hint":"Much 뒤 셀 수 없는 명사(단수형만 사용)"},{"sentence":"The rich _____ has been used by local farmers for generations.","ko":"그 비옥한 농지는 여러 세대 동안 지역 농부들에 의해 사용되어 왔다.","answer":["farmland"],"hint":"The와 형용사 rich 뒤, 셀 수 없는 단수 명사"}]},
    {"id":"w02341","w":"farther","pos":["adv","adj"],"ph":"/ˈfɑːrðər/","cefr":"B1","kr":["더 멀리","더 먼"],"ex":[{"en":"The next town is farther than I thought.","ko":"다음 마을은 내가 생각했던 것보다 더 멀다."}],"mnemonic":{"soundHint":"파더","story":"far(먼) + -ther(비교) = 더 멀리, 더 먼.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"further","ko":"더 나아가","reason":"동의어 - 물리적·추상적 더 멀리"},{"w":"distant","ko":"먼","reason":"동의어 - 거리가 먼"},{"w":"near","ko":"가까운","reason":"반의어 - 먼 vs 가까운"}],"collocBest":[]},"nuance":{"koSimple":"거리가 지금보다 더 먼.","whenToUse":"물리적 거리(더 멀리)를 말할 때."},"krDetail":[{"ko":"더 멀리","explain":"거리가 더 있는 곳으로"},{"ko":"더 먼","explain":"거리가 더 있는"}],"usageExamples":[{"en":"The gas station is farther from here than I thought.","ko":"그 주유소는 내가 생각했던 것보다 여기서 더 멀다."},{"en":"We walked farther into the deep forest than planned.","ko":"우리는 계획했던 것보다 더 깊은 숲속으로 더 멀리 걸어갔다."}],"grammarNote":"farther는 far의 비교급으로 물리적 거리에 쓴다. further는 시간·정도·추상적 거리(further study, further information)에 쓰는 것이 원칙이지만 현대 영어에서는 서로 자주 바뀌어 쓰인다.","grammarQuiz":[{"sentence":"The library is _____ from my home than the bookstore is.","ko":"그 도서관은 서점보다 우리 집에서 더 멀다.","answer":["farther","further"],"hint":"than과 함께 비교급, 물리적 거리 → farther 원칙"},{"sentence":"We need _____ information before making the final decision now.","ko":"우리는 지금 최종 결정을 내리기 전에 더 많은 정보가 필요하다.","answer":["further"],"hint":"추상적(정도) 비교급, 물리 거리 아님 → further"}]},
    {"id":"w01834","w":"distribute","pos":["v"],"ph":"/dɪˈstrɪbjuːt/","cefr":"B1","kr":["분배하다","배포하다"],"ex":[{"en":"Food was distributed to people.","ko":"식량이 사람들에게 분배되었다."}],"mnemonic":{"soundHint":"'디스(dis-,따로)+트리뷰트(tribute,나눔)' → 따로따로 나눠주다","story":"dis(따로)+tribute(주다) → 따로따로 나눠주다 = distribute(분배하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collect","ko":"모으다","reason":"distribute의 대표 반의어"},{"w":"equally","ko":"균등하게","reason":"'균등하게 분배하다(distribute equally)'로 결합"},{"w":"material","ko":"자료","reason":"'자료를 배포하다(distribute materials)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"여러 사람에게 나누어 주다.","whenToUse":"물자·자료·상품을 배포할 때."},"krDetail":[{"ko":"분배하다","explain":"몫몫이 나누어 주다"},{"ko":"배포하다","explain":"여러 사람에게 널리 나누어 주다"}],"usageExamples":[{"en":"Volunteers distributed free meals to homeless people across the city yesterday.","ko":"자원봉사자들은 어제 도시 곳곳에서 노숙자들에게 무료 식사를 나누어 주었다."},{"en":"Free meals were distributed to homeless people across the city yesterday.","ko":"무료 식사가 어제 도시 곳곳에서 노숙자들에게 나누어졌다."}],"grammarNote":"distribute + 사물 + to/among + 사람 구조가 핵심. to는 개별 대상, among은 그룹 내 분배를 강조한다. be distributed evenly/equally(고르게 분배되다)라는 수동형 표현도 자주 나온다.","grammarQuiz":[{"sentence":"The teacher will distribute the test papers _____ every student in class.","ko":"선생님은 반의 모든 학생들에게 시험지를 나눠 줄 것이다.","answer":["to"],"hint":"distribute to + 개별 대상"},{"sentence":"The relief supplies were distributed _____ the affected villagers fairly.","ko":"구호 물품은 피해를 입은 마을 사람들 사이에 공정하게 분배되었다.","answer":["among"],"hint":"distribute among + 그룹"}]},

const lsSet = (k,v)=>{ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} };

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
