    {"id":"w01672","w":"dependent","pos":["adj"],"ph":"/dɪˈpendənt/","cefr":"B1","kr":["의존하는","종속적인"],"ex":[{"en":"Children are dependent on parents.","ko":"아이들은 부모에게 의존한다."}],"mnemonic":{"soundHint":"'디펜드(depend,의존하다)+ent' → 의존하는","story":"depend(의존하다)의 형용사형 → dependent(의존하는)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"independent","ko":"독립적인","reason":"dependent의 대표 반의어"},{"w":"rely","ko":"의존하다","reason":"'~에 의존하다' 뜻으로 함께 학습"},{"w":"financially","ko":"재정적으로","reason":"'경제적으로 의존하는'처럼 결합"}],"collocBest":[]},"nuance":{"koSimple":"혼자 못하고 남에게 기대야 하는.","whenToUse":"경제·정서·조건상 의존을 표현할 때."},"krDetail":[{"ko":"의존하는","explain":"다른 사람이나 것에 기대어 살아가는"},{"ko":"종속적인","explain":"다른 것에 매여 있어 스스로 결정하지 못하는"}],"usageExamples":[{"en":"A newborn baby is completely dependent on its mother.","ko":"갓난아기는 어머니에게 완전히 의존한다."},{"en":"The final price is dependent on the size you choose.","ko":"최종 가격은 당신이 고르는 크기에 달려 있다."}],"grammarNote":"dependent 뒤에는 전치사 on/upon을 쓴다(dependent on ~). 명사형 dependence도 dependence on ~을 쓰고, 반의어 independent도 independent of ~로 전치사가 다르다.","grammarQuiz":[{"sentence":"Many young adults are still financially dependent _____ their parents.","ko":"많은 젊은 성인들은 여전히 경제적으로 부모에게 의존하고 있다.","answer":["on"],"hint":"dependent on"},{"sentence":"Whether we go camping is dependent _____ tomorrow's weather forecast.","ko":"우리가 캠핑을 갈지는 내일의 일기 예보에 달려 있다.","answer":["on"],"hint":"dependent on ~에 달려 있다"}]},
    {"id":"w01684","w":"depth","pos":["n"],"ph":"/depθ/","cefr":"B1","kr":["깊이","심오함"],"ex":[{"en":"The depth of the sea is enormous.","ko":"바다의 깊이는 어마어마하다."}],"mnemonic":{"soundHint":"'딥(deep,깊은)+th' → 깊이의 명사","story":"deep(깊은)의 명사형 → depth(깊이)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"deep","ko":"깊은","reason":"depth의 형용사 짝으로 함께 학습"},{"w":"knowledge","ko":"지식","reason":"'지식의 깊이(depth of knowledge)'로 결합"},{"w":"ocean","ko":"바다","reason":"'바다의 깊이'처럼 물리적 깊이 표현에 자주 쓰임"}],"collocBest":[]},"nuance":{"koSimple":"위에서 아래까지 얼마나 깊은지.","whenToUse":"물·구멍·지식·감정의 깊이에 두루."},"krDetail":[{"ko":"깊이","explain":"위에서 아래까지의 거리, 또는 생각이 얼마나 깊은지"},{"ko":"심오함","explain":"겉으로 드러나지 않는 뜻이 매우 깊고 그윽함"}],"usageExamples":[{"en":"The divers measured the depth of the lake.","ko":"잠수부들은 그 호수의 깊이를 측정했다."},{"en":"She studied the topic in great depth.","ko":"그녀는 그 주제를 매우 깊이 있게 공부했다."}],"grammarNote":"형용사 deep에서 만들어진 명사가 depth이고, 부사는 deeply이다. in depth는 '심층적으로'라는 부사구, in-depth는 '심층의'라는 형용사로 쓰임에 주의.","grammarQuiz":[{"sentence":"We need to study this problem _____ _____ before making a decision.","ko":"우리는 결정을 내리기 전에 이 문제를 심층적으로 연구해야 한다.","answer":["in","depth"],"hint":"in depth 심층적으로"},{"sentence":"The pool is two meters _____ _____ the deepest point.","ko":"그 수영장은 가장 깊은 지점의 깊이가 2미터이다.","answer":["in","depth"],"hint":"숫자 + in depth"}]},
    {"id":"w01689","w":"descend","pos":["v"],"ph":"/dɪˈsend/","cefr":"B1","kr":["내려가다","하강하다"],"ex":[{"en":"The hikers descended the mountain carefully.","ko":"등산객들은 조심스럽게 산을 내려갔다."}],"mnemonic":{"soundHint":"'디(de-,아래)+센드(send,보내다)' → 아래로 보내다","story":"de(아래)+scend(오르다) → 위에서 아래로 = descend(내려가다). ascend의 반의어","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ascend","ko":"올라가다","reason":"descend의 대표 반의어"},{"w":"staircase","ko":"계단","reason":"'계단을 내려가다'와 같이 결합"},{"w":"mountain","ko":"산","reason":"'산에서 내려오다' 상황에서 자주 사용"}],"collocBest":[]},"nuance":{"koSimple":"높은 곳에서 낮은 쪽으로 내려감.","whenToUse":"산·계단·비행기가 하강할 때."},"krDetail":[{"ko":"내려가다","explain":"높은 곳에서 낮은 곳으로 옮겨 가다"},{"ko":"하강하다","explain":"위에서 아래쪽으로 서서히 내려가다"}],"usageExamples":[{"en":"The plane began to descend toward the runway.","ko":"비행기는 활주로를 향해 하강하기 시작했다."},{"en":"We slowly descended the stairs in the dark.","ko":"우리는 어둠 속에서 천천히 계단을 내려갔다."}],"grammarNote":"descend는 자동사·타동사 모두 가능해서 descend the stairs(계단을 내려가다)처럼 목적어를 바로 받기도 하고, descend from ~(~의 후손이다)처럼 전치사와 함께도 쓴다. be descended from(~의 후손이다)이라는 수동형도 시험에 잘 나온다.","grammarQuiz":[{"sentence":"The old queen is said to be _____ _____ a Viking warrior.","ko":"그 늙은 여왕은 바이킹 전사의 후손이라고 전해진다.","answer":["descended","from"],"hint":"be descended from ~의 후손이다"},{"sentence":"Please hold the railing carefully as you descend _____ steep stairs.","ko":"가파른 계단을 내려갈 때는 난간을 조심스럽게 잡으세요.","answer":["the"],"hint":"descend + 정관사 + 명사"}]},
    {"id":"w01693","w":"desert","pos":["n","v"],"ph":"/ˈdezərt/","cefr":"B1","kr":["사막","버리다"],"ex":[{"en":"The Sahara is a vast desert.","ko":"사하라는 광대한 사막이다."}],"mnemonic":{"soundHint":"'디저트(dessert,후식)'와 s 개수 차이 → 사막","story":"dessert(후식, s 두 개)와 desert(사막, s 하나) 구별. 사막은 s가 하나뿐(썰렁)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"oasis","ko":"오아시스","reason":"사막(desert)과 대비되는 대표 이미지"},{"w":"island","ko":"섬","reason":"'무인도(desert island)'로 결합"},{"w":"abandon","ko":"버리다","reason":"desert의 동사 의미와 동의어"}],"collocBest":[]},"nuance":{"koSimple":"모래로 뒤덮인 메마른 땅, 혹은 버리다.","whenToUse":"사막을 말하거나 사람·의무를 저버릴 때."},"krDetail":[{"ko":"사막","explain":"비가 거의 오지 않아 모래와 돌만 있는 넓은 땅"},{"ko":"버리다","explain":"돌보지 않고 아주 떠나 버리다"}],"usageExamples":[{"en":"The soldier deserted his post during the long, cold night.","ko":"그 병사는 길고 추운 밤 동안 자신의 초소를 이탈했다."},{"en":"His post was deserted during the long, cold night.","ko":"그의 초소는 길고 추운 밤 동안 버려져 있었다."}],"grammarNote":"desert는 명사 '사막'일 때는 앞음절에 강세(DEs-ert), 동사 '버리다'일 때는 뒷음절에 강세(de-SERT)가 온다. dessert(디저트)와 철자가 다르니 주의.","grammarQuiz":[{"sentence":"The abandoned town felt completely _____ after the mine closed down.","ko":"그 광산이 폐쇄된 후 그 버려진 마을은 완전히 인적이 없어 보였다.","answer":["deserted"],"hint":"형용사 deserted 인적이 없는"},{"sentence":"Many species have adapted to survive _____ the dry desert climate.","ko":"많은 종들이 건조한 사막 기후에서 살아남기 위해 적응해 왔다.","answer":["in"],"hint":"in + 환경/기후"}]},
    {"id":"w01694","w":"deserve","pos":["v"],"ph":"/dɪˈzɜːrv/","cefr":"B1","kr":["받을 자격이 있다","~할 만하다"],"ex":[{"en":"You deserve a long rest.","ko":"당신은 긴 휴식을 받을 자격이 있다."}],"mnemonic":{"soundHint":"'디저브' → 대접(디저트) 받을 만하다","story":"디저트(dessert)를 받을 만하다 → deserve(받을 자격 있다)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"earn","ko":"얻다","reason":"deserve의 동의어(자격으로 얻다)"},{"w":"credit","ko":"공로","reason":"'공을 인정받다(deserve credit)'로 결합"},{"w":"reward","ko":"보상","reason":"'보상을 받을 만하다' 맥락에서 자주 함께"}],"collocBest":[]},"nuance":{"koSimple":"그만한 대접을 받아 마땅함.","whenToUse":"보상·처벌이 정당하다고 말할 때."},"krDetail":[{"ko":"받을 자격이 있다","explain":"그만한 대접이나 결과를 받을 만하다"},{"ko":"~할 만하다","explain":"그런 일을 겪거나 얻는 것이 당연하다"}],"usageExamples":[{"en":"After working so hard, you deserve a reward.","ko":"그렇게 열심히 일했으니 너는 보상을 받을 자격이 있다."},{"en":"Such rude behavior deserves to be punished.","ko":"그런 무례한 행동은 벌을 받을 만하다."}],"grammarNote":"deserve는 진행형으로 잘 쓰지 않는 상태동사이고, 뒤에 to부정사(deserve to win) 또는 동명사(deserve winning) 둘 다 취할 수 있다. 수동태 뜻으로 동명사를 쓸 때는 The book deserves reading = deserves to be read.","grammarQuiz":[{"sentence":"After all her hard work, she deserves _____ _____ the championship trophy.","ko":"그녀의 모든 노력 끝에, 그녀는 우승 트로피를 받을 자격이 있다.","answer":["to","win"],"hint":"deserve + to부정사"},{"sentence":"This novel is so brilliant that it truly deserves _____ by everyone.","ko":"이 소설은 매우 훌륭해서 정말로 모든 사람에게 읽힐 만하다.","answer":["reading"],"hint":"deserve + 동명사(수동 의미)"}]},
    {"id":"w01698","w":"designer","pos":["n"],"ph":"/dɪˈzaɪnər/","cefr":"B1","kr":["디자이너"],"ex":[{"en":"She works as a fashion designer in Milan.","ko":"그녀는 밀라노에서 패션 디자이너로 일한다."}],"mnemonic":{"soundHint":"'디자이너'는 한국에서 그대로 쓰는 외래어예요.","story":"패션·그래픽 등 다양한 분야에서 '디자이너'라는 말이 그대로 통용됩니다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fashion","ko":"패션","reason":"'패션 디자이너'로 흔히 결합"},{"w":"graphic","ko":"그래픽","reason":"'그래픽 디자이너'로 대표적으로 함께 쓰임"},{"w":"design","ko":"디자인","reason":"designer의 어근이자 짝 단어"}],"collocBest":[{"en":"fashion designer","ko":"패션 디자이너"},{"en":"graphic designer","ko":"그래픽 디자이너"}]},"nuance":{"koSimple":"모양·기능을 새로 만드는 사람.","whenToUse":"패션·그래픽·제품 설계자를 가리킬 때."},"krDetail":[{"ko":"디자이너","explain":"옷·물건·건물의 모양을 계획하고 만드는 사람"}],"usageExamples":[{"en":"The designer created a new logo for the company.","ko":"그 디자이너는 회사를 위한 새 로고를 만들었다."},{"en":"He wants to become a video game designer.","ko":"그는 비디오 게임 디자이너가 되고 싶어 한다."}],"grammarNote":"designer는 '~을 만드는 사람'을 나타내는 -er 형 행위자 명사. designer 앞에 명사가 오면 designer clothes(디자이너 브랜드 옷)처럼 형용사처럼 쓰일 수 있으니 문맥으로 구분해야 한다.","grammarQuiz":[{"sentence":"She dreams of becoming a fashion _____ after finishing university next year.","ko":"그녀는 내년에 대학을 마친 후 패션 디자이너가 되는 것을 꿈꾼다.","answer":["designer"],"hint":"fashion designer"},{"sentence":"The graphic _____ created a stunning new logo for our company.","ko":"그 그래픽 디자이너는 우리 회사를 위한 멋진 새 로고를 만들었다.","answer":["designer"],"hint":"graphic designer"}]},
    {"id":"w01700","w":"desire","pos":["n","v"],"ph":"/dɪˈzaɪər/","cefr":"B1","kr":["욕망","바라다"],"ex":[{"en":"He has a strong desire to win.","ko":"그는 이기고 싶은 강한 욕망이 있다."}],"mnemonic":{"soundHint":"'디자이어' → 디자인(design)하고 싶어하는 갈망","story":"무언가를 디자인하고 싶어 안달 = desire(욕망)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"wish","ko":"바라다","reason":"desire의 기본 동의어"},{"w":"strong","ko":"강한","reason":"'강한 욕망(strong desire)'로 결합"},{"w":"fulfill","ko":"충족시키다","reason":"'욕망을 이루다'라는 시나리오에서 함께 쓰임"}],"collocBest":[]},"nuance":{"koSimple":"마음속에 강하게 끓어오르는 바람.","whenToUse":"소망·야망·욕구를 진하게 표현할 때."},"krDetail":[{"ko":"욕망","explain":"무엇을 몹시 갖고 싶어 하는 마음"},{"ko":"바라다","explain":"이루어지기를 마음속으로 원하다"}],"usageExamples":[{"en":"The young musician desired fame more than anything else in life.","ko":"그 젊은 음악가는 인생에서 그 무엇보다 명성을 갈망했다."},{"en":"Fame was desired by the young musician more than anything else in life.","ko":"명성은 그 젊은 음악가에 의해 그 무엇보다 갈망되었다."}],"grammarNote":"desire는 격식체 동사로 뒤에 to부정사(desire to know)나 that절(should + 원형)을 쓴다. 명사로는 desire for(~에 대한 욕망), desire to부정사(~하고자 하는 욕망) 형태가 자주 나온다.","grammarQuiz":[{"sentence":"He has a strong desire _____ _____ the world someday.","ko":"그는 언젠가 세계를 여행하고 싶은 강한 욕망을 가지고 있다.","answer":["to","travel"],"hint":"desire + to부정사"},{"sentence":"Everyone has a natural desire _____ love and acceptance from others.","ko":"누구나 다른 사람들로부터의 사랑과 인정에 대한 자연스러운 욕망을 지닌다.","answer":["for"],"hint":"desire for ~에 대한 욕망"}]},
    {"id":"w01705","w":"despite","pos":["prep"],"ph":"/dɪˈspaɪt/","cefr":"B1","kr":["~에도 불구하고"],"ex":[{"en":"She won despite the cold weather.","ko":"그녀는 추운 날씨에도 불구하고 이겼다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+파이트(fight,싸움)' → 반대에도 불구하고","story":"dis(반대)+pite → 반대에도 불구하고 = despite","hintConfidence":2},"pairs":{"buddyWords":[{"w":"although","ko":"비록 ~일지라도","reason":"despite와 유사 의미의 접속사로 함께 학습"},{"w":"fact","ko":"사실","reason":"'despite the fact that'로 흔히 결합"},{"w":"difficulty","ko":"어려움","reason":"'어려움에도 불구하고'라는 맥락에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"~이 있음에도 그와 반대로.","whenToUse":"뒤에 명사·동명사가 올 때."},"krDetail":[{"ko":"~에도 불구하고","explain":"어떤 상황이나 사실이 있어도 상관없이"}],"usageExamples":[{"en":"Despite the rain, they continued the football match.","ko":"비에도 불구하고 그들은 축구 경기를 계속했다."},{"en":"She smiled despite feeling very tired.","ko":"그녀는 매우 피곤했음에도 불구하고 미소 지었다."}],"grammarNote":"despite는 전치사라서 뒤에 명사(구)/동명사만 오고 절이 오면 안 된다. despite the rain(○) / despite it rained(×). 절을 쓰려면 although/though를 사용하고, despite the fact that + 절 형태도 가능하다.","grammarQuiz":[{"sentence":"_____ heavy rain, the outdoor concert continued until midnight last Saturday.","ko":"폭우에도 불구하고, 야외 콘서트는 지난 토요일 자정까지 계속되었다.","answer":["Despite"],"hint":"despite + 명사"},{"sentence":"She passed the exam despite _____ studied only two hours the night before.","ko":"그녀는 전날 밤 단 두 시간만 공부했음에도 불구하고 시험에 합격했다.","answer":["having"],"hint":"despite + 동명사(having p.p.)"}]},
    {"id":"w01711","w":"destruction","pos":["n"],"ph":"/dɪˈstrʌkʃən/","cefr":"B1","kr":["파괴","멸망"],"ex":[{"en":"The hurricane caused massive destruction.","ko":"허리케인은 엄청난 파괴를 일으켰다."}],"mnemonic":{"soundHint":"'디스트로이(destroy,파괴하다)+ction' → 파괴의 명사","story":"destroy(파괴하다)의 명사형 → destruction(파괴)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"construction","ko":"건설","reason":"destruction의 대표 반의어"},{"w":"mass","ko":"대량의","reason":"'대량 파괴(mass destruction)'로 결합"},{"w":"cause","ko":"야기하다","reason":"'파괴를 야기하다(cause destruction)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"완전히 부서지고 무너뜨림","whenToUse":"큰 규모로 파괴된 상태를 말할 때"},"krDetail":[{"ko":"파괴","explain":"부수거나 무너뜨려 못 쓰게 만드는 일"},{"ko":"멸망","explain":"완전히 없어져 자취를 감춤"}],"usageExamples":[{"en":"The war caused the destruction of many old buildings.","ko":"그 전쟁은 많은 오래된 건물의 파괴를 일으켰다."},{"en":"Pollution leads to the destruction of natural habitats.","ko":"오염은 자연 서식지의 파괴로 이어진다."}],"grammarNote":"destruction은 destroy(파괴하다)의 명사형. 뒤에 of를 써서 '~의 파괴'로 쓰고(destruction of the forest), '~에 의한'은 by를 쓴다(destruction by fire). 관련 형용사 destructive(파괴적인)도 함께 외우자.","grammarQuiz":[{"sentence":"The _____ of the rainforest threatens countless species around the world.","ko":"열대우림의 파괴는 전 세계 수많은 종들을 위협한다.","answer":["destruction"],"hint":"destruction of ~의 파괴"},{"sentence":"The earthquake caused massive _____ across the entire coastal region.","ko":"그 지진은 해안 지역 전체에 걸쳐 엄청난 파괴를 일으켰다.","answer":["destruction"],"hint":"cause + 명사"}]},
    {"id":"w01720","w":"determine","pos":["v"],"ph":"/dɪˈtɜːrmɪn/","cefr":"B1","kr":["결정하다","알아내다"],"ex":[{"en":"The test will determine the result.","ko":"시험이 결과를 결정할 것이다."}],"mnemonic":{"soundHint":"'디터미네이션(determination,결의)' 연상","story":"터미네이터가 딱! 결정 → determine(결정하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"decide","ko":"결정하다","reason":"determine의 핵심 동의어"},{"w":"cause","ko":"원인","reason":"'원인을 파악하다(determine the cause)'로 결합"},{"w":"factor","ko":"요인","reason":"'요인을 결정하다'라는 맥락에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"조사·판단을 통해 결정하거나 알아냄.","whenToUse":"결과·원인·정책을 정할 때."},"krDetail":[{"ko":"결정하다","explain":"여러 가지 중에서 하나를 확실히 정하다"},{"ko":"알아내다","explain":"정확한 사실이나 원인을 찾아 밝혀 내다"}],"usageExamples":[{"en":"The judge determined the final penalty after reviewing all the evidence.","ko":"그 판사는 모든 증거를 검토한 후 최종 처벌을 결정했다."},{"en":"The final penalty was determined after all the evidence was reviewed.","ko":"최종 처벌은 모든 증거가 검토된 후 결정되었다."}],"grammarNote":"determine 뒤에 to부정사(결심하다) 또는 wh-절/that절(밝혀내다)이 온다. be determined to do(~하기로 굳게 결심하다)는 감정 수동태 형태의 관용 표현으로 자주 시험에 나온다.","grammarQuiz":[{"sentence":"She was determined _____ _____ despite everyone telling her to quit.","ko":"그녀는 모두가 그만두라고 말했음에도 성공하기로 굳게 결심했다.","answer":["to","succeed"],"hint":"be determined to + 동사원형"},{"sentence":"Scientists are trying to determine _____ caused the sudden climate shift.","ko":"과학자들은 무엇이 그 갑작스러운 기후 변화를 일으켰는지 알아내려 하고 있다.","answer":["what"],"hint":"determine + 의문사절"}]},
    {"id":"w01728","w":"devil","pos":["n"],"ph":"/ˈdevl/","cefr":"B1","kr":["악마"],"ex":[{"en":"In many stories, the devil is a symbol of evil.","ko":"많은 이야기에서 악마는 악의 상징이다."}],"mnemonic":{"soundHint":"'데블(악마)' 외래어 → 나이트 데블","story":"빨간 삼지창 든 '데블(devil)' = 악마","hintConfidence":3},"pairs":{"buddyWords":[{"w":"angel","ko":"천사","reason":"devil의 대표 반의어(선악 대비)"},{"w":"evil","ko":"악한","reason":"'악마는 사악하다'라는 이미지로 함께 쓰임"},{"w":"disguise","ko":"위장","reason":"'위장한 악마(devil in disguise)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"이야기 속 악의 상징적 존재.","whenToUse":"종교·설화·비유적 표현에서."},"krDetail":[{"ko":"악마","explain":"사람을 나쁜 길로 이끄는 상상 속의 나쁜 존재"}],"usageExamples":[{"en":"The old legend describes a devil living in the cave.","ko":"그 오래된 전설은 동굴에 사는 악마를 묘사한다."},{"en":"In the play, the devil tempts the young man.","ko":"그 연극에서 악마가 젊은 남자를 유혹한다."}],"grammarNote":"devil은 특정 종교의 '마귀'(the Devil)로 the를 붙여 대문자로 쓰고, 일반적으로는 소문자·부정관사(a devil, devils)로 쓴다. speak of the devil은 '호랑이도 제 말 하면 온다'라는 관용구.","grammarQuiz":[{"sentence":"Speak _____ _____ devil — I was just talking about you!","ko":"호랑이도 제 말 하면 온다더니, 마침 네 얘기 하고 있었어!","answer":["of","the"],"hint":"speak of the devil 관용구"},{"sentence":"In the old story, the young man made a deal _____ the devil.","ko":"그 옛이야기 속에서, 젊은이는 악마와 거래를 했다.","answer":["with"],"hint":"make a deal with"}]},
    {"id":"w01735","w":"diagram","pos":["n"],"ph":"/ˈdaɪəɡræm/","cefr":"B1","kr":["도표","다이어그램","도식"],"ex":[{"en":"The teacher drew a diagram to explain the concept.","ko":"선생님은 개념을 설명하기 위해 도표를 그렸다."}],"mnemonic":{"soundHint":"'다이어그램'은 한국에서도 그대로 쓰이는 외래어예요.","story":"학교 발표나 보고서에서 도식을 가리켜 '다이어그램'이라고 부르는 경우가 많아요.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"chart","ko":"차트","reason":"diagram의 대표 동의어"},{"w":"flow","ko":"흐름","reason":"'흐름도(flow diagram)'로 결합"},{"w":"draw","ko":"그리다","reason":"'도표를 그리다(draw a diagram)'로 결합"}],"collocBest":[{"en":"flow diagram","ko":"흐름도"},{"en":"draw a diagram","ko":"도표를 그리다"}]},"nuance":{"koSimple":"내용을 그림·선으로 정리한 그림.","whenToUse":"설명·설계·데이터 흐름을 나타낼 때."},"krDetail":[{"ko":"도표","explain":"숫자나 정보를 한눈에 보기 쉽게 그린 그림"},{"ko":"도식","explain":"복잡한 것을 간단한 선과 모양으로 나타낸 그림"}],"usageExamples":[{"en":"The diagram shows how the machine works.","ko":"그 도표는 그 기계가 어떻게 작동하는지 보여 준다."},{"en":"Please label each part of the diagram clearly.","ko":"도식의 각 부분에 이름을 분명하게 붙이세요."}],"grammarNote":"diagram은 셀 수 있는 명사라서 앞에 a/an이나 복수형(diagrams)을 반드시 붙인다. draw a diagram(도표를 그리다), in the diagram(도표에서)의 형태가 자주 등장한다.","grammarQuiz":[{"sentence":"The teacher drew _____ diagram to explain how the water cycle works.","ko":"선생님은 물의 순환이 어떻게 작동하는지 설명하기 위해 도표를 그렸다.","answer":["a"],"hint":"가산명사 diagram"},{"sentence":"As shown _____ the diagram, the process has three main steps.","ko":"도표에서 보여지듯이, 그 과정은 세 개의 주요 단계를 가지고 있다.","answer":["in"],"hint":"as shown in the diagram"}]},
    {"id":"w01737","w":"dialogue","pos":["n"],"ph":"/ˈdaɪəlɒɡ/","cefr":"B1","kr":["대화","대화문"],"ex":[{"en":"The dialogue was very realistic.","ko":"대화는 매우 사실적이었다."}],"mnemonic":{"soundHint":"'다이얼로그' 외래어 → 컴퓨터 대화상자","story":"컴퓨터 대화상자(dialogue box) = 대화창 → dialogue(대화)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"conversation","ko":"대화","reason":"dialogue의 대표 동의어"},{"w":"monologue","ko":"독백","reason":"dialogue의 대표 반의어"},{"w":"open","ko":"개방된","reason":"'개방적인 대화(open dialogue)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"두 사람 이상이 주고받는 말.","whenToUse":"소설·영화 대사, 대화형 소통에서."},"krDetail":[{"ko":"대화","explain":"두 사람 이상이 서로 이야기를 주고받는 일"},{"ko":"대화문","explain":"책이나 대본에서 인물들이 나눈 말을 적은 글"}],"usageExamples":[{"en":"The two leaders opened a dialogue about peace.","ko":"두 지도자는 평화에 관한 대화를 시작했다."},{"en":"Practice reading the dialogue with a partner.","ko":"짝과 함께 그 대화문을 읽는 연습을 하세요."}],"grammarNote":"dialogue는 미국식으로 dialog라고도 쓴다. between/among ~ 형태로 대화 참여자를 나타내고(dialogue between two nations), 관용적으로 open a dialogue(대화를 시작하다), enter into a dialogue(대화에 참여하다)로 쓴다.","grammarQuiz":[{"sentence":"There must be honest dialogue _____ the two countries to solve this problem.","ko":"이 문제를 해결하기 위해 두 나라 사이에 솔직한 대화가 있어야 한다.","answer":["between"],"hint":"dialogue between + 둘"},{"sentence":"The writer tries to _____ dialogue with readers through her novels.","ko":"그 작가는 자신의 소설을 통해 독자들과 대화를 시작하려고 한다.","answer":["open"],"hint":"open a dialogue"}]},
    {"id":"w01738","w":"diameter","pos":["n"],"ph":"/daɪˈæmɪtər/","cefr":"B1","kr":["지름","직경"],"ex":[{"en":"The circle has a diameter of 10 cm.","ko":"원의 지름은 10cm이다."}],"mnemonic":{"soundHint":"'다이아(dia-,가로질러)+미터(meter,측정)' → 가로지르는 길이","story":"dia(가로질러)+meter(측정) → 원을 가로지르는 길이 = diameter(지름)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"measure","ko":"측정하다","reason":"'지름을 측정하다(measure the diameter)'로 결합"},{"w":"circle","ko":"원","reason":"원의 지름을 나타낼 때 함께 쓰임"},{"w":"radius","ko":"반지름","reason":"지름과 반지름은 수학에서 짝으로 학습"}],"collocBest":[]},"nuance":{"koSimple":"원 한가운데를 가로지르는 길이.","whenToUse":"수학·과학에서 원의 크기를 잴 때."},"krDetail":[{"ko":"지름","explain":"동그라미의 한 점에서 반대쪽 점까지 곧게 그은 선의 길이"},{"ko":"직경","explain":"원의 한가운데를 지나 양 끝을 이은 선의 길이"}],"usageExamples":[{"en":"The pizza has a diameter of about thirty centimeters.","ko":"그 피자는 지름이 약 30센티미터이다."},{"en":"Measure the diameter of the pipe before you cut it.","ko":"자르기 전에 그 관의 직경을 재라."}],"grammarNote":"diameter는 in diameter의 형태로 '지름이 ~인'을 나타낸다. The pond is 5 meters in diameter(그 연못은 지름이 5m이다). radius(반지름)와 짝지어 외우자.","grammarQuiz":[{"sentence":"The ancient tree measured about three meters _____ diameter at the base.","ko":"그 고목은 밑동에서 지름이 약 3미터로 측정되었다.","answer":["in"],"hint":"숫자 + in diameter"},{"sentence":"Scientists carefully measured the _____ of the crater from space.","ko":"과학자들은 우주에서 그 분화구의 지름을 신중하게 측정했다.","answer":["diameter"],"hint":"measure the diameter"}]},
    {"id":"w01745","w":"diesel","pos":["n"],"ph":"/ˈdiːzəl/","cefr":"B1","kr":["디젤","경유"],"ex":[{"en":"This truck runs on diesel fuel.","ko":"이 트럭은 디젤 연료로 작동한다."}],"mnemonic":{"soundHint":"'디젤'은 한국 주유소·자동차에서 그대로 쓰는 외래어예요.","story":"주유소 표시나 차량 광고에서 흔히 보는 '디젤'은 경유 연료를 뜻해요.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"engine","ko":"엔진","reason":"'디젤 엔진(diesel engine)'로 결합"},{"w":"fuel","ko":"연료","reason":"'디젤 연료(diesel fuel)'로 결합"},{"w":"truck","ko":"트럭","reason":"트럭·버스가 디젤을 사용한다는 시나리오"}],"collocBest":[{"en":"diesel engine","ko":"디젤 엔진"},{"en":"diesel fuel","ko":"디젤 연료"}]},"nuance":{"koSimple":"트럭·기관차에 쓰이는 기름 연료.","whenToUse":"엔진·연료 종류를 말할 때."},"krDetail":[{"ko":"디젤","explain":"트럭·기차 등에서 쓰는 짙은 색의 기름"},{"ko":"경유","explain":"휘발유보다 무거워 무거운 차량 연료로 쓰이는 기름"}],"usageExamples":[{"en":"Many buses in the city still use diesel.","ko":"그 도시의 많은 버스가 여전히 경유를 사용한다."},{"en":"A diesel engine is usually louder than a gasoline one.","ko":"디젤 엔진은 보통 휘발유 엔진보다 더 시끄럽다."}],"grammarNote":"diesel은 셀 수 없는 물질명사(연료)로 쓰일 때는 관사 없이, 셀 수 있는 명사(디젤 차량)로 쓰일 때는 관사와 함께 쓴다. run on diesel(디젤로 움직이다)에서 전치사 on에 주의.","grammarQuiz":[{"sentence":"Most trucks and buses in this country still run _____ diesel.","ko":"이 나라의 대부분의 트럭과 버스는 여전히 디젤로 달린다.","answer":["on"],"hint":"run on + 연료"},{"sentence":"The price of _____ has risen sharply over the past six months.","ko":"지난 6개월 동안 경유 가격이 급격히 올랐다.","answer":["diesel"],"hint":"물질명사로 관사 없이"}]},
    {"id":"w01766","w":"dine","pos":["v"],"ph":"/daɪn/","cefr":"B1","kr":["식사하다","정찬을 먹다"],"ex":[{"en":"They dined at a fine restaurant.","ko":"그들은 훌륭한 레스토랑에서 식사했다."}],"mnemonic":{"soundHint":"'다이닝(dining) 룸' 외래어 → 식당","story":"다이닝룸(dining room) = 식사 공간 → dine(식사하다)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eat","ko":"먹다","reason":"dine의 기본 동의어"},{"w":"restaurant","ko":"식당","reason":"'식당에서 식사하다'라는 시나리오"},{"w":"out","ko":"밖에","reason":"'외식하다(dine out)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"차려진 식탁에서 격식 있게 먹다.","whenToUse":"저녁 식사·외식을 말할 때."},"krDetail":[{"ko":"식사하다","explain":"밥이나 음식을 격식 있게 먹다"},{"ko":"정찬을 먹다","explain":"격식을 갖춘 저녁 식사를 하다"}],"usageExamples":[{"en":"We often dine out on Friday evenings.","ko":"우리는 금요일 저녁마다 자주 외식한다."},{"en":"They dined together at an elegant restaurant.","ko":"그들은 우아한 식당에서 함께 식사했다."}],"grammarNote":"dine은 자동사라서 목적어를 바로 받지 않는다. dine out(외식하다), dine on + 음식(~을 먹다), dine with + 사람(~와 식사하다)의 형태로 자주 쓰인다. 일상 회화에서는 eat/have dinner가 더 흔하다.","grammarQuiz":[{"sentence":"We are planning to dine _____ at that new Italian restaurant tonight.","ko":"우리는 오늘 밤 그 새로운 이탈리안 식당에서 외식할 계획이다.","answer":["out"],"hint":"dine out 외식하다"},{"sentence":"The royal guests dined _____ fresh seafood and imported champagne.","ko":"왕실 손님들은 신선한 해산물과 수입 샴페인으로 정찬을 즐겼다.","answer":["on"],"hint":"dine on + 음식"}]},
    {"id":"w01770","w":"diploma","pos":["n"],"ph":"/dɪˈploʊmə/","cefr":"B1","kr":["졸업장","수료증"],"ex":[{"en":"She received a high school diploma.","ko":"그녀는 고등학교 졸업장을 받았다."}],"mnemonic":{"soundHint":"'디플로마' 외래어 → 졸업장","story":"'디플로마 코스' 등 외래어 그대로 = 졸업장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"certificate","ko":"증명서","reason":"diploma의 대표 동의어"},{"w":"graduate","ko":"졸업하다","reason":"졸업 시 diploma를 받는다는 짝"},{"w":"school","ko":"학교","reason":"'고등학교 졸업장(high school diploma)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"과정을 마쳤음을 증명하는 종이.","whenToUse":"고교·대학·수료 과정 결과물에."},"krDetail":[{"ko":"졸업장","explain":"학교나 과정을 마쳤음을 나타내는 종이 문서"},{"ko":"수료증","explain":"정해진 교육 과정을 다 마쳤음을 확인해 주는 종이"}],"usageExamples":[{"en":"He proudly showed his high school diploma to his parents.","ko":"그는 부모님께 고등학교 졸업장을 자랑스럽게 보여 주었다."},{"en":"You need a diploma to apply for this program.","ko":"이 프로그램에 지원하려면 수료증이 필요하다."}],"grammarNote":"diploma는 셀 수 있는 명사로 부정관사와 함께 쓴다. earn a diploma(졸업장을 받다), a high school diploma(고졸 졸업장), diploma in ~(~ 분야 학위) 형태를 익혀두자. degree보다 짧고 실무 위주인 자격을 뜻할 때가 많다.","grammarQuiz":[{"sentence":"She earned _____ diploma in graphic design after two years of study.","ko":"그녀는 2년간의 공부 끝에 그래픽 디자인 분야의 수료증을 받았다.","answer":["a"],"hint":"가산명사 diploma + a"},{"sentence":"You must have a high school _____ to apply for this job.","ko":"이 일자리에 지원하려면 고등학교 졸업장이 있어야 한다.","answer":["diploma"],"hint":"high school diploma"}]},
    {"id":"w01780","w":"disability","pos":["n"],"ph":"/ˌdɪsəˈbɪlɪti/","cefr":"B1","kr":["장애","무능력"],"ex":[{"en":"He lives with a physical disability.","ko":"그는 신체 장애를 가지고 살아간다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+어빌리티(ability,능력)' → 능력이 없음","story":"dis(부정)+ability(능력) → 능력의 부재 = disability(장애)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ability","ko":"능력","reason":"disability의 대표 반의어"},{"w":"learning","ko":"학습","reason":"'학습 장애(learning disability)'로 결합"},{"w":"physical","ko":"신체적인","reason":"'신체 장애(physical disability)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"몸이나 정신 기능이 제한된 상태.","whenToUse":"신체·학습 관련 어려움을 말할 때."},"krDetail":[{"ko":"장애","explain":"몸이나 마음의 일부가 제 기능을 하지 못하는 상태"},{"ko":"무능력","explain":"어떤 일을 잘 해낼 힘이 없는 상태"}],"usageExamples":[{"en":"The building has ramps for people with a disability.","ko":"그 건물에는 장애가 있는 사람들을 위한 경사로가 있다."},{"en":"She overcame her disability and became a champion.","ko":"그녀는 자신의 장애를 극복하고 챔피언이 되었다."}],"grammarNote":"disability는 셀 수 있는 명사(specific 장애: a learning disability)와 셀 수 없는 명사(장애 전반: 조건, 상태) 둘 다로 쓸 수 있다. people with disabilities가 정치적으로 올바른 표현이며 disabled people보다 선호된다.","grammarQuiz":[{"sentence":"Many students _____ learning disabilities need extra support in school.","ko":"많은 학습 장애가 있는 학생들은 학교에서 추가적인 지원을 필요로 한다.","answer":["with"],"hint":"with + 명사(~을 가진)"},{"sentence":"The new law protects the rights of people _____ disabilities in the workplace.","ko":"새 법안은 직장에서 장애인들의 권리를 보호한다.","answer":["with"],"hint":"people with disabilities"}]},
    {"id":"w01781","w":"disabled","pos":["adj"],"ph":"/dɪˈseɪbld/","cefr":"B1","kr":["장애가 있는","기능이 정지된"],"ex":[{"en":"She volunteers with disabled children.","ko":"그녀는 장애 아동과 함께 봉사한다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+에이블드(abled,가능한)' → 기능이 정지된","story":"dis(부정)+enabled(가능한) → 기능이 꺼진 = disabled(장애가 있는)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"person","ko":"사람","reason":"'장애인(disabled person)'로 결합"},{"w":"facility","ko":"시설","reason":"'장애인 시설(disabled facility)'로 결합"},{"w":"access","ko":"접근","reason":"'장애인 접근성' 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"장애로 활동이 제한된 상태의.","whenToUse":"사람·시설을 정중히 지칭할 때."},"krDetail":[{"ko":"장애가 있는","explain":"몸이나 마음이 제 기능을 온전히 하지 못하는"},{"ko":"기능이 정지된","explain":"제대로 작동하지 못하게 된"}],"usageExamples":[{"en":"The park provides special seats for disabled visitors.","ko":"그 공원은 장애가 있는 방문객을 위한 특별 좌석을 제공한다."},{"en":"The alarm was disabled during the repair.","ko":"수리하는 동안 그 경보 장치는 기능이 정지되었다."}],"grammarNote":"disabled는 원래 disable(무력하게 하다)의 과거분사에서 온 형용사. 사람을 지칭할 때 the disabled(장애인들 전체)처럼 the + 형용사가 복수 보통명사로 쓰인다. 최근 영어에서는 people with disabilities 표현이 더 예의 바르다.","grammarQuiz":[{"sentence":"_____ disabled deserve equal opportunities in every part of society.","ko":"장애인들은 사회 모든 부분에서 동등한 기회를 받을 자격이 있다.","answer":["The"],"hint":"the + 형용사 = 복수 보통명사"},{"sentence":"The building must have proper facilities _____ disabled visitors.","ko":"그 건물은 장애가 있는 방문객들을 위한 적절한 시설을 갖추어야 한다.","answer":["for"],"hint":"facilities for + 대상"}]},
    {"id":"w01782","w":"disadvantage","pos":["n"],"ph":"/ˌdɪsədˈvɑːntɪdʒ/","cefr":"B1","kr":["불이익","단점"],"ex":[{"en":"There is one major disadvantage.","ko":"주요 단점이 하나 있다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+어드밴티지(advantage,이점)' → 이점의 반대","story":"advantage(이점)의 반대 = disadvantage(불이익, 단점)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"advantage","ko":"이점","reason":"disadvantage의 대표 반의어"},{"w":"competitive","ko":"경쟁의","reason":"'경쟁상 불리함'으로 결합"},{"w":"weakness","ko":"약점","reason":"disadvantage의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"손해가 되거나 불리한 점.","whenToUse":"장점 대비로 단점을 짚을 때."},"krDetail":[{"ko":"불이익","explain":"이롭지 않고 손해가 되는 일"},{"ko":"단점","explain":"부족하거나 나쁜 점"}],"usageExamples":[{"en":"One disadvantage of the plan is its high cost.","ko":"그 계획의 한 가지 단점은 높은 비용이다."},{"en":"Living far from school puts him at a disadvantage.","ko":"학교에서 멀리 사는 것은 그를 불리하게 만든다."}],"grammarNote":"disadvantage는 반의어 advantage와 짝을 이루고, at a disadvantage(불리한 처지에), put/place ~ at a disadvantage(~를 불리하게 만들다) 형태로 자주 쓴다. 뒤에 of + 명사/동명사가 붙어 '~라는 단점'을 나타낸다.","grammarQuiz":[{"sentence":"Small companies are often _____ _____ disadvantage when competing with global brands.","ko":"작은 회사들은 세계적 브랜드들과 경쟁할 때 종종 불리한 처지에 놓인다.","answer":["at","a"],"hint":"at a disadvantage"},{"sentence":"One major _____ of online learning is the lack of face-to-face interaction.","ko":"온라인 학습의 주요한 단점 중 하나는 대면 상호작용의 부족이다.","answer":["disadvantage"],"hint":"disadvantage of ~"}]},
    {"id":"w01787","w":"disaster","pos":["n"],"ph":"/dɪˈzɑːstər/","cefr":"B1","kr":["재난","재해"],"ex":[{"en":"The earthquake was a natural disaster.","ko":"지진은 자연재해였다."}],"mnemonic":{"soundHint":"'디스(dis-,나쁜)+애스터(aster,별)' → 별자리가 나쁨 = 불운","story":"옛사람들은 별이 어긋나면 재앙이 온다고 믿음 → disaster(재난)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"natural","ko":"자연의","reason":"'자연재해(natural disaster)'로 결합"},{"w":"relief","ko":"구호","reason":"'재난 구호(disaster relief)'로 결합"},{"w":"tragedy","ko":"비극","reason":"disaster의 대표 동의어"}],"collocBest":[]},"nuance":{"koSimple":"큰 피해를 남기는 재난.","whenToUse":"자연·인재·실패를 강조할 때."},"krDetail":[{"ko":"재난","explain":"갑자기 닥쳐 큰 피해를 주는 사고"},{"ko":"재해","explain":"지진·홍수처럼 사람들에게 해를 입히는 큰 사건"}],"usageExamples":[{"en":"The flood was the worst disaster in the region's history.","ko":"그 홍수는 그 지역 역사상 최악의 재난이었다."},{"en":"Without practice, the concert could be a disaster.","ko":"연습 없이는 그 콘서트가 엉망이 될 수 있다."}],"grammarNote":"disaster는 셀 수 있는 명사. natural disaster(자연재해), disaster area(재해 지역), disaster relief(재난 구호)처럼 명사+명사 복합어로 자주 쓰인다. 형용사형 disastrous(끔찍한, 참담한)도 함께 익히자.","grammarQuiz":[{"sentence":"Volunteers rushed to help victims of the natural _____ last week.","ko":"자원봉사자들이 지난주 자연재해 피해자들을 돕기 위해 급히 달려갔다.","answer":["disaster"],"hint":"natural disaster"},{"sentence":"The failure of the project turned out to be a complete _____.","ko":"그 프로젝트의 실패는 완전한 재앙으로 드러났다.","answer":["disaster"],"hint":"비유적 의미의 disaster"}]},
    {"id":"w01794","w":"discourage","pos":["v"],"ph":"/dɪˈskɜːrɪdʒ/","cefr":"B1","kr":["낙담시키다","막다"],"ex":[{"en":"Don't let failure discourage you.","ko":"실패가 너를 낙담시키지 않도록 해."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+커리지(courage,용기)' → 용기를 꺾다","story":"dis(반대)+courage(용기) → 용기를 꺾어 낙담시키다 = discourage","hintConfidence":3},"pairs":{"buddyWords":[{"w":"encourage","ko":"격려하다","reason":"discourage의 대표 반의어"},{"w":"strongly","ko":"강하게","reason":"'강하게 만류하다(strongly discourage)'로 결합"},{"w":"student","ko":"학생","reason":"'학생을 낙담시키다' 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"의욕을 꺾어 못 하게 만들다.","whenToUse":"충고·경고로 하지 말라고 할 때."},"krDetail":[{"ko":"낙담시키다","explain":"기가 죽어 마음이 꺾이게 만들다"},{"ko":"막다","explain":"무언가를 하지 않도록 말리다"}],"usageExamples":[{"en":"The strict rules discouraged many students from joining the debate club.","ko":"엄격한 규칙들은 많은 학생들이 토론 동아리에 가입하는 것을 막았다."},{"en":"Many students were discouraged from joining the debate club by the strict rules.","ko":"많은 학생들은 엄격한 규칙 때문에 토론 동아리에 가입하지 못하게 되었다."}],"grammarNote":"discourage는 discourage + 목적어 + from + 동명사(~가 …하지 못하게 하다) 구조가 핵심이다. prevent, stop, keep 등도 같은 from + ~ing 구문을 쓴다. 반의어 encourage는 to부정사를 쓰는 것과 대조된다.","grammarQuiz":[{"sentence":"Parents often discourage their children _____ _____ too many video games.","ko":"부모들은 종종 자녀들이 너무 많은 비디오 게임을 하지 못하게 한다.","answer":["from","playing"],"hint":"discourage 사람 from ~ing"},{"sentence":"Don't be _____ by a single failure — try again with a fresh mind.","ko":"한 번의 실패로 낙담하지 마라. 새로운 마음으로 다시 시도해 봐라.","answer":["discouraged"],"hint":"감정 수동태 be discouraged"}]},
    {"id":"w01807","w":"dishwasher","pos":["n"],"ph":"/ˈdɪʃwɒʃər/","cefr":"B1","kr":["식기세척기"],"ex":[{"en":"Put the plates in the dishwasher.","ko":"접시를 식기세척기에 넣어."}],"mnemonic":{"soundHint":"'디시(dish,접시)+워셔(washer,세척기)' → 접시 세척기","story":"dish(접시)+washer(씻는 기계) → dishwasher(식기세척기)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"run","ko":"돌리다","reason":"'식기세척기를 돌리다(run the dishwasher)'로 결합"},{"w":"dish","ko":"접시","reason":"dishwasher가 세척하는 대상"},{"w":"kitchen","ko":"부엌","reason":"식기세척기는 부엌 가전이라는 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"그릇을 자동으로 씻어 주는 기계.","whenToUse":"주방 가전 이야기를 할 때."},"krDetail":[{"ko":"식기세척기","explain":"그릇이나 컵을 자동으로 씻어 주는 부엌 기계"}],"usageExamples":[{"en":"Load the dirty plates into the dishwasher, please.","ko":"더러운 접시들을 식기세척기에 넣어 주세요."},{"en":"Our new dishwasher is very quiet and saves water.","ko":"우리의 새 식기세척기는 아주 조용하고 물을 절약한다."}],"grammarNote":"dishwasher는 dish + washer의 합성어로 셀 수 있는 명사. load the dishwasher(식기세척기에 그릇을 채우다), run the dishwasher(식기세척기를 돌리다)처럼 동사와 자주 결합해서 시험에 나온다.","grammarQuiz":[{"sentence":"Please load the dirty dishes _____ the dishwasher after dinner tonight.","ko":"오늘 밤 저녁 식사 후에 더러운 그릇들을 식기세척기에 넣어 주세요.","answer":["into"],"hint":"load ~ into"},{"sentence":"The new _____ washes dishes much more quietly than the old one.","ko":"새 식기세척기는 예전 것보다 훨씬 더 조용하게 그릇을 씻는다.","answer":["dishwasher"],"hint":"가전제품 명사"}]},
    {"id":"w01816","w":"display","pos":["v","n"],"ph":"/dɪˈspleɪ/","cefr":"B1","kr":["전시하다","표시"],"ex":[{"en":"Works were displayed in the gallery.","ko":"작품들이 갤러리에 전시되었다."}],"mnemonic":{"soundHint":"'디스플레이' 외래어 → 화면·전시","story":"휴대폰 디스플레이 = 화면 표시 → display(전시하다, 표시)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hide","ko":"숨기다","reason":"display의 대표 반의어"},{"w":"exhibit","ko":"전시하다","reason":"display의 대표 동의어"},{"w":"screen","ko":"화면","reason":"'디스플레이 화면(display screen)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"보라고 앞에 내놓거나 화면에 나타냄.","whenToUse":"전시·화면 표시·감정 표현에."},"krDetail":[{"ko":"전시하다","explain":"여러 사람이 볼 수 있게 벌여 놓다"},{"ko":"표시","explain":"정보를 화면 등에 나타내 보이는 것"}],"usageExamples":[{"en":"The museum displayed rare ancient artifacts in the main hall yesterday.","ko":"박물관은 어제 본관에 희귀한 고대 유물들을 전시했다."},{"en":"Rare ancient artifacts were displayed in the main hall yesterday.","ko":"희귀한 고대 유물들이 어제 본관에 전시되었다."}],"grammarNote":"display는 동사와 명사가 형태가 같다. 명사로 on display(전시 중)이라는 관용구, 동사로 display + 감정/특성(~을 드러내다) 뜻이 시험에 나온다. put ~ on display(~을 전시하다)도 자주 쓰이는 표현.","grammarQuiz":[{"sentence":"The winning paintings are currently _____ display at the city gallery.","ko":"수상작들은 현재 시립 미술관에서 전시 중이다.","answer":["on"],"hint":"on display 전시 중"},{"sentence":"The young athlete displayed remarkable courage _____ the final round.","ko":"그 어린 선수는 결승전에서 놀라운 용기를 드러냈다.","answer":["in"],"hint":"in + 시간/상황"}]},
    {"id":"w01826","w":"distant","pos":["adj"],"ph":"/ˈdɪstənt/","cefr":"B1","kr":["먼","거리가 있는"],"ex":[{"en":"A distant star shone brightly.","ko":"먼 별이 밝게 빛났다."}],"mnemonic":{"soundHint":"'디스턴스(distance,거리)+t' → 거리가 있는","story":"distance(거리)의 형용사 → distant(먼)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"near","ko":"가까운","reason":"distant의 대표 반의어"},{"w":"past","ko":"과거","reason":"'먼 과거(distant past)'로 결합"},{"w":"relative","ko":"친척","reason":"'먼 친척(distant relative)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"공간·시간·관계가 멀리 떨어진.","whenToUse":"먼 거리, 먼 과거, 먼 친척 등에."},"krDetail":[{"ko":"먼","explain":"공간이나 시간이 많이 떨어져 있는"},{"ko":"거리가 있는","explain":"친밀하지 않고 서먹서먹한 느낌이 있는"}],"usageExamples":[{"en":"We could hear the distant sound of thunder.","ko":"우리는 멀리서 나는 천둥소리를 들을 수 있었다."},{"en":"He is a distant relative I rarely meet.","ko":"그는 내가 거의 만나지 않는 먼 친척이다."}],"grammarNote":"distant는 물리적 거리(distant star)와 관계·성격(distant relative, distant manner) 둘 다 나타낸다. far와 달리 명사 앞 수식(a distant country)에 자유롭게 쓰이고, in the distant past(먼 과거에)라는 표현도 자주 나온다.","grammarQuiz":[{"sentence":"The stars we see tonight are billions of years old and very _____.","ko":"오늘 밤 우리가 보는 별들은 수십억 년 되고 매우 멀리 있다.","answer":["distant"],"hint":"형용사 서술적 용법"},{"sentence":"In the _____ past, dinosaurs roamed freely across the ancient land.","ko":"먼 과거에, 공룡들은 고대 땅 위를 자유롭게 돌아다녔다.","answer":["distant"],"hint":"in the distant past"}]},
    {"id":"w01832","w":"distract","pos":["v"],"ph":"/dɪˈstrækt/","cefr":"B1","kr":["주의를 분산시키다","산만하게 하다"],"ex":[{"en":"Don't let noise distract you from studying.","ko":"소음이 공부에 집중하는 것을 방해하게 두지 마라."}],"mnemonic":{"soundHint":"'디스(dis-,다른)+트랙트(tract,끌다)' → 다른 곳으로 끌다","story":"dis(다른)+tract(끌다) → 주의를 다른 곳으로 끌어 흐트리다 = distract(산만하게 하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"focus","ko":"집중하다","reason":"distract의 대표 반의어"},{"w":"attention","ko":"주의","reason":"'주의를 분산시키다(distract attention)'로 결합"},{"w":"easily","ko":"쉽게","reason":"'쉽게 산만해지는(easily distracted)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"주의를 다른 데로 끌어 흐트러뜨리다.","whenToUse":"집중을 방해하는 상황에서."},"krDetail":[{"ko":"주의를 분산시키다","explain":"정신을 다른 곳으로 흩어지게 하다"},{"ko":"산만하게 하다","explain":"집중하지 못하고 어수선하게 만들다"}],"usageExamples":[{"en":"Loud music from outside distracted the students during the important exam.","ko":"밖에서 들리는 시끄러운 음악이 중요한 시험 도중 학생들의 주의를 분산시켰다."},{"en":"The students were distracted by loud music from outside during the important exam.","ko":"학생들은 중요한 시험 도중 밖에서 들리는 시끄러운 음악에 산만해졌다."}],"grammarNote":"distract + 사람 + from + 동명사/명사(~가 …에 집중하지 못하게 하다) 구조가 시험 포인트. 감정 수동태 be distracted by(~때문에 산만해지다)와 형용사 distracted(정신이 산만한), distracting(산만하게 하는)의 구분도 중요하다.","grammarQuiz":[{"sentence":"Please turn off your phone so it doesn't distract you _____ studying.","ko":"네가 공부에 집중하지 못하게 하지 않도록 휴대폰을 꺼 주세요.","answer":["from"],"hint":"distract 사람 from ~ing"},{"sentence":"He looked completely _____ during the meeting, staring blankly out the window.","ko":"그는 회의 내내 완전히 정신이 산만해 보였고, 창밖을 멍하니 바라보고 있었다.","answer":["distracted"],"hint":"감정 형용사 -ed"}]},
    {"id":"w01834","w":"distribute","pos":["v"],"ph":"/dɪˈstrɪbjuːt/","cefr":"B1","kr":["분배하다","배포하다"],"ex":[{"en":"Food was distributed to people.","ko":"식량이 사람들에게 분배되었다."}],"mnemonic":{"soundHint":"'디스(dis-,따로)+트리뷰트(tribute,나눔)' → 따로따로 나눠주다","story":"dis(따로)+tribute(주다) → 따로따로 나눠주다 = distribute(분배하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collect","ko":"모으다","reason":"distribute의 대표 반의어"},{"w":"equally","ko":"균등하게","reason":"'균등하게 분배하다(distribute equally)'로 결합"},{"w":"material","ko":"자료","reason":"'자료를 배포하다(distribute materials)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"여러 사람에게 나누어 주다.","whenToUse":"물자·자료·상품을 배포할 때."},"krDetail":[{"ko":"분배하다","explain":"몫몫이 나누어 주다"},{"ko":"배포하다","explain":"여러 사람에게 널리 나누어 주다"}],"usageExamples":[{"en":"Volunteers distributed free meals to homeless people across the city yesterday.","ko":"자원봉사자들은 어제 도시 곳곳에서 노숙자들에게 무료 식사를 나누어 주었다."},{"en":"Free meals were distributed to homeless people across the city yesterday.","ko":"무료 식사가 어제 도시 곳곳에서 노숙자들에게 나누어졌다."}],"grammarNote":"distribute + 사물 + to/among + 사람 구조가 핵심. to는 개별 대상, among은 그룹 내 분배를 강조한다. be distributed evenly/equally(고르게 분배되다)라는 수동형 표현도 자주 나온다.","grammarQuiz":[{"sentence":"The teacher will distribute the test papers _____ every student in class.","ko":"선생님은 반의 모든 학생들에게 시험지를 나눠 줄 것이다.","answer":["to"],"hint":"distribute to + 개별 대상"},{"sentence":"The relief supplies were distributed _____ the affected villagers fairly.","ko":"구호 물품은 피해를 입은 마을 사람들 사이에 공정하게 분배되었다.","answer":["among"],"hint":"distribute among + 그룹"}]},
    {"id":"w01835","w":"distribution","pos":["n"],"ph":"/ˌdɪstrɪˈbjuːʃən/","cefr":"B1","kr":["분배","유통"],"ex":[{"en":"Distribution of resources was fair.","ko":"자원 분배가 공정했다."}],"mnemonic":{"soundHint":"'디스트리뷰트(distribute)+ion' → 분배의 명사","story":"distribute(분배하다)의 명사형 → distribution(분배)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"income","ko":"소득","reason":"'소득 분배(income distribution)'로 결합"},{"w":"network","ko":"망","reason":"'유통망(distribution network)'로 결합"},{"w":"delivery","ko":"배달","reason":"distribution의 동의어이자 유통 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"나누어 전달·배치되는 과정.","whenToUse":"경제 분배, 유통망 이야기에."},"krDetail":[{"ko":"분배","explain":"몫몫이 나누어 주는 일"},{"ko":"유통","explain":"물건이 만든 곳에서 소비자에게로 옮겨 가는 흐름"}],"usageExamples":[{"en":"The fair distribution of food helped many families.","ko":"공정한 식량 분배는 많은 가정을 도왔다."},{"en":"The company handles the distribution of the products.","ko":"그 회사는 제품의 유통을 담당한다."}],"grammarNote":"distribution은 distribute의 명사형. distribution of + 명사(~의 분배), income distribution(소득 분배), distribution network(유통망)처럼 명사끼리 결합해서 시험에 자주 나온다. 관련 형용사 distributive도 함께 익혀두자.","grammarQuiz":[{"sentence":"The unfair _____ of wealth is a major issue in modern society.","ko":"부의 불공정한 분배는 현대 사회의 주요 문제이다.","answer":["distribution"],"hint":"distribution of ~"},{"sentence":"The company built a large _____ network across the entire country.","ko":"그 회사는 전국에 걸쳐 큰 유통망을 구축했다.","answer":["distribution"],"hint":"distribution network"}]},
    {"id":"w01836","w":"district","pos":["n"],"ph":"/ˈdɪstrɪkt/","cefr":"B1","kr":["지구","지역"],"ex":[{"en":"She lives in a school district.","ko":"그녀는 학교 구역에 산다."}],"mnemonic":{"soundHint":"'디스트릭트 9' 영화 연상 → 특정 구역","story":"영화 <디스트릭트 9>의 그 district = 지역, 구역","hintConfidence":2},"pairs":{"buddyWords":[{"w":"area","ko":"지역","reason":"district의 대표 동의어"},{"w":"business","ko":"사업의","reason":"'비즈니스 지구(business district)'로 결합"},{"w":"school","ko":"학교","reason":"'학교 구역(school district)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"행정·기능으로 나뉜 지역.","whenToUse":"상업·학군·행정 구역을 말할 때."},"krDetail":[{"ko":"지구","explain":"행정이나 특정 목적으로 나누어 놓은 땅의 구역"},{"ko":"지역","explain":"일정한 특징이 있는 넓은 땅의 부분"}],"usageExamples":[{"en":"This shopping district is busy on weekends.","ko":"이 쇼핑 지구는 주말에 붐빈다."},{"en":"The school is located in a quiet residential district.","ko":"그 학교는 조용한 주거 지역에 있다."}],"grammarNote":"district는 셀 수 있는 명사. 미국 학군을 뜻하는 school district, 상업 지구를 뜻하는 business/financial district, 국회의원 선거구인 electoral district처럼 특정 성격의 구역을 나타낼 때 형용사와 함께 쓴다.","grammarQuiz":[{"sentence":"This restaurant is located in the busiest business _____ of the city.","ko":"이 식당은 그 도시의 가장 번화한 비즈니스 지구에 위치해 있다.","answer":["district"],"hint":"business district"},{"sentence":"Every child _____ this district must attend the local elementary school.","ko":"이 학군의 모든 아이는 지역 초등학교에 다녀야 한다.","answer":["in"],"hint":"in + 지역/구역"}]},
    {"id":"w01837","w":"disturb","pos":["v"],"ph":"/dɪˈstɜːrb/","cefr":"B1","kr":["방해하다","불안하게 하다"],"ex":[{"en":"Please do not disturb anyone.","ko":"아무도 방해하지 마세요."}],"mnemonic":{"soundHint":"'디스(dis-,흐트림)+터브(turb,돌다)' → 헝클어 놓다","story":"dis(반대)+turb(돌다) → 흐름을 흐트려 방해하다 = disturb","hintConfidence":2},"pairs":{"buddyWords":[{"w":"calm","ko":"진정시키다","reason":"disturb의 대표 반의어"},{"w":"sleep","ko":"잠","reason":"'잠을 방해하다(disturb sleep)'로 결합"},{"w":"interrupt","ko":"중단시키다","reason":"disturb의 대표 동의어"}],"collocBest":[]},"nuance":{"koSimple":"조용함·평온을 흔들어 방해함.","whenToUse":"수면·회의·평화를 깨뜨릴 때."},"krDetail":[{"ko":"방해하다","explain":"하고 있는 일을 못 하도록 가로막다"},{"ko":"불안하게 하다","explain":"마음이 편치 않게 흔들리게 만들다"}],"usageExamples":[{"en":"Loud construction noises disturbed the sleeping baby all through the night.","ko":"시끄러운 공사 소음이 밤새도록 자고 있는 아기를 방해했다."},{"en":"The sleeping baby was disturbed by loud construction noises all through the night.","ko":"자고 있던 아기는 밤새도록 시끄러운 공사 소음 때문에 잠을 방해받았다."}],"grammarNote":"disturb는 감정 동사로도 쓰여 be disturbed by(~때문에 마음이 흔들리다)라는 수동형이 자주 나온다. 형용사 disturbing(불안하게 하는), disturbed(마음이 흔들린)의 -ing/-ed 구분을 시험에서 자주 묻는다.","grammarQuiz":[{"sentence":"Please don't disturb your father _____ he is working in his office.","ko":"아버지가 사무실에서 일하고 계실 때는 그를 방해하지 마세요.","answer":["while"],"hint":"while + 진행 상황"},{"sentence":"The news of the accident was very _____ to everyone in town.","ko":"그 사고 소식은 마을의 모든 사람에게 매우 충격적이었다.","answer":["disturbing"],"hint":"감정 형용사 -ing"}]},
    {"id":"w01847","w":"division","pos":["n"],"ph":"/dɪˈvɪʒən/","cefr":"B1","kr":["분열","부서"],"ex":[{"en":"There is a clear division here.","ko":"여기에 명확한 분열이 있다."}],"mnemonic":{"soundHint":"'디바이드(divide,나누다)+ion' → 나눔의 명사","story":"divide(나누다)의 명사형 → division(분열, 부서)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"unity","ko":"단결","reason":"division의 대표 반의어"},{"w":"social","ko":"사회적인","reason":"'사회적 분열(social division)'로 결합"},{"w":"sales","ko":"판매","reason":"'영업 부서(sales division)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"갈라짐 또는 조직의 한 부서.","whenToUse":"사회 분열·회사 부서를 말할 때."},"krDetail":[{"ko":"분열","explain":"하나이던 것이 여럿으로 갈라짐"},{"ko":"부서","explain":"한 조직 안에서 일을 나누어 맡은 작은 단위"}],"usageExamples":[{"en":"There is a deep division between the two groups.","ko":"두 집단 사이에는 깊은 분열이 있다."},{"en":"She works in the sales division of the company.","ko":"그녀는 회사의 영업 부서에서 일한다."}],"grammarNote":"division은 divide의 명사형. 수학 용어로도 쓰여(division 나눗셈), 조직 구조에서 sales division(영업부), 사회 문제로 social division(사회적 분열) 등 다양하게 활용된다. 뒤 전치사는 division of/between/among.","grammarQuiz":[{"sentence":"The country is facing serious _____ between the rich and the poor.","ko":"그 나라는 부유한 사람들과 가난한 사람들 사이의 심각한 분열에 직면하고 있다.","answer":["division"],"hint":"division between ~"},{"sentence":"She works in the marketing _____ of a large international company.","ko":"그녀는 큰 국제 기업의 마케팅 부서에서 일한다.","answer":["division"],"hint":"부서명 division"}]},
    {"id":"w01852","w":"dock","pos":["n","v"],"ph":"/dɒk/","cefr":"B1","kr":["부두","접안하다"],"ex":[{"en":"The ship docked at the harbor.","ko":"배가 항구에 접안했다."}],"mnemonic":{"soundHint":"'닥(부딪히다)' → 배가 닥! 정박","story":"'닥!' 하고 배가 부두에 부딪혀 접안 = dock(부두)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"ship","ko":"배","reason":"배가 dock에 접안한다는 짝"},{"w":"loading","ko":"하역","reason":"'하역 부두(loading dock)'로 결합"},{"w":"worker","ko":"노동자","reason":"'항만 노동자(dock workers)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"배가 대는 부두, 또는 접안하다.","whenToUse":"항만·물류·정박 장면에서."},"krDetail":[{"ko":"부두","explain":"배가 사람이나 짐을 싣고 내리기 위해 대는 곳"},{"ko":"접안하다","explain":"배를 부두에 대다"}],"usageExamples":[{"en":"The fishing boats returned to the dock at sunset.","ko":"고깃배들은 해 질 녘에 부두로 돌아왔다."},{"en":"The spaceship will dock with the station tomorrow.","ko":"그 우주선은 내일 정거장에 접안할 것이다."}],"grammarNote":"dock은 명사(부두)와 동사(부두에 대다) 둘 다로 쓰인다. 우주에서 우주선끼리 연결하는 dock with(도킹하다)라는 용법과, 임금에서 일부를 공제한다는 dock someone's pay라는 뜻도 시험에 종종 나온다.","grammarQuiz":[{"sentence":"The huge cargo ship slowly docked _____ the port early this morning.","ko":"그 거대한 화물선은 오늘 아침 일찍 항구에 천천히 접안했다.","answer":["at"],"hint":"dock at + 장소"},{"sentence":"Workers unloaded the containers _____ the loading dock throughout the day.","ko":"일꾼들은 하루 종일 하역 부두에서 컨테이너를 내렸다.","answer":["at"],"hint":"at the dock"}]},
    {"id":"w01856","w":"documentary","pos":["n","adj"],"ph":"/ˌdɒkjʊˈmentəri/","cefr":"B1","kr":["다큐멘터리","기록의"],"ex":[{"en":"She watched a nature documentary.","ko":"그녀는 자연 다큐멘터리를 시청했다."}],"mnemonic":{"soundHint":"'다큐멘터리'는 한국 방송·영화에서도 그대로 쓰는 외래어예요.","story":"TV 편성표나 스트리밍 서비스에서 '다큐멘터리'는 사실 기록 영상을 뜻하는 익숙한 말이에요.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nature","ko":"자연","reason":"'자연 다큐멘터리(nature documentary)'로 결합"},{"w":"evidence","ko":"증거","reason":"'증거 서류(documentary evidence)'로 결합"},{"w":"film","ko":"영화","reason":"documentary가 영화 장르의 하나라는 짝"}],"collocBest":[{"en":"nature documentary","ko":"자연 다큐멘터리"},{"en":"documentary evidence","ko":"증거 서류"}]},"nuance":{"koSimple":"사실을 기록한 영상·자료.","whenToUse":"자연·역사·사회 기록 프로그램에."},"krDetail":[{"ko":"다큐멘터리","explain":"실제 있었던 일이나 사실을 기록하여 보여 주는 영상"},{"ko":"기록의","explain":"실제 있었던 일을 사실 그대로 기록한"}],"usageExamples":[{"en":"They filmed a documentary about ocean life.","ko":"그들은 바다 생물에 관한 다큐멘터리를 촬영했다."},{"en":"The photos have great documentary value.","ko":"그 사진들은 뛰어난 기록적 가치를 지닌다."}],"grammarNote":"documentary는 명사와 형용사 둘 다로 쓰인다. 명사로 셀 수 있는 명사(a nature documentary), 형용사로 documentary film/evidence처럼 명사를 수식한다. 관련 명사 document(문서), documentation(문서화)와 함께 익히자.","grammarQuiz":[{"sentence":"Last night, we watched a fascinating _____ about wild African elephants.","ko":"어젯밤에, 우리는 야생 아프리카 코끼리에 관한 흥미로운 다큐멘터리를 봤다.","answer":["documentary"],"hint":"가산명사 documentary"},{"sentence":"The lawyer presented _____ evidence to support his client's case.","ko":"그 변호사는 의뢰인의 사건을 뒷받침하기 위해 증거 서류를 제시했다.","answer":["documentary"],"hint":"형용사 documentary evidence"}]},
    {"id":"w01469","w":"criminal","pos":["n","adj"],"ph":"/ˈkrɪmɪnəl/","cefr":"B1","kr":["범죄자","범죄의"],"ex":[{"en":"The criminal was caught by police.","ko":"그 범죄자는 경찰에 붙잡혔다."}],"mnemonic":{"soundHint":"'크라임(crime)+널' → 범죄를 저지른 사람","story":"crime(범죄)+inal → 범죄자(criminal)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"crime","ko":"범죄","reason":"어근 파생어"},{"w":"offender","ko":"범죄자","reason":"criminal의 대표 동의어"},{"w":"innocent","ko":"무죄의","reason":"criminal의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"범죄를 저지른 사람 또는 범죄에 관한.","whenToUse":"사람이면 명사, 성격이면 형용사."},"krDetail":[{"ko":"범죄자","explain":"범죄를 저지른 사람"},{"ko":"범죄의","explain":"법을 어긴 것에 관한"}],"usageExamples":[{"en":"The criminal was sent to prison.","ko":"그 범죄자는 감옥에 보내졌다."},{"en":"He faced serious criminal charges.","ko":"그는 중대한 형사 혐의를 받았다."}],"grammarNote":"criminal은 명사(범죄자)와 형용사(범죄의) 모두 가능. 형용사로 쓸 때는 명사 앞에 위치(a criminal act). 유의어: offender, lawbreaker.","grammarQuiz":[{"sentence":"The criminal _____ (arrest) by the police so far.","ko":"그 범죄자는 지금까지 경찰에 의해 체포되어 왔다.","answer":"has been arrested","hint":"현재완료 수동태"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠
  correct(){
    tone({type:"sine", freq:1400, dur:.08, vol:.22, t0:0});
    tone({type:"sine", freq:1800, dur:.06, vol:.16, t0:.04});
  },
  // jp-buzzer: 저음 square 150Hz 250ms
  wrong(){
    tone({type:"square", freq:160, dur:.18, vol:.18, t0:0});
    tone({type:"square", freq:120, dur:.20, vol:.16, t0:.06});
  },
  // jp-slot-jackpot: 도-솔-도-미 차임 4단
  levelUp(){
    const notes = [523.25, 783.99, 1046.50, 1318.51]; // C5 G5 C6 E6
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.22, vol:.22, t0:i*.13}));
    tone({type:"triangle", freq:2093.00, dur:.4, vol:.18, t0:.55}); // 종소리 C7
  },
  // jp-chime-asc: 800→1000→1200 3단
  streak(){
    [880, 1100, 1320].forEach((f,i)=> tone({type:"sine", freq:f, dur:.12, vol:.18, t0:i*.07}));
  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine
  fireworks(){
    noise({dur:.18, vol:.22, t0:0, hp:600});
    for(let i=0;i<6;i++){
      tone({type:"sine", freq:1500-i*180, dur:.10, vol:.10, t0:.05+i*.05});
    }
  },
  // arcade-flip: 화이트 노이즈 30ms
  cardFlip(){
    noise({dur:.04, vol:.10, hp:2000});
  },
  // jp-coin-payout: 2000Hz square 8회 빠르게
  coinDrop(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:1800+Math.random()*600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-slot-spin: 600Hz square 50ms × 8
  spinReel(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-bigwin: 도-미-솔-도-미-솔-도(고)-도(고) 8단
  bigWin(){
    const notes = [523.25,659.25,783.99,1046.50,1318.51,1567.98,2093.00,2637.02];
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.18, vol:.22, t0:i*.10}));
    tone({type:"triangle", freq:2637.02, dur:.6, vol:.20, t0:.85});
    // coins
    for(let i=0;i<14;i++){
      tone({type:"square", freq:1800+Math.random()*800, dur:.04, vol:.08, t0:.8+i*.04});
    }
  },
  type(){
    tone({type:"square", freq:1500, dur:.02, vol:.05});
  },
  // ── 심화 90%+ 전용 : 명랑·화려·인상 깊은 팡파레 조합 ──
  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단
  // 2) 크리스탈 아르페지오 8음 (C5→E7)
  // 3) 종·코인·환호 노이즈
  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [
      { t:0.00, notes:[261.63, 329.63, 392.00] },   // C major (C4 E4 G4)
      { t:0.16, notes:[349.23, 440.00, 523.25] },   // F major (F4 A4 C5)
      { t:0.32, notes:[392.00, 493.88, 587.33] },   // G major (G4 B4 D5)
      { t:0.48, notes:[523.25, 659.25, 783.99] }    // C major 옥타브 (C5 E5 G5) — 절정
    ];
    chords.forEach(ch => {
      ch.notes.forEach(f => {
        tone({ type:"sawtooth", freq:f, dur:.22, vol:.12, atk:.008, t0:ch.t });
        // 부드러운 sine 배음 살짝 얹기
        tone({ type:"sine",     freq:f*2, dur:.20, vol:.05, t0:ch.t });
      });
    });
    // 브라스 절정 뒤 강타 (C5 saw 길게)
    tone({ type:"sawtooth", freq:523.25, dur:.35, vol:.14, t0:.48 });

    // 2) 크리스탈 아르페지오 8음 (도미솔도 두 옥타브)
    const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00, 2637.02];
    arp.forEach((f,i) => {
      tone({ type:"sine",     freq:f, dur:.15, vol:.20, atk:.003, t0:.75 + i*.055 });
      tone({ type:"triangle", freq:f*2, dur:.10, vol:.08, t0:.75 + i*.055 });
    });

    // 3) 절정 종소리 (E7 · G7 벨)
    tone({ type:"triangle", freq:2637.02, dur:.65, vol:.20, t0:1.22 });

    tone({ type:"triangle", freq:2093.00, dur:.55, vol:.16, t0:1.40 });

    // 4) 코인·불꽃 노이즈 (환호 느낌)
    for(let i=0;i<18;i++){
      tone({ type:"square", freq:1900+Math.random()*900, dur:.035, vol:.06, t0:1.25 + i*.038 });
    }
    noise({ dur:.15, vol:.14, hp:800, t0:1.20 });
  }
};

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();

  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();

  if(state.cardIdx >= state.cards.length - 1){

    state.cardIdx = state.cards.length;

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}
