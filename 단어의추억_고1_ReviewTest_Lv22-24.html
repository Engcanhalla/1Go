    {"id":"w05182","w":"qualify","pos":["v"],"ph":"/ˈkwɒlɪfaɪ/","cefr":"B1","kr":["자격을 갖추다","예선을 통과하다"],"ex":[{"en":"She qualified for the national team.","ko":"그녀는 국가 대표팀에 선발되었다."}],"mnemonic":{"soundHint":"콸리파이 → '퀄리티(quality, 품질) + fy(만들다)'","story":"품질(quality)을 갖추게 만들다 → 자격을 갖추다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"eligible","ko":"자격이 있는","reason":"동의어 관계"},{"w":"disqualify","ko":"실격시키다","reason":"반의어 관계"},{"w":"requirement","ko":"요건","reason":"자격 요건 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"조건 갖춰 통과하다.","whenToUse":"시험 통과·대표 선발될 때."},"krDetail":[{"ko":"자격을 갖추다","explain":"어떤 일을 할 수 있는 조건을 채우다"},{"ko":"예선을 통과하다","explain":"본 경기에 나갈 자격을 얻다"}],"usageExamples":[{"en":"You must qualify for the job with a degree.","ko":"학위로 그 직무의 자격을 갖추어야 한다."},{"en":"Our team qualified for the World Cup finals.","ko":"우리 팀은 월드컵 결승전에 진출했다."}],"grammarNote":"'qualify for + 명사'는 '~의 자격을 얻다', 'qualify as + 직업'은 '~로서 자격을 갖추다'로 쓴다. 명사형은 'qualification(자격)'이다.","grammarQuiz":[{"sentence":"Only three teams _____ _____ the finals of the tournament.","ko":"세 팀만이 토너먼트 결승전에 진출했다.","answer":["qualified","for"],"hint":"동사 과거형 + 전치사"},{"sentence":"She is a _____ _____ nurse with ten years of experience.","ko":"그녀는 10년 경력의 자질이 뛰어난 간호사이다.","answer":["highly","qualified"],"hint":"부사 + 과거분사"}]},
    {"id":"w05010","w":"prediction","pos":["n"],"ph":"/prɪˈdɪkʃən/","cefr":"B1","kr":["예측","예언"],"ex":[{"en":"His prediction turned out to be correct.","ko":"그의 예측이 맞는 것으로 밝혀졌다."}],"mnemonic":{"soundHint":"프리딕션","story":"'predict(예측하다)' + ion = 예측, 예언","hintConfidence":3},"pairs":{"buddyWords":[{"w":"predict","ko":"예측하다","reason":"동사형 - 짝"},{"w":"forecast","ko":"예보","reason":"직접 동의어"},{"w":"accurate","ko":"정확한","reason":"accurate prediction 콜로"}],"collocBest":[]},"nuance":{"koSimple":"미리 내다본 결과·전망.","whenToUse":"일기예보·전문가 전망 얘기할 때."},"krDetail":[{"ko":"예측","explain":"앞일을 미리 헤아려 봄"},{"ko":"예언","explain":"앞으로의 일을 미리 알려주는 말"}],"usageExamples":[{"en":"The weather prediction for tomorrow shows heavy rain.","ko":"내일에 대한 날씨 예측은 폭우를 보여준다."},{"en":"His prediction about the game turned out to be wrong.","ko":"그 경기에 대한 그의 예측은 결국 틀린 것으로 드러났다."}],"grammarNote":"prediction은 셀 수 있는 명사이며, 'make a prediction' 형태로 자주 쓴다. 학생들이 'do a prediction'으로 잘못 쓰는 실수를 하지만, 'make'가 정확한 동사이다.","grammarQuiz":[{"sentence":"The scientist _____ an accurate _____ about the coming storm.","ko":"그 과학자는 다가오는 폭풍에 관한 정확한 예측을 했다.","answer":["made","prediction"],"hint":"과거동사 + 명사"}]},
    {"id":"w05199","w":"quote","pos":["v","n"],"ph":"/kwoʊt/","cefr":"B1","kr":["인용하다","인용문"],"ex":[{"en":"She quoted a famous poem in her speech.","ko":"그녀는 연설에서 유명한 시를 인용했다."}],"mnemonic":{"soundHint":"쿠오트 → '쿠~옷! 하며 남의 말 따오기'","story":"쿠옷 하며 유명한 말을 따오다 → 인용하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"cite","ko":"인용하다","reason":"동의어 관계"},{"w":"reference","ko":"참고","reason":"동의어 관계"},{"w":"author","ko":"저자","reason":"인용문의 출처"}],"collocBest":[]},"nuance":{"koSimple":"남의 말을 그대로 인용.","whenToUse":"명언·시·가격 인용할 때."},"krDetail":[{"ko":"인용하다","explain":"남의 말이나 글을 그대로 옮겨 오다"},{"ko":"인용문","explain":"다른 사람의 말이나 글을 그대로 옮긴 것"}],"usageExamples":[{"en":"The teacher quoted a famous poem in class.","ko":"그 선생님은 수업에서 유명한 시를 인용했다."},{"en":"This quote from Einstein always inspires me.","ko":"아인슈타인의 이 인용문은 항상 나에게 영감을 준다."}],"grammarNote":"'quote A from B'는 'B에서 A를 인용하다'로 쓴다. 명사와 동사 형태가 같으며 'quotation'은 더 격식 있는 명사형이다.","grammarQuiz":[{"sentence":"The writer _____ _____ line _____ Shakespeare's play.","ko":"그 작가는 셰익스피어의 희곡에서 한 문장을 인용했다.","answer":["quoted","a","from"],"hint":"동사 과거형 + 관사 + 전치사"},{"sentence":"She wrote _____ _____ _____ on her wall to inspire herself.","ko":"그녀는 자신을 격려하려고 벽에 유명한 인용문을 썼다.","answer":["a","famous","quote"],"hint":"관사 + 형용사 + 명사"}]},
    {"id":"w04985","w":"poverty","pos":["n"],"ph":"/ˈpɒvəti/","cefr":"B1","kr":["빈곤","가난"],"ex":[{"en":"Millions of people live in poverty.","ko":"수백만 명의 사람들이 빈곤 속에서 살고 있다."}],"mnemonic":{"soundHint":"파버티","story":"'poor(가난한)' + verty = 가난한 상태 = 빈곤","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hardship","ko":"고난","reason":"직접 동의어"},{"w":"wealth","ko":"부","reason":"직접 반의어"},{"w":"extreme","ko":"극심한","reason":"extreme poverty 콜로"}],"collocBest":[]},"nuance":{"koSimple":"돈이 없어 삶이 힘든 상태.","whenToUse":"사회 문제·복지 이야기할 때."},"krDetail":[{"ko":"빈곤","explain":"먹고살 것이 몹시 모자란 상태"},{"ko":"가난","explain":"살림이 넉넉하지 못함"}],"usageExamples":[{"en":"The organization fights extreme poverty in many countries.","ko":"그 단체는 많은 나라에서 극심한 빈곤과 싸운다."},{"en":"Millions of families still live in poverty today.","ko":"수백만 가족이 오늘날에도 여전히 빈곤 속에서 산다."}],"grammarNote":"poverty는 불가산명사로 관사나 복수형을 쓰지 않는다. 'live in poverty'가 관용 표현이며, 학생들이 관사를 붙여 'in a poverty'로 쓰는 오류를 종종 범한다.","grammarQuiz":[{"sentence":"Many people in that region live _____ poverty _____ generations.","ko":"그 지역의 많은 사람들이 여러 세대에 걸쳐 빈곤 속에서 산다.","answer":["in","for"],"hint":"전치사 + 전치사"}]},
    {"id":"w04742","w":"partner","pos":["n","v"],"ph":"/ˈpɑːrtnər/","cefr":"B1","kr":["파트너","동반자"],"ex":[{"en":"He is my business partner.","ko":"그는 나의 사업 파트너다."}],"mnemonic":{"soundHint":"파트너","story":"외래어 '파트너'는 함께 부분(part)을 맡는 사람.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"colleague","ko":"동료","reason":"동의어 - 업무 파트너"},{"w":"spouse","ko":"배우자","reason":"시나리오 - 인생 파트너"},{"w":"rival","ko":"경쟁자","reason":"반의어 - 파트너 vs 라이벌"}],"collocBest":[{"en":"business partner","ko":"사업 파트너"},{"en":"life partner","ko":"인생 반려자"}]},"nuance":{"koSimple":"함께하는 짝·동반자.","whenToUse":"사업·인생 짝을 말할 때."},"krDetail":[{"ko":"파트너","explain":"함께 일하거나 짝을 이루는 사람"},{"ko":"동반자","explain":"인생이나 일을 함께하는 사람"}],"usageExamples":[{"en":"She met her business partner at a tech conference in Seoul last spring.","ko":"그녀는 지난봄 서울의 기술 콘퍼런스에서 사업 파트너를 만났다."},{"en":"A colleague works in the same office, but a partner shares equal responsibility for the business.","ko":"동료는 같은 사무실에서 일하지만, 파트너는 사업의 책임을 동등하게 나눈다."}],"grammarNote":"partner는 명사로 자주 쓰이지만 동사로도 쓰여 'partner with + 회사/사람'이 '~와 제휴하다'는 뜻이 된다. 학생들은 동사 용법을 놓치기 쉽다. dance partner, business partner, life partner처럼 앞에 명사 수식어를 두어 종류를 밝히는 복합명사 표현이 자주 나온다.","grammarQuiz":[{"sentence":"Our company _____ _____ a Japanese firm to expand sales in the Asian market this year.","ko":"우리 회사는 올해 아시아 시장에서 판매를 확대하기 위해 일본 회사와 제휴했다.","answer":["partnered","with"],"hint":"동사 과거형 + 전치사 with"},{"sentence":"She has been my _____ _____ five years, and we still work well together every day.","ko":"그녀는 5년 동안 나의 파트너였으며, 우리는 여전히 매일 잘 협력한다.","answer":["partner","for"],"hint":"명사 + 기간 for"}]},
    {"id":"w05044","w":"prevention","pos":["n"],"ph":"/prɪˈvenʃən/","cefr":"B1","kr":["예방","방지"],"ex":[{"en":"Prevention is better than cure.","ko":"예방이 치료보다 낫다."}],"mnemonic":{"soundHint":"프리벤션 → '프리(pre, 미리) + 벤트(vent, 오다) 막기'","story":"일이 오기(vent) 전에(pre) 막다 → 예방","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cure","ko":"치료","reason":"예방-치료 대비"},{"w":"safety","ko":"안전","reason":"예방의 목적"},{"w":"disease","ko":"질병","reason":"예방 대상"}],"collocBest":[]},"nuance":{"koSimple":"미리 막아 예방하는 일.","whenToUse":"질병·범죄·사고 막을 때."},"krDetail":[{"ko":"예방","explain":"안 좋은 일이 일어나기 전에 미리 막음"},{"ko":"방지","explain":"어떤 일이 생기지 않도록 미리 지킴"}],"usageExamples":[{"en":"The city started a campaign for crime prevention.","ko":"그 도시는 범죄 예방 캠페인을 시작했다."},{"en":"Prevention is better than cure.","ko":"예방이 치료보다 낫다."}],"grammarNote":"'prevention of + 명사'는 '~의 예방'으로 뒤에 명사가 오지만, 동사 'prevent A from -ing' 형태와 헷갈리지 말아야 한다.","grammarQuiz":[{"sentence":"The government focuses on the _____ _____ traffic accidents in the city.","ko":"정부는 도시의 교통사고 예방에 초점을 맞춘다.","answer":["prevention","of"],"hint":"명사 + 전치사"},{"sentence":"Fire _____ is very important in every school building.","ko":"화재 예방은 모든 학교 건물에서 매우 중요하다.","answer":["prevention"],"hint":"명사형"}]},
    {"id":"w04834","w":"personality","pos":["n"],"ph":"/ˌpɜːrsəˈnælɪti/","cefr":"B1","kr":["성격","인성","개성"],"ex":[{"en":"She has a warm and friendly personality.","ko":"그녀는 따뜻하고 친절한 성격을 가지고 있다."}],"mnemonic":{"soundHint":"퍼스낼리티","story":"'person(사람)' + ality = 사람됨 = 성격, 인성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"character","ko":"성격","reason":"동의어 - 핵심 짝"},{"w":"trait","ko":"특성","reason":"동의어 - 성격 특성"},{"w":"temperament","ko":"기질","reason":"동의어 - 타고난 성격"}],"collocBest":[]},"nuance":{"koSimple":"그 사람만의 성격·개성.","whenToUse":"사람의 기질·개성 표현할 때."},"krDetail":[{"ko":"성격","explain":"사람이 지닌 마음의 됨됨이"},{"ko":"인성","explain":"사람다움을 이루는 마음가짐"},{"ko":"개성","explain":"남과 다른 자기만의 됨됨이"}],"usageExamples":[{"en":"Her cheerful personality makes everyone in the classroom feel warm and welcomed.","ko":"그녀의 밝은 성격은 교실의 모든 사람이 따뜻함과 환영받는 느낌을 갖게 한다."},{"en":"A quick first impression is limited, but a strong personality reveals itself over time in every interaction.","ko":"빠른 첫인상은 제한적이지만, 강한 개성은 모든 상호작용을 통해 시간이 지나면서 드러난다."}],"grammarNote":"personality는 성격 그 자체(추상적 특성)와 유명인(a TV personality)의 두 뜻으로 쓰인다. 학생들은 strong/pleasant/outgoing/cheerful personality 같은 형용사 결합을 익혀야 한다. character와의 차이도 시험에 자주 나오는데, character는 도덕성·본성, personality는 겉으로 드러나는 성격 특징에 초점이 있다.","grammarQuiz":[{"sentence":"Her warm and friendly _____ _____ her one of the most popular teachers at the school.","ko":"그녀의 따뜻하고 친근한 성격은 그녀를 학교에서 가장 인기 있는 교사 중 한 명으로 만들었다.","answer":["personality","made"],"hint":"명사 + 동사 make 과거형"},{"sentence":"The famous TV _____ _____ known for his sharp wit and honest opinions on daily issues.","ko":"그 유명한 TV 스타는 예리한 재치와 일상 문제에 대한 솔직한 의견으로 알려져 있다.","answer":["personality","is"],"hint":"명사(유명인) + be 동사"}]},
    {"id":"w04897","w":"planning","pos":["n"],"ph":"/ˈplænɪŋ/","cefr":"B1","kr":["계획","기획"],"ex":[{"en":"Good planning is essential for success.","ko":"좋은 계획은 성공에 필수적이다."}],"mnemonic":{"soundHint":"플래닝","story":"'플랜(plan 계획)' + ing = 계획 세우기, 기획","hintConfidence":3},"pairs":{"buddyWords":[{"w":"strategy","ko":"전략","reason":"상위 개념 - 전략 실현 과정"},{"w":"schedule","ko":"일정","reason":"planning의 결과물"},{"w":"chaos","ko":"혼란","reason":"반의 시나리오 - planning 부재"}],"collocBest":[]},"nuance":{"koSimple":"미리 그림을 그려 짜 두는 일.","whenToUse":"여행·행사·도시 설계 준비 얘기할 때."},"krDetail":[{"ko":"계획","explain":"앞일을 미리 짜서 세워두는 그림"},{"ko":"기획","explain":"무엇을 어떻게 할지 미리 짜는 일"}],"usageExamples":[{"en":"The team is planning a new project for next year.","ko":"그 팀은 내년을 위한 새로운 프로젝트를 계획하고 있다."},{"en":"Careful planning helps us avoid mistakes.","ko":"신중한 계획은 우리가 실수를 피하도록 도와준다."}],"grammarNote":"planning은 동명사와 명사 두 가지로 쓰이는데, 학생들은 종종 be동사 뒤 -ing 형태를 무조건 진행형으로 오해한다. 'careful planning'처럼 형용사의 수식을 받는 경우는 순수 명사 용법이다.","grammarQuiz":[{"sentence":"Careful _____ is _____ for the success of any large project.","ko":"신중한 계획은 어떤 큰 프로젝트의 성공을 위해 필요하다.","answer":["planning","necessary"],"hint":"명사형 planning + 형용사"}]},
    {"id":"w04835","w":"personally","pos":["adv"],"ph":"/ˈpɜːrsənəli/","cefr":"B1","kr":["개인적으로","직접"],"ex":[{"en":"I personally think he is right.","ko":"나는 개인적으로 그가 옳다고 생각한다."}],"mnemonic":{"soundHint":"퍼스널리","story":"'퍼스널(personal 개인적)' + ly = 개인적으로, 직접","hintConfidence":3},"pairs":{"buddyWords":[{"w":"individually","ko":"개별적으로","reason":"동의어 - 개인 단위"},{"w":"directly","ko":"직접","reason":"동의어 - 몸소"},{"w":"publicly","ko":"공개적으로","reason":"반의어 - 개인 vs 공개"}],"collocBest":[]},"nuance":{"koSimple":"내 개인적 의견으로는.","whenToUse":"자기 생각을 밝힐 때."},"krDetail":[{"ko":"개인적으로","explain":"다른 사람과 관계없이 자기 자신으로서"},{"ko":"직접","explain":"다른 사람을 거치지 않고 스스로"}],"usageExamples":[{"en":"I personally think that we should leave earlier to avoid the heavy afternoon traffic.","ko":"저는 개인적으로 오후의 심한 교통 체증을 피하려면 우리가 더 일찍 출발해야 한다고 생각한다."},{"en":"You should not take his critical comments personally; he behaves the same way with everyone he meets.","ko":"그의 비판적인 말을 개인적으로 받아들이지 마세요; 그는 만나는 모든 사람에게 똑같이 행동합니다."}],"grammarNote":"personally는 부사로 문두에서 개인적 의견을 밝히거나(Personally, I ~), take ~ personally(개인적으로 받아들이다) 관용구로 자주 쓰인다. 학생들은 'personally speaking'과 'in my opinion'을 대체 표현으로 익히면 좋다. 문어체 격식체에서는 문장 앞에 콤마와 함께 놓이는 도치 패턴이 흔하다.","grammarQuiz":[{"sentence":"_____, I _____ that we should postpone the outdoor event because of the bad weather forecast.","ko":"개인적으로, 저는 나쁜 일기예보 때문에 야외 행사를 연기해야 한다고 생각합니다.","answer":["Personally","think"],"hint":"부사 + 1인칭 동사 원형"},{"sentence":"Please do not take his rude comments _____; he is often _____ to strangers by nature.","ko":"그의 무례한 말을 개인적으로 받아들이지 마세요; 그는 낯선 사람들에게 자주 그렇게 대합니다.","answer":["personally","rude"],"hint":"부사 + 형용사 rude"}]},
    {"id":"w04983","w":"poultry","pos":["n"],"ph":"/ˈpoʊltri/","cefr":"B1","kr":["가금류","닭고기"],"ex":[{"en":"The farm raises poultry for eggs and meat.","ko":"그 농장은 달걀과 고기를 위해 가금류를 기른다."}],"mnemonic":{"soundHint":"포울트리","story":"'poult(새끼 새)' + ry = 새를 기르는 곳/것 = 가금류, 닭고기","hintConfidence":1},"pairs":{"buddyWords":[{"w":"chicken","ko":"닭","reason":"poultry의 대표"},{"w":"livestock","ko":"가축","reason":"poultry는 livestock 일종"},{"w":"farm","ko":"농장","reason":"poultry farm 콜로"}],"collocBest":[]},"nuance":{"koSimple":"닭·오리 등 식용 가축새.","whenToUse":"농장·식재료 이야기할 때."},"krDetail":[{"ko":"가금류","explain":"집에서 기르는 날짐승 무리"},{"ko":"닭고기","explain":"닭의 살로 만든 먹거리"}],"usageExamples":[{"en":"The farm raises poultry for eggs and meat.","ko":"그 농장은 계란과 고기를 위해 가금류를 기른다."},{"en":"Chicken is the most common type of poultry.","ko":"닭은 가장 흔한 종류의 가금류이다."}],"grammarNote":"poultry는 집합명사이자 불가산명사로 단수 취급하며, 관사 a나 복수형을 쓰지 않는다. 'The poultry is fresh.'가 옳은 형태이며, 'poultries'는 오답이다.","grammarQuiz":[{"sentence":"The _____ raised on this farm _____ known for its high quality.","ko":"이 농장에서 기른 가금류는 높은 품질로 유명하다.","answer":["poultry","is"],"hint":"명사 + be동사"}]},
    {"id":"w05180","w":"puzzling","pos":["adj"],"ph":"/ˈpʌzlɪŋ/","cefr":"B1","kr":["당혹스러운","이해하기 어려운"],"ex":[{"en":"The scientist found the results of the experiment rather puzzling.","ko":"과학자는 실험 결과가 다소 당혹스럽다고 생각했다."}],"mnemonic":{"soundHint":"퍼즐링 → 'puzzle(퍼즐) + ing'","story":"퍼즐처럼 머리가 아픈 → 당혹스러운","hintConfidence":3},"pairs":{"buddyWords":[{"w":"confusing","ko":"혼란스러운","reason":"동의어 관계"},{"w":"obvious","ko":"명백한","reason":"반의어 관계"},{"w":"behavior","ko":"행동","reason":"puzzling behavior 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"머리 갸웃 이해 안 되는.","whenToUse":"실험 결과·행동이 이상할 때."},"krDetail":[{"ko":"당혹스러운","explain":"어떻게 해야 할지 몰라 어리둥절한"},{"ko":"이해하기 어려운","explain":"무슨 뜻인지 파악하기 힘든"}],"usageExamples":[{"en":"The teacher gave us a puzzling question.","ko":"그 선생님은 우리에게 당혹스러운 질문을 했다."},{"en":"His puzzling behavior confused everyone around him.","ko":"그의 이해하기 어려운 행동은 주변 모두를 혼란스럽게 했다."}],"grammarNote":"'puzzling'은 감정을 유발하는 능동 의미(-ing), 'puzzled'는 감정을 느끼는 수동 의미(-ed)이다. 사람에게는 보통 'puzzled'를 쓴다.","grammarQuiz":[{"sentence":"The detective faced _____ _____ _____ that no one could solve.","ko":"그 형사는 아무도 풀 수 없는 당혹스러운 미스터리에 직면했다.","answer":["a","puzzling","mystery"],"hint":"관사 + 형용사 + 명사"},{"sentence":"His _____ _____ made all his friends worried.","ko":"그의 이해하기 어려운 행동은 모든 친구들을 걱정하게 했다.","answer":["puzzling","behavior"],"hint":"형용사 + 명사"}]},
    {"id":"w04743","w":"partnership","pos":["n"],"ph":"/ˈpɑːrtnərʃɪp/","cefr":"B1","kr":["파트너십","동반자 관계"],"ex":[{"en":"They formed a business partnership.","ko":"그들은 사업 파트너십을 맺었다."}],"mnemonic":{"soundHint":"파트너십","story":"외래어 '파트너십'은 파트너들이 함께하는 관계.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"alliance","ko":"동맹","reason":"동의어 - 협력 관계"},{"w":"collaboration","ko":"협업","reason":"동의어 - 함께 일함"},{"w":"rivalry","ko":"경쟁","reason":"반의어 - 협력 vs 경쟁"}],"collocBest":[{"en":"form a partnership","ko":"동반자 관계를 맺다"},{"en":"strategic partnership","ko":"전략적 파트너십"}]},"nuance":{"koSimple":"함께하는 협력 관계.","whenToUse":"사업·기관 간 협력을 말할 때."},"krDetail":[{"ko":"파트너십","explain":"함께 일하기로 맺은 관계"},{"ko":"동반자 관계","explain":"서로 힘을 모아 함께 나아가는 사이"}],"usageExamples":[{"en":"The two companies formed a partnership to develop a new smartphone last month.","ko":"그 두 회사는 지난달 새로운 스마트폰을 개발하기 위해 파트너십을 맺었다."},{"en":"A simple alliance can end quickly, but a strong partnership requires long-term trust and shared vision.","ko":"단순한 동맹은 빨리 끝날 수 있지만, 강한 파트너십에는 장기적 신뢰와 공유된 비전이 필요하다."}],"grammarNote":"partnership은 '동반자 관계'라는 추상명사와 '동업체·합자회사'라는 구체명사 용법이 모두 있다. form/build/end/dissolve a partnership 같은 동사와 자주 결합한다. 학생들은 'partnership between A and B' 또는 'partnership with B' 구조를 혼동하는데, 양쪽을 모두 언급하면 between, 한쪽 관점이면 with를 쓴다.","grammarQuiz":[{"sentence":"A strong _____ _____ two companies can create better products and expand markets faster.","ko":"두 회사 간의 강한 파트너십은 더 나은 제품을 만들고 시장을 더 빨리 확장할 수 있다.","answer":["partnership","between"],"hint":"명사 + 전치사 between"},{"sentence":"The school _____ a _____ with the local library to promote reading among teenage students.","ko":"학교는 청소년 학생들 사이에서 독서를 장려하기 위해 지역 도서관과 파트너십을 맺었다.","answer":["formed","partnership"],"hint":"동사 form 과거형 + 명사"}]},
    {"id":"w05090","w":"profit","pos":["n","v"],"ph":"/ˈprɒfɪt/","cefr":"B1","kr":["이익","수익"],"ex":[{"en":"The company made a large profit this year.","ko":"그 회사는 올해 큰 이익을 냈다."}],"mnemonic":{"soundHint":"프로핏 → '프로(pro, 앞으로) + fit(맞다)'","story":"앞날에 딱 들어맞는 이득 → 이익·수익","hintConfidence":2},"pairs":{"buddyWords":[{"w":"gain","ko":"이득","reason":"동의어 관계"},{"w":"loss","ko":"손실","reason":"반의어 관계"},{"w":"margin","ko":"이윤율","reason":"profit margin 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"사업으로 남긴 이익 돈.","whenToUse":"장사·회사 수익 말할 때."},"krDetail":[{"ko":"이익","explain":"장사나 일로 남는 돈"},{"ko":"수익","explain":"일을 해서 얻어지는 재물"}],"usageExamples":[{"en":"The company made a huge profit this year.","ko":"그 회사는 올해 큰 이익을 냈다."},{"en":"They shared the profits equally among workers.","ko":"그들은 노동자들에게 수익을 똑같이 나누었다."}],"grammarNote":"'make a profit(이익을 내다)'와 'make a loss(손해를 보다)'는 반대 표현이다. 'profit'은 동사로도 쓰이며 'profit from + 명사' 구조를 취한다.","grammarQuiz":[{"sentence":"The small shop finally _____ _____ _____ after two years.","ko":"그 작은 가게는 2년 만에 마침내 이익을 냈다.","answer":["made","a","profit"],"hint":"동사 + 관사 + 명사"},{"sentence":"Many companies _____ _____ selling online products.","ko":"많은 회사가 온라인 제품 판매로 수익을 낸다.","answer":["profit","from"],"hint":"동사 + 전치사"}]},
    {"id":"w05083","w":"productive","pos":["adj"],"ph":"/prəˈdʌktɪv/","cefr":"B1","kr":["생산적인","효율적인"],"ex":[{"en":"It was a productive meeting for everyone.","ko":"그것은 모두에게 생산적인 회의였다."}],"mnemonic":{"soundHint":"프로덕티브 → '프로덕트(product, 결과물) 잘 나오는'","story":"결과물이 잘 나오는 → 생산적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"efficient","ko":"효율적인","reason":"동의어 관계"},{"w":"unproductive","ko":"비생산적인","reason":"반의어 관계"},{"w":"output","ko":"산출물","reason":"생산성의 결과"}],"collocBest":[]},"nuance":{"koSimple":"많이·잘 만들어내는.","whenToUse":"하루·회의가 알찼다 말할 때."},"krDetail":[{"ko":"생산적인","explain":"많은 결과물이나 성과를 내는"},{"ko":"효율적인","explain":"적은 힘으로 많은 것을 이루는"}],"usageExamples":[{"en":"The meeting produced many good ideas.","ko":"그 회의는 많은 좋은 아이디어를 만들어냈다."},{"en":"I had a very productive day today.","ko":"나는 오늘 매우 생산적인 하루를 보냈다."}],"grammarNote":"'productive'는 형용사이고, 부사형은 'productively'이다. 'have a productive day/meeting'처럼 자주 쓰인다.","grammarQuiz":[{"sentence":"She had _____ very _____ morning finishing her homework.","ko":"그녀는 숙제를 끝내며 매우 생산적인 아침을 보냈다.","answer":["a","productive"],"hint":"관사 + 형용사"},{"sentence":"Working in a quiet place makes me _____ _____.","ko":"조용한 곳에서 일하는 것은 나를 매우 생산적이게 만든다.","answer":["highly","productive"],"hint":"부사 + 형용사"}]},
    {"id":"w05169","w":"pure","pos":["adj"],"ph":"/pjʊə/","cefr":"B1","kr":["순수한","깨끗한"],"ex":[{"en":"The water here is pure and fresh.","ko":"이곳의 물은 순수하고 신선하다."}],"mnemonic":{"soundHint":"퓨어 → '퓨(few, 아주 적은) 불순물'","story":"불순물이 거의 없는 상태 → 순수한","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clean","ko":"깨끗한","reason":"동의어 관계"},{"w":"impure","ko":"불순한","reason":"반의어 관계"},{"w":"gold","ko":"금","reason":"pure gold 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"섞임 없는 깨끗한.","whenToUse":"물·금·마음 깨끗함 말할 때."},"krDetail":[{"ko":"순수한","explain":"다른 것이 섞이지 않고 깨끗한"},{"ko":"깨끗한","explain":"더러움이나 잡티가 없는"}],"usageExamples":[{"en":"This ring is made of pure gold.","ko":"이 반지는 순금으로 만들어졌다."},{"en":"We drink pure water from the mountain spring.","ko":"우리는 산의 샘에서 나온 순수한 물을 마신다."}],"grammarNote":"'pure'는 형용사, 부사형은 'purely(순전히)'이다. 반대말은 'impure'로 접두사 'im-'이 붙는다.","grammarQuiz":[{"sentence":"This bottle contains _____ _____ from the deep mountain.","ko":"이 병에는 깊은 산에서 나온 순수한 물이 담겨 있다.","answer":["pure","water"],"hint":"형용사 + 명사"},{"sentence":"The necklace is made _____ _____ _____ and diamonds.","ko":"그 목걸이는 순금과 다이아몬드로 만들어졌다.","answer":["of","pure","gold"],"hint":"전치사 + 형용사 + 명사"}]},
    {"id":"w05141","w":"province","pos":["n"],"ph":"/ˈprɒvɪns/","cefr":"B1","kr":["지방","도"],"ex":[{"en":"She grew up in a rural province.","ko":"그녀는 농촌 지방에서 자랐다."}],"mnemonic":{"soundHint":"프로빈스 → '프로(앞의) + vince(정복하다)한 땅'","story":"정복해서 얻은 나라 밖 땅 → 지방·도","hintConfidence":2},"pairs":{"buddyWords":[{"w":"region","ko":"지역","reason":"동의어 관계"},{"w":"territory","ko":"영토","reason":"동의어 관계"},{"w":"rural","ko":"농촌의","reason":"rural province 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"나라 안의 큰 지역·도.","whenToUse":"캐나다·중국의 도 말할 때."},"krDetail":[{"ko":"지방","explain":"나라의 중심에서 벗어난 각 지역"},{"ko":"도","explain":"한 나라를 크게 나눈 행정 단위"}],"usageExamples":[{"en":"She grew up in a rural province of China.","ko":"그녀는 중국의 농촌 지방에서 자랐다."},{"en":"Canada is divided into ten provinces.","ko":"캐나다는 10개의 도로 나뉜다."}],"grammarNote":"'province'는 특히 캐나다, 중국 등의 행정 구역을 가리키는 명사이다. 'in a province of + 나라'와 같이 쓰인다.","grammarQuiz":[{"sentence":"The northern _____ _____ Canada is very cold in winter.","ko":"캐나다의 북쪽 지방은 겨울에 매우 춥다.","answer":["province","of"],"hint":"명사 + 전치사"},{"sentence":"Many people move from _____ _____ to the big city.","ko":"많은 사람들이 시골 지방에서 대도시로 이사한다.","answer":["rural","provinces"],"hint":"형용사 + 복수 명사"}]},
    {"id":"w04728","w":"parliament","pos":["n"],"ph":"/ˈpɑːrləmənt/","cefr":"B1","kr":["의회","국회"],"ex":[{"en":"Parliament voted on the new law.","ko":"의회가 새 법안에 대해 투표했다."}],"mnemonic":{"soundHint":"팔러먼트","story":"'parle(말하다)' + ment → 말하는 곳 = 의회 (프랑스어 parler)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"congress","ko":"의회","reason":"동의어 - 미국식 의회"},{"w":"senator","ko":"상원의원","reason":"콜로 - 의회 구성원"},{"w":"legislation","ko":"입법","reason":"시나리오 - 의회 활동"}],"collocBest":[]},"nuance":{"koSimple":"법을 만드는 국회·의회.","whenToUse":"국가의 입법 기관을 가리킬 때."},"krDetail":[{"ko":"의회","explain":"국민을 대표해 법을 만드는 모임"},{"ko":"국회","explain":"나라의 법을 만드는 사람들의 모임터"}],"usageExamples":[{"en":"The parliament passed a new education law last week after long debates.","ko":"의회는 긴 토론 끝에 지난주 새로운 교육법을 통과시켰다."},{"en":"Unlike a congress, the British Parliament combines lawmaking and executive oversight in one body.","ko":"미국 의회와 달리, 영국 의회는 입법과 행정 감독을 한 기관에서 결합한다."}],"grammarNote":"parliament는 집합명사로 단수·복수 취급 모두 가능하다. 영국식에서는 복수 취급이 흔하고(Parliament are debating), 미국식에서는 단수 취급이 많다. 학생들은 대문자 P로 쓴 'Parliament'가 특정 국가의 의회를 가리킨다는 점을 놓치기 쉽다. member of parliament의 축약형 MP도 자주 나온다.","grammarQuiz":[{"sentence":"The British _____ is _____ the new bill, but many members oppose it strongly.","ko":"영국 의회가 새 법안을 논의 중이지만, 많은 의원이 강하게 반대한다.","answer":["Parliament","debating"],"hint":"대문자 고유명사 + 진행형"},{"sentence":"Only a member _____ parliament _____ propose changes to the current education law.","ko":"의회 의원만이 현재 교육법 개정을 제안할 수 있다.","answer":["of","can"],"hint":"전치사 of + 조동사 can"}]},
    {"id":"w05028","w":"presentation","pos":["n"],"ph":"/ˌprezənˈteɪʃən/","cefr":"B1","kr":["발표","프레젠테이션"],"ex":[{"en":"She gave a great presentation to the class.","ko":"그녀는 반 학생들에게 훌륭한 발표를 했다."}],"mnemonic":{"soundHint":"프레젠테이션","story":"PPT로 프레젠테이션 발표를 한다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"audience","ko":"청중","reason":"발표는 청중을 대상으로 함"},{"w":"speech","ko":"연설","reason":"동의어 관계"},{"w":"slide","ko":"슬라이드","reason":"발표 도구"}],"collocBest":[{"en":"give a presentation","ko":"발표를 하다"},{"en":"PowerPoint presentation","ko":"파워포인트 발표"}]},"nuance":{"koSimple":"여러 사람 앞에서 하는 발표.","whenToUse":"수업·회의에서 자료로 설명할 때."},"krDetail":[{"ko":"발표","explain":"여러 사람 앞에서 자신의 생각이나 자료를 말로 알림"},{"ko":"프레젠테이션","explain":"슬라이드 등을 이용해 앞에 나와 보여주며 설명함"}],"usageExamples":[{"en":"She gave a presentation about climate change.","ko":"그녀는 기후 변화에 대한 발표를 했다."},{"en":"His presentation impressed the whole audience.","ko":"그의 발표는 청중 전체에게 깊은 인상을 주었다."}],"grammarNote":"'presentation'은 셀 수 있는 명사이므로 'a presentation' 또는 'presentations'로 써야 한다. 'make a presentation'과 'give a presentation' 모두 자주 쓰인다.","grammarQuiz":[{"sentence":"She _____ a wonderful _____ about environmental protection yesterday.","ko":"그녀는 어제 환경 보호에 관한 훌륭한 발표를 했다.","answer":["gave","presentation"],"hint":"give 과거형 + 명사"},{"sentence":"The students are preparing _____ _____ for the science class.","ko":"학생들은 과학 시간을 위해 발표를 준비하고 있다.","answer":["a","presentation"],"hint":"관사 + 명사"}]},
    {"id":"w04886","w":"pity","pos":["n","v"],"ph":"/ˈpɪti/","cefr":"B1","kr":["동정","가엾다","안타깝다"],"ex":[{"en":"It is a pity that she missed the trip.","ko":"그녀가 여행을 놓친 것이 안타깝다."}],"mnemonic":{"soundHint":"피티","story":"'What a pity!(안됐다!)' 원어민 감탄사 = 동정, 안타까움","hintConfidence":2},"pairs":{"buddyWords":[{"w":"sympathy","ko":"동정","reason":"동의어 - 핵심 짝"},{"w":"compassion","ko":"연민","reason":"동의어 - 깊은 동정"},{"w":"cruelty","ko":"잔인함","reason":"반의어 - 동정 vs 잔인"}],"collocBest":[]},"nuance":{"koSimple":"안됐다는 마음·아쉬움.","whenToUse":"가엾거나 아쉬운 상황 표현할 때."},"krDetail":[{"ko":"동정","explain":"다른 사람의 힘든 처지를 마음 아파함"},{"ko":"가엾다","explain":"처지가 딱해 마음이 짠하다"},{"ko":"안타깝다","explain":"일이 뜻대로 되지 않아 애가 타다"}],"usageExamples":[{"en":"She felt deep pity for the homeless children she saw near the busy train station.","ko":"그녀는 분주한 기차역 근처에서 본 노숙 아이들에게 깊은 동정을 느꼈다."},{"en":"Simple sympathy stays in the heart, but real pity moves people to help those who suffer.","ko":"단순한 동정은 마음에만 머무르지만, 진정한 동정은 사람들이 고통받는 이들을 돕도록 움직인다."}],"grammarNote":"pity는 명사(동정·연민)와 동사(불쌍히 여기다) 모두 쓰인다. 'It is a pity that ~'과 'What a pity!' 관용구가 매우 자주 등장한다. 학생들은 pity와 sympathy의 뉘앙스 차이를 익혀야 하는데, pity는 위에서 아래로 내려다보는 뉘앙스가 있어서 상대에게 상처가 될 수 있고, sympathy는 대등한 위치의 공감에 가깝다.","grammarQuiz":[{"sentence":"_____ a _____ that you cannot come to the wedding party this Saturday evening.","ko":"이번 토요일 저녁 결혼식 파티에 올 수 없다니 정말 안타깝다.","answer":["What","pity"],"hint":"감탄문 What a + 명사"},{"sentence":"It is _____ pity _____ we did not have more time to explore the beautiful old city.","ko":"그 아름다운 옛 도시를 탐험할 시간이 더 없었다는 것은 안타까운 일이다.","answer":["a","that"],"hint":"It is a pity that ~ 구문"}]},
    {"id":"w04819","w":"permanent","pos":["adj"],"ph":"/ˈpɜːrmənənt/","cefr":"B1","kr":["영구적인","영속적인"],"ex":[{"en":"She got a permanent job at the company.","ko":"그녀는 회사에서 정규직을 얻었다."}],"mnemonic":{"soundHint":"퍼머넌트","story":"'퍼머(perm 파마)'는 오래 유지되는 = 영구적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"lasting","ko":"지속적인","reason":"동의어 - 오래 지속"},{"w":"eternal","ko":"영원한","reason":"동의어 - 끝없는"},{"w":"temporary","ko":"일시적인","reason":"반의어 - 영구 vs 일시"}],"collocBest":[]},"nuance":{"koSimple":"오래 변하지 않고 계속 가는.","whenToUse":"정규직·영구 손상 말할 때."},"krDetail":[{"ko":"영구적인","explain":"오래도록 변하지 않고 이어지는"},{"ko":"영속적인","explain":"언제까지나 그대로 이어지는"}],"usageExamples":[{"en":"She finally found a permanent job at a large company after years of hard searching.","ko":"그녀는 여러 해 동안 열심히 찾은 끝에 마침내 큰 회사에서 정규직을 얻었다."},{"en":"Temporary damage can heal with time, but permanent damage often leaves lasting scars on the body.","ko":"일시적 손상은 시간이 지나면 나을 수 있지만, 영구적 손상은 종종 몸에 오래가는 흉터를 남긴다."}],"grammarNote":"permanent는 형용사로 '영구적인, 변하지 않는' 뜻이며, 반의어는 temporary다. 학생들은 permanent resident(영주권자), permanent address(주민등록상 주소), permanent damage(영구적 손상)처럼 관용 결합을 익혀야 한다. 부사형 permanently, 명사형 permanence도 함께 익히면 좋다.","grammarQuiz":[{"sentence":"After years of temporary work, she finally _____ a _____ position at the university.","ko":"여러 해의 임시직 끝에, 그녀는 마침내 대학에서 정규직을 얻었다.","answer":["got","permanent"],"hint":"동사 과거형 + 형용사"},{"sentence":"The accident caused _____ damage _____ his knee, so he cannot run marathons anymore.","ko":"그 사고는 그의 무릎에 영구적 손상을 입혀서, 그는 더 이상 마라톤을 뛸 수 없다.","answer":["permanent","to"],"hint":"형용사 + 전치사 to"}]},
    {"id":"w04943","w":"politician","pos":["n"],"ph":"/ˌpɒlɪˈtɪʃən/","cefr":"B1","kr":["정치인","정치가"],"ex":[{"en":"The politician gave a speech on TV.","ko":"정치인이 TV에서 연설을 했다."}],"mnemonic":{"soundHint":"폴리티션","story":"'politics(정치)' 하는 사람(-ian) = 정치인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"politics","ko":"정치","reason":"정치인의 활동 영역 - 짝"},{"w":"statesman","ko":"정치가","reason":"동의어 - 격조 있는 표현"},{"w":"election","ko":"선거","reason":"시나리오 - 정치인의 무대"}],"collocBest":[]},"nuance":{"koSimple":"정치를 직업으로 하는 사람.","whenToUse":"국회의원·시장 얘기할 때."},"krDetail":[{"ko":"정치인","explain":"나라 다스리는 일을 하는 사람"},{"ko":"정치가","explain":"나라 다스리기에 힘 쓰는 이"}],"usageExamples":[{"en":"The politician promised to lower taxes next year.","ko":"그 정치인은 내년에 세금을 낮추겠다고 약속했다."},{"en":"Many politicians attended the international meeting today.","ko":"많은 정치인들이 오늘 국제 회의에 참석했다."}],"grammarNote":"politician은 셀 수 있는 명사로 관사가 필요하다. -ician으로 끝나는 직업명(musician, physician)은 강세가 -i- 앞에 오는 규칙이 있으니 발음에 주의한다.","grammarQuiz":[{"sentence":"The _____ apologized _____ making a misleading statement in public.","ko":"그 정치인은 공개적으로 오해를 불러일으키는 발언을 한 것에 대해 사과했다.","answer":["politician","for"],"hint":"명사 + 전치사"}]},
    {"id":"w04746","w":"passage","pos":["n"],"ph":"/ˈpæsɪdʒ/","cefr":"B1","kr":["통로","구절","지문"],"ex":[{"en":"Read the passage carefully and answer.","ko":"지문을 주의 깊게 읽고 답하세요."}],"mnemonic":{"soundHint":"패시지","story":"'pass(지나가다) + age(장소)' = 통과하는 곳 = 통로, 지문","hintConfidence":3},"pairs":{"buddyWords":[{"w":"corridor","ko":"복도","reason":"동의어 - 좁은 통로"},{"w":"extract","ko":"발췌","reason":"동의어 - 글의 구절"},{"w":"reading","ko":"독해","reason":"reading passage 콜로"}],"collocBest":[]},"nuance":{"koSimple":"글의 한 구절 또는 통로.","whenToUse":"독해 지문·좁은 길을 말할 때."},"krDetail":[{"ko":"통로","explain":"지나다닐 수 있게 트인 길"},{"ko":"구절","explain":"책이나 글의 짧은 한 대목"},{"ko":"지문","explain":"시험이나 교재에 실린 읽기 자료"}],"usageExamples":[{"en":"The teacher read a short passage from the novel to open the discussion.","ko":"선생님은 토론을 열기 위해 소설의 짧은 구절을 읽어 주셨다."},{"en":"A narrow corridor connects two rooms, but a reading passage carries ideas from writer to reader.","ko":"좁은 통로가 두 방을 잇지만, 읽기 지문은 작가에게서 독자에게로 생각을 전한다."}],"grammarNote":"passage는 다의어로 문맥에 따라 물리적 '통로', 글의 '구절', 시간의 '흐름', 통과의 '허가' 등 다양한 뜻이 된다. 학생들은 시험에서 reading passage(읽기 지문)를 가장 자주 만난다. 관용구 'passage of time'은 '시간의 흐름'을 나타내는 문학적 표현으로 자주 인용된다.","grammarQuiz":[{"sentence":"The reading _____ was so difficult that many students _____ to finish it in time.","ko":"그 읽기 지문은 너무 어려워서 많은 학생들이 제시간에 끝내지 못했다.","answer":["passage","failed"],"hint":"명사 + 과거형 동사"},{"sentence":"The narrow _____ between the two houses _____ dark and slightly frightening at night.","ko":"두 집 사이의 좁은 통로는 밤에 어둡고 약간 무서웠다.","answer":["passage","was"],"hint":"명사 + be 동사 과거"}]},
    {"id":"w04734","w":"participate","pos":["v"],"ph":"/pɑːrˈtɪsɪpeɪt/","cefr":"B1","kr":["참가하다","참여하다"],"ex":[{"en":"Students are encouraged to participate in class.","ko":"학생들은 수업에 참여하도록 장려된다."}],"mnemonic":{"soundHint":"파티시페이트","story":"'파트(part)를 시(see) 페이(pay)' → 자기 몫을 맡다 = 참가하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"join","ko":"참여하다","reason":"동의어 - 참가 핵심"},{"w":"engage","ko":"관여하다","reason":"동의어 - 적극 참여"},{"w":"withdraw","ko":"물러나다","reason":"반의어 - 참여를 그만둠"}],"collocBest":[]},"nuance":{"koSimple":"함께 끼어 활동하다.","whenToUse":"수업·대회·토론에 적극 참여할 때."},"krDetail":[{"ko":"참가하다","explain":"어떤 모임이나 일에 함께 나서다"},{"ko":"참여하다","explain":"어떤 자리에 끼어들어 함께 활동하다"}],"usageExamples":[{"en":"Students from every grade participate in the annual school festival together.","ko":"모든 학년의 학생들이 함께 연례 학교 축제에 참가한다."},{"en":"Some choose to withdraw, while others actively participate in the discussion from start to finish.","ko":"일부는 물러서기를 택하지만, 다른 이들은 처음부터 끝까지 토론에 적극 참여한다."}],"grammarNote":"participate는 자동사이므로 목적어를 바로 취할 수 없고 반드시 전치사 in을 붙여야 한다. 학생들이 가장 자주 저지르는 오답이 'participate the contest'인데, 반드시 'participate in the contest'가 되어야 한다. take part in과 같은 뜻이며, 능동적 참여를 강조한다.","grammarQuiz":[{"sentence":"More than fifty students actively _____ _____ the debate contest held last Friday.","ko":"50명이 넘는 학생들이 지난 금요일에 열린 토론 대회에 적극적으로 참가했다.","answer":["participated","in"],"hint":"과거형 + 자동사 전치사 in"},{"sentence":"If you want _____ participate _____ our program, please fill out the form online today.","ko":"저희 프로그램에 참여하고 싶다면, 오늘 온라인으로 양식을 작성해 주세요.","answer":["to","in"],"hint":"to부정사 + 자동사 전치사 in"}]},
    {"id":"w05116","w":"property","pos":["n"],"ph":"/ˈprɒpəti/","cefr":"B1","kr":["재산","특성"],"ex":[{"en":"The property is located near the river.","ko":"그 부동산은 강 근처에 위치하고 있다."}],"mnemonic":{"soundHint":"프로퍼티 → 'proper(내 것) + ty(속성)'","story":"내게 딱 맞는(proper) 소유 → 재산·특성","hintConfidence":2},"pairs":{"buddyWords":[{"w":"possession","ko":"소유물","reason":"동의어 관계"},{"w":"characteristic","ko":"특성","reason":"동의어 관계"},{"w":"private","ko":"사유의","reason":"private property 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"내가 가진 재산·부동산.","whenToUse":"집·땅·소유물 이야기할 때."},"krDetail":[{"ko":"재산","explain":"가지고 있는 값나가는 물건이나 땅"},{"ko":"특성","explain":"그것만이 지닌 남다른 성질"}],"usageExamples":[{"en":"He owns a lot of property in the city.","ko":"그는 도시에 많은 재산을 갖고 있다."},{"en":"Water has the property of dissolving many things.","ko":"물은 많은 것을 녹이는 특성을 가지고 있다."}],"grammarNote":"'property'는 '재산'의 의미로는 셀 수 없는 명사, '특성'의 의미로는 셀 수 있는 명사로 쓰인다. 복수형은 'properties'이다.","grammarQuiz":[{"sentence":"This land is _____ _____ and no one can enter.","ko":"이 땅은 사유 재산이므로 아무도 들어갈 수 없다.","answer":["private","property"],"hint":"형용사 + 명사"},{"sentence":"Ice has different _____ _____ water.","ko":"얼음은 물과는 다른 특성을 가진다.","answer":["properties","from"],"hint":"복수 명사 + 전치사"}]},
    {"id":"w04986","w":"powder","pos":["n"],"ph":"/ˈpaʊdə/","cefr":"B1","kr":["가루","분말"],"ex":[{"en":"Mix the powder with water to make juice.","ko":"가루를 물과 섞어 주스를 만들어라."}],"mnemonic":{"soundHint":"'파우더' → 화장품 '파우더', 베이킹 '파우더'","story":"'파우더' 룸은 화장 고치는 방. '베이킹 파우더'는 빵 만들 때 넣는 가루.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dust","ko":"먼지","reason":"직접 동의어 - 가루 형태"},{"w":"flour","ko":"밀가루","reason":"직접 동의어 - 가루의 일종"},{"w":"baking","ko":"제빵","reason":"baking powder - 자주 결합"}],"collocBest":[{"en":"baking powder","ko":"베이킹 파우더"},{"en":"milk powder","ko":"분유"}]},"nuance":{"koSimple":"곱게 부서진 가루 형태.","whenToUse":"베이킹·화장품·약 얘기할 때."},"krDetail":[{"ko":"가루","explain":"잘게 부서진 낱알"},{"ko":"분말","explain":"곱게 빻아 놓은 알갱이"}],"usageExamples":[{"en":"She added a spoon of protein powder to her drink.","ko":"그녀는 자신의 음료에 단백질 가루 한 숟가락을 넣었다."},{"en":"Baby powder keeps the skin dry and soft.","ko":"베이비 파우더는 피부를 뽀송하고 부드럽게 유지시켜 준다."}],"grammarNote":"powder는 불가산명사가 일반적이지만, 종류를 구별할 때는 셀 수 있는 명사처럼 쓰기도 한다. 'a powder for babies'는 특정 종류의 가루를 뜻하는 예이다.","grammarQuiz":[{"sentence":"The cook sprinkled some _____ _____ the top of the cake.","ko":"요리사는 케이크 윗면에 약간의 가루를 뿌렸다.","answer":["powder","on"],"hint":"명사 + 전치사"}]},
    {"id":"w05106","w":"promotion","pos":["n"],"ph":"/prəˈməʊʃən/","cefr":"B1","kr":["승진","홍보"],"ex":[{"en":"She received a promotion at work.","ko":"그녀는 직장에서 승진을 받았다."}],"mnemonic":{"soundHint":"프로모션 → 'promote + ion(명사화)'","story":"앞으로 밀어주기 = 승진·홍보","hintConfidence":3},"pairs":{"buddyWords":[{"w":"advancement","ko":"승진","reason":"동의어 관계"},{"w":"demotion","ko":"강등","reason":"반의어 관계"},{"w":"sales","ko":"판매","reason":"sales promotion 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"직급이 오르는 승진.","whenToUse":"직장 승진·판매 홍보 말할 때."},"krDetail":[{"ko":"승진","explain":"회사에서 더 높은 자리로 올라감"},{"ko":"홍보","explain":"물건이나 소식을 널리 알리는 일"}],"usageExamples":[{"en":"He got a promotion after three years of hard work.","ko":"그는 3년간의 노력 끝에 승진했다."},{"en":"The store is running a big promotion this weekend.","ko":"그 가게는 이번 주말에 큰 홍보 행사를 한다."}],"grammarNote":"'get a promotion'은 '승진하다', 'sales promotion'은 '판매 촉진'을 뜻한다. 셀 수 있는 명사와 없는 명사 둘 다 쓰인다.","grammarQuiz":[{"sentence":"He hopes _____ _____ _____ _____ next year at his company.","ko":"그는 내년에 회사에서 승진하기를 바란다.","answer":["to","get","a","promotion"],"hint":"부정사 + 동사 + 관사 + 명사"},{"sentence":"The company started a big _____ _____ for its new phone.","ko":"그 회사는 새 전화기의 대대적인 판촉을 시작했다.","answer":["sales","promotion"],"hint":"명사 + 명사"}]},
    {"id":"w04919","w":"plug","pos":["n","v"],"ph":"/plʌɡ/","cefr":"B1","kr":["플러그","꽂다"],"ex":[{"en":"Plug in the charger before it dies.","ko":"방전되기 전에 충전기를 꽂아라."}],"mnemonic":{"soundHint":"'플러그' → 외래어 그대로 '전기 플러그'","story":"'플러그'를 콘센트에 꽂는다(plug in). 전기가 통한다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"socket","ko":"콘센트","reason":"plug와 짝 - 시나리오"},{"w":"unplug","ko":"뽑다","reason":"un- 접두사 반의어"},{"w":"charger","ko":"충전기","reason":"plug in the charger - 시나리오"}],"collocBest":[{"en":"plug in","ko":"꽂다"},{"en":"pull the plug","ko":"중단하다"}]},"nuance":{"koSimple":"콘센트에 끼우는 마개, 또는 끼우다.","whenToUse":"충전기·전기 코드 꽂을 때."},"krDetail":[{"ko":"플러그","explain":"전기 줄 끝에 붙은 꽂이"},{"ko":"꽂다","explain":"구멍에 밀어 넣다"}],"usageExamples":[{"en":"Please plug the charger into the wall socket now.","ko":"지금 충전기를 벽 콘센트에 꽂아 주세요."},{"en":"Don't forget to unplug the toaster before leaving.","ko":"떠나기 전에 토스터의 플러그를 뽑는 것을 잊지 마라."}],"grammarNote":"plug in은 이어동사로 목적어의 위치가 자유롭지만, 대명사가 목적어일 때는 반드시 'plug it in' 순서로 써야 한다. 'plug in it'은 오답이다.","grammarQuiz":[{"sentence":"When I got home, I _____ the laptop _____ to charge it.","ko":"집에 도착했을 때, 나는 노트북을 충전하기 위해 콘센트에 꽂았다.","answer":["plugged","in"],"hint":"과거동사 + 부사"}]},
    {"id":"w05052","w":"prime","pos":["adj","n"],"ph":"/praɪm/","cefr":"B1","kr":["최상의","전성기"],"ex":[{"en":"She was in the prime of her life.","ko":"그녀는 인생의 전성기에 있었다."}],"mnemonic":{"soundHint":"프라임 → '프라임 타임(peak time, 황금시간)'","story":"TV 프라임 타임 = 최고 시청률의 전성기 시간","hintConfidence":3},"pairs":{"buddyWords":[{"w":"peak","ko":"정점","reason":"동의어 관계"},{"w":"minister","ko":"장관","reason":"prime minister 콜로케이션"},{"w":"condition","ko":"상태","reason":"in prime condition 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"가장 좋고 최상의 상태.","whenToUse":"전성기·최고 상태 말할 때."},"krDetail":[{"ko":"최상의","explain":"가장 좋은 상태에 있는"},{"ko":"전성기","explain":"가장 잘 나가고 활발한 시기"}],"usageExamples":[{"en":"The athlete is in his prime.","ko":"그 운동선수는 전성기에 있다."},{"en":"This is a prime example of good design.","ko":"이것은 좋은 디자인의 최상의 예이다."}],"grammarNote":"'prime'은 형용사로 '최상의, 주요한'의 의미로 쓰이고, 명사로 'in one's prime'의 형태로 자주 사용된다.","grammarQuiz":[{"sentence":"The _____ _____ visits the president every Monday.","ko":"수상은 매주 월요일에 대통령을 방문한다.","answer":["prime","minister"],"hint":"형용사 + 명사"},{"sentence":"He was _____ _____ prime when he wrote the novel.","ko":"그는 그 소설을 쓸 때 전성기에 있었다.","answer":["in","his"],"hint":"전치사 + 소유격"}]},
    {"id":"w04809","w":"perform","pos":["v"],"ph":"/pərˈfɔːrm/","cefr":"B1","kr":["수행하다","공연하다"],"ex":[{"en":"The band performed live on stage.","ko":"밴드가 무대에서 라이브로 공연했다."}],"mnemonic":{"soundHint":"퍼폼","story":"'퍼포먼스(performance 공연/성과)'의 동사 = 수행하다, 공연하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"execute","ko":"실행하다","reason":"동의어 - 임무 수행"},{"w":"stage","ko":"무대","reason":"콜로 - 무대에서 공연"},{"w":"audience","ko":"관객","reason":"시나리오 - 관객 앞에서 공연"}],"collocBest":[]},"nuance":{"koSimple":"일을 해내다·무대에 서다.","whenToUse":"임무 수행·공연 무대 말할 때."},"krDetail":[{"ko":"수행하다","explain":"맡은 일을 실제로 이루어 내다"},{"ko":"공연하다","explain":"많은 사람 앞에서 노래·연극을 보이다"}],"usageExamples":[{"en":"The surgeon will perform a difficult heart operation early tomorrow morning.","ko":"그 외과의사는 내일 아침 일찍 어려운 심장 수술을 수행할 것이다."},{"en":"Practice alone shows little; you must perform well on stage to win the audience's respect.","ko":"연습만으로는 보여 줄 수 있는 것이 적으며, 청중의 존경을 얻으려면 무대에서 잘 공연해야 한다."}],"grammarNote":"perform은 타동사(어떤 일·수술·역할을 수행하다)와 자동사(공연하다·수행 능력을 보이다)로 모두 쓰인다. 학생들은 perform on stage, perform well, perform surgery처럼 목적어 유무에 따라 뜻이 달라지는 것을 익혀야 한다. carry out(수행하다)과 유의어이며, 공연 의미에서는 자동사 용법이 흔하다.","grammarQuiz":[{"sentence":"The famous singer will _____ live _____ Seoul next month for the first time in years.","ko":"그 유명 가수는 다음 달 몇 년 만에 처음으로 서울에서 라이브로 공연할 것이다.","answer":["perform","in"],"hint":"자동사 원형 + 장소 in"},{"sentence":"The doctor _____ the difficult surgery _____ carefully that the patient recovered fully within days.","ko":"의사가 어려운 수술을 매우 조심스럽게 수행해서, 환자는 며칠 안에 완전히 회복되었다.","answer":["performed","so"],"hint":"타동사 과거형 + so ~ that"}]},
    {"id":"w05114","w":"proper","pos":["adj"],"ph":"/ˈprɒpə/","cefr":"B1","kr":["적절한","올바른"],"ex":[{"en":"Use proper grammar in your writing.","ko":"글쓰기에서 올바른 문법을 사용해라."}],"mnemonic":{"soundHint":"프로퍼 → '프로(pro)답게 퍼펙트한'","story":"프로답게 딱 맞게 하는 것 → 적절한·올바른","hintConfidence":2},"pairs":{"buddyWords":[{"w":"correct","ko":"올바른","reason":"동의어 관계"},{"w":"improper","ko":"부적절한","reason":"반의어 관계"},{"w":"noun","ko":"명사","reason":"proper noun 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"상황에 딱 맞고 올바른.","whenToUse":"예절·문법·방식 지킬 때."},"krDetail":[{"ko":"적절한","explain":"그 상황에 딱 알맞은"},{"ko":"올바른","explain":"잘못됨이 없이 바른"}],"usageExamples":[{"en":"You must wear proper clothes at the interview.","ko":"면접에서는 적절한 옷을 입어야 한다."},{"en":"There is a proper way to hold a knife.","ko":"칼을 잡는 올바른 방법이 있다."}],"grammarNote":"'proper'는 형용사, 부사형은 'properly(제대로)'이다. 반대말은 'improper(부적절한)'로 접두사 'im-'이 붙는다.","grammarQuiz":[{"sentence":"Students should learn the _____ _____ _____ studying English.","ko":"학생들은 영어를 공부하는 올바른 방법을 배워야 한다.","answer":["proper","way","of"],"hint":"형용사 + 명사 + 전치사"},{"sentence":"'Seoul' is _____ _____ _____ that starts with a capital letter.","ko":"'Seoul'은 대문자로 시작하는 고유 명사이다.","answer":["a","proper","noun"],"hint":"관사 + 형용사 + 명사"}]},
    {"id":"w04937","w":"pole","pos":["n"],"ph":"/pəʊl/","cefr":"B1","kr":["극","기둥"],"ex":[{"en":"The flag hangs on a tall pole.","ko":"깃발이 높은 기둥에 매달려 있다."}],"mnemonic":{"soundHint":"'폴' → North Pole(북극), 폴대(기둥)","story":"'폴 댄스'는 기둥(pole)을 잡고 추는 춤. North Pole은 지구의 북극.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"post","ko":"기둥","reason":"직접 동의어"},{"w":"flag","ko":"깃발","reason":"flag pole - 자주 결합 시나리오"},{"w":"north","ko":"북쪽","reason":"North Pole - 짝"}],"collocBest":[{"en":"North Pole","ko":"북극"},{"en":"telephone pole","ko":"전신주"}]},"nuance":{"koSimple":"길고 곧은 기둥, 또는 지구의 극.","whenToUse":"깃대·전신주·북극 얘기할 때."},"krDetail":[{"ko":"극","explain":"지구가 도는 축의 양쪽 끝"},{"ko":"기둥","explain":"곧고 길게 세워진 막대"}],"usageExamples":[{"en":"The explorer reached the North Pole in winter.","ko":"그 탐험가는 겨울에 북극에 도달했다."},{"en":"A wooden pole supported the old wooden fence.","ko":"나무 기둥이 오래된 나무 울타리를 받쳐 주었다."}],"grammarNote":"North Pole, South Pole처럼 지구의 극을 뜻할 때는 대문자로 쓰고 정관사 the를 붙인다. 일반적인 '기둥'의 뜻일 때는 소문자로 쓴다.","grammarQuiz":[{"sentence":"Many animals live near _____ North _____ despite the harsh cold.","ko":"많은 동물들이 혹독한 추위에도 불구하고 북극 근처에 산다.","answer":["the","Pole"],"hint":"정관사 + 고유명사"}]},
    {"id":"w05060","w":"priority","pos":["n"],"ph":"/praɪˈɒrɪti/","cefr":"B1","kr":["우선순위","중요한 것"],"ex":[{"en":"Education should be a top priority.","ko":"교육은 최우선 순위여야 한다."}],"mnemonic":{"soundHint":"프라이오리티 → '프라이어(prior, 먼저의) + 티'","story":"먼저(prior) 할 것 → 우선순위","hintConfidence":3},"pairs":{"buddyWords":[{"w":"urgency","ko":"긴급성","reason":"동의어 관계"},{"w":"top","ko":"최상의","reason":"top priority 콜로케이션"},{"w":"task","ko":"과제","reason":"우선순위 설정 대상"}],"collocBest":[]},"nuance":{"koSimple":"먼저 할 중요한 일.","whenToUse":"할 일의 순서·중요도 정할 때."},"krDetail":[{"ko":"우선순위","explain":"여러 일 가운데 먼저 해야 할 차례"},{"ko":"중요한 것","explain":"먼저 챙기고 다뤄야 하는 대상"}],"usageExamples":[{"en":"The teacher gives priority to weaker students.","ko":"그 선생님은 부족한 학생들에게 우선순위를 준다."},{"en":"Safety is our top priority at the workplace.","ko":"안전은 직장에서 우리의 최우선 사항이다."}],"grammarNote":"'give priority to + 명사'와 'set priorities'는 자주 함께 쓰이는 표현이다. 복수형은 'priorities'로 y가 ies로 바뀐다.","grammarQuiz":[{"sentence":"You should _____ your _____ before starting the project.","ko":"프로젝트를 시작하기 전에 우선순위를 정해야 한다.","answer":["set","priorities"],"hint":"동사 + 명사 복수형"},{"sentence":"Health is his _____ _____ over anything else.","ko":"건강은 그에게 다른 어떤 것보다 최우선이다.","answer":["top","priority"],"hint":"형용사 + 명사"}]},
    {"id":"w05189","w":"questionnaire","pos":["n"],"ph":"/ˌkwestʃəˈneər/","cefr":"B1","kr":["설문지","질문지"],"ex":[{"en":"Please complete the questionnaire.","ko":"설문지를 작성해 주세요."}],"mnemonic":{"soundHint":"퀘스처네어 → 'question(질문) + naire(모음)'","story":"질문(question) 여러 개를 모은 종이 → 설문지","hintConfidence":3},"pairs":{"buddyWords":[{"w":"survey","ko":"조사","reason":"동의어 관계"},{"w":"form","ko":"양식","reason":"동의어 관계"},{"w":"fill","ko":"작성하다","reason":"fill in a questionnaire 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"질문 여러 개 적힌 설문지.","whenToUse":"조사·설문 작성 이야기할 때."},"krDetail":[{"ko":"설문지","explain":"여러 질문을 적어 답을 받는 종이"},{"ko":"질문지","explain":"궁금한 것을 묻기 위한 문서"}],"usageExamples":[{"en":"Please fill in this questionnaire before you leave.","ko":"떠나기 전에 이 설문지를 작성해 주세요."},{"en":"The online questionnaire took only five minutes.","ko":"온라인 설문지는 겨우 5분 걸렸다."}],"grammarNote":"'questionnaire'는 'n' 두 개를 쓰는 것에 주의해야 한다. 'fill in/out a questionnaire(설문지를 작성하다)'는 자주 쓰인다.","grammarQuiz":[{"sentence":"Every visitor should _____ _____ _____ before entering the museum.","ko":"모든 방문객은 박물관에 들어가기 전에 설문지를 작성해야 한다.","answer":["fill","in","a","questionnaire"],"hint":"동사 + 부사 + 관사 + 명사"},{"sentence":"The _____ _____ helps the company understand its customers.","ko":"그 온라인 설문지는 회사가 고객을 이해하도록 돕는다.","answer":["online","questionnaire"],"hint":"형용사 + 명사"}]},
    {"id":"w04982","w":"pottery","pos":["n"],"ph":"/ˈpɒtəri/","cefr":"B1","kr":["도자기","도예"],"ex":[{"en":"She enjoyed making pottery as a hobby.","ko":"그녀는 취미로 도예를 즐겼다."}],"mnemonic":{"soundHint":"포터리","story":"'pot(항아리)' + tery = 항아리 만드는 곳 = 도자기, 도예","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ceramics","ko":"도자기","reason":"직접 동의어"},{"w":"clay","ko":"점토","reason":"시나리오 - pottery 재료"},{"w":"class","ko":"수업","reason":"pottery class 콜로"}],"collocBest":[]},"nuance":{"koSimple":"흙 빚어 구워 만든 그릇·예술.","whenToUse":"도예 수업·전시 이야기할 때."},"krDetail":[{"ko":"도자기","explain":"흙을 빚어 구워 만든 그릇"},{"ko":"도예","explain":"흙을 빚어 그릇을 만드는 솜씨"}],"usageExamples":[{"en":"She makes beautiful pottery in her home studio.","ko":"그녀는 자신의 집 작업실에서 아름다운 도자기를 만든다."},{"en":"Korean pottery is admired all around the world.","ko":"한국 도자기는 전 세계에서 존경받는다."}],"grammarNote":"pottery는 불가산명사로 관사 a/an이나 복수형을 쓰지 않는다. 도자기 한 점을 뜻할 때는 'a piece of pottery'라고 써야 한다. 학생들이 'a pottery'로 잘못 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"The museum displayed ancient _____ _____ was discovered in the tomb.","ko":"그 박물관은 무덤에서 발견된 고대 도자기를 전시했다.","answer":["pottery","which"],"hint":"명사 + 관계대명사"}]},
    {"id":"w04802","w":"percent","pos":["n","adv"],"ph":"/pərˈsent/","cefr":"B1","kr":["퍼센트","백분율"],"ex":[{"en":"Ninety percent of students passed.","ko":"학생의 90퍼센트가 합격했다."}],"mnemonic":{"soundHint":"퍼센트","story":"외래어 '퍼센트'는 100(cent)당(per) 비율.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"percentage","ko":"백분율","reason":"동의어 - 어원 동일"},{"w":"ratio","ko":"비율","reason":"동의어 - 상대적 크기"},{"w":"statistics","ko":"통계","reason":"시나리오 - 통계에서 퍼센트"}],"collocBest":[{"en":"fifty percent","ko":"50퍼센트"},{"en":"percent of","ko":"~의 몇 퍼센트"}]},"nuance":{"koSimple":"백에 몇 개꼴.","whenToUse":"구체 수치 비율을 말할 때."},"krDetail":[{"ko":"퍼센트","explain":"전체를 100으로 나눈 비율의 단위"},{"ko":"백분율","explain":"전체를 100으로 잡은 비율"}],"usageExamples":[{"en":"About sixty percent of students in our school walk to class every morning.","ko":"우리 학교 학생의 약 60퍼센트가 매일 아침 걸어서 등교한다."},{"en":"Ten out of twenty is exactly fifty percent, and that ratio surprised the entire research team.","ko":"20 중 10은 정확히 50퍼센트이며, 그 비율은 전체 연구팀을 놀라게 했다."}],"grammarNote":"percent는 부사·명사로 쓰이며 숫자 뒤에 놓여 비율을 나타낸다. 학생들은 percent와 percentage의 차이를 익혀야 하는데, 구체적 수치와 함께 오면 percent(50 percent), 비율 자체를 지칭하면 percentage(a high percentage)를 쓴다. 미국식은 percent, 영국식은 per cent로 띄어 쓰기도 한다.","grammarQuiz":[{"sentence":"About seventy _____ _____ the students said they enjoy studying English at our high school.","ko":"약 70퍼센트의 학생들이 우리 고등학교에서 영어 공부를 즐긴다고 말했다.","answer":["percent","of"],"hint":"수치 + percent + of"},{"sentence":"Sales _____ by twenty _____ this quarter thanks to the new online marketing campaign.","ko":"새로운 온라인 마케팅 캠페인 덕분에 이번 분기 매출이 20퍼센트 증가했다.","answer":["increased","percent"],"hint":"증가 동사 + 수치 단위"}]},
    {"id":"w04944","w":"politics","pos":["n"],"ph":"/ˈpɒlɪtɪks/","cefr":"B1","kr":["정치","정치학"],"ex":[{"en":"She studied politics at university.","ko":"그녀는 대학에서 정치학을 공부했다."}],"mnemonic":{"soundHint":"폴리틱스","story":"그리스 'polis(도시국가)'에서 유래 - 도시 운영 = 정치","hintConfidence":3},"pairs":{"buddyWords":[{"w":"politician","ko":"정치인","reason":"정치하는 사람 - 짝"},{"w":"government","ko":"정부","reason":"정치의 무대"},{"w":"election","ko":"선거","reason":"시나리오 - 정치의 핵심 이벤트"}],"collocBest":[]},"nuance":{"koSimple":"나라를 이끄는 일 자체.","whenToUse":"선거·정책 학문 다룰 때."},"krDetail":[{"ko":"정치","explain":"나라를 다스리는 일과 흐름"},{"ko":"정치학","explain":"나라 다스림을 배우는 학문"}],"usageExamples":[{"en":"He studied politics at a well-known university.","ko":"그는 잘 알려진 대학에서 정치학을 공부했다."},{"en":"Politics has changed rapidly over the last decade.","ko":"정치는 지난 10년간 급격히 변해왔다."}],"grammarNote":"politics는 -s로 끝나지만 학문·분야를 뜻할 때는 단수 취급하여 단수 동사를 쓴다. 'Politics is my major.'가 옳은 형태이며, '정치 활동/견해'를 뜻할 때는 복수 취급도 가능하다.","grammarQuiz":[{"sentence":"Politics _____ a complex subject _____ requires deep understanding.","ko":"정치학은 깊은 이해를 필요로 하는 복잡한 과목이다.","answer":["is","that"],"hint":"단수 be동사 + 관계대명사"}]},
    {"id":"w04786","w":"pedal","pos":["n","v"],"ph":"/ˈpɛdəl/","cefr":"B1","kr":["페달","페달을 밟다"],"ex":[{"en":"He pedaled his bicycle up the hill.","ko":"그는 언덕을 자전거 페달을 밟으며 올라갔다."}],"mnemonic":{"soundHint":"페달","story":"외래어 '페달'은 발(ped-)로 밟는 장치.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bicycle","ko":"자전거","reason":"시나리오 - 자전거 페달"},{"w":"brake","ko":"브레이크","reason":"콜로케이션 - 페달 종류"},{"w":"accelerate","ko":"가속하다","reason":"시나리오 - 페달을 밟아 가속"}],"collocBest":[{"en":"press the pedal","ko":"페달을 밟다"},{"en":"brake pedal","ko":"브레이크 페달"}]},"nuance":{"koSimple":"발로 밟는 장치·밟다.","whenToUse":"자전거·자동차 페달 조작 말할 때."},"krDetail":[{"ko":"페달","explain":"발로 밟아 움직이게 하는 기계 부품"},{"ko":"페달을 밟다","explain":"발로 페달을 눌러 움직임을 만들다"}],"usageExamples":[{"en":"The pianist gently pressed the pedal to make the notes sound softer and warmer.","ko":"그 피아니스트는 음이 더 부드럽고 따뜻하게 들리도록 페달을 부드럽게 밟았다."},{"en":"Sitting still moves nothing, but you must pedal steadily to keep the old bicycle moving uphill.","ko":"가만히 앉아 있으면 아무것도 움직이지 않고, 낡은 자전거를 언덕 위로 계속 움직이려면 꾸준히 페달을 밟아야 한다."}],"grammarNote":"pedal은 명사(페달)와 동사(페달을 밟다)로 모두 쓰인다. 동사로 쓸 때는 자전거를 타거나 재봉틀·피아노를 다루는 문맥에서 자주 등장한다. 학생들은 소리는 같지만 뜻이 다른 peddle(행상하다)과 혼동하기 쉬우므로 철자와 뜻을 함께 기억해야 한다. 결합 동사는 press/push/step on the pedal이 흔하다.","grammarQuiz":[{"sentence":"You should press the brake _____ firmly _____ your car begins to slide on the icy road.","ko":"차가 얼음길에서 미끄러지기 시작하면 브레이크 페달을 힘있게 밟아야 한다.","answer":["pedal","when"],"hint":"명사 + 접속사 when"},{"sentence":"The children _____ their bikes as fast _____ they could down the long, gentle hill.","ko":"아이들은 길고 완만한 언덕을 내려가며 최대한 빠르게 자전거 페달을 밟았다.","answer":["pedaled","as"],"hint":"동사 과거형 + as ~ as 비교"}]},
    {"id":"w05009","w":"predict","pos":["v"],"ph":"/prɪˈdɪkt/","cefr":"B1","kr":["예측하다","예언하다"],"ex":[{"en":"Scientists predict a rise in sea levels.","ko":"과학자들은 해수면 상승을 예측한다."}],"mnemonic":{"soundHint":"프리딕트","story":"'pre(미리) + dict(말하다)' = 미리 말하다 = 예측하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"forecast","ko":"예측하다","reason":"직접 동의어"},{"w":"prediction","ko":"예측","reason":"명사형 - 짝"},{"w":"future","ko":"미래","reason":"predict the future 콜로"}],"collocBest":[]},"nuance":{"koSimple":"앞으로 일어날 일을 미리 말하다.","whenToUse":"날씨·경기 결과·미래 얘기할 때."},"krDetail":[{"ko":"예측하다","explain":"앞일을 미리 헤아려 말하다"},{"ko":"예언하다","explain":"앞으로 있을 일을 미리 알려주다"}],"usageExamples":[{"en":"Scientists predict a warmer climate in the coming years.","ko":"과학자들은 앞으로 몇 년 안에 더 따뜻한 기후를 예측한다."},{"en":"No one can predict exactly what will happen tomorrow.","ko":"아무도 내일 무슨 일이 일어날지 정확히 예측할 수 없다."}],"grammarNote":"predict는 타동사로 명사나 that절을 목적어로 취한다. 'predict about'은 잘못된 형태이며, 학생들이 자주 오류를 범하는 부분이다. 'predict + that + 주어 + 동사'가 정확하다.","grammarQuiz":[{"sentence":"Experts _____ that the market _____ recover within a year.","ko":"전문가들은 시장이 1년 안에 회복될 것이라고 예측한다.","answer":["predict","will"],"hint":"동사 + 조동사"}]},
    {"id":"w04964","w":"pose","pos":["v","n"],"ph":"/pəʊz/","cefr":"B1","kr":["자세를 취하다","제기하다"],"ex":[{"en":"The issue poses a serious challenge.","ko":"그 문제는 심각한 도전을 제기한다."}],"mnemonic":{"soundHint":"'포즈' → 사진 찍을 때 '포즈' 취하기","story":"카메라 앞에서 '포즈' 취하기(pose). 또는 문제를 던지다(pose a problem).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"present","ko":"제시하다","reason":"직접 동의어 - 두 번째 의미"},{"w":"model","ko":"모델","reason":"직접 동의어 - 자세 취하다"},{"w":"problem","ko":"문제","reason":"pose a problem - 자주 결합"}],"collocBest":[{"en":"pose a problem","ko":"문제를 제기하다"},{"en":"pose a question","ko":"질문을 던지다"}]},"nuance":{"koSimple":"자세를 잡거나 문제를 던지다.","whenToUse":"사진 촬영·질문 제기할 때."},"krDetail":[{"ko":"자세를 취하다","explain":"몸을 어떤 꼴로 잡아 보이다"},{"ko":"제기하다","explain":"말이나 뜻을 앞에 내놓다"}],"usageExamples":[{"en":"The model posed gracefully for the camera all afternoon.","ko":"그 모델은 오후 내내 카메라를 위해 우아하게 포즈를 취했다."},{"en":"Climate change poses a serious threat to humanity.","ko":"기후 변화는 인류에게 심각한 위협을 제기한다."}],"grammarNote":"pose가 '제기하다'의 뜻으로 쓰일 때는 타동사로 problem, question, threat 등을 목적어로 취한다. 이 용법은 학생들이 자주 놓치는 격식체 표현이다.","grammarQuiz":[{"sentence":"The new technology _____ a threat _____ traditional job markets worldwide.","ko":"그 새로운 기술은 전 세계 전통적인 일자리 시장에 위협을 제기한다.","answer":["poses","to"],"hint":"3인칭 단수동사 + 전치사"}]},
    {"id":"w04871","w":"pile","pos":["n","v"],"ph":"/paɪl/","cefr":"B1","kr":["더미","쌓다"],"ex":[{"en":"There is a pile of books on the desk.","ko":"책상 위에 책 더미가 있다."}],"mnemonic":{"soundHint":"파일","story":"'서류 파일'이 쌓인 더미, '파일함' = 더미, 쌓다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"heap","ko":"더미","reason":"동의어 - 핵심 짝"},{"w":"stack","ko":"쌓다","reason":"동의어 - 겹쳐 쌓음"},{"w":"scatter","ko":"흩어뜨리다","reason":"반의어 - 쌓기 vs 흩기"}],"collocBest":[]},"nuance":{"koSimple":"차곡차곡 쌓인 더미.","whenToUse":"책·서류가 잔뜩 쌓였을 때."},"krDetail":[{"ko":"더미","explain":"많이 쌓여 이룬 무더기"},{"ko":"쌓다","explain":"여러 개를 겹쳐 위로 올리다"}],"usageExamples":[{"en":"She placed a huge pile of books on the desk before starting her long study session.","ko":"그녀는 긴 공부 시간을 시작하기 전에 책상 위에 엄청난 책 더미를 놓았다."},{"en":"A single heap looks messy, but a neatly organized pile keeps the classroom tidy and easier to clean.","ko":"한 무더기는 지저분해 보이지만, 잘 정리된 더미는 교실을 깔끔하고 청소하기 쉽게 유지한다."}],"grammarNote":"pile은 명사(더미)와 동사(쌓다) 모두 쓰인다. 'pile up'은 자동사·타동사 겸용 구동사로 '쌓이다·쌓다'이며, 'a pile of + 복수/불가산명사' 구조가 '많은 양의 ~'라는 강조 표현이다. 학생들은 heap과 stack이 비슷한 뜻인 것을 기억해야 하며, pile은 무질서한 더미, stack은 가지런히 쌓은 것에 가깝다.","grammarQuiz":[{"sentence":"There was a huge _____ _____ homework waiting for me when I returned home last night.","ko":"어젯밤 집에 돌아왔을 때 나를 기다리는 엄청난 숙제 더미가 있었다.","answer":["pile","of"],"hint":"명사 pile + 전치사 of"},{"sentence":"The autumn leaves _____ up quickly in the yard, so we _____ them together every weekend.","ko":"가을 잎이 마당에 빠르게 쌓여서, 우리는 주말마다 그것들을 함께 모았다.","answer":["pile","raked"],"hint":"자동사 + 과거형 raked"}]},
    {"id":"w04723","w":"pardon","pos":["v","n"],"ph":"/ˈpɑːrdən/","cefr":"B1","kr":["용서하다","사면하다","사면"],"ex":[{"en":"The president granted a pardon to the prisoner.","ko":"대통령이 그 죄수에게 사면을 허락했다."}],"mnemonic":{"soundHint":"파든","story":"'I beg your pardon?(뭐라고요? 용서를 빕니다)' = 용서, 사면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"forgive","ko":"용서하다","reason":"동의어 - 용서 핵심"},{"w":"apology","ko":"사과","reason":"시나리오 - 사과 후 용서"},{"w":"mercy","ko":"자비","reason":"시나리오 - 자비로 사면"}],"collocBest":[]},"nuance":{"koSimple":"잘못을 봐주고 용서해 주다.","whenToUse":"죄·실수를 격식 있게 용서할 때."},"krDetail":[{"ko":"용서하다","explain":"잘못을 따지지 않고 너그럽게 봐주다"},{"ko":"사면하다","explain":"죄지은 이의 벌을 나라의 권한으로 풀어주다"},{"ko":"사면","explain":"죄를 지은 사람의 벌을 없애 주는 조치"}],"usageExamples":[{"en":"The judge decided to pardon the young offender for his first mistake.","ko":"판사는 그 어린 범죄자의 첫 실수를 용서하기로 결정했다."},{"en":"A presidential pardon can free a prisoner, but public opinion often condemns such decisions.","ko":"대통령 사면은 죄수를 풀어줄 수 있지만, 여론은 종종 그런 결정을 비난한다."}],"grammarNote":"pardon은 타동사로 사람이나 잘못을 목적어로 취한다. 학생들은 'pardon for + 명사/동명사' 구조를 자주 빼먹는데, 어떤 잘못에 대해 용서하는지 밝힐 때는 반드시 for가 필요하다. 또한 'I beg your pardon?'은 되묻는 정중한 표현으로 굳어진 관용구다.","grammarQuiz":[{"sentence":"The king decided to _____ the loyal soldier _____ his past mistakes in battle.","ko":"왕은 그 충성스러운 병사의 과거 전투 실수를 용서하기로 결정했다.","answer":["pardon","for"],"hint":"타동사 + 전치사 for"},{"sentence":"I beg your _____, but could you _____ that question one more time?","ko":"죄송하지만, 그 질문을 한 번 더 말씀해 주시겠어요?","answer":["pardon","repeat"],"hint":"정중한 되묻기 관용 표현"}]},
    {"id":"w04916","w":"plot","pos":["n","v"],"ph":"/plɒt/","cefr":"B1","kr":["줄거리","음모","구획"],"ex":[{"en":"The plot of the novel was very exciting.","ko":"소설의 줄거리는 매우 흥미진진했다."}],"mnemonic":{"soundHint":"'플롯' → 소설의 '플롯(줄거리)' 외래어","story":"이 드라마의 '플롯'은 반전이 많다. 등장인물들이 '플롯'을 꾸민다. 줄거리와 음모, 둘 다 plot.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"storyline","ko":"줄거리","reason":"직접 동의어"},{"w":"conspiracy","ko":"음모","reason":"plot의 두 번째 의미 동의어"},{"w":"twist","ko":"반전","reason":"plot twist 콜로 - 자주 결합"}],"collocBest":[{"en":"plot twist","ko":"반전"},{"en":"plot against","ko":"~에 맞서 음모를 꾸미다"}]},"nuance":{"koSimple":"이야기의 흐름 또는 몰래 꾸민 계략.","whenToUse":"소설 줄거리·음모 이야기할 때."},"krDetail":[{"ko":"줄거리","explain":"이야기의 큰 흐름과 뼈대"},{"ko":"음모","explain":"몰래 꾸미는 나쁜 꾀"},{"ko":"구획","explain":"땅을 나눠 놓은 조각"}],"usageExamples":[{"en":"The novel's plot surprised everyone with a huge twist.","ko":"그 소설의 줄거리는 큰 반전으로 모두를 놀라게 했다."},{"en":"They plotted against the king in secret meetings.","ko":"그들은 비밀 회의에서 왕에 맞서 음모를 꾸몄다."}],"grammarNote":"plot은 동사로 쓰일 때 'plot against + 대상' 구조로 '~에 맞서 음모를 꾸미다'라는 뜻이 된다. 학생들은 이 전치사 against를 종종 to로 잘못 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The group _____ against the leader _____ was ruling unfairly.","ko":"그 무리는 불공정하게 통치하고 있던 지도자에 맞서 음모를 꾸몄다.","answer":["plotted","who"],"hint":"과거동사 + 관계대명사"}]},
    {"id":"w04859","w":"phrase","pos":["n","v"],"ph":"/freɪz/","cefr":"B1","kr":["구절","표현","어구"],"ex":[{"en":"Learn useful phrases for daily conversation.","ko":"일상 대화에 유용한 표현을 배우세요."}],"mnemonic":{"soundHint":"프레이즈","story":"'캐치프레이즈(catchphrase 광고 문구)' = 표현, 구절","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expression","ko":"표현","reason":"동의어 - 핵심 짝"},{"w":"idiom","ko":"관용구","reason":"동의어 - 고정 표현"},{"w":"sentence","ko":"문장","reason":"시나리오 - 구절이 모여 문장"}],"collocBest":[]},"nuance":{"koSimple":"짧은 말 표현·구절.","whenToUse":"관용 표현·짧은 어구 말할 때."},"krDetail":[{"ko":"구절","explain":"글이나 말에서 몇 마디로 된 한 대목"},{"ko":"표현","explain":"말이나 글로 나타내는 방식"},{"ko":"어구","explain":"낱말들이 모여 이룬 짧은 말"}],"usageExamples":[{"en":"The teacher explained a difficult phrase from the poem to help the students.","ko":"선생님은 학생들을 돕기 위해 시에서 어려운 구절을 설명해 주셨다."},{"en":"A single saying may sound clever, but a well-chosen phrase can express deep feelings in just a few words.","ko":"하나의 격언은 재치 있게 들릴 수 있지만, 잘 고른 어구는 몇 마디만으로 깊은 감정을 표현할 수 있다."}],"grammarNote":"phrase는 명사(구, 어구)와 동사(표현하다)로 모두 쓰인다. 문법 용어로는 clause(절)와 구별되는 개념으로 subject + verb 구성이 없는 단어 묶음을 뜻한다. 학생들은 phrasal verb(구동사)에서 phrase가 파생된 형용사임을 기억하면 좋다. 결합 동사로 use/coin/repeat a phrase가 흔하다.","grammarQuiz":[{"sentence":"The teacher asked us _____ underline every difficult _____ we found in the reading passage.","ko":"선생님은 우리에게 읽기 지문에서 발견한 모든 어려운 구절에 밑줄을 그으라고 요청하셨다.","answer":["to","phrase"],"hint":"ask + to부정사 + 명사"},{"sentence":"You should carefully _____ your question _____ that the interviewer clearly understands your meaning.","ko":"면접관이 당신의 뜻을 분명히 이해할 수 있도록 질문을 신중하게 표현해야 한다.","answer":["phrase","so"],"hint":"동사 + so ~ that 접속사"}]},
    {"id":"w05161","w":"punch","pos":["v","n"],"ph":"/pʌntʃ/","cefr":"B1","kr":["주먹으로 치다","구멍을 뚫다"],"ex":[{"en":"He punched a hole in the paper.","ko":"그는 종이에 구멍을 뚫었다."}],"mnemonic":{"soundHint":"펀치","story":"권투에서 펀치를 날려 상대를 친다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hit","ko":"치다","reason":"동의어 관계"},{"w":"strike","ko":"타격하다","reason":"동의어 관계"},{"w":"hole","ko":"구멍","reason":"punch a hole 콜로케이션"}],"collocBest":[{"en":"punch a hole","ko":"구멍을 뚫다"},{"en":"throw a punch","ko":"주먹을 날리다"}]},"nuance":{"koSimple":"주먹으로 강하게 치다.","whenToUse":"권투·구멍 뚫기 이야기할 때."},"krDetail":[{"ko":"주먹으로 치다","explain":"주먹을 쥐고 세게 때리다"},{"ko":"구멍을 뚫다","explain":"종이 등에 작은 구멍을 내다"}],"usageExamples":[{"en":"The boxer punched his opponent very hard.","ko":"그 권투 선수는 상대를 매우 세게 주먹으로 쳤다."},{"en":"She punched a hole in the paper for the ring binder.","ko":"그녀는 링 바인더용으로 종이에 구멍을 뚫었다."}],"grammarNote":"'punch'는 명사와 동사 둘 다 사용된다. 'throw a punch(주먹을 날리다)'와 'punch a hole(구멍을 뚫다)'은 각각 다른 의미의 관용 표현이다.","grammarQuiz":[{"sentence":"The angry man tried _____ _____ _____ _____ the wall.","ko":"그 화난 남자는 벽에 주먹을 날리려고 했다.","answer":["to","throw","a","punch"],"hint":"부정사 + 동사 + 관사 + 명사"},{"sentence":"Please _____ _____ _____ in these papers for me.","ko":"이 종이들에 구멍을 뚫어 주세요.","answer":["punch","holes"],"hint":"동사 + 복수 명사"}]},

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function renderHeader(){
  document.getElementById("xpVal").textContent = state.xp;
  document.getElementById("streakVal").textContent = state.streak;

  // dots
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  const total = DATA.chapter.totalCount;
  for(let i=0;i<total;i++){
    const d = document.createElement("div");
    d.className = "dot";
    if(state.phase === "study"){
      if(i < state.cardIdx) d.classList.add("done");
      else if(i === state.cardIdx) d.classList.add("current");
    } else if(state.phase === "quiz" || state.phase === "result"){
      d.classList.add("done");
    }
    dots.appendChild(d);
  }
  // pbar
  let pct = 0;
  if(state.phase === "study") pct = (state.cardIdx / total) * 60;
  else if(state.phase === "quiz") pct = 60 + (state.quizIdx / 15) * 35;
  else if(state.phase === "result") pct = 100;
  document.getElementById("pbarFill").style.width = pct + "%";

  // sfx
  document.getElementById("sfxBtn").textContent = state.sfxOn ? "🔊" : "🔇";
  document.getElementById("sfxBtn").classList.toggle("on", state.sfxOn);
  document.getElementById("cbBtn").classList.toggle("on", state.cbMode);
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{ pool.push({ word:w, mode: modeOrder[i] }); });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}

  if(DATA.reviewTest && Array.isArray(DATA.advPool)) return shuffle([...DATA.advPool]);
  return [];
}

  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    const sentHTML = tokens.map((t, i) => {

      if(bIdx >= 0){

    }

}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

function showHighGradeCelebration(msg){
