<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Review Test Lv22-24</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  /* 첫글자 프리필 인풋 — 미리 채워진 첫 글자를 시각적으로 강조 */
  .prefill-input{caret-color:#fef3c7;font-family:'Courier New',ui-monospace,monospace;letter-spacing:.05em;font-weight:700;}
  .prefill-hint{color:#c4b5fd;font-size:.82rem;font-weight:500;margin-left:6px;letter-spacing:0;}
  /* ---------- 낱말박스 (자동완성 방어) ---------- */
  .word-answer{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin:6px 0;}
  .word-answer.inline{display:inline-flex;gap:8px;vertical-align:middle;margin:0 4px;}
  .word-group{
    display:inline-flex;align-items:center;gap:0;
    background:rgba(11,18,32,.7);border:1.5px solid #334155;border-radius:8px;
    padding:0;transition:all .15s;overflow:hidden;flex-shrink:0;
  }
  .word-group:focus-within{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(168,139,250,.22);}
  .word-group.correct{border-color:var(--grade);background:rgba(16,185,129,.10);}
  .word-group.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);}
  /* 폰트: body 상속 sans-serif (이전 .input-box input과 동일한 스타일) */
  .first-letter{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;padding:0 8px;height:44px;line-height:44px;
    background:linear-gradient(180deg,#3b2966 0%,#2a1e4d 100%);
    color:#fef3c7;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    border-right:1px solid #8b5cf6;user-select:none;
  }
  .rest-input{
    border:0;background:transparent;color:var(--text);outline:none;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    padding:0 10px;height:44px;line-height:44px;width:120px;min-width:90px;
    text-transform:lowercase;
  }
  .rest-input::placeholder{color:#475569;font-weight:400;}
  .word-group.correct .rest-input{color:#a7f3d0;}
  .word-group.wrong .rest-input{color:#fca5a5;}
  .cloze-sentence .word-answer{display:inline-flex;flex-wrap:wrap;gap:6px 8px;margin:0 4px;vertical-align:middle;}
  .cloze-sentence .word-group{border-radius:6px;}
  .cloze-sentence .first-letter{height:38px;line-height:38px;font-size:1.05rem;min-width:22px;padding:0 7px;}
  .cloze-sentence .rest-input{height:38px;line-height:38px;font-size:1.05rem;width:100px;min-width:70px;padding:0 9px;}
  /* .input-box input 스타일이 .rest-input을 override 하는 문제 해결 */
  .input-box .word-answer input.rest-input{
    background:transparent;border:0;padding:0 10px;
    min-height:44px;height:44px;line-height:44px;text-align:left;
    font-family:inherit;
    font-size:1.15rem;font-weight:600;letter-spacing:.5px;
    text-transform:lowercase;
    width:120px;min-width:90px;box-shadow:none;
  }
  .input-box .word-answer input.rest-input:focus{border:0;box-shadow:none;}
  /* single-letter 그룹 */
  .word-group.single-letter{background:rgba(11,18,32,.5);}
  .word-group.single-letter input.rest-input{width:80px;min-width:60px;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}
  .buddy-item .why{font-size:.86rem;color:var(--back-muted);opacity:1;display:block;width:100%;margin-top:3px;font-style:italic;}
  .ex-line{font-size:1.03rem;line-height:1.55;}
  .ex-line .en{color:#f8fafc;font-style:italic;font-weight:500;}
  .ex-line .ko{color:var(--back-muted-strong);font-size:.94rem;display:block;margin-top:4px;font-weight:500;}
  /* 콜로케이션·예문 재생 버튼 */
  .speak-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;
    padding:0;margin-right:8px;
    border:1px solid rgba(59,130,246,.35);
    background:rgba(59,130,246,.10);
    color:var(--info);
    font-size:.78rem;line-height:1;
    border-radius:8px;cursor:pointer;
    transition:var(--transition);
  }
  .speak-btn:hover{
    background:rgba(59,130,246,.22);
    border-color:rgba(59,130,246,.55);
    transform:translateY(-1px);
    box-shadow:0 4px 12px rgba(59,130,246,.20);
  }
  .speak-btn:active{transform:translateY(0);}
  .col-item .en, .ex-line .en{flex:1 1 auto;min-width:0;}
  .ex-line{display:flex;flex-wrap:wrap;align-items:baseline;}

  /* Grade buttons */
  .grade-row{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
    margin-top:14px;
  }
  .grade-btn{
    padding:15px 6px;border-radius:var(--radius-md);
    font-weight:700;font-size:.92rem;
    min-height:56px;
    border:1.5px solid transparent;
    transition:all var(--transition);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .grade-btn .ic{font-size:20px;line-height:1;}
  .grade-btn.prev{background:rgba(59,130,246,.14);color:#93c5fd;border-color:rgba(59,130,246,.35);}
  .grade-btn.home{background:rgba(245,158,11,.12);color:var(--accent-light);border-color:rgba(245,158,11,.30);}
  .grade-btn.next{background:rgba(16,185,129,.16);color:#6ee7b7;border-color:rgba(16,185,129,.40);}
  .grade-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .grade-btn.prev:hover{box-shadow:0 6px 16px rgba(59,130,246,.25);}
  .grade-btn.home:hover{box-shadow:0 6px 16px rgba(245,158,11,.20);}
  .grade-btn.next:hover{box-shadow:0 6px 16px rgba(16,185,129,.30);}
  .grade-btn:active{transform:translateY(0) scale(.97);}
  .grade-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6);}
  .grade-btn:disabled:hover{transform:none;box-shadow:none;filter:grayscale(.6);}

  .flip-hint{
    text-align:center;color:var(--text-on-dark-muted);
    font-size:.72rem;margin-top:10px;opacity:.6;letter-spacing:.02em;
  }

  /* ---------- QUIZ ---------- */
  .quiz-stage{padding:12px 2px;flex:1;display:flex;flex-direction:column;}
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .quiz-num{
    background:var(--bg-card);padding:7px 14px;border-radius:100px;
    font-size:.82rem;font-weight:600;
    border:1px solid rgba(148,163,184,.15);
    color:var(--text-on-dark-muted);
  }
  .quiz-num b{color:var(--grade);font-weight:700;}
  .quiz-mode{
    background:rgba(245,158,11,.12);color:var(--accent-light);
    padding:6px 12px;border-radius:100px;
    font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.22);
  }
  .quiz-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:24px 20px;
    box-shadow:var(--shadow-lg);
    min-height:320px;display:flex;flex-direction:column;
  }
  .quiz-prompt{
    text-align:center;margin-bottom:20px;
  }
  .quiz-prompt .label{
    font-size:.68rem;color:var(--text-on-dark-muted);
    text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:10px;
  }
  .quiz-prompt .qword{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.2rem;font-weight:800;color:var(--text-on-dark);
    line-height:1.15;word-break:break-word;letter-spacing:-1px;
    text-shadow:0 0 24px rgba(16,185,129,.20);
  }
  .quiz-prompt .qkr{font-size:1.5rem;font-weight:700;color:var(--accent-light);line-height:1.3;}
  .quiz-prompt .qph{color:var(--text-on-dark-muted);font-size:.88rem;margin-top:6px;font-style:italic;}
  .quiz-prompt .lis-btn{
    margin:10px auto 0;display:flex;
    background:linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
    color:#ffffff;font-weight:700;font-size:.95rem;
    padding:14px 24px;border-radius:var(--radius-md);align-items:center;gap:8px;
    box-shadow:0 6px 20px rgba(59,130,246,.35), inset 0 1px 0 rgba(255,255,255,.15);
    min-height:48px;transition:all var(--transition);
  }
  .quiz-prompt .lis-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(59,130,246,.42);}
  .quiz-prompt .lis-btn:active{transform:translateY(0) scale(.97);}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.12);
    border-radius:var(--radius-md);padding:14px 16px;
    text-align:left;font-size:.98rem;font-weight:600;color:var(--text-on-dark);
    transition:all var(--transition);
    display:flex;align-items:center;gap:12px;
    min-height:52px;line-height:1.3;
  }
  .choice:hover{background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.22);transform:translateY(-1px);}
  .choice .idx{
    flex-shrink:0;width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(148,163,184,.14);color:var(--text-on-dark-muted);
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;
    transition:all var(--transition);
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{background:rgba(16,185,129,.16);border-color:var(--grade);color:#a7f3d0;box-shadow:0 4px 16px rgba(16,185,129,.20);}
  .choice.correct .idx{background:var(--grade);color:#0f172a;}
  .choice.wrong{background:rgba(239,68,68,.14);border-color:var(--danger);color:#fca5a5;}
  .choice.wrong .idx{background:var(--danger);color:#fff;}
  .choice.dimmed{opacity:.4;}
  body.cb-mode .choice.correct::after{content:"✓";margin-left:auto;font-size:22px;font-weight:900;}
  body.cb-mode .choice.wrong::after{content:"✕";margin-left:auto;font-size:22px;font-weight:900;}

  .input-box{
    display:flex;flex-direction:column;gap:12px;margin-top:6px;
  }
  .input-box input{
    background:var(--bg-card-2);
    border:1.5px solid rgba(148,163,184,.15);
    border-radius:var(--radius-md);padding:16px;
    color:var(--text-on-dark);font-size:1.15rem;font-weight:600;
    text-align:center;letter-spacing:.5px;
    min-height:52px;outline:none;
    transition:all var(--transition);
  }
  .input-box input:focus{border-color:var(--grade);box-shadow:0 0 0 4px rgba(16,185,129,.15);}
  .input-box input.correct{border-color:var(--grade);background:rgba(16,185,129,.10);color:#a7f3d0;}
  .input-box input.wrong{border-color:var(--danger);background:rgba(239,68,68,.10);color:#fca5a5;}
  .submit-btn{
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1rem;
    padding:15px;border-radius:var(--radius-md);min-height:52px;
    box-shadow:0 6px 20px rgba(16,185,129,.30), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(16,185,129,.40);}
  .submit-btn:active{transform:translateY(0) scale(.98);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

  .feedback{
    text-align:center;margin-top:16px;
    min-height:24px;font-weight:700;font-size:.92rem;
    letter-spacing:.02em;
  }
  .feedback.ok{color:#6ee7b7;}
  .feedback.bad{color:#fca5a5;}

  /* ---------- RESULT ---------- */
  .result{text-align:center;padding:20px 4px;}
  .result h2{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2rem;margin:10px 0 6px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--accent) 0%, var(--grade) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .result .score-big{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:4rem;font-weight:900;line-height:1;
    margin:20px 0 6px;color:var(--grade);letter-spacing:-2px;
    text-shadow:0 0 40px var(--grade-glow-strong);
  }
  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}
  .result .score-time{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:10px;padding:8px 16px;border-radius:var(--radius-lg);
    background:rgba(15,23,42,.55);border:1px solid rgba(148,163,184,.20);
    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;
    animation:grandPop .8s cubic-bezier(.2,.7,.1,1.4) both, grandGlow 2s ease-in-out infinite alternate;
  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);
    pointer-events:none;
  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

    {"id":"w05115","w":"properly","pos":["adv"],"ph":"/ˈprɒpəli/","cefr":"B1","kr":["제대로","올바르게"],"ex":[{"en":"Make sure the door is properly closed.","ko":"문이 제대로 닫혀 있는지 확인해라."}],"mnemonic":{"soundHint":"프로펄리 → 'proper + ly(부사화)'","story":"적절한(proper) + 방식으로(ly) → 제대로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"correctly","ko":"올바르게","reason":"동의어 관계"},{"w":"improperly","ko":"부적절하게","reason":"반의어 관계"},{"w":"function","ko":"기능하다","reason":"function properly 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"규칙대로 제대로 하게.","whenToUse":"작동·행동이 바르다 말할 때."},"krDetail":[{"ko":"제대로","explain":"본래의 모습이나 방법 그대로"},{"ko":"올바르게","explain":"잘못됨이 없이 바르게"}],"usageExamples":[{"en":"The machine doesn't function properly today.","ko":"그 기계는 오늘 제대로 작동하지 않는다."},{"en":"Children should learn to behave properly.","ko":"아이들은 올바르게 행동하는 법을 배워야 한다."}],"grammarNote":"'properly'는 부사이므로 동사를 꾸며 준다. 위치는 보통 동사 뒤에 온다. 형용사 'proper'의 부사형이다.","grammarQuiz":[{"sentence":"The heater is not _____ _____ this winter.","ko":"히터가 이번 겨울에 제대로 작동하지 않고 있다.","answer":["functioning","properly"],"hint":"현재분사 + 부사"},{"sentence":"You should learn _____ _____ _____ in public places.","ko":"공공장소에서 올바르게 행동하는 것을 배워야 한다.","answer":["to","behave","properly"],"hint":"부정사 + 동사 + 부사"}]},
    {"id":"w04863","w":"physics","pos":["n"],"ph":"/ˈfɪzɪks/","cefr":"B1","kr":["물리학","물리"],"ex":[{"en":"She enjoys studying physics at school.","ko":"그녀는 학교에서 물리학 공부를 즐긴다."}],"mnemonic":{"soundHint":"피직스","story":"'physical(물질의)'을 다루는 학문 = 물리학","hintConfidence":2},"pairs":{"buddyWords":[{"w":"chemistry","ko":"화학","reason":"시나리오 - 이과 짝 과목"},{"w":"gravity","ko":"중력","reason":"시나리오 - 물리 주요 개념"},{"w":"experiment","ko":"실험","reason":"시나리오 - 물리 실험"}],"collocBest":[]},"nuance":{"koSimple":"물체와 힘을 다루는 학문.","whenToUse":"학교 과목·과학 분야 말할 때."},"krDetail":[{"ko":"물리학","explain":"자연의 힘과 움직임을 다루는 학문"},{"ko":"물리","explain":"자연 현상의 이치를 살피는 분야"}],"usageExamples":[{"en":"She wants to study physics at university to understand how the world truly works.","ko":"그녀는 세상이 실제로 어떻게 작동하는지 이해하기 위해 대학에서 물리학을 공부하고 싶어 한다."},{"en":"Chemistry explores the elements around us, but physics reveals the deep laws that shape the universe itself.","ko":"화학은 우리 주변의 원소를 탐구하지만, 물리학은 우주 자체를 형성하는 깊은 법칙을 밝혀낸다."}],"grammarNote":"physics는 -s로 끝나지만 학문명으로 단수 취급한다(Physics is my favorite subject). 학생들은 mathematics/economics/politics 등 -ics 학문명이 모두 단수 취급되는 규칙을 함께 기억해야 한다. laws of physics(물리 법칙), quantum physics(양자물리학), applied physics(응용물리학)처럼 복합어에서 자주 등장한다.","grammarQuiz":[{"sentence":"_____ is my favorite subject, but it _____ often considered one of the most difficult classes.","ko":"물리학은 제가 가장 좋아하는 과목이지만, 종종 가장 어려운 수업 중 하나로 여겨진다.","answer":["Physics","is"],"hint":"학문 주어 + 단수 be 동사"},{"sentence":"The laws _____ physics _____ every object in the universe, from small atoms to massive stars.","ko":"물리 법칙은 작은 원자에서 거대한 별에 이르기까지 우주의 모든 물체를 지배한다.","answer":["of","govern"],"hint":"전치사 of + 복수 동사"}]},
    {"id":"w04860","w":"physical","pos":["adj"],"ph":"/ˈfɪzɪkəl/","cefr":"B1","kr":["신체적인","물리적인"],"ex":[{"en":"Regular physical exercise keeps you healthy.","ko":"규칙적인 신체 운동은 건강을 유지시켜 준다."}],"mnemonic":{"soundHint":"피지컬","story":"예능 '피지컬 100'의 피지컬 = 신체적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bodily","ko":"신체의","reason":"동의어 - 신체적"},{"w":"mental","ko":"정신의","reason":"반의어 - 신체 vs 정신"},{"w":"exercise","ko":"운동","reason":"시나리오 - 신체 활동"}],"collocBest":[]},"nuance":{"koSimple":"몸으로 느끼는·물질적인.","whenToUse":"몸·물질적 특성을 말할 때."},"krDetail":[{"ko":"신체적인","explain":"몸과 관련된"},{"ko":"물리적인","explain":"눈에 보이는 물건이나 힘에 관한"}],"usageExamples":[{"en":"Regular physical exercise helps students stay healthy and focus better in class.","ko":"규칙적인 신체 운동은 학생들이 건강을 유지하고 수업에 더 잘 집중하도록 돕는다."},{"en":"Mental stress affects the mind alone, but physical stress can harm both the body and daily performance.","ko":"정신적 스트레스는 마음에만 영향을 미치지만, 신체적 스트레스는 몸과 일상 수행 능력 모두에 해를 끼칠 수 있다."}],"grammarNote":"physical은 형용사로 '신체적인, 물리적인'의 두 축이 있다. 학생들은 mental(정신적인)과 대비되는 신체 의미, chemical(화학적인)과 대비되는 물리 의미를 문맥에서 구분해야 한다. physical education(체육), physical exam(신체검사)처럼 복합명사에서 자주 등장하며, 부사형 physically와 명사형 physicality도 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"Regular _____ activity is important _____ maintaining good health throughout your entire life.","ko":"규칙적인 신체 활동은 평생 좋은 건강을 유지하는 데 중요하다.","answer":["physical","for"],"hint":"형용사 + 전치사 for"},{"sentence":"The scientist explained the _____ laws _____ govern how heat moves through different materials.","ko":"그 과학자는 열이 서로 다른 물질을 통해 이동하는 방식을 지배하는 물리 법칙을 설명했다.","answer":["physical","that"],"hint":"형용사 + 관계대명사 that"}]},
    {"id":"w04993","w":"praise","pos":["n","v"],"ph":"/preɪz/","cefr":"B1","kr":["칭찬","찬사"],"ex":[{"en":"The teacher praised the student's effort.","ko":"선생님은 학생의 노력을 칭찬했다."}],"mnemonic":{"soundHint":"프레이즈","story":"'Praise the Lord(주님을 찬양하라)' 교회 표현 = 칭찬, 찬사","hintConfidence":2},"pairs":{"buddyWords":[{"w":"compliment","ko":"칭찬","reason":"직접 동의어"},{"w":"criticize","ko":"비판하다","reason":"직접 반의어"},{"w":"high","ko":"높은","reason":"high praise 콜로"}],"collocBest":[]},"nuance":{"koSimple":"잘했다고 치켜세워 주다.","whenToUse":"학생·성과·노력 인정할 때."},"krDetail":[{"ko":"칭찬","explain":"잘한 일을 좋게 말해줌"},{"ko":"찬사","explain":"높이 기려 하는 좋은 말"}],"usageExamples":[{"en":"The teacher praised the student for his hard work.","ko":"그 선생님은 그 학생의 노력을 칭찬했다."},{"en":"Her performance received high praise from critics.","ko":"그녀의 공연은 평론가들로부터 높은 칭찬을 받았다."}],"grammarNote":"praise는 동사로 쓸 때 'praise A for B' 구조로 'A를 B 때문에 칭찬하다'라는 뜻이다. 명사로 쓸 때는 불가산이며 'high/great praise'로 강조한다.","grammarQuiz":[{"sentence":"The coach _____ the team _____ their hard work during practice.","ko":"그 코치는 연습 동안 팀의 노력을 그들의 노력에 대해 칭찬했다.","answer":["praised","for"],"hint":"과거동사 + 전치사"}]},
    {"id":"w04771","w":"pattern","pos":["n","v"],"ph":"/ˈpætərn/","cefr":"B1","kr":["패턴","무늬","양식"],"ex":[{"en":"The dress has a beautiful floral pattern.","ko":"그 드레스에는 아름다운 꽃무늬가 있다."}],"mnemonic":{"soundHint":"패턴","story":"외래어 '패턴'은 반복되는 무늬나 양식.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"design","ko":"디자인","reason":"동의어 - 무늬"},{"w":"behavior","ko":"행동","reason":"콜로케이션 - behavior pattern"},{"w":"repeat","ko":"반복하다","reason":"시나리오 - 패턴은 반복됨"}],"collocBest":[{"en":"behavior pattern","ko":"행동 양식"},{"en":"repeat a pattern","ko":"패턴을 반복하다"}]},"nuance":{"koSimple":"반복되는 무늬·규칙.","whenToUse":"옷 무늬·행동 양식을 말할 때."},"krDetail":[{"ko":"패턴","explain":"되풀이되어 나타나는 일정한 흐름"},{"ko":"무늬","explain":"천이나 물건에 그려진 꾸밈 그림"},{"ko":"양식","explain":"일정한 방식이나 틀"}],"usageExamples":[{"en":"Scientists study weather patterns to predict future climate changes more accurately.","ko":"과학자들은 미래의 기후 변화를 더 정확하게 예측하기 위해 날씨 패턴을 연구한다."},{"en":"A single design may look random, but a repeating pattern reveals order and hidden intention.","ko":"하나의 디자인은 무작위로 보일 수 있지만, 반복되는 패턴은 질서와 숨겨진 의도를 드러낸다."}],"grammarNote":"pattern은 명사가 주 용법이지만 동사로도 쓰여 'pattern A on/after B'가 'B를 본떠 A를 만들다'는 뜻이 된다. 학생들은 동사 용법을 놓치기 쉽다. behavior pattern, sleep pattern, weather pattern처럼 앞에 명사 수식어가 결합해 복합명사를 이룬다. 결합 동사로 follow/break/change/repeat a pattern이 흔하다.","grammarQuiz":[{"sentence":"Scientists have discovered a strange _____ _____ the behavior of migrating birds this year.","ko":"과학자들은 올해 이주하는 새들의 행동에서 이상한 패턴을 발견했다.","answer":["pattern","in"],"hint":"명사 + 전치사 in"},{"sentence":"The new building _____ _____ modeled on an old European cathedral from the fifteenth century.","ko":"그 새 건물은 15세기의 오래된 유럽 대성당을 본떠 설계되었다.","answer":["was","patterned"],"hint":"be 동사 + 과거분사 patterned"}]},
    {"id":"w04741","w":"partly","pos":["adv"],"ph":"/ˈpɑːrtli/","cefr":"B1","kr":["부분적으로","어느 정도"],"ex":[{"en":"The success was partly due to luck.","ko":"그 성공은 부분적으로 운 덕분이었다."}],"mnemonic":{"soundHint":"파틀리","story":"'part(부분)' + ly = 부분적으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"partially","ko":"부분적으로","reason":"동의어 - 완전 동의"},{"w":"somewhat","ko":"다소","reason":"동의어 - 어느 정도"},{"w":"fully","ko":"완전히","reason":"반의어 - 부분 vs 전체"}],"collocBest":[]},"nuance":{"koSimple":"전부가 아니고 어느 정도만.","whenToUse":"원인이나 상태가 부분적일 때."},"krDetail":[{"ko":"부분적으로","explain":"전체가 아니라 어느 한 부분에 걸쳐"},{"ko":"어느 정도","explain":"전부는 아니고 얼마쯤"}],"usageExamples":[{"en":"Rain partly damaged the outdoor concert stage before the show could start.","ko":"비가 공연이 시작되기 전에 야외 콘서트 무대를 부분적으로 손상시켰다."},{"en":"The project was not fully completed on time; it was partly because of unexpected weather issues.","ko":"그 프로젝트는 제시간에 완전히 끝나지 않았는데, 이는 예상치 못한 날씨 문제 때문이기도 했다."}],"grammarNote":"partly는 부사로 '전체는 아니고 일부만'의 뜻이며, 'partly because ~'는 원인 중 하나를 제시할 때 자주 쓰인다. 학생들은 'partially'와 혼용하는데, partly는 원인·이유 설명에, partially는 물리적·양적 부분을 나타내는 데 자주 쓰인다. 완전한 반대는 fully/completely다.","grammarQuiz":[{"sentence":"The accident happened _____ because of the fog and _____ because of the driver's speed.","ko":"그 사고는 부분적으로는 안개 때문이었고 부분적으로는 운전자의 속도 때문이었다.","answer":["partly","partly"],"hint":"이유 병렬 partly ~ partly"},{"sentence":"The old building was _____ destroyed, but it was not _____ ruined by the fire last night.","ko":"그 낡은 건물은 부분적으로 파괴되었지만, 어젯밤 화재로 완전히 무너진 것은 아니었다.","answer":["partly","completely"],"hint":"부사 partly + 반의어"}]},
    {"id":"w04929","w":"poetry","pos":["n"],"ph":"/ˈpəʊɪtri/","cefr":"B1","kr":["시","시문학"],"ex":[{"en":"She studies English poetry in school.","ko":"그녀는 학교에서 영시를 공부한다."}],"mnemonic":{"soundHint":"포에트리","story":"'poet(시인)' + ry = 시인이 짓는 것 = 시, 시문학","hintConfidence":3},"pairs":{"buddyWords":[{"w":"poet","ko":"시인","reason":"poetry를 짓는 사람 - 짝"},{"w":"prose","ko":"산문","reason":"직접 반의어"},{"w":"rhyme","ko":"운율","reason":"poetry의 요소"}],"collocBest":[]},"nuance":{"koSimple":"운율과 감정을 담은 짧은 글.","whenToUse":"문학 장르·감상 얘기할 때."},"krDetail":[{"ko":"시","explain":"마음의 울림을 짧게 다듬어 쓴 글"},{"ko":"시문학","explain":"시로 이루어진 글의 갈래"}],"usageExamples":[{"en":"She writes poetry every morning before school begins.","ko":"그녀는 매일 아침 학교가 시작되기 전에 시를 쓴다."},{"en":"He prefers prose over poetry when reading novels.","ko":"그는 소설을 읽을 때 시보다 산문을 더 좋아한다."}],"grammarNote":"poetry는 불가산명사이므로 앞에 부정관사 a/an을 붙이지 않고 복수형도 없다. 'a poetry'라고 잘못 쓰는 학생이 많다. 한 편의 시는 'a poem'이다.","grammarQuiz":[{"sentence":"Reading _____ helps me relax _____ a long, tiring day.","ko":"시를 읽는 것은 길고 피곤한 하루 뒤에 나를 편안하게 한다.","answer":["poetry","after"],"hint":"명사 + 전치사"}]},
    {"id":"w04733","w":"participant","pos":["n"],"ph":"/pɑːrˈtɪsɪpənt/","cefr":"B1","kr":["참가자","참여자"],"ex":[{"en":"All participants must register online.","ko":"모든 참가자는 온라인으로 등록해야 한다."}],"mnemonic":{"soundHint":"파티시펀트","story":"'파티(party)에 참여(pant)하는 사람' = 참가자","hintConfidence":2},"pairs":{"buddyWords":[{"w":"attendee","ko":"참석자","reason":"동의어 - 행사 참여자"},{"w":"contestant","ko":"참가자","reason":"동의어 - 대회 참가자"},{"w":"volunteer","ko":"자원봉사자","reason":"시나리오 - 자발적 참가"}],"collocBest":[]},"nuance":{"koSimple":"행사·대회에 참여한 사람.","whenToUse":"대회·연구·행사 참가자를 지칭할 때."},"krDetail":[{"ko":"참가자","explain":"어떤 일에 함께 나서서 활동하는 사람"},{"ko":"참여자","explain":"어떤 자리에 끼어들어 함께하는 사람"}],"usageExamples":[{"en":"Every participant received a certificate after completing the online course.","ko":"모든 참가자가 온라인 강좌를 마친 후 수료증을 받았다."},{"en":"A researcher observes, but a participant actively takes part in the experiment itself.","ko":"연구자는 관찰하지만, 참가자는 실험 자체에 능동적으로 참여한다."}],"grammarNote":"participant는 동사 participate에서 파생된 -ant 형태의 명사로, '~하는 사람'을 뜻한다. 학생들은 participant/participate/participation을 자주 혼동하는데, 사람은 participant, 행위는 participate/participation임을 명심해야 한다. 관사 a/the/every 뒤에 오는지 확인하자.","grammarQuiz":[{"sentence":"Every _____ in the study _____ asked to complete a short survey before starting.","ko":"연구의 모든 참가자는 시작 전에 짧은 설문지를 작성하도록 요청받았다.","answer":["participant","was"],"hint":"명사형 + 단수 수동태"},{"sentence":"The number _____ participants _____ increased since the program opened to teenagers.","ko":"참가자 수는 프로그램이 청소년에게 개방된 이후로 증가해 왔다.","answer":["of","has"],"hint":"전치사 of + 현재완료 has"}]},
    {"id":"w04945","w":"poll","pos":["n","v"],"ph":"/pəʊl/","cefr":"B1","kr":["여론 조사","투표"],"ex":[{"en":"The poll shows he leads by ten points.","ko":"여론 조사에 따르면 그가 10포인트 앞서고 있다."}],"mnemonic":{"soundHint":"폴","story":"'갤럽 폴(Gallup poll)', '엑싯 폴(exit poll 출구조사)' = 여론조사","hintConfidence":3},"pairs":{"buddyWords":[{"w":"survey","ko":"설문조사","reason":"직접 동의어"},{"w":"vote","ko":"투표","reason":"동의어 - 두 번째 의미"},{"w":"opinion","ko":"의견","reason":"opinion poll 콜로"}],"collocBest":[]},"nuance":{"koSimple":"사람들 의견을 묻는 조사·투표.","whenToUse":"선거·여론 파악할 때."},"krDetail":[{"ko":"여론 조사","explain":"사람들 생각을 물어 모으는 일"},{"ko":"투표","explain":"뜻을 종이에 적어 뽑는 일"}],"usageExamples":[{"en":"The poll showed that most voters support the plan.","ko":"여론 조사는 대부분의 유권자가 그 계획을 지지한다는 것을 보여주었다."},{"en":"Recent polls suggest a very close race.","ko":"최근 여론 조사는 매우 접전임을 시사한다."}],"grammarNote":"poll은 발음이 pole과 같지만 뜻이 전혀 다르다. 문맥으로 구별해야 하며, 'conduct/take/hold a poll' 형태로 자주 쓴다는 것을 기억한다.","grammarQuiz":[{"sentence":"The newspaper _____ a nationwide _____ before the election started.","ko":"그 신문은 선거가 시작되기 전에 전국적 여론 조사를 실시했다.","answer":["conducted","poll"],"hint":"과거동사 + 명사"}]},
    {"id":"w04883","w":"pirate","pos":["n","v"],"ph":"/ˈpaɪrət/","cefr":"B1","kr":["해적","불법 복제하다"],"ex":[{"en":"The pirates attacked the merchant ship.","ko":"해적들이 상선을 공격했다."}],"mnemonic":{"soundHint":"파이럿","story":"영화 '캐리비안의 해적(Pirates of the Caribbean)' = 해적","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ship","ko":"배","reason":"pirate ship 콜로"},{"w":"treasure","ko":"보물","reason":"시나리오 - 해적의 보물"},{"w":"rob","ko":"약탈하다","reason":"시나리오 - 해적이 약탈"}],"collocBest":[]},"nuance":{"koSimple":"배로 남을 터는 해적.","whenToUse":"해적 이야기·불법 복제 말할 때."},"krDetail":[{"ko":"해적","explain":"바다에서 남의 배를 습격하는 사람"},{"ko":"불법 복제하다","explain":"허락 없이 남의 것을 몰래 베끼다"}],"usageExamples":[{"en":"The old story tells how a brave pirate found a huge treasure on a lonely island.","ko":"그 옛날 이야기는 용감한 해적이 외로운 섬에서 거대한 보물을 찾은 이야기를 들려준다."},{"en":"A buccaneer often attacked ships, but a modern pirate copies movies and software illegally over the internet.","ko":"옛 해적은 종종 배를 공격했지만, 현대의 해적은 인터넷에서 영화와 소프트웨어를 불법으로 복제한다."}],"grammarNote":"pirate는 명사(해적)와 동사(불법 복제하다) 모두 쓰인다. 동사 용법이 현대에 자주 쓰여서 시험에도 등장한다(pirated software, pirated movies). 학생들은 piracy(해적 행위·불법 복제)라는 명사형도 함께 익혀야 한다. pirate ship(해적선), pirate copy(불법 복제품)처럼 복합어에서도 자주 나온다.","grammarQuiz":[{"sentence":"The company sued several websites _____ _____ its expensive software without permission.","ko":"그 회사는 자사의 값비싼 소프트웨어를 허락 없이 불법 복제한 여러 웹사이트를 고소했다.","answer":["for","pirating"],"hint":"전치사 for + 동명사 pirating"},{"sentence":"In the movie, a brave young _____ _____ the captain to find the hidden treasure island together.","ko":"영화에서, 용감한 젊은 해적이 숨겨진 보물섬을 찾기 위해 선장과 함께했다.","answer":["pirate","joined"],"hint":"명사 + 과거형 joined"}]},
    {"id":"w04813","w":"period","pos":["n"],"ph":"/ˈpɪəriəd/","cefr":"B1","kr":["기간","시기","마침표"],"ex":[{"en":"The period of study lasted three months.","ko":"학습 기간은 세 달 동안 지속되었다."}],"mnemonic":{"soundHint":"피리어드","story":"학교 시간표 '1교시(1st period)', 생리 '피리어드' = 기간","hintConfidence":3},"pairs":{"buddyWords":[{"w":"era","ko":"시대","reason":"동의어 - 긴 기간"},{"w":"duration","ko":"지속 기간","reason":"동의어 - 지속 시간"},{"w":"moment","ko":"순간","reason":"반의 관계 - 기간 vs 순간"}],"collocBest":[]},"nuance":{"koSimple":"정해진 시간의 폭.","whenToUse":"학기·역사 시기 등을 말할 때."},"krDetail":[{"ko":"기간","explain":"일정하게 정해진 시간의 길이"},{"ko":"시기","explain":"어떤 일이 일어난 때"},{"ko":"마침표","explain":"문장이 끝났음을 알리는 부호"}],"usageExamples":[{"en":"The scientist observed the animals over a long period to understand their behavior.","ko":"과학자는 그 동물들의 행동을 이해하기 위해 오랜 기간에 걸쳐 관찰했다."},{"en":"A single moment passes quickly, but a historical period shapes generations of people for centuries.","ko":"한 순간은 빠르게 지나가지만, 역사적 시기는 여러 세기 동안 여러 세대의 사람들을 형성한다."}],"grammarNote":"period는 시간(기간), 마침표, 여성 생리 등 다의어다. 학생들은 'over a period of + 기간'과 'during the ~ period' 결합을 익혀야 한다. period 뒤에 오는 시제는 문맥에 따라 과거·현재완료 모두 가능하다. American English에서는 마침표(.)를 period, British English에서는 full stop으로 부르는 점도 알아두면 좋다.","grammarQuiz":[{"sentence":"The scientists studied the birds _____ a _____ of six months to understand their migration.","ko":"과학자들은 그 새들의 이주를 이해하기 위해 6개월의 기간에 걸쳐 연구했다.","answer":["over","period"],"hint":"전치사 over + 명사"},{"sentence":"During _____ historical _____, many great artists produced their most famous works of art.","ko":"그 역사적 시기 동안 많은 위대한 예술가들이 가장 유명한 작품을 만들어 냈다.","answer":["this","period"],"hint":"지시형용사 + 명사"}]},
    {"id":"w05160","w":"pump","pos":["n","v"],"ph":"/pʌmp/","cefr":"B1","kr":["펌프","주입하다"],"ex":[{"en":"Pump the bicycle tire before the trip.","ko":"여행 전에 자전거 타이어에 공기를 넣어라."}],"mnemonic":{"soundHint":"펌프","story":"펌프로 물을 끌어올린다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inflate","ko":"부풀리다","reason":"동의어 관계"},{"w":"water","ko":"물","reason":"water pump 콜로케이션"},{"w":"push","ko":"밀다","reason":"동의어 관계"}],"collocBest":[{"en":"water pump","ko":"물 펌프"},{"en":"pump up","ko":"충전하다"}]},"nuance":{"koSimple":"밀어 넣는 펌프 기계.","whenToUse":"공기·물·기름 주입 이야기."},"krDetail":[{"ko":"펌프","explain":"물이나 공기를 밀어 올리는 기계"},{"ko":"주입하다","explain":"무엇을 안으로 밀어 넣다"}],"usageExamples":[{"en":"The farmer used a water pump for his field.","ko":"그 농부는 밭을 위해 물 펌프를 사용했다."},{"en":"You need to pump up the bike tires before riding.","ko":"타기 전에 자전거 타이어에 공기를 넣어야 한다."}],"grammarNote":"'pump up'은 '공기를 넣어 부풀리다', 'pump water(물을 퍼내다)'와 같이 쓰인다. 명사와 동사 형태가 같다.","grammarQuiz":[{"sentence":"You should _____ _____ the balloons before the party.","ko":"파티 전에 풍선을 부풀려야 한다.","answer":["pump","up"],"hint":"동사 + 부사"},{"sentence":"The old _____ _____ still works after fifty years.","ko":"그 오래된 물 펌프는 50년 후에도 여전히 작동한다.","answer":["water","pump"],"hint":"명사 + 명사"}]},
    {"id":"w04969","w":"possibility","pos":["n"],"ph":"/ˌpɒsɪˈbɪlɪti/","cefr":"B1","kr":["가능성"],"ex":[{"en":"There is a possibility of rain tomorrow.","ko":"내일 비가 올 가능성이 있다."}],"mnemonic":{"soundHint":"파서빌리티","story":"'possible(가능한)' + ity = 가능성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"chance","ko":"가능성","reason":"직접 동의어"},{"w":"impossibility","ko":"불가능성","reason":"im- 반의어"},{"w":"explore","ko":"탐색하다","reason":"explore possibilities 콜로"}],"collocBest":[]},"nuance":{"koSimple":"일어날 수도 있는 여지.","whenToUse":"미래 결과·선택지 얘기할 때."},"krDetail":[{"ko":"가능성","explain":"어떤 일이 이루어질 수 있는 정도"}],"usageExamples":[{"en":"There is a real possibility of rain this afternoon.","ko":"오늘 오후에 비가 올 실제 가능성이 있다."},{"en":"We should explore all possibilities before deciding.","ko":"결정하기 전에 우리는 모든 가능성을 탐색해야 한다."}],"grammarNote":"possibility 뒤에는 전치사 of + 동명사 또는 that절이 온다. 'possibility to do'는 잘못된 형태이며 'possibility of doing'이 옳다. 학생들이 자주 저지르는 오류이다.","grammarQuiz":[{"sentence":"There is a strong _____ of _____ our target by the deadline.","ko":"마감일까지 우리의 목표를 달성할 강한 가능성이 있다.","answer":["possibility","meeting"],"hint":"명사 + 동명사"}]},
    {"id":"w04861","w":"physically","pos":["adv"],"ph":"/ˈfɪzɪkli/","cefr":"B1","kr":["신체적으로","물리적으로"],"ex":[{"en":"He is physically strong and healthy.","ko":"그는 신체적으로 강하고 건강하다."}],"mnemonic":{"soundHint":"피지컬리","story":"'피지컬(physical)' + ly = 신체적으로","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bodily","ko":"신체적으로","reason":"동의어 - 유사"},{"w":"mentally","ko":"정신적으로","reason":"반의어 - 신체 vs 정신"},{"w":"fit","ko":"건강한","reason":"physically fit 콜로"}],"collocBest":[]},"nuance":{"koSimple":"몸으로·물리적으로.","whenToUse":"체력·물리적 상태 강조할 때."},"krDetail":[{"ko":"신체적으로","explain":"몸과 관련된 면에서"},{"ko":"물리적으로","explain":"실제 물건이나 힘의 관점에서"}],"usageExamples":[{"en":"The runner felt physically exhausted after finishing the difficult marathon race.","ko":"그 주자는 힘든 마라톤 경주를 마친 후 신체적으로 지쳤음을 느꼈다."},{"en":"Being mentally tired is one issue, but being physically weak affects your daily routine much more seriously.","ko":"정신적으로 지친 것도 문제지만, 신체적으로 약한 것은 일상생활에 훨씬 심각한 영향을 준다."}],"grammarNote":"physically는 부사로 형용사·동사를 수식하며, mentally(정신적으로)와 대비된다. 학생들은 physically fit(신체적으로 건강한), physically impossible(물리적으로 불가능한), physically demanding(신체적으로 힘든) 같은 결합 표현을 익혀야 한다. 문두에서 '물리적으로 말하면' 뉘앙스로 놓이면 콤마와 함께 도치되는 문어체 패턴이 나타난다.","grammarQuiz":[{"sentence":"The soldier was _____ strong, but he was also mentally _____ during the difficult mission.","ko":"그 군인은 신체적으로 강인했지만, 어려운 임무 동안 정신적으로도 준비되어 있었다.","answer":["physically","ready"],"hint":"부사 + 형용사 ready"},{"sentence":"It is _____ impossible for anyone _____ jump higher than three meters without special training.","ko":"특별한 훈련 없이 3미터보다 높이 뛰는 것은 물리적으로 누구에게나 불가능하다.","answer":["physically","to"],"hint":"부사 + to부정사"}]},
    {"id":"w05153","w":"psychology","pos":["n"],"ph":"/saɪˈkɒlədʒi/","cefr":"B1","kr":["심리학","심리"],"ex":[{"en":"She studied psychology at university.","ko":"그녀는 대학에서 심리학을 공부했다."}],"mnemonic":{"soundHint":"사이컬로지 → '사이코(psycho, 정신) + 로지(학문)'","story":"정신(psycho)을 다루는 학문 → 심리학","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mind","ko":"마음","reason":"심리학의 연구 대상"},{"w":"behavior","ko":"행동","reason":"심리학의 연구 대상"},{"w":"child","ko":"아동","reason":"child psychology 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"마음을 연구하는 심리학.","whenToUse":"대학 전공·마음 분석 이야기."},"krDetail":[{"ko":"심리학","explain":"사람의 마음과 행동을 살펴보는 학문"},{"ko":"심리","explain":"마음속에서 일어나는 생각과 느낌"}],"usageExamples":[{"en":"She studies psychology at the university.","ko":"그녀는 대학에서 심리학을 공부한다."},{"en":"The book explains the psychology of children.","ko":"그 책은 아이들의 심리를 설명한다."}],"grammarNote":"'psychology'는 '학문'과 '심리' 둘 다 뜻하며, 셀 수 없는 명사이다. 'p'는 묵음으로 발음하지 않는다.","grammarQuiz":[{"sentence":"My sister wants _____ _____ _____ next year.","ko":"내 여동생은 내년에 심리학을 공부하고 싶어 한다.","answer":["to","study","psychology"],"hint":"부정사 + 동사 + 명사"},{"sentence":"_____ _____ helps parents understand their kids.","ko":"아동 심리학은 부모가 자녀를 이해하도록 돕는다.","answer":["Child","psychology"],"hint":"명사 + 명사"}]},
    {"id":"w04763","w":"patience","pos":["n"],"ph":"/ˈpeɪʃəns/","cefr":"B1","kr":["인내","참을성"],"ex":[{"en":"Patience is needed when learning a new skill.","ko":"새로운 기술을 배울 때는 인내가 필요하다."}],"mnemonic":{"soundHint":"페이션스","story":"'patient(환자, 참을성 있는)' + ce = 인내","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tolerance","ko":"관용","reason":"동의어 - 참는 능력"},{"w":"endurance","ko":"인내력","reason":"동의어 - 견뎌내는 힘"},{"w":"impatience","ko":"조급함","reason":"반의어 - 인내 vs 조급"}],"collocBest":[]},"nuance":{"koSimple":"기다림을 참는 마음.","whenToUse":"배움·기다림 필요할 때."},"krDetail":[{"ko":"인내","explain":"괴로움이나 어려움을 참고 견디는 마음"},{"ko":"참을성","explain":"쉽게 화내지 않고 잘 견디는 성질"}],"usageExamples":[{"en":"Teaching young children requires great patience and a warm, understanding heart every day.","ko":"어린이들을 가르치는 일은 매일 큰 인내와 따뜻하고 이해심 있는 마음이 필요하다."},{"en":"Impatience causes many arguments, but patience keeps relationships stable and peaceful for years.","ko":"성급함은 많은 다툼을 낳지만, 인내는 여러 해 동안 관계를 안정되고 평화롭게 지켜준다."}],"grammarNote":"patience는 불가산명사로 관사 없이 쓰이며, have/lose/run out of patience 같은 동사와 결합한다. 학생들은 형용사 patient(참을성 있는)와 명사 patient(환자)의 동철이의어를 헷갈리기 쉽다. 'patience with + 사람/사물'은 '~에 대한 인내'로 자주 나오는 결합이다.","grammarQuiz":[{"sentence":"The kind teacher had great _____ _____ her slow but hardworking young students.","ko":"그 친절한 선생님은 느리지만 열심히 하는 어린 학생들에 대해 큰 인내심을 가지고 있었다.","answer":["patience","with"],"hint":"명사 + 전치사 with"},{"sentence":"After hours of waiting, he finally ran _____ of _____ and left the office angrily.","ko":"몇 시간을 기다린 끝에 그는 마침내 인내심이 바닥나 화를 내며 사무실을 떠났다.","answer":["out","patience"],"hint":"run out of + 명사"}]},
    {"id":"w04932","w":"poison","pos":["n","v"],"ph":"/ˈpɔɪzən/","cefr":"B1","kr":["독","독살하다"],"ex":[{"en":"The plant contains a deadly poison.","ko":"그 식물에는 치명적인 독이 들어 있다."}],"mnemonic":{"soundHint":"'포이즌' → '포이즌 아이비' 영화에 나오는 '독'","story":"'포이즌' 하면 독. 뱀의 독(poison)에 물리면 위험하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"toxin","ko":"독소","reason":"직접 동의어"},{"w":"antidote","ko":"해독제","reason":"poison에 맞서는 것 - 반의 시나리오"},{"w":"snake","ko":"뱀","reason":"poisonous snake - 자주 결합"}],"collocBest":[{"en":"deadly poison","ko":"치명적인 독"},{"en":"poison gas","ko":"독가스"}]},"nuance":{"koSimple":"몸에 해로운 성분, 또는 그걸 먹이다.","whenToUse":"독초·독약·오염 이야기할 때."},"krDetail":[{"ko":"독","explain":"몸을 해치는 나쁜 물질"},{"ko":"독살하다","explain":"독으로 몸을 해쳐 죽이다"}],"usageExamples":[{"en":"The scientist poisoned the rat to test the drug.","ko":"그 과학자는 그 약을 시험하기 위해 쥐를 독살했다."},{"en":"Some mushrooms in the forest contain deadly poison.","ko":"숲속의 어떤 버섯들은 치명적인 독을 함유하고 있다."}],"grammarNote":"poison은 동사로 쓸 때 타동사여서 반드시 목적어가 필요하다. 학생들이 자동사처럼 'poisoned to him'으로 쓰는 실수를 하지만, 옳은 형태는 'poisoned him'이다.","grammarQuiz":[{"sentence":"The villain _____ the king _____ ordering a strong drink.","ko":"그 악당은 강한 술을 주문함으로써 왕을 독살했다.","answer":["poisoned","by"],"hint":"과거동사 + 전치사"}]},
    {"id":"w05158","w":"publish","pos":["v"],"ph":"/ˈpʌblɪʃ/","cefr":"B1","kr":["출판하다","발표하다"],"ex":[{"en":"She hopes to publish a novel this year.","ko":"그녀는 올해 소설을 출판하기를 희망한다."}],"mnemonic":{"soundHint":"퍼블리시 → '퍼블릭(public, 대중)에 내다'","story":"대중(public)에게 내놓다 → 출판·발표","hintConfidence":3},"pairs":{"buddyWords":[{"w":"print","ko":"인쇄하다","reason":"동의어 관계"},{"w":"release","ko":"발표하다","reason":"동의어 관계"},{"w":"book","ko":"책","reason":"publish a book 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"책·논문을 세상에 내다.","whenToUse":"책 출간·연구 발표할 때."},"krDetail":[{"ko":"출판하다","explain":"책이나 잡지를 만들어 세상에 내놓다"},{"ko":"발표하다","explain":"글이나 연구를 여러 사람에게 알리다"}],"usageExamples":[{"en":"The writer published his first novel last year.","ko":"그 작가는 작년에 첫 소설을 출판했다."},{"en":"Scientists publish their research in journals.","ko":"과학자들은 학술지에 자신의 연구를 발표한다."}],"grammarNote":"'publish'는 규칙동사로 과거형은 'published'이다. 수동태 'be published'로 자주 쓰이며 'publisher(출판사)'는 파생어이다.","grammarQuiz":[{"sentence":"The book _____ _____ _____ 2020 by a famous author.","ko":"그 책은 2020년에 유명한 작가에 의해 출판되었다.","answer":["was","published","in"],"hint":"be동사 + 과거분사 + 전치사"},{"sentence":"She hopes _____ _____ her research findings next month.","ko":"그녀는 다음 달에 연구 결과를 발표하기를 바란다.","answer":["to","publish"],"hint":"부정사 + 동사"}]},
    {"id":"w05049","w":"pride","pos":["n"],"ph":"/praɪd/","cefr":"B1","kr":["자부심","자랑"],"ex":[{"en":"She felt great pride in her achievement.","ko":"그녀는 자신의 성취에 큰 자부심을 느꼈다."}],"mnemonic":{"soundHint":"프라이드 → '프라이(fry, 튀김)한 치킨 자랑'","story":"잘 튀긴 프라이드 치킨을 자랑 → 자부심","hintConfidence":2},"pairs":{"buddyWords":[{"w":"honor","ko":"명예","reason":"동의어 관계"},{"w":"shame","ko":"수치심","reason":"반의어 관계"},{"w":"achievement","ko":"성취","reason":"자부심의 원천"}],"collocBest":[]},"nuance":{"koSimple":"자기·집단이 자랑스러운 마음.","whenToUse":"성취·소속에 뿌듯함 표현할 때."},"krDetail":[{"ko":"자부심","explain":"자기 자신에 대해 스스로 대견하게 여기는 마음"},{"ko":"자랑","explain":"잘한 일을 남에게 뽐내어 말함"}],"usageExamples":[{"en":"Parents take pride in their children's success.","ko":"부모는 자녀의 성공에 자부심을 느낀다."},{"en":"She spoke with great pride about her country.","ko":"그녀는 자신의 나라에 대해 큰 자부심을 갖고 말했다."}],"grammarNote":"'take pride in + 명사/동명사'는 '~에 자부심을 갖다'라는 관용 표현이다. 'be proud of'와 비슷하지만 문장 구조가 다르다.","grammarQuiz":[{"sentence":"The teacher _____ great _____ _____ her students' hard work.","ko":"그 선생님은 학생들의 노력에 큰 자부심을 갖는다.","answer":["takes","pride","in"],"hint":"동사 + 명사 + 전치사"},{"sentence":"He felt a sense of _____ when he won the medal.","ko":"그는 메달을 땄을 때 자부심을 느꼈다.","answer":["pride"],"hint":"명사형"}]},
    {"id":"w05046","w":"previously","pos":["adv"],"ph":"/ˈpriːvɪəsli/","cefr":"B1","kr":["이전에","예전에"],"ex":[{"en":"She had previously worked in London.","ko":"그녀는 이전에 런던에서 일했었다."}],"mnemonic":{"soundHint":"프리비어슬리 → '프리(pre) + view(보다) + 리'","story":"미리(pre) 봤던(view) 그때 → 이전에","hintConfidence":2},"pairs":{"buddyWords":[{"w":"formerly","ko":"이전에","reason":"동의어 관계"},{"w":"recently","ko":"최근에","reason":"시간 부사 대비"},{"w":"mention","ko":"언급하다","reason":"previously mentioned 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"지금보다 예전에.","whenToUse":"이전 상태·과거 경력 말할 때."},"krDetail":[{"ko":"이전에","explain":"지금보다 앞선 어떤 때에"},{"ko":"예전에","explain":"지나간 오래된 어떤 때에"}],"usageExamples":[{"en":"He previously worked as a doctor in Seoul.","ko":"그는 이전에 서울에서 의사로 일했다."},{"en":"As previously mentioned, the meeting starts at ten.","ko":"앞서 언급한 대로, 회의는 10시에 시작한다."}],"grammarNote":"'previously'는 부사이므로 동사 앞이나 문장 앞에 온다. 'previous(형용사)'와 형태가 비슷해서 혼동하기 쉽다.","grammarQuiz":[{"sentence":"The building was _____ _____ _____ a hospital before it became a school.","ko":"그 건물은 학교가 되기 전에 이전에 병원으로 알려져 있었다.","answer":["previously","known","as"],"hint":"부사 + 과거분사 + 전치사"},{"sentence":"She _____ lived in Busan _____ moving to Seoul.","ko":"그녀는 서울로 이사하기 전에 이전에 부산에 살았다.","answer":["previously","before"],"hint":"부사 + 접속사"}]},
    {"id":"w04735","w":"participation","pos":["n"],"ph":"/pɑːrˌtɪsɪˈpeɪʃən/","cefr":"B1","kr":["참가","참여"],"ex":[{"en":"Your participation is greatly appreciated.","ko":"귀하의 참여에 깊이 감사드립니다."}],"mnemonic":{"soundHint":"파티시페이션","story":"'participate(참가하다)' + tion = 참가, 참여","hintConfidence":3},"pairs":{"buddyWords":[{"w":"involvement","ko":"관여","reason":"동의어 - 참여 정도"},{"w":"engagement","ko":"참여","reason":"동의어 - 몰입 참여"},{"w":"attendance","ko":"출석","reason":"시나리오 - 참여와 출석"}],"collocBest":[]},"nuance":{"koSimple":"함께 참여하는 행위.","whenToUse":"적극적 참여·참여율을 말할 때."},"krDetail":[{"ko":"참가","explain":"어떤 일이나 모임에 함께 나섬"},{"ko":"참여","explain":"어떤 자리에 끼어들어 함께함"}],"usageExamples":[{"en":"Active participation in class discussions greatly improves students' communication skills.","ko":"수업 토론에 대한 적극적인 참여는 학생들의 의사소통 능력을 크게 향상시킨다."},{"en":"Mere attendance is not enough; genuine participation shapes the true learning experience.","ko":"단순한 출석만으로는 충분하지 않고, 진정한 참여가 실제 학습 경험을 형성한다."}],"grammarNote":"participation은 participate의 명사형으로 불가산명사로 취급되는 경우가 많다. 학생들은 관사 없이 쓰거나 encourage/increase/limit 같은 동사와 결합하는 패턴을 기억해야 한다. 'participation in + 명사' 구조가 핵심이며, 형용사 active/full/wide와 자주 함께 쓰인다.","grammarQuiz":[{"sentence":"The school _____ student _____ in various volunteer activities throughout the year.","ko":"학교는 학생들의 다양한 봉사 활동 참여를 일 년 내내 장려한다.","answer":["encourages","participation"],"hint":"3인칭 단수 동사 + 명사형"},{"sentence":"Active _____ in class _____ often lead to higher grades and better understanding.","ko":"수업에 대한 적극적인 참여는 종종 더 높은 성적과 더 나은 이해로 이어진다.","answer":["participation","can"],"hint":"명사형 + 조동사 can"}]},
    {"id":"w05132","w":"protection","pos":["n"],"ph":"/prəˈtekʃən/","cefr":"B1","kr":["보호","방어"],"ex":[{"en":"The law provides protection for workers.","ko":"법은 노동자를 보호해 준다."}],"mnemonic":{"soundHint":"프로텍션 → 'pro(앞) + tect(덮다) + ion'","story":"앞에서 덮어주는 것 → 보호","hintConfidence":3},"pairs":{"buddyWords":[{"w":"defense","ko":"방어","reason":"동의어 관계"},{"w":"danger","ko":"위험","reason":"반의어 관계"},{"w":"environmental","ko":"환경의","reason":"environmental protection 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"해로움에서 지켜줌.","whenToUse":"환경·소비자 등 지킬 때."},"krDetail":[{"ko":"보호","explain":"위험한 것으로부터 지켜줌"},{"ko":"방어","explain":"공격을 막아 안전하게 지킴"}],"usageExamples":[{"en":"The government provides protection for endangered animals.","ko":"정부는 멸종 위기 동물들에게 보호를 제공한다."},{"en":"Sunscreen offers protection from harmful rays.","ko":"자외선 차단제는 해로운 광선으로부터 보호를 제공한다."}],"grammarNote":"'protection from/against + 명사'는 '~로부터의 보호'로 쓰인다. 동사형은 'protect'이며, 'under the protection of'는 '~의 보호 아래'라는 표현이다.","grammarQuiz":[{"sentence":"This cream gives your skin _____ _____ the sun.","ko":"이 크림은 피부에 태양으로부터의 보호를 제공한다.","answer":["protection","from"],"hint":"명사 + 전치사"},{"sentence":"_____ _____ is important _____ our planet's future.","ko":"환경 보호는 우리 지구의 미래에 중요하다.","answer":["Environmental","protection","for"],"hint":"형용사 + 명사 + 전치사"}]},
    {"id":"w04933","w":"poke","pos":["v","n"],"ph":"/pəʊk/","cefr":"B1","kr":["찌르다","쿡 찌르기"],"ex":[{"en":"He poked the fire with a stick.","ko":"그는 막대기로 불을 쑤셨다."}],"mnemonic":{"soundHint":"'포크' → 외래어 '포크(fork)'로 쿡 찌르다","story":"포크(fork)로 콕 찌르는 이미지. poke는 손가락으로 콕 찌르는 것.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"jab","ko":"쿡 찌르다","reason":"직접 동의어"},{"w":"nudge","ko":"쿡 찌르다","reason":"직접 동의어 - 부드럽게"},{"w":"fun","ko":"재미","reason":"poke fun at 콜로 - 놀리다"}],"collocBest":[{"en":"poke fun at","ko":"놀리다"},{"en":"poke around","ko":"뒤적이다"}]},"nuance":{"koSimple":"손·막대로 콕 찌르다.","whenToUse":"장난삼아 쿡쿡 건드릴 때."},"krDetail":[{"ko":"찌르다","explain":"뾰족한 것으로 살짝 밀어 대다"},{"ko":"쿡 찌르기","explain":"손끝으로 살짝 밀어 대는 짓"}],"usageExamples":[{"en":"She poked her brother in the arm to wake him.","ko":"그녀는 오빠를 깨우려고 팔을 쿡 찔렀다."},{"en":"Please don't poke around in my private drawers.","ko":"내 개인 서랍을 뒤적거리지 마세요."}],"grammarNote":"poke는 타동사로 쓸 때 목적어 다음에 신체 부위를 표시할 때 전치사 in을 쓴다. 'poke his arm'보다 'poke him in the arm' 구조가 더 자연스럽다.","grammarQuiz":[{"sentence":"The child _____ his friend _____ the shoulder during class.","ko":"그 아이는 수업 중에 친구의 어깨를 쿡 찔렀다.","answer":["poked","in"],"hint":"과거동사 + 전치사"}]},
    {"id":"w04787","w":"pedestrian","pos":["n","adj"],"ph":"/pəˈdestriən/","cefr":"B1","kr":["보행자","도보의","평범한"],"ex":[{"en":"Pedestrians must use the crosswalk to cross the street safely.","ko":"보행자들은 안전하게 길을 건너려면 횡단보도를 이용해야 한다."}],"mnemonic":{"soundHint":"페데스트리언","story":"'ped(발, 자전거 페달)' + estrian → 발로 다니는 사람 = 보행자","hintConfidence":2},"pairs":{"buddyWords":[{"w":"walker","ko":"보행자","reason":"동의어 - 핵심 짝"},{"w":"motorist","ko":"운전자","reason":"반의어 - 보행자 vs 운전자"},{"w":"crosswalk","ko":"횡단보도","reason":"콜로 - 보행자 이용"}],"collocBest":[]},"nuance":{"koSimple":"길을 걷는 사람.","whenToUse":"차와 대비되는 보행자를 말할 때."},"krDetail":[{"ko":"보행자","explain":"걸어서 다니는 사람"},{"ko":"도보의","explain":"걸어다니는 것과 관련된"},{"ko":"평범한","explain":"특별한 데 없이 흔한"}],"usageExamples":[{"en":"The pedestrian carefully crossed the busy street after checking both sides twice.","ko":"그 보행자는 양쪽을 두 번 확인한 후 붐비는 거리를 조심스럽게 건넜다."},{"en":"A motorist zips past traffic quickly, but a pedestrian sees the city up close and personal.","ko":"운전자는 교통을 빠르게 지나치지만, 보행자는 도시를 가까이서 개인적으로 본다."}],"grammarNote":"pedestrian은 명사(보행자)와 형용사(도보의·평범한) 용법이 있다. 형용사로 '평범한, 진부한'의 뜻으로 쓰이면 부정적 뉘앙스가 강하니 주의해야 한다. pedestrian crossing(횡단보도), pedestrian zone(보행자 전용 구역)처럼 복합명사에서 자주 등장한다. 학생들은 형용사의 '평범한' 의미를 놓치기 쉽다.","grammarQuiz":[{"sentence":"A young _____ _____ hit by a car near the school this morning, but she was not badly hurt.","ko":"오늘 아침 학교 근처에서 한 어린 보행자가 차에 치였지만, 크게 다치지는 않았다.","answer":["pedestrian","was"],"hint":"명사 + 수동태 be 동사"},{"sentence":"Please use the _____ crossing _____ safely reach the other side of the busy avenue.","ko":"붐비는 도로의 반대편에 안전하게 도착하려면 횡단보도를 이용해 주세요.","answer":["pedestrian","to"],"hint":"형용사 + to부정사"}]},
    {"id":"w05015","w":"preference","pos":["n"],"ph":"/ˈprefərəns/","cefr":"B1","kr":["선호","취향"],"ex":[{"en":"Do you have a preference for a window seat?","ko":"창가 자리에 대한 선호가 있나요?"}],"mnemonic":{"soundHint":"프레퍼런스 → '프리(free) 퍼런스(참조)'","story":"'프리하게 참조'할 대상은 결국 내가 좋아하는 것 → 선호","hintConfidence":2},"pairs":{"buddyWords":[{"w":"choice","ko":"선택","reason":"직접 동의어"},{"w":"prefer","ko":"선호하다","reason":"동사형 짝"},{"w":"personal","ko":"개인적인","reason":"personal preference 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"더 좋다고 마음이 기우는 취향.","whenToUse":"음식·색·자리 고를 때."},"krDetail":[{"ko":"선호","explain":"여럿 가운데 더 좋아하는 마음"},{"ko":"취향","explain":"저마다 즐겨 좋아하는 갈래"}],"usageExamples":[{"en":"Her preference for classical music is very strong.","ko":"고전 음악에 대한 그녀의 선호는 매우 강하다."},{"en":"Personal preferences vary from person to person.","ko":"개인적인 취향은 사람마다 다르다."}],"grammarNote":"preference 뒤에는 전치사 for가 온다. 'preference of'가 아니라 'preference for'가 정확하며, 'have/show a preference for + 명사' 형태로 자주 쓴다.","grammarQuiz":[{"sentence":"She showed a strong _____ _____ chocolate ice cream over vanilla.","ko":"그녀는 바닐라보다 초콜릿 아이스크림에 대한 강한 선호를 보였다.","answer":["preference","for"],"hint":"명사 + 전치사"}]},
    {"id":"w04800","w":"per","pos":["prep"],"ph":"/pər/","cefr":"B1","kr":["~마다","~당"],"ex":[{"en":"She earns fifty dollars per hour.","ko":"그녀는 시간당 50달러를 번다."}],"mnemonic":{"soundHint":"퍼","story":"'퍼 퍼슨(per person 1인당)', '퍼 아워(per hour 시간당)' = ~마다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"each","ko":"각각","reason":"동의어 - 핵심 짝"},{"w":"every","ko":"매","reason":"동의어 - 매번"},{"w":"rate","ko":"비율","reason":"시나리오 - per로 비율 표시"}],"collocBest":[]},"nuance":{"koSimple":"하나마다·하나당.","whenToUse":"단위 가격·비율 말할 때."},"krDetail":[{"ko":"~마다","explain":"일정한 단위마다 한 번씩"},{"ko":"~당","explain":"하나를 기준으로 정해진 값"}],"usageExamples":[{"en":"The medicine costs about twenty dollars per bottle at the local pharmacy.","ko":"그 약은 동네 약국에서 병당 약 20달러이다."},{"en":"Each family spends money differently, but the average cost is about ten dollars per person.","ko":"가족마다 돈을 쓰는 방식이 다르지만, 평균 비용은 1인당 약 10달러이다."}],"grammarNote":"per는 전치사로 '~당, ~마다'의 뜻이며, 수치·비율을 나타내는 표현에서 자주 쓰인다. 관사 없이 단수명사가 뒤에 오는 점(per day, per person, per hour)이 특징이다. 학생들은 관사 a/an으로 대체 가능한 경우(a day = per day)를 익혀야 한다. 'as per + 명사'는 '~에 따라'로 문어체·격식체에 등장한다.","grammarQuiz":[{"sentence":"The ticket costs fifty dollars _____ person, so a family of four _____ pay two hundred dollars.","ko":"티켓은 1인당 50달러이므로, 4인 가족은 총 200달러를 내야 한다.","answer":["per","will"],"hint":"전치사 per + 조동사 will"},{"sentence":"The bus runs three times _____ hour, so you _____ not wait very long at the station.","ko":"버스는 시간당 세 번 운행하므로, 정류장에서 아주 오래 기다릴 필요는 없다.","answer":["per","will"],"hint":"빈도 per + 조동사"}]},
    {"id":"w05133","w":"protein","pos":["n"],"ph":"/ˈprəʊtiːn/","cefr":"B1","kr":["단백질"],"ex":[{"en":"Meat is a good source of protein.","ko":"고기는 단백질의 좋은 공급원이다."}],"mnemonic":{"soundHint":"프로틴","story":"프로틴 보충제로 단백질을 섭취한다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"nutrition","ko":"영양","reason":"단백질은 영양소"},{"w":"intake","ko":"섭취","reason":"protein intake 콜로케이션"},{"w":"plant","ko":"식물","reason":"plant protein 콜로케이션"}],"collocBest":[{"en":"protein intake","ko":"단백질 섭취"},{"en":"plant protein","ko":"식물성 단백질"}]},"nuance":{"koSimple":"근육 만드는 영양소 단백질.","whenToUse":"영양·식단 이야기할 때."},"krDetail":[{"ko":"단백질","explain":"몸을 만드는 데 꼭 필요한 영양분"}],"usageExamples":[{"en":"Meat provides a lot of protein to our body.","ko":"고기는 우리 몸에 많은 단백질을 제공한다."},{"en":"Beans are a good source of plant protein.","ko":"콩은 식물성 단백질의 좋은 공급원이다."}],"grammarNote":"'protein'은 보통 셀 수 없는 명사이나, 종류를 말할 때 셀 수 있다. 'source of protein(단백질의 공급원)'이 자주 나오는 표현이다.","grammarQuiz":[{"sentence":"Athletes need a high _____ _____ every day.","ko":"운동선수들은 매일 높은 단백질 섭취가 필요하다.","answer":["protein","intake"],"hint":"명사 + 명사"},{"sentence":"Eggs are a great _____ _____ _____ growing children.","ko":"달걀은 자라나는 아이들에게 좋은 단백질 공급원이다.","answer":["source","of","protein"],"hint":"명사 + 전치사 + 명사"}]},
    {"id":"w04942","w":"political","pos":["adj"],"ph":"/pəˈlɪtɪkəl/","cefr":"B1","kr":["정치적인"],"ex":[{"en":"He has strong political views.","ko":"그는 강한 정치적 견해를 가지고 있다."}],"mnemonic":{"soundHint":"폴리티컬","story":"'politics(정치)' + al = 정치적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"politics","ko":"정치","reason":"명사형 - 짝"},{"w":"governmental","ko":"정부의","reason":"직접 동의어"},{"w":"party","ko":"정당","reason":"political party 콜로"}],"collocBest":[]},"nuance":{"koSimple":"나라 다스리는 일과 관련된.","whenToUse":"선거·정당·정책 이야기할 때."},"krDetail":[{"ko":"정치적인","explain":"나라 다스림과 얽힌"}],"usageExamples":[{"en":"The president made a political speech on TV.","ko":"대통령은 TV에서 정치적인 연설을 했다."},{"en":"Political parties compete in every election.","ko":"정당들은 모든 선거에서 경쟁한다."}],"grammarNote":"political은 형용사로만 쓰이고, 명사 '정치'는 politics이다. 학생들이 'political is important' 식으로 형용사를 주어로 쓰는 오류를 자주 범한다.","grammarQuiz":[{"sentence":"The _____ crisis _____ solved through careful negotiation among leaders.","ko":"그 정치적 위기는 지도자들 간의 신중한 협상을 통해 해결되었다.","answer":["political","was"],"hint":"형용사 + be동사"}]},
    {"id":"w05109","w":"proof","pos":["n"],"ph":"/pruːf/","cefr":"B1","kr":["증거","증명"],"ex":[{"en":"Do you have proof of your age?","ko":"나이에 대한 증거가 있나요?"}],"mnemonic":{"soundHint":"프루프 → 'prove(증명하다)의 명사형 = 부풀림 없는 뿌리'","story":"prove(증명)해서 남은 확실한 근거 → 증거","hintConfidence":3},"pairs":{"buddyWords":[{"w":"evidence","ko":"증거","reason":"동의어 관계"},{"w":"identity","ko":"신분","reason":"proof of identity 콜로케이션"},{"w":"burden","ko":"책임","reason":"burden of proof 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"사실임을 보여주는 증거.","whenToUse":"신분·나이 등 증명 필요할 때."},"krDetail":[{"ko":"증거","explain":"어떤 일이 사실임을 보여주는 자료"},{"ko":"증명","explain":"무엇이 사실임을 밝혀 보여줌"}],"usageExamples":[{"en":"The police found proof of his crime at the scene.","ko":"경찰은 현장에서 그의 범죄의 증거를 찾았다."},{"en":"You need proof of identity to enter the building.","ko":"그 건물에 들어가려면 신분 증명이 필요하다."}],"grammarNote":"'proof of + 명사'는 '~의 증거'로 쓰인다. 동사형은 'prove(증명하다)'이며, 'proof'는 명사로만 쓰인다.","grammarQuiz":[{"sentence":"You must show _____ _____ _____ to open a bank account.","ko":"은행 계좌를 열려면 신분 증명을 보여야 한다.","answer":["proof","of","identity"],"hint":"명사 + 전치사 + 명사"},{"sentence":"There is no _____ that he stole the money.","ko":"그가 돈을 훔쳤다는 증거가 없다.","answer":["proof"],"hint":"명사형"}]},
