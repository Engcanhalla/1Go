    {"id":"v08514","w":"approve of","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 승인[인정]하다, ~에 찬성하다"],"ex":[{"en":"My parents do not approve of me spending hours playing online games.","ko":"우리 부모님은 내가 온라인 게임을 몇 시간씩 하는 것을 찬성하지 않으신다."}],"mnemonic":{"soundHint":"ap(~에게)+prove(증명) of","story":"prove(증명)해서 '좋다'고 인정 → 승인·찬성","hintConfidence":2},"pairs":{"buddyWords":[{"w":"disapprove","ko":"반대하다","reason":"반의어"},{"w":"endorse","ko":"지지하다","reason":"유의어"},{"w":"approval","ko":"승인","reason":"명사형"}],"collocBest":[{"en":"approve of the plan","ko":"그 계획에 찬성하다"},{"en":"not approve of his behavior","ko":"그의 행동을 인정하지 않다"}]},"nuance":{"koSimple":"어떤 행동이나 생각에 좋다고 동의하는 태도를 뜻함","whenToUse":"개인의 찬성이나 인정을 부드럽게 표현할 때 사용"},"krDetail":[{"ko":"~을 승인[인정]하다, ~에 찬성하다","explain":"좋게 여겨 받아들이다"}],"usageExamples":[{"en":"Her parents did not approve of her staying out so late.","ko":"그녀의 부모님은 그녀가 그렇게 늦게까지 밖에 있는 것을 못마땅해했다."},{"en":"Most members approved of the new school policy.","ko":"대부분의 회원들은 새 학교 방침에 찬성했다."}],"grammarNote":"자동사구로 뒤에 전치사 of가 붙어 'approve of + 명사/동명사' 형태로 쓴다. 타동사 approve(공식 승인하다)와 구별할 것.","grammarQuiz":[{"sentence":"My parents do not approve of my _____ hours playing online games every night.","ko":"우리 부모님은 내가 매일 밤 몇 시간씩 온라인 게임을 하는 것을 찬성하지 않으신다.","answer":"spending","hint":"전치사 of + 동명사"}]},
    {"id":"v08679","w":"get through","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 통과하다[빠져나가다]","~을 해내다[끝내다]","~에 합격하다"],"ex":[{"en":"With her family's support, she got through the toughest year of her studies.","ko":"가족의 지지 덕분에, 그녀는 학업의 가장 힘든 해를 이겨냈다."}],"mnemonic":{"soundHint":"through(관통) 지나가다(get)","story":"어려움을 뚫고(through) 나가다 → 헤쳐 나가다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"overcome","ko":"극복하다","reason":"유의어"},{"w":"pass through","ko":"통과하다","reason":"유의어"},{"w":"complete","ko":"완수하다","reason":"유의어"}],"collocBest":[{"en":"get through the exam","ko":"시험을 통과하다"},{"en":"get through hard times","ko":"힘든 시기를 해내다"}]},"nuance":{"koSimple":"힘든 상황이나 과제를 견뎌 통과해 내는 것","whenToUse":"시험·시련·과제를 이겨 낼 때 폭넓게 사용"},"krDetail":[{"ko":"~을 통과하다[빠져나가다]","explain":"힘든 곳을 지나가다"},{"ko":"~을 해내다[끝내다]","explain":"어려운 일을 마치다"},{"ko":"~에 합격하다","explain":"시험을 통과하다"}],"usageExamples":[{"en":"It was hard, but we finally got through all the assigned reading.","ko":"힘들었지만 우리는 마침내 배정된 읽기 자료를 모두 끝냈다."},{"en":"She worked hard and got through the difficult entrance exam.","ko":"그녀는 열심히 노력해서 어려운 입학시험에 합격했다."}],"grammarNote":"get through는 뒤에 목적어가 오면 '~을 견뎌내다/끝내다'를 뜻하고, get through to 형태면 '~에게 연락이 닿다'라는 뜻이 된다.","grammarQuiz":[{"sentence":"_____ by her supportive family, she got through the toughest year of her studies.","ko":"지지해 주는 가족의 도움을 받아, 그녀는 학업의 가장 힘든 해를 이겨냈다.","answer":"Supported","hint":"분사구문(수동)"}]},
    {"id":"v08610","w":"dismissal","pos":["noun"],"ph":"","cefr":"B1","kr":["해고, 해임","묵살, 일축","(소송의) 기각"],"ex":[{"en":"The workers protested the sudden dismissal of their long-serving manager.","ko":"노동자들은 오랫동안 근무한 매니저의 갑작스러운 해고에 항의했다."}],"mnemonic":{"soundHint":"dis(멀리)+miss(보내다)+al","story":"멀리(dis) 보내다(miss) → 해고·묵살·기각","hintConfidence":3},"pairs":{"buddyWords":[{"w":"dismiss","ko":"해고·기각하다","reason":"동사형"},{"w":"firing","ko":"해고","reason":"유의어"},{"w":"hiring","ko":"고용","reason":"반의어"}],"collocBest":[{"en":"unfair dismissal","ko":"부당 해고"},{"en":"dismissal of the case","ko":"사건의 기각"}]},"nuance":{"koSimple":"직위에서 내보내거나 의견을 무시해 버리는 것","whenToUse":"해고·묵살·기각 등 공식적 배제에 사용"},"krDetail":[{"ko":"해고, 해임","explain":"일자리에서 내보냄"},{"ko":"묵살, 일축","explain":"무시하고 넘김"},{"ko":"(소송의) 기각","explain":"재판에서 받아들이지 않음"}],"usageExamples":[{"en":"The manager's sudden dismissal shocked all the staff.","ko":"그 관리자의 갑작스러운 해고는 전 직원을 충격에 빠뜨렸다."},{"en":"Her quick dismissal of my idea hurt my feelings.","ko":"내 생각을 재빨리 일축한 그녀의 태도가 내 기분을 상하게 했다."}],"grammarNote":"동사 dismiss(해고하다, 일축하다)의 명사형으로, 문맥에 따라 '해고·묵살·기각' 등 여러 뜻을 가진다. 셀 수 있는 명사와 없는 명사로 모두 쓰인다.","grammarQuiz":[{"sentence":"The long-serving manager _____ suddenly after twenty years of loyal service.","ko":"오랫동안 근무한 매니저가 20년의 충실한 근무 후 갑자기 해고되었다.","answer":"was dismissed","hint":"수동태 과거"}]},
    {"id":"v08505","w":"altruist","pos":["noun"],"ph":"","cefr":"B1","kr":["이타주의자"],"ex":[{"en":"A true altruist helps others without expecting any reward in return.","ko":"진정한 이타주의자는 어떤 보상도 기대하지 않고 남을 돕는다."}],"mnemonic":{"soundHint":"alter(다른 이)+ist(사람)","story":"alter(다른 사람)을 위해 사는 -ist(사람) = 이타주의자","hintConfidence":2},"pairs":{"buddyWords":[{"w":"altruism","ko":"이타주의","reason":"명사형"},{"w":"egoist","ko":"이기주의자","reason":"반의어"},{"w":"philanthropist","ko":"박애주의자","reason":"유의어"}],"collocBest":[{"en":"a true altruist","ko":"진정한 이타주의자"},{"en":"act like an altruist","ko":"이타주의자처럼 행동하다"}]},"nuance":{"koSimple":"자기 이익보다 남을 먼저 생각하는 이타주의자","whenToUse":"보상을 바라지 않고 남을 돕는 사람을 지칭할 때 사용"},"krDetail":[{"ko":"이타주의자","explain":"남을 먼저 돕는 사람"}],"usageExamples":[{"en":"As a true altruist, she donated most of her salary to charity.","ko":"진정한 이타주의자로서 그녀는 급여의 대부분을 자선단체에 기부했다."},{"en":"The altruist spent his weekends helping homeless people.","ko":"그 이타주의자는 주말마다 노숙자들을 도우며 보냈다."}],"grammarNote":"가산명사로, 형용사 altruistic(이타적인)·명사 altruism(이타주의)과 짝을 이룬다. 반의어는 egoist(이기주의자)이다.","grammarQuiz":[{"sentence":"A true altruist is someone _____ helps others without expecting any reward.","ko":"진정한 이타주의자는 어떤 보상도 기대하지 않고 남을 돕는 사람이다.","answer":"who","hint":"관계대명사 주격 who"}]},
    {"id":"v08544","w":"be at odds with","pos":["phrase"],"ph":"","cefr":"B1","kr":["~와 상충하다"],"ex":[{"en":"His opinion on the new policy is clearly at odds with the majority view.","ko":"새 정책에 대한 그의 의견은 다수 의견과 명백히 상충한다."}],"mnemonic":{"soundHint":"odds = 확률·차이","story":"확률(odds)이 안 맞아 사이가 안 좋음 → 상충","hintConfidence":2},"pairs":{"buddyWords":[{"w":"conflict with","ko":"~와 충돌하다","reason":"유의어"},{"w":"disagree with","ko":"~와 의견이 다르다","reason":"유의어"},{"w":"agree with","ko":"~에 동의하다","reason":"반의어"}],"collocBest":[{"en":"be at odds with his boss","ko":"상사와 상충하다"},{"en":"be at odds with the evidence","ko":"증거와 어긋나다"}]},"nuance":{"koSimple":"의견이나 관계가 서로 맞지 않아 대립하는 상태","whenToUse":"사람·의견·사실이 서로 충돌함을 말할 때 사용"},"krDetail":[{"ko":"~와 상충하다","explain":"서로 맞지 않다"}],"usageExamples":[{"en":"His actions were at odds with the promises he had made.","ko":"그의 행동은 그가 했던 약속과 상충했다."},{"en":"The new plan is at odds with the company's long-term goals.","ko":"새 계획은 회사의 장기 목표와 상충한다."}],"grammarNote":"odds는 항상 복수형으로 쓰며, be at odds with 뒤에는 상충하는 대상이 온다. 사람에게 쓰면 '~와 의견이 대립하다'의 뜻이 된다.","grammarQuiz":[{"sentence":"His opinion on the new policy, _____ is clearly at odds with the majority, shocked us.","ko":"새 정책에 대한 그의 의견은 다수 의견과 명백히 상충하여 우리를 충격에 빠뜨렸다.","answer":"which","hint":"관계대명사 계속적 용법(which)"}]},
    {"id":"v08802","w":"probability","pos":["noun"],"ph":"","cefr":"B1","kr":["가능성"],"ex":[{"en":"The probability of rain tomorrow is about 80 percent, according to the forecast.","ko":"예보에 따르면 내일 비가 올 가능성은 약 80퍼센트이다."}],"mnemonic":{"soundHint":"프라버빌리티","story":"probable(있을 법한) + ility — 있을 법한 정도 = 확률/가능성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"probable","ko":"있을 법한","reason":"동일 어근 형용사"},{"w":"likelihood","ko":"가능성","reason":"가장 가까운 동의어"},{"w":"chance","ko":"가능성, 기회","reason":"구어체 동의어"}],"collocBest":[{"en":"high probability","ko":"높은 가능성"},{"en":"probability of success","ko":"성공 가능성"}]},"nuance":{"koSimple":"어떤 일이 실제로 일어날 가능성의 정도를 뜻해요.","whenToUse":"확률·예측처럼 수치로 가능성을 말할 때 씁니다."},"krDetail":[{"ko":"가능성","explain":"일이 일어날 확률"}],"usageExamples":[{"en":"There is a high probability that the team will win the final match.","ko":"그 팀이 결승전에서 이길 가능성이 높다."},{"en":"Scientists calculate the probability of an earthquake in this region.","ko":"과학자들은 이 지역에서 지진이 일어날 가능성을 계산한다."}],"grammarNote":"'the probability of + 명사/동명사' 또는 'the probability that + 절' 형태로 확률·가능성을 표현한다. 형용사 'high/low'와 자주 결합하며 수학·통계에서는 '확률'로 번역된다.","grammarQuiz":[{"sentence":"If the probability of rain _____ (be) higher, we would cancel the picnic.","ko":"만약 비가 올 가능성이 더 높다면, 우리는 소풍을 취소할 텐데.","answer":"were","hint":"가정법 과거"}]},
    {"id":"v08853","w":"stand for","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 상징[의미]하다","~을 옹호[찬성]하다"],"ex":[{"en":"The letters KTX stand for Korea Train eXpress, our fastest high-speed rail service.","ko":"KTX라는 글자는 한국고속철도를 뜻하며, 우리의 가장 빠른 고속 철도 서비스이다."}],"mnemonic":{"soundHint":"스탠드 포","story":"stand(서 있다) + for(~을 대신해) - 대신 서서 '상징하다·옹호하다'.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"represent","ko":"대표하다","reason":"가장 가까운 동의어"},{"w":"symbolize","ko":"상징하다","reason":"동의 표현"},{"w":"stand up for","ko":"옹호하다","reason":"stand + 전치사 계열, '옹호' 의미 겹침"}],"collocBest":[{"en":"UN stands for United Nations","ko":"UN은 국제연합을 의미한다"},{"en":"stand for justice","ko":"정의를 옹호하다"}]},"nuance":{"koSimple":"어떤 글자나 상징이 무엇을 뜻하거나 대표한다는 표현이에요.","whenToUse":"약자·기호의 의미나 지지하는 가치를 설명할 때 씁니다."},"krDetail":[{"ko":"~을 상징[의미]하다","explain":"무엇을 나타내다"},{"ko":"~을 옹호[찬성]하다","explain":"지지하고 편들다"}],"usageExamples":[{"en":"The white color on the flag stands for peace.","ko":"그 깃발의 흰색은 평화를 상징한다."},{"en":"Our club stands for fairness and equal opportunity.","ko":"우리 동아리는 공정성과 균등한 기회를 옹호한다."}],"grammarNote":"'stand for'는 '(약자·기호가) ~을 의미하다'와 '(가치·신념을) 옹호하다' 두 뜻이 있다. 약어 설명 시 'What does it stand for?(무엇의 약자야?)'처럼 쓴다.","grammarQuiz":[{"sentence":"The letters KTX, _____ stand for Korea Train eXpress, represent our fastest rail service.","ko":"한국고속철도를 뜻하는 KTX라는 글자는 우리의 가장 빠른 철도 서비스를 대표한다.","answer":"which","hint":"관계대명사 계속적 용법"}]},
    {"id":"v08559","w":"bystander","pos":["noun"],"ph":"","cefr":"B1","kr":["구경꾼"],"ex":[{"en":"Several bystanders bravely helped the injured man before the ambulance arrived.","ko":"여러 구경꾼들이 구급차가 도착하기 전에 부상당한 남자를 용감하게 도왔다."}],"mnemonic":{"soundHint":"by(옆에)+stand(서다)+er(사람)","story":"옆에(by) 서있는(stand) 사람(er) → 구경꾼","hintConfidence":3},"pairs":{"buddyWords":[{"w":"onlooker","ko":"구경꾼","reason":"동의어"},{"w":"spectator","ko":"관중","reason":"유의어"},{"w":"witness","ko":"목격자","reason":"관련어"}],"collocBest":[{"en":"an innocent bystander","ko":"무고한 구경꾼"},{"en":"a curious bystander","ko":"호기심 많은 구경꾼"}]},"nuance":{"koSimple":"사건 현장 옆에서 그저 지켜보는 목격자","whenToUse":"직접 관여하지 않는 주변 사람을 가리킬 때 사용"},"krDetail":[{"ko":"구경꾼","explain":"곁에서 지켜보는 사람"}],"usageExamples":[{"en":"A quick-thinking bystander called the police right away.","ko":"재빠르게 판단한 구경꾼 한 명이 즉시 경찰에 신고했다."},{"en":"Most bystanders just watched and did nothing to help.","ko":"대부분의 구경꾼은 그저 지켜보기만 하고 도우려 하지 않았다."}],"grammarNote":"stand by(곁에 서 있다)에서 나온 명사로, 사건에 직접 관여하지 않고 옆에서 지켜보는 사람을 뜻한다. innocent bystander(무고한 행인)처럼도 자주 쓰인다.","grammarQuiz":[{"sentence":"Several bystanders _____ were standing nearby bravely helped the injured man.","ko":"가까이 서 있던 여러 구경꾼들이 부상당한 남자를 용감하게 도왔다.","answer":"who","hint":"관계대명사 주격 who"}]},
    {"id":"v08652","w":"explanatory","pos":["adj"],"ph":"","cefr":"B1","kr":["설명하는"],"ex":[{"en":"The teacher added explanatory notes beside each difficult English grammar rule.","ko":"선생님은 어려운 영어 문법 규칙 옆에 설명하는 주석을 추가했다."}],"mnemonic":{"soundHint":"explain(설명)+atory(형용사)","story":"explain(설명하다) → 설명하는","hintConfidence":3},"pairs":{"buddyWords":[{"w":"explain","ko":"설명하다","reason":"동사형"},{"w":"explanation","ko":"설명","reason":"명사형"},{"w":"descriptive","ko":"묘사적인","reason":"유의어"}],"collocBest":[{"en":"explanatory note","ko":"설명하는 주석"},{"en":"explanatory diagram","ko":"설명하는 도표"}]},"nuance":{"koSimple":"어떤 사실을 이해하기 쉽게 풀어 설명하는","whenToUse":"주석·자료·문장의 설명 기능을 강조할 때 사용"},"krDetail":[{"ko":"설명하는","explain":"뜻을 풀어 주는"}],"usageExamples":[{"en":"The map came with a helpful explanatory guide.","ko":"그 지도에는 유용한 설명 안내서가 딸려 있었다."},{"en":"He wrote an explanatory note at the bottom of the page.","ko":"그는 페이지 아래에 설명하는 주석을 적었다."}],"grammarNote":"무언가를 설명하거나 이해를 돕는 성격을 나타내는 형용사로 주로 명사 앞에 쓴다. self-explanatory(설명이 필요 없는)라는 표현도 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"The explanatory notes _____ the teacher added beside each rule were very helpful.","ko":"선생님이 각 규칙 옆에 추가한 설명 주석은 매우 도움이 되었다.","answer":"which","hint":"관계대명사 목적격(which/that)"}]},
    {"id":"v08568","w":"cockpit","pos":["noun"],"ph":"","cefr":"B1","kr":["조종석"],"ex":[{"en":"The pilot carefully checked every instrument in the cockpit before takeoff.","ko":"조종사는 이륙 전에 조종석의 모든 계기를 신중하게 확인했다."}],"mnemonic":{"soundHint":"cock(수탉)+pit(구덩이)","story":"옛날 cockfight(닭싸움장, pit) → 좁은 조종석","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pilot","ko":"조종사","reason":"관련어"},{"w":"aircraft","ko":"항공기","reason":"관련어"},{"w":"control panel","ko":"제어판","reason":"관련어"}],"collocBest":[{"en":"enter the cockpit","ko":"조종석에 들어가다"},{"en":"the pilot in the cockpit","ko":"조종석의 조종사"}]},"nuance":{"koSimple":"비행기 조종사가 앉아 조종하는 좁은 조종석","whenToUse":"항공기·경주차 조종 공간을 가리킬 때 사용"},"krDetail":[{"ko":"조종석","explain":"비행기 운전하는 자리"}],"usageExamples":[{"en":"Only the captain and co-pilot are allowed in the cockpit.","ko":"기장과 부기장만이 조종석에 들어갈 수 있다."},{"en":"The racing car's cockpit is very narrow and tight.","ko":"경주용 자동차의 조종석은 매우 좁고 답답하다."}],"grammarNote":"주로 비행기 조종석을 가리키지만, 경주용 자동차나 보트의 운전석을 뜻하기도 한다. 셀 수 있는 명사로 관사와 함께 쓴다.","grammarQuiz":[{"sentence":"_____ every instrument in the cockpit, the pilot felt fully ready for takeoff.","ko":"조종석의 모든 계기를 확인한 후, 조종사는 이륙 준비가 완전히 되었다고 느꼈다.","answer":"Having checked","hint":"분사구문(완료)"}]},
    {"id":"v08574","w":"come to an end","pos":["phrase"],"ph":"","cefr":"B1","kr":["끝나다, 종결되다","죽다"],"ex":[{"en":"The long summer vacation finally came to an end this Monday morning.","ko":"긴 여름방학이 마침내 이번 월요일 아침에 끝났다."}],"mnemonic":{"soundHint":"end(끝)에 come(오다)","story":"글자 그대로 '끝(end)에 도달' → 끝나다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"conclude","ko":"결말짓다","reason":"유의어"},{"w":"finish","ko":"끝나다","reason":"동의어"},{"w":"begin","ko":"시작하다","reason":"반의어"}],"collocBest":[{"en":"the war came to an end","ko":"전쟁이 끝났다"},{"en":"come to an end soon","ko":"곧 종결되다"}]},"nuance":{"koSimple":"진행되던 일이 자연스럽게 마무리되어 끝남","whenToUse":"기간·행사·관계가 종결됨을 담담히 말할 때 사용"},"krDetail":[{"ko":"끝나다, 종결되다","explain":"마무리되다"},{"ko":"죽다","explain":"목숨이 다하다"}],"usageExamples":[{"en":"The meeting came to an end after nearly three long hours.","ko":"그 회의는 거의 세 시간 만에 끝이 났다."},{"en":"All good things must come to an end eventually.","ko":"모든 좋은 일은 결국 끝나기 마련이다."}],"grammarNote":"'끝이 나다'를 뜻하는 자동사적 표현으로 주어가 스스로 끝나는 뉘앙스이다. 무언가를 끝내다는 뜻은 bring ~ to an end로 표현한다.","grammarQuiz":[{"sentence":"The long summer vacation _____ to an end just this Monday morning.","ko":"긴 여름방학이 바로 이번 월요일 아침에 끝났다.","answer":"has come","hint":"현재완료(완료)"}]},
    {"id":"v08703","w":"in a nutshell","pos":["phrase"],"ph":"","cefr":"B1","kr":["아주 간결하게, 요약하자면"],"ex":[{"en":"In a nutshell, hard work and consistency are the keys to real academic success.","ko":"요약하자면, 근면과 꾸준함이 진정한 학업 성공의 열쇠이다."}],"mnemonic":{"soundHint":"nut(견과)의 shell(껍질) 안에","story":"작은 껍질(shell) 안에 다 담다 → 요약하자면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"in short","ko":"요컨대","reason":"동의어"},{"w":"to sum up","ko":"요약하면","reason":"유의어"},{"w":"briefly","ko":"간단히","reason":"유의어"}],"collocBest":[{"en":"put it in a nutshell","ko":"아주 간결하게 말하다"},{"en":"in a nutshell, we failed","ko":"요약하자면, 우리는 실패했다"}]},"nuance":{"koSimple":"핵심만 뽑아 짧게 요약해 말하는 표현","whenToUse":"긴 설명을 간단히 마무리할 때 회화체로 사용"},"krDetail":[{"ko":"아주 간결하게, 요약하자면","explain":"한마디로 말하면"}],"usageExamples":[{"en":"In a nutshell, the meeting was a complete waste of time.","ko":"한마디로 말해, 그 회의는 완전히 시간 낭비였다."},{"en":"Let me explain the whole story in a nutshell for you.","ko":"그 전체 이야기를 간결하게 설명해 줄게."}],"grammarNote":"in a nutshell은 복잡한 내용을 요약할 때 문장 앞이나 끝에 쓰는 관용 표현으로, '요컨대'로 해석하면 자연스럽다.","grammarQuiz":[{"sentence":"In a nutshell, _____ hard and staying consistent are the keys to academic success.","ko":"요약하자면, 열심히 일하고 꾸준함을 유지하는 것이 학업 성공의 열쇠이다.","answer":"working","hint":"동명사 주어"}]},
    {"id":"v08715","w":"in the light of","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에 비추어"],"ex":[{"en":"In the light of recent events, we must reconsider our safety guidelines carefully.","ko":"최근 사건에 비추어, 우리는 안전 지침을 신중하게 재고해야 한다."}],"mnemonic":{"soundHint":"light(빛)에 비춰서","story":"빛(light) 아래에서 살펴보다 → ~에 비추어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"in view of","ko":"~을 고려하여","reason":"동의어"},{"w":"given","ko":"~을 고려하면","reason":"유의어"},{"w":"considering","ko":"~을 고려하여","reason":"유의어"}],"collocBest":[{"en":"in the light of new evidence","ko":"새 증거에 비추어"},{"en":"in the light of recent events","ko":"최근 사건에 비추어"}]},"nuance":{"koSimple":"새 정보나 상황을 바탕으로 다시 판단함","whenToUse":"사건·자료에 비추어 결정을 내릴 때 격식 있게 사용"},"krDetail":[{"ko":"~에 비추어","explain":"~을 고려하여"}],"usageExamples":[{"en":"In the light of new evidence, the police reopened the case.","ko":"새로운 증거에 비추어 경찰은 그 사건을 다시 열었다."},{"en":"We changed our plans in the light of the bad weather forecast.","ko":"우리는 나쁜 일기예보를 고려하여 계획을 바꿨다."}],"grammarNote":"in the light of는 '~을 고려하여, ~에 비추어'라는 뜻으로 새 정보나 상황을 근거로 판단할 때 쓴다. 미국식은 in light of이다.","grammarQuiz":[{"sentence":"_____ recent safety events, we must reconsider our school guidelines carefully.","ko":"최근 안전 사건들을 고려하여, 우리는 학교 지침을 신중하게 재고해야 한다.","answer":"Considering","hint":"분사구문(관용표현)"}]},
    {"id":"v08511","w":"antipathy","pos":["noun"],"ph":"","cefr":"B1","kr":["반감, 혐오"],"ex":[{"en":"The two politicians showed deep antipathy toward each other during the debate.","ko":"두 정치인은 토론에서 서로에 대해 깊은 반감을 드러냈다."}],"mnemonic":{"soundHint":"anti(반대)+pathy(감정)","story":"sympathy(공감)의 반대말 → 반감, 혐오","hintConfidence":3},"pairs":{"buddyWords":[{"w":"sympathy","ko":"공감","reason":"반의어"},{"w":"hostility","ko":"적대감","reason":"유의어"},{"w":"aversion","ko":"혐오","reason":"동의어"}],"collocBest":[{"en":"feel antipathy toward him","ko":"그에게 반감을 느끼다"},{"en":"deep antipathy","ko":"깊은 혐오"}]},"nuance":{"koSimple":"본능적으로 싫고 거부감이 드는 강한 반감을 뜻함","whenToUse":"뿌리 깊은 혐오나 반감을 격식 있게 표현할 때 사용"},"krDetail":[{"ko":"반감, 혐오","explain":"싫어하고 꺼리는 마음"}],"usageExamples":[{"en":"She felt a strong antipathy toward dishonest people.","ko":"그녀는 정직하지 못한 사람들에게 강한 반감을 느꼈다."},{"en":"There has long been mutual antipathy between the two teams.","ko":"두 팀 사이에는 오랫동안 서로에 대한 반감이 있었다."}],"grammarNote":"불가산 성격이 강한 명사로, 'antipathy toward/to/between'처럼 전치사와 함께 대상을 나타낸다. 반의어는 sympathy이다.","grammarQuiz":[{"sentence":"The two politicians _____ deep antipathy toward each other for many years.","ko":"두 정치인은 여러 해 동안 서로에 대해 깊은 반감을 보여 왔다.","answer":"have shown","hint":"현재완료(계속)"}]},
    {"id":"v08586","w":"consequent","pos":["adj"],"ph":"","cefr":"B1","kr":["결과로 일어나는","(논리상) 필연의","결론, 결과"],"ex":[{"en":"The heavy rain and consequent flooding damaged many houses in the village.","ko":"폭우와 그로 인해 뒤따른 홍수가 마을의 많은 집들을 손상시켰다."}],"mnemonic":{"soundHint":"sequ(따르다) → 뒤따라오는","story":"sequence(순서)로 따라오는(sequ) → 결과로 일어나는","hintConfidence":3},"pairs":{"buddyWords":[{"w":"consequence","ko":"결과","reason":"명사형"},{"w":"subsequent","ko":"뒤이은","reason":"유의어"},{"w":"antecedent","ko":"선행하는","reason":"반의어"}],"collocBest":[{"en":"the consequent damage","ko":"결과로 생긴 피해"},{"en":"consequent loss of income","ko":"필연적인 소득 감소"}]},"nuance":{"koSimple":"어떤 일에 뒤따라 필연적으로 일어나는 결과","whenToUse":"원인과 결과의 연쇄를 격식 있게 서술할 때 사용"},"krDetail":[{"ko":"결과로 일어나는","explain":"그 때문에 생기는"},{"ko":"(논리상) 필연의","explain":"당연히 따라오는"},{"ko":"결론, 결과","explain":"뒤따르는 결과"}],"usageExamples":[{"en":"The war and consequent famine killed millions of people.","ko":"전쟁과 그로 인한 기근으로 수백만 명이 목숨을 잃었다."},{"en":"Prices rose, with a consequent drop in customer spending.","ko":"물가가 올랐고, 그 결과로 소비자 지출이 감소했다."}],"grammarNote":"주로 명사 앞에서 '~에 뒤이어 일어나는'을 뜻하며 consequent on/upon 형태로도 쓴다. 부사 consequently(그 결과)와 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"The flooding, _____ was consequent to the heavy rain, damaged many houses badly.","ko":"폭우로 인해 뒤따른 홍수가 많은 집들을 심하게 손상시켰다.","answer":"which","hint":"관계대명사 계속적 용법(which)"}]},
    {"id":"v08784","w":"overvalue","pos":["phrase"],"ph":"","cefr":"B1","kr":["과대평가하다, 지나치게 중시하다"],"ex":[{"en":"Modern society tends to overvalue academic grades over creativity and genuine character.","ko":"현대 사회는 창의성과 진정한 인격보다 학업 성적을 과대평가하는 경향이 있다."}],"mnemonic":{"soundHint":"오버밸류","story":"over(넘게) + value(가치를 매기다) — 가치를 넘게 매기다 = 과대평가하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"overestimate","ko":"과대평가하다","reason":"동의어"},{"w":"overrate","ko":"과대평가하다","reason":"over- 접두 동일 패턴"},{"w":"undervalue","ko":"과소평가하다","reason":"정반대 짝, 대조 학습용"}],"collocBest":[{"en":"overvalue the stock","ko":"주식을 과대평가하다"},{"en":"overvalue material things","ko":"물질적인 것을 지나치게 중시하다"}]},"nuance":{"koSimple":"실제 가치보다 지나치게 높게 평가한다는 뜻이에요.","whenToUse":"성적·재산·능력을 부풀려 판단하는 태도를 비판할 때 씁니다."},"krDetail":[{"ko":"과대평가하다, 지나치게 중시하다","explain":"실제보다 높이 평가하다"}],"usageExamples":[{"en":"Investors often overvalue popular stocks during a boom.","ko":"투자자들은 호황기에 인기 주식을 과대평가하곤 한다."},{"en":"We tend to overvalue things we already own.","ko":"우리는 이미 소유한 것을 지나치게 높이 평가하는 경향이 있다."}],"grammarNote":"overvalue는 접두사 over-(지나치게)와 value(평가하다)가 결합한 동사로 '과대평가하다'를 뜻한다. 반대말은 undervalue(과소평가하다)이다.","grammarQuiz":[{"sentence":"Academic grades tend _____ (overvalue) in modern society over creativity.","ko":"학업 성적은 현대 사회에서 창의성보다 과대평가되는 경향이 있다.","answer":"to be overvalued","hint":"tend + to부정사 수동태"}]},
    {"id":"v08706","w":"in concert with","pos":["phrase"],"ph":"","cefr":"B1","kr":["~와 함께"],"ex":[{"en":"The school worked in concert with local police to make the streets safer.","ko":"학교는 거리를 더 안전하게 만들기 위해 지역 경찰과 함께 협력했다."}],"mnemonic":{"soundHint":"concert(협주·협력)","story":"concert(합주)처럼 함께 어울려 → ~와 함께","hintConfidence":3},"pairs":{"buddyWords":[{"w":"together with","ko":"~와 함께","reason":"동의어"},{"w":"in cooperation with","ko":"~와 협력하여","reason":"유의어"},{"w":"jointly","ko":"공동으로","reason":"유의어"}],"collocBest":[{"en":"in concert with allies","ko":"동맹국과 함께"},{"en":"work in concert with others","ko":"다른 사람들과 함께 일하다"}]},"nuance":{"koSimple":"여럿이 뜻을 모아 함께 협력해 행동하는 것","whenToUse":"기관·단체가 공동 작업할 때 격식 있게 사용"},"krDetail":[{"ko":"~와 함께","explain":"협력하여, 함께"}],"usageExamples":[{"en":"The two companies worked in concert with each other on the project.","ko":"두 회사는 그 프로젝트에서 서로 협력하여 일했다."},{"en":"Doctors act in concert with nurses to care for patients.","ko":"의사들은 환자를 돌보기 위해 간호사들과 협력한다."}],"grammarNote":"in concert with는 '~와 협력하여, 공동으로'라는 격식체 표현으로, 여기서 concert는 '협력, 일치'의 뜻으로 쓰였다.","grammarQuiz":[{"sentence":"_____ in concert with local police, the school made the surrounding streets safer.","ko":"지역 경찰과 협력하여, 학교는 주변 거리를 더 안전하게 만들었다.","answer":"Working","hint":"분사구문"}]},
    {"id":"v08700","w":"impart","pos":["verb"],"ph":"","cefr":"B1","kr":["전하다"],"ex":[{"en":"Great teachers impart not only knowledge but also important life values to students.","ko":"훌륭한 선생님은 학생들에게 지식뿐만 아니라 중요한 삶의 가치도 전한다."}],"mnemonic":{"soundHint":"im(안으로)+part(부분·나눔)","story":"지식의 part(부분)를 안(im)으로 나눠주다 → 전하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"convey","ko":"전달하다","reason":"유의어"},{"w":"communicate","ko":"전달하다","reason":"유의어"},{"w":"transmit","ko":"전송하다","reason":"유의어"}],"collocBest":[{"en":"impart knowledge","ko":"지식을 전하다"},{"en":"impart wisdom","ko":"지혜를 전하다"}]},"nuance":{"koSimple":"지식이나 정보를 남에게 조심스레 전해 주는 것","whenToUse":"가르침·조언·특성을 부여할 때 격식 있게 사용"},"krDetail":[{"ko":"전하다","explain":"지식·정보를 주다"}],"usageExamples":[{"en":"A good mentor can impart valuable wisdom to younger workers.","ko":"훌륭한 멘토는 젊은 직원들에게 소중한 지혜를 전할 수 있다."},{"en":"The spices impart a rich flavor to the whole dish.","ko":"그 향신료들은 요리 전체에 풍부한 맛을 더한다."}],"grammarNote":"impart는 impart something to somebody 구조로 쓰여 지식이나 정보, 특성 등을 '전하다'라는 뜻의 격식체 동사다.","grammarQuiz":[{"sentence":"Great teachers help students _____ not only knowledge but also important life values.","ko":"훌륭한 선생님은 학생들이 지식뿐만 아니라 중요한 삶의 가치도 얻도록 돕는다.","answer":"gain","hint":"help + 목적어 + (to)동사원형(5형식)"}]},
    {"id":"v08604","w":"deviant","pos":["phrase"],"ph":"","cefr":"B1","kr":["벗어난, 일탈적인"],"ex":[{"en":"The sociology class discussed how societies define deviant behavior differently.","ko":"사회학 수업은 사회들이 일탈적 행동을 어떻게 다르게 정의하는지 논의했다."}],"mnemonic":{"soundHint":"de(벗어남)+via(길)","story":"제 길(via)에서 벗어난(de) → 일탈적인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"deviate","ko":"벗어나다","reason":"동사형"},{"w":"deviation","ko":"일탈","reason":"명사형"},{"w":"normal","ko":"정상적인","reason":"반의어"}],"collocBest":[{"en":"deviant behavior","ko":"일탈적 행동"},{"en":"deviant from the norm","ko":"규범에서 벗어난"}]},"nuance":{"koSimple":"정상 기준에서 벗어난 비정상적 또는 일탈적인","whenToUse":"사회적·통계적 규범을 벗어난 대상을 지칭할 때 사용"},"krDetail":[{"ko":"벗어난, 일탈적인","explain":"정상에서 벗어난"}],"usageExamples":[{"en":"Society often punishes behavior it sees as deviant.","ko":"사회는 일탈적이라고 여기는 행동을 흔히 처벌한다."},{"en":"The study focused on deviant patterns among young people.","ko":"그 연구는 젊은이들 사이의 일탈적 양상에 초점을 맞췄다."}],"grammarNote":"사회의 일반적 기준·규범에서 벗어난 것을 뜻하며 주로 명사 앞에서 쓴다. 동사 deviate(벗어나다), 명사 deviation(일탈)과 함께 익혀 두면 좋다.","grammarQuiz":[{"sentence":"The behavior _____ is considered deviant in one society may be normal elsewhere.","ko":"한 사회에서 일탈적이라고 여겨지는 행동이 다른 곳에서는 정상일 수 있다.","answer":"that","hint":"관계대명사 주격(that/which)"}]},
    {"id":"v08721","w":"influx","pos":["noun"],"ph":"","cefr":"B1","kr":["유입"],"ex":[{"en":"The sudden influx of tourists overwhelmed the small mountain village last summer.","ko":"관광객의 갑작스러운 유입이 지난여름 작은 산골 마을을 압도했다."}],"mnemonic":{"soundHint":"in(안)+flux(흐름)","story":"안으로(in) 흘러(flux) 들어옴 → 유입","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inflow","ko":"유입","reason":"동의어"},{"w":"outflow","ko":"유출","reason":"반의어"},{"w":"arrival","ko":"도착","reason":"유의어"}],"collocBest":[{"en":"influx of immigrants","ko":"이민자의 유입"},{"en":"sudden influx of capital","ko":"갑작스러운 자본 유입"}]},"nuance":{"koSimple":"사람이나 자금이 한꺼번에 밀려 들어오는 흐름","whenToUse":"이민·관광객·자본의 대규모 유입에 사용"},"krDetail":[{"ko":"유입","explain":"많이 밀려 들어옴"}],"usageExamples":[{"en":"The city saw a large influx of new residents this year.","ko":"그 도시는 올해 새 주민의 대규모 유입을 겪었다."},{"en":"An influx of cheap goods hurt many local factories.","ko":"값싼 상품의 유입이 많은 지역 공장들에 타격을 주었다."}],"grammarNote":"influx는 사람, 돈, 물건이 대량으로 '유입됨'을 뜻하며 보통 an influx of 형태로 쓴다. 반대 방향의 흐름은 outflow이다.","grammarQuiz":[{"sentence":"The sudden influx of tourists, _____ overwhelmed the village, surprised the locals.","ko":"마을을 압도한 갑작스러운 관광객 유입은 지역 주민들을 놀라게 했다.","answer":"which","hint":"관계대명사 계속적 용법(which)"}]},
    {"id":"v08832","w":"rip away","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 떼내다[벗기다]"],"ex":[{"en":"The strong typhoon winds ripped away the roof from several small village houses.","ko":"강한 태풍 바람이 몇몇 작은 마을 집들의 지붕을 뜯어냈다."}],"mnemonic":{"soundHint":"립 어웨이","story":"rip(찢다) + away(떨어져 나가) - 확 뜯어 떼내다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tear off","ko":"떼어내다","reason":"동의 구동사"},{"w":"strip away","ko":"벗겨내다","reason":"동의 구동사"},{"w":"snatch","ko":"낚아채다","reason":"확 빼앗아 가는 이미지 공유"}],"collocBest":[{"en":"rip away the mask","ko":"가면을 떼내다"},{"en":"rip away the wrapping","ko":"포장지를 벗기다"}]},"nuance":{"koSimple":"무언가를 세게 잡아당겨 뜯어내거나 떼어낸다는 뜻이에요.","whenToUse":"강한 힘으로 지붕·껍질 등을 뜯어낼 때 씁니다."},"krDetail":[{"ko":"~을 떼내다[벗기다]","explain":"세게 잡아 뜯다"}],"usageExamples":[{"en":"The child ripped away the wrapping paper to see the gift.","ko":"그 아이는 선물을 보려고 포장지를 확 뜯어냈다."},{"en":"The waves ripped away the small boat from the dock.","ko":"파도가 부두에서 작은 보트를 떼어내 버렸다."}],"grammarNote":"'rip away'는 무언가를 거칠고 갑작스럽게 떼어내거나 벗겨낸다는 뜻이다. 'rip away from ~' 형태로 '~에서 떼어내다'를 나타낼 수 있다.","grammarQuiz":[{"sentence":"The roofs of several small village houses _____ (rip) away by the strong typhoon winds.","ko":"몇몇 작은 마을 집들의 지붕이 강한 태풍 바람에 의해 뜯겨졌다.","answer":"were ripped","hint":"수동태 be + p.p."}]},
    {"id":"v08655","w":"extraction","pos":["noun"],"ph":"","cefr":"B1","kr":["뽑아냄, 추출","혈통, 계통"],"ex":[{"en":"The extraction of oil from these rocks requires very expensive advanced technology.","ko":"이 암석에서 석유를 추출하는 것은 매우 값비싼 첨단 기술을 필요로 한다."}],"mnemonic":{"soundHint":"ex(밖)+tract(끌다)+ion","story":"밖(ex)으로 끌어내다(tract) → 추출","hintConfidence":3},"pairs":{"buddyWords":[{"w":"extract","ko":"추출하다","reason":"동사형"},{"w":"removal","ko":"제거","reason":"유의어"},{"w":"insertion","ko":"삽입","reason":"반의어"}],"collocBest":[{"en":"extraction of data","ko":"데이터의 추출"},{"en":"of Korean extraction","ko":"한국 혈통의"}]},"nuance":{"koSimple":"안에 든 것을 뽑아내 밖으로 꺼내는 과정","whenToUse":"자원 채굴·성분 추출·혈통 유래를 말할 때 사용"},"krDetail":[{"ko":"뽑아냄, 추출","explain":"빼내는 것"},{"ko":"혈통, 계통","explain":"핏줄, 출신"}],"usageExamples":[{"en":"The extraction of the tooth was quick and painless.","ko":"그 치아의 발치는 빠르고 아프지 않았다."},{"en":"She is a famous singer of Korean extraction.","ko":"그녀는 한국 혈통의 유명한 가수이다."}],"grammarNote":"동사 extract(뽑아내다)의 명사형으로, '추출'의 뜻이 가장 흔하다. of ~ extraction 형태로 쓰이면 '~ 혈통(출신)의'를 뜻한다.","grammarQuiz":[{"sentence":"Oil _____ from these rocks using very expensive advanced technology only.","ko":"석유는 오직 매우 값비싼 첨단 기술을 사용해서만 이 암석에서 추출된다.","answer":"is extracted","hint":"수동태 현재"}]},
    {"id":"v08733","w":"lag behind","pos":["phrase"],"ph":"","cefr":"B1","kr":["~보다 뒤처지다[낙후되다]"],"ex":[{"en":"Korea should not lag behind other countries in developing green energy technology.","ko":"한국은 친환경 에너지 기술 개발에서 다른 나라들보다 뒤처져서는 안 된다."}],"mnemonic":{"soundHint":"lag(랙 걸림)+behind(뒤에)","story":"게임 lag처럼 뒤에서 늦어짐 → 뒤처지다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fall behind","ko":"뒤처지다","reason":"동의어"},{"w":"catch up","ko":"따라잡다","reason":"반의어"},{"w":"trail","ko":"뒤쫓다","reason":"유의어"}],"collocBest":[{"en":"lag behind competitors","ko":"경쟁자들보다 뒤처지다"},{"en":"lag behind in technology","ko":"기술에서 낙후되다"}]},"nuance":{"koSimple":"남들보다 느려서 뒤에 처져 있는 상태","whenToUse":"국가·기업·학생이 경쟁에서 뒤처짐을 말할 때 사용"},"krDetail":[{"ko":"~보다 뒤처지다[낙후되다]","explain":"남보다 뒤로 처지다"}],"usageExamples":[{"en":"Some students lag behind because they miss too many classes.","ko":"일부 학생들은 수업을 너무 많이 빠져서 뒤처진다."},{"en":"Our sales are lagging behind those of our main competitor.","ko":"우리 매출은 주요 경쟁사에 뒤처지고 있다."}],"grammarNote":"lag behind는 자동사로 쓰이거나 뒤에 목적어를 두어 '~보다 뒤처지다'를 뜻한다. 발전, 속도, 성적 등에서 뒤지는 상황에 쓴다.","grammarQuiz":[{"sentence":"If we did not invest in green energy now, Korea _____ behind other countries soon.","ko":"우리가 지금 친환경 에너지에 투자하지 않는다면, 한국은 곧 다른 나라들에 뒤처질 것이다.","answer":"would lag","hint":"가정법 과거"}]},
    {"id":"v08547","w":"be confined to","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에 국한[한정]되다"],"ex":[{"en":"The virus outbreak was fortunately confined to just one small region.","ko":"다행히 바이러스 발발은 오직 작은 한 지역에만 국한되었다."}],"mnemonic":{"soundHint":"con(완전히)+fine(끝·경계)","story":"경계(fine) 안에 완전히(con) 가두다 → 국한되다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"confine","ko":"가두다·국한하다","reason":"동사형"},{"w":"restrict","ko":"제한하다","reason":"유의어"},{"w":"limit","ko":"제한하다","reason":"유의어"}],"collocBest":[{"en":"be confined to bed","ko":"침대에 갇혀 있다"},{"en":"be confined to the topic","ko":"주제에 국한되다"}]},"nuance":{"koSimple":"어떤 범위 안에만 갇혀 벗어나지 못하는 상태","whenToUse":"장소·주제·대상을 특정 범위로 한정할 때 사용"},"krDetail":[{"ko":"~에 국한[한정]되다","explain":"그 범위 안에만 있다"}],"usageExamples":[{"en":"The damage was confined to the ground floor of the building.","ko":"피해는 건물의 1층에만 국한되었다."},{"en":"After the surgery, he was confined to his bed for two weeks.","ko":"수술 후 그는 2주 동안 침대에 갇혀 지냈다."}],"grammarNote":"confine A to B(A를 B로 한정하다)의 수동태로, to 뒤에는 제한되는 범위나 장소가 온다. 침대·집 등이 오면 '~에 갇혀 지내다'의 뜻이 된다.","grammarQuiz":[{"sentence":"The virus outbreak _____ to just one small region thanks to quick action.","ko":"빠른 대응 덕분에 바이러스 발발은 오직 작은 한 지역에만 국한되었다.","answer":"was confined","hint":"수동태 과거"}]},
    {"id":"v08643","w":"entail","pos":["phrase"],"ph":"","cefr":"B1","kr":["(필연적으로) 수반하다","(비용·노력 등을) 필요로 하다"],"ex":[{"en":"Studying for the college entrance exam entails great effort and long sacrifice.","ko":"대학 입시 준비는 큰 노력과 오랜 희생을 수반한다."}],"mnemonic":{"soundHint":"en(달다)+tail(꼬리)","story":"꼬리(tail)처럼 딸려 옴 → 수반하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"involve","ko":"수반하다","reason":"동의어"},{"w":"require","ko":"요구하다","reason":"유의어"},{"w":"necessitate","ko":"필요로 하다","reason":"유의어"}],"collocBest":[{"en":"entail a risk","ko":"위험을 수반하다"},{"en":"entail extra costs","ko":"추가 비용을 필요로 하다"}]},"nuance":{"koSimple":"어떤 일을 하면 자연스럽게 뒤따르는 것","whenToUse":"결정·계획이 대가나 조건을 수반함을 말할 때 사용"},"krDetail":[{"ko":"(필연적으로) 수반하다","explain":"반드시 함께 따르다"},{"ko":"(비용·노력 등을) 필요로 하다","explain":"들게 하다"}],"usageExamples":[{"en":"Running a restaurant entails long hours and hard work.","ko":"식당을 운영하는 것은 긴 시간과 힘든 노동을 수반한다."},{"en":"This job entails a lot of travel around the country.","ko":"이 일은 전국을 도는 많은 출장을 필요로 한다."}],"grammarNote":"어떤 일에 필연적으로 따라오는 결과나 부담을 나타내는 타동사이다. 뒤에 명사나 동명사(-ing)를 목적어로 취한다. 품사는 동사이다.","grammarQuiz":[{"sentence":"Preparing for the college entrance exam entails _____ very hard every single day.","ko":"대학 입시 준비는 매일 매우 열심히 공부하는 것을 수반한다.","answer":"studying","hint":"타동사 + 동명사(목적어)"}]},
    {"id":"v08619","w":"divergent","pos":["noun"],"ph":"","cefr":"B1","kr":["서로 다른"],"ex":[{"en":"The two writers offered divergent views on the future of Korean literature.","ko":"두 작가는 한국 문학의 미래에 대해 서로 다른 견해를 제시했다."}],"mnemonic":{"soundHint":"di(둘로)+verge(향하다)","story":"converge(모이다)의 반대 → 갈라져 서로 다른","hintConfidence":3},"pairs":{"buddyWords":[{"w":"diverge","ko":"갈라지다","reason":"동사형"},{"w":"convergent","ko":"수렴하는","reason":"반의어"},{"w":"different","ko":"다른","reason":"유의어"}],"collocBest":[{"en":"divergent opinions","ko":"서로 다른 의견"},{"en":"divergent paths","ko":"서로 다른 길"}]},"nuance":{"koSimple":"방향이나 견해가 서로 갈라져 다른 상태","whenToUse":"의견·경로가 뚜렷이 갈릴 때 격식 있게 사용"},"krDetail":[{"ko":"서로 다른","explain":"방향이 갈리는"}],"usageExamples":[{"en":"The team members held divergent opinions about the plan.","ko":"팀원들은 그 계획에 대해 서로 다른 의견을 갖고 있었다."},{"en":"The two roads follow divergent paths through the mountains.","ko":"두 길은 산을 지나며 서로 다른 경로로 갈라진다."}],"grammarNote":"한 지점에서 갈라져 서로 다른 방향으로 나아가는 것을 뜻하는 형용사이다. 동사 diverge(갈라지다)에서 나왔으며 반의어는 convergent(수렴하는)이다. 품사는 형용사이다.","grammarQuiz":[{"sentence":"The two writers _____ offered divergent views on Korean literature won an award.","ko":"한국 문학에 대해 서로 다른 견해를 제시한 두 작가가 상을 받았다.","answer":"who","hint":"관계대명사 주격 who"}]},
    {"id":"v08571","w":"come down with","pos":["phrase"],"ph":"","cefr":"B1","kr":["(별로 심각하지 않은 병에) 걸리다[들다]"],"ex":[{"en":"Many students came down with the flu right before the midterm exams started.","ko":"많은 학생들이 중간고사가 시작되기 직전에 독감에 걸렸다."}],"mnemonic":{"soundHint":"병이 come down(내려오다)","story":"병이 나에게로 내려와(come down) 함께(with) → 병에 걸리다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"catch a cold","ko":"감기 걸리다","reason":"유사표현"},{"w":"contract","ko":"(병에) 걸리다","reason":"유의어"},{"w":"recover from","ko":"~에서 회복하다","reason":"반의어"}],"collocBest":[{"en":"come down with a cold","ko":"감기에 걸리다"},{"en":"come down with the flu","ko":"독감에 걸리다"}]},"nuance":{"koSimple":"감기 같은 가벼운 병에 걸려 앓기 시작하는 것","whenToUse":"심각하지 않은 병에 걸리는 상황을 말할 때 사용"},"krDetail":[{"ko":"(별로 심각하지 않은 병에) 걸리다[들다]","explain":"가벼운 병에 걸리다"}],"usageExamples":[{"en":"I think I'm coming down with a cold; my throat hurts.","ko":"감기에 걸리는 것 같아, 목이 아파."},{"en":"He came down with a fever the night before the trip.","ko":"그는 여행 전날 밤 열이 났다."}],"grammarNote":"with 뒤에는 감기·독감처럼 비교적 가벼운 질병의 이름이 온다. 병이 막 시작되려는 초기 상태를 나타낼 때 진행형으로 자주 쓴다.","grammarQuiz":[{"sentence":"Many students _____ came down with the flu missed the midterm exams entirely.","ko":"독감에 걸린 많은 학생들이 중간고사를 전부 놓쳤다.","answer":"who","hint":"관계대명사 주격 who"}]},
    {"id":"v08691","w":"hit the mark","pos":["phrase"],"ph":"","cefr":"B1","kr":["예상이 들어맞다, 적중하다","목표를 달성하다"],"ex":[{"en":"Her presentation hit the mark and impressed the entire judging panel today.","ko":"그녀의 발표는 적중하여 오늘 심사위원단 전체에게 깊은 인상을 남겼다."}],"mnemonic":{"soundHint":"mark(과녁)을 hit(맞히다)","story":"표적(mark)을 정확히 맞히다 → 적중하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hit the target","ko":"목표를 맞히다","reason":"동의어"},{"w":"miss the mark","ko":"빗나가다","reason":"반의어"},{"w":"succeed","ko":"성공하다","reason":"유의어"}],"collocBest":[{"en":"his prediction hit the mark","ko":"그의 예상이 적중했다"},{"en":"hit the mark with customers","ko":"고객에게 적중하다"}]},"nuance":{"koSimple":"목표나 예상에 딱 들어맞아 성공한 상태","whenToUse":"발표·전략이 정확히 통했을 때 사용"},"krDetail":[{"ko":"예상이 들어맞다, 적중하다","explain":"예상이 딱 맞다"},{"ko":"목표를 달성하다","explain":"목표를 이루다"}],"usageExamples":[{"en":"His guess about the test topic hit the mark perfectly.","ko":"시험 주제에 대한 그의 추측은 완벽하게 적중했다."},{"en":"The company's new ad campaign really hit the mark with teenagers.","ko":"그 회사의 새 광고 캠페인은 십 대들에게 제대로 적중했다."}],"grammarNote":"hit the mark는 '목표나 기대에 정확히 들어맞다'라는 관용구다. 반대로 빗나갈 때는 miss the mark를 쓴다.","grammarQuiz":[{"sentence":"Her presentation, _____ hit the mark perfectly, impressed the entire judging panel.","ko":"완벽하게 적중한 그녀의 발표는 심사위원단 전체에게 깊은 인상을 남겼다.","answer":"which","hint":"관계대명사 계속적 용법(which)"}]},
    {"id":"v08835","w":"run for","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에 출마하다, ~에 입후보하다"],"ex":[{"en":"She decided to run for student council president during her final school year.","ko":"그녀는 학교 마지막 해에 학생회장에 출마하기로 결정했다."}],"mnemonic":{"soundHint":"런 포","story":"run(달리다) + for(자리를 위해) - 그 자리(회장, 대통령)를 향해 달리다 = 출마하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"campaign","ko":"선거 운동을 하다","reason":"출마와 짝을 이루는 활동"},{"w":"candidate","ko":"후보자","reason":"출마의 주체"},{"w":"run against","ko":"~에 맞서 출마하다","reason":"run + 전치사 계열"}],"collocBest":[{"en":"run for president","ko":"대통령에 출마하다"},{"en":"run for office","ko":"공직에 입후보하다"}]},"nuance":{"koSimple":"어떤 자리에 뽑히려고 후보로 나선다는 뜻이에요.","whenToUse":"선거·회장직·공직에 출마할 때 씁니다."},"krDetail":[{"ko":"~에 출마하다, ~에 입후보하다","explain":"선거에 나가다"}],"usageExamples":[{"en":"He plans to run for mayor in the next city election.","ko":"그는 다음 시 선거에서 시장에 출마할 계획이다."},{"en":"Many young people decided to run for local office this year.","ko":"올해 많은 젊은이들이 지역 공직에 출마하기로 결심했다."}],"grammarNote":"'run for + 직위/자리'는 선거에서 그 자리를 얻기 위해 '출마하다'라는 뜻이다. 미국식 표현으로 'run for president(대통령에 출마하다)'처럼 쓴다.","grammarQuiz":[{"sentence":"She decided _____ (run) for student council president during her final school year.","ko":"그녀는 학교 마지막 해에 학생회장에 출마하기로 결정했다.","answer":"to run","hint":"decide + to부정사"}]},
    {"id":"v08769","w":"mysterious","pos":["adj"],"ph":"","cefr":"B1","kr":["신비한","불가사의한","비밀의"],"ex":[{"en":"A mysterious light appeared in the sky above our neighborhood last night.","ko":"지난밤 우리 동네 하늘 위에 신비한 빛이 나타났다."}],"mnemonic":{"soundHint":"미스터리어스","story":"mystery(미스터리) + ous(형용사) — 미스터리한 = 신비한/불가사의한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"mystery","ko":"미스터리, 수수께끼","reason":"동일 어근 명사"},{"w":"strange","ko":"이상한, 낯선","reason":"설명 불가한 느낌 공유"},{"w":"secret","ko":"비밀의","reason":"'비밀의' 의미 겹침"}],"collocBest":[{"en":"mysterious stranger","ko":"신비한 낯선 사람"},{"en":"mysterious disappearance","ko":"불가사의한 실종"}]},"nuance":{"koSimple":"설명하기 어렵고 알 수 없어 신비롭게 느껴지는 느낌이에요.","whenToUse":"정체 모를 사건·인물·현상을 묘사할 때 씁니다."},"krDetail":[{"ko":"신비한","explain":"설명하기 어려운"},{"ko":"불가사의한","explain":"이해할 수 없는"},{"ko":"비밀의","explain":"감춰져 알 수 없는"}],"usageExamples":[{"en":"A mysterious stranger left a note at the front door.","ko":"수수께끼 같은 낯선 사람이 현관에 쪽지를 남겼다."},{"en":"There is something mysterious about that old empty house.","ko":"그 낡고 텅 빈 집에는 무언가 불가사의한 것이 있다."}],"grammarNote":"mysterious는 명사 mystery의 형용사형으로 '신비한, 수수께끼 같은'을 뜻한다. 부사형은 mysteriously이다.","grammarQuiz":[{"sentence":"A mysterious light _____ (appear) in the sky above our neighborhood since last night.","ko":"지난밤부터 우리 동네 하늘 위에 신비한 빛이 나타나 있다.","answer":"has appeared","hint":"since ~ 현재완료"}]},
    {"id":"v08847","w":"single out","pos":["phrase"],"ph":"","cefr":"B1","kr":["선발하다"],"ex":[{"en":"The coach singled out three students for their outstanding effort in yesterday's game.","ko":"코치는 어제 경기에서 뛰어난 노력을 보인 세 명의 학생을 선발했다."}],"mnemonic":{"soundHint":"싱글 아웃","story":"single(한 명)로 out(뽑아냄) - 무리에서 콕 집어 뽑다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"pick","ko":"고르다","reason":"'뽑다'의 기본 동사"},{"w":"select","ko":"선발하다","reason":"동의 표현"},{"w":"point out","ko":"지적하다","reason":"'~ + out' 지목 구동사 계열"}],"collocBest":[{"en":"single out a candidate","ko":"후보를 선발하다"},{"en":"single out for praise","ko":"칭찬받을 사람으로 선발하다"}]},"nuance":{"koSimple":"여럿 중에서 한 사람이나 하나를 콕 집어 골라낸다는 뜻이에요.","whenToUse":"칭찬·비난·선발 등 개별 지목이 필요한 상황에 씁니다."},"krDetail":[{"ko":"선발하다","explain":"하나만 골라내다"}],"usageExamples":[{"en":"The judges singled out her essay as the best of all.","ko":"심사위원들은 그녀의 에세이를 모든 것 중 최고로 뽑았다."},{"en":"Why did the teacher single me out for the difficult question?","ko":"왜 선생님은 어려운 질문에 나를 콕 집어 지목했을까?"}],"grammarNote":"'single out'은 여럿 중에서 하나(또는 한 사람)를 특별히 골라내거나 지목한다는 뜻이다. 'single out A for B(B 때문에 A를 지목하다)' 형태로 자주 쓴다.","grammarQuiz":[{"sentence":"Three students _____ (single) out by the coach for their outstanding effort yesterday.","ko":"어제 뛰어난 노력을 보인 세 명의 학생이 코치에 의해 선발되었다.","answer":"were singled","hint":"수동태 be + p.p."}]},
    {"id":"v08844","w":"set out to do","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에 착수하다, ~을 시작하다"],"ex":[{"en":"He set out to master five foreign languages before turning thirty years old.","ko":"그는 서른이 되기 전에 다섯 개의 외국어를 완전히 익히는 데 착수했다."}],"mnemonic":{"soundHint":"셋 아웃 투 두","story":"set out(길을 나서다) + to do(하기 위해) - 마음먹고 일에 나서다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"embark on","ko":"~에 착수하다","reason":"격식 동의어"},{"w":"begin","ko":"시작하다","reason":"가장 흔한 동의 동사"},{"w":"undertake","ko":"떠맡다, 착수하다","reason":"일에 뛰어드는 뉘앙스 공유"}],"collocBest":[{"en":"set out to prove a theory","ko":"이론을 증명하려 착수하다"},{"en":"set out to change the world","ko":"세상을 바꾸려 시작하다"}]},"nuance":{"koSimple":"어떤 목표를 세우고 본격적으로 일에 착수한다는 뜻이에요.","whenToUse":"포부를 가지고 새 도전이나 프로젝트를 시작할 때 씁니다."},"krDetail":[{"ko":"~에 착수하다, ~을 시작하다","explain":"목표를 향해 시작하다"}],"usageExamples":[{"en":"She set out to learn the piano at the age of forty.","ko":"그녀는 마흔 살에 피아노를 배우기 시작했다."},{"en":"The team set out to build the largest bridge in the country.","ko":"그 팀은 그 나라에서 가장 큰 다리를 짓는 일에 착수했다."}],"grammarNote":"'set out to + 동사원형'은 어떤 목표를 이루기 위해 의도적으로 '착수하다, 나서다'라는 뜻이다. 뒤에는 항상 'to부정사'가 온다.","grammarQuiz":[{"sentence":"He set out _____ (master) five foreign languages before turning thirty years old.","ko":"그는 서른이 되기 전에 다섯 개의 외국어를 완전히 익히는 데 착수했다.","answer":"to master","hint":"set out + to부정사"}]},
    {"id":"v08739","w":"let alone","pos":["phrase"],"ph":"","cefr":"B1","kr":["~은 말할 것도 없이, ~은 고사하고"],"ex":[{"en":"He can barely finish his homework, let alone prepare for the entrance exam.","ko":"그는 입시 준비는 고사하고 숙제도 겨우 끝낸다."}],"mnemonic":{"soundHint":"alone(혼자) 두다(let)","story":"이것도 못 하는데 저것은 alone(내버려)두라 → ~은 고사하고","hintConfidence":1},"pairs":{"buddyWords":[{"w":"not to mention","ko":"~은 말할 것도 없이","reason":"동의어"},{"w":"much less","ko":"하물며 ~은","reason":"유의어"},{"w":"as well as","ko":"~뿐만 아니라","reason":"혼동 주의"}],"collocBest":[{"en":"can't walk, let alone run","ko":"걷지도 못하는데 뛰는 것은 말할 것도 없다"},{"en":"no money, let alone time","ko":"시간은 고사하고 돈도 없다"}]},"nuance":{"koSimple":"쉬운 것도 못 하는데 더 어려운 건 더 못한다는 뜻","whenToUse":"작은 것조차 못함을 강조하는 부정문에 사용"},"krDetail":[{"ko":"~은 말할 것도 없이, ~은 고사하고","explain":"~은커녕"}],"usageExamples":[{"en":"She can't even boil an egg, let alone cook a whole meal.","ko":"그녀는 달걀 하나 삶지도 못하는데, 한 끼 요리는 말할 것도 없다."},{"en":"He was too tired to walk, let alone run.","ko":"그는 걷기도 힘들 만큼 지쳤는데, 뛰는 것은 고사하고."}],"grammarNote":"let alone은 보통 부정문 뒤에 붙어 '~은 고사하고'라는 뜻을 더한다. 앞 내용보다 더 어렵거나 큰 것을 뒤에 두어 대조한다.","grammarQuiz":[{"sentence":"He can barely finish his daily homework, let alone _____ for the entrance exam.","ko":"그는 입시를 준비하는 것은 고사하고, 일일 숙제도 겨우 끝낸다.","answer":"preparing","hint":"let alone + 동명사(병렬)"}]},
    {"id":"v08640","w":"enlightened","pos":["noun"],"ph":"","cefr":"B1","kr":["계몽된"],"ex":[{"en":"The teacher's enlightened approach helped students think more independently in class.","ko":"선생님의 계몽된 접근 방식은 학생들이 수업에서 더 독립적으로 생각하도록 도왔다."}],"mnemonic":{"soundHint":"en(주다)+light(빛)+ened","story":"빛(light)을 받아 깨우침 → 계몽된","hintConfidence":3},"pairs":{"buddyWords":[{"w":"enlighten","ko":"계몽하다","reason":"동사형"},{"w":"enlightenment","ko":"계몽","reason":"명사형"},{"w":"ignorant","ko":"무지한","reason":"반의어"}],"collocBest":[{"en":"enlightened attitude","ko":"계몽된 태도"},{"en":"enlightened society","ko":"계몽된 사회"}]},"nuance":{"koSimple":"편견에서 벗어나 합리적이고 개방된 사고","whenToUse":"태도·정책이 계몽적이고 진보적일 때 사용"},"krDetail":[{"ko":"계몽된","explain":"깨어 있고 합리적인"}],"usageExamples":[{"en":"An enlightened leader listens to many different opinions.","ko":"계몽된 지도자는 여러 다른 의견에 귀를 기울인다."},{"en":"The school has an enlightened policy on student freedom.","ko":"그 학교는 학생의 자유에 대해 계몽된 정책을 갖고 있다."}],"grammarNote":"편견 없이 지식과 이성에 근거해 깨어 있는 상태를 뜻하는 형용사이다. 동사 enlighten(깨우치다, 이해시키다)의 과거분사가 형용사로 굳어진 것이다.","grammarQuiz":[{"sentence":"Teachers _____ have an enlightened approach help students think more independently.","ko":"계몽된 접근 방식을 가진 선생님들은 학생들이 더 독립적으로 생각하도록 돕는다.","answer":"who","hint":"관계대명사 주격 who"}]},
    {"id":"v08817","w":"regress","pos":["verb"],"ph":"","cefr":"B1","kr":["되돌아가다","퇴행[퇴보]하다","귀환, 복귀","퇴행[퇴보]"],"ex":[{"en":"Without regular practice, English skills tend to regress quite rapidly for most learners.","ko":"규칙적인 연습이 없다면, 영어 실력은 대부분의 학습자에게 꽤 빨리 퇴보하는 경향이 있다."}],"mnemonic":{"soundHint":"리그레스","story":"re(뒤로) + gress(가다) — progress(앞으로)의 반대, 뒤로 가다 = 퇴행하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"progress","ko":"전진하다, 진전","reason":"정반대 짝, 세트 학습"},{"w":"digress","ko":"옆길로 새다","reason":"-gress 어근 동일"},{"w":"revert","ko":"되돌아가다","reason":"동의어 계열"}],"collocBest":[{"en":"regress to childhood","ko":"어린 시절로 되돌아가다"},{"en":"regress into old habits","ko":"오래된 습관으로 퇴행하다"}]},"nuance":{"koSimple":"이전의 낮은 단계나 상태로 다시 되돌아간다는 뜻이에요.","whenToUse":"실력·행동·상황이 예전 수준으로 퇴보할 때 씁니다."},"krDetail":[{"ko":"되돌아가다","explain":"이전 상태로 돌아가다"},{"ko":"퇴행[퇴보]하다","explain":"나빠져 뒤로 가다"},{"ko":"귀환, 복귀","explain":"본래대로 돌아옴"},{"ko":"퇴행[퇴보]","explain":"발전이 뒤로 감"}],"usageExamples":[{"en":"Without practice, his skills began to regress quickly.","ko":"연습이 없자 그의 실력은 빠르게 퇴보하기 시작했다."},{"en":"The patient regressed to childhood behavior under great stress.","ko":"그 환자는 극심한 스트레스 속에서 어린 시절 행동으로 퇴행했다."}],"grammarNote":"'regress'는 '앞으로 나아가다'인 'progress'의 반대말로, 이전 상태로 후퇴·퇴보함을 뜻한다. 동사와 명사로 모두 쓰이며 'regress to ~(~로 퇴행하다)' 형태가 흔하다.","grammarQuiz":[{"sentence":"Without regular practice, English skills tend to regress rapidly for most learners _____ study alone.","ko":"규칙적인 연습이 없다면, 영어 실력은 혼자 공부하는 대부분의 학습자에게 빨리 퇴보하는 경향이 있다.","answer":"who","hint":"관계대명사 주격 (사람)"}]},
    {"id":"v08523","w":"asteroid","pos":["noun"],"ph":"","cefr":"B1","kr":["소행성"],"ex":[{"en":"Astronomers discovered a huge asteroid passing near Earth last week.","ko":"천문학자들은 지난주 지구 근처를 지나가는 거대한 소행성을 발견했다."}],"mnemonic":{"soundHint":"aster(별)+oid(모양)","story":"aster(별) 모양(oid) → 별 같은 것 = 소행성","hintConfidence":3},"pairs":{"buddyWords":[{"w":"comet","ko":"혜성","reason":"관련어"},{"w":"meteor","ko":"유성","reason":"관련어"},{"w":"planet","ko":"행성","reason":"관련어"}],"collocBest":[{"en":"a giant asteroid","ko":"거대한 소행성"},{"en":"the asteroid belt","ko":"소행성대"}]},"nuance":{"koSimple":"태양 주위를 도는 작은 암석 천체인 소행성","whenToUse":"우주·천문학 문맥에서 작은 천체를 가리킬 때 사용"},"krDetail":[{"ko":"소행성","explain":"태양 주위를 도는 작은 천체"}],"usageExamples":[{"en":"A giant asteroid may have caused the dinosaurs to disappear.","ko":"거대한 소행성이 공룡을 사라지게 했을지도 모른다."},{"en":"Scientists track every asteroid that comes close to Earth.","ko":"과학자들은 지구에 가까이 오는 모든 소행성을 추적한다."}],"grammarNote":"가산명사로, 화성과 목성 사이의 소행성대(asteroid belt)에 많이 분포한다. comet(혜성)·meteor(유성)와 구별된다.","grammarQuiz":[{"sentence":"The huge asteroid _____ astronomers discovered last week was passing near Earth.","ko":"지난주 천문학자들이 발견한 그 거대한 소행성은 지구 근처를 지나가고 있었다.","answer":"which","hint":"관계대명사 목적격(which/that)"}]},
    {"id":"v08778","w":"outdated","pos":["noun"],"ph":"","cefr":"B1","kr":["구식의"],"ex":[{"en":"This textbook contains outdated information that no longer reflects modern research.","ko":"이 교과서에는 현대 연구를 더 이상 반영하지 않는 구식의 정보가 담겨 있다."}],"mnemonic":{"soundHint":"아웃데이티드","story":"out(밖으로) + date(날짜) + ed — 날짜(유효기간)가 지나 밀려난 = 구식의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"obsolete","ko":"구식의, 쓸모없어진","reason":"동의어 형용사"},{"w":"old-fashioned","ko":"구식의","reason":"동일한 '시대에 뒤진' 의미"},{"w":"up-to-date","ko":"최신의","reason":"정반대 짝, 대조 학습용"}],"collocBest":[{"en":"outdated technology","ko":"구식의 기술"},{"en":"outdated information","ko":"구식의 정보"}]},"nuance":{"koSimple":"시대에 뒤떨어져 더 이상 쓸모가 없다는 뜻이에요.","whenToUse":"낡은 정보·기술·방식이 이미 구식이 됐을 때 씁니다."},"krDetail":[{"ko":"구식의","explain":"낡아 쓸모없어진"}],"usageExamples":[{"en":"The company still uses outdated computers from ten years ago.","ko":"그 회사는 아직도 10년 전의 구식 컴퓨터를 사용한다."},{"en":"His ideas about fashion are completely outdated now.","ko":"패션에 대한 그의 생각은 이제 완전히 구식이다."}],"grammarNote":"outdated는 '시대에 뒤진, 구식의'라는 뜻의 형용사로 out of date와 같은 의미다. 반대말은 up to date(최신의)이다.","grammarQuiz":[{"sentence":"This textbook contains outdated information _____ no longer reflects modern research.","ko":"이 교과서에는 현대 연구를 더 이상 반영하지 않는 구식의 정보가 담겨 있다.","answer":"which","hint":"관계대명사 주격"}]},
    {"id":"v08793","w":"pollen","pos":["noun"],"ph":"","cefr":"B1","kr":["꽃가루"],"ex":[{"en":"Every spring, high pollen levels make many Korean students suffer from allergies.","ko":"매년 봄, 높은 꽃가루 수치는 많은 한국 학생들이 알레르기로 고생하게 만든다."}],"mnemonic":{"soundHint":"폴렌","story":"봄에 노란 '폴렌'이 콧속으로 들어와 재채기 — 꽃가루","hintConfidence":1},"pairs":{"buddyWords":[{"w":"pollinate","ko":"수분하다","reason":"동일 어근 동사"},{"w":"allergy","ko":"알레르기","reason":"pollen allergy 강한 연상"},{"w":"bee","ko":"벌","reason":"꽃가루를 옮기는 대표 매개체"}],"collocBest":[{"en":"pollen allergy","ko":"꽃가루 알레르기"},{"en":"spread pollen","ko":"꽃가루를 퍼뜨리다"}]},"nuance":{"koSimple":"꽃에서 나오는 미세한 가루로 꽃가루를 뜻해요.","whenToUse":"봄철 알레르기나 식물 수분을 말할 때 씁니다."},"krDetail":[{"ko":"꽃가루","explain":"꽃의 노란 가루"}],"usageExamples":[{"en":"Bees carry pollen from one flower to another.","ko":"벌들은 꽃가루를 이 꽃에서 저 꽃으로 옮긴다."},{"en":"The pollen count is very high on windy spring days.","ko":"바람 부는 봄날에는 꽃가루 농도가 매우 높다."}],"grammarNote":"pollen은 셀 수 없는 명사로 '꽃가루'를 뜻한다. 알레르기를 유발하는 물질로 pollen allergy, pollen count(꽃가루 농도) 등으로 쓰인다.","grammarQuiz":[{"sentence":"Every spring, high pollen levels make many Korean students _____ (suffer) from allergies.","ko":"매년 봄, 높은 꽃가루 수치는 많은 한국 학생들이 알레르기로 고생하게 만든다.","answer":"suffer","hint":"사역동사 make + 원형부정사 (5형식)"}]},
    {"id":"v08724","w":"inspection","pos":["noun"],"ph":"","cefr":"B1","kr":["조사, 점검","시찰"],"ex":[{"en":"The government conducted a thorough inspection of every school cafeteria last month.","ko":"정부는 지난달 모든 학교 급식실에 대한 철저한 조사를 실시했다."}],"mnemonic":{"soundHint":"in(안)+spect(보다)+ion","story":"안(in)까지 들여다(spect)보다 → 조사·점검","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inspect","ko":"조사하다","reason":"동사형"},{"w":"examination","ko":"검사","reason":"유의어"},{"w":"inspector","ko":"조사관","reason":"파생어"}],"collocBest":[{"en":"close inspection","ko":"면밀한 조사"},{"en":"routine inspection","ko":"정기 점검"}]},"nuance":{"koSimple":"이상 여부를 꼼꼼히 살피는 공식적인 점검","whenToUse":"공공기관·전문가의 조사를 격식 있게 말할 때 사용"},"krDetail":[{"ko":"조사, 점검","explain":"꼼꼼히 살펴봄"},{"ko":"시찰","explain":"현장을 둘러봄"}],"usageExamples":[{"en":"The car passed its yearly safety inspection without any problems.","ko":"그 차는 연례 안전 점검을 아무 문제 없이 통과했다."},{"en":"The mayor made an inspection of the new subway line.","ko":"시장은 새 지하철 노선을 시찰했다."}],"grammarNote":"inspection은 동사 inspect의 명사형이다. on closer inspection(자세히 살펴보니)이라는 표현으로 자주 쓰인다.","grammarQuiz":[{"sentence":"Every school cafeteria _____ thoroughly by the government just last month.","ko":"모든 학교 급식실이 바로 지난달 정부에 의해 철저히 조사되었다.","answer":"was inspected","hint":"수동태 과거"}]},
    {"id":"v08538","w":"basin","pos":["noun"],"ph":"","cefr":"B1","kr":["웅덩이","(하천의) 유역, 분지","양푼, 대야"],"ex":[{"en":"The Amazon basin contains the largest rainforest ecosystem on our planet.","ko":"아마존 유역은 지구상에서 가장 큰 열대우림 생태계를 품고 있다."}],"mnemonic":{"soundHint":"베이슨 = 배(舟)가 담기는 곳","story":"물이 담기는 커다란 대야·유역 이미지","hintConfidence":1},"pairs":{"buddyWords":[{"w":"bowl","ko":"그릇","reason":"유의어"},{"w":"valley","ko":"계곡","reason":"관련어"},{"w":"watershed","ko":"분수령·유역","reason":"유의어"}],"collocBest":[{"en":"the Amazon basin","ko":"아마존 유역"},{"en":"a wash basin","ko":"세면대"}]},"nuance":{"koSimple":"물이 고이는 우묵한 지형이나 그릇 모양을 뜻함","whenToUse":"강 유역·분지 같은 지형이나 세면대를 가리킬 때 사용"},"krDetail":[{"ko":"웅덩이","explain":"물이 고인 곳"},{"ko":"(하천의) 유역, 분지","explain":"강이 흐르는 지역"},{"ko":"양푼, 대야","explain":"물 담는 둥근 그릇"}],"usageExamples":[{"en":"Farmers in the river basin depend heavily on the yearly floods.","ko":"강 유역의 농부들은 해마다 오는 홍수에 크게 의존한다."},{"en":"She filled the basin with warm water to wash the dishes.","ko":"그녀는 설거지를 하려고 대야에 따뜻한 물을 채웠다."}],"grammarNote":"지리 지문에서는 주로 '유역·분지'의 뜻으로 the Amazon basin처럼 쓰이고, 일상에서는 '대야·세면대'를 가리키는 등 문맥에 따라 뜻이 크게 달라진다.","grammarQuiz":[{"sentence":"The Amazon basin, _____ contains the largest rainforest ecosystem, is truly precious.","ko":"가장 큰 열대우림 생태계를 품고 있는 아마존 유역은 정말 소중하다.","answer":"which","hint":"관계대명사 계속적 용법(which)"}]},
    {"id":"v08790","w":"physiological","pos":["adj"],"ph":"","cefr":"B1","kr":["생리적인"],"ex":[{"en":"Stress causes many physiological changes that can affect a student's overall health.","ko":"스트레스는 학생의 전반적인 건강에 영향을 미칠 수 있는 많은 생리적 변화를 일으킨다."}],"mnemonic":{"soundHint":"피지올로지컬","story":"physiology(생리학) + cal(형용사) — 생리학의 = 생리적인","hintConfidence":2},"pairs":{"buddyWords":[{"w":"physical","ko":"신체적인","reason":"phys- 어근 공유, 신체 관련"},{"w":"biological","ko":"생물학적인","reason":"-logical 접미 동일 패턴, 생명 현상 계열"},{"w":"physiology","ko":"생리학","reason":"동일 어근 명사"}],"collocBest":[{"en":"physiological response","ko":"생리적인 반응"},{"en":"physiological needs","ko":"생리적인 욕구"}]},"nuance":{"koSimple":"몸의 생리적 기능이나 작용과 관련된다는 뜻이에요.","whenToUse":"호르몬·혈압 같은 신체 반응을 학술적으로 말할 때 씁니다."},"krDetail":[{"ko":"생리적인","explain":"몸의 작용에 관한"}],"usageExamples":[{"en":"Fear produces clear physiological responses like a racing heart.","ko":"공포는 심장이 빨리 뛰는 것 같은 뚜렷한 생리적 반응을 일으킨다."},{"en":"Sleep has an important physiological effect on the brain.","ko":"수면은 뇌에 중요한 생리적 영향을 미친다."}],"grammarNote":"physiological은 physiology(생리학)의 형용사형으로 신체의 기능이나 작용에 관한 것을 뜻한다. 심리적인 psychological과 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"Stress causes many physiological changes _____ can affect a student's health.","ko":"스트레스는 학생의 건강에 영향을 미칠 수 있는 많은 생리적 변화를 일으킨다.","answer":"that","hint":"관계대명사 주격"}]},
    {"id":"v08556","w":"by no means","pos":["phrase"],"ph":"","cefr":"B1","kr":["결코 ~이 아닌"],"ex":[{"en":"Learning a foreign language is by no means an easy task for most students.","ko":"외국어를 배우는 것은 대부분의 학생들에게 결코 쉬운 일이 아니다."}],"mnemonic":{"soundHint":"no means = 어떤 수단으로도 안 됨","story":"어떤 방법(means)으로도 안 된다 → 결코 아닌","hintConfidence":2},"pairs":{"buddyWords":[{"w":"not at all","ko":"전혀 아닌","reason":"동의어"},{"w":"in no way","ko":"결코 아닌","reason":"동의어"},{"w":"by all means","ko":"물론이지·꼭","reason":"반의어"}],"collocBest":[{"en":"by no means easy","ko":"결코 쉽지 않은"},{"en":"by no means finished","ko":"결코 끝난 것이 아닌"}]},"nuance":{"koSimple":"어떤 경우에도 결코 그렇지 않다는 강한 부정","whenToUse":"부정문 앞에서 절대 아님을 강조하며 사용"},"krDetail":[{"ko":"결코 ~이 아닌","explain":"전혀 아닌"}],"usageExamples":[{"en":"The test was by no means as hard as I had feared.","ko":"그 시험은 내가 걱정했던 만큼 결코 어렵지 않았다."},{"en":"He is by no means the best player, but he tries hard.","ko":"그는 결코 최고의 선수는 아니지만 열심히 노력한다."}],"grammarNote":"강한 부정을 나타내는 부사구로 not보다 뜻이 강하다. 문장 앞에 오면 주어와 동사가 도치되기도 한다(By no means is it easy).","grammarQuiz":[{"sentence":"If English were simple, mastering it _____ so much time and effort.","ko":"영어가 단순하다면, 그것을 익히는 데 그렇게 많은 시간과 노력이 필요하지 않을 것이다.","answer":"would not require","hint":"가정법 과거"}]},
    {"id":"v08622","w":"doctorate","pos":["noun"],"ph":"","cefr":"B1","kr":["박사 학위"],"ex":[{"en":"She earned her doctorate in physics from a top university in Seoul.","ko":"그녀는 서울의 명문 대학에서 물리학 박사 학위를 취득했다."}],"mnemonic":{"soundHint":"doctor(박사)+ate(자격)","story":"doctor(박사) 자격증 → 박사 학위","hintConfidence":3},"pairs":{"buddyWords":[{"w":"doctoral","ko":"박사의","reason":"형용사형"},{"w":"PhD","ko":"박사학위","reason":"동의어"},{"w":"master's","ko":"석사학위","reason":"관련어"}],"collocBest":[{"en":"earn a doctorate","ko":"박사 학위를 취득하다"},{"en":"honorary doctorate","ko":"명예 박사 학위"}]},"nuance":{"koSimple":"대학원 최고 과정을 마치고 받는 박사 학위","whenToUse":"학문적 최고 자격을 언급할 때 공식적으로 사용"},"krDetail":[{"ko":"박사 학위","explain":"최고 대학 학위"}],"usageExamples":[{"en":"It took him six years to complete his doctorate.","ko":"그가 박사 학위를 마치는 데 6년이 걸렸다."},{"en":"She hopes to earn a doctorate in history next year.","ko":"그녀는 내년에 역사학 박사 학위를 받기를 바란다."}],"grammarNote":"박사 학위를 뜻하는 명사로 earn/complete/hold a doctorate처럼 쓴다. 박사 학위 소지자인 사람은 doctor라고 부른다.","grammarQuiz":[{"sentence":"The physicist _____ earned her doctorate in Seoul now teaches at a foreign university.","ko":"서울에서 박사 학위를 취득한 그 물리학자는 지금 외국 대학에서 가르친다.","answer":"who","hint":"관계대명사 주격 who"}]},

    {"id":"v08766","w":"mould","pos":["noun"],"ph":"","cefr":"B1","kr":["틀, 만들다"],"ex":[{"en":"Great teachers mould the character of young students during their crucial school years.","ko":"훌륭한 교사들은 결정적인 학창 시절 동안 어린 학생들의 인격을 형성한다."}],"mnemonic":{"soundHint":"몰드","story":"붕어빵 '몰드(mould)' — 반죽을 부어 모양을 잡는 틀, 그래서 인격을 '만들다'","hintConfidence":2},"pairs":{"buddyWords":[{"w":"shape","ko":"형태를 잡다","reason":"'틀에 넣어 모양 잡다' 의미 겹침"},{"w":"form","ko":"형성하다","reason":"인격·성격을 형성한다는 동일 용법"},{"w":"cast","ko":"주조하다","reason":"틀에 부어 만드는 물리적 이미지 공유"}],"collocBest":[{"en":"break the mould","ko":"틀을 깨다"},{"en":"mould the clay","ko":"점토를 만들다"}]},"nuance":{"koSimple":"무언가를 특정한 모양이나 성격으로 빚어낸다는 뜻이에요.","whenToUse":"찰흙 같은 물체나 사람의 인격을 형성할 때 씁니다."},"krDetail":[{"ko":"틀, 만들다","explain":"모양을 잡는 틀"}],"usageExamples":[{"en":"The hot metal was poured into a mould to cool.","ko":"뜨거운 금속을 틀에 부어 식혔다."},{"en":"Good habits help mould a child's future character.","ko":"좋은 습관은 아이의 미래 성격을 형성하는 데 도움이 된다."}],"grammarNote":"mould(미국식 mold)는 명사로 '틀', 동사로 '(틀에 넣어) 만들다, 형성하다'를 뜻한다. 성격이나 인재를 '길러내다'라는 비유적 의미로도 쓰인다.","grammarQuiz":[{"sentence":"The character of young students is _____ (mould) by great teachers.","ko":"어린 학생들의 인격은 훌륭한 교사들에 의해 형성된다.","answer":"moulded","hint":"수동태 be + p.p."}]},
    {"id":"v08496","w":"acquisition","pos":["noun"],"ph":"","cefr":"B1","kr":["습득, 취득"],"ex":[{"en":"Language acquisition happens most rapidly during early childhood years.","ko":"언어 습득은 유년기 초기에 가장 빠르게 일어난다."}],"mnemonic":{"soundHint":"애퀴지션","story":"acquire(습득하다) + tion = 습득한 것 = 취득!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"acquire","ko":"습득하다","reason":"acquisition의 동사형"},{"w":"obtain","ko":"얻다","reason":"acquisition 유사어"},{"w":"language","ko":"언어","reason":"language acquisition 콜로케이션"}],"collocBest":[{"en":"language acquisition","ko":"언어 습득"},{"en":"the acquisition of knowledge","ko":"지식의 습득"}]},"nuance":{"koSimple":"지식·기술·자산 등을 새로 얻어 손에 넣는 습득이다.","whenToUse":"언어 학습·기업 인수 등 획득 상황에 두루 쓴다."},"krDetail":[{"ko":"습득, 취득","explain":"지식·물건을 얻어 가짐"}],"usageExamples":[{"en":"The acquisition of new skills takes time and practice.","ko":"새로운 기술의 습득에는 시간과 연습이 필요하다."},{"en":"The company announced the acquisition of a smaller firm.","ko":"그 회사는 더 작은 회사의 인수를 발표했다."}],"grammarNote":"동사 acquire(얻다)의 명사형이다. '언어 습득(language acquisition)'과 기업 '인수' 두 문맥에서 자주 쓰인다.","grammarQuiz":[{"sentence":"Early childhood is the period _____ language acquisition happens most rapidly.","ko":"유년기 초기는 언어 습득이 가장 빠르게 일어나는 시기이다.","answer":"when","hint":"관계부사 when"}]},
    {"id":"v08613","w":"displacement","pos":["noun"],"ph":"","cefr":"B1","kr":["이동","대체","해고, 면직"],"ex":[{"en":"The earthquake caused the mass displacement of thousands of local residents.","ko":"지진은 수천 명의 지역 주민들의 대규모 이동을 야기했다."}],"mnemonic":{"soundHint":"dis(떨어진)+place(장소)+ment","story":"제자리(place)에서 벗어남(dis) → 이동·대체","hintConfidence":3},"pairs":{"buddyWords":[{"w":"displace","ko":"이동시키다","reason":"동사형"},{"w":"relocation","ko":"재배치","reason":"유의어"},{"w":"movement","ko":"이동","reason":"유의어"}],"collocBest":[{"en":"mass displacement of people","ko":"대규모 인구 이동"},{"en":"job displacement","ko":"일자리 대체"}]},"nuance":{"koSimple":"원래 자리에서 다른 곳으로 밀려나 이동함","whenToUse":"주민 이주·물리적 이동·대체 현상을 말할 때 사용"},"krDetail":[{"ko":"이동","explain":"제자리에서 옮겨짐"},{"ko":"대체","explain":"다른 것으로 바뀜"},{"ko":"해고, 면직","explain":"자리에서 밀려남"}],"usageExamples":[{"en":"The war caused the displacement of millions of families.","ko":"그 전쟁은 수백만 가족의 이동(피난)을 초래했다."},{"en":"New machines led to the displacement of many factory workers.","ko":"새로운 기계는 많은 공장 노동자의 대체(밀려남)로 이어졌다."}],"grammarNote":"동사 displace(밀어내다, 대체하다)의 명사형으로, 사람이 살던 곳에서 쫓겨나는 '강제 이주'의 뜻으로도 자주 쓰인다. 보통 불가산 명사이다.","grammarQuiz":[{"sentence":"Thousands of local residents _____ from their homes by the sudden earthquake.","ko":"수천 명의 지역 주민들이 갑작스러운 지진으로 집에서 이동되었다.","answer":"were displaced","hint":"수동태 과거"}]},
    {"id":"v08631","w":"draw on","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 활용하다","~에 의지하다"],"ex":[{"en":"The novelist drew on her own childhood experiences to write the touching story.","ko":"그 소설가는 자신의 어린 시절 경험을 활용하여 감동적인 이야기를 썼다."}],"mnemonic":{"soundHint":"draw(끌어당김)+on","story":"경험을 끌어당겨(draw) 사용하다 → 활용하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"make use of","ko":"활용하다","reason":"동의어"},{"w":"utilize","ko":"이용하다","reason":"유의어"},{"w":"rely on","ko":"의지하다","reason":"유의어"}],"collocBest":[{"en":"draw on experience","ko":"경험을 활용하다"},{"en":"draw on resources","ko":"자원을 활용하다"}]},"nuance":{"koSimple":"가진 경험이나 자원을 끌어내 활용하는 것","whenToUse":"경험·지식·자금을 밑천 삼아 쓸 때 사용"},"krDetail":[{"ko":"~을 활용하다","explain":"가진 것을 끌어 쓰다"},{"ko":"~에 의지하다","explain":"기대어 이용하다"}],"usageExamples":[{"en":"The writer drew on her travels to create the story.","ko":"그 작가는 자신의 여행 경험을 활용하여 이야기를 만들었다."},{"en":"In the debate, he drew on facts he had learned in class.","ko":"토론에서 그는 수업에서 배운 사실들을 활용했다."}],"grammarNote":"경험·지식·자원 등을 끌어와 활용한다는 뜻으로 on 뒤에 활용 대상이 온다. draw on one's experience(경험을 활용하다)가 대표적인 짝이다.","grammarQuiz":[{"sentence":"_____ on her own childhood experiences, the novelist wrote a truly touching story.","ko":"자신의 어린 시절 경험을 활용하여, 그 소설가는 정말 감동적인 이야기를 썼다.","answer":"Drawing","hint":"분사구문"}]},

    {"id":"v08751","w":"make one's own way","pos":["phrase"],"ph":"","cefr":"B1","kr":["나아가다, 자신의 길을 개척하다","출세하다"],"ex":[{"en":"After graduation, he had to make his own way in the competitive business world.","ko":"졸업 후, 그는 경쟁적인 비즈니스 세계에서 자신의 길을 개척해야 했다."}],"mnemonic":{"soundHint":"자신의(own) 길(way)을 make(만들다)","story":"스스로 자기 길(way)을 만들어 나감 → 개척하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"forge ahead","ko":"나아가다","reason":"유의어"},{"w":"carve a path","ko":"길을 개척하다","reason":"유의어"},{"w":"succeed","ko":"출세하다","reason":"관련어"}],"collocBest":[{"en":"make one's own way in life","ko":"인생에서 자신의 길을 개척하다"},{"en":"make one's own way in the world","ko":"세상에서 출세하다"}]},"nuance":{"koSimple":"남의 도움 없이 스스로 인생을 개척해 나감","whenToUse":"자립·성공 스토리를 격려조로 말할 때 사용"},"krDetail":[{"ko":"나아가다, 자신의 길을 개척하다","explain":"스스로 길을 열다"},{"ko":"출세하다","explain":"혼자 힘으로 성공하다"}],"usageExamples":[{"en":"She left home young and made her own way in the city.","ko":"그녀는 어린 나이에 집을 떠나 도시에서 스스로 길을 개척했다."},{"en":"Without any help, he made his own way to the top.","ko":"아무 도움 없이 그는 스스로 정상에 올랐다."}],"grammarNote":"make one's own way는 소유격(one's)을 상황에 맞게 바꿔 쓰며 '스스로 길을 헤쳐 나가다, 자립하다'라는 뜻이다.","grammarQuiz":[{"sentence":"After graduating from college, he had _____ (make) his own way in the tough world.","ko":"대학을 졸업한 후, 그는 힘든 세상에서 자신의 길을 개척해야 했다.","answer":"to make","hint":"have to + 동사원형"}]},

    {"id":"v08535","w":"attribute to","pos":["phrase"],"ph":"","cefr":"B1","kr":["~ 때문이라 여기다, ~ 덕분으로 돌리다"],"ex":[{"en":"Many experts attribute the students' success to consistent daily study habits.","ko":"많은 전문가들이 학생들의 성공을 꾸준한 일일 학습 습관 덕분으로 돌린다."}],"mnemonic":{"soundHint":"at+tribute(공물·찬사)","story":"tribute(공물·찬사)를 ~에게 바치다 → ~덕분으로 돌리다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ascribe","ko":"~탓으로 돌리다","reason":"동의어"},{"w":"credit","ko":"공을 돌리다","reason":"유의어"},{"w":"attribute","ko":"속성, 특성","reason":"명사"}],"collocBest":[{"en":"attribute success to hard work","ko":"성공을 노력의 덕분으로 돌리다"},{"en":"attribute the failure to bad luck","ko":"실패를 불운 때문이라 여기다"}]},"nuance":{"koSimple":"어떤 결과의 원인이나 공을 특정 대상에 돌림","whenToUse":"성공·실패의 원인을 논리적으로 귀속시킬 때 사용"},"krDetail":[{"ko":"~ 때문이라 여기다, ~ 덕분으로 돌리다","explain":"원인이라고 보다"}],"usageExamples":[{"en":"Doctors attribute the illness to a lack of clean drinking water.","ko":"의사들은 그 병을 깨끗한 식수의 부족 때문이라고 여긴다."},{"en":"She attributed her success to the support of her family.","ko":"그녀는 자신의 성공을 가족의 지지 덕분으로 돌렸다."}],"grammarNote":"attribute A to B(A를 B의 탓/덕으로 돌리다) 구조로 쓰며, to 뒤에는 원인이 되는 명사가 온다. 명사 attribute(속성)와 발음·의미가 다르니 주의한다.","grammarQuiz":[{"sentence":"The students' success _____ to consistent daily study habits by many experts.","ko":"학생들의 성공은 많은 전문가들에 의해 꾸준한 일일 학습 습관 덕분으로 여겨진다.","answer":"is attributed","hint":"수동태 현재"}]},

    {"id":"v08595","w":"deduce","pos":["phrase"],"ph":"","cefr":"B1","kr":["(결론·진리 등을) 추론[추정]하다, 연역(演繹)하다"],"ex":[{"en":"From the clues, the detective was able to deduce the identity of the criminal.","ko":"단서들로부터 그 형사는 범인의 신원을 추론할 수 있었다."}],"mnemonic":{"soundHint":"de(아래로)+duce(이끌다)","story":"증거에서 결론을 아래로(de) 끌어내다(duce) → 추론","hintConfidence":3},"pairs":{"buddyWords":[{"w":"deduction","ko":"추론·연역","reason":"명사형"},{"w":"infer","ko":"추론하다","reason":"유의어"},{"w":"conclude","ko":"결론짓다","reason":"유의어"}],"collocBest":[{"en":"deduce the truth","ko":"진실을 추론하다"},{"en":"deduce from the evidence","ko":"증거로부터 추정하다"}]},"nuance":{"koSimple":"주어진 단서에서 논리적으로 결론을 이끌어 냄","whenToUse":"증거·전제로 이성적 추론을 할 때 격식 있게 사용"},"krDetail":[{"ko":"(결론·진리 등을) 추론[추정]하다, 연역(演繹)하다","explain":"단서로 결론을 내다"}],"usageExamples":[{"en":"From her accent, we deduced that she was from the south.","ko":"그녀의 억양으로 우리는 그녀가 남부 출신임을 추론했다."},{"en":"Scientists deduced the cause of the illness from the symptoms.","ko":"과학자들은 증상으로부터 그 병의 원인을 추론했다."}],"grammarNote":"이미 아는 사실이나 단서를 바탕으로 논리적 결론을 이끌어 내는 것을 뜻하며, deduce that절이나 deduce A from B 형태로 쓴다. 명사형은 deduction이다.","grammarQuiz":[{"sentence":"The detective _____ deduced the criminal's identity from tiny clues became famous.","ko":"작은 단서들로부터 범인의 신원을 추론해 낸 그 형사는 유명해졌다.","answer":"who","hint":"관계대명사 주격 who"}]},
    {"id":"v08550","w":"be liable to do","pos":["phrase"],"ph":"","cefr":"B1","kr":["~하기 쉽다"],"ex":[{"en":"Teenagers are liable to make impulsive decisions when they feel strong emotions.","ko":"십 대들은 강한 감정을 느낄 때 충동적인 결정을 내리기 쉽다."}],"mnemonic":{"soundHint":"liable = 라이-어블 (책임 있는·~하기 쉬운)","story":"책임(liable)질 위험이 있어 자꾸 그러기 쉬운","hintConfidence":1},"pairs":{"buddyWords":[{"w":"be prone to","ko":"~하기 쉬운","reason":"동의어"},{"w":"be likely to","ko":"~할 가능성이 있는","reason":"유의어"},{"w":"liable","ko":"책임 있는·~하기 쉬운","reason":"핵심어"}],"collocBest":[{"en":"be liable to make mistakes","ko":"실수하기 쉽다"},{"en":"be liable to forget","ko":"잊어버리기 쉽다"}]},"nuance":{"koSimple":"어떤 일을 할 가능성이 높거나 그런 경향이 있음","whenToUse":"바람직하지 않은 일이 생길 가능성을 말할 때 사용"},"krDetail":[{"ko":"~하기 쉽다","explain":"그렇게 되기 쉽다"}],"usageExamples":[{"en":"Old machines are liable to break down without regular care.","ko":"오래된 기계는 정기적으로 관리하지 않으면 고장 나기 쉽다."},{"en":"People are liable to forget names when they are nervous.","ko":"사람들은 긴장하면 이름을 잊어버리기 쉽다."}],"grammarNote":"liable to 뒤에는 동사원형이 와서 '(바람직하지 않은 일을) 하기 쉽다'를 뜻한다. liable to 뒤에 명사가 오면 '~의 책임이 있다, ~에 걸리기 쉽다'의 뜻이 된다.","grammarQuiz":[{"sentence":"Teenagers, _____ feel strong emotions easily, are liable to make impulsive decisions.","ko":"쉽게 강한 감정을 느끼는 십 대들은 충동적인 결정을 내리기 쉽다.","answer":"who","hint":"관계대명사 계속적 용법(who)"}]},
    {"id":"v08730","w":"keep ~ in check","pos":["phrase"],"ph":"","cefr":"B1","kr":["~을 억제하다"],"ex":[{"en":"Daily exercise helps keep stress and anxiety in check during busy exam periods.","ko":"매일의 운동은 바쁜 시험 기간 동안 스트레스와 불안을 억제하는 데 도움이 된다."}],"mnemonic":{"soundHint":"check(체스의 견제) 상태로 유지","story":"체스의 check처럼 계속 견제 → 억제하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"control","ko":"통제하다","reason":"유의어"},{"w":"restrain","ko":"억제하다","reason":"유의어"},{"w":"unleash","ko":"풀어놓다","reason":"반의어"}],"collocBest":[{"en":"keep emotions in check","ko":"감정을 억제하다"},{"en":"keep spending in check","ko":"지출을 억제하다"}]},"nuance":{"koSimple":"어떤 대상이 커지지 않도록 눌러 조절하는 것","whenToUse":"감정·비용·바이러스 등을 통제할 때 사용"},"krDetail":[{"ko":"~을 억제하다","explain":"커지지 않게 막다"}],"usageExamples":[{"en":"Regular check-ups help keep the disease in check.","ko":"정기 검진은 그 병을 억제하는 데 도움이 된다."},{"en":"He tried hard to keep his temper in check during the argument.","ko":"그는 말다툼 중에 화를 참으려고 무척 애썼다."}],"grammarNote":"keep ~ in check는 목적어를 중간에 넣어 '~을 억제하다, 통제하다'라는 뜻으로 쓴다. 감정, 비용, 질병 등을 통제할 때 자주 등장한다.","grammarQuiz":[{"sentence":"_____ daily helps keep both stress and anxiety in check during busy exam periods.","ko":"매일 운동하는 것은 바쁜 시험 기간 동안 스트레스와 불안을 억제하는 데 도움이 된다.","answer":"Exercising","hint":"동명사 주어"}]},
    {"id":"v08697","w":"hypnosis","pos":["noun"],"ph":"","cefr":"B1","kr":["최면 (상태)","최면술"],"ex":[{"en":"Some psychologists use hypnosis to help patients recover forgotten childhood memories.","ko":"일부 심리학자들은 환자들이 잊혀진 어린 시절 기억을 회복하도록 최면을 사용한다."}],"mnemonic":{"soundHint":"hypno(잠)+sis","story":"그리스 신 Hypnos(잠의 신)에서 유래 → 최면","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hypnotize","ko":"최면을 걸다","reason":"동사형"},{"w":"trance","ko":"몰아지경","reason":"유의어"},{"w":"hypnotic","ko":"최면의","reason":"형용사형"}],"collocBest":[{"en":"under hypnosis","ko":"최면 상태에서"},{"en":"undergo hypnosis","ko":"최면술을 받다"}]},"nuance":{"koSimple":"의식을 깊이 이완시켜 암시에 반응하는 최면","whenToUse":"심리 치료·무대 최면 등을 언급할 때 사용"},"krDetail":[{"ko":"최면 (상태)","explain":"잠든 듯한 무의식 상태"},{"ko":"최면술","explain":"최면을 거는 기술"}],"usageExamples":[{"en":"Under hypnosis, the patient described a memory from childhood.","ko":"최면 상태에서 그 환자는 어린 시절의 기억을 묘사했다."},{"en":"The doctor used hypnosis to help him stop smoking.","ko":"그 의사는 그가 담배를 끊도록 최면술을 사용했다."}],"grammarNote":"hypnosis는 셀 수 없는 명사이며 under hypnosis(최면 상태에서)라는 표현으로 자주 쓰인다. 동사형은 hypnotize이다.","grammarQuiz":[{"sentence":"Hypnosis _____ by some psychologists to help patients recover forgotten memories.","ko":"최면술은 일부 심리학자들에 의해 환자들이 잊혀진 기억을 회복하도록 돕는 데 사용된다.","answer":"is used","hint":"수동태 현재"}]},
    {"id":"v08826","w":"respiration","pos":["noun"],"ph":"","cefr":"B1","kr":["호흡"],"ex":[{"en":"Regular deep respiration exercises can significantly reduce anxiety before major examinations.","ko":"규칙적인 깊은 호흡 운동은 주요 시험 전 불안을 상당히 줄일 수 있다."}],"mnemonic":{"soundHint":"레스퍼레이션","story":"re(반복) + spir(숨쉬다, inspire의 spir) + ation — 반복해서 숨쉬기 = 호흡","hintConfidence":2},"pairs":{"buddyWords":[{"w":"breathe","ko":"숨쉬다","reason":"핵심 동작"},{"w":"breath","ko":"숨, 호흡","reason":"명사 짝"},{"w":"inhale","ko":"숨을 들이쉬다","reason":"호흡의 한 국면"}],"collocBest":[{"en":"artificial respiration","ko":"인공 호흡"},{"en":"cellular respiration","ko":"세포 호흡"}]},"nuance":{"koSimple":"숨을 들이쉬고 내쉬는 몸의 호흡 작용을 뜻해요.","whenToUse":"의학·생물학적으로 호흡 활동을 다룰 때 씁니다."},"krDetail":[{"ko":"호흡","explain":"숨을 쉬는 작용"}],"usageExamples":[{"en":"During exercise, our rate of respiration increases naturally.","ko":"운동하는 동안 우리의 호흡 속도는 자연스럽게 증가한다."},{"en":"Plants release oxygen as a part of respiration and photosynthesis.","ko":"식물은 호흡과 광합성의 일부로 산소를 방출한다."}],"grammarNote":"'respiration'은 생물·의학에서 쓰는 격식 있는 '호흡'으로, 일상어 'breathing'보다 학술적이다. 셀 수 없는 명사로 쓰이며 동사형은 'respire'이다.","grammarQuiz":[{"sentence":"_____ (practice) deep respiration daily can significantly reduce anxiety before exams.","ko":"매일 깊은 호흡을 연습하는 것은 시험 전 불안을 상당히 줄일 수 있다.","answer":"Practicing","hint":"동명사 주어"}]},
    {"id":"v08646","w":"erroneous","pos":["noun"],"ph":"","cefr":"B1","kr":["잘못된"],"ex":[{"en":"The report contained erroneous data that misled the entire research team.","ko":"그 보고서는 전체 연구팀을 오도한 잘못된 데이터를 담고 있었다."}],"mnemonic":{"soundHint":"error(오류)+ous(의)","story":"error(에러) 있는 → 잘못된","hintConfidence":3},"pairs":{"buddyWords":[{"w":"error","ko":"오류","reason":"어근"},{"w":"incorrect","ko":"부정확한","reason":"동의어"},{"w":"accurate","ko":"정확한","reason":"반의어"}],"collocBest":[{"en":"erroneous assumption","ko":"잘못된 가정"},{"en":"erroneous conclusion","ko":"잘못된 결론"}]},"nuance":{"koSimple":"사실과 달라서 틀린 정보나 판단을 뜻함","whenToUse":"자료·결론의 오류를 격식 있게 지적할 때 사용"},"krDetail":[{"ko":"잘못된","explain":"틀린, 오류가 있는"}],"usageExamples":[{"en":"The article was based on erroneous information.","ko":"그 기사는 잘못된 정보에 근거하고 있었다."},{"en":"He drew an erroneous conclusion from the data.","ko":"그는 그 자료에서 잘못된 결론을 이끌어 냈다."}],"grammarNote":"사실과 다르거나 오류가 있음을 뜻하는 격식체 형용사로 명사 error(오류)에서 나왔다. erroneous belief/assumption처럼 명사 앞에서 자주 쓴다. 품사는 형용사이다.","grammarQuiz":[{"sentence":"The report _____ contained erroneous data seriously misled the entire research team.","ko":"잘못된 데이터를 담고 있던 그 보고서는 전체 연구팀을 심각하게 오도했다.","answer":"that","hint":"관계대명사 주격(that/which)"}]},
    {"id":"v08649","w":"every now and then","pos":["phrase"],"ph":"","cefr":"B1","kr":["때때로, 가끔"],"ex":[{"en":"Every now and then, my grandfather tells us fascinating stories from his youth.","ko":"가끔 할아버지는 우리에게 젊은 시절의 흥미로운 이야기를 들려주신다."}],"mnemonic":{"soundHint":"now(지금) and then(그때) 사이사이","story":"지금과 그때 사이사이 → 때때로·가끔","hintConfidence":2},"pairs":{"buddyWords":[{"w":"occasionally","ko":"가끔","reason":"동의어"},{"w":"sometimes","ko":"때때로","reason":"유의어"},{"w":"from time to time","ko":"때때로","reason":"동의어"}],"collocBest":[{"en":"visit every now and then","ko":"때때로 방문하다"},{"en":"check in every now and then","ko":"가끔 확인하다"}]},"nuance":{"koSimple":"자주는 아니고 이따금씩 일어나는 빈도","whenToUse":"일상적으로 가끔 있는 일을 부드럽게 말할 때 사용"},"krDetail":[{"ko":"때때로, 가끔","explain":"이따금씩"}],"usageExamples":[{"en":"Every now and then, I like to eat out with friends.","ko":"때때로 나는 친구들과 외식하는 것을 좋아한다."},{"en":"She checks her phone every now and then during class.","ko":"그녀는 수업 중에 가끔 휴대폰을 확인한다."}],"grammarNote":"'가끔, 이따금'을 뜻하는 빈도 표현으로 문장 앞이나 뒤에 자유롭게 온다. every now and again, from time to time과 바꿔 쓸 수 있다.","grammarQuiz":[{"sentence":"My grandfather _____ us fascinating stories from his youth every now and then.","ko":"할아버지는 가끔 우리에게 젊은 시절의 흥미로운 이야기를 들려주셨다.","answer":"has told","hint":"현재완료(경험/반복)"}]},
    {"id":"v08658","w":"fall on","pos":["phrase"],"ph":"","cefr":"B1","kr":["~에게 (책임 등이) 주어지다","(날짜가) ~에 해당하다","우연히 만나다, 마주치다"],"ex":[{"en":"The responsibility to clean the classroom always falls on the last two students.","ko":"교실을 청소할 책임은 항상 마지막 두 학생에게 주어진다."}],"mnemonic":{"soundHint":"책임이 나에게 fall(떨어짐)","story":"책임·부담이 뚝 떨어져 얹히다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"come upon","ko":"닥치다","reason":"유의어"},{"w":"be assigned to","ko":"~에 배정되다","reason":"유의어"},{"w":"burden","ko":"부담","reason":"관련어"}],"collocBest":[{"en":"the burden falls on us","ko":"부담이 우리에게 주어지다"},{"en":"fall on a Sunday","ko":"일요일에 해당하다"}]},"nuance":{"koSimple":"어떤 의무나 부담이 특정 사람에게 넘어감","whenToUse":"책임 부과·날짜 일치·우연한 만남에 사용"},"krDetail":[{"ko":"~에게 (책임 등이) 주어지다","explain":"책임이 돌아가다"},{"ko":"(날짜가) ~에 해당하다","explain":"그날에 놓이다"},{"ko":"우연히 만나다, 마주치다","explain":"덤벼들듯 마주치다"}],"usageExamples":[{"en":"The duty to care for the children fell on the eldest sister.","ko":"아이들을 돌보는 의무가 맏언니에게 주어졌다."},{"en":"This year, my birthday falls on a Sunday.","ko":"올해는 내 생일이 일요일에 해당한다."}],"grammarNote":"책임·의무의 주체를 나타낼 때 responsibility falls on somebody 형태로 쓰며, 날짜를 말할 때는 '(요일·날짜)에 해당하다'를 뜻한다. 문맥으로 뜻을 구별한다.","grammarQuiz":[{"sentence":"The last two students, _____ the classroom cleaning always falls on, complained loudly.","ko":"교실 청소 책임이 항상 주어지는 마지막 두 학생이 큰 소리로 불평했다.","answer":"whom","hint":"관계대명사 목적격 whom(전치사 뒤)"}]},
    {"id":"v08814","w":"read between the lines","pos":["phrase"],"ph":"","cefr":"B1","kr":["행간을 읽다, 속뜻을 읽다"],"ex":[{"en":"Reading between the lines, I could tell that she was not really happy.","ko":"행간을 읽어 보니, 나는 그녀가 정말로 행복하지 않다는 것을 알 수 있었다."}],"mnemonic":{"soundHint":"리드 비트윈 더 라인즈","story":"글줄(lines) 사이(between)를 읽다 - 겉이 아닌 속뜻을 파악.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"infer","ko":"추론하다","reason":"숨겨진 뜻을 짐작하는 행위"},{"w":"imply","ko":"암시하다","reason":"행간에 담긴 뜻의 짝 개념"},{"w":"subtext","ko":"속뜻, 저의","reason":"'행간에 담긴 의미' 자체"}],"collocBest":[{"en":"learn to read between the lines","ko":"행간을 읽는 법을 배우다"},{"en":"read between the lines of the letter","ko":"편지의 속뜻을 읽다"}]},"nuance":{"koSimple":"겉으로 드러나지 않은 숨은 뜻을 알아챈다는 표현이에요.","whenToUse":"말·글의 속뜻이나 감춰진 감정을 파악할 때 씁니다."},"krDetail":[{"ko":"행간을 읽다, 속뜻을 읽다","explain":"숨은 의미를 알아채다"}],"usageExamples":[{"en":"She didn't say she was upset, but I could read between the lines.","ko":"그녀는 화났다고 말하지 않았지만, 나는 속뜻을 읽을 수 있었다."},{"en":"You have to read between the lines to understand his real intention.","ko":"그의 진짜 의도를 이해하려면 행간을 읽어야 한다."}],"grammarNote":"'read between the lines'는 글이나 말에 직접 드러나지 않은 숨은 뜻을 파악한다는 관용 표현이다. 항상 이 어순 그대로 통째로 쓴다.","grammarQuiz":[{"sentence":"_____ (read) between the lines, I could tell that she was not really happy.","ko":"행간을 읽어 보니, 나는 그녀가 정말로 행복하지 않다는 것을 알 수 있었다.","answer":"Reading","hint":"분사구문 (능동)"}]},
    {"id":"v08541","w":"be accused of","pos":["phrase"],"ph":"","cefr":"B1","kr":["~으로 고소[기소]되다","~으로 비난받다","~으로 고소되다"],"ex":[{"en":"The former CEO was accused of hiding billions of won in secret accounts.","ko":"전 CEO는 비밀 계좌에 수십억 원을 숨긴 혐의로 기소되었다."}],"mnemonic":{"soundHint":"accuse(어큐즈) = 손가락질하며 고발","story":"'너 뭐 했어!' 하고 accuse(고발) 당하다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"accuse","ko":"고발하다","reason":"동사형"},{"w":"accusation","ko":"고발","reason":"명사형"},{"w":"be charged with","ko":"~로 기소되다","reason":"동의어"}],"collocBest":[{"en":"be accused of theft","ko":"절도로 기소되다"},{"en":"be accused of lying","ko":"거짓말했다고 비난받다"}]},"nuance":{"koSimple":"어떤 잘못이나 죄를 저질렀다고 지목당함을 뜻함","whenToUse":"법적 기소나 공식적 비난을 받는 상황에 사용"},"krDetail":[{"ko":"~으로 고소[기소]되다","explain":"죄로 재판에 넘겨지다"},{"ko":"~으로 비난받다","explain":"잘못했다고 지적받다"},{"ko":"~으로 고소되다","explain":"죄가 있다고 지목되다"}],"usageExamples":[{"en":"He was accused of stealing money from the school fund.","ko":"그는 학교 기금에서 돈을 훔친 것으로 고소되었다."},{"en":"The politician was accused of lying to the public.","ko":"그 정치인은 대중에게 거짓말을 했다고 비난받았다."}],"grammarNote":"of 뒤에는 명사나 동명사(-ing)가 와서 혐의 내용을 나타낸다. 능동형 accuse A of B(A를 B로 비난하다)의 수동태 형태이다.","grammarQuiz":[{"sentence":"The former CEO was accused of _____ billions of won in secret accounts.","ko":"전 CEO는 비밀 계좌에 수십억 원을 숨긴 혐의로 기소되었다.","answer":"hiding","hint":"전치사 of + 동명사"}]},
    {"id":"v08727","w":"inverse","pos":["noun"],"ph":"","cefr":"B1","kr":["정반대의"],"ex":[{"en":"There is an inverse relationship between screen time and average sleep quality.","ko":"스크린 시청 시간과 평균 수면의 질 사이에는 정반대의 관계가 있다."}],"mnemonic":{"soundHint":"in(안·반대)+verse(방향)","story":"reverse(뒤집힘)와 사촌 → 정반대의","hintConfidence":3},"pairs":{"buddyWords":[{"w":"opposite","ko":"반대의","reason":"동의어"},{"w":"reverse","ko":"반대의","reason":"유의어"},{"w":"direct","ko":"정비례의","reason":"반의어"}],"collocBest":[{"en":"inverse relationship","ko":"정반대의 관계"},{"en":"in inverse order","ko":"정반대의 순서로"}]},"nuance":{"koSimple":"방향이나 관계가 완전히 반대인 상태","whenToUse":"수학·과학의 역관계를 논리적으로 설명할 때 사용"},"krDetail":[{"ko":"정반대의","explain":"거꾸로 된"}],"usageExamples":[{"en":"There is an inverse relationship between price and demand.","ko":"가격과 수요 사이에는 반비례 관계가 있다."},{"en":"The results were the inverse of what we had expected.","ko":"그 결과는 우리가 예상했던 것과 정반대였다."}],"grammarNote":"inverse는 '정반대의'라는 형용사로 an inverse relationship(반비례 관계)처럼 수학이나 과학에서 자주 쓰이며, 명사로 '역, 정반대'를 뜻하기도 한다.","grammarQuiz":[{"sentence":"There is an inverse relationship _____ exists between screen time and sleep quality.","ko":"스크린 시청 시간과 수면의 질 사이에 존재하는 정반대의 관계가 있다.","answer":"that","hint":"관계대명사 주격(that/which)"}]},
    {"id":"v08502","w":"alignment","pos":["noun"],"ph":"","cefr":"B1","kr":["일직선","정돈, 정렬","동맹, 제휴"],"ex":[{"en":"The teacher checked the alignment of the desks before the exam started.","ko":"선생님은 시험 시작 전에 책상들의 정렬을 확인했다."}],"mnemonic":{"soundHint":"얼-라인(a-line, 한 줄)+먼트","story":"'라인(line)을 맞추다' → 한 줄(line)로 정렬한 상태","hintConfidence":3},"pairs":{"buddyWords":[{"w":"align","ko":"정렬하다","reason":"동사형"},{"w":"arrangement","ko":"배치","reason":"유의어"},{"w":"formation","ko":"대형","reason":"유의어"}],"collocBest":[{"en":"in alignment with the goal","ko":"목표에 부합하여"},{"en":"a political alignment","ko":"정치적 제휴"}]},"nuance":{"koSimple":"물건이나 생각을 나란히 맞춘 정렬 상태를 뜻함","whenToUse":"물리적 배치나 입장·방향의 일치를 나타낼 때 사용"},"krDetail":[{"ko":"일직선","explain":"똑바로 늘어선 상태"},{"ko":"정돈, 정렬","explain":"가지런히 맞춰 놓음"},{"ko":"동맹, 제휴","explain":"뜻을 같이해 손잡음"}],"usageExamples":[{"en":"The mechanic checked the alignment of the car's wheels.","ko":"정비사가 그 차 바퀴의 정렬 상태를 점검했다."},{"en":"The two nations formed a political alignment against the threat.","ko":"두 나라는 그 위협에 맞서 정치적 동맹을 맺었다."}],"grammarNote":"동사 align(정렬하다)의 명사형이다. 'in alignment with'는 '~와 일치하여'라는 뜻으로 쓰인다.","grammarQuiz":[{"sentence":"_____ the alignment of the desks, the teacher started the exam right away.","ko":"책상들의 정렬을 확인한 후, 선생님은 곧바로 시험을 시작했다.","answer":"Having checked","hint":"분사구문(완료)"}]},
