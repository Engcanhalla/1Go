    {"id":"w01411","w":"council","pos":["n"],"ph":"/ˈkaʊnsəl/","cefr":"B1","kr":["의회","위원회"],"ex":[{"en":"The council voted on the issue.","ko":"의회가 그 문제에 투표했다."}],"mnemonic":{"soundHint":"'카운슬(counsel,상담)'과 비슷 → 함께 상담·회의하는 곳","story":"카운슬(상담)과 헷갈리지만 council은 여럿이 모여 상담하는 '의회'","hintConfidence":2},"pairs":{"buddyWords":[{"w":"committee","ko":"위원회","reason":"council의 대표 동의어"},{"w":"city","ko":"도시","reason":"city council 콜로케이션"},{"w":"meeting","ko":"회의","reason":"council meeting 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"여럿이 모여 결정을 내리는 회의체.","whenToUse":"시의회·학생회 같은 공식 조직을 말할 때."},"krDetail":[{"ko":"의회","explain":"여러 사람이 모여 나라나 지역의 일을 정하는 모임"},{"ko":"위원회","explain":"특정한 일을 맡아 처리하도록 뽑힌 사람들의 모임"}],"usageExamples":[{"en":"The city council approved the new park.","ko":"시의회는 새 공원 건설을 승인했다."},{"en":"She was elected to the student council.","ko":"그녀는 학생회 위원으로 선출되었다."}],"grammarNote":"council(의회/위원회)과 counsel(조언, 조언하다)은 발음이 같지만 뜻이 다름에 유의. council은 집합명사로 단수·복수 취급 모두 가능(영국식은 복수 취급이 흔함).","grammarQuiz":[{"sentence":"The new law _____ (approve) by the council last month.","ko":"새 법은 지난달 의회에 의해 승인되었다.","answer":"was approved","hint":"수동태 과거"}]},
    {"id":"w01427","w":"courage","pos":["n"],"ph":"/ˈkʌrɪdʒ/","cefr":"B1","kr":["용기","담력"],"ex":[{"en":"She showed great courage.","ko":"그녀는 대단한 용기를 보여주었다."}],"mnemonic":{"soundHint":"'커(크게)+리지(내지)' → 크게 소리 내지르는 용기","story":"커! 하고 리지(내지)르며 소리치면 courage(용기)가 생긴다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"bravery","ko":"용감함","reason":"courage의 대표 동의어"},{"w":"courageous","ko":"용감한","reason":"형용사형 파생어"},{"w":"fear","ko":"두려움","reason":"courage의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"무섭거나 힘들어도 나서는 마음.","whenToUse":"두려움을 이겨내는 태도를 말할 때."},"krDetail":[{"ko":"용기","explain":"겁내지 않는 씩씩한 마음"},{"ko":"담력","explain":"겁 없이 사물을 대할 수 있는 마음의 힘"}],"usageExamples":[{"en":"It takes courage to admit a mistake.","ko":"실수를 인정하는 데는 용기가 필요하다."},{"en":"He found the courage to speak in public.","ko":"그는 사람들 앞에서 말할 용기를 냈다."}],"grammarNote":"courage는 셀 수 없는 명사(불가산). 'have the courage to부정사'(~할 용기가 있다), 'take courage'(용기를 내다) 등 관용 표현으로 자주 쓰임.","grammarQuiz":[{"sentence":"It takes great _____ _____ _____ up against injustice in society.","ko":"사회의 부정의에 맞서 일어서는 데는 큰 용기가 필요하다.","answer":["courage","to","stand"],"hint":"It takes + 명사 + to부정사 + stand up against 구조"}]},
    {"id":"w01432","w":"courtesy","pos":["n"],"ph":"/ˈkɜrtəsi/","cefr":"B1","kr":["예의","공손함","호의"],"ex":[{"en":"He had the courtesy to hold the door open.","ko":"그는 문을 잡아주는 예의를 갖추었다."}],"mnemonic":{"soundHint":"'코트(court,궁정)+시' → 궁정에서의 예의범절","story":"코트(court, 궁정)에서 지켜야 할 예절 = courtesy(예의)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"politeness","ko":"정중함","reason":"courtesy의 대표 동의어"},{"w":"respect","ko":"존중","reason":"courtesy의 동의어"},{"w":"rudeness","ko":"무례함","reason":"courtesy의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"남을 배려하는 공손한 태도.","whenToUse":"정중한 행동·기본 매너를 말할 때."},"krDetail":[{"ko":"예의","explain":"사람이 지켜야 할 바른 몸가짐과 말씨"},{"ko":"공손함","explain":"예의 바르고 겸손함"},{"ko":"호의","explain":"상대에게 보이는 친절한 마음"}],"usageExamples":[{"en":"He always treats guests with courtesy.","ko":"그는 항상 손님을 예의 있게 대한다."},{"en":"The drinks were free, courtesy of the hotel.","ko":"음료는 호텔의 호의로 무료였다."}],"grammarNote":"courtesy는 셀 수 없는 명사(예의라는 성질)와 셀 수 있는 명사(예의 있는 행동/호의) 모두 가능. 관용어: 'out of courtesy'(예의로), 'as a courtesy'(호의로), 'courtesy of + 사람'(~의 호의로).","grammarQuiz":[{"sentence":"He is famous for _____ (show) courtesy to everyone.","ko":"그는 모든 이에게 예의를 보이는 것으로 유명하다.","answer":"showing","hint":"전치사 + 동명사"}]},
    {"id":"w01449","w":"crave","pos":["v"],"ph":"/kreɪv/","cefr":"B1","kr":["갈망하다","간절히 원하다"],"ex":[{"en":"After weeks of dieting, she craved something sweet.","ko":"몇 주간의 다이어트 후 그녀는 단것을 간절히 원했다."}],"mnemonic":{"soundHint":"'크레이(외치다)+브' → 크게 외치며 갈망","story":"크레이! 브~ 하고 절규하듯 갈망하는 게 crave","hintConfidence":1},"pairs":{"buddyWords":[{"w":"desire","ko":"갈망하다","reason":"crave의 대표 동의어"},{"w":"attention","ko":"관심","reason":"crave attention 콜로케이션"},{"w":"sugar","ko":"설탕, 단것","reason":"crave sugar 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"몸이 근질거릴 만큼 몹시 원하다.","whenToUse":"단것·관심 등 강한 욕구를 말할 때."},"krDetail":[{"ko":"갈망하다","explain":"몹시 하고 싶어 애태우다"},{"ko":"간절히 원하다","explain":"매우 강하게 바라다"}],"usageExamples":[{"en":"On hot days I crave cold water.","ko":"더운 날에는 찬물이 몹시 마시고 싶다."},{"en":"Young children crave their parents' attention.","ko":"어린아이들은 부모의 관심을 간절히 원한다."}],"grammarNote":"crave는 타동사로 목적어(사람이 원하는 대상)를 바로 취함. 진행형(be craving)으로도 자주 쓰이며 순간적인 강한 욕구를 나타냄.","grammarQuiz":[{"sentence":"Small children often _____ their parents' attention _____ acting silly at dinner.","ko":"어린 아이들은 종종 저녁 식사 중에 우스꽝스럽게 행동함으로써 부모의 관심을 갈망한다.","answer":["crave","by"],"hint":"타동사 crave + 목적어 + by -ing(~함으로써)"}]},
    {"id":"w01343","w":"contrast","pos":["n","v"],"ph":"/ˈkɒntrɑːst/","cefr":"B1","kr":["대조","대비하다"],"ex":[{"en":"There is a sharp contrast here.","ko":"여기에는 극명한 대조가 있다."}],"mnemonic":{"soundHint":"'컨트라스트' → 카메라·화면의 '콘트라스트(대비)' 그대로","story":"TV 설정의 '콘트라스트'는 밝고 어두움의 대비 = contrast","hintConfidence":3},"pairs":{"buddyWords":[{"w":"difference","ko":"차이","reason":"contrast의 대표 동의어"},{"w":"compare","ko":"비교하다","reason":"compare and contrast 세트 표현"},{"w":"similarity","ko":"유사성","reason":"contrast의 반의어"}],"collocBest":[{"en":"in contrast to","ko":"~와 대조적으로"},{"en":"sharp contrast","ko":"극명한 대조"}]},"nuance":{"koSimple":"두 가지를 나란히 놓고 다름을 보여주는 것.","whenToUse":"차이를 강조하거나 비교할 때 씀."},"krDetail":[{"ko":"대조","explain":"서로 반대되거나 다른 것을 견주어 봄"},{"ko":"대비하다","explain":"서로 견주어 차이를 드러내다"}],"usageExamples":[{"en":"The teacher contrasted the two poems to show their differences.","ko":"선생님은 두 시의 차이를 보여주기 위해 그것들을 대비시켰다."},{"en":"Her calm voice contrasted sharply with his angry shouting.","ko":"그녀의 차분한 목소리는 그의 화난 고함과 뚜렷하게 대비되었다."}],"grammarNote":"타동사로 쓸 때는 'contrast A with B'(A를 B와 대비시키다), 자동사로 쓸 때는 'A contrasts with B'(A가 B와 대비되다) 형태. 명사 강세는 앞(CONtrast), 동사 강세는 뒤(conTRAST).","grammarQuiz":[{"sentence":"Her cheerful attitude _____ _____ her brother's gloomy mood at the party.","ko":"그녀의 밝은 태도는 파티에서 오빠의 우울한 기분과 대비되었다.","answer":["contrasted","with"],"hint":"자동사 contrast + 전치사로 '~와 대비되다'를 표현"}]},
    {"id":"w01351","w":"convenient","pos":["adj"],"ph":"/kənˈviːniənt/","cefr":"B1","kr":["편리한","간편한"],"ex":[{"en":"The location is very convenient.","ko":"위치가 매우 편리하다."}],"mnemonic":{"soundHint":"'컨비니언트' → '편의점(convenience store)'의 컨비니와 동일 어원","story":"편의점(convenience)이 편리한 것처럼 convenient = 편리한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"handy","ko":"편리한","reason":"convenient의 대표 동의어"},{"w":"convenience","ko":"편리함, 편의","reason":"명사형 파생어"},{"w":"inconvenient","ko":"불편한","reason":"in-접두사로 형성된 반의어"}],"collocBest":[{"en":"convenient location","ko":"편리한 위치"},{"en":"convenient time","ko":"편한 시간"}]},"nuance":{"koSimple":"쓰거나 가기에 손쉽고 부담이 없는.","whenToUse":"시간·장소·물건이 편할 때 씀."},"krDetail":[{"ko":"편리한","explain":"쓰기에 쉽고 편한"},{"ko":"간편한","explain":"간단하고 편한"}],"usageExamples":[{"en":"Online shopping is very convenient for busy people.","ko":"온라인 쇼핑은 바쁜 사람들에게 매우 편리하다."},{"en":"Let me know a convenient time to meet.","ko":"만나기 편한 시간을 알려 주세요."}],"grammarNote":"convenient는 사람을 주어로 쓸 수 없음. 'I am convenient'는 틀린 표현이며, 'It is convenient for me'가 옳음. 가주어 It + be동사 + convenient + for 사람 + to부정사 구조.","grammarQuiz":[{"sentence":"_____ _____ _____ for you _____ meet me at three o'clock tomorrow?","ko":"내일 3시에 저를 만나는 게 당신에게 편리한가요?","answer":["Is","it","convenient","to"],"hint":"가주어 It + be + convenient + for 사람 + to부정사 의문문"}]},
    {"id":"w01522","w":"curious","pos":["adj"],"ph":"/ˈkjʊəriəs/","cefr":"B1","kr":["호기심 많은","이상한"],"ex":[{"en":"Children are naturally curious about everything.","ko":"아이들은 모든 것에 자연스럽게 호기심이 많다."}],"mnemonic":{"soundHint":"'큐리(궁금)+어스' → 궁금해 하는","story":"큐리~ 하고 갸웃거리며 궁금해하면 curious(호기심 많은)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"about","ko":"~에 대해","reason":"curious about 콜로케이션"},{"w":"inquisitive","ko":"탐구적인","reason":"curious의 동의어"},{"w":"curiosity","ko":"호기심","reason":"curious의 명사형"}],"collocBest":[]},"nuance":{"koSimple":"궁금한 게 많은, 또는 이상야릇한.","whenToUse":"호기심 많은 사람·특이한 일에 씀."},"krDetail":[{"ko":"호기심 많은","explain":"이것저것 알고 싶어 하는"},{"ko":"이상한","explain":"평소와 달라 눈길을 끄는"}],"usageExamples":[{"en":"I am curious about how planes fly.","ko":"나는 비행기가 어떻게 나는지 궁금하다."},{"en":"We heard a curious noise from the attic.","ko":"우리는 다락방에서 이상한 소리를 들었다."}],"grammarNote":"'~에 대해 호기심이 있다'는 be curious about+명사, '~인지 궁금하다'는 be curious to+동사원형 또는 be curious wh-절로 씁니다.","grammarQuiz":[{"sentence":"Many students are curious _____ how the human brain works.","ko":"많은 학생들이 인간의 뇌가 어떻게 작동하는지 궁금해한다.","answer":["about"],"hint":"be curious ___"},{"sentence":"I was curious _____ know what happened at the party last night.","ko":"나는 어젯밤 파티에서 무슨 일이 있었는지 알고 싶었다.","answer":["to"],"hint":"be curious ___ 동사원형"}]},
    {"id":"w01524","w":"currency","pos":["n"],"ph":"/ˈkɜrənsi/","cefr":"B1","kr":["통화","화폐","유통"],"ex":[{"en":"The currency of Japan is the yen.","ko":"일본의 통화는 엔이다."}],"mnemonic":{"soundHint":"'커런트(current,현재)+시' → 현재 유통되는 돈","story":"current(현재)의 명사 → 지금 유통되는 돈 = currency(통화)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"foreign","ko":"외국의","reason":"foreign currency 콜로케이션"},{"w":"exchange","ko":"환전","reason":"exchange currency 콜로케이션"},{"w":"money","ko":"돈","reason":"currency의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"한 나라에서 쓰는 돈.","whenToUse":"원·달러·엔 같은 화폐 단위를 말할 때."},"krDetail":[{"ko":"통화","explain":"한 나라에서 쓰는 돈"},{"ko":"화폐","explain":"물건값을 치를 때 쓰는 돈"}],"usageExamples":[{"en":"You should exchange currency before you travel.","ko":"여행 전에 환전을 하는 것이 좋다."},{"en":"The euro is the currency of many countries.","ko":"유로는 많은 나라의 통화이다."}],"grammarNote":"currency는 셀 수 있는 명사·셀 수 없는 명사 둘 다 쓰여요. 여러 나라 화폐를 말할 땐 currencies로 복수형을 씁니다.","grammarQuiz":[{"sentence":"Travelers often need to exchange their _____ before entering a new country.","ko":"여행자들은 새 나라에 들어가기 전에 자국 화폐를 환전해야 하는 경우가 많다.","answer":["currency"],"hint":"단수 명사"},{"sentence":"The euro is the common _____ used in most European Union countries.","ko":"유로는 대부분의 유럽연합 국가에서 쓰이는 공통 화폐이다.","answer":["currency"],"hint":"'화폐'"}]},
    {"id":"w01612","w":"decrease","pos":["v","n"],"ph":"/dɪˈkriːs/","cefr":"B1","kr":["감소하다","줄어들다"],"ex":[{"en":"Prices decreased this month.","ko":"이번 달 가격이 감소했다."}],"mnemonic":{"soundHint":"'디(de-,아래로)+크리스(crease,주름)' → 아래로 접혀 줄어들다","story":"de-(아래) + crease(주름) → 접혀 줄어들다 = decrease(감소하다). increase의 반의어","hintConfidence":2},"pairs":{"buddyWords":[{"w":"sharp","ko":"급격한","reason":"sharp decrease 콜로케이션"},{"w":"reduce","ko":"줄이다","reason":"decrease의 동의어"},{"w":"increase","ko":"증가하다","reason":"decrease의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"수·양이 점점 줄어들다.","whenToUse":"가격·인구·수치가 낮아질 때."},"krDetail":[{"ko":"감소하다","explain":"양이나 수가 줄다"},{"ko":"줄어들다","explain":"적어지다"}],"usageExamples":[{"en":"The new law decreases air pollution in most large cities.","ko":"새 법은 대부분의 대도시에서 대기오염을 줄여 준다."},{"en":"The number of young people in the town has decreased sharply.","ko":"그 마을의 젊은 사람 수가 급격히 감소했다."}],"grammarNote":"decrease는 자동사·타동사 모두 됩니다. '~만큼 감소하다'는 decrease by+수치, '~로 감소하다'는 decrease to+수치로 씁니다.","grammarQuiz":[{"sentence":"Sales have decreased _____ 20 percent since last year's changes.","ko":"지난해의 변화 이후 매출이 20퍼센트나 감소했다.","answer":["by"],"hint":"감소 폭"},{"sentence":"There has been a sharp decrease _____ the number of newborn babies.","ko":"신생아 수에 급격한 감소가 있었다.","answer":["in"],"hint":"감소 대상"}]},
    {"id":"w01629","w":"definite","pos":["adj"],"ph":"/ˈdefɪnɪt/","cefr":"B1","kr":["확실한","명확한"],"ex":[{"en":"There is no definite answer.","ko":"확실한 답은 없다."}],"mnemonic":{"soundHint":"'define(정의하다)+ite' → 명확하게 정의된","story":"define(정의하다)이 완료된 상태 → definite(확실한)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"plan","ko":"계획","reason":"definite plan 콜로케이션"},{"w":"certain","ko":"확실한","reason":"definite의 동의어"},{"w":"vague","ko":"모호한","reason":"definite의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"의심 없이 확실한.","whenToUse":"계획·답이 뚜렷하고 분명할 때."},"krDetail":[{"ko":"확실한","explain":"의심의 여지가 없는"},{"ko":"명확한","explain":"분명한"}],"usageExamples":[{"en":"We need a definite answer before we can start.","ko":"우리가 시작하려면 확실한 답이 필요하다."},{"en":"There has been a definite improvement in her grades.","ko":"그녀의 성적에 명확한 향상이 있었다."}],"grammarNote":"definite는 형용사, definitely는 부사입니다. 형용사이므로 be동사 뒤나 명사 앞에서 사용해요. 반대는 indefinite(불명확한)입니다.","grammarQuiz":[{"sentence":"There is a _____ improvement in her English speaking skills this year.","ko":"그녀의 영어 말하기 실력이 올해 확실히 나아졌다.","answer":["definite","clear"],"hint":"형용사"},{"sentence":"The teacher gave us a _____ answer about the exam date today.","ko":"선생님은 오늘 시험 날짜에 대해 우리에게 확실한 답을 주셨다.","answer":["definite","clear"],"hint":"형용사"}]},
    {"id":"w01494","w":"cruel","pos":["adj"],"ph":"/ˈkruːəl/","cefr":"B1","kr":["잔인한","냉혹한"],"ex":[{"en":"It was cruel to leave him alone.","ko":"그를 홀로 두는 것은 잔인했다."}],"mnemonic":{"soundHint":"'크루얼티(cruelty)' → 잔인함","story":"cruelty-free 화장품 = 동물에 잔인하지 않은 → cruel(잔인한)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"treatment","ko":"대우","reason":"cruel treatment 콜로케이션"},{"w":"brutal","ko":"잔혹한","reason":"cruel의 강한 동의어"},{"w":"kind","ko":"친절한","reason":"cruel의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"남의 아픔을 아랑곳 않고 모질게 구는.","whenToUse":"학대·모진 말·냉혹한 처사를 말할 때."},"krDetail":[{"ko":"잔인한","explain":"남을 아프게 하고도 아무렇지 않은"},{"ko":"냉혹한","explain":"따뜻한 마음이 없는"}],"usageExamples":[{"en":"It is cruel to keep a bird in a tiny cage.","ko":"새를 작은 새장에 가두는 것은 잔인하다."},{"en":"The villain had a cruel smile.","ko":"그 악당은 냉혹한 미소를 지었다."}],"grammarNote":"cruel은 형용사예요. 사람의 성격을 말할 땐 be cruel to+사람 형태로 쓰고, It is cruel of+사람+to부정사 구문도 자주 나와요.","grammarQuiz":[{"sentence":"It was very cruel _____ him to laugh at the crying child.","ko":"우는 아이를 비웃다니 그는 참 잔인했다.","answer":["of"],"hint":"사람 성격 형용사+of+사람"},{"sentence":"The king was so cruel _____ his people that they finally rebelled.","ko":"왕이 백성들에게 너무 잔인해서 그들은 결국 반란을 일으켰다.","answer":["to"],"hint":"대상 표시 전치사"}]},
    {"id":"w01551","w":"dairy","pos":["n","adj"],"ph":"/ˈdeəri/","cefr":"B1","kr":["유제품","낙농업의"],"ex":[{"en":"She avoids dairy products.","ko":"그녀는 유제품을 피한다."}],"mnemonic":{"soundHint":"'다이어리(diary,일기)'와 헷갈리는 데어리 → 소젖 짜는 곳","story":"diary(일기)와 헷갈리기 쉬운 dairy(유제품/낙농업)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"product","ko":"제품","reason":"dairy product 콜로케이션"},{"w":"farm","ko":"농장","reason":"dairy farm 콜로케이션"},{"w":"milk","ko":"우유","reason":"dairy의 대표 제품"}],"collocBest":[]},"nuance":{"koSimple":"우유로 만든 먹거리.","whenToUse":"치즈·버터·요구르트 같은 유제품에 씀."},"krDetail":[{"ko":"유제품","explain":"우유로 만든 먹거리"},{"ko":"낙농업의","explain":"젖소를 길러 우유를 얻는 일에 관한"}],"usageExamples":[{"en":"Cheese and butter are dairy products.","ko":"치즈와 버터는 유제품이다."},{"en":"His family runs a small dairy farm.","ko":"그의 가족은 작은 낙농장을 운영한다."}],"grammarNote":"dairy는 명사·형용사예요. dairy product(유제품), dairy farm(낙농장)처럼 앞에서 명사를 수식할 때 자주 쓰입니다. daily(매일의)와 헷갈리지 마세요.","grammarQuiz":[{"sentence":"People with lactose intolerance should avoid most _____ products.","ko":"유당 불내증이 있는 사람은 대부분의 유제품을 피해야 한다.","answer":["dairy"],"hint":"형용사"},{"sentence":"Her family runs a small _____ farm out in the countryside.","ko":"그녀의 가족은 시골에서 작은 낙농장을 운영한다.","answer":["dairy"],"hint":"형용사"}]},
    {"id":"w01598","w":"decent","pos":["adj"],"ph":"/ˈdiːsnt/","cefr":"B1","kr":["괜찮은","예의 바른"],"ex":[{"en":"He earned a decent salary.","ko":"그는 괜찮은 급여를 받았다."}],"mnemonic":{"soundHint":"'디센트' → 이 정도면 '뒷선트'(뒤에서 봐도 괜찮은)","story":"디센트! 이 정도면 '괜찮네' 하는 느낌","hintConfidence":1},"pairs":{"buddyWords":[{"w":"job","ko":"직업","reason":"decent job 콜로케이션"},{"w":"acceptable","ko":"받아들일 만한","reason":"decent의 동의어"},{"w":"proper","ko":"적절한","reason":"decent의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"기대만큼은 아니어도 꽤 괜찮은.","whenToUse":"직업·행동·품행이 무난할 때."},"krDetail":[{"ko":"괜찮은","explain":"썩 훌륭하지는 않아도 만족할 만한"},{"ko":"예의 바른","explain":"행동이 반듯한"}],"usageExamples":[{"en":"We finally found a decent hotel near the station.","ko":"우리는 마침내 역 근처에서 괜찮은 호텔을 찾았다."},{"en":"He is a decent man who always helps others.","ko":"그는 늘 남을 돕는 예의 바른 사람이다."}],"grammarNote":"decent는 형용사예요. '괜찮은 정도'라는 은근한 칭찬 뉘앙스가 있어서, a decent job은 '아주 좋진 않아도 나쁘지 않은 직장'을 뜻해요.","grammarQuiz":[{"sentence":"After graduation, he finally found a _____ job with good pay.","ko":"졸업 후 그는 마침내 급여가 괜찮은 직장을 구했다.","answer":["decent","good"],"hint":"형용사"},{"sentence":"She is a very _____ person who always helps her neighbors.","ko":"그녀는 늘 이웃을 돕는 아주 예의 바른 사람이다.","answer":["decent","kind","nice"],"hint":"형용사"}]},
    {"id":"w01621","w":"defeat","pos":["v","n"],"ph":"/dɪˈfiːt/","cefr":"B1","kr":["패배시키다","패배"],"ex":[{"en":"Our team was defeated badly.","ko":"우리 팀은 크게 패배했다."}],"mnemonic":{"soundHint":"'디(de-,아래로)+피트(feet,발)' → 상대를 발 아래로","story":"de(아래)+feet(발) → 상대를 발 밑으로 짓밟다 = defeat(패배시키다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"enemy","ko":"적","reason":"defeat an enemy 콜로케이션"},{"w":"beat","ko":"이기다","reason":"defeat의 동의어"},{"w":"victory","ko":"승리","reason":"defeat의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"상대를 이겨서 무너뜨리다.","whenToUse":"경기·전투에서 이기거나 진 상황."},"krDetail":[{"ko":"패배시키다","explain":"이겨서 상대를 지게 하다"},{"ko":"패배","explain":"싸움이나 경기에서 지는 일"}],"usageExamples":[{"en":"Our school team defeats their rivals in the final game every year.","ko":"우리 학교 팀은 매년 결승전에서 라이벌을 물리친다."},{"en":"Their rivals were defeated in the final game by our school team.","ko":"그들의 라이벌은 결승전에서 우리 학교 팀에게 패배했다."}],"grammarNote":"defeat는 lose와 반대 방향이에요. A defeated B = B lost to A. 명사로 쓰일 때는 suffer/admit defeat 같은 표현으로 자주 씁니다.","grammarQuiz":[{"sentence":"Our team _____ the champions in a very close final match.","ko":"우리 팀은 아주 아슬아슬한 결승전에서 챔피언을 꺾었다.","answer":["defeated","beat"],"hint":"과거시제 타동사"},{"sentence":"The general finally had to admit _____ after months of fighting.","ko":"그 장군은 여러 달의 싸움 끝에 결국 패배를 인정해야 했다.","answer":["defeat"],"hint":"명사"}]},
    {"id":"w01628","w":"define","pos":["v"],"ph":"/dɪˈfaɪn/","cefr":"B1","kr":["정의하다","규정하다"],"ex":[{"en":"Please define this term clearly.","ko":"이 용어를 명확하게 정의해 주세요."}],"mnemonic":{"soundHint":"'디(de-)+파인(fine,정교한)' → 뜻을 정교하게","story":"de+fine(정교한) → 정교하게 뜻을 밝히다 = define(정의하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clearly","ko":"명확히","reason":"clearly defined 콜로케이션"},{"w":"explain","ko":"설명하다","reason":"define의 동의어"},{"w":"meaning","ko":"의미","reason":"define은 meaning을 밝힘"}],"collocBest":[]},"nuance":{"koSimple":"뜻을 정확히 설명하다.","whenToUse":"용어·개념을 명확히 규정할 때."},"krDetail":[{"ko":"정의하다","explain":"뜻을 분명히 밝히다"},{"ko":"규정하다","explain":"무엇인지 정하다"}],"usageExamples":[{"en":"The teacher defines each new word clearly during the vocabulary lesson.","ko":"그 선생님은 어휘 수업에서 새 단어들을 저마다 분명하게 정의해 주신다."},{"en":"Each new word is defined clearly during the vocabulary lesson.","ko":"새 단어들은 저마다 어휘 수업에서 분명하게 정의된다."}],"grammarNote":"define A as B는 'A를 B로 정의하다'라는 뜻이에요. 과거분사 defined는 well-defined(잘 정의된), clearly defined(명확히 정의된) 형태로 자주 나옵니다.","grammarQuiz":[{"sentence":"Scientists define water _____ a compound made of hydrogen and oxygen.","ko":"과학자들은 물을 수소와 산소로 이루어진 화합물이라고 정의한다.","answer":["as"],"hint":"define A ___ B"},{"sentence":"Please give a clearly _____ answer to the teacher's question.","ko":"선생님의 질문에 명확히 정의된 답을 주세요.","answer":["defined"],"hint":"과거분사"}]},
    {"id":"w01499","w":"crystal","pos":["n","adj"],"ph":"/ˈkrɪstəl/","cefr":"B1","kr":["수정","투명한"],"ex":[{"en":"The crystal shone in the sunlight.","ko":"수정이 햇빛에 빛났다."}],"mnemonic":{"soundHint":"크리스탈","story":"'크리스탈'은 수정을 뜻하는 외래어.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"clear","ko":"맑은","reason":"crystal clear 콜로케이션"},{"w":"gem","ko":"보석","reason":"crystal의 동의어"},{"w":"glass","ko":"유리","reason":"crystal glass 시나리오"}],"collocBest":[{"en":"crystal clear","ko":"수정처럼 맑은"},{"en":"crystal ball","ko":"수정구"}]},"nuance":{"koSimple":"반짝이는 투명한 돌·유리.","whenToUse":"수정·크리스탈처럼 맑고 투명할 때."},"krDetail":[{"ko":"수정","explain":"맑고 반짝이는 돌"},{"ko":"투명한","explain":"속이 훤히 비쳐 보이는"}],"usageExamples":[{"en":"She wore a necklace with a clear crystal.","ko":"그녀는 맑은 수정이 달린 목걸이를 했다."},{"en":"The lake water was crystal clear.","ko":"그 호수의 물은 수정처럼 맑았다."}],"grammarNote":"crystal clear는 '아주 분명한/투명한'이라는 관용 표현으로 자주 쓰여요. crystal은 명사·형용사 모두 가능합니다.","grammarQuiz":[{"sentence":"The water in the mountain lake was crystal _____ that morning.","ko":"그날 아침 산속 호수의 물은 수정처럼 맑았다.","answer":["clear"],"hint":"관용 표현"},{"sentence":"The old woman claimed she could see the future in her crystal _____.","ko":"그 노파는 수정구슬로 미래를 볼 수 있다고 주장했다.","answer":["ball"],"hint":"점술 도구"}]},
    {"id":"w01510","w":"cultural","pos":["adj"],"ph":"/ˈkʌltʃərəl/","cefr":"B1","kr":["문화적인","문화의"],"ex":[{"en":"Cultural differences can affect communication.","ko":"문화적 차이는 소통에 영향을 미칠 수 있다."}],"mnemonic":{"soundHint":"'컬처(culture,문화)+럴' → 문화의","story":"culture(문화)+al = cultural(문화적인)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"heritage","ko":"유산","reason":"cultural heritage 콜로케이션"},{"w":"diversity","ko":"다양성","reason":"cultural diversity 콜로케이션"},{"w":"tradition","ko":"전통","reason":"cultural context에서 자주 등장"}],"collocBest":[]},"nuance":{"koSimple":"한 나라·집단의 문화와 관련된.","whenToUse":"전통·예술·풍습을 이야기할 때."},"krDetail":[{"ko":"문화적인","explain":"그 나라 사람들의 삶의 방식과 관련된"},{"ko":"문화의","explain":"예술이나 전통에 관한"}],"usageExamples":[{"en":"The city offers many cultural events.","ko":"그 도시는 많은 문화 행사를 제공한다."},{"en":"Travel helps us understand cultural differences.","ko":"여행은 문화적 차이를 이해하도록 도와준다."}],"grammarNote":"cultural은 형용사이고 명사는 culture예요. cultural differences, cultural background처럼 명사 앞에서 수식하는 자리에 주로 쓰여요.","grammarQuiz":[{"sentence":"Students should respect the _____ differences of their foreign classmates.","ko":"학생들은 외국인 급우들의 문화적 차이를 존중해야 한다.","answer":["cultural"],"hint":"형용사형"},{"sentence":"Learning a new language helps you understand another _____ better.","ko":"새 언어를 배우면 다른 문화를 더 잘 이해할 수 있다.","answer":["culture"],"hint":"명사형"}]},
    {"id":"w01519","w":"cure","pos":["n","v"],"ph":"/kjʊr/","cefr":"B1","kr":["치료","치료약","치유하다"],"ex":[{"en":"Scientists are searching for a cure for cancer.","ko":"과학자들은 암 치료법을 연구하고 있다."}],"mnemonic":{"soundHint":"'큐어(care와 유사)' → 돌봐 낫게 하다","story":"큐어! 하고 병을 몰아내면 치료가 된다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"disease","ko":"질병","reason":"cure a disease 콜로케이션"},{"w":"remedy","ko":"치료법","reason":"cure의 동의어"},{"w":"heal","ko":"치유하다","reason":"cure의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"병을 낫게 하는 약이나 방법.","whenToUse":"질병·문제를 해결하는 치료를 말할 때."},"krDetail":[{"ko":"치료","explain":"병을 낫게 하는 일"},{"ko":"치유하다","explain":"아픈 곳을 낫게 하다"}],"usageExamples":[{"en":"This new medicine can cure many types of headaches quickly.","ko":"이 새 약은 여러 종류의 두통을 빠르게 치료해 준다."},{"en":"Many types of headaches can be cured quickly by this new medicine.","ko":"여러 종류의 두통은 이 새 약에 의해 빠르게 치료될 수 있다."}],"grammarNote":"cure는 '병을 치료하다'이고, treat는 '환자를 진료하다'예요. cure A of B(A에게서 B를 낫게 하다) 구문도 알아두세요.","grammarQuiz":[{"sentence":"Doctors are still searching for a _____ for the common cold.","ko":"의사들은 여전히 감기의 치료법을 찾고 있다.","answer":["cure"],"hint":"명사"},{"sentence":"This herbal tea is said to cure people _____ mild stomach pain.","ko":"이 허브차는 가벼운 위통을 낫게 해 준다고 한다.","answer":["of"],"hint":"cure A ___ B"}]},
    {"id":"w01521","w":"curiosity","pos":["n"],"ph":"/ˌkjʊəriˈɒsɪti/","cefr":"B1","kr":["호기심","신기한 것"],"ex":[{"en":"Her curiosity led her to explore.","ko":"그녀의 호기심이 그녀를 탐험하게 했다."}],"mnemonic":{"soundHint":"'큐리어스(curious)+이티' → 궁금해하는 성질","story":"curious(호기심 많은)의 명사형 → curiosity(호기심)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"satisfy","ko":"충족시키다","reason":"satisfy curiosity 콜로케이션"},{"w":"interest","ko":"관심","reason":"curiosity의 동의어"},{"w":"curious","ko":"호기심 많은","reason":"curiosity의 형용사형"}],"collocBest":[]},"nuance":{"koSimple":"궁금해서 알고 싶은 마음.","whenToUse":"'왜?'라고 자꾸 묻는 관심을 말할 때."},"krDetail":[{"ko":"호기심","explain":"새로운 것을 알고 싶어 하는 마음"},{"ko":"신기한 것","explain":"보기 드물어 눈길을 끄는 물건"}],"usageExamples":[{"en":"Her curiosity about space grew every year.","ko":"우주에 대한 그녀의 호기심은 해마다 커졌다."},{"en":"Out of curiosity, I opened the old box.","ko":"호기심에 나는 그 낡은 상자를 열어 보았다."}],"grammarNote":"curiosity는 셀 수 없는 명사예요. out of curiosity(호기심에서)는 이유를 나타내는 관용 표현으로 자주 쓰입니다.","grammarQuiz":[{"sentence":"_____ curiosity, I asked her why she moved to another country.","ko":"호기심에서, 나는 그녀에게 왜 다른 나라로 이주했는지 물었다.","answer":["Out of"],"hint":"이유의 관용구"},{"sentence":"The child looked at the strange bug with great _____ in his eyes.","ko":"그 아이는 눈에 큰 호기심을 품고 이상한 벌레를 바라보았다.","answer":["curiosity","interest"],"hint":"명사"}]},
    {"id":"w01544","w":"cylinder","pos":["n"],"ph":"/ˈsɪlɪndər/","cefr":"B1","kr":["원통","실린더","원기둥"],"ex":[{"en":"The engine has four cylinders.","ko":"엔진에는 실린더가 네 개 있다."}],"mnemonic":{"soundHint":"실린더","story":"엔진 '실린더'는 원통 모양의 부품.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"engine","ko":"엔진","reason":"engine cylinder 콜로케이션"},{"w":"gas","ko":"가스","reason":"gas cylinder 콜로케이션"},{"w":"tube","ko":"관","reason":"cylinder의 동의어"}],"collocBest":[{"en":"engine cylinder","ko":"엔진 실린더"},{"en":"gas cylinder","ko":"가스 실린더"}]},"nuance":{"koSimple":"속이 빈 둥근 통 모양.","whenToUse":"엔진 실린더·가스통·원기둥을 말할 때."},"krDetail":[{"ko":"원통","explain":"긴 통 모양"},{"ko":"원기둥","explain":"둥근 기둥 모양"}],"usageExamples":[{"en":"A can of soup is shaped like a cylinder.","ko":"수프 캔은 원통 모양이다."},{"en":"The gas is stored in a metal cylinder.","ko":"그 가스는 금속 원통에 저장된다."}],"grammarNote":"cylinder는 셀 수 있는 명사예요. 형용사형은 cylindrical(원통 모양의)이고, 엔진 부품이나 가스통을 가리킬 때도 씁니다.","grammarQuiz":[{"sentence":"The engineer checked each engine _____ for signs of damage.","ko":"그 기술자는 손상 흔적이 있는지 각 엔진 실린더를 점검했다.","answer":["cylinder"],"hint":"단수 명사"},{"sentence":"A can of soda has a _____ shape that is easy to hold.","ko":"탄산음료 캔은 잡기 편한 원통 모양을 가진다.","answer":["cylindrical","cylinder"],"hint":"형용사 또는 명사"}]},
    {"id":"w01554","w":"damp","pos":["adj"],"ph":"/dæmp/","cefr":"B1","kr":["축축한","습한"],"ex":[{"en":"The towel was still damp.","ko":"수건이 아직 축축했다."}],"mnemonic":{"soundHint":"'댐(dam,수문)+프' → 댐 근처는 축축","story":"댐(dam) 근처는 물기가 많아 damp(축축한)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"weather","ko":"날씨","reason":"damp weather 콜로케이션"},{"w":"wet","ko":"젖은","reason":"damp의 동의어"},{"w":"dry","ko":"건조한","reason":"damp의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"젖은 듯 눅눅한.","whenToUse":"빨래·지하실이 축축할 때."},"krDetail":[{"ko":"축축한","explain":"물기가 살짝 있는"},{"ko":"습한","explain":"공기 중에 물기가 많은"}],"usageExamples":[{"en":"Wipe the table with a damp cloth.","ko":"축축한 천으로 탁자를 닦아라."},{"en":"The basement felt cold and damp.","ko":"그 지하실은 춥고 습하게 느껴졌다."}],"grammarNote":"damp는 wet보다 약한 느낌으로 '살짝 젖은'을 뜻해요. moist는 '촉촉한'으로 대개 좋은 느낌인 반면, damp는 불쾌한 느낌으로 자주 씁니다.","grammarQuiz":[{"sentence":"The basement always feels cold and _____ during the rainy season.","ko":"지하실은 장마철에 늘 춥고 축축하게 느껴진다.","answer":["damp"],"hint":"형용사"},{"sentence":"Wipe the desk with a slightly _____ cloth to remove the dust.","ko":"먼지를 없애려면 살짝 축축한 천으로 책상을 닦아라.","answer":["damp","wet","moist"],"hint":"형용사"}]},
    {"id":"w01646","w":"delight","pos":["n","v"],"ph":"/dɪˈlaɪt/","cefr":"B1","kr":["기쁨","기쁘게 하다"],"ex":[{"en":"The news brought great delight.","ko":"그 소식은 큰 기쁨을 가져다 주었다."}],"mnemonic":{"soundHint":"'디(de-)+라이트(light,빛)' → 마음에 불이 켜짐","story":"de+light(빛) → 마음에 빛이 들어와 기뻐지다 = delight(기쁨)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"joy","ko":"기쁨","reason":"delight의 대표 동의어로 함께 등장"},{"w":"sadness","ko":"슬픔","reason":"기쁨(delight)의 반의 개념으로 자주 대비"},{"w":"surprise","ko":"놀라움","reason":"'기쁜 놀라움(delightful surprise)'처럼 결합"}],"collocBest":[]},"nuance":{"koSimple":"마음이 환해질 만큼 큰 기쁨.","whenToUse":"기쁜 소식·선물·성과에 감격할 때."},"krDetail":[{"ko":"기쁨","explain":"마음이 매우 즐겁고 흐뭇한 느낌"},{"ko":"기쁘게 하다","explain":"다른 사람의 마음을 즐겁게 만들다"}],"usageExamples":[{"en":"Her surprise gift delighted the whole family last night.","ko":"그녀의 깜짝 선물이 어젯밤 온 가족을 기쁘게 했다."},{"en":"The whole family was delighted by her surprise gift last night.","ko":"온 가족이 어젯밤 그녀의 깜짝 선물에 기뻐했다."}],"grammarNote":"delight는 감정 동사라서 사람을 주어로 쓸 때는 수동태(be delighted)로, 사물이 주어일 때는 능동태로 쓴다. take delight in ~ing(~에 기쁨을 느끼다)도 자주 시험에 나온다.","grammarQuiz":[{"sentence":"The children were _____ _____ the magician's amazing tricks at the show.","ko":"아이들은 쇼에서 마술사의 놀라운 묘기에 기뻐했다.","answer":["delighted","by"],"hint":"감정 수동태 + 행위자 by"},{"sentence":"She takes great _____ _____ helping her younger brother with homework.","ko":"그녀는 남동생의 숙제를 도와주는 것에 큰 기쁨을 느낀다.","answer":["delight","in"],"hint":"take delight in ~ing"}]},
    {"id":"w01659","w":"demonstrate","pos":["v"],"ph":"/ˈdemənstreɪt/","cefr":"B1","kr":["보여주다","입증하다"],"ex":[{"en":"He demonstrated the technique clearly.","ko":"그는 기법을 명확하게 보여주었다."}],"mnemonic":{"soundHint":"'데몬(demon,악마)+스트레이트(straight)' → 악마를 똑바로 보여줌","story":"데몬(악마)을 스트레이트로 시연해 입증 → demonstrate(입증하다)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"show","ko":"보여주다","reason":"demonstrate의 가장 기본적인 동의어"},{"w":"ability","ko":"능력","reason":"'능력을 보여주다(demonstrate ability)' 결합이 흔함"},{"w":"prove","ko":"입증하다","reason":"'입증하다' 의미로 자주 교체 사용"}],"collocBest":[]},"nuance":{"koSimple":"직접 보여주며 사실임을 알려 줌.","whenToUse":"시범·실험·능력 입증을 말할 때."},"krDetail":[{"ko":"보여주다","explain":"직접 해 보이거나 자료로 나타내다"},{"ko":"입증하다","explain":"사실이라는 것을 확실히 밝히다"}],"usageExamples":[{"en":"The scientist demonstrated the new theory to skeptical students yesterday.","ko":"그 과학자는 어제 회의적인 학생들에게 새 이론을 보여주었다."},{"en":"The new theory was demonstrated to skeptical students by the scientist yesterday.","ko":"새 이론이 어제 그 과학자에 의해 회의적인 학생들에게 입증되었다."}],"grammarNote":"demonstrate는 뒤에 that절, 의문사절, how to부정사를 모두 취할 수 있다. demonstrate how the machine works처럼 목적어 자리에 명사절이 오는 구조를 시험에서 자주 묻는다.","grammarQuiz":[{"sentence":"The study clearly demonstrated _____ regular exercise improves memory in teenagers.","ko":"그 연구는 규칙적인 운동이 십대들의 기억력을 향상시킨다는 것을 분명히 입증했다.","answer":["that"],"hint":"demonstrate that + 절"},{"sentence":"Can you demonstrate _____ _____ use this app to a beginner?","ko":"너는 초보자에게 이 앱을 어떻게 사용하는지 보여줄 수 있니?","answer":["how","to"],"hint":"how to 부정사"}]},
    {"id":"w01689","w":"descend","pos":["v"],"ph":"/dɪˈsend/","cefr":"B1","kr":["내려가다","하강하다"],"ex":[{"en":"The hikers descended the mountain carefully.","ko":"등산객들은 조심스럽게 산을 내려갔다."}],"mnemonic":{"soundHint":"'디(de-,아래)+센드(send,보내다)' → 아래로 보내다","story":"de(아래)+scend(오르다) → 위에서 아래로 = descend(내려가다). ascend의 반의어","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ascend","ko":"올라가다","reason":"descend의 대표 반의어"},{"w":"staircase","ko":"계단","reason":"'계단을 내려가다'와 같이 결합"},{"w":"mountain","ko":"산","reason":"'산에서 내려오다' 상황에서 자주 사용"}],"collocBest":[]},"nuance":{"koSimple":"높은 곳에서 낮은 쪽으로 내려감.","whenToUse":"산·계단·비행기가 하강할 때."},"krDetail":[{"ko":"내려가다","explain":"높은 곳에서 낮은 곳으로 옮겨 가다"},{"ko":"하강하다","explain":"위에서 아래쪽으로 서서히 내려가다"}],"usageExamples":[{"en":"The plane began to descend toward the runway.","ko":"비행기는 활주로를 향해 하강하기 시작했다."},{"en":"We slowly descended the stairs in the dark.","ko":"우리는 어둠 속에서 천천히 계단을 내려갔다."}],"grammarNote":"descend는 자동사·타동사 모두 가능해서 descend the stairs(계단을 내려가다)처럼 목적어를 바로 받기도 하고, descend from ~(~의 후손이다)처럼 전치사와 함께도 쓴다. be descended from(~의 후손이다)이라는 수동형도 시험에 잘 나온다.","grammarQuiz":[{"sentence":"The old queen is said to be _____ _____ a Viking warrior.","ko":"그 늙은 여왕은 바이킹 전사의 후손이라고 전해진다.","answer":["descended","from"],"hint":"be descended from ~의 후손이다"},{"sentence":"Please hold the railing carefully as you descend _____ steep stairs.","ko":"가파른 계단을 내려갈 때는 난간을 조심스럽게 잡으세요.","answer":["the"],"hint":"descend + 정관사 + 명사"}]},
    {"id":"w01694","w":"deserve","pos":["v"],"ph":"/dɪˈzɜːrv/","cefr":"B1","kr":["받을 자격이 있다","~할 만하다"],"ex":[{"en":"You deserve a long rest.","ko":"당신은 긴 휴식을 받을 자격이 있다."}],"mnemonic":{"soundHint":"'디저브' → 대접(디저트) 받을 만하다","story":"디저트(dessert)를 받을 만하다 → deserve(받을 자격 있다)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"earn","ko":"얻다","reason":"deserve의 동의어(자격으로 얻다)"},{"w":"credit","ko":"공로","reason":"'공을 인정받다(deserve credit)'로 결합"},{"w":"reward","ko":"보상","reason":"'보상을 받을 만하다' 맥락에서 자주 함께"}],"collocBest":[]},"nuance":{"koSimple":"그만한 대접을 받아 마땅함.","whenToUse":"보상·처벌이 정당하다고 말할 때."},"krDetail":[{"ko":"받을 자격이 있다","explain":"그만한 대접이나 결과를 받을 만하다"},{"ko":"~할 만하다","explain":"그런 일을 겪거나 얻는 것이 당연하다"}],"usageExamples":[{"en":"After working so hard, you deserve a reward.","ko":"그렇게 열심히 일했으니 너는 보상을 받을 자격이 있다."},{"en":"Such rude behavior deserves to be punished.","ko":"그런 무례한 행동은 벌을 받을 만하다."}],"grammarNote":"deserve는 진행형으로 잘 쓰지 않는 상태동사이고, 뒤에 to부정사(deserve to win) 또는 동명사(deserve winning) 둘 다 취할 수 있다. 수동태 뜻으로 동명사를 쓸 때는 The book deserves reading = deserves to be read.","grammarQuiz":[{"sentence":"After all her hard work, she deserves _____ _____ the championship trophy.","ko":"그녀의 모든 노력 끝에, 그녀는 우승 트로피를 받을 자격이 있다.","answer":["to","win"],"hint":"deserve + to부정사"},{"sentence":"This novel is so brilliant that it truly deserves _____ by everyone.","ko":"이 소설은 매우 훌륭해서 정말로 모든 사람에게 읽힐 만하다.","answer":["reading"],"hint":"deserve + 동명사(수동 의미)"}]},
    {"id":"w01705","w":"despite","pos":["prep"],"ph":"/dɪˈspaɪt/","cefr":"B1","kr":["~에도 불구하고"],"ex":[{"en":"She won despite the cold weather.","ko":"그녀는 추운 날씨에도 불구하고 이겼다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+파이트(fight,싸움)' → 반대에도 불구하고","story":"dis(반대)+pite → 반대에도 불구하고 = despite","hintConfidence":2},"pairs":{"buddyWords":[{"w":"although","ko":"비록 ~일지라도","reason":"despite와 유사 의미의 접속사로 함께 학습"},{"w":"fact","ko":"사실","reason":"'despite the fact that'로 흔히 결합"},{"w":"difficulty","ko":"어려움","reason":"'어려움에도 불구하고'라는 맥락에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"~이 있음에도 그와 반대로.","whenToUse":"뒤에 명사·동명사가 올 때."},"krDetail":[{"ko":"~에도 불구하고","explain":"어떤 상황이나 사실이 있어도 상관없이"}],"usageExamples":[{"en":"Despite the rain, they continued the football match.","ko":"비에도 불구하고 그들은 축구 경기를 계속했다."},{"en":"She smiled despite feeling very tired.","ko":"그녀는 매우 피곤했음에도 불구하고 미소 지었다."}],"grammarNote":"despite는 전치사라서 뒤에 명사(구)/동명사만 오고 절이 오면 안 된다. despite the rain(○) / despite it rained(×). 절을 쓰려면 although/though를 사용하고, despite the fact that + 절 형태도 가능하다.","grammarQuiz":[{"sentence":"_____ heavy rain, the outdoor concert continued until midnight last Saturday.","ko":"폭우에도 불구하고, 야외 콘서트는 지난 토요일 자정까지 계속되었다.","answer":["Despite"],"hint":"despite + 명사"},{"sentence":"She passed the exam despite _____ studied only two hours the night before.","ko":"그녀는 전날 밤 단 두 시간만 공부했음에도 불구하고 시험에 합격했다.","answer":["having"],"hint":"despite + 동명사(having p.p.)"}]},
    {"id":"w01720","w":"determine","pos":["v"],"ph":"/dɪˈtɜːrmɪn/","cefr":"B1","kr":["결정하다","알아내다"],"ex":[{"en":"The test will determine the result.","ko":"시험이 결과를 결정할 것이다."}],"mnemonic":{"soundHint":"'디터미네이션(determination,결의)' 연상","story":"터미네이터가 딱! 결정 → determine(결정하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"decide","ko":"결정하다","reason":"determine의 핵심 동의어"},{"w":"cause","ko":"원인","reason":"'원인을 파악하다(determine the cause)'로 결합"},{"w":"factor","ko":"요인","reason":"'요인을 결정하다'라는 맥락에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"조사·판단을 통해 결정하거나 알아냄.","whenToUse":"결과·원인·정책을 정할 때."},"krDetail":[{"ko":"결정하다","explain":"여러 가지 중에서 하나를 확실히 정하다"},{"ko":"알아내다","explain":"정확한 사실이나 원인을 찾아 밝혀 내다"}],"usageExamples":[{"en":"The judge determined the final penalty after reviewing all the evidence.","ko":"그 판사는 모든 증거를 검토한 후 최종 처벌을 결정했다."},{"en":"The final penalty was determined after all the evidence was reviewed.","ko":"최종 처벌은 모든 증거가 검토된 후 결정되었다."}],"grammarNote":"determine 뒤에 to부정사(결심하다) 또는 wh-절/that절(밝혀내다)이 온다. be determined to do(~하기로 굳게 결심하다)는 감정 수동태 형태의 관용 표현으로 자주 시험에 나온다.","grammarQuiz":[{"sentence":"She was determined _____ _____ despite everyone telling her to quit.","ko":"그녀는 모두가 그만두라고 말했음에도 성공하기로 굳게 결심했다.","answer":["to","succeed"],"hint":"be determined to + 동사원형"},{"sentence":"Scientists are trying to determine _____ caused the sudden climate shift.","ko":"과학자들은 무엇이 그 갑작스러운 기후 변화를 일으켰는지 알아내려 하고 있다.","answer":["what"],"hint":"determine + 의문사절"}]},
    {"id":"w01738","w":"diameter","pos":["n"],"ph":"/daɪˈæmɪtər/","cefr":"B1","kr":["지름","직경"],"ex":[{"en":"The circle has a diameter of 10 cm.","ko":"원의 지름은 10cm이다."}],"mnemonic":{"soundHint":"'다이아(dia-,가로질러)+미터(meter,측정)' → 가로지르는 길이","story":"dia(가로질러)+meter(측정) → 원을 가로지르는 길이 = diameter(지름)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"measure","ko":"측정하다","reason":"'지름을 측정하다(measure the diameter)'로 결합"},{"w":"circle","ko":"원","reason":"원의 지름을 나타낼 때 함께 쓰임"},{"w":"radius","ko":"반지름","reason":"지름과 반지름은 수학에서 짝으로 학습"}],"collocBest":[]},"nuance":{"koSimple":"원 한가운데를 가로지르는 길이.","whenToUse":"수학·과학에서 원의 크기를 잴 때."},"krDetail":[{"ko":"지름","explain":"동그라미의 한 점에서 반대쪽 점까지 곧게 그은 선의 길이"},{"ko":"직경","explain":"원의 한가운데를 지나 양 끝을 이은 선의 길이"}],"usageExamples":[{"en":"The pizza has a diameter of about thirty centimeters.","ko":"그 피자는 지름이 약 30센티미터이다."},{"en":"Measure the diameter of the pipe before you cut it.","ko":"자르기 전에 그 관의 직경을 재라."}],"grammarNote":"diameter는 in diameter의 형태로 '지름이 ~인'을 나타낸다. The pond is 5 meters in diameter(그 연못은 지름이 5m이다). radius(반지름)와 짝지어 외우자.","grammarQuiz":[{"sentence":"The ancient tree measured about three meters _____ diameter at the base.","ko":"그 고목은 밑동에서 지름이 약 3미터로 측정되었다.","answer":["in"],"hint":"숫자 + in diameter"},{"sentence":"Scientists carefully measured the _____ of the crater from space.","ko":"과학자들은 우주에서 그 분화구의 지름을 신중하게 측정했다.","answer":["diameter"],"hint":"measure the diameter"}]},
    {"id":"w01787","w":"disaster","pos":["n"],"ph":"/dɪˈzɑːstər/","cefr":"B1","kr":["재난","재해"],"ex":[{"en":"The earthquake was a natural disaster.","ko":"지진은 자연재해였다."}],"mnemonic":{"soundHint":"'디스(dis-,나쁜)+애스터(aster,별)' → 별자리가 나쁨 = 불운","story":"옛사람들은 별이 어긋나면 재앙이 온다고 믿음 → disaster(재난)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"natural","ko":"자연의","reason":"'자연재해(natural disaster)'로 결합"},{"w":"relief","ko":"구호","reason":"'재난 구호(disaster relief)'로 결합"},{"w":"tragedy","ko":"비극","reason":"disaster의 대표 동의어"}],"collocBest":[]},"nuance":{"koSimple":"큰 피해를 남기는 재난.","whenToUse":"자연·인재·실패를 강조할 때."},"krDetail":[{"ko":"재난","explain":"갑자기 닥쳐 큰 피해를 주는 사고"},{"ko":"재해","explain":"지진·홍수처럼 사람들에게 해를 입히는 큰 사건"}],"usageExamples":[{"en":"The flood was the worst disaster in the region's history.","ko":"그 홍수는 그 지역 역사상 최악의 재난이었다."},{"en":"Without practice, the concert could be a disaster.","ko":"연습 없이는 그 콘서트가 엉망이 될 수 있다."}],"grammarNote":"disaster는 셀 수 있는 명사. natural disaster(자연재해), disaster area(재해 지역), disaster relief(재난 구호)처럼 명사+명사 복합어로 자주 쓰인다. 형용사형 disastrous(끔찍한, 참담한)도 함께 익히자.","grammarQuiz":[{"sentence":"Volunteers rushed to help victims of the natural _____ last week.","ko":"자원봉사자들이 지난주 자연재해 피해자들을 돕기 위해 급히 달려갔다.","answer":["disaster"],"hint":"natural disaster"},{"sentence":"The failure of the project turned out to be a complete _____.","ko":"그 프로젝트의 실패는 완전한 재앙으로 드러났다.","answer":["disaster"],"hint":"비유적 의미의 disaster"}]},
    {"id":"w01832","w":"distract","pos":["v"],"ph":"/dɪˈstrækt/","cefr":"B1","kr":["주의를 분산시키다","산만하게 하다"],"ex":[{"en":"Don't let noise distract you from studying.","ko":"소음이 공부에 집중하는 것을 방해하게 두지 마라."}],"mnemonic":{"soundHint":"'디스(dis-,다른)+트랙트(tract,끌다)' → 다른 곳으로 끌다","story":"dis(다른)+tract(끌다) → 주의를 다른 곳으로 끌어 흐트리다 = distract(산만하게 하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"focus","ko":"집중하다","reason":"distract의 대표 반의어"},{"w":"attention","ko":"주의","reason":"'주의를 분산시키다(distract attention)'로 결합"},{"w":"easily","ko":"쉽게","reason":"'쉽게 산만해지는(easily distracted)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"주의를 다른 데로 끌어 흐트러뜨리다.","whenToUse":"집중을 방해하는 상황에서."},"krDetail":[{"ko":"주의를 분산시키다","explain":"정신을 다른 곳으로 흩어지게 하다"},{"ko":"산만하게 하다","explain":"집중하지 못하고 어수선하게 만들다"}],"usageExamples":[{"en":"Loud music from outside distracted the students during the important exam.","ko":"밖에서 들리는 시끄러운 음악이 중요한 시험 도중 학생들의 주의를 분산시켰다."},{"en":"The students were distracted by loud music from outside during the important exam.","ko":"학생들은 중요한 시험 도중 밖에서 들리는 시끄러운 음악에 산만해졌다."}],"grammarNote":"distract + 사람 + from + 동명사/명사(~가 …에 집중하지 못하게 하다) 구조가 시험 포인트. 감정 수동태 be distracted by(~때문에 산만해지다)와 형용사 distracted(정신이 산만한), distracting(산만하게 하는)의 구분도 중요하다.","grammarQuiz":[{"sentence":"Please turn off your phone so it doesn't distract you _____ studying.","ko":"네가 공부에 집중하지 못하게 하지 않도록 휴대폰을 꺼 주세요.","answer":["from"],"hint":"distract 사람 from ~ing"},{"sentence":"He looked completely _____ during the meeting, staring blankly out the window.","ko":"그는 회의 내내 완전히 정신이 산만해 보였고, 창밖을 멍하니 바라보고 있었다.","answer":["distracted"],"hint":"감정 형용사 -ed"}]},
    {"id":"w01834","w":"distribute","pos":["v"],"ph":"/dɪˈstrɪbjuːt/","cefr":"B1","kr":["분배하다","배포하다"],"ex":[{"en":"Food was distributed to people.","ko":"식량이 사람들에게 분배되었다."}],"mnemonic":{"soundHint":"'디스(dis-,따로)+트리뷰트(tribute,나눔)' → 따로따로 나눠주다","story":"dis(따로)+tribute(주다) → 따로따로 나눠주다 = distribute(분배하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collect","ko":"모으다","reason":"distribute의 대표 반의어"},{"w":"equally","ko":"균등하게","reason":"'균등하게 분배하다(distribute equally)'로 결합"},{"w":"material","ko":"자료","reason":"'자료를 배포하다(distribute materials)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"여러 사람에게 나누어 주다.","whenToUse":"물자·자료·상품을 배포할 때."},"krDetail":[{"ko":"분배하다","explain":"몫몫이 나누어 주다"},{"ko":"배포하다","explain":"여러 사람에게 널리 나누어 주다"}],"usageExamples":[{"en":"Volunteers distributed free meals to homeless people across the city yesterday.","ko":"자원봉사자들은 어제 도시 곳곳에서 노숙자들에게 무료 식사를 나누어 주었다."},{"en":"Free meals were distributed to homeless people across the city yesterday.","ko":"무료 식사가 어제 도시 곳곳에서 노숙자들에게 나누어졌다."}],"grammarNote":"distribute + 사물 + to/among + 사람 구조가 핵심. to는 개별 대상, among은 그룹 내 분배를 강조한다. be distributed evenly/equally(고르게 분배되다)라는 수동형 표현도 자주 나온다.","grammarQuiz":[{"sentence":"The teacher will distribute the test papers _____ every student in class.","ko":"선생님은 반의 모든 학생들에게 시험지를 나눠 줄 것이다.","answer":["to"],"hint":"distribute to + 개별 대상"},{"sentence":"The relief supplies were distributed _____ the affected villagers fairly.","ko":"구호 물품은 피해를 입은 마을 사람들 사이에 공정하게 분배되었다.","answer":["among"],"hint":"distribute among + 그룹"}]},
    {"id":"w01836","w":"district","pos":["n"],"ph":"/ˈdɪstrɪkt/","cefr":"B1","kr":["지구","지역"],"ex":[{"en":"She lives in a school district.","ko":"그녀는 학교 구역에 산다."}],"mnemonic":{"soundHint":"'디스트릭트 9' 영화 연상 → 특정 구역","story":"영화 <디스트릭트 9>의 그 district = 지역, 구역","hintConfidence":2},"pairs":{"buddyWords":[{"w":"area","ko":"지역","reason":"district의 대표 동의어"},{"w":"business","ko":"사업의","reason":"'비즈니스 지구(business district)'로 결합"},{"w":"school","ko":"학교","reason":"'학교 구역(school district)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"행정·기능으로 나뉜 지역.","whenToUse":"상업·학군·행정 구역을 말할 때."},"krDetail":[{"ko":"지구","explain":"행정이나 특정 목적으로 나누어 놓은 땅의 구역"},{"ko":"지역","explain":"일정한 특징이 있는 넓은 땅의 부분"}],"usageExamples":[{"en":"This shopping district is busy on weekends.","ko":"이 쇼핑 지구는 주말에 붐빈다."},{"en":"The school is located in a quiet residential district.","ko":"그 학교는 조용한 주거 지역에 있다."}],"grammarNote":"district는 셀 수 있는 명사. 미국 학군을 뜻하는 school district, 상업 지구를 뜻하는 business/financial district, 국회의원 선거구인 electoral district처럼 특정 성격의 구역을 나타낼 때 형용사와 함께 쓴다.","grammarQuiz":[{"sentence":"This restaurant is located in the busiest business _____ of the city.","ko":"이 식당은 그 도시의 가장 번화한 비즈니스 지구에 위치해 있다.","answer":["district"],"hint":"business district"},{"sentence":"Every child _____ this district must attend the local elementary school.","ko":"이 학군의 모든 아이는 지역 초등학교에 다녀야 한다.","answer":["in"],"hint":"in + 지역/구역"}]},
    {"id":"w01837","w":"disturb","pos":["v"],"ph":"/dɪˈstɜːrb/","cefr":"B1","kr":["방해하다","불안하게 하다"],"ex":[{"en":"Please do not disturb anyone.","ko":"아무도 방해하지 마세요."}],"mnemonic":{"soundHint":"'디스(dis-,흐트림)+터브(turb,돌다)' → 헝클어 놓다","story":"dis(반대)+turb(돌다) → 흐름을 흐트려 방해하다 = disturb","hintConfidence":2},"pairs":{"buddyWords":[{"w":"calm","ko":"진정시키다","reason":"disturb의 대표 반의어"},{"w":"sleep","ko":"잠","reason":"'잠을 방해하다(disturb sleep)'로 결합"},{"w":"interrupt","ko":"중단시키다","reason":"disturb의 대표 동의어"}],"collocBest":[]},"nuance":{"koSimple":"조용함·평온을 흔들어 방해함.","whenToUse":"수면·회의·평화를 깨뜨릴 때."},"krDetail":[{"ko":"방해하다","explain":"하고 있는 일을 못 하도록 가로막다"},{"ko":"불안하게 하다","explain":"마음이 편치 않게 흔들리게 만들다"}],"usageExamples":[{"en":"Loud construction noises disturbed the sleeping baby all through the night.","ko":"시끄러운 공사 소음이 밤새도록 자고 있는 아기를 방해했다."},{"en":"The sleeping baby was disturbed by loud construction noises all through the night.","ko":"자고 있던 아기는 밤새도록 시끄러운 공사 소음 때문에 잠을 방해받았다."}],"grammarNote":"disturb는 감정 동사로도 쓰여 be disturbed by(~때문에 마음이 흔들리다)라는 수동형이 자주 나온다. 형용사 disturbing(불안하게 하는), disturbed(마음이 흔들린)의 -ing/-ed 구분을 시험에서 자주 묻는다.","grammarQuiz":[{"sentence":"Please don't disturb your father _____ he is working in his office.","ko":"아버지가 사무실에서 일하고 계실 때는 그를 방해하지 마세요.","answer":["while"],"hint":"while + 진행 상황"},{"sentence":"The news of the accident was very _____ to everyone in town.","ko":"그 사고 소식은 마을의 모든 사람에게 매우 충격적이었다.","answer":["disturbing"],"hint":"감정 형용사 -ing"}]},

function getWordStat(id){

function promoteBox(id){
  const s = getWordStat(id);

}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){

  const m = Math.floor(s/60), r = s%60;

}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}
function startAdvanced(){
  state.phase = "quiz";
  state.quizType = "advanced";
  state.quizPool = buildAdvancedPool();
  state.quizIdx = 0;
  state.quizCorrect = 0;

function startQuiz(){
  state.phase = "quiz";
  state.quizPool = buildQuizPool();
  state.quizIdx = 0;
  state.quizCorrect = 0;
  state.quizWrongIds = new Set();
  state.quizWrongItems = [];
  renderQuiz();
}

function renderQuiz(){
  if(state.quizIdx >= state.quizPool.length){
    finishSession();
    return;
  }
  state.quizAnswered = false;
  state.quizCurrent = state.quizPool[state.quizIdx];
  renderHeader();

  const { word, mode } = state.quizCurrent;
  const main = document.getElementById("main");

  let modeLabel = ({
    "meaning-mcq":"영→한 의미",
    "word-mcq":"한→영 단어",
    "spelling":"철자 입력",
    "listening":"듣고 받아쓰기",
    "colloc-write":"🎯 콜로케이션 영작",
    "cloze":"🎯 예문 빈칸 채우기",
    "grammar-fill":"📌 문법 서술형 빈칸"
  })[mode] || mode;

  let promptHTML = "";
  let answerHTML = "";

  if(mode === "meaning-mcq"){
    const correct = word.kr[0];
    const distractors = pickDistractors(word, "kr", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 단어의 뜻은?</div>
        <div class="qword">${escape(word.w)}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "word-mcq"){
    const correct = word.w;
    const distractors = pickDistractors(word, "w", 3);
    const opts = shuffle([correct, ...distractors]);
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}
      </div>`;
  } else if(mode === "spelling"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻을 보고 영어 단어를 입력하세요 <span class="prefill-hint">(첫 글자는 잠겨 있음)</span></div>
        <div class="qkr">${escape(word.kr.join(" · "))}</div>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(word.w)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "listening"){
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">발음을 듣고 단어를 입력하세요 <span class="prefill-hint">(첫 글자는 잠겨 있음)</span></div>
        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(word.w)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;
    promptHTML = `
      <div class="quiz-prompt">
        <div class="label">뜻에 맞는 <b>콜로케이션</b>을 영어로 쓰세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(c.ko)}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <div class="word-answer" id="wordAnswer" data-answer="${escape(c.en)}"></div>
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "cloze"){
    const { tokens, blankIdxs, sentence } = state.quizCurrent;
    const sentHTML = tokens.map((t, i) => {
      const bIdx = blankIdxs.indexOf(i);
      if(bIdx >= 0){
        return `<span class="word-answer inline cloze-wa" data-blank-idx="${bIdx}" data-answer="${escape(t.text)}"></span>`;
      }
      return escape(t.text);
    }).join("");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt">
        <div class="label">해석에 맞게 <b>${blankIdxs.length}개 빈칸</b>을 채우세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(sentence.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
      </div>`;
    answerHTML = `
      <div class="input-box only-btn">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;
  } else if(mode === "grammar-fill"){
    const { quiz } = state.quizCurrent;
    const ansList = Array.isArray(quiz.answer) ? quiz.answer : [quiz.answer];
    let blankSeq = 0;
    const sentHTML = escape(quiz.sentence).replace(/_{3,}/g, () => {
      const ans = ansList[blankSeq] ?? ansList[0];
      const idx = blankSeq++;
      return `<span class="word-answer inline cloze-wa" data-blank-idx="${idx}" data-answer="${escape(ans)}"></span>`;
    });
    promptHTML = `
      <div class="quiz-prompt cloze-prompt grammar-prompt">
        <div class="label">📌 <b>문법 포인트</b> — 해석에 맞게 빈칸을 채우세요 <span class="prefill-hint">(각 단어 첫 글자 잠금)</span></div>
        <div class="qkr">${escape(quiz.ko)}</div>
        <div class="cloze-sentence">${sentHTML}</div>
      </div>`;

      <div class="input-box only-btn">
        <button class="submit-btn" id="submitBtn">제출</button>
      </div>`;

  main.innerHTML = `
    <div class="quiz-stage">

        <div class="quiz-num">문제 <b>${state.quizIdx+1}</b> / ${state.quizPool.length}</div>
        <div class="quiz-mode">${modeLabel}</div>
      </div>
      <div class="quiz-card">
        ${promptHTML}
        ${answerHTML}
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
  `;

  // wire
  if(mode === "meaning-mcq" || mode === "word-mcq"){
    document.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=> handleChoice(btn));
    });
  } else if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    containers.forEach(c => renderWordAnswer(c, c.dataset.answer));
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = document.querySelector(".cloze-wa .rest-input");
    if(first) setTimeout(()=>first.focus(), 100);
  } else {
    const container = document.getElementById("wordAnswer");
    renderWordAnswer(container, container.dataset.answer);
    document.getElementById("submitBtn").addEventListener("click", handleSubmit);
    const first = container.querySelector(".rest-input");

      setTimeout(()=>speak(word.w), 250);
      document.getElementById("lisBtn").addEventListener("click", ()=>speak(word.w));
    }
  }
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* ============================================================
   RESULT
   ============================================================ */
function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));

  renderHeader();

  const main = document.getElementById("main");

  // 심화면 [🎯 심화 다시] + [🏠 홈으로]. 기본이면 [🔁 다시 보기] + (심화 해금 시) [🎯 심화 도전]

      setTimeout(()=>{ SFX.grandFanfare(); }, 4000);                // 마지막 대미 팡파레
    } else if(isPerfect){
      fx.spawn("rainbow-burst");
      SFX.bigWin();
      setTimeout(()=>fx.spawn("jackpot-full"), 600);
      setTimeout(()=>SFX.coinDrop(), 700);
    } else if(newCleared){
      fx.spawn("jackpot-full");
      SFX.levelUp();
      setTimeout(()=>SFX.coinDrop(), 500);
    } else if(pct >= 80){
      fx.spawn("reel-spin-small");
      SFX.spinReel();
    }
  }, 250);

  document.getElementById("retryBtn").addEventListener("click", ()=>{
    if(isAdv){ startAdvanced(); }
    else{ renderHome(); }
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    alert("Lv.2 미생성 — 시범 버전입니다.");
  });
  const goAdvBtn = document.getElementById("goAdvBtn");
  if(goAdvBtn) goAdvBtn.addEventListener("click", ()=>{
    state.quizType = "advanced";
    startAdvanced();
  });
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=> renderHome());
  const retryWrongBtn = document.getElementById("retryWrongBtn");
  if(retryWrongBtn){
    retryWrongBtn.addEventListener("click", ()=>{
      if(isAdv) startAdvancedRetryWrong();
      else startBasicRetryWrong();
    });
  }
}

function showHighGradeCelebration(msg){

  overlay.className = 'hg-celebration';

    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;

      if(ko) u.voice = ko;

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});
