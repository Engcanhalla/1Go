<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>단어의 추억 · 고1 Lv.14</title>
<style>
  :root{
    --bg-deep:#0f172a;
    --bg-card:#1e293b;
    --bg-card-hover:#253347;
    --bg-card-2:#253347;
    --accent:#f59e0b;
    --accent-light:#fbbf24;
    --accent-glow:rgba(245,158,11,0.15);
    --accent-glow-strong:rgba(245,158,11,0.30);
    --text:#f1f5f9;
    --text-on-dark:#f1f5f9;
    --text-muted:#94a3b8;
    --text-on-dark-muted:#94a3b8;
    --success:#10b981;
    --danger:#ef4444;
    --info:#3b82f6;
    --grade:#10b981;
    --grade-soft:rgba(16,185,129,.15);
    --grade-glow:rgba(16,185,129,.30);
    --grade-glow-strong:rgba(16,185,129,.50);
    --radius-sm:8px;
    --radius-md:14px;
    --radius-lg:20px;
    --radius-xl:28px;
    --shadow-sm:0 1px 3px rgba(0,0,0,.30);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 12px 40px rgba(0,0,0,.45);
    --shadow-xl:0 24px 60px rgba(0,0,0,.55);
    --transition:0.25s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg-deep);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;overscroll-behavior:none;
  }
  /* ── Noise texture overlay ── */
  body::before{
    content:'';position:fixed;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events:none;z-index:0;
  }
  /* ── Ambient glow blob (top-right) ── */
  body::after{
    content:'';position:fixed;top:-200px;right:-200px;
    width:600px;height:600px;
    background:radial-gradient(circle, rgba(16,185,129,0.10) 0%, transparent 70%);
    pointer-events:none;z-index:0;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,.82));
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(148,163,184,.10);
    padding:12px 16px 10px;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .grade-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--grade-soft);color:var(--grade);
    padding:6px 14px;border-radius:100px;
    font-weight:700;font-size:.78rem;
    letter-spacing:.06em;text-transform:uppercase;
    border:1px solid rgba(16,185,129,.35);
    box-shadow:0 0 0 3px rgba(16,185,129,.08);
  }
  .grade-badge .chap{color:var(--text);opacity:.85;font-weight:600;text-transform:none;letter-spacing:0;}
  .stats{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);}
  .stat-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    transition:background var(--transition);
  }
  .stat-pill b{color:var(--text);font-weight:700;}
  .icon-btn{
    width:38px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(148,163,184,.08);
    border:1px solid rgba(148,163,184,.12);
    font-size:18px;line-height:1;
    transition:all var(--transition);
  }
  .icon-btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0) scale(.94);}
  .icon-btn.on{background:var(--grade-soft);border-color:var(--grade);box-shadow:0 0 12px var(--grade-glow);}

  .progress-wrap{margin-top:12px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:rgba(148,163,184,.15);
    transition:all var(--transition);
  }
  .dot.done{background:var(--grade);box-shadow:0 0 6px var(--grade-glow);}
  .dot.current{background:var(--accent);transform:scale(1.35);box-shadow:0 0 10px var(--accent-glow-strong);}
  .pbar{
    height:6px;border-radius:100px;
    background:rgba(148,163,184,.12);
    overflow:hidden;
    position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2);
  }
  .pbar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--grade), #34d399);
    box-shadow:0 0 10px var(--grade-glow-strong), inset 0 1px 0 rgba(255,255,255,.2);
    border-radius:100px;
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- MAIN ---------- */
  main{
    position:relative;z-index:1;
    max-width:560px;margin:0 auto;padding:16px;
    min-height:calc(100vh - 130px);
    display:flex;flex-direction:column;
  }
  @keyframes view-in{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  main > *{animation:view-in .35s cubic-bezier(.4,0,.2,1);}

  /* ---------- HOME ---------- */
  .home{
    text-align:center;padding:36px 16px 20px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .home .badge-mini{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(16,185,129,.12);color:var(--grade);
    font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 16px;border-radius:100px;
    border:1px solid rgba(16,185,129,.25);
    margin-bottom:8px;
  }
  .home h1{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:2.4rem;margin:0;
    color:var(--text-on-dark);
    font-weight:800;letter-spacing:-1px;line-height:1.15;
  }
  .home h1 .accent{
    background:linear-gradient(135deg, var(--grade) 0%, #34d399 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .home .sub{color:var(--text-on-dark-muted);font-size:1rem;line-height:1.6;max-width:340px;}
  .home .lvl{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:56px;font-weight:900;color:var(--grade);
    text-shadow:0 0 30px var(--grade-glow-strong);margin:6px 0 0;
    letter-spacing:-2px;
  }
  .home-card{
    background:var(--bg-card);border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);padding:22px;width:100%;max-width:420px;
    box-shadow:var(--shadow-lg);
    margin-top:6px;
  }
  .home-card .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid rgba(148,163,184,.10);
    font-size:.92rem;color:var(--text-on-dark-muted);
  }
  .home-card .row:last-child{border-bottom:0;}
  .home-card .row b{color:var(--grade);font-weight:700;}
  .start-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    margin-top:10px;
    background:linear-gradient(135deg, var(--grade) 0%, #059669 100%);
    color:#ffffff;font-weight:700;font-size:1.05rem;letter-spacing:.02em;
    padding:15px 40px;border-radius:var(--radius-md);
    box-shadow:0 8px 24px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.15);
    transition:all var(--transition);min-height:52px;
  }
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(16,185,129,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn:active{transform:translateY(0) scale(.98);}
  .start-btn.alt{
    background:linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
    box-shadow:0 8px 24px rgba(245,158,11,.35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .start-btn.alt:hover{box-shadow:0 12px 32px rgba(245,158,11,.45), inset 0 1px 0 rgba(255,255,255,.15);}
  .start-btn.adv{
    background:linear-gradient(135deg, #a855f7 0%, #6d28d9 100%);
    box-shadow:0 8px 24px rgba(168,85,247,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.adv:hover{box-shadow:0 12px 32px rgba(168,85,247,.55), inset 0 1px 0 rgba(255,255,255,.18);}
  .start-btn.wrong-only{
    background:linear-gradient(135deg,#ef4444 0%,#b91c1c 100%);
    box-shadow:0 8px 24px rgba(239,68,68,.40), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .start-btn.wrong-only:hover{box-shadow:0 12px 32px rgba(239,68,68,.55), inset 0 1px 0 rgba(255,255,255,.18);}

  /* ---------- STAGE PICKER (홈) ---------- */
  .stage-picker{
    display:grid;grid-template-columns:1fr;gap:12px;width:100%;max-width:420px;margin:8px 0;
  }
  .stage-btn{
    display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:2px 14px;
    align-items:center;text-align:left;
    padding:16px 20px;border-radius:var(--radius-lg);
    background:linear-gradient(135deg, rgba(30,41,59,.85), rgba(15,23,42,.85));
    border:1px solid rgba(148,163,184,.20);
    color:var(--text-on-dark);cursor:pointer;
    transition:all var(--transition);
    position:relative;
  }
  .stage-btn .ic{grid-row:span 2;font-size:2rem;text-align:center;}
  .stage-btn .ttl{font-size:1.10rem;font-weight:800;letter-spacing:.02em;}
  .stage-btn .desc{font-size:.82rem;color:var(--text-on-dark-muted);}
  .stage-btn:hover{transform:translateY(-2px);border-color:rgba(148,163,184,.45);box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .stage-btn.basic{border-color:rgba(16,185,129,.35);}
  .stage-btn.basic .ttl{color:var(--grade);}
  .stage-btn.basic:hover{border-color:rgba(16,185,129,.65);box-shadow:0 8px 24px rgba(16,185,129,.30);}
  .stage-btn.advanced{border-color:rgba(168,85,247,.35);}
  .stage-btn.advanced .ttl{color:#c4b5fd;}
  .stage-btn.advanced:hover:not([disabled]){border-color:rgba(168,85,247,.65);box-shadow:0 8px 24px rgba(168,85,247,.30);}
  .stage-btn[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.4);}
  .stage-btn[disabled]:hover{transform:none;box-shadow:none;}

  /* ---------- CLOZE 입력 ---------- */
  .cloze-prompt .cloze-sentence{
    font-size:1.35rem;line-height:2.2;color:#f8fafc;font-weight:500;
    margin-top:14px;padding:14px 16px;
    background:rgba(15,23,42,.55);border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.18);
    text-align:center;letter-spacing:.02em;
  }
  .cloze-input{
    display:inline-block;
    background:rgba(168,85,247,.10);color:#f8fafc;
    border:2px solid rgba(168,85,247,.50);border-radius:8px;
    font:inherit;font-weight:700;
    padding:2px 10px;margin:0 4px;
    outline:none;transition:all var(--transition);
    min-width:60px;text-align:center;
  }
  .cloze-input:focus{border-color:#c4b5fd;background:rgba(168,85,247,.18);box-shadow:0 0 0 4px rgba(168,85,247,.20);}
  .grammar-prompt .qkr{color:#fef3c7;}
  .grammar-hint{margin-top:10px;padding:8px 12px;background:rgba(252,211,77,.10);border:1px solid rgba(252,211,77,.28);border-radius:8px;color:#fcd34d;font-size:.92rem;line-height:1.5;}
  .cloze-input.correct{border-color:var(--grade);background:rgba(16,185,129,.15);color:#a7f3d0;}
  .cloze-input.wrong{border-color:var(--danger);background:rgba(239,68,68,.15);color:#fca5a5;}
  .input-box.only-btn{justify-content:center;}
  .hint-line{margin-top:12px;padding:10px 14px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.35);border-radius:10px;color:#c4b5fd;font-size:.95rem;line-height:1.55;text-align:center;letter-spacing:.03em;}
  .hint-line b{color:#fef3c7;font-weight:800;font-family:'Courier New',ui-monospace,monospace;font-size:1.05rem;letter-spacing:.15em;margin:0 2px;}

  /* ---------- CARD STUDY ---------- */
  .stage{position:relative;padding:14px 2px;perspective:1200px;flex:1;display:flex;flex-direction:column;}
  .word-counter{
    color:var(--text-on-dark-muted);text-align:center;font-size:.82rem;
    margin-bottom:12px;letter-spacing:.02em;
  }
  .word-counter b{color:var(--grade);font-weight:700;}

  .flipcard{
    position:relative;width:100%;min-height:400px;
    transform-style:preserve-3d;
    transition:transform .48s cubic-bezier(.2,.7,.1,1.2);
    cursor:pointer;
  }
  .flipcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--bg-card);
    border:1px solid rgba(148,163,184,.10);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    padding:22px;
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .face.front{
    align-items:center;justify-content:center;text-align:center;gap:14px;
    background:
      radial-gradient(circle at 50% 30%, rgba(16,185,129,.10), transparent 65%),
      var(--bg-card);
  }
  .face.front .pos-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  .pos-tag{
    background:rgba(245,158,11,.14);color:var(--accent-light);
    padding:4px 10px;border-radius:100px;
    font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid rgba(245,158,11,.20);
  }
  .face.front .word{
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    font-size:64px;font-weight:800;letter-spacing:-1.5px;
    line-height:1.05;
    color:var(--text-on-dark);
    text-shadow:0 0 32px rgba(16,185,129,.22);
    word-break:break-word;
  }
  .face.front .ph{color:var(--text-on-dark-muted);font-size:1.05rem;font-style:italic;}
  .face.front .cefr{
    position:absolute;top:16px;right:16px;
    background:var(--grade-soft);color:var(--grade);
    padding:4px 10px;border-radius:100px;font-size:.68rem;font-weight:700;
    letter-spacing:.08em;border:1px solid rgba(16,185,129,.25);
  }
  .face.front .hint{color:var(--text-on-dark-muted);font-size:.78rem;margin-top:10px;opacity:.7;letter-spacing:.02em;}
  .speak-btn{
    margin-top:6px;
    background:rgba(59,130,246,.10);color:var(--info);
    border:1px solid rgba(59,130,246,.28);
    padding:10px 18px;border-radius:var(--radius-sm);
    font-size:.88rem;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;min-height:40px;
    transition:all var(--transition);
  }
  .speak-btn:hover{background:rgba(59,130,246,.18);transform:translateY(-1px);}
  .speak-btn:active{transform:translateY(0) scale(.96);}

  .face.back{
    transform:rotateY(180deg);
    padding:18px 18px 16px;
    overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-hover) 100%);
  }
  /* ── 뒷면 폰트 +20% · 고대비 muted 오버라이드 ── */
  .back{
    /* 뒷면 전용 강화 색 (기본 muted #94a3b8 → #cbd5e1 slate-300) */
    --back-muted:#cbd5e1;
    --back-muted-strong:#e2e8f0;
  }
  .back .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .back .top .w{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.8rem;font-weight:800;color:var(--grade);letter-spacing:-.5px;}
  .back .top .ph{color:var(--back-muted-strong);font-size:.98rem;font-style:italic;}
  .back .kr{
    font-size:1.5rem;font-weight:700;line-height:1.4;
    margin:6px 0 16px;color:#ffffff;
  }
  .back .kr .sep{color:var(--back-muted);margin:0 6px;font-weight:500;opacity:.85;}
  .section{
    background:rgba(15,23,42,.62);border-radius:var(--radius-md);padding:14px 16px;
    margin-bottom:12px;border:1px solid rgba(148,163,184,.18);
  }
  .section .label{
    font-size:.80rem;color:var(--back-muted-strong);
    text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:700;
    display:flex;align-items:center;gap:4px;
  }
  .section.sound{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(245,158,11,.35);
  }
  .section.sound .label{color:var(--accent-light);}
  .section.sound .body{color:#fef3c7;font-weight:600;font-size:1.10rem;}
  .section.story{
    background:linear-gradient(135deg, rgba(59,130,246,.14), rgba(59,130,246,.05));
    border:1px solid rgba(59,130,246,.35);
  }
  .section.story .label{color:#93c5fd;}
  .section.story .body{color:#dbeafe;font-size:1.03rem;line-height:1.55;}
  /* ── 한자 풀이 (wexplain krDetail) ── */
  .section.hanja{
    background:linear-gradient(135deg, rgba(249,115,22,.14), rgba(249,115,22,.05));
    border:1px solid rgba(253,186,116,.38);
  }
  .section.hanja .label{color:#fed7aa;}
  .section.hanja .hanja-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .section.hanja .hanja-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#fff7ed;font-size:1rem;line-height:1.55;
  }
  .section.hanja .ko-word{font-weight:800;color:#fed7aa;white-space:nowrap;}
  .section.hanja .arrow{color:#fdba74;font-weight:600;}
  .section.hanja .explain{color:#ffedd5;font-weight:500;}
  /* ── 자·타동사 예시 (wexplain usageExamples) ── */
  .section.usage{
    background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(20,184,166,.05));
    border:1px solid rgba(94,234,212,.38);
  }
  .section.usage .label{color:#5eead4;}
  .section.usage .usage-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .section.usage .usage-item{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    color:#ecfeff;line-height:1.5;
  }
  .section.usage .usage-item .en{font-weight:600;color:#5eead4;}
  .section.usage .usage-item .ko{color:#a5f3fc;}
  .section.usage .usage-item .speak-btn{
    background:transparent;border:1px solid rgba(94,234,212,.4);color:#5eead4;
    padding:2px 6px;border-radius:6px;font-size:.85rem;cursor:pointer;
  }
  /* ── 문법 포인트 (wexplain grammarNote) ── */
  .section.grammar{
    background:linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.05));
    border:1px solid rgba(252,211,77,.38);
  }
  .section.grammar .label{color:#fcd34d;}
  .section.grammar .body{color:#fef3c7;font-weight:500;line-height:1.55;font-size:.98rem;}
  /* ── 뉘앙스 섹션 (wkorean) ── */
  .section.nuance{
    background:linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.05));
    border:1px solid rgba(168,85,247,.38);
  }
  .section.nuance .label{color:#c4b5fd;}
  .section.nuance .body.ko-simple{color:#f5f3ff;font-weight:600;font-size:1.05rem;line-height:1.55;}
  .section.nuance .when-to-use{
    color:#ddd6fe;font-size:.94rem;line-height:1.55;margin-top:8px;padding-top:8px;
    border-top:1px dashed rgba(168,85,247,.28);font-style:italic;letter-spacing:.01em;
  }
  .section .body{font-size:1.03rem;line-height:1.55;color:#f8fafc;}
  .buddy-list,.col-list{display:flex;flex-direction:column;gap:8px;}
  .buddy-item,.col-item{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
    font-size:1.03rem;
    padding:6px 0;border-bottom:1px dashed rgba(148,163,184,.18);
  }
  .buddy-item:last-child,.col-item:last-child{border-bottom:0;}
  .buddy-item .en, .col-item .en{color:#ffffff;font-weight:700;}
  .buddy-item .ko, .col-item .ko{color:var(--back-muted-strong);font-size:.94rem;text-align:right;font-weight:500;}

  .input-box{

    font-family:'Segoe UI','Malgun Gothic',sans-serif;

  .result .score-pct{color:var(--text-on-dark-muted);font-size:1.1rem;font-weight:600;}

    display:inline-flex;align-items:center;gap:6px;

    color:#f8fafc;font-size:1.05rem;font-weight:600;letter-spacing:.02em;
  }
  .result .score-time b{color:var(--accent-light);font-weight:800;font-variant-numeric:tabular-nums;}
  /* 심화 90%+ 배곧 쵝오 배너 */
  .grand-banner{
    position:relative;margin:14px auto 4px;padding:16px 22px;max-width:520px;
    border-radius:var(--radius-lg);
    background:linear-gradient(135deg,#7c3aed 0%,#db2777 45%,#f59e0b 100%);
    box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;
    text-align:center;overflow:hidden;

  }
  .grand-banner::before{
    content:"";position:absolute;inset:0;

               radial-gradient(circle at 70% 80%, rgba(255,255,255,.25), transparent 50%);

  }
  .grand-banner .grand-line{
    font-size:1.65rem;font-weight:900;color:#fff;letter-spacing:.02em;
    text-shadow:0 2px 12px rgba(0,0,0,.35);position:relative;
  }
  .grand-banner .grand-line b{
    background:linear-gradient(135deg,#fde68a 0%,#fbbf24 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;padding:0 4px;
  }
  .grand-banner .grand-sub{
    margin-top:6px;color:rgba(255,255,255,.95);
    font-size:.98rem;font-weight:700;letter-spacing:.02em;position:relative;
  }
  @keyframes grandPop{
    0%{transform:scale(.7) rotate(-3deg);opacity:0;}
    60%{transform:scale(1.06) rotate(1deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes grandGlow{
    from{box-shadow:0 12px 40px rgba(168,85,247,.45),0 0 0 1px rgba(255,255,255,.15) inset;}
    to  {box-shadow:0 20px 60px rgba(245,158,11,.65),0 0 0 1px rgba(255,255,255,.35) inset;}
  }
  /* 고등학교 심화 100% — 화면 전체 랜덤 축하 오버레이 */
  .hg-celebration{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(15,23,42,.55) 0%, rgba(2,6,23,.90) 60%, rgba(0,0,0,.98) 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;
    animation:hgFadeIn .35s ease-out both, hgFadeOut .8s ease-in 5.2s forwards;
  }
  .hg-celebration::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(251,191,36,.30), transparent 20%),
      radial-gradient(circle at 80% 25%, rgba(236,72,153,.28), transparent 22%),
      radial-gradient(circle at 30% 75%, rgba(59,130,246,.28), transparent 24%),
      radial-gradient(circle at 75% 80%, rgba(16,185,129,.28), transparent 22%);
    animation:hgSwirl 6s ease-in-out infinite alternate;
    pointer-events:none;
  }
  .hg-halo{
    position:absolute;inset:0;pointer-events:none;
    background:conic-gradient(from 0deg,#fbbf24,#ef4444,#a855f7,#3b82f6,#10b981,#fbbf24);
    mix-blend-mode:screen;opacity:.28;
    animation:hgRotate 12s linear infinite;
  }
  .hg-msg{
    position:relative;font-family:inherit;
    font-size:clamp(28px, 6vw, 68px);font-weight:900;line-height:1.25;text-align:center;
    padding:32px 40px;max-width:92vw;letter-spacing:-.01em;
    background:linear-gradient(90deg,#fbbf24,#ef4444,#ec4899,#a855f7,#3b82f6,#10b981,#fbbf24);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(251,191,36,.75)) drop-shadow(0 0 40px rgba(236,72,153,.45));
    animation:hgRainbow 3.5s linear infinite, hgPop 1.6s cubic-bezier(.2,.7,.1,1.4) both, hgFloat 4s ease-in-out infinite alternate 1.6s;
  }
  .hg-sparkle{
    position:absolute;pointer-events:none;font-size:clamp(24px,3vw,36px);
    animation:hgSparkle 1.8s ease-in-out infinite;
  }
  @keyframes hgFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes hgFadeOut{to{opacity:0;visibility:hidden;}}
  @keyframes hgRainbow{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
  @keyframes hgPop{
    0%{transform:scale(.15) rotate(-25deg);opacity:0;}
    35%{transform:scale(1.28) rotate(6deg);opacity:1;}
    55%{transform:scale(.94) rotate(-3deg);}
    75%{transform:scale(1.08) rotate(1.5deg);}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes hgFloat{
    from{transform:translateY(-6px) scale(1);}
    to{transform:translateY(6px) scale(1.02);}
  }
  @keyframes hgSwirl{
    0%{transform:scale(1) rotate(0);}
    100%{transform:scale(1.15) rotate(8deg);}
  }
  @keyframes hgRotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes hgSparkle{
    0%,100%{opacity:0;transform:scale(.4) rotate(0deg);}
    50%{opacity:1;transform:scale(1.2) rotate(180deg);}
  }
  .result-stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    margin:22px 0;
  }
  .result-stat{
    background:var(--bg-card);padding:16px 12px;border-radius:var(--radius-md);
    border:1px solid rgba(148,163,184,.10);
    box-shadow:var(--shadow-md);
    transition:transform var(--transition);
  }
  .result-stat:hover{transform:translateY(-2px);}
  .result-stat .l{font-size:.68rem;color:var(--text-on-dark-muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .result-stat .v{font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text-on-dark);margin-top:6px;}
  .result-stat .v.grade-c{color:var(--grade);}
  .result-stat .v.acc-c{color:var(--accent-light);}
  .badges-earned{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 20px;
  }
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-card);padding:8px 14px;border-radius:100px;
    font-size:.82rem;font-weight:700;
    border:1px solid var(--accent);color:var(--accent-light);
    box-shadow:0 0 16px rgba(245,158,11,.22), 0 4px 12px rgba(0,0,0,.3);
    animation:badge-pop .5s cubic-bezier(.2,.7,.1,1.4) backwards;
  }
  .badge .ic{font-size:1.1rem;}
  @keyframes badge-pop{from{transform:scale(.4) rotate(-10deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  /* ---------- ANIMATIONS ---------- */
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  @keyframes bounce-correct{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .shake{animation:shake .22s ease;}
  .bounce-correct{animation:bounce-correct .32s ease;}

  /* ---------- CANVAS (particles) ---------- */
  #fxCanvas{
    position:fixed;inset:0;pointer-events:none;z-index:50;
  }

  /* ---------- TOAST ---------- */
  .toast-wrap{
    position:fixed;top:88px;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;z-index:40;
  }
  .toast{
    background:rgba(15,23,42,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--accent-light);
    padding:10px 18px;border-radius:100px;font-weight:700;font-size:.86rem;
    letter-spacing:.02em;
    border:1px solid rgba(245,158,11,.35);
    box-shadow:0 8px 24px rgba(0,0,0,.4), 0 0 20px rgba(245,158,11,.15);
    animation:toast-in .3s cubic-bezier(.4,0,.2,1), toast-out .45s cubic-bezier(.4,0,.2,1) 1.4s forwards;
  }
  .toast.streak{color:var(--accent-light);}
  .toast.big{font-size:1.05rem;padding:14px 24px;border-color:rgba(16,185,129,.4);color:#a7f3d0;box-shadow:0 12px 32px rgba(0,0,0,.5), 0 0 24px rgba(16,185,129,.2);}
  @keyframes toast-in{from{transform:translateY(-14px) scale(.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes toast-out{to{transform:translateY(-14px) scale(.9);opacity:0;}}

  /* ---------- RAINBOW BURST ---------- */
  .rainbow-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:45;
    background:linear-gradient(135deg,
      rgba(255,0,128,.0), rgba(255,255,0,.0), rgba(0,255,128,.0), rgba(0,128,255,.0), rgba(255,0,255,.0));
    animation:rainbow 1.5s ease;
  }
  @keyframes rainbow{
    0%{background:linear-gradient(135deg, rgba(255,0,128,.0), rgba(255,255,0,.0));}
    25%{background:linear-gradient(135deg, rgba(255,0,128,.35), rgba(255,255,0,.30));}
    50%{background:linear-gradient(135deg, rgba(0,255,128,.30), rgba(0,128,255,.30));}
    75%{background:linear-gradient(135deg, rgba(255,0,255,.30), rgba(255,128,0,.30));}
    100%{background:linear-gradient(135deg, rgba(0,0,0,0), rgba(0,0,0,0));}
  }

  /* ---------- HIDE ---------- */
  .hidden{display:none !important;}

  /* ---------- MOBILE TUNING ---------- */
  @media (max-width:380px){
    .face.front .word{font-size:54px;}
    .quiz-prompt .qword{font-size:30px;}
    .home h1{font-size:26px;}
  }

  /* ---------- TIMER ---------- */
  .timer-pill{
    background:rgba(148,163,184,.08);
    padding:6px 10px;border-radius:var(--radius-sm);
    border:1px solid rgba(148,163,184,.12);
    color:var(--text-on-dark-muted);font-size:.72rem;
    font-variant-numeric:tabular-nums;
  }
  .timer-pill b{color:var(--text-on-dark);font-weight:700;}
</style>

<script>
/* ====================================================================

/* ---------- DATA (embedded) ---------- */
const DATA = {

    {"id":"w03422","w":"instance","pos":["n"],"ph":"/ˈɪnstəns/","cefr":"B1","kr":["경우","사례"],"ex":[{"en":"In this instance, he was right.","ko":"이 경우에 그는 옳았다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"example","ko":"예시","reason":"동의어 - 사례를 드는 것"},{"w":"case","ko":"경우","reason":"동의어 - 특정 상황을 지칭"},{"w":"situation","ko":"상황","reason":"시나리오 - 어떤 경우/상황에서"}],"collocBest":[{"en":"for instance","ko":"예를 들어"},{"en":"in this instance","ko":"이 경우에"}]},"nuance":{"koSimple":"딱 그 하나의 경우·사례.","whenToUse":"예시나 특정 상황을 들 때(for instance)."},"krDetail":[{"ko":"어떤 일이 있었던 때","explain":"'경우(境遇)'는 어떤 일이 실제로 일어난 상황을 뜻해요."},{"ko":"실제로 있었던 일","explain":"'사례(事例)'는 예로 들 만한 실제 있었던 일을 말해요."}],"usageExamples":[{"en":"There are many instances of kindness in this book.","ko":"이 책에는 친절함의 사례가 많이 있다."},{"en":"For instance, some birds can fly very high.","ko":"예를 들어, 어떤 새들은 매우 높이 날 수 있다."}],"grammarNote":"'for instance'는 'for example'과 같은 뜻이에요. 학생들이 'for instances'처럼 복수형으로 쓰는 실수를 자주 하는데, 관용구이므로 반드시 단수형 'instance'만 씁니다.","grammarQuiz":[{"sentence":"Many animals hibernate in winter; _____ _____, bears sleep for months.","ko":"많은 동물들이 겨울에 겨울잠을 잔다; 예를 들어, 곰은 몇 달 동안 잔다.","answer":["for","instance"],"hint":"관용 표현 전치사 + 단수 명사"}]},
    {"id":"w03423","w":"instant","pos":["adj","n"],"ph":"/ˈɪnstənt/","cefr":"B1","kr":["즉각적인","순간"],"ex":[{"en":"She gave an instant reply.","ko":"그녀는 즉각적인 답변을 주었다."}],"mnemonic":{"soundHint":"인스턴트","story":"'인스턴트' 커피 = 즉각적으로 되는 것","hintConfidence":3},"pairs":{"buddyWords":[{"w":"immediate","ko":"즉각적인","reason":"동의어 - 즉시 일어나는"},{"w":"delayed","ko":"지연된","reason":"반의어 - 즉각의 반대"},{"w":"moment","ko":"순간","reason":"동의어 - instant의 명사 의미"}],"collocBest":[{"en":"in an instant","ko":"순간적으로"},{"en":"instant coffee","ko":"인스턴트 커피"}]},"nuance":{"koSimple":"눈 깜짝할 사이·즉각.","whenToUse":"바로 되는 반응·인스턴트 제품을 말할 때."},"krDetail":[{"ko":"바로 그 자리에서 일어나는","explain":"'즉각적(卽刻的)인'은 시간이 조금도 걸리지 않고 바로 이루어지는 것을 뜻해요."},{"ko":"아주 짧은 때","explain":"'순간(瞬間)'은 눈 깜빡할 사이의 아주 짧은 시간을 말해요."}],"usageExamples":[{"en":"The medicine gave him instant relief from pain.","ko":"그 약은 그에게 즉각적인 통증 완화를 주었다."},{"en":"In an instant, the sky turned dark.","ko":"순식간에 하늘이 어두워졌다."}],"grammarNote":"'instant'는 형용사로 명사 앞에 오는 한정 용법에서 주로 쓰여요. 'in an instant'는 '순식간에'라는 관용구로 반드시 관사 'an'과 함께 씁니다.","grammarQuiz":[{"sentence":"The runner disappeared _____ _____ instant after the race began.","ko":"그 주자는 경주가 시작된 후 순식간에 사라졌다.","answer":["in","an"],"hint":"관용구용 전치사 + 부정관사"}]},

    {"id":"w03434","w":"instruction","pos":["n"],"ph":"/ɪnˈstrʌkʃən/","cefr":"B1","kr":["지시","설명"],"ex":[{"en":"Follow the instructions carefully.","ko":"지시 사항을 주의 깊게 따르라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"direction","ko":"지시","reason":"동의어 - 방향/지시"},{"w":"manual","ko":"설명서","reason":"시나리오 - 사용 설명서에 지시사항이 있음"},{"w":"follow","ko":"따르다","reason":"콜로 - follow instructions"}],"collocBest":[{"en":"follow instructions","ko":"지시를 따르다"},{"en":"clear instruction","ko":"명확한 지시"}]},"nuance":{"koSimple":"따라 해야 할 지시·설명.","whenToUse":"사용법·명령을 전달할 때."},"krDetail":[{"ko":"이렇게 하라는 말","explain":"'지시(指示)'는 무엇을 어떻게 하라고 알려주는 명령이나 안내를 뜻해요."},{"ko":"풀어서 알려줌","explain":"'설명(說明)'은 어떤 내용을 이해할 수 있도록 자세히 밝혀 말하는 것을 말해요."}],"usageExamples":[{"en":"Please follow the instructions on the box carefully.","ko":"상자에 있는 지시사항을 주의 깊게 따라 주세요."},{"en":"The teacher gave clear instructions to the class.","ko":"선생님은 학급에 명확한 지시를 내렸다."}],"grammarNote":"'instructions'는 보통 복수형으로 사용될 때 '사용 설명서, 지시사항'의 의미가 강해요. 단수 'instruction'은 '가르침, 교육' 자체를 뜻할 때 사용되므로 문맥에 따라 구분해야 합니다.","grammarQuiz":[{"sentence":"Students must _____ the _____ before starting the exam.","ko":"학생들은 시험을 시작하기 전에 지시사항을 따라야 한다.","answer":["follow","instructions"],"hint":"따르다 동사 + 복수 명사"}]},

    {"id":"w03453","w":"intend","pos":["v"],"ph":"/ɪnˈtend/","cefr":"B1","kr":["의도하다","~할 작정이다"],"ex":[{"en":"I intend to study abroad.","ko":"나는 해외에서 공부할 작정이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"plan","ko":"계획하다","reason":"동의어 - ~할 작정이다"},{"w":"mean","ko":"의도하다","reason":"동의어 - 의도를 나타냄"},{"w":"purpose","ko":"목적","reason":"시나리오 - 어떤 목적으로 의도하다"}],"collocBest":[{"en":"intend to do","ko":"~할 의도가 있다"},{"en":"as intended","ko":"의도한 대로"}]},"nuance":{"koSimple":"~할 마음을 먹다.","whenToUse":"목적·계획을 밝힐 때."},"krDetail":[{"ko":"미리 마음먹다","explain":"'의도(意圖)하다'는 어떤 일을 하려고 미리 생각하고 계획하는 것을 뜻해요."},{"ko":"그렇게 할 마음이다","explain":"'~할 작정이다'는 어떤 행동을 할 결심이 서 있음을 나타내는 표현이에요."}],"usageExamples":[{"en":"I intend to study abroad next year.","ko":"나는 내년에 유학할 작정이다."},{"en":"She intended the letter for her mother, not you.","ko":"그녀는 그 편지를 너가 아니라 어머니에게 보내려 했다."}],"grammarNote":"'intend'는 'intend to do' 또는 'intend doing' 두 형태 모두 가능하지만, 'to부정사'가 훨씬 자연스러워요. 학생들이 'intend that절'로 쓰는 경우가 있는데, 이 형태는 잘 쓰지 않습니다.","grammarQuiz":[{"sentence":"She _____ _____ become a doctor after finishing university.","ko":"그녀는 대학을 마친 후 의사가 될 작정이다.","answer":["intends","to"],"hint":"3인칭 단수 동사 + to부정사"}]},
    {"id":"w03459","w":"intention","pos":["n"],"ph":"/ɪnˈtenʃən/","cefr":"B1","kr":["의도","목적"],"ex":[{"en":"His intention was to help.","ko":"그의 의도는 돕는 것이었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"purpose","ko":"목적","reason":"동의어 - 의도/목적"},{"w":"aim","ko":"목표","reason":"동의어 - 겨냥한 목표"},{"w":"intend","ko":"의도하다","reason":"시나리오 - 명사와 동사 관계"}],"collocBest":[{"en":"good intention","ko":"좋은 의도"},{"en":"with the intention of","ko":"~할 의도로"}]},"nuance":{"koSimple":"마음속 목적·작정.","whenToUse":"의도적 행동·본심을 말할 때."},"krDetail":[{"ko":"속에 품은 생각","explain":"'의도(意圖)'는 어떤 일을 하려는 마음속의 계획이나 목적을 뜻해요."},{"ko":"이루려는 것","explain":"'목적(目的)'은 이루기 위해 정해 놓은 목표를 말해요."}],"usageExamples":[{"en":"His intention was to help, not to hurt anyone.","ko":"그의 의도는 도우려는 것이었지, 누구를 해치려는 것이 아니었다."},{"en":"She had no intention of leaving her job.","ko":"그녀는 직장을 그만둘 의도가 전혀 없었다."}],"grammarNote":"'have the/no intention of doing'은 '~할 의도가 있다/없다'라는 관용 표현으로 반드시 'of + 동명사'를 씁니다. 학생들이 'to부정사'를 붙이는 실수를 자주 하니 주의하세요.","grammarQuiz":[{"sentence":"He has no _____ _____ giving up his dream so easily.","ko":"그는 자신의 꿈을 그렇게 쉽게 포기할 의도가 없다.","answer":["intention","of"],"hint":"의도 명사 + 동명사용 전치사"}]},
    {"id":"w03461","w":"interact","pos":["v"],"ph":"/ˌɪntərˈækt/","cefr":"B1","kr":["상호작용하다","교류하다"],"ex":[{"en":"Students interact well with teachers.","ko":"학생들은 교사들과 잘 교류한다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"communicate","ko":"소통하다","reason":"동의어 - 서로 교류하다"},{"w":"engage","ko":"관여하다","reason":"동의어 - 참여하며 교류함"},{"w":"isolate","ko":"고립시키다","reason":"반의어 - 교류의 반대"}],"collocBest":[{"en":"interact with others","ko":"다른 사람들과 교류하다"},{"en":"interact online","ko":"온라인으로 상호작용하다"}]},"nuance":{"koSimple":"서로 주고받으며 관계 맺다.","whenToUse":"사람·화면과 소통·교류할 때."},"krDetail":[{"ko":"서로 주고받다","explain":"'상호작용(相互作用)하다'는 둘 이상이 서로 영향을 주고받는 것을 뜻해요."},{"ko":"서로 오가다","explain":"'교류(交流)하다'는 서로 만나서 이야기하거나 도움을 주고받는 것을 말해요."}],"usageExamples":[{"en":"Children learn how to interact with others at school.","ko":"아이들은 학교에서 다른 사람들과 상호작용하는 법을 배운다."},{"en":"Cats interact with humans in unique ways.","ko":"고양이는 사람과 독특한 방식으로 교류한다."}],"grammarNote":"'interact'는 자동사이므로 목적어가 바로 오지 않아요. 반드시 'interact with + 사람/사물' 형태로 전치사 'with'를 함께 씁니다.","grammarQuiz":[{"sentence":"Students should learn _____ _____ with people from different cultures.","ko":"학생들은 다른 문화의 사람들과 상호작용하는 법을 배워야 한다.","answer":["to","interact"],"hint":"to부정사 + 자동사"}]},
    {"id":"w03462","w":"interaction","pos":["n"],"ph":"/ˌɪntərˈækʃən/","cefr":"B1","kr":["상호작용","교류"],"ex":[{"en":"Human interaction is vital for growth.","ko":"인간의 교류는 성장에 필수적이다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"communication","ko":"소통","reason":"동의어 - 상호 소통"},{"w":"isolation","ko":"고립","reason":"반의어 - 상호작용의 반대"},{"w":"social","ko":"사회적인","reason":"콜로 - social interaction"}],"collocBest":[{"en":"social interaction","ko":"사회적 교류"},{"en":"positive interaction","ko":"긍정적인 상호작용"}]},"nuance":{"koSimple":"서로 주고받는 관계.","whenToUse":"사회적 소통·화면 반응 얘기할 때."},"krDetail":[{"ko":"서로 주고받는 일","explain":"'상호작용(相互作用)'은 둘 이상이 서로 영향을 주고받는 일을 뜻해요."},{"ko":"서로 오감","explain":"'교류(交流)'는 서로 만나서 소통하거나 문화·물건 등을 주고받는 것을 말해요."}],"usageExamples":[{"en":"Social interaction is important for young children.","ko":"사회적 상호작용은 어린이들에게 중요하다."},{"en":"The interaction between teacher and student matters a lot.","ko":"선생님과 학생 사이의 상호작용은 매우 중요하다."}],"grammarNote":"'interaction between A and B'는 'A와 B 사이의 상호작용'이라는 표현이에요. 학생들이 'interaction of A and B'로 잘못 쓰는 경우가 있는데, 반드시 'between'을 씁니다.","grammarQuiz":[{"sentence":"There is little _____ _____ humans and wild animals in the city.","ko":"도시에서는 인간과 야생 동물 사이의 상호작용이 거의 없다.","answer":["interaction","between"],"hint":"상호작용 명사 + 사이 전치사"}]},
    {"id":"w03474","w":"interestingly","pos":["adv"],"ph":"/ˈɪntrəstɪŋli/","cefr":"B1","kr":["흥미롭게도","재미있게도"],"ex":[{"en":"Interestingly, the results were the same.","ko":"흥미롭게도 결과는 동일했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"remarkably","ko":"놀랍게도","reason":"동의어 - 흥미로울 만큼 주목할 만하게"},{"w":"curiously","ko":"신기하게도","reason":"동의어 - 호기심을 자아내게"},{"w":"surprisingly","ko":"놀랍게도","reason":"시나리오 - 놀라움을 표현하는 부사"}],"collocBest":[{"en":"interestingly enough","ko":"흥미롭게도"},{"en":"most interestingly","ko":"가장 흥미롭게도"}]},"nuance":{"koSimple":"어라, 신기하게도.","whenToUse":"뜻밖의 결과·사실을 소개할 때."},"krDetail":[{"ko":"재미있고 신기하게도","explain":"'흥미(興味)롭게도'는 뜻밖에 재미있거나 관심을 끄는 사실을 소개할 때 쓰는 표현이에요."},{"ko":"재미있게도","explain":"예상하지 못한 재미있는 사실을 강조할 때 문장 앞이나 뒤에 붙이는 부사예요."}],"usageExamples":[{"en":"Interestingly, she solved the problem in five minutes.","ko":"흥미롭게도, 그녀는 5분 만에 문제를 풀었다."},{"en":"The results, interestingly, showed the opposite trend.","ko":"그 결과는 흥미롭게도 반대의 경향을 보여주었다."}],"grammarNote":"'interestingly'는 문장 전체를 수식하는 문장부사예요. 학생들이 문장 중간에 아무 곳에나 쓰는 경우가 있는데, 문장 맨 앞에 콤마와 함께 쓰는 것이 가장 자연스럽습니다.","grammarQuiz":[{"sentence":"_____ enough, the twins _____ completely different personalities.","ko":"흥미롭게도, 그 쌍둥이는 완전히 다른 성격을 가지고 있다.","answer":["Interestingly","have"],"hint":"문장부사(대문자) + 소유 동사"}]},
    {"id":"w03476","w":"interfere","pos":["v"],"ph":"/ˌɪntəˈfɪər/","cefr":"B1","kr":["간섭하다","방해하다"],"ex":[{"en":"Don't interfere in their argument.","ko":"그들의 논쟁에 간섭하지 마라."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"meddle","ko":"참견하다","reason":"동의어 - 남 일에 간섭하다"},{"w":"disturb","ko":"방해하다","reason":"동의어 - 흐름을 방해하다"},{"w":"ignore","ko":"무시하다","reason":"반의어 - 간섭의 반대"}],"collocBest":[{"en":"interfere with","ko":"~을 방해하다"},{"en":"interfere in affairs","ko":"일에 간섭하다"}]},"nuance":{"koSimple":"남 일에 끼어들어 방해하다.","whenToUse":"불필요한 참견·업무 방해 상황."},"krDetail":[{"ko":"남의 일에 끼어들다","explain":"'간섭(干涉)하다'는 상관없는 일에 나서서 이래라저래라 하는 것을 뜻해요."},{"ko":"일을 못하게 막다","explain":"'방해(妨害)하다'는 어떤 일이 제대로 되지 않도록 가로막는 것을 말해요."}],"usageExamples":[{"en":"Loud noise interferes with my concentration on studying.","ko":"시끄러운 소음은 나의 공부 집중을 방해한다."},{"en":"Please do not interfere in my personal affairs.","ko":"제 개인적인 일에 간섭하지 말아 주세요."}],"grammarNote":"'interfere with + 사물/과정'은 '~을 방해하다', 'interfere in + 일/문제'는 '~에 간섭하다'는 뜻이에요. 두 전치사를 헷갈리지 않도록 문맥을 잘 살펴야 합니다.","grammarQuiz":[{"sentence":"Using a phone at night can _____ _____ your sleep quality.","ko":"밤에 휴대폰을 사용하는 것은 수면의 질을 방해할 수 있다.","answer":["interfere","with"],"hint":"방해 동사 + 사물 전치사"}]},
    {"id":"w03479","w":"interior","pos":["n","adj"],"ph":"/ɪnˈtɪəriər/","cefr":"B1","kr":["내부","내부의"],"ex":[{"en":"The interior of the car is clean.","ko":"차의 내부가 깨끗하다."}],"mnemonic":{"soundHint":"인테리어","story":"'인테리어' 디자인 = 내부 장식","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inside","ko":"내부","reason":"동의어 - 안쪽"},{"w":"exterior","ko":"외부","reason":"반의어 - 내부의 반대"},{"w":"design","ko":"디자인","reason":"콜로 - interior design"}],"collocBest":[{"en":"interior design","ko":"인테리어 디자인"},{"en":"interior wall","ko":"내부 벽"}]},"nuance":{"koSimple":"안쪽·속.","whenToUse":"차·건물 내부 얘기할 때."},"krDetail":[{"ko":"안쪽 부분","explain":"'내부(內部)'는 어떤 물건이나 공간의 안쪽 부분을 말해요."},{"ko":"안쪽에 있는","explain":"'내부(內部)의'는 안쪽에 있거나 안쪽과 관련된 것을 뜻하는 형용사예요."}],"usageExamples":[{"en":"The interior of the car is very comfortable.","ko":"그 자동차의 내부는 매우 편안하다."},{"en":"She studied interior design at university.","ko":"그녀는 대학에서 인테리어 디자인을 공부했다."}],"grammarNote":"'interior'는 명사와 형용사 둘 다로 쓰여요. 명사로 쓸 때는 'the interior of ~'처럼 정관사와 함께 쓰이며, 학생들이 관사를 빼먹지 않도록 주의해야 합니다.","grammarQuiz":[{"sentence":"_____ interior _____ this building is beautifully decorated.","ko":"이 건물의 내부는 아름답게 장식되어 있다.","answer":["The","of"],"hint":"정관사 + 소유 전치사"}]},

    {"id":"w03487","w":"intern","pos":["n","v"],"ph":"/ˈɪntɜːrn/","cefr":"B1","kr":["인턴","인턴 근무하다"],"ex":[{"en":"She worked as an intern at the law firm.","ko":"그녀는 법률 회사에서 인턴으로 일했다."}],"mnemonic":{"soundHint":"인턴","story":"'인턴'사원 = 수습 직원","hintConfidence":3},"pairs":{"buddyWords":[{"w":"trainee","ko":"수습생","reason":"동의어 - 훈련 중인 사람"},{"w":"apprentice","ko":"견습생","reason":"동의어 - 실무 학습자"},{"w":"company","ko":"회사","reason":"시나리오 - 회사에서 인턴으로 근무"}],"collocBest":[{"en":"summer intern","ko":"여름 인턴"},{"en":"intern program","ko":"인턴 프로그램"}]},"nuance":{"koSimple":"경험 쌓는 실습생.","whenToUse":"회사·병원 인턴 얘기할 때."},"krDetail":[{"ko":"임시로 일 배우는 사람","explain":"'인턴(intern)'은 정식 직원이 되기 전에 실무를 배우기 위해 잠시 일하는 사람을 뜻해요."},{"ko":"인턴으로 일하다","explain":"'인턴 근무하다'는 정식 직원이 되기 전에 임시로 일하며 배우는 것을 말해요."}],"usageExamples":[{"en":"She works as an intern at a law firm.","ko":"그녀는 법률 회사에서 인턴으로 일한다."},{"en":"He interned at a hospital last summer.","ko":"그는 지난 여름에 병원에서 인턴 근무를 했다."}],"grammarNote":"'intern'은 명사와 동사 둘 다로 쓰여요. 동사로 쓰일 때 'intern at + 장소' 형태로 자주 사용되며, 학생들이 명사로만 알고 있는 경우가 많으니 동사 활용도 기억해 두세요.","grammarQuiz":[{"sentence":"My cousin _____ _____ a big tech company for three months.","ko":"우리 사촌은 세 달 동안 큰 기술 회사에서 인턴 근무했다.","answer":["interned","at"],"hint":"과거시제 동사 + 장소 전치사"}]},

    {"id":"w03498","w":"interrupt","pos":["v"],"ph":"/ˌɪntəˈrʌpt/","cefr":"B1","kr":["방해하다","끊다"],"ex":[{"en":"Please do not interrupt during the lecture.","ko":"강의 중에 방해하지 마세요."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"disturb","ko":"방해하다","reason":"동의어 - 흐름을 끊음"},{"w":"continue","ko":"계속하다","reason":"반의어 - 방해의 반대"},{"w":"conversation","ko":"대화","reason":"콜로 - interrupt a conversation"}],"collocBest":[{"en":"interrupt a conversation","ko":"대화를 끊다"},{"en":"rudely interrupt","ko":"무례하게 방해하다"}]},"nuance":{"koSimple":"진행 중인 걸 뚝 끊다.","whenToUse":"말·수업·회의 도중 끊는 상황."},"krDetail":[{"ko":"말이나 일을 못하게 막다","explain":"'방해(妨害)하다'는 다른 사람이 하는 말이나 일을 중간에 끼어들어 멈추게 하는 것을 뜻해요."},{"ko":"이어지던 것을 멈추다","explain":"'끊다'는 계속되던 일이나 관계를 중간에서 멈추게 하는 것을 말해요."}],"usageExamples":[{"en":"Please do not interrupt me while I am speaking.","ko":"제가 말하는 동안 방해하지 말아 주세요."},{"en":"The loud thunder interrupted our peaceful sleep.","ko":"시끄러운 천둥이 우리의 평화로운 잠을 방해했다."}],"grammarNote":"'interrupt'는 타동사로 목적어가 반드시 필요해요. 'interrupt me/him/the meeting'처럼 사람이나 사건을 직접 목적어로 취하며, 학생들이 자동사로 쓰는 실수를 자주 합니다.","grammarQuiz":[{"sentence":"It is rude _____ _____ someone when they are talking.","ko":"누군가 말하고 있을 때 그 사람을 방해하는 것은 무례하다.","answer":["to","interrupt"],"hint":"to부정사 + 방해 동사"}]},
    {"id":"w03535","w":"invention","pos":["n"],"ph":"/ɪnˈvenʃən/","cefr":"B1","kr":["발명","발명품"],"ex":[{"en":"The invention of the telephone changed the world.","ko":"전화기의 발명은 세상을 바꾸었다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"creation","ko":"창조물","reason":"동의어 - 새로 만들어진 것"},{"w":"innovation","ko":"혁신","reason":"동의어 - 새로운 창조"},{"w":"inventor","ko":"발명가","reason":"시나리오 - 발명가가 발명품을 만듦"}],"collocBest":[{"en":"great invention","ko":"위대한 발명"},{"en":"invention of","ko":"~의 발명"}]},"nuance":{"koSimple":"새로 만들어낸 것.","whenToUse":"발명품·역사적 창안을 말할 때."},"krDetail":[{"ko":"새로 만들어낸 것","explain":"'발명(發明)'은 지금까지 없던 새로운 물건이나 방법을 처음으로 만들어내는 일을 뜻해요."},{"ko":"새로 만든 물건","explain":"'발명품(發明品)'은 새롭게 만들어낸 물건이나 도구를 말해요."}],"usageExamples":[{"en":"The invention of the wheel changed human history forever.","ko":"바퀴의 발명은 인류 역사를 영원히 바꿔 놓았다."},{"en":"The smartphone is one of the greatest inventions of our time.","ko":"스마트폰은 우리 시대의 가장 위대한 발명품 중 하나이다."}],"grammarNote":"'invention of + 명사'는 '~의 발명'이라는 표현이에요. 학생들이 'invention for'로 잘못 쓰는 경우가 있는데, 무엇을 발명했는지 나타낼 때는 반드시 'of'를 씁니다.","grammarQuiz":[{"sentence":"The _____ _____ the light bulb was made by Thomas Edison.","ko":"전구의 발명은 토머스 에디슨에 의해 이루어졌다.","answer":["invention","of"],"hint":"발명 명사 + 소유 전치사"}]},
    {"id":"w03536","w":"inventor","pos":["n"],"ph":"/ɪnˈventər/","cefr":"B1","kr":["발명가"],"ex":[{"en":"Thomas Edison was a great inventor.","ko":"토마스 에디슨은 위대한 발명가였다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"creator","ko":"창조자","reason":"동의어 - 새것을 만드는 사람"},{"w":"innovator","ko":"혁신가","reason":"동의어 - 혁신을 이룬 사람"},{"w":"invention","ko":"발명","reason":"시나리오 - 발명가가 발명을 함"}],"collocBest":[{"en":"brilliant inventor","ko":"뛰어난 발명가"},{"en":"prolific inventor","ko":"다작 발명가"}]},"nuance":{"koSimple":"새로운 걸 만드는 사람.","whenToUse":"발명가·창안자를 가리킬 때."},"krDetail":[{"ko":"새로 만들어낸 사람","explain":"'발명가(發明家)'는 지금까지 없던 새로운 것을 처음으로 만들어낸 사람을 뜻해요."}],"usageExamples":[{"en":"Thomas Edison was a famous American inventor.","ko":"토머스 에디슨은 유명한 미국 발명가였다."},{"en":"The young inventor created a robot that can cook.","ko":"그 젊은 발명가는 요리할 수 있는 로봇을 만들었다."}],"grammarNote":"'inventor'는 사람을 나타내는 명사이므로 부정관사 'a/an'과 함께 자주 쓰여요. 학생들이 'the inventor'와 'an inventor'를 혼동하는 경우가 있는데, 처음 언급할 때는 부정관사를 씁니다.","grammarQuiz":[{"sentence":"He wants _____ become _____ famous inventor when he grows up.","ko":"그는 커서 유명한 발명가가 되고 싶어 한다.","answer":["to","a"],"hint":"to부정사 + 부정관사"}]},
    {"id":"w03539","w":"invest","pos":["v"],"ph":"/ɪnˈvest/","cefr":"B1","kr":["투자하다","쏟아붓다"],"ex":[{"en":"She decided to invest her savings in stocks.","ko":"그녀는 저축금을 주식에 투자하기로 결정했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"fund","ko":"자금을 대다","reason":"동의어 - 돈을 넣다"},{"w":"withdraw","ko":"회수하다","reason":"반의어 - 투자의 반대"},{"w":"stock","ko":"주식","reason":"시나리오 - 주식에 투자하다"}],"collocBest":[{"en":"invest in","ko":"~에 투자하다"},{"en":"invest time","ko":"시간을 투자하다"}]},"nuance":{"koSimple":"돈·시간을 미래 위해 붓다.","whenToUse":"주식·시간·노력을 쏟을 때."},"krDetail":[{"ko":"돈이나 노력을 넣어 두다","explain":"'투자(投資)하다'는 나중에 이익을 얻기 위해 돈이나 시간을 미리 넣어 두는 것을 뜻해요."},{"ko":"많이 쏟다","explain":"'쏟아붓다'는 시간이나 노력, 돈 등을 아낌없이 많이 들이는 것을 말해요."}],"usageExamples":[{"en":"He invested a lot of money in the new company.","ko":"그는 새로운 회사에 많은 돈을 투자했다."},{"en":"You should invest time in learning English every day.","ko":"당신은 매일 영어 배우는 데 시간을 투자해야 한다."}],"grammarNote":"'invest in + 명사'는 '~에 투자하다'라는 뜻으로 자주 쓰여요. 학생들이 'invest to'나 'invest on'으로 잘못 쓰는 경우가 있는데, 반드시 전치사 'in'을 사용해야 합니다.","grammarQuiz":[{"sentence":"Many young people _____ _____ stocks to save for their future.","ko":"많은 젊은이들이 미래를 위해 저축하려고 주식에 투자한다.","answer":["invest","in"],"hint":"투자 동사 + 대상 전치사"}]},

    {"id":"w03583","w":"irritate","pos":["v"],"ph":"/ˈɪrɪteɪt/","cefr":"B1","kr":["짜증나게 하다","자극하다"],"ex":[{"en":"The noise irritated him greatly.","ko":"그 소음은 그를 매우 짜증나게 했다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"annoy","ko":"짜증나게 하다","reason":"동의어 - 신경을 건드리다"},{"w":"soothe","ko":"달래다","reason":"반의어 - 자극의 반대"},{"w":"skin","ko":"피부","reason":"콜로 - irritate the skin"}],"collocBest":[{"en":"irritate the skin","ko":"피부를 자극하다"},{"en":"irritate someone","ko":"누군가를 짜증나게 하다"}]},"nuance":{"koSimple":"신경 긁어 짜증 나게.","whenToUse":"소리·행동이 거슬리거나 피부 자극할 때."},"krDetail":[{"ko":"화가 나게 하다","explain":"'짜증나게 하다'는 다른 사람의 마음을 불편하게 하고 화를 나게 하는 것을 뜻해요."},{"ko":"따갑게 만들다","explain":"'자극(刺戟)하다'는 피부나 감정을 콕콕 찌르듯이 반응하게 만드는 것을 말해요."}],"usageExamples":[{"en":"The loud music started to irritate the neighbors.","ko":"시끄러운 음악이 이웃 사람들을 짜증나게 하기 시작했다."},{"en":"This soap can irritate sensitive skin easily.","ko":"이 비누는 민감한 피부를 쉽게 자극할 수 있다."}],"grammarNote":"'irritate'는 타동사로 목적어가 필요해요. 사람이 목적어일 때는 '짜증나게 하다', 신체 부위가 목적어일 때는 '자극하다'로 문맥에 따라 해석이 달라집니다.","grammarQuiz":[{"sentence":"His constant complaining _____ _____ his classmates all day.","ko":"그의 끊임없는 불평이 하루 종일 그의 반 친구들을 짜증나게 했다.","answer":["irritated","all"],"hint":"과거시제 동사 + 전체 수식어"}]},
    {"id":"w03587","w":"isolated","pos":["adj"],"ph":"/ˈaɪsəleɪtɪd/","cefr":"B1","kr":["고립된","외딴"],"ex":[{"en":"The village is isolated from the city.","ko":"그 마을은 도시에서 고립되어 있다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"remote","ko":"외딴","reason":"동의어 - 멀리 떨어진"},{"w":"connected","ko":"연결된","reason":"반의어 - 고립의 반대"},{"w":"island","ko":"섬","reason":"시나리오 - 섬처럼 고립됨"}],"collocBest":[{"en":"isolated area","ko":"외딴 지역"},{"en":"feel isolated","ko":"고립감을 느끼다"}]},"nuance":{"koSimple":"주변과 뚝 떨어진.","whenToUse":"외딴 마을·혼자 남겨진 사람·격리 상태에."},"krDetail":[{"ko":"혼자 떨어져 있는","explain":"'고립(孤立)된'은 다른 사람이나 장소로부터 떨어져 홀로 있는 상태를 뜻해요."},{"ko":"멀리 떨어진","explain":"'외딴'은 다른 곳에서 멀리 떨어져 있어 접근하기 어려운 것을 말해요."}],"usageExamples":[{"en":"The island is isolated from the rest of the world.","ko":"그 섬은 세상의 나머지 부분과 고립되어 있다."},{"en":"She felt isolated after moving to a new city.","ko":"그녀는 새로운 도시로 이사한 후 고립감을 느꼈다."}],"grammarNote":"'isolated from + 명사'는 '~로부터 고립된'이라는 뜻이에요. 학생들이 'isolated of'로 잘못 쓰는 경우가 있는데, 반드시 'from'을 씁니다.","grammarQuiz":[{"sentence":"The mountain village was completely _____ _____ the outside world.","ko":"그 산골 마을은 바깥세상과 완전히 고립되어 있었다.","answer":["isolated","from"],"hint":"고립된 형용사 + 출처 전치사"}]},
    {"id":"w03591","w":"issue","pos":["n","v"],"ph":"/ˈɪʃuː/","cefr":"B1","kr":["문제","발행하다"],"ex":[{"en":"Climate change is a major global issue.","ko":"기후 변화는 주요 세계적 문제이다."}],"mnemonic":{"soundHint":"이슈","story":"'이슈'가 되다 = 문제가 되다, 화제가 되다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"problem","ko":"문제","reason":"동의어 - 다뤄야 할 문제"},{"w":"topic","ko":"주제","reason":"동의어 - 화제/주제"},{"w":"raise","ko":"제기하다","reason":"콜로 - raise an issue"}],"collocBest":[{"en":"raise an issue","ko":"문제를 제기하다"},{"en":"address an issue","ko":"문제를 다루다"}]},"nuance":{"koSimple":"논의할 문제·주제.","whenToUse":"사회 문제·잡지 호수 얘기할 때."},"krDetail":[{"ko":"풀어야 할 일","explain":"'문제(問題)'는 해결해야 하거나 다루어야 할 어려운 일이나 상황을 뜻해요."},{"ko":"책이나 잡지를 내다","explain":"'발행(發行)하다'는 신문, 책, 잡지 등을 만들어 세상에 내놓는 것을 말해요."}],"usageExamples":[{"en":"Climate change is a serious global issue today.","ko":"기후 변화는 오늘날 심각한 세계적 문제이다."},{"en":"The magazine issued its first edition in 2010.","ko":"그 잡지는 2010년에 첫 호를 발행했다."}],"grammarNote":"'issue'는 명사와 동사 둘 다로 쓰여요. 'raise/address an issue'는 '문제를 제기하다/다루다'라는 관용 표현이며, 동사로는 '발행하다, 발급하다'의 의미가 강합니다.","grammarQuiz":[{"sentence":"The students want _____ raise an important _____ at the meeting.","ko":"학생들은 회의에서 중요한 문제를 제기하고 싶어 한다.","answer":["to","issue"],"hint":"to부정사 + 문제 명사"}]},
    {"id":"w03605","w":"jail","pos":["n","v"],"ph":"/dʒeɪl/","cefr":"B1","kr":["교도소","수감하다"],"ex":[{"en":"He was sent to jail.","ko":"그는 교도소에 보내졌다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"prison","ko":"감옥","reason":"동의어 - 수감 시설"},{"w":"release","ko":"석방하다","reason":"반의어 - 수감의 반대"},{"w":"criminal","ko":"범죄자","reason":"시나리오 - 범죄자가 교도소에 감"}],"collocBest":[{"en":"go to jail","ko":"교도소에 가다"},{"en":"jail time","ko":"수감 기간"}]},"nuance":{"koSimple":"죄인이 갇히는 곳.","whenToUse":"수감·복역 얘기할 때."},"krDetail":[{"ko":"죄지은 사람을 가두는 곳","explain":"'교도소(矯導所)'는 죄를 지은 사람을 가두어 두는 시설을 뜻해요."},{"ko":"감옥에 가두다","explain":"'수감(收監)하다'는 죄지은 사람을 교도소에 가두어 두는 것을 말해요."}],"usageExamples":[{"en":"The thief was sent to jail for five years.","ko":"그 도둑은 5년 동안 교도소에 보내졌다."},{"en":"He was jailed for stealing a car last year.","ko":"그는 작년에 차를 훔친 죄로 수감되었다."}],"grammarNote":"'go to jail'은 관사 없이 사용해요. 'go to the jail'은 방문하러 가는 의미이고, 'go to jail'은 죄를 지어 수감되러 가는 의미로 관사가 없다는 점을 기억하세요.","grammarQuiz":[{"sentence":"If you break the law, you might _____ _____ jail for a long time.","ko":"법을 어기면 오랫동안 교도소에 갈 수도 있다.","answer":["go","to"],"hint":"가다 동사 + 방향 전치사"}]},
    {"id":"w03614","w":"jaw","pos":["n"],"ph":"/dʒɔː/","cefr":"B1","kr":["턱"],"ex":[{"en":"He broke his jaw in the fall.","ko":"그는 넘어져 턱이 부러졌다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"mandible","ko":"턱뼈","reason":"동의어 - jaw의 해부학 용어"},{"w":"chin","ko":"턱끝","reason":"시나리오 - 턱(jaw)에 붙어있는 턱끝"},{"w":"shark","ko":"상어","reason":"시나리오 - 상어의 강력한 턱"}],"collocBest":[{"en":"drop one's jaw","ko":"입이 딱 벌어지다"},{"en":"jaw bone","ko":"턱뼈"}]},"nuance":{"koSimple":"입을 여닫는 위·아래 뼈.","whenToUse":"신체 부위·놀란 표정 얘기할 때."},"krDetail":[{"ko":"입 아래쪽 뼈 부분","explain":"'턱'은 입 아래에 있는 뼈로 이루어진 얼굴의 아래 부분을 뜻해요."}],"usageExamples":[{"en":"He broke his jaw in the football game last week.","ko":"그는 지난주 축구 경기에서 턱이 부러졌다."},{"en":"Her jaw dropped when she saw the surprise gift.","ko":"그녀는 깜짝 선물을 보고 입이 딱 벌어졌다."}],"grammarNote":"'jaw drop'은 '입이 딱 벌어지다'라는 관용 표현이에요. 놀라움을 나타낼 때 자주 쓰이며, 'drop one's jaw'와 같이 소유격을 함께 쓸 수 있습니다.","grammarQuiz":[{"sentence":"His _____ _____ when he heard the amazing news yesterday.","ko":"그는 어제 놀라운 소식을 들었을 때 입이 딱 벌어졌다.","answer":["jaw","dropped"],"hint":"턱 명사 + 떨어지다 과거"}]},
    {"id":"w03192","w":"impression","pos":["n"],"ph":"/ɪmˈpreʃən/","cefr":"B1","kr":["인상","느낌"],"ex":[{"en":"She made a good first impression.","ko":"그녀는 좋은 첫인상을 남겼다."}],"mnemonic":{"soundHint":null,"story":null,"hintConfidence":0},"pairs":{"buddyWords":[{"w":"feeling","ko":"느낌","reason":"동의어 - impression=주관적 느낌"},{"w":"first","ko":"처음의","reason":"콜로케이션 - first impression(첫인상) 빈출"},{"w":"impress","ko":"감동시키다","reason":"파생 관계 - impression의 동사형"}],"collocBest":[{"en":"first impression","ko":"첫인상"},{"en":"make an impression","ko":"인상을 주다"}]},"nuance":{"koSimple":"마음에 남는 첫 느낌.","whenToUse":"첫인상·강한 느낌을 말할 때."},"krDetail":[{"ko":"인상","explain":"어떤 사람이나 일에서 받은 느낌"},{"ko":"느낌","explain":"머릿속에 남는 생각이나 기분"}],"usageExamples":[{"en":"First impressions are hard to change later.","ko":"첫인상은 나중에 바꾸기 어렵다."},{"en":"She made a strong impression on the interviewer.","ko":"그녀는 면접관에게 강한 인상을 남겼다."}],"grammarNote":"impression은 셀 수 있는 명사로 'make an impression on + 사람' 형태로 자주 쓴다. 학생들은 on 대신 to를 잘못 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"First _____ often _____ hard to change later in life.","ko":"첫인상은 나중에 바꾸기 어려운 경우가 많다.","answer":["impressions","are"],"hint":"impressions / are"},{"sentence":"She _____ a strong _____ _____ the interviewer during the meeting.","ko":"그녀는 회의 중에 면접관에게 강한 인상을 남겼다.","answer":["made","impression","on"],"hint":"made / impression / on"}]},
    {"id":"w03182","w":"impolite","pos":["adj"],"ph":"/ˌɪmpəˈlaɪt/","cefr":"B1","kr":["무례한","버릇없는"],"ex":[{"en":"It is impolite to talk with your mouth full.","ko":"입에 음식을 가득 넣고 말하는 것은 무례하다."}],"mnemonic":{"soundHint":null,"story":"'im(부정)+polite(예의 바른)' 예의 없는 → '무례한'","hintConfidence":2},"pairs":{"buddyWords":[{"w":"polite","ko":"예의 바른","reason":"반의어 - impolite의 정반대"},{"w":"rude","ko":"무례한","reason":"동의어 - impolite의 유의어"},{"w":"gesture","ko":"제스처","reason":"콜로케이션 - impolite gesture 빈출"}],"collocBest":[{"en":"considered impolite","ko":"무례하다고 여겨지는"},{"en":"impolite gesture","ko":"무례한 제스처"}]},"nuance":{"koSimple":"예의 없이 무례한.","whenToUse":"매너 없는 말·행동을 지적할 때."},"krDetail":[{"ko":"무례한","explain":"예의가 없고 함부로 대하는"},{"ko":"버릇없는","explain":"행동이 거칠어 배려가 없는"}],"usageExamples":[{"en":"It is impolite to speak loudly in a public library.","ko":"공공 도서관에서 크게 말하는 것은 무례한 일이다."},{"en":"His impolite words hurt everyone in the room.","ko":"그의 무례한 말은 방 안의 모두를 상하게 했다."}],"grammarNote":"impolite는 형용사이며 'It is impolite to + 동사원형' 구문에서 자주 쓴다. 학생들은 impolite와 politely(부사)의 품사를 혼동하기 쉽다.","grammarQuiz":[{"sentence":"_____ _____ _____ speak loudly in a quiet public library.","ko":"조용한 공공 도서관에서 크게 말하는 것은 무례하다.","answer":["It","is","impolite"],"hint":"It / is / impolite"},{"sentence":"His _____ words _____ everyone sitting in the room.","ko":"그의 무례한 말은 방에 앉아 있던 모두를 상하게 했다.","answer":["impolite","hurt"],"hint":"impolite / hurt"}]},
    {"id":"w02709","w":"gear","pos":["n","v"],"ph":"/ɡɪr/","cefr":"B1","kr":["장비","기어"],"ex":[{"en":"He packed his camping gear.","ko":"그는 캠핑 장비를 챙겼다."}],"mnemonic":{"soundHint":"기어(gear)","story":"'기어'는 외래어로 자동차 변속기·장비를 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"equipment","ko":"장비","reason":"동의어(장비 일반)"},{"w":"tools","ko":"도구들","reason":"동의어(용도 도구)"}],"collocBest":[{"en":"gear up","ko":"준비하다"},{"en":"sports gear","ko":"스포츠 장비"}]},"nuance":{"koSimple":"어떤 활동에 필요한 도구·장비.","whenToUse":"캠핑·스포츠 준비물 얘기할 때."},"krDetail":[{"ko":"장비","explain":"어떤 일에 쓰려고 갖춘 도구 모음"},{"ko":"기어","explain":"속도를 바꾸는 톱니바퀴 장치"}],"usageExamples":[{"en":"The climbers checked their gear before starting the ascent.","ko":"등반가들은 오르기 전에 장비를 점검했다."},{"en":"All safety gear must be worn inside the factory.","ko":"공장 안에서는 모든 안전 장비가 착용되어야 한다."}],"grammarNote":"'장비'의 뜻일 때 gear는 불가산명사이므로 gears로 쓰지 않는다. gears는 자동차의 기어 여러 개를 뜻할 때만 쓴다. 학생들은 sports gears처럼 잘못 복수형을 쓴다.","grammarQuiz":[{"sentence":"The team _____ _____ for the long expedition ahead.","ko":"그 팀은 앞으로 있을 긴 원정을 위해 준비를 갖추었다.","answer":["geared","up"],"hint":"과거형 + 부사"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

  },
  // jp-chime-asc: 800→1000→1200 3단
  streak(){
    [880, 1100, 1320].forEach((f,i)=> tone({type:"sine", freq:f, dur:.12, vol:.18, t0:i*.07}));
  },
  // arcade-fireworks: noise 펑 + 떨어지는 sine
  fireworks(){
    noise({dur:.18, vol:.22, t0:0, hp:600});
    for(let i=0;i<6;i++){
      tone({type:"sine", freq:1500-i*180, dur:.10, vol:.10, t0:.05+i*.05});
    }
  },
  // arcade-flip: 화이트 노이즈 30ms
  cardFlip(){
    noise({dur:.04, vol:.10, hp:2000});
  },
  // jp-coin-payout: 2000Hz square 8회 빠르게
  coinDrop(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:1800+Math.random()*600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-slot-spin: 600Hz square 50ms × 8
  spinReel(){
    for(let i=0;i<8;i++){
      tone({type:"square", freq:600, dur:.04, vol:.10, t0:i*.05});
    }
  },
  // jp-bigwin: 도-미-솔-도-미-솔-도(고)-도(고) 8단
  bigWin(){
    const notes = [523.25,659.25,783.99,1046.50,1318.51,1567.98,2093.00,2637.02];
    notes.forEach((f,i)=> tone({type:"sine", freq:f, dur:.18, vol:.22, t0:i*.10}));
    tone({type:"triangle", freq:2637.02, dur:.6, vol:.20, t0:.85});
    // coins
    for(let i=0;i<14;i++){
      tone({type:"square", freq:1800+Math.random()*800, dur:.04, vol:.08, t0:.8+i*.04});
    }
  },
  type(){
    tone({type:"square", freq:1500, dur:.02, vol:.05});
  },
  // ── 심화 90%+ 전용 : 명랑·화려·인상 깊은 팡파레 조합 ──
  // 1) 브라스 팡파레 (C→F→G→C major 상승) 화음 4단
  // 2) 크리스탈 아르페지오 8음 (C5→E7)
  // 3) 종·코인·환호 노이즈
  grandFanfare(){
    // 1) 브라스 트라이애드 상승 (sawtooth = 브라스 느낌)
    const chords = [
      { t:0.00, notes:[261.63, 329.63, 392.00] },   // C major (C4 E4 G4)
      { t:0.16, notes:[349.23, 440.00, 523.25] },   // F major (F4 A4 C5)
      { t:0.32, notes:[392.00, 493.88, 587.33] },   // G major (G4 B4 D5)
      { t:0.48, notes:[523.25, 659.25, 783.99] }    // C major 옥타브 (C5 E5 G5) — 절정
    ];
    chords.forEach(ch => {
      ch.notes.forEach(f => {
        tone({ type:"sawtooth", freq:f, dur:.22, vol:.12, atk:.008, t0:ch.t });
        // 부드러운 sine 배음 살짝 얹기
        tone({ type:"sine",     freq:f*2, dur:.20, vol:.05, t0:ch.t });
      });
    });
    // 브라스 절정 뒤 강타 (C5 saw 길게)
    tone({ type:"sawtooth", freq:523.25, dur:.35, vol:.14, t0:.48 });

    // 2) 크리스탈 아르페지오 8음 (도미솔도 두 옥타브)
    const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00, 2637.02];
    arp.forEach((f,i) => {
      tone({ type:"sine",     freq:f, dur:.15, vol:.20, atk:.003, t0:.75 + i*.055 });
      tone({ type:"triangle", freq:f*2, dur:.10, vol:.08, t0:.75 + i*.055 });
    });

    // 3) 절정 종소리 (E7 · G7 벨)
    tone({ type:"triangle", freq:2637.02, dur:.65, vol:.20, t0:1.22 });
    tone({ type:"sine",     freq:3135.96, dur:.45, vol:.14, t0:1.30 });
    tone({ type:"triangle", freq:2093.00, dur:.55, vol:.16, t0:1.40 });

    // 4) 코인·불꽃 노이즈 (환호 느낌)
    for(let i=0;i<18;i++){
      tone({ type:"square", freq:1900+Math.random()*900, dur:.035, vol:.06, t0:1.25 + i*.038 });
    }
    noise({ dur:.15, vol:.14, hp:800, t0:1.20 });
  }
};

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

  else if(state.phase === "result") pct = 100;

  // sfx
  document.getElementById("sfxBtn").textContent = state.sfxOn ? "🔊" : "🔇";
  document.getElementById("sfxBtn").classList.toggle("on", state.sfxOn);
  document.getElementById("cbBtn").classList.toggle("on", state.cbMode);

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

  `;

  const card = document.getElementById("flipcard");

  card.querySelectorAll(".speak-btn[data-speak]").forEach(btn=>{

  // nav buttons (Previous / Home / Next)
  document.querySelectorAll(".grade-btn").forEach(btn=>{
    btn.addEventListener("click", (e)=>{

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

/* ============================================================
   QUIZ (15문항)
   ============================================================ */
const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  const pool = [];
  const words = [...DATA.newWords];
  // 셔플
  const shuffled = shuffle(words).slice(0, 15);
  // 모드 균등 분배 (대략)
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{
    pool.push({ word:w, mode: modeOrder[i] });
  });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}
function buildAdvancedPool(){
  const collocPool = [];
  const clozePool  = [];
  const grammarPool = [];
  for(const w of DATA.newWords){
    // (1) 콜로케이션 영작
    if(w.pairs && w.pairs.collocBest){
      for(const c of w.pairs.collocBest){
        if(c && c.en && c.ko) collocPool.push({ word:w, mode:"colloc-write", colloc:c });
      }
    }
    // (2) 예문 빈칸 채우기
    if(w.ex && w.ex[0] && w.ex[0].en && w.ex[0].ko){
      const tokens = parseSentence(w.ex[0].en);
      const blankIdxs = pickBlanks(tokens, w.w);
      if(blankIdxs.length >= 1){
        clozePool.push({
          word:w, mode:"cloze",
          sentence:{ en:w.ex[0].en, ko:w.ex[0].ko },
          tokens, blankIdxs
        });
      }
    }
    // (3) 문법 빈칸 채우기
    if(Array.isArray(w.grammarQuiz)){
      for(const q of w.grammarQuiz){
        if(q && q.sentence && q.ko && q.answer){
          grammarPool.push({ word:w, mode:"grammar-fill", quiz:q });
        }
      }
    }
  }
  shuffle(collocPool); shuffle(clozePool); shuffle(grammarPool);
  const TARGET = 20;
  const picked = [];
  // 문법 우선 (있으면 최대 8개 or pool의 절반)
  const gTake = Math.min(grammarPool.length, Math.max(1, Math.min(8, Math.ceil(grammarPool.length / 2))));
  picked.push(...grammarPool.slice(0, gTake));
  // 나머지 자리는 콜로/예문 균등
  const rest = TARGET - picked.length;
  const cTake = Math.min(collocPool.length, Math.ceil(rest / 2));
  const zTake = Math.min(clozePool.length, rest - cTake);
  picked.push(...collocPool.slice(0, cTake));
  picked.push(...clozePool.slice(0, zTake));
  // 부족하면 남은 후보에서 보충
  if(picked.length < TARGET){
    const leftover = [
      ...grammarPool.slice(gTake),
      ...collocPool.slice(cTake),
      ...clozePool.slice(zTake)
    ];
    shuffle(leftover);
    picked.push(...leftover.slice(0, TARGET - picked.length));
  }
  shuffle(picked);
  return picked.slice(0, TARGET);
}

      <div class="quiz-prompt">
        <div class="label">다음 뜻의 단어는?</div>

      </div>`;
    answerHTML = `
      <div class="choices" id="choices">
        ${opts.map((o,i)=>`<button class="choice" data-v="${escape(o)}"><span class="idx">${i+1}</span><span>${escape(o)}</span></button>`).join("")}

  } else if(mode === "spelling"){

        <div class="qkr">${escape(word.kr.join(" · "))}</div>
        <div class="qph">${escape(word.ph||"")}</div>

    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">

  } else if(mode === "listening"){
    promptHTML = `

        <div class="label">발음을 듣고 단어를 입력하세요</div>
        <button class="lis-btn" id="lisBtn">🔊 다시 듣기</button>
        <div class="qph">${escape(word.ph||"")}</div>
      </div>`;
    answerHTML = `
      <div class="input-box">
        <input type="text" id="ansInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력...">

      </div>`;
  } else if(mode === "colloc-write"){
    const c = state.quizCurrent.colloc;

    promptHTML = `
      <div class="quiz-prompt">

        <div class="qkr">${escape(c.ko)}</div>
        <div class="hint-line">💡 첫글자 힌트 <b>${escape(hint)}</b></div>
      </div>`;
    answerHTML = `
      <div class="input-box">

        <button class="submit-btn" id="submitBtn">제출</button>

  } else if(mode === "cloze"){

      }
      return escape(t.text);
    }).join("");
    const clozeHints = blankIdxs.map((tokIdx, i) => `[${i+1}] ${firstCharsHint(tokens[tokIdx].text)}`).join(" &nbsp;&nbsp; ");
    promptHTML = `
      <div class="quiz-prompt cloze-prompt">

    const ansList = Array.isArray(quiz.answer) ? quiz.answer : [quiz.answer];
