    {"id":"w01431","w":"court","pos":["n","v"],"ph":"/kɔːrt/","cefr":"B1","kr":["법정","코트"],"ex":[{"en":"The case went to court.","ko":"그 사건은 법정으로 갔다."}],"mnemonic":{"soundHint":"'코트' → 테니스 '코트', 법정(court) 모두 동일 단어","story":"테니스 '코트'와 법정(court)은 같은 단어","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tribunal","ko":"재판소","reason":"court(법정)의 동의어"},{"w":"judge","ko":"판사","reason":"법정 시나리오 연관어"},{"w":"order","ko":"명령","reason":"court order 콜로케이션"}],"collocBest":[{"en":"go to court","ko":"법정에 가다"},{"en":"court order","ko":"법원 명령"}]},"nuance":{"koSimple":"판사가 재판하는 곳, 또는 스포츠 경기장.","whenToUse":"재판이면 법정, 테니스면 코트."},"krDetail":[{"ko":"법정","explain":"재판을 하는 곳"},{"ko":"코트","explain":"운동 경기를 하는 네모난 마당"}],"usageExamples":[{"en":"The judge entered the court quietly.","ko":"판사가 조용히 법정에 들어왔다."},{"en":"They played tennis on the new court.","ko":"그들은 새 코트에서 테니스를 쳤다."}],"grammarNote":"court는 관사 없이 관용적으로 쓰이는 표현이 많음: go to court(소송하다/법정에 가다), take to court(고소하다), in court(법정에서). 스포츠 코트일 때는 관사 필요(a tennis court).","grammarQuiz":[{"sentence":"The company decided _____ _____ its former partner _____ _____ over the broken contract.","ko":"그 회사는 파기된 계약 문제로 이전 동업자를 법정으로 데려가기로 결정했다.","answer":["to","take","to","court"],"hint":"decide to + take 사람 to court(고소하다) 관용 표현"}]},
    {"id":"w01816","w":"display","pos":["v","n"],"ph":"/dɪˈspleɪ/","cefr":"B1","kr":["전시하다","표시"],"ex":[{"en":"Works were displayed in the gallery.","ko":"작품들이 갤러리에 전시되었다."}],"mnemonic":{"soundHint":"'디스플레이' 외래어 → 화면·전시","story":"휴대폰 디스플레이 = 화면 표시 → display(전시하다, 표시)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"hide","ko":"숨기다","reason":"display의 대표 반의어"},{"w":"exhibit","ko":"전시하다","reason":"display의 대표 동의어"},{"w":"screen","ko":"화면","reason":"'디스플레이 화면(display screen)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"보라고 앞에 내놓거나 화면에 나타냄.","whenToUse":"전시·화면 표시·감정 표현에."},"krDetail":[{"ko":"전시하다","explain":"여러 사람이 볼 수 있게 벌여 놓다"},{"ko":"표시","explain":"정보를 화면 등에 나타내 보이는 것"}],"usageExamples":[{"en":"The museum displayed rare ancient artifacts in the main hall yesterday.","ko":"박물관은 어제 본관에 희귀한 고대 유물들을 전시했다."},{"en":"Rare ancient artifacts were displayed in the main hall yesterday.","ko":"희귀한 고대 유물들이 어제 본관에 전시되었다."}],"grammarNote":"display는 동사와 명사가 형태가 같다. 명사로 on display(전시 중)이라는 관용구, 동사로 display + 감정/특성(~을 드러내다) 뜻이 시험에 나온다. put ~ on display(~을 전시하다)도 자주 쓰이는 표현.","grammarQuiz":[{"sentence":"The winning paintings are currently _____ display at the city gallery.","ko":"수상작들은 현재 시립 미술관에서 전시 중이다.","answer":["on"],"hint":"on display 전시 중"},{"sentence":"The young athlete displayed remarkable courage _____ the final round.","ko":"그 어린 선수는 결승전에서 놀라운 용기를 드러냈다.","answer":["in"],"hint":"in + 시간/상황"}]},
    {"id":"w01359","w":"convert","pos":["v","n"],"ph":"/kənˈvɜːt/","cefr":"B1","kr":["전환하다","개종하다"],"ex":[{"en":"She converted the file to PDF.","ko":"그녀는 파일을 PDF로 변환했다."}],"mnemonic":{"soundHint":"'컨버트' → 스포츠카 '컨버터블(convertible)' 지붕이 열려 형태를 바꿈","story":"컨버터블 지붕이 열리며 형태를 전환 = convert(전환하다)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"transform","ko":"변형시키다","reason":"convert의 대표 동의어"},{"w":"currency","ko":"통화","reason":"convert currency 콜로케이션"},{"w":"maintain","ko":"유지하다","reason":"convert(바꾸다)의 반의어"}],"collocBest":[{"en":"convert to energy","ko":"에너지로 전환하다"},{"en":"convert currency","ko":"통화를 환전하다"}]},"nuance":{"koSimple":"형태나 성질을 다른 것으로 바꾸다.","whenToUse":"파일·에너지·통화를 바꿀 때 자주 씀."},"krDetail":[{"ko":"전환하다","explain":"다른 방향이나 형태로 바꾸다"},{"ko":"개종하다","explain":"믿던 종교를 다른 종교로 바꾸다"}],"usageExamples":[{"en":"Solar panels convert sunlight into electricity efficiently.","ko":"태양광 패널은 햇빛을 전기로 효율적으로 전환시킨다."},{"en":"Water converts into steam when heated to 100 degrees.","ko":"물은 100도로 가열되면 증기로 변한다."}],"grammarNote":"'convert A into B' 또는 'convert A to B' 형태로 'A를 B로 전환하다'를 표현. 명사 강세는 앞(CONvert), 동사 강세는 뒤(conVERT).","grammarQuiz":[{"sentence":"The factory _____ waste plastic _____ useful fuel through a new process.","ko":"그 공장은 새로운 공정을 통해 폐플라스틱을 유용한 연료로 전환한다.","answer":["converts","into"],"hint":"convert A into B 구조로 'A를 B로 전환하다'"}]},
    {"id":"w01659","w":"demonstrate","pos":["v"],"ph":"/ˈdemənstreɪt/","cefr":"B1","kr":["보여주다","입증하다"],"ex":[{"en":"He demonstrated the technique clearly.","ko":"그는 기법을 명확하게 보여주었다."}],"mnemonic":{"soundHint":"'데몬(demon,악마)+스트레이트(straight)' → 악마를 똑바로 보여줌","story":"데몬(악마)을 스트레이트로 시연해 입증 → demonstrate(입증하다)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"show","ko":"보여주다","reason":"demonstrate의 가장 기본적인 동의어"},{"w":"ability","ko":"능력","reason":"'능력을 보여주다(demonstrate ability)' 결합이 흔함"},{"w":"prove","ko":"입증하다","reason":"'입증하다' 의미로 자주 교체 사용"}],"collocBest":[]},"nuance":{"koSimple":"직접 보여주며 사실임을 알려 줌.","whenToUse":"시범·실험·능력 입증을 말할 때."},"krDetail":[{"ko":"보여주다","explain":"직접 해 보이거나 자료로 나타내다"},{"ko":"입증하다","explain":"사실이라는 것을 확실히 밝히다"}],"usageExamples":[{"en":"The scientist demonstrated the new theory to skeptical students yesterday.","ko":"그 과학자는 어제 회의적인 학생들에게 새 이론을 보여주었다."},{"en":"The new theory was demonstrated to skeptical students by the scientist yesterday.","ko":"새 이론이 어제 그 과학자에 의해 회의적인 학생들에게 입증되었다."}],"grammarNote":"demonstrate는 뒤에 that절, 의문사절, how to부정사를 모두 취할 수 있다. demonstrate how the machine works처럼 목적어 자리에 명사절이 오는 구조를 시험에서 자주 묻는다.","grammarQuiz":[{"sentence":"The study clearly demonstrated _____ regular exercise improves memory in teenagers.","ko":"그 연구는 규칙적인 운동이 십대들의 기억력을 향상시킨다는 것을 분명히 입증했다.","answer":["that"],"hint":"demonstrate that + 절"},{"sentence":"Can you demonstrate _____ _____ use this app to a beginner?","ko":"너는 초보자에게 이 앱을 어떻게 사용하는지 보여줄 수 있니?","answer":["how","to"],"hint":"how to 부정사"}]},
    {"id":"w01581","w":"deaf","pos":["adj"],"ph":"/def/","cefr":"B1","kr":["귀가 먹은","청각 장애의"],"ex":[{"en":"She has been deaf since birth.","ko":"그녀는 태어날 때부터 귀가 먹었다."}],"mnemonic":{"soundHint":"'데프' → 데(귀에)+프(막힘)","story":"귀가 '데프!' 하고 막혀 소리가 안 들리는 상태","hintConfidence":1},"pairs":{"buddyWords":[{"w":"ear","ko":"귀","reason":"turn a deaf ear 콜로케이션"},{"w":"hearing","ko":"청각","reason":"deaf는 hearing 장애"},{"w":"blind","ko":"눈먼","reason":"deaf와 함께 쓰이는 장애 관련"}],"collocBest":[]},"nuance":{"koSimple":"귀로 소리를 듣지 못하는.","whenToUse":"청각 장애를 말할 때 정중히 씀."},"krDetail":[{"ko":"귀가 먹은","explain":"소리가 들리지 않는"},{"ko":"청각 장애의","explain":"듣는 능력에 장애가 있는"}],"usageExamples":[{"en":"He is deaf in one ear after the accident.","ko":"그는 사고 후 한쪽 귀가 안 들린다."},{"en":"The school teaches sign language to deaf students.","ko":"그 학교는 청각 장애 학생들에게 수화를 가르친다."}],"grammarNote":"deaf는 형용사예요. the deaf처럼 the+형용사 형태로 '청각 장애인들 전체'를 뜻할 수 있어요. 관용구 turn a deaf ear to는 '~을 무시하다'입니다.","grammarQuiz":[{"sentence":"Sign language helps _____ deaf communicate with hearing people.","ko":"수화는 청각 장애인들이 청인들과 소통하는 데 도움을 준다.","answer":["the"],"hint":"the+형용사"},{"sentence":"He turned a deaf _____ to all the warnings from his parents.","ko":"그는 부모님의 모든 경고를 못 들은 척했다.","answer":["ear"],"hint":"관용구"}]},
    {"id":"w01624","w":"defense","pos":["n"],"ph":"/dɪˈfens/","cefr":"B1","kr":["방어","수비"],"ex":[{"en":"The defense was very strong.","ko":"방어가 매우 강했다."}],"mnemonic":{"soundHint":"'디펜스' 외래어 → 스포츠의 수비","story":"'디!펜!스!' 외치는 응원 소리 = defense(수비, 방어)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"national","ko":"국가의","reason":"national defense 콜로케이션"},{"w":"protection","ko":"보호","reason":"defense의 동의어"},{"w":"attack","ko":"공격","reason":"defense의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"공격을 막는 지키기.","whenToUse":"국방·수비·자기방어를 말할 때."},"krDetail":[{"ko":"방어","explain":"공격을 막는 일"},{"ko":"수비","explain":"지키는 편"}],"usageExamples":[{"en":"The team's defense stopped every attack in the game.","ko":"그 팀의 수비는 경기에서 모든 공격을 막아 냈다."},{"en":"The country spends a lot on national defense.","ko":"그 나라는 국방에 많은 돈을 쓴다."}],"grammarNote":"defense는 명사이고 동사형은 defend예요. 미국식은 defense, 영국식은 defence로 씁니다. in defense of는 '~을 옹호하여'입니다.","grammarQuiz":[{"sentence":"The country spends a lot of money on national _____ every year.","ko":"그 나라는 매년 국방에 많은 돈을 쓴다.","answer":["defense","defence"],"hint":"명사"},{"sentence":"She spoke passionately _____ defense of her best friend.","ko":"그녀는 가장 친한 친구를 옹호하며 열정적으로 말했다.","answer":["in"],"hint":"관용구 in ___ of"}]},
    {"id":"w01782","w":"disadvantage","pos":["n"],"ph":"/ˌdɪsədˈvɑːntɪdʒ/","cefr":"B1","kr":["불이익","단점"],"ex":[{"en":"There is one major disadvantage.","ko":"주요 단점이 하나 있다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+어드밴티지(advantage,이점)' → 이점의 반대","story":"advantage(이점)의 반대 = disadvantage(불이익, 단점)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"advantage","ko":"이점","reason":"disadvantage의 대표 반의어"},{"w":"competitive","ko":"경쟁의","reason":"'경쟁상 불리함'으로 결합"},{"w":"weakness","ko":"약점","reason":"disadvantage의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"손해가 되거나 불리한 점.","whenToUse":"장점 대비로 단점을 짚을 때."},"krDetail":[{"ko":"불이익","explain":"이롭지 않고 손해가 되는 일"},{"ko":"단점","explain":"부족하거나 나쁜 점"}],"usageExamples":[{"en":"One disadvantage of the plan is its high cost.","ko":"그 계획의 한 가지 단점은 높은 비용이다."},{"en":"Living far from school puts him at a disadvantage.","ko":"학교에서 멀리 사는 것은 그를 불리하게 만든다."}],"grammarNote":"disadvantage는 반의어 advantage와 짝을 이루고, at a disadvantage(불리한 처지에), put/place ~ at a disadvantage(~를 불리하게 만들다) 형태로 자주 쓴다. 뒤에 of + 명사/동명사가 붙어 '~라는 단점'을 나타낸다.","grammarQuiz":[{"sentence":"Small companies are often _____ _____ disadvantage when competing with global brands.","ko":"작은 회사들은 세계적 브랜드들과 경쟁할 때 종종 불리한 처지에 놓인다.","answer":["at","a"],"hint":"at a disadvantage"},{"sentence":"One major _____ of online learning is the lack of face-to-face interaction.","ko":"온라인 학습의 주요한 단점 중 하나는 대면 상호작용의 부족이다.","answer":["disadvantage"],"hint":"disadvantage of ~"}]},
    {"id":"w01411","w":"council","pos":["n"],"ph":"/ˈkaʊnsəl/","cefr":"B1","kr":["의회","위원회"],"ex":[{"en":"The council voted on the issue.","ko":"의회가 그 문제에 투표했다."}],"mnemonic":{"soundHint":"'카운슬(counsel,상담)'과 비슷 → 함께 상담·회의하는 곳","story":"카운슬(상담)과 헷갈리지만 council은 여럿이 모여 상담하는 '의회'","hintConfidence":2},"pairs":{"buddyWords":[{"w":"committee","ko":"위원회","reason":"council의 대표 동의어"},{"w":"city","ko":"도시","reason":"city council 콜로케이션"},{"w":"meeting","ko":"회의","reason":"council meeting 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"여럿이 모여 결정을 내리는 회의체.","whenToUse":"시의회·학생회 같은 공식 조직을 말할 때."},"krDetail":[{"ko":"의회","explain":"여러 사람이 모여 나라나 지역의 일을 정하는 모임"},{"ko":"위원회","explain":"특정한 일을 맡아 처리하도록 뽑힌 사람들의 모임"}],"usageExamples":[{"en":"The city council approved the new park.","ko":"시의회는 새 공원 건설을 승인했다."},{"en":"She was elected to the student council.","ko":"그녀는 학생회 위원으로 선출되었다."}],"grammarNote":"council(의회/위원회)과 counsel(조언, 조언하다)은 발음이 같지만 뜻이 다름에 유의. council은 집합명사로 단수·복수 취급 모두 가능(영국식은 복수 취급이 흔함).","grammarQuiz":[{"sentence":"The new law _____ (approve) by the council last month.","ko":"새 법은 지난달 의회에 의해 승인되었다.","answer":"was approved","hint":"수동태 과거"}]},
    {"id":"w01499","w":"crystal","pos":["n","adj"],"ph":"/ˈkrɪstəl/","cefr":"B1","kr":["수정","투명한"],"ex":[{"en":"The crystal shone in the sunlight.","ko":"수정이 햇빛에 빛났다."}],"mnemonic":{"soundHint":"크리스탈","story":"'크리스탈'은 수정을 뜻하는 외래어.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"clear","ko":"맑은","reason":"crystal clear 콜로케이션"},{"w":"gem","ko":"보석","reason":"crystal의 동의어"},{"w":"glass","ko":"유리","reason":"crystal glass 시나리오"}],"collocBest":[{"en":"crystal clear","ko":"수정처럼 맑은"},{"en":"crystal ball","ko":"수정구"}]},"nuance":{"koSimple":"반짝이는 투명한 돌·유리.","whenToUse":"수정·크리스탈처럼 맑고 투명할 때."},"krDetail":[{"ko":"수정","explain":"맑고 반짝이는 돌"},{"ko":"투명한","explain":"속이 훤히 비쳐 보이는"}],"usageExamples":[{"en":"She wore a necklace with a clear crystal.","ko":"그녀는 맑은 수정이 달린 목걸이를 했다."},{"en":"The lake water was crystal clear.","ko":"그 호수의 물은 수정처럼 맑았다."}],"grammarNote":"crystal clear는 '아주 분명한/투명한'이라는 관용 표현으로 자주 쓰여요. crystal은 명사·형용사 모두 가능합니다.","grammarQuiz":[{"sentence":"The water in the mountain lake was crystal _____ that morning.","ko":"그날 아침 산속 호수의 물은 수정처럼 맑았다.","answer":["clear"],"hint":"관용 표현"},{"sentence":"The old woman claimed she could see the future in her crystal _____.","ko":"그 노파는 수정구슬로 미래를 볼 수 있다고 주장했다.","answer":["ball"],"hint":"점술 도구"}]},
    {"id":"w01590","w":"debt","pos":["n"],"ph":"/det/","cefr":"B1","kr":["빚","부채"],"ex":[{"en":"He is deep in debt.","ko":"그는 빚이 많다."}],"mnemonic":{"soundHint":"'뎃!' → 빚 독촉장이 '뎃!' 하고 도착","story":"'뎃!' 하고 빚 독촉장이 문을 두드리는 소리 = debt(빚). b는 묵음!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"pay","ko":"갚다","reason":"pay off debt 콜로케이션"},{"w":"loan","ko":"대출","reason":"debt의 동의어"},{"w":"credit","ko":"신용","reason":"debt와 대비되는 금융 개념"}],"collocBest":[]},"nuance":{"koSimple":"갚아야 할 돈, 빚.","whenToUse":"돈을 빌린 상태나 은혜를 말할 때."},"krDetail":[{"ko":"빚","explain":"남에게 갚아야 할 돈"},{"ko":"부채","explain":"갚을 의무가 있는 돈"}],"usageExamples":[{"en":"She paid off all her debt last year.","ko":"그녀는 작년에 자신의 빚을 모두 갚았다."},{"en":"The company is struggling under heavy debt.","ko":"그 회사는 큰 부채에 시달리고 있다."}],"grammarNote":"debt의 b는 묵음이라 발음되지 않아요. '빚을 지고 있다'는 be in debt, '빚을 갚다'는 pay off (a) debt로 씁니다.","grammarQuiz":[{"sentence":"After college, many young people find themselves _____ debt.","ko":"대학 졸업 후, 많은 젊은이들이 빚을 진 상태가 된다.","answer":["in"],"hint":"관용구"},{"sentence":"It took her ten years to pay _____ all of her student debt.","ko":"그녀가 학자금 빚을 다 갚는 데 10년이 걸렸다.","answer":["off"],"hint":"구동사"}]},
    {"id":"w01405","w":"costume","pos":["n"],"ph":"/ˈkɒstjuːm/","cefr":"B1","kr":["의상","복장"],"ex":[{"en":"The actors wore elaborate costumes for the play.","ko":"배우들은 연극을 위해 정교한 의상을 입었다."}],"mnemonic":{"soundHint":"'코스튬' → 한국어로 '코스튬 플레이(코스프레)' 그대로 의상","story":"'코스프레(cosplay)'의 '코스튬'이 곧 costume(의상)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"outfit","ko":"옷차림, 의상","reason":"costume의 대표 동의어"},{"w":"Halloween","ko":"핼러윈","reason":"Halloween costume 콜로케이션"},{"w":"design","ko":"디자인","reason":"costume design 콜로케이션"}],"collocBest":[{"en":"Halloween costume","ko":"할로윈 의상"},{"en":"costume design","ko":"의상 디자인"}]},"nuance":{"koSimple":"역할·행사 때 갖춰 입는 특별한 옷.","whenToUse":"연극·할로윈·전통 의상을 말할 때."},"krDetail":[{"ko":"의상","explain":"특별한 자리에서 입는 옷차림"},{"ko":"복장","explain":"옷을 갖추어 입은 모양"}],"usageExamples":[{"en":"She made a superhero costume for Halloween.","ko":"그녀는 핼러윈을 위해 슈퍼히어로 의상을 만들었다."},{"en":"The dancers changed costumes between scenes.","ko":"무용수들은 장면 사이에 의상을 갈아입었다."}],"grammarNote":"costume은 일상복이 아닌 특별한 목적(할로윈, 연극, 전통)의 옷을 뜻함. 일반 옷은 clothes/outfit 사용. 셀 수 있는 명사로 관사와 복수형 가능.","grammarQuiz":[{"sentence":"The costumes _____ (design) by a famous artist last year.","ko":"그 의상들은 작년에 유명한 예술가에 의해 디자인되었다.","answer":"were designed","hint":"수동태 과거"}]},
    {"id":"w01427","w":"courage","pos":["n"],"ph":"/ˈkʌrɪdʒ/","cefr":"B1","kr":["용기","담력"],"ex":[{"en":"She showed great courage.","ko":"그녀는 대단한 용기를 보여주었다."}],"mnemonic":{"soundHint":"'커(크게)+리지(내지)' → 크게 소리 내지르는 용기","story":"커! 하고 리지(내지)르며 소리치면 courage(용기)가 생긴다","hintConfidence":1},"pairs":{"buddyWords":[{"w":"bravery","ko":"용감함","reason":"courage의 대표 동의어"},{"w":"courageous","ko":"용감한","reason":"형용사형 파생어"},{"w":"fear","ko":"두려움","reason":"courage의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"무섭거나 힘들어도 나서는 마음.","whenToUse":"두려움을 이겨내는 태도를 말할 때."},"krDetail":[{"ko":"용기","explain":"겁내지 않는 씩씩한 마음"},{"ko":"담력","explain":"겁 없이 사물을 대할 수 있는 마음의 힘"}],"usageExamples":[{"en":"It takes courage to admit a mistake.","ko":"실수를 인정하는 데는 용기가 필요하다."},{"en":"He found the courage to speak in public.","ko":"그는 사람들 앞에서 말할 용기를 냈다."}],"grammarNote":"courage는 셀 수 없는 명사(불가산). 'have the courage to부정사'(~할 용기가 있다), 'take courage'(용기를 내다) 등 관용 표현으로 자주 쓰임.","grammarQuiz":[{"sentence":"It takes great _____ _____ _____ up against injustice in society.","ko":"사회의 부정의에 맞서 일어서는 데는 큰 용기가 필요하다.","answer":["courage","to","stand"],"hint":"It takes + 명사 + to부정사 + stand up against 구조"}]},
    {"id":"w01787","w":"disaster","pos":["n"],"ph":"/dɪˈzɑːstər/","cefr":"B1","kr":["재난","재해"],"ex":[{"en":"The earthquake was a natural disaster.","ko":"지진은 자연재해였다."}],"mnemonic":{"soundHint":"'디스(dis-,나쁜)+애스터(aster,별)' → 별자리가 나쁨 = 불운","story":"옛사람들은 별이 어긋나면 재앙이 온다고 믿음 → disaster(재난)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"natural","ko":"자연의","reason":"'자연재해(natural disaster)'로 결합"},{"w":"relief","ko":"구호","reason":"'재난 구호(disaster relief)'로 결합"},{"w":"tragedy","ko":"비극","reason":"disaster의 대표 동의어"}],"collocBest":[]},"nuance":{"koSimple":"큰 피해를 남기는 재난.","whenToUse":"자연·인재·실패를 강조할 때."},"krDetail":[{"ko":"재난","explain":"갑자기 닥쳐 큰 피해를 주는 사고"},{"ko":"재해","explain":"지진·홍수처럼 사람들에게 해를 입히는 큰 사건"}],"usageExamples":[{"en":"The flood was the worst disaster in the region's history.","ko":"그 홍수는 그 지역 역사상 최악의 재난이었다."},{"en":"Without practice, the concert could be a disaster.","ko":"연습 없이는 그 콘서트가 엉망이 될 수 있다."}],"grammarNote":"disaster는 셀 수 있는 명사. natural disaster(자연재해), disaster area(재해 지역), disaster relief(재난 구호)처럼 명사+명사 복합어로 자주 쓰인다. 형용사형 disastrous(끔찍한, 참담한)도 함께 익히자.","grammarQuiz":[{"sentence":"Volunteers rushed to help victims of the natural _____ last week.","ko":"자원봉사자들이 지난주 자연재해 피해자들을 돕기 위해 급히 달려갔다.","answer":["disaster"],"hint":"natural disaster"},{"sentence":"The failure of the project turned out to be a complete _____.","ko":"그 프로젝트의 실패는 완전한 재앙으로 드러났다.","answer":["disaster"],"hint":"비유적 의미의 disaster"}]},
    {"id":"w01770","w":"diploma","pos":["n"],"ph":"/dɪˈploʊmə/","cefr":"B1","kr":["졸업장","수료증"],"ex":[{"en":"She received a high school diploma.","ko":"그녀는 고등학교 졸업장을 받았다."}],"mnemonic":{"soundHint":"'디플로마' 외래어 → 졸업장","story":"'디플로마 코스' 등 외래어 그대로 = 졸업장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"certificate","ko":"증명서","reason":"diploma의 대표 동의어"},{"w":"graduate","ko":"졸업하다","reason":"졸업 시 diploma를 받는다는 짝"},{"w":"school","ko":"학교","reason":"'고등학교 졸업장(high school diploma)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"과정을 마쳤음을 증명하는 종이.","whenToUse":"고교·대학·수료 과정 결과물에."},"krDetail":[{"ko":"졸업장","explain":"학교나 과정을 마쳤음을 나타내는 종이 문서"},{"ko":"수료증","explain":"정해진 교육 과정을 다 마쳤음을 확인해 주는 종이"}],"usageExamples":[{"en":"He proudly showed his high school diploma to his parents.","ko":"그는 부모님께 고등학교 졸업장을 자랑스럽게 보여 주었다."},{"en":"You need a diploma to apply for this program.","ko":"이 프로그램에 지원하려면 수료증이 필요하다."}],"grammarNote":"diploma는 셀 수 있는 명사로 부정관사와 함께 쓴다. earn a diploma(졸업장을 받다), a high school diploma(고졸 졸업장), diploma in ~(~ 분야 학위) 형태를 익혀두자. degree보다 짧고 실무 위주인 자격을 뜻할 때가 많다.","grammarQuiz":[{"sentence":"She earned _____ diploma in graphic design after two years of study.","ko":"그녀는 2년간의 공부 끝에 그래픽 디자인 분야의 수료증을 받았다.","answer":["a"],"hint":"가산명사 diploma + a"},{"sentence":"You must have a high school _____ to apply for this job.","ko":"이 일자리에 지원하려면 고등학교 졸업장이 있어야 한다.","answer":["diploma"],"hint":"high school diploma"}]},
    {"id":"w01447","w":"crash","pos":["n","v"],"ph":"/kræʃ/","cefr":"B1","kr":["충돌","추락"],"ex":[{"en":"The car crashed into the wall.","ko":"자동차가 벽에 충돌했다."}],"mnemonic":{"soundHint":"'크래시' → '크래시!' 충돌 효과음 (의성어)","story":"'크래시!' 큰 소리와 함께 부딪히는 충돌 = crash","hintConfidence":3},"pairs":{"buddyWords":[{"w":"collision","ko":"충돌","reason":"crash의 대표 동의어"},{"w":"car","ko":"자동차","reason":"car crash 콜로케이션"},{"w":"smash","ko":"박살내다","reason":"crash의 동의어"}],"collocBest":[{"en":"car crash","ko":"자동차 충돌"},{"en":"crash into","ko":"~에 충돌하다"}]},"nuance":{"koSimple":"큰 소리로 부딪히는 충돌·추락.","whenToUse":"차 사고·비행기 추락·시스템 다운에 씀."},"krDetail":[{"ko":"충돌","explain":"두 물체가 세게 부딪침"},{"ko":"추락","explain":"높은 곳에서 아래로 떨어짐"}],"usageExamples":[{"en":"The reckless driver crashed his new car into a tree yesterday.","ko":"그 무모한 운전자는 어제 자신의 새 차를 나무에 부딪쳤다."},{"en":"The old computer crashed suddenly during the important meeting.","ko":"그 낡은 컴퓨터는 중요한 회의 도중에 갑자기 다운되었다."}],"grammarNote":"crash는 자동사(부딪치다/추락하다/컴퓨터가 다운되다)와 타동사(차를 들이받다) 모두 가능. 'crash into + 물체'(~에 충돌하다) 구조가 자주 쓰임.","grammarQuiz":[{"sentence":"The speeding truck _____ _____ a light pole because the driver fell asleep.","ko":"그 과속 트럭은 운전자가 잠들어서 가로등 기둥에 충돌했다.","answer":["crashed","into"],"hint":"자동사 crash + into + 목적어(충돌하다)"}]},
    {"id":"w01519","w":"cure","pos":["n","v"],"ph":"/kjʊr/","cefr":"B1","kr":["치료","치료약","치유하다"],"ex":[{"en":"Scientists are searching for a cure for cancer.","ko":"과학자들은 암 치료법을 연구하고 있다."}],"mnemonic":{"soundHint":"'큐어(care와 유사)' → 돌봐 낫게 하다","story":"큐어! 하고 병을 몰아내면 치료가 된다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"disease","ko":"질병","reason":"cure a disease 콜로케이션"},{"w":"remedy","ko":"치료법","reason":"cure의 동의어"},{"w":"heal","ko":"치유하다","reason":"cure의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"병을 낫게 하는 약이나 방법.","whenToUse":"질병·문제를 해결하는 치료를 말할 때."},"krDetail":[{"ko":"치료","explain":"병을 낫게 하는 일"},{"ko":"치유하다","explain":"아픈 곳을 낫게 하다"}],"usageExamples":[{"en":"This new medicine can cure many types of headaches quickly.","ko":"이 새 약은 여러 종류의 두통을 빠르게 치료해 준다."},{"en":"Many types of headaches can be cured quickly by this new medicine.","ko":"여러 종류의 두통은 이 새 약에 의해 빠르게 치료될 수 있다."}],"grammarNote":"cure는 '병을 치료하다'이고, treat는 '환자를 진료하다'예요. cure A of B(A에게서 B를 낫게 하다) 구문도 알아두세요.","grammarQuiz":[{"sentence":"Doctors are still searching for a _____ for the common cold.","ko":"의사들은 여전히 감기의 치료법을 찾고 있다.","answer":["cure"],"hint":"명사"},{"sentence":"This herbal tea is said to cure people _____ mild stomach pain.","ko":"이 허브차는 가벼운 위통을 낫게 해 준다고 한다.","answer":["of"],"hint":"cure A ___ B"}]},
    {"id":"w01698","w":"designer","pos":["n"],"ph":"/dɪˈzaɪnər/","cefr":"B1","kr":["디자이너"],"ex":[{"en":"She works as a fashion designer in Milan.","ko":"그녀는 밀라노에서 패션 디자이너로 일한다."}],"mnemonic":{"soundHint":"'디자이너'는 한국에서 그대로 쓰는 외래어예요.","story":"패션·그래픽 등 다양한 분야에서 '디자이너'라는 말이 그대로 통용됩니다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fashion","ko":"패션","reason":"'패션 디자이너'로 흔히 결합"},{"w":"graphic","ko":"그래픽","reason":"'그래픽 디자이너'로 대표적으로 함께 쓰임"},{"w":"design","ko":"디자인","reason":"designer의 어근이자 짝 단어"}],"collocBest":[{"en":"fashion designer","ko":"패션 디자이너"},{"en":"graphic designer","ko":"그래픽 디자이너"}]},"nuance":{"koSimple":"모양·기능을 새로 만드는 사람.","whenToUse":"패션·그래픽·제품 설계자를 가리킬 때."},"krDetail":[{"ko":"디자이너","explain":"옷·물건·건물의 모양을 계획하고 만드는 사람"}],"usageExamples":[{"en":"The designer created a new logo for the company.","ko":"그 디자이너는 회사를 위한 새 로고를 만들었다."},{"en":"He wants to become a video game designer.","ko":"그는 비디오 게임 디자이너가 되고 싶어 한다."}],"grammarNote":"designer는 '~을 만드는 사람'을 나타내는 -er 형 행위자 명사. designer 앞에 명사가 오면 designer clothes(디자이너 브랜드 옷)처럼 형용사처럼 쓰일 수 있으니 문맥으로 구분해야 한다.","grammarQuiz":[{"sentence":"She dreams of becoming a fashion _____ after finishing university next year.","ko":"그녀는 내년에 대학을 마친 후 패션 디자이너가 되는 것을 꿈꾼다.","answer":["designer"],"hint":"fashion designer"},{"sentence":"The graphic _____ created a stunning new logo for our company.","ko":"그 그래픽 디자이너는 우리 회사를 위한 멋진 새 로고를 만들었다.","answer":["designer"],"hint":"graphic designer"}]},
    {"id":"w01836","w":"district","pos":["n"],"ph":"/ˈdɪstrɪkt/","cefr":"B1","kr":["지구","지역"],"ex":[{"en":"She lives in a school district.","ko":"그녀는 학교 구역에 산다."}],"mnemonic":{"soundHint":"'디스트릭트 9' 영화 연상 → 특정 구역","story":"영화 <디스트릭트 9>의 그 district = 지역, 구역","hintConfidence":2},"pairs":{"buddyWords":[{"w":"area","ko":"지역","reason":"district의 대표 동의어"},{"w":"business","ko":"사업의","reason":"'비즈니스 지구(business district)'로 결합"},{"w":"school","ko":"학교","reason":"'학교 구역(school district)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"행정·기능으로 나뉜 지역.","whenToUse":"상업·학군·행정 구역을 말할 때."},"krDetail":[{"ko":"지구","explain":"행정이나 특정 목적으로 나누어 놓은 땅의 구역"},{"ko":"지역","explain":"일정한 특징이 있는 넓은 땅의 부분"}],"usageExamples":[{"en":"This shopping district is busy on weekends.","ko":"이 쇼핑 지구는 주말에 붐빈다."},{"en":"The school is located in a quiet residential district.","ko":"그 학교는 조용한 주거 지역에 있다."}],"grammarNote":"district는 셀 수 있는 명사. 미국 학군을 뜻하는 school district, 상업 지구를 뜻하는 business/financial district, 국회의원 선거구인 electoral district처럼 특정 성격의 구역을 나타낼 때 형용사와 함께 쓴다.","grammarQuiz":[{"sentence":"This restaurant is located in the busiest business _____ of the city.","ko":"이 식당은 그 도시의 가장 번화한 비즈니스 지구에 위치해 있다.","answer":["district"],"hint":"business district"},{"sentence":"Every child _____ this district must attend the local elementary school.","ko":"이 학군의 모든 아이는 지역 초등학교에 다녀야 한다.","answer":["in"],"hint":"in + 지역/구역"}]},
    {"id":"w01628","w":"define","pos":["v"],"ph":"/dɪˈfaɪn/","cefr":"B1","kr":["정의하다","규정하다"],"ex":[{"en":"Please define this term clearly.","ko":"이 용어를 명확하게 정의해 주세요."}],"mnemonic":{"soundHint":"'디(de-)+파인(fine,정교한)' → 뜻을 정교하게","story":"de+fine(정교한) → 정교하게 뜻을 밝히다 = define(정의하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"clearly","ko":"명확히","reason":"clearly defined 콜로케이션"},{"w":"explain","ko":"설명하다","reason":"define의 동의어"},{"w":"meaning","ko":"의미","reason":"define은 meaning을 밝힘"}],"collocBest":[]},"nuance":{"koSimple":"뜻을 정확히 설명하다.","whenToUse":"용어·개념을 명확히 규정할 때."},"krDetail":[{"ko":"정의하다","explain":"뜻을 분명히 밝히다"},{"ko":"규정하다","explain":"무엇인지 정하다"}],"usageExamples":[{"en":"The teacher defines each new word clearly during the vocabulary lesson.","ko":"그 선생님은 어휘 수업에서 새 단어들을 저마다 분명하게 정의해 주신다."},{"en":"Each new word is defined clearly during the vocabulary lesson.","ko":"새 단어들은 저마다 어휘 수업에서 분명하게 정의된다."}],"grammarNote":"define A as B는 'A를 B로 정의하다'라는 뜻이에요. 과거분사 defined는 well-defined(잘 정의된), clearly defined(명확히 정의된) 형태로 자주 나옵니다.","grammarQuiz":[{"sentence":"Scientists define water _____ a compound made of hydrogen and oxygen.","ko":"과학자들은 물을 수소와 산소로 이루어진 화합물이라고 정의한다.","answer":["as"],"hint":"define A ___ B"},{"sentence":"Please give a clearly _____ answer to the teacher's question.","ko":"선생님의 질문에 명확히 정의된 답을 주세요.","answer":["defined"],"hint":"과거분사"}]},
    {"id":"w01645","w":"delicious","pos":["adj"],"ph":"/dɪˈlɪʃəs/","cefr":"B1","kr":["맛있는"],"ex":[{"en":"The homemade soup was absolutely delicious.","ko":"집에서 만든 수프는 정말 맛있었다."}],"mnemonic":{"soundHint":"'딜리셔스'는 한국 광고·메뉴에서 그대로 쓰는 외래어예요.","story":"'딜리셔스'는 한국에서도 광고·메뉴에 흔히 쓰이는 외래어로 '아주 맛있는'을 뜻해요.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"taste","ko":"맛이 나다","reason":"delicious한 음식의 맛을 표현할 때 자주 함께 씀"},{"w":"meal","ko":"식사","reason":"'맛있는 식사(delicious meal)'로 흔히 결합"},{"w":"dessert","ko":"디저트","reason":"달콤한 디저트를 묘사할 때 대표적으로 쓰임"}],"collocBest":[{"en":"smell delicious","ko":"맛있는 냄새가 나다"},{"en":"taste delicious","ko":"맛있다"}]},"nuance":{"koSimple":"먹었을 때 정말 맛있다고 느끼는 맛.","whenToUse":"음식·냄새·맛을 강하게 칭찬할 때."},"krDetail":[{"ko":"맛있는","explain":"혀에 느껴지는 맛이 아주 좋은"}],"usageExamples":[{"en":"This chocolate cake tastes absolutely delicious.","ko":"이 초콜릿 케이크는 정말 맛있다."},{"en":"The restaurant serves delicious Italian food.","ko":"그 식당은 맛있는 이탈리아 음식을 낸다."}],"grammarNote":"delicious는 '매우 맛있는'이라는 강한 뜻이 이미 담긴 형용사라 very로 강조하지 않는다. very tired 같은 일반 형용사와 달리 강조할 때는 really/absolutely delicious를 쓴다.","grammarQuiz":[{"sentence":"The soup smelled _____ _____ that everyone rushed to the table.","ko":"그 수프는 너무 맛있는 냄새가 나서 모두가 식탁으로 달려갔다.","answer":["so","delicious"],"hint":"so ~ that 구문"},{"sentence":"The bread tasted _____ _____ we ordered another loaf right away.","ko":"그 빵이 너무 맛있어서 우리는 곧바로 한 덩어리를 더 주문했다.","answer":["so","delicious"],"hint":"감각동사 taste + 형용사"}]},
    {"id":"w01437","w":"coverage","pos":["n"],"ph":"/ˈkʌvərɪdʒ/","cefr":"B1","kr":["보도","취재","보장"],"ex":[{"en":"The event received wide media coverage.","ko":"그 행사는 광범위한 언론 보도를 받았다."}],"mnemonic":{"soundHint":"'커버(cover,덮다)+리지' → 덮는 범위","story":"cover(덮다)+age = 뉴스가 덮는 범위 = 보도, 보험이 덮는 범위 = 보장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cover","ko":"덮다, 다루다","reason":"어근 파생어"},{"w":"media","ko":"언론","reason":"media coverage 콜로케이션"},{"w":"insurance","ko":"보험","reason":"insurance coverage 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"언론이 다루는 보도, 또는 보험 보장 범위.","whenToUse":"뉴스·보험 문맥에서 각기 다른 뜻."},"krDetail":[{"ko":"보도","explain":"새로운 소식을 사람들에게 알림"},{"ko":"취재","explain":"기삿거리를 조사하고 모음"},{"ko":"보장","explain":"잘못되지 않도록 지켜 줌"}],"usageExamples":[{"en":"The match got live TV coverage.","ko":"그 경기는 TV 생중계로 보도되었다."},{"en":"This plan offers wide medical coverage.","ko":"이 상품은 폭넓은 의료 보장을 제공한다."}],"grammarNote":"coverage는 셀 수 없는 명사(불가산). media coverage(언론 보도), insurance coverage(보험 보장), news coverage(뉴스 보도) 등 앞에 형용사가 붙어 다양한 의미를 나타냄.","grammarQuiz":[{"sentence":"The event received extensive media _____ _____ several international news channels.","ko":"그 행사는 여러 국제 뉴스 채널에서 광범위한 언론 보도를 받았다.","answer":["coverage","from"],"hint":"coverage from + 매체 구조(보도의 출처)"}]},
    {"id":"w01572","w":"dawn","pos":["n","v"],"ph":"/dɔːn/","cefr":"B1","kr":["새벽","동이 트다"],"ex":[{"en":"She woke up at dawn.","ko":"그녀는 새벽에 일어났다."}],"mnemonic":{"soundHint":"'돈(빛이 돈다)' → 새벽에 빛이 돌아온다","story":"새벽(돈=dawn)에 어둠이 물러가고 빛이 돌아온다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"before","ko":"~전에","reason":"before dawn 콜로케이션"},{"w":"sunrise","ko":"일출","reason":"dawn의 동의어"},{"w":"dusk","ko":"황혼","reason":"dawn의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"해가 막 뜨는 새벽.","whenToUse":"이른 아침·동틀 무렵을 말할 때."},"krDetail":[{"ko":"새벽","explain":"해가 막 뜨기 시작하는 이른 아침"},{"ko":"동이 트다","explain":"하늘이 밝아 오다"}],"usageExamples":[{"en":"Farmers dawn their fields with the first rays of morning light.","ko":"농부들은 아침 첫 햇살로 밭을 밝힌다."},{"en":"A bright new day dawned over the quiet mountain village.","ko":"밝은 새 날이 조용한 산골 마을에 밝아 왔다."}],"grammarNote":"at dawn은 '새벽에'라는 시간 표현이에요. dawn on+사람은 '~에게 갑자기 이해가 되다'라는 관용 표현으로도 씁니다.","grammarQuiz":[{"sentence":"The fishermen leave the harbor every day _____ dawn.","ko":"어부들은 매일 새벽에 항구를 떠난다.","answer":["at","before"],"hint":"전치사"},{"sentence":"It finally dawned _____ me why she had been so quiet all day.","ko":"그녀가 하루 종일 왜 그렇게 조용했는지 마침내 이해가 되었다.","answer":["on"],"hint":"관용 표현"}]},
    {"id":"w01578","w":"deadline","pos":["n"],"ph":"/ˈdedlaɪn/","cefr":"B1","kr":["마감 시한","기한"],"ex":[{"en":"Meet the deadline on time.","ko":"제때 마감 기한을 맞춰라."}],"mnemonic":{"soundHint":"'데드(dead,죽음)+라인(line,선)' → 넘으면 죽는 선","story":"이 선(라인)을 넘으면 죽는다(데드) → 마감 시한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"meet","ko":"충족시키다","reason":"meet a deadline 콜로케이션"},{"w":"miss","ko":"놓치다","reason":"miss a deadline 콜로케이션"},{"w":"due","ko":"기한이 된","reason":"due date = deadline"}],"collocBest":[]},"nuance":{"koSimple":"일을 끝내야 하는 마감 시간.","whenToUse":"숙제·과제·업무 기한을 말할 때."},"krDetail":[{"ko":"마감 시한","explain":"일을 끝내야 하는 마지막 때"},{"ko":"기한","explain":"정해진 마지막 날짜"}],"usageExamples":[{"en":"The deadline for the report is next Friday.","ko":"보고서 마감 시한은 다음 주 금요일이다."},{"en":"We worked all night to meet the deadline.","ko":"우리는 기한을 맞추려고 밤새 일했다."}],"grammarNote":"meet a deadline(기한을 지키다)와 miss a deadline(기한을 놓치다)는 관용 표현이에요. 전치사는 by the deadline(그 기한까지)로 씁니다.","grammarQuiz":[{"sentence":"Students must submit their essays _____ the deadline next Monday.","ko":"학생들은 다음 월요일 기한까지 에세이를 제출해야 한다.","answer":["by","before"],"hint":"전치사"},{"sentence":"The team worked overnight to _____ the tight deadline for the project.","ko":"그 팀은 프로젝트의 촉박한 기한을 맞추려고 밤새 일했다.","answer":["meet","make"],"hint":"동사 원형"}]},
    {"id":"w01693","w":"desert","pos":["n","v"],"ph":"/ˈdezərt/","cefr":"B1","kr":["사막","버리다"],"ex":[{"en":"The Sahara is a vast desert.","ko":"사하라는 광대한 사막이다."}],"mnemonic":{"soundHint":"'디저트(dessert,후식)'와 s 개수 차이 → 사막","story":"dessert(후식, s 두 개)와 desert(사막, s 하나) 구별. 사막은 s가 하나뿐(썰렁)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"oasis","ko":"오아시스","reason":"사막(desert)과 대비되는 대표 이미지"},{"w":"island","ko":"섬","reason":"'무인도(desert island)'로 결합"},{"w":"abandon","ko":"버리다","reason":"desert의 동사 의미와 동의어"}],"collocBest":[]},"nuance":{"koSimple":"모래로 뒤덮인 메마른 땅, 혹은 버리다.","whenToUse":"사막을 말하거나 사람·의무를 저버릴 때."},"krDetail":[{"ko":"사막","explain":"비가 거의 오지 않아 모래와 돌만 있는 넓은 땅"},{"ko":"버리다","explain":"돌보지 않고 아주 떠나 버리다"}],"usageExamples":[{"en":"The soldier deserted his post during the long, cold night.","ko":"그 병사는 길고 추운 밤 동안 자신의 초소를 이탈했다."},{"en":"His post was deserted during the long, cold night.","ko":"그의 초소는 길고 추운 밤 동안 버려져 있었다."}],"grammarNote":"desert는 명사 '사막'일 때는 앞음절에 강세(DEs-ert), 동사 '버리다'일 때는 뒷음절에 강세(de-SERT)가 온다. dessert(디저트)와 철자가 다르니 주의.","grammarQuiz":[{"sentence":"The abandoned town felt completely _____ after the mine closed down.","ko":"그 광산이 폐쇄된 후 그 버려진 마을은 완전히 인적이 없어 보였다.","answer":["deserted"],"hint":"형용사 deserted 인적이 없는"},{"sentence":"Many species have adapted to survive _____ the dry desert climate.","ko":"많은 종들이 건조한 사막 기후에서 살아남기 위해 적응해 왔다.","answer":["in"],"hint":"in + 환경/기후"}]},
    {"id":"w01564","w":"darkness","pos":["n"],"ph":"/ˈdɑːrknəs/","cefr":"B1","kr":["어둠","암흑"],"ex":[{"en":"She feared the darkness.","ko":"그녀는 어둠을 두려워했다."}],"mnemonic":{"soundHint":"'다크(dark,어두운)+니스' → 어두움의 상태","story":"dark(어두운)+ness → darkness(어둠)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"total","ko":"완전한","reason":"total darkness 콜로케이션"},{"w":"light","ko":"빛","reason":"darkness의 반의어"},{"w":"night","ko":"밤","reason":"darkness의 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"빛이 없어 아무것도 안 보이는 상태.","whenToUse":"밤·공포·절망을 비유할 때."},"krDetail":[{"ko":"어둠","explain":"빛이 없는 상태"},{"ko":"암흑","explain":"아주 컴컴한 상태"}],"usageExamples":[{"en":"The room was in total darkness.","ko":"그 방은 완전히 어둠 속에 있었다."},{"en":"Our eyes slowly got used to the darkness.","ko":"우리 눈은 천천히 어둠에 익숙해졌다."}],"grammarNote":"darkness는 dark(형용사)의 명사형이에요. in the darkness(그 어둠 속에서)와 in darkness(어둠 속에서, 전기가 나간 상태 등) 둘 다 자주 씁니다.","grammarQuiz":[{"sentence":"The whole village was left _____ darkness after the storm.","ko":"폭풍이 지나간 뒤 마을 전체가 어둠에 잠겼다.","answer":["in"],"hint":"전치사"},{"sentence":"Owls can see very well even in total _____ at night.","ko":"부엉이는 밤에 완전한 어둠 속에서도 잘 볼 수 있다.","answer":["darkness"],"hint":"명사"}]},
    {"id":"w01524","w":"currency","pos":["n"],"ph":"/ˈkɜrənsi/","cefr":"B1","kr":["통화","화폐","유통"],"ex":[{"en":"The currency of Japan is the yen.","ko":"일본의 통화는 엔이다."}],"mnemonic":{"soundHint":"'커런트(current,현재)+시' → 현재 유통되는 돈","story":"current(현재)의 명사 → 지금 유통되는 돈 = currency(통화)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"foreign","ko":"외국의","reason":"foreign currency 콜로케이션"},{"w":"exchange","ko":"환전","reason":"exchange currency 콜로케이션"},{"w":"money","ko":"돈","reason":"currency의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"한 나라에서 쓰는 돈.","whenToUse":"원·달러·엔 같은 화폐 단위를 말할 때."},"krDetail":[{"ko":"통화","explain":"한 나라에서 쓰는 돈"},{"ko":"화폐","explain":"물건값을 치를 때 쓰는 돈"}],"usageExamples":[{"en":"You should exchange currency before you travel.","ko":"여행 전에 환전을 하는 것이 좋다."},{"en":"The euro is the currency of many countries.","ko":"유로는 많은 나라의 통화이다."}],"grammarNote":"currency는 셀 수 있는 명사·셀 수 없는 명사 둘 다 쓰여요. 여러 나라 화폐를 말할 땐 currencies로 복수형을 씁니다.","grammarQuiz":[{"sentence":"Travelers often need to exchange their _____ before entering a new country.","ko":"여행자들은 새 나라에 들어가기 전에 자국 화폐를 환전해야 하는 경우가 많다.","answer":["currency"],"hint":"단수 명사"},{"sentence":"The euro is the common _____ used in most European Union countries.","ko":"유로는 대부분의 유럽연합 국가에서 쓰이는 공통 화폐이다.","answer":["currency"],"hint":"'화폐'"}]},
    {"id":"w01780","w":"disability","pos":["n"],"ph":"/ˌdɪsəˈbɪlɪti/","cefr":"B1","kr":["장애","무능력"],"ex":[{"en":"He lives with a physical disability.","ko":"그는 신체 장애를 가지고 살아간다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+어빌리티(ability,능력)' → 능력이 없음","story":"dis(부정)+ability(능력) → 능력의 부재 = disability(장애)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ability","ko":"능력","reason":"disability의 대표 반의어"},{"w":"learning","ko":"학습","reason":"'학습 장애(learning disability)'로 결합"},{"w":"physical","ko":"신체적인","reason":"'신체 장애(physical disability)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"몸이나 정신 기능이 제한된 상태.","whenToUse":"신체·학습 관련 어려움을 말할 때."},"krDetail":[{"ko":"장애","explain":"몸이나 마음의 일부가 제 기능을 하지 못하는 상태"},{"ko":"무능력","explain":"어떤 일을 잘 해낼 힘이 없는 상태"}],"usageExamples":[{"en":"The building has ramps for people with a disability.","ko":"그 건물에는 장애가 있는 사람들을 위한 경사로가 있다."},{"en":"She overcame her disability and became a champion.","ko":"그녀는 자신의 장애를 극복하고 챔피언이 되었다."}],"grammarNote":"disability는 셀 수 있는 명사(specific 장애: a learning disability)와 셀 수 없는 명사(장애 전반: 조건, 상태) 둘 다로 쓸 수 있다. people with disabilities가 정치적으로 올바른 표현이며 disabled people보다 선호된다.","grammarQuiz":[{"sentence":"Many students _____ learning disabilities need extra support in school.","ko":"많은 학습 장애가 있는 학생들은 학교에서 추가적인 지원을 필요로 한다.","answer":["with"],"hint":"with + 명사(~을 가진)"},{"sentence":"The new law protects the rights of people _____ disabilities in the workplace.","ko":"새 법안은 직장에서 장애인들의 권리를 보호한다.","answer":["with"],"hint":"people with disabilities"}]},
    {"id":"w01588","w":"debate","pos":["n","v"],"ph":"/dɪˈbeɪt/","cefr":"B1","kr":["토론","논쟁하다"],"ex":[{"en":"They had a heated debate.","ko":"그들은 열띤 토론을 벌였다."}],"mnemonic":{"soundHint":"'디베이트' 외래어 → 대회에서 흔한 토론 용어","story":"디베이트 대회 = 토론 대회, 열띤 논쟁을 벌이다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"public","ko":"공개적인","reason":"public debate 콜로케이션"},{"w":"discussion","ko":"토의","reason":"debate의 동의어"},{"w":"argue","ko":"논쟁하다","reason":"debate의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"찬반 의견을 주고받는 토론.","whenToUse":"공식적인 자리에서 논쟁할 때."},"krDetail":[{"ko":"토론","explain":"여러 사람이 의견을 주고받는 일"},{"ko":"논쟁하다","explain":"서로 다른 의견을 내며 다투다"}],"usageExamples":[{"en":"The two teams debate the new policy in front of the audience.","ko":"두 팀이 관객 앞에서 새 정책을 토론한다."},{"en":"The new policy was debated in front of the large audience.","ko":"새 정책이 많은 관객 앞에서 토론되었다."}],"grammarNote":"debate는 명사·타동사 모두 가능해요. debate about/on+주제 형태도 자주 씁니다. 명사 뒤에는 debate over/on이 잘 나옵니다.","grammarQuiz":[{"sentence":"There has been a heated debate _____ climate change for many years.","ko":"여러 해 동안 기후변화를 두고 열띤 논쟁이 있어 왔다.","answer":["about","on","over"],"hint":"전치사"},{"sentence":"The question is still open _____ debate among many experts.","ko":"그 문제는 많은 전문가들 사이에서 여전히 토론의 여지가 있다.","answer":["to"],"hint":"관용구"}]},
    {"id":"w01466","w":"crew","pos":["n"],"ph":"/kruː/","cefr":"B1","kr":["승무원","팀"],"ex":[{"en":"The crew boarded the plane.","ko":"승무원들이 비행기에 탑승했다."}],"mnemonic":{"soundHint":"'크루' → 촬영 '크루(crew)', 힙합 '크루' 그대로 팀","story":"힙합·촬영 '크루' = 함께 일하는 팀·승무원","hintConfidence":3},"pairs":{"buddyWords":[{"w":"team","ko":"팀","reason":"crew의 대표 동의어"},{"w":"flight","ko":"비행","reason":"flight crew 콜로케이션"},{"w":"film","ko":"영화","reason":"film crew 콜로케이션"}],"collocBest":[{"en":"film crew","ko":"영화 촬영팀"},{"en":"flight crew","ko":"비행 승무원"}]},"nuance":{"koSimple":"함께 일하는 승무원·촬영 팀.","whenToUse":"배·비행기·영화 팀을 가리킬 때."},"krDetail":[{"ko":"승무원","explain":"배·비행기·기차에서 일하는 사람"},{"ko":"팀","explain":"함께 일하는 사람들의 무리"}],"usageExamples":[{"en":"The cabin crew served drinks to passengers.","ko":"객실 승무원들이 승객들에게 음료를 제공했다."},{"en":"A film crew was shooting near our school.","ko":"촬영 팀이 우리 학교 근처에서 촬영하고 있었다."}],"grammarNote":"crew는 집합명사로 단수 형태이지만 여러 사람을 의미. 미국식은 단수 취급, 영국식은 문맥에 따라 복수 취급 가능. 개별 구성원은 crew member라고 표현.","grammarQuiz":[{"sentence":"_____ (see) the crew boarding, the passengers followed.","ko":"승무원들이 탑승하는 것을 보고, 승객들이 뒤따랐다.","answer":"Seeing","hint":"분사구문 현재분사"}]},
    {"id":"w01738","w":"diameter","pos":["n"],"ph":"/daɪˈæmɪtər/","cefr":"B1","kr":["지름","직경"],"ex":[{"en":"The circle has a diameter of 10 cm.","ko":"원의 지름은 10cm이다."}],"mnemonic":{"soundHint":"'다이아(dia-,가로질러)+미터(meter,측정)' → 가로지르는 길이","story":"dia(가로질러)+meter(측정) → 원을 가로지르는 길이 = diameter(지름)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"measure","ko":"측정하다","reason":"'지름을 측정하다(measure the diameter)'로 결합"},{"w":"circle","ko":"원","reason":"원의 지름을 나타낼 때 함께 쓰임"},{"w":"radius","ko":"반지름","reason":"지름과 반지름은 수학에서 짝으로 학습"}],"collocBest":[]},"nuance":{"koSimple":"원 한가운데를 가로지르는 길이.","whenToUse":"수학·과학에서 원의 크기를 잴 때."},"krDetail":[{"ko":"지름","explain":"동그라미의 한 점에서 반대쪽 점까지 곧게 그은 선의 길이"},{"ko":"직경","explain":"원의 한가운데를 지나 양 끝을 이은 선의 길이"}],"usageExamples":[{"en":"The pizza has a diameter of about thirty centimeters.","ko":"그 피자는 지름이 약 30센티미터이다."},{"en":"Measure the diameter of the pipe before you cut it.","ko":"자르기 전에 그 관의 직경을 재라."}],"grammarNote":"diameter는 in diameter의 형태로 '지름이 ~인'을 나타낸다. The pond is 5 meters in diameter(그 연못은 지름이 5m이다). radius(반지름)와 짝지어 외우자.","grammarQuiz":[{"sentence":"The ancient tree measured about three meters _____ diameter at the base.","ko":"그 고목은 밑동에서 지름이 약 3미터로 측정되었다.","answer":["in"],"hint":"숫자 + in diameter"},{"sentence":"Scientists carefully measured the _____ of the crater from space.","ko":"과학자들은 우주에서 그 분화구의 지름을 신중하게 측정했다.","answer":["diameter"],"hint":"measure the diameter"}]},
    {"id":"w01623","w":"defend","pos":["v"],"ph":"/dɪˈfend/","cefr":"B1","kr":["방어하다","변호하다"],"ex":[{"en":"She defended her position well.","ko":"그녀는 자신의 입장을 잘 변호했다."}],"mnemonic":{"soundHint":"'디펜스(defense,수비)' → 축구·농구의 디펜스","story":"축구 경기 '디펜스!' 외침 → defense(방어)의 동사 defend(방어하다)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"against","ko":"~에 맞서","reason":"defend against 콜로케이션"},{"w":"protect","ko":"보호하다","reason":"defend의 동의어"},{"w":"attack","ko":"공격하다","reason":"defend의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"공격에서 지키거나 옹호하다.","whenToUse":"적을 막거나 자기 의견을 변호할 때."},"krDetail":[{"ko":"방어하다","explain":"공격을 막다"},{"ko":"변호하다","explain":"말로 편들어 주다"}],"usageExamples":[{"en":"The soldiers defend their small village from any outside attack.","ko":"병사들은 어떤 외부 공격으로부터도 그들의 작은 마을을 지킨다."},{"en":"Their small village is defended from any outside attack by the soldiers.","ko":"그들의 작은 마을은 병사들에 의해 어떤 외부 공격으로부터도 지켜진다."}],"grammarNote":"defend A against/from B는 'B로부터 A를 방어하다'라는 뜻이에요. defend oneself는 '스스로를 지키다/변호하다'로 재귀대명사가 붙습니다.","grammarQuiz":[{"sentence":"The lawyer will defend his client _____ the serious charges tomorrow.","ko":"그 변호사는 내일 심각한 혐의로부터 자신의 의뢰인을 변호할 것이다.","answer":["against","from"],"hint":"전치사"},{"sentence":"You have every right to defend _____ when someone attacks you.","ko":"누가 너를 공격할 때 스스로를 지킬 권리는 얼마든지 있다.","answer":["yourself"],"hint":"재귀대명사"}]},
    {"id":"w01501","w":"cube","pos":["n"],"ph":"/kjuːb/","cefr":"B1","kr":["정육면체","큐브","세제곱"],"ex":[{"en":"The child stacked colorful cubes to build a tower.","ko":"아이는 탑을 쌓기 위해 형형색색의 큐브를 쌓았다."}],"mnemonic":{"soundHint":"큐브","story":"'큐브'는 정육면체를 뜻하는 외래어 (루빅스 큐브).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ice","ko":"얼음","reason":"ice cube 콜로케이션"},{"w":"block","ko":"덩어리","reason":"cube의 동의어"},{"w":"square","ko":"정사각형","reason":"cube의 면 형태"}],"collocBest":[{"en":"ice cube","ko":"얼음 조각"},{"en":"cube root","ko":"세제곱근"}]},"nuance":{"koSimple":"여섯 면이 모두 네모난 상자 모양.","whenToUse":"주사위·얼음·수학 세제곱을 말할 때."},"krDetail":[{"ko":"정육면체","explain":"여섯 면이 다 정사각형인 상자 모양"},{"ko":"세제곱","explain":"같은 수를 세 번 곱한 값"}],"usageExamples":[{"en":"He dropped an ice cube into his drink.","ko":"그는 음료에 얼음 한 조각을 넣었다."},{"en":"The cube of two is eight.","ko":"2의 세제곱은 8이다."}],"grammarNote":"cube는 셀 수 있는 명사예요. 수학에서 '세제곱근'은 cube root, '~의 세제곱'은 the cube of ~로 표현합니다.","grammarQuiz":[{"sentence":"Please drop three ice _____ into my glass of water.","ko":"제 물잔에 얼음 세 조각을 넣어 주세요.","answer":["cubes"],"hint":"복수형"},{"sentence":"The cube _____ 27 is 3, which is a basic math fact.","ko":"27의 세제곱근은 3이며, 이는 기본 수학 사실이다.","answer":["root of"],"hint":"세제곱근"}]},
    {"id":"w01711","w":"destruction","pos":["n"],"ph":"/dɪˈstrʌkʃən/","cefr":"B1","kr":["파괴","멸망"],"ex":[{"en":"The hurricane caused massive destruction.","ko":"허리케인은 엄청난 파괴를 일으켰다."}],"mnemonic":{"soundHint":"'디스트로이(destroy,파괴하다)+ction' → 파괴의 명사","story":"destroy(파괴하다)의 명사형 → destruction(파괴)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"construction","ko":"건설","reason":"destruction의 대표 반의어"},{"w":"mass","ko":"대량의","reason":"'대량 파괴(mass destruction)'로 결합"},{"w":"cause","ko":"야기하다","reason":"'파괴를 야기하다(cause destruction)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"완전히 부서지고 무너뜨림","whenToUse":"큰 규모로 파괴된 상태를 말할 때"},"krDetail":[{"ko":"파괴","explain":"부수거나 무너뜨려 못 쓰게 만드는 일"},{"ko":"멸망","explain":"완전히 없어져 자취를 감춤"}],"usageExamples":[{"en":"The war caused the destruction of many old buildings.","ko":"그 전쟁은 많은 오래된 건물의 파괴를 일으켰다."},{"en":"Pollution leads to the destruction of natural habitats.","ko":"오염은 자연 서식지의 파괴로 이어진다."}],"grammarNote":"destruction은 destroy(파괴하다)의 명사형. 뒤에 of를 써서 '~의 파괴'로 쓰고(destruction of the forest), '~에 의한'은 by를 쓴다(destruction by fire). 관련 형용사 destructive(파괴적인)도 함께 외우자.","grammarQuiz":[{"sentence":"The _____ of the rainforest threatens countless species around the world.","ko":"열대우림의 파괴는 전 세계 수많은 종들을 위협한다.","answer":["destruction"],"hint":"destruction of ~의 파괴"},{"sentence":"The earthquake caused massive _____ across the entire coastal region.","ko":"그 지진은 해안 지역 전체에 걸쳐 엄청난 파괴를 일으켰다.","answer":["destruction"],"hint":"cause + 명사"}]},
    {"id":"w01363","w":"convince","pos":["v"],"ph":"/kənˈvɪns/","cefr":"B1","kr":["납득시키다","확신시키다"],"ex":[{"en":"He convinced her to stay.","ko":"그는 그녀를 머물도록 설득했다."}],"mnemonic":{"soundHint":null,"story":"con(함께)+vince(정복하다) → 상대의 마음을 함께 정복해 납득시키다","hintConfidence":0},"pairs":{"buddyWords":[{"w":"persuade","ko":"설득하다","reason":"convince의 대표 동의어"},{"w":"convinced","ko":"확신하는","reason":"형용사형 파생어"},{"w":"dissuade","ko":"단념시키다","reason":"convince의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"말로 상대의 마음을 그렇다고 믿게 하다.","whenToUse":"설득 끝에 상대가 수긍했을 때."},"krDetail":[{"ko":"납득시키다","explain":"잘 알아듣도록 하여 이해하게 만들다"},{"ko":"확신시키다","explain":"굳게 믿게 만들다"}],"usageExamples":[{"en":"I convinced my parents to buy a dog.","ko":"나는 부모님을 설득해 개를 사게 했다."},{"en":"The evidence convinced the jury of his guilt.","ko":"그 증거가 배심원단에게 그의 유죄를 확신시켰다."}],"grammarNote":"convince는 항상 사람 목적어를 취함. 'convince + 사람 + of 명사' 또는 'convince + 사람 + that절' 또는 'convince + 사람 + to부정사' 형태로 씀.","grammarQuiz":[{"sentence":"She finally _____ her parents _____ let her study abroad next year.","ko":"그녀는 마침내 부모님이 내년에 자신을 유학 보내주도록 설득했다.","answer":["convinced","to"],"hint":"convince + 사람 + to부정사 구조"}]},
    {"id":"w01700","w":"desire","pos":["n","v"],"ph":"/dɪˈzaɪər/","cefr":"B1","kr":["욕망","바라다"],"ex":[{"en":"He has a strong desire to win.","ko":"그는 이기고 싶은 강한 욕망이 있다."}],"mnemonic":{"soundHint":"'디자이어' → 디자인(design)하고 싶어하는 갈망","story":"무언가를 디자인하고 싶어 안달 = desire(욕망)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"wish","ko":"바라다","reason":"desire의 기본 동의어"},{"w":"strong","ko":"강한","reason":"'강한 욕망(strong desire)'로 결합"},{"w":"fulfill","ko":"충족시키다","reason":"'욕망을 이루다'라는 시나리오에서 함께 쓰임"}],"collocBest":[]},"nuance":{"koSimple":"마음속에 강하게 끓어오르는 바람.","whenToUse":"소망·야망·욕구를 진하게 표현할 때."},"krDetail":[{"ko":"욕망","explain":"무엇을 몹시 갖고 싶어 하는 마음"},{"ko":"바라다","explain":"이루어지기를 마음속으로 원하다"}],"usageExamples":[{"en":"The young musician desired fame more than anything else in life.","ko":"그 젊은 음악가는 인생에서 그 무엇보다 명성을 갈망했다."},{"en":"Fame was desired by the young musician more than anything else in life.","ko":"명성은 그 젊은 음악가에 의해 그 무엇보다 갈망되었다."}],"grammarNote":"desire는 격식체 동사로 뒤에 to부정사(desire to know)나 that절(should + 원형)을 쓴다. 명사로는 desire for(~에 대한 욕망), desire to부정사(~하고자 하는 욕망) 형태가 자주 나온다.","grammarQuiz":[{"sentence":"He has a strong desire _____ _____ the world someday.","ko":"그는 언젠가 세계를 여행하고 싶은 강한 욕망을 가지고 있다.","answer":["to","travel"],"hint":"desire + to부정사"},{"sentence":"Everyone has a natural desire _____ love and acceptance from others.","ko":"누구나 다른 사람들로부터의 사랑과 인정에 대한 자연스러운 욕망을 지닌다.","answer":["for"],"hint":"desire for ~에 대한 욕망"}]},
    {"id":"w01705","w":"despite","pos":["prep"],"ph":"/dɪˈspaɪt/","cefr":"B1","kr":["~에도 불구하고"],"ex":[{"en":"She won despite the cold weather.","ko":"그녀는 추운 날씨에도 불구하고 이겼다."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+파이트(fight,싸움)' → 반대에도 불구하고","story":"dis(반대)+pite → 반대에도 불구하고 = despite","hintConfidence":2},"pairs":{"buddyWords":[{"w":"although","ko":"비록 ~일지라도","reason":"despite와 유사 의미의 접속사로 함께 학습"},{"w":"fact","ko":"사실","reason":"'despite the fact that'로 흔히 결합"},{"w":"difficulty","ko":"어려움","reason":"'어려움에도 불구하고'라는 맥락에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"~이 있음에도 그와 반대로.","whenToUse":"뒤에 명사·동명사가 올 때."},"krDetail":[{"ko":"~에도 불구하고","explain":"어떤 상황이나 사실이 있어도 상관없이"}],"usageExamples":[{"en":"Despite the rain, they continued the football match.","ko":"비에도 불구하고 그들은 축구 경기를 계속했다."},{"en":"She smiled despite feeling very tired.","ko":"그녀는 매우 피곤했음에도 불구하고 미소 지었다."}],"grammarNote":"despite는 전치사라서 뒤에 명사(구)/동명사만 오고 절이 오면 안 된다. despite the rain(○) / despite it rained(×). 절을 쓰려면 although/though를 사용하고, despite the fact that + 절 형태도 가능하다.","grammarQuiz":[{"sentence":"_____ heavy rain, the outdoor concert continued until midnight last Saturday.","ko":"폭우에도 불구하고, 야외 콘서트는 지난 토요일 자정까지 계속되었다.","answer":["Despite"],"hint":"despite + 명사"},{"sentence":"She passed the exam despite _____ studied only two hours the night before.","ko":"그녀는 전날 밤 단 두 시간만 공부했음에도 불구하고 시험에 합격했다.","answer":["having"],"hint":"despite + 동명사(having p.p.)"}]},
    {"id":"w01670","w":"departure","pos":["n"],"ph":"/dɪˈpɑːrtʃər/","cefr":"B1","kr":["출발","떠남"],"ex":[{"en":"Her departure was sudden.","ko":"그녀의 출발은 갑작스러웠다."}],"mnemonic":{"soundHint":"'depart(출발하다)+ure' → 출발의 명사","story":"공항 안내판의 DEPARTURE = 출발","hintConfidence":3},"pairs":{"buddyWords":[{"w":"arrival","ko":"도착","reason":"departure의 대표 반의어(공항 안내판 대비)"},{"w":"gate","ko":"탑승구","reason":"'출발 게이트(departure gate)'로 결합"},{"w":"time","ko":"시간","reason":"'출발 시간(departure time)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"떠나거나 출발하는 그 순간·행위.","whenToUse":"교통편·행사 시작 시점을 말할 때."},"krDetail":[{"ko":"출발","explain":"어떤 곳에서 다른 곳으로 나아가기 시작함"},{"ko":"떠남","explain":"있던 자리를 벗어나 다른 곳으로 감"}],"usageExamples":[{"en":"The departure of the train was delayed by an hour.","ko":"기차의 출발이 한 시간 지연되었다."},{"en":"Check the departure time on your ticket.","ko":"표에 적힌 출발 시각을 확인하세요."}],"grammarNote":"departure는 뒤에 전치사 from을 써서 '~로부터의 출발'을 나타낸다. departure from Seoul, departure time, on departure(출발 시)의 형태로 자주 쓰인다.","grammarQuiz":[{"sentence":"Please check the _____ time before you leave for the airport.","ko":"공항으로 떠나기 전에 출발 시간을 확인하세요.","answer":["departure"],"hint":"명사 + 명사(복합명사)"},{"sentence":"His sudden _____ from the team shocked all his loyal fans.","ko":"팀에서의 그의 갑작스러운 탈퇴는 그의 모든 충성스러운 팬들을 놀라게 했다.","answer":["departure"],"hint":"departure from ~"}]},
    {"id":"w01424","w":"county","pos":["n"],"ph":"/ˈkaʊnti/","cefr":"B1","kr":["군","카운티"],"ex":[{"en":"She lives in the county.","ko":"그녀는 그 군에 살고 있다."}],"mnemonic":{"soundHint":"'카운티' → 미국 지역 단위 '카운티' 그대로","story":"미국 뉴스에 자주 나오는 '오렌지 카운티'의 카운티 = county","hintConfidence":3},"pairs":{"buddyWords":[{"w":"district","ko":"구역","reason":"county의 대표 동의어"},{"w":"region","ko":"지역","reason":"county의 동의어"},{"w":"fair","ko":"박람회","reason":"county fair 콜로케이션"}],"collocBest":[{"en":"county seat","ko":"군청 소재지"},{"en":"county fair","ko":"카운티 박람회"}]},"nuance":{"koSimple":"미국·영국의 지방 행정 구역.","whenToUse":"지방 단위 지역을 말할 때. 나라마다 크기 다름."},"krDetail":[{"ko":"군","explain":"도(道)와 읍·면 사이의 지방 행정 구역"},{"ko":"카운티","explain":"영국이나 미국의 행정 구역 단위"}],"usageExamples":[{"en":"This county has many small farms.","ko":"이 군에는 작은 농장이 많다."},{"en":"The festival is held across the whole county.","ko":"그 축제는 카운티 전역에서 열린다."}],"grammarNote":"county(카운티/군)과 country(나라/시골)는 철자와 발음이 비슷해 혼동 주의. county는 나라 안의 행정 구역, country는 국가나 시골. 셀 수 있는 명사.","grammarQuiz":[{"sentence":"This is the county _____ my grandparents live.","ko":"이곳이 내 조부모님이 사시는 군이다.","answer":"where","hint":"관계부사 where"}]},
    {"id":"w01794","w":"discourage","pos":["v"],"ph":"/dɪˈskɜːrɪdʒ/","cefr":"B1","kr":["낙담시키다","막다"],"ex":[{"en":"Don't let failure discourage you.","ko":"실패가 너를 낙담시키지 않도록 해."}],"mnemonic":{"soundHint":"'디스(dis-,반대)+커리지(courage,용기)' → 용기를 꺾다","story":"dis(반대)+courage(용기) → 용기를 꺾어 낙담시키다 = discourage","hintConfidence":3},"pairs":{"buddyWords":[{"w":"encourage","ko":"격려하다","reason":"discourage의 대표 반의어"},{"w":"strongly","ko":"강하게","reason":"'강하게 만류하다(strongly discourage)'로 결합"},{"w":"student","ko":"학생","reason":"'학생을 낙담시키다' 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"의욕을 꺾어 못 하게 만들다.","whenToUse":"충고·경고로 하지 말라고 할 때."},"krDetail":[{"ko":"낙담시키다","explain":"기가 죽어 마음이 꺾이게 만들다"},{"ko":"막다","explain":"무언가를 하지 않도록 말리다"}],"usageExamples":[{"en":"The strict rules discouraged many students from joining the debate club.","ko":"엄격한 규칙들은 많은 학생들이 토론 동아리에 가입하는 것을 막았다."},{"en":"Many students were discouraged from joining the debate club by the strict rules.","ko":"많은 학생들은 엄격한 규칙 때문에 토론 동아리에 가입하지 못하게 되었다."}],"grammarNote":"discourage는 discourage + 목적어 + from + 동명사(~가 …하지 못하게 하다) 구조가 핵심이다. prevent, stop, keep 등도 같은 from + ~ing 구문을 쓴다. 반의어 encourage는 to부정사를 쓰는 것과 대조된다.","grammarQuiz":[{"sentence":"Parents often discourage their children _____ _____ too many video games.","ko":"부모들은 종종 자녀들이 너무 많은 비디오 게임을 하지 못하게 한다.","answer":["from","playing"],"hint":"discourage 사람 from ~ing"},{"sentence":"Don't be _____ by a single failure — try again with a fresh mind.","ko":"한 번의 실패로 낙담하지 마라. 새로운 마음으로 다시 시도해 봐라.","answer":["discouraged"],"hint":"감정 수동태 be discouraged"}]},
    {"id":"w01598","w":"decent","pos":["adj"],"ph":"/ˈdiːsnt/","cefr":"B1","kr":["괜찮은","예의 바른"],"ex":[{"en":"He earned a decent salary.","ko":"그는 괜찮은 급여를 받았다."}],"mnemonic":{"soundHint":"'디센트' → 이 정도면 '뒷선트'(뒤에서 봐도 괜찮은)","story":"디센트! 이 정도면 '괜찮네' 하는 느낌","hintConfidence":1},"pairs":{"buddyWords":[{"w":"job","ko":"직업","reason":"decent job 콜로케이션"},{"w":"acceptable","ko":"받아들일 만한","reason":"decent의 동의어"},{"w":"proper","ko":"적절한","reason":"decent의 동의어"}],"collocBest":[]},"nuance":{"koSimple":"기대만큼은 아니어도 꽤 괜찮은.","whenToUse":"직업·행동·품행이 무난할 때."},"krDetail":[{"ko":"괜찮은","explain":"썩 훌륭하지는 않아도 만족할 만한"},{"ko":"예의 바른","explain":"행동이 반듯한"}],"usageExamples":[{"en":"We finally found a decent hotel near the station.","ko":"우리는 마침내 역 근처에서 괜찮은 호텔을 찾았다."},{"en":"He is a decent man who always helps others.","ko":"그는 늘 남을 돕는 예의 바른 사람이다."}],"grammarNote":"decent는 형용사예요. '괜찮은 정도'라는 은근한 칭찬 뉘앙스가 있어서, a decent job은 '아주 좋진 않아도 나쁘지 않은 직장'을 뜻해요.","grammarQuiz":[{"sentence":"After graduation, he finally found a _____ job with good pay.","ko":"졸업 후 그는 마침내 급여가 괜찮은 직장을 구했다.","answer":["decent","good"],"hint":"형용사"},{"sentence":"She is a very _____ person who always helps her neighbors.","ko":"그녀는 늘 이웃을 돕는 아주 예의 바른 사람이다.","answer":["decent","kind","nice"],"hint":"형용사"}]},
    {"id":"w01468","w":"crime","pos":["n"],"ph":"/kraɪm/","cefr":"B1","kr":["범죄","죄"],"ex":[{"en":"Crime rates have fallen recently.","ko":"최근 범죄율이 감소했다."}],"mnemonic":{"soundHint":"'크라임씬(crime scene, 범죄현장)' 외래어","story":"CSI 드라마의 크라임씬(crime scene) = 범죄 현장","hintConfidence":3},"pairs":{"buddyWords":[{"w":"criminal","ko":"범죄자","reason":"파생 명사·형용사"},{"w":"offense","ko":"범죄, 위반","reason":"crime의 대표 동의어"},{"w":"commit","ko":"저지르다","reason":"commit a crime 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"법을 어긴 나쁜 짓.","whenToUse":"행위 자체를 가리킴. commit a crime."},"krDetail":[{"ko":"범죄","explain":"법을 어겨 저지른 나쁜 일"},{"ko":"죄","explain":"잘못이나 나쁜 행동"}],"usageExamples":[{"en":"Stealing is a serious crime.","ko":"도둑질은 심각한 범죄이다."},{"en":"The police are working to reduce crime.","ko":"경찰은 범죄를 줄이려고 애쓰고 있다."}],"grammarNote":"crime은 뜻에 따라 가산·불가산: '범죄 행위 하나'는 가산(commit a crime), '범죄 전반'은 불가산(fight crime). 'commit a crime'(범죄를 저지르다) 관용 표현.","grammarQuiz":[{"sentence":"The police are working hard _____ _____ _____ in the neighborhood these days.","ko":"경찰은 요즘 그 동네의 범죄를 줄이기 위해 열심히 일하고 있다.","answer":["to","reduce","crime"],"hint":"to부정사 + reduce + 불가산명사 crime(범죄 전반)"}]},
    {"id":"w01351","w":"convenient","pos":["adj"],"ph":"/kənˈviːniənt/","cefr":"B1","kr":["편리한","간편한"],"ex":[{"en":"The location is very convenient.","ko":"위치가 매우 편리하다."}],"mnemonic":{"soundHint":"'컨비니언트' → '편의점(convenience store)'의 컨비니와 동일 어원","story":"편의점(convenience)이 편리한 것처럼 convenient = 편리한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"handy","ko":"편리한","reason":"convenient의 대표 동의어"},{"w":"convenience","ko":"편리함, 편의","reason":"명사형 파생어"},{"w":"inconvenient","ko":"불편한","reason":"in-접두사로 형성된 반의어"}],"collocBest":[{"en":"convenient location","ko":"편리한 위치"},{"en":"convenient time","ko":"편한 시간"}]},"nuance":{"koSimple":"쓰거나 가기에 손쉽고 부담이 없는.","whenToUse":"시간·장소·물건이 편할 때 씀."},"krDetail":[{"ko":"편리한","explain":"쓰기에 쉽고 편한"},{"ko":"간편한","explain":"간단하고 편한"}],"usageExamples":[{"en":"Online shopping is very convenient for busy people.","ko":"온라인 쇼핑은 바쁜 사람들에게 매우 편리하다."},{"en":"Let me know a convenient time to meet.","ko":"만나기 편한 시간을 알려 주세요."}],"grammarNote":"convenient는 사람을 주어로 쓸 수 없음. 'I am convenient'는 틀린 표현이며, 'It is convenient for me'가 옳음. 가주어 It + be동사 + convenient + for 사람 + to부정사 구조.","grammarQuiz":[{"sentence":"_____ _____ _____ for you _____ meet me at three o'clock tomorrow?","ko":"내일 3시에 저를 만나는 게 당신에게 편리한가요?","answer":["Is","it","convenient","to"],"hint":"가주어 It + be + convenient + for 사람 + to부정사 의문문"}]},
    {"id":"w01554","w":"damp","pos":["adj"],"ph":"/dæmp/","cefr":"B1","kr":["축축한","습한"],"ex":[{"en":"The towel was still damp.","ko":"수건이 아직 축축했다."}],"mnemonic":{"soundHint":"'댐(dam,수문)+프' → 댐 근처는 축축","story":"댐(dam) 근처는 물기가 많아 damp(축축한)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"weather","ko":"날씨","reason":"damp weather 콜로케이션"},{"w":"wet","ko":"젖은","reason":"damp의 동의어"},{"w":"dry","ko":"건조한","reason":"damp의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"젖은 듯 눅눅한.","whenToUse":"빨래·지하실이 축축할 때."},"krDetail":[{"ko":"축축한","explain":"물기가 살짝 있는"},{"ko":"습한","explain":"공기 중에 물기가 많은"}],"usageExamples":[{"en":"Wipe the table with a damp cloth.","ko":"축축한 천으로 탁자를 닦아라."},{"en":"The basement felt cold and damp.","ko":"그 지하실은 춥고 습하게 느껴졌다."}],"grammarNote":"damp는 wet보다 약한 느낌으로 '살짝 젖은'을 뜻해요. moist는 '촉촉한'으로 대개 좋은 느낌인 반면, damp는 불쾌한 느낌으로 자주 씁니다.","grammarQuiz":[{"sentence":"The basement always feels cold and _____ during the rainy season.","ko":"지하실은 장마철에 늘 춥고 축축하게 느껴진다.","answer":["damp"],"hint":"형용사"},{"sentence":"Wipe the desk with a slightly _____ cloth to remove the dust.","ko":"먼지를 없애려면 살짝 축축한 천으로 책상을 닦아라.","answer":["damp","wet","moist"],"hint":"형용사"}]},
    {"id":"w01522","w":"curious","pos":["adj"],"ph":"/ˈkjʊəriəs/","cefr":"B1","kr":["호기심 많은","이상한"],"ex":[{"en":"Children are naturally curious about everything.","ko":"아이들은 모든 것에 자연스럽게 호기심이 많다."}],"mnemonic":{"soundHint":"'큐리(궁금)+어스' → 궁금해 하는","story":"큐리~ 하고 갸웃거리며 궁금해하면 curious(호기심 많은)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"about","ko":"~에 대해","reason":"curious about 콜로케이션"},{"w":"inquisitive","ko":"탐구적인","reason":"curious의 동의어"},{"w":"curiosity","ko":"호기심","reason":"curious의 명사형"}],"collocBest":[]},"nuance":{"koSimple":"궁금한 게 많은, 또는 이상야릇한.","whenToUse":"호기심 많은 사람·특이한 일에 씀."},"krDetail":[{"ko":"호기심 많은","explain":"이것저것 알고 싶어 하는"},{"ko":"이상한","explain":"평소와 달라 눈길을 끄는"}],"usageExamples":[{"en":"I am curious about how planes fly.","ko":"나는 비행기가 어떻게 나는지 궁금하다."},{"en":"We heard a curious noise from the attic.","ko":"우리는 다락방에서 이상한 소리를 들었다."}],"grammarNote":"'~에 대해 호기심이 있다'는 be curious about+명사, '~인지 궁금하다'는 be curious to+동사원형 또는 be curious wh-절로 씁니다.","grammarQuiz":[{"sentence":"Many students are curious _____ how the human brain works.","ko":"많은 학생들이 인간의 뇌가 어떻게 작동하는지 궁금해한다.","answer":["about"],"hint":"be curious ___"},{"sentence":"I was curious _____ know what happened at the party last night.","ko":"나는 어젯밤 파티에서 무슨 일이 있었는지 알고 싶었다.","answer":["to"],"hint":"be curious ___ 동사원형"}]},
    {"id":"w01684","w":"depth","pos":["n"],"ph":"/depθ/","cefr":"B1","kr":["깊이","심오함"],"ex":[{"en":"The depth of the sea is enormous.","ko":"바다의 깊이는 어마어마하다."}],"mnemonic":{"soundHint":"'딥(deep,깊은)+th' → 깊이의 명사","story":"deep(깊은)의 명사형 → depth(깊이)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"deep","ko":"깊은","reason":"depth의 형용사 짝으로 함께 학습"},{"w":"knowledge","ko":"지식","reason":"'지식의 깊이(depth of knowledge)'로 결합"},{"w":"ocean","ko":"바다","reason":"'바다의 깊이'처럼 물리적 깊이 표현에 자주 쓰임"}],"collocBest":[]},"nuance":{"koSimple":"위에서 아래까지 얼마나 깊은지.","whenToUse":"물·구멍·지식·감정의 깊이에 두루."},"krDetail":[{"ko":"깊이","explain":"위에서 아래까지의 거리, 또는 생각이 얼마나 깊은지"},{"ko":"심오함","explain":"겉으로 드러나지 않는 뜻이 매우 깊고 그윽함"}],"usageExamples":[{"en":"The divers measured the depth of the lake.","ko":"잠수부들은 그 호수의 깊이를 측정했다."},{"en":"She studied the topic in great depth.","ko":"그녀는 그 주제를 매우 깊이 있게 공부했다."}],"grammarNote":"형용사 deep에서 만들어진 명사가 depth이고, 부사는 deeply이다. in depth는 '심층적으로'라는 부사구, in-depth는 '심층의'라는 형용사로 쓰임에 주의.","grammarQuiz":[{"sentence":"We need to study this problem _____ _____ before making a decision.","ko":"우리는 결정을 내리기 전에 이 문제를 심층적으로 연구해야 한다.","answer":["in","depth"],"hint":"in depth 심층적으로"},{"sentence":"The pool is two meters _____ _____ the deepest point.","ko":"그 수영장은 가장 깊은 지점의 깊이가 2미터이다.","answer":["in","depth"],"hint":"숫자 + in depth"}]},
    {"id":"w01638","w":"delay","pos":["v","n"],"ph":"/dɪˈleɪ/","cefr":"B1","kr":["지연시키다","지연"],"ex":[{"en":"The flight was delayed an hour.","ko":"비행기가 한 시간 지연되었다."}],"mnemonic":{"soundHint":"'딜레이' 외래어 → 게임·공연 딜레이(지연)","story":"인터넷 딜레이(delay) = 신호 지연","hintConfidence":3},"pairs":{"buddyWords":[{"w":"without","ko":"~없이","reason":"without delay 콜로케이션"},{"w":"postpone","ko":"연기하다","reason":"delay의 동의어"},{"w":"flight","ko":"항공편","reason":"flight delay 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"예정보다 늦어지거나 늦추는 것.","whenToUse":"교통편·계획·업무 지연에 두루."},"krDetail":[{"ko":"지연시키다","explain":"예정보다 늦추다"},{"ko":"지연","explain":"늦어지는 일"}],"usageExamples":[{"en":"Heavy snow delays every morning train on the mountain line.","ko":"폭설이 산악선의 모든 아침 기차를 지연시킨다."},{"en":"Every morning train on the mountain line is delayed by heavy snow.","ko":"산악선의 모든 아침 기차는 폭설로 지연된다."}],"grammarNote":"delay+동명사는 '~하기를 미루다'라는 뜻이에요. delay to 부정사(X)는 틀린 형태이니 주의하세요. without delay는 '지체 없이'라는 관용구입니다.","grammarQuiz":[{"sentence":"Do not delay _____ your homework until the very last minute.","ko":"네 숙제를 마지막 순간까지 미루지 마라.","answer":["doing","starting","finishing"],"hint":"delay + 동명사"},{"sentence":"The company promised to fix the problem _____ any delay.","ko":"회사는 어떤 지체 없이도 그 문제를 해결하겠다고 약속했다.","answer":["without"],"hint":"관용구"}]},
    {"id":"w01694","w":"deserve","pos":["v"],"ph":"/dɪˈzɜːrv/","cefr":"B1","kr":["받을 자격이 있다","~할 만하다"],"ex":[{"en":"You deserve a long rest.","ko":"당신은 긴 휴식을 받을 자격이 있다."}],"mnemonic":{"soundHint":"'디저브' → 대접(디저트) 받을 만하다","story":"디저트(dessert)를 받을 만하다 → deserve(받을 자격 있다)","hintConfidence":1},"pairs":{"buddyWords":[{"w":"earn","ko":"얻다","reason":"deserve의 동의어(자격으로 얻다)"},{"w":"credit","ko":"공로","reason":"'공을 인정받다(deserve credit)'로 결합"},{"w":"reward","ko":"보상","reason":"'보상을 받을 만하다' 맥락에서 자주 함께"}],"collocBest":[]},"nuance":{"koSimple":"그만한 대접을 받아 마땅함.","whenToUse":"보상·처벌이 정당하다고 말할 때."},"krDetail":[{"ko":"받을 자격이 있다","explain":"그만한 대접이나 결과를 받을 만하다"},{"ko":"~할 만하다","explain":"그런 일을 겪거나 얻는 것이 당연하다"}],"usageExamples":[{"en":"After working so hard, you deserve a reward.","ko":"그렇게 열심히 일했으니 너는 보상을 받을 자격이 있다."},{"en":"Such rude behavior deserves to be punished.","ko":"그런 무례한 행동은 벌을 받을 만하다."}],"grammarNote":"deserve는 진행형으로 잘 쓰지 않는 상태동사이고, 뒤에 to부정사(deserve to win) 또는 동명사(deserve winning) 둘 다 취할 수 있다. 수동태 뜻으로 동명사를 쓸 때는 The book deserves reading = deserves to be read.","grammarQuiz":[{"sentence":"After all her hard work, she deserves _____ _____ the championship trophy.","ko":"그녀의 모든 노력 끝에, 그녀는 우승 트로피를 받을 자격이 있다.","answer":["to","win"],"hint":"deserve + to부정사"},{"sentence":"This novel is so brilliant that it truly deserves _____ by everyone.","ko":"이 소설은 매우 훌륭해서 정말로 모든 사람에게 읽힐 만하다.","answer":["reading"],"hint":"deserve + 동명사(수동 의미)"}]},
    {"id":"w01441","w":"crack","pos":["n","v"],"ph":"/kræk/","cefr":"B1","kr":["균열","깨다"],"ex":[{"en":"There is a crack in the wall.","ko":"벽에 균열이 있다."}],"mnemonic":{"soundHint":"'크랙' → 유리·벽이 '크랙!' 소리내며 갈라짐 (의성어)","story":"'크랙!' 소리와 함께 갈라지는 균열 = crack","hintConfidence":3},"pairs":{"buddyWords":[{"w":"split","ko":"쪼개다","reason":"crack의 대표 동의어"},{"w":"break","ko":"깨뜨리다","reason":"crack의 동의어"},{"w":"wall","ko":"벽","reason":"crack in the wall 콜로케이션"}],"collocBest":[{"en":"crack open","ko":"열다"},{"en":"crack in the wall","ko":"벽의 균열"}]},"nuance":{"koSimple":"쫙 갈라진 금이나 그런 소리.","whenToUse":"벽·유리 균열이나 무언가 깨질 때."},"krDetail":[{"ko":"균열","explain":"갈라져서 생긴 틈"},{"ko":"깨다","explain":"단단한 것을 쳐서 조각내다"}],"usageExamples":[{"en":"The chef cracked three eggs into the mixing bowl.","ko":"요리사는 계란 세 개를 볼에 깨서 넣었다."},{"en":"The old wall cracked after the strong earthquake.","ko":"그 오래된 벽은 강한 지진 후에 금이 갔다."}],"grammarNote":"crack은 타동사(무언가를 깨다)와 자동사(금이 가다) 모두 가능. 명사로 쓸 때는 셀 수 있는 명사로 관사와 함께 씀(a crack in the wall).","grammarQuiz":[{"sentence":"The frozen pipe suddenly _____, _____ water all over the basement floor.","ko":"얼어붙은 파이프가 갑자기 갈라져서 지하실 바닥 전체에 물이 뿜어져 나왔다.","answer":["cracked","spraying"],"hint":"자동사 crack의 과거형 + 분사구문(-ing)"}]},
    {"id":"w01582","w":"deal","pos":["n","v"],"ph":"/diːl/","cefr":"B1","kr":["거래","처리하다"],"ex":[{"en":"We made a good deal.","ko":"우리는 좋은 거래를 했다."}],"mnemonic":{"soundHint":"'딜(거래)' 외래어 → '빅딜(big deal)'","story":"빅딜(big deal, 대형 거래)의 그 딜(deal)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"big","ko":"큰","reason":"big deal 콜로케이션"},{"w":"agreement","ko":"합의","reason":"deal의 동의어"},{"w":"handle","ko":"다루다","reason":"deal with = handle"}],"collocBest":[]},"nuance":{"koSimple":"사고팔거나 문제를 처리하다.","whenToUse":"거래·계약이나 deal with 다루기."},"krDetail":[{"ko":"거래","explain":"물건이나 조건을 주고받는 일"},{"ko":"처리하다","explain":"일이나 상황을 다루다"}],"usageExamples":[{"en":"The manager deals customer complaints with great patience every day.","ko":"그 매니저는 매일 큰 인내심으로 고객 불만을 처리한다."},{"en":"Customer complaints are dealt with quickly at this friendly store.","ko":"이 친절한 가게에서는 고객 불만이 신속하게 처리된다."}],"grammarNote":"'~을 다루다/처리하다'는 반드시 deal with+명사로 씁니다. 자동사이므로 목적어 앞에 전치사 with가 꼭 필요해요. 과거·과거분사는 dealt입니다.","grammarQuiz":[{"sentence":"Good managers know how to deal _____ difficult situations calmly.","ko":"훌륭한 관리자는 어려운 상황을 침착하게 다루는 법을 안다.","answer":["with"],"hint":"deal ___ (자동사+전치사)"},{"sentence":"The two companies finally reached a big _____ after long talks.","ko":"두 회사는 긴 협상 끝에 마침내 큰 거래를 성사시켰다.","answer":["deal","agreement"],"hint":"명사"}]},
    {"id":"w01443","w":"craft","pos":["n","v"],"ph":"/kræft/","cefr":"B1","kr":["공예","기술"],"ex":[{"en":"She learned the craft carefully.","ko":"그녀는 공예를 꼼꼼히 배웠다."}],"mnemonic":{"soundHint":"'크래프트' → 게임 '마인크래프트(Minecraft)'의 크래프트","story":"'마인크래프트'에서 아이템을 만드는 crafting = 공예·기술","hintConfidence":3},"pairs":{"buddyWords":[{"w":"skill","ko":"기술","reason":"craft의 대표 동의어"},{"w":"art","ko":"예술","reason":"arts and crafts 세트 표현"},{"w":"handmade","ko":"수제의","reason":"공예 시나리오 연관어"}],"collocBest":[{"en":"craft skills","ko":"공예 기술"},{"en":"arts and crafts","ko":"미술과 공예"}]},"nuance":{"koSimple":"손으로 만드는 정교한 기술·공예.","whenToUse":"수공예·전문 솜씨를 강조할 때."},"krDetail":[{"ko":"공예","explain":"손으로 아름답고 쓸모 있는 물건을 만드는 일"},{"ko":"기술","explain":"무언가를 잘 만들거나 다루는 솜씨"}],"usageExamples":[{"en":"Pottery is a traditional craft in this town.","ko":"도자기 만들기는 이 마을의 전통 공예이다."},{"en":"The writer carefully crafted every sentence.","ko":"그 작가는 모든 문장을 정성껏 만들어 냈다."}],"grammarNote":"craft는 명사와 동사 모두 가능. 동사로 '정성 들여 만들다'라는 뜻. arts and crafts(미술과 공예)는 짝을 이룬 관용 표현. craft가 '배·비행기'를 뜻할 때는 단·복수 형태가 같음(a craft, three craft).","grammarQuiz":[{"sentence":"She _____ (learn) the traditional craft for ten years.","ko":"그녀는 10년 동안 전통 공예를 배워왔다.","answer":"has learned","hint":"현재완료 계속"}]},
    {"id":"w01728","w":"devil","pos":["n"],"ph":"/ˈdevl/","cefr":"B1","kr":["악마"],"ex":[{"en":"In many stories, the devil is a symbol of evil.","ko":"많은 이야기에서 악마는 악의 상징이다."}],"mnemonic":{"soundHint":"'데블(악마)' 외래어 → 나이트 데블","story":"빨간 삼지창 든 '데블(devil)' = 악마","hintConfidence":3},"pairs":{"buddyWords":[{"w":"angel","ko":"천사","reason":"devil의 대표 반의어(선악 대비)"},{"w":"evil","ko":"악한","reason":"'악마는 사악하다'라는 이미지로 함께 쓰임"},{"w":"disguise","ko":"위장","reason":"'위장한 악마(devil in disguise)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"이야기 속 악의 상징적 존재.","whenToUse":"종교·설화·비유적 표현에서."},"krDetail":[{"ko":"악마","explain":"사람을 나쁜 길로 이끄는 상상 속의 나쁜 존재"}],"usageExamples":[{"en":"The old legend describes a devil living in the cave.","ko":"그 오래된 전설은 동굴에 사는 악마를 묘사한다."},{"en":"In the play, the devil tempts the young man.","ko":"그 연극에서 악마가 젊은 남자를 유혹한다."}],"grammarNote":"devil은 특정 종교의 '마귀'(the Devil)로 the를 붙여 대문자로 쓰고, 일반적으로는 소문자·부정관사(a devil, devils)로 쓴다. speak of the devil은 '호랑이도 제 말 하면 온다'라는 관용구.","grammarQuiz":[{"sentence":"Speak _____ _____ devil — I was just talking about you!","ko":"호랑이도 제 말 하면 온다더니, 마침 네 얘기 하고 있었어!","answer":["of","the"],"hint":"speak of the devil 관용구"},{"sentence":"In the old story, the young man made a deal _____ the devil.","ko":"그 옛이야기 속에서, 젊은이는 악마와 거래를 했다.","answer":["with"],"hint":"make a deal with"}]},
    {"id":"w01343","w":"contrast","pos":["n","v"],"ph":"/ˈkɒntrɑːst/","cefr":"B1","kr":["대조","대비하다"],"ex":[{"en":"There is a sharp contrast here.","ko":"여기에는 극명한 대조가 있다."}],"mnemonic":{"soundHint":"'컨트라스트' → 카메라·화면의 '콘트라스트(대비)' 그대로","story":"TV 설정의 '콘트라스트'는 밝고 어두움의 대비 = contrast","hintConfidence":3},"pairs":{"buddyWords":[{"w":"difference","ko":"차이","reason":"contrast의 대표 동의어"},{"w":"compare","ko":"비교하다","reason":"compare and contrast 세트 표현"},{"w":"similarity","ko":"유사성","reason":"contrast의 반의어"}],"collocBest":[{"en":"in contrast to","ko":"~와 대조적으로"},{"en":"sharp contrast","ko":"극명한 대조"}]},"nuance":{"koSimple":"두 가지를 나란히 놓고 다름을 보여주는 것.","whenToUse":"차이를 강조하거나 비교할 때 씀."},"krDetail":[{"ko":"대조","explain":"서로 반대되거나 다른 것을 견주어 봄"},{"ko":"대비하다","explain":"서로 견주어 차이를 드러내다"}],"usageExamples":[{"en":"The teacher contrasted the two poems to show their differences.","ko":"선생님은 두 시의 차이를 보여주기 위해 그것들을 대비시켰다."},{"en":"Her calm voice contrasted sharply with his angry shouting.","ko":"그녀의 차분한 목소리는 그의 화난 고함과 뚜렷하게 대비되었다."}],"grammarNote":"타동사로 쓸 때는 'contrast A with B'(A를 B와 대비시키다), 자동사로 쓸 때는 'A contrasts with B'(A가 B와 대비되다) 형태. 명사 강세는 앞(CONtrast), 동사 강세는 뒤(conTRAST).","grammarQuiz":[{"sentence":"Her cheerful attitude _____ _____ her brother's gloomy mood at the party.","ko":"그녀의 밝은 태도는 파티에서 오빠의 우울한 기분과 대비되었다.","answer":["contrasted","with"],"hint":"자동사 contrast + 전치사로 '~와 대비되다'를 표현"}]},

    {"id":"w01345","w":"contribution","pos":["n"],"ph":"/ˌkɑntrɪˈbjuʃən/","cefr":"B1","kr":["기여","공헌","기부"],"ex":[{"en":"His contribution to science was remarkable.","ko":"과학에 대한 그의 공헌은 놀라웠다."}],"mnemonic":{"soundHint":"'컨트리(country)+뷰션' → 나라에 대한 이바지","story":"컨트리(나라)에 뷰션! 큰 소리로 기부금을 내면 컨트리뷰션(기여)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"donation","ko":"기부","reason":"contribution의 대표 동의어"},{"w":"contribute","ko":"기여하다","reason":"동사형 파생어"},{"w":"financial","ko":"재정적인","reason":"financial contribution 콜로케이션"}],"collocBest":[]},"nuance":{"koSimple":"누군가가 보탠 힘이나 몫.","whenToUse":"기여한 결과·업적을 명사로 말할 때."},"krDetail":[{"ko":"기여","explain":"도움이 되도록 힘을 보탬"},{"ko":"공헌","explain":"이바지함"},{"ko":"기부","explain":"자선이나 공적인 일을 위해 재물을 대가 없이 내놓음"}],"usageExamples":[{"en":"She made a big contribution to the team.","ko":"그녀는 팀에 큰 기여를 했다."},{"en":"They asked for a small contribution to charity.","ko":"그들은 자선단체에 적은 기부를 요청했다."}],"grammarNote":"make a contribution to + 명사/동명사 형태로 자주 쓰이며, 동사 contribute와 마찬가지로 전치사 to가 따라옴. 셀 수 있는 명사이므로 a/an 관사나 복수형 가능.","grammarQuiz":[{"sentence":"Many volunteers _____ _____ significant _____ _____ the local community.","ko":"많은 자원봉사자들이 지역 사회에 큰 기여를 했다.","answer":["made","contributions","to"],"hint":"make a contribution to의 복수형 활용"}]},
    {"id":"w01826","w":"distant","pos":["adj"],"ph":"/ˈdɪstənt/","cefr":"B1","kr":["먼","거리가 있는"],"ex":[{"en":"A distant star shone brightly.","ko":"먼 별이 밝게 빛났다."}],"mnemonic":{"soundHint":"'디스턴스(distance,거리)+t' → 거리가 있는","story":"distance(거리)의 형용사 → distant(먼)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"near","ko":"가까운","reason":"distant의 대표 반의어"},{"w":"past","ko":"과거","reason":"'먼 과거(distant past)'로 결합"},{"w":"relative","ko":"친척","reason":"'먼 친척(distant relative)'로 결합"}],"collocBest":[]},"nuance":{"koSimple":"공간·시간·관계가 멀리 떨어진.","whenToUse":"먼 거리, 먼 과거, 먼 친척 등에."},"krDetail":[{"ko":"먼","explain":"공간이나 시간이 많이 떨어져 있는"},{"ko":"거리가 있는","explain":"친밀하지 않고 서먹서먹한 느낌이 있는"}],"usageExamples":[{"en":"We could hear the distant sound of thunder.","ko":"우리는 멀리서 나는 천둥소리를 들을 수 있었다."},{"en":"He is a distant relative I rarely meet.","ko":"그는 내가 거의 만나지 않는 먼 친척이다."}],"grammarNote":"distant는 물리적 거리(distant star)와 관계·성격(distant relative, distant manner) 둘 다 나타낸다. far와 달리 명사 앞 수식(a distant country)에 자유롭게 쓰이고, in the distant past(먼 과거에)라는 표현도 자주 나온다.","grammarQuiz":[{"sentence":"The stars we see tonight are billions of years old and very _____.","ko":"오늘 밤 우리가 보는 별들은 수십억 년 되고 매우 멀리 있다.","answer":["distant"],"hint":"형용사 서술적 용법"},{"sentence":"In the _____ past, dinosaurs roamed freely across the ancient land.","ko":"먼 과거에, 공룡들은 고대 땅 위를 자유롭게 돌아다녔다.","answer":["distant"],"hint":"in the distant past"}]},
    {"id":"w01377","w":"copycat","pos":["n","adj"],"ph":"/ˈkɒpikæt/","cefr":"B1","kr":["모방자","흉내쟁이","모방하는"],"ex":[{"en":"The new product was criticized as a copycat of an earlier design.","ko":"새 제품은 이전 디자인의 모방품이라는 비판을 받았다."}],"mnemonic":{"soundHint":"'카피캣' → '카피(copy) + 캣(cat)' 흉내내는 고양이 = 모방자","story":"'카피(copy)하는 캣(cat)' 흉내쟁이 = copycat","hintConfidence":3},"pairs":{"buddyWords":[{"w":"imitator","ko":"모방자","reason":"copycat의 대표 동의어"},{"w":"copy","ko":"복사하다","reason":"어원 요소"},{"w":"original","ko":"원본, 독창적인","reason":"copycat의 반의어"}],"collocBest":[{"en":"copycat crime","ko":"모방 범죄"},{"en":"copycat product","ko":"모방 제품"}]},"nuance":{"koSimple":"남의 것을 그대로 따라 하는 사람·물건.","whenToUse":"표절·모방 제품을 부정적으로 지적할 때."},"krDetail":[{"ko":"모방자","explain":"남의 것을 흉내 내는 사람"},{"ko":"흉내쟁이","explain":"남을 따라 하기를 잘하는 사람"},{"ko":"모방하는","explain":"남의 것을 그대로 따라 하는"}],"usageExamples":[{"en":"Don't be a copycat; try your own idea.","ko":"흉내쟁이가 되지 말고 네 아이디어를 시도해 봐."},{"en":"The police warned about a copycat crime.","ko":"경찰은 모방 범죄에 대해 경고했다."}],"grammarNote":"copycat은 명사와 형용사 모두 가능하나, 명사 앞에 놓여 형용사처럼 쓰이는 경우가 많음(a copycat crime = 모방 범죄). 아이들이 놀릴 때 쓰는 구어체 표현이기도 함.","grammarQuiz":[{"sentence":"He is a copycat _____ always steals my ideas at work.","ko":"그는 직장에서 항상 내 아이디어를 훔치는 모방자다.","answer":"who","hint":"관계대명사 주격 who"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}
