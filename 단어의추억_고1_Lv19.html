    {"id":"w04250","w":"murmur","pos":["v","n"],"ph":"/ˈmɜːrmər/","cefr":"B1","kr":["중얼거리다","속삭이다","속삭임"],"ex":[{"en":"She murmured a quiet prayer before falling asleep.","ko":"그녀는 잠들기 전에 조용한 기도를 중얼거렸다."}],"mnemonic":{"soundHint":"머-머","story":"'머머' 소리를 반복하며 조용히 웅얼거리는 의성어 → 중얼거리다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"whisper","ko":"속삭이다","reason":"동의 관계"},{"w":"mutter","ko":"중얼거리다","reason":"동의 관계"},{"w":"shout","ko":"외치다","reason":"반의 관계"}],"collocBest":[{"en":"murmur of voices","ko":"목소리의 속삭임"},{"en":"heart murmur","ko":"심장 잡음"}]},"nuance":{"koSimple":"작고 낮은 소리로 웅얼거리다.","whenToUse":"기도·불평을 조용히 말할 때."},"krDetail":[{"ko":"중얼거리다","explain":"혼잣말처럼 낮고 작은 목소리로 말하다"},{"ko":"속삭이다","explain":"숨소리 섞인 아주 작은 목소리로 말하다"},{"ko":"속삭임","explain":"귓가에 스치듯 들리는 낮고 작은 말소리"}],"usageExamples":[{"en":"She murmured a soft prayer before opening her exam paper.","ko":"그녀는 시험지를 펼치기 전에 조용히 기도를 중얼거렸다."},{"en":"He didn't shout at all; instead, he murmured his complaint quietly.","ko":"그는 전혀 소리치지 않았고, 오히려 조용히 불평을 중얼거렸다."}],"grammarNote":"murmur는 자동사·타동사 모두 쓰이며 'murmur to oneself'는 혼잣말 관용구다. 학생들은 'murmur at(×)'으로 대상 전치사를 잘못 쓰거나, 명사 'a murmur of ~' 구조를 혼동한다.","grammarQuiz":[{"sentence":"The old man _____ something _____ himself in the corner.","ko":"그 노인은 구석에서 혼자 무엇인가를 중얼거렸다.","answer":["murmured","to"],"hint":"과거형 + 재귀 표현 to oneself"},{"sentence":"A low _____ _____ voices came from the next room.","ko":"옆방에서 낮은 목소리들의 속삭임이 들려왔다.","answer":["murmur","of"],"hint":"명사 + 전치사 of"}]},
    {"id":"w04257","w":"Muslim","pos":["n","adj"],"ph":"/ˈmʊzlɪm/","cefr":"B1","kr":["이슬람교도","이슬람의"],"ex":[{"en":"He is a devout Muslim.","ko":"그는 독실한 이슬람교도이다."}],"mnemonic":{"soundHint":"무슬림 → 그대로 '무슬림'","story":"'무슬림'! 이슬람교도. Islam을 믿는 사람.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"Islam","ko":"이슬람","reason":"시나리오 짝"},{"w":"religion","ko":"종교","reason":"시나리오 짝"},{"w":"prayer","ko":"기도","reason":"콜로케이션 짝"}],"collocBest":[]},"nuance":{"koSimple":"이슬람을 믿는 사람 또는 그와 관련된.","whenToUse":"종교·문화 배경을 말할 때."},"krDetail":[{"ko":"이슬람교도","explain":"이슬람교를 믿고 그 가르침을 따르는 사람"},{"ko":"이슬람의","explain":"이슬람교나 이슬람 문화와 관련이 있는"}],"usageExamples":[{"en":"Muslims pray five times a day facing toward Mecca.","ko":"이슬람교도들은 하루에 다섯 번 메카를 향해 기도한다."},{"en":"Christians and Muslims share many stories, but their beliefs also differ.","ko":"기독교인과 이슬람교도는 많은 이야기를 공유하지만, 그들의 믿음은 또한 다르다."}],"grammarNote":"Muslim은 국적·종교 명사처럼 고유형처럼 대문자로 시작해야 한다. 학생들은 'muslim(×)'처럼 소문자로 쓰거나, 'a Muslim's(속격)'과 형용사 'Muslim' 자리를 혼동한다.","grammarQuiz":[{"sentence":"Many _____ fast _____ the month of Ramadan every year.","ko":"많은 이슬람교도들이 매년 라마단 달 동안 단식한다.","answer":["Muslims","during"],"hint":"복수 고유 명사 + 기간 전치사"},{"sentence":"She grew up in a strongly _____ _____ in the city.","ko":"그녀는 도시 안의 이슬람 색이 강한 공동체에서 자랐다.","answer":["Muslim","community"],"hint":"형용사 + 명사"}]},
    {"id":"w04261","w":"mutual","pos":["adj"],"ph":"/ˈmjuːtʃuəl/","cefr":"B1","kr":["상호의","서로의"],"ex":[{"en":"They have mutual respect.","ko":"그들은 상호 존중이 있다."}],"mnemonic":{"soundHint":"뮤추얼 → '뮤추얼 펀드'","story":"'뮤추얼 펀드(공동 투자)'! 서로 상호의 = mutual benefit.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"shared","ko":"공유된","reason":"동의 관계"},{"w":"reciprocal","ko":"상호적인","reason":"동의 관계"},{"w":"one-sided","ko":"일방적인","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"둘 다 서로에게 그런.","whenToUse":"서로의 이익·존중·감정을 강조할 때."},"krDetail":[{"ko":"상호의","explain":"두 편이 주고받으며 서로 관계되는"},{"ko":"서로의","explain":"양쪽 모두에게 같이 해당되는"}],"usageExamples":[{"en":"The two countries signed a treaty based on mutual respect.","ko":"두 나라는 상호 존중에 바탕을 둔 조약을 체결했다."},{"en":"One-sided love hurts, but mutual love brings comfort to both hearts.","ko":"짝사랑은 아프지만, 서로의 사랑은 두 사람의 마음에 위안을 준다."}],"grammarNote":"mutual은 항상 두 명 이상의 대상 사이에서만 성립한다. 학생들은 'mutual with(×)'로 쓰거나, 'my mutual friend'처럼 소유격과 함께 잘못 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"Trust is essential _____ any relationship based _____ mutual respect.","ko":"신뢰는 상호 존중에 바탕을 둔 어떤 관계에서든 필수적이다.","answer":["in","on"],"hint":"전치사 in + 명사, based on"},{"sentence":"The agreement offered _____ benefits _____ both companies involved.","ko":"그 협약은 관련된 두 회사 모두에게 상호 이익을 제공했다.","answer":["mutual","to"],"hint":"형용사 + 명사, benefit to ~"}]},
    {"id":"w04263","w":"mystery","pos":["n"],"ph":"/ˈmɪstəri/","cefr":"B1","kr":["미스터리","수수께끼"],"ex":[{"en":"The mystery was unsolved.","ko":"그 미스터리는 해결되지 않았다."}],"mnemonic":{"soundHint":"미스터리 → 그대로 '미스터리'","story":"'미스터리 소설'! 우리말로도 그대로 쓰는 = 수수께끼!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"puzzle","ko":"수수께끼","reason":"동의 관계"},{"w":"enigma","ko":"수수께끼","reason":"동의 관계"},{"w":"solve","ko":"풀다","reason":"콜로케이션 짝"}],"collocBest":[]},"nuance":{"koSimple":"이유를 알 수 없는 수수께끼.","whenToUse":"풀리지 않는 사건·비밀 얘기할 때."},"krDetail":[{"ko":"미스터리","explain":"그 까닭이나 진짜 모습을 알 수 없는 이상한 일"},{"ko":"수수께끼","explain":"답이 쉽게 떠오르지 않는 어려운 문제나 사건"}],"usageExamples":[{"en":"The detective solved the mystery within just three days.","ko":"그 형사는 단 3일 만에 그 수수께끼를 풀었다."},{"en":"Her sudden disappearance remains a mystery, yet no clue has been found.","ko":"그녀의 갑작스러운 실종은 여전히 수수께끼이며, 어떤 단서도 발견되지 않았다."}],"grammarNote":"mystery는 가산·불가산 모두 쓰인다. 학생들은 'mystery about(×)'로 쓰거나, 'a mystery to me(내게는 수수께끼)'처럼 to를 써야 하는 관용 표현을 놓친다.","grammarQuiz":[{"sentence":"How he escaped from the locked room is still _____ _____ me.","ko":"그가 어떻게 잠긴 방에서 탈출했는지는 아직도 내게 수수께끼다.","answer":["a","mystery"],"hint":"부정관사 + 명사 (뒤 to me)"},{"sentence":"The police are trying to _____ the _____ of the missing painting.","ko":"경찰은 사라진 그림의 수수께끼를 풀려고 애쓰고 있다.","answer":["solve","mystery"],"hint":"동사 solve + 명사"}]},
    {"id":"w04264","w":"myth","pos":["n"],"ph":"/mɪθ/","cefr":"B1","kr":["신화","통념"],"ex":[{"en":"That is a common myth.","ko":"그것은 흔한 통념이다."}],"mnemonic":{"soundHint":"미스 → '미스(miss)' 진실","story":"'미스(miss)' 진실! 신화(myth)는 진실을 놓친 이야기.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"legend","ko":"전설","reason":"동의 관계"},{"w":"fable","ko":"우화","reason":"동의 관계"},{"w":"fact","ko":"사실","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"옛날부터 전해진 신화나 잘못된 통념.","whenToUse":"그리스 신화·흔한 오해 얘기할 때."},"krDetail":[{"ko":"신화","explain":"옛사람들이 신이나 영웅에 대해 지어 전한 이야기"},{"ko":"통념","explain":"많은 사람이 그렇다고 믿고 있는 잘못된 생각"}],"usageExamples":[{"en":"Greek myths tell exciting stories of gods and heroes.","ko":"그리스 신화는 신들과 영웅들에 대한 흥미진진한 이야기를 전한다."},{"en":"Many people believe the myth, but scientific evidence clearly proves it false.","ko":"많은 사람이 그 통념을 믿지만, 과학적 증거는 그것이 틀렸음을 분명히 보여준다."}],"grammarNote":"myth는 가산 명사로 관사·복수형이 필수다. 학생들은 'myth is(관사 누락)'처럼 쓰거나, 'myth of/about ~' 전치사를 혼동한다.","grammarQuiz":[{"sentence":"It is _____ _____ that eating carrots greatly improves eyesight.","ko":"당근을 먹으면 시력이 크게 좋아진다는 것은 통념이다.","answer":["a","myth"],"hint":"부정관사 + 가산 명사"},{"sentence":"Ancient Greek _____ _____ full of gods and monsters.","ko":"고대 그리스 신화는 신과 괴물로 가득 차 있다.","answer":["myths","are"],"hint":"복수 명사 + 복수형 be동사"}]},
    {"id":"w04267","w":"naive","pos":["adj"],"ph":"/naɪˈiːv/","cefr":"B1","kr":["순진한","세상 물정 모르는"],"ex":[{"en":"It was naive of him to trust a stranger.","ko":"낯선 사람을 믿다니 그는 순진했다."}],"mnemonic":{"soundHint":"나이브 → '나 이브(이불)' 안","story":"'나 이브(어린 아이처럼)' 세상 물정 몰라! naive = 순진한.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"innocent","ko":"순진한","reason":"동의 관계"},{"w":"gullible","ko":"잘 속는","reason":"동의 관계"},{"w":"sophisticated","ko":"세련된","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"세상 물정 모르고 잘 속는.","whenToUse":"낯선 사람을 쉽게 믿는 태도에."},"krDetail":[{"ko":"순진한","explain":"때가 묻지 않고 마음이 어린아이처럼 맑은"},{"ko":"세상 물정 모르는","explain":"세상이 어떻게 돌아가는지 잘 몰라 쉽게 속는"}],"usageExamples":[{"en":"She is too naive to notice the danger of the offer.","ko":"그녀는 그 제안의 위험을 알아채기에는 너무 순진하다."},{"en":"A wise investor questions the deal, but a naive one signs it quickly.","ko":"지혜로운 투자자는 그 거래를 의심하지만, 순진한 사람은 그것에 재빨리 서명한다."}],"grammarNote":"naive는 사람과 생각·행동 모두를 꾸밀 수 있다. 학생들은 'naive to think(×)'와 'naive of you to think'를 혼동하고, 'It is naive to V' 구조를 어려워한다.","grammarQuiz":[{"sentence":"It is _____ _____ think everyone will help you without any reward.","ko":"모든 사람이 아무런 보상 없이 너를 도우리라고 생각하는 것은 순진하다.","answer":["naive","to"],"hint":"형용사 + to부정사, 가주어 It"},{"sentence":"How _____ _____ you to believe such an obvious lie!","ko":"그렇게 뻔한 거짓말을 믿다니 너 정말 순진하구나!","answer":["naive","of"],"hint":"감탄문, 형용사 + of + 사람"}]},
    {"id":"w04268","w":"naked","pos":["adj"],"ph":"/ˈneɪkɪd/","cefr":"B1","kr":["벌거벗은","노출된"],"ex":[{"en":"Visible to the naked eye.","ko":"육안으로 볼 수 있는."}],"mnemonic":{"soundHint":"네이키드 → '내(내가) 키드(kid)'","story":"'내 키드(아이)'가 벌거벗은 채 뛰어다닌다! naked eye(육안).","hintConfidence":2},"pairs":{"buddyWords":[{"w":"bare","ko":"맨-","reason":"동의 관계"},{"w":"exposed","ko":"노출된","reason":"동의 관계"},{"w":"clothed","ko":"옷을 입은","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"아무것도 안 걸친·드러난.","whenToUse":"몸·진실이 그대로 드러날 때."},"krDetail":[{"ko":"벌거벗은","explain":"옷을 하나도 걸치지 않아 살이 그대로 드러난"},{"ko":"노출된","explain":"가리는 것 없이 겉으로 훤히 드러나 있는"}],"usageExamples":[{"en":"The child ran naked along the beach, laughing happily.","ko":"그 아이는 즐겁게 웃으며 벌거벗은 채로 해변을 따라 뛰었다."},{"en":"Some stars are visible to the naked eye, while others need a telescope.","ko":"어떤 별들은 육안으로 보이지만, 다른 별들은 망원경이 필요하다."}],"grammarNote":"'the naked eye(육안)'는 관사 the가 반드시 붙는 관용 표현이다. 학생들은 'a naked eye(×)'로 쓰거나, 발음이 [ˈneɪkɪd]로 -ed가 [ɪd]로 나는 것을 몰라 [neɪkt]로 잘못 읽는다.","grammarQuiz":[{"sentence":"The tiny bacteria are invisible _____ _____ naked eye.","ko":"그 작은 세균들은 육안으로는 보이지 않는다.","answer":["to","the"],"hint":"전치사 to + 관사 the (관용 표현)"},{"sentence":"He told the _____ truth _____ everyone in the meeting.","ko":"그는 회의에 있는 모두에게 있는 그대로의 진실을 말했다.","answer":["naked","to"],"hint":"형용사 + 명사, tell A to B"}]},
    {"id":"w04270","w":"namely","pos":["adv"],"ph":"/ˈneɪmli/","cefr":"B1","kr":["즉","다시 말하면"],"ex":[{"en":"One problem namely the cost.","ko":"하나의 문제 즉 비용이다."}],"mnemonic":{"soundHint":"네임리 → name(이름) + ly","story":"name(이름)을 대며 = 구체적으로, 즉! '즉, 그것은...'","hintConfidence":3},"pairs":{"buddyWords":[{"w":"specifically","ko":"구체적으로","reason":"동의 관계"},{"w":"that is","ko":"즉","reason":"동의 관계"},{"w":"vaguely","ko":"모호하게","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"앞말을 콕 집어 다시 말하면.","whenToUse":"예를 구체적으로 지목할 때."},"krDetail":[{"ko":"즉","explain":"앞말을 다시 풀어 설명할 때 쓰는 이음말"},{"ko":"다시 말하면","explain":"앞서 한 말을 다른 표현으로 풀어 옮길 때 쓰는 말"}],"usageExamples":[{"en":"Only one student passed the exam, namely Jinsu from class two.","ko":"오직 한 학생만이 시험에 통과했는데, 즉 2반의 진수이다."},{"en":"She loves winter sports, namely skiing and snowboarding, more than any other hobbies.","ko":"그녀는 겨울 스포츠, 즉 스키와 스노보드를 다른 어떤 취미보다도 좋아한다."}],"grammarNote":"namely는 앞에 나온 말을 구체적으로 예시할 때 쓰는 부사이며 앞에 반드시 쉼표를 붙인다. 학생들은 'namely because(×)'로 이유 부사절처럼 쓰거나, 'that is' 자리에 잘못 넣는다.","grammarQuiz":[{"sentence":"Three countries won medals, _____ Korea, Japan, _____ China.","ko":"세 나라가 메달을 땄는데, 즉 한국, 일본, 그리고 중국이다.","answer":["namely","and"],"hint":"부사 namely + 열거 접속사 and"},{"sentence":"Only one person can solve this, _____ _____ math teacher.","ko":"이 문제를 풀 수 있는 사람은 오직 한 명, 즉 우리 수학 선생님뿐이다.","answer":["namely","our"],"hint":"부사 namely + 소유격"}]},
    {"id":"w04271","w":"nap","pos":["n","v"],"ph":"/næp/","cefr":"B1","kr":["낮잠","낮잠 자다"],"ex":[{"en":"She took a short nap after lunch.","ko":"그녀는 점심 후 짧은 낮잠을 잤다."}],"mnemonic":{"soundHint":"냅 → '냅다' 자다","story":"'냅(nap)다' 잠들다! 잠깐의 낮잠. take a nap.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"doze","ko":"졸다","reason":"동의 관계"},{"w":"snooze","ko":"선잠","reason":"동의 관계"},{"w":"sleep","ko":"잠","reason":"시나리오 짝"}],"collocBest":[]},"nuance":{"koSimple":"짧게 자는 낮잠.","whenToUse":"점심 뒤 잠깐 쉬는 잠을 말할 때."},"krDetail":[{"ko":"낮잠","explain":"낮에 잠깐 눈을 붙여 자는 짧은 잠"},{"ko":"낮잠 자다","explain":"낮에 잠깐 눈을 붙여 자다"}],"usageExamples":[{"en":"He takes a short nap after lunch every afternoon.","ko":"그는 매일 오후 점심 뒤 짧은 낮잠을 잔다."},{"en":"A quick nap wakes you up, but a long one makes you sleepier.","ko":"짧은 낮잠은 정신을 깨워 주지만, 긴 낮잠은 오히려 더 졸리게 만든다."}],"grammarNote":"'take a nap' 관용 표현에서 관사 a가 필수다. 학생들은 'take nap(×), have nap(×)'처럼 관사를 빼거나, 'sleep a nap(×)'같은 콩글리시로 쓴다.","grammarQuiz":[{"sentence":"I usually _____ _____ nap for 20 minutes after lunch.","ko":"나는 보통 점심 뒤 20분 동안 낮잠을 잔다.","answer":["take","a"],"hint":"관용 동사 take + 부정관사"},{"sentence":"The baby fell asleep and _____ _____ two hours in the stroller.","ko":"아기가 잠들어 유모차 안에서 두 시간 동안 낮잠을 잤다.","answer":["napped","for"],"hint":"동사 nap 과거형 + 기간 for"}]},
    {"id":"w04276","w":"nasty","pos":["adj"],"ph":"/ˈnæsti/","cefr":"B1","kr":["불쾌한","심술궂은"],"ex":[{"en":"He said a nasty thing.","ko":"그는 불쾌한 말을 했다."}],"mnemonic":{"soundHint":"내스티 → '내(냄새) 스티(stinky)'","story":"'내 스티(stinky, 냄새나는)'! 불쾌한, 심술궂은 상황!","hintConfidence":2},"pairs":{"buddyWords":[{"w":"unpleasant","ko":"불쾌한","reason":"동의 관계"},{"w":"mean","ko":"심술궂은","reason":"동의 관계"},{"w":"nice","ko":"좋은","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"기분을 확 상하게 하는·심술궂은.","whenToUse":"불쾌한 말·심한 날씨에."},"krDetail":[{"ko":"불쾌한","explain":"기분을 몹시 상하게 하고 언짢게 만드는"},{"ko":"심술궂은","explain":"일부러 남을 괴롭히거나 짓궂게 구는"}],"usageExamples":[{"en":"She left a nasty comment under my picture on social media.","ko":"그녀는 소셜 미디어의 내 사진 아래에 불쾌한 댓글을 남겼다."},{"en":"The weather was nice yesterday, but today it turned really nasty.","ko":"어제는 날씨가 좋았지만, 오늘은 아주 험해졌다."}],"grammarNote":"nasty는 사람·말·날씨·냄새 등 다양한 대상을 꾸민다. 학생들은 최상급 'nastyest(×)'로 쓰거나, 'nasty at(×)'로 대상 전치사를 잘못 쓴다. 정답 형태는 nastiest, be nasty to.","grammarQuiz":[{"sentence":"It was really _____ _____ him to laugh at her mistake.","ko":"그녀의 실수를 비웃다니 그는 정말 심술궂었다.","answer":["nasty","of"],"hint":"형용사 + of + 사람 구문"},{"sentence":"Don't be _____ _____ your little brother; he is only five.","ko":"네 어린 남동생에게 심술궂게 굴지 마, 그 애는 겨우 다섯 살이다.","answer":["nasty","to"],"hint":"형용사 + 대상 전치사 to"}]},
    {"id":"w04280","w":"native","pos":["adj","n"],"ph":"/ˈneɪtɪv/","cefr":"B1","kr":["원주민의","토착의"],"ex":[{"en":"She is a native speaker.","ko":"그녀는 원어민 화자이다."}],"mnemonic":{"soundHint":"네이티브 → 그대로 '네이티브'","story":"'네이티브 스피커(원어민)'! 태어난 곳의 = 원주민의, 토착의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"indigenous","ko":"토착의","reason":"동의 관계"},{"w":"local","ko":"현지의","reason":"동의 관계"},{"w":"foreign","ko":"외국의","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"태어난 그 지역의·원래부터의.","whenToUse":"모국어·원어민·토착 생물 말할 때."},"krDetail":[{"ko":"원주민의","explain":"본디부터 그 땅에 살아온 사람들과 관련된"},{"ko":"토착의","explain":"본디부터 그 지역에 뿌리내려 자란"}],"usageExamples":[{"en":"She is a native speaker of English from Boston.","ko":"그녀는 보스턴 출신의 영어 원어민이다."},{"en":"Foreign plants can invade quickly, but native ones adapt more slowly.","ko":"외래 식물은 빠르게 번질 수 있지만, 토착 식물은 더 천천히 적응한다."}],"grammarNote":"'be native to + 장소'는 '~ 원산이다' 관용 표현이다. 학생들은 'native in(×), native from(×)'처럼 전치사를 틀리거나, 'native English speaker' 어순을 잘못 배열한다.","grammarQuiz":[{"sentence":"The panda _____ _____ the mountains of central China.","ko":"판다는 중국 중부의 산악 지역이 원산지다.","answer":["is","native"],"hint":"be동사 + 형용사, 뒤 to + 장소"},{"sentence":"He is a _____ _____ of French from Paris.","ko":"그는 파리 출신의 프랑스어 원어민이다.","answer":["native","speaker"],"hint":"형용사 + 명사, native speaker"}]},
    {"id":"w04287","w":"navigate","pos":["v"],"ph":"/ˈnævɪɡeɪt/","cefr":"B1","kr":["항해하다","길을 찾다"],"ex":[{"en":"Navigate the dark forest.","ko":"어두운 숲을 헤쳐 나아가라."}],"mnemonic":{"soundHint":"내비게이트 → 자동차 '내비게이션'","story":"'내비게이션'! 길을 안내한다. navigate = 항해하다, 길 찾다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"guide","ko":"안내하다","reason":"동의 관계"},{"w":"steer","ko":"조종하다","reason":"동의 관계"},{"w":"explore","ko":"탐색하다","reason":"시나리오 짝"}],"collocBest":[]},"nuance":{"koSimple":"길·상황을 헤쳐 나가며 방향을 잡다.","whenToUse":"배·웹사이트·어려운 상황을 뚫고 갈 때."},"krDetail":[{"ko":"항해하다","explain":"배를 몰아 바다나 강 위를 지나가다"},{"ko":"길을 찾다","explain":"낯선 곳에서 원하는 곳까지 방향을 잘 잡아 나아가다"}],"usageExamples":[{"en":"Sailors navigate ships across the ocean using the stars.","ko":"선원들은 별을 이용해 배를 몰고 바다를 건넌다."},{"en":"Old maps helped travelers navigate, but modern GPS makes the task easy.","ko":"옛 지도는 여행자들이 길을 찾도록 도왔지만, 현대 GPS는 그 일을 쉽게 만든다."}],"grammarNote":"navigate는 타동사와 자동사 모두 쓰인다. 학생들은 'navigate to(길찾기 앱은 가능)', 'navigate through(어려움을 헤쳐 나가다)'의 구별을 어려워하며 'navigate a website'를 어색하게 여긴다.","grammarQuiz":[{"sentence":"Users can easily _____ _____ the website using the top menu.","ko":"이용자들은 상단 메뉴를 이용해 그 웹사이트를 쉽게 탐색할 수 있다.","answer":["navigate","through"],"hint":"동사 navigate + 전치사 through"},{"sentence":"It's hard _____ navigate _____ a foreign city without any map.","ko":"지도 없이 낯선 도시에서 길을 찾는 것은 어렵다.","answer":["to","in"],"hint":"to부정사 + 장소 전치사 in"}]},
    {"id":"w04293","w":"necessarily","pos":["adv"],"ph":"/ˌnesəˈserəli/","cefr":"B1","kr":["반드시","필연적으로"],"ex":[{"en":"Not necessarily the best.","ko":"반드시 최선은 아니다."}],"mnemonic":{"soundHint":"네세서릴리 → necessary(필요한) + ly","story":"necessary(필요한) + ly = 반드시! not necessarily(반드시 그런 건 아니다).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inevitably","ko":"필연적으로","reason":"동의 관계"},{"w":"certainly","ko":"확실히","reason":"동의 관계"},{"w":"optionally","ko":"선택적으로","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"반드시·꼭 그런 건 아닌.","whenToUse":"'not necessarily'로 반박·부분 부정할 때."},"krDetail":[{"ko":"반드시","explain":"무슨 일이 있어도 꼭 그렇게 되도록"},{"ko":"필연적으로","explain":"어떤 일이 반드시 그렇게 이어질 수밖에 없이"}],"usageExamples":[{"en":"Being rich does not necessarily mean being happy in life.","ko":"부유한 것이 반드시 인생에서 행복함을 뜻하지는 않는다."},{"en":"A bigger team wins more often, but not necessarily every single game.","ko":"더 큰 팀이 더 자주 이기지만, 반드시 모든 경기를 이기는 것은 아니다."}],"grammarNote":"'not necessarily'는 '반드시 ~은 아니다'라는 부분 부정이다. 학생들은 이를 완전 부정 'not at all'로 오해하고, 어순 'necessarily not(×)'로 잘못 배열한다.","grammarQuiz":[{"sentence":"Studying long hours does _____ _____ lead to good grades.","ko":"오래 공부하는 것이 반드시 좋은 성적으로 이어지는 것은 아니다.","answer":["not","necessarily"],"hint":"부분 부정 not + necessarily 어순"},{"sentence":"Expensive things are _____ _____ better than cheap ones.","ko":"비싼 것들이 반드시 싼 것들보다 더 좋은 것은 아니다.","answer":["not","necessarily"],"hint":"be동사 뒤 부분 부정 표현"}]},
    {"id":"w04295","w":"necessity","pos":["n"],"ph":"/nɪˈsesɪti/","cefr":"B1","kr":["필요","필수품"],"ex":[{"en":"Water is a necessity.","ko":"물은 필수품이다."}],"mnemonic":{"soundHint":"네세서티 → necessary(필요한) + ty","story":"necessary(필요한) + ty(명사) = 필요, 필수품! 물은 basic necessity!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"need","ko":"필요","reason":"동의 관계"},{"w":"essential","ko":"필수품","reason":"동의 관계"},{"w":"luxury","ko":"사치품","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"없으면 안 되는 것·필수품.","whenToUse":"기본 생필품이나 어쩔 수 없는 상황에."},"krDetail":[{"ko":"필요","explain":"어떤 일에 꼭 있어야 하는 요구나 그러한 상태"},{"ko":"필수품","explain":"살아가는 데 꼭 있어야 하는 물건"}],"usageExamples":[{"en":"Food, water, and shelter are basic necessities of life.","ko":"음식, 물, 그리고 잠자리는 삶의 기본 필수품이다."},{"en":"Some items are luxuries, but others are true necessities in daily life.","ko":"어떤 물건들은 사치품이지만, 다른 것들은 일상에서 진짜 필수품이다."}],"grammarNote":"necessity는 가산·불가산 모두 쓰인다. 학생들은 'out of necessity(어쩔 수 없이)' 관용 표현을 'by necessity(×)'와 혼동하거나, 'a necessity of ~'와 'necessity to V'를 구분 못 한다.","grammarQuiz":[{"sentence":"He started working part-time _____ _____ necessity, not choice.","ko":"그는 선택이 아니라 필요에 의해 아르바이트를 시작했다.","answer":["out","of"],"hint":"관용 표현 out of + 명사"},{"sentence":"There is no _____ _____ apologize; it was clearly my fault.","ko":"네가 사과할 필요는 없다, 그것은 분명히 내 잘못이었다.","answer":["necessity","to"],"hint":"명사 + to부정사 (necessity to V)"}]},
    {"id":"w04302","w":"neglect","pos":["v","n"],"ph":"/nɪˈɡlekt/","cefr":"B1","kr":["방치하다","소홀히 하다"],"ex":[{"en":"Do not neglect your health.","ko":"건강을 소홀히 하지 마라."}],"mnemonic":{"soundHint":"니글렉트 → neg(부정) + lect(뽑다/선택)","story":"neg(부정) + lect(선택) = 선택하지 않다 = 방치하다! 무관심.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"ignore","ko":"무시하다","reason":"동의 관계"},{"w":"overlook","ko":"간과하다","reason":"동의 관계"},{"w":"care for","ko":"돌보다","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"돌봐야 할 것을 소홀히 하다.","whenToUse":"건강·의무·아이를 방치할 때."},"krDetail":[{"ko":"방치하다","explain":"돌보지 않고 그대로 내버려두다"},{"ko":"소홀히 하다","explain":"마음을 두지 않고 대충 다루거나 게을리 하다"}],"usageExamples":[{"en":"Parents should never neglect their children's emotional needs.","ko":"부모는 자녀의 감정적 필요를 결코 소홀히 해서는 안 된다."},{"en":"He worked hard, but he neglected his health, and finally fell ill.","ko":"그는 열심히 일했지만 건강을 소홀히 하여, 결국 병이 났다."}],"grammarNote":"neglect는 타동사로 'neglect to V(~할 것을 잊다), neglect -ing(하기를 소홀히 하다)'가 미묘하게 다르다. 학생들은 이를 구분 못 하거나 'neglect on/of'로 잘못 쓴다.","grammarQuiz":[{"sentence":"He _____ _____ lock the door before leaving the house.","ko":"그는 집을 나서기 전에 문을 잠그는 것을 잊었다.","answer":["neglected","to"],"hint":"동사 과거형 + to부정사"},{"sentence":"Do not _____ your studies _____ playing games all night.","ko":"밤새 게임을 하느라 공부를 소홀히 하지 마라.","answer":["neglect","by"],"hint":"타동사 neglect + 수단 by -ing"}]},
    {"id":"w04306","w":"negotiate","pos":["v"],"ph":"/nɪˈɡoʊʃieɪt/","cefr":"B1","kr":["협상하다","협의하다"],"ex":[{"en":"They negotiated a deal.","ko":"그들은 거래를 협상했다."}],"mnemonic":{"soundHint":"니고시에이트 → '니가 시(始, 시작) 해!' 협상","story":"'니가 시(시작)해!' 협상(negotiate) 시작해!","hintConfidence":1},"pairs":{"buddyWords":[{"w":"bargain","ko":"흥정하다","reason":"동의 관계"},{"w":"discuss","ko":"논의하다","reason":"동의 관계"},{"w":"negotiation","ko":"협상","reason":"명사형 짝"}],"collocBest":[]},"nuance":{"koSimple":"서로 얘기해 조건을 맞추다.","whenToUse":"거래·평화·연봉 협상에."},"krDetail":[{"ko":"협상하다","explain":"서로 다른 뜻을 좁혀 합의에 이르도록 이야기를 나누다"},{"ko":"협의하다","explain":"여러 사람이 모여 문제를 어떻게 풀지 함께 의논하다"}],"usageExamples":[{"en":"The two companies negotiated a new contract last week.","ko":"두 회사는 지난주에 새 계약을 협상했다."},{"en":"One side demanded more, but the other side patiently negotiated fair terms.","ko":"한쪽은 더 많이 요구했지만, 다른 쪽은 참을성 있게 공정한 조건을 협상했다."}],"grammarNote":"'negotiate with 사람 + about/over 주제' 구조가 흔하다. 학생들은 'negotiate to 사람(×)'로 쓰거나, 'negotiate for 조건'과 'negotiate 조건(직접목적어)'를 헷갈린다.","grammarQuiz":[{"sentence":"The union is _____ _____ management about higher wages.","ko":"노조는 더 높은 임금을 놓고 경영진과 협상하고 있다.","answer":["negotiating","with"],"hint":"현재진행형 + 대상 전치사 with"},{"sentence":"They tried _____ negotiate a peace deal _____ the two nations.","ko":"그들은 두 나라 사이에 평화 협정을 협상하려고 노력했다.","answer":["to","between"],"hint":"to부정사 + 전치사 between"}]},
    {"id":"w04307","w":"negotiation","pos":["n"],"ph":"/nɪˌɡoʊʃiˈeɪʃən/","cefr":"B1","kr":["협상","협의"],"ex":[{"en":"Negotiation took three days.","ko":"협상은 3일이 걸렸다."}],"mnemonic":{"soundHint":"니고시에이션 → negotiate + ion","story":"negotiate(협상하다) + ion(명사) = 협상! 노사 협상, 평화 협상.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"discussion","ko":"논의","reason":"동의 관계"},{"w":"bargaining","ko":"흥정","reason":"동의 관계"},{"w":"negotiate","ko":"협상하다","reason":"동사형 짝"}],"collocBest":[]},"nuance":{"koSimple":"서로 협상해 답을 찾는 과정.","whenToUse":"평화 협상·비즈니스 협의에."},"krDetail":[{"ko":"협상","explain":"서로 다른 뜻을 좁혀 합의에 이르는 이야기 나누기"},{"ko":"협의","explain":"여럿이 모여 문제를 어떻게 풀지 함께 의논하는 일"}],"usageExamples":[{"en":"The negotiation between the two sides lasted for many hours.","ko":"양측 사이의 협상은 여러 시간 동안 이어졌다."},{"en":"War brings destruction, but negotiation offers a chance for lasting peace.","ko":"전쟁은 파괴를 가져오지만, 협상은 지속되는 평화의 기회를 제공한다."}],"grammarNote":"negotiation은 가산·불가산 모두 가능하다. 학생들은 'in negotiation with(협상 중)'와 'under negotiation(협상 중)' 표현을 혼동하고 'negotiation to V'로 잘못 쓴다.","grammarQuiz":[{"sentence":"The company is currently _____ _____ with several suppliers.","ko":"그 회사는 현재 여러 공급업체와 협상 중이다.","answer":["in","negotiation"],"hint":"전치사 in + 명사 (관용 표현)"},{"sentence":"The new contract is still _____ _____; final terms are not set.","ko":"새 계약은 아직 협상 중이며, 최종 조건은 정해지지 않았다.","answer":["under","negotiation"],"hint":"관용 표현 under + 명사"}]},
    {"id":"w04313","w":"nerve","pos":["n"],"ph":"/nɜːrv/","cefr":"B1","kr":["신경","용기"],"ex":[{"en":"She had the nerve to ask.","ko":"그녀는 용기를 내어 물었다."}],"mnemonic":{"soundHint":"너브 → '너 부(不)'담스러워?","story":"신경(nerve)이 곤두선다! 감히(nerve) 그런 말을! 용기의 뜻도.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"courage","ko":"용기","reason":"동의 관계"},{"w":"boldness","ko":"대담함","reason":"동의 관계"},{"w":"nervous","ko":"긴장한","reason":"파생어 짝"}],"collocBest":[]},"nuance":{"koSimple":"몸의 신경, 또는 대담한 용기.","whenToUse":"신경 반응·아슬한 도전 말할 때."},"krDetail":[{"ko":"신경","explain":"몸의 여러 부분에 느낌과 명령을 전하는 가느다란 줄"},{"ko":"용기","explain":"무섭거나 힘든 일 앞에서 물러서지 않는 마음의 힘"}],"usageExamples":[{"en":"That question really hit a nerve during the meeting.","ko":"그 질문은 회의 중에 정말로 아픈 곳을 건드렸다."},{"en":"He had the nerve to lie to my face and expect me to believe it.","ko":"그는 내 앞에서 뻔뻔하게 거짓말을 하고 내가 믿기를 기대할 정도의 배짱이 있었다."}],"grammarNote":"'have the nerve to V(뻔뻔하게 ~하다), get on one's nerves(신경을 거스르다)' 등 관용구가 많다. 학생들은 'have a nerve'와 관사 the의 차이, 복수형 nerves를 혼동한다.","grammarQuiz":[{"sentence":"His loud chewing _____ _____ my nerves every single meal.","ko":"그의 시끄러운 씹는 소리는 매 끼니마다 내 신경을 거슬리게 한다.","answer":["gets","on"],"hint":"관용 표현 get on one's nerves"},{"sentence":"She had _____ _____ to ask her boss for a big raise.","ko":"그녀는 사장에게 큰 인상을 요구할 만한 배짱이 있었다.","answer":["the","nerve"],"hint":"관사 the + 명사 (have the nerve to V)"}]},
    {"id":"w04318","w":"network","pos":["n","v"],"ph":"/ˈnetwɜːrk/","cefr":"B1","kr":["네트워크","인맥"],"ex":[{"en":"Build your professional network.","ko":"전문 인맥을 구축해라."}],"mnemonic":{"soundHint":"네트워크 → net(그물) + work(일)","story":"net(그물) + work(작업) = 그물처럼 짜인 관계망 = 네트워크, 인맥!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"system","ko":"시스템","reason":"동의 관계"},{"w":"connections","ko":"연결망","reason":"동의 관계"},{"w":"internet","ko":"인터넷","reason":"시나리오 짝"}],"collocBest":[]},"nuance":{"koSimple":"서로 연결된 그물 같은 관계망.","whenToUse":"컴퓨터·인맥·방송 얘기할 때."},"krDetail":[{"ko":"네트워크","explain":"여러 지점이나 사람이 서로 연결되어 이루어진 그물망"},{"ko":"인맥","explain":"일이나 도움을 주고받을 수 있게 이어진 사람들 사이의 끈"}],"usageExamples":[{"en":"A strong social network helps people find new job opportunities.","ko":"탄탄한 인맥은 사람들이 새로운 일자리를 찾는 데 도움이 된다."},{"en":"He built a wide network of clients, so his business kept growing.","ko":"그는 넓은 고객 인맥을 쌓았고, 그래서 그의 사업은 계속 성장했다."}],"grammarNote":"network는 명사·동사 모두 쓰이며 동사일 때 '인맥을 쌓다'라는 의미다. 학생들은 'network with 사람(사람과 교류하다)' 구조를 어색해하고, 'net work(×)'처럼 붙여 쓰기를 놓친다.","grammarQuiz":[{"sentence":"Business owners often _____ _____ others to grow their companies.","ko":"사업주들은 자기 회사를 키우려고 다른 사람들과 자주 교류한다.","answer":["network","with"],"hint":"동사 network + 전치사 with"},{"sentence":"She has a strong _____ _____ friends in the industry.","ko":"그녀는 그 업계에 강력한 친구들의 인맥을 가지고 있다.","answer":["network","of"],"hint":"명사 network + 전치사 of"}]},
    {"id":"w04320","w":"neutral","pos":["adj"],"ph":"/ˈnjuːtrəl/","cefr":"B1","kr":["중립의","중성의"],"ex":[{"en":"Stay neutral in disputes.","ko":"분쟁에서 중립을 지켜라."}],"mnemonic":{"soundHint":"뉴트럴 → 자동차 기어 'N(뉴트럴)'","story":"자동차 기어 'N(neutral)'! 앞도 뒤도 아닌 중립!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"impartial","ko":"공정한","reason":"동의 관계"},{"w":"unbiased","ko":"편견 없는","reason":"동의 관계"},{"w":"biased","ko":"편향된","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"어느 편도 들지 않는.","whenToUse":"분쟁·색깔·의견에서 치우치지 않을 때."},"krDetail":[{"ko":"중립의","explain":"어느 한쪽에도 치우치지 않고 가운데를 지키는"},{"ko":"중성의","explain":"성질이 한쪽으로 쏠리지 않고 고르게 있는"}],"usageExamples":[{"en":"Switzerland has remained neutral in most international conflicts.","ko":"스위스는 대부분의 국제 분쟁에서 중립을 유지해 왔다."},{"en":"A judge must stay neutral, but a lawyer clearly takes one side.","ko":"판사는 중립을 지켜야 하지만, 변호사는 분명히 한쪽 편을 든다."}],"grammarNote":"'be neutral about/on/in ~' 각각 뉘앙스가 다르다. 학생들은 이 전치사를 헷갈리거나 'a neutral(중립국)' 명사 용법을 모르는 경우가 많다.","grammarQuiz":[{"sentence":"The country tried to remain _____ _____ the two warring sides.","ko":"그 나라는 두 교전국 사이에서 중립을 유지하려고 했다.","answer":["neutral","between"],"hint":"형용사 + 전치사 between"},{"sentence":"The teacher stayed _____ _____ the debate to hear both opinions.","ko":"선생님은 양쪽 의견을 듣기 위해 그 토론에서 중립을 지켰다.","answer":["neutral","in"],"hint":"형용사 + 전치사 in"}]},
    {"id":"w04324","w":"newly","pos":["adv"],"ph":"/ˈnjuːli/","cefr":"B1","kr":["새로","최근에"],"ex":[{"en":"She is newly married.","ko":"그녀는 최근에 결혼했다."}],"mnemonic":{"soundHint":"뉴리 → new(새로운) + ly","story":"new(새로운) + ly(부사) = 새로! newly married(신혼).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"recently","ko":"최근에","reason":"동의 관계"},{"w":"freshly","ko":"새롭게","reason":"동의 관계"},{"w":"new","ko":"새로운","reason":"형용사 짝"}],"collocBest":[]},"nuance":{"koSimple":"막 새로·최근에.","whenToUse":"새로 지은·최근 결혼한 것을 말할 때."},"krDetail":[{"ko":"새로","explain":"이전에는 없던 것이 이제 막 있게 되도록"},{"ko":"최근에","explain":"지나온 시간 가운데 지금과 아주 가까운 때에"}],"usageExamples":[{"en":"They moved into a newly built apartment last month.","ko":"그들은 지난달 새로 지어진 아파트로 이사했다."},{"en":"Old customs slowly fade, but newly formed habits shape our daily lives.","ko":"오랜 관습은 서서히 사라지지만, 새로 만들어진 습관은 우리 일상을 만든다."}],"grammarNote":"newly는 주로 과거분사와 결합해 'newly + p.p.' 형태로 명사를 꾸민다. 학생들은 'new + p.p.(×)'로 쓰거나 'newly + 원형 동사(×)'로 잘못 배치한다.","grammarQuiz":[{"sentence":"The _____ _____ couple went on their honeymoon to Bali.","ko":"새로 결혼한 그 부부는 발리로 신혼여행을 떠났다.","answer":["newly","married"],"hint":"부사 newly + 과거분사"},{"sentence":"The book covers all _____ _____ scientific facts about the brain.","ko":"그 책은 뇌에 관한 새로 발견된 모든 과학적 사실을 다룬다.","answer":["newly","discovered"],"hint":"부사 newly + 과거분사"}]},
    {"id":"w04332","w":"nightclub","pos":["n"],"ph":"/ˈnaɪtklʌb/","cefr":"B1","kr":["나이트클럽"],"ex":[{"en":"They went to a nightclub.","ko":"그들은 나이트클럽에 갔다."}],"mnemonic":{"soundHint":"나이트클럽 → night + club","story":"night(밤) + club(클럽) = 밤에 가는 클럽 = 나이트클럽!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"club","ko":"클럽","reason":"동의 관계"},{"w":"bar","ko":"술집","reason":"시나리오 짝"},{"w":"dance","ko":"춤","reason":"시나리오 짝"}],"collocBest":[]},"nuance":{"koSimple":"밤에 술과 춤을 즐기는 곳.","whenToUse":"밤 유흥·클럽 장면 얘기할 때."},"krDetail":[{"ko":"나이트클럽","explain":"밤에 술과 음악, 춤을 즐길 수 있는 놀이 장소"}],"usageExamples":[{"en":"Many young people go to nightclubs on Saturday nights.","ko":"많은 젊은이들이 토요일 밤에 나이트클럽에 간다."},{"en":"Quiet cafes suit her mood, but loud nightclubs bore her quickly.","ko":"조용한 카페는 그녀의 기분에 어울리지만, 시끄러운 나이트클럽은 그녀를 금방 지루하게 한다."}],"grammarNote":"nightclub은 한 단어로 붙여 쓰며 가산 명사다. 학생들은 'night club'처럼 띄어 쓰거나 'go to nightclub(관사 누락)'로 실수한다. 'go clubbing(클럽에 놀러 가다)' 표현도 함께 알아 두자.","grammarQuiz":[{"sentence":"They went _____ _____ nightclub in downtown last Friday.","ko":"그들은 지난 금요일에 시내에 있는 나이트클럽에 갔다.","answer":["to","a"],"hint":"전치사 to + 부정관사 a"},{"sentence":"The _____ was so crowded _____ we could hardly dance.","ko":"그 나이트클럽은 너무 붐벼서 우리가 거의 춤을 출 수 없었다.","answer":["nightclub","that"],"hint":"명사 + so ~ that 접속사"}]},
    {"id":"w04333","w":"nightmare","pos":["n"],"ph":"/ˈnaɪtmer/","cefr":"B1","kr":["악몽","끔찍한 경험"],"ex":[{"en":"She had a terrible nightmare.","ko":"그녀는 끔찍한 악몽을 꿨다."}],"mnemonic":{"soundHint":"나이트메어 → night(밤) + mare(악령)","story":"night(밤) + mare(옛말 악령) = 밤의 악령 = 악몽!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bad dream","ko":"악몽","reason":"동의 관계"},{"w":"ordeal","ko":"시련","reason":"동의 관계"},{"w":"dream","ko":"꿈","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"자다가 꾸는 무서운 꿈.","whenToUse":"악몽 같은 상황·끔찍한 경험에."},"krDetail":[{"ko":"악몽","explain":"잠 속에서 무섭거나 괴로운 일이 생기는 나쁜 꿈"},{"ko":"끔찍한 경험","explain":"떠올리기조차 힘들 만큼 몹시 고통스러운 겪음"}],"usageExamples":[{"en":"She had a terrible nightmare about falling from a cliff.","ko":"그녀는 절벽에서 떨어지는 끔찍한 악몽을 꾸었다."},{"en":"The trip started as a dream, but the storm turned it into a nightmare.","ko":"그 여행은 꿈처럼 시작되었지만, 폭풍이 그것을 악몽으로 바꿨다."}],"grammarNote":"'have a nightmare(악몽을 꾸다)'가 관용 표현이며 'dream a nightmare(×)'는 어색하다. 학생들은 'nightmare of ~'와 'nightmare about ~'의 미묘한 차이를 어려워한다.","grammarQuiz":[{"sentence":"I _____ _____ terrible nightmare about being chased by wolves.","ko":"나는 늑대들에게 쫓기는 끔찍한 악몽을 꾸었다.","answer":["had","a"],"hint":"동사 have의 과거형 + 부정관사"},{"sentence":"Losing my passport abroad was _____ _____ nightmare for me.","ko":"해외에서 여권을 잃어버린 것은 나에게 완전히 악몽이었다.","answer":["a","total"],"hint":"부정관사 + 형용사 total"}]},
    {"id":"w04339","w":"noble","pos":["adj","n"],"ph":"/ˈnoʊbəl/","cefr":"B1","kr":["고귀한","귀족"],"ex":[{"en":"He has a noble character.","ko":"그는 고귀한 성품을 지녔다."}],"mnemonic":{"soundHint":"노블 → '노벨상'의 노벨","story":"'노벨(Nobel)'상! 고귀한 업적을 이룬 사람에게! noble = 고귀한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"honorable","ko":"명예로운","reason":"동의 관계"},{"w":"dignified","ko":"품위 있는","reason":"동의 관계"},{"w":"common","ko":"평범한","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"품격 있고 고귀한.","whenToUse":"고귀한 대의·귀족·훌륭한 성품에."},"krDetail":[{"ko":"고귀한","explain":"품격이 높고 마음이 반듯하여 우러러볼 만한"},{"ko":"귀족","explain":"옛날에 지위와 힘을 지녀 남달리 대접받던 사람들"}],"usageExamples":[{"en":"Helping the poor is a truly noble act.","ko":"가난한 사람을 돕는 것은 정말로 고귀한 행동이다."},{"en":"Some fought for money, but noble knights fought for honor and justice.","ko":"어떤 이들은 돈을 위해 싸웠지만, 고귀한 기사들은 명예와 정의를 위해 싸웠다."}],"grammarNote":"noble은 형용사·명사 모두 쓰이며 명사일 때는 관사 the와 함께 쓰여 'the noble(귀족들)'로 나타낸다. 학생들은 'a noble people(×)'처럼 어색한 표현을 쓰기 쉽다.","grammarQuiz":[{"sentence":"Fighting for freedom is _____ _____ noble cause.","ko":"자유를 위해 싸우는 것은 매우 고귀한 대의이다.","answer":["a","very"],"hint":"부정관사 + 강조 부사"},{"sentence":"_____ _____ often owned huge lands and controlled the peasants.","ko":"귀족들은 흔히 거대한 땅을 소유했고 소작농들을 지배했다.","answer":["The","nobles"],"hint":"정관사 The + 복수 명사"}]},
    {"id":"w04351","w":"nonsense","pos":["n"],"ph":"/ˈnɒnsens/","cefr":"B1","kr":["헛소리","말도 안 되는"],"ex":[{"en":"That is complete nonsense.","ko":"그것은 완전한 헛소리이다."}],"mnemonic":{"soundHint":"논센스 → non(부정) + sense(의미)","story":"non(부정) + sense(의미) = 의미 없는 = 헛소리! 상식 밖의 말.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"rubbish","ko":"쓰레기같은 말","reason":"동의 관계"},{"w":"absurdity","ko":"터무니없음","reason":"동의 관계"},{"w":"sense","ko":"일리","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"말도 안 되는 소리.","whenToUse":"어이없는 말·주장을 반박할 때."},"krDetail":[{"ko":"헛소리","explain":"이치에 맞지 않아 들을 가치가 없는 말"},{"ko":"말도 안 되는","explain":"앞뒤가 맞지 않아 도무지 받아들일 수 없는"}],"usageExamples":[{"en":"Stop talking nonsense and tell me the truth.","ko":"헛소리 그만하고 나에게 진실을 말해 줘."},{"en":"Some rumors are true, but most of them are absolute nonsense.","ko":"어떤 소문들은 사실이지만, 대부분은 완전히 헛소리다."}],"grammarNote":"nonsense는 불가산 명사라 'a nonsense(×), nonsenses(×)'로 쓰면 안 된다. 학생들은 'talk nonsense'에서 관사를 넣거나 'nonsense idea'처럼 잘못 결합한다.","grammarQuiz":[{"sentence":"What he said is _____ _____ nonsense; nobody believes it.","ko":"그가 말한 것은 완전히 헛소리이며, 아무도 그것을 믿지 않는다.","answer":["complete","nonsense"],"hint":"형용사 complete + 불가산 명사"},{"sentence":"Please don't _____ _____ me; I need serious advice right now.","ko":"제발 나에게 헛소리하지 마세요, 지금 진지한 조언이 필요합니다.","answer":["talk","nonsense"],"hint":"관용 표현 talk + 명사"}]},
    {"id":"w04354","w":"norm","pos":["n"],"ph":"/nɔːrm/","cefr":"B1","kr":["규범","기준"],"ex":[{"en":"Follow the social norm.","ko":"사회적 규범을 따라라."}],"mnemonic":{"soundHint":"놈 → normal(정상)의 어근","story":"normal(정상)의 어근 norm! 정상 기준 = 규범, 표준!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"standard","ko":"기준","reason":"동의 관계"},{"w":"rule","ko":"규칙","reason":"동의 관계"},{"w":"normal","ko":"정상적인","reason":"파생어 짝"}],"collocBest":[]},"nuance":{"koSimple":"모두가 따르는 사회적 기준.","whenToUse":"사회·문화 규범 얘기할 때."},"krDetail":[{"ko":"규범","explain":"사람들이 마땅히 지켜야 한다고 여기는 삶의 약속"},{"ko":"기준","explain":"판단이나 행동의 잣대가 되는 자리"}],"usageExamples":[{"en":"Wearing shoes indoors goes against Korean social norms.","ko":"실내에서 신발을 신는 것은 한국의 사회 규범에 어긋난다."},{"en":"Old cultural norms remain strong, but modern norms slowly reshape our lives.","ko":"오래된 문화적 규범은 여전히 강하지만, 현대적 규범이 서서히 우리 삶을 다시 만든다."}],"grammarNote":"'the norm(당연시되는 것)'은 관사 the가 필수인 관용 표현이다. 학생들은 'become a norm(×)'로 쓰거나, 'norms of + 사회'와 'norms in + 사회'를 혼동한다.","grammarQuiz":[{"sentence":"Wearing masks in public became _____ _____ during the pandemic.","ko":"대중교통 안에서 마스크를 쓰는 것이 유행병 시기에 일반적인 일이 되었다.","answer":["the","norm"],"hint":"정관사 the + 명사 (관용 표현)"},{"sentence":"Social _____ _____ Japan differ greatly from those in the West.","ko":"일본의 사회 규범은 서양의 규범과 크게 다르다.","answer":["norms","in"],"hint":"복수 명사 + 장소 전치사 in"}]},
    {"id":"w04368","w":"notification","pos":["n"],"ph":"/ˌnəʊtɪfɪˈkeɪʃən/","cefr":"B1","kr":["통보","알림","공지"],"ex":[{"en":"You will receive a notification when your order ships.","ko":"주문이 발송되면 알림을 받게 됩니다."}],"mnemonic":{"soundHint":"노티피케이션 → notify + cation","story":"'푸시 노티피케이션(push notification)'! 스마트폰 알림!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"notice","ko":"공지","reason":"동의 관계"},{"w":"alert","ko":"경보","reason":"동의 관계"},{"w":"notify","ko":"알리다","reason":"동사형 짝"}],"collocBest":[]},"nuance":{"koSimple":"뭔가 알려 주는 알림·통보.","whenToUse":"주문·앱 푸시 알림에."},"krDetail":[{"ko":"통보","explain":"결정된 내용을 정식으로 알려주는 일"},{"ko":"알림","explain":"어떤 소식을 다른 이에게 짧게 전해주는 말이나 신호"},{"ko":"공지","explain":"여러 사람에게 널리 알리려고 내는 안내"}],"usageExamples":[{"en":"I received a push notification about my flight delay.","ko":"나는 항공편 지연에 관한 푸시 알림을 받았다."},{"en":"Old letters brought news slowly, but modern notifications reach us instantly.","ko":"옛 편지는 소식을 천천히 전했지만, 요즘의 알림은 우리에게 즉시 도달한다."}],"grammarNote":"notification은 가산 명사로 관사·복수형이 필요하다. 학생들은 'receive notification(관사 누락)'로 쓰거나, 'notification about'과 'notification of'의 미묘한 차이를 어려워한다.","grammarQuiz":[{"sentence":"You will receive _____ _____ as soon as your order ships.","ko":"네 주문 상품이 배송되자마자 너는 알림을 받을 것이다.","answer":["a","notification"],"hint":"부정관사 + 가산 명사"},{"sentence":"I turned _____ all notifications _____ my phone to focus better.","ko":"나는 더 잘 집중하려고 내 휴대전화의 모든 알림을 껐다.","answer":["off","on"],"hint":"동사구 turn off + 장소 전치사 on"}]},
    {"id":"w04369","w":"notify","pos":["v"],"ph":"/ˈnəʊtɪfaɪ/","cefr":"B1","kr":["알리다","통보하다","신고하다"],"ex":[{"en":"Please notify us in advance if you plan to cancel.","ko":"취소할 계획이라면 미리 알려 주세요."}],"mnemonic":{"soundHint":"노티파이 → note(적다) + fy(만들다)","story":"note(메모) + fy(만들다) = 알림 만들다 = 알리다, 통보하다!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inform","ko":"알리다","reason":"동의 관계"},{"w":"alert","ko":"경보하다","reason":"동의 관계"},{"w":"conceal","ko":"숨기다","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"공식적으로 알려 주다.","whenToUse":"취소·변경을 미리 통보할 때."},"krDetail":[{"ko":"알리다","explain":"다른 사람이 알 수 있도록 소식이나 사실을 전해주다"},{"ko":"통보하다","explain":"결정된 내용을 정식으로 알려주다"},{"ko":"신고하다","explain":"일이 벌어졌음을 관계있는 사람이나 기관에 알리다"}],"usageExamples":[{"en":"Please notify the office if you cannot come to work.","ko":"출근할 수 없다면 사무실에 알려 주세요."},{"en":"The school informs parents by letter, but urgent cases are notified by text.","ko":"학교는 편지로 부모에게 알리지만, 급한 경우는 문자로 통보한다."}],"grammarNote":"'notify + 사람 + of/about 사실' 구조가 정석이다. 학생들은 'notify to 사람(×)'로 쓰거나, 'notify 사실 to 사람(×)'처럼 목적어 어순을 잘못 배치한다.","grammarQuiz":[{"sentence":"Please _____ _____ immediately if the situation changes tomorrow.","ko":"내일 상황이 바뀌면 즉시 저에게 알려 주세요.","answer":["notify","me"],"hint":"동사원형 + 목적어(사람)"},{"sentence":"The manager _____ all staff _____ the schedule change yesterday.","ko":"그 관리자는 어제 모든 직원에게 일정 변경을 통보했다.","answer":["notified","of"],"hint":"동사 과거형 + 전치사 of"}]},
    {"id":"w04375","w":"novelist","pos":["n"],"ph":"/ˈnɒvəlɪst/","cefr":"B1","kr":["소설가"],"ex":[{"en":"She became a novelist.","ko":"그녀는 소설가가 되었다."}],"mnemonic":{"soundHint":"노블리스트 → novel(소설) + ist(사람)","story":"novel(소설) + ist(사람) = 소설 쓰는 사람 = 소설가!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"author","ko":"작가","reason":"동의 관계"},{"w":"writer","ko":"작가","reason":"동의 관계"},{"w":"novel","ko":"소설","reason":"파생어 짝"}],"collocBest":[]},"nuance":{"koSimple":"소설을 쓰는 작가.","whenToUse":"작가 직업·데뷔 소식 얘기할 때."},"krDetail":[{"ko":"소설가","explain":"이야기를 지어 소설을 쓰는 일을 하는 사람"}],"usageExamples":[{"en":"The famous novelist wrote her first book at age twenty.","ko":"그 유명한 소설가는 스무 살 때 자신의 첫 책을 썼다."},{"en":"Poets shape emotion in a few lines, but novelists build whole worlds through stories.","ko":"시인은 몇 줄로 감정을 그려 내지만, 소설가는 이야기를 통해 온전한 세계를 짓는다."}],"grammarNote":"novelist는 사람 명사라 관사·복수형이 필요하다. 학생들은 'novelist(가산)'과 'novel'을 혼동하거나 'a novelist writes novel(×)'처럼 관사·복수형을 빠뜨린다.","grammarQuiz":[{"sentence":"She dreams of becoming _____ famous _____ someday.","ko":"그녀는 언젠가 유명한 소설가가 되기를 꿈꾼다.","answer":["a","novelist"],"hint":"부정관사 + 형용사 famous + 명사"},{"sentence":"The _____ received a prize _____ her latest historical novel.","ko":"그 소설가는 자신의 최신 역사 소설로 상을 받았다.","answer":["novelist","for"],"hint":"명사 + 이유 전치사 for"}]},
    {"id":"w04380","w":"nowhere","pos":["adv"],"ph":"/ˈnoʊwer/","cefr":"B1","kr":["아무데도 없는","어디에도"],"ex":[{"en":"There is nowhere to go.","ko":"갈 곳이 아무데도 없다."}],"mnemonic":{"soundHint":"노웨어 → no(없다) + where(어디)","story":"no(없다) + where(어디) = 어디에도 없는! out of nowhere(갑자기).","hintConfidence":3},"pairs":{"buddyWords":[{"w":"somewhere","ko":"어딘가에","reason":"반의 관계"},{"w":"everywhere","ko":"어디에나","reason":"반의 관계"},{"w":"anywhere","ko":"어디에나","reason":"짝 관계"}],"collocBest":[]},"nuance":{"koSimple":"어디에도 없는·아무 데도.","whenToUse":"갈 곳 없음·갑작스러움 표현할 때."},"krDetail":[{"ko":"아무데도 없는","explain":"어느 자리에도 있지 않아 찾을 수 없는"},{"ko":"어디에도","explain":"어떤 곳을 짚어도 그러하지 않은"}],"usageExamples":[{"en":"Suddenly, a strange dog appeared out of nowhere.","ko":"갑자기, 이상한 개 한 마리가 어디선가 불쑥 나타났다."},{"en":"I searched everywhere in the house, but the keys were nowhere to be found.","ko":"나는 집 안 모든 곳을 뒤졌지만, 열쇠는 어디에서도 찾을 수 없었다."}],"grammarNote":"nowhere는 부정어라서 이미 부정 뜻을 담고 있으므로 'not ~ nowhere(이중부정)'는 금지다. 학생들은 문두 nowhere가 오면 도치가 일어나는 것을 자주 놓친다.","grammarQuiz":[{"sentence":"The lost cat came back _____ _____ nowhere last night.","ko":"그 잃어버린 고양이가 어젯밤 갑자기 어디선가 돌아왔다.","answer":["out","of"],"hint":"관용 표현 out of + nowhere"},{"sentence":"_____ _____ I find such a beautiful painting in this town.","ko":"이 마을 어디에서도 나는 그렇게 아름다운 그림을 찾을 수 없다.","answer":["Nowhere","can"],"hint":"부정어 문두 도치, 조동사 can 앞으로"}]},
    {"id":"w04390","w":"numerous","pos":["adj"],"ph":"/ˈnjuːmərəs/","cefr":"B1","kr":["수많은","많은"],"ex":[{"en":"He made numerous mistakes.","ko":"그는 수많은 실수를 했다."}],"mnemonic":{"soundHint":"누머러스 → number(숫자) + ous","story":"number(숫자) + ous(많은) = 숫자가 많은 = 수많은!","hintConfidence":3},"pairs":{"buddyWords":[{"w":"many","ko":"많은","reason":"동의 관계"},{"w":"various","ko":"다양한","reason":"동의 관계"},{"w":"few","ko":"적은","reason":"반의 관계"}],"collocBest":[]},"nuance":{"koSimple":"셀 수 없을 만큼 많은.","whenToUse":"실수·예시가 아주 많을 때."},"krDetail":[{"ko":"수많은","explain":"일일이 다 세기 어려울 만큼 아주 많은"},{"ko":"많은","explain":"그 수가 상당히 많은"}],"usageExamples":[{"en":"She has visited numerous countries during her travels.","ko":"그녀는 여행 동안 수많은 나라를 방문했다."},{"en":"Only a few tried the challenge, but numerous students later joined the program.","ko":"처음에는 소수만 도전했지만, 이후 수많은 학생들이 그 프로그램에 참여했다."}],"grammarNote":"numerous 뒤에는 반드시 복수 명사가 온다. 학생들은 'numerous time(×), numerous a book(×)'처럼 쓰거나, 'a numerous(×)'로 관사를 붙이는 실수를 한다.","grammarQuiz":[{"sentence":"The scientist conducted _____ _____ before finally reaching the correct answer.","ko":"그 과학자는 마침내 정답에 도달하기 전까지 수많은 실험을 했다.","answer":["numerous","experiments"],"hint":"형용사 + 복수 명사"},{"sentence":"_____ _____ have shown that regular exercise improves brain function greatly.","ko":"수많은 연구는 규칙적인 운동이 뇌 기능을 크게 향상시킨다는 것을 보여 왔다.","answer":["Numerous","studies"],"hint":"형용사 + 복수 명사 (문두)"}]},
    {"id":"w04391","w":"nun","pos":["n"],"ph":"/nʌn/","cefr":"B1","kr":["수녀","수도자"],"ex":[{"en":"The nun dedicated her life to serving the poor.","ko":"그 수녀는 가난한 사람들을 섬기는 데 일생을 바쳤다."}],"mnemonic":{"soundHint":"넌 → '넌(you)' 수녀","story":"'넌 수녀야?' 짧고 강한 발음. nun = 수녀, monk와 짝.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"sister","ko":"수녀","reason":"동의 관계"},{"w":"monk","ko":"수도승","reason":"짝 관계"},{"w":"convent","ko":"수녀원","reason":"시나리오 짝"}],"collocBest":[]},"nuance":{"koSimple":"평생 종교에 헌신한 여성.","whenToUse":"수녀·수도 생활 얘기할 때."},"krDetail":[{"ko":"수녀","explain":"가톨릭에서 평생 하느님을 섬기기로 하고 모인 여성"},{"ko":"수도자","explain":"속세를 떠나 종교의 길을 걸으며 몸과 마음을 닦는 사람"}],"usageExamples":[{"en":"She decided to become a nun after finishing college.","ko":"그녀는 대학을 마친 뒤 수녀가 되기로 결심했다."},{"en":"Monks live in monasteries, while nuns often serve in convents.","ko":"수도사들은 수도원에서 살지만, 수녀들은 흔히 수녀원에서 봉사한다."}],"grammarNote":"'become a nun(수녀가 되다)'에서 관사 a가 필수다. 학생들은 'become nun(×)'로 관사를 빠뜨리거나 'nun'과 'none(아무도 아닌)'의 철자·발음을 혼동한다.","grammarQuiz":[{"sentence":"She left her family _____ become _____ nun in Italy.","ko":"그녀는 이탈리아에서 수녀가 되기 위해 가족을 떠났다.","answer":["to","a"],"hint":"to부정사 + 부정관사"},{"sentence":"The _____ _____ the poor children in the small village.","ko":"그 수녀들은 작은 마을의 가난한 아이들을 돕는다.","answer":["nuns","help"],"hint":"복수 명사 + 복수 동사"}]},

function promoteBox(id){

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

const SFX = {
  // jp-pachinko-hit: 1200Hz sine 100ms 빠른 감쇠
  correct(){

const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

   ============================================================ */
function toast(msg, cls=""){
  const wrap = document.getElementById("toastWrap");
  const t = document.createElement("div");
  t.className = "toast " + cls;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 1900);
}

/* ============================================================
   HEADER
   ============================================================ */
function renderHeader(){
  document.getElementById("xpVal").textContent = state.xp;
  document.getElementById("streakVal").textContent = state.streak;

  // dots
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  const total = DATA.chapter.totalCount;
  for(let i=0;i<total;i++){
    const d = document.createElement("div");
    d.className = "dot";
    if(state.phase === "study"){
      if(i < state.cardIdx) d.classList.add("done");
      else if(i === state.cardIdx) d.classList.add("current");
    } else if(state.phase === "quiz" || state.phase === "result"){
      d.classList.add("done");
    }
    dots.appendChild(d);
  }
  // pbar
  let pct = 0;
  if(state.phase === "study") pct = (state.cardIdx / total) * 60;
  else if(state.phase === "quiz") pct = 60 + (state.quizIdx / 15) * 35;
  else if(state.phase === "result") pct = 100;
  document.getElementById("pbarFill").style.width = pct + "%";

  // sfx
  document.getElementById("sfxBtn").textContent = state.sfxOn ? "🔊" : "🔇";
  document.getElementById("sfxBtn").classList.toggle("on", state.sfxOn);
  document.getElementById("cbBtn").classList.toggle("on", state.cbMode);
}

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function flipCard(){
  const card = document.getElementById("flipcard");
  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}
