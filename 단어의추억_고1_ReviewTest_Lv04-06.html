    {"id":"w02298","w":"factor","pos":["n","v"],"ph":"/ˈfæktər/","cefr":"B1","kr":["요인","요소"],"ex":[{"en":"Diet is an important factor in maintaining health.","ko":"식이요법은 건강 유지에 중요한 요인이다."}],"mnemonic":{"soundHint":"팩터","story":"fact(사실) + -or = 결과를 만드는 사실, 요인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"element","ko":"요소","reason":"동의어 - 구성 요소"},{"w":"component","ko":"구성 요소","reason":"동의어 - 부품·요소"},{"w":"aspect","ko":"측면","reason":"동의어 - 한 측면"}],"collocBest":[]},"nuance":{"koSimple":"결과에 영향을 주는 요소.","whenToUse":"원인·조건 중 하나를 짚을 때."},"krDetail":[{"ko":"요인","explain":"어떤 일에 영향을 주는 까닭"},{"ko":"요소","explain":"어떤 것을 이루는 낱낱의 부분"}],"usageExamples":[{"en":"Weather is a key factor in tomorrow's outdoor concert.","ko":"날씨는 내일 야외 콘서트의 핵심 요인이다."},{"en":"Many factors must be considered before making the decision.","ko":"그 결정을 내리기 전에 많은 요인들이 고려되어야 한다."}],"grammarNote":"factor는 셀 수 있는 명사이며, factor in (동사구, ~을 고려하다)이나 the deciding factor (결정적 요인) 같은 표현도 함께 익혀둔다.","grammarQuiz":[{"sentence":"Price is an important _____ when choosing a new smartphone.","ko":"가격은 새 스마트폰을 고를 때 중요한 요인이다.","answer":["factor"],"hint":"an과 형용사 important 뒤이므로 단수 명사"},{"sentence":"Several _____ affected the final result of the experiment yesterday.","ko":"여러 요인들이 어제 그 실험의 최종 결과에 영향을 미쳤다.","answer":["factors"],"hint":"Several 뒤이므로 복수형 명사"}]},
    {"id":"w01996","w":"electronic","pos":["adj"],"ph":"/ɪˌlɛkˈtrɒnɪk/","cefr":"B1","kr":["전자의","전자기기의"],"ex":[{"en":"Electronic devices are everywhere.","ko":"전자기기는 어디에나 있다."}],"mnemonic":{"soundHint":"일렉트로닉","story":"electron(전자) + -ic = 전자기기의, 전자의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"digital","ko":"디지털의","reason":"동의어 관계"},{"w":"device","ko":"기기","reason":"전자기기 시나리오"},{"w":"circuit","ko":"회로","reason":"전자 관련 핵심어"}],"collocBest":[]},"nuance":{"koSimple":"반도체·회로로 작동하는 전자기기의.","whenToUse":"스마트폰·컴퓨터 같은 전자기기 얘기할 때."},"krDetail":[{"ko":"전자로 움직이는","explain":"반도체·회로로 신호를 처리하는"},{"ko":"전자기기의","explain":"컴퓨터·휴대폰처럼 회로로 작동하는 기계에 관한"}],"usageExamples":[{"en":"She bought a new electronic device online.","ko":"그녀는 온라인으로 새 전자기기를 샀다."},{"en":"All the data is stored in an electronic format.","ko":"모든 자료는 전자적 형식으로 저장된다."}],"grammarNote":"electronic은 회로·디지털 기술을 강조하고, electrical은 전기 공급·배선을 강조한다. electronic mail = e-mail의 정식 표기라는 점을 기억하자.","grammarQuiz":[{"sentence":"Most students prefer _____ books _____ they can carry easily.","ko":"대부분의 학생들은 쉽게 들고 다닐 수 있는 전자책을 선호한다.","answer":["electronic","because"],"hint":"형용사 + 이유 접속사"}]},
    {"id":"w02000","w":"elementary","pos":["adj"],"ph":"/ˌɛlɪˈmɛntəri/","cefr":"B1","kr":["기본적인","초등의"],"ex":[{"en":"This is an elementary concept.","ko":"이것은 기본적인 개념이다."}],"mnemonic":{"soundHint":"엘리멘터리","story":"element(요소) + -ary = 요소 수준의 → 기본적인, 초등의.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"basic","ko":"기본의","reason":"동의어"},{"w":"advanced","ko":"고급의","reason":"반의어"},{"w":"primary","ko":"초등의","reason":"학교급 관련 동의어"}],"collocBest":[]},"nuance":{"koSimple":"기초 단계의, 아주 기본적인.","whenToUse":"초등학교·기초 수준 개념을 말할 때."},"krDetail":[{"ko":"가장 기초의","explain":"처음 배워야 할 가장 쉬운 단계의"},{"ko":"초등학교의","explain":"만 6세부터 다니는 학교에 관한"}],"usageExamples":[{"en":"The teacher explained an elementary rule of grammar.","ko":"선생님은 문법의 기본 규칙을 설명했다."},{"en":"My sister still goes to elementary school.","ko":"내 여동생은 아직 초등학교에 다닌다."}],"grammarNote":"elementary는 명사 앞에서 형용사로만 쓰이며, 서술적 용법(be elementary)은 '아주 쉽다'는 관용 표현으로 제한된다. 부사형은 없다.","grammarQuiz":[{"sentence":"This problem is so _____ _____ even a child can solve it.","ko":"이 문제는 매우 기초적이라 어린아이도 풀 수 있다.","answer":["elementary","that"],"hint":"so ~ that 구문"}]},
    {"id":"w02178","w":"evil","pos":["adj","n"],"ph":"/ˈiːvəl/","cefr":"B1","kr":["악한","악"],"ex":[{"en":"He was an evil man.","ko":"그는 악한 사람이었다."}],"mnemonic":{"soundHint":"이~블","story":"'이~ 이블(evil) 자식!' 나쁜 놈 부를 때 = evil.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"wicked","ko":"사악한","reason":"동의어"},{"w":"good","ko":"선한","reason":"반의어"},{"w":"villain","ko":"악당","reason":"악 시나리오 캐릭터"}],"collocBest":[]},"nuance":{"koSimple":"남을 해치는 아주 나쁜 것.","whenToUse":"윤리·종교적으로 크게 잘못된 것을 말할 때."},"krDetail":[{"ko":"나쁜 마음의","explain":"남에게 해를 끼치려는 뜻을 지닌"},{"ko":"옳지 못함","explain":"도덕에 어긋나 사람들을 해치는 성질"}],"usageExamples":[{"en":"The villain had an evil plan in mind.","ko":"그 악당은 마음속에 사악한 계획을 품고 있었다."},{"en":"Money is often called the root of all evil.","ko":"돈은 흔히 모든 악의 뿌리라고 불린다."}],"grammarNote":"evil은 형용사·명사로 모두 쓰인다. 명사로 쓸 때 셀 수 없는 명사(개념적 악)와 셀 수 있는 명사(구체적 악행) 두 용법이 있다. 비교급은 more evil, most evil이다.","grammarQuiz":[{"sentence":"Some believe that good will _____ overcome _____ .","ko":"어떤 이들은 선이 결국 악을 이길 것이라고 믿는다.","answer":["always","evil"],"hint":"빈도부사 + 명사"}]},
    {"id":"w01975","w":"effective","pos":["adj"],"ph":"/ɪˈfɛktɪv/","cefr":"B1","kr":["효과적인","실질적인"],"ex":[{"en":"This method is very effective.","ko":"이 방법은 매우 효과적이다."}],"mnemonic":{"soundHint":"이펙티브","story":"effect(효과) + -ive = 효과를 내는 → 효과적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"efficient","ko":"효율적인","reason":"effective의 동의어"},{"w":"ineffective","ko":"효과 없는","reason":"effective의 반의어(접두사 in-)"},{"w":"solution","ko":"해결책","reason":"effective solution 필수 콜로케이션 짝"}],"collocBest":[]},"nuance":{"koSimple":"원하는 결과를 잘 내는.","whenToUse":"방법·약이 잘 통할 때."},"krDetail":[{"ko":"효과적인","explain":"바라는 결과를 잘 내는"},{"ko":"실질적인","explain":"겉이 아니라 실제로 도움이 되는"}],"usageExamples":[{"en":"Regular exercise is an effective way to reduce stress.","ko":"규칙적인 운동은 스트레스를 줄이는 효과적인 방법이다."},{"en":"The new law will be effective from next January onwards.","ko":"새 법은 내년 1월부터 발효될 것이다."}],"grammarNote":"effective(효과적인)와 efficient(효율적인)를 구분하세요. effective는 결과에 초점, efficient는 과정(자원 소모)에 초점을 둡니다.","grammarQuiz":[{"sentence":"This is the most _____ way _____ solve the problem quickly.","ko":"이것은 그 문제를 빠르게 해결하는 가장 효과적인 방법이다.","answer":["effective","to"],"hint":"형용사 최상급 + to부정사"}]},
    {"id":"w02042","w":"employ","pos":["v"],"ph":"/ɪmˈplɔɪ/","cefr":"B1","kr":["고용하다","사용하다"],"ex":[{"en":"They employ over 500 workers.","ko":"그들은 500명 이상의 직원을 고용한다."}],"mnemonic":{"soundHint":"임플로이","story":"'임(임금) 주고 플레이(일)시켜라' → 사람을 고용하다 employ.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"hire","ko":"고용하다","reason":"동의어"},{"w":"fire","ko":"해고하다","reason":"반의어"},{"w":"employee","ko":"직원","reason":"고용 시나리오 파생어"}],"collocBest":[]},"nuance":{"koSimple":"사람을 뽑아 쓰거나 방법을 활용하다.","whenToUse":"회사가 직원을 채용하거나 특정 기법을 쓸 때."},"krDetail":[{"ko":"일자리를 주다","explain":"돈을 주고 사람을 일하도록 뽑아 쓰다"},{"ko":"써먹다","explain":"어떤 방법·기술을 목적을 위해 활용하다"}],"usageExamples":[{"en":"The company employs over 500 workers.","ko":"그 회사는 500명이 넘는 직원을 고용하고 있다."},{"en":"Many workers are employed on short-term contracts.","ko":"많은 근로자들이 단기 계약으로 고용되어 있다."}],"grammarNote":"employ는 대표적 자·타 겸용 아님. 목적어를 반드시 취하는 타동사로, '~에 고용되다'는 be employed by/as 형태로 쓴다. employ A as B 구조도 자주 출제된다.","grammarQuiz":[{"sentence":"She is _____ _____ a translator at a global company.","ko":"그녀는 국제 기업에서 번역가로 고용되어 있다.","answer":["employed","as"],"hint":"수동태 + 자격 전치사"}]},
    {"id":"w01902","w":"drown","pos":["v"],"ph":"/draʊn/","cefr":"B1","kr":["익사하다","물에 빠지다","빠져들다"],"ex":[{"en":"The child nearly drowned in the swimming pool.","ko":"아이는 수영장에서 거의 익사할 뻔했다."}],"mnemonic":{"soundHint":"'드라운(down 연상)' → 물속으로 down","story":"물속으로 down(내려가) 잠기다 → drown(익사하다)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"rescue","ko":"구조하다","reason":"drown(익사하다)의 반의 짝"},{"w":"submerge","ko":"잠기다","reason":"drown의 동의어"},{"w":"debt","ko":"빚","reason":"drown in debt 비유적 콜로케이션 짝"}],"collocBest":[]},"nuance":{"koSimple":"물속에 잠겨 숨을 못 쉬다.","whenToUse":"익사 사고나 '~에 빠져 허덕이다' 비유로."},"krDetail":[{"ko":"익사하다","explain":"물에 빠져 숨이 막혀 죽다"},{"ko":"물에 빠지다","explain":"물속으로 잠겨 들어가다"},{"ko":"빠져들다","explain":"어떤 상태에 깊이 잠기다"}],"usageExamples":[{"en":"The strong swimmer saved a child from drowning in the lake.","ko":"그 힘센 수영 선수는 호수에서 익사할 뻔한 아이를 구했다."},{"en":"He was drowned by the huge wave near the rocky beach.","ko":"그는 바위 해변 근처에서 거대한 파도에 익사했다."}],"grammarNote":"drown은 자동사(익사하다)와 타동사(익사시키다) 겸용입니다. 사고로 익사한 경우 수동태 'be drowned', 자연스러운 상황은 능동태 drown을 씁니다.","grammarQuiz":[{"sentence":"Two people _____ _____ during the sudden flood last summer.","ko":"두 사람이 지난여름 갑작스러운 홍수 때 익사했다.","answer":["were","drowned"],"hint":"수동태 (be동사 + 과거분사)"}]},
    {"id":"w02279","w":"extreme","pos":["adj","n"],"ph":"/ɪkˈstriːm/","cefr":"B1","kr":["극도의","극단"],"ex":[{"en":"Avoid extreme temperatures.","ko":"극도의 온도를 피하라."}],"mnemonic":{"soundHint":"익스트림","story":"'익스트림 스포츠'라는 외래어로 자주 접하며 '극한·극도의'를 뜻함","hintConfidence":3},"pairs":{"buddyWords":[{"w":"intense","ko":"강렬한","reason":"동의어 - 강도가 극도로 높음"},{"w":"severe","ko":"심각한","reason":"동의어 - 정도가 심함"},{"w":"moderate","ko":"적당한","reason":"반의어 - 극단 vs 적당"}],"collocBest":[{"en":"extreme weather","ko":"극단적인 날씨"},{"en":"extreme sport","ko":"익스트림 스포츠"}]},"nuance":{"koSimple":"정도가 지나치게 심한.","whenToUse":"날씨·스포츠·의견이 극단적일 때."},"krDetail":[{"ko":"극도의","explain":"더는 나아갈 수 없는"},{"ko":"극단","explain":"맨 끝에 다다른 자리"}],"usageExamples":[{"en":"The climbers faced extreme cold near the top of Everest.","ko":"그 등반가들은 에베레스트 정상 근처에서 극도의 추위를 마주했다."},{"en":"He tends to go to extremes in everything he does.","ko":"그는 자신이 하는 모든 일에서 극단으로 치닫는 경향이 있다."}],"grammarNote":"extreme의 부사형은 extremely (극도로)이며 형용사·부사·다른 부사를 꾸민다. go to extremes (극단으로 치닫다)는 관용구로 복수형으로만 쓴다.","grammarQuiz":[{"sentence":"The desert has _____ temperatures during the day and night.","ko":"그 사막은 낮과 밤 동안 극단적인 기온을 지닌다.","answer":["extreme"],"hint":"명사(temperatures) 앞이므로 형용사 형태"},{"sentence":"The final exam was _____ difficult for most of the students.","ko":"그 기말시험은 대부분의 학생들에게 극도로 어려웠다.","answer":["extremely"],"hint":"형용사(difficult)를 꾸미므로 부사 형태"}]},
    {"id":"w01993","w":"electrical","pos":["adj"],"ph":"/ɪˈlektrɪkl/","cefr":"B1","kr":["전기의","전기적인"],"ex":[{"en":"There was an electrical fault in the building.","ko":"건물에 전기 결함이 있었다."}],"mnemonic":{"soundHint":"일렉트리컬","story":"electric(전기) + -al = 전기의, 전기적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"electric","ko":"전기의","reason":"거의 동의어"},{"w":"current","ko":"전류","reason":"전기 관련 시나리오"},{"w":"wire","ko":"전선","reason":"전기 시나리오 핵심어"}],"collocBest":[]},"nuance":{"koSimple":"전기로 움직이거나 전기와 관련된.","whenToUse":"전선·회로·전기 설비 이야기할 때."},"krDetail":[{"ko":"전기와 관련된","explain":"전기를 쓰거나 다루는 장치·일에 관한"},{"ko":"전기로 움직이는","explain":"전류를 사용하여 작동하는 성질의"}],"usageExamples":[{"en":"He fixes electrical appliances at the shop.","ko":"그는 가게에서 전기 제품을 수리한다."},{"en":"The building was damaged by an electrical fire.","ko":"그 건물은 전기 화재로 손상되었다."}],"grammarNote":"electrical은 '전기와 관련된(engineer, appliance)'의 넓은 의미, electric은 '전기로 작동하는(car, guitar)'의 좁은 의미로 쓰인다. electronic은 '전자 회로의(device)'로 구별한다.","grammarQuiz":[{"sentence":"The _____ engineer checked every wire _____ was hidden behind the wall.","ko":"그 전기 기사는 벽 뒤에 숨겨진 모든 배선을 점검했다.","answer":["electrical","that"],"hint":"형용사 + 관계대명사(주격)"}]},
    {"id":"w02247","w":"explanation","pos":["n"],"ph":"/ˌɛkspləˈneɪʃən/","cefr":"B1","kr":["설명","해명"],"ex":[{"en":"Give me a clear explanation.","ko":"명확한 설명을 해주세요."}],"mnemonic":{"soundHint":"익스플레네이션","story":"explain(설명하다) + -ation = 설명, 해명.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"clarification","ko":"설명","reason":"동의어 - 명확히 하는 설명"},{"w":"description","ko":"설명","reason":"동의어 - 서술적 설명"},{"w":"explain","ko":"설명하다","reason":"파생 관계 - 동사형"}],"collocBest":[]},"nuance":{"koSimple":"왜 그런지 알기 쉽게 풀어 말함.","whenToUse":"이유·원리를 자세히 밝힐 때."},"krDetail":[{"ko":"설명","explain":"잘 알아듣도록 밝혀 말함"},{"ko":"해명","explain":"잘못이나 오해에 대해 까닭을 밝힘"}],"usageExamples":[{"en":"The teacher gave us a clear explanation of the problem.","ko":"그 선생님은 우리에게 그 문제에 대한 명확한 설명을 해주셨다."},{"en":"The complex idea was clearly explained by the professor.","ko":"그 복잡한 개념은 교수님에 의해 명확하게 설명되었다."}],"grammarNote":"explanation은 셀 수 있는 명사이며, '~에 대한 설명'은 explanation of/for + 명사로 쓴다. (about은 쓰지 않는다는 점에 주의)","grammarQuiz":[{"sentence":"The teacher gave a clear _____ of the difficult grammar rule.","ko":"그 선생님은 어려운 문법 규칙에 대한 명확한 설명을 해주셨다.","answer":["explanation"],"hint":"관사 a와 형용사 clear 뒤이므로 명사 형태"},{"sentence":"Can you _____ why you were late for school today?","ko":"너는 오늘 학교에 왜 늦었는지 설명할 수 있니?","answer":["explain"],"hint":"조동사 Can 뒤이므로 동사 원형"}]},
    {"id":"w01964","w":"edge","pos":["n","v"],"ph":"/ɛdʒ/","cefr":"B1","kr":["가장자리","모서리"],"ex":[{"en":"He stood at the edge.","ko":"그는 가장자리에 섰다."}],"mnemonic":{"soundHint":"엣지—패션의 '엣지 있다'","story":"'엣지 있다'는 표현처럼 edge는 '가장자리/모서리'의 날카로움을 뜻한다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"border","ko":"경계","reason":"edge의 동의어"},{"w":"rim","ko":"테두리","reason":"edge의 동의어(둥근 것의 가장자리)"},{"w":"center","ko":"중심","reason":"edge(가장자리)의 반의어"}],"collocBest":[{"en":"cutting edge","ko":"최첨단"},{"en":"edge of a cliff","ko":"절벽 가장자리"}]},"nuance":{"koSimple":"물체나 공간의 맨 바깥쪽.","whenToUse":"절벽 끝·책상 모서리를 말할 때."},"krDetail":[{"ko":"가장자리","explain":"무엇의 둘레나 끝부분"},{"ko":"모서리","explain":"면과 면이 만나는 부분"}],"usageExamples":[{"en":"He edged the table slowly toward the center of the room.","ko":"그는 탁자를 방 가운데를 향해 천천히 밀어 옮겼다."},{"en":"The cliff's edge was covered with wild yellow flowers.","ko":"절벽의 가장자리는 노란 야생화로 덮여 있었다."}],"grammarNote":"edge는 자·타동사 겸용입니다. 타동사로 '가장자리를 두르다', 자동사로 'edge toward(~쪽으로 조금씩 나아가다)'가 자주 쓰입니다.","grammarQuiz":[{"sentence":"She stood right on the _____ _____ the swimming pool nervously.","ko":"그녀는 긴장한 채 수영장 가장자리에 바로 서 있었다.","answer":["edge","of"],"hint":"명사 + 소유 전치사 of"}]},
    {"id":"w01885","w":"drain","pos":["v","n"],"ph":"/dreɪn/","cefr":"B1","kr":["배수하다","하수구"],"ex":[{"en":"The water drained very slowly.","ko":"물이 매우 천천히 빠졌다."}],"mnemonic":{"soundHint":"'드레인' → 세면대 배수구","story":"세면대 물이 '드레인~' 하고 빠지는 그 배수구 = drain","hintConfidence":2},"pairs":{"buddyWords":[{"w":"empty","ko":"비우다","reason":"drain(배수하다)의 동의어"},{"w":"exhaust","ko":"고갈시키다","reason":"drain resources의 비유적 짝"},{"w":"fill","ko":"채우다","reason":"drain(비우다)의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"물을 빼거나 다 흘려보내다.","whenToUse":"싱크대·수영장 물을 뺄 때."},"krDetail":[{"ko":"배수하다","explain":"고인 물을 빼서 없애다"},{"ko":"하수구","explain":"쓴 물이나 빗물이 흘러가는 통로"}],"usageExamples":[{"en":"The farmer drains the field after every heavy rain.","ko":"그 농부는 폭우가 올 때마다 논에서 물을 뺀다."},{"en":"The battery is quickly drained by playing games all night.","ko":"배터리는 밤새 게임을 하면 빠르게 소모된다."}],"grammarNote":"drain은 자·타동사 겸용입니다. 타동사로 'drain A(A를 비우다)', 자동사로 'the color drained from her face(그녀의 얼굴에서 핏기가 가셨다)'처럼 씁니다.","grammarQuiz":[{"sentence":"The long journey completely _____ him _____ energy and hope.","ko":"긴 여정은 그에게서 완전히 힘과 희망을 빼앗았다.","answer":["drained","of"],"hint":"과거형 타동사 + 전치사 of"}]},
    {"id":"w02196","w":"exception","pos":["n"],"ph":"/ɪkˈsɛpʃən/","cefr":"B1","kr":["예외","제외"],"ex":[{"en":"There are no exceptions to this rule.","ko":"이 규칙에는 예외가 없다."}],"mnemonic":{"soundHint":"익셉션","story":"'ex(밖으로) + cept(잡다) + -ion' = 규칙 밖으로 빼낸 것, 예외.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"exclusion","ko":"제외","reason":"동의어 - 배제/제외를 의미"},{"w":"rule","ko":"규칙","reason":"반의어 - 규칙 vs 예외"},{"w":"except","ko":"~을 제외하고","reason":"어원 관계 - 같은 어근 cept"}],"collocBest":[]},"nuance":{"koSimple":"규칙에서 벗어난 유일한 경우.","whenToUse":"'예외 없이/예외적으로'를 강조할 때."},"krDetail":[{"ko":"예외","explain":"규칙에서 벗어남"},{"ko":"제외","explain":"따로 빼놓음"}],"usageExamples":[{"en":"The teacher made an exception for the sick student.","ko":"그 선생님은 아픈 학생을 위해 예외를 두었다."},{"en":"Every student passed the test without exception.","ko":"모든 학생이 예외 없이 시험에 통과했다."}],"grammarNote":"'~을 제외하고'는 with the exception of 또는 except for로 표현한다. make an exception (예외를 두다)과 without exception (예외 없이)는 관용 표현으로 통째로 외운다.","grammarQuiz":[{"sentence":"All the members came to the meeting without _____ yesterday.","ko":"모든 회원이 어제 예외 없이 회의에 왔다.","answer":["exception"],"hint":"without 뒤 명사, '예외 없이' 관용구"},{"sentence":"The rule applies to everyone with the _____ of children.","ko":"그 규칙은 어린이를 제외한 모두에게 적용된다.","answer":["exception"],"hint":"with the ___ of: ~을 제외하고 관용구"}]},
    {"id":"w02234","w":"expectation","pos":["n"],"ph":"/ˌɛkspɛkˈteɪʃən/","cefr":"B1","kr":["기대","예상"],"ex":[{"en":"She exceeded all expectations.","ko":"그녀는 모든 기대를 뛰어넘었다."}],"mnemonic":{"soundHint":"익스펙테이션","story":"expect(기대하다) + -ation = 기대, 예상.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"anticipation","ko":"기대","reason":"동의어 - 앞으로 있을 일을 기대"},{"w":"hope","ko":"희망","reason":"동의어 - 긍정적 기대"},{"w":"expect","ko":"기대하다","reason":"파생 관계 - 동사형"}],"collocBest":[]},"nuance":{"koSimple":"어떤 일이 이루어지길 미리 바라는 마음.","whenToUse":"'기대에 부응/기대를 뛰어넘다' 같은 표현에."},"krDetail":[{"ko":"기대","explain":"잘될 것이라고 바라는 마음"},{"ko":"예상","explain":"앞으로 일어날 일을 미리 짐작함"}],"usageExamples":[{"en":"The film exceeded all of our expectations last weekend.","ko":"그 영화는 지난 주말 우리의 모든 기대를 뛰어넘었다."},{"en":"He was born with high expectations placed upon him.","ko":"그는 높은 기대를 받으며 태어났다."}],"grammarNote":"expectation은 주로 복수형 expectations로 쓰인다. meet/live up to expectations (기대에 부응하다), against expectations (예상과 달리)로 자주 등장한다.","grammarQuiz":[{"sentence":"The new student's grades far exceeded the teacher's _____ .","ko":"그 새 학생의 성적은 선생님의 기대를 훨씬 넘어섰다.","answer":["expectations","expectation"],"hint":"the 뒤 명사, 보통 복수형이 자연스러움"},{"sentence":"We didn't _____ to see so many visitors at the museum.","ko":"우리는 그 박물관에서 그렇게 많은 방문객을 볼 것이라고 예상하지 못했다.","answer":["expect"],"hint":"didn't 뒤 동사원형, 뒤에 to부정사 목적어"}]},
    {"id":"w01990","w":"election","pos":["n"],"ph":"/ɪˈlɛkʃən/","cefr":"B1","kr":["선거","선출"],"ex":[{"en":"The election results were surprising.","ko":"선거 결과는 놀라웠다."}],"mnemonic":{"soundHint":"일렉션","story":"elect(선출하다) + -ion = 선출 행위, 선거.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"vote","ko":"투표","reason":"선거는 투표로 이루어짐 (동의)"},{"w":"campaign","ko":"선거 운동","reason":"선거 시나리오 핵심어"},{"w":"candidate","ko":"후보","reason":"선거에는 후보가 등장 (시나리오)"}],"collocBest":[]},"nuance":{"koSimple":"국민이 투표로 대표를 뽑는 일.","whenToUse":"대통령·국회의원 등 공식 선거를 말할 때."},"krDetail":[{"ko":"뽑기","explain":"여러 후보 중에서 대표를 골라 뽑는 일"},{"ko":"가려뽑음","explain":"투표로 어떤 자리에 앉을 사람을 정하는 절차"}],"usageExamples":[{"en":"The party will hold an election next month.","ko":"그 정당은 다음 달에 선거를 치를 것이다."},{"en":"A new president was elected by a wide margin.","ko":"새 대통령이 큰 표차로 선출되었다."}],"grammarNote":"명사 election은 동사 elect와 짝을 이룬다. '선거하다'는 hold an election, '선출되다'는 be elected로 표현하며, 명사와 동사를 혼동하지 않도록 주의한다.","grammarQuiz":[{"sentence":"The general _____ will _____ held in November across the country.","ko":"총선이 11월에 전국에서 치러질 것이다.","answer":["election","be"],"hint":"명사 형태와 미래 수동태 조동사"}]},
    {"id":"w01920","w":"duty","pos":["n"],"ph":"/ˈdjuːti/","cefr":"B1","kr":["의무","세금"],"ex":[{"en":"It is our duty to vote.","ko":"투표하는 것은 우리의 의무이다."}],"mnemonic":{"soundHint":"듀티프리(Duty-free)—면세점의 '듀티'","story":"공항의 '듀티프리'는 세금(duty)이 면제된 곳, duty는 '의무/세금'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"obligation","ko":"의무","reason":"duty의 대표 동의어"},{"w":"responsibility","ko":"책임","reason":"duty와 유사한 의무 개념"},{"w":"tax","ko":"세금","reason":"duty(세금)의 동의어, duty-free 문맥"}],"collocBest":[{"en":"sense of duty","ko":"의무감"},{"en":"on duty","ko":"근무 중인"}]},"nuance":{"koSimple":"꼭 해야 할 책임이나 세금.","whenToUse":"근무 중이거나 시민 의무를 말할 때."},"krDetail":[{"ko":"의무","explain":"마땅히 해야 하는 일"},{"ko":"세금","explain":"나라에 내는 돈, 특히 관세"}],"usageExamples":[{"en":"It is my duty to protect my younger sister.","ko":"여동생을 보호하는 것이 나의 의무이다."},{"en":"Voting is considered a civic duty in a democratic society.","ko":"투표는 민주 사회에서 시민의 의무로 여겨진다."}],"grammarNote":"duty는 셀 수 있는 명사로 duties(복수)가 가능합니다. 'on duty(근무 중)', 'off duty(비번)' 관용구는 관사 없이 씁니다.","grammarQuiz":[{"sentence":"The police officer was _____ _____ when the accident happened.","ko":"사고가 일어났을 때 경찰관은 근무 중이었다.","answer":["on","duty"],"hint":"전치사 + 명사 (관용구, 관사 없음)"}]},
    {"id":"w02319","w":"fame","pos":["n"],"ph":"/feɪm/","cefr":"B1","kr":["명성","유명"],"ex":[{"en":"The actor rose to fame after his first movie.","ko":"그 배우는 첫 번째 영화 이후 명성을 얻었다."}],"mnemonic":{"soundHint":"페임","story":"'페임(fame)!' 유명세로 돈 좀 만졌다는 명성 = fame.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"celebrity","ko":"유명인","reason":"연관어 - 명성 있는 사람"},{"w":"renown","ko":"명성","reason":"동의어 - 널리 알려진 명성"},{"w":"obscurity","ko":"무명","reason":"반의어 - 명성 vs 무명"}],"collocBest":[]},"nuance":{"koSimple":"많은 사람에게 이름이 알려진 상태.","whenToUse":"연예인·운동선수가 유명해질 때."},"krDetail":[{"ko":"명성","explain":"이름이 널리 알려짐"},{"ko":"유명","explain":"이름이 세상에 잘 알려짐"}],"usageExamples":[{"en":"The young singer's fame quickly spread all around the world.","ko":"그 젊은 가수의 명성은 전 세계로 빠르게 퍼졌다."},{"en":"He rose to fame after winning the big talent show.","ko":"그는 그 큰 오디션 프로그램에서 우승한 뒤 명성을 얻었다."}],"grammarNote":"fame은 셀 수 없는 명사로 부정관사 a를 쓰지 않는다. rise to fame (명성을 얻다), hall of fame (명예의 전당)은 굳어진 관용 표현이다.","grammarQuiz":[{"sentence":"The actor's _____ grew after his first successful movie role.","ko":"그 배우의 명성은 그의 첫 성공적인 영화 배역 이후 커졌다.","answer":["fame"],"hint":"소유격 뒤 명사, 셀 수 없는 명사(a 없음)"},{"sentence":"Many people work very hard to achieve _____ and fortune.","ko":"많은 사람이 명성과 부를 얻기 위해 매우 열심히 일한다.","answer":["fame"],"hint":"achieve의 목적어, 셀 수 없는 명사"}]},
    {"id":"w02254","w":"explosion","pos":["n"],"ph":"/ɪkˈspləʊʒən/","cefr":"B1","kr":["폭발","급증"],"ex":[{"en":"The explosion caused damage.","ko":"폭발이 피해를 입혔다."}],"mnemonic":{"soundHint":"익스플로전","story":"explode(폭발하다) + -sion = 폭발.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"blast","ko":"폭발","reason":"동의어 - 폭발의 순간"},{"w":"detonation","ko":"폭파","reason":"동의어 - 폭발 격식체"},{"w":"explode","ko":"폭발하다","reason":"파생 관계 - 동사형"}],"collocBest":[]},"nuance":{"koSimple":"쾅! 하고 터지는 사건 자체.","whenToUse":"폭발 현장이나 인구 폭증 같은 명사 표현에."},"krDetail":[{"ko":"폭발","explain":"터져서 세게 튀는 일"},{"ko":"급증","explain":"빠르게 크게 늘어남"}],"usageExamples":[{"en":"The loud explosion woke everyone in the small town.","ko":"그 큰 폭발이 작은 마을의 모두를 깨웠다."},{"en":"The population explosion has caused many social problems worldwide.","ko":"인구 폭발은 전 세계에 많은 사회 문제를 야기해 왔다."}],"grammarNote":"explosion은 셀 수 있는 명사이며, cause an explosion (폭발을 일으키다), 형용사 explosive (폭발적인)와 구분해서 기억한다.","grammarQuiz":[{"sentence":"A huge _____ was heard from the factory late last night.","ko":"어젯밤 늦게 그 공장에서 커다란 폭발이 들렸다.","answer":["explosion"],"hint":"A와 형용사 huge 뒤이므로 명사 형태"},{"sentence":"There has been an _____ in demand for electric cars.","ko":"전기차에 대한 수요의 폭발적 증가가 있어 왔다.","answer":["explosion"],"hint":"an 뒤 명사, 비유적 '급증'의 뜻"}]},
    {"id":"w02117","w":"equally","pos":["adv"],"ph":"/ˈiːkwəli/","cefr":"B1","kr":["동등하게","공평하게"],"ex":[{"en":"Everyone is treated equally.","ko":"모든 사람은 동등하게 대우받는다."}],"mnemonic":{"soundHint":"이퀄리","story":"equal(같은) + -ly = 동등하게, 공평하게.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"fairly","ko":"공평하게","reason":"동의어"},{"w":"unequally","ko":"불공평하게","reason":"반의어"},{"w":"evenly","ko":"고르게","reason":"동의어"}],"collocBest":[]},"nuance":{"koSimple":"똑같이, 차별 없이 골고루.","whenToUse":"공평·균등을 강조할 때."},"krDetail":[{"ko":"똑같이","explain":"정도나 양이 어느 한쪽에 치우치지 않게"},{"ko":"고르게","explain":"어느 쪽도 손해 보지 않도록 나뉜 상태로"}],"usageExamples":[{"en":"Both students performed equally well.","ko":"두 학생은 똑같이 잘 해냈다."},{"en":"The prize money was equally divided among them.","ko":"상금이 그들 사이에 균등하게 분배되었다."}],"grammarNote":"equally는 형용사·부사를 수식하는 부사이며 비교급을 만들지 못한다. 비슷한 강조 부사 as A as B와는 달리 equally + 형용사 단독으로 '똑같이 ~한'을 나타낸다.","grammarQuiz":[{"sentence":"Health and success are _____ important, but health _____ come first.","ko":"건강과 성공은 똑같이 중요하지만 건강이 우선되어야 한다.","answer":["equally","should"],"hint":"부사 + 당연 조동사"}]},
    {"id":"w02295","w":"facility","pos":["n"],"ph":"/fəˈsɪlɪti/","cefr":"B1","kr":["시설","설비"],"ex":[{"en":"The school has excellent sports facilities.","ko":"그 학교는 훌륭한 스포츠 시설을 갖추고 있다."}],"mnemonic":{"soundHint":"퍼실리티","story":"'퍼실~리(편리)+티' 편리하게 해주는 시설 = facility.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"amenity","ko":"편의시설","reason":"동의어 - 편의를 제공하는 시설"},{"w":"installation","ko":"설비","reason":"동의어 - 설치된 시설"},{"w":"service","ko":"서비스","reason":"연관어 - 시설이 제공하는 서비스"}],"collocBest":[]},"nuance":{"koSimple":"어떤 활동을 위해 갖춰진 설비나 장소.","whenToUse":"체육관·의료·연구 시설 같은 인프라를 말할 때."},"krDetail":[{"ko":"시설","explain":"일을 하기 위해 갖춘 건물이나 도구"},{"ko":"설비","explain":"필요한 것을 미리 갖춤"}],"usageExamples":[{"en":"The new medical facility opened downtown just last month.","ko":"그 새로운 의료 시설이 바로 지난달 시내에 문을 열었다."},{"en":"The sports facilities were built for public use.","ko":"그 스포츠 시설들은 대중이 이용할 수 있도록 지어졌다."}],"grammarNote":"facility는 셀 수 있는 명사이며 건물·시설을 뜻할 때는 흔히 복수형 facilities로 쓴다. 단수 facility는 '기능·능력·재능(a facility for languages)'의 뜻으로도 쓰인다.","grammarQuiz":[{"sentence":"Our school has excellent sports _____ for all the students.","ko":"우리 학교는 모든 학생을 위한 훌륭한 스포츠 시설들을 갖추고 있다.","answer":["facilities"],"hint":"여러 시설이므로 복수형 사용"},{"sentence":"This modern medical _____ is the largest in our small city.","ko":"이 현대적인 의료 시설은 우리의 작은 도시에서 가장 큰 것이다.","answer":["facility"],"hint":"This 뒤 단수 명사, 하나의 시설(건물)"}]},
    {"id":"w02176","w":"evidence","pos":["n"],"ph":"/ˈɛvɪdəns/","cefr":"B1","kr":["증거","근거"],"ex":[{"en":"There is no evidence of guilt.","ko":"유죄의 증거가 없다."}],"mnemonic":{"soundHint":"에비던스","story":"'에비(evil의 반대) + 던(뻔한) + 스' 명백하게 보이는 증거 = evidence.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"proof","ko":"증거","reason":"동의어"},{"w":"indication","ko":"표시","reason":"동의어"},{"w":"witness","ko":"목격자","reason":"증거 수집 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"주장을 뒷받침하는 확실한 근거.","whenToUse":"과학·수사·논증에서 근거 댈 때."},"krDetail":[{"ko":"밑받침이 되는 사실","explain":"어떤 주장이나 판단을 뒷받침하는 자료나 흔적"},{"ko":"뒷받침 자료","explain":"옳음을 보여 주려고 제시하는 구체적 증거"}],"usageExamples":[{"en":"Scientists collected strong evidence of climate change.","ko":"과학자들은 기후 변화의 확실한 증거를 모았다."},{"en":"There is no evidence to support the theory.","ko":"그 이론을 뒷받침할 증거가 없다."}],"grammarNote":"evidence는 셀 수 없는 명사로 an evidence, evidences로 쓰지 않는다. 수를 나타낼 때는 a piece of evidence, some evidence처럼 표현한다.","grammarQuiz":[{"sentence":"There is little _____ _____ the new drug is safe for children.","ko":"새 약이 아이들에게 안전하다는 증거가 거의 없다.","answer":["evidence","that"],"hint":"불가산 명사 + 동격 that절"}]},
    {"id":"w02133","w":"errand","pos":["n"],"ph":"/ˈɛrənd/","cefr":"B1","kr":["심부름","용무"],"ex":[{"en":"She ran errands for her mother.","ko":"그녀는 어머니를 위해 심부름을 했다."}],"mnemonic":{"soundHint":"에런드","story":"'에~ 런(run)!' 뛰어가 심부름하는 소리 = errand.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"task","ko":"일","reason":"동의어"},{"w":"chore","ko":"잡일","reason":"동의어"},{"w":"delivery","ko":"배달","reason":"심부름 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"밖에서 볼일 보러 잠깐 하는 일.","whenToUse":"심부름·자잘한 볼일 말할 때."},"krDetail":[{"ko":"잔심부름","explain":"짧은 시간에 다녀오는 작은 일거리"},{"ko":"가벼운 볼일","explain":"물건을 사거나 서류를 내는 등 잠깐의 용무"}],"usageExamples":[{"en":"I have to run an errand for my mother.","ko":"나는 어머니의 심부름을 다녀와야 한다."},{"en":"He is out doing some errands right now.","ko":"그는 지금 몇 가지 볼일을 보러 나가 있다."}],"grammarNote":"errand는 셀 수 있는 명사로 흔히 run/do an errand로 쓰인다. 복수형 errands와 함께 자주 등장하며, 관사 an이 붙는 이유는 첫 소리가 모음 /e/이기 때문이다.","grammarQuiz":[{"sentence":"Would you mind _____ an _____ to the post office for me?","ko":"저를 대신해 우체국에 심부름 좀 다녀와 주시겠어요?","answer":["running","errand"],"hint":"동명사 + 명사"}]},
    {"id":"w02088","w":"entertain","pos":["v"],"ph":"/ˌɛntərˈteɪn/","cefr":"B1","kr":["즐겁게 하다","접대하다"],"ex":[{"en":"The show entertained everyone.","ko":"그 쇼는 모두를 즐겁게 했다."}],"mnemonic":{"soundHint":"엔터테인","story":"'enter(들어와) + tain(잡다)' → 관심을 잡아 즐겁게 하다.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"amuse","ko":"즐겁게 하다","reason":"동의어"},{"w":"bore","ko":"지루하게 하다","reason":"반의어"},{"w":"guest","ko":"손님","reason":"접대 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"보고 웃게 만들거나 손님을 대접하다.","whenToUse":"공연으로 즐겁게 하거나 손님 대접할 때."},"krDetail":[{"ko":"재미있게 해 주다","explain":"노래·공연·이야기 등으로 지루하지 않게 해 주다"},{"ko":"손님을 맞이하다","explain":"집이나 자리에 초대해 음식과 이야기로 대접하다"}],"usageExamples":[{"en":"The clown entertained the children with tricks.","ko":"그 광대는 마술로 아이들을 즐겁게 했다."},{"en":"Guests were entertained with music and food.","ko":"손님들은 음악과 음식으로 접대받았다."}],"grammarNote":"entertain은 타동사로 반드시 목적어가 필요하다. 사람이 주어인 수동태 be entertained by/with 형태와, 명사 entertainment의 파생 관계를 함께 익힌다.","grammarQuiz":[{"sentence":"The children were _____ _____ a magician for two hours.","ko":"아이들은 두 시간 동안 마술사에게 즐거움을 얻었다.","answer":["entertained","by"],"hint":"수동태 + 행위자 전치사"}]},

    {"id":"w01961","w":"economy","pos":["n"],"ph":"/ɪˈkɒnəmi/","cefr":"B1","kr":["경제","절약"],"ex":[{"en":"The economy is recovering.","ko":"경제가 회복되고 있다."}],"mnemonic":{"soundHint":"이코노미 클래스—비행기 일반석","story":"비행기 '이코노미(economy) 클래스'는 절약형 좌석, economy는 '경제/절약'.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"market","ko":"시장","reason":"economy와 유사한 경제 개념"},{"w":"global","ko":"세계적인","reason":"global economy 필수 콜로케이션 짝"},{"w":"finance","ko":"재정","reason":"economy와 밀접한 재정 개념"}],"collocBest":[{"en":"global economy","ko":"세계 경제"},{"en":"economy class","ko":"이코노미 클래스"}]},"nuance":{"koSimple":"나라·사회의 돈이 도는 흐름.","whenToUse":"세계 경제·국내 경기를 말할 때."},"krDetail":[{"ko":"경제","explain":"돈과 물건이 오가는 사회의 살림살이"},{"ko":"절약","explain":"돈이나 시간을 아껴서 씀"}],"usageExamples":[{"en":"The global economy has been affected by rising oil prices.","ko":"세계 경제는 유가 상승에 영향을 받아 왔다."},{"en":"The teacher explained how the economy works to the students.","ko":"선생님은 학생들에게 경제가 어떻게 돌아가는지 설명했다."}],"grammarNote":"economy는 셀 수 있는 명사로 국가 경제 등을 뜻할 때는 the economy처럼 정관사를 씁니다. 형용사형은 economic(경제의) / economical(절약하는)입니다.","grammarQuiz":[{"sentence":"Korea has one of the largest _____ _____ Asia today.","ko":"한국은 오늘날 아시아에서 가장 큰 경제 중 하나이다.","answer":["economies","in"],"hint":"복수형(-y→-ies) + 장소 전치사"}]},
    {"id":"w02143","w":"essay","pos":["n"],"ph":"/ˈɛseɪ/","cefr":"B1","kr":["에세이","소논문"],"ex":[{"en":"She wrote a five-page essay.","ko":"그녀는 5페이지 분량의 에세이를 썼다."}],"mnemonic":{"soundHint":"에세이","story":"외래어 '에세이' 그대로 → 에세이","hintConfidence":3},"pairs":{"buddyWords":[{"w":"paper","ko":"논문","reason":"동의어"},{"w":"composition","ko":"작문","reason":"동의어"},{"w":"thesis","ko":"논제","reason":"글쓰기 시나리오"}],"collocBest":[{"en":"write an essay","ko":"에세이를 쓰다"},{"en":"essay question","ko":"서술형 문제"}]},"nuance":{"koSimple":"한 주제로 논리를 편 짧은 글.","whenToUse":"학교 과제·수필을 말할 때."},"krDetail":[{"ko":"짤막한 글","explain":"주제를 정해 생각을 정리한 산문 형식의 글"},{"ko":"생각을 담은 글","explain":"필자의 의견이나 경험을 논리 있게 풀어낸 문장"}],"usageExamples":[{"en":"She wrote a persuasive essay about pollution.","ko":"그녀는 오염에 관한 설득력 있는 에세이를 썼다."},{"en":"The essay questions were harder than expected.","ko":"서술형 문제는 예상보다 어려웠다."}],"grammarNote":"essay는 셀 수 있는 명사이므로 an essay, essays로 쓴다. 대학 입시나 시험 문맥에서는 형용사처럼 명사를 수식(essay question, essay contest)하기도 한다.","grammarQuiz":[{"sentence":"Students _____ asked to write an _____ about climate change.","ko":"학생들은 기후 변화에 관한 에세이를 쓰라는 요청을 받았다.","answer":["were","essay"],"hint":"과거 수동태 be + 명사"}]},
    {"id":"w02120","w":"equator","pos":["n"],"ph":"/ɪˈkweɪtər/","cefr":"B1","kr":["적도"],"ex":[{"en":"Countries near the equator tend to have hot and humid climates.","ko":"적도 근처 나라들은 대체로 덥고 습한 기후를 가진다."}],"mnemonic":{"soundHint":"이퀘이터","story":"equal(같은) + -tor = 지구를 남북 반반 나누는 선, 적도.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"tropical","ko":"열대의","reason":"적도 기후 시나리오"},{"w":"pole","ko":"극","reason":"반의 지리 개념"},{"w":"latitude","ko":"위도","reason":"적도=위도 0도 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"지구 한가운데를 도는 상상의 선.","whenToUse":"지리·기후 이야기할 때."},"krDetail":[{"ko":"지구의 허리 선","explain":"지구를 남과 북으로 반으로 나누는 가상의 선"},{"ko":"가장 무더운 띠","explain":"적도 근처의 뜨겁고 습한 지역을 부르는 말"}],"usageExamples":[{"en":"Singapore lies close to the equator.","ko":"싱가포르는 적도 근처에 있다."},{"en":"The ship crossed the equator on Sunday.","ko":"그 배는 일요일에 적도를 건넜다."}],"grammarNote":"equator는 유일한 대상을 지칭하므로 항상 the equator로 쓴다. the sun, the moon, the earth와 같이 지리적 유일 명사와 같은 정관사 규칙이 적용된다.","grammarQuiz":[{"sentence":"Countries near _____ equator usually _____ a hot climate.","ko":"적도 근처의 나라들은 대개 더운 기후를 가진다.","answer":["the","have"],"hint":"정관사 + 일반 현재 동사"}]},
    {"id":"w01949","w":"easygoing","pos":["adj"],"ph":"/ˌiːziˈɡoʊɪŋ/","cefr":"B1","kr":["느긋한","온화한"],"ex":[{"en":"He has an easygoing personality.","ko":"그는 느긋한 성격을 가지고 있다."}],"mnemonic":{"soundHint":"'이지(easy,쉬운)+고잉(going,진행)' → 흐름에 쉽게 맡기는","story":"easy(쉬운)+going(가는) → 흐름을 쉽게 따라가는 = easygoing(느긋한)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"relaxed","ko":"느긋한","reason":"easygoing의 대표 동의어"},{"w":"laid-back","ko":"여유로운","reason":"easygoing과 완전 동의"},{"w":"uptight","ko":"긴장한","reason":"easygoing의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"화를 잘 안 내고 느긋한.","whenToUse":"성격이 편하고 여유로울 때."},"krDetail":[{"ko":"느긋한","explain":"마음이 급하지 않고 여유로운"},{"ko":"온화한","explain":"성격이 부드럽고 따뜻한"}],"usageExamples":[{"en":"My father is an easygoing man who rarely gets angry.","ko":"우리 아버지는 좀처럼 화내지 않는 느긋한 분이시다."},{"en":"Her easygoing nature helps her make friends very quickly.","ko":"그녀의 느긋한 성격은 친구를 매우 빠르게 사귀도록 도와준다."}],"grammarNote":"easygoing은 easy(쉬운) + going(가는)이 결합한 형용사로, 사람의 성격을 묘사할 때만 씁니다. 하이픈 없이 한 단어로 씁니다.","grammarQuiz":[{"sentence":"Everyone likes him because he is _____ _____ everyone.","ko":"그는 모든 사람에게 느긋해서 모두가 그를 좋아한다.","answer":["easygoing","with"],"hint":"형용사 + 대인 전치사"}]},
    {"id":"w01999","w":"element","pos":["n"],"ph":"/ˈɛlɪmənt/","cefr":"B1","kr":["요소","원소"],"ex":[{"en":"Trust is a key element.","ko":"신뢰는 핵심 요소이다."}],"mnemonic":{"soundHint":"엘리먼트","story":"'엘리~먼트(맨트)'는 기본 조각. 하나하나 요소가 element.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"component","ko":"구성 요소","reason":"동의어"},{"w":"factor","ko":"요인","reason":"동의어"},{"w":"compound","ko":"화합물","reason":"원소/화학 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"전체를 이루는 하나의 조각.","whenToUse":"핵심 요소나 화학 원소를 말할 때."},"krDetail":[{"ko":"구성 부분","explain":"어떤 것을 이루는 하나하나의 조각"},{"ko":"밑감","explain":"더 이상 나눌 수 없는 화학의 기본 물질"}],"usageExamples":[{"en":"Trust is a key element of any friendship.","ko":"신뢰는 어떤 우정에서든 핵심 요소이다."},{"en":"Hydrogen is the lightest element in the universe.","ko":"수소는 우주에서 가장 가벼운 원소이다."}],"grammarNote":"element는 셀 수 있는 명사이므로 관사 a(n)나 복수형이 필요하다. '~의 요소'라고 할 때 element of + 명사 구조를 쓴다.","grammarQuiz":[{"sentence":"Water is made up _____ two _____ , hydrogen and oxygen.","ko":"물은 두 가지 원소, 수소와 산소로 이루어져 있다.","answer":["of","elements"],"hint":"구동사 전치사 + 복수 명사"}]},
    {"id":"w02311","w":"faithful","pos":["adj"],"ph":"/ˈfeɪθfl/","cefr":"B1","kr":["충실한","신실한"],"ex":[{"en":"He has been a faithful friend for many years.","ko":"그는 오랫동안 충실한 친구였다."}],"mnemonic":{"soundHint":"페이스풀","story":"faith(믿음) + -ful = 믿음이 가득한, 충실한.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"loyal","ko":"충성스러운","reason":"동의어 - 변함없이 충성함"},{"w":"devoted","ko":"헌신적인","reason":"동의어 - 헌신적으로 충실"},{"w":"disloyal","ko":"불충한","reason":"반의어 - 충실 vs 배신"}],"collocBest":[]},"nuance":{"koSimple":"약속을 끝까지 지키는.","whenToUse":"친구·부부·부하가 변함없이 충실할 때."},"krDetail":[{"ko":"충실한","explain":"정성을 다해 마음이 곧은"},{"ko":"신실한","explain":"믿음이 굳고 참된"}],"usageExamples":[{"en":"He has always been a faithful friend to me since childhood.","ko":"그는 어린 시절부터 나에게 항상 충실한 친구였다."},{"en":"The old dog remained faithful to its owner for years.","ko":"그 늙은 개는 수년간 주인에게 충실히 남아 있었다."}],"grammarNote":"faithful은 형용사이며 be faithful to (~에게 충실하다)로 쓴다. 부사형은 faithfully (충실히)로 편지 끝 인사(Yours faithfully)에도 쓰인다.","grammarQuiz":[{"sentence":"A _____ friend will stay with you in difficult times.","ko":"충실한 친구는 어려운 시기에 너와 함께 있어 줄 것이다.","answer":["faithful"],"hint":"관사 A와 명사(friend) 사이이므로 형용사 형태"},{"sentence":"The translator has _____ preserved the meaning of the original text.","ko":"그 번역가는 원문의 의미를 충실히 보존해 왔다.","answer":["faithfully"],"hint":"동사(preserved)를 꾸미므로 부사 형태"}]},
    {"id":"w01863","w":"domestic","pos":["adj"],"ph":"/dəˈmestɪk/","cefr":"B1","kr":["국내의","가정의"],"ex":[{"en":"Domestic flights are usually cheaper.","ko":"국내 항공편은 보통 더 저렴하다."}],"mnemonic":{"soundHint":"'돔(dome,집)+에스틱' → 집안의, 국내의","story":"dome(집)에서 유래 → 집안의(가정의), 나라 안의(국내의) = domestic","hintConfidence":2},"pairs":{"buddyWords":[{"w":"foreign","ko":"외국의","reason":"domestic(국내)의 대표적 반의어"},{"w":"household","ko":"가정의","reason":"domestic의 '가정의' 의미와 동의"},{"w":"national","ko":"국가의","reason":"domestic market/industry 문맥의 유사 표현"}],"collocBest":[]},"nuance":{"koSimple":"우리나라 안의, 또는 집 안의.","whenToUse":"국내 항공편·가정 문제를 말할 때."},"krDetail":[{"ko":"국내의","explain":"나라 안의, 자기 나라 안에서 이루어지는"},{"ko":"가정의","explain":"집 안의, 살림살이와 관련된"}],"usageExamples":[{"en":"The company focuses on the domestic market rather than exports.","ko":"그 회사는 수출보다 국내 시장에 집중한다."},{"en":"She adopted a domestic cat from the shelter last month.","ko":"그녀는 지난달 보호소에서 집고양이를 입양했다."}],"grammarNote":"domestic은 형용사로만 쓰이며 부사형 domestically와 혼동하기 쉽습니다. '국내에서'라는 부사 의미를 살리려면 domestically를 써야 합니다.","grammarQuiz":[{"sentence":"The government tries to protect _____ industries from foreign competition.","ko":"정부는 외국의 경쟁으로부터 국내 산업을 보호하려 한다.","answer":["domestic"],"hint":"명사 industries를 수식하는 형용사"}]},
    {"id":"w02262","w":"expression","pos":["n"],"ph":"/ɪkˈsprɛʃən/","cefr":"B1","kr":["표현","표정"],"ex":[{"en":"His expression showed concern.","ko":"그의 표정은 걱정을 보여줬다."}],"mnemonic":{"soundHint":"익스프레션","story":"express(밖으로 눌러 표현하다) + -ion = 표현, 표정.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"statement","ko":"진술","reason":"동의어 - 말로 표현"},{"w":"look","ko":"표정","reason":"동의어 - 얼굴 표정 의미"},{"w":"express","ko":"표현하다","reason":"파생 관계 - 동사형"}],"collocBest":[]},"nuance":{"koSimple":"생각·감정을 겉으로 드러낸 말이나 표정.","whenToUse":"얼굴 표정, 말로 하는 표현 모두에."},"krDetail":[{"ko":"표현","explain":"생각이나 느낌을 드러내 나타냄"},{"ko":"표정","explain":"얼굴에 나타나는 느낌"}],"usageExamples":[{"en":"Her face showed a very sad expression at the news.","ko":"그녀의 얼굴은 그 소식에 매우 슬픈 표정을 지었다."},{"en":"The idea was clearly expressed in her short speech.","ko":"그 생각은 그녀의 짧은 연설에서 명확하게 표현되었다."}],"grammarNote":"expression은 셀 수 있는 명사이며 '표정·표현·관용구'의 뜻으로 두루 쓰인다. freedom of expression (표현의 자유)은 단수형으로 굳어진 표현이다.","grammarQuiz":[{"sentence":"The teacher used an interesting _____ to describe the situation.","ko":"그 선생님은 그 상황을 묘사하기 위해 흥미로운 표현을 사용했다.","answer":["expression"],"hint":"an과 형용사 뒤 자리, 명사 형태"},{"sentence":"Many people _____ their feelings through art and music.","ko":"많은 사람들이 예술과 음악을 통해 자신의 감정을 표현한다.","answer":["express"],"hint":"복수 주어(people), 현재시제 동사원형"}]},

    {"id":"w02044","w":"employer","pos":["n"],"ph":"/ɪmˈplɔɪər/","cefr":"B1","kr":["고용주","사용자"],"ex":[{"en":"My employer is very supportive.","ko":"내 고용주는 매우 지지적이다."}],"mnemonic":{"soundHint":"임플로이어","story":"employ(고용하다) + -er = 고용하는 사람, 고용주.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"boss","ko":"상사","reason":"동의어"},{"w":"employee","ko":"직원","reason":"반의어"},{"w":"salary","ko":"급여","reason":"고용주-직원 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"일을 시키고 월급을 주는 사람·회사.","whenToUse":"직장인의 회사·사장을 말할 때."},"krDetail":[{"ko":"일자리를 주는 사람","explain":"직원을 뽑아 임금을 지급하는 사장이나 회사"},{"ko":"일을 시키는 쪽","explain":"노동자에게 업무를 맡기고 관리하는 위치"}],"usageExamples":[{"en":"Her employer offered her a big bonus this year.","ko":"그녀의 고용주는 올해 그녀에게 큰 상여금을 주었다."},{"en":"Good employers listen to their employees carefully.","ko":"좋은 고용주는 직원들의 말을 주의 깊게 듣는다."}],"grammarNote":"employer(-er, 행위 주체)와 employee(-ee, 행위 대상)의 접미사 대비를 명확히 기억한다. -er/-ee 접미사는 interviewer/interviewee, trainer/trainee에도 동일하게 적용된다.","grammarQuiz":[{"sentence":"The _____ decided _____ raise the salaries of all employees.","ko":"그 고용주는 모든 직원의 임금을 인상하기로 결정했다.","answer":["employer","to"],"hint":"명사 + to부정사"}]},
    {"id":"w02167","w":"eventually","pos":["adv"],"ph":"/ɪˈvɛntʃuəli/","cefr":"B1","kr":["결국","마침내"],"ex":[{"en":"She eventually got the job.","ko":"그녀는 결국 그 일자리를 얻었다."}],"mnemonic":{"soundHint":"이벤추얼리","story":"event(사건) + -ually = 여러 사건 후에, 결국.","hintConfidence":2},"pairs":{"buddyWords":[{"w":"finally","ko":"마침내","reason":"동의어"},{"w":"immediately","ko":"즉시","reason":"반의어"},{"w":"ultimately","ko":"궁극적으로","reason":"동의어"}],"collocBest":[]},"nuance":{"koSimple":"오래 걸린 끝에 마침내.","whenToUse":"긴 과정 뒤 결과를 말할 때."},"krDetail":[{"ko":"얼마 뒤에","explain":"여러 일이 지나고 나서 마침내 어떤 결과에 이르는"},{"ko":"긴 시간 끝에","explain":"많은 시간이 흐른 뒤에 어떤 상황이 일어나는"}],"usageExamples":[{"en":"He eventually became a famous scientist.","ko":"그는 결국 유명한 과학자가 되었다."},{"en":"The truth was eventually revealed to the public.","ko":"진실이 결국 대중에게 밝혀졌다."}],"grammarNote":"eventually는 시간의 흐름 끝에 벌어지는 결과를 나타내는 부사이다. finally와 달리 만족·안도의 뉘앙스가 없으며, 문장 앞·중간·끝 어디에도 위치할 수 있다.","grammarQuiz":[{"sentence":"After many failures, she _____ succeeded _____ making the product.","ko":"많은 실패 끝에 그녀는 결국 그 제품을 만드는 데 성공했다.","answer":["eventually","in"],"hint":"부사 + succeed 전치사"}]},
    {"id":"w02230","w":"expand","pos":["v"],"ph":"/ɪkˈspænd/","cefr":"B1","kr":["확장하다","팽창하다"],"ex":[{"en":"The company plans to expand.","ko":"그 회사는 확장할 계획이다."}],"mnemonic":{"soundHint":"익스팬드","story":"'ex(밖으로) + pand(펼치다)' → 밖으로 넓게 펼치다, 확장하다.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"extend","ko":"확장하다","reason":"동의어 - 범위를 넓힘"},{"w":"grow","ko":"성장하다","reason":"동의어 - 규모가 커짐"},{"w":"shrink","ko":"줄어들다","reason":"반의어 - 확장 vs 축소"}],"collocBest":[]},"nuance":{"koSimple":"크기·범위가 넓어지다.","whenToUse":"사업·지식·풍선처럼 부피가 커질 때."},"krDetail":[{"ko":"확장하다","explain":"넓혀서 크게 만들다"},{"ko":"팽창하다","explain":"부풀어 커지다"}],"usageExamples":[{"en":"The company plans to expand its business next year.","ko":"그 회사는 내년에 사업을 확장할 계획이다."},{"en":"Metal expands when it is heated to high temperatures.","ko":"금속은 높은 온도로 가열되면 팽창한다."}],"grammarNote":"expand는 타동사와 자동사 모두로 쓰인다. 타동사일 때는 '~을 확장하다', 자동사일 때는 '팽창하다·커지다'의 뜻이며 목적어 없이도 사용된다.","grammarQuiz":[{"sentence":"The universe has been _____ ever since the Big Bang.","ko":"우주는 빅뱅 이후로 계속 팽창해 오고 있다.","answer":["expanding"],"hint":"has been + -ing (현재완료진행), 자동사 용법"},{"sentence":"Our company wants to _____ its market into Asia next year.","ko":"우리 회사는 내년에 아시아로 시장을 확장하고 싶어 한다.","answer":["expand"],"hint":"to부정사 자리, 뒤에 목적어(its market) 타동사"}]},
    {"id":"w02107","w":"environmental","pos":["adj"],"ph":"/ɪnˌvaɪrənˈmɛntəl/","cefr":"B1","kr":["환경의","환경적인"],"ex":[{"en":"Environmental issues are urgent.","ko":"환경 문제는 시급하다."}],"mnemonic":{"soundHint":"인바이런멘털","story":"environment + -al = 환경의, 환경적인.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"ecological","ko":"생태의","reason":"동의어"},{"w":"green","ko":"친환경의","reason":"동의어"},{"w":"pollution","ko":"오염","reason":"환경 시나리오"}],"collocBest":[]},"nuance":{"koSimple":"환경과 관련된, 자연에 영향 주는.","whenToUse":"환경 문제·정책을 얘기할 때."},"krDetail":[{"ko":"환경과 관련된","explain":"자연·주변 조건에 영향을 주거나 받는"},{"ko":"자연을 지키려는","explain":"생태계와 자연을 보호하는 뜻을 가진"}],"usageExamples":[{"en":"The company published an environmental report.","ko":"그 회사는 환경 보고서를 발간했다."},{"en":"Environmental issues are discussed on the news daily.","ko":"환경 문제가 매일 뉴스에서 다뤄진다."}],"grammarNote":"environmental은 형용사로 명사와 결합하여 사용된다. 서술적 용법(be environmental)은 매우 드물며, 부사형은 environmentally(friendly와 결합해 '환경친화적으로')이다.","grammarQuiz":[{"sentence":"This product is _____ friendly _____ it produces no waste.","ko":"이 제품은 쓰레기를 만들지 않아서 환경 친화적이다.","answer":["environmentally","because"],"hint":"부사 + 이유 접속사"}]},
    {"id":"w01912","w":"dull","pos":["adj"],"ph":"/dʌl/","cefr":"B1","kr":["지루한","흐릿한"],"ex":[{"en":"It was a very dull speech.","ko":"그것은 매우 지루한 연설이었다."}],"mnemonic":{"soundHint":"'덜(부족)' → 재미가 덜, 밝기가 덜","story":"재미가 '덜'하면 지루한(dull), 빛이 '덜'하면 흐릿한(dull)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"boring","ko":"지루한","reason":"dull의 대표 동의어"},{"w":"exciting","ko":"흥미진진한","reason":"dull(지루한)의 반의어"},{"w":"bright","ko":"밝은","reason":"dull(흐릿한)의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"재미없고 지루한, 또는 흐릿한.","whenToUse":"지루한 연설·흐린 날씨를 말할 때."},"krDetail":[{"ko":"지루한","explain":"재미없어 시간이 길게 느껴지는"},{"ko":"흐릿한","explain":"밝지 않고 어두운 듯한"}],"usageExamples":[{"en":"The teacher's long speech made the students feel very dull.","ko":"선생님의 긴 연설은 학생들을 매우 지루하게 만들었다."},{"en":"The sky looked dull and gray before the heavy rain.","ko":"폭우가 오기 전에 하늘은 흐릿하고 회색으로 보였다."}],"grammarNote":"dull은 형용사이며 '지루한(=boring), 무딘, 흐릿한' 여러 의미가 있습니다. 감각동사(look, sound, feel) 뒤 보어로 자주 쓰입니다.","grammarQuiz":[{"sentence":"The movie was so _____ _____ half the audience fell asleep.","ko":"그 영화는 너무 지루해서 관객의 절반이 잠들었다.","answer":["dull","that"],"hint":"so ~ that 구문"}]},
    {"id":"w01892","w":"dreadful","pos":["adj"],"ph":"/ˈdredfəl/","cefr":"B1","kr":["끔찍한","무서운"],"ex":[{"en":"The accident was absolutely dreadful.","ko":"그 사고는 정말 끔찍했다."}],"mnemonic":{"soundHint":"'드레드(dread,두려움)+ful(가득)' → 두려움 가득","story":"dread(두려움)+ful(가득) → dreadful(끔찍한, 무서운)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"terrible","ko":"끔찍한","reason":"dreadful의 대표 동의어"},{"w":"horrible","ko":"무서운","reason":"dreadful과 강도·의미 유사"},{"w":"pleasant","ko":"즐거운","reason":"dreadful의 반의어"}],"collocBest":[]},"nuance":{"koSimple":"소름 끼치도록 끔찍한","whenToUse":"사건·상황이 극도로 나쁠 때 강조 표현"},"krDetail":[{"ko":"끔찍한","explain":"매우 나쁘거나 소름 끼치는"},{"ko":"무서운","explain":"두려운 느낌이 드는"}],"usageExamples":[{"en":"The dreadful news shocked everyone in the small village.","ko":"그 끔찍한 소식은 작은 마을 사람들 모두를 충격에 빠뜨렸다."},{"en":"She felt dreadful after hearing about the terrible accident.","ko":"그녀는 그 끔찍한 사고 소식을 듣고 기분이 아주 안 좋았다."}],"grammarNote":"dreadful은 형용사입니다. 명사 dread(공포)에서 파생되었으며, 유사 어미 -ful(가득 찬)이 붙어 '공포로 가득 찬 → 끔찍한'이 됩니다.","grammarQuiz":[{"sentence":"The children had a _____ time _____ the storm was raging outside.","ko":"폭풍이 밖에서 몰아치는 동안 아이들은 끔찍한 시간을 보냈다.","answer":["dreadful","while"],"hint":"형용사 + 시간 접속사"}]},
    {"id":"w02225","w":"existence","pos":["n"],"ph":"/ɪɡˈzɪstəns/","cefr":"B1","kr":["존재","실재"],"ex":[{"en":"The existence of life is precious.","ko":"생명의 존재는 소중하다."}],"mnemonic":{"soundHint":"이그지스턴스","story":"exist(존재하다) + -ence = 존재하는 상태, 실재.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"being","ko":"존재","reason":"동의어 - 존재 상태"},{"w":"presence","ko":"존재","reason":"동의어 - 있음의 상태"},{"w":"absence","ko":"부재","reason":"반의어 - 존재 vs 부재"}],"collocBest":[]},"nuance":{"koSimple":"어떤 것이 실제로 있음.","whenToUse":"생명·현상·개념이 존재한다는 사실을 논할 때."},"krDetail":[{"ko":"존재","explain":"실제로 있음"},{"ko":"실재","explain":"참으로 있음"}],"usageExamples":[{"en":"Scientists still question the existence of alien life.","ko":"과학자들은 여전히 외계 생명체의 존재를 의심한다."},{"en":"The old law is still in existence in some countries.","ko":"그 오래된 법은 일부 나라에서 여전히 존재한다."}],"grammarNote":"existence는 셀 수 없는 추상명사이므로 앞에 부정관사 an을 쓰지 않는다. come into existence (생겨나다), in existence (존재하는) 형태가 자주 쓰인다.","grammarQuiz":[{"sentence":"Many people believe in the _____ of ghosts and spirits.","ko":"많은 사람들이 유령과 영혼의 존재를 믿는다.","answer":["existence"],"hint":"the 뒤이므로 명사 형태"},{"sentence":"This ancient tradition still _____ in remote villages today.","ko":"이 오래된 전통은 오늘날에도 외딴 마을에서 여전히 존재한다.","answer":["exists"],"hint":"3인칭 단수 현재, 자동사(뒤에 목적어 없음)"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

function fmtTime(ms){

  const m = Math.floor(s/60), r = s%60;

}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function flipCard(){

  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

function navCard(dir){
  if(dir === "home"){
    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

/* ============================================================
   QUIZ (15문항)
   ============================================================ */
const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{ pool.push({ word:w, mode: modeOrder[i] }); });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* ============================================================
   RESULT
   ============================================================ */
function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));
  if(isPerfect) earnedBadges.push(DATA.badges.find(b=>b.id==="perfect"));

  renderHeader();

  const main = document.getElementById("main");
  const stageLbl = isAdv ? "심화단계" : "기본단계";
  const passedM3 = (pct >= 60) && (DATA.grade === '중3');
  const isHighGrade = ['고1','고2','수능'].includes(DATA.grade);
  const highGradePerfect = isHighGrade && isAdv && isPerfect;
  const highGradeMsg = highGradePerfect ? pickHGMessage() : null;
  const title = highGradeMsg
    ? `🏆 ${escape(highGradeMsg)}`
    : passedM3
      ? `💰 방금 당신의 미래 연봉이 10만원 더 올라갔슴돠!!`
      : (isPerfect ? `🎊 ${stageLbl} 무결점 클리어!` : (pct >= 80 ? `🎉 ${stageLbl} 잘했어요!` : pct >= 60 ? `👍 ${stageLbl} 통과!` : "💪 다시 도전!"));

  // 심화면 [🎯 심화 다시] + [🏠 홈으로]. 기본이면 [🔁 다시 보기] + (심화 해금 시) [🎯 심화 도전]
  const canGoAdvanced = !isAdv && state.basicThresholdPassed;
  const advGrand = isAdv && pct >= 90;   // 심화 90%+ 특별 축포
  const unlockBanner = newUnlock
    ? `<div style="margin:8px auto 6px;padding:10px 14px;border-radius:var(--radius-md);
                   background:linear-gradient(135deg, rgba(168,85,247,.18), rgba(109,40,217,.10));
                   border:1px solid rgba(168,85,247,.55);color:#e9d5ff;font-weight:700;font-size:.98rem;
                   text-align:center;letter-spacing:.02em;">
         🎯 90% 이상 달성 — <b style="color:#c4b5fd">심화단계 해금!</b>
       </div>`
    : "";
  const grandBanner = advGrand
    ? `<div class="grand-banner">
         <div class="grand-line">🎆 당신이 <b>배곧 쵝오</b>! 🎆</div>
         <div class="grand-sub">심화단계 ${pct}% — 지역 랭커 등극!</div>
       </div>`
    : "";
  const hasWrong = state.quizWrongItems.length > 0;
  const actionsHTML = isAdv
    ? `<button class="start-btn" id="retryBtn">🔁 심화 다시</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       <button class="start-btn alt" id="homeBtn">🏠 Home</button>`
    : `<button class="start-btn" id="retryBtn">🔁 다시 보기</button>
       ${hasWrong ? `<button class="start-btn wrong-only" id="retryWrongBtn">🔴 틀린문제만 (${state.quizWrongItems.length})</button>` : ""}
       ${canGoAdvanced ? `<button class="start-btn adv" id="goAdvBtn">🎯 심화단계 도전</button>` : ""}`;

  main.innerHTML = `
    <div class="result">
      <h2>${title}</h2>
      ${grandBanner}
      <div class="score-big">${correct} / ${total}</div>

      <div class="result-stats">
        <div class="result-stat"><div class="l">획득 XP</div><div class="v grade-c">+${state.xp}</div></div>
        <div class="result-stat"><div class="l">최대 연속</div><div class="v acc-c">${state.maxStreak} 🔥</div></div>

          ${earnedBadges.map((b,i)=>`<span class="badge" style="animation-delay:${i*.15}s"><span class="ic">${b.icon}</span>${escape(b.name)}</span>`).join("")}

      ${state.quizWrongIds.size ? `<div style="margin:10px 0 14px;color:var(--text-muted);font-size:13px;">
        틀린 단어: <b style="color:var(--danger)">${[...state.quizWrongIds].map(id=>{
          const w = DATA.newWords.find(x=>x.id===id); return w?escape(w.w):"";
        }).filter(Boolean).join(", ")}</b>
      </div>` : ""}

      <div class="result-actions">
        ${actionsHTML}
      </div>
    </div>
  `;

  // celebration
  setTimeout(()=>{
    if(highGradeMsg){
      // 고등학교 심화 100% — 화면 오버레이 + 랜덤 메시지 + TTS + 폭죽 다량

      SFX.grandFanfare();
      fx.spawn("rainbow-burst");
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 350);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 800);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.bigWin(); }, 1400);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.streak(); }, 2100);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 2900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 3700);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4500);
      return;
    }
    if(advGrand){
      // 심화 90%+ — 화려·명랑 팡파레 + 축포 다량 (배곧 쵝오!)
      fx.spawn("rainbow-burst");
      SFX.grandFanfare();                                          // 브라스 팡파레+아르페지오+종
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.fireworks(); }, 300);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.coinDrop(); }, 700);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.streak(); }, 1300);
      setTimeout(()=>{ fx.spawn("rainbow-burst"); SFX.fireworks(); }, 1900);
      setTimeout(()=>{ fx.spawn("jackpot-full"); SFX.bigWin(); }, 2500);
      setTimeout(()=>{ fx.spawn("fireworks-grand"); SFX.coinDrop(); }, 3300);
      setTimeout(()=>{ SFX.grandFanfare(); }, 4000);                // 마지막 대미 팡파레
    } else if(isPerfect){
      fx.spawn("rainbow-burst");
      SFX.bigWin();
      setTimeout(()=>fx.spawn("jackpot-full"), 600);
      setTimeout(()=>SFX.coinDrop(), 700);
    } else if(newCleared){
      fx.spawn("jackpot-full");
      SFX.levelUp();
      setTimeout(()=>SFX.coinDrop(), 500);
    } else if(pct >= 80){
      fx.spawn("reel-spin-small");
      SFX.spinReel();
    }
  }, 250);

  document.getElementById("retryBtn").addEventListener("click", ()=>{
    if(isAdv){ startAdvanced(); }
    else{ renderHome(); }
  });
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    alert("Lv.2 미생성 — 시범 버전입니다.");
  });
  const goAdvBtn = document.getElementById("goAdvBtn");
  if(goAdvBtn) goAdvBtn.addEventListener("click", ()=>{
    state.quizType = "advanced";
    startAdvanced();
  });
  const homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.addEventListener("click", ()=> renderHome());
  const retryWrongBtn = document.getElementById("retryWrongBtn");
  if(retryWrongBtn){
    retryWrongBtn.addEventListener("click", ()=>{
      if(isAdv) startAdvancedRetryWrong();
      else startBasicRetryWrong();
    });
  }
}

/* ============================================================
   UTILS
   ============================================================ */
/* 고등학교 심화 100% — 랜덤 축하 메시지 + 화면 오버레이 + TTS */
const HG_MESSAGES = [
  "당신의 노력에 경의를 표합니다!!",
  "배곧 쵝오를 넘어서!!",
  "이러다 연세대 가는거 아냐??",
  "자꾸 이러면 서울대 들어간다.",
  "왜 이렇게 잘 해?",
  "커서 훌륭한 사람 되겠어!!",
  "미래의 당신 집이 한 평 커졌어!!"
];
function pickHGMessage(){
  return HG_MESSAGES[Math.floor(Math.random() * HG_MESSAGES.length)];
}
function showHighGradeCelebration(msg){
  const old = document.querySelector('.hg-celebration');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'hg-celebration';
  const sparkles = ['✨','🎉','🎊','⭐','💫','🌟','🎆','🎇','💥']
    .map((e,i)=>{
      const x = 8 + Math.random()*84, y = 8 + Math.random()*84;
      const d = (Math.random()*1.6).toFixed(2);
      return `<span class="hg-sparkle" style="left:${x}%;top:${y}%;animation-delay:${d}s">${e}</span>`;
    }).join('');
  overlay.innerHTML = `<div class="hg-halo"></div>${sparkles}<div class="hg-msg">${escape(msg)}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>overlay.remove(), 6100);
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ko-KR'; u.rate = 0.98; u.pitch = 1.12; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const ko = voices.find(v => /^ko/i.test(v.lang));
      if(ko) u.voice = ko;
      setTimeout(()=>speechSynthesis.speak(u), 400);
    }
  }catch(e){}
}

/* 빈칸 힌트: 정답 문자열의 각 단어 첫 글자를 "a… b…" 형태로 반환
   예: "appeared" → "a…"  ·  "in the absence of" → "i… t… a… o…"  ·  "feel bad" → "f… b…"  */
function firstCharsHint(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'') + '…').join(' ');
}
/* 빈칸 프리필: 정답 각 단어의 첫 글자를 공백으로 이어붙여 반환 (인풋 value 로 채워둠)
   예: "appeared" → "a"  ·  "in the absence of" → "i t a o"  ·  "feel bad" → "f b"  */
function firstCharsPrefill(s){
  return (s||'').trim().split(/\s+/).filter(Boolean).map(w => (w.charAt(0)||'')).join(' ');
}
/* 인풋에 프리필된 첫 글자 잠금 + 커서 이동 훅 부착 */
function attachPrefillGuard(inp){
  const prefill = inp.dataset.prefill || '';
  if(!prefill) return;
  const moveCursorEnd = () => { try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} };
  inp.addEventListener('focus', () => setTimeout(moveCursorEnd, 0));
  inp.addEventListener('click', () => {
    if(inp.selectionStart < prefill.length) moveCursorEnd();
  });
  inp.addEventListener('keydown', e => {
    // 프리필 영역 보호: 첫 글자들을 지우거나 그 앞으로 이동하는 키 방지
    const s = inp.selectionStart, e2 = inp.selectionEnd;
    if(e.key === 'Backspace' && s <= prefill.length && s === e2){ e.preventDefault(); moveCursorEnd(); return; }
    if(e.key === 'Delete'    && s <  prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
    if((e.key === 'ArrowLeft' || e.key === 'Home') && s <= prefill.length){ e.preventDefault(); moveCursorEnd(); return; }
  });
  inp.addEventListener('input', () => {
    // 사용자 값이 프리필로 시작하지 않으면 프리필을 앞에 다시 붙임 (드래그·잘라내기 등 방지)
    if(!inp.value.startsWith(prefill)){
      inp.value = prefill + inp.value.replace(new RegExp('^' + prefill.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').slice(0,0)),'');
      moveCursorEnd();
    }
  });
}
/* 프리필 인풋에서 사용자가 실제로 추가 입력한 부분이 있는지 (첫 글자만 남은 상태는 미제출) */
function hasUserInput(inp){
  const prefill = inp.dataset.prefill || '';
  return (inp.value||'').trim().length > prefill.trim().length;
}
/* ============================================================
   낱말박스 (자동완성 방어) — 각 단어당 [잠금 첫글자] + [빈 인풋]
   ============================================================ */
function renderWordAnswer(container, answer){
  container.innerHTML = '';
  const words = String(answer || '').trim().split(/\s+/).filter(Boolean);
  words.forEach((word, wi) => {
    const group = document.createElement('span');
    const isSingle = word.length <= 1;
    group.className = 'word-group' + (isSingle ? ' single-letter' : '');
    group.dataset.first = isSingle ? '' : (word[0] || '');
    group.dataset.full = word;
    if(!isSingle){
      const first = document.createElement('span');
      first.className = 'first-letter';
      first.textContent = word[0] || '';
      group.appendChild(first);
    }
    const inp = document.createElement('input');
    inp.className = 'rest-input';
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.autocorrect = 'off';
    inp.setAttribute('autocapitalize','off');
    inp.spellcheck = false;
    inp.inputMode = 'text';
    inp.name = 'wa-' + Math.random().toString(36).slice(2,8);
    inp.dataset.wi = wi;
    inp.setAttribute('aria-label', (wi+1) + '번째 단어의 나머지 스펠링');
    group.appendChild(inp);
    container.appendChild(group);
  });
  wireWordInputs(container);
}
function wireWordInputs(container){
  const inputs = Array.from(container.querySelectorAll('.rest-input'));
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = (inp.value || '').toLowerCase().replace(/[^a-z'\-]/g,'');
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
        else { e.preventDefault(); handleSubmit(); }
      } else if(e.key === 'Tab' && !e.shiftKey){
        const next = inputs[i+1];
        if(next){ e.preventDefault(); next.focus(); }
      } else if(e.key === 'Backspace' && !inp.value && i > 0){
        e.preventDefault();
        const prev = inputs[i-1];
        prev.focus();
        try{ prev.setSelectionRange(prev.value.length, prev.value.length); }catch(_e){}
      }
    });
  });
}
function collectWordAnswer(container){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  return groups.map(function(g){
    var inp = g.querySelector('.rest-input');
    return (g.dataset.first || '') + (inp ? inp.value : '');
  }).join(' ');
}
function anyWordEmpty(container){
  return Array.from(container.querySelectorAll('.rest-input')).some(function(i){ return !i.value.trim(); });
}
function markWordAnswer(container, perGroupOk){
  const groups = Array.from(container.querySelectorAll('.word-group'));
  groups.forEach(function(g, i){
    g.classList.add(perGroupOk[i] ? 'correct' : 'wrong');
    var inp = g.querySelector('.rest-input');
    if(inp) inp.disabled = true;
  });
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function escape(s){
  if(s == null) return "";
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

   GLOBAL EVENTS
   ============================================================ */
document.getElementById("sfxBtn").addEventListener("click", ()=>{
  state.sfxOn = !state.sfxOn;
  lsSet(SFX_KEY, state.sfxOn);

document.getElementById("cbBtn").addEventListener("click", ()=>{

});

// keyboard
document.addEventListener("keydown", e=>{
  if(state.phase === "study"){
    if(e.code === "Space"){ e.preventDefault(); flipCard(); }
    else if(e.key === "1") navCard("prev");
    else if(e.key === "2") navCard("home");
    else if(e.key === "3") navCard("next");
    else if(e.key === "ArrowLeft") navCard("prev");
    else if(e.key === "ArrowRight") navCard("next");
  } else if(state.phase === "quiz" && !state.quizAnswered){
    const mode = state.quizCurrent && state.quizCurrent.mode;
    if(mode === "meaning-mcq" || mode === "word-mcq"){
      const n = parseInt(e.key, 10);
      if(n >= 1 && n <= 4){
        const btns = document.querySelectorAll(".choice");
        if(btns[n-1]) handleChoice(btns[n-1]);
      }
    }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  fx.init();
  if(state.cbMode) document.body.classList.add("cb-mode");
  renderHome();
}
boot();
