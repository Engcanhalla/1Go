    {"id":"w03496","w":"interpreter","pos":["n"],"ph":"/ɪnˈtɜːrprɪtər/","cefr":"B1","kr":["통역사","해석자"],"ex":[{"en":"The interpreter translated the speech live.","ko":"통역사가 연설을 실시간으로 통역했다."}],"mnemonic":{"soundHint":"인터(사이) + 프리터(전달자)","story":"두 언어 '사이(inter)'에서 뜻을 '풀어(pret)' 전달하는 사람 → 통역사","hintConfidence":2},"pairs":{"buddyWords":[{"w":"translator","ko":"번역가","reason":"동의어 - 언어를 옮기는 사람"},{"w":"language","ko":"언어","reason":"시나리오 - 언어를 통역함"},{"w":"conference","ko":"회의","reason":"시나리오 - 국제 회의에서 통역사가 활동"}],"collocBest":[]},"nuance":{"koSimple":"말을 그때그때 옮겨주는 사람.","whenToUse":"통역 상황·전문가를 가리킬 때."},"krDetail":[{"ko":"말을 옮겨 주는 사람","explain":"'통역사(通譯士)'는 서로 다른 언어를 쓰는 사람들 사이에서 말을 옮겨 주는 전문가를 뜻해요."},{"ko":"뜻을 풀어 주는 사람","explain":"'해석자(解釋者)'는 어려운 글이나 뜻을 알기 쉽게 풀어 설명하는 사람을 말해요."}],"usageExamples":[{"en":"The interpreter translated the speech into Korean.","ko":"통역사는 그 연설을 한국어로 통역했다."},{"en":"She works as a professional interpreter at conferences.","ko":"그녀는 회의에서 전문 통역사로 일한다."}],"grammarNote":"'interpreter'는 말을 옮기는 사람이고, 'translator'는 글을 옮기는 사람이에요. 학생들이 자주 헷갈리는 단어이므로 상황에 맞게 구분해 사용해야 합니다.","grammarQuiz":[{"sentence":"The company hired _____ _____ for the international meeting yesterday.","ko":"회사는 어제 국제 회의를 위해 통역사를 고용했다.","answer":["an","interpreter"],"hint":"부정관사 + 통역사 명사"}]},
    {"id":"w03667","w":"kayak","pos":["n","v"],"ph":"/ˈkaɪæk/","cefr":"B1","kr":["카약","카약을 타다"],"ex":[{"en":"They spent the afternoon kayaking along the peaceful river.","ko":"그들은 오후를 평화로운 강을 따라 카약을 타며 보냈다."}],"mnemonic":{"soundHint":"카약","story":"'카약'을 그대로 외래어로 쓴다 → kayak.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"canoe","ko":"카누","reason":"동의어에 가까운 유사한 배"},{"w":"paddle","ko":"노, 노를 젓다","reason":"카약을 탈 때 쓰는 도구"},{"w":"river","ko":"강","reason":"카약을 타는 장소"}],"collocBest":[{"en":"go kayaking","ko":"카약을 타러 가다"},{"en":"paddle a kayak","ko":"카약을 젓다"}]},"nuance":{"koSimple":"노를 젓는 좁고 긴 배.","whenToUse":"강·바다에서 노 젓는 레저 활동에."},"krDetail":[{"ko":"카약","explain":"좁고 긴 1인용 배"},{"ko":"카약을 타다","explain":"카약으로 물 위를 저어 나아가다"}],"usageExamples":[{"en":"We kayaked along the calm river.","ko":"우리는 조용한 강을 따라 카약을 탔다."},{"en":"He bought a new kayak last summer.","ko":"그는 지난여름 새 카약을 샀다."}],"grammarNote":"kayak은 명사와 동사 모두 되고, 활동으로 말할 때 go kayaking(현재분사) 구조가 자연스럽다. 학생들이 'go to kayak'으로 잘못 쓴다.","grammarQuiz":[{"sentence":"Every summer we _____ kayaking _____ the lake near the mountain.","ko":"매년 여름 우리는 산 근처 호수로 카약을 타러 간다.","answer":["go","on"],"hint":"go -ing + 장소 전치사"},{"sentence":"The kayak _____ he rented yesterday _____ made of light plastic.","ko":"그가 어제 빌린 카약은 가벼운 플라스틱으로 만들어져 있다.","answer":["that","is"],"hint":"관계대명사 목적격 + be동사"}]},
    {"id":"w03706","w":"knot","pos":["n","v"],"ph":"/nɒt/","cefr":"B1","kr":["매듭","묶다"],"ex":[{"en":"He tied a firm knot in the rope.","ko":"그는 로프에 단단한 매듭을 묶었다."}],"mnemonic":{"soundHint":"'낫(not)'처럼 얽힘","story":"not(아니다)처럼 얽히고 꼬여 안 풀리는 것 → 매듭","hintConfidence":1},"pairs":{"buddyWords":[{"w":"tie","ko":"묶다","reason":"동의어"},{"w":"untie","ko":"풀다","reason":"반의어"},{"w":"rope","ko":"밧줄","reason":"매듭이 지어지는 대상"}],"collocBest":[]},"nuance":{"koSimple":"줄을 얽어 만든 매듭.","whenToUse":"밧줄 묶기·긴장으로 배가 뭉칠 때."},"krDetail":[{"ko":"매듭","explain":"실이나 줄을 얽어 꼬아 만든 부분"},{"ko":"묶다","explain":"줄이나 끈으로 얽어 매어 놓다"}],"usageExamples":[{"en":"The sailor tied a strong knot.","ko":"그 선원은 튼튼한 매듭을 묶었다."},{"en":"He knotted the ropes together.","ko":"그는 밧줄들을 서로 묶었다."}],"grammarNote":"knot의 k는 묵음이며 not과 발음이 같다. 학생들이 스펠링을 not으로 잘못 쓰거나 k를 소리내는 실수를 흔히 한다.","grammarQuiz":[{"sentence":"The scout learned _____ tie a knot _____ would not come loose.","ko":"그 스카우트 대원은 풀리지 않을 매듭을 묶는 법을 배웠다.","answer":["to","that"],"hint":"to부정사 + 관계대명사"},{"sentence":"The knot _____ tied around the box _____ too tight to open.","ko":"상자에 묶인 그 매듭은 너무 꽉 조여 있어 풀 수 없었다.","answer":["that","was"],"hint":"관계대명사 + be동사"}]},
    {"id":"w03356","w":"ingredient","pos":["n"],"ph":"/ɪnˈɡriːdiənt/","cefr":"B1","kr":["재료","성분"],"ex":[{"en":"Mix all the ingredients together.","ko":"모든 재료를 함께 섞어라."}],"mnemonic":{"soundHint":"인그리디언트(요리 재료)","story":"요리 방송의 '인그리디언트' 목록에 재료(ingredient) 등장","hintConfidence":2},"pairs":{"buddyWords":[{"w":"recipe","ko":"요리법","reason":"recipe와 ingredient는 요리 시나리오의 필수 짝"},{"w":"component","ko":"구성요소","reason":"동의어로 성분·요소 자리 공유"},{"w":"mix","ko":"섞다","reason":"mix ingredients 시나리오에서 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"음식·물건을 만드는 재료.","whenToUse":"요리·성공의 요소를 말할 때."},"krDetail":[{"ko":"재료","explain":"음식이나 물건을 만들기 위해 쓰이는 낱낱의 기본 물질"},{"ko":"성분","explain":"어떤 것을 이루는 낱낱의 요소로, 그것이 무엇으로 되어 있는지 보여주는 부분"}],"usageExamples":[{"en":"The chef carefully selected fresh ingredients from the local farmers market yesterday.","ko":"그 요리사는 어제 지역 농부 시장에서 신선한 재료들을 조심스럽게 골랐다."},{"en":"Please check the ingredients list carefully if you have any food allergies.","ko":"음식 알레르기가 있다면 성분 목록을 주의 깊게 확인하십시오."}],"grammarNote":"ingredient는 셀 수 있는 명사로 대개 복수형 ingredients로 쓰입니다. 학생들은 단수 관사를 빠뜨리고 'add ingredient'라 쓰지만, 'add an ingredient' 또는 'add the ingredients'가 맞습니다.","grammarQuiz":[{"sentence":"Salt and pepper are the two most basic _____ used in _____ kitchen.","ko":"소금과 후추는 모든 주방에서 사용되는 가장 기본적인 두 가지 재료이다.","answer":["ingredients","every"],"hint":"복수명사+한정사"}]},
    {"id":"w03288","w":"individual","pos":["n","adj"],"ph":"/ˌɪndɪˈvɪdʒuəl/","cefr":"B1","kr":["개인","개별적인"],"ex":[{"en":"Each individual has unique strengths.","ko":"각 개인은 독특한 강점을 가지고 있다."}],"mnemonic":{"soundHint":"인디(indie)+비주얼","story":"각자 '인디(indie)' 비주얼(visual)을 가진 개인(individual)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"collective","ko":"집단적인","reason":"명확한 반의어 관계"},{"w":"person","ko":"사람","reason":"동의어로 개인 지칭에서 짝"},{"w":"rights","ko":"권리","reason":"individual rights 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"집단이 아닌 한 사람.","whenToUse":"개인의 권리·특성·개별 대응을 말할 때."},"krDetail":[{"ko":"개인","explain":"집단이나 사회를 이루는 낱낱의 사람을 하나하나 따로 놓고 이르는 말"},{"ko":"개별적인","explain":"여럿을 하나로 뭉뚱그리지 않고 하나하나 따로 떨어져 각각인"}],"usageExamples":[{"en":"Every individual has the right to express their own thoughts and opinions freely.","ko":"모든 개인은 자신의 생각과 의견을 자유롭게 표현할 권리가 있다."},{"en":"Our school offers individual tutoring sessions to help struggling students succeed.","ko":"우리 학교는 어려움을 겪는 학생들이 성공하도록 개별적인 튜터링 시간을 제공한다."}],"grammarNote":"individual은 명사와 형용사 두 역할을 하는데 학생들은 자주 형용사로만 인식합니다. 명사로 쓸 때는 'each individual', 'private individuals'처럼 사람을 뜻하고, 문맥으로 구별해야 합니다.","grammarQuiz":[{"sentence":"Every _____ in this class has _____ own unique learning style and pace.","ko":"이 반의 모든 개인은 각자 자신만의 독특한 학습 방식과 속도를 가지고 있다.","answer":["individual","their"],"hint":"명사+소유격"}]},
    {"id":"w03372","w":"injure","pos":["v"],"ph":"/ˈɪndʒər/","cefr":"B1","kr":["다치게 하다","부상을 입히다"],"ex":[{"en":"He injured his knee playing soccer.","ko":"그는 축구를 하다 무릎을 다쳤다."}],"mnemonic":{"soundHint":"인(in=not)+저(jure 정당)","story":"in(not)+jure(정당) 규칙 어기며 다치게 하다(injure)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"hurt","ko":"다치게 하다","reason":"동의어로 부상 문맥 공유"},{"w":"heal","ko":"치유하다","reason":"명확한 반의어 관계"},{"w":"seriously","ko":"심각하게","reason":"seriously injure 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"사고로 몸을 다치게 하다.","whenToUse":"운동·사고로 다쳤을 때."},"krDetail":[{"ko":"다치게 하다","explain":"몸이나 마음에 상처를 입혀 아프거나 나쁜 상태가 되게 하다"},{"ko":"부상을 입히다","explain":"다른 사람의 몸에 상처나 손상을 주어 아프게 하다"}],"usageExamples":[{"en":"The careless driver seriously injured a pedestrian while crossing the busy street.","ko":"그 부주의한 운전자는 붐비는 거리를 건너던 보행자를 심각하게 다치게 했다."},{"en":"Athletes must warm up properly to avoid injuring themselves during competitions.","ko":"운동선수들은 경기 중 자신을 다치게 하지 않으려면 제대로 몸을 풀어야 한다."}],"grammarNote":"injure는 타동사로 목적어가 필요하며 수동태 'be injured'가 아주 자주 쓰입니다. 학생들은 'I injured'만 쓰고 끝내기 쉽지만, 'I injured my knee' 또는 'I was injured'처럼 완전한 구조가 필요합니다.","grammarQuiz":[{"sentence":"Many soccer players _____ their knees seriously when they _____ down suddenly.","ko":"많은 축구 선수들은 갑자기 넘어질 때 무릎을 심각하게 다친다.","answer":["injure","fall"],"hint":"동사+동사원형"}]},
    {"id":"w03325","w":"infectious","pos":["adj"],"ph":"/ɪnˈfekʃəs/","cefr":"B1","kr":["전염성의","감염성의"],"ex":[{"en":"Laughter can be infectious.","ko":"웃음은 전염될 수 있다."}],"mnemonic":{"soundHint":"인펙트(infect)+ㅅㅕㅅ","story":"인펙트(infect)의 형용사=전염성의(infectious)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"contagious","ko":"전염성의","reason":"동의어로 의료 문맥의 짝"},{"w":"disease","ko":"질병","reason":"infectious disease 콜로케이션의 짝"},{"w":"smile","ko":"미소","reason":"'infectious smile'(전염성 있는 미소) 비유적 짝"}],"collocBest":[]},"nuance":{"koSimple":"쉽게 남에게 옮는.","whenToUse":"전염병·웃음처럼 퍼지는 것에."},"krDetail":[{"ko":"전염성의","explain":"병이나 감정이 한 사람에게서 다른 사람에게 쉽게 옮겨가는 성질을 가진"},{"ko":"감염성의","explain":"미생물이나 바이러스가 다른 몸으로 옮겨가 병을 일으키는 성질을 가진"}],"usageExamples":[{"en":"The infectious disease spread quickly through the whole village last summer.","ko":"그 전염병은 지난 여름 마을 전체에 빠르게 퍼졌다."},{"en":"Her infectious laughter made everyone at the party feel happy and relaxed.","ko":"그녀의 전염성 있는 웃음소리는 파티에 모인 모두를 행복하고 편안하게 만들었다."}],"grammarNote":"infectious와 contagious는 뜻이 비슷하지만 미묘한 차이가 있습니다. infectious는 병균·바이러스로 옮는 병, contagious는 직접 접촉으로 옮는 병에 주로 씁니다. 학생들은 구별 없이 쓰지만 학술적으로는 다릅니다.","grammarQuiz":[{"sentence":"The child was diagnosed with a highly _____ disease and _____ to stay home.","ko":"그 아이는 매우 전염성이 강한 병으로 진단받아 집에 머물러야 했다.","answer":["infectious","had"],"hint":"형용사+조동사과거"}]},
    {"id":"w03540","w":"investigate","pos":["v"],"ph":"/ɪnˈvestɪɡeɪt/","cefr":"B1","kr":["조사하다","수사하다"],"ex":[{"en":"The police are investigating the crime.","ko":"경찰이 그 범죄를 수사하고 있다."}],"mnemonic":{"soundHint":"인베스티(자취) + 게이트(문)","story":"in(안으로) + vestige(자취)를 따라 게이트(문) 하나하나 열며 조사하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"examine","ko":"조사하다","reason":"동의어 - 자세히 살펴봄"},{"w":"detective","ko":"형사","reason":"시나리오 - 형사가 사건을 수사함"},{"w":"crime","ko":"범죄","reason":"콜로 - investigate a crime"}],"collocBest":[]},"nuance":{"koSimple":"자세히 파고들어 알아보는.","whenToUse":"경찰 수사·과학 조사·원인 규명에."},"krDetail":[{"ko":"자세히 알아보다","explain":"'조사(調査)하다'는 어떤 일에 대해 자세하고 꼼꼼하게 알아보는 것을 뜻해요."},{"ko":"범죄를 파헤치다","explain":"'수사(搜査)하다'는 범죄와 관련된 사실이나 증거를 찾아내는 일을 말해요."}],"usageExamples":[{"en":"The police are investigating the cause of the accident.","ko":"경찰이 사고의 원인을 조사하고 있다."},{"en":"Scientists investigated the strange behavior of the birds.","ko":"과학자들은 그 새들의 이상한 행동을 조사했다."}],"grammarNote":"'investigate'는 타동사로 목적어가 바로 이어져요. 학생들이 'investigate about/into'로 쓰는 실수를 자주 하는데, 대상이 바로 목적어로 오므로 전치사가 필요 없습니다.","grammarQuiz":[{"sentence":"The detective _____ carefully _____ the mysterious case last week.","ko":"그 형사는 지난주에 그 미스터리한 사건을 주의 깊게 조사했다.","answer":["investigated","the"],"hint":"과거시제 타동사 + 정관사"}]},
    {"id":"w03542","w":"investment","pos":["n"],"ph":"/ɪnˈvestmənt/","cefr":"B1","kr":["투자","투자금"],"ex":[{"en":"The company made a large investment in new technology.","ko":"그 회사는 새로운 기술에 큰 투자를 했다."}],"mnemonic":{"soundHint":"invest + ment","story":"invest(투자하다)의 명사형 → 투자, 투자금","hintConfidence":3},"pairs":{"buddyWords":[{"w":"funding","ko":"자금 지원","reason":"동의어 - 투자금"},{"w":"return","ko":"수익","reason":"콜로 - return on investment"},{"w":"invest","ko":"투자하다","reason":"시나리오 - 명사와 동사 관계"}],"collocBest":[]},"nuance":{"koSimple":"미래 위해 붓는 돈·노력.","whenToUse":"주식·부동산·시간 투자 얘기."},"krDetail":[{"ko":"돈이나 시간을 미리 넣는 일","explain":"'투자(投資)'는 이익을 얻기 위해 돈이나 시간을 미리 들이는 행위를 뜻해요."},{"ko":"투자한 돈","explain":"'투자금(投資金)'은 어떤 사업이나 물건에 투자한 돈을 말해요."}],"usageExamples":[{"en":"Buying a house is a long-term investment for many people.","ko":"집을 사는 것은 많은 사람들에게 장기 투자이다."},{"en":"The company made a huge investment in new technology.","ko":"그 회사는 새로운 기술에 큰 투자를 했다."}],"grammarNote":"'make an investment in + 명사'는 '~에 투자하다'라는 표현이에요. 동사 'invest'와 명사 'investment' 모두 전치사 'in'과 함께 쓰이는 점을 기억하세요.","grammarQuiz":[{"sentence":"Education is the best _____ _____ your child's future.","ko":"교육은 자녀의 미래에 대한 최고의 투자이다.","answer":["investment","in"],"hint":"투자 명사 + 대상 전치사"}]},
    {"id":"w03733","w":"landlord","pos":["n"],"ph":"/ˈlændlɔːrd/","cefr":"B1","kr":["집주인","건물주"],"ex":[{"en":"The landlord raised the rent this year.","ko":"집주인이 올해 임대료를 올렸다."}],"mnemonic":{"soundHint":"land(땅) + lord(주인)","story":"land(땅) + lord(주인) → 땅·건물 주인, 집주인","hintConfidence":3},"pairs":{"buddyWords":[{"w":"owner","ko":"주인","reason":"동의어"},{"w":"tenant","ko":"세입자","reason":"반의어"},{"w":"rent","ko":"임대료","reason":"집주인이 받는 것"}],"collocBest":[]},"nuance":{"koSimple":"집을 빌려주는 주인.","whenToUse":"세입자에게 임대료 받는 집·건물 주인에."},"krDetail":[{"ko":"집주인","explain":"집이나 방을 남에게 빌려주는 사람"},{"ko":"건물주","explain":"건물을 소유한 사람"}],"usageExamples":[{"en":"The landlord raised our rent again.","ko":"집주인이 우리 임대료를 또 올렸다."},{"en":"Talk to your landlord about the leak.","ko":"누수에 대해 집주인에게 이야기해라."}],"grammarNote":"landlord는 남녀 구분 없이 쓰지만 여성만 강조할 땐 landlady를 쓰기도 한다. 학생들이 남성에게만 쓴다고 오해하는 경우가 있다.","grammarQuiz":[{"sentence":"The landlord _____ owns this building _____ raised the rent again.","ko":"이 건물을 소유한 집주인이 임대료를 또 올렸다.","answer":["who","has"],"hint":"관계대명사 + 현재완료"},{"sentence":"Every tenant _____ pay rent to the landlord _____ the first day.","ko":"모든 세입자는 매월 첫날 집주인에게 임대료를 지불해야 한다.","answer":["must","on"],"hint":"조동사 + 날짜 전치사"}]},
    {"id":"w03461","w":"interact","pos":["v"],"ph":"/ˌɪntərˈækt/","cefr":"B1","kr":["상호작용하다","교류하다"],"ex":[{"en":"Students interact well with teachers.","ko":"학생들은 교사들과 잘 교류한다."}],"mnemonic":{"soundHint":"인터(사이) + 액트(행동)","story":"'인터(inter=사이)'에서 서로 '액트(act=행동)'를 주고받다 → 상호작용하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"communicate","ko":"소통하다","reason":"동의어 - 서로 교류하다"},{"w":"engage","ko":"관여하다","reason":"동의어 - 참여하며 교류함"},{"w":"isolate","ko":"고립시키다","reason":"반의어 - 교류의 반대"}],"collocBest":[]},"nuance":{"koSimple":"서로 주고받으며 관계 맺다.","whenToUse":"사람·화면과 소통·교류할 때."},"krDetail":[{"ko":"서로 주고받다","explain":"'상호작용(相互作用)하다'는 둘 이상이 서로 영향을 주고받는 것을 뜻해요."},{"ko":"서로 오가다","explain":"'교류(交流)하다'는 서로 만나서 이야기하거나 도움을 주고받는 것을 말해요."}],"usageExamples":[{"en":"Children learn how to interact with others at school.","ko":"아이들은 학교에서 다른 사람들과 상호작용하는 법을 배운다."},{"en":"Cats interact with humans in unique ways.","ko":"고양이는 사람과 독특한 방식으로 교류한다."}],"grammarNote":"'interact'는 자동사이므로 목적어가 바로 오지 않아요. 반드시 'interact with + 사람/사물' 형태로 전치사 'with'를 함께 씁니다.","grammarQuiz":[{"sentence":"Students should learn _____ _____ with people from different cultures.","ko":"학생들은 다른 문화의 사람들과 상호작용하는 법을 배워야 한다.","answer":["to","interact"],"hint":"to부정사 + 자동사"}]},
    {"id":"w03691","w":"kiosk","pos":["n"],"ph":"/ˈkiːɒsk/","cefr":"B1","kr":["키오스크","매점","정보 단말기"],"ex":[{"en":"You can purchase tickets at the self-service kiosk near the entrance.","ko":"입구 근처의 셀프 서비스 키오스크에서 티켓을 구매할 수 있다."}],"mnemonic":{"soundHint":"키오스크","story":"무인 주문기 '키오스크'를 그대로 외래어로 쓴다 → kiosk.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"booth","ko":"부스","reason":"동의어"},{"w":"terminal","ko":"단말기","reason":"정보 단말기 의미의 유의어"},{"w":"touchscreen","ko":"터치스크린","reason":"키오스크의 대표 인터페이스"}],"collocBest":[{"en":"information kiosk","ko":"안내 키오스크"},{"en":"self-service kiosk","ko":"셀프 키오스크"}]},"nuance":{"koSimple":"터치로 주문하는 무인 단말기.","whenToUse":"패스트푸드·역·안내소의 셀프 기계에."},"krDetail":[{"ko":"키오스크","explain":"손님이 직접 눌러 주문하는 기계"},{"ko":"매점","explain":"작은 물건을 파는 작은 가게"},{"ko":"정보 단말기","explain":"화면을 눌러 정보를 얻는 기기"}],"usageExamples":[{"en":"I ordered lunch at the kiosk.","ko":"나는 키오스크에서 점심을 주문했다."},{"en":"The mall installed new information kiosks.","ko":"쇼핑몰이 새 안내 키오스크를 설치했다."}],"grammarNote":"kiosk는 가산명사이며 발음이 /ˈkiːɒsk/로 c가 아닌 k소리라는 점에 주의한다. 학생들이 '키오스크'라는 한글 발음 그대로 c를 넣어 kiocsk로 잘못 쓴다.","grammarQuiz":[{"sentence":"Many restaurants _____ replaced human workers _____ self-service kiosks.","ko":"많은 식당들이 사람 직원을 셀프 키오스크로 대체했다.","answer":["have","with"],"hint":"현재완료 + 대체 전치사"},{"sentence":"The kiosk _____ stands near the entrance _____ used by many tourists.","ko":"입구 근처에 있는 키오스크는 많은 관광객이 이용한다.","answer":["that","is"],"hint":"관계대명사 + 수동태"}]},
    {"id":"w03605","w":"jail","pos":["n","v"],"ph":"/dʒeɪl/","cefr":"B1","kr":["교도소","수감하다"],"ex":[{"en":"He was sent to jail.","ko":"그는 교도소에 보내졌다."}],"mnemonic":{"soundHint":"제일(가장) 가기 싫은 곳","story":"'제일' 가고 싶지 않은 곳 → 교도소","hintConfidence":2},"pairs":{"buddyWords":[{"w":"prison","ko":"감옥","reason":"동의어 - 수감 시설"},{"w":"release","ko":"석방하다","reason":"반의어 - 수감의 반대"},{"w":"criminal","ko":"범죄자","reason":"시나리오 - 범죄자가 교도소에 감"}],"collocBest":[]},"nuance":{"koSimple":"죄인이 갇히는 곳.","whenToUse":"수감·복역 얘기할 때."},"krDetail":[{"ko":"죄지은 사람을 가두는 곳","explain":"'교도소(矯導所)'는 죄를 지은 사람을 가두어 두는 시설을 뜻해요."},{"ko":"감옥에 가두다","explain":"'수감(收監)하다'는 죄지은 사람을 교도소에 가두어 두는 것을 말해요."}],"usageExamples":[{"en":"The thief was sent to jail for five years.","ko":"그 도둑은 5년 동안 교도소에 보내졌다."},{"en":"He was jailed for stealing a car last year.","ko":"그는 작년에 차를 훔친 죄로 수감되었다."}],"grammarNote":"'go to jail'은 관사 없이 사용해요. 'go to the jail'은 방문하러 가는 의미이고, 'go to jail'은 죄를 지어 수감되러 가는 의미로 관사가 없다는 점을 기억하세요.","grammarQuiz":[{"sentence":"If you break the law, you might _____ _____ jail for a long time.","ko":"법을 어기면 오랫동안 교도소에 갈 수도 있다.","answer":["go","to"],"hint":"가다 동사 + 방향 전치사"}]},
    {"id":"w03771","w":"layer","pos":["n","v"],"ph":"/ˈleɪər/","cefr":"B1","kr":["층","겹"],"ex":[{"en":"The cake had three layers of cream.","ko":"케이크에는 세 층의 크림이 있었다."}],"mnemonic":{"soundHint":"레이어(외래어)","story":"포토샵의 '레이어(layer)' → 층, 겹","hintConfidence":3},"pairs":{"buddyWords":[{"w":"stratum","ko":"지층","reason":"동의어"},{"w":"level","ko":"층","reason":"동의어"},{"w":"ozone","ko":"오존","reason":"'ozone layer'로 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"쌓여 있는 얇은 한 겹.","whenToUse":"케이크·옷·오존층 같은 층을 말할 때."},"krDetail":[{"ko":"층","explain":"여러 겹으로 쌓인 하나의 겹"},{"ko":"겹","explain":"포개진 하나의 층"}],"usageExamples":[{"en":"The cake has three chocolate layers.","ko":"그 케이크는 초콜릿 세 층으로 되어 있다."},{"en":"Wear layers of clothes in cold weather.","ko":"추운 날씨엔 옷을 여러 겹 입어라."}],"grammarNote":"layer는 명사로 자주 쓰지만 동사로도 쓰여 '겹겹이 놓다'는 뜻을 갖는다. 학생들이 layer를 명사로만 알고 있는 경우가 많다.","grammarQuiz":[{"sentence":"The ozone layer _____ protects us _____ harmful ultraviolet radiation.","ko":"오존층은 우리를 해로운 자외선으로부터 보호한다.","answer":["that","from"],"hint":"관계대명사 + 보호 전치사"},{"sentence":"The chef _____ layered thin slices of potato _____ top of the cheese.","ko":"요리사는 감자를 얇게 썰어 치즈 위에 겹겹이 쌓았다.","answer":["has","on"],"hint":"현재완료 + 위치 전치사"}]},
    {"id":"w03410","w":"insist","pos":["v"],"ph":"/ɪnˈsɪst/","cefr":"B1","kr":["주장하다","고집하다"],"ex":[{"en":"He insisted on paying the bill.","ko":"그는 계산서를 내겠다고 고집했다."}],"mnemonic":{"soundHint":"인(안에)+시스트(sist 서다)","story":"그 자리에 딱 서서(sist) 주장하다(insist)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"demand","ko":"요구하다","reason":"동의어로 강한 주장 자리 공유"},{"w":"on","ko":"~에 대해","reason":"insist on 콜로케이션의 필수 짝 전치사"},{"w":"strongly","ko":"강하게","reason":"strongly insist 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"물러서지 않고 강하게 우기다.","whenToUse":"자기 뜻을 굽히지 않을 때."},"krDetail":[{"ko":"주장하다","explain":"자기 의견이나 생각이 옳다고 힘 있게 말하며 물러서지 않다"},{"ko":"고집하다","explain":"다른 사람의 말을 듣지 않고 자기 생각이나 방식을 굳게 지키다"}],"usageExamples":[{"en":"The stubborn teenager insisted on wearing his old jacket to the wedding.","ko":"그 고집 센 십대는 결혼식에 자기 낡은 재킷을 입고 가겠다고 고집했다."},{"en":"The witness insisted that she had seen the man near the shop.","ko":"그 목격자는 그 남자를 가게 근처에서 보았다고 주장했다."}],"grammarNote":"insist 뒤에는 'that + 주어 + (should) + 동사원형' 구조가 오는데, 학생들이 'should'를 빼도 동사원형을 씁니다. 'insist on ~ing(~을 고집하다)'도 매우 자주 쓰이는 표현입니다.","grammarQuiz":[{"sentence":"The mother _____ that her son _____ home before ten o'clock every night.","ko":"그 어머니는 아들이 매일 밤 10시 전에 집에 와야 한다고 주장했다.","answer":["insisted","come"],"hint":"과거동사+동사원형"}]},
    {"id":"w03616","w":"jealousy","pos":["n"],"ph":"/ˈdʒeləsi/","cefr":"B1","kr":["질투","시기","부러움"],"ex":[{"en":"His promotion at work sparked jealousy among some of his colleagues.","ko":"그의 직장 내 승진이 몇몇 동료들 사이에서 질투를 불러일으켰다."}],"mnemonic":{"soundHint":"jealous + y","story":"jealous(질투하는)의 명사형 → 질투, 시기","hintConfidence":3},"pairs":{"buddyWords":[{"w":"envy","ko":"부러움","reason":"동의어"},{"w":"admiration","ko":"감탄","reason":"반의어"},{"w":"rivalry","ko":"경쟁 관계","reason":"질투가 자주 동반되는 관계"}],"collocBest":[]},"nuance":{"koSimple":"질투로 뒤엉킨 마음.","whenToUse":"연인·형제·동료 사이의 시기심을 말할 때."},"krDetail":[{"ko":"질투","explain":"남을 부러워하며 미워하는 마음"},{"ko":"시기","explain":"남이 잘되는 것을 싫어하는 마음"},{"ko":"부러움","explain":"남의 것을 갖고 싶어 하는 마음"}],"usageExamples":[{"en":"Jealousy destroyed their long friendship.","ko":"질투가 그들의 오랜 우정을 망쳤다."},{"en":"Her jealousy grew stronger every day.","ko":"그녀의 질투는 매일 강해졌다."}],"grammarNote":"jealousy는 셀 수 없는 명사로 관사 a/an을 붙이지 않으며 복수형도 잘 쓰지 않는다. 학생들이 'a jealousy' 또는 'jealousies'로 잘못 쓰기 쉽다.","grammarQuiz":[{"sentence":"He could not hide _____ jealousy _____ he felt for his rival.","ko":"그는 라이벌에 대해 느낀 질투를 숨길 수 없었다.","answer":["the","that"],"hint":"정관사 + 관계대명사 목적격"},{"sentence":"Jealousy often _____ people to say things _____ they later regret.","ko":"질투는 종종 사람들이 나중에 후회할 말을 하게 만든다.","answer":["causes","that"],"hint":"cause + 목적어 + to부정사, 관계대명사"}]},
    {"id":"w03658","w":"justice","pos":["n"],"ph":"/ˈdʒʌstɪs/","cefr":"B1","kr":["정의","사법"],"ex":[{"en":"Everyone deserves equal justice under law.","ko":"모든 사람은 법 아래 평등한 정의를 받아야 한다."}],"mnemonic":{"soundHint":"just(공정한) + ice","story":"just(공정한)한 얼음(ice)처럼 흔들리지 않는 것 → 정의","hintConfidence":2},"pairs":{"buddyWords":[{"w":"fairness","ko":"공정","reason":"동의어"},{"w":"injustice","ko":"불의","reason":"반의어"},{"w":"court","ko":"법원","reason":"사법 정의가 실현되는 장소"}],"collocBest":[]},"nuance":{"koSimple":"모두에게 공평한 옳은 대우.","whenToUse":"법·사회·인권의 공정함을 말할 때."},"krDetail":[{"ko":"정의","explain":"옳고 공정한 것을 지키는 원칙"},{"ko":"사법","explain":"법에 따라 판결하는 국가 기능"}],"usageExamples":[{"en":"The people demanded justice for the victims.","ko":"사람들은 피해자를 위한 정의를 요구했다."},{"en":"Justice must be applied equally to all.","ko":"정의는 모두에게 똑같이 적용되어야 한다."}],"grammarNote":"justice는 불가산명사로 관사 없이 쓰이고 복수형이 없다. 학생들이 'a justice'나 'justices'로 잘못 쓰는 실수를 자주 한다.","grammarQuiz":[{"sentence":"The activists fought _____ justice _____ they finally won the case.","ko":"그 활동가들은 정의를 위해 싸웠고 마침내 소송에서 이겼다.","answer":["for","until"],"hint":"전치사 + 접속사"},{"sentence":"Justice _____ not always easy _____ achieve in society.","ko":"정의는 사회에서 이루기가 언제나 쉬운 것은 아니다.","answer":["is","to"],"hint":"be동사 + to부정사"}]},
    {"id":"w03313","w":"inexperienced","pos":["adj"],"ph":"/ˌɪnɪkˈspɪəriənst/","cefr":"B1","kr":["경험이 없는","미숙한"],"ex":[{"en":"He was young and inexperienced.","ko":"그는 젊고 경험이 없었다."}],"mnemonic":{"soundHint":"인(in=not)+익스피어리언스(experience)","story":"in(not)+experienced(경험)=경험 없는(inexperienced)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"experienced","ko":"경험 많은","reason":"명확한 반의어 관계"},{"w":"novice","ko":"초보자","reason":"동의어로 신참 시나리오에서 짝"},{"w":"worker","ko":"직원","reason":"inexperienced worker 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"해 본 적이 적어 서툰.","whenToUse":"신입·초보자를 설명할 때."},"krDetail":[{"ko":"경험이 없는","explain":"어떤 일을 실제로 해본 적이 없어 그 일에 대해 잘 모르는 상태인"},{"ko":"미숙한","explain":"일 처리 능력이 아직 익숙하지 않아 서투르고 부족한 상태인"}],"usageExamples":[{"en":"The inexperienced driver made several mistakes during the long highway journey.","ko":"그 경험이 없는 운전자는 긴 고속도로 여행 중 몇 번의 실수를 저질렀다."},{"en":"Even inexperienced cooks can prepare this simple recipe with some practice.","ko":"미숙한 요리사라도 약간의 연습으로 이 간단한 요리법을 만들 수 있다."}],"grammarNote":"inexperienced 뒤에 in 또는 at을 붙여 '어떤 분야에서 경험이 없는'을 나타냅니다. 학생들은 with를 잘못 쓰기 쉬운데, 'inexperienced in teaching' 또는 'inexperienced at driving'이 자연스럽습니다.","grammarQuiz":[{"sentence":"Being _____ in this field, the young worker _____ many questions to seniors.","ko":"이 분야에 경험이 없어서, 그 젊은 직원은 선배들에게 많은 질문을 했다.","answer":["inexperienced","asked"],"hint":"형용사+과거동사"}]},
    {"id":"w03734","w":"landmark","pos":["n"],"ph":"/ˈlændmɑːrk/","cefr":"B1","kr":["랜드마크","획기적인 사건"],"ex":[{"en":"The Eiffel Tower is a famous landmark.","ko":"에펠탑은 유명한 랜드마크이다."}],"mnemonic":{"soundHint":"랜드마크","story":"'랜드마크'를 그대로 외래어로 쓴다 → landmark.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"monument","ko":"기념물","reason":"동의어"},{"w":"milestone","ko":"획기적 사건","reason":"동의어"},{"w":"tourist","ko":"관광객","reason":"랜드마크를 찾는 대표 방문자"}],"collocBest":[{"en":"historic landmark","ko":"역사적인 랜드마크"},{"en":"famous landmark","ko":"유명한 랜드마크"}]},"nuance":{"koSimple":"딱 보면 아는 그 도시의 상징 건물.","whenToUse":"유명 건축물·역사적 큰 사건을 말할 때."},"krDetail":[{"ko":"랜드마크","explain":"그 지역을 대표하는 유명한 건물이나 장소"},{"ko":"획기적인 사건","explain":"새 시대를 여는 큰 사건"}],"usageExamples":[{"en":"The tower is a famous landmark of the city.","ko":"그 탑은 도시의 유명한 랜드마크이다."},{"en":"It was a landmark decision in history.","ko":"그것은 역사에서 획기적인 결정이었다."}],"grammarNote":"landmark는 형용사처럼 명사 앞에서 '획기적인'이란 뜻으로도 쓰인다(a landmark case). 학생들이 늘 '건물'로만 해석하는 실수를 한다.","grammarQuiz":[{"sentence":"The old church _____ stands on the hill _____ a famous landmark.","ko":"언덕 위에 서 있는 그 옛 교회는 유명한 랜드마크이다.","answer":["that","is"],"hint":"관계대명사 + be동사"},{"sentence":"The court's landmark ruling _____ change how people _____ about privacy.","ko":"법원의 획기적인 판결은 사람들이 사생활에 대해 생각하는 방식을 바꿀 것이다.","answer":["will","think"],"hint":"미래 조동사 + 동사원형"}]},
    {"id":"w03373","w":"injury","pos":["n"],"ph":"/ˈɪndʒəri/","cefr":"B1","kr":["부상","상해"],"ex":[{"en":"The injury kept him from playing.","ko":"그 부상으로 인해 그는 경기에 출전하지 못했다."}],"mnemonic":{"soundHint":"인저(injure)+리","story":"injure의 명사형=부상(injury)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"wound","ko":"상처","reason":"동의어로 상해 자리 공유"},{"w":"suffer","ko":"당하다","reason":"suffer an injury 콜로케이션의 짝"},{"w":"serious","ko":"심각한","reason":"serious injury 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"다쳐서 생긴 부상.","whenToUse":"운동·사고 부상 이야기할 때."},"krDetail":[{"ko":"부상","explain":"사고나 다툼 등으로 몸에 생긴 상처나 몸이 다친 상태"},{"ko":"상해","explain":"다른 사람의 잘못이나 사고로 몸에 입게 된 다치거나 아픈 결과"}],"usageExamples":[{"en":"The football player suffered a serious knee injury during last weekend's championship game.","ko":"그 축구 선수는 지난 주말 결승 경기 중에 심각한 무릎 부상을 입었다."},{"en":"Wearing proper safety gear helps prevent workplace injuries in construction sites.","ko":"적절한 안전 장비를 착용하는 것은 공사장에서 상해를 예방하는 데 도움이 된다."}],"grammarNote":"injury는 셀 수 있는 명사(구체적 부상)와 셀 수 없는 명사(부상이라는 개념) 두 가지로 쓰입니다. 'suffer an injury(부상을 입다)'는 관용 표현이며, 학생들은 관사를 빠뜨리기 쉽습니다.","grammarQuiz":[{"sentence":"Wearing a helmet greatly reduces the risk of head _____ when riding _____ bicycle.","ko":"헬멧 착용은 자전거를 탈 때 머리 부상의 위험을 크게 줄여준다.","answer":["injuries","a"],"hint":"복수명사+관사"}]},
    {"id":"w03679","w":"kidney","pos":["n"],"ph":"/ˈkɪdni/","cefr":"B1","kr":["신장","콩팥"],"ex":[{"en":"The kidneys filter blood in the body.","ko":"신장은 체내 혈액을 걸러낸다."}],"mnemonic":{"soundHint":"'키드니(kid둘)'","story":"두(kid+ny) 개가 짝을 이룬 콩팥 → 신장","hintConfidence":1},"pairs":{"buddyWords":[{"w":"organ","ko":"장기","reason":"상위 개념"},{"w":"liver","ko":"간","reason":"함께 언급되는 장기"},{"w":"dialysis","ko":"투석","reason":"신장 질환 시 받는 치료"}],"collocBest":[]},"nuance":{"koSimple":"허리 옆에서 피를 걸러내는 콩 모양 장기.","whenToUse":"의학·건강·장기 이식 이야기에."},"krDetail":[{"ko":"신장","explain":"몸속 노폐물을 걸러내는 장기"},{"ko":"콩팥","explain":"허리 뒤쪽에 있는 두 개의 장기"}],"usageExamples":[{"en":"The doctor examined his kidney carefully.","ko":"의사는 그의 신장을 주의 깊게 검사했다."},{"en":"Drinking water helps your kidneys work.","ko":"물을 마시는 것은 신장이 일하도록 돕는다."}],"grammarNote":"kidney는 가산명사로 사람마다 두 개 있으므로 흔히 복수형 kidneys로 쓴다. 학생들이 '신장'을 하나로 여겨 단수로만 쓰는 경우가 많다.","grammarQuiz":[{"sentence":"Both of his kidneys _____ working properly _____ the successful operation.","ko":"그의 신장 둘 다 성공적인 수술 후에 잘 기능하고 있다.","answer":["are","after"],"hint":"복수 주어 + be동사 + 전치사"},{"sentence":"Kidney disease _____ often caused _____ high blood pressure and diabetes.","ko":"신장 질환은 종종 고혈압과 당뇨에 의해 유발된다.","answer":["is","by"],"hint":"수동태 + 행위자 by"}]},
    {"id":"w03380","w":"innocence","pos":["n"],"ph":"/ˈɪnəsəns/","cefr":"B1","kr":["순수함","무죄"],"ex":[{"en":"The child's innocence was charming.","ko":"그 아이의 순수함은 매력적이었다."}],"mnemonic":{"soundHint":"이(in=not)+노센스(nocent 해로운)","story":"해로움(nocent) 없는(in) 상태=순수함(innocence)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"guilt","ko":"죄책감","reason":"명확한 반의어, 법정 시나리오의 짝"},{"w":"childhood","ko":"어린 시절","reason":"childhood innocence 콜로케이션의 짝"},{"w":"prove","ko":"증명하다","reason":"prove one's innocence 시나리오의 짝"}],"collocBest":[]},"nuance":{"koSimple":"때 묻지 않은 순수함.","whenToUse":"어린이 순수함·법적 무죄 말할 때."},"krDetail":[{"ko":"순수함","explain":"때 묻지 않고 깨끗한 마음이나 꾸밈이 없이 맑고 참된 성질"},{"ko":"무죄","explain":"죄를 짓지 않은 상태 또는 잘못이 없다는 사실"}],"usageExamples":[{"en":"The lawyer worked hard for months to prove his client's complete innocence.","ko":"그 변호사는 의뢰인의 완전한 무죄를 입증하기 위해 몇 달간 열심히 일했다."},{"en":"Adults sometimes miss the beautiful innocence of early childhood friendships.","ko":"어른들은 때때로 어린 시절 우정의 아름다운 순수함을 그리워한다."}],"grammarNote":"innocence는 불가산명사로 복수형이 없습니다. 학생들은 관사에서 실수하기 쉬운데 'prove one's innocence'는 특정 상황이므로 소유격이 필요합니다. 'lose innocence'는 관사 없이도 씁니다.","grammarQuiz":[{"sentence":"The court finally accepted the young man's _____ and set _____ free after ten years.","ko":"법정은 마침내 그 젊은이의 무죄를 받아들여 10년 만에 그를 풀어주었다.","answer":["innocence","him"],"hint":"명사+목적격"}]},
    {"id":"w03536","w":"inventor","pos":["n"],"ph":"/ɪnˈventər/","cefr":"B1","kr":["발명가"],"ex":[{"en":"Thomas Edison was a great inventor.","ko":"토마스 에디슨은 위대한 발명가였다."}],"mnemonic":{"soundHint":"인벤트(발명) + or(사람)","story":"invent(발명하다) + or(~하는 사람) → 발명가","hintConfidence":3},"pairs":{"buddyWords":[{"w":"creator","ko":"창조자","reason":"동의어 - 새것을 만드는 사람"},{"w":"innovator","ko":"혁신가","reason":"동의어 - 혁신을 이룬 사람"},{"w":"invention","ko":"발명","reason":"시나리오 - 발명가가 발명을 함"}],"collocBest":[]},"nuance":{"koSimple":"새로운 걸 만드는 사람.","whenToUse":"발명가·창안자를 가리킬 때."},"krDetail":[{"ko":"새로 만들어낸 사람","explain":"'발명가(發明家)'는 지금까지 없던 새로운 것을 처음으로 만들어낸 사람을 뜻해요."}],"usageExamples":[{"en":"Thomas Edison was a famous American inventor.","ko":"토머스 에디슨은 유명한 미국 발명가였다."},{"en":"The young inventor created a robot that can cook.","ko":"그 젊은 발명가는 요리할 수 있는 로봇을 만들었다."}],"grammarNote":"'inventor'는 사람을 나타내는 명사이므로 부정관사 'a/an'과 함께 자주 쓰여요. 학생들이 'the inventor'와 'an inventor'를 혼동하는 경우가 있는데, 처음 언급할 때는 부정관사를 씁니다.","grammarQuiz":[{"sentence":"He wants _____ become _____ famous inventor when he grows up.","ko":"그는 커서 유명한 발명가가 되고 싶어 한다.","answer":["to","a"],"hint":"to부정사 + 부정관사"}]},
    {"id":"w03614","w":"jaw","pos":["n"],"ph":"/dʒɔː/","cefr":"B1","kr":["턱"],"ex":[{"en":"He broke his jaw in the fall.","ko":"그는 넘어져 턱이 부러졌다."}],"mnemonic":{"soundHint":"'조!' 물어뜯는 소리","story":"상어가 '조!' 하고 물 때 크게 벌어지는 부위 → 턱 (영화 Jaws 상어)","hintConfidence":2},"pairs":{"buddyWords":[{"w":"mandible","ko":"턱뼈","reason":"동의어 - jaw의 해부학 용어"},{"w":"chin","ko":"턱끝","reason":"시나리오 - 턱(jaw)에 붙어있는 턱끝"},{"w":"shark","ko":"상어","reason":"시나리오 - 상어의 강력한 턱"}],"collocBest":[]},"nuance":{"koSimple":"입을 여닫는 위·아래 뼈.","whenToUse":"신체 부위·놀란 표정 얘기할 때."},"krDetail":[{"ko":"입 아래쪽 뼈 부분","explain":"'턱'은 입 아래에 있는 뼈로 이루어진 얼굴의 아래 부분을 뜻해요."}],"usageExamples":[{"en":"He broke his jaw in the football game last week.","ko":"그는 지난주 축구 경기에서 턱이 부러졌다."},{"en":"Her jaw dropped when she saw the surprise gift.","ko":"그녀는 깜짝 선물을 보고 입이 딱 벌어졌다."}],"grammarNote":"'jaw drop'은 '입이 딱 벌어지다'라는 관용 표현이에요. 놀라움을 나타낼 때 자주 쓰이며, 'drop one's jaw'와 같이 소유격을 함께 쓸 수 있습니다.","grammarQuiz":[{"sentence":"His _____ _____ when he heard the amazing news yesterday.","ko":"그는 어제 놀라운 소식을 들었을 때 입이 딱 벌어졌다.","answer":["jaw","dropped"],"hint":"턱 명사 + 떨어지다 과거"}]},
    {"id":"w03541","w":"investigation","pos":["n"],"ph":"/ɪnˌvestɪˈɡeɪʃən/","cefr":"B1","kr":["조사","수사"],"ex":[{"en":"The investigation revealed new evidence.","ko":"조사는 새로운 증거를 드러냈다."}],"mnemonic":{"soundHint":"investigate + ion","story":"investigate(조사하다)의 명사형 → 조사, 수사","hintConfidence":3},"pairs":{"buddyWords":[{"w":"inquiry","ko":"조사","reason":"동의어 - 진상 조사"},{"w":"investigate","ko":"조사하다","reason":"시나리오 - 명사와 동사 관계"},{"w":"police","ko":"경찰","reason":"시나리오 - 경찰 수사"}],"collocBest":[]},"nuance":{"koSimple":"사건 진실을 캐는 조사.","whenToUse":"경찰 수사·연구 조사 얘기할 때."},"krDetail":[{"ko":"자세히 알아보는 일","explain":"'조사(調査)'는 어떤 일이나 문제에 대해 자세히 알아보는 활동을 뜻해요."},{"ko":"범죄를 파헤치는 일","explain":"'수사(搜査)'는 경찰 등이 범죄와 관련된 사실을 알아내려는 활동을 말해요."}],"usageExamples":[{"en":"The investigation of the crime took several months.","ko":"그 범죄의 수사는 몇 달이 걸렸다."},{"en":"The company is under investigation for tax fraud.","ko":"그 회사는 세금 사기로 조사를 받고 있다."}],"grammarNote":"'under investigation'은 '조사 중인'이라는 관용 표현이에요. 학생들이 'in investigation'이나 'on investigation'으로 잘못 쓰는 경우가 있으니 전치사 'under'를 기억하세요.","grammarQuiz":[{"sentence":"The suspect is currently _____ police _____ for robbery.","ko":"그 용의자는 현재 강도 혐의로 경찰 조사를 받고 있다.","answer":["under","investigation"],"hint":"받는 중 전치사 + 조사 명사"}]},
    {"id":"w03389","w":"input","pos":["n","v"],"ph":"/ˈɪnpʊt/","cefr":"B1","kr":["입력","의견"],"ex":[{"en":"Your input is valued here.","ko":"여기서 당신의 의견이 중요하다."}],"mnemonic":{"soundHint":"인풋 아웃풋","story":"IT·게임 용어로 '인풋(input)'과 '아웃풋(output)'은 한국어에도 그대로 쓰인다. 컴퓨터에 데이터를 넣는 것이 input.","hintConfidence":3},"pairs":{"buddyWords":[{"w":"output","ko":"출력","reason":"명확한 반의어, IT 시나리오 필수 짝"},{"w":"user","ko":"사용자","reason":"user input 콜로케이션의 짝"},{"w":"feedback","ko":"의견","reason":"동의어로 의견 제공 자리 공유"}],"collocBest":[{"en":"user input","ko":"사용자 입력"},{"en":"provide input","ko":"의견을 제공하다"}]},"nuance":{"koSimple":"안으로 넣는 정보·의견.","whenToUse":"컴퓨터 입력·의견 제공 말할 때."},"krDetail":[{"ko":"입력","explain":"컴퓨터·기계 등에 정보나 자료를 넣는 일 또는 그렇게 넣은 자료"},{"ko":"의견","explain":"어떤 일에 대해 내놓는 자기의 생각이나 도움이 될 만한 말"}],"usageExamples":[{"en":"The team leader always welcomes creative input from every member during meetings.","ko":"그 팀장은 회의 중 모든 구성원의 창의적인 의견을 언제나 환영한다."},{"en":"The computer needs correct user input to produce the right final results.","ko":"컴퓨터는 정확한 최종 결과를 만들려면 올바른 사용자 입력이 필요하다."}],"grammarNote":"input은 명사와 동사(과거형·과거분사도 input)로 쓰이며 대개 불가산명사입니다. 학생들은 'inputs'로 잘못 복수형을 만들지만, '여러 의견'이라도 대개 'input'으로 표현합니다.","grammarQuiz":[{"sentence":"Your _____ on this project is very important to _____ before we decide.","ko":"우리가 결정하기 전에, 이 프로젝트에 대한 당신의 의견은 우리에게 매우 중요하다.","answer":["input","us"],"hint":"명사+목적격"}]},
    {"id":"w03378","w":"inner","pos":["adj"],"ph":"/ˈɪnər/","cefr":"B1","kr":["내부의","마음속의"],"ex":[{"en":"She found inner peace through meditation.","ko":"그녀는 명상을 통해 내면의 평화를 찾았다."}],"mnemonic":{"soundHint":"이너 웨어(속옷)","story":"'이너 웨어'(inner wear)는 안쪽 옷=속옷, 내부의(inner)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"outer","ko":"외부의","reason":"명확한 반의어 관계"},{"w":"peace","ko":"평화","reason":"inner peace 콜로케이션의 짝"},{"w":"strength","ko":"힘","reason":"inner strength 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"겉이 아닌 안쪽의.","whenToUse":"내면의 평화·마음속 힘 말할 때."},"krDetail":[{"ko":"내부의","explain":"물체나 공간의 겉이 아니라 그 안쪽에 위치하거나 있는"},{"ko":"마음속의","explain":"겉으로 드러나지 않고 사람의 마음 깊은 곳에서 느끼거나 생기는"}],"usageExamples":[{"en":"Yoga and meditation help many people find true inner peace during stressful times.","ko":"요가와 명상은 많은 사람들이 스트레스 많은 시기에 진정한 내면의 평화를 찾도록 돕는다."},{"en":"The inner surface of the box was covered with soft red velvet.","ko":"그 상자의 내부 표면은 부드러운 빨간 벨벳으로 덮여 있었다."}],"grammarNote":"inner는 명사 앞에서만 쓰는 형용사(attributive only)로, be동사 뒤에서 보어로 쓰지 않습니다. 학생들은 'The room is inner'라 하지만 이는 어색하고, 'the inner room'으로 표현합니다.","grammarQuiz":[{"sentence":"She discovered her _____ strength when her family faced very difficult _____.","ko":"그녀는 가족이 매우 어려운 시기에 직면했을 때 자신의 내면의 힘을 발견했다.","answer":["inner","times"],"hint":"형용사+명사"}]},
    {"id":"w03548","w":"invisible","pos":["adj"],"ph":"/ɪnˈvɪzɪbəl/","cefr":"B1","kr":["보이지 않는","눈에 보이지 않는"],"ex":[{"en":"The bacteria are invisible to the naked eye.","ko":"그 박테리아는 육안으로는 보이지 않는다."}],"mnemonic":{"soundHint":"in(부정) + visible(보이는)","story":"in(부정) + visible(보이는) → 보이지 않는","hintConfidence":3},"pairs":{"buddyWords":[{"w":"unseen","ko":"보이지 않는","reason":"동의어 - 눈에 띄지 않는"},{"w":"visible","ko":"보이는","reason":"반의어 - invisible의 반대"},{"w":"hidden","ko":"숨겨진","reason":"동의어 - 보이지 않게 숨은"}],"collocBest":[]},"nuance":{"koSimple":"눈에 안 보이는.","whenToUse":"박테리아·힘처럼 눈에 안 보일 때."},"krDetail":[{"ko":"눈으로 볼 수 없는","explain":"'보이지 않는'은 물건이나 힘이 눈에 나타나지 않아 알아볼 수 없는 상태를 뜻해요."},{"ko":"눈에 띄지 않는","explain":"'눈에 보이지 않는'은 눈으로 확인할 수 없거나 숨어 있는 것을 강조하는 표현이에요."}],"usageExamples":[{"en":"Air is invisible but essential for all living things.","ko":"공기는 보이지 않지만 모든 생물에게 필수적이다."},{"en":"The tiny virus is invisible to the naked eye.","ko":"그 작은 바이러스는 맨눈으로는 보이지 않는다."}],"grammarNote":"'invisible to + 사람/대상'은 '~에게 보이지 않는'이라는 표현이에요. 학생들이 'invisible for'로 잘못 쓰는 경우가 있는데, 시각적 대상 앞에는 반드시 'to'를 씁니다.","grammarQuiz":[{"sentence":"Ultraviolet rays are _____ _____ the human eye but very dangerous.","ko":"자외선은 인간의 눈에는 보이지 않지만 매우 위험하다.","answer":["invisible","to"],"hint":"보이지 않는 형용사 + 대상 전치사"}]},
    {"id":"w03641","w":"joyful","pos":["adj"],"ph":"/ˈdʒɔɪfl/","cefr":"B1","kr":["기쁜","즐거운"],"ex":[{"en":"It was a joyful celebration for all.","ko":"그것은 모두를 위한 기쁜 축하 행사였다."}],"mnemonic":{"soundHint":"joy(기쁨) + ful(가득)","story":"joy(기쁨)이 ful(가득) 찬 → 기쁜, 즐거운","hintConfidence":3},"pairs":{"buddyWords":[{"w":"cheerful","ko":"쾌활한","reason":"동의어"},{"w":"sorrowful","ko":"슬픈","reason":"반의어"},{"w":"celebration","ko":"축하","reason":"기쁜 감정이 어울리는 상황"}],"collocBest":[]},"nuance":{"koSimple":"마음이 활짝 웃는 듯한 기쁨.","whenToUse":"축하·명절·큰 성공의 밝은 기쁨을 표현할 때."},"krDetail":[{"ko":"기쁜","explain":"마음이 매우 즐겁고 흐뭇한"},{"ko":"즐거운","explain":"재미있고 신나는 기분의"}],"usageExamples":[{"en":"The children shared joyful laughter.","ko":"아이들은 즐거운 웃음을 나눴다."},{"en":"It was a joyful reunion after years.","ko":"몇 년 만의 즐거운 재회였다."}],"grammarNote":"joyful은 상황·사물·표정 등 감정을 유발하는 대상에 쓰고, 사람의 감정 자체는 joyful 대신 delighted를 더 자주 쓴다. 학생들이 사람에게만 붙이려 한다.","grammarQuiz":[{"sentence":"Her wedding _____ a joyful occasion _____ everyone will remember.","ko":"그녀의 결혼식은 모두가 기억할 즐거운 행사였다.","answer":["was","that"],"hint":"be동사 과거 + 관계대명사"},{"sentence":"The joyful news _____ shared quickly _____ social media this week.","ko":"그 기쁜 소식은 이번 주 소셜 미디어로 빠르게 공유되었다.","answer":["was","on"],"hint":"수동태 + 전치사"}]},
    {"id":"w03760","w":"launch","pos":["v","n"],"ph":"/lɔːntʃ/","cefr":"B1","kr":["출시하다","발사하다"],"ex":[{"en":"They launched a new product last month.","ko":"그들은 지난달 신제품을 출시했다."}],"mnemonic":{"soundHint":"런치(런칭)","story":"신제품 '런칭(launching)' → 출시하다, 로켓을 발사하다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"release","ko":"출시하다","reason":"동의어"},{"w":"withdraw","ko":"철회하다","reason":"반의어"},{"w":"rocket","ko":"로켓","reason":"발사하는 대표 대상"}],"collocBest":[]},"nuance":{"koSimple":"새로 시작·발사하는.","whenToUse":"신제품 출시·로켓 발사·캠페인 개시에."},"krDetail":[{"ko":"출시하다","explain":"새 제품을 시장에 내놓다"},{"ko":"발사하다","explain":"로켓이나 미사일을 쏘아 올리다"}],"usageExamples":[{"en":"The company launched a new smartphone.","ko":"그 회사는 새 스마트폰을 출시했다."},{"en":"NASA launched the rocket successfully.","ko":"나사는 그 로켓을 성공적으로 발사했다."}],"grammarNote":"launch는 타동사로 목적어를 반드시 취하고, 명사로 쓰일 때 product launch(제품 출시)처럼 앞 명사가 수식한다. 학생들이 자동사처럼 쓰는 실수를 한다.","grammarQuiz":[{"sentence":"The startup _____ launching a new app _____ helps students study math.","ko":"그 스타트업은 학생들이 수학을 공부하는 것을 돕는 새 앱을 출시할 예정이다.","answer":["is","that"],"hint":"진행형 미래 + 관계대명사"},{"sentence":"The satellite _____ launched into orbit _____ scientists from many countries.","ko":"그 인공위성은 여러 나라 과학자들에 의해 궤도로 발사되었다.","answer":["was","by"],"hint":"수동태 + 행위자 by"}]},
    {"id":"w03635","w":"journal","pos":["n"],"ph":"/ˈdʒɜːrnəl/","cefr":"B1","kr":["일기","학술지"],"ex":[{"en":"She keeps a daily journal.","ko":"그녀는 매일 일기를 쓴다."}],"mnemonic":{"soundHint":"저널리즘의 '저널'","story":"저널리즘(journalism)에서 온 말, 매일 기록하는 일기·학술지","hintConfidence":3},"pairs":{"buddyWords":[{"w":"diary","ko":"일기","reason":"동의어"},{"w":"magazine","ko":"잡지","reason":"학술지 의미의 유의어"},{"w":"publish","ko":"출판하다","reason":"학술지와 자주 어울리는 동사"}],"collocBest":[]},"nuance":{"koSimple":"매일 쓰는 일기, 전문가들의 학술지.","whenToUse":"개인 기록장이나 전문 학술 잡지에."},"krDetail":[{"ko":"일기","explain":"매일의 일을 적는 개인 기록"},{"ko":"학술지","explain":"학문 연구 결과를 싣는 잡지"}],"usageExamples":[{"en":"She keeps a journal every night.","ko":"그녀는 매일 밤 일기를 쓴다."},{"en":"The article appeared in a science journal.","ko":"그 논문은 과학 학술지에 실렸다."}],"grammarNote":"journal은 diary(사적 일기)와 academic journal(학술지) 두 뜻이 다르므로 문맥으로 구별한다. 학생들이 무조건 '일기'로만 해석하는 실수를 한다.","grammarQuiz":[{"sentence":"The professor published _____ paper in _____ international journal last month.","ko":"그 교수는 지난달 국제 학술지에 논문을 발표했다.","answer":["a","an"],"hint":"부정관사 두 개, 모음 앞은 an"},{"sentence":"Keeping _____ journal _____ helps students improve their writing skills.","ko":"일기를 쓰는 것은 학생들이 글쓰기 실력을 키우는 데 도움이 된다.","answer":["a","daily"],"hint":"관사 + 형용사"}]},
    {"id":"w03416","w":"inspect","pos":["v"],"ph":"/ɪnˈspekt/","cefr":"B1","kr":["검사하다","조사하다"],"ex":[{"en":"They inspected the building carefully.","ko":"그들은 건물을 주의 깊게 검사했다."}],"mnemonic":{"soundHint":"인(안)+스펙(spec 보다)","story":"안(in)의 스펙(spec)을 자세히 검사하다(inspect)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"examine","ko":"조사하다","reason":"동의어로 검사 자리 공유"},{"w":"closely","ko":"면밀히","reason":"inspect closely 콜로케이션의 짝"},{"w":"vehicle","ko":"차량","reason":"inspect a vehicle 콜로케이션의 짝"}],"collocBest":[]},"nuance":{"koSimple":"꼼꼼히 살펴 검사하다.","whenToUse":"건물·차량 안전 점검 말할 때."},"krDetail":[{"ko":"검사하다","explain":"어떤 것이 문제가 없는지 자세히 살펴보고 잘잘못을 알아보다"},{"ko":"조사하다","explain":"무언가에 대해 자세히 살피고 알아보아 사실이나 상태를 밝혀내다"}],"usageExamples":[{"en":"Health officials thoroughly inspect all restaurants twice each year for cleanliness.","ko":"보건 공무원들은 매년 두 번씩 모든 식당의 청결도를 철저히 검사한다."},{"en":"Before buying a used car, buyers should inspect the engine very carefully.","ko":"중고차를 사기 전에, 구매자들은 엔진을 매우 조심스럽게 검사해야 한다."}],"grammarNote":"inspect는 타동사로 목적어가 필요하며 자동사로는 쓰지 않습니다. 학생들은 'inspect for problems'처럼 for를 쓰지만, 'inspect the car for damage(피해가 있는지 차를 검사하다)'처럼 목적어 다음에 for를 씁니다.","grammarQuiz":[{"sentence":"Safety inspectors carefully _____ every part of the airplane _____ each flight.","ko":"안전 검사관들은 매 비행 전에 비행기의 모든 부분을 조심스럽게 검사한다.","answer":["inspect","before"],"hint":"동사+전치사"}]},
    {"id":"w03476","w":"interfere","pos":["v"],"ph":"/ˌɪntəˈfɪər/","cefr":"B1","kr":["간섭하다","방해하다"],"ex":[{"en":"Don't interfere in their argument.","ko":"그들의 논쟁에 간섭하지 마라."}],"mnemonic":{"soundHint":"인터(사이) + 피어(끼어)","story":"남 일 '사이(inter)'에 '피어(fere)' 끼어들며 간섭·방해하다","hintConfidence":2},"pairs":{"buddyWords":[{"w":"meddle","ko":"참견하다","reason":"동의어 - 남 일에 간섭하다"},{"w":"disturb","ko":"방해하다","reason":"동의어 - 흐름을 방해하다"},{"w":"ignore","ko":"무시하다","reason":"반의어 - 간섭의 반대"}],"collocBest":[]},"nuance":{"koSimple":"남 일에 끼어들어 방해하다.","whenToUse":"불필요한 참견·업무 방해 상황."},"krDetail":[{"ko":"남의 일에 끼어들다","explain":"'간섭(干涉)하다'는 상관없는 일에 나서서 이래라저래라 하는 것을 뜻해요."},{"ko":"일을 못하게 막다","explain":"'방해(妨害)하다'는 어떤 일이 제대로 되지 않도록 가로막는 것을 말해요."}],"usageExamples":[{"en":"Loud noise interferes with my concentration on studying.","ko":"시끄러운 소음은 나의 공부 집중을 방해한다."},{"en":"Please do not interfere in my personal affairs.","ko":"제 개인적인 일에 간섭하지 말아 주세요."}],"grammarNote":"'interfere with + 사물/과정'은 '~을 방해하다', 'interfere in + 일/문제'는 '~에 간섭하다'는 뜻이에요. 두 전치사를 헷갈리지 않도록 문맥을 잘 살펴야 합니다.","grammarQuiz":[{"sentence":"Using a phone at night can _____ _____ your sleep quality.","ko":"밤에 휴대폰을 사용하는 것은 수면의 질을 방해할 수 있다.","answer":["interfere","with"],"hint":"방해 동사 + 사물 전치사"}]},
    {"id":"w03699","w":"kneel","pos":["v"],"ph":"/niːl/","cefr":"B1","kr":["무릎 꿇다"],"ex":[{"en":"He knelt down to pray sincerely.","ko":"그는 진심으로 기도하기 위해 무릎을 꿇었다."}],"mnemonic":{"soundHint":"knee(무릎) + l","story":"knee(무릎)에서 파생된 동사 → 무릎을 꿇다","hintConfidence":3},"pairs":{"buddyWords":[{"w":"bow","ko":"절하다","reason":"동의어"},{"w":"stand","ko":"서다","reason":"반의어"},{"w":"prayer","ko":"기도","reason":"무릎 꿇는 대표 상황"}],"collocBest":[]},"nuance":{"koSimple":"무릎을 바닥에 대고 앉는.","whenToUse":"기도·간청·예의를 표할 때."},"krDetail":[{"ko":"무릎 꿇다","explain":"무릎을 바닥에 대고 앉거나 굽히다"}],"usageExamples":[{"en":"He knelt to tie his shoelaces.","ko":"그는 신발끈을 묶으려고 무릎을 꿇었다."},{"en":"She knelt down beside the child.","ko":"그녀는 아이 옆에 무릎을 꿇었다."}],"grammarNote":"kneel의 과거·과거분사는 knelt(영국식)와 kneeled(미국식) 둘 다 가능하지만 시험에서는 knelt를 표준으로 쓴다. 학생들이 'kneeled'만 답으로 여긴다.","grammarQuiz":[{"sentence":"The old woman _____ down _____ pray in front of the altar.","ko":"그 노부인은 제단 앞에 무릎을 꿇고 기도했다.","answer":["knelt","to"],"hint":"kneel 과거형 + to부정사"},{"sentence":"The soldiers _____ kneeling _____ the ceremony began this morning.","ko":"군인들은 오늘 아침 예식이 시작되었을 때 무릎을 꿇고 있었다.","answer":["were","when"],"hint":"과거진행 + 접속사"}]},
    {"id":"w03244","w":"income","pos":["n"],"ph":"/ˈɪnkʌm/","cefr":"B1","kr":["수입","소득"],"ex":[{"en":"His monthly income is stable.","ko":"그의 월 소득은 안정적이다."}],"mnemonic":{"soundHint":"인(안으로)+컴(come)","story":"안으로(in) 들어오는(come) 돈=수입(income)","hintConfidence":3},"pairs":{"buddyWords":[{"w":"expense","ko":"지출","reason":"income의 명확한 반의어, 가계부 시나리오에서 짝"},{"w":"salary","ko":"급여","reason":"동의어이자 income의 주된 원천"},{"w":"tax","ko":"세금","reason":"income tax 콜로케이션으로 자주 결합"}],"collocBest":[]},"nuance":{"koSimple":"일해서 들어오는 돈.","whenToUse":"월급·연 소득 등 벌이 이야기할 때."},"krDetail":[{"ko":"수입","explain":"일을 하거나 사업을 해서 벌어들이는 돈으로, 정기적으로 들어오는 벌이"},{"ko":"소득","explain":"일정 기간 동안 개인이나 가정이 얻는 모든 돈이나 재산의 총합"}],"usageExamples":[{"en":"Many young people struggle to earn a stable income these days.","ko":"요즘 많은 젊은이들이 안정적인 수입을 얻으려 애쓴다."},{"en":"Her monthly income barely covers the rent and basic groceries.","ko":"그녀의 월 소득은 겨우 집세와 기본 식료품비를 감당한다."}],"grammarNote":"income은 불가산명사(uncountable)로 취급되는 경우가 많아 복수형 incomes는 서로 다른 여러 사람·집단의 수입을 말할 때만 씁니다. 학생들은 'my incomes'처럼 잘못 쓰지만, 개인 한 명의 수입은 항상 'my income'입니다.","grammarQuiz":[{"sentence":"Families with a low _____ often _____ hard to save any money each month.","ko":"낮은 소득의 가정들은 종종 매달 조금이라도 저축하기 힘겨워한다.","answer":["income","find","it"],"hint":"수입+동사+가목적어"}]},
    {"id":"w03573","w":"irregular","pos":["adj"],"ph":"/ɪˈreɡjələr/","cefr":"B1","kr":["불규칙한","비정기적인"],"ex":[{"en":"His sleep schedule is very irregular.","ko":"그의 수면 일정은 매우 불규칙하다."}],"mnemonic":{"soundHint":"ir(부정) + regular(규칙적)","story":"ir(부정) + regular(규칙적) → 불규칙한","hintConfidence":3},"pairs":{"buddyWords":[{"w":"uneven","ko":"고르지 않은","reason":"동의어 - 균일하지 않음"},{"w":"regular","ko":"규칙적인","reason":"반의어 - 불규칙의 반대"},{"w":"heartbeat","ko":"심장 박동","reason":"콜로 - irregular heartbeat"}],"collocBest":[]},"nuance":{"koSimple":"들쭉날쭉·규칙 없는.","whenToUse":"수면·심장 박동·동사 변화 얘기."},"krDetail":[{"ko":"규칙을 벗어난","explain":"'불규칙(不規則)한'은 일정한 규칙이나 순서를 따르지 않는 것을 뜻해요."},{"ko":"정해진 때가 없는","explain":"'비정기(非定期)적인'은 일정한 때나 주기가 없이 이루어지는 것을 말해요."}],"usageExamples":[{"en":"He has an irregular heartbeat and needs to see a doctor.","ko":"그는 불규칙한 심장 박동이 있어서 의사를 만나야 한다."},{"en":"English has many irregular verbs like 'go' and 'take'.","ko":"영어에는 'go'와 'take' 같은 불규칙 동사가 많다."}],"grammarNote":"'irregular'는 형용사로 명사 앞에서 수식해요. 반대말은 'regular(규칙적인)'이며, 접두사 'ir-'가 '아닌'의 의미를 더해준다는 점을 기억하세요.","grammarQuiz":[{"sentence":"Students often _____ trouble with English _____ verbs.","ko":"학생들은 종종 영어의 불규칙 동사 때문에 어려움을 겪는다.","answer":["have","irregular"],"hint":"겪다 동사 + 불규칙한 형용사"}]},
    {"id":"w03423","w":"instant","pos":["adj","n"],"ph":"/ˈɪnstənt/","cefr":"B1","kr":["즉각적인","순간"],"ex":[{"en":"She gave an instant reply.","ko":"그녀는 즉각적인 답변을 주었다."}],"mnemonic":{"soundHint":"인스턴트","story":"'인스턴트' 커피 = 즉각적으로 되는 것","hintConfidence":3},"pairs":{"buddyWords":[{"w":"immediate","ko":"즉각적인","reason":"동의어 - 즉시 일어나는"},{"w":"delayed","ko":"지연된","reason":"반의어 - 즉각의 반대"},{"w":"moment","ko":"순간","reason":"동의어 - instant의 명사 의미"}],"collocBest":[{"en":"in an instant","ko":"순간적으로"},{"en":"instant coffee","ko":"인스턴트 커피"}]},"nuance":{"koSimple":"눈 깜짝할 사이·즉각.","whenToUse":"바로 되는 반응·인스턴트 제품을 말할 때."},"krDetail":[{"ko":"바로 그 자리에서 일어나는","explain":"'즉각적(卽刻的)인'은 시간이 조금도 걸리지 않고 바로 이루어지는 것을 뜻해요."},{"ko":"아주 짧은 때","explain":"'순간(瞬間)'은 눈 깜빡할 사이의 아주 짧은 시간을 말해요."}],"usageExamples":[{"en":"The medicine gave him instant relief from pain.","ko":"그 약은 그에게 즉각적인 통증 완화를 주었다."},{"en":"In an instant, the sky turned dark.","ko":"순식간에 하늘이 어두워졌다."}],"grammarNote":"'instant'는 형용사로 명사 앞에 오는 한정 용법에서 주로 쓰여요. 'in an instant'는 '순식간에'라는 관용구로 반드시 관사 'an'과 함께 씁니다.","grammarQuiz":[{"sentence":"The runner disappeared _____ _____ instant after the race began.","ko":"그 주자는 경주가 시작된 후 순식간에 사라졌다.","answer":["in","an"],"hint":"관용구용 전치사 + 부정관사"}]},

    {"id":"w03718","w":"lack","pos":["v","n"],"ph":"/læk/","cefr":"B1","kr":["부족하다","결핍"],"ex":[{"en":"She lacks confidence in herself sometimes.","ko":"그녀는 때때로 자신감이 부족하다."}],"mnemonic":{"soundHint":"'락(rock 락!)'이 없다","story":"락(rock) 콘서트에 관객이 '락!' 없이 텅 빔 → 부족, 결핍","hintConfidence":1},"pairs":{"buddyWords":[{"w":"shortage","ko":"부족","reason":"동의어"},{"w":"abundance","ko":"풍부함","reason":"반의어"},{"w":"confidence","ko":"자신감","reason":"lack과 자주 어울리는 명사"}],"collocBest":[]},"nuance":{"koSimple":"꼭 있어야 할 게 없는.","whenToUse":"자신감·돈·경험이 부족하다 말할 때."},"krDetail":[{"ko":"부족하다","explain":"필요한 만큼 있지 않다"},{"ko":"결핍","explain":"있어야 할 것이 모자란 상태"}],"usageExamples":[{"en":"Many children lack proper nutrition.","ko":"많은 아이들이 적절한 영양이 부족하다."},{"en":"There is a lack of clean water here.","ko":"여기는 깨끗한 물이 부족하다."}],"grammarNote":"lack이 동사일 때 전치사 없이 바로 목적어를 취하지만(lack money), 명사일 때는 lack of + 명사를 쓴다. 학생들이 'lack of money'를 동사로 쓴다.","grammarQuiz":[{"sentence":"The company _____ enough workers _____ finish the huge project on time.","ko":"그 회사는 그 큰 프로젝트를 제때에 끝낼 만큼 충분한 노동자가 부족하다.","answer":["lacks","to"],"hint":"3인칭 단수 동사 + to부정사"},{"sentence":"A lack _____ sleep can affect students' _____ concentrate at school.","ko":"잠이 부족하면 학생들의 학교에서의 집중력에 영향을 줄 수 있다.","answer":["of","ability"],"hint":"lack of + 명사, ability to"}]},

/* ---------- WORD STATS HELPERS ---------- */
function getWordStat(id){
  return state.wordStats[id] || { box:1, correctStreak:0, lastSeen:null };
}
function setWordStat(id, patch){
  state.wordStats[id] = { ...getWordStat(id), ...patch, lastSeen: Date.now() };
  lsSet(KEY+":words", state.wordStats);
}
function promoteBox(id){
  const s = getWordStat(id);
  const nb = Math.min(s.box+1, DATA.reviewPolicy.leitnerBoxes);
  setWordStat(id, { box:nb, correctStreak: s.correctStreak+1 });
}
function demoteBox(id){
  const s = getWordStat(id);
  setWordStat(id, { box:1, correctStreak:0 });
}

/* ============================================================
   AUDIO (Web Audio API 합성, 즉석 톤 생성)
   ============================================================ */
let ac = null;
function getAC(){
  if(!ac){
    try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ ac = null; }
  }
  // resume on user gesture
  if(ac && ac.state === "suspended"){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function tone({type="sine", freq=440, dur=.15, vol=.18, atk=.005, dec=.05, slide=null, t0=0}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slide){ o.frequency.exponentialRampToValueAtTime(Math.max(slide,1), t+dur); }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02);
}
function noise({dur=.04, vol=.12, t0=0, hp=null}){
  const a = getAC(); if(!a || !state.sfxOn) return;
  const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * (1-i/data.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  let node = src;
  if(hp){
    const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    node.connect(f); f.connect(g);
  } else {
    node.connect(g);
  }
  g.connect(a.destination);
  src.start(t); src.stop(t+dur);
}

    const chords = [
      { t:0.00, notes:[261.63, 329.63, 392.00] },   // C major (C4 E4 G4)
      { t:0.16, notes:[349.23, 440.00, 523.25] },   // F major (F4 A4 C5)
      { t:0.32, notes:[392.00, 493.88, 587.33] },   // G major (G4 B4 D5)
      { t:0.48, notes:[523.25, 659.25, 783.99] }    // C major 옥타브 (C5 E5 G5) — 절정
    ];
    chords.forEach(ch => {
      ch.notes.forEach(f => {

      });

    // 2) 크리스탈 아르페지오 8음 (도미솔도 두 옥타브)
    const arp = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00, 2637.02];
    arp.forEach((f,i) => {
      tone({ type:"sine",     freq:f, dur:.15, vol:.20, atk:.003, t0:.75 + i*.055 });
      tone({ type:"triangle", freq:f*2, dur:.10, vol:.08, t0:.75 + i*.055 });
    });

    // 3) 절정 종소리 (E7 · G7 벨)
    tone({ type:"triangle", freq:2637.02, dur:.65, vol:.20, t0:1.22 });
    tone({ type:"sine",     freq:3135.96, dur:.45, vol:.14, t0:1.30 });
    tone({ type:"triangle", freq:2093.00, dur:.55, vol:.16, t0:1.40 });

    // 4) 코인·불꽃 노이즈 (환호 느낌)
    for(let i=0;i<18;i++){
      tone({ type:"square", freq:1900+Math.random()*900, dur:.035, vol:.06, t0:1.25 + i*.038 });
    }
    noise({ dur:.15, vol:.14, hp:800, t0:1.20 });
  }
};

/* ============================================================
   PARTICLES (Canvas)
   ============================================================ */
const fx = {
  canvas:null, ctx:null, parts:[], running:false,
  init(){
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    this.resize();
    window.addEventListener("resize", ()=>this.resize());
  },
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = window.innerWidth*dpr;
    this.canvas.height = window.innerHeight*dpr;
    this.canvas.style.width = window.innerWidth+"px";
    this.canvas.style.height = window.innerHeight+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
  },
  spawn(kind, opts={}){
    const W = window.innerWidth, H = window.innerHeight;
    const cx = opts.cx ?? W/2, cy = opts.cy ?? H/2;
    if(kind === "sparkle-small"){
      for(let i=0;i<16;i++){
        this.parts.push({
          x:cx, y:cy, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6-1,
          g:.04, life:60, age:0, size:3+Math.random()*2,
          color: ["#fbbf24","#10b981","#22d3ee"][i%3], shape:"star"
        });
      }
    } else if(kind === "reel-spin-small"){
      for(let i=0;i<28;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*40, y:cy+(Math.random()-.5)*30,
          vx:(Math.random()-.5)*9, vy:-3-Math.random()*4,
          g:.18, life:80, age:0, size:6,
          color: ["#fbbf24","#fde68a","#fde047"][i%3], shape:"coin"
        });
      }
    } else if(kind === "jackpot-flash" || kind === "jackpot-full"){
      const n = kind === "jackpot-full" ? 90 : 60;
      for(let i=0;i<n;i++){
        this.parts.push({
          x:cx+(Math.random()-.5)*60, y:H+20+Math.random()*40,
          vx:(Math.random()-.5)*5, vy:-9-Math.random()*8,
          g:.28, life:110, age:0, size:6+Math.random()*4,
          color: ["#fbbf24","#fde68a","#10b981","#f59e0b","#22d3ee"][i%5], shape:"coin"
        });
      }
    } else if(kind === "rainbow-burst"){
      const colors = ["#f43f5e","#fbbf24","#10b981","#22d3ee","#a78bfa","#fde047","#fb7185"];
      for(let i=0;i<80;i++){
        const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*8;
        this.parts.push({
          x:cx, y:cy, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-2,
          g:.18, life:100, age:0, size:5+Math.random()*4,
          color: colors[i%colors.length], shape:"circle"
        });
      }
      const ov = document.createElement("div");
      ov.className = "rainbow-overlay";
      document.body.appendChild(ov);
      setTimeout(()=>ov.remove(), 1500);
    } else if(kind === "fireworks-grand"){
      for(let b=0;b<3;b++){
        setTimeout(()=>{
          const x = W*(.2+Math.random()*.6), y = H*(.2+Math.random()*.3);
          const colors = ["#fbbf24","#10b981","#22d3ee","#f43f5e"];
          for(let i=0;i<40;i++){
            const ang = Math.random()*Math.PI*2, sp = 3+Math.random()*5;
            this.parts.push({
              x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
              g:.10, life:80, age:0, size:4+Math.random()*3,
              color: colors[i%colors.length], shape:"circle"
            });
          }
          SFX.fireworks();
        }, b*450);
      }
    }
    if(!this.running) this.loop();
  },
  loop(){
    this.running = true;
    const tick = ()=>{
      const W = window.innerWidth, H = window.innerHeight;
      this.ctx.clearRect(0,0,W,H);
      this.parts = this.parts.filter(p => p.age < p.life);
      for(const p of this.parts){
        p.vy += p.g;
        p.x += p.vx; p.y += p.vy;
        p.age++;
        const alpha = Math.max(0, 1 - p.age/p.life);
        this.ctx.globalAlpha = alpha;
        this.ctx.fillStyle = p.color;
        if(p.shape === "coin"){
          this.ctx.beginPath();
          this.ctx.ellipse(p.x, p.y, p.size, p.size*0.6, p.age*.2, 0, Math.PI*2);
          this.ctx.fill();
          this.ctx.strokeStyle = "rgba(255,255,255,.5)";
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        } else if(p.shape === "star"){
          drawStar(this.ctx, p.x, p.y, 5, p.size*1.5, p.size*.7);
          this.ctx.fill();
        } else {
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          this.ctx.fill();
        }
      }
      this.ctx.globalAlpha = 1;
      if(this.parts.length > 0) requestAnimationFrame(tick);
      else this.running = false;
    };
    requestAnimationFrame(tick);
  }
};
function drawStar(ctx, cx, cy, spikes, outer, inner){
  ctx.beginPath();
  let rot = Math.PI/2*3, x=cx, y=cy, step = Math.PI/spikes;
  ctx.moveTo(cx, cy-outer);
  for(let i=0;i<spikes;i++){
    x = cx+Math.cos(rot)*outer; y = cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot += step;
    x = cx+Math.cos(rot)*inner; y = cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outer);
  ctx.closePath();
}

/* ============================================================
   TIMER
   ============================================================ */
function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}
function startTimer(){
  if(state.tickHandle) clearInterval(state.tickHandle);
  state.tickHandle = setInterval(()=>{
    if(state.phase === "result"){ clearInterval(state.tickHandle); return; }
    const el = Date.now() - state.startTime + (state.sessionElapsedBase || 0);
    document.getElementById("timerVal").textContent = fmtTime(el);
  }, 1000);
}

/* ============================================================
   TTS — 여자 목소리 + 기존 대비 1.5배 느리게
   ============================================================ */
function pickFemaleVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(!voices || !voices.length) return null;
  const en = voices.filter(v => /^en/i.test(v.lang));
  // 이름 기반 여성 보이스 매칭 (플랫폼별 표준 이름)
  const femaleRe = /female|woman|zira|samantha|karen|susan|victoria|allison|kate|serena|tessa|moira|fiona|jenny|aria|nova|sara|linda|amy|libby|monica|paulina|catherine|nancy|natasha/i;
  return en.find(v => femaleRe.test(v.name))
      || voices.find(v => femaleRe.test(v.name))
      || en[0]
      || voices[0]
      || null;
}
// 최초 로드 시 voices 캐시 (브라우저에 따라 비동기 로드)
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}
function speak(word){
  try{
    if("speechSynthesis" in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = "en-US";
      u.rate = 0.6;   // 기존 .9 → 1.5배 느리게
      u.pitch = 1.0;
      const v = pickFemaleVoice();
      if(v) u.voice = v;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function flipCard(){

  if(!card) return;
  state.flipped = !state.flipped;
  card.classList.toggle("flipped", state.flipped);
  SFX.cardFlip();
  if(state.flipped){
    const w = state.cards[state.cardIdx];
    speak(w.w);
  }
}

    SFX.cardFlip();
    renderHome();
    return;
  }
  if(dir === "prev"){
    if(state.cardIdx > 0){
      state.cardIdx--;
      SFX.cardFlip();
      renderCard();
    }
    return;
  }
  // next
  if(state.cardIdx >= state.cards.length - 1){
    // 마지막 카드에서 Next → 미니퀴즈 진입
    state.cardIdx = state.cards.length;
    startQuiz();
    return;
  }
  state.cardIdx++;
  SFX.cardFlip();
  renderCard();
}

const QUIZ_MODES = ["meaning-mcq","word-mcq","spelling","listening"];

function buildQuizPool(){
  if(DATA.reviewTest && Array.isArray(DATA.basicPool)) return shuffle([...DATA.basicPool]);
  const pool = [];
  const words = [...DATA.newWords];
  const shuffled = shuffle(words).slice(0, 15);
  const modeOrder = [
    ...Array(5).fill("meaning-mcq"),
    ...Array(5).fill("word-mcq"),
    ...Array(3).fill("spelling"),
    ...Array(2).fill("listening")
  ];
  shuffle(modeOrder);
  shuffled.forEach((w,i)=>{ pool.push({ word:w, mode: modeOrder[i] }); });
  return pool;
}

/* ============================================================
   ADVANCED (심화단계)
   ── 콜로케이션 영작 · 예문 빈칸 채우기
   ============================================================ */
function normalizeAnswer(s){
  return String(s||"")
    .toLowerCase()
    .replace(/[.,!?;:"'`~]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// 예문 en 을 알파벳 단어 + 사이 세그먼트로 파싱
function parseSentence(s){
  const tokens = [];
  const re = /([A-Za-z']+)|([^A-Za-z']+)/g;
  let m;
  while((m = re.exec(s)) !== null){
    if(m[1]) tokens.push({ word:true, text:m[1] });
    else     tokens.push({ word:false, text:m[2] });
  }
  return tokens;
}
// 빈칸 두 개 후보 인덱스 뽑기 — [원단어 위치, 그 외 알파벳4자+ 중 랜덤]
function pickBlanks(tokens, mainWord){
  const wordIdxs = tokens.map((t,i)=>t.word ? i : -1).filter(i=>i>=0);
  const mw = normalizeAnswer(mainWord);
  const stop = new Set(["the","a","an","of","is","are","was","were","be","been","being","to","and","or","in","on","at","for","with","by","from","as","it","its","this","that","these","those","he","she","they","we","you","i","him","her","them","us","my","your","his","their","our","not","no","so","if","but"]);
  const mainIdx = wordIdxs.find(i => normalizeAnswer(tokens[i].text) === mw);
  const others = wordIdxs.filter(i => i !== mainIdx);
  const strong = others.filter(i => tokens[i].text.length >= 4 && !stop.has(tokens[i].text.toLowerCase()));
  const medium = others.filter(i => tokens[i].text.length >= 3 && !stop.has(tokens[i].text.toLowerCase()));
  const anyOne = others;
  shuffle(strong); shuffle(medium); shuffle(anyOne);
  const picks = [];
  if(mainIdx !== undefined) picks.push(mainIdx);
  const secondPool = strong.length ? strong : medium.length ? medium : anyOne;
  if(secondPool.length){
    const sec = secondPool.find(i => i !== picks[0]);
    if(sec !== undefined) picks.push(sec);
  }
  // main 없을 때 두 개 이상 뽑기
  if(picks.length < 2){
    const extra = anyOne.find(i => !picks.includes(i));
    if(extra !== undefined) picks.push(extra);
  }
  return picks.slice(0,2).sort((a,b)=>a-b);
}

function pickDistractors(word, field, n){
  const pool = DATA.newWords.filter(w=>w.id !== word.id);
  shuffle(pool);
  const seen = new Set();
  const out = [];
  for(const w of pool){
    let v;
    if(field === "kr") v = w.kr[0];
    else if(field === "w") v = w.w;
    if(!v || seen.has(v)) continue;
    seen.add(v);
    out.push(v);
    if(out.length >= n) break;
  }
  return out;
}

function handleChoice(btn){
  if(state.quizAnswered) return;
  state.quizAnswered = true;
  const { word, mode } = state.quizCurrent;
  const picked = btn.dataset.v;
  const correct = (mode === "meaning-mcq") ? word.kr[0] : word.w;
  const isCorrect = picked === correct;

  document.querySelectorAll(".choice").forEach(c=>{
    if(c.dataset.v === correct) c.classList.add("correct");
    else if(c === btn && !isCorrect) c.classList.add("wrong");
    else c.classList.add("dimmed");
  });

  finishQuestion(isCorrect);
}

function handleSubmit(){
  if(state.quizAnswered) return;
  const { word, mode } = state.quizCurrent;

  // ── 심화: 예문 빈칸 · 문법 빈칸 ────────────────────────
  if(mode === "cloze" || mode === "grammar-fill"){
    const containers = Array.from(document.querySelectorAll(".cloze-wa"));
    if(containers.some(anyWordEmpty)) return;
    state.quizAnswered = true;
    let allOk = true;
    containers.forEach(function(c){
      const guess = normalizeAnswer(collectWordAnswer(c));
      const ans = normalizeAnswer(c.dataset.answer);
      const okAll = guess === ans;
      const perGroup = Array.from(c.querySelectorAll('.word-group')).map(function(g, i){
        const w = (c.dataset.answer || '').split(/\s+/)[i] || '';
        const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
        return normalizeAnswer(combined) === normalizeAnswer(w);
      });
      markWordAnswer(c, perGroup);
      if(!okAll) allOk = false;
    });
    document.getElementById("submitBtn").disabled = true;
    if(!allOk){
      const answers = containers.map(function(c){ return `<b style="color:var(--grade)">${escape(c.dataset.answer)}</b>`; }).join(" , ");
      document.getElementById("feedback").innerHTML = `정답: ${answers}`;
    }
    finishQuestion(allOk);
    return;
  }

  // ── 기본/심화 단일 컨테이너: spelling / listening / colloc-write
  const container = document.getElementById("wordAnswer");
  if(!container) return;
  if(anyWordEmpty(container)) return;
  state.quizAnswered = true;
  const correctAns = container.dataset.answer;
  const guess = normalizeAnswer(collectWordAnswer(container));
  const isCorrect = guess === normalizeAnswer(correctAns);
  const perGroup = Array.from(container.querySelectorAll('.word-group')).map(function(g, i){
    const w = (correctAns || '').split(/\s+/)[i] || '';
    const combined = (g.dataset.first || '') + (g.querySelector('.rest-input') ? g.querySelector('.rest-input').value : '');
    return normalizeAnswer(combined) === normalizeAnswer(w);
  });
  markWordAnswer(container, perGroup);
  document.getElementById("submitBtn").disabled = true;
  if(!isCorrect){
    document.getElementById("feedback").innerHTML = `정답: <b style="color:var(--grade)">${escape(correctAns)}</b>`;
  }
  finishQuestion(isCorrect);
}

function finishQuestion(isCorrect){
  const { word } = state.quizCurrent;
  const fb = document.getElementById("feedback");
  if(isCorrect){
    state.quizCorrect++;
    state.streak++;
    state.xp += DATA.xpTable.correct;
    promoteBox(word.id);
    SFX.correct();
    fb.classList.add("ok");
    fb.textContent = "정답! +" + DATA.xpTable.correct + " XP " + (state.cbMode ? "✓" : "");
    document.querySelector(".quiz-card").classList.add("bounce-correct");
    handleStreak();
  } else {
    state.streak = 0;
    demoteBox(word.id);
    state.quizWrongIds.add(word.id);
    state.quizWrongItems.push(state.quizCurrent);
    SFX.wrong();
    fb.classList.add("bad");
    if(!fb.textContent) fb.textContent = "오답! " + (state.cbMode ? "✕ " : "") + " 정답: " + word.w;
    document.querySelector(".quiz-card").classList.add("shake");
  }
  state.maxStreak = Math.max(state.maxStreak, state.streak);
  state.perChapterMaxStreak = Math.max(state.perChapterMaxStreak, state.streak);
  renderHeader();

  setTimeout(()=>{
    state.quizIdx++;
    renderQuiz();
  }, isCorrect ? 900 : 1500);
}

/* ============================================================
   RESULT
   ============================================================ */
function finishSession(){
  state.phase = "result";
  if(state.tickHandle) clearInterval(state.tickHandle);
  const total = state.quizPool.length;
  const correct = state.quizCorrect;
  const pct = Math.round(correct / total * 100);
  const isPerfect = correct === total;
  const elapsed = Date.now() - state.startTime + (state.sessionElapsedBase || 0);

  const isAdv = state.quizType === "advanced";
  const clearFlag = isAdv ? "advancedCleared" : "chapterCleared";
  const clearKey  = isAdv ? (KEY+":cleared_adv") : (KEY+":cleared");
  const resultKey = isAdv ? (KEY+":lastResult_adv") : (KEY+":lastResult");

  // chapter clear?
  let bonusXP = 0;
  const newCleared = !state[clearFlag];
  if(newCleared){
    bonusXP += DATA.xpTable.firstClear;
    state[clearFlag] = true;
    lsSet(clearKey, true);
  }
  // 기본단계 90%+ 달성 → 심화 잠금 해제 (한 번 해금되면 유지)
  let newUnlock = false;
  if(!isAdv && pct >= 90 && !state.basicThresholdPassed){
    state.basicThresholdPassed = true;
    lsSet(KEY+":basic_90pct", true);
    newUnlock = true;
  }
  if(isPerfect){
    bonusXP += DATA.xpTable.perfectChapter;
    state.perfectFlag = true;
  }
  state.xp += bonusXP;
  state.xpTotal += state.xp;
  state.globalMaxStreak = Math.max(state.globalMaxStreak, state.maxStreak);
  lsSet(XP_GLOBAL_KEY, state.xpTotal);
  lsSet(MAXSTREAK_KEY, state.globalMaxStreak);
  lsSet(resultKey, { date:Date.now(), correct, total, xp:state.xp, elapsed });

  // badges
  const earnedBadges = [];
  if(newCleared) earnedBadges.push(DATA.badges.find(b=>b.id==="first-step"));
  if(state.maxStreak >= 10) earnedBadges.push(DATA.badges.find(b=>b.id==="streak-10"));
  if(isPerfect) earnedBadges.push(DATA.badges.find(b=>b.id==="perfect"));

  renderHeader();

  const main = document.getElementById("main");
  const stageLbl = isAdv ? "심화단계" : "기본단계";
  const passedM3 = (pct >= 60) && (DATA.grade === '중3');
  const isHighGrade = ['고1','고2','수능'].includes(DATA.grade);
  const highGradePerfect = isHighGrade && isAdv && isPerfect;
  const highGradeMsg = highGradePerfect ? pickHGMessage() : null;
  const title = highGradeMsg
    ? `🏆 ${escape(highGradeMsg)}`
    : passedM3

         <div class="grand-line">🎆 당신이 <b>배곧 쵝오</b>! 🎆</div>

    ? `<button class="start-btn" id="retryBtn">🔁 심화 다시</button>
